<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Glaucoma agudo de ángulo cerrado"><title>Glaucoma agudo de ángulo cerrado</title><rect x="0.75" y="0.75" width="998.5" height="558.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16" y="16" width="968" height="56" rx="10" fill="#0f766e"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170" y1="34.0" x2="170" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="595"><tspan x="184.0" dy="0">OFTALMOLOGÍA Y ORL ENAM: GLAUCOMA AGUDO DE ÁNGULO CERRADO</tspan></text><rect x="799.4" y="32.0" width="164.6" height="24" rx="12" fill="#134e4a"/><text x="881.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="149"><tspan x="881.7" dy="0">OFTALMOLOGÍA Y ORL</tspan></text><rect x="190.0" y="90.0" width="620" height="67.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="500.0" y="118.5" font-size="14.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Mujer de 65 años hipermétrope con dolor ocular al anochecer</tspan></text><text x="500.0" y="141.0" font-size="12" font-weight="400" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Halos, náuseas, córnea turbia, midriasis media arreactiva</tspan></text><line x1="500.0" y1="157.0" x2="500.0" y2="230.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,229.0 505.0,229.0 500.0,237.0" fill="#0f766e"/><rect x="330.0" y="237.0" width="340" height="118.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="264.5" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="500.0" dy="0">GLAUCOMA AGUDO DE ÁNGULO</tspan><tspan x="500.0" dy="18.0">CERRADO</tspan></text><text x="500.0" y="305.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="500.0" dy="0">Urgencia oftalmológica</tspan><tspan x="500.0" dy="17">Presión intraocular muy elevada</tspan><tspan x="500.0" dy="17">por cierre del ángulo</tspan></text><line x1="310.0" y1="235.0" x2="330.0" y2="235.0" stroke="#0ea5e9" stroke-width="2"/><circle cx="330.0" cy="235.0" r="4" fill="#0ea5e9"/><rect x="40.0" y="185.0" width="270" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="186.0" width="6" height="98.0" rx="3" fill="#0ea5e9"/><text x="184.0" y="212.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="224"><tspan x="184.0" dy="0">Clínica</tspan></text><text x="184.0" y="235.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="224"><tspan x="184.0" dy="0">Ojo rojo doloroso</tspan><tspan x="184.0" dy="17">Halos, visión borrosa</tspan><tspan x="184.0" dy="17">Náuseas y vómitos</tspan></text><line x1="690.0" y1="235.0" x2="670.0" y2="235.0" stroke="#8b5cf6" stroke-width="2"/><circle cx="670.0" cy="235.0" r="4" fill="#8b5cf6"/><rect x="690.0" y="185.0" width="270" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="691.0" y="186.0" width="6" height="98.0" rx="3" fill="#8b5cf6"/><text x="834.0" y="212.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="224"><tspan x="834.0" dy="0">Factores</tspan></text><text x="834.0" y="235.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="224"><tspan x="834.0" dy="0">Hipermetropía</tspan><tspan x="834.0" dy="17">Penumbra, midriáticos</tspan><tspan x="834.0" dy="17">Edad avanzada</tspan></text><line x1="310.0" y1="357.0" x2="330.0" y2="357.0" stroke="#f59e0b" stroke-width="2"/><circle cx="330.0" cy="357.0" r="4" fill="#f59e0b"/><rect x="40.0" y="307.0" width="270" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="308.0" width="6" height="98.0" rx="3" fill="#f59e0b"/><text x="184.0" y="334.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="224"><tspan x="184.0" dy="0">Bajar la presión</tspan></text><text x="184.0" y="357.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="224"><tspan x="184.0" dy="0">Acetazolamida, timolol,</tspan><tspan x="184.0" dy="17">pilocarpina</tspan><tspan x="184.0" dy="17">± manitol EV</tspan></text><line x1="690.0" y1="357.0" x2="670.0" y2="357.0" stroke="#10b981" stroke-width="2"/><circle cx="670.0" cy="357.0" r="4" fill="#10b981"/><rect x="690.0" y="307.0" width="270" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="691.0" y="308.0" width="6" height="98.0" rx="3" fill="#10b981"/><text x="834.0" y="334.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="224"><tspan x="834.0" dy="0">Definitivo</tspan></text><text x="834.0" y="357.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="224"><tspan x="834.0" dy="0">Iridotomía láser</tspan><tspan x="834.0" dy="17">en AMBOS ojos</tspan><tspan x="834.0" dy="17">(el otro es preventivo)</tspan></text><rect x="40" y="433.0" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="461.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="483.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• En la uveítis anterior la pupila está en miosis; en el glaucoma agudo, en midriasis media.</tspan><tspan x="58.0" dy="18">• Derivación urgente: riesgo de pérdida visual en horas.</tspan></text><text x="58.0" y="523.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAO Preferred Practice Pattern: Primary Angle-Closure Disease · EGS Guidelines 5.ª ed.</tspan></text></svg>
