<svg xmlns="http://www.w3.org/2000/svg" width="820" height="946" viewBox="0 0 820 946" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Displasia del desarrollo de la cadera: ecografía"><title>Displasia del desarrollo de la cadera: ecografía</title><rect width="820" height="946" fill="#ffffff"/><rect x="0" y="0" width="820" height="112" fill="#0f766e"/><text x="40" y="34" font-size="13" font-weight="600" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="740"><tspan x="40" dy="0">MedQuizPlus · Flujograma</tspan></text><text x="40" y="70" font-size="24" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="740"><tspan x="40" dy="0">Displasia del desarrollo de la cadera: ecografía</tspan></text><text x="40" y="96" font-size="13" font-weight="400" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="740"><tspan x="40" dy="0">ENAM 2020 · TRA-002 · Traumatología y Ortopedia</tspan></text><rect x="90" y="144" width="640" height="98" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="108" y="172" font-size="11" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="604"><tspan x="108" dy="0">INICIO</tspan></text><text x="108" y="196" font-size="16" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Lactante con sospecha de displasia del desarrollo de la</tspan><tspan x="108" dy="22">cadera</tspan></text><line x1="410.0" y1="244" x2="410.0" y2="264" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,262 417.0,262 410.0,272" fill="#94a3b8"/><rect x="90" y="274" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="302" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="326" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Examen: Ortolani, Barlow, limitación de la abducción,</tspan><tspan x="108" dy="22">asimetría de pliegues o longitud</tspan></text><line x1="410.0" y1="374" x2="410.0" y2="394" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,392 417.0,392 410.0,402" fill="#94a3b8"/><rect x="90" y="404" width="640" height="104" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><circle cx="120" cy="456.0" r="12" fill="#d97706"/><text x="120" y="461.0" font-size="15" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="120" dy="0">?</tspan></text><text x="142" y="432" font-size="11" font-weight="700" font-style="normal" fill="#b45309" text-anchor="start" data-max="570"><tspan x="142" dy="0">DECISIÓN</tspan></text><text x="142" y="456" font-size="16" font-weight="600" font-style="normal" fill="#78350f" text-anchor="start" data-max="570"><tspan x="142" dy="0">¿Menor de 4 a 6 meses?</tspan></text><text x="142" y="484" font-size="14" font-weight="500" font-style="italic" fill="#92400e" text-anchor="start" data-max="570"><tspan x="142" dy="0">↳ No (núcleo femoral ya osificado) → radiografía de pelvis</tspan></text><line x1="410.0" y1="510" x2="410.0" y2="530" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,528 417.0,528 410.0,538" fill="#94a3b8"/><rect x="90" y="540" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="568" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="592" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Sí → ecografía de caderas: la cabeza femoral aún es</tspan><tspan x="108" dy="22">cartilaginosa</tspan></text><line x1="410.0" y1="640" x2="410.0" y2="660" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,658 417.0,658 410.0,668" fill="#94a3b8"/><rect x="90" y="670" width="640" height="98" rx="12" fill="#134e4a" stroke="#134e4a" stroke-width="2"/><text x="108" y="698" font-size="11" font-weight="700" font-style="normal" fill="#5eead4" text-anchor="start" data-max="604"><tspan x="108" dy="0">CONDUCTA FINAL</tspan></text><text x="108" y="722" font-size="16" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Displasia confirmada: arnés de Pavlik y derivación a</tspan><tspan x="108" dy="22">traumatología</tspan></text><rect x="40" y="798" width="740" height="98" rx="10" fill="#f0fdfa" stroke="#99f6e4"/><rect x="40" y="798" width="6" height="98" rx="3" fill="#14b8a6"/><text x="62" y="824" font-size="14" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="704"><tspan x="62" dy="0">Perla clínica</tspan></text><text x="62" y="848" font-size="15" font-weight="400" font-style="normal" fill="#134e4a" text-anchor="start" data-max="704"><tspan x="62" dy="0">Antes de que osifique el núcleo de la cabeza femoral, la radiografía no la</tspan><tspan x="62" dy="21">muestra.</tspan></text><text x="410.0" y="924" font-size="11" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="740"><tspan x="410.0" dy="0">MedQuizPlus · Material de estudio: contrasta siempre con las guías clínicas vigentes.</tspan></text></svg>
