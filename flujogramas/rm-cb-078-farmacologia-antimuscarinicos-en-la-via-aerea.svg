<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1155" viewBox="0 0 1000 1155" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El bromuro de ipratropio antagoniza los receptores muscarínicos y broncodilata al bloquear el tono vagal"><title>El bromuro de ipratropio antagoniza los receptores muscarínicos y broncodilata al bloquear el tono vagal</title><rect x="0.75" y="0.75" width="998.5" height="1153.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Farmacología · antimuscarínicos en la vía aérea</tspan></text><rect x="481.7" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="553.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="553.6" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Bromuro de ipratropio</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Derivado cuaternario de la atropina, antagonista competitivo de los receptores muscarínicos</tspan><tspan x="58.0" dy="17">M1, M2 y M3.</tspan><tspan x="58.0" dy="17">Casi no se absorbe.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de mecanismo</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es el mecanismo de acción del bromuro de</tspan><tspan x="640.0" dy="16">ipratropio?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DÓNDE ACTÚA CADA BRONCODILATADOR O ANTIINFLAMATORIO</tspan></text><rect x="40.0" y="269.0" width="920.0" height="99.0" rx="0" fill="#e0f2fe" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="269.0" width="112.0" height="99.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="314.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Receptor</tspan><tspan x="96.0" dy="14">muscarínico del</tspan><tspan x="96.0" dy="14">músculo liso</tspan></text><rect x="40.0" y="368.0" width="920.0" height="99.0" rx="0" fill="#fef3c7" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="368.0" width="112.0" height="99.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="413.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Otras vías de la</tspan><tspan x="96.0" dy="14">obstrucción</tspan><tspan x="96.0" dy="14">bronquial</tspan></text><line x1="322.0" y1="353.0" x2="272.1" y2="377.1" stroke="#0f766e" stroke-width="2.2"/><polygon points="269.9,372.6 274.3,381.6 264.0,381.0" fill="#0f766e"/><line x1="356.0" y1="417.5" x2="363.0" y2="417.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="363.0,422.5 363.0,412.5 372.0,417.5" fill="#0f766e"/><line x1="556.0" y1="417.5" x2="563.0" y2="417.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="563.0,422.5 563.0,412.5 572.0,417.5" fill="#0f766e"/><line x1="756.0" y1="417.5" x2="763.0" y2="417.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="763.0,422.5 763.0,412.5 772.0,417.5" fill="#0f766e"/><rect x="172.0" y="284.0" width="300.0" height="69.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="182.0" y="300.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Ipratropio</tspan></text><text x="182.0" y="317.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Antagoniza los receptores muscarínicos: bloquea la</tspan><tspan x="182.0" dy="14.5">acetilcolina vagal y relaja el músculo liso</tspan></text><circle cx="172.0" cy="284.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="288.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">1</tspan></text><rect x="172.0" y="383.0" width="184.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="399.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="164"><tspan x="182.0" dy="0">Montelukast</tspan></text><text x="182.0" y="416.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="164"><tspan x="182.0" dy="0">Bloquea los receptores Cis-LT1</tspan><tspan x="182.0" dy="14.5">de los leucotrienos</tspan></text><circle cx="172.0" cy="383.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="387.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">2</tspan></text><rect x="372.0" y="383.0" width="184.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="382.0" y="399.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="164"><tspan x="382.0" dy="0">Salbutamol y fenoterol</tspan></text><text x="382.0" y="416.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="164"><tspan x="382.0" dy="0">Agonistas beta 2: activan el</tspan><tspan x="382.0" dy="14.5">AMP cíclico</tspan></text><circle cx="372.0" cy="383.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="372.0" y="387.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="372.0" dy="0">3</tspan></text><rect x="572.0" y="383.0" width="184.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="582.0" y="399.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="164"><tspan x="582.0" dy="0">Corticoides</tspan></text><text x="582.0" y="416.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="164"><tspan x="582.0" dy="0">Disminuyen las células</tspan><tspan x="582.0" dy="14.5">inflamatorias</tspan></text><circle cx="572.0" cy="383.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="572.0" y="387.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="572.0" dy="0">4</tspan></text><rect x="772.0" y="383.0" width="184.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="782.0" y="399.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="164"><tspan x="782.0" dy="0">Teofilina</tspan></text><text x="782.0" y="416.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="164"><tspan x="782.0" dy="0">Inhibe la fosfodiesterasa del</tspan><tspan x="782.0" dy="14.5">músculo liso</tspan></text><circle cx="772.0" cy="383.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="772.0" y="387.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="772.0" dy="0">5</tspan></text><rect x="40.0" y="485.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="511.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Ipratropio = antagonista muscarínico</tspan></text><text x="60.0" y="530.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Las otras opciones describen montelukast, beta 2, corticoides y teofilina.</tspan></text><text x="40.0" y="591.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">MECANISMO DE LOS FÁRMACOS DE LA VÍA AÉREA</tspan></text><rect x="40.0" y="603.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="622.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Fármaco</tspan></text><text x="320.0" y="622.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Mecanismo</tspan></text><text x="645.0" y="622.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">Uso</tspan></text><rect x="40.0" y="632.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="651.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Bromuro de ipratropio</tspan></text><text x="320.0" y="651.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Antagonista muscarínico, acción corta</tspan></text><text x="645.0" y="651.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">Crisis asmática moderada o grave y EPOC</tspan></text><rect x="210.6" y="635.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="256.0" y="650.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="256.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="661.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="680.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Tiotropio</tspan></text><text x="320.0" y="680.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Antagonista muscarínico de acción prolongada</tspan></text><text x="645.0" y="680.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">Mantenimiento en EPOC</tspan></text><rect x="40.0" y="690.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="709.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Montelukast</tspan></text><text x="320.0" y="709.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Bloquea los receptores Cis-LT1</tspan></text><text x="645.0" y="709.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">Asma leve y rinitis</tspan></text><rect x="40.0" y="719.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="738.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Salbutamol</tspan></text><text x="320.0" y="738.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Agonista beta 2 de acción corta</tspan></text><text x="645.0" y="738.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">Rescate en la crisis</tspan></text><rect x="40.0" y="748.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="767.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Teofilina</tspan></text><text x="320.0" y="767.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Inhibe la fosfodiesterasa</tspan></text><text x="645.0" y="767.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">Tercera línea</tspan></text><text x="40.0" y="817.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="827.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="866.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="858.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Bloquea receptores</tspan><tspan x="285.0" dy="17">Cis-LT1</tspan></text><text x="435.0" y="858.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Activa receptores</tspan><tspan x="435.0" dy="17">beta 2</tspan></text><rect x="513.0" y="830.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Antagoniza</tspan><tspan x="585.0" dy="17">receptores</tspan><tspan x="585.0" dy="17">muscarínicos</tspan></text><text x="735.0" y="858.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Disminuye células</tspan><tspan x="735.0" dy="17">inflamatorias</tspan></text><text x="885.0" y="858.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Inhibe la</tspan><tspan x="885.0" dy="17">fosfodiesterasa</tspan></text><rect x="40.0" y="898.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="898.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="935.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Mecanismo?</tspan></text><text x="285.0" y="935.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es el montelukast</tspan></text><text x="435.0" y="927.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: son los agonistas</tspan><tspan x="435.0" dy="16">beta 2</tspan></text><text x="585.0" y="919.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: bloquea la</tspan><tspan x="585.0" dy="16">acetilcolina en los</tspan><tspan x="585.0" dy="16">receptores M3</tspan></text><text x="735.0" y="927.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es el efecto de los</tspan><tspan x="735.0" dy="16">corticoides</tspan></text><text x="885.0" y="935.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es la teofilina</tspan></text><rect x="40.0" y="827.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="988.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1016.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1038.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La acetilcolina vagal actúa sobre los receptores M3 del músculo liso y de las glándulas: broncoconstricción y moco. El ipratropio los bloquea.</tspan><tspan x="58.0" dy="18">• Inicio a los 15 a 30 minutos y duración de 4 a 6 horas. Efectos: boca seca, sabor amargo; en ancianos, retención urinaria o glaucoma de ángulo cerrado.</tspan><tspan x="58.0" dy="18">• Se usa en la crisis asmática moderada o grave junto con salbutamol y en el EPOC; el tiotropio es de acción prolongada.</tspan><tspan x="58.0" dy="18">• Distractores: montelukast bloquea Cis-LT1; beta 2 activan AMPc; corticoides reducen la inflamación; teofilina inhibe la fosfodiesterasa.</tspan></text><text x="58.0" y="1114.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Katzung, 16.ª ed. (2024); GOLD 2025 (goldcopd.org); Goodman y Gilman, 14.ª ed. (2023).</tspan></text></svg>