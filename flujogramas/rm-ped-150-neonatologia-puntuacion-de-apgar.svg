eight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Adaptación adecuada.</tspan></text><rect x="634.0" y="441.0" width="326.0" height="52.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="634.0" y="441.0" width="10.0" height="52.0" rx="4" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="656.0" y="463.0" font-size="12" font-weight="800" font-style="normal" fill="#f59e0b" text-anchor="start" data-max="100"><tspan x="656.0" dy="0">4-6</tspan></text><text x="760.0" y="463.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Depresión moderada</tspan></text><text x="760.0" y="481.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Estimular y valorar soporte.</tspan></text><rect x="634.0" y="501.0" width="326.0" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="634.0" y="501.0" width="10.0" height="64.0" rx="4" fill="#f97316" stroke="none" stroke-width="1.5"/><text x="656.0" y="523.0" font-size="12" font-weight="800" font-style="normal" fill="#f97316" text-anchor="start" data-max="100"><tspan x="656.0" dy="0">0-3</tspan></text><text x="760.0" y="523.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Depresión grave</tspan></text><text x="760.0" y="541.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Reanimación; repetir cada 5</tspan><tspan x="760.0" dy="15">minutos.</tspan></text><text x="40.0" y="599.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">INTERPRETACIÓN DEL APGAR</tspan></text><rect x="40.0" y="611.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="630.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="104"><tspan x="50.0" dy="0">Puntaje</tspan></text><text x="170.0" y="630.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="384"><tspan x="170.0" dy="0">Interpretación</tspan></text><text x="570.0" y="630.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="384"><tspan x="570.0" dy="0">Conducta</tspan></text><rect x="40.0" y="640.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="659.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="104"><tspan x="50.0" dy="0">7 a 10</tspan></text><text x="170.0" y="659.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="384"><tspan x="170.0" dy="0">Normal</tspan></text><text x="570.0" y="659.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="384"><tspan x="570.0" dy="0">Cuidados de rutina</tspan></text><rect x="40.0" y="669.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="688.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="104"><tspan x="50.0" dy="0">4 a 6</tspan></text><text x="170.0" y="688.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="384"><tspan x="170.0" dy="0">Depresión moderada</tspan></text><text x="570.0" y="688.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="384"><tspan x="570.0" dy="0">Estimular y valorar soporte ventilatorio</tspan></text><rect x="40.0" y="698.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="717.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="104"><tspan x="50.0" dy="0">0 a 3</tspan></text><text x="170.0" y="717.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="384"><tspan x="170.0" dy="0">Depresión grave</tspan></text><text x="570.0" y="717.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="384"><tspan x="570.0" dy="0">Reanimación; repetir cada 5 minutos hasta los 20 si sigue menor de 7</tspan></text><text x="40.0" y="743.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">No sustituye a la evaluación inicial de respiración, frecuencia cardiaca y tono para decidir reanimar.</tspan></text><text x="40.0" y="790.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="800.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="839.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="831.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">El desarrollo</tspan><tspan x="285.0" dy="17">neurológico</tspan></text><rect x="363.0" y="803.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="839.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">La vitalidad</tspan></text><text x="585.0" y="831.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">El desarrollo</tspan><tspan x="585.0" dy="17">neuromuscular</tspan></text><text x="735.0" y="839.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">La edad gestacional</tspan></text><text x="885.0" y="822.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">El grado de</tspan><tspan x="885.0" dy="17">dificultad</tspan><tspan x="885.0" dy="17">respiratoria</tspan></text><rect x="40.0" y="871.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="871.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="900.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué identifica el</tspan><tspan x="54.0" dy="16">Apgar?</tspan></text><text x="285.0" y="900.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no mide ni predice</tspan><tspan x="285.0" dy="16">el neurodesarrollo</tspan></text><text x="435.0" y="900.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: adaptación a la vida</tspan><tspan x="435.0" dy="16">extrauterina</tspan></text><text x="585.0" y="892.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: tampoco mide el</tspan><tspan x="585.0" dy="16">desarrollo</tspan><tspan x="585.0" dy="16">neuromuscular</tspan></text><text x="735.0" y="900.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: se estima con</tspan><tspan x="735.0" dy="16">Capurro o Ballard</tspan></text><text x="885.0" y="900.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: se mide con el test</tspan><tspan x="885.0" dy="16">de Silverman</tspan></text><rect x="40.0" y="800.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="961.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="989.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1011.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Parámetros: frecuencia cardiaca, esfuerzo respiratorio, tono muscular, irritabilidad refleja y color. 7 a 10 normal, 4 a 6 depresión moderada, 0 a 3</tspan><tspan x="58.0" dy="18">   depresión grave.</tspan><tspan x="58.0" dy="18">• Se repite cada 5 minutos hasta los 20 si sigue menor de 7. No decide el inicio de la reanimación, que depende de respiración, frecuencia cardiaca y tono.</tspan><tspan x="58.0" dy="18">• No mide neurodesarrollo ni predice parálisis cerebral. La edad gestacional se estima con Capurro o Ballard; la dificultad respiratoria, con Silverman.</tspan><tspan x="58.0" dy="18">• Alerta: un Apgar bajo aislado no define asfixia perinatal, que exige acidosis en cordón, síntomas neurológicos y falla orgánica.</tspan></text><text x="58.0" y="1105.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAP y ACOG, The Apgar Score (Pediatrics 2015;136:819-22); NTS 214-2024, Atención integral neonatal (MINSA).</tspan></text></svg>