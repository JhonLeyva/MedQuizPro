start" data-max="604"><tspan x="108" dy="0">Tamizaje de hemoglobina según la edad</tspan></text><line x1="410.0" y1="330" x2="410.0" y2="350" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,348 417.0,348 410.0,358" fill="#94a3b8"/><rect x="90" y="360" width="640" height="76" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="388" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="412" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Suplementación preventiva o tratamiento con hierro</tspan></text><line x1="410.0" y1="438" x2="410.0" y2="458" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,456 417.0,456 410.0,466" fill="#94a3b8"/><rect x="90" y="468" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="496" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="520" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Consejería nutricional y visitas domiciliarias de</tspan><tspan x="108" dy="22">seguimiento</tspan></text><line x1="410.0" y1="568" x2="410.0" y2="588" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,586 417.0,586 410.0,596" fill="#94a3b8"/><rect x="90" y="598" width="640" height="98" rx="12" fill="#134e4a" stroke="#134e4a" stroke-width="2"/><text x="108" y="626" font-size="11" font-weight="700" font-style="normal" fill="#5eead4" text-anchor="start" data-max="604"><tspan x="108" dy="0">CONDUCTA FINAL</tspan></text><text x="108" y="650" font-size="16" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Responsable del monitoreo: todo el personal de salud del</tspan><tspan x="108" dy="22">establecimiento</tspan></text><rect x="40" y="726" width="740" height="98" rx="10" fill="#f0fdfa" stroke="#99f6e4"/><rect x="40" y="726" width="6" height="98" rx="3" fill="#14b8a6"/><text x="62" y="752" font-size="14" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="704"><tspan x="62" dy="0">Perla clínica</tspan></text><text x="62" y="776" font-size="15" font-weight="400" font-style="normal" fill="#134e4a" text-anchor="start" data-max="704"><tspan x="62" dy="0">El Plan Nacional contra la Anemia es integral y multisectorial: no recae</tspan><tspan x="62" dy="21">solo en enfermería, pediatría o nutrición.</tspan></text><text x="410.0" y="852" font-size="11" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="740"><tspan x="410.0" dy="0">MedQuizPlus · Material de estudio: contrasta siempre con las guías clínicas vigentes.</tspan></text></svg>
