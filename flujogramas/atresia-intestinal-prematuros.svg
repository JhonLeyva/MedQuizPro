<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="579" viewBox="0 0 1000 579" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Atresia intestinal"><title>Atresia intestinal</title><rect x="0.75" y="0.75" width="998.5" height="577.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16" y="16" width="968" height="56" rx="10" fill="#0f766e"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170" y1="34.0" x2="170" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="665"><tspan x="184.0" dy="0">PEDIATRÍA ENAM: ATRESIA INTESTINAL</tspan></text><rect x="868.7" y="32.0" width="95.3" height="24" rx="12" fill="#134e4a"/><text x="916.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="79"><tspan x="916.4" dy="0">PEDIATRÍA</tspan></text><rect x="190.0" y="90.0" width="620" height="86.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="500.0" y="118.5" font-size="14.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">¿En qué recién nacidos es más frecuente la atresia</tspan><tspan x="500.0" dy="19.0">intestinal?</tspan></text><text x="500.0" y="160.0" font-size="12" font-weight="400" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Malformación digestiva congénita</tspan></text><line x1="500.0" y1="176.0" x2="500.0" y2="258.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,257.0 505.0,257.0 500.0,265.0" fill="#0f766e"/><rect x="330.0" y="265.0" width="340" height="100.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="292.5" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="500.0" dy="0">MÁS FRECUENTE EN PREMATUROS</tspan></text><text x="500.0" y="315.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="500.0" dy="0">Accidentes vasculares mesentéricos</tspan><tspan x="500.0" dy="17">intrauterinos → atresia yeyunoileal</tspan><tspan x="500.0" dy="17">Duodenal: asociada a síndrome de Down</tspan></text><line x1="310.0" y1="254.0" x2="330.0" y2="254.0" stroke="#0ea5e9" stroke-width="2"/><circle cx="330.0" cy="254.0" r="4" fill="#0ea5e9"/><rect x="40.0" y="204.0" width="270" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="205.0" width="6" height="98.0" rx="3" fill="#0ea5e9"/><text x="184.0" y="231.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="224"><tspan x="184.0" dy="0">Clínica</tspan></text><text x="184.0" y="254.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="224"><tspan x="184.0" dy="0">Vómitos biliosos</tspan><tspan x="184.0" dy="17">Distensión abdominal</tspan><tspan x="184.0" dy="17">Sin meconio</tspan></text><line x1="690.0" y1="254.0" x2="670.0" y2="254.0" stroke="#8b5cf6" stroke-width="2"/><circle cx="670.0" cy="254.0" r="4" fill="#8b5cf6"/><rect x="690.0" y="204.0" width="270" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="691.0" y="205.0" width="6" height="98.0" rx="3" fill="#8b5cf6"/><text x="834.0" y="231.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="224"><tspan x="834.0" dy="0">Prenatal</tspan></text><text x="834.0" y="254.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="224"><tspan x="834.0" dy="0">Polihidramnios</tspan><tspan x="834.0" dy="17">(el feto no deglute</tspan><tspan x="834.0" dy="17">líquido)</tspan></text><line x1="310.0" y1="376.0" x2="330.0" y2="376.0" stroke="#f59e0b" stroke-width="2"/><circle cx="330.0" cy="376.0" r="4" fill="#f59e0b"/><rect x="40.0" y="326.0" width="270" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="327.0" width="6" height="98.0" rx="3" fill="#f59e0b"/><text x="184.0" y="353.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="224"><tspan x="184.0" dy="0">Imagen</tspan></text><text x="184.0" y="376.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="224"><tspan x="184.0" dy="0">Duodenal: «doble burbuja»</tspan><tspan x="184.0" dy="17">Yeyunoileal: asas</tspan><tspan x="184.0" dy="17">dilatadas con niveles</tspan></text><line x1="690.0" y1="376.0" x2="670.0" y2="376.0" stroke="#10b981" stroke-width="2"/><circle cx="670.0" cy="376.0" r="4" fill="#10b981"/><rect x="690.0" y="326.0" width="270" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="691.0" y="327.0" width="6" height="98.0" rx="3" fill="#10b981"/><text x="834.0" y="353.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="224"><tspan x="834.0" dy="0">Tratamiento</tspan></text><text x="834.0" y="376.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="224"><tspan x="834.0" dy="0">Sonda nasogástrica,</tspan><tspan x="834.0" dy="17">hidratación EV</tspan><tspan x="834.0" dy="17">Cirugía (anastomosis)</tspan></text><rect x="40" y="452.0" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="480.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="502.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Vómitos biliosos en el recién nacido = obstrucción intestinal hasta demostrar lo contrario.</tspan><tspan x="58.0" dy="18">• La atresia duodenal se asocia a trisomía 21.</tspan></text><text x="58.0" y="542.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Nelson Tratado de Pediatría 22.ª ed. · Holcomb &amp; Ashcraft Pediatric Surgery 7.ª ed.</tspan></text></svg>
