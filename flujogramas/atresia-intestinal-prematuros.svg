<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1019" viewBox="0 0 1000 1019" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La atresia intestinal (yeyunoileal) es más frecuente en recién nacidos prematuros"><title>La atresia intestinal (yeyunoileal) es más frecuente en recién nacidos prematuros</title><rect x="0.75" y="0.75" width="998.5" height="1017.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Malformaciones digestivas congénitas</tspan></text><rect x="427.6" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="484.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="484.1" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="148.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Atresia intestinal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Interrupción de la luz del intestino; la yeyunoileal se debe a un accidente vascular</tspan><tspan x="58.0" dy="17">intrauterino.</tspan><tspan x="58.0" dy="17">Hasta un tercio son prematuros o de bajo peso; vómitos biliosos y distensión en los</tspan><tspan x="58.0" dy="17">primeros días.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="148.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="146.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de concepto</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿En qué recién nacidos es más frecuente la atresia</tspan><tspan x="640.0" dy="16">intestinal?</tspan></text><rect x="640.0" y="209.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="222.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="222.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="270.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OBSTRUCCIÓN INTESTINAL EN EL RECIÉN NACIDO</tspan></text><rect x="40.0" y="282.0" width="450.0" height="181.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><rect x="40.0" y="282.0" width="450.0" height="8.0" rx="4" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="60.0" y="316.0" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="410"><tspan x="60.0" dy="0">Atresia yeyunoileal</tspan></text><rect x="56.0" y="337.0" width="418.0" height="26.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="68.0" y="354.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Quién</tspan></text><text x="462.0" y="354.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">✓ Prematuros, bajo peso</tspan></text><rect x="56.0" y="367.0" width="418.0" height="26.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="68.0" y="384.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Causa</tspan></text><text x="462.0" y="384.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">✓ Vascular intrauterina</tspan></text><rect x="56.0" y="397.0" width="418.0" height="26.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="68.0" y="414.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Rx</tspan></text><text x="462.0" y="414.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">✓ Muchos niveles</tspan></text><text x="60.0" y="443.0" font-size="11.5" font-weight="600" font-style="normal" fill="#0f766e" text-anchor="start" data-max="410"><tspan x="60.0" dy="0">Lo que pregunta el caso.</tspan></text><rect x="372.6" y="275.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="418.0" y="290.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="418.0" dy="0">◆ ESTE CASO</tspan></text><rect x="510.0" y="282.0" width="450.0" height="181.0" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="510.0" y="282.0" width="450.0" height="8.0" rx="4" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="530.0" y="316.0" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="410"><tspan x="530.0" dy="0">Atresia duodenal</tspan></text><rect x="526.0" y="337.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="354.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Asociación</tspan></text><text x="932.0" y="354.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">Síndrome de Down</tspan></text><rect x="526.0" y="367.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="384.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Rx</tspan></text><text x="932.0" y="384.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">Doble burbuja</tspan></text><rect x="526.0" y="397.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="414.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Vómitos</tspan></text><text x="932.0" y="414.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">Biliosos</tspan></text><text x="530.0" y="443.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="530.0" dy="0">Polihidramnios.</tspan></text><rect x="40.0" y="483.0" width="450.0" height="181.0" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="483.0" width="450.0" height="8.0" rx="4" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="60.0" y="517.0" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="410"><tspan x="60.0" dy="0">Íleo meconial</tspan></text><rect x="56.0" y="538.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="68.0" y="555.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Asociación</tspan></text><text x="462.0" y="555.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">Fibrosis quística</tspan></text><rect x="56.0" y="568.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="68.0" y="585.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Rx</tspan></text><text x="462.0" y="585.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">Microcolon</tspan></text><rect x="56.0" y="598.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="68.0" y="615.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Meconio</tspan></text><text x="462.0" y="615.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">Espeso</tspan></text><text x="60.0" y="644.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="60.0" dy="0">Enema.</tspan></text><rect x="510.0" y="483.0" width="450.0" height="181.0" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="510.0" y="483.0" width="450.0" height="8.0" rx="4" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="530.0" y="517.0" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="410"><tspan x="530.0" dy="0">Malrotación con vólvulo</tspan></text><rect x="526.0" y="538.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="555.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Vómitos</tspan></text><text x="932.0" y="555.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">Biliosos súbitos</tspan></text><rect x="526.0" y="568.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="585.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Prueba</tspan></text><text x="932.0" y="585.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">Tránsito intestinal</tspan></text><rect x="526.0" y="598.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="615.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Urgencia</tspan></text><text x="932.0" y="615.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">Máxima</tspan></text><text x="530.0" y="644.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="530.0" dy="0">Cirugía inmediata.</tspan></text><text x="40.0" y="686.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="400"><tspan x="40.0" dy="0">✓ = dato que coincide con el caso</tspan></text><text x="40.0" y="732.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="742.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="773.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="773.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Macrosómicos</tspan></text><text x="435.0" y="773.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Posmaduros</tspan></text><rect x="513.0" y="745.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="773.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Prematuros</tspan></text><text x="735.0" y="773.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">A término</tspan></text><text x="885.0" y="764.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hijos de madre</tspan><tspan x="885.0" dy="17">diabética</tspan></text><rect x="40.0" y="796.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="796.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="825.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Más frecuente?</tspan></text><text x="285.0" y="825.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no es un factor</tspan></text><text x="435.0" y="825.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no es un factor</tspan></text><text x="585.0" y="817.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: un tercio son</tspan><tspan x="585.0" dy="16">prematuros</tspan></text><text x="735.0" y="817.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Menos que en</tspan><tspan x="735.0" dy="16">prematuros</tspan></text><text x="885.0" y="817.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: se asocian a otras</tspan><tspan x="885.0" dy="16">malformaciones</tspan></text><rect x="40.0" y="742.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="870.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="898.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="920.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Atresia duodenal: signo de la doble burbuja, asociada a síndrome de Down (30 %).</tspan><tspan x="58.0" dy="18">• Atresia yeyunoileal: múltiples niveles hidroaéreos, polihidramnios, más en prematuros.</tspan><tspan x="58.0" dy="18">• Tratamiento: sonda nasogástrica, hidratación y cirugía (anastomosis).</tspan></text><text x="58.0" y="978.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: APSA, intestinal atresia (2023); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>