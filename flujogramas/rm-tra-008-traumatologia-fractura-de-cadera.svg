<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="912" viewBox="0 0 1000 912" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La fractura de cadera es la que tiene mayor morbimortalidad; se opera de forma precoz"><title>La fractura de cadera es la que tiene mayor morbimortalidad; se opera de forma precoz</title><rect x="0.75" y="0.75" width="998.5" height="910.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Traumatología · fractura de cadera</tspan></text><rect x="403.7" y="32.0" width="135.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="471.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="119"><tspan x="471.4" dy="0">TRAUMATOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Fractura de cadera</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cuello femoral e intertrocantérica del anciano con osteoporosis.</tspan><tspan x="58.0" dy="17">Suele ocurrir por caída desde la propia altura.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de pronóstico</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué fractura tiene mayor riesgo de morbimortalidad?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">RUTA DEL ANCIANO CON FRACTURA DE CADERA</tspan></text><text x="44.0" y="267.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">La demora quirúrgica empeora el pronóstico.</tspan></text><line x1="178.0" y1="306.0" x2="362.0" y2="306.0" stroke="#99f6e4" stroke-width="6"/><line x1="408.0" y1="306.0" x2="592.0" y2="306.0" stroke="#99f6e4" stroke-width="6"/><line x1="638.0" y1="306.0" x2="822.0" y2="306.0" stroke="#99f6e4" stroke-width="6"/><circle cx="155.0" cy="306.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="155.0" y="310.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="155.0" dy="0">0 h</tspan></text><rect x="45.0" y="340.0" width="220.0" height="91.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="155.0" y="360.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="155.0" dy="0">Ingreso</tspan></text><text x="155.0" y="377.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="155.0" dy="0">Analgesia con bloqueo regional,</tspan><tspan x="155.0" dy="16">profilaxis antitrombótica y estudio de</tspan><tspan x="155.0" dy="16">comorbilidades</tspan></text><circle cx="385.0" cy="306.0" r="22" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><text x="385.0" y="310.5" font-size="9.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="38"><tspan x="385.0" dy="0">24-48 h</tspan></text><rect x="275.0" y="340.0" width="220.0" height="91.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="385.0" y="360.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="208"><tspan x="385.0" dy="0">Cirugía precoz</tspan></text><text x="385.0" y="377.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="385.0" dy="0">Osteosíntesis o artroplastia según el</tspan><tspan x="385.0" dy="16">tipo de fractura y la edad</tspan></text><rect x="290.1" y="420.0" width="189.7" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="385.0" y="435.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="385.0" dy="0">◆ ESTE CASO: CIRUGÍA PRECOZ</tspan></text><circle cx="615.0" cy="306.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="615.0" y="310.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="615.0" dy="0">Días</tspan></text><rect x="505.0" y="340.0" width="220.0" height="91.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="615.0" y="360.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="615.0" dy="0">Rehabilitación</tspan></text><text x="615.0" y="377.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="615.0" dy="0">Movilización inmediata, nutrición y</tspan><tspan x="615.0" dy="16">atención ortogeriátrica</tspan></text><circle cx="845.0" cy="306.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="845.0" y="310.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="845.0" dy="0">Alta</tspan></text><rect x="735.0" y="340.0" width="220.0" height="91.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="845.0" y="360.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="845.0" dy="0">Prevenir la siguiente</tspan></text><text x="845.0" y="377.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="845.0" dy="0">Estudiar y tratar la osteoporosis para</tspan><tspan x="845.0" dy="16">evitar nuevas fracturas</tspan></text><rect x="40.0" y="463.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="489.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Cadera = mayor morbimortalidad de las fracturas listadas</tspan></text><text x="60.0" y="508.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Tibia, hombro, húmero y radio tienen mortalidad sensiblemente menor.</tspan></text><text x="40.0" y="575.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="585.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="607.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="588.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="607.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Cadera</tspan></text><text x="435.0" y="607.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Tibia</tspan></text><text x="585.0" y="607.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Hombro</tspan></text><text x="735.0" y="607.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Húmero</tspan></text><text x="885.0" y="607.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Radio</tspan></text><rect x="40.0" y="622.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="622.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="651.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Mayor</tspan><tspan x="54.0" dy="16">morbimortalidad?</tspan></text><text x="285.0" y="651.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: mortalidad al año</tspan><tspan x="285.0" dy="16">de 20-30 %</tspan></text><text x="435.0" y="643.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: morbilidad</tspan><tspan x="435.0" dy="16">importante, mortalidad</tspan><tspan x="435.0" dy="16">menor</tspan></text><text x="585.0" y="643.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: morbilidad</tspan><tspan x="585.0" dy="16">importante, mortalidad</tspan><tspan x="585.0" dy="16">menor</tspan></text><text x="735.0" y="643.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: morbilidad</tspan><tspan x="735.0" dy="16">importante, mortalidad</tspan><tspan x="735.0" dy="16">menor</tspan></text><text x="885.0" y="643.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: morbilidad</tspan><tspan x="885.0" dy="16">importante, mortalidad</tspan><tspan x="885.0" dy="16">menor</tspan></text><rect x="40.0" y="585.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="712.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="740.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="762.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Mortalidad al año del orden de 20-30 %, con mayor riesgo en los primeros meses; cerca de la mitad pierde la independencia para caminar.</tspan><tspan x="58.0" dy="18">• Causas de muerte: tromboembolia, neumonía, infección urinaria, descompensación cardiovascular y delirium.</tspan><tspan x="58.0" dy="18">• Peor pronóstico: edad avanzada, sexo masculino, demencia, estado funcional previo, anemia y retraso quirúrgico.</tspan><tspan x="58.0" dy="18">• Cirugía en 24-48 h (osteosíntesis o artroplastia), atención ortogeriátrica, bloqueo regional, profilaxis antitrombótica y rehabilitación; tratar siempre la</tspan><tspan x="58.0" dy="18">   osteoporosis.</tspan></text><text x="58.0" y="856.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Prognosis of nonoperative treatment in elderly patients with a hip fracture, Injury 2020;51:2511; Rockwood and Green's Fractures in Adults 9.ª ed. (2019); Campbell's</tspan><tspan x="58.0" dy="15">Operative Orthopaedics 14.ª ed. (2020).</tspan></text></svg>