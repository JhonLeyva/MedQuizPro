<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1205" viewBox="0 0 1000 1205" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Lactante letárgico con hipotensión, frialdad distal y llenado capilar lento: deshidratación severa con shock"><title>Lactante letárgico con hipotensión, frialdad distal y llenado capilar lento: deshidratación severa con shock</title><rect x="0.75" y="0.75" width="998.5" height="1203.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · deshidratación en gastroenteritis</tspan></text><rect x="459.1" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="508.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="508.1" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Deshidratación en gastroenteritis aguda</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se clasifica por el déficit de peso: leve de 3 a 5 %, moderada de 6 a 9 % y grave de 10 % o</tspan><tspan x="58.0" dy="17">más.</tspan><tspan x="58.0" dy="17">En la grave el volumen circulante efectivo puede caer hasta el shock.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 6 meses</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Fiebre, diarrea acuosa y vómitos por dos días.</tspan><tspan x="640.0" dy="16">FC 140, ojos hundidos, letargia, hipotensión, frialdad</tspan><tspan x="640.0" dy="16">distal y llenado capilar lento.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DÉFICIT DE PESO Y GRAVEDAD DE LA DESHIDRATACIÓN</tspan></text><rect x="70.0" y="295.0" width="34.0" height="330.0" rx="17" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="75.0" y="519.0" width="24.0" height="102.0" rx="8" fill="#10b981" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="570.0" x2="130.0" y2="570.0" stroke="#10b981" stroke-width="2"/><rect x="130.0" y="520.0" width="330.0" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="542.0" font-size="12" font-weight="800" font-style="normal" fill="#10b981" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">3-5 %</tspan></text><text x="240.0" y="542.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Leve</tspan></text><text x="144.0" y="563.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Sed y mucosas apenas secas; solución de</tspan><tspan x="144.0" dy="15">rehidratación oral</tspan></text><rect x="75.0" y="409.0" width="24.0" height="102.0" rx="8" fill="#f59e0b" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="460.0" x2="130.0" y2="460.0" stroke="#f59e0b" stroke-width="2"/><rect x="130.0" y="410.0" width="330.0" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="432.0" font-size="12" font-weight="800" font-style="normal" fill="#f59e0b" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">6-9 %</tspan></text><text x="240.0" y="432.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Moderada</tspan></text><text x="144.0" y="453.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Ojos hundidos, irritabilidad y pliegue lento;</tspan><tspan x="144.0" dy="15">rehidratación oral supervisada</tspan></text><rect x="75.0" y="299.0" width="24.0" height="102.0" rx="8" fill="#f97316" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="350.0" x2="130.0" y2="350.0" stroke="#0f766e" stroke-width="3"/><rect x="130.0" y="300.0" width="330.0" height="100.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="144.0" y="322.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">10 % o más</tspan></text><text x="240.0" y="322.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Grave con shock</tspan></text><text x="144.0" y="343.0" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Letargia, hipotensión, frialdad y llenado capilar lento</tspan></text><rect x="354.6" y="289.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="400.0" y="304.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="400.0" dy="0">◆ ESTE CASO</tspan></text><text x="470.0" y="299.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="490"><tspan x="470.0" dy="0">QUÉ SE HACE ANTE DESHIDRATACIÓN CON SHOCK</tspan></text><rect x="470.0" y="313.0" width="490.0" height="84.0" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="355.0" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="360.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">1</tspan></text><text x="528.0" y="348.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Reconocer el shock hipovolémico</tspan></text><text x="528.0" y="371.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Taquicardia, pulsos débiles, frialdad y llenado capilar lento</tspan></text><line x1="498.0" y1="399.0" x2="498.0" y2="412.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,411.0 503.0,411.0 498.0,419.0" fill="#0f766e"/><rect x="470.0" y="421.0" width="490.0" height="91.2" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="466.6" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="471.6" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">2</tspan></text><text x="528.0" y="451.1" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Reanimación con líquidos</tspan></text><text x="528.0" y="474.1" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Vía intravenosa o intraósea y bolo isotónico de 20 mL/kg; repetir si</tspan><tspan x="528.0" dy="17">persiste</tspan></text><line x1="498.0" y1="514.2" x2="498.0" y2="527.2" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,526.2 503.0,526.2 498.0,534.2" fill="#0f766e"/><rect x="470.0" y="536.2" width="490.0" height="84.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><circle cx="498.0" cy="578.2" r="17" fill="#ffffff" stroke="none" stroke-width="0"/><text x="498.0" y="583.2" font-size="15" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">3</tspan></text><text x="528.0" y="571.2" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Deshidratación severa con shock</tspan></text><text x="528.0" y="594.2" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Opción correcta: reúne todos los datos de shock</tspan></text><rect x="857.8" y="525.2" width="64.5" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="540.2" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ CLAVE</tspan></text><text x="40.0" y="659.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DESHIDRATACIÓN SEGÚN EL DÉFICIT DE PESO</tspan></text><rect x="40.0" y="671.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="690.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Grado</tspan></text><text x="250.0" y="690.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Déficit de peso</tspan></text><text x="610.0" y="690.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Signos</tspan></text><rect x="40.0" y="700.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="719.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Leve</tspan></text><text x="250.0" y="719.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">3 a 5 %</tspan></text><text x="610.0" y="719.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Sed y mucosas apenas secas</tspan></text><rect x="40.0" y="729.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="748.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Moderada</tspan></text><text x="250.0" y="748.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">6 a 9 %</tspan></text><text x="610.0" y="748.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Ojos hundidos, mucosas secas, irritabilidad y pliegue lento</tspan></text><rect x="40.0" y="758.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="777.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Grave</tspan></text><text x="250.0" y="777.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">10 % o más</tspan></text><text x="610.0" y="777.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Letargia o coma, pliegue mayor de 2 s y, con shock,</tspan><tspan x="610.0" dy="15">hipotensión y frialdad distal</tspan></text><rect x="140.6" y="769.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="186.0" y="784.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="186.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="818.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">La hipotensión es un signo tardío de shock en el lactante.</tspan></text><text x="40.0" y="865.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="875.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="897.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="897.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Grave sin shock</tspan></text><rect x="363.0" y="878.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="897.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Severa con shock</tspan></text><text x="585.0" y="897.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Leve</tspan></text><text x="735.0" y="897.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Moderada</tspan></text><text x="885.0" y="897.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Severa sin shock</tspan></text><rect x="40.0" y="912.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="912.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="941.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tipo de</tspan><tspan x="54.0" dy="16">deshidratación?</tspan></text><text x="285.0" y="933.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: la grave sin shock</tspan><tspan x="285.0" dy="16">conserva perfusión y</tspan><tspan x="285.0" dy="16">presión</tspan></text><text x="435.0" y="941.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: grave con signos</tspan><tspan x="435.0" dy="16">de shock hipovolémico</tspan></text><text x="585.0" y="933.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: solo sed y</tspan><tspan x="585.0" dy="16">mucosas apenas</tspan><tspan x="585.0" dy="16">secas</tspan></text><text x="735.0" y="941.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: sin letargo ni</tspan><tspan x="735.0" dy="16">signos de shock</tspan></text><text x="885.0" y="941.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: aquí hay shock</tspan><tspan x="885.0" dy="16">hipovolémico</tspan></text><rect x="40.0" y="875.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1002.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1030.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1052.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Grave: letargo o coma, ojos muy hundidos, mucosas secas y pliegue cutáneo que tarda más de 2 segundos; shock: taquicardia, pulsos débiles, frialdad,</tspan><tspan x="58.0" dy="18">   llenado prolongado y, tardíamente, hipotensión.</tspan><tspan x="58.0" dy="18">• Este lactante reúne todos los datos de shock hipovolémico; el abdomen distendido con hipoperistalsis sugiere íleo por hipopotasemia.</tspan><tspan x="58.0" dy="18">• Manejo inmediato: vía intravenosa o intraósea y solución isotónica en bolo (20 mL/kg), reevaluar y repetir si persiste; después reposición según plan de la</tspan><tspan x="58.0" dy="18">   OMS.</tspan><tspan x="58.0" dy="18">• Alerta: la hipotensión es un signo tardío en el niño; con taquicardia y llenado capilar lento ya hay shock compensado.</tspan></text><text x="58.0" y="1164.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, Tratamiento de la diarrea: manual para médicos (2005, reafirmado); Nelson Tratado de Pediatría, 22.ª ed. (2024).</tspan></text></svg>