<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1057" viewBox="0 0 1000 1057" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Niño intoxicado por monóxido de carbono al inhalar humo: el tratamiento inicial es oxígeno al 100 % (acorta la vida media de la carboxihemoglobina)"><title>Niño intoxicado por monóxido de carbono al inhalar humo: el tratamiento inicial es oxígeno al 100 % (acorta la vida media de la carboxihemoglobina)</title><rect x="0.75" y="0.75" width="998.5" height="1055.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Toxicología · monóxido de carbono</tspan></text><rect x="408.9" y="32.0" width="158.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="488.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="143"><tspan x="488.3" dy="0">CIENCIAS BÁSICAS ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="148.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Monóxido de carbono</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se une a la hemoglobina 200-250 veces más que el oxígeno (carboxihemoglobina) y</tspan><tspan x="58.0" dy="17">bloquea la respiración celular.</tspan><tspan x="58.0" dy="17">Cefalea, náuseas, confusión, coma; la SatO₂ del oxímetro sale falsamente normal. El</tspan><tspan x="58.0" dy="17">oxígeno al 100 % desplaza el CO.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="148.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="146.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 5 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Intoxicación por CO por inhalación de humo.</tspan><tspan x="640.0" dy="16">¿Tratamiento inicial?</tspan></text><rect x="640.0" y="209.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="222.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="222.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="270.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">VIDA MEDIA DE LA CARBOXIHEMOGLOBINA SEGÚN EL OXÍGENO</tspan></text><rect x="40.0" y="282.0" width="540.0" height="340.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><line x1="98.0" y1="574.0" x2="562.0" y2="574.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="578.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">0</tspan></text><line x1="98.0" y1="438.0" x2="562.0" y2="438.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="442.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">50</tspan></text><line x1="98.0" y1="302.0" x2="562.0" y2="302.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="306.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">100</tspan></text><line x1="98.0" y1="574.0" x2="98.0" y2="579.0" stroke="#94a3b8" stroke-width="1.5"/><text x="98.0" y="593.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="98.0" dy="0">0</tspan></text><line x1="190.8" y1="574.0" x2="190.8" y2="579.0" stroke="#94a3b8" stroke-width="1.5"/><text x="190.8" y="593.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="190.8" dy="0">60</tspan></text><line x1="237.2" y1="574.0" x2="237.2" y2="579.0" stroke="#94a3b8" stroke-width="1.5"/><text x="237.2" y="593.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="237.2" dy="0">90</tspan></text><line x1="283.6" y1="574.0" x2="283.6" y2="579.0" stroke="#94a3b8" stroke-width="1.5"/><text x="283.6" y="593.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="283.6" dy="0">120</tspan></text><line x1="469.2" y1="574.0" x2="469.2" y2="579.0" stroke="#94a3b8" stroke-width="1.5"/><text x="469.2" y="593.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="469.2" dy="0">240</tspan></text><line x1="562.0" y1="574.0" x2="562.0" y2="579.0" stroke="#94a3b8" stroke-width="1.5"/><text x="562.0" y="593.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="562.0" dy="0">300</tspan></text><line x1="98.0" y1="574.0" x2="562.0" y2="574.0" stroke="#94a3b8" stroke-width="1.5"/><line x1="98.0" y1="302.0" x2="98.0" y2="574.0" stroke="#94a3b8" stroke-width="1.5"/><text x="330.0" y="612.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="464"><tspan x="330.0" dy="0">Minutos</tspan></text><text x="56.0" y="438.0" transform="rotate(-90 56.0 438.0)" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">COHb (% del inicial)</text><polyline points="98.0,302.0 252.7,359.1 407.3,402.6 562.0,438.0" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="412.0" y1="336.0" x2="434.0" y2="336.0" stroke="#94a3b8" stroke-width="3"/><text x="440.0" y="340.0" font-size="10.5" font-weight="700" font-style="normal" fill="#94a3b8" text-anchor="start" data-max="120"><tspan x="440.0" dy="0">Aire (~300 min)</tspan></text><polyline points="98.0,302.0 167.6,380.9 237.2,438.0 376.4,506.0 515.6,541.4 562.0,546.8" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="412.0" y1="354.0" x2="434.0" y2="354.0" stroke="#0f766e" stroke-width="3"/><text x="440.0" y="358.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="120"><tspan x="440.0" dy="0">O₂ 100 % (~90 min)</tspan></text><polyline points="98.0,302.0 144.4,438.0 190.8,506.0 283.6,557.7 376.4,568.6" fill="none" stroke="#f97316" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="412.0" y1="372.0" x2="434.0" y2="372.0" stroke="#f97316" stroke-width="3"/><text x="440.0" y="376.0" font-size="10.5" font-weight="700" font-style="normal" fill="#f97316" text-anchor="start" data-max="120"><tspan x="440.0" dy="0">Hiperbárico (~30)</tspan></text><line x1="237.2" y1="438.0" x2="237.2" y2="574.0" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4"/><circle cx="237.2" cy="438.0" r="9" fill="#ea580c" stroke="#ffffff" stroke-width="3"/><rect x="179.3" y="413.0" width="115.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="237.2" y="428.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="237.2" dy="0">◆ O₂ 100 %: 90 min</tspan></text><rect x="602.0" y="361.5" width="358.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="617.0" y="385.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Oxígeno al 100 %</tspan></text><text x="617.0" y="402.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Baja la vida media de ~5 h a ~1,5 h: lo primero.</tspan></text><rect x="602.0" y="424.5" width="358.0" height="55.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="617.0" y="448.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Hiperbárico</tspan></text><text x="617.0" y="465.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">~30 min, pero solo con criterios y disponibilidad.</tspan></text><rect x="602.0" y="487.5" width="358.0" height="55.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="617.0" y="511.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Oxímetro de pulso</tspan></text><text x="617.0" y="528.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">No distingue COHb: usar cooximetría.</tspan></text><rect x="40.0" y="640.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="666.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Oxígeno al 100 % de inmediato</tspan></text><text x="60.0" y="685.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El hiperbárico se evalúa después.</tspan></text><text x="40.0" y="752.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="762.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="793.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="793.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Oxígeno al 50%</tspan></text><rect x="363.0" y="765.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="793.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Oxígeno al 100%</tspan></text><text x="585.0" y="784.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Oxígeno</tspan><tspan x="585.0" dy="17">hiperbárico</tspan></text><text x="735.0" y="793.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Tiosulfato de sodio</tspan></text><text x="885.0" y="793.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Azul de metileno</tspan></text><rect x="40.0" y="816.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="816.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="845.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tratamiento inicial?</tspan></text><text x="285.0" y="845.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: insuficiente</tspan></text><text x="435.0" y="845.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: desplaza el CO ya</tspan></text><text x="585.0" y="837.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Después, si hay</tspan><tspan x="585.0" dy="16">criterios</tspan></text><text x="735.0" y="837.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Es para cianuro (no</tspan><tspan x="735.0" dy="16">primera línea)</tspan></text><text x="885.0" y="837.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Es para</tspan><tspan x="885.0" dy="16">metahemoglobinemia</tspan></text><rect x="40.0" y="762.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="890.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="918.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="940.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Oxígeno al 100 % con mascarilla de reservorio (o intubado) hasta COHb &lt; 3-5 % y sin síntomas.</tspan><tspan x="58.0" dy="18">• Medir COHb con cooximetría (no con oxímetro de pulso).</tspan><tspan x="58.0" dy="18">• Hiperbárico si hubo pérdida de conciencia, COHb &gt; 25 %, alteración neurológica o gestante (según disponibilidad); en incendio, sospechar también</tspan><tspan x="58.0" dy="18">   cianuro (hidroxocobalamina).</tspan></text><text x="58.0" y="1016.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Goldfrank, toxicología 11.ª ed.; UHMS (2023).</tspan></text></svg>