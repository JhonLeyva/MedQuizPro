<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1122" viewBox="0 0 1000 1122" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la crisis asmática se inicia con beta 2 agonista de acción corta inhalado, repetido en la primera hora"><title>En la crisis asmática se inicia con beta 2 agonista de acción corta inhalado, repetido en la primera hora</title><rect x="0.75" y="0.75" width="998.5" height="1120.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neumología · crisis asmática</tspan></text><rect x="371.6" y="32.0" width="114.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="429.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="99"><tspan x="429.1" dy="0">NEUMOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Crisis asmática</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Empeoramiento progresivo de disnea, tos, sibilancias y opresión torácica.</tspan><tspan x="58.0" dy="17">Se mide por la caída del flujo espiratorio máximo o del VEF1.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de tratamiento</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué grupo farmacológico se indica inicialmente?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ORDEN DEL TRATAMIENTO DE LA CRISIS ASMÁTICA</tspan></text><text x="44.0" y="267.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Se avanza según la gravedad y la reacción a la primera hora.</tspan></text><line x1="155.0" y1="306.0" x2="293.0" y2="306.0" stroke="#99f6e4" stroke-width="6"/><line x1="339.0" y1="306.0" x2="477.0" y2="306.0" stroke="#99f6e4" stroke-width="6"/><line x1="523.0" y1="306.0" x2="661.0" y2="306.0" stroke="#99f6e4" stroke-width="6"/><line x1="707.0" y1="306.0" x2="845.0" y2="306.0" stroke="#99f6e4" stroke-width="6"/><circle cx="132.0" cy="306.0" r="22" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><text x="132.0" y="310.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="38"><tspan x="132.0" dy="0">1</tspan></text><rect x="45.0" y="340.0" width="174.0" height="108.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="132.0" y="360.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">Salbutamol inhalado</tspan><tspan x="132.0" dy="17">repetido</tspan></text><text x="132.0" y="394.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">Cámara espaciadora o</tspan><tspan x="132.0" dy="16">nebulización durante la</tspan><tspan x="132.0" dy="16">primera hora</tspan></text><rect x="92.5" y="437.0" width="78.9" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="132.0" y="452.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="132.0" dy="0">◆ PRIMERO</tspan></text><circle cx="316.0" cy="306.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="316.0" y="310.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="316.0" dy="0">2</tspan></text><rect x="229.0" y="340.0" width="174.0" height="108.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="316.0" y="360.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">Oxígeno y corticoide</tspan><tspan x="316.0" dy="17">sistémico</tspan></text><text x="316.0" y="394.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">Saturación de 93 a 95 %; el</tspan><tspan x="316.0" dy="16">corticoide se da de forma</tspan><tspan x="316.0" dy="16">temprana</tspan></text><circle cx="500.0" cy="306.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="310.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="500.0" dy="0">3</tspan></text><rect x="413.0" y="340.0" width="174.0" height="108.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="360.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">Bromuro de ipratropio</tspan></text><text x="500.0" y="377.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">Se agrega en la crisis</tspan><tspan x="500.0" dy="16">moderada a grave</tspan></text><circle cx="684.0" cy="306.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="684.0" y="310.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="684.0" dy="0">4</tspan></text><rect x="597.0" y="340.0" width="174.0" height="108.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="684.0" y="360.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">Sulfato de magnesio</tspan><tspan x="684.0" dy="17">intravenoso</tspan></text><text x="684.0" y="394.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">Crisis grave que no responde</tspan></text><circle cx="868.0" cy="306.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="868.0" y="310.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="868.0" dy="0">5</tspan></text><rect x="781.0" y="340.0" width="174.0" height="108.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="868.0" y="360.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">Cuidados intensivos</tspan></text><text x="868.0" y="377.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">Silencio torácico, cianosis o</tspan><tspan x="868.0" dy="16">sensorio alterado</tspan></text><rect x="40.0" y="480.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="506.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Crisis asmática = beta 2 de acción corta primero</tspan></text><text x="60.0" y="525.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Corticoide, ipratropio y magnesio se suman después; los beta 2 de acción larga solos y las metilxantinas no se usan en la crisis.</tspan></text><text x="40.0" y="586.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">FÁRMACOS DE LA CRISIS ASMÁTICA: MOMENTO Y PAPEL</tspan></text><rect x="40.0" y="598.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="617.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Fármaco</tspan></text><text x="310.0" y="617.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Momento</tspan></text><text x="640.0" y="617.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Papel</tspan></text><rect x="40.0" y="627.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="646.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Beta 2 de acción corta</tspan></text><text x="310.0" y="646.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Inicial, repetido en la primera hora</tspan></text><text x="640.0" y="646.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Broncodilatación en minutos</tspan></text><rect x="200.6" y="630.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="246.0" y="645.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="246.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="656.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="675.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Corticoide sistémico</tspan></text><text x="310.0" y="675.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Temprano</tspan></text><text x="640.0" y="675.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Trata la inflamación; actúa en 4 a 6 horas</tspan></text><rect x="40.0" y="685.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="704.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Bromuro de ipratropio</tspan></text><text x="310.0" y="704.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Crisis moderada a grave</tspan></text><text x="640.0" y="704.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Mejora el resultado hospitalario</tspan></text><rect x="40.0" y="714.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="733.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Sulfato de magnesio</tspan></text><text x="310.0" y="733.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Crisis grave que no mejora</tspan></text><text x="640.0" y="733.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Rescate intravenoso</tspan></text><text x="40.0" y="783.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="793.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="824.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="796.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="815.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Beta 2 de acción</tspan><tspan x="285.0" dy="17">corta</tspan></text><text x="435.0" y="815.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Beta 2 de acción</tspan><tspan x="435.0" dy="17">larga</tspan></text><text x="585.0" y="824.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Metilxantinas</tspan></text><text x="735.0" y="824.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Corticosteroides</tspan></text><text x="885.0" y="824.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Anticolinérgicos</tspan></text><rect x="40.0" y="847.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="847.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="884.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Grupo inicial?</tspan></text><text x="285.0" y="876.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: broncodilata en</tspan><tspan x="285.0" dy="16">minutos</tspan></text><text x="435.0" y="876.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: solos no se usan</tspan><tspan x="435.0" dy="16">en la crisis aguda</tspan></text><text x="585.0" y="868.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: ya no se</tspan><tspan x="585.0" dy="16">recomiendan por su</tspan><tspan x="585.0" dy="16">toxicidad</tspan></text><text x="735.0" y="868.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: se dan temprano,</tspan><tspan x="735.0" dy="16">pero actúan en 4 a 6</tspan><tspan x="735.0" dy="16">horas</tspan></text><text x="885.0" y="868.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: se agregan en la</tspan><tspan x="885.0" dy="16">crisis moderada a</tspan><tspan x="885.0" dy="16">grave</tspan></text><rect x="40.0" y="793.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="937.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="965.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="987.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Salbutamol inhalado en dosis repetidas durante la primera hora, con cámara espaciadora o nebulización: broncodilata en minutos al relajar el músculo</tspan><tspan x="58.0" dy="18">   liso por AMPc.</tspan><tspan x="58.0" dy="18">• Luego corticoide sistémico precoz (actúa en 4 a 6 horas), oxígeno con saturación de 93 a 95 % e ipratropio en la crisis moderada a grave.</tspan><tspan x="58.0" dy="18">• Sulfato de magnesio intravenoso solo en la crisis grave que no responde. Metilxantinas: ya no se recomiendan por su toxicidad y escaso beneficio.</tspan><tspan x="58.0" dy="18">• Alerta: silencio torácico, cianosis, alteración del sensorio y PaCO2 normal o elevada anuncian crisis inminente: cuidados intensivos.</tspan></text><text x="58.0" y="1081.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: GINA, Global Strategy for Asthma Management and Prevention, actualización 2024 (ginasthma.org); Katzung, 16.ª ed. (2024).</tspan></text></svg>