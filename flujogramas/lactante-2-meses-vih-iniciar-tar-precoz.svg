<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1204" viewBox="0 0 1000 1204" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Lactante de 2 meses con VIH recién diagnosticado: iniciar terapia antirretroviral de inmediato, sin esperar síntomas ni CD4"><title>Lactante de 2 meses con VIH recién diagnosticado: iniciar terapia antirretroviral de inmediato, sin esperar síntomas ni CD4</title><rect x="0.75" y="0.75" width="998.5" height="1202.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">VIH pediátrico</tspan></text><rect x="284.7" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="341.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="341.2" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">VIH en el lactante</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Diagnóstico con prueba virológica (PCR) desde el nacimiento; los anticuerpos maternos</tspan><tspan x="58.0" dy="17">duran hasta los 18 meses.</tspan><tspan x="58.0" dy="17">Todo niño con VIH inicia TAR apenas se diagnostica: el lactante progresa muy rápido.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 2 meses</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">VIH diagnosticado.</tspan><tspan x="640.0" dy="16">Se deriva al infectólogo pediatra.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EL LACTANTE CON VIH EN EL TIEMPO</tspan></text><rect x="40.0" y="269.0" width="350.0" height="350.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="279.0" width="91.3" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="293.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">EL LACTANTE</tspan></text><g data-box="50.0 305.0 330.0 285.0"><g transform="translate(110.0,305.0) scale(0.85)"><path d="M76 128 C72 110 168 110 164 128 L172 222 C160 248 80 248 68 222 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M72 180 H168 L172 222 C160 248 80 248 68 222 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M76 132 L40 170 L52 184 L82 156 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M164 132 L200 170 L188 184 L158 156 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><circle cx="44" cy="182" r="10" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="196" cy="182" r="10" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M84 236 L70 300 L94 304 L108 244 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M156 236 L170 300 L146 304 L132 244 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="80" cy="308" rx="14" ry="7" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><ellipse cx="160" cy="308" rx="14" ry="7" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="120" cy="70" r="54" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="100" cy="66" r="4" fill="#334155" stroke="none" stroke-width="0" /><circle cx="140" cy="66" r="4" fill="#334155" stroke="none" stroke-width="0" /><path d="M110 96 Q120 102 130 96" fill="none" stroke="#9a6b52" stroke-width="2"/><path d="M116 76 Q120 86 124 76" fill="none" stroke="#9a6b52" stroke-width="2" stroke-linejoin="round" /><circle cx="120" cy="214" r="3" fill="#9a6b52" stroke="none" stroke-width="0" /></g></g><rect x="48.0" y="586.0" width="334.0" height="27.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0"/><text x="215.0" y="607.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="320"><tspan x="215.0" dy="0">2 meses con VIH confirmado.</tspan></text><rect x="410.0" y="269.0" width="550.0" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="411.0" y="270.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="428.0" y="293.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">TAR ya</tspan></text><text x="428.0" y="314.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Sin esperar síntomas ni CD4</tspan></text><rect x="875.6" y="258.0" width="75.4" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="913.3" y="273.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="913.3" dy="0">◆ 2 MESES</tspan></text><rect x="410.0" y="348.0" width="550.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="411.0" y="349.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="428.0" y="372.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">PCR para diagnosticar</tspan></text><text x="428.0" y="393.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">No ELISA antes de 18 meses</tspan></text><rect x="410.0" y="427.0" width="550.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="411.0" y="428.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="428.0" y="451.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Cotrimoxazol</tspan></text><text x="428.0" y="472.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Desde las 6 semanas</tspan></text><text x="40.0" y="653.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">MESES DE VIDA</tspan></text><line x1="350.0" y1="685.0" x2="350.0" y2="803.0" stroke="#e2e8f0" stroke-width="1"/><line x1="449.0" y1="685.0" x2="449.0" y2="803.0" stroke="#e2e8f0" stroke-width="1"/><line x1="548.0" y1="685.0" x2="548.0" y2="803.0" stroke="#e2e8f0" stroke-width="1"/><line x1="647.0" y1="685.0" x2="647.0" y2="803.0" stroke="#e2e8f0" stroke-width="1"/><line x1="746.0" y1="685.0" x2="746.0" y2="803.0" stroke="#e2e8f0" stroke-width="1"/><line x1="845.0" y1="685.0" x2="845.0" y2="803.0" stroke="#e2e8f0" stroke-width="1"/><line x1="944.0" y1="685.0" x2="944.0" y2="803.0" stroke="#e2e8f0" stroke-width="1"/><text x="50.0" y="704.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">PCR al nacer y al mes</tspan></text><text x="50.0" y="718.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">diagnóstico</tspan></text><rect x="350.0" y="696.0" width="66.0" height="20.0" rx="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="383.0" y="710.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="58"><tspan x="383.0" dy="0">0-2 m</tspan></text><line x1="330.0" y1="706.0" x2="346.0" y2="706.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><rect x="40.0" y="725.0" width="920.0" height="32.0" rx="8" fill="#f0fdfa" stroke="none" stroke-width="0"/><text x="50.0" y="740.0" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">TAR</tspan></text><text x="50.0" y="754.0" font-size="10.5" font-weight="600" font-style="normal" fill="#0f766e" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">de inmediato</tspan></text><rect x="416.0" y="732.0" width="33.0" height="20.0" rx="10" fill="#0f766e" stroke="none" stroke-width="0"/><text x="455.0" y="746.0" font-size="10" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="80"><tspan x="455.0" dy="0">2-3 m</tspan></text><line x1="330.0" y1="742.0" x2="412.0" y2="742.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><text x="50.0" y="776.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">TAR y controles</tspan></text><text x="50.0" y="790.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">carga viral, CD4</tspan></text><rect x="449.0" y="768.0" width="495.0" height="20.0" rx="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="696.5" y="782.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="487"><tspan x="696.5" dy="0">3-18 m</tspan></text><line x1="330.0" y1="778.0" x2="445.0" y2="778.0" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 4"/><line x1="350.0" y1="803.0" x2="944.0" y2="803.0" stroke="#94a3b8" stroke-width="1.5"/><line x1="350.0" y1="799.0" x2="350.0" y2="807.0" stroke="#94a3b8" stroke-width="1.5"/><text x="350.0" y="821.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="350.0" dy="0">0</tspan></text><line x1="449.0" y1="799.0" x2="449.0" y2="807.0" stroke="#94a3b8" stroke-width="1.5"/><text x="449.0" y="821.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="449.0" dy="0">3</tspan></text><line x1="548.0" y1="799.0" x2="548.0" y2="807.0" stroke="#94a3b8" stroke-width="1.5"/><text x="548.0" y="821.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="548.0" dy="0">6</tspan></text><line x1="647.0" y1="799.0" x2="647.0" y2="807.0" stroke="#94a3b8" stroke-width="1.5"/><text x="647.0" y="821.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="647.0" dy="0">9</tspan></text><line x1="746.0" y1="799.0" x2="746.0" y2="807.0" stroke="#94a3b8" stroke-width="1.5"/><text x="746.0" y="821.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="746.0" dy="0">12</tspan></text><line x1="845.0" y1="799.0" x2="845.0" y2="807.0" stroke="#94a3b8" stroke-width="1.5"/><text x="845.0" y="821.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="845.0" dy="0">15</tspan></text><line x1="944.0" y1="799.0" x2="944.0" y2="807.0" stroke="#94a3b8" stroke-width="1.5"/><text x="944.0" y="821.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="944.0" dy="0">18</tspan></text><text x="944.0" y="837.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="300"><tspan x="944.0" dy="0">meses de edad</tspan></text><line x1="416.0" y1="683.0" x2="416.0" y2="803.0" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4"/><rect x="378.3" y="666.0" width="75.4" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="681.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ 2 MESES</tspan></text><text x="40.0" y="883.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="893.0" width="920.0" height="88.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="941.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="896.0" width="144.0" height="82.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="932.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Iniciar precozmente</tspan><tspan x="285.0" dy="17">TAR</tspan></text><text x="435.0" y="932.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Solicitar recuento</tspan><tspan x="435.0" dy="17">de linfocitos CD4</tspan></text><text x="585.0" y="932.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Iniciar TAR sólo si</tspan><tspan x="585.0" dy="17">está sintomático</tspan></text><text x="735.0" y="932.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Programar TAR al</tspan><tspan x="735.0" dy="17">año de edad</tspan></text><text x="885.0" y="915.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Esperar a los 18</tspan><tspan x="885.0" dy="17">meses para</tspan><tspan x="885.0" dy="17">confirmar con</tspan><tspan x="885.0" dy="17">ELISA</tspan></text><rect x="40.0" y="981.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="981.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1010.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Para?</tspan></text><text x="285.0" y="1010.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: todos los lactantes</tspan></text><text x="435.0" y="1010.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no decide el inicio</tspan></text><text x="585.0" y="1010.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: progresa rápido</tspan></text><text x="735.0" y="1010.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: demasiado tarde</tspan></text><text x="885.0" y="1002.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: ya está</tspan><tspan x="885.0" dy="16">diagnosticado</tspan></text><rect x="40.0" y="893.0" width="920.0" height="138.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1055.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1083.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1105.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• TAR inicial del lactante: basado en dolutegravir (dosis por peso) según OMS 2021.</tspan><tspan x="58.0" dy="18">• CD4 y carga viral sirven para el seguimiento, no para decidir el inicio.</tspan><tspan x="58.0" dy="18">• Profilaxis con cotrimoxazol desde las 6 semanas.</tspan></text><text x="58.0" y="1163.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, guías consolidadas de VIH (2021; act. 2025); MINSA Perú, NTS de VIH pediátrico.</tspan></text></svg>