<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1071" viewBox="0 0 1000 1071" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="XABCDE: la hemorragia que desangra va antes que la vía aérea"><title>XABCDE: la hemorragia que desangra va antes que la vía aérea</title><rect x="0.75" y="0.75" width="998.5" height="1069.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Trauma · evaluación primaria XABCDE</tspan></text><rect x="427.7" y="32.0" width="101.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="478.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="85"><tspan x="478.3" dy="0">CIRUGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Evaluación primaria XABCDE</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">X = hemorragia exanguinante externa: se controla antes que todo lo demás.</tspan><tspan x="58.0" dy="17">Luego A, B, C, D y E en ese orden.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 50 años, accidente de tránsito</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">PA 75/60, FC 120, SatO₂ 90 %, pálido y desorientado.</tspan><tspan x="640.0" dy="16">Sangrado rutilante activo por herida en el muslo</tspan><tspan x="640.0" dy="16">derecho.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SE REVISA Y EN QUÉ ORDEN</tspan></text><rect x="40.0" y="285.0" width="440.0" height="400.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="295.0" width="175.4" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">PRIORIDADES EN EL CUERPO</tspan></text><g transform="translate(162.0,317.0) scale(0.78)"><circle cx="120" cy="40" r="28" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M110 66 H130 V80 H110 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 80 H170 L176 170 H64 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M64 170 H176 L170 240 H70 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 240 H170 L164 268 H76 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 84 L50 92 L36 170 L54 174 L66 120 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M36 170 L54 174 L46 238 L28 236 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="37" cy="250" rx="10" ry="15" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M76 268 H118 L114 360 H84 Z" fill="#fecaca" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M84 360 H114 L108 418 H90 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="98" cy="426" rx="15" ry="7" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M170.0 84 L190.0 92 L204.0 170 L186.0 174 L174.0 120 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M204.0 170 L186.0 174 L194.0 238 L212.0 236 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="203.0" cy="250.0" rx="10.0" ry="15.0" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M164.0 268 H122.0 L126.0 360 H156.0 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M156.0 360 H126.0 L132.0 418 H150.0 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="142.0" cy="426.0" rx="15.0" ry="7.0" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="110" cy="36" r="3" fill="#334155" stroke="none" stroke-width="0" /><circle cx="130" cy="36" r="3" fill="#334155" stroke="none" stroke-width="0" /><path d="M112 52 Q120 57 128 52" fill="none" stroke="#9a6b52" stroke-width="1.6"/><path d="M74 290 H122" fill="none" stroke="#1f2937" stroke-width="9" stroke-linejoin="round" /><path d="M84 316 L90 334" fill="none" stroke="#dc2626" stroke-width="5" stroke-linejoin="round" /><circle cx="92" cy="338" r="2.5" fill="#dc2626" stroke="none" stroke-width="0" /><circle cx="97" cy="344" r="2.5" fill="#dc2626" stroke="none" stroke-width="0" /><circle cx="102" cy="350" r="2.5" fill="#dc2626" stroke="none" stroke-width="0" /><circle cx="60" cy="300" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="60" y="304" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">X</text><circle cx="150" cy="58" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="150" y="62" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">A</text><circle cx="150" cy="120" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="150" y="124" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">B</text><circle cx="150" cy="200" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="150" y="204" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">C</text><circle cx="96" cy="26" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="96" y="30" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">D</text><circle cx="200" cy="400" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="200" y="404" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">E</text><text x="4" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">D</text><text x="236" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">I</text></g><rect x="48.0" y="652.0" width="424.0" height="27.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0"/><text x="260.0" y="673.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="410"><tspan x="260.0" dy="0">Banda negra: torniquete 5-7 cm por encima de la herida del muslo derecho.</tspan></text><rect x="500.0" y="285.0" width="460.0" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="501.0" y="286.0" width="6.0" height="67.0" rx="3" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="518.0" y="309.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">1. X: hemorragia exanguinante</tspan></text><text x="518.0" y="330.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Torniquete o compresión directa ya.</tspan></text><rect x="860.2" y="274.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="905.6" y="289.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="905.6" dy="0">◆ ESTE CASO</tspan></text><rect x="500.0" y="364.0" width="460.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="501.0" y="365.0" width="6.0" height="67.0" rx="3" fill="#94a3b8" stroke="none" stroke-width="1.5"/><text x="518.0" y="388.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">2. A: vía aérea con control cervical</tspan></text><text x="518.0" y="409.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Permeable: habla, aunque desorientado.</tspan></text><rect x="500.0" y="443.0" width="460.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="501.0" y="444.0" width="6.0" height="67.0" rx="3" fill="#94a3b8" stroke="none" stroke-width="1.5"/><text x="518.0" y="467.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">3. B: respiración</tspan></text><text x="518.0" y="488.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Oxígeno; buscar neumotórax.</tspan></text><rect x="500.0" y="522.0" width="460.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="501.0" y="523.0" width="6.0" height="67.0" rx="3" fill="#94a3b8" stroke="none" stroke-width="1.5"/><text x="518.0" y="546.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">4. C: circulación</tspan></text><text x="518.0" y="567.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">2 vías, cristaloides tibios y sangre.</tspan></text><rect x="500.0" y="601.0" width="460.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="501.0" y="602.0" width="6.0" height="67.0" rx="3" fill="#94a3b8" stroke="none" stroke-width="1.5"/><text x="518.0" y="625.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">5. D y E: neurológico y exposición</tspan></text><text x="518.0" y="646.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Glasgow, pupilas; desvestir y evitar hipotermia.</tspan></text><rect x="40.0" y="699.0" width="920.0" height="78.0" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="60.0" y="725.0" font-size="13" font-weight="800" font-style="normal" fill="#92400e" text-anchor="start" data-max="700"><tspan x="60.0" dy="0">Cómo se coloca el torniquete</tspan></text><text x="60.0" y="745.0" font-size="11.5" font-weight="500" font-style="normal" fill="#78350f" text-anchor="start" data-max="700"><tspan x="60.0" dy="0">5-7 cm por encima de la herida, nunca sobre una articulación; ajustar hasta que pare el sangrado.</tspan><tspan x="60.0" dy="16">Anotar la hora. Puede mantenerse hasta 2 h con poco riesgo.</tspan></text><text x="40.0" y="817.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="827.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="849.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Cristaloides</tspan></text><text x="491.2" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Glasgow y collarín</tspan></text><rect x="588.0" y="830.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="678.8" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Torniquete</tspan></text><text x="866.2" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Vía aérea</tspan></text><rect x="40.0" y="864.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="588.0" y="864.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="885.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Letra</tspan></text><text x="303.8" y="885.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">C</tspan></text><text x="491.2" y="885.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">D y A</tspan></text><text x="678.8" y="885.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">X: primero</tspan></text><text x="866.2" y="885.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">A</tspan></text><rect x="40.0" y="827.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="922.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="950.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="972.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Sangrado arterial de un miembro que no se controla con presión: torniquete por encima de la herida.</tspan><tspan x="58.0" dy="18">• Anotar la hora de colocación; no aflojarlo hasta el quirófano.</tspan><tspan x="58.0" dy="18">• Después: vía aérea con control cervical, respiración, circulación (2 vías, sangre), neurológico y exposición.</tspan></text><text x="58.0" y="1030.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ATLS 11.ª ed. (2025); PHTLS 10.ª ed.</tspan></text></svg>