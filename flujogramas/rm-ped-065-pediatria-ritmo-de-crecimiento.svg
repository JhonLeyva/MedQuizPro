<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1092" viewBox="0 0 1000 1092" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Un lactante que sube del percentil 10-25 al 50 tiene un ritmo de crecimiento normal"><title>Un lactante que sube del percentil 10-25 al 50 tiene un ritmo de crecimiento normal</title><rect x="0.75" y="0.75" width="998.5" height="1090.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · ritmo de crecimiento</tspan></text><rect x="385.9" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="435.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="435.0" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ritmo de crecimiento</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se juzga por la trayectoria entre controles, no por un punto aislado.</tspan><tspan x="58.0" dy="17">Se evalúa con los patrones OMS 2006, basados en niños amamantados.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 8 meses</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Nacido a término con 2700 g; lactancia materna</tspan><tspan x="640.0" dy="16">exclusiva.</tspan><tspan x="640.0" dy="16">En su segundo control, el peso está en el percentil 50.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TRAYECTORIA DEL PESO: ASCENSO, CANAL CONSTANTE Y DESCENSO</tspan></text><rect x="40.0" y="285.0" width="540.0" height="340.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="98.0" y="305.0" width="464.0" height="272.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="0"/><text x="330.0" y="321.0" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="458"><tspan x="330.0" dy="0"></tspan></text><line x1="98.0" y1="568.8" x2="562.0" y2="568.8" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="572.8" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">p3</tspan></text><line x1="98.0" y1="536.2" x2="562.0" y2="536.2" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="540.2" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">p15</tspan></text><line x1="98.0" y1="441.0" x2="562.0" y2="441.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="445.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">p50</tspan></text><line x1="98.0" y1="345.8" x2="562.0" y2="345.8" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="349.8" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">p85</tspan></text><line x1="98.0" y1="313.2" x2="562.0" y2="313.2" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="317.2" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">p97</tspan></text><line x1="98.0" y1="577.0" x2="98.0" y2="582.0" stroke="#94a3b8" stroke-width="1.5"/><text x="98.0" y="596.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="98.0" dy="0">Nacer</tspan></text><line x1="214.0" y1="577.0" x2="214.0" y2="582.0" stroke="#94a3b8" stroke-width="1.5"/><text x="214.0" y="596.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="214.0" dy="0">2</tspan></text><line x1="330.0" y1="577.0" x2="330.0" y2="582.0" stroke="#94a3b8" stroke-width="1.5"/><text x="330.0" y="596.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="330.0" dy="0">4</tspan></text><line x1="446.0" y1="577.0" x2="446.0" y2="582.0" stroke="#94a3b8" stroke-width="1.5"/><text x="446.0" y="596.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="446.0" dy="0">6</tspan></text><line x1="562.0" y1="577.0" x2="562.0" y2="582.0" stroke="#94a3b8" stroke-width="1.5"/><text x="562.0" y="596.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="562.0" dy="0">8</tspan></text><line x1="98.0" y1="577.0" x2="562.0" y2="577.0" stroke="#94a3b8" stroke-width="1.5"/><line x1="98.0" y1="305.0" x2="98.0" y2="577.0" stroke="#94a3b8" stroke-width="1.5"/><text x="330.0" y="615.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="464"><tspan x="330.0" dy="0">Edad (meses)</tspan></text><text x="56.0" y="441.0" transform="rotate(-90 56.0 441.0)" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Percentil del peso</text><polyline points="98.0,530.8 562.0,441.0" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="412.0" y1="339.0" x2="434.0" y2="339.0" stroke="#0f766e" stroke-width="3"/><text x="440.0" y="343.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="120"><tspan x="440.0" dy="0">Este lactante</tspan></text><polyline points="98.0,530.8 562.0,530.8" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="412.0" y1="357.0" x2="434.0" y2="357.0" stroke="#94a3b8" stroke-width="3"/><text x="440.0" y="361.0" font-size="10.5" font-weight="700" font-style="normal" fill="#94a3b8" text-anchor="start" data-max="120"><tspan x="440.0" dy="0">Canal constante</tspan></text><polyline points="98.0,530.8 562.0,566.1" fill="none" stroke="#dc2626" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="412.0" y1="375.0" x2="434.0" y2="375.0" stroke="#dc2626" stroke-width="3"/><text x="440.0" y="379.0" font-size="10.5" font-weight="700" font-style="normal" fill="#dc2626" text-anchor="start" data-max="120"><tspan x="440.0" dy="0">Cruza hacia abajo</tspan></text><line x1="562.0" y1="441.0" x2="562.0" y2="577.0" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4"/><circle cx="562.0" cy="441.0" r="9" fill="#ea580c" stroke="#ffffff" stroke-width="3"/><rect x="502.0" y="416.0" width="120.0" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="562.0" y="431.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="562.0" dy="0">◆ p50 a los 8 meses</tspan></text><rect x="602.0" y="364.5" width="358.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="617.0" y="388.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Normal</tspan></text><text x="617.0" y="405.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Ascenso o canal estable: ganancia adecuada.</tspan></text><rect x="602.0" y="427.5" width="358.0" height="55.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="617.0" y="451.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">En riesgo</tspan></text><text x="617.0" y="468.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Curva plana o que cruza percentiles hacia abajo.</tspan></text><rect x="602.0" y="490.5" width="358.0" height="55.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="617.0" y="514.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Indeterminado</tspan></text><text x="617.0" y="531.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Solo si falta un control previo para comparar.</tspan></text><rect x="40.0" y="643.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="669.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Del percentil 10-25 al 50 = crecimiento normal</tspan></text><text x="60.0" y="688.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Se trata de una recuperación fisiológica, no de sobrepeso.</tspan></text><text x="40.0" y="755.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="765.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="787.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="787.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Lento</tspan></text><text x="435.0" y="787.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Desacelerado</tspan></text><text x="585.0" y="787.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Indeterminado</tspan></text><rect x="663.0" y="768.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="787.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Normal</tspan></text><text x="885.0" y="787.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">En riesgo</tspan></text><rect x="40.0" y="802.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="802.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="839.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Ritmo de crecimiento?</tspan></text><text x="285.0" y="823.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: supone una</tspan><tspan x="285.0" dy="16">velocidad menor a la</tspan><tspan x="285.0" dy="16">esperada</tspan></text><text x="435.0" y="823.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: supone una</tspan><tspan x="435.0" dy="16">velocidad menor a la</tspan><tspan x="435.0" dy="16">esperada</tspan></text><text x="585.0" y="831.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sería la falta de un</tspan><tspan x="585.0" dy="16">control previo</tspan></text><text x="735.0" y="831.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: ascendió del</tspan><tspan x="735.0" dy="16">percentil 10-25 al 50</tspan></text><text x="885.0" y="831.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: exige curva plana</tspan><tspan x="885.0" dy="16">o descendente</tspan></text><rect x="40.0" y="765.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="892.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="920.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="942.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Un recién nacido a término de 2700 g está entre los percentiles 10 y 25; subir al percentil 50 es ganar peso más rápido que el promedio: crecimiento</tspan><tspan x="58.0" dy="18">   adecuado, con recuperación fisiológica.</tspan><tspan x="58.0" dy="18">• Crecimiento en riesgo: la curva se aplana o desciende, cruza percentiles hacia abajo o la ganancia entre controles es insuficiente.</tspan><tspan x="58.0" dy="18">• Se usan los puntos de corte de la norma peruana (peso para la edad, talla para la edad y peso para la talla en puntaje Z) junto con la tendencia.</tspan><tspan x="58.0" dy="18">• Alerta: no interpretar como sobrepeso un ascenso de percentil tras un peso de nacimiento bajo.</tspan></text><text x="58.0" y="1036.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA, NTS 137-MINSA/2017/DGIESP (control del crecimiento y desarrollo, RM 537-2017/MINSA); OMS, Patrones de crecimiento infantil (2006); Nelson Tratado de</tspan><tspan x="58.0" dy="15">Pediatría 22.ª ed. (2024).</tspan></text></svg>