582.0" stroke="#94a3b8" stroke-width="1.5"/><text x="214.0" y="596.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="214.0" dy="0">3</tspan></text><line x1="330.0" y1="577.0" x2="330.0" y2="582.0" stroke="#94a3b8" stroke-width="1.5"/><text x="330.0" y="596.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="330.0" dy="0">6</tspan></text><line x1="446.0" y1="577.0" x2="446.0" y2="582.0" stroke="#94a3b8" stroke-width="1.5"/><text x="446.0" y="596.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="446.0" dy="0">9</tspan></text><line x1="562.0" y1="577.0" x2="562.0" y2="582.0" stroke="#94a3b8" stroke-width="1.5"/><text x="562.0" y="596.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="562.0" dy="0">12</tspan></text><line x1="98.0" y1="577.0" x2="562.0" y2="577.0" stroke="#94a3b8" stroke-width="1.5"/><line x1="98.0" y1="305.0" x2="98.0" y2="577.0" stroke="#94a3b8" stroke-width="1.5"/><text x="330.0" y="615.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="464"><tspan x="330.0" dy="0">Días de evolución</tspan></text><text x="56.0" y="441.0" transform="rotate(-90 56.0 441.0)" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Temperatura (°C)</text><polyline points="98.0,522.6 128.9,522.6 136.7,359.4 148.3,522.6 244.9,522.6 252.7,359.4 264.3,522.6 360.9,522.6 368.7,359.4 380.3,522.6 476.9,522.6 484.7,359.4 496.3,522.6 562.0,522.6" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="412.0" y1="339.0" x2="434.0" y2="339.0" stroke="#0f766e" stroke-width="3"/><text x="440.0" y="343.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="120"><tspan x="440.0" dy="0">Cuartana (P. malariae)</tspan></text><polyline points="98.0,522.6 167.6,522.6 175.3,413.8 186.9,522.6 244.9,522.6 252.7,413.8 264.3,522.6 322.3,522.6 330.0,413.8 341.6,522.6 399.6,522.6 407.3,413.8 418.9,522.6 562.0,522.6" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="412.0" y1="357.0" x2="434.0" y2="357.0" stroke="#94a3b8" stroke-width="3"/><text x="440.0" y="361.0" font-size="10.5" font-weight="700" font-style="normal" fill="#94a3b8" text-anchor="start" data-max="120"><tspan x="440.0" dy="0">Terciana (vivax, ovale)</tspan></text><line x1="252.7" y1="359.4" x2="252.7" y2="577.0" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4"/><circle cx="252.7" cy="359.4" r="9" fill="#ea580c" stroke="#ffffff" stroke-width="3"/><rect x="167.7" y="334.4" width="169.9" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="252.7" y="349.4" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="252.7" dy="0">◆ Cuartana: acceso cada 72 h</tspan></text><rect x="602.0" y="364.5" width="358.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="617.0" y="388.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Cuartana</tspan></text><text x="617.0" y="405.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">P. malariae: ciclo de 72 h, acceso cada cuarto día.</tspan></text><rect x="602.0" y="427.5" width="358.0" height="55.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="617.0" y="451.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Terciana</tspan></text><text x="617.0" y="468.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">P. vivax y P. ovale: ciclo de 48 h, acceso cada tercer día.</tspan></text><rect x="602.0" y="490.5" width="358.0" height="55.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="617.0" y="514.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Falciparum</tspan></text><text x="617.0" y="531.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Accesos irregulares; causa la malaria grave.</tspan></text><rect x="40.0" y="643.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="669.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Cuartana = Plasmodium malariae</tspan></text><text x="60.0" y="688.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">«Difficile» no es un Plasmodium.</tspan></text><text x="40.0" y="755.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="765.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="787.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="768.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="787.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Malariae</tspan></text><text x="435.0" y="787.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Difficile</tspan></text><text x="585.0" y="787.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Ovale</tspan></text><text x="735.0" y="787.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Falciparum</tspan></text><text x="885.0" y="787.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Vivax</tspan></text><rect x="40.0" y="802.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="802.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="831.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Especie con fiebre</tspan><tspan x="54.0" dy="16">cuartana?</tspan></text><text x="285.0" y="831.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: ciclo de 72 horas,</tspan><tspan x="285.0" dy="16">acceso cada cuarto día</tspan></text><text x="435.0" y="831.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no es una especie</tspan><tspan x="435.0" dy="16">de Plasmodium</tspan></text><text x="585.0" y="831.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: ciclo de 48 horas,</tspan><tspan x="585.0" dy="16">terciana</tspan></text><text x="735.0" y="823.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: accesos</tspan><tspan x="735.0" dy="16">irregulares, malaria</tspan><tspan x="735.0" dy="16">grave</tspan></text><text x="885.0" y="831.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: ciclo de 48 horas,</tspan><tspan x="885.0" dy="16">terciana</tspan></text><rect x="40.0" y="765.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="892.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="920.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="942.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Terciana (cada 48 h): P. vivax y P. ovale. Cuartana (cada 72 h): P. malariae. P. falciparum da accesos irregulares y causa la malaria grave.</tspan><tspan x="58.0" dy="18">• «Difficile» no es un Plasmodium: es Clostridioides difficile.</tspan><tspan x="58.0" dy="18">• P. malariae puede persistir años en la sangre y causar síndrome nefrótico por inmunocomplejos.</tspan><tspan x="58.0" dy="18">• Alerta: cefalea, alteración de conciencia, anemia o insuficiencia renal indican malaria grave por P. falciparum; es una urgencia.</tspan></text><text x="58.0" y="1018.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, Guidelines for Malaria (2025); CDC, malaria (2024); MINSA, NTS 054-MINSA/DGSP-V.01.</tspan></text></svg>