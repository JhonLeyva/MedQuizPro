<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1304" viewBox="0 0 1000 1304" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Gestante de 32 semanas con feto bajo el percentil 10, líquido amniótico y Doppler umbilical normales: feto pequeño para la edad, control en dos semanas"><title>Gestante de 32 semanas con feto bajo el percentil 10, líquido amniótico y Doppler umbilical normales: feto pequeño para la edad, control en dos semanas</title><rect x="0.75" y="0.75" width="998.5" height="1302.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Restricción del crecimiento fetal</tspan></text><rect x="391.4" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="478.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="478.6" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Feto pequeño frente a restricción del crecimiento</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Peso &lt; p10 con Doppler y líquido normales (y &gt; p3): feto pequeño para la edad</tspan><tspan x="58.0" dy="17">(constitucional), bajo riesgo.</tspan><tspan x="58.0" dy="17">Restricción (RCIU): &lt; p3, o &lt; p10 con Doppler alterado. Esa sí obliga a vigilancia estrecha y</tspan><tspan x="58.0" dy="17">a veces a terminar.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante de 32 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Altura uterina menor a la esperada.</tspan><tspan x="640.0" dy="16">Eco: peso &lt; p10, líquido normal, Doppler de la arteria</tspan><tspan x="640.0" dy="16">umbilical normal.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿DÓNDE CAE EL PESO DE ESTE FETO?</tspan></text><rect x="40.0" y="285.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="311.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Percentil del peso fetal</tspan></text><text x="60.0" y="330.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">&lt; p3, o &lt; p10 con Doppler alterado = restricción; p3-p10 con Doppler normal = pequeño.</tspan></text><rect x="70.0" y="394.0" width="51.6" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="95.8" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="42"><tspan x="95.8" dy="0">&lt; p3</tspan></text><rect x="121.6" y="394.0" width="120.4" height="40.0" rx="6" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/><text x="181.8" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#c2410c" text-anchor="middle" data-max="110"><tspan x="181.8" dy="0">Pequeño (PEG)</tspan></text><rect x="242.0" y="394.0" width="688.0" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="586.0" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="678"><tspan x="586.0" dy="0">Normal</tspan></text><line x1="121.6" y1="434.0" x2="121.6" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="121.6" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="121.6" dy="0">p3</tspan></text><line x1="242.0" y1="434.0" x2="242.0" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="242.0" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="242.0" dy="0">p10</tspan></text><polygon points="181.4,380.0 199.4,380.0 190.4,392.0" fill="#ea580c"/><rect x="124.2" y="354.0" width="132.4" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.4" y="369.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="120"><tspan x="190.4" dy="0">◆ ESTE CASO: &lt; p10</tspan></text><text x="40.0" y="502.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LO QUE DECIDE</tspan></text><rect x="40.0" y="512.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="513.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="536.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Doppler umbilical normal</tspan></text><text x="58.0" y="557.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">La placenta funciona</tspan></text><rect x="351.3" y="512.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="352.3" y="513.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="369.3" y="536.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Líquido normal</tspan></text><text x="369.3" y="557.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">No hay redistribución</tspan></text><rect x="662.7" y="512.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="663.7" y="513.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="680.7" y="536.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Control en 2 semanas</tspan></text><text x="680.7" y="557.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Crecimiento y Doppler</tspan></text><text x="40.0" y="621.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="633.0" width="920.0" height="327.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="647.0" width="653.4" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="382.7" y="667.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="382.7" dy="0">PEQUEÑO PARA LA EDAD O RESTRICCIÓN DEL CRECIMIENTO (CONSENSO DELPHI, ISUOG)</tspan></text><text x="725.4" y="658.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="217"><tspan x="725.4" dy="0">El peso solo no basta: importa el</tspan><tspan x="725.4" dy="17">percentil y el Doppler.</tspan></text><rect x="56.0" y="711.0" width="288.0" height="98.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="57.2" y="712.2" width="285.6" height="63.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="200.0" y="739.0" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="272"><tspan x="200.0" dy="0">P3-P10 + DOPPLER NORMAL</tspan></text><text x="200.0" y="759.0" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="264"><tspan x="200.0" dy="0">Pequeño para la edad</tspan></text><circle cx="72.0" cy="784.0" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="82.0" y="788.0" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="250"><tspan x="82.0" dy="0">Constitucional; control cada 2 semanas</tspan></text><rect x="154.6" y="700.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="200.0" y="715.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="200.0" dy="0">◆ ESTE CASO</tspan></text><rect x="356.0" y="711.0" width="288.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="356.6" y="711.6" width="286.8" height="63.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="500.0" y="739.0" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="272"><tspan x="500.0" dy="0">&lt; P3 O DOPPLER ALTERADO</tspan></text><text x="500.0" y="759.0" font-size="14" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="264"><tspan x="500.0" dy="0">Restricción del crecimiento</tspan></text><circle cx="372.0" cy="784.0" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="382.0" y="788.0" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="382.0" dy="0">Vigilancia intensiva</tspan></text><rect x="656.0" y="711.0" width="288.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="656.6" y="711.6" width="286.8" height="63.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="800.0" y="739.0" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="272"><tspan x="800.0" dy="0">DOPPLER UMBILICAL AUSENTE O REVERSO</tspan></text><text x="800.0" y="759.0" font-size="14" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="264"><tspan x="800.0" dy="0">Restricción grave</tspan></text><circle cx="672.0" cy="784.0" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="682.0" y="788.0" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="682.0" dy="0">Corticoides y terminar según la edad</tspan></text><text x="56.0" y="839.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="848.0" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="863.0" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="863.0" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Peso &lt; p10</tspan></text><rect x="56.0" y="870.0" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="885.0" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="885.0" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Líquido y Doppler umbilical normales</tspan></text><rect x="56.0" y="907.0" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="930.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Ecografía y Doppler cada 2 semanas; terminar a las 37-38 semanas si sigue igual.</tspan></text><text x="40.0" y="1000.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1010.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1049.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1041.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Realizar un perfil</tspan><tspan x="285.0" dy="17">biofísico</tspan></text><text x="435.0" y="1032.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Estimular la</tspan><tspan x="435.0" dy="17">maduración</tspan><tspan x="435.0" dy="17">pulmonar</tspan></text><text x="585.0" y="1041.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Terminar la</tspan><tspan x="585.0" dy="17">gestación</tspan></text><rect x="663.0" y="1013.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="1041.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Controlarla en dos</tspan><tspan x="735.0" dy="17">semanas</tspan></text><text x="885.0" y="1041.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Iniciar sulfato de</tspan><tspan x="885.0" dy="17">magnesio</tspan></text><rect x="40.0" y="1081.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="1081.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1110.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Manejo?</tspan></text><text x="285.0" y="1102.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no hay indicación</tspan><tspan x="285.0" dy="16">urgente</tspan></text><text x="435.0" y="1102.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no hay parto</tspan><tspan x="435.0" dy="16">inminente</tspan></text><text x="585.0" y="1110.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: el feto está bien</tspan></text><text x="735.0" y="1102.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: pequeño con</tspan><tspan x="735.0" dy="16">Doppler normal</tspan></text><text x="885.0" y="1102.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no es &lt; 32 sem ni</tspan><tspan x="885.0" dy="16">hay parto</tspan></text><rect x="40.0" y="1010.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1155.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1183.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1205.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Control ecográfico de crecimiento y Doppler cada 2 semanas.</tspan><tspan x="58.0" dy="18">• Si aparece Doppler alterado o cae bajo p3: RCIU → vigilancia intensiva, corticoides según la edad y decidir la terminación.</tspan><tspan x="58.0" dy="18">• Terminar a las 37-38 semanas si sigue como pequeño para la edad.</tspan></text><text x="58.0" y="1263.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ISUOG, restricción del crecimiento fetal (2020); FIGO (2021); SMFM (2020; act. 2024); ACOG n.º 227 (2021).</tspan></text></svg>