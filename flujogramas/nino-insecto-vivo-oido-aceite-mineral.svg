<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="929" viewBox="0 0 1000 929" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Niño con un insecto vivo moviéndose en el conducto auditivo: primero inmovilizarlo instilando aceite mineral, luego extraerlo"><title>Niño con un insecto vivo moviéndose en el conducto auditivo: primero inmovilizarlo instilando aceite mineral, luego extraerlo</title><rect x="0.75" y="0.75" width="998.5" height="927.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Cuerpos extraños en el oído</tspan></text><rect x="367.5" y="32.0" width="142.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="438.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="126"><tspan x="438.5" dy="0">OFTALMOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cuerpo extraño en el oído</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El manejo depende del tipo: vivo, pila de botón, vegetal o inerte.</tspan><tspan x="58.0" dy="17">Insecto vivo: primero se mata o inmoviliza (aceite mineral o lidocaína) para que no dañe el</tspan><tspan x="58.0" dy="17">tímpano al moverse; luego se extrae.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 6 años, 3 horas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dolor de oído.</tspan><tspan x="640.0" dy="16">Otoscopia: insecto vivo que se mueve en el conducto.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CUERPO EXTRAÑO EN EL OÍDO: ¿QUÉ HACER PRIMERO?</tspan></text><rect x="40.0" y="269.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="150"><tspan x="54.0" dy="0">QUÉ ES</tspan></text><text x="397.5" y="291.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="355"><tspan x="397.5" dy="0">Primer paso</tspan></text><text x="772.5" y="291.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="355"><tspan x="772.5" dy="0">Lo que NO hacer</tspan></text><rect x="40.0" y="309.0" width="164.0" height="57.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="335.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="142"><tspan x="54.0" dy="0">Insecto vivo</tspan></text><text x="54.0" y="352.0" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="142"><tspan x="54.0" dy="0">Este caso</tspan></text><rect x="213.0" y="309.0" width="369.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="225.0" y="334.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="351"><tspan x="225.0" dy="0">ACEITE MINERAL</tspan></text><text x="225.0" y="350.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="351"><tspan x="225.0" dy="0">Inmovilizar y luego extraer</tspan></text><rect x="481.2" y="298.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="526.6" y="313.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="526.6" dy="0">◆ ESTE CASO</tspan></text><rect x="588.0" y="309.0" width="369.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="600.0" y="334.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="351"><tspan x="600.0" dy="0">Pinza con el insecto vivo</tspan></text><text x="600.0" y="350.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="351"><tspan x="600.0" dy="0">Se mueve y lesiona</tspan></text><rect x="40.0" y="372.0" width="164.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="405.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="142"><tspan x="54.0" dy="0">Pila de botón</tspan></text><rect x="213.0" y="372.0" width="369.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="225.0" y="397.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="351"><tspan x="225.0" dy="0">Extraer ya</tspan></text><text x="225.0" y="413.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="351"><tspan x="225.0" dy="0">Pinza, en seco</tspan></text><rect x="588.0" y="372.0" width="369.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="600.0" y="397.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="351"><tspan x="600.0" dy="0">Lavar</tspan></text><text x="600.0" y="413.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="351"><tspan x="600.0" dy="0">Acelera la quemadura</tspan></text><rect x="40.0" y="435.0" width="164.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="468.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="142"><tspan x="54.0" dy="0">Vegetal (semilla)</tspan></text><rect x="213.0" y="435.0" width="369.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="225.0" y="460.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="351"><tspan x="225.0" dy="0">Pinza o gancho</tspan></text><text x="225.0" y="476.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="351"><tspan x="225.0" dy="0">En seco</tspan></text><rect x="588.0" y="435.0" width="369.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="600.0" y="460.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="351"><tspan x="600.0" dy="0">Lavar</tspan></text><text x="600.0" y="476.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="351"><tspan x="600.0" dy="0">Se hincha con el agua</tspan></text><rect x="40.0" y="498.0" width="164.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="531.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="142"><tspan x="54.0" dy="0">Inerte (cuenta, piedra)</tspan></text><rect x="213.0" y="498.0" width="369.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="225.0" y="523.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="351"><tspan x="225.0" dy="0">Pinza, gancho o lavado</tspan></text><text x="225.0" y="539.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="351"><tspan x="225.0" dy="0">Si el tímpano está íntegro</tspan></text><rect x="588.0" y="498.0" width="369.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="600.0" y="523.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="351"><tspan x="600.0" dy="0">Forzar a ciegas</tspan></text><text x="600.0" y="539.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="351"><tspan x="600.0" dy="0">Lo empuja</tspan></text><text x="44.0" y="577.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Siempre revisar el tímpano al final.</tspan></text><text x="40.0" y="625.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="635.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="674.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="666.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Lavado de oído con</tspan><tspan x="285.0" dy="17">solución salina</tspan></text><text x="435.0" y="657.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Extracción</tspan><tspan x="435.0" dy="17">instrumental con</tspan><tspan x="435.0" dy="17">pinza</tspan></text><rect x="513.0" y="638.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="666.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Instilación ótica de</tspan><tspan x="585.0" dy="17">aceite mineral</tspan></text><text x="735.0" y="666.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Irrigación ótica con</tspan><tspan x="735.0" dy="17">agua oxigenada</tspan></text><text x="885.0" y="674.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Antibiótico ótico</tspan></text><rect x="40.0" y="706.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="706.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="735.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Manejo inicial?</tspan></text><text x="285.0" y="735.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: primero inmovilizar</tspan></text><text x="435.0" y="735.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: primero inmovilizar</tspan></text><text x="585.0" y="735.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: lo inmoviliza</tspan></text><text x="735.0" y="727.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: irrita y no</tspan><tspan x="735.0" dy="16">inmoviliza</tspan></text><text x="885.0" y="735.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no hay infección</tspan></text><rect x="40.0" y="635.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="780.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="808.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="830.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Aceite mineral (o lidocaína 2 %) en el conducto; esperar a que deje de moverse.</tspan><tspan x="58.0" dy="18">• Extraer con pinza, gancho o lavado (si el tímpano está íntegro).</tspan><tspan x="58.0" dy="18">• Revisar el conducto y el tímpano al final.</tspan></text><text x="58.0" y="888.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAO-HNS; AAFP, cuerpos extraños en oído y nariz (2021).</tspan></text></svg>