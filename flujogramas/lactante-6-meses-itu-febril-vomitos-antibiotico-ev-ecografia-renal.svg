<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1231" viewBox="0 0 1000 1231" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Lactante con infección urinaria febril, vómitos y mal estado: antibiótico EV y ecografía renal"><title>Lactante con infección urinaria febril, vómitos y mal estado: antibiótico EV y ecografía renal</title><rect x="0.75" y="0.75" width="998.5" height="1229.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Nefrología pediátrica · infección urinaria febril</tspan></text><rect x="471.4" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="527.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="527.9" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección urinaria febril en el lactante</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La fiebre alta con PCR y procalcitonina elevadas indica pielonefritis.</tspan><tspan x="58.0" dy="17">El riñón del lactante se cicatriza con facilidad: tratar pronto y estudiar la vía urinaria.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 6 meses</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Fiebre de 39 °C por 24 h, vómitos repetidos y rechazo</tspan><tspan x="640.0" dy="16">de la lactancia.</tspan><tspan x="640.0" dy="16">Irritable; leucocitosis, PCR y procalcitonina altas; orina</tspan><tspan x="640.0" dy="16">compatible con ITU.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿DÓNDE Y CÓMO TRATAR?</tspan></text><polygon points="220,336.0 260,301.0 740,301.0 780,336.0 740,371.0 260,371.0" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><circle cx="282.0" cy="336.0" r="13" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="282.0" y="341.5" font-size="16" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="282.0" dy="0">?</tspan></text><text x="525.0" y="341.0" font-size="13.5" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="525.0" dy="0">Lactante con ITU febril: ¿tolera la vía oral y luce bien?</tspan></text><line x1="500.0" y1="371.0" x2="500.0" y2="391.0" stroke="#0f766e" stroke-width="2"/><line x1="190.0" y1="391.0" x2="662.0" y2="391.0" stroke="#0f766e" stroke-width="2"/><line x1="190.0" y1="391.0" x2="190.0" y2="420.0" stroke="#0f766e" stroke-width="2"/><polygon points="185.0,419.0 195.0,419.0 190.0,427.0" fill="#0f766e"/><line x1="662.0" y1="391.0" x2="662.0" y2="420.0" stroke="#ea580c" stroke-width="2"/><polygon points="657.0,419.0 667.0,419.0 662.0,427.0" fill="#ea580c"/><rect x="115.6" y="399.0" width="148.8" height="20.0" rx="10" fill="#64748b" stroke="none" stroke-width="1.5"/><text x="190.0" y="413.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">Sí: buen estado y tolera</tspan></text><rect x="554.6" y="399.0" width="214.8" height="20.0" rx="10" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="662.0" y="413.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="662.0" dy="0">No: vómitos, rechazo, luce enfermo</tspan></text><rect x="40.0" y="427.0" width="300.0" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="428.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="451.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="270"><tspan x="58.0" dy="0">Antibiótico oral ambulatorio</tspan></text><text x="58.0" y="472.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="270"><tspan x="58.0" dy="0">Cefalosporina oral por 7-10 días.</tspan><tspan x="58.0" dy="16">Control en 48 h.</tspan></text><rect x="364.0" y="427.0" width="596.0" height="380.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="844.6" y="416.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="431.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><text x="382.0" y="453.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">Antibiótico EV + ecografía renal</tspan></text><text x="382.0" y="475.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">Urocultivo por sonda o punción y luego ceftriaxona EV sin esperar el resultado.</tspan><tspan x="382.0" dy="16">Ecografía renal y de vías urinarias para buscar obstrucción o malformación.</tspan></text><g transform="translate(527.0,511.0) scale(0.9)"><path d="M50 40 C20 50 20 130 50 140 C70 146 84 120 76 90 C84 60 70 34 50 40 Z" fill="#fca5a5" stroke="#9f1239" stroke-width="2" stroke-linejoin="round" /><path d="M250 40 C280 50 280 130 250 140 C230 146 216 120 224 90 C216 60 230 34 250 40 Z" fill="#fca5a5" stroke="#9f1239" stroke-width="2" stroke-linejoin="round" /><path d="M76 96 C90 150 118 200 136 232" fill="none" stroke="#fde68a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M224 96 C210 150 182 200 164 232" fill="none" stroke="#fde68a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="150" cy="244" rx="44" ry="30" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" /><text x="150" y="250" font-size="10" font-weight="800" fill="#a16207" text-anchor="middle" data-max="0">vejiga</text><text x="10" y="16" font-size="11" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">D</text><text x="290" y="16" font-size="11" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">I</text><path d="M50 40 C20 50 20 130 50 140" fill="none" stroke="#ea580c" stroke-width="5" stroke-linejoin="round" /><circle cx="44" cy="70" r="4" fill="#ea580c" stroke="none" stroke-width="0" /><circle cx="54" cy="90" r="4" fill="#ea580c" stroke="none" stroke-width="0" /><circle cx="46" cy="110" r="4" fill="#ea580c" stroke="none" stroke-width="0" /><circle cx="56" cy="124" r="4" fill="#ea580c" stroke="none" stroke-width="0" /></g><text x="382.0" y="789.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">La infección sube al riñón (pielonefritis); la ecografía busca dilatación u obstrucción.</tspan></text><text x="40.0" y="841.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SIGUE</tspan></text><rect x="40.0" y="851.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="852.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="875.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Afebril y tolera en 48-72 h</tspan></text><text x="58.0" y="896.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Pasar a vía oral hasta completar 7-14 días.</tspan></text><rect x="237.5" y="840.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="282.9" y="855.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="282.9" dy="0">◆ ESTE CASO</tspan></text><rect x="351.3" y="851.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="852.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="875.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Urocultivo</tspan></text><text x="369.3" y="896.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Ajustar el antibiótico al antibiograma.</tspan></text><rect x="662.7" y="851.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="852.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="875.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Cistouretrografía</tspan></text><text x="680.7" y="896.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Si la ecografía es anormal o la ITU se repite.</tspan></text><text x="40.0" y="960.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="970.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1001.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="1001.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Esperar cultivos</tspan></text><rect x="400.5" y="973.0" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="1001.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Antibiótico EV + ecografía</tspan></text><text x="678.8" y="992.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Observar con</tspan><tspan x="678.8" dy="17">sintomáticos</tspan></text><text x="866.2" y="992.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Antibiótico oral</tspan><tspan x="866.2" dy="17">ambulatorio</tspan></text><rect x="40.0" y="1024.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="1024.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1045.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="1045.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Retrasa el antibiótico</tspan></text><text x="491.2" y="1045.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Ninguno</tspan></text><text x="678.8" y="1045.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Riesgo de sepsis y cicatriz</tspan></text><text x="866.2" y="1045.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Vomita: no tolera la vía oral</tspan></text><rect x="40.0" y="970.0" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1082.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1110.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1132.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• No tolera la vía oral y luce enfermo: hospitalizar y dar antibiótico EV (ceftriaxona o similar) tras el urocultivo.</tspan><tspan x="58.0" dy="18">• Primera ITU febril en el lactante: ecografía renal y de vías urinarias.</tspan><tspan x="58.0" dy="18">• Esperar el cultivo para tratar retrasa el antibiótico y aumenta las cicatrices renales.</tspan></text><text x="58.0" y="1190.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAP, guía de ITU febril (2011, reafirmada 2016); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>