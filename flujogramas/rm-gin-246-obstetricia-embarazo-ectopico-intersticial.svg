<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1116" viewBox="0 0 1000 1116" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El embarazo ectópico intersticial se rompe tarde, entre las 8 y las 16 semanas, con hemorragia masiva"><title>El embarazo ectópico intersticial se rompe tarde, entre las 8 y las 16 semanas, con hemorragia masiva</title><rect x="0.75" y="0.75" width="998.5" height="1114.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · embarazo ectópico intersticial</tspan></text><rect x="453.6" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="533.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="533.4" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Embarazo ectópico</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Más de 95 % se implanta en la trompa, sobre todo en la ampolla.</tspan><tspan x="58.0" dy="17">El resto, en cuerno uterino, cérvix, cicatriz de cesárea, ovario o abdomen.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de localización</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué localización, si no se diagnostica, se rompe</tspan><tspan x="640.0" dy="16">después de 8 a 16 semanas de amenorrea?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SEMANAS DE AMENORREA EN QUE SE ROMPE CADA LOCALIZACIÓN TUBARIA</tspan></text><line x1="290.0" y1="291.0" x2="290.0" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="290.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="290.0" dy="0">4</tspan></text><line x1="382.9" y1="291.0" x2="382.9" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="382.9" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="382.9" dy="0">6</tspan></text><line x1="475.7" y1="291.0" x2="475.7" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="475.7" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="475.7" dy="0">8</tspan></text><line x1="568.6" y1="291.0" x2="568.6" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="568.6" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="568.6" dy="0">10</tspan></text><line x1="661.4" y1="291.0" x2="661.4" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="661.4" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="661.4" dy="0">12</tspan></text><line x1="754.3" y1="291.0" x2="754.3" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="754.3" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="754.3" dy="0">14</tspan></text><line x1="847.1" y1="291.0" x2="847.1" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="847.1" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="847.1" dy="0">16</tspan></text><line x1="940.0" y1="291.0" x2="940.0" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="940.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="940.0" dy="0">18</tspan></text><text x="940.0" y="273.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="end" data-max="60"><tspan x="940.0" dy="0">semanas</tspan></text><rect x="40.0" y="295.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="311.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Ístmico</tspan></text><text x="48.0" y="326.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Trompa más estrecha: rotura precoz</tspan></text><rect x="382.9" y="303.0" width="92.9" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="349.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Ampular</tspan></text><text x="48.0" y="364.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">La más frecuente; rotura antes que la intersticial</tspan></text><rect x="382.9" y="341.0" width="278.6" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><rect x="40.0" y="371.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="387.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Intersticial o cornual</tspan></text><text x="48.0" y="402.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Rotura tardía y hemorragia masiva</tspan></text><rect x="475.7" y="379.0" width="371.4" height="22.0" rx="6" fill="#ea580c" stroke="none" stroke-width="1.5"/><line x1="475.7" y1="293.0" x2="475.7" y2="415.0" stroke="#b91c1c" stroke-width="2.6"/><rect x="437.6" y="415.0" width="76.2" height="22.0" rx="11" fill="#b91c1c" stroke="none" stroke-width="1.5"/><text x="475.7" y="430.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="475.7" dy="0">8 semanas</tspan></text><rect x="40.0" y="461.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="487.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Rotura a las 8 a 16 semanas = ectópico intersticial</tspan></text><text x="60.0" y="506.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El ístmico y el ampular se rompen antes; el ovárico y el abdominal son raros.</tspan></text><text x="40.0" y="567.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LOCALIZACIONES DEL EMBARAZO ECTÓPICO</tspan></text><rect x="40.0" y="579.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="598.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Localización</tspan></text><text x="270.0" y="598.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Frecuencia</tspan></text><text x="620.0" y="598.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Rotura</tspan></text><rect x="40.0" y="608.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="627.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Ampular</tspan></text><text x="270.0" y="627.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">La más frecuente: más de 95 % es tubario</tspan></text><text x="620.0" y="627.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Antes que el intersticial</tspan></text><rect x="40.0" y="637.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="656.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Ístmico</tspan></text><text x="270.0" y="656.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Tubario</tspan></text><text x="620.0" y="656.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Hacia las 6-8 semanas</tspan></text><rect x="40.0" y="666.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="685.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Intersticial</tspan></text><text x="270.0" y="685.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">2-4 %</tspan></text><text x="620.0" y="685.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Tardía: 8 a 16 semanas, con hemorragia masiva</tspan></text><rect x="160.6" y="669.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="206.0" y="684.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="206.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="711.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Clave del banco: C. El comentario del libro ubica la rotura ampular entre las 8 y 12 semanas; la rotura más tardía es la intersticial.</tspan></text><text x="40.0" y="758.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="768.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="790.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="790.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Ovárico</tspan></text><text x="435.0" y="790.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Ístmico</tspan></text><rect x="513.0" y="771.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="790.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Intersticial</tspan></text><text x="735.0" y="790.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ampular</tspan></text><text x="885.0" y="790.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Abdominal</tspan></text><rect x="40.0" y="805.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="805.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="834.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Rotura tardía (8-16</tspan><tspan x="54.0" dy="16">semanas)?</tspan></text><text x="285.0" y="834.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: ectópico ovárico</tspan><tspan x="285.0" dy="16">raro</tspan></text><text x="435.0" y="834.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: se rompe antes,</tspan><tspan x="435.0" dy="16">hacia las 6-8 semanas</tspan></text><text x="585.0" y="826.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: el miometrio se</tspan><tspan x="585.0" dy="16">distiende y retrasa la</tspan><tspan x="585.0" dy="16">rotura</tspan></text><text x="735.0" y="826.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es la más</tspan><tspan x="735.0" dy="16">frecuente, pero se</tspan><tspan x="735.0" dy="16">rompe antes</tspan></text><text x="885.0" y="834.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: ectópico</tspan><tspan x="885.0" dy="16">abdominal raro</tspan></text><rect x="40.0" y="768.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="895.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="923.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="945.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Intersticial o cornual (2-4 %): ocupa la porción de la trompa dentro de la pared uterina; el miometrio se distiende más que la pared tubaria y la rotura es</tspan><tspan x="58.0" dy="18">   tardía.</tspan><tspan x="58.0" dy="18">• La rotura causa hemorragia masiva por las arterias uterina y ovárica, con mortalidad mayor que otras localizaciones. Ístmico: rotura hacia las 6-8</tspan><tspan x="58.0" dy="18">   semanas.</tspan><tspan x="58.0" dy="18">• Ecografía: saco excéntrico con menos de 5 mm de miometrio a su alrededor y signo de la línea intersticial. Estable y pequeño: metotrexato; con rotura:</tspan><tspan x="58.0" dy="18">   cornuostomía o resección cornual.</tspan><tspan x="58.0" dy="18">• Seguimiento obligatorio con hCG hasta su negativización.</tspan></text><text x="58.0" y="1075.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, Practice Bulletin 193, Tubal ectopic pregnancy. Obstet Gynecol 2018;131:e91-103; Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>