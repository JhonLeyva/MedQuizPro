<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="999" viewBox="0 0 1000 999" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La corrección de la hiponatremia mayor de 12 mEq/L en 24 horas causa mielinólisis pontina central"><title>La corrección de la hiponatremia mayor de 12 mEq/L en 24 horas causa mielinólisis pontina central</title><rect x="0.75" y="0.75" width="998.5" height="997.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Nefrología pediátrica · hiponatremia y desmielinización osmótica</tspan></text><rect x="582.2" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="631.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="631.2" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Desmielinización osmótica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">En la hiponatremia crónica las neuronas pierden osmolitos.</tspan><tspan x="58.0" dy="17">Si el sodio sube rápido, la célula se deshidrata y los oligodendrocitos mueren.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 9 meses</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Deshidratación hiponatrémica con corrección de sodio</tspan><tspan x="640.0" dy="16">mayor de 12 mEq/L en 24 horas.</tspan><tspan x="640.0" dy="16">Dos días después: confusión, agitación y tetraparesia</tspan><tspan x="640.0" dy="16">flácida.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DE LA CORRECCIÓN RÁPIDA DEL SODIO A LA DESMIELINIZACIÓN</tspan></text><text x="44.0" y="315.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Límite de corrección: 10 mEq/L en 24 h y 8 mEq/L en cada día siguiente.</tspan></text><line x1="155.0" y1="354.0" x2="293.0" y2="354.0" stroke="#99f6e4" stroke-width="6"/><line x1="339.0" y1="354.0" x2="477.0" y2="354.0" stroke="#99f6e4" stroke-width="6"/><line x1="523.0" y1="354.0" x2="661.0" y2="354.0" stroke="#99f6e4" stroke-width="6"/><line x1="707.0" y1="354.0" x2="845.0" y2="354.0" stroke="#99f6e4" stroke-width="6"/><circle cx="132.0" cy="354.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="132.0" y="358.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="132.0" dy="0">Día 0</tspan></text><rect x="45.0" y="388.0" width="174.0" height="92.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="132.0" y="408.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">Hiponatremia crónica</tspan></text><text x="132.0" y="425.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">Las neuronas pierden</tspan><tspan x="132.0" dy="16">osmolitos para adaptarse</tspan></text><circle cx="316.0" cy="354.0" r="22" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><text x="316.0" y="358.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="38"><tspan x="316.0" dy="0">24 h</tspan></text><rect x="229.0" y="388.0" width="174.0" height="92.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="316.0" y="408.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">Corrección mayor de 12</tspan><tspan x="316.0" dy="17">mEq/L</tspan></text><text x="316.0" y="442.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">Supera el límite; la célula</tspan><tspan x="316.0" dy="16">cerebral se deshidrata</tspan></text><rect x="208.8" y="469.0" width="214.5" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="316.0" y="484.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="316.0" dy="0">◆ ESTE CASO: CORRECCIÓN RÁPIDA</tspan></text><circle cx="500.0" cy="354.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="358.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="500.0" dy="0">Días 2-6</tspan></text><rect x="413.0" y="388.0" width="174.0" height="92.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="408.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">Intervalo de aparente</tspan><tspan x="500.0" dy="17">mejoría</tspan></text><text x="500.0" y="442.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">Los oligodendrocitos entran en</tspan><tspan x="500.0" dy="16">apoptosis</tspan></text><circle cx="684.0" cy="354.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="684.0" y="358.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="684.0" dy="0">Luego</tspan></text><rect x="597.0" y="388.0" width="174.0" height="92.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="684.0" y="408.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">Mielinólisis pontina</tspan><tspan x="684.0" dy="17">central</tspan></text><text x="684.0" y="442.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">Confusión, agitación y</tspan><tspan x="684.0" dy="16">tetraparesia flácida</tspan></text><circle cx="868.0" cy="354.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="868.0" y="358.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="868.0" dy="0">Siempre</tspan></text><rect x="781.0" y="388.0" width="174.0" height="92.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="868.0" y="408.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">RM y prevención</tspan></text><text x="868.0" y="425.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">T2 hiperintenso en la</tspan><tspan x="868.0" dy="16">protuberancia; sodio cada 2-4</tspan><tspan x="868.0" dy="16">horas</tspan></text><rect x="40.0" y="512.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="538.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Corrección rápida del sodio = mielinólisis pontina central</tspan></text><text x="60.0" y="557.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Si se pasó del límite, se baja el sodio con agua libre o desmopresina.</tspan></text><text x="40.0" y="624.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="634.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="665.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="637.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="656.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Mielinólisis pontina</tspan><tspan x="285.0" dy="17">central</tspan></text><text x="435.0" y="656.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Trombosis venosa</tspan><tspan x="435.0" dy="17">central</tspan></text><text x="585.0" y="665.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Infarto cerebral</tspan></text><text x="735.0" y="656.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hemorragia</tspan><tspan x="735.0" dy="17">intracerebral</tspan></text><text x="885.0" y="665.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Disgenesia cerebral</tspan></text><rect x="40.0" y="688.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="688.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="725.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico probable?</tspan></text><text x="285.0" y="709.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: corrección rápida</tspan><tspan x="285.0" dy="16">del sodio, intervalo</tspan><tspan x="285.0" dy="16">libre y tetraparesia</tspan></text><text x="435.0" y="717.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no se relaciona</tspan><tspan x="435.0" dy="16">con el antecedente</tspan></text><text x="585.0" y="717.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no se relaciona</tspan><tspan x="585.0" dy="16">con el antecedente</tspan></text><text x="735.0" y="717.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no se relaciona</tspan><tspan x="735.0" dy="16">con el antecedente</tspan></text><text x="885.0" y="717.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no se relaciona</tspan><tspan x="885.0" dy="16">con el antecedente</tspan></text><rect x="40.0" y="634.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="778.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="806.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="828.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Aparece tras un intervalo de 2 a 6 días de aparente mejoría: disartria, disfagia, confusión, tetraparesia flácida que luego se hace espástica y</tspan><tspan x="58.0" dy="18">   enclaustramiento.</tspan><tspan x="58.0" dy="18">• RM: lesión hiperintensa en T2 en la protuberancia. Límite de corrección: 10 mEq/L en 24 h y 8 mEq/L por día después (Spasovski 2014); 8 mEq/L en alto</tspan><tspan x="58.0" dy="18">   riesgo (Verbalis 2013).</tspan><tspan x="58.0" dy="18">• Si se corrige en exceso: agua libre o desmopresina para reducir el sodio. Síntomas agudos (convulsiones, coma): salino hipertónico 3 % de 2-3 mL/kg,</tspan><tspan x="58.0" dy="18">   que sube el sodio 4-6 mEq/L.</tspan><tspan x="58.0" dy="18">• Alerta: controlar el sodio cada 2-4 horas durante la reposición. Trombosis venosa, infarto, hemorragia y disgenesia no se relacionan con el antecedente.</tspan></text><text x="58.0" y="958.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Spasovski G et al., Eur J Endocrinol 2014;170:G1-G47; Verbalis JG et al., Am J Med 2013;126(10 Suppl 1):S1-S42; Nelson Tratado de Pediatría 22.ª ed. (2024)</tspan></text></svg>