<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1336" viewBox="0 0 1000 1336" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Para saber qué regiones redujeron la discapacidad y la muerte prematura con una intervención, se usa el estudio de carga de enfermedad (AVAD)"><title>Para saber qué regiones redujeron la discapacidad y la muerte prematura con una intervención, se usa el estudio de carga de enfermedad (AVAD)</title><rect x="0.75" y="0.75" width="998.5" height="1335.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Salud pública · indicadores compuestos</tspan></text><rect x="437.9" y="32.0" width="143.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="509.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="127"><tspan x="509.6" dy="0">SALUD PÚBLICA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Carga de enfermedad</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Mide la pérdida de salud de una población en AVAD (años de vida ajustados por</tspan><tspan x="58.0" dy="17">discapacidad).</tspan><tspan x="58.0" dy="17">AVAD = años perdidos por muerte prematura (AVP) + años vividos con discapacidad (AVD).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de gestión</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Intervención para reducir la discapacidad prematura.</tspan><tspan x="640.0" dy="16">¿Qué regiones se beneficiaron?</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#94a3b8"/><line x1="500.0" y1="349.0" x2="500.0" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="379.0" x2="811.3" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="379.0" x2="188.7" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,407.0 193.7,407.0 188.7,415.0" fill="#94a3b8"/><line x1="500.0" y1="379.0" x2="500.0" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,407.0 505.0,407.0 500.0,415.0" fill="#94a3b8"/><line x1="811.3" y1="379.0" x2="811.3" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,407.0 816.3,407.0 811.3,415.0" fill="#94a3b8"/><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#0f766e"/><line x1="500.0" y1="349.0" x2="500.0" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="379.0" x2="500.0" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="379.0" x2="188.7" y2="408.0" stroke="#0f766e" stroke-width="3"/><polygon points="183.7,407.0 193.7,407.0 188.7,415.0" fill="#0f766e"/><rect x="86.8" y="388.0" width="203.7" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="188.7" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">¿Cuánta salud se perdió? (este caso)</tspan></text><rect x="404.7" y="388.0" width="190.6" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="500.0" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">¿Cómo está la salud del territorio?</tspan></text><rect x="735.4" y="388.0" width="151.9" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="811.3" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">¿Funciona un tratamiento?</tspan></text><polygon points="240.0,320.0 266.0,291.0 734.0,291.0 760.0,320.0 734.0,349.0 266.0,349.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="320.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="325.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="324.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">¿Qué pregunta quieres responder?</tspan></text><rect x="40.0" y="415.0" width="297.3" height="73.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="188.7" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">CARGA DE ENFERMEDAD</tspan></text><text x="188.7" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">AVAD = AVP + AVD</tspan></text><rect x="351.3" y="415.0" width="297.3" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">ASIS</tspan></text><text x="500.0" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Diagnóstico situacional</tspan></text><rect x="662.7" y="415.0" width="297.3" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Ensayo clínico</tspan></text><text x="811.3" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Aleatorizado</tspan></text><text x="40.0" y="528.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="540.5" width="920.0" height="453.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="554.5" width="250.0" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="181.0" y="574.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="181.0" dy="0">CÓMO SE CALCULAN LOS AVAD</tspan></text><text x="322.0" y="574.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="620"><tspan x="322.0" dy="0">Ejemplo para entender la fórmula.</tspan></text><rect x="56.0" y="598.5" width="888.0" height="30.0" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/><text x="120.0" y="618.5" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="start" data-max="300"><tspan x="120.0" dy="0">CRITERIO</tspan></text><text x="420.0" y="618.5" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="start" data-max="438"><tspan x="420.0" dy="0">EN ESTE CASO</tspan></text><text x="896.0" y="618.5" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="96"><tspan x="896.0" dy="0">PUNTOS</tspan></text><rect x="56.0" y="632.5" width="888.0" height="38.0" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/><rect x="64.7" y="638.5" width="40.5" height="26.0" rx="8" fill="#94a3b8" stroke="none" stroke-width="1.5"/><text x="85.0" y="656.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="85.0" dy="0">AVP</tspan></text><text x="120.0" y="655.5" font-size="12" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="120.0" dy="0">Años perdidos por muerte prematura</tspan></text><text x="420.0" y="655.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="418"><tspan x="420.0" dy="0">Muertes × años que faltaban vivir</tspan></text><text x="896.0" y="656.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="86"><tspan x="896.0" dy="0">sin dato</tspan></text><rect x="56.0" y="674.5" width="888.0" height="38.0" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/><rect x="64.4" y="680.5" width="41.2" height="26.0" rx="8" fill="#94a3b8" stroke="none" stroke-width="1.5"/><text x="85.0" y="698.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="85.0" dy="0">AVD</tspan></text><text x="120.0" y="697.5" font-size="12" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="120.0" dy="0">Años vividos con discapacidad</tspan></text><text x="420.0" y="697.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="418"><tspan x="420.0" dy="0">Casos × duración × peso de discapacidad</tspan></text><text x="896.0" y="698.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="86"><tspan x="896.0" dy="0">sin dato</tspan></text><rect x="56.0" y="720.5" width="888.0" height="36.0" rx="8" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="72.0" y="743.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">AVAD = AVP + AVD</tspan></text><text x="928.0" y="743.5" font-size="11.5" font-weight="600" font-style="normal" fill="#99f6e4" text-anchor="end" data-max="704"><tspan x="928.0" dy="0">1 AVAD = 1 año de vida sana perdido</tspan></text><rect x="56.0" y="782.5" width="439.0" height="82.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="57.0" y="783.5" width="437.0" height="32.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="1.5"/><text x="275.5" y="808.5" font-size="12" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="423"><tspan x="275.5" dy="0">↑ AVAD</tspan></text><text x="66.0" y="834.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="419"><tspan x="66.0" dy="0">Más carga</tspan></text><text x="66.0" y="850.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="419"><tspan x="66.0" dy="0">Priorizar</tspan></text><rect x="505.0" y="782.5" width="439.0" height="82.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="506.0" y="783.5" width="437.0" height="32.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="1.5"/><text x="724.5" y="808.5" font-size="12" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="423"><tspan x="724.5" dy="0">↓ AVAD</tspan></text><text x="515.0" y="834.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="419"><tspan x="515.0" dy="0">Menos carga</tspan></text><text x="515.0" y="850.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="419"><tspan x="515.0" dy="0">La intervención funcionó</tspan></text><rect x="679.1" y="771.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="724.5" y="786.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="724.5" dy="0">◆ ESTE CASO</tspan></text><text x="56.0" y="894.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="903.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="918.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="918.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Se busca dónde bajaron los AVAD</tspan></text><rect x="56.0" y="940.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="963.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Comparar AVAD antes y después por región.</tspan></text><text x="40.0" y="1033.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1043.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1074.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1074.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Ensayos clínicos</tspan></text><rect x="363.0" y="1046.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="1066.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Carga global de</tspan><tspan x="435.0" dy="17">enfermedad</tspan></text><text x="585.0" y="1066.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Estudios</tspan><tspan x="585.0" dy="17">descriptivos</tspan></text><text x="735.0" y="1074.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">El ASIS</tspan></text><text x="885.0" y="1074.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Censo de población</tspan></text><rect x="40.0" y="1097.5" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="1097.5" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1134.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué solicitar?</tspan></text><text x="285.0" y="1126.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: evalúan un</tspan><tspan x="285.0" dy="16">tratamiento</tspan></text><text x="435.0" y="1126.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: mide AVAD por</tspan><tspan x="435.0" dy="16">región</tspan></text><text x="585.0" y="1126.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no comparan</tspan><tspan x="585.0" dy="16">carga</tspan></text><text x="735.0" y="1118.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Incluye datos, pero la</tspan><tspan x="735.0" dy="16">medida pedida son</tspan><tspan x="735.0" dy="16">AVAD</tspan></text><text x="885.0" y="1134.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: cuenta población</tspan></text><rect x="40.0" y="1043.5" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1187.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1215.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1237.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Permite comparar enfermedades y regiones con una sola cifra.</tspan><tspan x="58.0" dy="18">• ASIS: describe la situación de salud (más amplio, no mide AVAD por sí mismo).</tspan><tspan x="58.0" dy="18">• Ensayo clínico: prueba un tratamiento en personas, no evalúa regiones.</tspan></text><text x="58.0" y="1295.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, Global Burden of Disease; MINSA Perú, carga de enfermedad en el Perú (CDC-MINSA, 2023).</tspan></text></svg>