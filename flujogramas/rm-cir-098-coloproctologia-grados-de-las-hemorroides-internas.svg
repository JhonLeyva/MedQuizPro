<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="935" viewBox="0 0 1000 935" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La hemorroide que prolapsa y se reduce con la mano es de grado III"><title>La hemorroide que prolapsa y se reduce con la mano es de grado III</title><rect x="0.75" y="0.75" width="998.5" height="933.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Coloproctología · grados de las hemorroides internas</tspan></text><rect x="515.8" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="559.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="559.0" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hemorroides internas</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Nacen sobre la línea pectínea y están cubiertas de mucosa.</tspan><tspan x="58.0" dy="17">Se clasifican por el grado de prolapso (Goligher).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 56 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Estreñimiento crónico y tumoración sangrante que</tspan><tspan x="640.0" dy="16">protruye al defecar.</tspan><tspan x="640.0" dy="16">Ella la reduce con la mano. ¿Grado?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><rect x="40.0" y="261.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="287.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Prolapso que se reduce con la mano = grado III</tspan></text><text x="60.0" y="306.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Banda elástica o hemorroidectomía si falla; rectorragia desde los 45-50 años: colonoscopia.</tspan></text><text x="40.0" y="367.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN DE GOLIGHER (HEMORROIDES INTERNAS)</tspan></text><rect x="40.0" y="379.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="398.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="114"><tspan x="50.0" dy="0">Grado</tspan></text><text x="180.0" y="398.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="182"><tspan x="180.0" dy="0">Prolapso</tspan></text><text x="377.5" y="398.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="182"><tspan x="377.5" dy="0">Reducción</tspan></text><text x="575.0" y="398.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="182"><tspan x="575.0" dy="0">Síntoma típico</tspan></text><text x="772.5" y="398.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="182"><tspan x="772.5" dy="0">Tratamiento</tspan></text><rect x="40.0" y="408.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="427.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="114"><tspan x="50.0" dy="0">I</tspan></text><text x="180.0" y="427.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="180.0" dy="0">No prolapsa</tspan></text><text x="377.5" y="427.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="377.5" dy="0">—</tspan></text><text x="575.0" y="427.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="575.0" dy="0">Sangrado rojo rutilante indoloro</tspan></text><text x="772.5" y="427.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="772.5" dy="0">Fibra, líquidos; escleroterapia o</tspan><tspan x="772.5" dy="15">banda</tspan></text><rect x="40.0" y="452.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="471.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="114"><tspan x="50.0" dy="0">II</tspan></text><text x="180.0" y="471.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="180.0" dy="0">Prolapsa al defecar</tspan></text><text x="377.5" y="471.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="377.5" dy="0">Se reduce sola</tspan></text><text x="575.0" y="471.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="575.0" dy="0">Sangrado y bulto transitorio</tspan></text><text x="772.5" y="471.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="772.5" dy="0">Banda elástica, infrarrojos o</tspan><tspan x="772.5" dy="15">escleroterapia</tspan></text><rect x="40.0" y="496.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="515.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="114"><tspan x="50.0" dy="0">III</tspan></text><text x="180.0" y="515.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="180.0" dy="0">Prolapsa al esfuerzo</tspan></text><text x="377.5" y="515.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="377.5" dy="0">Se reduce con la mano</tspan></text><text x="575.0" y="515.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="575.0" dy="0">Bulto que se reduce</tspan><tspan x="575.0" dy="15">manualmente</tspan></text><text x="772.5" y="515.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="772.5" dy="0">Banda o hemorroidectomía</tspan></text><rect x="70.6" y="507.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="116.0" y="522.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="116.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="540.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="559.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="114"><tspan x="50.0" dy="0">IV</tspan></text><text x="180.0" y="559.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="180.0" dy="0">Prolapso permanente</tspan></text><text x="377.5" y="559.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="377.5" dy="0">No se reduce</tspan></text><text x="575.0" y="559.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="575.0" dy="0">Dolor, trombosis, prolapso fijo</tspan></text><text x="772.5" y="559.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="772.5" dy="0">Hemorroidectomía</tspan></text><text x="40.0" y="585.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Posiciones típicas: 3, 7 y 11 horas (posición de litotomía).</tspan></text><text x="40.0" y="632.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="642.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="664.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="664.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">II</tspan></text><text x="435.0" y="664.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">IV</tspan></text><text x="585.0" y="664.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">V</tspan></text><text x="735.0" y="664.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">I</tspan></text><rect x="813.0" y="645.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="664.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">III</tspan></text><rect x="40.0" y="679.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="679.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="708.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué grado?</tspan></text><text x="285.0" y="700.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: sale solo y se</tspan><tspan x="285.0" dy="16">reduce sola</tspan></text><text x="435.0" y="708.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es irreductible</tspan></text><text x="585.0" y="700.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no existe ese</tspan><tspan x="585.0" dy="16">grado</tspan></text><text x="735.0" y="708.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no prolapsa</tspan></text><text x="885.0" y="700.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: prolapsa y se</tspan><tspan x="885.0" dy="16">reduce con la mano</tspan></text><rect x="40.0" y="642.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="753.0" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="781.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="803.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• I: sangran sin salir. II: salen y se reducen solas. III: salen y exigen reducción manual. IV: irreductibles.</tspan><tspan x="58.0" dy="18">• Posiciones típicas: 3, 7 y 11 horas (lateral izquierda, posterolateral derecha y anterolateral derecha).</tspan><tspan x="58.0" dy="18">• Tratamiento: fibra y flavonoides; ligadura con banda en grados I-III; hemorroidectomía en III-IV o si fallan las medidas.</tspan><tspan x="58.0" dy="18">• Bandera roja: rectorragia a partir de los 45-50 años, o con cambio del hábito o pérdida de peso, requiere colonoscopia; no atribuir a hemorroides.</tspan></text><text x="58.0" y="879.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ASCRS, Clinical Practice Guidelines for the Management of Hemorrhoids (Dis Colon Rectum 2024); Schwartz Principios de Cirugía 11.ª ed.; Sabiston Tratado de Cirugía</tspan><tspan x="58.0" dy="15">21.ª ed.</tspan></text></svg>