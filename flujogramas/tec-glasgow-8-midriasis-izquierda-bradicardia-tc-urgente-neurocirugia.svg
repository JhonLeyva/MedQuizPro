<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1253" viewBox="0 0 1000 1253" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="TEC grave con midriasis arreactiva tras estabilizar: TC de cráneo urgente para decidir cirugía"><title>TEC grave con midriasis arreactiva tras estabilizar: TC de cráneo urgente para decidir cirugía</title><rect x="0.75" y="0.75" width="998.5" height="1251.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Traumatismo craneoencefálico · herniación</tspan></text><rect x="455.7" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="520.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="520.0" dy="0">NEUROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Herniación uncal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Un hematoma empuja el uncus contra el III par: pupila dilatada del mismo lado.</tspan><tspan x="58.0" dy="17">Puede haber bradicardia e hipertensión (Cushing): es una emergencia quirúrgica.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 45 años, accidente de tránsito</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Glasgow 8, PA 100/50, FC 55, pupila izquierda</tspan><tspan x="640.0" dy="16">midriática y arreactiva.</tspan><tspan x="640.0" dy="16">Vía aérea asegurada, oxígeno y estabilización en</tspan><tspan x="640.0" dy="16">curso.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿QUÉ SIGUE TRAS ESTABILIZAR?</tspan></text><polygon points="220,337.0 260,301.0 740,301.0 780,337.0 740,373.0 260,373.0" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><circle cx="282.0" cy="337.0" r="13" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="282.0" y="342.5" font-size="16" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="282.0" dy="0">?</tspan></text><text x="525.0" y="333.0" font-size="13.5" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="525.0" dy="0">TEC grave con pupila dilatada: ¿ya están aseguradas la vía</tspan><tspan x="525.0" dy="18">aérea y la PA?</tspan></text><line x1="500.0" y1="373.0" x2="500.0" y2="393.0" stroke="#0f766e" stroke-width="2"/><line x1="190.0" y1="393.0" x2="662.0" y2="393.0" stroke="#0f766e" stroke-width="2"/><line x1="190.0" y1="393.0" x2="190.0" y2="422.0" stroke="#0f766e" stroke-width="2"/><polygon points="185.0,421.0 195.0,421.0 190.0,429.0" fill="#0f766e"/><line x1="662.0" y1="393.0" x2="662.0" y2="422.0" stroke="#ea580c" stroke-width="2"/><polygon points="657.0,421.0 667.0,421.0 662.0,429.0" fill="#ea580c"/><rect x="174.0" y="401.0" width="32.0" height="20.0" rx="10" fill="#64748b" stroke="none" stroke-width="1.5"/><text x="190.0" y="415.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">No</tspan></text><rect x="588.6" y="401.0" width="146.8" height="20.0" rx="10" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="662.0" y="415.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="662.0" dy="0">Sí: vía aérea asegurada</tspan></text><rect x="40.0" y="429.0" width="300.0" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="430.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="453.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="270"><tspan x="58.0" dy="0">Primero ABC</tspan></text><text x="58.0" y="474.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="270"><tspan x="58.0" dy="0">Intubar, oxigenar, PAS ≥ 100-110.</tspan><tspan x="58.0" dy="16">No llevar a TC a un paciente inestable.</tspan></text><rect x="364.0" y="429.0" width="596.0" height="400.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="844.6" y="418.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="433.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><text x="382.0" y="455.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">TC de cráneo urgente</tspan></text><text x="382.0" y="477.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">Ubica el hematoma (epidural, subdural, contusión).</tspan><tspan x="382.0" dy="16">Neurocirugía según el resultado.</tspan></text><g transform="translate(522.0,513.0) scale(1.0)"><rect x="0" y="0" width="280" height="260" rx="10" fill="#0b1220"/><ellipse cx="140" cy="132" rx="116" ry="118" fill="#e5e7eb" stroke="none" stroke-width="0" /><ellipse cx="140" cy="132" rx="106" ry="108" fill="#6b7280" stroke="none" stroke-width="0" /><path d="M119 96 C111 120 113 150 127.5 164 L136 150 L136 100 Z" fill="#111827" stroke="none" stroke-width="0" stroke-linejoin="round" /><path d="M161 96 C169 120 167 150 152.5 164 L144 150 L144 100 Z" fill="#111827" stroke="none" stroke-width="0" stroke-linejoin="round" /><path d="M240 80 C250 120 246 160 230 190 C214 170 210 120 220 84 Z" fill="#f8fafc" stroke="none" stroke-width="0" stroke-linejoin="round" /><path d="M130 40 L130 230" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3"/><text x="140" y="11" font-size="9" font-weight="800" fill="#94a3b8" text-anchor="middle" data-max="0">adelante</text></g><text x="382.0" y="795.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">Hematoma epidural izquierdo (esquema de TC; el lado izquierdo del paciente queda a la derecha de</tspan><tspan x="382.0" dy="16">la imagen): lente blanca que desvía la línea media.</tspan></text><text x="40.0" y="863.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PUENTE MIENTRAS LLEGA LA CIRUGÍA</tspan></text><rect x="40.0" y="873.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="874.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="897.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Cabecera a 30°</tspan></text><text x="58.0" y="918.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Mejora el retorno venoso.</tspan></text><rect x="237.5" y="862.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="282.9" y="877.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="282.9" dy="0">◆ ESTE CASO</tspan></text><rect x="351.3" y="873.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="874.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="897.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Salino hipertónico o manitol</tspan></text><text x="369.3" y="918.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Bajan la presión intracraneal.</tspan></text><rect x="662.7" y="873.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="874.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="897.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">No dar corticoides</tspan></text><text x="680.7" y="918.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Aumentan la mortalidad en el TCE.</tspan></text><text x="40.0" y="982.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="992.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1023.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="1023.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Dexametasona y observar</tspan></text><text x="491.2" y="1023.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Pasar a UCI</tspan></text><rect x="588.0" y="995.0" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="678.8" y="1014.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">TC urgente y decidir</tspan><tspan x="678.8" dy="17">cirugía</tspan></text><text x="866.2" y="1014.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Hipertónico y</tspan><tspan x="866.2" dy="17">craniectomía a ciegas</tspan></text><rect x="40.0" y="1046.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="588.0" y="1046.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1067.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="1067.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Contraindicada</tspan></text><text x="491.2" y="1067.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Retrasa el diagnóstico</tspan></text><text x="678.8" y="1067.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Ninguno</tspan></text><text x="866.2" y="1067.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Sin saber dónde está la lesión</tspan></text><rect x="40.0" y="992.0" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1104.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1132.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1154.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Con la vía aérea y la PA aseguradas: TC de cráneo urgente para localizar la lesión y llevar a cirugía.</tspan><tspan x="58.0" dy="18">• Mientras tanto: cabecera a 30°, salino hipertónico o manitol como puente, normocapnia.</tspan><tspan x="58.0" dy="18">• Los corticoides están contraindicados en el TCE; no se opera sin saber dónde está la lesión.</tspan></text><text x="58.0" y="1212.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ATLS 11.ª ed. (2025); Brain Trauma Foundation (2016).</tspan></text></svg>