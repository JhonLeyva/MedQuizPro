<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1106" viewBox="0 0 1000 1106" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En el primer episodio de pielonefritis en el niño, el estudio inicial es la ecografía renal y vesical"><title>En el primer episodio de pielonefritis en el niño, el estudio inicial es la ecografía renal y vesical</title><rect x="0.75" y="0.75" width="998.5" height="1104.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Nefrología pediátrica · pielonefritis aguda</tspan></text><rect x="444.7" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="493.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="493.7" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Pielonefritis aguda</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección urinaria febril de vías altas, casi siempre por E. coli.</tspan><tspan x="58.0" dy="17">Puede dejar cicatrices renales si el tratamiento se demora.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Primer episodio febril</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño con primera pielonefritis.</tspan><tspan x="640.0" dy="16">¿Qué estudio renal inicial está indicado?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">RUTA DE ESTUDIO TRAS LA PRIMERA PIELONEFRITIS</tspan></text><rect x="40.0" y="269.0" width="920.0" height="128.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="269.0" width="108.0" height="128.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="337.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Desde el inicio</tspan></text><rect x="40.0" y="397.0" width="920.0" height="128.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="397.0" width="108.0" height="128.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="461.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Si la evolución</tspan><tspan x="94.0" dy="14">es normal</tspan></text><rect x="40.0" y="525.0" width="920.0" height="128.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="525.0" width="108.0" height="128.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="589.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Según</tspan><tspan x="94.0" dy="14">hallazgos</tspan></text><line x1="307.2" y1="333.0" x2="314.2" y2="333.0" stroke="#ea580c" stroke-width="2.2"/><line x1="314.2" y1="333.0" x2="314.2" y2="325.0" stroke="#ea580c" stroke-width="2.2"/><line x1="314.2" y1="325.0" x2="312.2" y2="325.0" stroke="#ea580c" stroke-width="2.2"/><polygon points="312.2,330.0 312.2,320.0 321.2,325.0" fill="#ea580c"/><line x1="470.4" y1="325.0" x2="477.4" y2="325.0" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="325.0" x2="477.4" y2="452.5" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="452.5" x2="475.4" y2="452.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="475.4,457.5 475.4,447.5 484.4,452.5" fill="#0f766e"/><line x1="633.6" y1="452.5" x2="640.6" y2="452.5" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="452.5" x2="640.6" y2="589.0" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="589.0" x2="638.6" y2="589.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="638.6,594.0 638.6,584.0 647.6,589.0" fill="#0f766e"/><line x1="796.8" y1="589.0" x2="803.8" y2="589.0" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="589.0" x2="803.8" y2="589.0" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="589.0" x2="801.8" y2="589.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="801.8,594.0 801.8,584.0 810.8,589.0" fill="#0f766e"/><rect x="158.0" y="282.0" width="149.2" height="102.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Urocultivo y</tspan><tspan x="168.0" dy="16">antibiótico</tspan></text><text x="168.0" y="331.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Empírico, sin esperar las</tspan><tspan x="168.0" dy="14.5">imágenes; se ajusta con</tspan><tspan x="168.0" dy="14.5">el cultivo</tspan></text><circle cx="158.0" cy="282.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="321.2" y="282.0" width="149.2" height="86.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="331.2" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Ecografía renal y</tspan><tspan x="331.2" dy="16">vesical</tspan></text><text x="331.2" y="331.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Estudio inicial: inocua, sin</tspan><tspan x="331.2" dy="14.5">radiación</tspan></text><circle cx="321.2" cy="282.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="321.2" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="321.2" dy="0">2</tspan></text><rect x="484.4" y="410.0" width="149.2" height="85.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="494.4" y="426.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Seguimiento clínico</tspan></text><text x="494.4" y="443.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Ecografía normal y buena</tspan><tspan x="494.4" dy="14.5">evolución: sin más</tspan><tspan x="494.4" dy="14.5">estudios</tspan></text><circle cx="484.4" cy="410.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="484.4" y="414.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="484.4" dy="0">3</tspan></text><rect x="647.6" y="538.0" width="149.2" height="102.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="657.6" y="554.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Cistouretrografía</tspan><tspan x="657.6" dy="16">miccional</tspan></text><text x="657.6" y="587.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Ecografía anormal,</tspan><tspan x="657.6" dy="14.5">germen atípico, mala</tspan><tspan x="657.6" dy="14.5">evolución o recurrencia</tspan></text><circle cx="647.6" cy="538.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="647.6" y="542.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="647.6" dy="0">4</tspan></text><rect x="810.8" y="538.0" width="149.2" height="102.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="820.8" y="554.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Gammagrafía DMSA</tspan><tspan x="820.8" dy="16">diferida</tspan></text><text x="820.8" y="587.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">A los 4-6 meses, en niños</tspan><tspan x="820.8" dy="14.5">de riesgo, para ver</tspan><tspan x="820.8" dy="14.5">cicatrices</tspan></text><circle cx="810.8" cy="538.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="810.8" y="542.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="810.8" dy="0">5</tspan></text><rect x="40.0" y="671.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="697.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Primera pielonefritis = ecografía renal y vesical</tspan></text><text x="60.0" y="716.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Gammagrafía, tomografía, resonancia y cistoscopia no son estudios iniciales de rutina.</tspan></text><text x="40.0" y="783.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="793.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="824.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="824.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Gammagrafía</tspan></text><text x="435.0" y="824.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Cistoscopia</tspan></text><rect x="513.0" y="796.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="824.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Ecografía</tspan></text><text x="735.0" y="824.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Tomografía</tspan></text><text x="885.0" y="815.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Resonancia</tspan><tspan x="885.0" dy="17">magnética</tspan></text><rect x="40.0" y="847.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="847.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="876.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Estudio renal inicial?</tspan></text><text x="285.0" y="868.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: se hace diferida</tspan><tspan x="285.0" dy="16">para buscar cicatrices</tspan></text><text x="435.0" y="868.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: invasiva, no es de</tspan><tspan x="435.0" dy="16">rutina</tspan></text><text x="585.0" y="868.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: inocua, rápida y sin</tspan><tspan x="585.0" dy="16">radiación</tspan></text><text x="735.0" y="868.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: radiación y baja</tspan><tspan x="735.0" dy="16">rentabilidad</tspan></text><text x="885.0" y="868.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: requiere sedación,</tspan><tspan x="885.0" dy="16">no es de rutina</tspan></text><rect x="40.0" y="793.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="921.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="949.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="971.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• AAP 2011 (niños de 2 a 24 meses): ecografía renal y vesical tras la primera infección urinaria febril; es inocua, rápida y sin radiación.</tspan><tspan x="58.0" dy="18">• Detecta hidronefrosis, dilatación ureteral, abscesos, litiasis, malformaciones y obstrucción de la unión pieloureteral.</tspan><tspan x="58.0" dy="18">• La cistouretrografía miccional se reserva para ecografía anormal, germen distinto de E. coli, mala evolución con el tratamiento o recurrencia.</tspan><tspan x="58.0" dy="18">• La gammagrafía DMSA busca cicatrices y se hace diferida (4-6 meses). El antibiótico empírico se inicia sin esperar las imágenes y se ajusta con el</tspan><tspan x="58.0" dy="18">   urocultivo.</tspan></text><text x="58.0" y="1065.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAP, Pediatrics 2011;128:595-610; Nelson Tratado de Pediatría 22.ª ed. (2024)</tspan></text></svg>