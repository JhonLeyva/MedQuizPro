"start" data-max="604"><tspan x="108" dy="0">CONDUCTA FINAL</tspan></text><text x="108" y="672" font-size="16" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Atención del parto por equipo especializado (generalmente</tspan><tspan x="108" dy="22">cesárea)</tspan></text><rect x="40" y="748" width="740" height="98" rx="10" fill="#f0fdfa" stroke="#99f6e4"/><rect x="40" y="748" width="6" height="98" rx="3" fill="#14b8a6"/><text x="62" y="774" font-size="14" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="704"><tspan x="62" dy="0">Perla clínica</tspan></text><text x="62" y="798" font-size="15" font-weight="400" font-style="normal" fill="#134e4a" text-anchor="start" data-max="704"><tspan x="62" dy="0">Las maniobras de Mauriceau o McRoberts no se planifican en un centro de</tspan><tspan x="62" dy="21">salud: la conducta es referir a tiempo.</tspan></text><text x="410.0" y="874" font-size="11" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="740"><tspan x="410.0" dy="0">MedQuizPlus · Material de estudio: contrasta siempre con las guías clínicas vigentes.</tspan></text></svg>
