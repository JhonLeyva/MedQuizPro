<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Presentación podálica pretérmino"><title>Presentación podálica pretérmino</title><rect x="0.75" y="0.75" width="998.5" height="588.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16" y="16" width="968" height="68" rx="10" fill="#0f766e"/><text x="36" y="57.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170" y1="40.0" x2="170" y2="60.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="46.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">GINECOLOGÍA Y OBSTETRICIA ENAM: PRESENTACIÓN PODÁLICA</tspan><tspan x="184.0" dy="16">PRETÉRMINO</tspan></text><rect x="745.5" y="38.0" width="218.5" height="24" rx="12" fill="#134e4a"/><text x="854.8" y="54.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="202"><tspan x="854.8" dy="0">GINECOLOGÍA Y OBSTETRICIA</tspan></text><rect x="190.0" y="102.0" width="620" height="67.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="500.0" y="130.5" font-size="14.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Gestante de 36 semanas en centro de salud con contracciones</tspan></text><text x="500.0" y="153.0" font-size="12" font-weight="400" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Presentación de nalgas · dilatación 1 cm</tspan></text><line x1="500.0" y1="169.0" x2="500.0" y2="190.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,189.0 505.0,189.0 500.0,197.0" fill="#0f766e"/><rect x="210.0" y="197.0" width="580" height="100.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="224.5" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="552"><tspan x="500.0" dy="0">REFERENCIA A MAYOR NIVEL RESOLUTIVO</tspan></text><text x="500.0" y="247.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="552"><tspan x="500.0" dy="0">• Parto pretérmino en podálica = alto riesgo</tspan><tspan x="500.0" dy="17">• El primer nivel no tiene cesárea ni neonatología</tspan><tspan x="500.0" dy="17">• Referir en fase latente, a tiempo</tspan></text><line x1="500.0" y1="297.0" x2="500.0" y2="315.0" stroke="#0f766e" stroke-width="2"/><line x1="270.0" y1="315.0" x2="730.0" y2="315.0" stroke="#0f766e" stroke-width="2"/><line x1="270.0" y1="315.0" x2="270.0" y2="330.0" stroke="#0f766e" stroke-width="2"/><polygon points="265.0,329.0 275.0,329.0 270.0,337.0" fill="#0f766e"/><line x1="730.0" y1="315.0" x2="730.0" y2="330.0" stroke="#0f766e" stroke-width="2"/><polygon points="725.0,329.0 735.0,329.0 730.0,337.0" fill="#0f766e"/><rect x="70.0" y="337.0" width="400" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="270.0" y="364.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="372"><tspan x="270.0" dy="0">Durante la referencia</tspan></text><text x="270.0" y="387.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="372"><tspan x="270.0" dy="0">Vía EV, monitoreo materno-fetal</tspan><tspan x="270.0" dy="17">Acompañamiento de personal</tspan><tspan x="270.0" dy="17">capacitado</tspan></text><rect x="530.0" y="337.0" width="400" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="730.0" y="364.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="372"><tspan x="730.0" dy="0">En el hospital</tspan></text><text x="730.0" y="387.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="372"><tspan x="730.0" dy="0">Evaluar vía del parto</tspan><tspan x="730.0" dy="17">(generalmente cesárea)</tspan><tspan x="730.0" dy="17">Equipo neonatal presente</tspan></text><rect x="40" y="463.0" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="491.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="513.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Las maniobras de Mauriceau o McRoberts no se planifican en un centro de salud.</tspan><tspan x="58.0" dy="18">• Referir en fase latente evita el parto en el trayecto.</tspan></text><text x="58.0" y="553.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA – Guía Técnica de Emergencias Obstétricas · INMP GPC Obstetricia 2023</tspan></text></svg>
