<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1218" viewBox="0 0 1000 1218" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La etosuximida es el agente primario en la epilepsia de ausencia infantil pura"><title>La etosuximida es el agente primario en la epilepsia de ausencia infantil pura</title><rect x="0.75" y="0.75" width="998.5" height="1216.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neurología · crisis de ausencia</tspan></text><rect x="383.2" y="32.0" width="113.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="440.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="98"><tspan x="440.1" dy="0">NEUROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Crisis de ausencia generalizada</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Bloqueo de los canales de calcio tipo T talámicos que sostienen el ritmo de punta-onda a 3</tspan><tspan x="58.0" dy="17">Hz.</tspan><tspan x="58.0" dy="17">Primera elección cuando no hay otros tipos de crisis.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de tratamiento</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es el agente primario para el tratamiento de la</tspan><tspan x="640.0" dy="16">crisis de ausencia generalizada?</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE TRATAMIENTO DE LA CRISIS DE AUSENCIA Y SU LUGAR</tspan></text><line x1="420.3" y1="361.2" x2="340.0" y2="311.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="311.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="406.0" y1="411.0" x2="340.0" y2="411.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="411.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="383.0" x2="660.0" y2="361.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="361.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="439.0" x2="660.0" y2="461.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="461.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="420.3" y1="460.8" x2="340.0" y2="511.0" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="511.0" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="411.0" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="411.0" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="406.5" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">CRISIS DE</tspan><tspan x="500.0" dy="19">AUSENCIA</tspan></text><text x="500.0" y="444.5" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">elegir el fármaco</tspan></text><rect x="40.0" y="269.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="270.0" width="6.0" height="82.0" rx="3" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="190.0" y="302.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">FENOBARBITAL</tspan></text><text x="190.0" y="326.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">No es eficaz en ausencias</tspan></text><rect x="40.0" y="369.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="370.0" width="6.0" height="82.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="402.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">CLONAZEPAM</tspan></text><text x="190.0" y="426.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Adyuvante: tolerancia y sedación</tspan></text><rect x="40.0" y="469.0" width="300.0" height="84.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="502.7" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">ETOSUXIMIDA</tspan></text><text x="190.0" y="526.4" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Primera línea: calcio tipo T talámico</tspan></text><rect x="144.6" y="543.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="558.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="660.0" y="319.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="320.0" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="352.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">FENITOÍNA</tspan></text><text x="810.0" y="376.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Puede empeorar las ausencias</tspan></text><rect x="660.0" y="419.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="420.0" width="6.0" height="82.0" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="452.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">CARBAMAZEPINA</tspan></text><text x="810.0" y="476.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Puede empeorar las ausencias</tspan></text><text x="40.0" y="589.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="601.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="634.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Mirada fija de 5 a 15 s</tspan></text><line x1="248.5" y1="630.0" x2="267.5" y2="630.0" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,625.0 266.5,635.0 274.5,630.0" fill="#0f766e"/><rect x="278.5" y="601.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="634.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Punta-onda a 3 Hz</tspan></text><line x1="487.0" y1="630.0" x2="506.0" y2="630.0" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,625.0 505.0,635.0 513.0,630.0" fill="#0f766e"/><rect x="517.0" y="601.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="634.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Etosuximida</tspan></text><line x1="725.5" y1="630.0" x2="744.5" y2="630.0" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,625.0 743.5,635.0 751.5,630.0" fill="#0f766e"/><rect x="755.5" y="601.0" width="204.5" height="58.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="625.5" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Valproato si hay</tspan><tspan x="857.8" dy="17">tónico-clónicas</tspan></text><text x="40.0" y="693.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ENSAYO DE GLAUSER (NEJM 2010) EN AUSENCIA INFANTIL: 453 NIÑOS, FALLA A LAS 16 SEMANAS</tspan></text><rect x="40.0" y="705.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="724.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Fármaco</tspan></text><text x="300.0" y="724.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Libres de falla a 16 semanas</tspan></text><text x="635.0" y="724.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Comentario</tspan></text><rect x="40.0" y="734.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="753.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Etosuximida</tspan></text><text x="300.0" y="753.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Cerca de 53 %</tspan></text><text x="635.0" y="753.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Menos alteración de la atención que el valproato</tspan></text><rect x="190.6" y="737.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="236.0" y="752.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="236.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="763.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="782.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Valproato</tspan></text><text x="300.0" y="782.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Cerca de 58 %</tspan></text><text x="635.0" y="782.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Cubre también crisis tónico-clónicas</tspan></text><rect x="40.0" y="792.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="811.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Lamotrigina</tspan></text><text x="300.0" y="811.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">29 %</tspan></text><text x="635.0" y="811.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Alternativa menos eficaz</tspan></text><text x="40.0" y="861.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="871.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="893.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="893.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Fenobarbital</tspan></text><text x="435.0" y="893.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Clonazepam</tspan></text><rect x="513.0" y="874.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="893.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Etosuximida</tspan></text><text x="735.0" y="893.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Fenitoína</tspan></text><text x="885.0" y="893.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Carbamazepina</tspan></text><rect x="40.0" y="908.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="908.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="937.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Agente primario?</tspan></text><text x="285.0" y="929.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no es eficaz en</tspan><tspan x="285.0" dy="16">ausencias</tspan></text><text x="435.0" y="929.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: solo adyuvante por</tspan><tspan x="435.0" dy="16">tolerancia y sedación</tspan></text><text x="585.0" y="929.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: bloquea canales de</tspan><tspan x="585.0" dy="16">calcio tipo T talámicos</tspan></text><text x="735.0" y="929.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: puede empeorar</tspan><tspan x="735.0" dy="16">las ausencias</tspan></text><text x="885.0" y="929.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: puede empeorar</tspan><tspan x="885.0" dy="16">las ausencias</tspan></text><rect x="40.0" y="871.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="982.0" width="920.0" height="218.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1010.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1032.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Glauser (NEJM 2010, 453 niños): etosuximida y valproato igual de eficaces (cerca de 53 y 58 % libres de falla a 16 semanas), superiores a lamotrigina</tspan><tspan x="58.0" dy="18">   (29 %); menos alteración de la atención que el valproato.</tspan><tspan x="58.0" dy="18">• Efectos: náuseas, vómitos, somnolencia, cefalea; rara vez discrasias o Stevens-Johnson. No previene las crisis tónico-clónicas: en ese caso, valproato o</tspan><tspan x="58.0" dy="18">   lamotrigina.</tspan><tspan x="58.0" dy="18">• NICE 2022 la recomienda como primera línea. Fenitoína y carbamazepina pueden empeorar las ausencias; el fenobarbital no es eficaz; el clonazepam</tspan><tspan x="58.0" dy="18">   solo es adyuvante.</tspan><tspan x="58.0" dy="18">• Diagnóstico en la consulta: la hiperventilación durante tres minutos suele provocar la crisis.</tspan></text><text x="58.0" y="1162.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Glauser, Ethosuximide, valproic acid, and lamotrigine in childhood absence epilepsy (N Engl J Med 2010;362:790); NICE NG217 (2022); Goodman y Gilman, 14.ª ed.</tspan><tspan x="58.0" dy="15">(2023).</tspan></text></svg>