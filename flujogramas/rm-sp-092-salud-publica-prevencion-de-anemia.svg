<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="910" viewBox="0 0 1000 910" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Las 450 cajas de chispitas se dan a todos los niños de 6 a 36 meses, tengan o no anemia"><title>Las 450 cajas de chispitas se dan a todos los niños de 6 a 36 meses, tengan o no anemia</title><rect x="0.75" y="0.75" width="998.5" height="908.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Salud pública · prevención de anemia</tspan></text><rect x="422.2" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="486.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="486.5" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Prevención de anemia infantil</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La estrategia es universal: se suplementa a todos los niños sin diagnóstico previo.</tspan><tspan x="58.0" dy="17">Micronutrientes en polvo (chispitas).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Centro de salud</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">450 niños menores de 3 años y 450 cajas de chispitas.</tspan><tspan x="640.0" dy="16">¿A quiénes se las entrega?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUIÉN RECIBE MICRONUTRIENTES SEGÚN LA EDAD EN MESES</tspan></text><rect x="40.0" y="269.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="295.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Edad del niño</tspan></text><text x="60.0" y="314.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La edad decide; no hace falta diagnóstico previo.</tspan></text><rect x="70.0" y="378.0" width="107.5" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="123.8" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="98"><tspan x="123.8" dy="0">Antes: no</tspan></text><rect x="177.5" y="378.0" width="537.5" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="446.2" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="528"><tspan x="446.2" dy="0">6 a 35: todos reciben</tspan></text><rect x="715.0" y="378.0" width="215.0" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="822.5" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="205"><tspan x="822.5" dy="0">36 o más: fuera</tspan></text><line x1="70.0" y1="418.0" x2="70.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="70.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="70.0" dy="0">0 m</tspan></text><line x1="177.5" y1="418.0" x2="177.5" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="177.5" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="177.5" dy="0">6 m</tspan></text><line x1="285.0" y1="418.0" x2="285.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="285.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="285.0" dy="0">12 m</tspan></text><line x1="500.0" y1="418.0" x2="500.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="500.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="500.0" dy="0">24 m</tspan></text><line x1="715.0" y1="418.0" x2="715.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="715.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="715.0" dy="0">36 m</tspan></text><line x1="930.0" y1="418.0" x2="930.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">48 m</tspan></text><polygon points="383.5,364.0 401.5,364.0 392.5,376.0" fill="#ea580c"/><rect x="218.2" y="338.0" width="348.7" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="392.5" y="353.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="337"><tspan x="392.5" dy="0">◆ TODOS LOS NIÑOS DE 6 A 36 MESES RECIBEN CHISPITAS</tspan></text><text x="40.0" y="486.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ DECIDE LA ENTREGA</tspan></text><rect x="40.0" y="496.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="497.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="520.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Edad de 6 a 35 meses</tspan></text><text x="58.0" y="541.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Basta para recibir la suplementación</tspan></text><rect x="351.3" y="496.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="497.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="520.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Hemoglobina, peso o estado nutricional</tspan></text><text x="369.3" y="541.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">No condicionan la prevención universal</tspan></text><rect x="662.7" y="496.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="497.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="520.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Todos los niños del distrito</tspan></text><text x="680.7" y="541.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Incluye niños fuera del grupo de edad</tspan></text><text x="40.0" y="605.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="615.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="646.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="637.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Los que tienen Hb</tspan><tspan x="285.0" dy="17">menor de 11</tspan></text><text x="435.0" y="637.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Los que no son</tspan><tspan x="435.0" dy="17">obesos</tspan></text><text x="585.0" y="637.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Los que tienen</tspan><tspan x="585.0" dy="17">desnutrición</tspan></text><rect x="663.0" y="618.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="637.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Todos los niños</tspan><tspan x="735.0" dy="17">entre 6 y 36 meses</tspan></text><text x="885.0" y="637.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Todos los niños del</tspan><tspan x="885.0" dy="17">distrito</tspan></text><rect x="40.0" y="669.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="669.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="698.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿A quiénes se entrega?</tspan></text><text x="285.0" y="690.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: la estrategia no</tspan><tspan x="285.0" dy="16">exige anemia previa</tspan></text><text x="435.0" y="690.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: la obesidad no</tspan><tspan x="435.0" dy="16">excluye</tspan></text><text x="585.0" y="690.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: la desnutrición no</tspan><tspan x="585.0" dy="16">es requisito</tspan></text><text x="735.0" y="690.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: universal entre 6 y</tspan><tspan x="735.0" dy="16">36 meses</tspan></text><text x="885.0" y="690.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: incluye niños fuera</tspan><tspan x="885.0" dy="16">de edad</tspan></text><rect x="40.0" y="615.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="743.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="771.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="793.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Chispitas: hierro, zinc, ácido fólico, vitamina A y vitamina C. Se inicia a los 6 meses y se completa 360 sobres en 12 meses.</tspan><tspan x="58.0" dy="18">• Puede empezarse a cualquier edad dentro de 6 a 35 meses; por eso cubren a todos los niños de ese rango, no solo a los anémicos.</tspan><tspan x="58.0" dy="18">• Hemoglobina baja o desnutrición no son requisitos; tampoco excluye a los obesos. Dar a todo el distrito incluiría niños fuera de edad.</tspan><tspan x="58.0" dy="18">• Alerta: el esquema vigente puede diferir de la Directiva 068 que cita el banco; no se verificó la NTS 2024.</tspan></text><text x="58.0" y="869.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA, Directiva Sanitaria 068-MINSA/DGSP-V.01 (RM 055-2016/MINSA); OMS, Directriz sobre polvos de micronutrientes múltiples (2016).</tspan></text></svg>