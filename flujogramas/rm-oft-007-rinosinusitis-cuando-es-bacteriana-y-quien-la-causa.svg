<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="911" viewBox="0 0 1000 911" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El agente más frecuente de la sinusitis bacteriana del adulto es Streptococcus pneumoniae"><title>El agente más frecuente de la sinusitis bacteriana del adulto es Streptococcus pneumoniae</title><rect x="0.75" y="0.75" width="998.5" height="909.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Rinosinusitis · cuándo es bacteriana y quién la causa</tspan></text><rect x="514.5" y="32.0" width="162.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="595.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="146"><tspan x="595.6" dy="0">OFTALMOLOGÍA Y ORL RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Rinosinusitis aguda</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Casi siempre viral (resfrío común); solo 0,5-2 % se complica con infección bacteriana.</tspan><tspan x="58.0" dy="17">Se sospecha bacteriana por el tiempo y la forma de evolución.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es el agente causal más frecuente de la sinusitis</tspan><tspan x="640.0" dy="16">bacteriana del adulto?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DE LA CONGESTIÓN A LA SINUSITIS BACTERIANA</tspan></text><text x="44.0" y="283.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Primero se decide si es bacteriana; luego, qué germen la causa.</tspan></text><line x1="155.0" y1="322.0" x2="293.0" y2="322.0" stroke="#99f6e4" stroke-width="6"/><line x1="339.0" y1="322.0" x2="477.0" y2="322.0" stroke="#99f6e4" stroke-width="6"/><line x1="523.0" y1="322.0" x2="661.0" y2="322.0" stroke="#99f6e4" stroke-width="6"/><line x1="707.0" y1="322.0" x2="845.0" y2="322.0" stroke="#99f6e4" stroke-width="6"/><circle cx="132.0" cy="322.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="132.0" y="326.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="132.0" dy="0">&lt; 10 d</tspan></text><rect x="45.0" y="356.0" width="174.0" height="75.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="132.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">Probable viral</tspan></text><text x="132.0" y="393.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">Congestión y rinorrea:</tspan><tspan x="132.0" dy="16">tratamiento sintomático</tspan></text><circle cx="316.0" cy="322.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="316.0" y="326.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="316.0" dy="0">&gt; 10 d</tspan></text><rect x="229.0" y="356.0" width="174.0" height="75.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="316.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">Sin mejoría</tspan></text><text x="316.0" y="393.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">Síntomas persistentes:</tspan><tspan x="316.0" dy="16">sospechar bacteriana</tspan></text><circle cx="500.0" cy="322.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="326.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="500.0" dy="0">3-4 d</tspan></text><rect x="413.0" y="356.0" width="174.0" height="75.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">Fiebre y pus</tspan></text><text x="500.0" y="393.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">Fiebre alta, secreción</tspan><tspan x="500.0" dy="16">purulenta y dolor facial</tspan></text><circle cx="684.0" cy="322.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="684.0" y="326.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="684.0" dy="0">2.ª ola</tspan></text><rect x="597.0" y="356.0" width="174.0" height="75.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="684.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">Doble empeoramiento</tspan></text><text x="684.0" y="393.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">Empeora después de mejorar</tspan></text><circle cx="868.0" cy="322.0" r="22" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><text x="868.0" y="326.5" font-size="9.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="38"><tspan x="868.0" dy="0">Germen</tspan></text><rect x="781.0" y="356.0" width="174.0" height="75.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="868.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">S. pneumoniae</tspan></text><text x="868.0" y="393.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">Luego H. influenzae y M.</tspan><tspan x="868.0" dy="16">catarrhalis</tspan></text><rect x="789.0" y="420.0" width="158.0" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="868.0" y="435.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="868.0" dy="0">◆ ESTE CASO: EL AGENTE</tspan></text><rect x="40.0" y="463.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="489.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Sinusitis bacteriana del adulto: Streptococcus pneumoniae</tspan></text><text x="60.0" y="508.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Amoxicilina con o sin clavulánico; doxiciclina como alternativa.</tspan></text><text x="40.0" y="575.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="585.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="616.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="607.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Streptococcus</tspan><tspan x="285.0" dy="17">pyogenes</tspan></text><text x="435.0" y="607.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Staphylococcus</tspan><tspan x="435.0" dy="17">aureus</tspan></text><rect x="513.0" y="588.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="607.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Streptococcus</tspan><tspan x="585.0" dy="17">pneumoniae</tspan></text><text x="735.0" y="607.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Chlamydia</tspan><tspan x="735.0" dy="17">pneumoniae</tspan></text><text x="885.0" y="607.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Pseudomonas</tspan><tspan x="885.0" dy="17">aeruginosa</tspan></text><rect x="40.0" y="639.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="639.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="676.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Más frecuente?</tspan></text><text x="285.0" y="668.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: causa faringitis</tspan><tspan x="285.0" dy="16">más que sinusitis</tspan></text><text x="435.0" y="660.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es menos común,</tspan><tspan x="435.0" dy="16">de formas crónicas o</tspan><tspan x="435.0" dy="16">posquirúrgicas</tspan></text><text x="585.0" y="668.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: el principal agente</tspan><tspan x="585.0" dy="16">bacteriano</tspan></text><text x="735.0" y="676.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es una causa rara</tspan></text><text x="885.0" y="660.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: se ve en</tspan><tspan x="885.0" dy="16">inmunodeprimidos y</tspan><tspan x="885.0" dy="16">fibrosis quística</tspan></text><rect x="40.0" y="585.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="729.0" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="757.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="779.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Sospechar bacteriana si hay síntomas &gt; 10 días sin mejoría, fiebre alta con secreción purulenta y dolor facial 3-4 días, o «doble empeoramiento».</tspan><tspan x="58.0" dy="18">• Agentes: S. pneumoniae primero, luego H. influenzae y M. catarrhalis; S. aureus y Pseudomonas son raros.</tspan><tspan x="58.0" dy="18">• AAO-HNSF 2025: en cuadros leves o moderados se admite observación; si se trata, amoxicilina con o sin clavulánico por 5-7 días.</tspan><tspan x="58.0" dy="18">• Doxiciclina es la alternativa; los lavados nasales y descongestionantes son sintomáticos. Alerta: la complicación temida es la orbitaria.</tspan></text><text x="58.0" y="855.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Payne SC et al., AAO-HNSF, Adult Sinusitis Update (Otolaryngol Head Neck Surg 2025;173 Suppl 1:S1-S56); Chow AW et al., IDSA (Clin Infect Dis 2012;54:e72-e112);</tspan><tspan x="58.0" dy="15">Cummings Otorrinolaringología 7.ª ed. (2020)</tspan></text></svg>