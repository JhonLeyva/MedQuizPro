<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="872" viewBox="0 0 1000 872" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La deficiencia de riboflavina produce glositis con atrofia de las papilas linguales"><title>La deficiencia de riboflavina produce glositis con atrofia de las papilas linguales</title><rect x="0.75" y="0.75" width="998.5" height="870.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Bioquímica · riboflavina (vitamina B2)</tspan></text><rect x="422.1" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="494.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="494.1" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="131.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Riboflavina (B2)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Precursora de FMN y FAD, coenzimas de la cadena respiratoria y del metabolismo de</tspan><tspan x="58.0" dy="17">lípidos y aminoácidos.</tspan><tspan x="58.0" dy="17">Su carencia se llama arriboflavinosis.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="131.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="129.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cómo se caracteriza la deficiencia de vitamina B2?</tspan></text><rect x="640.0" y="192.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="205.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="205.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="253.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DÓNDE SE NOTA LA FALTA DE RIBOFLAVINA</tspan></text><rect x="40.0" y="265.0" width="453.0" height="79.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="54.0" y="292.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Boca y labios</tspan></text><text x="54.0" y="309.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Queilosis (fisuras de los labios)</tspan><tspan x="54.0" dy="16">Estomatitis angular</tspan></text><rect x="507.0" y="265.0" width="453.0" height="79.0" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2.4"/><text x="521.0" y="292.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Lengua</tspan></text><text x="521.0" y="309.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Glositis magenta</tspan><tspan x="521.0" dy="16">Atrofia de las papilas filiformes: lengua lisa</tspan></text><rect x="858.2" y="254.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="903.6" y="269.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="903.6" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="358.0" width="453.0" height="79.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="54.0" y="385.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Piel y ojos</tspan></text><text x="54.0" y="402.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Dermatitis seborreica nasolabial y escrotal</tspan><tspan x="54.0" dy="16">Vascularización corneal y fotofobia</tspan></text><rect x="507.0" y="358.0" width="453.0" height="79.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="521.0" y="385.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Sangre</tspan></text><text x="521.0" y="402.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Anemia normocítica</tspan><tspan x="521.0" dy="16">Alteración de la eritropoyesis</tspan></text><rect x="40.0" y="455.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="481.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Atrofia de papilas linguales = arriboflavinosis</tspan></text><text x="60.0" y="500.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La neuropatía y la desorientación pertenecen a otras vitaminas.</tspan></text><text x="40.0" y="567.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="577.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="608.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="608.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hepatomegalia</tspan></text><text x="435.0" y="608.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Ageusia</tspan></text><text x="585.0" y="599.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Neuropatía</tspan><tspan x="585.0" dy="17">periférica</tspan></text><rect x="663.0" y="580.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="599.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Atrofia de las</tspan><tspan x="735.0" dy="17">papilas linguales</tspan></text><text x="885.0" y="608.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Desorientación</tspan></text><rect x="40.0" y="631.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="631.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="660.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Característica?</tspan></text><text x="285.0" y="652.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no es una</tspan><tspan x="285.0" dy="16">manifestación de B2</tspan></text><text x="435.0" y="652.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no es una</tspan><tspan x="435.0" dy="16">manifestación de B2</tspan></text><text x="585.0" y="652.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: corresponde a B1,</tspan><tspan x="585.0" dy="16">B6 o B12</tspan></text><text x="735.0" y="652.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: lengua magenta y</tspan><tspan x="735.0" dy="16">lisa</tspan></text><text x="885.0" y="652.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: se ve en pelagra o</tspan><tspan x="885.0" dy="16">déficit de tiamina</tspan></text><rect x="40.0" y="577.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="705.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="733.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="755.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Arriboflavinosis: queilosis y estomatitis angular, glositis con lengua magenta y atrofia de las papilas filiformes (lengua lisa).</tspan><tspan x="58.0" dy="18">• Además, dermatitis seborreica en pliegues nasolabiales y escroto, anemia normocítica y, en la córnea, vascularización y fotofobia.</tspan><tspan x="58.0" dy="18">• No es de B2: neuropatía (B1, B6, B12), desorientación (niacina o tiamina), ageusia o hepatomegalia.</tspan><tspan x="58.0" dy="18">• Afecta tejidos de recambio rápido; se asocia a dieta pobre en lácteos, alcoholismo y malabsorción; se trata con riboflavina oral y dieta.</tspan></text><text x="58.0" y="831.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: NIH Office of Dietary Supplements, Riboflavin fact sheet para profesionales (2022-2024); Harrison, Principios de Medicina Interna, 21.ª ed. (2022)</tspan></text></svg>