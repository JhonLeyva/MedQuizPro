<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1272" viewBox="0 0 1000 1272" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Broncoconstricción por ejercicio: prevenir con beta-2 agonista de acción corta 10 a 15 minutos antes"><title>Broncoconstricción por ejercicio: prevenir con beta-2 agonista de acción corta 10 a 15 minutos antes</title><rect x="0.75" y="0.75" width="998.5" height="1270.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neumología · broncoconstricción inducida por ejercicio</tspan></text><rect x="528.8" y="32.0" width="114.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="586.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="99"><tspan x="586.3" dy="0">NEUMOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Broncoconstricción inducida por ejercicio</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El aire frío y seco eleva la osmolaridad de la mucosa y libera histamina y leucotrienos.</tspan><tspan x="58.0" dy="17">El broncoespasmo aparece 5 a 15 minutos después de terminar el esfuerzo.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 18 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Primera crisis de falta de aire tras una carrera en</tspan><tspan x="640.0" dy="16">bicicleta.</tspan><tspan x="640.0" dy="16">Sibilantes y espiración prolongada.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CUÁNDO ACTÚA CADA MEDIDA FRENTE A LA CRISIS</tspan></text><line x1="290.0" y1="307.0" x2="290.0" y2="501.0" stroke="#e2e8f0" stroke-width="1"/><text x="290.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="290.0" dy="0">0</tspan></text><line x1="371.2" y1="307.0" x2="371.2" y2="501.0" stroke="#e2e8f0" stroke-width="1"/><text x="371.2" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="371.2" dy="0">30</tspan></text><line x1="452.5" y1="307.0" x2="452.5" y2="501.0" stroke="#e2e8f0" stroke-width="1"/><text x="452.5" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="452.5" dy="0">60</tspan></text><line x1="533.8" y1="307.0" x2="533.8" y2="501.0" stroke="#e2e8f0" stroke-width="1"/><text x="533.8" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="533.8" dy="0">90</tspan></text><line x1="615.0" y1="307.0" x2="615.0" y2="501.0" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="615.0" dy="0">120</tspan></text><line x1="696.2" y1="307.0" x2="696.2" y2="501.0" stroke="#e2e8f0" stroke-width="1"/><text x="696.2" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="696.2" dy="0">150</tspan></text><line x1="777.5" y1="307.0" x2="777.5" y2="501.0" stroke="#e2e8f0" stroke-width="1"/><text x="777.5" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="777.5" dy="0">180</tspan></text><line x1="858.8" y1="307.0" x2="858.8" y2="501.0" stroke="#e2e8f0" stroke-width="1"/><text x="858.8" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="858.8" dy="0">210</tspan></text><line x1="940.0" y1="307.0" x2="940.0" y2="501.0" stroke="#e2e8f0" stroke-width="1"/><text x="940.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="940.0" dy="0">240</tspan></text><text x="940.0" y="289.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="end" data-max="60"><tspan x="940.0" dy="0">minutos</tspan></text><rect x="40.0" y="311.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="327.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Beta-2 inhalado antes del esfuerzo</tspan></text><text x="48.0" y="342.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Se aplica 10 a 15 min antes</tspan></text><rect x="290.0" y="319.0" width="40.6" height="22.0" rx="6" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="48.0" y="365.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Ejercicio</tspan></text><text x="48.0" y="380.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Desencadenante</tspan></text><rect x="330.6" y="357.0" width="81.2" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><rect x="40.0" y="387.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="403.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Protección del beta-2 de acción corta</tspan></text><text x="48.0" y="418.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Protege de 2 a 3 horas</tspan></text><rect x="330.6" y="395.0" width="487.5" height="22.0" rx="6" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="48.0" y="441.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Broncoespasmo sin prevención</tspan></text><text x="48.0" y="456.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">5 a 15 min tras terminar</tspan></text><rect x="425.4" y="433.0" width="27.1" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><rect x="40.0" y="463.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="479.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Corticoide inhalado diario</tspan></text><text x="48.0" y="494.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Efecto tras semanas de uso regular</tspan></text><rect x="290.0" y="471.0" width="650.0" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><line x1="290.0" y1="309.0" x2="290.0" y2="507.0" stroke="#b91c1c" stroke-width="2.6"/><rect x="245.7" y="507.0" width="88.6" height="22.0" rx="11" fill="#b91c1c" stroke="none" stroke-width="1.5"/><text x="290.0" y="522.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="290.0" dy="0">Inhalar antes</tspan></text><rect x="40.0" y="553.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="579.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Prevención del esfuerzo = beta-2 de acción corta previo</tspan></text><text x="60.0" y="598.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Los corticoides inhalados se reservan para el asma persistente o la reacción insuficiente.</tspan></text><text x="40.0" y="659.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PREVENCIÓN DE LA BRONCOCONSTRICCIÓN INDUCIDA POR EJERCICIO (ATS 2013, GINA 2025)</tspan></text><rect x="40.0" y="671.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="690.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Medida</tspan></text><text x="310.0" y="690.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Cuándo</tspan></text><text x="640.0" y="690.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Comentario</tspan></text><rect x="40.0" y="700.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="719.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Beta-2 corto inhalado</tspan></text><text x="310.0" y="719.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">10-15 min antes del ejercicio</tspan></text><text x="640.0" y="719.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Primera línea; protege a 80-90 % durante 2 a 3 horas</tspan></text><rect x="200.6" y="703.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="246.0" y="718.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="246.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="729.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="748.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Corticoide inhalado</tspan></text><text x="310.0" y="748.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Diario</tspan></text><text x="640.0" y="748.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Si hay asma persistente; efecto protector tras semanas</tspan></text><rect x="40.0" y="758.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="777.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Antileucotrienos</tspan></text><text x="310.0" y="777.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Diario o a demanda</tspan></text><text x="640.0" y="777.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Alternativa o complemento, menos eficaz</tspan></text><rect x="40.0" y="787.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="806.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Calentamiento y respirar por la nariz</tspan></text><text x="310.0" y="806.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Antes y durante el esfuerzo</tspan></text><text x="640.0" y="806.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Medidas no farmacológicas de apoyo</tspan></text><text x="40.0" y="832.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">El uso diario de beta-2 de acción corta o larga induce tolerancia.</tspan></text><text x="40.0" y="879.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="889.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="920.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="920.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Metilxantinas</tspan></text><rect x="363.0" y="892.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="911.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Beta-2 agonistas</tspan><tspan x="435.0" dy="17">antes del ejercicio</tspan></text><text x="585.0" y="920.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Antileucotrienos</tspan></text><text x="735.0" y="911.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Corticoides</tspan><tspan x="735.0" dy="17">inhalados</tspan></text><text x="885.0" y="920.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Anticolinérgicos</tspan></text><rect x="40.0" y="943.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="943.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="980.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Mejor prevención?</tspan></text><text x="285.0" y="972.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: casi no se usan;</tspan><tspan x="285.0" dy="16">margen estrecho</tspan></text><text x="435.0" y="972.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: protege durante 2 a</tspan><tspan x="435.0" dy="16">3 horas si se usa antes</tspan></text><text x="585.0" y="972.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: alternativa menos</tspan><tspan x="585.0" dy="16">eficaz</tspan></text><text x="735.0" y="964.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: para asma</tspan><tspan x="735.0" dy="16">persistente; efecto tras</tspan><tspan x="735.0" dy="16">semanas</tspan></text><text x="885.0" y="980.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: sin rol demostrado</tspan></text><rect x="40.0" y="889.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1033.0" width="920.0" height="221.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1061.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1083.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Confirmación: prueba de ejercicio o hiperventilación con caída del VEF1 de 10 % o más. Primer episodio solo con esfuerzo, sin asma persistente</tspan><tspan x="58.0" dy="18">   documentada.</tspan><tspan x="58.0" dy="18">• Prevención de primera línea: beta-2 de acción corta inhalado 10-15 min antes; protege a 80-90 % durante 2 a 3 horas. Ayudan el calentamiento y respirar</tspan><tspan x="58.0" dy="18">   por la nariz.</tspan><tspan x="58.0" dy="18">• Corticoide inhalado diario: si hay asma persistente o el beta-2 no basta; actúa tras semanas. Antileucotrienos: alternativa; metilxantinas y anticolinérgicos:</tspan><tspan x="58.0" dy="18">   sin rol.</tspan><tspan x="58.0" dy="18">• Alerta: el uso diario de beta-2 produce tolerancia y pierde el efecto protector. El banco marcaba corticoide inhalado; ATS 2013 y GINA 2025 apoyan el</tspan><tspan x="58.0" dy="18">   beta-2 previo.</tspan></text><text x="58.0" y="1231.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Parsons JP et al., ATS, Am J Respir Crit Care Med 2013;187:1016-1027; GINA 2025; Harrison, 21.ª ed. (2022).</tspan></text></svg>