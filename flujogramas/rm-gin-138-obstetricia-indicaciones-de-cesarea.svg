<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1064" viewBox="0 0 1000 1064" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La placenta previa total es indicación absoluta de cesárea: el parto vaginal causaría hemorragia masiva"><title>La placenta previa total es indicación absoluta de cesárea: el parto vaginal causaría hemorragia masiva</title><rect x="0.75" y="0.75" width="998.5" height="1062.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · indicaciones de cesárea</tspan></text><rect x="418.8" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="498.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="498.5" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Indicación de cesárea</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Absoluta: el parto vaginal es imposible o con riesgo inaceptable.</tspan><tspan x="58.0" dy="17">Relativa: la cesárea se decide según el caso.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de indicación</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál de las alternativas es una indicación absoluta de</tspan><tspan x="640.0" dy="16">cesárea?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ INDICACIONES OBLIGAN A LA CESÁREA Y CUÁLES SE DISCUTEN</tspan></text><rect x="40.0" y="269.0" width="920.0" height="163.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="269.0" width="108.0" height="163.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="350.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Indicación</tspan><tspan x="94.0" dy="14">absoluta</tspan></text><rect x="40.0" y="432.0" width="920.0" height="163.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="432.0" width="108.0" height="163.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="513.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Indicación</tspan><tspan x="94.0" dy="14">relativa</tspan></text><line x1="268.0" y1="349.0" x2="275.0" y2="349.0" stroke="#0f766e" stroke-width="2.2"/><line x1="275.0" y1="349.0" x2="275.0" y2="333.5" stroke="#0f766e" stroke-width="2.2"/><line x1="275.0" y1="333.5" x2="273.0" y2="333.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="273.0,338.5 273.0,328.5 282.0,333.5" fill="#0f766e"/><line x1="392.0" y1="333.5" x2="399.0" y2="333.5" stroke="#0f766e" stroke-width="2.2"/><line x1="399.0" y1="333.5" x2="399.0" y2="333.5" stroke="#0f766e" stroke-width="2.2"/><line x1="399.0" y1="333.5" x2="397.0" y2="333.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="397.0,338.5 397.0,328.5 406.0,333.5" fill="#0f766e"/><line x1="516.0" y1="333.5" x2="523.0" y2="333.5" stroke="#0f766e" stroke-width="2.2"/><line x1="523.0" y1="333.5" x2="523.0" y2="350.5" stroke="#0f766e" stroke-width="2.2"/><line x1="523.0" y1="350.5" x2="521.0" y2="350.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="521.0,355.5 521.0,345.5 530.0,350.5" fill="#0f766e"/><line x1="640.0" y1="350.5" x2="647.0" y2="350.5" stroke="#0f766e" stroke-width="2.2"/><line x1="647.0" y1="350.5" x2="647.0" y2="504.0" stroke="#0f766e" stroke-width="2.2"/><line x1="647.0" y1="504.0" x2="645.0" y2="504.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="645.0,509.0 645.0,499.0 654.0,504.0" fill="#0f766e"/><line x1="764.0" y1="504.0" x2="771.0" y2="504.0" stroke="#0f766e" stroke-width="2.2"/><line x1="771.0" y1="504.0" x2="771.0" y2="496.5" stroke="#0f766e" stroke-width="2.2"/><line x1="771.0" y1="496.5" x2="769.0" y2="496.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="769.0,501.5 769.0,491.5 778.0,496.5" fill="#0f766e"/><line x1="888.0" y1="496.5" x2="895.0" y2="496.5" stroke="#0f766e" stroke-width="2.2"/><line x1="895.0" y1="496.5" x2="895.0" y2="496.0" stroke="#0f766e" stroke-width="2.2"/><line x1="895.0" y1="496.0" x2="893.0" y2="496.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="893.0,501.0 893.0,491.0 902.0,496.0" fill="#0f766e"/><rect x="158.0" y="282.0" width="110.0" height="134.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="168.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="90"><tspan x="168.0" dy="0">Placenta</tspan><tspan x="168.0" dy="16">previa total</tspan></text><text x="168.0" y="331.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="90"><tspan x="168.0" dy="0">Cubre el orificio</tspan><tspan x="168.0" dy="14.5">cervical interno;</tspan><tspan x="168.0" dy="14.5">riesgo de</tspan><tspan x="168.0" dy="14.5">hemorragia</tspan><tspan x="168.0" dy="14.5">masiva</tspan></text><circle cx="158.0" cy="282.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="282.0" y="282.0" width="110.0" height="103.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="292.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="90"><tspan x="292.0" dy="0">Presentación</tspan><tspan x="292.0" dy="16">transversa</tspan><tspan x="292.0" dy="16">persistente</tspan></text><text x="292.0" y="347.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="90"><tspan x="292.0" dy="0">Parto vaginal</tspan><tspan x="292.0" dy="14.5">imposible</tspan></text><circle cx="282.0" cy="282.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="282.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="282.0" dy="0">2</tspan></text><rect x="406.0" y="282.0" width="110.0" height="103.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="416.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="90"><tspan x="416.0" dy="0">Prolapso de</tspan><tspan x="416.0" dy="16">cordón y vasa</tspan><tspan x="416.0" dy="16">previa</tspan></text><text x="416.0" y="347.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="90"><tspan x="416.0" dy="0">Riesgo fetal</tspan><tspan x="416.0" dy="14.5">inmediato</tspan></text><circle cx="406.0" cy="282.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="406.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="406.0" dy="0">3</tspan></text><rect x="530.0" y="282.0" width="110.0" height="137.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="540.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="90"><tspan x="540.0" dy="0">Desproporción</tspan><tspan x="540.0" dy="16">cefalopélvica,</tspan><tspan x="540.0" dy="16">rotura uterina</tspan><tspan x="540.0" dy="16">y herpes</tspan><tspan x="540.0" dy="16">genital activo</tspan></text><text x="540.0" y="379.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="90"><tspan x="540.0" dy="0">Parto vaginal</tspan><tspan x="540.0" dy="14.5">contraindicado</tspan></text><circle cx="530.0" cy="282.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="530.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="530.0" dy="0">4</tspan></text><rect x="654.0" y="445.0" width="110.0" height="118.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="664.0" y="461.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="90"><tspan x="664.0" dy="0">Cesárea</tspan><tspan x="664.0" dy="16">anterior</tspan></text><text x="664.0" y="494.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="90"><tspan x="664.0" dy="0">Prueba de parto</tspan><tspan x="664.0" dy="14.5">con una sola</tspan><tspan x="664.0" dy="14.5">incisión</tspan><tspan x="664.0" dy="14.5">transversa</tspan></text><circle cx="654.0" cy="445.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="654.0" y="449.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="654.0" dy="0">5</tspan></text><rect x="778.0" y="445.0" width="110.0" height="103.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="788.0" y="461.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="90"><tspan x="788.0" dy="0">Miomas</tspan><tspan x="788.0" dy="16">múltiples y</tspan><tspan x="788.0" dy="16">condilomas</tspan></text><text x="788.0" y="510.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="90"><tspan x="788.0" dy="0">Solo si obstruyen</tspan><tspan x="788.0" dy="14.5">el canal del parto</tspan></text><circle cx="778.0" cy="445.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="778.0" y="449.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="778.0" dy="0">6</tspan></text><rect x="902.0" y="445.0" width="110.0" height="102.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="912.0" y="461.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="90"><tspan x="912.0" dy="0">Macrosomía</tspan><tspan x="912.0" dy="16">fetal</tspan></text><text x="912.0" y="494.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="90"><tspan x="912.0" dy="0">Se discute con</tspan><tspan x="912.0" dy="14.5">5000 g (4500 g si</tspan><tspan x="912.0" dy="14.5">hay diabetes)</tspan></text><circle cx="902.0" cy="445.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="902.0" y="449.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="902.0" dy="0">7</tspan></text><rect x="40.0" y="613.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="639.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Placenta previa total = cesárea absoluta</tspan></text><text x="60.0" y="658.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Las demás alternativas son indicaciones relativas.</tspan></text><text x="40.0" y="725.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="735.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="766.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="738.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="757.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Placenta previa</tspan><tspan x="285.0" dy="17">total</tspan></text><text x="435.0" y="766.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Cesárea anterior</tspan></text><text x="585.0" y="766.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Miomatosis múltiple</tspan></text><text x="735.0" y="757.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Condilomatosis</tspan><tspan x="735.0" dy="17">perineal</tspan></text><text x="885.0" y="766.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Macrosomía fetal</tspan></text><rect x="40.0" y="789.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="789.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="826.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Indicación absoluta?</tspan></text><text x="285.0" y="810.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: el parto vaginal</tspan><tspan x="285.0" dy="16">causaría hemorragia</tspan><tspan x="285.0" dy="16">masiva</tspan></text><text x="435.0" y="810.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: permite prueba de</tspan><tspan x="435.0" dy="16">parto con una incisión</tspan><tspan x="435.0" dy="16">transversa</tspan></text><text x="585.0" y="818.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: solo obliga si</tspan><tspan x="585.0" dy="16">obstruye el canal</tspan></text><text x="735.0" y="818.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: solo obliga si</tspan><tspan x="735.0" dy="16">obstruye el canal</tspan></text><text x="885.0" y="810.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: se discute con</tspan><tspan x="885.0" dy="16">peso estimado de 5000</tspan><tspan x="885.0" dy="16">g o 4500 g</tspan></text><rect x="40.0" y="735.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="879.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="907.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="929.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Placenta previa total (central): cubre el orificio cervical interno; si persiste a las 36 semanas se programa cesárea entre las 36 y 37 semanas.</tspan><tspan x="58.0" dy="18">• Otras absolutas: transversa persistente, prolapso de cordón, vasa previa, desproporción cefalopélvica absoluta, rotura uterina y herpes genital activo.</tspan><tspan x="58.0" dy="18">• Relativas: cesárea previa (una incisión transversa permite prueba de parto), miomas y condilomas solo si obstruyen el canal; macrosomía con peso</tspan><tspan x="58.0" dy="18">   estimado de 5000 g (4500 g si hay diabetes).</tspan><tspan x="58.0" dy="18">• Alerta: ante sangrado indoloro del tercer trimestre no se hace tacto vaginal antes de la ecografía.</tspan></text><text x="58.0" y="1023.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Williams Obstetricia, 26.ª ed. (2022).</tspan></text></svg>