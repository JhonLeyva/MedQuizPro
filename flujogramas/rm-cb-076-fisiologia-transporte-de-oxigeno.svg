<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1271" viewBox="0 0 1000 1271" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El aumento de la PCO₂ (efecto Bohr) desplaza la curva de disociación de la hemoglobina hacia la derecha"><title>El aumento de la PCO₂ (efecto Bohr) desplaza la curva de disociación de la hemoglobina hacia la derecha</title><rect x="0.75" y="0.75" width="998.5" height="1269.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Fisiología · transporte de oxígeno</tspan></text><rect x="399.6" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="471.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="471.5" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Curva de disociación O₂-hemoglobina</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Curva sigmoidea por cooperatividad entre las cuatro subunidades; P50 de unos 26 mmHg.</tspan><tspan x="58.0" dy="17">Desvío a la derecha = menor afinidad y mayor P50.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de fisiología</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿En qué situación la curva está desplazada hacia la</tspan><tspan x="640.0" dy="16">derecha?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ DESPLAZA LA CURVA DE LA HEMOGLOBINA</tspan></text><rect x="493.0" y="319.0" width="14" height="190" rx="5" fill="#64748b"/><path d="M440.0 524.0 H560.0 L540.0 504.0 H460.0 Z" fill="#475569"/><circle cx="500.0" cy="319.0" r="15" fill="#f59e0b" stroke="#92400e" stroke-width="2"/><line x1="385.4" y1="300.9" x2="614.6" y2="337.1" stroke="#334155" stroke-width="7" stroke-linecap="round"/><line x1="385.4" y1="300.9" x2="357.4" y2="362.9" stroke="#64748b" stroke-width="2"/><line x1="385.4" y1="300.9" x2="413.4" y2="362.9" stroke="#64748b" stroke-width="2"/><path d="M347.4 362.9 H423.4 Q385.4 406.9 347.4 362.9 Z" fill="#64748b"/><text x="385.4" y="377.9" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="385.4" dy="0">RETIENE</tspan></text><line x1="614.6" y1="337.1" x2="586.6" y2="399.1" stroke="#64748b" stroke-width="2"/><line x1="614.6" y1="337.1" x2="642.6" y2="399.1" stroke="#64748b" stroke-width="2"/><path d="M576.6 399.1 H652.6 Q614.6 443.1 576.6 399.1 Z" fill="#ea580c"/><text x="614.6" y="414.1" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="614.6" dy="0">CEDE</tspan></text><text x="500.0" y="551.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="300"><tspan x="500.0" dy="0">¿Qué la desplaza a la derecha?</tspan></text><rect x="40.0" y="289.0" width="290.0" height="158.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58.0" y="317.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="58.0" dy="0">Desvío a la izquierda</tspan></text><circle cx="62.0" cy="342.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="346.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Hipotermia</tspan></text><circle cx="62.0" cy="368.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="372.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Aumento del pH (alcalosis)</tspan></text><circle cx="62.0" cy="394.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="398.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Disminución de 2,3-DPG</tspan></text><circle cx="62.0" cy="420.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="424.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Hemoglobina fetal, CO y metahemoglobina</tspan></text><rect x="670.0" y="289.0" width="290.0" height="158.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><text x="688.0" y="317.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="254"><tspan x="688.0" dy="0">Desvío a la derecha (este caso)</tspan></text><circle cx="692.0" cy="342.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="346.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Aumento de la PCO₂ (efecto Bohr)</tspan></text><circle cx="692.0" cy="368.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="372.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Acidosis, menor pH y fiebre</tspan></text><circle cx="692.0" cy="394.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="398.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Más 2,3-DPG: altura y anemia crónica</tspan></text><circle cx="692.0" cy="420.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="424.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Ejercicio intenso</tspan></text><rect x="844.6" y="278.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="293.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="585.0" width="920.0" height="93.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="613.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Aumento de PCO₂ = desvío a la derecha</tspan></text><text x="500.0" y="634.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Menor afinidad: la hemoglobina cede oxígeno a los tejidos.</tspan><tspan x="500.0" dy="17">Hipotermia, alcalosis y menos 2,3-DPG la desvían a la izquierda.</tspan></text><text x="40.0" y="712.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">FACTORES QUE DESPLAZAN LA CURVA DE DISOCIACIÓN</tspan></text><rect x="40.0" y="724.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="743.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Factor</tspan></text><text x="270.0" y="743.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="217"><tspan x="270.0" dy="0">Desvío</tspan></text><text x="503.3" y="743.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="217"><tspan x="503.3" dy="0">Afinidad por el O₂</tspan></text><text x="736.7" y="743.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="217"><tspan x="736.7" dy="0">P50</tspan></text><rect x="40.0" y="753.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="772.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Aumento de PCO₂</tspan></text><text x="270.0" y="772.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="217"><tspan x="270.0" dy="0">Derecha</tspan></text><text x="503.3" y="772.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="217"><tspan x="503.3" dy="0">Menor</tspan></text><text x="736.7" y="772.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="217"><tspan x="736.7" dy="0">Mayor</tspan></text><rect x="160.6" y="756.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="206.0" y="771.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="206.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="782.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="801.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Disminución de temperatura</tspan></text><text x="270.0" y="801.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="217"><tspan x="270.0" dy="0">Izquierda</tspan></text><text x="503.3" y="801.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="217"><tspan x="503.3" dy="0">Mayor</tspan></text><text x="736.7" y="801.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="217"><tspan x="736.7" dy="0">Menor</tspan></text><rect x="40.0" y="811.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="830.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Aumento de pH</tspan></text><text x="270.0" y="830.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="217"><tspan x="270.0" dy="0">Izquierda</tspan></text><text x="503.3" y="830.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="217"><tspan x="503.3" dy="0">Mayor</tspan></text><text x="736.7" y="830.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="217"><tspan x="736.7" dy="0">Menor</tspan></text><rect x="40.0" y="840.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="859.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Disminución de 2,3-DPG</tspan></text><text x="270.0" y="859.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="217"><tspan x="270.0" dy="0">Izquierda</tspan></text><text x="503.3" y="859.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="217"><tspan x="503.3" dy="0">Mayor</tspan></text><text x="736.7" y="859.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="217"><tspan x="736.7" dy="0">Menor</tspan></text><text x="40.0" y="885.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">La mioglobina no desplaza la curva: tiene una curva propia, hiperbólica y a la izquierda.</tspan></text><text x="40.0" y="932.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="942.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="973.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="964.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Disminución de</tspan><tspan x="285.0" dy="17">temperatura</tspan></text><rect x="363.0" y="945.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="973.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Aumento de PCO₂</tspan></text><text x="585.0" y="964.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Síntesis de</tspan><tspan x="585.0" dy="17">mioglobina</tspan></text><text x="735.0" y="973.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Aumento de pH</tspan></text><text x="885.0" y="964.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Disminución de</tspan><tspan x="885.0" dy="17">2,3-DPG</tspan></text><rect x="40.0" y="996.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="996.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1033.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Desvío a la derecha?</tspan></text><text x="285.0" y="1025.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: la hipotermia</tspan><tspan x="285.0" dy="16">aumenta la afinidad</tspan></text><text x="435.0" y="1033.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: efecto Bohr</tspan></text><text x="585.0" y="1017.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: la mioglobina tiene</tspan><tspan x="585.0" dy="16">otra curva, a la</tspan><tspan x="585.0" dy="16">izquierda</tspan></text><text x="735.0" y="1025.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: la alcalosis</tspan><tspan x="735.0" dy="16">aumenta la afinidad</tspan></text><text x="885.0" y="1025.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: menos 2,3-DPG</tspan><tspan x="885.0" dy="16">aumenta la afinidad</tspan></text><rect x="40.0" y="942.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1086.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1114.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1136.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Desvío a la derecha: aumento de la PCO₂ (efecto Bohr), acidosis o descenso del pH, mayor temperatura, más 2,3-DPG (altura, anemia crónica, hipoxia)</tspan><tspan x="58.0" dy="18">   y ejercicio intenso; la hemoglobina cede mejor el oxígeno.</tspan><tspan x="58.0" dy="18">• Desvío a la izquierda: hipotermia, alcalosis, menos 2,3-DPG y presencia de hemoglobina fetal, monóxido de carbono o metahemoglobina.</tspan><tspan x="58.0" dy="18">• La mioglobina tiene curva hiperbólica muy a la izquierda (P50 de 1 a 3 mmHg) porque almacena oxígeno en el músculo.</tspan><tspan x="58.0" dy="18">• Alerta: la sangre almacenada, pobre en 2,3-DPG, entrega mal el oxígeno al comienzo.</tspan></text><text x="58.0" y="1230.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Guyton y Hall, Tratado de Fisiología Médica, 14.ª ed. (2021); West J., Fisiología respiratoria: conceptos esenciales, 11.ª ed. (2021).</tspan></text></svg>