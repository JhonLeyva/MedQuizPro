<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="862" viewBox="0 0 1000 862" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Vólvulo de sigmoides: el semáforo de la isquemia decide la conducta"><title>Vólvulo de sigmoides: el semáforo de la isquemia decide la conducta</title><rect x="0.75" y="0.75" width="998.5" height="860.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstrucción de colon · vólvulo de sigmoides</tspan></text><rect x="464.5" y="32.0" width="253.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="591.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="237"><tspan x="591.2" dy="0">CIRUGÍA ENAM: OBSTRUCCIÓN INTESTINAL</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Vólvulo de sigmoides</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El sigmoides largo y redundante gira sobre su mesenterio: obstrucción en asa cerrada.</tspan><tspan x="58.0" dy="17">La conducta depende de si el asa ya sufre (isquemia, perforación) o todavía está viable.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 71 años, 4 días de distensión</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Sin flatos, abdomen timpánico, RHA ausentes, ampolla</tspan><tspan x="640.0" dy="16">rectal vacía.</tspan><tspan x="640.0" dy="16">Estable, afebril, leucocitos 9000; Rx: «grano de café».</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">IMAGEN DEL CASO Y SEMÁFORO DE CONDUCTA</tspan></text><rect x="40.0" y="285.0" width="310.0" height="400.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="295.0" width="151.4" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">RX SIMPLE DE ABDOMEN</tspan></text><g transform="translate(60.0,321.0) scale(0.9)"><rect x="0" y="0" width="300" height="330" rx="10" fill="#111827"/><rect x="138" y="18" width="24" height="22" rx="4" fill="#4b5563"/><rect x="138" y="46" width="24" height="22" rx="4" fill="#4b5563"/><rect x="138" y="74" width="24" height="22" rx="4" fill="#4b5563"/><rect x="138" y="102" width="24" height="22" rx="4" fill="#4b5563"/><rect x="138" y="130" width="24" height="22" rx="4" fill="#4b5563"/><rect x="138" y="158" width="24" height="22" rx="4" fill="#4b5563"/><rect x="138" y="186" width="24" height="22" rx="4" fill="#4b5563"/><rect x="138" y="214" width="24" height="22" rx="4" fill="#4b5563"/><rect x="138" y="242" width="24" height="22" rx="4" fill="#4b5563"/><path d="M36 272 C58 232 110 250 140 292 M264 272 C242 232 190 250 160 292" stroke="#9ca3af" stroke-width="10" fill="none"/><path d="M250 250 C272 190 270 110 240 62 C200 30 110 30 70 60 C40 100 36 190 56 250" stroke="#374151" stroke-width="24" fill="none"/><g transform="rotate(-22 150 180)"><path d="M150 292 C70 262 58 110 138 70 C150 64 162 64 172 70 C246 118 232 262 158 292 Z" fill="#e5e7eb" stroke="#f9fafb" stroke-width="4" opacity="0.93"/><path d="M154 290 C140 220 142 140 154 72" stroke="#6b7280" stroke-width="6" fill="none"/></g><text x="150" y="320" font-size="13" font-weight="800" fill="#fbbf24" text-anchor="middle" data-max="0">«Grano de café»</text><text x="14" y="24" font-size="12" font-weight="800" fill="#9ca3af" data-max="0">D</text></g><rect x="48.0" y="637.0" width="294.0" height="42.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0"/><text x="195.0" y="658.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="280"><tspan x="195.0" dy="0">Asa sigmoidea muy dilatada que nace en la pelvis y</tspan><tspan x="195.0" dy="15">apunta al hipocondrio derecho.</tspan></text><text x="370.0" y="297.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="590"><tspan x="370.0" dy="0">¿HAY SIGNOS DE SUFRIMIENTO DEL ASA?</tspan></text><rect x="370.0" y="307.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="321.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="325.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="325.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Afebril (T 37 °C)</tspan></text><rect x="370.0" y="339.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="353.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="357.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="357.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Hemodinamia estable (PA 124/82, FC 90)</tspan></text><rect x="370.0" y="371.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="385.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="389.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="389.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Leucocitos normales (9000/mm³)</tspan></text><rect x="370.0" y="403.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="417.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="421.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="421.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Sin defensa ni irritación peritoneal</tspan></text><rect x="370.0" y="445.0" width="590.0" height="81.0" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.2"/><circle cx="400.0" cy="485.5" r="17" fill="#16a34a" stroke="none" stroke-width="0"/><circle cx="400.0" cy="485.5" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="467.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Asa viable, sin isquemia</tspan></text><text x="430.0" y="484.0" font-size="11.5" font-weight="700" font-style="normal" fill="#16a34a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Devolvulación endoscópica</tspan></text><text x="430.0" y="500.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Rectosigmoidoscopia que destuerce y deja sonda rectal; luego sigmoidectomía electiva por</tspan><tspan x="430.0" dy="15">recurrencia.</tspan></text><rect x="854.6" y="434.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="900.0" y="449.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="900.0" dy="0">◆ ESTE CASO</tspan></text><rect x="370.0" y="534.0" width="590.0" height="66.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><circle cx="400.0" cy="567.0" r="17" fill="#f59e0b" stroke="none" stroke-width="0"/><circle cx="400.0" cy="567.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="556.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Falla o recurrencia</tspan></text><text x="430.0" y="573.0" font-size="11.5" font-weight="700" font-style="normal" fill="#f59e0b" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Cirugía programada o urgente</tspan></text><text x="430.0" y="589.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Si no se logra destorcer o reaparece: sigmoidectomía.</tspan></text><rect x="370.0" y="608.0" width="590.0" height="66.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><circle cx="400.0" cy="641.0" r="17" fill="#dc2626" stroke="none" stroke-width="0"/><circle cx="400.0" cy="641.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="630.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Isquemia, perforación o peritonitis</tspan></text><text x="430.0" y="647.0" font-size="11.5" font-weight="700" font-style="normal" fill="#dc2626" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Laparotomía de urgencia</tspan></text><text x="430.0" y="663.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Fiebre, leucocitosis, defensa o mucosa negra en la endoscopía: resección (Hartmann).</tspan></text><rect x="40.0" y="713.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="741.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="763.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Rx con «grano de café» = vólvulo de sigmoides; es típico del anciano con estreñimiento crónico.</tspan><tspan x="58.0" dy="18">• Sin signos de isquemia, primero se destuerce por endoscopía; la cirugía es para el asa sufriente o el fracaso.</tspan><tspan x="58.0" dy="18">• La neostigmina es para la pseudoobstrucción (Ogilvie), no para una torsión mecánica.</tspan></text><text x="58.0" y="821.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Sabiston Tratado de Cirugía 21.ª ed.; guía ASCRS de vólvulo de colon (2021).</tspan></text></svg>