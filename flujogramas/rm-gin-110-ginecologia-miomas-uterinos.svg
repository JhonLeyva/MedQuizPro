<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1218" viewBox="0 0 1000 1218" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Hipermenorrea y útero comparable a 14 semanas en una mujer de 48 años: mioma intramural"><title>Hipermenorrea y útero comparable a 14 semanas en una mujer de 48 años: mioma intramural</title><rect x="0.75" y="0.75" width="998.5" height="1216.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ginecología · miomas uterinos</tspan></text><rect x="381.8" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="461.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="461.6" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Leiomioma uterino</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tumor pélvico benigno más frecuente: hasta 70-80 % a los 50 años.</tspan><tspan x="58.0" dy="17">Depende de estrógenos y progesterona y suele disminuir tras la menopausia.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 48 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Hipermenorrea de un año.</tspan><tspan x="640.0" dy="16">Útero aumentado de consistencia y volumen,</tspan><tspan x="640.0" dy="16">comparable a gestación de 14 semanas.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE DISTINGUE CADA TIPO DE MIOMA</tspan></text><rect x="40.0" y="285.0" width="453.0" height="79.0" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2.4"/><text x="54.0" y="312.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Intramural (este caso)</tspan></text><text x="54.0" y="329.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Agranda el útero de forma difusa; firme, comparable a una gestación</tspan><tspan x="54.0" dy="16">Hipermenorrea por mayor superficie endometrial</tspan></text><rect x="391.2" y="274.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="436.6" y="289.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="436.6" dy="0">◆ ESTE CASO</tspan></text><rect x="507.0" y="285.0" width="453.0" height="79.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="521.0" y="312.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Submucoso</tspan></text><text x="521.0" y="329.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Deforma el endometrio y sangra más, aun siendo pequeño</tspan><tspan x="521.0" dy="16">Resección histeroscópica</tspan></text><rect x="40.0" y="378.0" width="453.0" height="79.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="54.0" y="405.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Subseroso, intraligamentario y cervical</tspan></text><text x="54.0" y="422.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Síntomas de masa, dolor y compresión de vejiga o recto</tspan><tspan x="54.0" dy="16">Sangrado menor</tspan></text><rect x="507.0" y="378.0" width="453.0" height="79.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="521.0" y="405.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Qué más se descarta</tspan></text><text x="521.0" y="422.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Adenomiosis: útero globuloso y dismenorrea</tspan><tspan x="521.0" dy="16">Cáncer de endometrio: biopsia desde los 45 años</tspan></text><rect x="40.0" y="475.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="501.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Útero de 14 semanas con hipermenorrea = mioma intramural</tspan></text><text x="60.0" y="520.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Submucoso sangra más, pero con útero normal o poco aumentado; los otros dan masa o compresión.</tspan></text><text x="40.0" y="581.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN FIGO DE LOS LEIOMIOMAS SEGÚN SU LOCALIZACIÓN</tspan></text><rect x="40.0" y="593.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="612.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Grupo</tspan></text><text x="250.0" y="612.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="224"><tspan x="250.0" dy="0">Tipos FIGO</tspan></text><text x="490.0" y="612.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="224"><tspan x="490.0" dy="0">Descripción</tspan></text><text x="730.0" y="612.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="224"><tspan x="730.0" dy="0">Síntoma predominante</tspan></text><rect x="40.0" y="622.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="641.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Submucoso</tspan></text><text x="250.0" y="641.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="250.0" dy="0">0, 1 y 2</tspan></text><text x="490.0" y="641.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="490.0" dy="0">0 intracavitario; 1 con menos de 50 %</tspan><tspan x="490.0" dy="15">intramural; 2 con 50 % o más intramural</tspan></text><text x="730.0" y="641.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="730.0" dy="0">Sangrado intenso y persistente,</tspan><tspan x="730.0" dy="15">infertilidad</tspan></text><rect x="40.0" y="666.0" width="920.0" height="59.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="685.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Intramural</tspan></text><text x="250.0" y="685.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="250.0" dy="0">3, 4 y 5</tspan></text><text x="490.0" y="685.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="490.0" dy="0">3 contacta el endometrio; 4 totalmente</tspan><tspan x="490.0" dy="15">intramural; 5 subseroso con 50 % o más</tspan><tspan x="490.0" dy="15">intramural</tspan></text><text x="730.0" y="685.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="730.0" dy="0">Útero grande, sangrado o presión</tspan></text><rect x="140.6" y="684.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="186.0" y="699.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="186.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="725.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="744.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Subseroso</tspan></text><text x="250.0" y="744.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="250.0" dy="0">6 y 7</tspan></text><text x="490.0" y="744.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="490.0" dy="0">6 con menos de 50 % intramural; 7</tspan><tspan x="490.0" dy="15">pediculado</tspan></text><text x="730.0" y="744.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="730.0" dy="0">Masa o dolor; a menudo asintomático</tspan></text><rect x="40.0" y="769.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="788.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Otros</tspan></text><text x="250.0" y="788.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="250.0" dy="0">8</tspan></text><text x="490.0" y="788.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="490.0" dy="0">Cervical, ligamento ancho o parasitario</tspan></text><text x="730.0" y="788.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="730.0" dy="0">Según la ubicación</tspan></text><text x="40.0" y="814.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Un útero de 14 semanas con hipermenorrea se explica mejor por un mioma intramural voluminoso.</tspan></text><text x="40.0" y="861.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="871.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="902.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="902.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Mioma subseroso</tspan></text><text x="435.0" y="893.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Mioma</tspan><tspan x="435.0" dy="17">intraligamentario</tspan></text><text x="585.0" y="902.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Mioma submucoso</tspan></text><text x="735.0" y="902.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Mioma cervical</tspan></text><rect x="813.0" y="874.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="902.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Mioma intramural</tspan></text><rect x="40.0" y="925.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="925.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="962.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="954.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: da masa o dolor,</tspan><tspan x="285.0" dy="16">sin hipermenorrea</tspan></text><text x="435.0" y="954.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: da síntomas de</tspan><tspan x="435.0" dy="16">masa o compresión</tspan></text><text x="585.0" y="946.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sangra más, pero</tspan><tspan x="585.0" dy="16">suele ser un útero de</tspan><tspan x="585.0" dy="16">tamaño menor</tspan></text><text x="735.0" y="954.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: da síntomas de</tspan><tspan x="735.0" dy="16">masa y compresión</tspan></text><text x="885.0" y="954.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: agranda el útero y</tspan><tspan x="885.0" dy="16">causa menorragia</tspan></text><rect x="40.0" y="871.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1015.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1043.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1065.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El mioma intramural crece en la pared, agranda el útero de forma difusa y simétrica, lo palpa firme y aumenta la superficie endometrial: causa</tspan><tspan x="58.0" dy="18">   menorragia.</tspan><tspan x="58.0" dy="18">• El submucoso sangra más aun siendo pequeño; subseroso, intraligamentario y cervical dan masa, dolor y compresión de vejiga o recto.</tspan><tspan x="58.0" dy="18">• Diferencial: adenomiosis (útero globuloso de hasta 12 semanas y dismenorrea) y cáncer o hiperplasia de endometrio: biopsia en mayores de 45 años con</tspan><tspan x="58.0" dy="18">   sangrado.</tspan><tspan x="58.0" dy="18">• Tratamiento según deseo de fertilidad: ácido tranexámico, DIU de levonorgestrel, antagonistas de GnRH, embolización, miomectomía o histerectomía.</tspan></text><text x="58.0" y="1177.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, Practice Bulletin 228 (Obstet Gynecol 2021); Munro et al., FIGO (Int J Gynaecol Obstet 2018); Berek y Novak, Ginecología, 16.ª ed. (2020)</tspan></text></svg>