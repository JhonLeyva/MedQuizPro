<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1175" viewBox="0 0 1000 1175" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Joven con cáncer testicular no seminomatoso: el marcador para el seguimiento es la alfafetoproteína (junto a hCG y LDH)"><title>Joven con cáncer testicular no seminomatoso: el marcador para el seguimiento es la alfafetoproteína (junto a hCG y LDH)</title><rect x="0.75" y="0.75" width="998.5" height="1173.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Cáncer de testículo · marcadores</tspan></text><rect x="396.2" y="32.0" width="127.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="459.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="111"><tspan x="459.9" dy="0">NEFROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Marcadores del cáncer de testículo</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">AFP, hCG beta y LDH se piden antes y después de la orquiectomía: estadifican, dan</tspan><tspan x="58.0" dy="17">pronóstico y vigilan la recaída.</tspan><tspan x="58.0" dy="17">La AFP elevada significa componente NO seminomatoso (saco vitelino, carcinoma</tspan><tspan x="58.0" dy="17">embrionario): el seminoma puro nunca la eleva.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 18 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Tumor del testículo derecho.</tspan><tspan x="640.0" dy="16">Biopsia: no seminoma. ¿Qué marcador para el</tspan><tspan x="640.0" dy="16">seguimiento?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿QUÉ MARCADOR SUBE EN CADA TUMOR GERMINAL?</tspan></text><rect x="40.0" y="285.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="307.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="170"><tspan x="54.0" dy="0">TIPO DE TUMOR</tspan></text><text x="412.5" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="345"><tspan x="412.5" dy="0">AFP (alfafetoproteína)</tspan></text><text x="777.5" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="345"><tspan x="777.5" dy="0">hCG beta</tspan></text><rect x="40.0" y="325.0" width="184.0" height="71.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="351.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">No seminoma</tspan></text><text x="54.0" y="368.0" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Saco vitelino, embrionario,</tspan><tspan x="54.0" dy="14">coriocarcinoma</tspan></text><rect x="233.0" y="325.0" width="359.0" height="71.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="245.0" y="357.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Sube</tspan></text><text x="245.0" y="373.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Saco vitelino y embrionario</tspan></text><rect x="491.2" y="314.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="536.6" y="329.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="536.6" dy="0">◆ ESTE CASO</tspan></text><rect x="598.0" y="325.0" width="359.0" height="71.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="610.0" y="357.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Sube</tspan></text><text x="610.0" y="373.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Muy alta en coriocarcinoma</tspan></text><rect x="40.0" y="402.0" width="184.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="435.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Seminoma puro</tspan></text><rect x="233.0" y="402.0" width="359.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="245.0" y="427.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">NUNCA sube</tspan></text><text x="245.0" y="443.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Si sube, es no seminoma</tspan></text><rect x="598.0" y="402.0" width="359.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="610.0" y="427.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Puede subir (leve)</tspan></text><text x="610.0" y="443.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">15-20 %</tspan></text><text x="44.0" y="481.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">La LDH acompaña a ambos y refleja el volumen tumoral.</tspan></text><text x="40.0" y="529.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="541.0" width="298.0" height="307.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="551.0" width="146.8" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="565.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="256"><tspan x="61.0" dy="0">DÓNDE ESTÁ EL TUMOR</tspan></text><g data-box="54.0 579.0 270.0 232.0"><g transform="translate(64.0,579.0) scale(1.0)"><path d="M40 70 C30 150 70 210 130 212 C190 210 230 150 220 70 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M130 76 L130 206" fill="none" stroke="#e9b48f" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M70 10 L86 74 M190 10 L174 74" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="48" y="14" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">conducto inguinal</text><text x="8" y="226" font-size="11" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">D</text><text x="252" y="226" font-size="11" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">I</text><ellipse cx="88" cy="140" rx="30" ry="40" fill="#fde7f3" stroke="#9d174d" stroke-width="2" /><path d="M74 124 C82 110 104 114 106 132 C108 150 92 160 80 152 C70 146 68 134 74 124 Z" fill="#78716c" stroke="#44403c" stroke-width="1.5" stroke-linejoin="round" /><text x="88" y="196" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">masa sólida</text><text x="88" y="196" font-size="10.5" font-weight="800" fill="#ea580c" text-anchor="middle" data-max="0">masa sólida</text><ellipse cx="172" cy="140" rx="30" ry="40" fill="#fde7f3" stroke="#9d174d" stroke-width="2" /></g></g><text x="54.0" y="829.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="270"><tspan x="54.0" dy="0">Masa testicular</tspan></text><rect x="358.0" y="541.0" width="602.0" height="97.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="380.0" cy="589.5" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="380.0" y="593.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="380.0" dy="0">1</tspan></text><text x="402.0" y="583.5" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="542"><tspan x="402.0" dy="0">Masa dura e indolora</tspan></text><text x="402.0" y="605.0" font-size="12.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="542"><tspan x="402.0" dy="0">En un testículo de un hombre joven: cáncer hasta demostrar lo contrario.</tspan></text><rect x="358.0" y="646.0" width="602.0" height="97.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="380.0" cy="694.5" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="380.0" y="698.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="380.0" dy="0">2</tspan></text><text x="402.0" y="688.5" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="542"><tspan x="402.0" dy="0">Ecografía escrotal</tspan></text><text x="402.0" y="710.0" font-size="12.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="542"><tspan x="402.0" dy="0">Primer examen.</tspan></text><rect x="358.0" y="751.0" width="602.0" height="97.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="380.0" cy="799.5" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="380.0" y="803.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="380.0" dy="0">3</tspan></text><text x="402.0" y="793.5" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="542"><tspan x="402.0" dy="0">Orquiectomía inguinal</tspan></text><text x="402.0" y="815.0" font-size="12.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="542"><tspan x="402.0" dy="0">Diagnostica y trata.</tspan></text><text x="40.0" y="888.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="898.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="929.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="901.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="929.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Alfa Feto Proteína</tspan></text><text x="435.0" y="920.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Antígeno</tspan><tspan x="435.0" dy="17">carcinoembrionario</tspan></text><text x="585.0" y="920.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Antígeno</tspan><tspan x="585.0" dy="17">polipeptídico tisular</tspan></text><text x="735.0" y="920.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Antígeno prostático</tspan><tspan x="735.0" dy="17">específico</tspan></text><text x="885.0" y="929.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Ca 19-9</tspan></text><rect x="40.0" y="952.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="952.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="981.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Marcador?</tspan></text><text x="285.0" y="973.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: sube en el no</tspan><tspan x="285.0" dy="16">seminoma</tspan></text><text x="435.0" y="973.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es del cáncer</tspan><tspan x="435.0" dy="16">colorrectal</tspan></text><text x="585.0" y="981.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: inespecífico</tspan></text><text x="735.0" y="981.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es de la próstata</tspan></text><text x="885.0" y="981.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es del páncreas</tspan></text><rect x="40.0" y="898.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1026.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1054.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1076.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Orquiectomía radical por vía inguinal (nunca biopsia ni cirugía por el escroto).</tspan><tspan x="58.0" dy="18">• Marcadores antes y después de la cirugía (la AFP baja a la mitad en 5-7 días) y TC de tórax, abdomen y pelvis.</tspan><tspan x="58.0" dy="18">• Ofrecer banco de semen antes del tratamiento.</tspan></text><text x="58.0" y="1134.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: EAU, tumores testiculares (2025); NCCN (2026).</tspan></text></svg>