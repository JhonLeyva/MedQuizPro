l de rojo sin causar daño</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Bombero de 50 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">12 h en incendio de plásticos · COHb 30 %</tspan><tspan x="640.0" dy="16">Tras hidroxicobalamina: mejora y orina roja</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EMBUDO DE CAUSAS</tspan></text><text x="614.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,293.0 580.0,293.0 531.7,369.0 88.3,369.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="309.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="341.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="399"><tspan x="310.0" dy="0">Orina roja tras tratamiento</tspan></text><line x1="559.8" y1="331.0" x2="606.0" y2="331.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="302.0" width="118.8" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="673.4" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="673.4" dy="0">Hidroxicobalamina</tspan></text><rect x="738.8" y="302.0" width="92.0" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="784.8" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="784.8" dy="0">Mioglobinuria</tspan></text><rect x="836.8" y="302.0" width="76.3" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="875.0" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="875.0" dy="0">Hematuria</tspan></text><rect x="614.0" y="334.0" width="59.3" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="643.6" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="643.6" dy="0">Porfiria</tspan></text><polygon points="88.3,373.0 531.7,373.0 483.3,429.0 136.7,429.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="162.7" cy="401.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="162.7" y="405.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="162.7" dy="0">1</tspan></text><text x="320.0" y="405.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="283"><tspan x="320.0" dy="0">Sin trauma muscular ni dolor</tspan></text><line x1="511.5" y1="401.0" x2="606.0" y2="401.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="388.0" width="104.1" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="666.0" y="405.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="666.0" dy="0">✕ Mioglobinuria</tspan></text><line x1="636.0" y1="401.5" x2="708.1" y2="401.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="136.7,433.0 483.3,433.0 435.0,489.0 185.0,489.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="461.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="465.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">2</tspan></text><text x="320.0" y="465.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">Aparece tras el antídoto</tspan></text><line x1="463.2" y1="461.0" x2="606.0" y2="461.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="448.0" width="88.4" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="658.2" y="465.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="658.2" dy="0">✕ Hematuria</tspan></text><line x1="636.0" y1="461.5" x2="692.4" y2="461.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="708.4" y="448.0" width="71.4" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="744.1" y="465.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="744.1" dy="0">✕ Porfiria</tspan></text><line x1="730.4" y1="461.5" x2="769.8" y2="461.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="493.0" x2="310.0" y2="512.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,511.0 315.0,511.0 310.0,519.0" fill="#0f766e"/><rect x="140.0" y="523.0" width="340.0" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="552.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">HIDROXICOBALAMINA</tspan></text><text x="310.0" y="576.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Cromaturia benigna</tspan><tspan x="310.0" dy="17">Dura varios días</tspan></text><rect x="370.6" y="512.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="527.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="538.9" width="346.0" height="60.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="558.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="576.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">Puede alterar pruebas colorimétricas de laboratorio.</tspan></text><rect x="40.0" y="638.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="666.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="688.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Humo de plásticos: CO y cianuro a la vez.</tspan><tspan x="58.0" dy="18">• Lactato alto sugiere intoxicación por cianuro.</tspan><tspan x="58.0" dy="18">• Oxígeno al 100 % para el monóxido.</tspan></text><text x="58.0" y="746.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Goldfrank's Toxicologic Emergencies 11.ª ed. (2019)</tspan></text></svg>