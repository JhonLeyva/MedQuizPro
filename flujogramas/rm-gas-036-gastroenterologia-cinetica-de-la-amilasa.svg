<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1057" viewBox="0 0 1000 1057" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La amilasa se eleva en las primeras 2 a 12 horas de la pancreatitis aguda, pero no es específica"><title>La amilasa se eleva en las primeras 2 a 12 horas de la pancreatitis aguda, pero no es específica</title><rect x="0.75" y="0.75" width="998.5" height="1055.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Gastroenterología · cinética de la amilasa</tspan></text><rect x="444.8" y="32.0" width="165.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="527.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="149"><tspan x="527.5" dy="0">GASTROENTEROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Amilasa en la pancreatitis aguda</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Sube a las pocas horas del dolor y se normaliza en pocos días.</tspan><tspan x="58.0" dy="17">No es específica ni predice la gravedad.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es la característica de la amilasa con respecto a</tspan><tspan x="640.0" dy="16">la pancreatitis aguda?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CUÁNTO TIEMPO PERMANECE ELEVADA CADA ENZIMA (DÍAS DESDE EL DOLOR; RANGOS ORIENTATIVOS)</tspan></text><line x1="290.0" y1="291.0" x2="290.0" y2="371.0" stroke="#e2e8f0" stroke-width="1"/><text x="290.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="290.0" dy="0">0</tspan></text><line x1="382.9" y1="291.0" x2="382.9" y2="371.0" stroke="#e2e8f0" stroke-width="1"/><text x="382.9" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="382.9" dy="0">2</tspan></text><line x1="475.7" y1="291.0" x2="475.7" y2="371.0" stroke="#e2e8f0" stroke-width="1"/><text x="475.7" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="475.7" dy="0">4</tspan></text><line x1="568.6" y1="291.0" x2="568.6" y2="371.0" stroke="#e2e8f0" stroke-width="1"/><text x="568.6" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="568.6" dy="0">6</tspan></text><line x1="661.4" y1="291.0" x2="661.4" y2="371.0" stroke="#e2e8f0" stroke-width="1"/><text x="661.4" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="661.4" dy="0">8</tspan></text><line x1="754.3" y1="291.0" x2="754.3" y2="371.0" stroke="#e2e8f0" stroke-width="1"/><text x="754.3" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="754.3" dy="0">10</tspan></text><line x1="847.1" y1="291.0" x2="847.1" y2="371.0" stroke="#e2e8f0" stroke-width="1"/><text x="847.1" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="847.1" dy="0">12</tspan></text><line x1="940.0" y1="291.0" x2="940.0" y2="371.0" stroke="#e2e8f0" stroke-width="1"/><text x="940.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="940.0" dy="0">14</tspan></text><text x="940.0" y="273.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="end" data-max="60"><tspan x="940.0" dy="0">días</tspan></text><rect x="40.0" y="295.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="311.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Amilasa: sube a las 2-12 h</tspan></text><text x="48.0" y="326.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Máximo a las 24-48 h; normal en 3-5 días</tspan></text><rect x="294.6" y="303.0" width="227.5" height="22.0" rx="6" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="48.0" y="349.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Lipasa</tspan></text><text x="48.0" y="364.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Más específica; permanece elevada más tiempo</tspan></text><rect x="299.3" y="341.0" width="547.9" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><line x1="313.2" y1="293.0" x2="313.2" y2="377.0" stroke="#b91c1c" stroke-width="2.6"/><rect x="262.4" y="377.0" width="101.7" height="22.0" rx="11" fill="#b91c1c" stroke="none" stroke-width="1.5"/><text x="313.2" y="392.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="313.2" dy="0">Primeras horas</tspan></text><rect x="40.0" y="423.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="449.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Amilasa = sube en horas y baja en pocos días</tspan></text><text x="60.0" y="468.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">No dura hasta el décimo día; la lipasa permanece elevada más tiempo.</tspan></text><text x="40.0" y="529.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">GRAVEDAD DE LA PANCREATITIS AGUDA (ATLANTA REVISADA 2012)</tspan></text><rect x="40.0" y="541.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="560.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="144"><tspan x="50.0" dy="0">Grado</tspan></text><text x="210.0" y="560.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="364"><tspan x="210.0" dy="0">Definición</tspan></text><text x="590.0" y="560.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="364"><tspan x="590.0" dy="0">Conducta</tspan></text><rect x="40.0" y="570.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="589.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="144"><tspan x="50.0" dy="0">Leve</tspan></text><text x="210.0" y="589.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="364"><tspan x="210.0" dy="0">Sin falla orgánica ni complicaciones locales o sistémicas</tspan></text><text x="590.0" y="589.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="364"><tspan x="590.0" dy="0">Dieta oral precoz e hidratación; alta en pocos días</tspan></text><rect x="40.0" y="599.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="618.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="144"><tspan x="50.0" dy="0">Moderadamente grave</tspan></text><text x="210.0" y="618.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="364"><tspan x="210.0" dy="0">Falla orgánica transitoria (menos de 48 h) o complicaciones</tspan><tspan x="210.0" dy="15">locales o sistémicas</tspan></text><text x="590.0" y="618.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="364"><tspan x="590.0" dy="0">Hospitalizar, vigilar y tratar la complicación</tspan></text><rect x="40.0" y="643.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="662.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="144"><tspan x="50.0" dy="0">Grave</tspan></text><text x="210.0" y="662.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="364"><tspan x="210.0" dy="0">Falla orgánica persistente (más de 48 h)</tspan></text><text x="590.0" y="662.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="364"><tspan x="590.0" dy="0">Cuidados intensivos y soporte orgánico</tspan></text><text x="40.0" y="688.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">La falla orgánica se mide con la escala de Marshall modificada. La amilasa no define el grado; el caso de la pregunta es teórico.</tspan></text><text x="40.0" y="735.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="745.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="784.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="748.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="776.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Se eleva entre las 2</tspan><tspan x="285.0" dy="17">y 12 primeras horas</tspan></text><text x="435.0" y="776.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Permanece elevada</tspan><tspan x="435.0" dy="17">hasta el décimo día</tspan></text><text x="585.0" y="776.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Es un signo</tspan><tspan x="585.0" dy="17">característico</tspan></text><text x="735.0" y="767.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Su magnitud</tspan><tspan x="735.0" dy="17">determina el</tspan><tspan x="735.0" dy="17">pronóstico</tspan></text><text x="885.0" y="776.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Solo se eleva en</tspan><tspan x="885.0" dy="17">esta patología</tspan></text><rect x="40.0" y="816.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="816.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="837.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué dice de la</tspan><tspan x="54.0" dy="16">amilasa?</tspan></text><text x="285.0" y="837.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: sube en las</tspan><tspan x="285.0" dy="16">primeras 2 a 12 horas</tspan></text><text x="435.0" y="837.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: se normaliza en</tspan><tspan x="435.0" dy="16">pocos días</tspan></text><text x="585.0" y="837.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: se eleva en otras</tspan><tspan x="585.0" dy="16">enfermedades</tspan></text><text x="735.0" y="837.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no predice la</tspan><tspan x="735.0" dy="16">gravedad</tspan></text><text x="885.0" y="837.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: también sube en</tspan><tspan x="885.0" dy="16">parotiditis y perforación</tspan></text><rect x="40.0" y="745.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="890.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="918.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="940.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Criterios de Atlanta 2012 (2 de 3): dolor abdominal típico, lipasa o amilasa mayor de 3 veces el límite normal, e imagen compatible.</tspan><tspan x="58.0" dy="18">• Amilasa: sube a las 2-12 horas, máximo hacia las 24-48 horas y baja en 3 a 5 días; no queda elevada hasta el décimo día.</tspan><tspan x="58.0" dy="18">• No es patognomónica (parotiditis, perforación, isquemia mesentérica, macroamilasemia, falla renal) y su magnitud no mide la gravedad.</tspan><tspan x="58.0" dy="18">• La lipasa es más específica y dura más; ALT mayor de 150 U/L sugiere origen biliar. Gravedad: falla orgánica persistente, Marshall modificado y BISAP.</tspan></text><text x="58.0" y="1016.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACG Guidelines: Management of Acute Pancreatitis. Am J Gastroenterol 2024;119:419-437; Banks PA et al. Gut 2013;62:102-111; Sabiston Tratado de Cirugía 21.ª ed.</tspan></text></svg>