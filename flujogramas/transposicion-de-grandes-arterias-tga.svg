<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="669" viewBox="0 0 1000 669" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Cardiopatías congénitas cianóticas"><title>Cardiopatías congénitas cianóticas</title><rect x="0.75" y="0.75" width="998.5" height="667.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16" y="16" width="968" height="56" rx="10" fill="#0f766e"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170" y1="34.0" x2="170" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="649"><tspan x="184.0" dy="0">CARDIOLOGÍA ENAM: CARDIOPATÍAS CONGÉNITAS CIANÓTICAS</tspan></text><rect x="853.3" y="32.0" width="110.7" height="24" rx="12" fill="#134e4a"/><text x="908.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="95"><tspan x="908.6" dy="0">CARDIOLOGÍA</tspan></text><rect x="190.0" y="90.0" width="620" height="86.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="500.0" y="118.5" font-size="14.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Lactante de 15 días con cianosis, polipnea y lactancia</tspan><tspan x="500.0" dy="19.0">entrecortada</tspan></text><text x="500.0" y="160.0" font-size="12" font-weight="400" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Rx: silueta en «huevo acostado», pedículo estrecho, flujo pulmonar aumentado</tspan></text><line x1="500.0" y1="176.0" x2="500.0" y2="196.0" stroke="#0f766e" stroke-width="2"/><line x1="186.0" y1="196.0" x2="814.0" y2="196.0" stroke="#0f766e" stroke-width="2"/><line x1="186.0" y1="196.0" x2="186.0" y2="215.0" stroke="#0f766e" stroke-width="2"/><polygon points="181.0,214.0 191.0,214.0 186.0,222.0" fill="#0f766e"/><line x1="500.0" y1="196.0" x2="500.0" y2="215.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,214.0 505.0,214.0 500.0,222.0" fill="#0f766e"/><line x1="814.0" y1="196.0" x2="814.0" y2="215.0" stroke="#0f766e" stroke-width="2"/><polygon points="809.0,214.0 819.0,214.0 814.0,222.0" fill="#0f766e"/><rect x="40.0" y="222.0" width="292" height="166.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><path d="M40.0,232.0 a10,10 0 0 1 10,-10 h272 a10,10 0 0 1 10,10 v40.0 h-292 z" fill="#0f766e"/><text x="186.0" y="246.5" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="264"><tspan x="186.0" dy="0">Transposición de grandes</tspan><tspan x="186.0" dy="18.0">arterias</tspan></text><text x="186.0" y="296.0" font-size="12" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="264"><tspan x="186.0" dy="0">Cianosis en las primeras horas o</tspan><tspan x="186.0" dy="17">días</tspan><tspan x="186.0" dy="17">«Huevo acostado», pedículo estrecho</tspan><tspan x="186.0" dy="17">Flujo pulmonar AUMENTADO</tspan><tspan x="186.0" dy="17">Circulaciones en paralelo</tspan></text><rect x="239.8" y="212.0" width="84.2" height="20" rx="10" fill="#f59e0b"/><text x="281.9" y="226.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="281.9" dy="0">✓ RESPUESTA</tspan></text><rect x="354.0" y="222.0" width="292" height="166.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><path d="M354.0,232.0 a10,10 0 0 1 10,-10 h272 a10,10 0 0 1 10,10 v22.0 h-292 z" fill="#e2e8f0"/><text x="500.0" y="246.5" font-size="13.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="264"><tspan x="500.0" dy="0">Tetralogía de Fallot</tspan></text><text x="500.0" y="278.0" font-size="12" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="264"><tspan x="500.0" dy="0">Cianosis progresiva, crisis</tspan><tspan x="500.0" dy="17">hipoxémicas</tspan><tspan x="500.0" dy="17">Corazón «en bota»</tspan><tspan x="500.0" dy="17">Flujo pulmonar DISMINUIDO</tspan><tspan x="500.0" dy="17">Soplo de estenosis pulmonar</tspan></text><rect x="668.0" y="222.0" width="292" height="166.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><path d="M668.0,232.0 a10,10 0 0 1 10,-10 h272 a10,10 0 0 1 10,10 v22.0 h-292 z" fill="#e2e8f0"/><text x="814.0" y="246.5" font-size="13.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="264"><tspan x="814.0" dy="0">CIV / Ductus</tspan></text><text x="814.0" y="278.0" font-size="12" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="264"><tspan x="814.0" dy="0">Acianóticas (cortocircuito</tspan><tspan x="814.0" dy="17">izq.–der.)</tspan><tspan x="814.0" dy="17">Insuficiencia cardiaca a las semanas</tspan><tspan x="814.0" dy="17">Flujo pulmonar aumentado</tspan><tspan x="814.0" dy="17">Sin cianosis central</tspan></text><line x1="186.0" y1="388.0" x2="186.0" y2="409.0" stroke="#0f766e" stroke-width="2"/><polygon points="181.0,408.0 191.0,408.0 186.0,416.0" fill="#0f766e"/><rect x="100.0" y="416.0" width="800" height="100.0" rx="10" fill="#134e4a" stroke="#134e4a" stroke-width="1.5"/><text x="500.0" y="442.0" font-size="12" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="772"><tspan x="500.0" dy="0">MANEJO DE LA TGA</tspan></text><text x="500.0" y="465.0" font-size="12.5" font-weight="400" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="772"><tspan x="500.0" dy="0">Prostaglandina E1 para mantener el ductus</tspan><tspan x="500.0" dy="17.5">Septostomía con balón (Rashkind) si la mezcla es insuficiente</tspan><tspan x="500.0" dy="17.5">Switch arterial (Jatene) en las primeras semanas</tspan></text><rect x="40" y="542.0" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="570.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="592.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Cianosis neonatal precoz que no mejora con oxígeno + flujo pulmonar aumentado → TGA.</tspan><tspan x="58.0" dy="18">• Es la cardiopatía cianótica más frecuente en el período neonatal.</tspan></text><text x="58.0" y="632.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Nelson Tratado de Pediatría 22.ª ed. · AHA/ACC Congenital Heart Disease Guidelines</tspan></text></svg>
