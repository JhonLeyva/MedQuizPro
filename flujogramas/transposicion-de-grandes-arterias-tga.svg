<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1048" viewBox="0 0 820 1048" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Transposición de grandes arterias (TGA)"><title>Transposición de grandes arterias (TGA)</title><rect width="820" height="1048" fill="#ffffff"/><rect x="0" y="0" width="820" height="112" fill="#0f766e"/><text x="40" y="34" font-size="13" font-weight="600" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="740"><tspan x="40" dy="0">MedQuizPlus · Flujograma</tspan></text><text x="40" y="70" font-size="24" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="740"><tspan x="40" dy="0">Transposición de grandes arterias (TGA)</tspan></text><text x="40" y="96" font-size="13" font-weight="400" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="740"><tspan x="40" dy="0">ENAM 2020 · CAR-005 · Cardiología</tspan></text><rect x="90" y="144" width="640" height="76" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="108" y="172" font-size="11" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="604"><tspan x="108" dy="0">INICIO</tspan></text><text x="108" y="196" font-size="16" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Neonato con cianosis precoz que no mejora con oxígeno</tspan></text><line x1="410.0" y1="222" x2="410.0" y2="242" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,240 417.0,240 410.0,250" fill="#94a3b8"/><rect x="90" y="252" width="640" height="98" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><circle cx="120" cy="301.0" r="12" fill="#d97706"/><text x="120" y="306.0" font-size="15" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="120" dy="0">?</tspan></text><text x="142" y="280" font-size="11" font-weight="700" font-style="normal" fill="#b45309" text-anchor="start" data-max="570"><tspan x="142" dy="0">DECISIÓN</tspan></text><text x="142" y="304" font-size="16" font-weight="600" font-style="normal" fill="#78350f" text-anchor="start" data-max="570"><tspan x="142" dy="0">¿Rx: silueta en «huevo acostado», pedículo estrecho y</tspan><tspan x="142" dy="22">flujo pulmonar aumentado?</tspan></text><line x1="410.0" y1="352" x2="410.0" y2="372" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,370 417.0,370 410.0,380" fill="#94a3b8"/><rect x="90" y="382" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="410" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="434" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Sospechar transposición de grandes arterias (circulaciones</tspan><tspan x="108" dy="22">en paralelo); confirmar con ecocardiograma</tspan></text><line x1="410.0" y1="482" x2="410.0" y2="502" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,500 417.0,500 410.0,510" fill="#94a3b8"/><rect x="90" y="512" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="540" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="564" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Prostaglandina E1 para mantener abierto el conducto</tspan><tspan x="108" dy="22">arterioso</tspan></text><line x1="410.0" y1="612" x2="410.0" y2="632" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,630 417.0,630 410.0,640" fill="#94a3b8"/><rect x="90" y="642" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="670" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="694" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Septostomía auricular con balón (Rashkind) si la mezcla de</tspan><tspan x="108" dy="22">sangre es insuficiente</tspan></text><line x1="410.0" y1="742" x2="410.0" y2="762" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,760 417.0,760 410.0,770" fill="#94a3b8"/><rect x="90" y="772" width="640" height="98" rx="12" fill="#134e4a" stroke="#134e4a" stroke-width="2"/><text x="108" y="800" font-size="11" font-weight="700" font-style="normal" fill="#5eead4" text-anchor="start" data-max="604"><tspan x="108" dy="0">CONDUCTA FINAL</tspan></text><text x="108" y="824" font-size="16" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Cirugía de switch arterial (Jatene) en las primeras semanas</tspan><tspan x="108" dy="22">de vida</tspan></text><rect x="40" y="900" width="740" height="98" rx="10" fill="#f0fdfa" stroke="#99f6e4"/><rect x="40" y="900" width="6" height="98" rx="3" fill="#14b8a6"/><text x="62" y="926" font-size="14" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="704"><tspan x="62" dy="0">Perla clínica</tspan></text><text x="62" y="950" font-size="15" font-weight="400" font-style="normal" fill="#134e4a" text-anchor="start" data-max="704"><tspan x="62" dy="0">Tetralogía de Fallot: corazón «en bota» con flujo pulmonar disminuido. TGA:</tspan><tspan x="62" dy="21">«huevo acostado» con flujo aumentado.</tspan></text><text x="410.0" y="1026" font-size="11" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="740"><tspan x="410.0" dy="0">MedQuizPlus · Material de estudio: contrasta siempre con las guías clínicas vigentes.</tspan></text></svg>
