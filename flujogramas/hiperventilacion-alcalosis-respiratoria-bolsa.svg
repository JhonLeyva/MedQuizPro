<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1056" viewBox="0 0 820 1056" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Hiperventilación: alcalosis respiratoria y bolsa de papel"><title>Hiperventilación: alcalosis respiratoria y bolsa de papel</title><rect width="820" height="1056" fill="#ffffff"/><rect x="0" y="0" width="820" height="142" fill="#0f766e"/><text x="40" y="34" font-size="13" font-weight="600" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="740"><tspan x="40" dy="0">MedQuizPlus · Flujograma</tspan></text><text x="40" y="70" font-size="24" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="740"><tspan x="40" dy="0">Hiperventilación: alcalosis respiratoria y bolsa</tspan><tspan x="40" dy="30">de papel</tspan></text><text x="40" y="126" font-size="13" font-weight="400" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="740"><tspan x="40" dy="0">ENAM 2020 · PSI-003 · Psiquiatría</tspan></text><rect x="90" y="174" width="640" height="76" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="108" y="202" font-size="11" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="604"><tspan x="108" dy="0">INICIO</tspan></text><text x="108" y="226" font-size="16" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Crisis de ansiedad con taquipnea</tspan></text><line x1="410.0" y1="252" x2="410.0" y2="272" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,270 417.0,270 410.0,280" fill="#94a3b8"/><rect x="90" y="282" width="640" height="76" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="310" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="334" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">PCO₂ baja → alcalosis respiratoria aguda</tspan></text><line x1="410.0" y1="360" x2="410.0" y2="380" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,378 417.0,378 410.0,388" fill="#94a3b8"/><rect x="90" y="390" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="418" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="442" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">La alcalosis reduce el calcio iónico: parestesias</tspan><tspan x="108" dy="22">peribucales y espasmo carpopedal</tspan></text><line x1="410.0" y1="490" x2="410.0" y2="510" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,508 417.0,508 410.0,518" fill="#94a3b8"/><rect x="90" y="520" width="640" height="98" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><circle cx="120" cy="569.0" r="12" fill="#d97706"/><text x="120" y="574.0" font-size="15" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="120" dy="0">?</tspan></text><text x="142" y="548" font-size="11" font-weight="700" font-style="normal" fill="#b45309" text-anchor="start" data-max="570"><tspan x="142" dy="0">DECISIÓN</tspan></text><text x="142" y="572" font-size="16" font-weight="600" font-style="normal" fill="#78350f" text-anchor="start" data-max="570"><tspan x="142" dy="0">¿Descartadas causas orgánicas? Hipoxemia, sepsis, embolia</tspan><tspan x="142" dy="22">o intoxicación</tspan></text><line x1="410.0" y1="620" x2="410.0" y2="640" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,638 417.0,638 410.0,648" fill="#94a3b8"/><rect x="90" y="650" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="678" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="702" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Tranquilizar y hacerla respirar en una bolsa de papel para</tspan><tspan x="108" dy="22">reinhalar CO₂</tspan></text><line x1="410.0" y1="750" x2="410.0" y2="770" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,768 417.0,768 410.0,778" fill="#94a3b8"/><rect x="90" y="780" width="640" height="98" rx="12" fill="#134e4a" stroke="#134e4a" stroke-width="2"/><text x="108" y="808" font-size="11" font-weight="700" font-style="normal" fill="#5eead4" text-anchor="start" data-max="604"><tspan x="108" dy="0">CONDUCTA FINAL</tspan></text><text x="108" y="832" font-size="16" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Manejo de la ansiedad y seguimiento por psicología o</tspan><tspan x="108" dy="22">psiquiatría</tspan></text><rect x="40" y="908" width="740" height="98" rx="10" fill="#f0fdfa" stroke="#99f6e4"/><rect x="40" y="908" width="6" height="98" rx="3" fill="#14b8a6"/><text x="62" y="934" font-size="14" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="704"><tspan x="62" dy="0">Perla clínica</tspan></text><text x="62" y="958" font-size="15" font-weight="400" font-style="normal" fill="#134e4a" text-anchor="start" data-max="704"><tspan x="62" dy="0">La bolsa de papel solo se usa tras descartar hipoxemia; nunca en asma,</tspan><tspan x="62" dy="21">embolia pulmonar o infarto.</tspan></text><text x="410.0" y="1034" font-size="11" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="740"><tspan x="410.0" dy="0">MedQuizPlus · Material de estudio: contrasta siempre con las guías clínicas vigentes.</tspan></text></svg>
