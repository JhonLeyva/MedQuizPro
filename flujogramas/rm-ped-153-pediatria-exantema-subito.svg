<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="987" viewBox="0 0 1000 987" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Fiebre alta de 3 días que cede y deja un exantema rosado en el tronco: roséola infantil"><title>Fiebre alta de 3 días que cede y deja un exantema rosado en el tronco: roséola infantil</title><rect x="0.75" y="0.75" width="998.5" height="985.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · exantema súbito</tspan></text><rect x="362.0" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="411.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="411.0" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Roséola infantil</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Exantema súbito o sexta enfermedad por herpesvirus humano 6 (menos veces el 7).</tspan><tspan x="58.0" dy="17">Afecta a lactantes de 6 meses a 2 años.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 11 meses</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Fiebre de 39 °C por 3 días que cede sola.</tspan><tspan x="640.0" dy="16">Luego, erupción maculopapular rosada no pruriginosa</tspan><tspan x="640.0" dy="16">en tronco, cara y extremidades.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ PASA DÍA A DÍA EN LA ROSÉOLA (VALORES ORIENTATIVOS)</tspan></text><line x1="290.0" y1="307.0" x2="290.0" y2="501.0" stroke="#e2e8f0" stroke-width="1"/><text x="290.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="290.0" dy="0">1</tspan></text><line x1="398.3" y1="307.0" x2="398.3" y2="501.0" stroke="#e2e8f0" stroke-width="1"/><text x="398.3" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="398.3" dy="0">2</tspan></text><line x1="506.7" y1="307.0" x2="506.7" y2="501.0" stroke="#e2e8f0" stroke-width="1"/><text x="506.7" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="506.7" dy="0">3</tspan></text><line x1="615.0" y1="307.0" x2="615.0" y2="501.0" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="615.0" dy="0">4</tspan></text><line x1="723.3" y1="307.0" x2="723.3" y2="501.0" stroke="#e2e8f0" stroke-width="1"/><text x="723.3" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="723.3" dy="0">5</tspan></text><line x1="831.7" y1="307.0" x2="831.7" y2="501.0" stroke="#e2e8f0" stroke-width="1"/><text x="831.7" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="831.7" dy="0">6</tspan></text><line x1="940.0" y1="307.0" x2="940.0" y2="501.0" stroke="#e2e8f0" stroke-width="1"/><text x="940.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="940.0" dy="0">7</tspan></text><text x="940.0" y="289.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="end" data-max="60"><tspan x="940.0" dy="0">días</tspan></text><rect x="40.0" y="311.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="327.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Fiebre de 39 °C</tspan></text><text x="48.0" y="342.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Buen estado general</tspan></text><rect x="290.0" y="319.0" width="325.0" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="365.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Defervescencia</tspan></text><text x="48.0" y="380.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">La fiebre cede sola</tspan></text><rect x="615.0" y="357.0" width="6.0" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><rect x="40.0" y="387.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="403.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Exantema maculopapular rosado</tspan></text><text x="48.0" y="418.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Aparece al ceder la fiebre</tspan></text><rect x="615.0" y="395.0" width="216.7" height="22.0" rx="6" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="48.0" y="441.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Tronco, cuello, cara y extremidades</tspan></text><text x="48.0" y="456.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">No pruriginoso</tspan></text><rect x="615.0" y="433.0" width="216.7" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><rect x="40.0" y="463.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="479.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Resolución</tspan></text><text x="48.0" y="494.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Desaparece en 1 a 2 días</tspan></text><rect x="831.7" y="471.0" width="108.3" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><line x1="615.0" y1="309.0" x2="615.0" y2="507.0" stroke="#b91c1c" stroke-width="2.6"/><rect x="514.1" y="507.0" width="201.8" height="22.0" rx="11" fill="#b91c1c" stroke="none" stroke-width="1.5"/><text x="615.0" y="522.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="615.0" dy="0">Caso: exantema al cesar la fiebre</tspan></text><rect x="40.0" y="553.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="579.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Fiebre 3 días + exantema al ceder = roséola</tspan></text><text x="60.0" y="598.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">En sarampión y escarlatina el exantema aparece con la fiebre.</tspan></text><text x="40.0" y="665.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="675.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="697.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="697.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Escarlatina</tspan></text><rect x="363.0" y="678.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="697.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Roséola</tspan></text><text x="585.0" y="697.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Sarampión</tspan></text><text x="735.0" y="697.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Eritema infeccioso</tspan></text><text x="885.0" y="697.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Rubéola</tspan></text><rect x="40.0" y="712.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="712.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="749.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="733.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: faringoamigdalitis,</tspan><tspan x="285.0" dy="16">lengua en fresa,</tspan><tspan x="285.0" dy="16">exantema áspero</tspan></text><text x="435.0" y="733.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: el exantema</tspan><tspan x="435.0" dy="16">aparece al ceder la</tspan><tspan x="435.0" dy="16">fiebre</tspan></text><text x="585.0" y="741.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: tos, coriza,</tspan><tspan x="585.0" dy="16">conjuntivitis y Koplik</tspan></text><text x="735.0" y="741.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: exantema en</tspan><tspan x="735.0" dy="16">bofetada y poca fiebre</tspan></text><text x="885.0" y="733.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: adenopatías</tspan><tspan x="885.0" dy="16">retroauriculares y</tspan><tspan x="885.0" dy="16">fiebre baja</tspan></text><rect x="40.0" y="675.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="802.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="830.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="852.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Fiebre de 39 a 40 °C durante 3 a 5 días con buen estado general; al ceder aparece en horas un exantema maculopapular rosado que dura 1 a 2 días.</tspan><tspan x="58.0" dy="18">• Clave de las exantemáticas: en la roséola el exantema aparece cuando la fiebre desaparece; en sarampión y escarlatina aparece con la fiebre.</tspan><tspan x="58.0" dy="18">• Es causa frecuente de convulsión febril del lactante. El diagnóstico es clínico y el tratamiento sintomático.</tspan><tspan x="58.0" dy="18">• Diferenciales: sarampión (tos, coriza, conjuntivitis, Koplik), rubéola (adenopatías retroauriculares), eritema infeccioso (cachetes abofeteados), escarlatina</tspan><tspan x="58.0" dy="18">   (lengua en fresa).</tspan></text><text x="58.0" y="946.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAP, Red Book 2024-2027, 33.ª ed.; Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>