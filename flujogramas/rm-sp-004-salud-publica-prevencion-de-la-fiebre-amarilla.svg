<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1045" viewBox="0 0 1000 1045" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En zona enzoótica de fiebre amarilla la medida central es vacunar y monitorear las coberturas"><title>En zona enzoótica de fiebre amarilla la medida central es vacunar y monitorear las coberturas</title><rect x="0.75" y="0.75" width="998.5" height="1043.3" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Salud pública · prevención de la fiebre amarilla</tspan></text><rect x="476.9" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="541.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="541.2" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Fiebre amarilla selvática</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ciclo entre primates no humanos y mosquitos Haemagogus y Sabethes.</tspan><tspan x="58.0" dy="17">El hombre sin vacunar se infecta al ingresar a la selva.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es una medida de prevención de la fiebre</tspan><tspan x="640.0" dy="16">amarilla en zonas enzoóticas?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ MEDIDAS SIRVEN EN EL CICLO SELVÁTICO</tspan></text><text x="614.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,293.0 580.0,293.0 531.7,401.0 88.3,401.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="309.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="357.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="399"><tspan x="310.0" dy="0">Prevención en zona enzoótica</tspan></text><line x1="559.8" y1="347.0" x2="606.0" y2="347.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="302.0" width="105.7" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="666.9" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="666.9" dy="0">Quimioprofilaxis</tspan></text><rect x="725.7" y="302.0" width="156.8" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="804.1" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="804.1" dy="0">Serología de susceptibles</tspan></text><rect x="614.0" y="334.0" width="178.3" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="703.2" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="703.2" dy="0">Eliminar reservorios silvestres</tspan></text><rect x="798.3" y="334.0" width="112.3" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="854.4" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="854.4" dy="0">Eliminar vectores</tspan></text><rect x="614.0" y="366.0" width="216.3" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="722.1" y="383.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="722.1" dy="0">Monitorear coberturas de vacunación</tspan></text><polygon points="88.3,405.0 531.7,405.0 483.3,461.0 136.7,461.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="162.7" cy="433.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="162.7" y="437.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="162.7" dy="0">1</tspan></text><text x="320.0" y="437.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="283"><tspan x="320.0" dy="0">¿Existe como medida de salud pública?</tspan></text><line x1="511.5" y1="433.0" x2="606.0" y2="433.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="420.0" width="117.8" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="672.9" y="437.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="672.9" dy="0">✕ Quimioprofilaxis</tspan></text><line x1="636.0" y1="433.5" x2="721.8" y2="433.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="737.8" y="420.0" width="168.9" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="822.3" y="437.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="822.3" dy="0">✕ Serología de susceptibles</tspan></text><line x1="759.8" y1="433.5" x2="896.7" y2="433.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="136.7,465.0 483.3,465.0 435.0,521.0 185.0,521.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="493.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="497.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">2</tspan></text><text x="320.0" y="497.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">¿Es factible en la selva?</tspan></text><line x1="463.2" y1="493.0" x2="606.0" y2="493.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="480.0" width="190.4" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="709.2" y="497.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="709.2" dy="0">✕ Eliminar reservorios silvestres</tspan></text><line x1="636.0" y1="493.5" x2="794.4" y2="493.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="810.4" y="480.0" width="124.4" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="872.6" y="497.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="872.6" dy="0">✕ Eliminar vectores</tspan></text><line x1="832.4" y1="493.5" x2="924.8" y2="493.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="525.0" x2="310.0" y2="544.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,543.0 315.0,543.0 310.0,551.0" fill="#0f766e"/><rect x="140.0" y="555.0" width="340.0" height="111.8" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="584.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">MONITOREAR COBERTURAS DE</tspan><tspan x="310.0" dy="19.9">VACUNACIÓN</tspan></text><text x="310.0" y="628.6" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Vacuna 17D con coberturas altas</tspan><tspan x="310.0" dy="17">Vacunar 10 días antes de ingresar</tspan></text><rect x="370.6" y="544.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="559.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="572.9" width="346.0" height="76.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="592.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="610.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">El control de vectores aplica al Aedes aegypti del ciclo</tspan><tspan x="628.0" dy="16">urbano.</tspan></text><text x="40.0" y="706.8" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="716.8" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="756.3" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="719.8" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="739.3" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Monitoreo de</tspan><tspan x="285.0" dy="17">coberturas de</tspan><tspan x="285.0" dy="17">vacunación</tspan></text><text x="435.0" y="756.3" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Quimioprofilaxis</tspan></text><text x="585.0" y="747.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Serología de</tspan><tspan x="585.0" dy="17">susceptibles</tspan></text><text x="735.0" y="739.3" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Eliminación de</tspan><tspan x="735.0" dy="17">reservorios</tspan><tspan x="735.0" dy="17">silvestres</tspan></text><text x="885.0" y="747.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Eliminación de</tspan><tspan x="885.0" dy="17">vectores</tspan></text><rect x="40.0" y="787.8" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="787.8" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="824.8" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Medida de prevención?</tspan></text><text x="285.0" y="808.8" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: sostiene la</tspan><tspan x="285.0" dy="16">inmunidad de la</tspan><tspan x="285.0" dy="16">población</tspan></text><text x="435.0" y="816.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no existe</tspan><tspan x="435.0" dy="16">quimioprofilaxis</tspan></text><text x="585.0" y="816.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no es estrategia de</tspan><tspan x="585.0" dy="16">salud pública</tspan></text><text x="735.0" y="816.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: el reservorio</tspan><tspan x="735.0" dy="16">silvestre no se elimina</tspan></text><text x="885.0" y="816.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no se eliminan los</tspan><tspan x="885.0" dy="16">vectores selváticos</tspan></text><rect x="40.0" y="716.8" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="877.8" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="905.8" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="927.8" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El reservorio silvestre y los vectores selváticos no pueden eliminarse: la medida central es la vacuna 17D con coberturas altas y monitoreadas.</tspan><tspan x="58.0" dy="18">• Clínica: fiebre, ictericia y hemorragia, con signo de Faget; letalidad cercana a 50 % en la forma grave.</tspan><tspan x="58.0" dy="18">• No hay quimioprofilaxis ni antiviral específico. El control del Aedes aegypti se aplica en el ciclo urbano.</tspan><tspan x="58.0" dy="18">• Toda persona que ingrese a zona enzoótica debe estar vacunada al menos 10 días antes.</tspan></text><text x="58.0" y="1003.8" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, Position Paper on yellow fever vaccines (Vaccine 2015;33:76-77); OMS, guidelines for clinical management of arboviral diseases (2025); Harrison 21.ª ed. (2022).</tspan></text></svg>