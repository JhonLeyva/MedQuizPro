harray="4 3"/><rect x="229.2" y="347.0" width="163.2" height="64.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="310.8" y="361.0" font-size="9.5" font-weight="800" font-style="normal" fill="#ffedd5" text-anchor="middle" data-max="143"><tspan x="310.8" dy="0">✂ CORTA</tspan></text><text x="310.8" y="378.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="143"><tspan x="310.8" dy="0">55-65 % de las personas</tspan></text><rect x="265.4" y="400.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="310.8" y="415.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="310.8" dy="0">◆ ESTE CASO</tspan></text><rect x="418.4" y="253.0" width="163.2" height="76.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="500.0" y="273.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="143"><tspan x="500.0" dy="0">Nodo sinusal</tspan></text><text x="500.0" y="290.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="143"><tspan x="500.0" dy="0">Marcapasos</tspan></text><line x1="584.6" y1="291.0" x2="597.6" y2="291.0" stroke="#0f766e" stroke-width="2"/><polygon points="596.6,286.0 596.6,296.0 604.6,291.0" fill="#0f766e"/><line x1="500.0" y1="331.0" x2="500.0" y2="345.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="418.4" y="347.0" width="163.2" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="361.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="143"><tspan x="500.0" dy="0">✂ CORTA</tspan></text><text x="500.0" y="378.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="143"><tspan x="500.0" dy="0">Fija la frecuencia</tspan><tspan x="500.0" dy="16">cardiaca</tspan></text><rect x="607.6" y="253.0" width="163.2" height="76.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="689.2" y="273.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="143"><tspan x="689.2" dy="0">Nodo AV (crux cordis)</tspan></text><text x="689.2" y="290.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="143"><tspan x="689.2" dy="0">Segundo nodo</tspan></text><line x1="773.8" y1="291.0" x2="786.8" y2="291.0" stroke="#0f766e" stroke-width="2"/><polygon points="785.8,286.0 785.8,296.0 793.8,291.0" fill="#0f766e"/><line x1="689.2" y1="331.0" x2="689.2" y2="345.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="607.6" y="347.0" width="163.2" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="689.2" y="361.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="143"><tspan x="689.2" dy="0">✂ CORTA</tspan></text><text x="689.2" y="378.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="143"><tspan x="689.2" dy="0">También de la coronaria</tspan><tspan x="689.2" dy="16">derecha</tspan></text><rect x="796.8" y="253.0" width="163.2" height="76.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="878.4" y="273.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="143"><tspan x="878.4" dy="0">Infarto inferior</tspan></text><text x="878.4" y="290.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="143"><tspan x="878.4" dy="0">Consecuencia</tspan></text><line x1="878.4" y1="331.0" x2="878.4" y2="345.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="796.8" y="347.0" width="163.2" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="878.4" y="361.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="143"><tspan x="878.4" dy="0">✂ CORTA</tspan></text><text x="878.4" y="378.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="143"><tspan x="878.4" dy="0">Bradicardia y bloqueo</tspan><tspan x="878.4" dy="16">AV</tspan></text><rect x="40.0" y="441.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="467.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Coronaria derecha irriga el nodo sinusal</tspan></text><text x="60.0" y="486.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Su oclusión causa bradicardia sinusal y bloqueos auriculoventriculares.</tspan></text><text x="40.0" y="553.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="563.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="594.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="585.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Interventricular</tspan><tspan x="285.0" dy="17">anterior</tspan></text><text x="435.0" y="594.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Marginal derecha</tspan></text><rect x="513.0" y="566.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="594.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Coronaria derecha</tspan></text><text x="735.0" y="594.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Marginal izquierda</tspan></text><text x="885.0" y="594.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Ventricular anterior</tspan></text><rect x="40.0" y="617.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="617.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="646.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Arteria?</tspan></text><text x="285.0" y="638.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: irriga tabique y</tspan><tspan x="285.0" dy="16">pared anterior</tspan></text><text x="435.0" y="638.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: irriga el borde del</tspan><tspan x="435.0" dy="16">ventrículo derecho</tspan></text><text x="585.0" y="638.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: nodo sinusal en</tspan><tspan x="585.0" dy="16">55-65 %</tspan></text><text x="735.0" y="638.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: irriga pared lateral</tspan><tspan x="735.0" dy="16">del ventrículo izquierdo</tspan></text><text x="885.0" y="638.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es una rama</tspan><tspan x="885.0" dy="16">muscular ventricular</tspan></text><rect x="40.0" y="563.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="691.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="719.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="741.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Arteria del nodo sinusal: coronaria derecha (55-65 %) o circunfleja (35-45 %).</tspan><tspan x="58.0" dy="18">• Arteria del nodo AV: coronaria derecha dominante, a nivel de la crux cordis.</tspan><tspan x="58.0" dy="18">• Infarto inferior (coronaria derecha): bradicardia sinusal y bloqueo AV; responden a atropina o marcapasos.</tspan></text><text x="58.0" y="799.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Braunwald Tratado de Cardiología 12.ª ed.; Moore Anatomía con orientación clínica 8.ª ed.</tspan></text></svg>