<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="942" viewBox="0 0 1000 942" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En el otohematoma la sangre se acumula entre el cartílago y el pericondrio"><title>En el otohematoma la sangre se acumula entre el cartílago y el pericondrio</title><rect x="0.75" y="0.75" width="998.5" height="940.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">ORL · otohematoma</tspan></text><rect x="319.4" y="32.0" width="162.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="400.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="146"><tspan x="400.5" dy="0">OFTALMOLOGÍA Y ORL RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Otohematoma</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Colección de sangre y suero en el plano subpericóndrico.</tspan><tspan x="58.0" dy="17">La piel está firmemente adherida al pericondrio.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Dónde se localiza la acumulación de sangre en el</tspan><tspan x="640.0" dy="16">otohematoma?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CAPAS DEL PABELLÓN AURICULAR Y SITIO DE LA COLECCIÓN</tspan></text><rect x="40.0" y="293.0" width="300.0" height="54.0" rx="0" fill="#fbd5c4" stroke="#ffffff" stroke-width="2"/><rect x="40" y="293.0" width="300" height="54.0" fill="#b91c1c" opacity="0.22"/><text x="54.0" y="318.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Piel</tspan></text><text x="54.0" y="334.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Muy delgada</tspan></text><rect x="376.0" y="295.0" width="584.0" height="50.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="388.0" y="313.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Piel adherida al pericondrio</tspan></text><text x="388.0" y="329.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Casi no hay tejido graso subcutáneo, salvo en el lóbulo.</tspan></text><rect x="40.0" y="347.0" width="300.0" height="54.0" rx="0" fill="#f5b8a2" stroke="#ffffff" stroke-width="2"/><rect x="40" y="347.0" width="300" height="54.0" fill="#b91c1c" opacity="0.22"/><text x="54.0" y="372.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Pericondrio</tspan></text><text x="54.0" y="388.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Capa nutricia</tspan></text><text x="328.0" y="378.0" font-size="11" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="end" data-max="96"><tspan x="328.0" dy="0">◄ llega aquí</tspan></text><rect x="376.0" y="349.0" width="584.0" height="50.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="388.0" y="367.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Se desprende del cartílago</tspan></text><text x="388.0" y="383.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">El cizallamiento rompe los vasos entre pericondrio y cartílago.</tspan></text><rect x="40.0" y="401.0" width="300.0" height="54.0" rx="0" fill="#e89c84" stroke="#ffffff" stroke-width="2"/><text x="54.0" y="426.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Cartílago</tspan></text><text x="54.0" y="442.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Avascular</tspan></text><rect x="376.0" y="403.0" width="584.0" height="50.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="388.0" y="421.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Se necrosa sin el pericondrio</tspan></text><text x="388.0" y="437.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Sin drenaje: fibrosis y oreja en coliflor.</tspan></text><line x1="346.0" y1="299.0" x2="346.0" y2="449.0" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="4 4"/><line x1="346.0" y1="445.0" x2="346.0" y2="440.0" stroke="#b91c1c" stroke-width="2.2"/><polygon points="341.0,440.0 351.0,440.0 346.0,449.0" fill="#b91c1c"/><text x="376.0" y="287.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="584"><tspan x="376.0" dy="0">QUÉ OCURRE EN CADA CAPA</tspan></text><text x="40.0" y="287.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="300"><tspan x="40.0" dy="0">CAPAS (DE SUPERFICIAL A PROFUNDA)</tspan></text><rect x="872.3" y="338.0" width="55.4" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="900.0" y="353.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="900.0" dy="0">◆ AQUÍ</tspan></text><rect x="40.0" y="473.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="499.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Otohematoma = sangre entre cartílago y pericondrio</tspan></text><text x="60.0" y="518.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Drenaje y compresión eficaz; el hemotímpano es otra entidad (fractura temporal).</tspan></text><text x="40.0" y="585.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="595.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="626.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="598.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="617.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Cartílago y</tspan><tspan x="285.0" dy="17">pericondrio</tspan></text><text x="435.0" y="626.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Pericondrio y piel</tspan></text><text x="585.0" y="626.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Piel y tejido graso</tspan></text><text x="735.0" y="617.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Tejido graso y</tspan><tspan x="735.0" dy="17">pericondrio</tspan></text><text x="885.0" y="617.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Tímpano y pared</tspan><tspan x="885.0" dy="17">interna de la caja</tspan></text><rect x="40.0" y="649.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="649.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="686.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Dónde está la sangre?</tspan></text><text x="285.0" y="678.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: espacio</tspan><tspan x="285.0" dy="16">subpericóndrico</tspan></text><text x="435.0" y="678.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: la piel está</tspan><tspan x="435.0" dy="16">adherida al pericondrio</tspan></text><text x="585.0" y="678.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: el pabellón casi no</tspan><tspan x="585.0" dy="16">tiene tejido graso</tspan></text><text x="735.0" y="678.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no es el plano de</tspan><tspan x="735.0" dy="16">la colección</tspan></text><text x="885.0" y="670.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es un</tspan><tspan x="885.0" dy="16">hemotímpano, no un</tspan><tspan x="885.0" dy="16">otohematoma</tspan></text><rect x="40.0" y="595.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="739.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="767.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="789.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Un golpe tangencial o de cizallamiento (deportes de contacto) separa el pericondrio del cartílago y rompe los vasos que corren entre ambos.</tspan><tspan x="58.0" dy="18">• El cartílago es avascular y se nutre por difusión desde el pericondrio: sin drenaje se necrosa y deja deformidad en coliflor.</tspan><tspan x="58.0" dy="18">• El pabellón carece de tejido graso subcutáneo relevante salvo en el lóbulo; sangre en el tímpano y pared interna de la caja es un hemotímpano (fractura</tspan><tspan x="58.0" dy="18">   temporal).</tspan><tspan x="58.0" dy="18">• Tratamiento: drenaje con incisión (la aspiración recidiva más), compresión eficaz con vendaje o suturas y cobertura antibiótica; más de 7 días sin drenar</tspan><tspan x="58.0" dy="18">   eleva el riesgo de necrosis.</tspan></text><text x="58.0" y="901.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: StatPearls, Auricular Hematoma (2025); Cummings Otolaringología 7.ª ed. (2021)</tspan></text></svg>