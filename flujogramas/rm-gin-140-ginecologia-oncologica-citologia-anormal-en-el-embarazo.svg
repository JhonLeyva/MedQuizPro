<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="992" viewBox="0 0 1000 992" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Gestante con células glandulares atípicas: colposcopía, sin legrado endocervical ni biopsia endometrial"><title>Gestante con células glandulares atípicas: colposcopía, sin legrado endocervical ni biopsia endometrial</title><rect x="0.75" y="0.75" width="998.5" height="990.8" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ginecología oncológica · citología anormal en el embarazo</tspan></text><rect x="545.9" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="625.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="625.7" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Células glandulares atípicas (AGC)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hallazgo poco frecuente asociado a lesión escamosa de alto grado y a adenocarcinoma in</tspan><tspan x="58.0" dy="17">situ o invasor.</tspan><tspan x="58.0" dy="17">Exige estudio aunque haya embarazo.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 29 años, 10 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">G2 P0010; citología con células glandulares atípicas de</tspan><tspan x="640.0" dy="16">significado incierto.</tspan><tspan x="640.0" dy="16">¿Cuál es la conducta?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DE LA CITOLOGÍA AL ESTUDIO EN EL EMBARAZO</tspan></text><rect x="42.0" y="295.0" width="302.7" height="56.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="193.3" y="320.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">HOY</tspan></text><text x="193.3" y="339.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">Citología</tspan></text><rect x="348.7" y="295.0" width="302.7" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="500.0" y="320.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">PRIMERA CONDUCTA</tspan></text><text x="500.0" y="339.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">Colposcopía</tspan></text><rect x="655.3" y="295.0" width="302.7" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="806.7" y="320.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">SI HAY LESIÓN</tspan></text><text x="806.7" y="339.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">Biopsia dirigida</tspan></text><rect x="147.9" y="284.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="193.3" y="299.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="193.3" dy="0">◆ ESTE CASO</tspan></text><rect x="48.0" y="365.0" width="290.7" height="110.3" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="193.3" y="403.4" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">AGC DE SIGNIFICADO INCIERTO</tspan></text><text x="193.3" y="427.1" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">Células glandulares atípicas</tspan><tspan x="193.3" dy="17">Gestante de 10 semanas</tspan></text><rect x="354.7" y="365.0" width="290.7" height="110.3" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="403.4" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">SEGURA EN EL EMBARAZO</tspan></text><text x="500.0" y="427.1" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">Sin legrado endocervical</tspan><tspan x="500.0" dy="17">Sin biopsia endometrial</tspan></text><rect x="661.3" y="365.0" width="290.7" height="110.3" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="806.7" y="393.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">SOLO SI SOSPECHA ALTO GRADO O</tspan><tspan x="806.7" dy="19.2">CÁNCER</tspan></text><text x="806.7" y="436.7" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">Conización solo si se sospecha invasión</tspan><tspan x="806.7" dy="17">Reevaluar posparto lo restante</tspan></text><text x="40.0" y="509.3" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CONDUCTA ANTE CÉLULAS GLANDULARES ATÍPICAS</tspan></text><rect x="40.0" y="521.3" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="540.3" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Situación</tspan></text><text x="200.0" y="540.3" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="754"><tspan x="200.0" dy="0">Estudio</tspan></text><rect x="40.0" y="550.3" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="569.3" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">No gestante</tspan></text><text x="200.0" y="569.3" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="754"><tspan x="200.0" dy="0">Colposcopía con muestreo endocervical; biopsia endometrial si es mayor de 35 años o tiene riesgo</tspan></text><rect x="40.0" y="579.3" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="598.3" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Gestante</tspan></text><text x="200.0" y="598.3" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="754"><tspan x="200.0" dy="0">Colposcopía; sin legrado endocervical ni biopsia endometrial; biopsia dirigida solo si la lesión sugiere alto grado o cáncer</tspan></text><rect x="90.6" y="582.8" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="136.0" y="597.8" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="136.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="624.3" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Repetir la citología posparto o solo tipificar VPH no es la conducta.</tspan></text><text x="40.0" y="671.3" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="681.3" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="712.3" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="684.3" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="712.3" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Colposcopía</tspan></text><text x="435.0" y="703.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Control citológico</tspan><tspan x="435.0" dy="17">posparto</tspan></text><text x="585.0" y="703.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Determinar</tspan><tspan x="585.0" dy="17">ADN-VPH</tspan></text><text x="735.0" y="712.3" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Biopsia de cérvix</tspan></text><text x="885.0" y="712.3" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Conización</tspan></text><rect x="40.0" y="735.3" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="735.3" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="764.3" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Conducta ante AGC en</tspan><tspan x="54.0" dy="16">la gestante?</tspan></text><text x="285.0" y="764.3" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: segura y es el paso</tspan><tspan x="285.0" dy="16">inicial</tspan></text><text x="435.0" y="756.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: retrasa un</tspan><tspan x="435.0" dy="16">diagnóstico</tspan><tspan x="435.0" dy="16">potencialmente grave</tspan></text><text x="585.0" y="764.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no resuelve el</tspan><tspan x="585.0" dy="16">riesgo por sí sola</tspan></text><text x="735.0" y="756.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: solo si la</tspan><tspan x="735.0" dy="16">colposcopía ve una</tspan><tspan x="735.0" dy="16">lesión sospechosa</tspan></text><text x="885.0" y="764.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: se reserva para</tspan><tspan x="885.0" dy="16">sospecha de invasión</tspan></text><rect x="40.0" y="681.3" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="825.3" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="853.3" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="875.3" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• ASCCP 2019: en toda paciente con AGC se hace colposcopía con muestreo endocervical y, en mayores de 35 años o con riesgo, biopsia endometrial.</tspan><tspan x="58.0" dy="18">• En la gestante la colposcopía es segura y es el paso inicial; no se hace legrado endocervical ni biopsia endometrial.</tspan><tspan x="58.0" dy="18">• Biopsia dirigida solo si hay lesión sospechosa de alto grado o cáncer; conización diagnóstica solo si se sospecha invasión (riesgo de sangrado y aborto).</tspan><tspan x="58.0" dy="18">• Alerta: repetir la citología posparto demora un diagnóstico grave; la tipificación de VPH sola no resuelve el riesgo.</tspan></text><text x="58.0" y="951.3" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ASCCP, guías de consenso basadas en riesgo (2019), actualización hasta 2023 (J Low Genit Tract Dis 2024); Directiva 165-2025 (MINSA), cáncer de cuello uterino.</tspan></text></svg>