<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1170" viewBox="0 0 1000 1170" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Licor adulterado con coma, convulsiones y acidosis metabólica grave (pH 7,0, HCO₃ 5): intoxicación por metanol, soporte y hemodiálisis urgente"><title>Licor adulterado con coma, convulsiones y acidosis metabólica grave (pH 7,0, HCO₃ 5): intoxicación por metanol, soporte y hemodiálisis urgente</title><rect x="0.75" y="0.75" width="998.5" height="1169.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Toxicología · alcoholes tóxicos</tspan></text><rect x="383.6" y="32.0" width="158.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="463.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="143"><tspan x="463.0" dy="0">CIENCIAS BÁSICAS ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Intoxicación por metanol</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El metanol se convierte en ácido fórmico: acidosis metabólica con anión gap alto, ceguera y</tspan><tspan x="58.0" dy="17">daño cerebral.</tspan><tspan x="58.0" dy="17">Los síntomas aparecen 12-24 h después de beber (latencia).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 20 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Licor de dudosa procedencia; 12 h después trastorno</tspan><tspan x="640.0" dy="16">del sensorio y convulsiones.</tspan><tspan x="640.0" dy="16">PA 80/50, FC 130, Glasgow 7; pH 7,00, HCO₃ 5,</tspan><tspan x="640.0" dy="16">PaCO₂ 25, lactato 8.</tspan></text><line x1="640.0" y1="237.0" x2="670.0" y2="237.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#94a3b8"/><line x1="500.0" y1="393.0" x2="500.0" y2="423.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="423.0" x2="733.5" y2="423.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="423.0" x2="266.5" y2="452.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,451.0 271.5,451.0 266.5,459.0" fill="#94a3b8"/><line x1="733.5" y1="423.0" x2="733.5" y2="452.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,451.0 738.5,451.0 733.5,459.0" fill="#94a3b8"/><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#0f766e"/><line x1="500.0" y1="393.0" x2="500.0" y2="423.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="423.0" x2="500.0" y2="423.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="423.0" x2="266.5" y2="452.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,451.0 271.5,451.0 266.5,459.0" fill="#0f766e"/><rect x="225.0" y="432.0" width="83.0" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="444.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Sí (este caso)</tspan></text><rect x="719.4" y="432.0" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="444.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">No</tspan></text><polygon points="240.0,358.0 266.0,323.0 734.0,323.0 760.0,358.0 734.0,393.0 266.0,393.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="358.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="363.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="354.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Sospecha de metanol: ¿coma, convulsiones, pH ≤ 7,15 o</tspan><tspan x="519.0" dy="17">alteración visual?</tspan></text><rect x="40.0" y="459.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="487.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">HEMODIÁLISIS URGENTE</tspan></text><text x="266.5" y="510.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">+ fomepizol o etanol</tspan><tspan x="266.5" dy="17">Bicarbonato, intubar</tspan></text><rect x="507.0" y="459.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="495.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Antídoto y vigilar</tspan></text><text x="733.5" y="518.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Gases seriados</tspan></text><text x="40.0" y="589.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SIGNOS CON NOMBRE PROPIO</tspan></text><rect x="40.0" y="601.5" width="920.0" height="225.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><line x1="62.0" y1="643.5" x2="938.0" y2="643.5" stroke="#64748b" stroke-width="2"/><line x1="62.0" y1="643.5" x2="62.0" y2="651.5" stroke="#64748b" stroke-width="2"/><line x1="938.0" y1="643.5" x2="938.0" y2="651.5" stroke="#64748b" stroke-width="2"/><rect x="348.5" y="631.5" width="302.9" height="24.0" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/><text x="500.0" y="647.5" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="289"><tspan x="500.0" dy="0">CRITERIOS DE DIÁLISIS (EXTRIP) · 3 de 5 en el caso</tspan></text><rect x="56.0" y="663.5" width="168.0" height="116.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="76.0" cy="686.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="76.0" y="690.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="76.0" dy="0">1</tspan></text><text x="94.0" y="691.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="122"><tspan x="94.0" dy="0">Coma</tspan></text><text x="68.0" y="717.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="144"><tspan x="68.0" dy="0">Glasgow 7</tspan></text><rect x="68.0" y="745.5" width="144.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="140.0" y="760.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="132"><tspan x="140.0" dy="0">✓ EN EL CASO</tspan></text><rect x="236.0" y="663.5" width="168.0" height="116.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="256.0" cy="686.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="256.0" y="690.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="256.0" dy="0">2</tspan></text><text x="274.0" y="691.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="122"><tspan x="274.0" dy="0">Convulsiones</tspan></text><text x="248.0" y="717.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="144"><tspan x="248.0" dy="0">Sí</tspan></text><rect x="248.0" y="745.5" width="144.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="320.0" y="760.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="132"><tspan x="320.0" dy="0">✓ EN EL CASO</tspan></text><rect x="416.0" y="663.5" width="168.0" height="116.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="436.0" cy="686.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="436.0" y="690.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="436.0" dy="0">3</tspan></text><text x="454.0" y="691.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="122"><tspan x="454.0" dy="0">pH ≤ 7,15</tspan></text><text x="428.0" y="717.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="144"><tspan x="428.0" dy="0">7,00</tspan></text><rect x="428.0" y="745.5" width="144.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="500.0" y="760.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="132"><tspan x="500.0" dy="0">✓ EN EL CASO</tspan></text><rect x="596.0" y="663.5" width="168.0" height="116.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="616.0" cy="686.5" r="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="616.0" y="690.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="616.0" dy="0">4</tspan></text><text x="634.0" y="691.5" font-size="12.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="start" data-max="122"><tspan x="634.0" dy="0">Alteración visual</tspan></text><text x="608.0" y="717.5" font-size="11.5" font-weight="400" font-style="normal" fill="#64748b" text-anchor="start" data-max="144"><tspan x="608.0" dy="0">No evaluable</tspan></text><rect x="608.0" y="745.5" width="144.0" height="22.0" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/><text x="680.0" y="760.5" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="132"><tspan x="680.0" dy="0">— NO DESCRITO</tspan></text><rect x="776.0" y="663.5" width="168.0" height="116.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="796.0" cy="686.5" r="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="796.0" y="690.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="796.0" dy="0">5</tspan></text><text x="814.0" y="691.5" font-size="12.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="start" data-max="122"><tspan x="814.0" dy="0">Metanol &gt; 700</tspan><tspan x="814.0" dy="17">mg/L</tspan></text><text x="788.0" y="729.5" font-size="11.5" font-weight="400" font-style="normal" fill="#64748b" text-anchor="start" data-max="144"><tspan x="788.0" dy="0">Sin dato</tspan></text><rect x="788.0" y="745.5" width="144.0" height="22.0" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/><text x="860.0" y="760.5" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="132"><tspan x="860.0" dy="0">— NO DESCRITO</tspan></text><text x="56.0" y="806.5" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">Basta uno para dializar.</tspan></text><text x="40.0" y="866.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="876.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="916.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="899.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Bicarbonato, lavado</tspan><tspan x="285.0" dy="17">gástrico y</tspan><tspan x="285.0" dy="17">diuréticos</tspan></text><text x="435.0" y="899.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Fluidos,</tspan><tspan x="435.0" dy="17">bicarbonato y</tspan><tspan x="435.0" dy="17">diuréticos</tspan></text><rect x="513.0" y="879.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="899.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Soporte +</tspan><tspan x="585.0" dy="17">hemodiálisis de</tspan><tspan x="585.0" dy="17">urgencia</tspan></text><text x="735.0" y="907.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ventilación, fluidos</tspan><tspan x="735.0" dy="17">y diuréticos</tspan></text><text x="885.0" y="899.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Diuréticos y</tspan><tspan x="885.0" dy="17">observación sin</tspan><tspan x="885.0" dy="17">diálisis</tspan></text><rect x="40.0" y="947.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="947.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="976.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Manejo?</tspan></text><text x="285.0" y="968.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">El lavado no sirve tras</tspan><tspan x="285.0" dy="16">12 h; falta la diálisis</tspan></text><text x="435.0" y="968.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Falta la diálisis y el</tspan><tspan x="435.0" dy="16">antídoto</tspan></text><text x="585.0" y="976.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: soporte + diálisis</tspan></text><text x="735.0" y="976.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Falta la diálisis</tspan></text><text x="885.0" y="968.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: la acidosis es</tspan><tspan x="885.0" dy="16">grave</tspan></text><rect x="40.0" y="876.5" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1021.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1049.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1071.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Antídoto: fomepizol (o etanol) bloquea la enzima que produce el ácido fórmico.</tspan><tspan x="58.0" dy="18">• Hemodiálisis urgente: elimina metanol y ácido fórmico y corrige la acidosis.</tspan><tspan x="58.0" dy="18">• Bicarbonato EV y ácido fólico como apoyo; intubar si Glasgow ≤ 8.</tspan></text><text x="58.0" y="1129.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: EXTRIP, recomendaciones de diálisis en metanol (2015); Goldfrank's 11.ª ed.</tspan></text></svg>