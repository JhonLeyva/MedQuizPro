<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1238" viewBox="0 0 1000 1238" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Quiste ovárico simple de 8 cm en una gestante de 8 semanas: operar entre las 12 y 20 semanas si persiste"><title>Quiste ovárico simple de 8 cm en una gestante de 8 semanas: operar entre las 12 y 20 semanas si persiste</title><rect x="0.75" y="0.75" width="998.5" height="1237.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Masas anexiales en el embarazo</tspan></text><rect x="390.8" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="478.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="478.0" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Masa ovárica en el embarazo</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La mayoría son quistes funcionales (cuerpo lúteo) que desaparecen antes de las 16</tspan><tspan x="58.0" dy="17">semanas.</tspan><tspan x="58.0" dy="17">Si persisten y son grandes, se operan en el segundo trimestre.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante de 8 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Control prenatal.</tspan><tspan x="640.0" dy="16">Quiste simple de unos 8 cm en el ovario derecho.</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#94a3b8"/><line x1="500.0" y1="361.0" x2="500.0" y2="391.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="391.0" x2="733.5" y2="391.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="391.0" x2="266.5" y2="420.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,419.0 271.5,419.0 266.5,427.0" fill="#94a3b8"/><line x1="733.5" y1="391.0" x2="733.5" y2="420.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,419.0 738.5,419.0 733.5,427.0" fill="#94a3b8"/><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#0f766e"/><line x1="500.0" y1="361.0" x2="500.0" y2="391.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="391.0" x2="500.0" y2="391.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="391.0" x2="266.5" y2="420.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,419.0 271.5,419.0 266.5,427.0" fill="#0f766e"/><rect x="185.5" y="400.0" width="162.0" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="412.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">No: quiste simple (este caso)</tspan></text><rect x="721.4" y="400.0" width="24.1" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="412.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Sí</tspan></text><polygon points="240.0,326.0 266.0,291.0 734.0,291.0 760.0,326.0 734.0,361.0 266.0,361.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="326.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="331.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="322.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Quiste ovárico en gestante: ¿torsión, rotura o sospecha de</tspan><tspan x="519.0" dy="17">cáncer?</tspan></text><rect x="40.0" y="427.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="455.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">ESPERAR AL 2.º TRIMESTRE</tspan></text><text x="266.5" y="478.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Operar entre 12 y 20 semanas si persiste</tspan><tspan x="266.5" dy="17">Ecografía de control</tspan></text><rect x="507.0" y="427.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="463.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Cirugía urgente</tspan></text><text x="733.5" y="486.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">En cualquier trimestre</tspan></text><text x="40.0" y="557.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="569.5" width="920.0" height="342.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="583.5" width="294.3" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="203.1" y="603.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="203.1" dy="0">CLASIFICACIÓN O-RADS (ECOGRAFÍA)</tspan></text><text x="366.3" y="603.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="576"><tspan x="366.3" dy="0">Riesgo de cáncer de una masa ovárica según su aspecto.</tspan></text><rect x="56.0" y="643.5" width="168.0" height="117.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="644.1" width="166.8" height="82.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="140.0" y="671.5" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="152"><tspan x="140.0" dy="0">O-RADS 1</tspan></text><text x="140.0" y="691.5" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="144"><tspan x="140.0" dy="0">Normal</tspan></text><circle cx="72.0" cy="735.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="739.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="82.0" dy="0">Folículo, cuerpo lúteo</tspan></text><rect x="236.0" y="643.5" width="168.0" height="117.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="237.2" y="644.7" width="165.6" height="82.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="320.0" y="671.5" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="152"><tspan x="320.0" dy="0">O-RADS 2</tspan></text><text x="320.0" y="691.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="144"><tspan x="320.0" dy="0">Casi seguro</tspan><tspan x="320.0" dy="19">benigna</tspan></text><circle cx="252.0" cy="735.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="262.0" y="739.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="262.0" dy="0">Quiste simple &lt; 10 cm</tspan></text><rect x="274.6" y="632.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="320.0" y="647.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="320.0" dy="0">◆ ESTE CASO</tspan></text><rect x="416.0" y="643.5" width="168.0" height="117.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="416.6" y="644.1" width="166.8" height="82.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="500.0" y="671.5" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">O-RADS 3</tspan></text><text x="500.0" y="691.5" font-size="14" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="144"><tspan x="500.0" dy="0">Riesgo bajo</tspan></text><circle cx="432.0" cy="735.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="442.0" y="739.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="442.0" dy="0">Quiste simple ≥ 10 cm</tspan></text><rect x="596.0" y="643.5" width="168.0" height="117.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="596.6" y="644.1" width="166.8" height="82.0" rx="9" fill="#fee2e2" stroke="none" stroke-width="0"/><text x="680.0" y="671.5" font-size="11" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="152"><tspan x="680.0" dy="0">O-RADS 4</tspan></text><text x="680.0" y="691.5" font-size="14" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="144"><tspan x="680.0" dy="0">Riesgo intermedio</tspan></text><circle cx="612.0" cy="735.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="622.0" y="739.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="622.0" dy="0">Componente sólido</tspan></text><rect x="776.0" y="643.5" width="168.0" height="117.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="776.6" y="644.1" width="166.8" height="82.0" rx="9" fill="#fecaca" stroke="none" stroke-width="0"/><text x="860.0" y="671.5" font-size="11" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="middle" data-max="152"><tspan x="860.0" dy="0">O-RADS 5</tspan></text><text x="860.0" y="691.5" font-size="14" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="middle" data-max="144"><tspan x="860.0" dy="0">Riesgo alto</tspan></text><circle cx="792.0" cy="735.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="802.0" y="739.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="802.0" dy="0">Sólido irregular, ascitis</tspan></text><text x="56.0" y="790.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="799.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="814.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="814.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Quiste simple de 8 cm</tspan></text><rect x="56.0" y="821.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="836.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="836.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Sin partes sólidas ni tabiques descritos</tspan></text><rect x="56.0" y="858.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="881.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Control ecográfico y cirugía en el segundo trimestre si persiste.</tspan></text><text x="40.0" y="951.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="961.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="992.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="964.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="992.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">12 y 20</tspan></text><text x="435.0" y="992.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">8 y 12</tspan></text><text x="585.0" y="992.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">28 y 32</tspan></text><text x="735.0" y="992.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">32 y 36</tspan></text><text x="885.0" y="984.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Inmediatamente al</tspan><tspan x="885.0" dy="17">diagnóstico</tspan></text><rect x="40.0" y="1015.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1015.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1044.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Mejor momento?</tspan></text><text x="285.0" y="1044.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: segundo trimestre</tspan></text><text x="435.0" y="1036.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: riesgo de aborto y</tspan><tspan x="435.0" dy="16">el quiste puede irse</tspan></text><text x="585.0" y="1044.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: el útero estorba</tspan></text><text x="735.0" y="1036.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: riesgo de parto</tspan><tspan x="735.0" dy="16">pretérmino</tspan></text><text x="885.0" y="1036.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: salvo torsión o</tspan><tspan x="885.0" dy="16">rotura</tspan></text><rect x="40.0" y="961.5" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1089.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1117.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1139.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Esperar al segundo trimestre: muchos quistes se reabsorben, la placenta ya produce progesterona y el riesgo de aborto es menor.</tspan><tspan x="58.0" dy="18">• Operar (laparoscopia) entre las 14 y 20 semanas si persiste &gt; 5-6 cm, crece o parece sospechoso.</tspan><tspan x="58.0" dy="18">• Torsión o rotura: cirugía urgente en cualquier momento del embarazo.</tspan></text><text x="58.0" y="1197.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACR O-RADS US (2022); SAGES, cirugía laparoscópica en el embarazo (2024); Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>