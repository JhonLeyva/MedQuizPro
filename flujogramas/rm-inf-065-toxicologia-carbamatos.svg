<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="933" viewBox="0 0 1000 933" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Los carbamatos inhiben la acetilcolinesterasa y causan un síndrome colinérgico nicotínico-muscarínico"><title>Los carbamatos inhiben la acetilcolinesterasa y causan un síndrome colinérgico nicotínico-muscarínico</title><rect x="0.75" y="0.75" width="998.5" height="931.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Toxicología · carbamatos</tspan></text><rect x="349.5" y="32.0" width="121.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="410.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="106"><tspan x="410.4" dy="0">INFECTOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Intoxicación por carbamatos</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Carbaril, carbofurano y aldicarb inhiben de forma reversible la acetilcolinesterasa.</tspan><tspan x="58.0" dy="17">Se acumula acetilcolina en la sinapsis.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿A qué efecto se deben las manifestaciones clínicas?</tspan></text><line x1="640.0" y1="189.0" x2="670.0" y2="189.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ PRODUCE EL EXCESO DE ACETILCOLINA</tspan></text><line x1="410.9" y1="388.9" x2="340.0" y2="412.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="412.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="587.4" y1="324.5" x2="660.0" y2="295.8" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="295.8" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="387.0" x2="660.0" y2="409.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="409.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="410.9" y1="329.1" x2="340.0" y2="305.4" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="305.4" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="359.0" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="359.0" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="364.0" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">CARBAMATOS</tspan></text><text x="500.0" y="383.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">acetilcolina acumulada</tspan></text><rect x="40.0" y="259.8" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="288.7" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">MUSCARÍNICOS: el cuadro más visible</tspan></text><text x="190.0" y="312.3" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Diarrea, micción, miosis, broncorrea,</tspan><tspan x="190.0" dy="17">bradicardia, emesis, lagrimeo y salivación</tspan></text><rect x="144.6" y="341.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="356.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="367.0" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="368.0" width="6.0" height="89.2" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="395.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">NICOTÍNICOS: la causa de muerte</tspan></text><text x="190.0" y="419.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Fasciculaciones, debilidad y parálisis de</tspan><tspan x="190.0" dy="17">músculos respiratorios</tspan></text><rect x="660.0" y="253.8" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="254.8" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="810.0" y="287.6" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">GANGLIONARES</tspan></text><text x="810.0" y="311.2" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Taquicardia e hipertensión</tspan></text><rect x="660.0" y="353.8" width="300.0" height="110.3" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="354.8" width="6.0" height="108.3" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="382.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">DIFERENCIA CON</tspan><tspan x="810.0" dy="19.2">ORGANOFOSFORADOS</tspan></text><text x="810.0" y="425.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Reversible y de corta duración, sin</tspan><tspan x="810.0" dy="17">envejecimiento</tspan></text><text x="40.0" y="501.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="513.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="546.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Retirar la ropa y lavar la piel</tspan></text><line x1="248.5" y1="542.0" x2="267.5" y2="542.0" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,537.0 266.5,547.0 274.5,542.0" fill="#0f766e"/><rect x="278.5" y="513.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="546.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Asegurar la vía aérea</tspan></text><line x1="487.0" y1="542.0" x2="506.0" y2="542.0" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,537.0 505.0,547.0 513.0,542.0" fill="#0f766e"/><rect x="517.0" y="513.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="537.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Atropina hasta secar</tspan><tspan x="619.2" dy="17">secreciones</tspan></text><line x1="725.5" y1="542.0" x2="744.5" y2="542.0" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,537.0 743.5,547.0 751.5,542.0" fill="#0f766e"/><rect x="755.5" y="513.0" width="204.5" height="58.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="537.5" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Oximas casi nunca</tspan><tspan x="857.8" dy="17">necesarias</tspan></text><text x="40.0" y="611.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="621.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="643.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="643.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Adrenérg./colinérgico</tspan></text><rect x="363.0" y="624.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="643.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Nicotín./muscarínico</tspan></text><text x="585.0" y="643.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Vipérgico/noradren</tspan></text><text x="735.0" y="643.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Aminérgico/vipérgico</tspan></text><text x="885.0" y="643.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Peptidérg./colinérg</tspan></text><rect x="40.0" y="658.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="658.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="687.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Efecto de la</tspan><tspan x="54.0" dy="16">intoxicación?</tspan></text><text x="285.0" y="687.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: el cuadro no es</tspan><tspan x="285.0" dy="16">adrenérgico</tspan></text><text x="435.0" y="679.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: exceso de</tspan><tspan x="435.0" dy="16">acetilcolina en ambos</tspan><tspan x="435.0" dy="16">receptores</tspan></text><text x="585.0" y="679.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no es un</tspan><tspan x="585.0" dy="16">mecanismo del</tspan><tspan x="585.0" dy="16">toxídrome</tspan></text><text x="735.0" y="679.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no es un</tspan><tspan x="735.0" dy="16">mecanismo del</tspan><tspan x="735.0" dy="16">toxídrome</tspan></text><text x="885.0" y="679.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no es un</tspan><tspan x="885.0" dy="16">mecanismo del</tspan><tspan x="885.0" dy="16">toxídrome</tspan></text><rect x="40.0" y="621.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="748.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="776.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="798.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Muscarínicos (DUMBELS): diarrea, micción, miosis, broncorrea, bradicardia, emesis, lagrimeo y salivación, con diaforesis.</tspan><tspan x="58.0" dy="18">• Nicotínicos: fasciculaciones, debilidad y parálisis respiratoria (causa de muerte); estimulación ganglionar con taquicardia e hipertensión.</tspan><tspan x="58.0" dy="18">• El enlace carbamilado se hidroliza solo: dura horas, casi sin envejecimiento de la enzima ni síndrome intermedio; la colinesterasa se recupera pronto.</tspan><tspan x="58.0" dy="18">• Tratamiento: descontaminar, asegurar la vía aérea y dar atropina titulada hasta secar las secreciones; las oximas casi no se necesitan en carbamatos</tspan><tspan x="58.0" dy="18">   puros.</tspan></text><text x="58.0" y="892.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Eddleston M et al., Lancet 2008;371:597-607; Goodman y Gilman, 14.ª ed. (2023); Harrison, 21.ª ed. (2022).</tspan></text></svg>