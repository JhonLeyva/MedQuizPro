<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1168" viewBox="0 0 1000 1168" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la infección intestinal por C. difficile la vancomicina oral es el antibiótico eficaz, con fidaxomicina preferida hoy"><title>En la infección intestinal por C. difficile la vancomicina oral es el antibiótico eficaz, con fidaxomicina preferida hoy</title><rect x="0.75" y="0.75" width="998.5" height="1166.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Gastroenterología · colitis por Clostridioides difficile</tspan></text><rect x="509.6" y="32.0" width="165.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="592.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="149"><tspan x="592.4" dy="0">GASTROENTEROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección por C. difficile</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Toxinas A y B causan diarrea asociada a antibióticos y colitis pseudomembranosa.</tspan><tspan x="58.0" dy="17">Riesgo: clindamicina, cefalosporinas, quinolonas, edad avanzada, hospitalización e</tspan><tspan x="58.0" dy="17">inhibidores de bomba.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué antibiótico es más eficaz contra las infecciones</tspan><tspan x="640.0" dy="16">intestinales por C. difficile?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">GRAVEDAD DE LA INFECCIÓN Y TRATAMIENTO ORAL</tspan></text><rect x="70.0" y="279.0" width="34.0" height="330.0" rx="17" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="75.0" y="503.0" width="24.0" height="102.0" rx="8" fill="#10b981" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="554.0" x2="130.0" y2="554.0" stroke="#0f766e" stroke-width="3"/><rect x="130.0" y="504.0" width="330.0" height="100.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="144.0" y="526.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">No grave</tspan></text><text x="240.0" y="526.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Primer episodio</tspan></text><text x="144.0" y="547.0" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Diarrea sin criterios de gravedad</tspan></text><rect x="354.6" y="493.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="400.0" y="508.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="400.0" dy="0">◆ ESTE CASO</tspan></text><rect x="75.0" y="393.0" width="24.0" height="102.0" rx="8" fill="#f59e0b" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="444.0" x2="130.0" y2="444.0" stroke="#f59e0b" stroke-width="2"/><rect x="130.0" y="394.0" width="330.0" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="416.0" font-size="12" font-weight="800" font-style="normal" fill="#f59e0b" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Grave</tspan></text><text x="240.0" y="416.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Leucocitosis o Cr alta</tspan></text><text x="144.0" y="437.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Misma base oral, con vigilancia</tspan></text><rect x="75.0" y="283.0" width="24.0" height="102.0" rx="8" fill="#f97316" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="334.0" x2="130.0" y2="334.0" stroke="#f97316" stroke-width="2"/><rect x="130.0" y="284.0" width="330.0" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="306.0" font-size="12" font-weight="800" font-style="normal" fill="#f97316" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Fulminante</tspan></text><text x="240.0" y="306.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Hipotensión, íleo o megacolon</tspan></text><text x="144.0" y="327.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Vancomicina oral más metronidazol IV</tspan></text><text x="470.0" y="283.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="490"><tspan x="470.0" dy="0">PRIMER EPISODIO: QUÉ SE INDICA</tspan></text><rect x="470.0" y="297.0" width="490.0" height="84.0" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="339.0" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="344.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">1</tspan></text><text x="528.0" y="332.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Suspender el antibiótico causal</tspan></text><text x="528.0" y="355.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Y evitar antidiarreicos</tspan></text><line x1="498.0" y1="383.0" x2="498.0" y2="396.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,395.0 503.0,395.0 498.0,403.0" fill="#0f766e"/><rect x="470.0" y="405.0" width="490.0" height="84.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><circle cx="498.0" cy="447.0" r="17" fill="#ffffff" stroke="none" stroke-width="0"/><text x="498.0" y="452.0" font-size="15" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">2</tspan></text><text x="528.0" y="440.0" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Vancomicina oral 125 mg cada 6 h por 10 días</tspan></text><text x="528.0" y="463.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">No se absorbe: llega al colon</tspan></text><rect x="823.0" y="394.0" width="134.0" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="409.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ OPCIÓN CORRECTA</tspan></text><line x1="498.0" y1="491.0" x2="498.0" y2="504.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,503.0 503.0,503.0 498.0,511.0" fill="#0f766e"/><rect x="470.0" y="513.0" width="490.0" height="84.0" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="555.0" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="560.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">3</tspan></text><text x="528.0" y="548.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Fidaxomicina 200 mg cada 12 h por 10 días</tspan></text><text x="528.0" y="571.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Alternativa preferida en las guías actuales</tspan></text><text x="40.0" y="643.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">GRAVEDAD DE LA INFECCIÓN POR C. DIFFICILE (IDSA/SHEA 2017, ACTUALIZACIÓN 2021)</tspan></text><rect x="40.0" y="655.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="674.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">Gravedad</tspan></text><text x="160.0" y="674.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="389"><tspan x="160.0" dy="0">Criterio</tspan></text><text x="565.0" y="674.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="389"><tspan x="565.0" dy="0">Tratamiento</tspan></text><rect x="40.0" y="684.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="703.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">No grave</tspan></text><text x="160.0" y="703.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="160.0" dy="0">Leucocitos ≤ 15 000/µL y creatinina &lt; 1,5 mg/dL</tspan></text><text x="565.0" y="703.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="565.0" dy="0">Fidaxomicina 200 mg c/12 h (preferida) o vancomicina oral 125 mg c/6</tspan><tspan x="565.0" dy="15">h, 10 días</tspan></text><rect x="40.0" y="728.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="747.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">Grave</tspan></text><text x="160.0" y="747.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="160.0" dy="0">Leucocitos ≥ 15 000/µL o creatinina &gt; 1,5 mg/dL</tspan></text><text x="565.0" y="747.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="565.0" dy="0">Igual: fidaxomicina o vancomicina oral, 10 días</tspan></text><rect x="40.0" y="757.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="776.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">Fulminante</tspan></text><text x="160.0" y="776.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="160.0" dy="0">Hipotensión o shock, íleo o megacolon tóxico</tspan></text><text x="565.0" y="776.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="565.0" dy="0">Vancomicina oral 500 mg c/6 h más metronidazol IV; vancomicina</tspan><tspan x="565.0" dy="15">rectal si hay íleo; valorar cirugía</tspan></text><text x="40.0" y="817.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">El metronidazol solo se acepta en el episodio no grave si no hay fidaxomicina ni vancomicina.</tspan></text><text x="40.0" y="864.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="874.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="896.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="877.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="896.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Vancomicina</tspan></text><text x="435.0" y="896.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Bacitracina</tspan></text><text x="585.0" y="896.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Ácido fusídico</tspan></text><text x="735.0" y="896.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Eritromicina</tspan></text><text x="885.0" y="896.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Nitazoxanida</tspan></text><rect x="40.0" y="911.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="911.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="940.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Más eficaz contra C.</tspan><tspan x="54.0" dy="16">difficile?</tspan></text><text x="285.0" y="932.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: oral, no se absorbe,</tspan><tspan x="285.0" dy="16">alta concentración en</tspan><tspan x="285.0" dy="16">colon</tspan></text><text x="435.0" y="940.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: sin utilidad</tspan><tspan x="435.0" dy="16">establecida</tspan></text><text x="585.0" y="940.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sin utilidad</tspan><tspan x="585.0" dy="16">establecida</tspan></text><text x="735.0" y="948.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: sin actividad útil</tspan></text><text x="885.0" y="940.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: alternativa</tspan><tspan x="885.0" dy="16">experimental</tspan></text><rect x="40.0" y="874.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1001.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1029.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1051.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Diagnóstico: toxina o PCR del gen de la toxina en heces diarreicas, no en heces formadas.</tspan><tspan x="58.0" dy="18">• Primer episodio: fidaxomicina 200 mg dos veces al día por 10 días, o vancomicina oral 125 mg cuatro veces al día por 10 días (IDSA/SHEA 2021).</tspan><tspan x="58.0" dy="18">• La vancomicina oral no se absorbe y alcanza concentraciones altas en el colon; el metronidazol dejó de ser de primera línea.</tspan><tspan x="58.0" dy="18">• Alerta: la colitis fulminante (hipotensión, íleo, megacolon) añade metronidazol intravenoso.</tspan></text><text x="58.0" y="1127.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Johnson S et al., IDSA/SHEA, actualización 2021, Clin Infect Dis 2021;73:e1029-e1044; Kelly CR et al., ACG, Am J Gastroenterol 2021;116:1124-47.</tspan></text></svg>