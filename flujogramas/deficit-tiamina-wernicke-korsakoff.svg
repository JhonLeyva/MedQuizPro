<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1096" viewBox="0 0 1000 1096" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Alcohólico con confusión, nistagmo, oftalmoplejía y ataxia: encefalopatía de Wernicke, tiamina"><title>Alcohólico con confusión, nistagmo, oftalmoplejía y ataxia: encefalopatía de Wernicke, tiamina</title><rect x="0.75" y="0.75" width="998.5" height="1095.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neurología · déficit de tiamina</tspan></text><rect x="377.7" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="442.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="442.0" dy="0">NEUROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Encefalopatía de Wernicke</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Déficit de tiamina (B1), sobre todo en alcohólicos y desnutridos.</tspan><tspan x="58.0" dy="17">Urgencia: sin tratamiento deja el síndrome de Korsakoff (amnesia) o la muerte.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 50 años, alcohólico</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Desorientación, fallas de memoria inmediata, marcha</tspan><tspan x="640.0" dy="16">torpe.</tspan><tspan x="640.0" dy="16">Nistagmo vertical, paresia del III par, ataxia.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="395.0" x2="733.5" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="395.0" x2="266.5" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,423.0 271.5,423.0 266.5,431.0" fill="#94a3b8"/><line x1="733.5" y1="395.0" x2="733.5" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,423.0 738.5,423.0 733.5,431.0" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#0f766e"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="395.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="395.0" x2="266.5" y2="424.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,423.0 271.5,423.0 266.5,431.0" fill="#0f766e"/><rect x="171.9" y="404.0" width="189.2" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Sospecha de Wernicke (este caso)</tspan></text><rect x="704.2" y="404.0" width="58.6" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Después</tspan></text><polygon points="240.0,336.0 266.0,307.0 734.0,307.0 760.0,336.0 734.0,365.0 266.0,365.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="336.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="341.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="340.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Alcohólico con confusión, alteración ocular o ataxia</tspan></text><rect x="40.0" y="431.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">TIAMINA EV</tspan></text><text x="266.5" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Antes que la glucosa</tspan><tspan x="266.5" dy="17">Dosis altas, varios días</tspan></text><rect x="507.0" y="431.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="467.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Glucosa y nutrición</tspan></text><text x="733.5" y="490.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Magnesio, otras vitaminas</tspan></text><text x="40.0" y="561.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SIGNOS CON NOMBRE PROPIO</tspan></text><rect x="40.0" y="573.5" width="920.0" height="213.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><line x1="62.0" y1="615.5" x2="938.0" y2="615.5" stroke="#0f766e" stroke-width="2"/><line x1="62.0" y1="615.5" x2="62.0" y2="623.5" stroke="#0f766e" stroke-width="2"/><line x1="938.0" y1="615.5" x2="938.0" y2="623.5" stroke="#0f766e" stroke-width="2"/><rect x="376.8" y="603.5" width="246.3" height="24.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/><text x="500.0" y="619.5" font-size="10.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="232"><tspan x="500.0" dy="0">TRÍADA DE WERNICKE · 3 de 3 en el caso</tspan></text><rect x="56.0" y="635.5" width="288.0" height="104.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="76.0" cy="658.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="76.0" y="662.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="76.0" dy="0">1</tspan></text><text x="94.0" y="663.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="242"><tspan x="94.0" dy="0">Confusión</tspan></text><text x="68.0" y="689.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="264"><tspan x="68.0" dy="0">Desorientado</tspan></text><rect x="68.0" y="705.5" width="264.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="200.0" y="720.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="252"><tspan x="200.0" dy="0">✓ EN EL CASO</tspan></text><rect x="356.0" y="635.5" width="288.0" height="104.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="376.0" cy="658.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="376.0" y="662.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="376.0" dy="0">2</tspan></text><text x="394.0" y="663.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="242"><tspan x="394.0" dy="0">Oftalmoplejía o nistagmo</tspan></text><text x="368.0" y="689.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="264"><tspan x="368.0" dy="0">Nistagmo vertical, III par</tspan></text><rect x="368.0" y="705.5" width="264.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="500.0" y="720.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="252"><tspan x="500.0" dy="0">✓ EN EL CASO</tspan></text><rect x="656.0" y="635.5" width="288.0" height="104.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="676.0" cy="658.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="676.0" y="662.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="676.0" dy="0">3</tspan></text><text x="694.0" y="663.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="242"><tspan x="694.0" dy="0">Ataxia</tspan></text><text x="668.0" y="689.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="264"><tspan x="668.0" dy="0">Marcha torpe</tspan></text><rect x="668.0" y="705.5" width="264.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="800.0" y="720.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="252"><tspan x="800.0" dy="0">✓ EN EL CASO</tspan></text><text x="56.0" y="766.5" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">Tríada completa: tiamina EV de inmediato.</tspan></text><text x="40.0" y="826.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="836.5" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="859.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="859.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Dexametasona</tspan></text><text x="435.0" y="859.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Glucosa</tspan></text><rect x="513.0" y="839.5" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="859.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Tiamina</tspan></text><text x="735.0" y="859.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Etanol</tspan></text><text x="885.0" y="859.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Haloperidol</tspan></text><rect x="40.0" y="873.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="873.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="902.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tratamiento?</tspan></text><text x="285.0" y="894.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no hay edema ni</tspan><tspan x="285.0" dy="16">inflamación</tspan></text><text x="435.0" y="894.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No sin tiamina antes:</tspan><tspan x="435.0" dy="16">empeora</tspan></text><text x="585.0" y="894.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: repone la vitamina</tspan><tspan x="585.0" dy="16">B1</tspan></text><text x="735.0" y="902.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es la causa</tspan></text><text x="885.0" y="902.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no trata la causa</tspan></text><rect x="40.0" y="836.5" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="947.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="975.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="997.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Tiamina EV en dosis altas (200-500 mg cada 8 horas) antes de la glucosa.</tspan><tspan x="58.0" dy="18">• Dar glucosa sin tiamina puede precipitar o empeorar el cuadro.</tspan><tspan x="58.0" dy="18">• Basta sospecharla: solo 1 de cada 5 tiene la tríada completa.</tspan></text><text x="58.0" y="1055.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: EFNS, guía de encefalopatía de Wernicke (2010); Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>