<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="952" viewBox="0 0 1000 952" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Deleción paterna en 15q11-q13: síndrome de Prader-Willi por impronta genómica"><title>Deleción paterna en 15q11-q13: síndrome de Prader-Willi por impronta genómica</title><rect x="0.75" y="0.75" width="998.5" height="950.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Genética · impronta y Prader-Willi</tspan></text><rect x="399.5" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="471.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="471.4" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Impronta genómica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Solo se expresa un alelo, según su origen paterno o materno.</tspan><tspan x="58.0" dy="17">En 15q11-q13 se expresa el alelo paterno (SNRPN, MAGEL2).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño con deleción en 15q12</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Con técnica de bandas de alta resolución se halla la</tspan><tspan x="640.0" dy="16">deleción de q12 en el cromosoma 15.</tspan><tspan x="640.0" dy="16">La deleción procede del padre.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ORIGEN DE LA DELECIÓN 15Q11-Q13 Y SU EFECTO</tspan></text><text x="42.0" y="323.0" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="20"><tspan x="42.0" dy="0">I</tspan></text><text x="42.0" y="427.0" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="20"><tspan x="42.0" dy="0">II</tspan></text><line x1="241.0" y1="319.0" x2="399.0" y2="319.0" stroke="#1e293b" stroke-width="2"/><line x1="320.0" y1="319.0" x2="320.0" y2="363.0" stroke="#1e293b" stroke-width="2"/><line x1="320.0" y1="363.0" x2="320.0" y2="363.0" stroke="#1e293b" stroke-width="2"/><line x1="320.0" y1="363.0" x2="320.0" y2="406.0" stroke="#1e293b" stroke-width="2"/><rect x="207.0" y="302.0" width="34" height="34" fill="#1e293b" stroke="#1e293b" stroke-width="2.2"/><text x="224.0" y="352.0" font-size="10" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="84"><tspan x="224.0" dy="0">Cromosoma 15</tspan><tspan x="224.0" dy="12">con la deleción</tspan></text><circle cx="416.0" cy="319.0" r="17" fill="#ffffff" stroke="#1e293b" stroke-width="2.2"/><text x="416.0" y="352.0" font-size="10" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="84"><tspan x="416.0" dy="0">Cromosomas 15</tspan><tspan x="416.0" dy="12">normales</tspan></text><rect x="303.0" y="406.0" width="34" height="34" fill="#1e293b" stroke="#1e293b" stroke-width="2.2"/><line x1="276.0" y1="459.0" x2="294.3" y2="447.7" stroke="#ea580c" stroke-width="3"/><polygon points="297.0,452.0 291.7,443.5 302.0,443.0" fill="#ea580c"/><text x="276.0" y="475.0" font-size="10.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="70"><tspan x="276.0" dy="0">paciente</tspan></text><text x="320.0" y="456.0" font-size="10" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="84"><tspan x="320.0" dy="0">Hijo: sin alelo</tspan><tspan x="320.0" dy="12">paterno</tspan></text><rect x="47.0" y="488.0" width="18" height="18" fill="#ffffff" stroke="#1e293b" stroke-width="2.2"/><text x="72.0" y="501.0" font-size="10.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="80"><tspan x="72.0" dy="0">Varón</tspan></text><circle cx="166.0" cy="497.0" r="9" fill="#ffffff" stroke="#1e293b" stroke-width="2.2"/><text x="182.0" y="501.0" font-size="10.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="80"><tspan x="182.0" dy="0">Mujer</tspan></text><rect x="267.0" y="488.0" width="18" height="18" fill="#1e293b" stroke="#1e293b" stroke-width="2.2"/><text x="292.0" y="501.0" font-size="10.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="80"><tspan x="292.0" dy="0">Afectado</tspan></text><circle cx="386.0" cy="497.0" r="9" fill="#ffffff" stroke="#1e293b" stroke-width="2.2"/><path d="M386.0,488.0 A9,9 0 0 0 386.0,506.0 Z" fill="#1e293b"/><text x="402.0" y="501.0" font-size="10.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="80"><tspan x="402.0" dy="0">Portadora</tspan></text><rect x="620.0" y="285.0" width="340.0" height="69.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="630.0" y="301.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="320"><tspan x="630.0" dy="0">Alelo paterno ausente</tspan></text><text x="630.0" y="318.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="320"><tspan x="630.0" dy="0">El niño hereda la deleción del padre: no se expresa SNRPN ni</tspan><tspan x="630.0" dy="14.5">MAGEL2.</tspan></text><rect x="620.0" y="364.0" width="340.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="630.0" y="380.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="320"><tspan x="630.0" dy="0">Alelo materno silenciado</tspan></text><text x="630.0" y="397.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="320"><tspan x="630.0" dy="0">Está inactivado por metilación: no compensa la falta.</tspan></text><rect x="620.0" y="427.0" width="340.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="630.0" y="443.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="320"><tspan x="630.0" dy="0">Si fuera materna</tspan></text><text x="630.0" y="460.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="320"><tspan x="630.0" dy="0">La misma deleción de origen materno causa Angelman.</tspan></text><rect x="40.0" y="537.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="563.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Deleción paterna en 15q11-q13 = Prader-Willi</tspan></text><text x="60.0" y="582.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El origen del cromosoma delecionado decide el síndrome.</tspan></text><text x="40.0" y="649.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="659.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="681.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="662.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="681.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Prader-Willi</tspan></text><text x="435.0" y="681.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Klinefelter</tspan></text><text x="585.0" y="681.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Turner</tspan></text><text x="735.0" y="681.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Down</tspan></text><text x="885.0" y="681.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Edwards</tspan></text><rect x="40.0" y="696.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="696.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="725.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Síndrome?</tspan></text><text x="285.0" y="717.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: sin alelo paterno en</tspan><tspan x="285.0" dy="16">15q11-q13</tspan></text><text x="435.0" y="717.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: 47,XXY, no hay</tspan><tspan x="435.0" dy="16">deleción 15q</tspan></text><text x="585.0" y="717.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: 45,X, no hay</tspan><tspan x="585.0" dy="16">deleción 15q</tspan></text><text x="735.0" y="717.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: trisomía 21, no hay</tspan><tspan x="735.0" dy="16">deleción 15q</tspan></text><text x="885.0" y="717.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: trisomía 18, no hay</tspan><tspan x="885.0" dy="16">deleción 15q</tspan></text><rect x="40.0" y="659.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="770.0" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="798.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="820.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Si falta el segmento paterno, no se expresa la región (el alelo materno está silenciado por metilación): Prader-Willi, en cerca del 70 %.</tspan><tspan x="58.0" dy="18">• El resto se debe a disomía uniparental materna o a defectos de la impronta; se confirma con estudio de metilación.</tspan><tspan x="58.0" dy="18">• Clínica: hipotonía y mala succión en el lactante, luego hiperfagia insaciable, obesidad, talla baja, hipogonadismo y discapacidad intelectual leve.</tspan><tspan x="58.0" dy="18">• La misma deleción de origen materno causa Angelman: ataxia, convulsiones, risa inmotivada y ausencia del habla.</tspan></text><text x="58.0" y="896.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Driscoll et al., Prader-Willi Syndrome, GeneReviews (actualización 2023); Angulo et al., J Endocrinol Invest (2015); Thompson &amp; Thompson, Genética en medicina 8.ª</tspan><tspan x="58.0" dy="15">ed.</tspan></text></svg>