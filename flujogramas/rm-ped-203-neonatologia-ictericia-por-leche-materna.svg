<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1202" viewBox="0 0 1000 1202" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Ictericia por leche materna de 12 mg/dL a las 3 semanas: educar a la madre y continuar la lactancia"><title>Ictericia por leche materna de 12 mg/dL a las 3 semanas: educar a la madre y continuar la lactancia</title><rect x="0.75" y="0.75" width="998.5" height="1200.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neonatología · ictericia por leche materna</tspan></text><rect x="446.8" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="495.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="495.8" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ictericia asociada a la leche materna</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hiperbilirrubinemia indirecta de inicio tardío: aparece del día 5 al 7, máximo en la segunda</tspan><tspan x="58.0" dy="17">semana y puede durar 8 a 12 semanas.</tspan><tspan x="58.0" dy="17">Aumenta la circulación enterohepática.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Neonato de 3 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Ictericia por leche materna.</tspan><tspan x="640.0" dy="16">Bilirrubina indirecta de 12 mg/dL.</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="255.0" x2="422.2" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="422.2" y1="255.0" x2="422.2" y2="284.0" stroke="#94a3b8" stroke-width="2"/><polygon points="417.2,283.0 427.2,283.0 422.2,291.0" fill="#94a3b8"/><line x1="422.2" y1="349.0" x2="422.2" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="379.0" x2="655.7" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="379.0" x2="188.7" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,407.0 193.7,407.0 188.7,415.0" fill="#94a3b8"/><line x1="655.7" y1="379.0" x2="655.7" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="650.7,407.0 660.7,407.0 655.7,415.0" fill="#94a3b8"/><line x1="655.7" y1="485.0" x2="655.7" y2="518.5" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="518.5" x2="811.3" y2="518.5" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="518.5" x2="500.0" y2="547.5" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,546.5 505.0,546.5 500.0,554.5" fill="#94a3b8"/><line x1="811.3" y1="518.5" x2="811.3" y2="547.5" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,546.5 816.3,546.5 811.3,554.5" fill="#94a3b8"/><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="255.0" x2="422.2" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="422.2" y1="255.0" x2="422.2" y2="284.0" stroke="#0f766e" stroke-width="3"/><polygon points="417.2,283.0 427.2,283.0 422.2,291.0" fill="#0f766e"/><line x1="422.2" y1="349.0" x2="422.2" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="422.2" y1="379.0" x2="655.7" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="655.7" y1="379.0" x2="655.7" y2="408.0" stroke="#0f766e" stroke-width="3"/><polygon points="650.7,407.0 660.7,407.0 655.7,415.0" fill="#0f766e"/><line x1="655.7" y1="485.0" x2="655.7" y2="518.5" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="518.5" x2="655.7" y2="518.5" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="518.5" x2="500.0" y2="547.5" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,546.5 505.0,546.5 500.0,554.5" fill="#0f766e"/><rect x="72.9" y="388.0" width="231.6" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="188.7" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">Bilirrubina directa elevada, acolia o coluria</tspan></text><rect x="366.7" y="527.5" width="266.7" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="500.0" y="540.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">Nivel de 12 mg/dL: lejos del umbral de fototerapia</tspan></text><rect x="693.4" y="527.5" width="235.8" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="811.3" y="540.0" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">Nivel por encima del umbral de la AAP 2022</tspan></text><polygon points="162.2,320.0 188.2,291.0 656.2,291.0 682.2,320.0 656.2,349.0 188.2,349.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="208.2" cy="320.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="208.2" y="325.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="208.2" dy="0">?</tspan></text><text x="441.2" y="324.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="441.2" dy="0">Neonato de 3 semanas con ictericia e indirecta de 12 mg/dL</tspan></text><rect x="40.0" y="415.0" width="297.3" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="188.7" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">COLESTASIS</tspan></text><text x="188.7" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Estudiar: atresia de vías biliares y otras causas</tspan></text><polygon points="395.7,450.0 421.7,415.0 889.7,415.0 915.7,450.0 889.7,485.0 421.7,485.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="441.7" cy="450.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="441.7" y="455.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="441.7" dy="0">?</tspan></text><text x="674.7" y="446.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="674.7" dy="0">Término, sano, con buena ganancia de peso y heces</tspan><tspan x="674.7" dy="17">amarillas</tspan></text><rect x="351.3" y="554.5" width="297.3" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="582.8" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">ICTERICIA POR LECHE MATERNA</tspan></text><text x="500.0" y="605.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Educar a la madre</tspan><tspan x="500.0" dy="17">Continuar la lactancia</tspan></text><rect x="662.7" y="554.5" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="591.3" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">FOTOTERAPIA</tspan></text><text x="811.3" y="614.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">No corresponde a este caso</tspan></text><text x="40.0" y="678.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ICTERICIA POR LECHE MATERNA FRENTE A OTRAS CAUSAS</tspan></text><rect x="40.0" y="690.9" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="709.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Causa</tspan></text><text x="280.0" y="709.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Inicio</tspan></text><text x="625.0" y="709.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Rasgo</tspan></text><rect x="40.0" y="719.9" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="738.9" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Leche materna</tspan></text><text x="280.0" y="738.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Día 5-7; máximo en la 2.ª semana</tspan></text><text x="625.0" y="738.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Indirecta; recién nacido sano; puede durar 8-12 semanas</tspan></text><rect x="170.6" y="723.4" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="216.0" y="738.4" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="216.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="748.9" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="767.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Lactancia insuficiente</tspan></text><text x="280.0" y="767.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Temprana</tspan></text><text x="625.0" y="767.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Indirecta; pérdida de peso</tspan></text><rect x="40.0" y="777.9" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="796.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Colestasis</tspan></text><text x="280.0" y="796.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Mayor de 2 semanas</tspan></text><text x="625.0" y="796.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Directa elevada, acolia y coluria</tspan></text><text x="40.0" y="846.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="856.9" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="896.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="896.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Fototerapia</tspan></text><text x="435.0" y="887.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Ofrecer lactancia</tspan><tspan x="435.0" dy="17">mixta</tspan></text><rect x="513.0" y="859.9" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="879.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Educar a la madre y</tspan><tspan x="585.0" dy="17">continuar la</tspan><tspan x="585.0" dy="17">lactancia</tspan></text><text x="735.0" y="887.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Suspender la</tspan><tspan x="735.0" dy="17">lactancia materna</tspan></text><text x="885.0" y="887.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Alimentación con</tspan><tspan x="885.0" dy="17">leche de soya</tspan></text><rect x="40.0" y="927.9" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="927.9" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="956.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Conducta?</tspan></text><text x="285.0" y="948.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: el nivel está lejos</tspan><tspan x="285.0" dy="16">del umbral</tspan></text><text x="435.0" y="948.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no corrige la causa</tspan><tspan x="435.0" dy="16">ni es necesaria</tspan></text><text x="585.0" y="948.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: educar y continuar</tspan><tspan x="585.0" dy="16">la lactancia</tspan></text><text x="735.0" y="948.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no es necesario</tspan><tspan x="735.0" dy="16">suspenderla</tspan></text><text x="885.0" y="956.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no tiene utilidad</tspan></text><rect x="40.0" y="856.9" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1001.9" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1029.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1051.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Se diagnostica por exclusión: recién nacido de término, sano, buena ganancia de peso, deposiciones amarillas, orina clara y bilirrubina indirecta.</tspan><tspan x="58.0" dy="18">• Con ictericia de más de 2 semanas se mide la bilirrubina directa para descartar colestasis (acolia, coluria, hepatomegalia).</tspan><tspan x="58.0" dy="18">• A los 12 mg/dL el valor está muy por debajo de los umbrales de fototerapia de la AAP 2022: no se necesita tratamiento y se educa y se continúa la</tspan><tspan x="58.0" dy="18">   lactancia.</tspan><tspan x="58.0" dy="18">• No se suspende la lactancia ni se cambia a fórmula o soya; si la bilirrubina directa está elevada, se estudia la colestasis.</tspan></text><text x="58.0" y="1145.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Kemper AR et al. Clinical practice guideline revision: management of hyperbilirubinemia in the newborn infant 35 or more weeks of gestation. Pediatrics</tspan><tspan x="58.0" dy="15">2022;150:e2022058859; Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>