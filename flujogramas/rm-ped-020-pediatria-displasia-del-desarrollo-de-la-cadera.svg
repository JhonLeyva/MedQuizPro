<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1195" viewBox="0 0 1000 1195" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Lactante de 2 meses con Ortolani y Barlow positivos: la ecografía confirma la displasia del desarrollo de la cadera"><title>Lactante de 2 meses con Ortolani y Barlow positivos: la ecografía confirma la displasia del desarrollo de la cadera</title><rect x="0.75" y="0.75" width="998.5" height="1193.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · displasia del desarrollo de la cadera</tspan></text><rect x="476.2" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="525.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="525.3" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Displasia del desarrollo de la cadera</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Espectro desde la displasia acetabular hasta la luxación franca.</tspan><tspan x="58.0" dy="17">Riesgo: sexo femenino, podálica, antecedente familiar, oligohidramnios y embalaje</tspan><tspan x="58.0" dy="17">apretado.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 2 meses</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Control de niño sano.</tspan><tspan x="640.0" dy="16">Asimetría de pliegues glúteos, Ortolani (+) y Barlow (+).</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SE HACE A CADA EDAD</tspan></text><rect x="40.0" y="269.0" width="920.0" height="34.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="52.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="174"><tspan x="52.0" dy="0">MEDIDA</tspan></text><text x="282.2" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="100"><tspan x="282.2" dy="0">Hasta 6 semanas</tspan></text><text x="386.8" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="100"><tspan x="386.8" dy="0">6 sem a 4 meses</tspan></text><text x="491.2" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="100"><tspan x="491.2" dy="0">4 a 6 meses</tspan></text><text x="595.8" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="100"><tspan x="595.8" dy="0">Más de 6 meses</tspan></text><text x="664.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="290"><tspan x="664.0" dy="0">UTILIDAD</tspan></text><rect x="40.0" y="309.0" width="182.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="331.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="50.0" dy="0">Maniobras de Ortolani y</tspan><tspan x="50.0" dy="16">Barlow</tspan></text><line x1="238.0" y1="335.0" x2="640.0" y2="335.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="282.2" cy="330.0" r="13" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="282.2" y="334.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="282.2" dy="0">!</tspan></text><text x="282.2" y="357.0" font-size="9.5" font-weight="700" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="100"><tspan x="282.2" dy="0">Cribado</tspan></text><circle cx="386.8" cy="330.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="386.8" y="357.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="100"><tspan x="386.8" dy="0">Útil</tspan></text><rect x="660.0" y="309.0" width="300.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="670.0" y="339.0" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="280"><tspan x="670.0" dy="0">Positivas en el recién nacido; luego desaparecen.</tspan></text><rect x="40.0" y="367.0" width="182.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="397.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="50.0" dy="0">Ecografía de cadera</tspan></text><line x1="238.0" y1="393.0" x2="640.0" y2="393.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="386.8" cy="388.0" r="13" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="386.8" y="392.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.8" dy="0">!</tspan></text><text x="386.8" y="415.0" font-size="9.5" font-weight="700" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="100"><tspan x="386.8" dy="0">Elección</tspan></text><circle cx="491.2" cy="388.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="491.2" y="415.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="100"><tspan x="491.2" dy="0">Posible</tspan></text><rect x="660.0" y="367.0" width="300.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="670.0" y="389.5" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="280"><tspan x="670.0" dy="0">Confirma antes de que aparezca el núcleo de</tspan><tspan x="670.0" dy="15">osificación.</tspan></text><rect x="40.0" y="425.0" width="182.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="455.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="50.0" dy="0">Radiografía de pelvis</tspan></text><line x1="238.0" y1="451.0" x2="640.0" y2="451.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="491.2" cy="446.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="491.2" y="473.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="100"><tspan x="491.2" dy="0">Desde aquí</tspan></text><circle cx="595.8" cy="446.0" r="13" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="595.8" y="450.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="595.8" dy="0">!</tspan></text><text x="595.8" y="473.0" font-size="9.5" font-weight="700" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="100"><tspan x="595.8" dy="0">Elección</tspan></text><rect x="660.0" y="425.0" width="300.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="670.0" y="455.0" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="280"><tspan x="670.0" dy="0">Útil cuando el núcleo ya es visible.</tspan></text><rect x="40.0" y="483.0" width="182.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="513.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="50.0" dy="0">Arnés de Pavlik</tspan></text><line x1="238.0" y1="509.0" x2="640.0" y2="509.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="282.2" cy="504.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="282.2" y="531.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="100"><tspan x="282.2" dy="0">Si hay inestabilidad</tspan></text><circle cx="386.8" cy="504.0" r="13" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="386.8" y="508.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.8" dy="0">!</tspan></text><text x="386.8" y="531.0" font-size="9.5" font-weight="700" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="100"><tspan x="386.8" dy="0">Inicio</tspan></text><rect x="660.0" y="483.0" width="300.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="670.0" y="505.5" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="280"><tspan x="670.0" dy="0">Tratamiento inicial de la cadera inestable; derivar al</tspan><tspan x="670.0" dy="15">traumatólogo.</tspan></text><text x="44.0" y="555.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="44.0" dy="0">! = ventana de elección en cada medida · círculo vacío = posible o complementaria</tspan></text><rect x="40.0" y="579.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="605.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">A los 2 meses = ecografía de cadera</tspan></text><text x="60.0" y="624.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La radiografía, la tomografía, la resonancia y la gammagrafía no son el estudio confirmatorio a esta edad.</tspan></text><text x="40.0" y="685.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ESTUDIO DE IMAGEN DE LA DISPLASIA DEL DESARROLLO DE LA CADERA SEGÚN LA EDAD</tspan></text><rect x="40.0" y="697.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="716.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Edad</tspan></text><text x="350.0" y="716.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="294"><tspan x="350.0" dy="0">Estudio</tspan></text><text x="660.0" y="716.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="294"><tspan x="660.0" dy="0">Motivo</tspan></text><rect x="40.0" y="726.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="745.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Menor de 4-6 meses (este caso)</tspan></text><text x="350.0" y="745.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="350.0" dy="0">Ecografía (Graf o Harcke)</tspan></text><text x="660.0" y="745.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="660.0" dy="0">El núcleo de osificación de la cabeza femoral aún no</tspan><tspan x="660.0" dy="15">aparece</tspan></text><rect x="240.6" y="737.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="286.0" y="752.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="770.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="789.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Mayor de 4 a 6 meses</tspan></text><text x="350.0" y="789.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="350.0" dy="0">Radiografía de pelvis</tspan></text><text x="660.0" y="789.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="660.0" dy="0">El núcleo de osificación ya es visible</tspan></text><text x="40.0" y="839.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="849.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="880.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="852.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="880.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Ecografía</tspan></text><text x="435.0" y="880.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Radiografía</tspan></text><text x="585.0" y="880.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Tomografía</tspan></text><text x="735.0" y="871.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Resonancia</tspan><tspan x="735.0" dy="17">magnética</tspan></text><text x="885.0" y="880.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Gammagrafía</tspan></text><rect x="40.0" y="903.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="903.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="932.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Prueba confirmatoria?</tspan></text><text x="285.0" y="924.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: estudio de elección</tspan><tspan x="285.0" dy="16">antes de los 4-6 meses</tspan></text><text x="435.0" y="924.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: subestima la lesión</tspan><tspan x="435.0" dy="16">antes de los 4-6 meses</tspan></text><text x="585.0" y="924.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: solo en situaciones</tspan><tspan x="585.0" dy="16">especiales</tspan></text><text x="735.0" y="924.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: solo en situaciones</tspan><tspan x="735.0" dy="16">especiales</tspan></text><text x="885.0" y="932.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no tiene papel</tspan></text><rect x="40.0" y="849.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="977.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1005.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1027.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Ortolani reduce la cadera luxada con un chasquido y Barlow la luxa; después de los 3 meses desaparecen y aparecen limitación de la abducción,</tspan><tspan x="58.0" dy="18">   acortamiento y asimetría de pliegues.</tspan><tspan x="58.0" dy="18">• Antes de los 4-6 meses el núcleo de osificación aún no aparece, por eso la radiografía subestima la lesión: ecografía (Graf: ángulos alfa y beta; Harcke:</tspan><tspan x="58.0" dy="18">   dinámica).</tspan><tspan x="58.0" dy="18">• AAP 2016: ecografía entre las 6 semanas y los 6 meses en casos dudosos o de riesgo; radiografía de pelvis después de los 4-6 meses.</tspan><tspan x="58.0" dy="18">• Alerta: cadera inestable, arnés de Pavlik y derivar al traumatólogo pediatra; el diagnóstico tardío obliga a cirugía y causa artrosis precoz.</tspan></text><text x="58.0" y="1139.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Shaw BA, Segal LS, AAP, Evaluation and Referral for Developmental Dysplasia of the Hip in Infants, Pediatrics 2016;138:e20163107; Nelson Tratado de Pediatría 22.ª</tspan><tspan x="58.0" dy="15">ed. (2024).</tspan></text></svg>