<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1022" viewBox="0 0 1000 1022" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Por el ritmo circadiano, las crisis de asma son más frecuentes de madrugada, entre las 4 y las 6 de la mañana"><title>Por el ritmo circadiano, las crisis de asma son más frecuentes de madrugada, entre las 4 y las 6 de la mañana</title><rect x="0.75" y="0.75" width="998.5" height="1020.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Asma · ritmo circadiano</tspan></text><rect x="342.2" y="32.0" width="129.8" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="407.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="114"><tspan x="407.1" dy="0">NEUMOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="148.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Asma nocturna</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El calibre de los bronquios varía en el día: el flujo espiratorio es menor de madrugada (4-6</tspan><tspan x="58.0" dy="17">a. m.) y mayor por la tarde.</tspan><tspan x="58.0" dy="17">A esa hora el cortisol y la adrenalina están en su punto más bajo y el tono vagal en el más</tspan><tspan x="58.0" dy="17">alto.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="148.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="146.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿A qué hora son más frecuentes las crisis de asma?</tspan></text><rect x="640.0" y="209.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="222.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="222.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="270.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">FLUJO ESPIRATORIO MÁXIMO A LO LARGO DEL DÍA</tspan></text><rect x="40.0" y="282.0" width="540.0" height="340.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="175.3" y="302.0" width="38.7" height="272.0" rx="0" fill="#fee2e2" stroke="none" stroke-width="0"/><text x="194.7" y="318.0" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="33"><tspan x="194.7" dy="0">crisis</tspan></text><rect x="368.7" y="302.0" width="38.7" height="272.0" rx="0" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="388.0" y="318.0" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="33"><tspan x="388.0" dy="0">pico</tspan></text><line x1="98.0" y1="574.0" x2="562.0" y2="574.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="578.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">70</tspan></text><line x1="98.0" y1="496.3" x2="562.0" y2="496.3" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="500.3" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">80</tspan></text><line x1="98.0" y1="418.6" x2="562.0" y2="418.6" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="422.6" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">90</tspan></text><line x1="98.0" y1="340.9" x2="562.0" y2="340.9" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="344.9" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">100</tspan></text><line x1="98.0" y1="574.0" x2="98.0" y2="579.0" stroke="#94a3b8" stroke-width="1.5"/><text x="98.0" y="593.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="98.0" dy="0">0 h</tspan></text><line x1="175.3" y1="574.0" x2="175.3" y2="579.0" stroke="#94a3b8" stroke-width="1.5"/><text x="175.3" y="593.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="175.3" dy="0">4</tspan></text><line x1="252.7" y1="574.0" x2="252.7" y2="579.0" stroke="#94a3b8" stroke-width="1.5"/><text x="252.7" y="593.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="252.7" dy="0">8</tspan></text><line x1="330.0" y1="574.0" x2="330.0" y2="579.0" stroke="#94a3b8" stroke-width="1.5"/><text x="330.0" y="593.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="330.0" dy="0">12</tspan></text><line x1="407.3" y1="574.0" x2="407.3" y2="579.0" stroke="#94a3b8" stroke-width="1.5"/><text x="407.3" y="593.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="407.3" dy="0">16</tspan></text><line x1="484.7" y1="574.0" x2="484.7" y2="579.0" stroke="#94a3b8" stroke-width="1.5"/><text x="484.7" y="593.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="484.7" dy="0">20</tspan></text><line x1="562.0" y1="574.0" x2="562.0" y2="579.0" stroke="#94a3b8" stroke-width="1.5"/><text x="562.0" y="593.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="562.0" dy="0">24 h</tspan></text><line x1="98.0" y1="574.0" x2="562.0" y2="574.0" stroke="#94a3b8" stroke-width="1.5"/><line x1="98.0" y1="302.0" x2="98.0" y2="574.0" stroke="#94a3b8" stroke-width="1.5"/><text x="330.0" y="612.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="464"><tspan x="330.0" dy="0">Hora del día</tspan></text><text x="56.0" y="438.0" transform="rotate(-90 56.0 438.0)" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Flujo espiratorio (% del mejor)</text><polyline points="98.0,434.1 136.7,473.0 175.3,504.1 194.7,507.9 214.0,496.3 252.7,457.4 291.3,418.6 330.0,387.5 368.7,364.2 407.3,348.6 446.0,364.2 484.7,387.5 523.3,410.8 562.0,434.1" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="194.7" y1="507.9" x2="194.7" y2="574.0" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4"/><circle cx="194.7" cy="507.9" r="9" fill="#ea580c" stroke="#ffffff" stroke-width="3"/><rect x="158.8" y="482.9" width="71.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="194.7" y="497.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="194.7" dy="0">◆ 4-6 a. m.</tspan></text><rect x="602.0" y="361.5" width="358.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="617.0" y="385.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Madrugada: flujo más bajo</tspan></text><text x="617.0" y="402.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Cortisol y adrenalina mínimos, tono vagal alto.</tspan></text><rect x="602.0" y="424.5" width="358.0" height="55.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="617.0" y="448.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Tarde: flujo más alto</tspan></text><text x="617.0" y="465.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">14-16 h: los bronquios están más abiertos.</tspan></text><rect x="602.0" y="487.5" width="358.0" height="55.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="617.0" y="511.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Si despierta por asma</tspan></text><text x="617.0" y="528.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Asma no controlada: subir el tratamiento.</tspan></text><rect x="40.0" y="640.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="666.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Las crisis son más frecuentes de 4 a 6 a. m.</tspan></text><text x="60.0" y="685.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Por eso se pregunta si el asma lo despierta de noche.</tspan></text><text x="40.0" y="752.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="762.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="784.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="784.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">14 a 16 h</tspan></text><text x="435.0" y="784.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">10 a 12 h</tspan></text><rect x="513.0" y="765.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="784.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">4 a 6 h</tspan></text><text x="735.0" y="784.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">20 a 22 h</tspan></text><text x="885.0" y="784.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">8 a 10 h</tspan></text><rect x="40.0" y="799.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="799.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="828.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Horario?</tspan></text><text x="285.0" y="820.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: el flujo es máximo</tspan><tspan x="285.0" dy="16">por la tarde</tspan></text><text x="435.0" y="828.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: cortisol alto</tspan></text><text x="585.0" y="828.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: madrugada</tspan></text><text x="735.0" y="820.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: aún no es el</tspan><tspan x="735.0" dy="16">mínimo</tspan></text><text x="885.0" y="828.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: cortisol en su pico</tspan></text><rect x="40.0" y="762.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="873.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="901.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="923.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Despertar por asma ≥ 1 vez por semana = asma no controlada (GINA): subir el escalón.</tspan><tspan x="58.0" dy="18">• La variabilidad diaria del flujo espiratorio máximo &gt; 10 % en adultos apoya el diagnóstico.</tspan><tspan x="58.0" dy="18">• Tratamiento de base: corticoide inhalado con formoterol (budesonida-formoterol) a demanda o diario.</tspan></text><text x="58.0" y="981.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: GINA 2025; Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>