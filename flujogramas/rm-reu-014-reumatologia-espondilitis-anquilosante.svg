<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1024" viewBox="0 0 1000 1024" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="De los AINE de la lista, el único inhibidor selectivo de la COX-2 es el celecoxib"><title>De los AINE de la lista, el único inhibidor selectivo de la COX-2 es el celecoxib</title><rect x="0.75" y="0.75" width="998.5" height="1022.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Reumatología · espondilitis anquilosante</tspan></text><rect x="442.0" y="32.0" width="227.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="555.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="211"><tspan x="555.7" dy="0">REUMATOLOGÍA Y DERMATOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Espondiloartritis axial</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Dolor lumbar inflamatorio antes de los 45 años, rigidez matutina que mejora con ejercicio,</tspan><tspan x="58.0" dy="17">HLA-B27.</tspan><tspan x="58.0" dy="17">Primera línea: AINE a dosis plena.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 55 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dolor lumbar agudo por espondilitis anquilosante.</tspan><tspan x="640.0" dy="16">Se quiere un AINE selectivo de COX-2.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">AINE NO SELECTIVOS FRENTE A SELECTIVO DE COX-2</tspan></text><rect x="493.0" y="319.0" width="14" height="190" rx="5" fill="#64748b"/><path d="M440.0 524.0 H560.0 L540.0 504.0 H460.0 Z" fill="#475569"/><circle cx="500.0" cy="319.0" r="15" fill="#f59e0b" stroke="#92400e" stroke-width="2"/><line x1="385.4" y1="300.9" x2="614.6" y2="337.1" stroke="#334155" stroke-width="7" stroke-linecap="round"/><line x1="385.4" y1="300.9" x2="357.4" y2="362.9" stroke="#64748b" stroke-width="2"/><line x1="385.4" y1="300.9" x2="413.4" y2="362.9" stroke="#64748b" stroke-width="2"/><path d="M347.4 362.9 H423.4 Q385.4 406.9 347.4 362.9 Z" fill="#64748b"/><text x="385.4" y="377.9" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="385.4" dy="0">NO</tspan></text><line x1="614.6" y1="337.1" x2="586.6" y2="399.1" stroke="#64748b" stroke-width="2"/><line x1="614.6" y1="337.1" x2="642.6" y2="399.1" stroke="#64748b" stroke-width="2"/><path d="M576.6 399.1 H652.6 Q614.6 443.1 576.6 399.1 Z" fill="#ea580c"/><text x="614.6" y="414.1" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="614.6" dy="0">SÍ</tspan></text><text x="500.0" y="551.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="300"><tspan x="500.0" dy="0">¿Cuál es selectivo de COX-2?</tspan></text><rect x="40.0" y="289.0" width="290.0" height="158.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58.0" y="317.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="58.0" dy="0">No selectivos o parciales</tspan></text><circle cx="62.0" cy="342.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="346.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Piroxicam</tspan></text><circle cx="62.0" cy="368.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="372.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Indometacina: clásica, más tóxica</tspan></text><circle cx="62.0" cy="394.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="398.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Sulindac: profármaco no selectivo</tspan></text><circle cx="62.0" cy="420.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="424.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Nabumetona: selectividad parcial</tspan></text><rect x="670.0" y="289.0" width="290.0" height="174.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><text x="688.0" y="317.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="254"><tspan x="688.0" dy="0">Selectivo de COX-2 (este caso)</tspan></text><circle cx="692.0" cy="342.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="346.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Celecoxib</tspan></text><circle cx="692.0" cy="368.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="372.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Menos efectos digestivos que los</tspan><tspan x="704.0" dy="16">tradicionales</tspan></text><circle cx="692.0" cy="410.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="414.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Evitar en alérgicos a sulfonamidas</tspan></text><circle cx="692.0" cy="436.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="440.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Valorar el riesgo cardiovascular y renal</tspan></text><rect x="844.6" y="278.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="293.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="585.0" width="920.0" height="93.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="613.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Selectivo de COX-2 = celecoxib</tspan></text><text x="500.0" y="634.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Eficacia equivalente a los AINE tradicionales.</tspan><tspan x="500.0" dy="17">Piroxicam, indometacina, sulindac y nabumetona no son selectivos.</tspan></text><text x="40.0" y="718.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="728.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="750.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="750.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Piroxicam</tspan></text><text x="435.0" y="750.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Nabumetona</tspan></text><text x="585.0" y="750.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Sulindac</tspan></text><text x="735.0" y="750.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Indometacina</tspan></text><rect x="813.0" y="731.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="750.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Celecoxib</tspan></text><rect x="40.0" y="765.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="765.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="794.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Selectivo de COX-2?</tspan></text><text x="285.0" y="794.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no es selectivo</tspan></text><text x="435.0" y="786.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: selectividad solo</tspan><tspan x="435.0" dy="16">parcial</tspan></text><text x="585.0" y="786.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: profármaco no</tspan><tspan x="585.0" dy="16">selectivo</tspan></text><text x="735.0" y="786.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no es selectivo,</tspan><tspan x="735.0" dy="16">más tóxico</tspan></text><text x="885.0" y="786.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: único inhibidor</tspan><tspan x="885.0" dy="16">selectivo de la lista</tspan></text><rect x="40.0" y="728.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="839.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="867.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="889.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• ASAS-EULAR 2022: AINE a dosis plena por 2 a 4 semanas, con ejercicio; si falla tras dos AINE, inhibidor de TNF o IL-17.</tspan><tspan x="58.0" dy="18">• Los selectivos son tan eficaces como los tradicionales y dan menos efectos digestivos. Piroxicam e indometacina no son selectivos; sulindac es</tspan><tspan x="58.0" dy="18">   profármaco no selectivo; nabumetona solo parcialmente.</tspan><tspan x="58.0" dy="18">• Celecoxib: evitar en alérgicos a sulfonamidas; valorar el riesgo cardiovascular y renal a los 55 años.</tspan><tspan x="58.0" dy="18">• Alerta: con los AINE no selectivos se asocia un inhibidor de la bomba de protones.</tspan></text><text x="58.0" y="983.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Ramiro S y cols., ASAS-EULAR 2022 update (Ann Rheum Dis 2023); Ward MM y cols., ACR/SAA/SPARTAN 2019 (Arthritis Rheumatol 2019); Harrison, 21.ª ed. (2022).</tspan></text></svg>