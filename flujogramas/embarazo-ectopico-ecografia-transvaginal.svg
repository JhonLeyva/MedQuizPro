<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Embarazo ectópico: diagnóstico precoz"><title>Embarazo ectópico: diagnóstico precoz</title><rect x="0.75" y="0.75" width="998.5" height="578.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16" y="16" width="968" height="68" rx="10" fill="#0f766e"/><text x="36" y="57.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170" y1="40.0" x2="170" y2="60.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="46.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">GINECOLOGÍA Y OBSTETRICIA ENAM: EMBARAZO ECTÓPICO:</tspan><tspan x="184.0" dy="16">DIAGNÓSTICO PRECOZ</tspan></text><rect x="745.5" y="38.0" width="218.5" height="24" rx="12" fill="#134e4a"/><text x="854.8" y="54.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="202"><tspan x="854.8" dy="0">GINECOLOGÍA Y OBSTETRICIA</tspan></text><rect x="190.0" y="102.0" width="620" height="67.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="500.0" y="130.5" font-size="14.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Mujer con ectópico previo, atraso de 2 días y β-hCG positiva</tspan></text><text x="500.0" y="153.0" font-size="12" font-weight="400" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Alto riesgo de recurrencia</tspan></text><line x1="500.0" y1="169.0" x2="500.0" y2="188.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,187.0 505.0,187.0 500.0,195.0" fill="#0f766e"/><polygon points="180.0,230.0 220.0,195.0 780.0,195.0 820.0,230.0 780.0,265.0 220.0,265.0" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><circle cx="242.0" cy="230.0" r="13" fill="#f59e0b"/><text x="242.0" y="235.5" font-size="16" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="242.0" dy="0">?</tspan></text><text x="514.0" y="226.0" font-size="13.5" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="470"><tspan x="514.0" dy="0">Ecografía transvaginal: ¿saco gestacional</tspan><tspan x="514.0" dy="18">intrauterino visible?</tspan></text><line x1="500.0" y1="265.0" x2="500.0" y2="287.0" stroke="#0f766e" stroke-width="2"/><line x1="270.0" y1="287.0" x2="730.0" y2="287.0" stroke="#0f766e" stroke-width="2"/><line x1="270.0" y1="287.0" x2="270.0" y2="320.0" stroke="#0f766e" stroke-width="2"/><polygon points="265.0,319.0 275.0,319.0 270.0,327.0" fill="#0f766e"/><rect x="254.0" y="295.0" width="32.0" height="20" rx="10" fill="#059669"/><text x="270.0" y="309.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="270.0" dy="0">SÍ</tspan></text><line x1="730.0" y1="287.0" x2="730.0" y2="320.0" stroke="#0f766e" stroke-width="2"/><polygon points="725.0,319.0 735.0,319.0 730.0,327.0" fill="#0f766e"/><rect x="714.0" y="295.0" width="32.0" height="20" rx="10" fill="#e11d48"/><text x="730.0" y="309.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="730.0" dy="0">NO</tspan></text><rect x="70.0" y="327.0" width="400" height="100.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="270.0" y="354.5" font-size="13.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="372"><tspan x="270.0" dy="0">GESTACIÓN INTRAUTERINA</tspan></text><text x="270.0" y="377.0" font-size="12" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="372"><tspan x="270.0" dy="0">Controlar viabilidad</tspan><tspan x="270.0" dy="17">y latido embrionario</tspan></text><rect x="530.0" y="327.0" width="400" height="100.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="730.0" y="354.5" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="372"><tspan x="730.0" dy="0">Β-HCG SOBRE LA ZONA DISCRIMINATORIA</tspan></text><text x="730.0" y="377.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="372"><tspan x="730.0" dy="0">(≈ 1 500–3 500 mUI/mL)</tspan><tspan x="730.0" dy="17">→ sospechar ectópico</tspan><tspan x="730.0" dy="17">Si está por debajo: β-hCG a las 48 h</tspan></text><rect x="837.8" y="317.0" width="84.2" height="20" rx="10" fill="#f59e0b"/><text x="879.9" y="331.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="879.9" dy="0">✓ RESPUESTA</tspan></text><rect x="40" y="453.0" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="481.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="503.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La ecografía transvaginal es el primer estudio para localizar la gestación.</tspan><tspan x="58.0" dy="18">• Tras un ectópico, toda gestación nueva requiere ecografía temprana.</tspan></text><text x="58.0" y="543.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG Practice Bulletin 193 · Williams Obstetricia 26.ª ed.</tspan></text></svg>
