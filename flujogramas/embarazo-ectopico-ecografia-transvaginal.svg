<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1052" viewBox="0 0 820 1052" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Embarazo ectópico: ecografía transvaginal"><title>Embarazo ectópico: ecografía transvaginal</title><rect width="820" height="1052" fill="#ffffff"/><rect x="0" y="0" width="820" height="112" fill="#0f766e"/><text x="40" y="34" font-size="13" font-weight="600" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="740"><tspan x="40" dy="0">MedQuizPlus · Flujograma</tspan></text><text x="40" y="70" font-size="24" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="740"><tspan x="40" dy="0">Embarazo ectópico: ecografía transvaginal</tspan></text><text x="40" y="96" font-size="13" font-weight="400" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="740"><tspan x="40" dy="0">ENAM 2020 · GIN-009 · Ginecología y Obstetricia</tspan></text><rect x="90" y="144" width="640" height="76" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="108" y="172" font-size="11" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="604"><tspan x="108" dy="0">INICIO</tspan></text><text x="108" y="196" font-size="16" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Atraso menstrual con β-hCG positiva</tspan></text><line x1="410.0" y1="222" x2="410.0" y2="242" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,240 417.0,240 410.0,250" fill="#94a3b8"/><rect x="90" y="252" width="640" height="98" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><circle cx="120" cy="301.0" r="12" fill="#d97706"/><text x="120" y="306.0" font-size="15" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="120" dy="0">?</tspan></text><text x="142" y="280" font-size="11" font-weight="700" font-style="normal" fill="#b45309" text-anchor="start" data-max="570"><tspan x="142" dy="0">DECISIÓN</tspan></text><text x="142" y="304" font-size="16" font-weight="600" font-style="normal" fill="#78350f" text-anchor="start" data-max="570"><tspan x="142" dy="0">¿Antecedente de embarazo ectópico u otros factores de</tspan><tspan x="142" dy="22">riesgo?</tspan></text><line x1="410.0" y1="352" x2="410.0" y2="372" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,370 417.0,370 410.0,380" fill="#94a3b8"/><rect x="90" y="382" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="410" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="434" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Ecografía transvaginal precoz para localizar el saco</tspan><tspan x="108" dy="22">gestacional</tspan></text><line x1="410.0" y1="482" x2="410.0" y2="502" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,500 417.0,500 410.0,510" fill="#94a3b8"/><rect x="90" y="512" width="640" height="124" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><circle cx="120" cy="574.0" r="12" fill="#d97706"/><text x="120" y="579.0" font-size="15" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="120" dy="0">?</tspan></text><text x="142" y="540" font-size="11" font-weight="700" font-style="normal" fill="#b45309" text-anchor="start" data-max="570"><tspan x="142" dy="0">DECISIÓN</tspan></text><text x="142" y="564" font-size="16" font-weight="600" font-style="normal" fill="#78350f" text-anchor="start" data-max="570"><tspan x="142" dy="0">¿Saco gestacional intrauterino visible?</tspan></text><text x="142" y="592" font-size="14" font-weight="500" font-style="italic" fill="#92400e" text-anchor="start" data-max="570"><tspan x="142" dy="0">↳ No, con β-hCG sobre la zona discriminatoria → sospechar</tspan><tspan x="142" dy="20">ectópico</tspan></text><line x1="410.0" y1="638" x2="410.0" y2="658" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,656 417.0,656 410.0,666" fill="#94a3b8"/><rect x="90" y="668" width="640" height="76" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="696" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="720" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Sí: gestación intrauterina; controlar su viabilidad</tspan></text><line x1="410.0" y1="746" x2="410.0" y2="766" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,764 417.0,764 410.0,774" fill="#94a3b8"/><rect x="90" y="776" width="640" height="98" rx="12" fill="#134e4a" stroke="#134e4a" stroke-width="2"/><text x="108" y="804" font-size="11" font-weight="700" font-style="normal" fill="#5eead4" text-anchor="start" data-max="604"><tspan x="108" dy="0">CONDUCTA FINAL</tspan></text><text x="108" y="828" font-size="16" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Hallazgos dudosos: β-hCG seriada cada 48 horas y nueva</tspan><tspan x="108" dy="22">ecografía</tspan></text><rect x="40" y="904" width="740" height="98" rx="10" fill="#f0fdfa" stroke="#99f6e4"/><rect x="40" y="904" width="6" height="98" rx="3" fill="#14b8a6"/><text x="62" y="930" font-size="14" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="704"><tspan x="62" dy="0">Perla clínica</tspan></text><text x="62" y="954" font-size="15" font-weight="400" font-style="normal" fill="#134e4a" text-anchor="start" data-max="704"><tspan x="62" dy="0">Tras un ectópico el riesgo de recurrencia aumenta: toda gestación nueva</tspan><tspan x="62" dy="21">requiere ecografía transvaginal temprana.</tspan></text><text x="410.0" y="1030" font-size="11" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="740"><tspan x="410.0" dy="0">MedQuizPlus · Material de estudio: contrasta siempre con las guías clínicas vigentes.</tspan></text></svg>
