.0" r="13" fill="#f59e0b"/><text x="242.0" y="233.5" font-size="16" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="242.0" dy="0">?</tspan></text><text x="514.0" y="233.0" font-size="13.5" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="470"><tspan x="514.0" dy="0">¿Paciente hemodinámicamente inestable?</tspan></text><line x1="500.0" y1="254.0" x2="500.0" y2="276.0" stroke="#0f766e" stroke-width="2"/><line x1="270.0" y1="276.0" x2="730.0" y2="276.0" stroke="#0f766e" stroke-width="2"/><line x1="270.0" y1="276.0" x2="270.0" y2="309.0" stroke="#0f766e" stroke-width="2"/><polygon points="265.0,308.0 275.0,308.0 270.0,316.0" fill="#0f766e"/><rect x="254.0" y="284.0" width="32.0" height="20" rx="10" fill="#059669"/><text x="270.0" y="298.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="270.0" dy="0">SÍ</tspan></text><line x1="730.0" y1="276.0" x2="730.0" y2="309.0" stroke="#0f766e" stroke-width="2"/><polygon points="725.0,308.0 735.0,308.0 730.0,316.0" fill="#0f766e"/><rect x="714.0" y="284.0" width="32.0" height="20" rx="10" fill="#e11d48"/><text x="730.0" y="298.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="730.0" dy="0">NO</tspan></text><rect x="70.0" y="316.0" width="400" height="100.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="270.0" y="343.5" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="372"><tspan x="270.0" dy="0">FAST POSITIVO → LAPAROTOMÍA</tspan></text><text x="270.0" y="366.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="372"><tspan x="270.0" dy="0">Reanimación con control de daños</tspan><tspan x="270.0" dy="17">Transfusión precoz</tspan><tspan x="270.0" dy="17">Cirugía urgente</tspan></text><rect x="377.8" y="306.0" width="84.2" height="20" rx="10" fill="#f59e0b"/><text x="419.9" y="320.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="419.9" dy="0">✓ RESPUESTA</tspan></text><rect x="530.0" y="316.0" width="400" height="100.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="730.0" y="343.5" font-size="13.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="372"><tspan x="730.0" dy="0">ESTABLE: TAC con contraste</tspan></text><text x="730.0" y="366.0" font-size="12" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="372"><tspan x="730.0" dy="0">Define lesión de víscera sólida</tspan><tspan x="730.0" dy="17">o hueca</tspan><tspan x="730.0" dy="17">Manejo no operatorio si es posible</tspan></text><rect x="40" y="442.0" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="470.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="492.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Distensión + dolor + íleo tras trauma cerrado = lesión intraperitoneal hasta demostrar lo contrario.</tspan><tspan x="58.0" dy="18">• Bazo e hígado son las vísceras más lesionadas en el trauma cerrado.</tspan></text><text x="58.0" y="532.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ATLS – American College of Surgeons · WSES 2020 Guidelines</tspan></text></svg>
