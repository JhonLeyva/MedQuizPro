<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1124" viewBox="0 0 1000 1124" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El tendón de Aquiles se rompe por una contracción brusca del tríceps: cambios bruscos de dirección, saltos y arranques"><title>El tendón de Aquiles se rompe por una contracción brusca del tríceps: cambios bruscos de dirección, saltos y arranques</title><rect x="0.75" y="0.75" width="998.5" height="1122.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Traumatología · rotura del tendón de Aquiles</tspan></text><rect x="463.4" y="32.0" width="135.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="531.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="119"><tspan x="531.0" dy="0">TRAUMATOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tendón de Aquiles</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El más grueso del cuerpo; une el tríceps sural al calcáneo.</tspan><tspan x="58.0" dy="17">Se rompe 2 a 6 cm sobre su inserción, zona hipovascular.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Ejercicio físico brusco</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón deportista intermitente.</tspan><tspan x="640.0" dy="16">¿Cuál es la causa más probable?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ PRODUCE LA ROTURA DEL TENDÓN DE AQUILES</tspan></text><rect x="40.0" y="269.0" width="920.0" height="129.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="269.0" width="108.0" height="129.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="333.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Mecanismo</tspan><tspan x="94.0" dy="14">típico</tspan></text><rect x="40.0" y="398.0" width="920.0" height="129.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="398.0" width="108.0" height="129.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="462.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Factores que</tspan><tspan x="94.0" dy="14">predisponen</tspan></text><rect x="40.0" y="527.0" width="920.0" height="129.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="527.0" width="108.0" height="129.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="595.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">No es la causa</tspan></text><line x1="307.2" y1="325.0" x2="314.2" y2="325.0" stroke="#0f766e" stroke-width="2.2"/><line x1="314.2" y1="325.0" x2="314.2" y2="325.0" stroke="#0f766e" stroke-width="2.2"/><line x1="314.2" y1="325.0" x2="312.2" y2="325.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="312.2,330.0 312.2,320.0 321.2,325.0" fill="#0f766e"/><line x1="470.4" y1="325.0" x2="477.4" y2="325.0" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="325.0" x2="477.4" y2="462.5" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="462.5" x2="475.4" y2="462.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="475.4,467.5 475.4,457.5 484.4,462.5" fill="#0f766e"/><line x1="633.6" y1="462.5" x2="640.6" y2="462.5" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="462.5" x2="640.6" y2="446.0" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="446.0" x2="638.6" y2="446.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="638.6,451.0 638.6,441.0 647.6,446.0" fill="#0f766e"/><line x1="796.8" y1="446.0" x2="803.8" y2="446.0" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="446.0" x2="803.8" y2="583.0" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="583.0" x2="801.8" y2="583.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="801.8,588.0 801.8,578.0 810.8,583.0" fill="#0f766e"/><rect x="158.0" y="282.0" width="149.2" height="86.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="168.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Cambios bruscos de</tspan><tspan x="168.0" dy="16">dirección</tspan></text><text x="168.0" y="331.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Contracción excéntrica y</tspan><tspan x="168.0" dy="14.5">brusca del tríceps sural</tspan></text><circle cx="158.0" cy="282.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="321.2" y="282.0" width="149.2" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="331.2" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Saltos y arranques</tspan><tspan x="331.2" dy="16">explosivos</tspan></text><text x="331.2" y="331.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Despegue con el pie en</tspan><tspan x="331.2" dy="14.5">dorsiflexión</tspan></text><circle cx="321.2" cy="282.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="321.2" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="321.2" dy="0">2</tspan></text><rect x="484.4" y="411.0" width="149.2" height="103.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="494.4" y="427.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Varón de 30 a 50 años</tspan><tspan x="494.4" dy="16">con deporte</tspan><tspan x="494.4" dy="16">intermitente</tspan></text><text x="494.4" y="476.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Zona hipovascular 2 a 6</tspan><tspan x="494.4" dy="14.5">cm sobre la inserción</tspan></text><circle cx="484.4" cy="411.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="484.4" y="415.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="484.4" dy="0">3</tspan></text><rect x="647.6" y="411.0" width="149.2" height="70.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="657.6" y="427.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Corticoides y</tspan><tspan x="657.6" dy="16">fluoroquinolonas</tspan></text><text x="657.6" y="460.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Debilitan el tendón</tspan></text><circle cx="647.6" cy="411.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="647.6" y="415.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="647.6" dy="0">4</tspan></text><rect x="810.8" y="540.0" width="149.2" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="820.8" y="556.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Contusión directa</tspan><tspan x="820.8" dy="16">sobre el tendón</tspan></text><text x="820.8" y="589.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Causa contusión o</tspan><tspan x="820.8" dy="14.5">hematoma</tspan></text><circle cx="810.8" cy="540.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="810.8" y="544.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="810.8" dy="0">5</tspan></text><rect x="40.0" y="674.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="700.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Rotura de Aquiles = contracción brusca del tríceps</tspan></text><text x="60.0" y="719.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El calentamiento insuficiente y el exceso de ejercicio solo predisponen a la lesión.</tspan></text><text x="40.0" y="786.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="796.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="835.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="835.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Contusión directa</tspan></text><rect x="363.0" y="799.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="827.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Cambios bruscos</tspan><tspan x="435.0" dy="17">de dirección</tspan></text><text x="585.0" y="818.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Excesivos</tspan><tspan x="585.0" dy="17">ejercicios</tspan><tspan x="585.0" dy="17">anteriores</tspan></text><text x="735.0" y="827.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Poco calentamiento</tspan><tspan x="735.0" dy="17">previo</tspan></text><text x="885.0" y="827.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Ejercitar las mismas</tspan><tspan x="885.0" dy="17">rutinas</tspan></text><rect x="40.0" y="867.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="867.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="904.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Causa más probable?</tspan></text><text x="285.0" y="896.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: produce contusión</tspan><tspan x="285.0" dy="16">o hematoma</tspan></text><text x="435.0" y="888.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: sobrecarga</tspan><tspan x="435.0" dy="16">excéntrica brusca del</tspan><tspan x="435.0" dy="16">tríceps sural</tspan></text><text x="585.0" y="888.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es un factor</tspan><tspan x="585.0" dy="16">predisponente, no el</tspan><tspan x="585.0" dy="16">mecanismo</tspan></text><text x="735.0" y="896.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: factor</tspan><tspan x="735.0" dy="16">contribuyente menor</tspan></text><text x="885.0" y="888.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: favorece</tspan><tspan x="885.0" dy="16">tendinopatía, no rotura</tspan><tspan x="885.0" dy="16">aguda</tspan></text><rect x="40.0" y="796.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="957.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="985.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1007.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Mecanismo clásico: contracción excéntrica y brusca del tríceps con el pie en dorsiflexión o el despegue explosivo.</tspan><tspan x="58.0" dy="18">• Cuadro: chasquido como una patada en la pierna, dolor súbito e incapacidad para ponerse de puntillas.</tspan><tspan x="58.0" dy="18">• Examen: defecto palpable, prueba de Thompson positiva (la compresión de la pantorrilla no flexiona el pie) y dorsiflexión pasiva aumentada.</tspan><tspan x="58.0" dy="18">• Más frecuente en varones de 30 a 50 años; el uso de fluoroquinolonas y de corticoides es factor de riesgo.</tspan></text><text x="58.0" y="1083.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAOS, guía de rotura aguda del tendón de Aquiles (2010; PMID 20675644); Campbell's Operative Orthopaedics, 14.ª ed. (2021).</tspan></text></svg>