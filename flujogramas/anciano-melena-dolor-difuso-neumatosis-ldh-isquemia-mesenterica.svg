<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1105" viewBox="0 0 1000 1105" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Anciano hipertenso con dolor abdominal desproporcionado que se generaliza, melena, irritación peritoneal, leucocitosis, LDH alta y neumatosis: isquemia mesentérica aguda"><title>Anciano hipertenso con dolor abdominal desproporcionado que se generaliza, melena, irritación peritoneal, leucocitosis, LDH alta y neumatosis: isquemia mesentérica aguda</title><rect x="0.75" y="0.75" width="998.5" height="1103.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Abdomen agudo vascular</tspan></text><rect x="352.4" y="32.0" width="101.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="403.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="85"><tspan x="403.0" dy="0">CIRUGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Isquemia mesentérica aguda</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Embolia (FA) o trombosis de la arteria mesentérica superior; también no oclusiva o venosa.</tspan><tspan x="58.0" dy="17">Primero dolor desproporcionado al examen; luego, al necrosarse, peritonitis, sangrado,</tspan><tspan x="58.0" dy="17">acidosis láctica, LDH alta y neumatosis.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Hipertenso de 81 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Deposiciones negras y dolor epigástrico que se hace</tspan><tspan x="640.0" dy="16">difuso.</tspan><tspan x="640.0" dy="16">Distensión, irritación peritoneal; neumatosis; leucocitos</tspan><tspan x="640.0" dy="16">17 000, LDH 1082.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL VASO TAPADO AL INTESTINO MUERTO</tspan></text><text x="40.0" y="313.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="430"><tspan x="40.0" dy="0">QUÉ PASA</tspan></text><text x="516.0" y="313.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="444"><tspan x="516.0" dy="0">QUÉ SE VE</tspan></text><rect x="40.0" y="323.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="352.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="357.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><text x="84.0" y="349.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Se tapa la mesentérica superior</tspan></text><text x="84.0" y="366.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Embolia (FA) o trombosis</tspan></text><line x1="476.0" y1="352.5" x2="503.0" y2="352.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,347.5 502.0,357.5 510.0,352.5" fill="#ea580c"/><rect x="516.0" y="325.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="349.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Dolor desproporcionado</tspan></text><text x="530.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Abdomen blando al inicio</tspan></text><line x1="255.0" y1="384.0" x2="255.0" y2="397.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,396.0 260.0,396.0 255.0,404.0" fill="#0f766e"/><rect x="40.0" y="406.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="435.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="440.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">2</tspan></text><text x="84.0" y="432.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">La mucosa sufre primero</tspan></text><text x="84.0" y="449.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Se desprende y sangra</tspan></text><line x1="476.0" y1="435.5" x2="503.0" y2="435.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,430.5 502.0,440.5 510.0,435.5" fill="#ea580c"/><rect x="516.0" y="408.0" width="444.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="530.0" y="432.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Melena</tspan></text><text x="530.0" y="449.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Sangre en las heces</tspan></text><line x1="255.0" y1="467.0" x2="255.0" y2="480.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,479.0 260.0,479.0 255.0,487.0" fill="#0f766e"/><rect x="40.0" y="489.0" width="430.0" height="116.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="547.0" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="551.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">3</tspan></text><text x="84.0" y="543.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Necrosis de toda la pared</tspan></text><text x="84.0" y="560.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Gas que entra en la pared</tspan></text><line x1="476.0" y1="547.0" x2="503.0" y2="547.0" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,542.0 502.0,552.0 510.0,547.0" fill="#ea580c"/><rect x="516.0" y="489.0" width="444.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="530.0" y="513.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Neumatosis</tspan></text><text x="530.0" y="530.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">En la Rx</tspan></text><rect x="516.0" y="550.0" width="444.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="530.0" y="574.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">LDH y lactato altos</tspan></text><text x="530.0" y="591.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">LDH 1082</tspan></text><line x1="255.0" y1="607.0" x2="255.0" y2="620.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,619.0 260.0,619.0 255.0,627.0" fill="#0f766e"/><rect x="40.0" y="629.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="658.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="663.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">4</tspan></text><text x="84.0" y="655.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Peritonitis</tspan></text><text x="84.0" y="672.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Bacterias atraviesan la pared necrosada</tspan></text><line x1="476.0" y1="658.5" x2="503.0" y2="658.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,653.5 502.0,663.5 510.0,658.5" fill="#ea580c"/><rect x="516.0" y="631.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="655.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Irritación peritoneal, leucocitosis</tspan></text><text x="530.0" y="672.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">17 000</tspan></text><rect x="40.0" y="706.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="732.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Isquemia mesentérica aguda con necrosis</tspan></text><text x="60.0" y="751.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Laparotomía urgente.</tspan></text><text x="40.0" y="818.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="828.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="859.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="859.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Diverticulitis aguda</tspan></text><rect x="363.0" y="831.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="850.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Isquemia</tspan><tspan x="435.0" dy="17">mesentérica aguda</tspan></text><text x="585.0" y="859.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Pancreatitis aguda</tspan></text><text x="735.0" y="850.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Obstrucción</tspan><tspan x="735.0" dy="17">intestinal</tspan></text><text x="885.0" y="850.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Úlcera péptica</tspan><tspan x="885.0" dy="17">perforada</tspan></text><rect x="40.0" y="882.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="882.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="911.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="903.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: dolor en FII, sin</tspan><tspan x="285.0" dy="16">neumatosis</tspan></text><text x="435.0" y="903.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: neumatosis + LDH</tspan><tspan x="435.0" dy="16">alta + peritonitis</tspan></text><text x="585.0" y="903.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no da neumatosis</tspan><tspan x="585.0" dy="16">ni melena</tspan></text><text x="735.0" y="903.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No explica la</tspan><tspan x="735.0" dy="16">neumatosis</tspan></text><text x="885.0" y="903.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: neumoperitoneo,</tspan><tspan x="885.0" dy="16">no neumatosis</tspan></text><rect x="40.0" y="828.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="956.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="984.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1006.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Angio-TC es el estudio de elección (no esperar si hay peritonitis).</tspan><tspan x="58.0" dy="18">• Heparina, líquidos, antibiótico; con peritonitis: laparotomía (resección del intestino necrótico) ± revascularización.</tspan><tspan x="58.0" dy="18">• Mortalidad 50-70 %: el tiempo es intestino.</tspan></text><text x="58.0" y="1064.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ESVS, enfermedades de las arterias mesentéricas (2025); WSES, isquemia mesentérica aguda (2022).</tspan></text></svg>