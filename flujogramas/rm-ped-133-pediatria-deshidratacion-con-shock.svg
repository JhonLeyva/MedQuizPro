0" dy="0">Pérdida de más del 10 % del peso con letargia, ojos hundidos, pliegue lento y pulsos</tspan><tspan x="58.0" dy="17">débiles.</tspan><tspan x="58.0" dy="17">Con shock hay hipotensión y llenado capilar mayor de 3 s.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="131.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="129.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño con diarrea y shock</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es la medida inicial?</tspan></text><rect x="640.0" y="192.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="205.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="205.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="253.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">REPOSICIÓN DEL NIÑO CON SHOCK POR DESHIDRATACIÓN</tspan></text><rect x="40.0" y="265.0" width="170.0" height="93.0" rx="16" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="125.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="150"><tspan x="125.0" dy="0">PESO DEL CASO</tspan></text><text x="125.0" y="327.0" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">20 mL/kg</tspan></text><text x="125.0" y="349.0" font-size="11" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="146"><tspan x="125.0" dy="0">Isotónico en bolo</tspan></text><line x1="214.0" y1="311.5" x2="229.0" y2="311.5" stroke="#0f766e" stroke-width="2"/><polygon points="228.0,306.5 228.0,316.5 236.0,311.5" fill="#0f766e"/><rect x="240.0" y="265.0" width="213.3" height="93.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="346.7" y="287.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="197"><tspan x="346.7" dy="0">RECONOCER EL SHOCK</tspan></text><text x="346.7" y="321.0" font-size="22" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="197"><tspan x="346.7" dy="0">Pulsos débiles</tspan></text><text x="346.7" y="343.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="193"><tspan x="346.7" dy="0">Llenado mayor de 3 s</tspan></text><text x="473.3" y="322.5" font-size="30" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="40"><tspan x="473.3" dy="0">×</tspan></text><rect x="493.3" y="265.0" width="213.3" height="93.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="600.0" y="287.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="197"><tspan x="600.0" dy="0">BOLO INICIAL</tspan></text><text x="600.0" y="321.0" font-size="22" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="197"><tspan x="600.0" dy="0">20 mL/kg</tspan></text><text x="600.0" y="343.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="193"><tspan x="600.0" dy="0">Suero fisiológico</tspan></text><text x="726.7" y="322.5" font-size="30" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="40"><tspan x="726.7" dy="0">=</tspan></text><rect x="746.7" y="265.0" width="213.3" height="93.0" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="853.3" y="287.0" font-size="10.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="197"><tspan x="853.3" dy="0">REEVALUAR</tspan></text><text x="853.3" y="321.0" font-size="22" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="197"><tspan x="853.3" dy="0">Hasta 3 bolos</tspan></text><text x="853.3" y="343.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="193"><tspan x="853.3" dy="0">Buscar crepitantes</tspan></text><rect x="793.2" y="347.0" width="120.4" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="853.3" y="362.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="853.3" dy="0">◆ DOSIS DEL CASO</tspan></text><text x="44.0" y="394.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="44.0" dy="0">CADA ALTERNATIVA CONTRA EL CÁLCULO</tspan></text><rect x="40.0" y="404.0" width="176.0" height="106.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="128.0" y="422.0" font-size="9.5" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="160"><tspan x="128.0" dy="0">✓ COINCIDE</tspan></text><text x="128.0" y="440.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="128.0" dy="0">Suero fisiológico 20</tspan><tspan x="128.0" dy="17">mL/kg en bolo</tspan></text><text x="128.0" y="474.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="128.0" dy="0">Expande el volumen;</tspan><tspan x="128.0" dy="16">elección</tspan></text><rect x="226.0" y="404.0" width="176.0" height="106.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="314.0" y="422.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="160"><tspan x="314.0" dy="0">✗ NO</tspan></text><text x="314.0" y="440.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="314.0" dy="0">Lactato Ringer 200</tspan><tspan x="314.0" dy="17">mL/kg</tspan></text><text x="314.0" y="474.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="314.0" dy="0">Dosis letal por sobrecarga</tspan></text><rect x="412.0" y="404.0" width="176.0" height="106.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="422.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="160"><tspan x="500.0" dy="0">✗ NO</tspan></text><text x="500.0" y="440.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="500.0" dy="0">Polielectrolítica 10 mL/kg</tspan></text><text x="500.0" y="457.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="500.0" dy="0">Es de mantenimiento; dosis</tspan><tspan x="500.0" dy="16">corta</tspan></text><rect x="598.0" y="404.0" width="176.0" height="106.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="686.0" y="422.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="160"><tspan x="686.0" dy="0">✗ NO</tspan></text><text x="686.0" y="440.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="686.0" dy="0">Plasma fresco 20 mL/kg</tspan></text><text x="686.0" y="457.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="686.0" dy="0">No es expansor de primera</tspan><tspan x="686.0" dy="16">línea</tspan></text><rect x="784.0" y="404.0" width="176.0" height="106.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="872.0" y="422.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="160"><tspan x="872.0" dy="0">✗ NO</tspan></text><text x="872.0" y="440.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="872.0" dy="0">Hipersodio 10 mL/kg a</tspan><tspan x="872.0" dy="17">chorro</tspan></text><text x="872.0" y="474.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="872.0" dy="0">Contraindicado en este</tspan><tspan x="872.0" dy="16">contexto</tspan></text><rect x="40.0" y="528.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="554.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Shock por diarrea = cristaloide isotónico 20 mL/kg</tspan></text><text x="60.0" y="573.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Cada bolo se reevalúa antes de repetirlo.</tspan></text><text x="40.0" y="634.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DESHIDRATACIÓN EN EL NIÑO: GRAVEDAD Y CONDUCTA</tspan></text><rect x="40.0" y="646.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="665.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Grado</tspan></text><text x="280.0" y="665.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Pérdida de peso</tspan></text><text x="625.0" y="665.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Conducta (OMS)</tspan></text><rect x="40.0" y="675.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="694.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Leve</tspan></text><text x="280.0" y="694.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">3 a 5 %</tspan></text><text x="625.0" y="694.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Plan A: líquidos y sales en casa</tspan></text><rect x="40.0" y="704.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="723.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Moderada</tspan></text><text x="280.0" y="723.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">6 a 9 %</tspan></text><text x="625.0" y="723.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Plan B: sales de rehidratación oral, 75 mL/kg en 4 horas</tspan></text><rect x="40.0" y="733.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="752.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Severa, con shock</tspan></text><text x="280.0" y="752.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">10 % o más</tspan></text><text x="625.0" y="752.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Plan C: bolo intravenoso de cristaloide, 20 mL/kg</tspan></text><rect x="170.6" y="736.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="216.0" y="751.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="216.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="802.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="812.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="843.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="815.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="834.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Suero fisiológico 20</tspan><tspan x="285.0" dy="17">mL/kg en bolo</tspan></text><text x="435.0" y="834.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Lactato Ringer 200</tspan><tspan x="435.0" dy="17">mL/kg</tspan></text><text x="585.0" y="834.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Polielectrolítica 10</tspan><tspan x="585.0" dy="17">mL/kg en bolo</tspan></text><text x="735.0" y="834.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Plasma fresco</tspan><tspan x="735.0" dy="17">congelado 20 mL/kg</tspan></text><text x="885.0" y="834.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hipersodio 10</tspan><tspan x="885.0" dy="17">mL/kg a chorro</tspan></text><rect x="40.0" y="866.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="866.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="903.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Medida inicial?</tspan></text><text x="285.0" y="887.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: expande el</tspan><tspan x="285.0" dy="16">volumen de forma</tspan><tspan x="285.0" dy="16">rápida y segura</tspan></text><text x="435.0" y="887.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: 200 mL/kg es una</tspan><tspan x="435.0" dy="16">dosis letal por</tspan><tspan x="435.0" dy="16">sobrecarga</tspan></text><text x="585.0" y="887.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es de</tspan><tspan x="585.0" dy="16">mantenimiento y 10</tspan><tspan x="585.0" dy="16">mL/kg no alcanza</tspan></text><text x="735.0" y="887.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: el plasma no es</tspan><tspan x="735.0" dy="16">expansor de primera</tspan><tspan x="735.0" dy="16">línea</tspan></text><text x="885.0" y="895.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: el hipersodio está</tspan><tspan x="885.0" dy="16">contraindicado aquí</tspan></text><rect x="40.0" y="812.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="956.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="984.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1006.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Restaurar volumen con rapidez: cristaloide isotónico 20 mL/kg (suero fisiológico 0,9 % o lactato Ringer), repetible hasta tres veces con reevaluación.</tspan><tspan x="58.0" dy="18">• La OMS pide lactato Ringer o suero fisiológico, 20 mL/kg, lo más rápido posible; después se pasa a rehidratación según la tolerancia.</tspan><tspan x="58.0" dy="18">• Errores: 200 mL/kg es una dosis letal; el plasma no es expansor de primera línea; la polielectrolítica es de mantenimiento y 10 mL/kg no alcanza; el</tspan><tspan x="58.0" dy="18">   hipersodio está contraindicado.</tspan><tspan x="58.0" dy="18">• Alerta: tras cada bolo buscar sobrecarga (hepatomegalia, crepitantes).</tspan></text><text x="58.0" y="1100.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, Libro de bolsillo de atención hospitalaria del niño, 2.ª ed. (2013); Weiss y cols., Surviving Sepsis Campaign pediátrica (2020); Nelson Tratado de Pediatría 22.ª ed.</tspan><tspan x="58.0" dy="15">(2024).</tspan></text></svg>