<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1149" viewBox="0 0 1000 1149" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En el síndrome de realimentación el sello es la hipofosfatemia, que aparece al reiniciar el aporte energético"><title>En el síndrome de realimentación el sello es la hipofosfatemia, que aparece al reiniciar el aporte energético</title><rect x="0.75" y="0.75" width="998.5" height="1147.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Nutrición pediátrica · síndrome de realimentación</tspan></text><rect x="491.9" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="540.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="540.9" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Síndrome de realimentación</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tras un ayuno o desnutrición, los carbohidratos elevan la insulina.</tspan><tspan x="58.0" dy="17">Fósforo, potasio y magnesio pasan a la célula; el sodio y el agua se retienen.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 2 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Desnutrido severo.</tspan><tspan x="640.0" dy="16">Recibe alimentación rápida.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ CAMBIA EN LOS ELECTROLITOS AL REALIMENTAR</tspan></text><rect x="40.0" y="269.0" width="920.0" height="32.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="290.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="180"><tspan x="54.0" dy="0">EXAMEN</tspan></text><text x="250.0" y="290.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="130"><tspan x="250.0" dy="0">VALOR DEL CASO</tspan></text><text x="400.0" y="290.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="130"><tspan x="400.0" dy="0">NORMAL</tspan></text><text x="550.0" y="290.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="400"><tspan x="550.0" dy="0">QUÉ SIGNIFICA</tspan></text><rect x="40.0" y="307.0" width="920.0" height="40.0" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="331.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Fósforo</tspan></text><text x="250.0" y="332.0" font-size="13" font-weight="800" font-style="normal" fill="#2563eb" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Disminuido  ↓</tspan></text><text x="400.0" y="331.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Sello del cuadro</tspan></text><text x="550.0" y="331.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Entra a la célula con la insulina: falta ATP y 2,3-DPG.</tspan></text><rect x="40.0" y="351.0" width="920.0" height="40.0" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="375.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Potasio</tspan></text><text x="250.0" y="376.0" font-size="13" font-weight="800" font-style="normal" fill="#2563eb" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Disminuido  ↓</tspan></text><text x="400.0" y="375.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">También ocurre</tspan></text><text x="550.0" y="375.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Arritmias y debilidad muscular.</tspan></text><rect x="40.0" y="395.0" width="920.0" height="40.0" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Magnesio</tspan></text><text x="250.0" y="420.0" font-size="13" font-weight="800" font-style="normal" fill="#2563eb" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Disminuido  ↓</tspan></text><text x="400.0" y="419.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Acompaña</tspan></text><text x="550.0" y="419.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Arritmias y convulsiones.</tspan></text><rect x="40.0" y="439.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="463.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Sodio y agua</tspan></text><text x="250.0" y="464.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Retenidos  ↑</tspan></text><text x="400.0" y="463.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Sobrecarga de líquido</tspan></text><text x="550.0" y="463.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Edema e insuficiencia cardiaca.</tspan></text><rect x="40.0" y="497.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="523.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Realimentación = hipofosfatemia</tspan></text><text x="60.0" y="542.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Medir el fósforo antes de alimentar al niño desnutrido.</tspan></text><text x="40.0" y="603.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">GRAVEDAD DEL SÍNDROME DE REALIMENTACIÓN (ASPEN 2020)</tspan></text><rect x="40.0" y="615.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="634.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="104"><tspan x="50.0" dy="0">Gravedad</tspan></text><text x="170.0" y="634.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="384"><tspan x="170.0" dy="0">Caída de fósforo, potasio o magnesio</tspan></text><text x="570.0" y="634.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="384"><tspan x="570.0" dy="0">Plazo</tspan></text><rect x="40.0" y="644.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="663.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="104"><tspan x="50.0" dy="0">Leve</tspan></text><text x="170.0" y="663.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="384"><tspan x="170.0" dy="0">10 a 20 %</tspan></text><text x="570.0" y="663.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="384"><tspan x="570.0" dy="0">Dentro de los 5 días de iniciar el aporte energético</tspan></text><rect x="40.0" y="673.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="692.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="104"><tspan x="50.0" dy="0">Moderada</tspan></text><text x="170.0" y="692.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="384"><tspan x="170.0" dy="0">20 a 30 %</tspan></text><text x="570.0" y="692.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="384"><tspan x="570.0" dy="0">Dentro de los 5 días de iniciar el aporte energético</tspan></text><rect x="40.0" y="702.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="721.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="104"><tspan x="50.0" dy="0">Grave</tspan></text><text x="170.0" y="721.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="384"><tspan x="170.0" dy="0">Más de 30 % o disfunción orgánica</tspan></text><text x="570.0" y="721.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="384"><tspan x="570.0" dy="0">Dentro de los 5 días de iniciar el aporte energético</tspan></text><text x="40.0" y="747.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Se acompaña de edema por retención de sodio y agua y de riesgo de encefalopatía de Wernicke.</tspan></text><text x="40.0" y="794.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="804.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="826.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="807.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="826.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hipofosfatemia</tspan></text><text x="435.0" y="826.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hiponatremia</tspan></text><text x="585.0" y="826.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Hipercalcemia</tspan></text><text x="735.0" y="826.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hipernatremia</tspan></text><text x="885.0" y="826.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hipokalemia</tspan></text><rect x="40.0" y="841.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="841.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="878.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué trastorno?</tspan></text><text x="285.0" y="878.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: sello del síndrome</tspan></text><text x="435.0" y="862.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no define el</tspan><tspan x="435.0" dy="16">cuadro; se espera</tspan><tspan x="435.0" dy="16">sobrecarga de líquido</tspan></text><text x="585.0" y="878.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no se produce</tspan></text><text x="735.0" y="878.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no define el cuadro</tspan></text><text x="885.0" y="870.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: ocurre, pero no es</tspan><tspan x="885.0" dy="16">el más característico</tspan></text><rect x="40.0" y="804.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="931.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="959.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="981.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Consenso ASPEN 2020: caída de fósforo, potasio o magnesio dentro de 5 días de iniciar el aporte energético (10-20 % leve, 20-30 % moderado, más de</tspan><tspan x="58.0" dy="18">   30 % o disfunción orgánica grave).</tspan><tspan x="58.0" dy="18">• El fósforo es necesario para el ATP y el 2,3-DPG: su falta causa debilidad, insuficiencia respiratoria, rabdomiólisis, arritmias, hemólisis y convulsiones.</tspan><tspan x="58.0" dy="18">• La tiamina se consume como cofactor: puede precipitar encefalopatía de Wernicke y acidosis láctica. Se espera sobrecarga de líquidos con edema.</tspan><tspan x="58.0" dy="18">• Prevención: identificar al paciente de riesgo, dar tiamina antes de alimentar, empezar con pocas calorías y monitorizar fósforo, potasio y magnesio a</tspan><tspan x="58.0" dy="18">   diario por 3 días.</tspan></text><text x="58.0" y="1093.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ASPEN, consenso sobre síndrome de realimentación (Nutr Clin Pract 2020;35:178-195); Nelson Tratado de Pediatría, 22.ª ed. (2024); OMS, Manejo de la desnutrición</tspan><tspan x="58.0" dy="15">aguda grave</tspan></text></svg>