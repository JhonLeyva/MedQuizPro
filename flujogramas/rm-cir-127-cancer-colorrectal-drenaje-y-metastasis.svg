<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="912" viewBox="0 0 1000 912" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Metástasis a hueso, pulmón o cerebro sin hígado: tumor del tercio inferior del recto"><title>Metástasis a hueso, pulmón o cerebro sin hígado: tumor del tercio inferior del recto</title><rect x="0.75" y="0.75" width="998.5" height="910.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Cáncer colorrectal · drenaje y metástasis</tspan></text><rect x="442.0" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="485.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="485.2" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Patrón de metástasis colorrectal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Depende del drenaje venoso del tumor.</tspan><tspan x="58.0" dy="17">Colon y recto superior van al sistema porta; el recto bajo, a la cava.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Cáncer colorrectal con metástasis ósea, pulmonar o</tspan><tspan x="640.0" dy="16">cerebral y sin metástasis hepática: ¿dónde está el</tspan><tspan x="640.0" dy="16">tumor?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">POR DÓNDE DRENA EL TUMOR Y ADÓNDE LLEGAN LAS CÉLULAS</tspan></text><rect x="40.0" y="285.0" width="920.0" height="96.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="285.0" width="108.0" height="96.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="333.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Colon y recto</tspan><tspan x="94.0" dy="14">superior</tspan></text><rect x="40.0" y="381.0" width="920.0" height="96.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="381.0" width="108.0" height="96.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="433.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Recto inferior</tspan></text><line x1="348.0" y1="333.0" x2="355.0" y2="333.0" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="333.0" x2="355.0" y2="324.5" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="324.5" x2="353.0" y2="324.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="353.0,329.5 353.0,319.5 362.0,324.5" fill="#0f766e"/><line x1="552.0" y1="324.5" x2="559.0" y2="324.5" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="324.5" x2="559.0" y2="429.0" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="429.0" x2="557.0" y2="429.0" stroke="#ea580c" stroke-width="2.2"/><polygon points="557.0,434.0 557.0,424.0 566.0,429.0" fill="#ea580c"/><line x1="756.0" y1="429.0" x2="763.0" y2="429.0" stroke="#ea580c" stroke-width="2.2"/><line x1="763.0" y1="429.0" x2="763.0" y2="420.5" stroke="#ea580c" stroke-width="2.2"/><line x1="763.0" y1="420.5" x2="761.0" y2="420.5" stroke="#ea580c" stroke-width="2.2"/><polygon points="761.0,425.5 761.0,415.5 770.0,420.5" fill="#ea580c"/><rect x="158.0" y="298.0" width="190.0" height="70.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="314.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Venas mesentéricas y</tspan><tspan x="168.0" dy="16">hemorroidal superior</tspan></text><text x="168.0" y="347.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Drenan al sistema porta</tspan></text><circle cx="158.0" cy="298.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="302.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="362.0" y="298.0" width="190.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="372.0" y="314.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Primer filtro: hígado</tspan></text><text x="372.0" y="331.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Metástasis hepática</tspan></text><circle cx="362.0" cy="298.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="362.0" y="302.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="362.0" dy="0">2</tspan></text><rect x="566.0" y="394.0" width="190.0" height="70.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="576.0" y="410.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Hemorroidales media e</tspan><tspan x="576.0" dy="16">inferior</tspan></text><text x="576.0" y="443.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Ilíaca interna y cava inferior</tspan></text><circle cx="566.0" cy="394.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="566.0" y="398.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="566.0" dy="0">3</tspan></text><rect x="770.0" y="394.0" width="190.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="780.0" y="410.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Primer filtro: pulmón</tspan></text><text x="780.0" y="427.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Luego hueso y cerebro</tspan></text><circle cx="770.0" cy="394.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="770.0" y="398.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="770.0" dy="0">4</tspan></text><rect x="40.0" y="495.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="521.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Metástasis sin hígado = recto inferior</tspan></text><text x="60.0" y="540.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Drena a la cava: pulmón, hueso y cerebro antes que el hígado.</tspan></text><text x="40.0" y="607.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="617.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="648.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="639.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Mitad proximal del</tspan><tspan x="285.0" dy="17">colon transverso</tspan></text><text x="435.0" y="639.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Tercio superior del</tspan><tspan x="435.0" dy="17">colon ascendente</tspan></text><rect x="513.0" y="620.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="639.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Tercio inferior del</tspan><tspan x="585.0" dy="17">recto</tspan></text><text x="735.0" y="639.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Mitad superior del</tspan><tspan x="735.0" dy="17">recto</tspan></text><text x="885.0" y="648.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Región ileocecal</tspan></text><rect x="40.0" y="671.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="671.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="700.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Localización?</tspan></text><text x="285.0" y="692.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: drena al sistema</tspan><tspan x="285.0" dy="16">porta</tspan></text><text x="435.0" y="692.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: drena al sistema</tspan><tspan x="435.0" dy="16">porta</tspan></text><text x="585.0" y="700.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: drena a la cava</tspan></text><text x="735.0" y="692.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: la hemorroidal</tspan><tspan x="735.0" dy="16">superior va al porta</tspan></text><text x="885.0" y="692.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: drena al sistema</tspan><tspan x="885.0" dy="16">porta</tspan></text><rect x="40.0" y="617.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="745.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="773.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="795.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Colon y recto superior: venas mesentéricas y hemorroidal superior hacia el sistema porta; el primer filtro es el hígado.</tspan><tspan x="58.0" dy="18">• Recto medio e inferior: hemorroidales media e inferior hacia la ilíaca interna y la cava; el primer filtro es el pulmón.</tspan><tspan x="58.0" dy="18">• Del pulmón, las células pasan a hueso y cerebro sin tocar el hígado: metástasis extrahepáticas aisladas.</tspan><tspan x="58.0" dy="18">• En el recto bajo la resección total del mesorrecto y la radioterapia son claves para el control local.</tspan></text><text x="58.0" y="871.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: NCCN, Rectal Cancer (2025); ESMO, Localised rectal cancer (Hofheinz, Ann Oncol 2025); Sabiston Tratado de Cirugía 21.ª ed.</tspan></text></svg>