<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1275" viewBox="0 0 1000 1275" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Gestante a término sin control prenatal con sangrado continuo en un centro I-2: no hacer tacto vaginal y referir a mayor complejidad"><title>Gestante a término sin control prenatal con sangrado continuo en un centro I-2: no hacer tacto vaginal y referir a mayor complejidad</title><rect x="0.75" y="0.75" width="998.5" height="1274.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Hemorragias de la segunda mitad · referencia</tspan></text><rect x="468.7" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="555.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="555.9" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Sangrado del tercer trimestre</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Puede ser placenta previa o desprendimiento: el tacto vaginal puede desencadenar una</tspan><tspan x="58.0" dy="17">hemorragia masiva.</tspan><tspan x="58.0" dy="17">Necesita ecografía, sala de operaciones y banco de sangre.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante a término, sin control prenatal</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Sangrado escaso continuo; establecimiento I-2 de</tspan><tspan x="640.0" dy="16">provincia.</tspan><tspan x="640.0" dy="16">AU 34 cm, LCD, FCF 140; sin dinámica uterina.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="377.0" x2="500.0" y2="407.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="407.0" x2="733.5" y2="407.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="407.0" x2="266.5" y2="436.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,435.0 271.5,435.0 266.5,443.0" fill="#94a3b8"/><line x1="733.5" y1="407.0" x2="733.5" y2="436.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,435.0 738.5,435.0 733.5,443.0" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#0f766e"/><line x1="500.0" y1="377.0" x2="500.0" y2="407.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="407.0" x2="500.0" y2="407.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="407.0" x2="266.5" y2="436.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,435.0 271.5,435.0 266.5,443.0" fill="#0f766e"/><rect x="213.4" y="416.0" width="106.2" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="428.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">No: I-2 (este caso)</tspan></text><rect x="721.4" y="416.0" width="24.1" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="428.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Sí</tspan></text><polygon points="240.0,342.0 266.0,307.0 734.0,307.0 760.0,342.0 734.0,377.0 266.0,377.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="342.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="347.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="338.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Sangrado del 3.er trimestre: ¿el establecimiento tiene eco,</tspan><tspan x="519.0" dy="17">cesárea y sangre?</tspan></text><rect x="40.0" y="443.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="471.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">REFERIR</tspan></text><text x="266.5" y="494.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Vía EV, monitoreo</tspan><tspan x="266.5" dy="17">Sin tacto vaginal</tspan></text><rect x="507.0" y="443.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="479.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Ecografía y manejo</tspan></text><text x="733.5" y="502.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Previa o DPP</tspan></text><text x="40.0" y="573.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="585.5" width="920.0" height="346.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="599.5" width="369.8" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="240.9" y="619.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="240.9" dy="0">CATEGORÍAS DE ESTABLECIMIENTOS DEL MINSA</tspan></text><text x="441.8" y="619.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="441.8" dy="0">Cada nivel resuelve problemas de distinta complejidad.</tspan></text><rect x="56.0" y="659.5" width="213.0" height="121.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="57.2" y="660.7" width="210.6" height="63.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="162.5" y="687.5" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="197"><tspan x="162.5" dy="0">I-1 A I-3</tspan></text><text x="162.5" y="707.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="189"><tspan x="162.5" dy="0">Puestos y centros</tspan></text><circle cx="72.0" cy="732.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="82.0" y="736.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="175"><tspan x="82.0" dy="0">Sin médico o sin internamiento</tspan></text><circle cx="72.0" cy="755.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="82.0" y="759.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="175"><tspan x="82.0" dy="0">Atención básica</tspan></text><rect x="117.1" y="648.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="162.5" y="663.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="162.5" dy="0">◆ ESTE CASO</tspan></text><rect x="281.0" y="659.5" width="213.0" height="121.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="281.6" y="660.1" width="211.8" height="63.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="387.5" y="687.5" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="197"><tspan x="387.5" dy="0">I-4</tspan></text><text x="387.5" y="707.5" font-size="14" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="189"><tspan x="387.5" dy="0">Centro con internamiento</tspan></text><circle cx="297.0" cy="732.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="307.0" y="736.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="307.0" dy="0">Parto normal</tspan></text><circle cx="297.0" cy="755.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="307.0" y="759.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="307.0" dy="0">Sin cesárea en muchos</tspan></text><rect x="506.0" y="659.5" width="213.0" height="121.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="506.6" y="660.1" width="211.8" height="63.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="612.5" y="687.5" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="197"><tspan x="612.5" dy="0">II-1 / II-2</tspan></text><text x="612.5" y="707.5" font-size="14" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="189"><tspan x="612.5" dy="0">Hospitales</tspan></text><circle cx="522.0" cy="732.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="532.0" y="736.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="532.0" dy="0">Cesárea, banco de sangre</tspan></text><circle cx="522.0" cy="755.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="532.0" y="759.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="532.0" dy="0">Especialistas</tspan></text><rect x="731.0" y="659.5" width="213.0" height="121.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="731.6" y="660.1" width="211.8" height="63.0" rx="9" fill="#fee2e2" stroke="none" stroke-width="0"/><text x="837.5" y="687.5" font-size="11" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="197"><tspan x="837.5" dy="0">III</tspan></text><text x="837.5" y="707.5" font-size="14" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="189"><tspan x="837.5" dy="0">Hospitales e institutos</tspan></text><circle cx="747.0" cy="732.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="757.0" y="736.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="757.0" dy="0">Alta complejidad</tspan></text><text x="56.0" y="810.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="819.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="834.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="834.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Establecimiento I-2</tspan></text><rect x="56.0" y="841.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="856.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="856.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">No puede resolver una hemorragia obstétrica</tspan></text><rect x="56.0" y="878.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="901.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Estabilizar y referir a un II-1 o superior.</tspan></text><text x="40.0" y="971.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="981.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1021.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1012.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Realizar tacto</tspan><tspan x="285.0" dy="17">vaginal</tspan></text><text x="435.0" y="1021.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Inducir el parto</tspan></text><text x="585.0" y="1021.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Darle de alta</tspan></text><rect x="663.0" y="984.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="1004.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Derivar a un centro</tspan><tspan x="735.0" dy="17">de mayor</tspan><tspan x="735.0" dy="17">complejidad</tspan></text><text x="885.0" y="1012.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Realizar</tspan><tspan x="885.0" dy="17">amniotomía</tspan></text><rect x="40.0" y="1052.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="1052.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1081.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Actitud?</tspan></text><text x="285.0" y="1073.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: riesgo de</tspan><tspan x="285.0" dy="16">hemorragia si es previa</tspan></text><text x="435.0" y="1073.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: sin diagnóstico ni</tspan><tspan x="435.0" dy="16">condiciones</tspan></text><text x="585.0" y="1081.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: puede ser grave</tspan></text><text x="735.0" y="1073.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: necesita eco,</tspan><tspan x="735.0" dy="16">cesárea y sangre</tspan></text><text x="885.0" y="1073.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: contraindicada sin</tspan><tspan x="885.0" dy="16">descartar previa</tspan></text><rect x="40.0" y="981.5" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1126.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1154.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1176.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Antes de referir: vía periférica gruesa, cristaloides, monitoreo materno y fetal, sin tacto vaginal.</tspan><tspan x="58.0" dy="18">• Referir acompañada a un establecimiento con capacidad resolutiva (cesárea y sangre: II-1 o más).</tspan><tspan x="58.0" dy="18">• Comunicar al establecimiento receptor (Sistema de referencia y contrarreferencia).</tspan></text><text x="58.0" y="1234.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA Perú, NTS de categorías de establecimientos (2011, act.) y guía de emergencias obstétricas.</tspan></text></svg>