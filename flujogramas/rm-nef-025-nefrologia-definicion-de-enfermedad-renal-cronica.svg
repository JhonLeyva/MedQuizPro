<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1425" viewBox="0 0 1000 1425" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La enfermedad renal crónica se diagnostica con la disminución persistente del filtrado glomerular por más de 3 meses"><title>La enfermedad renal crónica se diagnostica con la disminución persistente del filtrado glomerular por más de 3 meses</title><rect x="0.75" y="0.75" width="998.5" height="1423.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Nefrología · definición de enfermedad renal crónica</tspan></text><rect x="502.8" y="32.0" width="182.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="594.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="167"><tspan x="594.1" dy="0">NEFROLOGÍA Y UROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Enfermedad renal crónica (KDIGO 2024)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Anomalías de la estructura o la función renal por más de 3 meses y con implicancias para</tspan><tspan x="58.0" dy="17">la salud.</tspan><tspan x="58.0" dy="17">Se clasifica por causa, categoría de TFG (G1 a G5) y de albuminuria (A1 a A3).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de definición</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">El diagnóstico de enfermedad renal crónica se</tspan><tspan x="640.0" dy="16">establece con base en...</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE LLEGA AL DIAGNÓSTICO, EN ORDEN</tspan></text><rect x="40.0" y="269.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="314.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="342.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">1</tspan></text><rect x="124.0" y="269.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="297.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Hay daño o función disminuida?</tspan></text><rect x="136.0" y="311.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="331.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">TFG &lt; 60 mL/min/1,73 m² o marcadores de daño renal</tspan></text><text x="152.0" y="350.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Albuminuria (cociente albúmina/creatinina ≥ 30 mg/g), sedimento, imagen, histología o trasplante.</tspan></text><line x1="77.0" y1="372.0" x2="77.0" y2="391.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,390.0 82.0,390.0 77.0,398.0" fill="#0f766e"/><text x="134.0" y="390.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="400.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="445.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="473.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">2</tspan></text><rect x="124.0" y="400.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="428.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Cuánto tiempo persiste?</tspan></text><rect x="136.0" y="442.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="462.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Más de 3 meses</tspan></text><text x="152.0" y="481.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Es el criterio que separa la enfermedad renal crónica de la lesión renal aguda.</tspan></text><line x1="77.0" y1="503.0" x2="77.0" y2="522.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,521.0 82.0,521.0 77.0,529.0" fill="#0f766e"/><text x="134.0" y="521.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="531.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="576.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="604.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">3</tspan></text><rect x="124.0" y="531.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="559.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Cómo se clasifica?</tspan></text><rect x="136.0" y="573.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="593.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Causa, categoría de TFG (G1-G5) y de albuminuria (A1-A3)</tspan></text><text x="152.0" y="612.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Juntas definen el riesgo de progresión y la frecuencia de control.</tspan></text><rect x="40.0" y="652.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="678.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">TFG baja persistente por más de 3 meses = enfermedad renal crónica</tspan></text><text x="60.0" y="697.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Albuminuria masiva, TFG &lt; 30 y riñón pequeño son formas avanzadas o hallazgos de apoyo.</tspan></text><text x="40.0" y="758.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CATEGORÍAS DE TFG DE LA ENFERMEDAD RENAL CRÓNICA (KDIGO 2024)</tspan></text><rect x="40.0" y="770.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="789.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="84"><tspan x="50.0" dy="0">Categoría</tspan></text><text x="150.0" y="789.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="394"><tspan x="150.0" dy="0">TFG (mL/min/1,73 m²)</tspan></text><text x="560.0" y="789.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="394"><tspan x="560.0" dy="0">Descripción</tspan></text><rect x="40.0" y="799.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="818.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="84"><tspan x="50.0" dy="0">G1</tspan></text><text x="150.0" y="818.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="150.0" dy="0">90 o más</tspan></text><text x="560.0" y="818.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="560.0" dy="0">Normal o alta (con otro marcador de daño)</tspan></text><rect x="40.0" y="828.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="847.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="84"><tspan x="50.0" dy="0">G2</tspan></text><text x="150.0" y="847.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="150.0" dy="0">60 a 89</tspan></text><text x="560.0" y="847.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="560.0" dy="0">Levemente disminuida (con otro marcador de daño)</tspan></text><rect x="40.0" y="857.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="876.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="84"><tspan x="50.0" dy="0">G3a</tspan></text><text x="150.0" y="876.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="150.0" dy="0">45 a 59</tspan></text><text x="560.0" y="876.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="560.0" dy="0">Leve a moderadamente disminuida</tspan></text><rect x="40.0" y="886.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="905.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="84"><tspan x="50.0" dy="0">G3b</tspan></text><text x="150.0" y="905.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="150.0" dy="0">30 a 44</tspan></text><text x="560.0" y="905.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="560.0" dy="0">Moderada a gravemente disminuida</tspan></text><rect x="40.0" y="915.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="934.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="84"><tspan x="50.0" dy="0">G4</tspan></text><text x="150.0" y="934.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="150.0" dy="0">15 a 29</tspan></text><text x="560.0" y="934.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="560.0" dy="0">Gravemente disminuida</tspan></text><rect x="40.0" y="944.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="963.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="84"><tspan x="50.0" dy="0">G5</tspan></text><text x="150.0" y="963.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="150.0" dy="0">Menos de 15</tspan></text><text x="560.0" y="963.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="560.0" dy="0">Falla renal</tspan></text><text x="40.0" y="989.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Albuminuria: A1 &lt; 30 mg/g, A2 30 a 300 mg/g, A3 &gt; 300 mg/g (cociente albúmina/creatinina).</tspan></text><text x="40.0" y="1036.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1046.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1085.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1085.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Albuminuria masiva</tspan></text><rect x="363.0" y="1049.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="1068.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">TFG baja</tspan><tspan x="435.0" dy="17">persistente por más</tspan><tspan x="435.0" dy="17">de 3 meses</tspan></text><text x="585.0" y="1077.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">TFG menor de 30</tspan><tspan x="585.0" dy="17">mL/min/1,73 m²</tspan></text><text x="735.0" y="1077.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hipertensión</tspan><tspan x="735.0" dy="17">arterial refractaria</tspan></text><text x="885.0" y="1068.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Solo disminución</tspan><tspan x="885.0" dy="17">del tamaño renal en</tspan><tspan x="885.0" dy="17">ecografía</tspan></text><rect x="40.0" y="1117.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="1117.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1154.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Base del diagnóstico?</tspan></text><text x="285.0" y="1138.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es una forma</tspan><tspan x="285.0" dy="16">avanzada, no un</tspan><tspan x="285.0" dy="16">requisito</tspan></text><text x="435.0" y="1146.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: criterio de función</tspan><tspan x="435.0" dy="16">con el tiempo exigido</tspan></text><text x="585.0" y="1146.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: TFG &lt; 30 es</tspan><tspan x="585.0" dy="16">enfermedad avanzada</tspan></text><text x="735.0" y="1138.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es causa o</tspan><tspan x="735.0" dy="16">consecuencia, no</tspan><tspan x="735.0" dy="16">criterio</tspan></text><text x="885.0" y="1146.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: hallazgo de apoyo,</tspan><tspan x="885.0" dy="16">no criterio por sí solo</tspan></text><rect x="40.0" y="1046.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1207.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1235.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1257.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Criterios: TFG &lt; 60 mL/min/1,73 m² o marcadores de daño (albuminuria ≥ 30 mg/g, alteración del sedimento, tubulopatía, histología, imagen o trasplante),</tspan><tspan x="58.0" dy="18">   por más de 3 meses.</tspan><tspan x="58.0" dy="18">• El tiempo de 3 meses la distingue de la lesión renal aguda. Albuminuria masiva y TFG &lt; 30 son formas avanzadas, no requisitos.</tspan><tspan x="58.0" dy="18">• La TFG se estima con CKD-EPI de creatinina, con cistatina C si hace falta confirmar. Los iSGLT2 y el bloqueo del sistema renina-angiotensina retrasan la</tspan><tspan x="58.0" dy="18">   progresión.</tspan><tspan x="58.0" dy="18">• Alerta: la hipertensión refractaria es causa o consecuencia, y un riñón pequeño en la ecografía solo apoya el diagnóstico.</tspan></text><text x="58.0" y="1369.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: KDIGO 2024 Clinical Practice Guideline for the Evaluation and Management of CKD (Kidney Int 2024;105(4S):S117-S314); Harrison Principios de Medicina Interna, 21.ª</tspan><tspan x="58.0" dy="15">ed. (2022).</tspan></text></svg>