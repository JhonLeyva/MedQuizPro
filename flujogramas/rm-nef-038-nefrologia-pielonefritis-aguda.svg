<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="886" viewBox="0 0 1000 886" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Síntomas urinarios bajos con fiebre, escalofríos y puñopercusión lumbar positiva: pielonefritis aguda"><title>Síntomas urinarios bajos con fiebre, escalofríos y puñopercusión lumbar positiva: pielonefritis aguda</title><rect x="0.75" y="0.75" width="998.5" height="884.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Nefrología · pielonefritis aguda</tspan></text><rect x="383.2" y="32.0" width="182.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="474.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="167"><tspan x="474.4" dy="0">NEFROLOGÍA Y UROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Pielonefritis aguda</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección ascendente que alcanza el parénquima renal, casi siempre por E. coli.</tspan><tspan x="58.0" dy="17">Factores: coito reciente, espermicidas, infección previa y diabetes.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 28 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Hiporexia, fiebre, escalofríos, disuria y polaquiuria con</tspan><tspan x="640.0" dy="16">dolor lumbar.</tspan><tspan x="640.0" dy="16">Febril, puñopercusión lumbar bilateral positiva.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SEPARAR CISTITIS DE PIELONEFRITIS</tspan></text><rect x="40.0" y="285.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="307.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="170"><tspan x="54.0" dy="0">CUADRO</tspan></text><text x="412.5" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="345"><tspan x="412.5" dy="0">Sin fiebre ni dolor lumbar</tspan></text><text x="777.5" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="345"><tspan x="777.5" dy="0">Con fiebre, escalofríos y puñopercusión +</tspan></text><rect x="40.0" y="325.0" width="184.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="351.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Síntomas urinarios bajos</tspan></text><text x="54.0" y="368.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Disuria y polaquiuria</tspan></text><rect x="233.0" y="325.0" width="359.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="245.0" y="350.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Cistitis</tspan></text><text x="245.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Infección de la vejiga</tspan></text><rect x="598.0" y="325.0" width="359.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="610.0" y="350.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Pielonefritis</tspan></text><text x="610.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Infección ascendente al riñón</tspan></text><rect x="40.0" y="388.0" width="184.0" height="74.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="414.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Síntomas bajos y</tspan><tspan x="54.0" dy="17">sistémicos</tspan></text><text x="54.0" y="448.0" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Fiebre, hiporexia y dolor lumbar</tspan></text><rect x="233.0" y="388.0" width="359.0" height="74.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="245.0" y="421.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Cistitis</tspan></text><text x="245.0" y="437.5" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">No explica la fiebre</tspan></text><rect x="598.0" y="388.0" width="359.0" height="74.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="610.0" y="421.5" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Pielonefritis aguda: este caso</tspan></text><text x="610.0" y="437.5" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Urocultivo y antibiótico</tspan></text><rect x="856.2" y="377.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="901.6" y="392.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="901.6" dy="0">◆ ESTE CASO</tspan></text><text x="44.0" y="484.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">La EPI, la anexitis y la endometritis no producen puñopercusión lumbar positiva.</tspan></text><text x="40.0" y="532.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="542.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="573.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="545.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="573.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Pielonefritis</tspan></text><text x="435.0" y="573.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Cistitis</tspan></text><text x="585.0" y="564.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Enfermedad pélvica</tspan><tspan x="585.0" dy="17">inflamatoria</tspan></text><text x="735.0" y="573.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Anexitis</tspan></text><text x="885.0" y="573.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Endometritis</tspan></text><rect x="40.0" y="596.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="596.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="633.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico probable?</tspan></text><text x="285.0" y="617.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: síntomas bajos más</tspan><tspan x="285.0" dy="16">fiebre y puñopercusión</tspan><tspan x="285.0" dy="16">positiva</tspan></text><text x="435.0" y="625.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no hay fiebre ni</tspan><tspan x="435.0" dy="16">dolor lumbar</tspan></text><text x="585.0" y="625.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: dolor hipogástrico,</tspan><tspan x="585.0" dy="16">flujo y dolor cervical</tspan></text><text x="735.0" y="625.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: dolor pélvico y</tspan><tspan x="735.0" dy="16">flujo, sin dolor lumbar</tspan></text><text x="885.0" y="625.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: posparto o tras</tspan><tspan x="885.0" dy="16">instrumentación</tspan></text><rect x="40.0" y="542.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="686.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="714.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="736.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Síntomas bajos más fiebre, escalofríos y dolor lumbar con puñopercusión positiva = pielonefritis; la cistitis cursa sin fiebre ni dolor lumbar.</tspan><tspan x="58.0" dy="18">• EPI y anexitis dan dolor hipogástrico, flujo y dolor a la movilización cervical; la endometritis es posparto o tras instrumentación.</tspan><tspan x="58.0" dy="18">• Mujer no embarazada sin gravedad: urocultivo previo y antibiótico oral ambulatorio; hospitalizar si hay vómitos incoercibles, sepsis, embarazo,</tspan><tspan x="58.0" dy="18">   obstrucción o inmunosupresión.</tspan><tspan x="58.0" dy="18">• Alerta: ecografía si la fiebre persiste más de 72 horas (litiasis o absceso). El sedimento muestra piuria con cilindros leucocitarios.</tspan></text><text x="58.0" y="830.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Gupta K et al., IDSA/ESCMID, Clin Infect Dis 2011;52:e103-e120; Trautner BW et al., IDSA guideline on complicated UTI, Clin Infect Dis 2025, doi:10.1093/cid/ciaf462;</tspan><tspan x="58.0" dy="15">Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>