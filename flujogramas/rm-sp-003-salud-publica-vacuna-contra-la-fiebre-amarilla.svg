x="58.0" dy="0">Virus vivo atenuado, dosis única desde los 9 meses.</tspan><tspan x="58.0" dy="17">Anticuerpos protectores en más de 95 % a los 10 días.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">En la prevención de la fiebre amarilla, ¿a cuántos días</tspan><tspan x="640.0" dy="16">de la vacuna se logra la inmunidad?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL DÍA DE LA VACUNA AL VIAJE SEGURO</tspan></text><rect x="40.0" y="269.0" width="920.0" height="34.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="52.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="134"><tspan x="52.0" dy="0">PASO</tspan></text><text x="234.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="84"><tspan x="234.0" dy="0">Día 0</tspan></text><text x="322.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="84"><tspan x="322.0" dy="0">Día 5</tspan></text><text x="410.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="84"><tspan x="410.0" dy="0">Día 10</tspan></text><text x="498.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="84"><tspan x="498.0" dy="0">Día 15</tspan></text><text x="586.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="84"><tspan x="586.0" dy="0">Día 20</tspan></text><text x="674.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="84"><tspan x="674.0" dy="0">Día 30</tspan></text><text x="734.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="220"><tspan x="734.0" dy="0">REGLA</tspan></text><rect x="368.0" y="305.0" width="84.0" height="176.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/><rect x="40.0" y="309.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="339.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Vacuna 17D</tspan></text><line x1="198.0" y1="335.0" x2="710.0" y2="335.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="234.0" cy="330.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="234.0" y="334.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="234.0" dy="0">✓</tspan></text><text x="234.0" y="357.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="84"><tspan x="234.0" dy="0">Dosis única</tspan></text><rect x="730.0" y="309.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="331.5" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">Virus vivo atenuado desde los 9 meses;</tspan><tspan x="740.0" dy="15">una dosis protege de por vida.</tspan></text><rect x="40.0" y="367.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="389.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Anticuerpos</tspan><tspan x="50.0" dy="16">protectores</tspan></text><line x1="198.0" y1="393.0" x2="710.0" y2="393.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="410.0" cy="388.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="410.0" y="392.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="410.0" dy="0">✓</tspan></text><text x="410.0" y="415.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="84"><tspan x="410.0" dy="0">&gt; 95 %</tspan></text><circle cx="498.0" cy="388.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="498.0" y="392.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">✓</tspan></text><text x="498.0" y="415.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="84"><tspan x="498.0" dy="0">&gt; 95 %</tspan></text><circle cx="586.0" cy="388.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="586.0" y="392.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="586.0" dy="0">✓</tspan></text><text x="586.0" y="415.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="84"><tspan x="586.0" dy="0">&gt; 95 %</tspan></text><circle cx="674.0" cy="388.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="674.0" y="392.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="674.0" dy="0">✓</tspan></text><text x="674.0" y="415.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="84"><tspan x="674.0" dy="0">&gt; 95 %</tspan></text><rect x="730.0" y="367.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="389.5" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">Neutralizantes en más de 95 % a los 10</tspan><tspan x="740.0" dy="15">días.</tspan></text><rect x="40.0" y="425.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="447.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Viaje a zona de</tspan><tspan x="50.0" dy="16">riesgo</tspan></text><line x1="198.0" y1="451.0" x2="710.0" y2="451.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="234.0" cy="446.0" r="13" fill="#cbd5e1" stroke="#cbd5e1" stroke-width="2"/><text x="234.0" y="450.5" font-size="12" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="234.0" dy="0">✕</tspan></text><text x="234.0" y="473.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="84"><tspan x="234.0" dy="0">Aún no</tspan></text><circle cx="322.0" cy="446.0" r="13" fill="#cbd5e1" stroke="#cbd5e1" stroke-width="2"/><text x="322.0" y="450.5" font-size="12" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="322.0" dy="0">✕</tspan></text><text x="322.0" y="473.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="84"><tspan x="322.0" dy="0">Aún no</tspan></text><circle cx="410.0" cy="446.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="410.0" y="450.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="410.0" dy="0">✓</tspan></text><text x="410.0" y="473.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="84"><tspan x="410.0" dy="0">Ya puede</tspan></text><rect x="730.0" y="425.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="447.5" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">Vacunar al menos 10 días antes de</tspan><tspan x="740.0" dy="15">ingresar.</tspan></text><rect x="375.3" y="294.0" width="69.4" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="410.0" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="410.0" dy="0">◆ 10 DÍAS</tspan></text><text x="44.0" y="497.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="44.0" dy="0">✓ protegido o puede viajar · ✕ aún sin inmunidad</tspan></text><rect x="40.0" y="521.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="547.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Inmunidad a los 10 días de la vacuna</tspan></text><text x="60.0" y="566.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Por eso se vacuna al menos 10 días antes de viajar a zona enzoótica.</tspan></text><text x="40.0" y="633.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="643.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="665.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="665.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">5 días</tspan></text><text x="435.0" y="665.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">20 días</tspan></text><text x="585.0" y="665.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">30 días</tspan></text><text x="735.0" y="665.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">15 días</tspan></text><rect x="813.0" y="646.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="665.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">10 días</tspan></text><rect x="40.0" y="680.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="680.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="709.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Días hasta la</tspan><tspan x="54.0" dy="16">inmunidad?</tspan></text><text x="285.0" y="717.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: demasiado pronto</tspan></text><text x="435.0" y="701.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no corresponde a</tspan><tspan x="435.0" dy="16">la reacción</tspan><tspan x="435.0" dy="16">documentada</tspan></text><text x="585.0" y="701.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no corresponde a</tspan><tspan x="585.0" dy="16">la reacción</tspan><tspan x="585.0" dy="16">documentada</tspan></text><text x="735.0" y="701.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no corresponde a</tspan><tspan x="735.0" dy="16">la reacción</tspan><tspan x="735.0" dy="16">documentada</tspan></text><text x="885.0" y="709.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: protección en más</tspan><tspan x="885.0" dy="16">de 95 % a los 10 días</tspan></text><rect x="40.0" y="643.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="770.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="798.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="820.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Aplicarla al menos 10 días antes de viajar a una zona de riesgo. Una dosis protege de por vida en inmunocompetentes (OMS), sin refuerzo cada 10 años.</tspan><tspan x="58.0" dy="18">• Contraindicada: menores de 6 meses, alergia grave al huevo, inmunodeficiencia grave y timoma. Precaución en embarazo, VIH y trasplante.</tspan><tspan x="58.0" dy="18">• Complicación rara: enfermedad viscerotrópica asociada a la vacuna, más riesgo en mayores de 60 años.</tspan><tspan x="58.0" dy="18">• Los plazos de 5, 15, 20 y 30 días no corresponden a la reacción inmunitaria documentada.</tspan></text><text x="58.0" y="896.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, Vaccines and vaccination against yellow fever: WHO Position Paper (Vaccine 2015;33:76-77); Gotuzzo E, et al., Am J Trop Med Hyg 2013;89:434-444.</tspan></text></svg>