h="2" stroke-linejoin="round" /><path d="M156.0 360 H126.0 L132.0 418 H150.0 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="142.0" cy="426.0" rx="15.0" ry="7.0" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="110" cy="36" r="3" fill="#334155" stroke="none" stroke-width="0" /><circle cx="130" cy="36" r="3" fill="#334155" stroke="none" stroke-width="0" /><path d="M112 52 Q120 57 128 52" fill="none" stroke="#9a6b52" stroke-width="1.6"/><ellipse cx="120" cy="208" rx="64" ry="54" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="120" cy="214" r="2.5" fill="#9a6b52" stroke="none" stroke-width="0" /><text x="4" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">D</text><text x="236" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">I</text></g></g><rect x="48.0" y="636.0" width="294.0" height="27.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0"/><text x="195.0" y="657.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="280"><tspan x="195.0" dy="0">Cada gestante en el mapa del territorio.</tspan></text><text x="370.0" y="281.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="590"><tspan x="370.0" dy="0">LO QUE HACE EL RADAR</tspan></text><rect x="370.0" y="291.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="305.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="309.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="309.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Ubica a cada gestante en el mapa</tspan></text><rect x="370.0" y="323.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="337.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="341.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="341.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Clasifica su riesgo por colores</tspan></text><rect x="370.0" y="355.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="369.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="373.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="373.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Detecta a las que faltan al control</tspan></text><rect x="370.0" y="397.0" width="590.0" height="66.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><circle cx="400.0" cy="430.0" r="17" fill="#16a34a" stroke="none" stroke-width="0"/><circle cx="400.0" cy="430.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="419.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Verde · sin riesgo</tspan></text><text x="430.0" y="436.0" font-size="11.5" font-weight="700" font-style="normal" fill="#16a34a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Controles al día</tspan></text><text x="430.0" y="452.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Seguimiento habitual</tspan></text><rect x="370.0" y="471.0" width="590.0" height="66.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><circle cx="400.0" cy="504.0" r="17" fill="#f59e0b" stroke="none" stroke-width="0"/><circle cx="400.0" cy="504.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="493.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Amarillo · riesgo o falta a controles</tspan></text><text x="430.0" y="510.0" font-size="11.5" font-weight="700" font-style="normal" fill="#f59e0b" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Factor de riesgo o inasistencia</tspan></text><text x="430.0" y="526.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Visita domiciliaria</tspan></text><rect x="370.0" y="545.0" width="590.0" height="66.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><circle cx="400.0" cy="578.0" r="17" fill="#dc2626" stroke="none" stroke-width="0"/><circle cx="400.0" cy="578.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="567.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Rojo · alto riesgo</tspan></text><text x="430.0" y="584.0" font-size="11.5" font-weight="700" font-style="normal" fill="#dc2626" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Signos de alarma o patología</tspan></text><text x="430.0" y="600.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Referir</tspan></text><text x="40.0" y="713.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="723.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="762.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="754.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">El camino del buen</tspan><tspan x="285.0" dy="17">crecimiento</tspan></text><text x="435.0" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Folletos de signos</tspan><tspan x="435.0" dy="17">de alarma para la</tspan><tspan x="435.0" dy="17">gestante</tspan></text><text x="585.0" y="754.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Los kits de la clave</tspan><tspan x="585.0" dy="17">roja, amarilla y azul</tspan></text><rect x="663.0" y="726.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="762.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Radar de gestantes</tspan></text><text x="885.0" y="754.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Historia clínica de</tspan><tspan x="885.0" dy="17">emergencia</tspan></text><rect x="40.0" y="794.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="794.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="823.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Instrumento?</tspan></text><text x="285.0" y="823.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es del niño</tspan></text><text x="435.0" y="823.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Educan, no vigilan</tspan></text><text x="585.0" y="823.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Son para emergencias</tspan></text><text x="735.0" y="815.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: padrón y mapa por</tspan><tspan x="735.0" dy="16">riesgo</tspan></text><text x="885.0" y="823.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es de emergencia</tspan></text><rect x="40.0" y="723.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="868.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="896.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="918.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Se actualiza en cada control y visita; se usa con el plan de parto.</tspan><tspan x="58.0" dy="18">• Claves roja, azul y amarilla: kits para emergencias (hemorragia, preeclampsia, sepsis), no para seguimiento.</tspan><tspan x="58.0" dy="18">• «El camino del buen crecimiento» es para el niño.</tspan></text><text x="58.0" y="976.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA Perú, NTS de atención integral de la salud materna (2023).</tspan></text></svg>