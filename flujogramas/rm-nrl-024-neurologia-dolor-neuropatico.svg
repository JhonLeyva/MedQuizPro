<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Los antidepresivos tienen utilidad demostrada en el dolor de la neuropatía diabética"><title>Los antidepresivos tienen utilidad demostrada en el dolor de la neuropatía diabética</title><rect x="0.75" y="0.75" width="998.5" height="1048.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neurología · dolor neuropático</tspan></text><rect x="381.8" y="32.0" width="113.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="438.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="98"><tspan x="438.6" dy="0">NEUROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Dolor neuropático</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Nace de una lesión del sistema somatosensorial, con sensibilización periférica y central y</tspan><tspan x="58.0" dy="17">pérdida de la inhibición descendente.</tspan><tspan x="58.0" dy="17">Los antidepresivos aumentan serotonina y noradrenalina en la sinapsis espinal.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de farmacología del dolor</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿En qué caso está demostrada la utilidad de los</tspan><tspan x="640.0" dy="16">antidepresivos en el manejo del dolor?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EN QUÉ DOLOR SIRVEN LOS ANTIDEPRESIVOS Y EN CUÁL NO</tspan></text><rect x="40.0" y="281.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="307.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Neuropatía diabética dolorosa = antidepresivos útiles</tspan></text><text x="60.0" y="326.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Tricíclicos, duloxetina o venlafaxina y gabapentinoides son de primera línea.</tspan></text><text x="40.0" y="387.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TIPO DE DOLOR Y UTILIDAD DE LOS ANTIDEPRESIVOS</tspan></text><rect x="40.0" y="399.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="418.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Tipo de dolor</tspan></text><text x="320.0" y="418.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Tratamiento de elección</tspan></text><text x="645.0" y="418.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">¿Antidepresivo útil?</tspan></text><rect x="40.0" y="428.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="447.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Neuropatía diabética dolorosa</tspan></text><text x="320.0" y="447.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Tricíclicos, duloxetina o venlafaxina y gabapentinoides</tspan></text><text x="645.0" y="447.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">Sí: demostrado, primera línea</tspan></text><rect x="210.6" y="431.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="256.0" y="446.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="256.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="457.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="476.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Neuralgia posherpética</tspan></text><text x="320.0" y="476.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Antidepresivos y gabapentinoides</tspan></text><text x="645.0" y="476.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">Sí</tspan></text><rect x="40.0" y="486.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="505.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Fibromialgia</tspan></text><text x="320.0" y="505.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Duloxetina</tspan></text><text x="645.0" y="505.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">Sí</tspan></text><rect x="40.0" y="515.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="534.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Lumbalgia aguda</tspan></text><text x="320.0" y="534.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Paracetamol y AINE</tspan></text><text x="645.0" y="534.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">No</tspan></text><rect x="40.0" y="544.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="563.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Desgarro muscular o esguince</tspan></text><text x="320.0" y="563.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">AINE</tspan></text><text x="645.0" y="563.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">No</tspan></text><rect x="40.0" y="573.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="592.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Dolor poscolecistectomía</tspan></text><text x="320.0" y="592.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Paracetamol, AINE y opioides por períodos cortos</tspan></text><text x="645.0" y="592.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">No</tspan></text><text x="40.0" y="642.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="652.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="683.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="683.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Lumbalgia aguda</tspan></text><text x="435.0" y="683.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Desgarro muscular</tspan></text><rect x="513.0" y="655.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="674.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Neuropatía</tspan><tspan x="585.0" dy="17">diabética</tspan></text><text x="735.0" y="683.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Poscolecistectomía</tspan></text><text x="885.0" y="683.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Esguince de tobillo</tspan></text><rect x="40.0" y="706.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="706.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="743.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Utilidad demostrada?</tspan></text><text x="285.0" y="735.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: dolor agudo;</tspan><tspan x="285.0" dy="16">paracetamol y AINE</tspan></text><text x="435.0" y="735.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: dolor agudo;</tspan><tspan x="435.0" dy="16">paracetamol y AINE</tspan></text><text x="585.0" y="735.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: dolor neuropático;</tspan><tspan x="585.0" dy="16">primera línea</tspan></text><text x="735.0" y="727.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: dolor agudo</tspan><tspan x="735.0" dy="16">posquirúrgico;</tspan><tspan x="735.0" dy="16">analgésicos habituales</tspan></text><text x="885.0" y="735.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: dolor agudo; AINE</tspan><tspan x="885.0" dy="16">y reposo relativo</tspan></text><rect x="40.0" y="652.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="796.0" width="920.0" height="236.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="824.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="846.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Primera línea en dolor neuropático (Finnerup): tricíclicos (amitriptilina, nortriptilina), IRSN (duloxetina, venlafaxina) y gabapentinoides (gabapentina,</tspan><tspan x="58.0" dy="18">   pregabalina).</tspan><tspan x="58.0" dy="18">• ADA 2026: pregabalina, duloxetina o gabapentina como tratamiento inicial de la neuropatía diabética dolorosa; tricíclicos como alternativa con cuidado en</tspan><tspan x="58.0" dy="18">   ancianos y cardiópatas.</tspan><tspan x="58.0" dy="18">• Dolor agudo nociceptivo (lumbalgia aguda, desgarro, esguince, posoperatorio): paracetamol, AINE y opioides cortos; los antidepresivos no ayudan y</tspan><tspan x="58.0" dy="18">   tienen efectos adversos.</tspan><tspan x="58.0" dy="18">• Otras indicaciones: neuralgia posherpética, fibromialgia (duloxetina), cefalea tensional crónica y profilaxis de migraña. Tricíclicos: dosis baja nocturna;</tspan><tspan x="58.0" dy="18">   evitar en arritmias o glaucoma de ángulo cerrado.</tspan></text><text x="58.0" y="994.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Finnerup NB et al., Pharmacotherapy for neuropathic pain in adults, Lancet Neurol 2015;14:162-173; ADA, Standards of Care in Diabetes-2026, Diabetes Care</tspan><tspan x="58.0" dy="15">2026;49(Suppl 1):S261-S276; Harrison Principios de Medicina Interna, 21.ª ed. (2022)</tspan></text></svg>