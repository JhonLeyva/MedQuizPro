<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1072" viewBox="0 0 1000 1072" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Los residuos comunes de la cocina hospitalaria pueden comercializarse mediante empresas registradas"><title>Los residuos comunes de la cocina hospitalaria pueden comercializarse mediante empresas registradas</title><rect x="0.75" y="0.75" width="998.5" height="1070.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Salud pública · residuos sólidos hospitalarios</tspan></text><rect x="470.7" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="535.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="535.0" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Clases de residuos hospitalarios</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">A biocontaminados, B especiales y C comunes.</tspan><tspan x="58.0" dy="17">Cada clase tiene bolsa y destino distintos.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Cocina del hospital</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Residuos de la preparación de alimentos de pacientes</tspan><tspan x="640.0" dy="16">y personal.</tspan><tspan x="640.0" dy="16">¿Qué debe disponerse según la norma?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASES DE RESIDUOS HOSPITALARIOS Y SU DESTINO</tspan></text><rect x="40.0" y="285.0" width="920.0" height="112.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="285.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="345.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Clase A</tspan></text><rect x="40.0" y="397.0" width="920.0" height="112.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="397.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="457.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Clase B</tspan></text><rect x="40.0" y="509.0" width="920.0" height="112.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="509.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="569.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Clase C</tspan></text><line x1="348.0" y1="341.0" x2="355.0" y2="341.0" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="341.0" x2="355.0" y2="444.5" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="444.5" x2="353.0" y2="444.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="353.0,449.5 353.0,439.5 362.0,444.5" fill="#0f766e"/><line x1="552.0" y1="444.5" x2="559.0" y2="444.5" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="444.5" x2="559.0" y2="564.5" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="564.5" x2="557.0" y2="564.5" stroke="#ea580c" stroke-width="2.2"/><polygon points="557.0,569.5 557.0,559.5 566.0,564.5" fill="#ea580c"/><line x1="756.0" y1="564.5" x2="763.0" y2="564.5" stroke="#ea580c" stroke-width="2.2"/><line x1="763.0" y1="564.5" x2="763.0" y2="556.5" stroke="#ea580c" stroke-width="2.2"/><line x1="763.0" y1="556.5" x2="761.0" y2="556.5" stroke="#ea580c" stroke-width="2.2"/><polygon points="761.0,561.5 761.0,551.5 770.0,556.5" fill="#ea580c"/><rect x="158.0" y="298.0" width="190.0" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="314.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Bolsa roja ·</tspan><tspan x="168.0" dy="16">biocontaminados</tspan></text><text x="168.0" y="347.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Con agentes infecciosos;</tspan><tspan x="168.0" dy="14.5">esterilización o incineración</tspan></text><circle cx="158.0" cy="298.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="302.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="362.0" y="410.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="372.0" y="426.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Bolsa amarilla · especiales</tspan></text><text x="372.0" y="443.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Químicos, farmacéuticos y</tspan><tspan x="372.0" dy="14.5">radiactivos</tspan></text><circle cx="362.0" cy="410.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="362.0" y="414.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="362.0" dy="0">2</tspan></text><rect x="566.0" y="522.0" width="190.0" height="85.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="576.0" y="538.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Bolsa negra · comunes</tspan></text><text x="576.0" y="555.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Papeles, cartones, jardinería y</tspan><tspan x="576.0" dy="14.5">restos de preparación de</tspan><tspan x="576.0" dy="14.5">alimentos</tspan></text><circle cx="566.0" cy="522.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="566.0" y="526.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="566.0" dy="0">3</tspan></text><rect x="770.0" y="522.0" width="190.0" height="69.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="780.0" y="538.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Destino</tspan></text><text x="780.0" y="555.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Aprovechar y comercializar con</tspan><tspan x="780.0" dy="14.5">empresas registradas</tspan></text><circle cx="770.0" cy="522.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="770.0" y="526.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="770.0" dy="0">4</tspan></text><rect x="40.0" y="639.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="665.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Residuo común de cocina = comercializar</tspan></text><text x="60.0" y="684.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Rojo, esterilización e incineración son de los biocontaminados.</tspan></text><text x="40.0" y="751.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="761.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="792.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="764.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="792.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Comercializar</tspan></text><text x="435.0" y="783.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Depositar en bolsas</tspan><tspan x="435.0" dy="17">rojas</tspan></text><text x="585.0" y="783.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Llevar a</tspan><tspan x="585.0" dy="17">esterilización</tspan></text><text x="735.0" y="783.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Transportar en</tspan><tspan x="735.0" dy="17">bolsas verdes</tspan></text><text x="885.0" y="792.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Incinerar</tspan></text><rect x="40.0" y="815.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="815.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="836.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Disposición de</tspan><tspan x="54.0" dy="16">residuos comunes de</tspan><tspan x="54.0" dy="16">cocina?</tspan></text><text x="285.0" y="836.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: clase C</tspan><tspan x="285.0" dy="16">aprovechable, con</tspan><tspan x="285.0" dy="16">empresa registrada</tspan></text><text x="435.0" y="844.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: la bolsa roja es de</tspan><tspan x="435.0" dy="16">biocontaminados</tspan></text><text x="585.0" y="844.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: se aplica a</tspan><tspan x="585.0" dy="16">biocontaminados</tspan></text><text x="735.0" y="844.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: la bolsa común es</tspan><tspan x="735.0" dy="16">negra, no verde</tspan></text><text x="885.0" y="844.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: se aplica a</tspan><tspan x="885.0" dy="16">biocontaminados</tspan></text><rect x="40.0" y="761.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="905.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="933.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="955.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Clase C (comunes): semejantes a los domésticos; papeles, cartones, jardinería, áreas administrativas y restos de preparación de alimentos.</tspan><tspan x="58.0" dy="18">• Son biodegradables, van en bolsa negra y pueden aprovecharse y comercializarse con empresas comercializadoras de residuos sólidos registradas.</tspan><tspan x="58.0" dy="18">• Bolsa roja: biocontaminados (esterilización o incineración); amarilla: especiales. Los restos de comida de pabellones son biocontaminados.</tspan><tspan x="58.0" dy="18">• Alerta: segregar en el punto de origen evita convertir residuos comunes en peligrosos. Norma vigente: NTS 144-2018.</tspan></text><text x="58.0" y="1031.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA, NTS 144-MINSA/2018/DIGESA (RM 1295-2018/MINSA; modificada por RM 250-2022/MINSA); Ley 1278 de Gestión Integral de Residuos Sólidos (2016).</tspan></text></svg>