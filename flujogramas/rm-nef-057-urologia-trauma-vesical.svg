<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1273" viewBox="0 0 1000 1273" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Rotura vesical extraperitoneal simple tras fractura pélvica: sonda Foley de 10 a 14 días"><title>Rotura vesical extraperitoneal simple tras fractura pélvica: sonda Foley de 10 a 14 días</title><rect x="0.75" y="0.75" width="998.5" height="1271.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Urología · trauma vesical</tspan></text><rect x="348.3" y="32.0" width="182.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="439.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="167"><tspan x="439.6" dy="0">NEFROLOGÍA Y UROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Rotura vesical</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se asocia a fractura pélvica en 60 a 90 %.</tspan><tspan x="58.0" dy="17">Se confirma con cistografía retrógrada o cistotomografía con llenado de 300 a 350 mL.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 25 años, accidente de tránsito</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Estable; fractura de la rama isquiopúbica derecha.</tspan><tspan x="640.0" dy="16">Rotura vesical extraperitoneal: ¿tratamiento inicial?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SE HACE SEGÚN EL TIPO DE ROTURA VESICAL</tspan></text><rect x="40.0" y="269.0" width="920.0" height="128.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="269.0" width="108.0" height="128.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="329.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Rotura</tspan><tspan x="94.0" dy="14">extraperitoneal</tspan><tspan x="94.0" dy="14">simple</tspan></text><rect x="40.0" y="397.0" width="920.0" height="128.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="397.0" width="108.0" height="128.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="457.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Rotura</tspan><tspan x="94.0" dy="14">complicada o</tspan><tspan x="94.0" dy="14">intraperitoneal</tspan></text><rect x="40.0" y="525.0" width="920.0" height="128.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="525.0" width="108.0" height="128.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="589.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">No</tspan><tspan x="94.0" dy="14">corresponde</tspan></text><line x1="307.2" y1="325.0" x2="314.2" y2="325.0" stroke="#0f766e" stroke-width="2.2"/><line x1="314.2" y1="325.0" x2="314.2" y2="308.5" stroke="#0f766e" stroke-width="2.2"/><line x1="314.2" y1="308.5" x2="312.2" y2="308.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="312.2,313.5 312.2,303.5 321.2,308.5" fill="#0f766e"/><line x1="470.4" y1="308.5" x2="477.4" y2="308.5" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="308.5" x2="477.4" y2="461.0" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="461.0" x2="475.4" y2="461.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="475.4,466.0 475.4,456.0 484.4,461.0" fill="#0f766e"/><line x1="633.6" y1="461.0" x2="640.6" y2="461.0" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="461.0" x2="640.6" y2="445.0" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="445.0" x2="638.6" y2="445.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="638.6,450.0 638.6,440.0 647.6,445.0" fill="#0f766e"/><line x1="796.8" y1="445.0" x2="803.8" y2="445.0" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="445.0" x2="803.8" y2="581.0" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="581.0" x2="801.8" y2="581.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="801.8,586.0 801.8,576.0 810.8,581.0" fill="#0f766e"/><rect x="158.0" y="282.0" width="149.2" height="86.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="168.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Sonda Foley 10 a 14</tspan><tspan x="168.0" dy="16">días</tspan></text><text x="168.0" y="331.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Drenaje continuo; la gran</tspan><tspan x="168.0" dy="14.5">mayoría cicatriza sola</tspan></text><circle cx="158.0" cy="282.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="321.2" y="282.0" width="149.2" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="331.2" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Cistografía de control</tspan></text><text x="331.2" y="315.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Antes de retirar la sonda</tspan></text><circle cx="321.2" cy="282.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="321.2" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="321.2" dy="0">2</tspan></text><rect x="484.4" y="410.0" width="149.2" height="102.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="494.4" y="426.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Laparotomía y</tspan><tspan x="494.4" dy="16">reparación</tspan></text><text x="494.4" y="459.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Rotura intraperitoneal o</tspan><tspan x="494.4" dy="14.5">fragmentos óseos en la</tspan><tspan x="494.4" dy="14.5">vejiga</tspan></text><circle cx="484.4" cy="410.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="484.4" y="414.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="484.4" dy="0">3</tspan></text><rect x="647.6" y="410.0" width="149.2" height="70.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="657.6" y="426.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Cistostomía</tspan><tspan x="657.6" dy="16">suprapúbica</tspan></text><text x="657.6" y="459.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Si no se puede sondar</tspan></text><circle cx="647.6" cy="410.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="647.6" y="414.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="647.6" dy="0">4</tspan></text><rect x="810.8" y="538.0" width="149.2" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="820.8" y="554.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Reparación</tspan><tspan x="820.8" dy="16">endoscópica</tspan></text><text x="820.8" y="587.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">No existe como</tspan><tspan x="820.8" dy="14.5">tratamiento</tspan></text><circle cx="810.8" cy="538.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="810.8" y="542.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="810.8" dy="0">5</tspan></text><rect x="40.0" y="671.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="697.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Extraperitoneal simple = sonda Foley</tspan></text><text x="60.0" y="716.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La laparotomía es para la rotura intraperitoneal o la extraperitoneal complicada.</tspan></text><text x="40.0" y="777.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ROTURA VESICAL SEGÚN SU UBICACIÓN</tspan></text><rect x="40.0" y="789.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="808.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Tipo</tspan></text><text x="250.0" y="808.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Frecuencia y causa</tspan></text><text x="610.0" y="808.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Tratamiento</tspan></text><rect x="40.0" y="818.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="837.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Extraperitoneal</tspan></text><text x="250.0" y="837.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">La más común; fragmento óseo o cizallamiento pélvico</tspan></text><text x="610.0" y="837.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Sonda uretral 10 a 14 días si es simple</tspan></text><rect x="140.6" y="821.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="186.0" y="836.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="186.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="847.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="866.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Intraperitoneal</tspan></text><text x="250.0" y="866.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Menos frecuente; ascitis urinaria con hiperpotasemia</tspan></text><text x="610.0" y="866.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Cirugía con reparación</tspan></text><text x="40.0" y="916.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="926.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="957.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="948.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Laparotomía</tspan><tspan x="285.0" dy="17">exploratoria</tspan></text><rect x="363.0" y="929.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="957.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Sonda Foley</tspan></text><text x="585.0" y="957.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Talla vesical</tspan></text><text x="735.0" y="948.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Cistostomía</tspan><tspan x="735.0" dy="17">suprapúbica</tspan></text><text x="885.0" y="948.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Reparación</tspan><tspan x="885.0" dy="17">endoscópica</tspan></text><rect x="40.0" y="980.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="980.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1017.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tratamiento inicial?</tspan></text><text x="285.0" y="1001.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: se reserva para la</tspan><tspan x="285.0" dy="16">rotura intraperitoneal o</tspan><tspan x="285.0" dy="16">complicada</tspan></text><text x="435.0" y="1009.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: la mayoría cicatriza</tspan><tspan x="435.0" dy="16">con drenaje</tspan></text><text x="585.0" y="1009.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: alternativa si no se</tspan><tspan x="585.0" dy="16">puede sondar</tspan></text><text x="735.0" y="1009.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: alternativa si no se</tspan><tspan x="735.0" dy="16">puede sondar</tspan></text><text x="885.0" y="1009.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no existe como</tspan><tspan x="885.0" dy="16">tratamiento</tspan></text><rect x="40.0" y="926.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1070.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1098.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1120.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La rotura extraperitoneal, la más común, extravasa al espacio perivesical; si es simple, el estándar es sonda uretral 10 a 14 días con cistografía de</tspan><tspan x="58.0" dy="18">   control antes de retirarla.</tspan><tspan x="58.0" dy="18">• Antes de sondar se descarta lesión de la uretra (sangre en el meato, hematoma perineal).</tspan><tspan x="58.0" dy="18">• Cirugía: rotura intraperitoneal y extraperitoneal complicada (fragmentos óseos, lesión del cuello, vagina o recto). La cistostomía es alternativa si no se</tspan><tspan x="58.0" dy="18">   puede sondar.</tspan><tspan x="58.0" dy="18">• Alerta: la rotura intraperitoneal causa ascitis urinaria con hiperpotasemia y creatinina elevada por reabsorción peritoneal.</tspan></text><text x="58.0" y="1232.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Morey AF y cols., Urotrauma Guideline 2020: AUA Guideline (J Urol 2021); Campbell-Walsh-Wein Urología, 12.ª ed. (2020).</tspan></text></svg>