<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1080" viewBox="0 0 1000 1080" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Al contacto del espermatozoide con el ovocito la zona pelúcida cambia su permeabilidad y bloquea la poliespermia"><title>Al contacto del espermatozoide con el ovocito la zona pelúcida cambia su permeabilidad y bloquea la poliespermia</title><rect x="0.75" y="0.75" width="998.5" height="1078.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Embriología · fecundación</tspan></text><rect x="356.5" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="436.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="436.3" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Fecundación</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ocurre en la ampolla de la trompa.</tspan><tspan x="58.0" dy="17">Tiene tres fases: corona radiada, zona pelúcida y fusión de membranas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de la fase 2</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué sucede cuando el espermatozoide entra en</tspan><tspan x="640.0" dy="16">contacto con el óvulo?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LAS TRES FASES DE LA FECUNDACIÓN</tspan></text><rect x="42.0" y="279.0" width="302.7" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="193.3" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">FASE 1</tspan></text><text x="193.3" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">Corona radiada</tspan></text><rect x="348.7" y="279.0" width="302.7" height="56.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="500.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">FASE 2</tspan></text><text x="500.0" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">Zona pelúcida</tspan></text><rect x="655.3" y="279.0" width="302.7" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="806.7" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">FASE 3</tspan></text><text x="806.7" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">Fusión de membranas</tspan></text><rect x="454.6" y="268.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="500.0" y="283.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">◆ ESTE CASO</tspan></text><rect x="48.0" y="349.0" width="290.7" height="125.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="193.3" y="394.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">HIALURONIDASA</tspan></text><text x="193.3" y="418.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">El espermatozoide capacitado la atraviesa</tspan><tspan x="193.3" dy="17">Ayuda su motilidad</tspan></text><rect x="354.7" y="349.0" width="290.7" height="125.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="377.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">REACCIÓN DE ZONA</tspan></text><text x="500.0" y="401.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">ZP3 desencadena la reacción acrosómica y</tspan><tspan x="500.0" dy="17">libera acrosina</tspan><tspan x="500.0" dy="17">Reacción cortical: la zona cambia de</tspan><tspan x="500.0" dy="17">permeabilidad y bloquea la poliespermia</tspan></text><rect x="661.3" y="349.0" width="290.7" height="125.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="806.7" y="386.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">CIGOTO</tspan></text><text x="806.7" y="410.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">El ovocito completa la meiosis II</tspan><tspan x="806.7" dy="17">Los pronúcleos se fusionan y se restablece el</tspan><tspan x="806.7" dy="17">número diploide</tspan></text><text x="40.0" y="508.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">FASES DE LA FECUNDACIÓN Y SUS EVENTOS</tspan></text><rect x="40.0" y="520.2" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="539.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Fase</tspan></text><text x="260.0" y="539.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Evento</tspan></text><text x="615.0" y="539.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Mediador</tspan></text><rect x="40.0" y="549.2" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="568.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">1. Corona radiada</tspan></text><text x="260.0" y="568.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">El espermatozoide capacitado la atraviesa</tspan></text><text x="615.0" y="568.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Hialuronidasa y motilidad espermática</tspan></text><rect x="40.0" y="578.2" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="597.2" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">2. Zona pelúcida</tspan></text><text x="260.0" y="597.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Unión a ZP3, reacción acrosómica y reacción cortical; la zona</tspan><tspan x="260.0" dy="15">cambia de permeabilidad</tspan></text><text x="615.0" y="597.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">ZP3, acrosina y gránulos corticales (ZP2 se corta)</tspan></text><rect x="150.6" y="589.2" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="196.0" y="604.2" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="196.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="622.2" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="641.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">3. Fusión de membranas</tspan></text><text x="260.0" y="641.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Se fusionan espermatozoide y ovocito; este completa la</tspan><tspan x="260.0" dy="15">meiosis II</tspan></text><text x="615.0" y="641.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Pronúcleo femenino y masculino</tspan></text><text x="40.0" y="706.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="716.2" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="755.7" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="747.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">La acrosina impide</tspan><tspan x="285.0" dy="17">la penetración</tspan></text><text x="435.0" y="738.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">La tripsina</tspan><tspan x="435.0" dy="17">disminuye la</tspan><tspan x="435.0" dy="17">permeabilidad</tspan></text><text x="585.0" y="738.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">La lisosómica</tspan><tspan x="585.0" dy="17">permite varios</tspan><tspan x="585.0" dy="17">espermatozoides</tspan></text><text x="735.0" y="747.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ocurre la primera</tspan><tspan x="735.0" dy="17">división meiótica</tspan></text><rect x="813.0" y="719.2" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="738.7" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Cambia la</tspan><tspan x="885.0" dy="17">permeabilidad de la</tspan><tspan x="885.0" dy="17">zona pelúcida</tspan></text><rect x="40.0" y="787.2" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="787.2" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="824.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué sucede?</tspan></text><text x="285.0" y="808.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: la acrosina facilita</tspan><tspan x="285.0" dy="16">la penetración, no la</tspan><tspan x="285.0" dy="16">impide</tspan></text><text x="435.0" y="808.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: son los gránulos</tspan><tspan x="435.0" dy="16">corticales los que</tspan><tspan x="435.0" dy="16">cambian la zona</tspan></text><text x="585.0" y="808.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: el bloqueo evita la</tspan><tspan x="585.0" dy="16">entrada de más</tspan><tspan x="585.0" dy="16">espermatozoides</tspan></text><text x="735.0" y="808.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: se completa la</tspan><tspan x="735.0" dy="16">segunda división</tspan><tspan x="735.0" dy="16">meiótica</tspan></text><text x="885.0" y="808.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: reacción de zona</tspan><tspan x="885.0" dy="16">que evita la</tspan><tspan x="885.0" dy="16">poliespermia</tspan></text><rect x="40.0" y="716.2" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="877.2" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="905.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="927.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Fase 1: el espermatozoide capacitado atraviesa la corona radiada con la hialuronidasa y su motilidad.</tspan><tspan x="58.0" dy="18">• Fase 2: se une a la glucoproteína ZP3 de la zona pelúcida, lo que desencadena la reacción acrosómica y la liberación de acrosina, que le permite</tspan><tspan x="58.0" dy="18">   atravesarla.</tspan><tspan x="58.0" dy="18">• Al tocar la membrana del ovocito ocurre la reacción cortical: los gránulos vierten su contenido, la ZP2 se corta y la zona cambia de permeabilidad y se</tspan><tspan x="58.0" dy="18">   endurece (reacción de zona), lo que evita la poliespermia.</tspan><tspan x="58.0" dy="18">• Alerta: la poliespermia daría un cigoto triploide inviable. El ovocito completa la meiosis II, no la I, y la fusión de pronúcleos restablece el número diploide.</tspan></text><text x="58.0" y="1039.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Sadler, Langman Embriología Médica, 14.ª ed. (2019); Moore, Persaud y Torchia, Embriología clínica, 11.ª ed. (2020); Williams Obstetricia, 26.ª ed. (2022).</tspan></text></svg>