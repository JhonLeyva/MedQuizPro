<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1527" viewBox="0 0 1000 1527" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Irritabilidad, desinterés y pérdida de peso peores por las mañanas en un mes: depresión mayor con melancolía"><title>Irritabilidad, desinterés y pérdida de peso peores por las mañanas en un mes: depresión mayor con melancolía</title><rect x="0.75" y="0.75" width="998.5" height="1525.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Psiquiatría · depresión mayor melancólica</tspan></text><rect x="448.9" y="32.0" width="109.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="503.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="93"><tspan x="503.5" dy="0">PSIQUIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Episodio depresivo mayor</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cinco o más síntomas durante al menos dos semanas, con deterioro funcional.</tspan><tspan x="58.0" dy="17">Debe haber ánimo deprimido o pérdida de interés.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 48 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Un mes de cambio de carácter, irritabilidad y poco</tspan><tspan x="640.0" dy="16">interés, peor por las mañanas.</tspan><tspan x="640.0" dy="16">Callado, adinámico, con melancolía y pérdida de peso.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL CUADRO CLÍNICO AL TRATAMIENTO, EN ORDEN</tspan></text><rect x="40.0" y="285.0" width="920.0" height="128.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="285.0" width="108.0" height="128.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="353.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Cuadro</tspan></text><rect x="40.0" y="413.0" width="920.0" height="128.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="413.0" width="108.0" height="128.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="481.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Criterios</tspan></text><rect x="40.0" y="541.0" width="920.0" height="128.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="541.0" width="108.0" height="128.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="609.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Descartes</tspan></text><rect x="40.0" y="669.0" width="920.0" height="128.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="669.0" width="108.0" height="128.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="737.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Tratamiento</tspan></text><line x1="348.0" y1="341.0" x2="355.0" y2="341.0" stroke="#ea580c" stroke-width="2.2"/><line x1="355.0" y1="341.0" x2="355.0" y2="477.0" stroke="#ea580c" stroke-width="2.2"/><line x1="355.0" y1="477.0" x2="353.0" y2="477.0" stroke="#ea580c" stroke-width="2.2"/><polygon points="353.0,482.0 353.0,472.0 362.0,477.0" fill="#ea580c"/><line x1="552.0" y1="477.0" x2="559.0" y2="477.0" stroke="#0f766e" stroke-width="2.2"/><line x1="559.0" y1="477.0" x2="559.0" y2="597.0" stroke="#0f766e" stroke-width="2.2"/><line x1="559.0" y1="597.0" x2="557.0" y2="597.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="557.0,602.0 557.0,592.0 566.0,597.0" fill="#0f766e"/><line x1="756.0" y1="597.0" x2="763.0" y2="597.0" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="597.0" x2="763.0" y2="724.5" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="724.5" x2="761.0" y2="724.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="761.0,729.5 761.0,719.5 770.0,724.5" fill="#0f766e"/><rect x="158.0" y="298.0" width="190.0" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="314.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Irritabilidad, desinterés,</tspan><tspan x="168.0" dy="16">adinamia y pérdida de peso</tspan></text><text x="168.0" y="347.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Peor por las mañanas; un mes de</tspan><tspan x="168.0" dy="14.5">evolución</tspan></text><circle cx="158.0" cy="298.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="302.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="362.0" y="426.0" width="190.0" height="102.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="372.0" y="442.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Cinco síntomas por dos</tspan><tspan x="372.0" dy="16">semanas o más</tspan></text><text x="372.0" y="475.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Cumple el episodio depresivo</tspan><tspan x="372.0" dy="14.5">mayor con características</tspan><tspan x="372.0" dy="14.5">melancólicas</tspan></text><circle cx="362.0" cy="426.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="362.0" y="430.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="362.0" dy="0">2</tspan></text><rect x="566.0" y="554.0" width="190.0" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="576.0" y="570.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Distimia, fobia social, TOC y</tspan><tspan x="576.0" dy="16">ansiedad</tspan></text><text x="576.0" y="603.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">No encajan con la anhedonia ni</tspan><tspan x="576.0" dy="14.5">con el tiempo de evolución</tspan></text><circle cx="566.0" cy="554.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="566.0" y="558.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="566.0" dy="0">3</tspan></text><rect x="770.0" y="682.0" width="190.0" height="85.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="780.0" y="698.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">ISRS más psicoterapia</tspan></text><text x="780.0" y="715.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Riesgo suicida, hipotiroidismo y</tspan><tspan x="780.0" dy="14.5">PHQ-9; mejoría en 4 a 6</tspan><tspan x="780.0" dy="14.5">semanas</tspan></text><circle cx="770.0" cy="682.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="770.0" y="686.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="770.0" dy="0">4</tspan></text><rect x="40.0" y="815.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="841.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Ánimo deprimido, anhedonia y peor por la mañana = depresión mayor melancólica</tspan></text><text x="60.0" y="860.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La distimia exige dos años; la fobia social y la ansiedad no cursan con anhedonia.</tspan></text><text x="40.0" y="921.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">GRAVEDAD DE LA DEPRESIÓN SEGÚN EL PHQ-9 (PUNTAJE DE 0 A 27)</tspan></text><rect x="40.0" y="933.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="952.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="124"><tspan x="50.0" dy="0">Puntaje</tspan></text><text x="190.0" y="952.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="764"><tspan x="190.0" dy="0">Gravedad</tspan></text><rect x="40.0" y="962.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="981.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="124"><tspan x="50.0" dy="0">0-4</tspan></text><text x="190.0" y="981.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="764"><tspan x="190.0" dy="0">Mínima o ausente</tspan></text><rect x="40.0" y="991.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="1010.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="124"><tspan x="50.0" dy="0">5-9</tspan></text><text x="190.0" y="1010.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="764"><tspan x="190.0" dy="0">Leve</tspan></text><rect x="40.0" y="1020.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="1039.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="124"><tspan x="50.0" dy="0">10-14</tspan></text><text x="190.0" y="1039.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="764"><tspan x="190.0" dy="0">Moderada</tspan></text><rect x="40.0" y="1049.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="1068.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="124"><tspan x="50.0" dy="0">15-19</tspan></text><text x="190.0" y="1068.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="764"><tspan x="190.0" dy="0">Moderadamente grave</tspan></text><rect x="40.0" y="1078.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="1097.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="124"><tspan x="50.0" dy="0">20 o más</tspan></text><text x="190.0" y="1097.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="764"><tspan x="190.0" dy="0">Grave</tspan></text><text x="40.0" y="1123.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">El PHQ-9 cuantifica la gravedad; el diagnóstico se hace con los criterios del DSM-5-TR.</tspan></text><text x="40.0" y="1170.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1180.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1211.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1211.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Trastorno distímico</tspan></text><text x="435.0" y="1211.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Fobia social</tspan></text><text x="585.0" y="1202.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Obsesivo</tspan><tspan x="585.0" dy="17">compulsivo</tspan></text><rect x="663.0" y="1183.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="1211.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Depresión mayor</tspan></text><text x="885.0" y="1202.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Ansiedad</tspan><tspan x="885.0" dy="17">generalizada</tspan></text><rect x="40.0" y="1234.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="1234.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1263.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico más</tspan><tspan x="54.0" dy="16">probable?</tspan></text><text x="285.0" y="1263.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: exige dos años de</tspan><tspan x="285.0" dy="16">síntomas más leves</tspan></text><text x="435.0" y="1255.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: miedo a la</tspan><tspan x="435.0" dy="16">evaluación social, sin</tspan><tspan x="435.0" dy="16">pérdida de peso</tspan></text><text x="585.0" y="1263.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: obsesiones y</tspan><tspan x="585.0" dy="16">compulsiones</tspan></text><text x="735.0" y="1255.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: síntomas</tspan><tspan x="735.0" dy="16">depresivos con</tspan><tspan x="735.0" dy="16">variación matutina</tspan></text><text x="885.0" y="1255.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: preocupación</tspan><tspan x="885.0" dy="16">excesiva, no</tspan><tspan x="885.0" dy="16">anhedonia</tspan></text><rect x="40.0" y="1180.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1324.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1352.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1374.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• DSM-5-TR: cinco o más síntomas por dos semanas (ánimo deprimido o anhedonia, peso o apetito, sueño, enlentecimiento, fatiga, culpa, concentración,</tspan><tspan x="58.0" dy="18">   ideas de muerte).</tspan><tspan x="58.0" dy="18">• El empeoramiento matutino y la pérdida de peso son la variación diurna del especificador de características melancólicas.</tspan><tspan x="58.0" dy="18">• Distimia: dos años de síntomas más leves. Fobia social y ansiedad generalizada: miedo o preocupación. Obsesivo compulsivo: obsesiones y</tspan><tspan x="58.0" dy="18">   compulsiones.</tspan><tspan x="58.0" dy="18">• Descartar riesgo suicida e hipotiroidismo; medir con PHQ-9; ISRS más psicoterapia, con mejoría esperada en 4 a 6 semanas.</tspan></text><text x="58.0" y="1486.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: APA, DSM-5-TR (2022); Kaplan y Sadock, Sinopsis de Psiquiatría, 12.ª ed. (2021); Harrison, Principios de Medicina Interna, 21.ª ed. (2022).</tspan></text></svg>