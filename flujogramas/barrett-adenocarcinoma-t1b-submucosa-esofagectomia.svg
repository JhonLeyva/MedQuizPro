<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1195" viewBox="0 0 1000 1195" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Adenocarcinoma sobre Barrett T1b: esofagectomía con linfadenectomía"><title>Adenocarcinoma sobre Barrett T1b: esofagectomía con linfadenectomía</title><rect x="0.75" y="0.75" width="998.5" height="1193.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Esófago de Barrett · cáncer temprano de esófago</tspan></text><rect x="490.5" y="32.0" width="101.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="541.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="85"><tspan x="541.2" dy="0">CIRUGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="168.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cáncer de esófago temprano</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Lo que manda es la profundidad: mucosa (T1a) o submucosa (T1b).</tspan><tspan x="58.0" dy="17">En la submucosa hay linfáticos: sube el riesgo de ganglios.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="168.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="166.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 55 años con Barrett de segmento</tspan><tspan x="640.0" dy="17">largo</tspan></text><text x="640.0" y="176.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lesión de 1,5 cm resecada por endoscopía.</tspan><tspan x="640.0" dy="16">Adenocarcinoma que invade la submucosa (T1b); sin</tspan><tspan x="640.0" dy="16">metástasis.</tspan></text><rect x="640.0" y="229.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="242.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="242.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="290.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ PROFUNDIDAD TIENE EL TUMOR</tspan></text><polygon points="220,338.0 260,302.0 740,302.0 780,338.0 740,374.0 260,374.0" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><circle cx="282.0" cy="338.0" r="13" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="282.0" y="343.5" font-size="16" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="282.0" dy="0">?</tspan></text><text x="525.0" y="334.0" font-size="13.5" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="525.0" dy="0">¿Hasta qué capa llega el adenocarcinoma en la pieza</tspan><tspan x="525.0" dy="18">resecada?</tspan></text><line x1="500.0" y1="374.0" x2="500.0" y2="394.0" stroke="#0f766e" stroke-width="2"/><line x1="190.0" y1="394.0" x2="662.0" y2="394.0" stroke="#0f766e" stroke-width="2"/><line x1="190.0" y1="394.0" x2="190.0" y2="423.0" stroke="#0f766e" stroke-width="2"/><polygon points="185.0,422.0 195.0,422.0 190.0,430.0" fill="#0f766e"/><line x1="662.0" y1="394.0" x2="662.0" y2="423.0" stroke="#ea580c" stroke-width="2"/><polygon points="657.0,422.0 667.0,422.0 662.0,430.0" fill="#ea580c"/><rect x="131.6" y="402.0" width="116.7" height="20.0" rx="10" fill="#64748b" stroke="none" stroke-width="1.5"/><text x="190.0" y="416.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">Solo mucosa: T1a</tspan></text><rect x="574.2" y="402.0" width="175.6" height="20.0" rx="10" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="662.0" y="416.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="662.0" dy="0">Submucosa: T1b (este caso)</tspan></text><rect x="40.0" y="430.0" width="300.0" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="431.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="454.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="270"><tspan x="58.0" dy="0">Resección endoscópica</tspan></text><text x="58.0" y="475.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="270"><tspan x="58.0" dy="0">Puede ser curativa si los bordes están libres.</tspan><tspan x="58.0" dy="16">Luego ablación del Barrett residual.</tspan></text><rect x="364.0" y="430.0" width="596.0" height="358.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="844.6" y="419.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="434.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><text x="382.0" y="456.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">Esofagectomía + linfadenectomía</tspan></text><text x="382.0" y="478.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">La submucosa tiene linfáticos: hay que sacar los ganglios regionales.</tspan></text><g transform="translate(452.0,498.0) scale(1.25)"><rect x="20" y="30" width="170" height="30" fill="#fdba74" stroke="#ffffff" stroke-width="1"/><text x="200" y="49.0" font-size="10.5" font-weight="700" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Mucosa (Barrett)</text><text x="200" y="49.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start" data-max="0">Mucosa (Barrett)</text><rect x="20" y="60" width="170" height="8" fill="#f472b6" stroke="#ffffff" stroke-width="1"/><text x="200" y="68.0" font-size="10.5" font-weight="700" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Muscular de la mucosa</text><text x="200" y="68.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start" data-max="0">Muscular de la mucosa</text><rect x="20" y="68" width="170" height="40" fill="#fde68a" stroke="#ffffff" stroke-width="1"/><text x="200" y="92.0" font-size="10.5" font-weight="700" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Submucosa</text><text x="200" y="92.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start" data-max="0">Submucosa</text><rect x="20" y="108" width="170" height="58" fill="#fca5a5" stroke="#ffffff" stroke-width="1"/><text x="200" y="141.0" font-size="10.5" font-weight="700" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Muscular propia</text><text x="200" y="141.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start" data-max="0">Muscular propia</text><rect x="20" y="166" width="170" height="24" fill="#e2e8f0" stroke="#ffffff" stroke-width="1"/><text x="200" y="182.0" font-size="10.5" font-weight="700" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Adventicia (sin serosa)</text><text x="200" y="182.0" font-size="10.5" font-weight="700" fill="#334155" text-anchor="start" data-max="0">Adventicia (sin serosa)</text><text x="20" y="22" font-size="10" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">Luz del órgano</text><text x="200" y="22" font-size="11" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Pared del esófago</text><text x="200" y="22" font-size="11" font-weight="800" fill="#134e4a" text-anchor="start" data-max="0">Pared del esófago</text><path d="M64 26 C60 60 70 96 98 106 C124 100 138 60 132 26 Z" fill="#ea580c" stroke="#9a3412" stroke-width="2" stroke-linejoin="round" opacity="0.9"/><text x="138" y="22" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Tumor</text><text x="138" y="22" font-size="10.5" font-weight="800" fill="#9a3412" text-anchor="start" data-max="0">Tumor</text><line x1="16" y1="32" x2="16" y2="58" stroke="#0f766e" stroke-width="3"/><text x="12" y="49.0" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="end" data-max="0">T1a</text><text x="12" y="49.0" font-size="10" font-weight="800" fill="#134e4a" text-anchor="end" data-max="0">T1a</text><line x1="16" y1="70" x2="16" y2="106" stroke="#0f766e" stroke-width="3"/><text x="12" y="92.0" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="end" data-max="0">T1b</text><text x="12" y="92.0" font-size="10" font-weight="800" fill="#134e4a" text-anchor="end" data-max="0">T1b</text><line x1="16" y1="110" x2="16" y2="164" stroke="#0f766e" stroke-width="3"/><text x="12" y="141.0" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="end" data-max="0">T2</text><text x="12" y="141.0" font-size="10" font-weight="800" fill="#134e4a" text-anchor="end" data-max="0">T2</text></g><text x="382.0" y="770.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">El tumor (naranja) atraviesa la muscular de la mucosa y llega a la submucosa: T1b.</tspan></text><text x="40.0" y="822.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">RIESGO DE GANGLIOS SEGÚN LA PROFUNDIDAD</tspan></text><rect x="40.0" y="832.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="833.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="856.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">T1a</tspan></text><text x="58.0" y="877.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">1-2 %: la endoscopía basta.</tspan></text><rect x="351.3" y="832.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="352.3" y="833.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="369.3" y="856.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">T1b</tspan></text><text x="369.3" y="877.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">20-25 %: cirugía con ganglios.</tspan></text><rect x="548.8" y="821.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="594.3" y="836.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="594.3" dy="0">◆ ESTE CASO</tspan></text><rect x="662.7" y="832.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="833.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="856.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">T2 o más, o N+</tspan></text><text x="680.7" y="877.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Neoadyuvancia y luego esofagectomía.</tspan></text><text x="40.0" y="941.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="951.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="973.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="973.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Resección ampliada</tspan></text><text x="491.2" y="973.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Seguimiento</tspan></text><text x="678.8" y="973.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Mucosectomía + IBP</tspan></text><rect x="775.5" y="954.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="973.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Esofagectomía + ganglios</tspan></text><rect x="40.0" y="988.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="988.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1009.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Controla los ganglios?</tspan></text><text x="303.8" y="1009.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No</tspan></text><text x="491.2" y="1009.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No</tspan></text><text x="678.8" y="1009.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No</tspan></text><text x="866.2" y="1009.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Sí</tspan></text><rect x="40.0" y="951.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1046.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1074.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1096.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• T1a (mucosa): la resección endoscópica puede curar (riesgo ganglionar 1-2 %).</tspan><tspan x="58.0" dy="18">• T1b (submucosa): riesgo ganglionar ~20-25 %: esofagectomía con linfadenectomía.</tspan><tspan x="58.0" dy="18">• Seguir solo con endoscopías deja crecer una enfermedad que puede estar en los ganglios.</tspan></text><text x="58.0" y="1154.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: NCCN, cáncer de esófago (2024); Sabiston Tratado de Cirugía 21.ª ed..</tspan></text></svg>