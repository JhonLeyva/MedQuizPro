<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1174" viewBox="0 0 1000 1174" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La complicación más frecuente de la varicela es la sobreinfección bacteriana de la piel"><title>La complicación más frecuente de la varicela es la sobreinfección bacteriana de la piel</title><rect x="0.75" y="0.75" width="998.5" height="1172.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · varicela</tspan></text><rect x="310.7" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="359.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="359.8" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="131.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Varicela</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección primaria por virus varicela-zóster, muy contagiosa: vesículas en brotes, fiebre baja</tspan><tspan x="58.0" dy="17">y prurito.</tspan><tspan x="58.0" dy="17">Evoluciona a costras.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="131.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="129.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es la complicación más frecuente de la varicela?</tspan></text><rect x="640.0" y="192.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="205.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="205.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="253.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">COMPLICACIONES DE LA VARICELA, DE LA MÁS A LA MENOS FRECUENTE</tspan></text><polygon points="200.0,265.0 300.0,265.0 340.0,321.0 160.0,321.0" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="298.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="88"><tspan x="250.0" dy="0">1</tspan></text><rect x="486.0" y="265.0" width="474.0" height="56.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="501.0" y="289.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Sobreinfección bacteriana de la piel</tspan></text><text x="501.0" y="306.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">S. aureus y S. pyogenes: impétigo, celulitis, abscesos; grave: fascitis necrosante</tspan></text><rect x="858.2" y="254.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="903.6" y="269.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="903.6" dy="0">◆ ESTE CASO</tspan></text><polygon points="160.0,327.0 340.0,327.0 380.0,383.0 120.0,383.0" fill="#99f6e4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="360.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="168"><tspan x="250.0" dy="0">2</tspan></text><rect x="486.0" y="327.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="351.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Complicaciones neurológicas</tspan></text><text x="501.0" y="368.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Ataxia cerebelosa aguda, la más común; encefalitis, rara</tspan></text><polygon points="120.0,389.0 380.0,389.0 420.0,445.0 80.0,445.0" fill="#5eead4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="422.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="248"><tspan x="250.0" dy="0">3</tspan></text><rect x="486.0" y="389.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="413.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Neumonía varicelosa primaria</tspan></text><text x="501.0" y="430.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Adulto, embarazo e inmunodeprimidos</tspan></text><polygon points="80.0,451.0 420.0,451.0 460.0,507.0 40.0,507.0" fill="#2dd4bf" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="484.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="328"><tspan x="250.0" dy="0">4</tspan></text><rect x="486.0" y="451.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="475.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Pancreatitis y glomerulonefritis</tspan></text><text x="501.0" y="492.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Excepcionales</tspan></text><text x="250.0" y="525.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="420"><tspan x="250.0" dy="0">▲ más frecuente · ▼ menos frecuente</tspan></text><rect x="40.0" y="547.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="573.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Varicela = complicación cutánea bacteriana</tspan></text><text x="60.0" y="592.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La neumonía es del adulto y del inmunodeprimido; la encefalitis es rara.</tspan></text><text x="40.0" y="653.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">COMPLICACIONES DE LA VARICELA Y A QUIÉN AFECTAN</tspan></text><rect x="40.0" y="665.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="684.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="304"><tspan x="50.0" dy="0">Complicación</tspan></text><text x="370.0" y="684.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="284"><tspan x="370.0" dy="0">Quién</tspan></text><text x="670.0" y="684.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="284"><tspan x="670.0" dy="0">Dato clave</tspan></text><rect x="40.0" y="694.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="713.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="304"><tspan x="50.0" dy="0">Sobreinfección de la piel</tspan></text><text x="370.0" y="713.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="284"><tspan x="370.0" dy="0">Niño sano</tspan></text><text x="670.0" y="713.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="284"><tspan x="670.0" dy="0">S. aureus y estreptococo A; evitar AINE</tspan></text><rect x="260.6" y="697.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="306.0" y="712.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="306.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="723.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="742.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="50.0" dy="0">Ataxia cerebelosa y encefalitis</tspan></text><text x="370.0" y="742.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="284"><tspan x="370.0" dy="0">Niño</tspan></text><text x="670.0" y="742.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="284"><tspan x="670.0" dy="0">La ataxia es la más común de las neurológicas</tspan></text><rect x="40.0" y="752.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="771.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="50.0" dy="0">Neumonía varicelosa</tspan></text><text x="370.0" y="771.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="284"><tspan x="370.0" dy="0">Adulto, gestante e inmunodeprimido</tspan></text><text x="670.0" y="771.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="284"><tspan x="670.0" dy="0">Aciclovir intravenoso</tspan></text><rect x="40.0" y="781.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="800.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="50.0" dy="0">Síndrome de Reye</tspan></text><text x="370.0" y="800.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="284"><tspan x="370.0" dy="0">Niño con ácido acetilsalicílico</tspan></text><text x="670.0" y="800.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="284"><tspan x="670.0" dy="0">El salicilato está contraindicado</tspan></text><text x="40.0" y="850.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="860.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="882.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="863.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="882.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Infecciones de piel</tspan></text><text x="435.0" y="882.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Neumonía</tspan></text><text x="585.0" y="882.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Encefalitis</tspan></text><text x="735.0" y="882.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Pancreatitis</tspan></text><text x="885.0" y="882.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Glomerulonefritis</tspan></text><rect x="40.0" y="897.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="897.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="918.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Complicación más</tspan><tspan x="54.0" dy="16">frecuente?</tspan></text><text x="285.0" y="918.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: sobreinfección de</tspan><tspan x="285.0" dy="16">las lesiones</tspan></text><text x="435.0" y="918.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es típica del adulto</tspan><tspan x="435.0" dy="16">y del inmunodeprimido</tspan></text><text x="585.0" y="926.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es rara</tspan></text><text x="735.0" y="926.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es excepcional</tspan></text><text x="885.0" y="926.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es excepcional</tspan></text><rect x="40.0" y="860.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="971.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="999.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1021.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Piel: sobreinfección por S. aureus y S. pyogenes (impétigo, celulitis, abscesos y, grave, fascitis necrosante o shock tóxico); el rascado y los AINE la</tspan><tspan x="58.0" dy="18">   favorecen.</tspan><tspan x="58.0" dy="18">• Neurológicas: la ataxia cerebelosa aguda es la más común; la encefalitis es rara. La neumonía primaria es del adulto, el embarazo y el inmunodeprimido.</tspan><tspan x="58.0" dy="18">• Pancreatitis y glomerulonefritis son excepcionales. El síndrome de Reye se asocia a ácido acetilsalicílico, contraindicado.</tspan><tspan x="58.0" dy="18">• Aciclovir en inmunodeprimidos, adolescentes, adultos y casos graves. Alerta: fiebre alta persistente o dolor desproporcionado con eritema sugiere</tspan><tspan x="58.0" dy="18">   infección invasiva por estreptococo A.</tspan></text><text x="58.0" y="1133.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAP Red Book 2024-2027 (33.ª ed., 2024); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>