<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="825" viewBox="0 0 1000 825" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Choque refractario en la puérpera"><title>Choque refractario en la puérpera</title><rect x="0.75" y="0.75" width="998.5" height="823.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">ENDOCRINOLOGÍA ENAM: SÍNDROME DE SHEEHAN</tspan></text><rect x="513.3" y="32.0" width="121.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="573.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="105"><tspan x="573.9" dy="0">ENDOCRINOLOGÍA</tspan></text><rect x="40.0" y="90.0" width="560.0" height="168.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Síndrome de Sheehan</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Necrosis hipofisaria por hemorragia obstétrica grave</tspan><tspan x="58.0" dy="17">Agalactia, luego falla suprarrenal: choque que no responde a líquidos e hipoglucemia</tspan></text><rect x="620.0" y="90.0" width="340.0" height="168.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="166.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Puérpera de 22 años, parto con gran</tspan><tspan x="640.0" dy="17">hemorragia hace 1 semana</tspan></text><text x="640.0" y="176.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">No puede lactar · cefalea intensa · desorientada</tspan><tspan x="640.0" dy="16">PA 60/30 · FC 148 · glucosa 45 · no responde a</tspan><tspan x="640.0" dy="16">expansores</tspan></text><rect x="640.0" y="229.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="242.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="242.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="290.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EMBUDO DIAGNÓSTICO</tspan></text><text x="614.0" y="314.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,326.0 580.0,326.0 531.7,402.0 88.3,402.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="342.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="374.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="399"><tspan x="310.0" dy="0">Choque en la puérpera</tspan></text><line x1="559.8" y1="364.0" x2="606.0" y2="364.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="335.0" width="114.2" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="671.1" y="352.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="671.1" dy="0">Crisis suprarrenal</tspan></text><rect x="734.2" y="335.0" width="126.7" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="797.6" y="352.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="797.6" dy="0">Shock hipovolémico</tspan></text><rect x="614.0" y="367.0" width="110.3" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="669.2" y="384.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="669.2" dy="0">Sepsis puerperal</tspan></text><rect x="730.3" y="367.0" width="96.6" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="778.6" y="384.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="778.6" dy="0">Hipotiroidismo</tspan></text><polygon points="88.3,406.0 531.7,406.0 483.3,462.0 136.7,462.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="162.7" cy="434.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="162.7" y="438.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="162.7" dy="0">1</tspan></text><text x="320.0" y="438.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="283"><tspan x="320.0" dy="0">No responde a expansores plasmáticos</tspan></text><line x1="511.5" y1="434.0" x2="606.0" y2="434.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="421.0" width="138.8" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="683.4" y="438.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="683.4" dy="0">✕ Shock hipovolémico</tspan></text><line x1="636.0" y1="434.5" x2="742.8" y2="434.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="136.7,466.0 483.3,466.0 435.0,526.0 185.0,526.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="496.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="500.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">2</tspan></text><text x="320.0" y="492.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">Agalactia + hipoglucemia,</tspan><tspan x="320.0" dy="17">leucocitos normales</tspan></text><line x1="463.2" y1="496.0" x2="606.0" y2="496.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="483.0" width="122.4" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="675.2" y="500.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="675.2" dy="0">✕ Sepsis puerperal</tspan></text><line x1="636.0" y1="496.5" x2="726.4" y2="496.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="742.4" y="483.0" width="108.7" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="796.7" y="500.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="796.7" dy="0">✕ Hipotiroidismo</tspan></text><line x1="764.4" y1="496.5" x2="841.1" y2="496.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="530.0" x2="310.0" y2="549.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,548.0 315.0,548.0 310.0,556.0" fill="#0f766e"/><rect x="140.0" y="560.0" width="340.0" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="589.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">CRISIS SUPRARRENAL (SHEEHAN)</tspan></text><text x="310.0" y="613.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Hidrocortisona 100 mg EV primero</tspan><tspan x="310.0" dy="17">Luego glucosa y demás hormonas</tspan></text><rect x="370.6" y="549.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="564.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="567.9" width="346.0" height="76.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="587.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="605.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">Dar tiroxina antes que corticoide puede precipitar más la</tspan><tspan x="628.0" dy="16">crisis suprarrenal.</tspan></text><rect x="40.0" y="675.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="703.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="725.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La hipófisis crece en el embarazo y es sensible a la hipotensión.</tspan><tspan x="58.0" dy="18">• Confirmar luego con cortisol, ACTH, TSH, T4L, prolactina.</tspan><tspan x="58.0" dy="18">• Reemplazo de por vida de las hormonas deficientes.</tspan></text><text x="58.0" y="783.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Endocrine Society – Hormonal replacement in hypopituitarism (2016) · Harrison. Principios de Medicina Interna 22.ª ed. (2025)</tspan></text></svg>