<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1047" viewBox="0 0 1000 1047" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La enfermedad inflamatoria pélvica se transmite sobre todo por vía ascendente desde el cérvix"><title>La enfermedad inflamatoria pélvica se transmite sobre todo por vía ascendente desde el cérvix</title><rect x="0.75" y="0.75" width="998.5" height="1045.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ginecología · vía de propagación de la EIP</tspan></text><rect x="450.2" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="529.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="529.9" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Enfermedad inflamatoria pélvica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección del tracto genital superior: endometrio, trompas, ovarios y peritoneo pélvico.</tspan><tspan x="58.0" dy="17">Los microorganismos ascienden desde el cérvix y la vagina.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es la vía de transmisión más frecuente de la</tspan><tspan x="640.0" dy="16">enfermedad inflamatoria pélvica?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">POR DÓNDE ASCIENDE LA INFECCIÓN EN LA ENFERMEDAD INFLAMATORIA PÉLVICA</tspan></text><rect x="40.0" y="269.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="145.2" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Cérvix y vagina</tspan></text><text x="145.2" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Chlamydia, gonococo y flora</tspan><tspan x="145.2" dy="16">polimicrobiana</tspan></text><line x1="253.5" y1="306.5" x2="266.5" y2="306.5" stroke="#0f766e" stroke-width="2"/><polygon points="265.5,301.5 265.5,311.5 273.5,306.5" fill="#0f766e"/><line x1="145.2" y1="346.0" x2="145.2" y2="360.0" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="40.0" y="362.0" width="210.5" height="64.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="145.2" y="376.0" font-size="9.5" font-weight="800" font-style="normal" fill="#ffedd5" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">✂ CORTA</tspan></text><text x="145.2" y="393.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Tamizar y tratar ITS</tspan></text><rect x="106.7" y="415.0" width="77.2" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="145.2" y="430.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="145.2" dy="0">◆ ESTA VÍA</tspan></text><rect x="276.5" y="269.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="381.8" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Endometrio</tspan></text><text x="381.8" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Endometritis; el DIU o la</tspan><tspan x="381.8" dy="16">menstruación ayudan</tspan></text><line x1="490.0" y1="306.5" x2="503.0" y2="306.5" stroke="#0f766e" stroke-width="2"/><polygon points="502.0,301.5 502.0,311.5 510.0,306.5" fill="#0f766e"/><line x1="381.8" y1="346.0" x2="381.8" y2="360.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="276.5" y="362.0" width="210.5" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="381.8" y="376.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">✂ CORTA</tspan></text><text x="381.8" y="393.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Evitar procedimientos sin tratar</tspan></text><rect x="513.0" y="269.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="618.2" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Trompas y ovarios</tspan></text><text x="618.2" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Salpingitis y absceso tuboovárico</tspan></text><line x1="726.5" y1="306.5" x2="739.5" y2="306.5" stroke="#0f766e" stroke-width="2"/><polygon points="738.5,301.5 738.5,311.5 746.5,306.5" fill="#0f766e"/><line x1="618.2" y1="346.0" x2="618.2" y2="360.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="513.0" y="362.0" width="210.5" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="618.2" y="376.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">✂ CORTA</tspan></text><text x="618.2" y="393.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Tratamiento oportuno evita</tspan><tspan x="618.2" dy="16">infertilidad</tspan></text><rect x="749.5" y="269.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="854.8" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Peritoneo pélvico</tspan></text><text x="854.8" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Pelviperitonitis y Fitz-Hugh-Curtis</tspan></text><line x1="854.8" y1="346.0" x2="854.8" y2="360.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="749.5" y="362.0" width="210.5" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="854.8" y="376.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">✂ CORTA</tspan></text><text x="854.8" y="393.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Hospitalizar si hay absceso</tspan></text><rect x="40.0" y="456.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="482.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Vía ascendente = EIP</tspan></text><text x="60.0" y="501.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La hematógena, la linfática y la de continuidad son otros mecanismos, menos frecuentes.</tspan></text><text x="40.0" y="562.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">VÍAS DE PROPAGACIÓN DE LA INFECCIÓN PÉLVICA</tspan></text><rect x="40.0" y="574.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="593.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="304"><tspan x="50.0" dy="0">Vía</tspan></text><text x="370.0" y="593.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="584"><tspan x="370.0" dy="0">Situación típica</tspan></text><rect x="40.0" y="603.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="622.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="304"><tspan x="50.0" dy="0">Ascendente (la más frecuente)</tspan></text><text x="370.0" y="622.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="584"><tspan x="370.0" dy="0">Enfermedad inflamatoria pélvica por Chlamydia, gonococo y flora vaginal</tspan></text><rect x="260.6" y="606.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="306.0" y="621.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="306.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="632.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="651.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="50.0" dy="0">Hemática</tspan></text><text x="370.0" y="651.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="584"><tspan x="370.0" dy="0">Tuberculosis genital</tspan></text><rect x="40.0" y="661.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="680.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="50.0" dy="0">Linfática</tspan></text><text x="370.0" y="680.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="584"><tspan x="370.0" dy="0">Puerperio y aborto séptico (parametritis)</tspan></text><rect x="40.0" y="690.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="709.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="50.0" dy="0">Por continuidad</tspan></text><text x="370.0" y="709.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="584"><tspan x="370.0" dy="0">Apendicitis o diverticulitis</tspan></text><text x="40.0" y="759.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="769.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="791.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="791.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hemática</tspan></text><rect x="363.0" y="772.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="791.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Ascendente</tspan></text><text x="585.0" y="791.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Sistémica</tspan></text><text x="735.0" y="791.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Linfática</tspan></text><text x="885.0" y="791.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Continuidad</tspan></text><rect x="40.0" y="806.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="806.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="835.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Vía más frecuente?</tspan></text><text x="285.0" y="827.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: típica de la</tspan><tspan x="285.0" dy="16">tuberculosis genital</tspan></text><text x="435.0" y="827.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: asciende desde el</tspan><tspan x="435.0" dy="16">cérvix</tspan></text><text x="585.0" y="827.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no es la vía</tspan><tspan x="585.0" dy="16">habitual</tspan></text><text x="735.0" y="827.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: típica del puerperio</tspan><tspan x="735.0" dy="16">y del aborto séptico</tspan></text><text x="885.0" y="827.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: de apendicitis o</tspan><tspan x="885.0" dy="16">diverticulitis</tspan></text><rect x="40.0" y="769.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="880.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="908.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="930.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Chlamydia trachomatis y Neisseria gonorrhoeae inician el cuadro; la flora vaginal polimicrobiana asciende, sobre todo con la menstruación o tras un DIU.</tspan><tspan x="58.0" dy="18">• Criterios mínimos CDC 2021: dolor pélvico o abdominal bajo con dolor a la movilización cervical, uterina o anexial; basta uno para tratar.</tspan><tspan x="58.0" dy="18">• Vía hematógena: tuberculosis genital; linfática: puerperio y aborto séptico; por continuidad: apendicitis o diverticulitis.</tspan><tspan x="58.0" dy="18">• Secuelas: infertilidad tubárica, embarazo ectópico y dolor pélvico crónico; Fitz-Hugh-Curtis es la perihepatitis asociada.</tspan></text><text x="58.0" y="1006.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, STI Treatment Guidelines 2021. MMWR 2021;70(4):1-187; NTS 240-MINSA/DGIESP-2026; Berek y Novak Ginecología 16.ª ed. (2020)</tspan></text></svg>