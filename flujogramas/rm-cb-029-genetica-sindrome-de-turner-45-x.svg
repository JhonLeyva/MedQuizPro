<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Talla baja, cuello corto, linfedema, tórax ancho y amenorrea primaria: síndrome de Turner"><title>Talla baja, cuello corto, linfedema, tórax ancho y amenorrea primaria: síndrome de Turner</title><rect x="0.75" y="0.75" width="998.5" height="1048.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Genética · síndrome de Turner (45,X)</tspan></text><rect x="416.5" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="488.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="488.4" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Síndrome de Turner</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ausencia total o parcial de un cromosoma X (45,X o mosaicos).</tspan><tspan x="58.0" dy="17">Disgenesia gonadal con gonadotropinas elevadas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 18 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Baja estatura, cuello corto, linfedema en piernas,</tspan><tspan x="640.0" dy="16">malformaciones óseas, tórax ancho con pezones</tspan><tspan x="640.0" dy="16">separados.</tspan><tspan x="640.0" dy="16">Nunca ha menstruado ni tiene maduración sexual.</tspan></text><line x1="640.0" y1="237.0" x2="670.0" y2="237.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">HALLAZGOS DE LA PACIENTE QUE CUADRAN CON 45,X</tspan></text><line x1="406.0" y1="443.0" x2="340.0" y2="443.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="443.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="420.3" y1="492.8" x2="340.0" y2="543.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="543.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="415.0" x2="660.0" y2="393.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="393.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="471.0" x2="660.0" y2="493.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="493.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="420.3" y1="393.2" x2="340.0" y2="343.0" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="343.0" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="443.0" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="443.0" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="448.0" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">TURNER</tspan></text><text x="500.0" y="467.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">cariotipo 45,X</tspan></text><rect x="40.0" y="301.0" width="300.0" height="84.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="334.7" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">TALLA BAJA</tspan></text><text x="190.0" y="358.4" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Déficit del gen SHOX</tspan></text><rect x="144.6" y="375.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="390.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="401.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="402.0" width="6.0" height="82.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="434.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">CUELLO CORTO</tspan></text><text x="190.0" y="458.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Pterigium colli</tspan></text><rect x="40.0" y="501.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="502.0" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="190.0" y="534.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">LINFEDEMA</tspan></text><text x="190.0" y="558.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Piernas, desde el nacimiento</tspan></text><rect x="660.0" y="351.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="352.0" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="384.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">TÓRAX EN ESCUDO</tspan></text><text x="810.0" y="408.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Pezones muy separados</tspan></text><rect x="660.0" y="451.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="452.0" width="6.0" height="82.0" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="484.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">AMENORREA PRIMARIA</tspan></text><text x="810.0" y="508.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Disgenesia gonadal, FSH alta</tspan></text><text x="40.0" y="621.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="633.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="666.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Falta total o parcial de un X</tspan></text><line x1="248.5" y1="662.0" x2="267.5" y2="662.0" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,657.0 266.5,667.0 274.5,662.0" fill="#0f766e"/><rect x="278.5" y="633.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="666.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Disgenesia gonadal</tspan></text><line x1="487.0" y1="662.0" x2="506.0" y2="662.0" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,657.0 505.0,667.0 513.0,662.0" fill="#0f766e"/><rect x="517.0" y="633.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="666.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Sin estrógenos: infantilismo</tspan></text><line x1="725.5" y1="662.0" x2="744.5" y2="662.0" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,657.0 743.5,667.0 751.5,662.0" fill="#0f766e"/><rect x="755.5" y="633.0" width="204.5" height="58.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="657.5" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Reemplazo estrogénico y</tspan><tspan x="857.8" dy="17">vigilancia cardiaca</tspan></text><text x="40.0" y="731.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="741.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="763.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="744.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="763.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Turner</tspan></text><text x="435.0" y="763.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Down</tspan></text><text x="585.0" y="763.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Klinefelter</tspan></text><text x="735.0" y="763.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Angelman</tspan></text><text x="885.0" y="763.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Prader-Willi</tspan></text><rect x="40.0" y="778.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="778.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="815.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Síndrome?</tspan></text><text x="285.0" y="807.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: 45,X con talla baja</tspan><tspan x="285.0" dy="16">y amenorrea primaria</tspan></text><text x="435.0" y="799.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: trisomía 21, con</tspan><tspan x="435.0" dy="16">facies y cardiopatía</tspan><tspan x="435.0" dy="16">típicas</tspan></text><text x="585.0" y="807.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: 47,XXY, varones</tspan><tspan x="585.0" dy="16">con hipogonadismo</tspan></text><text x="735.0" y="799.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: impronta en</tspan><tspan x="735.0" dy="16">15q11-q13, con ataxia</tspan><tspan x="735.0" dy="16">y convulsiones</tspan></text><text x="885.0" y="799.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: impronta en</tspan><tspan x="885.0" dy="16">15q11-q13, con</tspan><tspan x="885.0" dy="16">hiperfagia y obesidad</tspan></text><rect x="40.0" y="741.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="868.0" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="896.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="918.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Fenotipo: talla baja, pterigium colli, tórax en escudo, linfedema al nacer, cubitus valgus y amenorrea primaria con infantilismo sexual.</tspan><tspan x="58.0" dy="18">• Asociaciones: coartación de aorta, válvula aórtica bicúspide, riñón en herradura, hipotiroidismo autoinmune y enfermedad celíaca.</tspan><tspan x="58.0" dy="18">• Tratamiento: hormona de crecimiento en la infancia y reemplazo estrogénico para la pubertad, con vigilancia cardiaca (Gravholt, Eur J Endocrinol 2024).</tspan><tspan x="58.0" dy="18">• Diferenciar: Down es trisomía 21, Klinefelter es 47,XXY en varones; Angelman y Prader-Willi son de impronta en 15q11-q13.</tspan></text><text x="58.0" y="994.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Gravholt et al., Clinical practice guidelines for the care of girls and women with Turner syndrome (Eur J Endocrinol 2024;190:G53); Thompson &amp; Thompson Genética en</tspan><tspan x="58.0" dy="15">Medicina 8.ª ed.</tspan></text></svg>