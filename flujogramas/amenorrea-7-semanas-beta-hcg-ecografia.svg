<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="853" viewBox="0 0 1000 853" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Mujer joven con 7 semanas de amenorrea secundaria: lo primero es descartar embarazo con beta-hCG y ecografía transvaginal"><title>Mujer joven con 7 semanas de amenorrea secundaria: lo primero es descartar embarazo con beta-hCG y ecografía transvaginal</title><rect x="0.75" y="0.75" width="998.5" height="851.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Amenorrea secundaria</tspan></text><rect x="335.4" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="422.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="422.5" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Amenorrea secundaria</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ausencia de regla por ≥ 3 meses (o 3 ciclos) en quien ya menstruaba; en la práctica se</tspan><tspan x="58.0" dy="17">estudia antes si hay sospecha.</tspan><tspan x="58.0" dy="17">La causa más frecuente en edad fértil es el embarazo: siempre se descarta primero.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 21 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Amenorrea secundaria de 7 semanas.</tspan><tspan x="640.0" dy="16">¿Qué va primero en el plan de trabajo?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EL ORDEN DE ESTUDIO DE LA AMENORREA SECUNDARIA</tspan></text><line x1="155.0" y1="295.0" x2="293.0" y2="295.0" stroke="#99f6e4" stroke-width="6"/><line x1="339.0" y1="295.0" x2="477.0" y2="295.0" stroke="#99f6e4" stroke-width="6"/><line x1="523.0" y1="295.0" x2="661.0" y2="295.0" stroke="#99f6e4" stroke-width="6"/><line x1="707.0" y1="295.0" x2="845.0" y2="295.0" stroke="#99f6e4" stroke-width="6"/><circle cx="132.0" cy="295.0" r="22" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><text x="132.0" y="299.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="38"><tspan x="132.0" dy="0">1</tspan></text><rect x="45.0" y="329.0" width="174.0" height="76.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="132.0" y="349.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">Beta-hCG + eco</tspan></text><text x="132.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">Descartar embarazo</tspan></text><rect x="92.5" y="394.0" width="78.9" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="132.0" y="409.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="132.0" dy="0">◆ PRIMERO</tspan></text><circle cx="316.0" cy="295.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="316.0" y="299.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="316.0" dy="0">2</tspan></text><rect x="229.0" y="329.0" width="174.0" height="76.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="316.0" y="349.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">TSH y prolactina</tspan></text><text x="316.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">Tiroides e hiperprolactinemia</tspan></text><circle cx="500.0" cy="295.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="299.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="500.0" dy="0">3</tspan></text><rect x="413.0" y="329.0" width="174.0" height="76.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="349.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">Prueba de progestágeno</tspan></text><text x="500.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">¿Hay estrógeno y útero sano?</tspan></text><circle cx="684.0" cy="295.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="684.0" y="299.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="684.0" dy="0">4</tspan></text><rect x="597.0" y="329.0" width="174.0" height="76.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="684.0" y="349.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">Estrógeno +</tspan><tspan x="684.0" dy="17">progestágeno</tspan></text><text x="684.0" y="383.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">Si no sangró</tspan></text><circle cx="868.0" cy="295.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="868.0" y="299.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="868.0" dy="0">5</tspan></text><rect x="781.0" y="329.0" width="174.0" height="76.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="868.0" y="349.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">FSH y LH</tspan></text><text x="868.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">Ovario o hipotálamo</tspan></text><rect x="40.0" y="437.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="463.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Primero beta-hCG y ecografía transvaginal</tspan></text><text x="60.0" y="482.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">En una mujer de 21 años con 7 semanas de atraso, el embarazo va primero.</tspan></text><text x="40.0" y="549.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="559.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="598.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="590.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">FSH, prolactina y</tspan><tspan x="285.0" dy="17">TSH</tspan></text><rect x="363.0" y="562.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="581.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Beta-hCG y</tspan><tspan x="435.0" dy="17">ecografía</tspan><tspan x="435.0" dy="17">transvaginal</tspan></text><text x="585.0" y="581.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Dosaje de</tspan><tspan x="585.0" dy="17">estrógeno y</tspan><tspan x="585.0" dy="17">progesterona</tspan></text><text x="735.0" y="590.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Prolactina si</tspan><tspan x="735.0" dy="17">hubiera galactorrea</tspan></text><text x="885.0" y="590.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Tomografía de silla</tspan><tspan x="885.0" dy="17">turca</tspan></text><rect x="40.0" y="630.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="630.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="659.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Primer paso?</tspan></text><text x="285.0" y="651.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: después de</tspan><tspan x="285.0" dy="16">descartar embarazo</tspan></text><text x="435.0" y="651.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: el embarazo es la</tspan><tspan x="435.0" dy="16">causa más frecuente</tspan></text><text x="585.0" y="659.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: poco útil al inicio</tspan></text><text x="735.0" y="651.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: después del</tspan><tspan x="735.0" dy="16">embarazo</tspan></text><text x="885.0" y="651.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: solo si la prolactina</tspan><tspan x="885.0" dy="16">es alta</tspan></text><rect x="40.0" y="559.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="704.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="732.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="754.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Si la beta-hCG es negativa: TSH y prolactina; luego prueba de progestágeno.</tspan><tspan x="58.0" dy="18">• Sin sangrado con progestágeno: prueba con estrógeno + progestágeno y FSH/LH (falla ovárica o hipotalámica).</tspan><tspan x="58.0" dy="18">• Buscar síndrome de ovario poliquístico (hirsutismo, acné, ovarios), estrés, baja de peso, ejercicio.</tspan></text><text x="58.0" y="812.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ASRM, amenorrea (2008; act.); ACOG; MINSA Perú.</tspan></text></svg>