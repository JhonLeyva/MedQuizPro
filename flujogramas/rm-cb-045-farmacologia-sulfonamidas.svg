<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1035" viewBox="0 0 1000 1035" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Sulfonamidas: inhibición competitiva de la dihidropteroato sintetasa"><title>Sulfonamidas: inhibición competitiva de la dihidropteroato sintetasa</title><rect x="0.75" y="0.75" width="998.5" height="1033.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Farmacología · sulfonamidas</tspan></text><rect x="372.2" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="444.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="444.2" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Mecanismo de las sulfonamidas</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Son análogos estructurales del ácido para-aminobenzoico (PABA).</tspan><tspan x="58.0" dy="17">Bloquean la síntesis bacteriana de ácido fólico.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es el mecanismo de acción de las sulfonamidas?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO BLOQUEAN LAS SULFONAMIDAS LA SÍNTESIS DE FOLATO</tspan></text><text x="40.0" y="265.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="430"><tspan x="40.0" dy="0">PASO EN LA BACTERIA</tspan></text><text x="516.0" y="265.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="444"><tspan x="516.0" dy="0">QUÉ BLOQUEA CADA FÁRMACO</tspan></text><rect x="40.0" y="275.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="304.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="309.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><text x="84.0" y="301.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">PABA</tspan></text><text x="84.0" y="318.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Sustrato bacteriano para fabricar folato</tspan></text><line x1="476.0" y1="304.5" x2="503.0" y2="304.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,299.5 502.0,309.5 510.0,304.5" fill="#ea580c"/><rect x="516.0" y="277.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="301.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Sulfonamida: análogo del PABA</tspan></text><text x="530.0" y="318.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Compite por la misma enzima</tspan></text><line x1="255.0" y1="336.0" x2="255.0" y2="349.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,348.0 260.0,348.0 255.0,356.0" fill="#0f766e"/><rect x="40.0" y="358.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="387.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">2</tspan></text><text x="84.0" y="384.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Dihidropteroato sintetasa</tspan></text><text x="84.0" y="401.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Une el PABA con la pteridina</tspan></text><line x1="476.0" y1="387.5" x2="503.0" y2="387.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,382.5 502.0,392.5 510.0,387.5" fill="#ea580c"/><rect x="516.0" y="360.0" width="444.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="530.0" y="384.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Inhibición competitiva</tspan></text><text x="530.0" y="401.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Mecanismo de las sulfonamidas</tspan></text><line x1="255.0" y1="419.0" x2="255.0" y2="432.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,431.0 260.0,431.0 255.0,439.0" fill="#0f766e"/><rect x="40.0" y="441.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="470.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="475.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">3</tspan></text><text x="84.0" y="467.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Dihidrofolato reductasa</tspan></text><text x="84.0" y="484.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Forma tetrahidrofolato</tspan></text><line x1="476.0" y1="470.5" x2="503.0" y2="470.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,465.5 502.0,475.5 510.0,470.5" fill="#ea580c"/><rect x="516.0" y="443.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="467.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Trimetoprima bloquea aquí</tspan></text><text x="530.0" y="484.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">El cotrimoxazol suma ambos pasos</tspan></text><line x1="255.0" y1="502.0" x2="255.0" y2="515.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,514.0 260.0,514.0 255.0,522.0" fill="#0f766e"/><rect x="40.0" y="524.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="553.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="558.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">4</tspan></text><text x="84.0" y="550.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Tetrahidrofolato</tspan></text><text x="84.0" y="567.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Necesario para purinas, timidina y ADN</tspan></text><line x1="476.0" y1="553.5" x2="503.0" y2="553.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,548.5 502.0,558.5 510.0,553.5" fill="#ea580c"/><rect x="516.0" y="526.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="550.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Sin folato, sin ADN</tspan></text><text x="530.0" y="567.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Efecto bacteriostático</tspan></text><rect x="40.0" y="601.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="627.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Sulfonamida = análogo del PABA que inhibe la dihidropteroato sintetasa</tspan></text><text x="60.0" y="646.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Transpeptidasa: betalactámicos; ADN girasa: quinolonas; subunidad 30S: tetraciclinas.</tspan></text><text x="40.0" y="713.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="723.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="762.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="754.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Inhibición de la</tspan><tspan x="285.0" dy="17">transpeptidasa</tspan></text><text x="435.0" y="754.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Inhibición de la</tspan><tspan x="435.0" dy="17">DNA girasa</tspan></text><rect x="513.0" y="726.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Inhibición de la</tspan><tspan x="585.0" dy="17">dihidropteroato</tspan><tspan x="585.0" dy="17">sintetasa</tspan></text><text x="735.0" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Unión a la</tspan><tspan x="735.0" dy="17">subunidad 30S</tspan><tspan x="735.0" dy="17">ribosomal</tspan></text><text x="885.0" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Inhibición de las</tspan><tspan x="885.0" dy="17">enzimas CYP</tspan><tspan x="885.0" dy="17">hepáticas</tspan></text><rect x="40.0" y="794.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="794.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="815.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Mecanismo de las</tspan><tspan x="54.0" dy="16">sulfonamidas?</tspan></text><text x="285.0" y="815.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es de los</tspan><tspan x="285.0" dy="16">betalactámicos</tspan></text><text x="435.0" y="815.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es de las</tspan><tspan x="435.0" dy="16">quinolonas</tspan></text><text x="585.0" y="815.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: análogo del PABA</tspan><tspan x="585.0" dy="16">en la síntesis de folato</tspan></text><text x="735.0" y="815.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es de tetraciclinas</tspan><tspan x="735.0" dy="16">y aminoglucósidos</tspan></text><text x="885.0" y="815.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no actúan sobre el</tspan><tspan x="885.0" dy="16">citocromo</tspan></text><rect x="40.0" y="723.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="868.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="896.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="918.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Compiten con el PABA por la dihidropteroato sintetasa: sin folato no hay purinas ni ADN; son bacteriostáticas.</tspan><tspan x="58.0" dy="18">• La célula humana no se afecta porque capta el folato ya formado de la dieta.</tspan><tspan x="58.0" dy="18">• Trimetoprima inhibe el paso siguiente (dihidrofolato reductasa); el cotrimoxazol logra un bloqueo secuencial sinérgico.</tspan><tspan x="58.0" dy="18">• Efectos: rash y Stevens-Johnson, cristaluria, hemólisis en déficit de G6PD y kernicterus en el neonato; evitarlas al final del embarazo.</tspan></text><text x="58.0" y="994.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Katzung, Farmacología básica y clínica 16.ª ed. (2024); Goodman y Gilman 14.ª ed. (2023); Harrison 21.ª ed. (2022)</tspan></text></svg>