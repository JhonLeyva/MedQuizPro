<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1261" viewBox="0 0 1000 1261" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Sangrado indoloro tras el coito a las 34 semanas, con útero blando: placenta previa"><title>Sangrado indoloro tras el coito a las 34 semanas, con útero blando: placenta previa</title><rect x="0.75" y="0.75" width="998.5" height="1259.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · sangrado del tercer trimestre</tspan></text><rect x="447.5" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="527.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="527.2" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Placenta previa</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Implantación de la placenta sobre el orificio cervical interno o cerca de él.</tspan><tspan x="58.0" dy="17">El segmento inferior se forma y se dilata y rompe vasos.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante de 34 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Sangrado genital moderado inmediatamente después</tspan><tspan x="640.0" dy="16">del coito.</tspan><tspan x="640.0" dy="16">Sin dolor uterino ni contracciones.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CAUSAS DE SANGRADO DEL TERCER TRIMESTRE Y CUÁL ENCAJA</tspan></text><line x1="406.0" y1="428.5" x2="340.0" y2="427.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="427.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="420.3" y1="480.4" x2="340.0" y2="530.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="530.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="402.5" x2="660.0" y2="380.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="380.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="458.6" x2="660.0" y2="480.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="480.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="421.1" y1="379.5" x2="340.0" y2="327.0" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="327.0" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="430.6" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="430.6" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="416.6" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">SANGRADO DEL</tspan><tspan x="500.0" dy="19">TERCER</tspan><tspan x="500.0" dy="19">TRIMESTRE</tspan></text><text x="500.0" y="473.6" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">comparar con el caso</tspan></text><rect x="40.0" y="285.0" width="300.0" height="84.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="318.7" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">PLACENTA PREVIA</tspan></text><text x="190.0" y="342.4" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Rojo vivo, indoloro, útero blando, poscoital</tspan></text><rect x="144.6" y="359.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="374.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="385.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="386.0" width="6.0" height="82.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="418.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">DESPRENDIMIENTO</tspan></text><text x="190.0" y="442.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Doloroso, útero hipertónico, sangre oscura</tspan></text><rect x="40.0" y="485.0" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="486.0" width="6.0" height="89.2" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="190.0" y="513.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">VASA PREVIA O VELAMENTOSA</tspan></text><text x="190.0" y="537.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Sangrado al romper membranas, sufrimiento</tspan><tspan x="190.0" dy="17">fetal</tspan></text><rect x="660.0" y="338.6" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="339.6" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="372.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">ACRETISMO</tspan></text><text x="810.0" y="396.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Hallazgo del parto; cicatriz previa</tspan></text><rect x="660.0" y="438.6" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="439.6" width="6.0" height="82.0" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="472.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">CERVICITIS</tspan></text><text x="810.0" y="496.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Sangrado leve poscoital, sin repercusión fetal</tspan></text><text x="40.0" y="612.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="624.2" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="657.2" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Sangrado indoloro</tspan></text><line x1="248.5" y1="653.2" x2="267.5" y2="653.2" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,648.2 266.5,658.2 274.5,653.2" fill="#0f766e"/><rect x="278.5" y="624.2" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="657.2" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Ecografía transvaginal</tspan></text><line x1="487.0" y1="653.2" x2="506.0" y2="653.2" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,648.2 505.0,658.2 513.0,653.2" fill="#0f766e"/><rect x="517.0" y="624.2" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="657.2" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Localizar la placenta</tspan></text><line x1="725.5" y1="653.2" x2="744.5" y2="653.2" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,648.2 743.5,658.2 751.5,653.2" fill="#0f766e"/><rect x="755.5" y="624.2" width="204.5" height="58.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="648.7" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Hospitalizar o cesárea</tspan><tspan x="857.8" dy="17">programada</tspan></text><text x="40.0" y="716.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PLACENTA PREVIA Y PLACENTA BAJA (RCOG GREEN-TOP 27A): DEFINICIÓN ECOGRÁFICA</tspan></text><rect x="40.0" y="728.2" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="747.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Categoría</tspan></text><text x="280.0" y="747.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Hallazgo ecográfico (más de 16 semanas)</tspan></text><text x="625.0" y="747.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Conducta</tspan></text><rect x="40.0" y="757.2" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="776.2" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Placenta previa</tspan></text><text x="280.0" y="776.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">La placenta cubre directamente el orificio cervical interno</tspan></text><text x="625.0" y="776.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Hospitalizar si sangra; cesárea programada; no hacer tacto</tspan><tspan x="625.0" dy="15">vaginal</tspan></text><rect x="170.6" y="768.2" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="216.0" y="783.2" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="216.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="801.2" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="820.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Placenta baja</tspan></text><text x="280.0" y="820.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">El borde placentario está a menos de 20 mm del orificio</tspan><tspan x="280.0" dy="15">interno, sin cubrirlo</tspan></text><text x="625.0" y="820.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Repetir la ecografía transvaginal al final del embarazo y</tspan><tspan x="625.0" dy="15">decidir la vía del parto</tspan></text><text x="40.0" y="861.2" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Si la ecografía del segundo trimestre es anormal se repite más adelante: el segmento inferior aún no se forma y muchas placentas «suben». Definiciones ecográficas de la</tspan><tspan x="40.0" dy="15">RCOG 27a (edición 2018, vigente en sus criterios; edición 2026 publicada en BJOG 2026;133:e93-e128).</tspan></text><text x="40.0" y="923.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="933.2" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="972.7" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="936.2" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="972.7" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Placenta previa</tspan></text><text x="435.0" y="955.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Desprendimiento</tspan><tspan x="435.0" dy="17">prematuro de</tspan><tspan x="435.0" dy="17">placenta</tspan></text><text x="585.0" y="955.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Inserción</tspan><tspan x="585.0" dy="17">velamentosa del</tspan><tspan x="585.0" dy="17">cordón</tspan></text><text x="735.0" y="972.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Placenta ácreta</tspan></text><text x="885.0" y="972.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Cervicitis aguda</tspan></text><rect x="40.0" y="1004.2" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1004.2" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1033.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico más</tspan><tspan x="54.0" dy="16">probable?</tspan></text><text x="285.0" y="1033.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: sangrado indoloro</tspan><tspan x="285.0" dy="16">poscoital</tspan></text><text x="435.0" y="1033.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: da dolor, hipertonía</tspan><tspan x="435.0" dy="16">y sangre oscura</tspan></text><text x="585.0" y="1033.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sangra al romper</tspan><tspan x="585.0" dy="16">las membranas</tspan></text><text x="735.0" y="1033.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: suele ser hallazgo</tspan><tspan x="735.0" dy="16">del parto</tspan></text><text x="885.0" y="1025.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no da sangrado</tspan><tspan x="885.0" dy="16">moderado con útero</tspan><tspan x="885.0" dy="16">blando</tspan></text><rect x="40.0" y="933.2" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1094.2" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1122.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1144.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Cuadro típico: sangrado rojo vivo, indoloro, recurrente, a veces poscoital; el tono uterino es normal y el feto suele estar bien.</tspan><tspan x="58.0" dy="18">• Diagnóstico por ecografía transvaginal, que es segura; no se hace tacto vaginal antes de descartar la previa (riesgo de hemorragia masiva).</tspan><tspan x="58.0" dy="18">• Desprendimiento: dolor, hipertonía y sangrado oscuro. Vasa previa y velamentosa: sangrado al romper membranas con sufrimiento fetal.</tspan><tspan x="58.0" dy="18">• Alerta: antecedente de cesárea o de legrado se asocia a acretismo placentario; la placenta previa se ve en cerca de 1 de cada 200 partos.</tspan></text><text x="58.0" y="1220.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Williams Obstetricia 26.ª ed. (2022); RCOG Green-top Guideline N.º 27a: Placenta Praevia and Placenta Accreta Spectrum. BJOG 2026;133:e93-e128.</tspan></text></svg>