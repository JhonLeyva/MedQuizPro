<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="989" viewBox="0 0 1000 989" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Mujer de 34 años con ciclos irregulares y labilidad emocional: el anticonceptivo combinado regulariza el ciclo"><title>Mujer de 34 años con ciclos irregulares y labilidad emocional: el anticonceptivo combinado regulariza el ciclo</title><rect x="0.75" y="0.75" width="998.5" height="987.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Planificación familiar · elección del método</tspan></text><rect x="454.3" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="534.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="534.1" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Elección anticonceptiva</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se individualiza según eficacia, contraindicaciones y condiciones que el método pueda</tspan><tspan x="58.0" dy="17">mejorar.</tspan><tspan x="58.0" dy="17">Antes se descarta embarazo.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 34 años, G6 P4024</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Menstruaciones irregulares, insomnio y alteración del</tspan><tspan x="640.0" dy="16">carácter.</tspan><tspan x="640.0" dy="16">Desea un método anticonceptivo.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ MÉTODO SIRVE CON CICLOS IRREGULARES Y LABILIDAD</tspan></text><text x="202.0" y="297.0" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="758"><tspan x="202.0" dy="0">→ EFECTO SOBRE EL CICLO</tspan></text><rect x="202.0" y="307.0" width="373.0" height="35.0" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="388.5" y="329.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="353"><tspan x="388.5" dy="0">Regulariza o es neutro</tspan></text><rect x="587.0" y="307.0" width="373.0" height="35.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="773.5" y="329.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="353"><tspan x="773.5" dy="0">Desfavorable en el caso</tspan></text><text x="40.0" y="328.5" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="146"><tspan x="40.0" dy="0">↓ MÉTODO</tspan></text><rect x="40.0" y="354.0" width="150.0" height="90.5" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="115.0" y="395.2" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Combinado (este</tspan><tspan x="115.0" dy="17">caso)</tspan></text><rect x="202.0" y="354.0" width="373.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="388.5" y="382.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Regulariza el ciclo</tspan></text><text x="388.5" y="405.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Muy eficaz</tspan><tspan x="388.5" dy="17">Atenúa síntomas físicos y emocionales premenstruales</tspan></text><rect x="343.1" y="433.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="388.5" y="448.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="388.5" dy="0">◆ ESTE CASO</tspan></text><rect x="587.0" y="354.0" width="373.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="588.0" y="355.0" width="6.0" height="88.5" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="773.5" y="382.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Sin contraindicación</tspan></text><text x="773.5" y="405.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">No fuma ni tiene hipertensión</tspan><tspan x="773.5" dy="17">Sin migraña con aura ni trombosis</tspan></text><rect x="40.0" y="456.5" width="150.0" height="90.5" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="115.0" y="506.2" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Otros métodos</tspan></text><rect x="202.0" y="456.5" width="373.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="457.5" width="6.0" height="88.5" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="388.5" y="484.8" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">DIU de levonorgestrel o implante</tspan></text><text x="388.5" y="507.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Válidos según CDC 2024</tspan><tspan x="388.5" dy="17">No son la clave del banco</tspan></text><rect x="587.0" y="456.5" width="373.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="588.0" y="457.5" width="6.0" height="88.5" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="773.5" y="484.8" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Ritmo, barrera, DIU de cobre y progestina oral</tspan></text><text x="773.5" y="507.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Ritmo: falla con ciclos irregulares</tspan><tspan x="773.5" dy="17">Progestina oral: sangrado impredecible</tspan></text><text x="40.0" y="596.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="606.9" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="646.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="629.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Anticonceptivos</tspan><tspan x="285.0" dy="17">orales de</tspan><tspan x="285.0" dy="17">progestina sola</tspan></text><text x="435.0" y="637.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Dispositivo</tspan><tspan x="435.0" dy="17">intrauterino</tspan></text><text x="585.0" y="646.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Método del ritmo</tspan></text><text x="735.0" y="646.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Método de barrera</tspan></text><rect x="813.0" y="609.9" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="637.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Anticonceptivos</tspan><tspan x="885.0" dy="17">orales combinados</tspan></text><rect x="40.0" y="677.9" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="677.9" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="714.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Método a recomendar?</tspan></text><text x="285.0" y="698.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: sangrado</tspan><tspan x="285.0" dy="16">impredecible, menos</tspan><tspan x="285.0" dy="16">recomendable</tspan></text><text x="435.0" y="706.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no corrige y puede</tspan><tspan x="435.0" dy="16">aumentar el sangrado</tspan></text><text x="585.0" y="706.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no sirve con ciclos</tspan><tspan x="585.0" dy="16">irregulares</tspan></text><text x="735.0" y="706.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: alto fallo con el uso</tspan><tspan x="735.0" dy="16">habitual</tspan></text><text x="885.0" y="706.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: eficaz y regulariza</tspan><tspan x="885.0" dy="16">el ciclo</tspan></text><rect x="40.0" y="606.9" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="767.9" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="795.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="817.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Antes de recetar, buscar causa de ciclos irregulares con insomnio y labilidad: hipotiroidismo o hipertiroidismo, hiperprolactinemia, SOP, estrés o</tspan><tspan x="58.0" dy="18">   insuficiencia ovárica.</tspan><tspan x="58.0" dy="18">• El combinado es muy eficaz, regulariza el ciclo y atenúa síntomas premenstruales; no hay contraindicación (no fuma, no hay hipertensión, migraña con</tspan><tspan x="58.0" dy="18">   aura ni trombosis).</tspan><tspan x="58.0" dy="18">• El ritmo falla con ciclos irregulares; los de barrera tienen alto fallo habitual; el DIU de cobre no corrige el sangrado y puede aumentarlo; la progestina sola</tspan><tspan x="58.0" dy="18">   causa sangrado impredecible.</tspan><tspan x="58.0" dy="18">• Nota: según CDC 2024 el DIU de levonorgestrel o el implante también serían válidos; la clave se apoya en la regularización del ciclo.</tspan></text><text x="58.0" y="947.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, US Medical Eligibility Criteria for Contraceptive Use 2024 (MMWR Recomm Rep 2024); Berek y Novak, Ginecología, 16.ª ed. (2020)</tspan></text></svg>