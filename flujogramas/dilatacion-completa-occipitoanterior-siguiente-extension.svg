<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1144" viewBox="0 0 1000 1144" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Dilatación completa, presentación en +3 y occipucio ya anterior: la rotación interna ocurrió y el siguiente movimiento cardinal es la extensión"><title>Dilatación completa, presentación en +3 y occipucio ya anterior: la rotación interna ocurrió y el siguiente movimiento cardinal es la extensión</title><rect x="0.75" y="0.75" width="998.5" height="1142.8" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Parto · mecanismo del parto</tspan></text><rect x="367.5" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="454.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="454.7" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Movimientos cardinales del parto</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Encajamiento → descenso → flexión → rotación interna → extensión → rotación externa</tspan><tspan x="58.0" dy="17">(restitución) → expulsión.</tspan><tspan x="58.0" dy="17">La extensión ocurre cuando el occipucio llega bajo la sínfisis del pubis.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Primigesta de 39 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">10 cm, 100 %, estación +3, membranas rotas.</tspan><tspan x="640.0" dy="16">Presentación occipitoanterior: ya rotó.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">MOVIMIENTOS CARDINALES DEL PARTO</tspan></text><rect x="42.0" y="279.0" width="180.0" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="132.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="164"><tspan x="132.0" dy="0">ENCAJA Y DESCIENDE</tspan></text><text x="132.0" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="164"><tspan x="132.0" dy="0">1-2</tspan></text><rect x="226.0" y="279.0" width="180.0" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="316.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="164"><tspan x="316.0" dy="0">FLEXIÓN</tspan></text><text x="316.0" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="164"><tspan x="316.0" dy="0">3</tspan></text><rect x="410.0" y="279.0" width="180.0" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="500.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="164"><tspan x="500.0" dy="0">ROTACIÓN INTERNA</tspan></text><text x="500.0" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="164"><tspan x="500.0" dy="0">4</tspan></text><rect x="594.0" y="279.0" width="180.0" height="56.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="684.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="164"><tspan x="684.0" dy="0">EXTENSIÓN</tspan></text><text x="684.0" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="164"><tspan x="684.0" dy="0">5</tspan></text><rect x="778.0" y="279.0" width="180.0" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="868.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="164"><tspan x="868.0" dy="0">ROTACIÓN EXTERNA</tspan></text><text x="868.0" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="164"><tspan x="868.0" dy="0">6-7</tspan></text><rect x="638.6" y="268.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="684.0" y="283.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="684.0" dy="0">◆ ESTE CASO</tspan></text><rect x="48.0" y="349.0" width="168.0" height="110.3" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="132.0" y="386.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="140"><tspan x="132.0" dy="0">ENCAJAMIENTO Y</tspan><tspan x="132.0" dy="19.2">DESCENSO</tspan></text><text x="132.0" y="429.2" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="140"><tspan x="132.0" dy="0">Entra en la pelvis</tspan></text><rect x="232.0" y="349.0" width="168.0" height="110.3" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="316.0" y="395.9" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="140"><tspan x="316.0" dy="0">FLEXIÓN</tspan></text><text x="316.0" y="419.6" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="140"><tspan x="316.0" dy="0">Mentón al pecho</tspan></text><rect x="416.0" y="349.0" width="168.0" height="110.3" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="377.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="140"><tspan x="500.0" dy="0">ROTACIÓN</tspan><tspan x="500.0" dy="19.2">INTERNA</tspan></text><text x="500.0" y="420.7" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="140"><tspan x="500.0" dy="0">Occipucio al pubis</tspan><tspan x="500.0" dy="17">Ya ocurrió</tspan></text><rect x="600.0" y="349.0" width="168.0" height="110.3" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="684.0" y="387.4" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="140"><tspan x="684.0" dy="0">EXTENSIÓN</tspan></text><text x="684.0" y="411.1" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="140"><tspan x="684.0" dy="0">Bajo la sínfisis</tspan><tspan x="684.0" dy="17">Lo siguiente</tspan></text><rect x="784.0" y="349.0" width="168.0" height="110.3" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="868.0" y="386.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="140"><tspan x="868.0" dy="0">RESTITUCIÓN Y</tspan><tspan x="868.0" dy="19.2">EXPULSIÓN</tspan></text><text x="868.0" y="429.2" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="140"><tspan x="868.0" dy="0">Salen los hombros</tspan></text><text x="40.0" y="499.3" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="511.3" width="920.0" height="323.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="525.3" width="420.0" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.0" y="545.3" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.0" dy="0">ALTURA DE LA PRESENTACIÓN (ESTACIONES DE DELEE)</tspan></text><text x="492.0" y="545.3" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="450"><tspan x="492.0" dy="0">En cm respecto a las espinas ciáticas.</tspan></text><rect x="56.0" y="585.3" width="288.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="585.9" width="286.8" height="63.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="200.0" y="613.3" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="272"><tspan x="200.0" dy="0">−3 A −1</tspan></text><text x="200.0" y="633.3" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="264"><tspan x="200.0" dy="0">Alta</tspan></text><circle cx="72.0" cy="658.3" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="662.3" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="82.0" dy="0">Sobre las espinas</tspan></text><rect x="356.0" y="585.3" width="288.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="356.6" y="585.9" width="286.8" height="63.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="500.0" y="613.3" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="272"><tspan x="500.0" dy="0">0</tspan></text><text x="500.0" y="633.3" font-size="14" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="264"><tspan x="500.0" dy="0">Encajada</tspan></text><circle cx="372.0" cy="658.3" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="382.0" y="662.3" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="382.0" dy="0">A nivel de las espinas</tspan></text><rect x="656.0" y="585.3" width="288.0" height="98.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="657.2" y="586.5" width="285.6" height="63.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="800.0" y="613.3" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="272"><tspan x="800.0" dy="0">+1 A +3</tspan></text><text x="800.0" y="633.3" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="264"><tspan x="800.0" dy="0">Baja</tspan></text><circle cx="672.0" cy="658.3" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="682.0" y="662.3" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="250"><tspan x="682.0" dy="0">Bajo las espinas; +3 en el periné</tspan></text><rect x="754.6" y="574.3" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="800.0" y="589.3" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="800.0" dy="0">◆ ESTE CASO</tspan></text><text x="56.0" y="713.3" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="722.3" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="737.3" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="737.3" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Estación +3</tspan></text><rect x="56.0" y="744.3" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="759.3" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="759.3" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Occipucio ya anterior: rotó</tspan></text><rect x="56.0" y="781.3" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="804.3" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Sigue la extensión: pujo dirigido y protección del periné.</tspan></text><text x="40.0" y="874.3" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="884.3" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="906.8" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="906.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Restitución</tspan></text><text x="435.0" y="906.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Rotación externa</tspan></text><text x="585.0" y="906.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Rotación interna</tspan></text><rect x="663.0" y="887.3" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="906.8" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Extensión</tspan></text><text x="885.0" y="906.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Flexión</tspan></text><rect x="40.0" y="921.3" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="921.3" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="950.3" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Siguiente?</tspan></text><text x="285.0" y="942.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es tras la</tspan><tspan x="285.0" dy="16">extensión</tspan></text><text x="435.0" y="942.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es tras la</tspan><tspan x="435.0" dy="16">extensión</tspan></text><text x="585.0" y="950.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: ya ocurrió (OA)</tspan></text><text x="735.0" y="950.3" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: bajo la sínfisis</tspan></text><text x="885.0" y="950.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es al inicio</tspan></text><rect x="40.0" y="884.3" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="995.3" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1023.3" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1045.3" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La cabeza sale por extensión: occipucio, frente, cara y mentón.</tspan><tspan x="58.0" dy="18">• Luego restitución y rotación externa para que salgan los hombros.</tspan><tspan x="58.0" dy="18">• Protección del periné durante la extensión.</tspan></text><text x="58.0" y="1103.3" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>