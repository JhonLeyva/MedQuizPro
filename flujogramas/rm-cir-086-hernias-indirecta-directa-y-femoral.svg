<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="959" viewBox="0 0 1000 959" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La hernia inguinal indirecta sale lateral a los vasos epigástricos inferiores"><title>La hernia inguinal indirecta sale lateral a los vasos epigástricos inferiores</title><rect x="0.75" y="0.75" width="998.5" height="957.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Hernias · indirecta, directa y femoral</tspan></text><rect x="414.7" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="457.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="457.9" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hernia inguinal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se distingue por su posición respecto de los vasos epigástricos inferiores.</tspan><tspan x="58.0" dy="17">Es un hallazgo de la cirugía.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón con obstrucción</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dolor abdominal, náuseas y vómito fecaloide.</tspan><tspan x="640.0" dy="16">Masa inguinal derecha irreductible, operada de</tspan><tspan x="640.0" dy="16">urgencia: hernia indirecta.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE DISTINGUE CADA HERNIA DE LA INGLE</tspan></text><rect x="40.0" y="285.0" width="453.0" height="95.0" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2.4"/><text x="54.0" y="312.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Indirecta (este caso)</tspan></text><text x="54.0" y="329.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Lateral a los epigástricos inferiores</tspan><tspan x="54.0" dy="16">Entra por el anillo profundo, sigue el cordón y baja al escroto</tspan><tspan x="54.0" dy="16">Congénita; la más frecuente en ambos sexos</tspan></text><rect x="391.2" y="274.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="436.6" y="289.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="436.6" dy="0">◆ ESTE CASO</tspan></text><rect x="507.0" y="285.0" width="453.0" height="95.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="521.0" y="312.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Directa</tspan></text><text x="521.0" y="329.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Medial a los epigástricos inferiores</tspan><tspan x="521.0" dy="16">Protruye por el triángulo de Hesselbach (pared posterior)</tspan><tspan x="521.0" dy="16">Adquirida: debilidad de la fascia transversalis</tspan></text><rect x="40.0" y="394.0" width="453.0" height="95.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="54.0" y="421.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Femoral</tspan></text><text x="54.0" y="438.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Bajo el ligamento inguinal, medial a la vena femoral</tspan><tspan x="54.0" dy="16">Más frecuente en mujeres</tspan><tspan x="54.0" dy="16">Cuello estrecho: la que más se estrangula</tspan></text><rect x="507.0" y="394.0" width="453.0" height="95.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="521.0" y="421.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Cuadro del paciente</tspan></text><text x="521.0" y="438.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Masa irreductible con vómito fecaloide</tspan><tspan x="521.0" dy="16">Hernia incarcerada con obstrucción</tspan><tspan x="521.0" dy="16">Cirugía urgente</tspan></text><rect x="40.0" y="507.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="533.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Hernia indirecta = lateral a los vasos epigástricos inferiores</tspan></text><text x="60.0" y="552.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La directa es medial; la femoral, bajo el ligamento.</tspan></text><text x="40.0" y="619.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="629.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="668.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="632.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="651.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Lateral a los vasos</tspan><tspan x="285.0" dy="17">epigástricos</tspan><tspan x="285.0" dy="17">inferiores</tspan></text><text x="435.0" y="651.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Protruye por la</tspan><tspan x="435.0" dy="17">pared posterior del</tspan><tspan x="435.0" dy="17">conducto</tspan></text><text x="585.0" y="660.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Pasa a través del</tspan><tspan x="585.0" dy="17">conducto femoral</tspan></text><text x="735.0" y="651.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Medial a los vasos</tspan><tspan x="735.0" dy="17">epigástricos</tspan><tspan x="735.0" dy="17">inferiores</tspan></text><text x="885.0" y="660.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Es más frecuente</tspan><tspan x="885.0" dy="17">en mujeres</tspan></text><rect x="40.0" y="700.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="700.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="729.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Hernia indirecta?</tspan></text><text x="285.0" y="721.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: lateral a los vasos</tspan><tspan x="285.0" dy="16">epigástricos</tspan></text><text x="435.0" y="729.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es la hernia directa</tspan></text><text x="585.0" y="721.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es la hernia</tspan><tspan x="585.0" dy="16">femoral</tspan></text><text x="735.0" y="729.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es la hernia directa</tspan></text><text x="885.0" y="721.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es más frecuente</tspan><tspan x="885.0" dy="16">en varones</tspan></text><rect x="40.0" y="629.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="774.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="802.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="824.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Indirecta: lateral a los epigástricos, entra por el anillo profundo y sigue el cordón hasta el escroto; es congénita (conducto peritoneovaginal) y la más</tspan><tspan x="58.0" dy="18">   frecuente en ambos sexos.</tspan><tspan x="58.0" dy="18">• Directa: medial, por el triángulo de Hesselbach (pared posterior débil, adquirida). Femoral: bajo el ligamento inguinal, más en mujeres y la que más se</tspan><tspan x="58.0" dy="18">   estrangula.</tspan><tspan x="58.0" dy="18">• Alertas: irreductible, dolor y vómito fecaloide = incarcerada o estrangulada; cirugía urgente (guía HerniaSurge 2018, WSES 2017).</tspan></text><text x="58.0" y="918.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: HerniaSurge, guía internacional de hernia inguinal (Hernia 2018); WSES, obstrucción intestinal (2017); Sabiston Tratado de Cirugía 21.ª ed.</tspan></text></svg>