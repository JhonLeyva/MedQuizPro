<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1109" viewBox="0 0 1000 1109" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El riesgo atribuible porcentual indica qué parte de la incidencia en expuestos se debe a la exposición"><title>El riesgo atribuible porcentual indica qué parte de la incidencia en expuestos se debe a la exposición</title><rect x="0.75" y="0.75" width="998.5" height="1107.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Epidemiología · riesgo atribuible porcentual</tspan></text><rect x="459.1" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="523.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="523.4" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Medidas de impacto</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Fracción etiológica en expuestos: (Ie - Io) / Ie × 100, o (RR - 1) / RR.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de medida</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué medida calcula la proporción de la incidencia en</tspan><tspan x="640.0" dy="16">expuestos que se debe a la exposición?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">MEDIDAS DE ASOCIACIÓN E IMPACTO</tspan></text><text x="202.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="758"><tspan x="202.0" dy="0">→ ALCANCE</tspan></text><rect x="202.0" y="291.0" width="373.0" height="35.0" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="388.5" y="313.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="353"><tspan x="388.5" dy="0">En expuestos</tspan></text><rect x="587.0" y="291.0" width="373.0" height="35.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="773.5" y="313.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="353"><tspan x="773.5" dy="0">En toda la población</tspan></text><text x="40.0" y="312.5" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="146"><tspan x="40.0" dy="0">↓ TIPO DE MEDIDA</tspan></text><rect x="40.0" y="338.0" width="150.0" height="90.5" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="115.0" y="379.2" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Relativa o</tspan><tspan x="115.0" dy="17">porcentual</tspan></text><rect x="202.0" y="338.0" width="373.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="388.5" y="366.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Riesgo atribuible porcentual</tspan></text><text x="388.5" y="389.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">(Ie - Io) / Ie × 100</tspan><tspan x="388.5" dy="17">Fracción por la exposición</tspan></text><rect x="343.1" y="417.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="388.5" y="432.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="388.5" dy="0">◆ ESTE CASO</tspan></text><rect x="587.0" y="338.0" width="373.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="588.0" y="339.0" width="6.0" height="88.5" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="773.5" y="366.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Fracción atribuible poblacional</tspan></text><text x="773.5" y="389.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Depende de la prevalencia de la exposición</tspan><tspan x="773.5" dy="17">Decide intervenciones</tspan></text><rect x="40.0" y="440.5" width="150.0" height="90.5" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="115.0" y="490.2" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Absoluta</tspan></text><rect x="202.0" y="440.5" width="373.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="441.5" width="6.0" height="88.5" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="388.5" y="468.8" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Riesgo atribuible</tspan></text><text x="388.5" y="491.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Ie - Io</tspan><tspan x="388.5" dy="17">Exceso absoluto de casos</tspan></text><rect x="587.0" y="440.5" width="373.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="588.0" y="441.5" width="6.0" height="88.5" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="773.5" y="468.8" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Riesgo atribuible poblacional</tspan></text><text x="773.5" y="491.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Exceso en toda la población</tspan><tspan x="773.5" dy="17">Incluye a los no expuestos</tspan></text><text x="40.0" y="574.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">MEDIDAS DE UNA COHORTE</tspan></text><rect x="40.0" y="586.9" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="605.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Medida</tspan></text><text x="340.0" y="605.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="299"><tspan x="340.0" dy="0">Qué responde</tspan></text><text x="655.0" y="605.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="299"><tspan x="655.0" dy="0">Cálculo</tspan></text><rect x="40.0" y="615.9" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="634.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Riesgo relativo</tspan></text><text x="340.0" y="634.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="340.0" dy="0">¿Cuántas veces más riesgo?</tspan></text><text x="655.0" y="634.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="655.0" dy="0">Ie / Io</tspan></text><rect x="40.0" y="644.9" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="663.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Riesgo atribuible</tspan></text><text x="340.0" y="663.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="340.0" dy="0">¿Cuántos casos de más?</tspan></text><text x="655.0" y="663.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="655.0" dy="0">Ie - Io</tspan></text><rect x="40.0" y="673.9" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="692.9" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Riesgo atribuible porcentual</tspan></text><text x="340.0" y="692.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="340.0" dy="0">¿Qué parte se debe a la exposición?</tspan></text><text x="655.0" y="692.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="655.0" dy="0">(Ie - Io) / Ie × 100</tspan></text><rect x="230.6" y="677.4" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="276.0" y="692.4" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="276.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="702.9" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="721.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Odds ratio</tspan></text><text x="340.0" y="721.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="340.0" dy="0">Asociación en casos y controles</tspan></text><text x="655.0" y="721.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="655.0" dy="0">ad / bc</tspan></text><text x="40.0" y="771.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="781.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="812.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="784.9" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="804.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Riesgo atribuible</tspan><tspan x="285.0" dy="17">porcentual</tspan></text><text x="435.0" y="812.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Riesgo relativo</tspan></text><text x="585.0" y="812.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Odds ratio</tspan></text><text x="735.0" y="812.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Riesgo atribuible</tspan></text><text x="885.0" y="804.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Riesgo atribuible</tspan><tspan x="885.0" dy="17">poblacional</tspan></text><rect x="40.0" y="835.9" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="835.9" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="880.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Medida?</tspan></text><text x="285.0" y="856.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: porcentaje de la</tspan><tspan x="285.0" dy="16">incidencia en</tspan><tspan x="285.0" dy="16">expuestos por la</tspan><tspan x="285.0" dy="16">exposición</tspan></text><text x="435.0" y="872.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: mide cuántas</tspan><tspan x="435.0" dy="16">veces más riesgo</tspan></text><text x="585.0" y="872.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es la medida de</tspan><tspan x="585.0" dy="16">casos y controles</tspan></text><text x="735.0" y="872.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es el exceso</tspan><tspan x="735.0" dy="16">absoluto de casos</tspan></text><text x="885.0" y="872.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: abarca a toda la</tspan><tspan x="885.0" dy="16">población</tspan></text><rect x="40.0" y="781.9" width="920.0" height="136.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="941.9" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="969.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="991.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Riesgo atribuible porcentual = (incidencia en expuestos - incidencia en no expuestos) / incidencia en expuestos × 100. Con RR 4,8 es cerca de 79 %.</tspan><tspan x="58.0" dy="18">• Riesgo relativo: fuerza de la asociación. Odds ratio: casos y controles. Riesgo atribuible: exceso absoluto de casos.</tspan><tspan x="58.0" dy="18">• Riesgo atribuible poblacional: efecto en toda la población; depende de la prevalencia de la exposición y orienta la salud pública.</tspan><tspan x="58.0" dy="18">• RR sirve para causalidad, riesgo atribuible para el impacto individual y el poblacional para decidir intervenciones colectivas.</tspan></text><text x="58.0" y="1067.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Gordis, Epidemiología 6.ª ed. (2019); Szklo y Nieto, Epidemiology: Beyond the Basics 4.ª ed. (2019); Rothman, Modern Epidemiology 4.ª ed. (2021).</tspan></text></svg>