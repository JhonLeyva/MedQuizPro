<svg xmlns="http://www.w3.org/2000/svg" width="820" height="857" viewBox="0 0 820 857" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Diseño cuasi experimental en epidemiología"><title>Diseño cuasi experimental en epidemiología</title><rect width="820" height="857" fill="#ffffff"/><rect x="0" y="0" width="820" height="112" fill="#0f766e"/><text x="40" y="34" font-size="13" font-weight="600" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="740"><tspan x="40" dy="0">MedQuizPlus · Flujograma</tspan></text><text x="40" y="70" font-size="24" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="740"><tspan x="40" dy="0">Diseño cuasi experimental en epidemiología</tspan></text><text x="40" y="96" font-size="13" font-weight="400" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="740"><tspan x="40" dy="0">ENAM 2020 · SP-007 · Salud Pública, Gestión y Epidemiología</tspan></text><rect x="90" y="144" width="640" height="76" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="108" y="172" font-size="11" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="604"><tspan x="108" dy="0">INICIO</tspan></text><text x="108" y="196" font-size="16" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Estudio de investigación</tspan></text><line x1="410.0" y1="222" x2="410.0" y2="242" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,240 417.0,240 410.0,250" fill="#94a3b8"/><rect x="90" y="252" width="640" height="124" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><circle cx="120" cy="314.0" r="12" fill="#d97706"/><text x="120" y="319.0" font-size="15" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="120" dy="0">?</tspan></text><text x="142" y="280" font-size="11" font-weight="700" font-style="normal" fill="#b45309" text-anchor="start" data-max="570"><tspan x="142" dy="0">DECISIÓN</tspan></text><text x="142" y="304" font-size="16" font-weight="600" font-style="normal" fill="#78350f" text-anchor="start" data-max="570"><tspan x="142" dy="0">¿El investigador asigna la intervención?</tspan></text><text x="142" y="332" font-size="14" font-weight="500" font-style="italic" fill="#92400e" text-anchor="start" data-max="570"><tspan x="142" dy="0">↳ No → observacional: cohorte, casos y controles, transversal o</tspan><tspan x="142" dy="20">ecológico</tspan></text><line x1="410.0" y1="378" x2="410.0" y2="398" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,396 417.0,396 410.0,406" fill="#94a3b8"/><rect x="90" y="408" width="640" height="76" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><circle cx="120" cy="446.0" r="12" fill="#d97706"/><text x="120" y="451.0" font-size="15" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="120" dy="0">?</tspan></text><text x="142" y="436" font-size="11" font-weight="700" font-style="normal" fill="#b45309" text-anchor="start" data-max="570"><tspan x="142" dy="0">DECISIÓN</tspan></text><text x="142" y="460" font-size="16" font-weight="600" font-style="normal" fill="#78350f" text-anchor="start" data-max="570"><tspan x="142" dy="0">Sí: ¿la asignación es aleatoria?</tspan></text><line x1="410.0" y1="486" x2="410.0" y2="506" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,504 417.0,504 410.0,514" fill="#94a3b8"/><rect x="90" y="516" width="640" height="76" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="544" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="568" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Aleatoria → experimental (ensayo clínico controlado)</tspan></text><line x1="410.0" y1="594" x2="410.0" y2="614" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,612 417.0,612 410.0,622" fill="#94a3b8"/><rect x="90" y="624" width="640" height="76" rx="12" fill="#134e4a" stroke="#134e4a" stroke-width="2"/><text x="108" y="652" font-size="11" font-weight="700" font-style="normal" fill="#5eead4" text-anchor="start" data-max="604"><tspan x="108" dy="0">CONDUCTA FINAL</tspan></text><text x="108" y="676" font-size="16" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">No aleatoria (por conveniencia) → cuasi experimental</tspan></text><rect x="40" y="730" width="740" height="77" rx="10" fill="#f0fdfa" stroke="#99f6e4"/><rect x="40" y="730" width="6" height="77" rx="3" fill="#14b8a6"/><text x="62" y="756" font-size="14" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="704"><tspan x="62" dy="0">Perla clínica</tspan></text><text x="62" y="780" font-size="15" font-weight="400" font-style="normal" fill="#134e4a" text-anchor="start" data-max="704"><tspan x="62" dy="0">La aleatorización es lo que separa un experimento de un cuasi experimento.</tspan></text><text x="410.0" y="835" font-size="11" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="740"><tspan x="410.0" dy="0">MedQuizPlus · Material de estudio: contrasta siempre con las guías clínicas vigentes.</tspan></text></svg>
