<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="988" viewBox="0 0 1000 988" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El investigador asigna la intervención por conveniencia (sin azar): diseño cuasi experimental"><title>El investigador asigna la intervención por conveniencia (sin azar): diseño cuasi experimental</title><rect x="0.75" y="0.75" width="998.5" height="986.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Epidemiología · diseños de investigación</tspan></text><rect x="443.3" y="32.0" width="143.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="515.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="127"><tspan x="515.1" dy="0">SALUD PÚBLICA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Diseños de investigación</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Si el investigador asigna la intervención, el estudio es de intervención (experimental).</tspan><tspan x="58.0" dy="17">Si además la asignación es al azar, es un ensayo aleatorizado; si no, es cuasi experimental.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Estrategia educativa en estudiantes</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Se evalúa su efecto sobre las competencias.</tspan><tspan x="640.0" dy="16">El grupo intervenido se elige por conveniencia del</tspan><tspan x="640.0" dy="16">investigador.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="577.8" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="577.8" y1="271.0" x2="577.8" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="572.8,299.0 582.8,299.0 577.8,307.0" fill="#94a3b8"/><line x1="577.8" y1="365.0" x2="577.8" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="344.3" y1="395.0" x2="811.3" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="344.3" y1="395.0" x2="344.3" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="339.3,423.0 349.3,423.0 344.3,431.0" fill="#94a3b8"/><line x1="811.3" y1="395.0" x2="811.3" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,423.0 816.3,423.0 811.3,431.0" fill="#94a3b8"/><line x1="344.3" y1="489.0" x2="344.3" y2="551.5" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="551.5" x2="500.0" y2="551.5" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="551.5" x2="188.7" y2="580.5" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,579.5 193.7,579.5 188.7,587.5" fill="#94a3b8"/><line x1="500.0" y1="551.5" x2="500.0" y2="580.5" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,579.5 505.0,579.5 500.0,587.5" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="577.8" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="577.8" y1="271.0" x2="577.8" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="572.8,299.0 582.8,299.0 577.8,307.0" fill="#0f766e"/><line x1="577.8" y1="365.0" x2="577.8" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="344.3" y1="395.0" x2="577.8" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="344.3" y1="395.0" x2="344.3" y2="424.0" stroke="#0f766e" stroke-width="3"/><polygon points="339.3,423.0 349.3,423.0 344.3,431.0" fill="#0f766e"/><line x1="344.3" y1="489.0" x2="344.3" y2="551.5" stroke="#0f766e" stroke-width="3"/><line x1="344.3" y1="551.5" x2="500.0" y2="551.5" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="551.5" x2="500.0" y2="580.5" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,579.5 505.0,579.5 500.0,587.5" fill="#0f766e"/><rect x="332.3" y="404.0" width="24.1" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="344.3" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="344.3" dy="0">Sí</tspan></text><rect x="797.2" y="404.0" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="811.3" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">No</tspan></text><rect x="176.6" y="560.5" width="24.1" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="188.7" y="573.0" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">Sí</tspan></text><rect x="409.2" y="560.5" width="181.7" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="500.0" y="573.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">No: por conveniencia (este caso)</tspan></text><polygon points="317.8,336.0 343.8,307.0 811.8,307.0 837.8,336.0 811.8,365.0 343.8,365.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="363.8" cy="336.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="363.8" y="341.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="363.8" dy="0">?</tspan></text><text x="596.8" y="340.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="596.8" dy="0">¿El investigador asigna la intervención?</tspan></text><polygon points="84.3,460.0 110.3,431.0 578.3,431.0 604.3,460.0 578.3,489.0 110.3,489.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="130.3" cy="460.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="130.3" y="465.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="130.3" dy="0">?</tspan></text><text x="363.3" y="464.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="363.3" dy="0">¿La asignación es al azar?</tspan></text><rect x="40.0" y="587.5" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="188.7" y="624.3" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Experimental</tspan></text><text x="188.7" y="647.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Ensayo clínico aleatorizado</tspan></text><rect x="351.3" y="587.5" width="297.3" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="615.8" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">CUASI EXPERIMENTAL</tspan></text><text x="500.0" y="638.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Hay comparación sin azar</tspan><tspan x="500.0" dy="17">Ojo con el sesgo de selección</tspan></text><rect x="662.7" y="431.0" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Observacional</tspan></text><text x="811.3" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Cohorte, casos y controles, transversal,</tspan><tspan x="811.3" dy="17">ecológico</tspan></text><text x="40.0" y="717.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="727.9" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="750.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="750.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">De cohorte</tspan></text><text x="435.0" y="750.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Ecológico</tspan></text><text x="585.0" y="750.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Experimental</tspan></text><rect x="663.0" y="730.9" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="750.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Cuasi experimental</tspan></text><text x="885.0" y="750.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Casos y controles</tspan></text><rect x="40.0" y="764.9" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="764.9" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="793.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Encaja?</tspan></text><text x="285.0" y="793.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: observacional</tspan></text><text x="435.0" y="785.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: grupos, no</tspan><tspan x="435.0" dy="16">individuos</tspan></text><text x="585.0" y="793.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: requiere azar</tspan></text><text x="735.0" y="785.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: intervención sin</tspan><tspan x="735.0" dy="16">azar</tspan></text><text x="885.0" y="793.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: observacional</tspan></text><rect x="40.0" y="727.9" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="838.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="866.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="888.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Experimental (ensayo clínico aleatorizado): asignación al azar, controla la confusión.</tspan><tspan x="58.0" dy="18">• Cuasi experimental: hay intervención y comparación, pero sin azar: más riesgo de sesgo de selección.</tspan><tspan x="58.0" dy="18">• Cohorte y casos y controles son observacionales: el investigador no asigna la exposición.</tspan></text><text x="58.0" y="946.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Gordis, Epidemiología 6.ª ed. (2019); Hernández-Sampieri, Metodología de la investigación 7.ª ed.</tspan></text></svg>