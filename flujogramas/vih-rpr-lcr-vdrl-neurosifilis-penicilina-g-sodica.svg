<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1176" viewBox="0 0 1000 1176" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Paciente con VIH sin TAR, meningitis con LCR linfocitario y VDRL positivo en LCR: neurosífilis, tratar con penicilina G sódica EV"><title>Paciente con VIH sin TAR, meningitis con LCR linfocitario y VDRL positivo en LCR: neurosífilis, tratar con penicilina G sódica EV</title><rect x="0.75" y="0.75" width="998.5" height="1174.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Sífilis · neurosífilis</tspan></text><rect x="311.4" y="32.0" width="136.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="379.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="121"><tspan x="379.8" dy="0">INFECTOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Neurosífilis</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Treponema pallidum invade el sistema nervioso: puede pasar en cualquier etapa, más con</tspan><tspan x="58.0" dy="17">VIH.</tspan><tspan x="58.0" dy="17">Se confirma con VDRL en el LCR (muy específico) y LCR con linfocitos y proteínas altas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 28 años, VIH sin TAR hace 2 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Cefalea, Glasgow 11, rigidez de nuca y Kernig (+); RPR</tspan><tspan x="640.0" dy="16">(+).</tspan><tspan x="640.0" dy="16">LCR: linfocitos, proteínas altas, glucosa normal, VDRL</tspan><tspan x="640.0" dy="16">(+).</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TRATAMIENTO SEGÚN LA ETAPA DE LA SÍFILIS (CDC 2021)</tspan></text><rect x="40.0" y="301.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="323.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="210"><tspan x="54.0" dy="0">ETAPA</tspan></text><text x="442.5" y="323.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="325"><tspan x="442.5" dy="0">Primera elección</tspan></text><text x="787.5" y="323.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="325"><tspan x="787.5" dy="0">Si hay alergia a la penicilina</tspan></text><rect x="40.0" y="341.0" width="224.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="367.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="202"><tspan x="54.0" dy="0">Temprana</tspan></text><text x="54.0" y="384.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="202"><tspan x="54.0" dy="0">Primaria, secundaria o latente &lt; 1 año</tspan></text><rect x="273.0" y="341.0" width="339.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="285.0" y="366.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="321"><tspan x="285.0" dy="0">Penicilina benzatínica</tspan></text><text x="285.0" y="382.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="321"><tspan x="285.0" dy="0">2,4 millones UI IM, dosis única</tspan></text><rect x="618.0" y="341.0" width="339.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="630.0" y="366.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="321"><tspan x="630.0" dy="0">Doxiciclina</tspan></text><text x="630.0" y="382.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="321"><tspan x="630.0" dy="0">100 mg c/12 h, 14 días</tspan></text><rect x="40.0" y="404.0" width="224.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="430.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="202"><tspan x="54.0" dy="0">Tardía</tspan></text><text x="54.0" y="447.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="202"><tspan x="54.0" dy="0">Latente &gt; 1 año o duración desconocida</tspan></text><rect x="273.0" y="404.0" width="339.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="285.0" y="429.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="321"><tspan x="285.0" dy="0">Penicilina benzatínica</tspan></text><text x="285.0" y="445.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="321"><tspan x="285.0" dy="0">2,4 millones UI IM semanal × 3</tspan></text><rect x="618.0" y="404.0" width="339.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="630.0" y="429.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="321"><tspan x="630.0" dy="0">Doxiciclina</tspan></text><text x="630.0" y="445.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="321"><tspan x="630.0" dy="0">100 mg c/12 h, 28 días</tspan></text><rect x="40.0" y="467.0" width="224.0" height="71.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="493.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="202"><tspan x="54.0" dy="0">Neurosífilis u ocular</tspan></text><text x="54.0" y="510.0" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="202"><tspan x="54.0" dy="0">LCR con VDRL (+) o síntomas</tspan><tspan x="54.0" dy="14">neurológicos</tspan></text><rect x="273.0" y="467.0" width="339.0" height="71.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="285.0" y="499.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="321"><tspan x="285.0" dy="0">Penicilina G sódica EV</tspan></text><text x="285.0" y="515.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="321"><tspan x="285.0" dy="0">18-24 millones UI/día, 10-14 días</tspan></text><rect x="511.2" y="456.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="556.6" y="471.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="556.6" dy="0">◆ ESTE CASO</tspan></text><rect x="618.0" y="467.0" width="339.0" height="71.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="630.0" y="499.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="321"><tspan x="630.0" dy="0">Desensibilizar o ceftriaxona</tspan></text><text x="630.0" y="515.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="321"><tspan x="630.0" dy="0">2 g/día EV, 10-14 días</tspan></text><text x="44.0" y="560.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">En la gestante alérgica siempre se desensibiliza: solo la penicilina trata al feto.</tspan></text><text x="40.0" y="608.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SIGNOS CON NOMBRE PROPIO</tspan></text><rect x="40.0" y="620.0" width="920.0" height="213.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><line x1="62.0" y1="662.0" x2="938.0" y2="662.0" stroke="#0f766e" stroke-width="2"/><line x1="62.0" y1="662.0" x2="62.0" y2="670.0" stroke="#0f766e" stroke-width="2"/><line x1="938.0" y1="662.0" x2="938.0" y2="670.0" stroke="#0f766e" stroke-width="2"/><rect x="376.8" y="650.0" width="246.3" height="24.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/><text x="500.0" y="666.0" font-size="10.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="232"><tspan x="500.0" dy="0">MENINGITIS SIFILÍTICA · 3 de 3 en el caso</tspan></text><rect x="56.0" y="682.0" width="288.0" height="104.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="76.0" cy="705.0" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="76.0" y="709.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="76.0" dy="0">1</tspan></text><text x="94.0" y="710.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="242"><tspan x="94.0" dy="0">Rigidez de nuca y Kernig</tspan></text><text x="68.0" y="736.0" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="264"><tspan x="68.0" dy="0">Presentes</tspan></text><rect x="68.0" y="752.0" width="264.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="200.0" y="767.0" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="252"><tspan x="200.0" dy="0">✓ EN EL CASO</tspan></text><rect x="356.0" y="682.0" width="288.0" height="104.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="376.0" cy="705.0" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="376.0" y="709.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="376.0" dy="0">2</tspan></text><text x="394.0" y="710.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="242"><tspan x="394.0" dy="0">LCR linfocitario, proteínas altas</tspan></text><text x="368.0" y="736.0" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="264"><tspan x="368.0" dy="0">Sí</tspan></text><rect x="368.0" y="752.0" width="264.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="500.0" y="767.0" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="252"><tspan x="500.0" dy="0">✓ EN EL CASO</tspan></text><rect x="656.0" y="682.0" width="288.0" height="104.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="676.0" cy="705.0" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="676.0" y="709.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="676.0" dy="0">3</tspan></text><text x="694.0" y="710.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="242"><tspan x="694.0" dy="0">VDRL (+) en el LCR</tspan></text><text x="668.0" y="736.0" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="264"><tspan x="668.0" dy="0">Positivo</tspan></text><rect x="668.0" y="752.0" width="264.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="800.0" y="767.0" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="252"><tspan x="800.0" dy="0">✓ EN EL CASO</tspan></text><text x="56.0" y="813.0" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">VIH sin TAR + meningitis aséptica + VDRL en LCR = neurosífilis.</tspan></text><text x="40.0" y="873.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="883.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="914.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="914.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Doxiciclina</tspan></text><text x="435.0" y="905.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Penicilina</tspan><tspan x="435.0" dy="17">benzatínica</tspan></text><rect x="513.0" y="886.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="914.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Penicilina G sódica</tspan></text><text x="735.0" y="914.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ceftriaxona</tspan></text><text x="885.0" y="914.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Azitromicina</tspan></text><rect x="40.0" y="937.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="937.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="974.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tratamiento?</tspan></text><text x="285.0" y="958.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: alternativa para</tspan><tspan x="285.0" dy="16">sífilis temprana, no del</tspan><tspan x="285.0" dy="16">SNC</tspan></text><text x="435.0" y="974.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no llega al LCR</tspan></text><text x="585.0" y="974.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: EV, llega al LCR</tspan></text><text x="735.0" y="958.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Solo si hay alergia y no</tspan><tspan x="735.0" dy="16">se puede</tspan><tspan x="735.0" dy="16">desensibilizar</tspan></text><text x="885.0" y="966.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: resistencias y no</tspan><tspan x="885.0" dy="16">llega al SNC</tspan></text><rect x="40.0" y="883.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1027.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1055.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1077.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Penicilina G cristalina (sódica) 18-24 millones UI/día EV por 10-14 días.</tspan><tspan x="58.0" dy="18">• La benzatínica no alcanza niveles en el LCR: no sirve para neurosífilis.</tspan><tspan x="58.0" dy="18">• Alergia: desensibilizar (de preferencia) o ceftriaxona 2 g/día por 10-14 días; reiniciar TAR.</tspan></text><text x="58.0" y="1135.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, guías de ITS (2021); MINSA Perú, NTS de ITS (2024); IDSA.</tspan></text></svg>