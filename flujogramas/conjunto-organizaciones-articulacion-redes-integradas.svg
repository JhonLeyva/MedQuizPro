<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1073" viewBox="0 0 1000 1073" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Organizaciones que atienden de forma equitativa e integral a una población definida, articuladas y que rinden cuentas por sus resultados: Redes Integradas de Salud"><title>Organizaciones que atienden de forma equitativa e integral a una población definida, articuladas y que rinden cuentas por sus resultados: Redes Integradas de Salud</title><rect x="0.75" y="0.75" width="998.5" height="1071.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Sistema de salud · organización de los servicios</tspan></text><rect x="485.1" y="32.0" width="143.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="556.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="127"><tspan x="556.8" dy="0">SALUD PÚBLICA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Redes Integradas de Salud (RIS)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Unen establecimientos de todos los niveles de un territorio con referencia y</tspan><tspan x="58.0" dy="17">contrarreferencia.</tspan><tspan x="58.0" dy="17">Responden por la salud de su población, no solo por las atenciones.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Organizaciones articuladas que atienden a una</tspan><tspan x="640.0" dy="16">población definida</tspan><tspan x="640.0" dy="16">y rinden cuentas por sus resultados.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">UNA RED INTEGRADA: TODOS LOS NIVELES CONECTADOS</tspan></text><rect x="197.5" y="293.0" width="245.0" height="44.0" rx="8" fill="#5eead4" stroke="#ffffff" stroke-width="2"/><text x="209.5" y="320.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="60"><tspan x="209.5" dy="0">III-2</tspan></text><text x="263.5" y="313.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="165"><tspan x="263.5" dy="0">Instituto especializado</tspan></text><text x="263.5" y="328.0" font-size="10" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="165"><tspan x="263.5" dy="0">Investigación y máxima complejidad</tspan></text><rect x="175.0" y="343.0" width="290.0" height="44.0" rx="8" fill="#5eead4" stroke="#ffffff" stroke-width="2"/><text x="187.0" y="370.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="60"><tspan x="187.0" dy="0">III-1</tspan></text><text x="241.0" y="363.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="210"><tspan x="241.0" dy="0">Hospital III</tspan></text><text x="241.0" y="378.0" font-size="10" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="210"><tspan x="241.0" dy="0">Alta especialización</tspan></text><rect x="152.5" y="393.0" width="335.0" height="44.0" rx="8" fill="#0f766e" stroke="#ffffff" stroke-width="2"/><text x="164.5" y="420.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="60"><tspan x="164.5" dy="0">II-2</tspan></text><text x="218.5" y="413.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="255"><tspan x="218.5" dy="0">Hospital II</tspan></text><text x="218.5" y="428.0" font-size="10" font-weight="500" font-style="normal" fill="#ffffff" text-anchor="start" data-max="255"><tspan x="218.5" dy="0">Más especialidades, UCI</tspan></text><rect x="130.0" y="443.0" width="380.0" height="44.0" rx="8" fill="#99f6e4" stroke="#ffffff" stroke-width="2"/><text x="142.0" y="470.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="60"><tspan x="142.0" dy="0">II-1</tspan></text><text x="196.0" y="463.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="300"><tspan x="196.0" dy="0">Hospital I</tspan></text><text x="196.0" y="478.0" font-size="10" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="300"><tspan x="196.0" dy="0">Medicina, cirugía, pediatría, gineco-obstetricia</tspan></text><rect x="107.5" y="493.0" width="425.0" height="44.0" rx="8" fill="#99f6e4" stroke="#ffffff" stroke-width="2"/><text x="119.5" y="520.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="60"><tspan x="119.5" dy="0">I-4</tspan></text><text x="173.5" y="513.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="345"><tspan x="173.5" dy="0">Centro con internamiento</tspan></text><text x="173.5" y="528.0" font-size="10" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="345"><tspan x="173.5" dy="0">Parto, internamiento corto, algunas especialidades</tspan></text><rect x="85.0" y="543.0" width="470.0" height="44.0" rx="8" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="97.0" y="570.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="60"><tspan x="97.0" dy="0">I-3</tspan></text><text x="151.0" y="563.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="390"><tspan x="151.0" dy="0">Centro de salud</tspan></text><text x="151.0" y="578.0" font-size="10" font-weight="500" font-style="normal" fill="#ffffff" text-anchor="start" data-max="390"><tspan x="151.0" dy="0">Médicos, laboratorio básico, sin internamiento</tspan></text><rect x="459.6" y="532.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="505.0" y="547.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="505.0" dy="0">◆ ESTE CASO</tspan></text><rect x="62.5" y="593.0" width="515.0" height="44.0" rx="8" fill="#ccfbf1" stroke="#ffffff" stroke-width="2"/><text x="74.5" y="620.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="60"><tspan x="74.5" dy="0">I-2</tspan></text><text x="128.5" y="613.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="435"><tspan x="128.5" dy="0">Puesto con médico</tspan></text><text x="128.5" y="628.0" font-size="10" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="435"><tspan x="128.5" dy="0">Consulta médica general</tspan></text><rect x="40.0" y="643.0" width="560.0" height="44.0" rx="8" fill="#ccfbf1" stroke="#ffffff" stroke-width="2"/><text x="52.0" y="670.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="60"><tspan x="52.0" dy="0">I-1</tspan></text><text x="106.0" y="663.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="480"><tspan x="106.0" dy="0">Puesto de salud</tspan></text><text x="106.0" y="678.0" font-size="10" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="480"><tspan x="106.0" dy="0">Técnico o profesional no médico</tspan></text><text x="320.0" y="707.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="560"><tspan x="320.0" dy="0">▲ más complejidad · ▼ más cerca de la comunidad</tspan></text><path d="M584.0 565.0 H614.0 V415.0 H584.0" fill="none" stroke="#ea580c" stroke-width="3"/><polygon points="584.0,408.0 584.0,422.0 572.0,415.0" fill="#ea580c"/><text x="622.0" y="494.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ea580c" text-anchor="start" data-max="120"><tspan x="622.0" dy="0">Referencia</tspan></text><rect x="750.0" y="293.0" width="210.0" height="85.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="751.0" y="294.0" width="6.0" height="83.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="768.0" y="317.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="180"><tspan x="768.0" dy="0">Población definida</tspan></text><text x="768.0" y="338.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="180"><tspan x="768.0" dy="0">Un territorio con sus habitantes</tspan><tspan x="768.0" dy="16">La red responde por su salud</tspan></text><rect x="750.0" y="388.0" width="210.0" height="85.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="751.0" y="389.0" width="6.0" height="83.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="768.0" y="412.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="180"><tspan x="768.0" dy="0">Articulación</tspan></text><text x="768.0" y="433.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="180"><tspan x="768.0" dy="0">Referencia y contrarreferencia</tspan><tspan x="768.0" dy="16">Historia clínica compartida</tspan></text><rect x="750.0" y="483.0" width="210.0" height="85.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="751.0" y="484.0" width="6.0" height="83.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="768.0" y="507.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="180"><tspan x="768.0" dy="0">Rendición de cuentas</tspan></text><text x="768.0" y="528.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="180"><tspan x="768.0" dy="0">Por resultados sanitarios</tspan><tspan x="768.0" dy="16">No solo por número de consultas</tspan></text><text x="40.0" y="753.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="763.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="802.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="794.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Seguro Integral de</tspan><tspan x="285.0" dy="17">Salud</tspan></text><text x="435.0" y="785.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hospitales</tspan><tspan x="435.0" dy="17">nacionales y</tspan><tspan x="435.0" dy="17">regionales</tspan></text><rect x="513.0" y="766.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="794.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Redes Integradas</tspan><tspan x="585.0" dy="17">de Salud</tspan></text><text x="735.0" y="794.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Centros de salud</tspan><tspan x="735.0" dy="17">del primer nivel</tspan></text><text x="885.0" y="794.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Aseguradoras</tspan><tspan x="885.0" dy="17">privadas de salud</tspan></text><rect x="40.0" y="834.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="834.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="871.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Corresponde a?</tspan></text><text x="285.0" y="863.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: financia, no presta</tspan><tspan x="285.0" dy="16">servicios</tspan></text><text x="435.0" y="871.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: son solo un nivel</tspan></text><text x="585.0" y="863.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: todos los niveles</tspan><tspan x="585.0" dy="16">articulados</tspan></text><text x="735.0" y="863.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: son solo el primer</tspan><tspan x="735.0" dy="16">nivel</tspan></text><text x="885.0" y="855.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: financian, no</tspan><tspan x="885.0" dy="16">rinden cuentas por la</tspan><tspan x="885.0" dy="16">población</tspan></text><rect x="40.0" y="763.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="924.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="952.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="974.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Ley 30885 (2018) crea las RIS; el primer nivel es la puerta de entrada y resuelve la mayoría de problemas.</tspan><tspan x="58.0" dy="18">• Referencia: subir al nivel que resuelve; contrarreferencia: volver al primer nivel para el seguimiento.</tspan><tspan x="58.0" dy="18">• SIS: es un seguro (financia), no una red de servicios.</tspan></text><text x="58.0" y="1032.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA Perú, Ley 30885 de Redes Integradas de Salud y su reglamento; OPS, Redes Integradas de Servicios de Salud (2010).</tspan></text></svg>