<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1251" viewBox="0 0 1000 1251" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Niña con fiebre, vómitos, dolor en hipocondrio derecho y hepatomegalia sin ictericia: transaminasas para ver inflamación del hígado"><title>Niña con fiebre, vómitos, dolor en hipocondrio derecho y hepatomegalia sin ictericia: transaminasas para ver inflamación del hígado</title><rect x="0.75" y="0.75" width="998.5" height="1250.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Hepatitis aguda en el niño</tspan></text><rect x="354.5" y="32.0" width="180.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="444.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="164"><tspan x="444.6" dy="0">GASTROENTEROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hepatitis aguda</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Inflamación del hígado: las células rotas liberan ALT y AST.</tspan><tspan x="58.0" dy="17">En niños pequeños suele ser anictérica (sin ictericia), sobre todo la hepatitis A.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niña de 2 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">6 días de fiebre, anorexia, náuseas, vómitos y dolor</tspan><tspan x="640.0" dy="16">abdominal.</tspan><tspan x="640.0" dy="16">Dolor en hipocondrio derecho; hígado a 2 cm del</tspan><tspan x="640.0" dy="16">reborde; sin ictericia.</tspan></text><line x1="640.0" y1="237.0" x2="670.0" y2="237.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#94a3b8"/><line x1="500.0" y1="393.0" x2="500.0" y2="423.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="423.0" x2="733.5" y2="423.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="423.0" x2="266.5" y2="452.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,451.0 271.5,451.0 266.5,459.0" fill="#94a3b8"/><line x1="733.5" y1="423.0" x2="733.5" y2="452.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,451.0 738.5,451.0 733.5,459.0" fill="#94a3b8"/><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#0f766e"/><line x1="500.0" y1="393.0" x2="500.0" y2="423.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="423.0" x2="500.0" y2="423.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="423.0" x2="266.5" y2="452.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,451.0 271.5,451.0 266.5,459.0" fill="#0f766e"/><rect x="204.5" y="432.0" width="124.0" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="444.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Confirmar (este caso)</tspan></text><rect x="667.9" y="432.0" width="131.2" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="444.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Si hay ictericia y acolia</tspan></text><polygon points="240.0,358.0 266.0,323.0 734.0,323.0 760.0,358.0 734.0,393.0 266.0,393.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="358.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="363.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="354.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Hepatomegalia dolorosa con fiebre y vómitos: ¿inflamación</tspan><tspan x="519.0" dy="17">del hígado?</tspan></text><rect x="40.0" y="459.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="487.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">TRANSAMINASAS (ALT, AST)</tspan></text><text x="266.5" y="510.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Muy altas: hepatitis aguda</tspan><tspan x="266.5" dy="17">Luego IgM anti-VHA</tspan></text><rect x="507.0" y="459.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="495.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Bilirrubinas, FA, GGT</tspan></text><text x="733.5" y="518.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Colestasis</tspan></text><text x="40.0" y="589.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="601.5" width="920.0" height="323.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="615.5" width="304.6" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="208.3" y="635.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="208.3" dy="0">PATRÓN DE DAÑO HEPÁTICO (ÍNDICE R)</tspan></text><text x="376.6" y="635.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="565"><tspan x="376.6" dy="0">R = (ALT / límite normal) ÷ (FA / límite normal).</tspan></text><rect x="56.0" y="675.5" width="288.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="676.1" width="286.8" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="200.0" y="703.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="272"><tspan x="200.0" dy="0">R &gt; 5</tspan></text><text x="200.0" y="723.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="264"><tspan x="200.0" dy="0">Hepatocelular</tspan></text><circle cx="72.0" cy="748.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="752.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="82.0" dy="0">Hepatitis viral, tóxica</tspan></text><rect x="356.0" y="675.5" width="288.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="356.6" y="676.1" width="286.8" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="500.0" y="703.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="272"><tspan x="500.0" dy="0">R 2-5</tspan></text><text x="500.0" y="723.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="264"><tspan x="500.0" dy="0">Mixto</tspan></text><circle cx="372.0" cy="748.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="382.0" y="752.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="382.0" dy="0">Fármacos</tspan></text><rect x="656.0" y="675.5" width="288.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="656.6" y="676.1" width="286.8" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="800.0" y="703.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="272"><tspan x="800.0" dy="0">R &lt; 2</tspan></text><text x="800.0" y="723.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="264"><tspan x="800.0" dy="0">Colestásico</tspan></text><circle cx="672.0" cy="748.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="682.0" y="752.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="682.0" dy="0">Obstrucción biliar</tspan></text><text x="56.0" y="803.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">PARA UBICAR ESTE CASO</tspan></text><rect x="56.0" y="812.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="827.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="827.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">En la hepatitis viral se espera un patrón hepatocelular</tspan></text><rect x="56.0" y="834.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="849.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="849.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Las transaminasas lo definen</tspan></text><rect x="56.0" y="871.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="894.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Transaminasas, luego IgM anti-VHA y tiempo de protrombina.</tspan></text><text x="40.0" y="964.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="974.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1005.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1005.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hemocultivo</tspan></text><text x="435.0" y="1005.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Fosfatasa alcalina</tspan></text><text x="585.0" y="997.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Velocidad de</tspan><tspan x="585.0" dy="17">sedimentación</tspan></text><rect x="663.0" y="977.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="1005.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Transaminasas</tspan></text><text x="885.0" y="1005.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Amilasa</tspan></text><rect x="40.0" y="1028.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="1028.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1057.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Prueba?</tspan></text><text x="285.0" y="1057.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: busca bacteriemia</tspan></text><text x="435.0" y="1049.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: mide colestasis y</tspan><tspan x="435.0" dy="16">hueso</tspan></text><text x="585.0" y="1049.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: inflamación</tspan><tspan x="585.0" dy="16">general</tspan></text><text x="735.0" y="1057.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: daño del hepatocito</tspan></text><text x="885.0" y="1049.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es para el</tspan><tspan x="885.0" dy="16">páncreas</tspan></text><rect x="40.0" y="974.5" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1102.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1130.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1152.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• ALT y AST altas confirman daño hepatocelular; muy altas (&gt; 10 veces) en la hepatitis viral.</tspan><tspan x="58.0" dy="18">• Luego la causa: IgM anti-VHA primero en niños peruanos; tiempo de protrombina para la gravedad.</tspan><tspan x="58.0" dy="18">• Fosfatasa alcalina y GGT orientan a colestasis, no a inflamación del hepatocito.</tspan></text><text x="58.0" y="1210.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAP, Red Book (2024); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>