<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1035" viewBox="0 0 1000 1035" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La empagliflozina bloquea el SGLT2 del túbulo proximal y aumenta la glucosuria"><title>La empagliflozina bloquea el SGLT2 del túbulo proximal y aumenta la glucosuria</title><rect x="0.75" y="0.75" width="998.5" height="1033.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Farmacología · inhibidores de SGLT2</tspan></text><rect x="419.2" y="32.0" width="140.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="489.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="124"><tspan x="489.4" dy="0">ENDOCRINOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Gliflozinas</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Inhiben el cotransportador sodio-glucosa tipo 2 del túbulo proximal.</tspan><tspan x="58.0" dy="17">Bajan la glucemia sin depender de la insulina.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Diabetes mellitus tipo 2</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué fármaco aumenta la excreción urinaria de</tspan><tspan x="640.0" dy="16">glucosa?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">RECORRIDO DE LA GLUCOSA CON EL FÁRMACO</tspan></text><rect x="40.0" y="269.0" width="920.0" height="83.0" rx="0" fill="#e0f2fe" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="269.0" width="112.0" height="83.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="310.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Filtrado (luz del</tspan><tspan x="96.0" dy="14">túbulo)</tspan></text><rect x="40.0" y="352.0" width="920.0" height="83.0" rx="0" fill="#fef3c7" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="352.0" width="112.0" height="83.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="393.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Túbulo proximal</tspan><tspan x="96.0" dy="14">(SGLT2)</tspan></text><rect x="40.0" y="435.0" width="920.0" height="83.0" rx="0" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="435.0" width="112.0" height="83.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="480.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Orina excretada</tspan></text><rect x="40.0" y="518.0" width="920.0" height="83.0" rx="0" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="518.0" width="112.0" height="83.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="563.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Sangre</tspan></text><line x1="322.0" y1="337.0" x2="322.0" y2="356.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="317.0,356.0 327.0,356.0 322.0,365.0" fill="#0f766e"/><line x1="472.0" y1="393.5" x2="479.0" y2="393.5" stroke="#ea580c" stroke-width="2.2"/><polygon points="479.0,398.5 479.0,388.5 488.0,393.5" fill="#ea580c"/><line x1="638.0" y1="420.0" x2="331.0" y2="447.2" stroke="#ea580c" stroke-width="2.2"/><polygon points="330.5,442.2 331.4,452.2 322.0,448.0" fill="#ea580c"/><line x1="322.0" y1="503.0" x2="322.0" y2="522.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="317.0,522.0 327.0,522.0 322.0,531.0" fill="#0f766e"/><rect x="172.0" y="284.0" width="300.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="300.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Glucosa filtrada por el glomérulo</tspan></text><text x="182.0" y="317.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Normalmente casi toda se recupera</tspan></text><circle cx="172.0" cy="284.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="288.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">1</tspan></text><rect x="172.0" y="367.0" width="300.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="383.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">El SGLT2 reabsorbe ~90 % de la glucosa</tspan></text><text x="182.0" y="400.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Entra junto con el sodio</tspan></text><circle cx="172.0" cy="367.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="371.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">2</tspan></text><rect x="488.0" y="367.0" width="300.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="498.0" y="383.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="280"><tspan x="498.0" dy="0">Empagliflozina bloquea el SGLT2</tspan></text><text x="498.0" y="400.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="498.0" dy="0">La glucosa ya no se reabsorbe</tspan></text><circle cx="488.0" cy="367.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="488.0" y="371.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="488.0" dy="0">3</tspan></text><rect x="172.0" y="450.0" width="300.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="182.0" y="466.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Glucosuria de 60-80 g por día</tspan></text><text x="182.0" y="483.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">La glucosa sale en la orina</tspan></text><circle cx="172.0" cy="450.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="454.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">4</tspan></text><rect x="172.0" y="533.0" width="300.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="549.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Baja la glucemia sin insulina</tspan></text><text x="182.0" y="566.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Menos peso y presión; beneficio cardiorrenal</tspan></text><circle cx="172.0" cy="533.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="537.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">5</tspan></text><rect x="40.0" y="619.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="645.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Empagliflozina = inhibidor de SGLT2 = glucosuria</tspan></text><text x="60.0" y="664.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Su efecto no depende de la insulina.</tspan></text><text x="40.0" y="731.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="741.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="763.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="763.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Sitagliptina</tspan></text><text x="435.0" y="763.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Metformina</tspan></text><text x="585.0" y="763.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Glimepirida</tspan></text><text x="735.0" y="763.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Pioglitazona</tspan></text><rect x="813.0" y="744.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="763.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Empagliflozina</tspan></text><rect x="40.0" y="778.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="778.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="815.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Más glucosuria?</tspan></text><text x="285.0" y="807.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: inhibe la DPP-4 y</tspan><tspan x="285.0" dy="16">aumenta las incretinas</tspan></text><text x="435.0" y="799.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: reduce la</tspan><tspan x="435.0" dy="16">gluconeogénesis</tspan><tspan x="435.0" dy="16">hepática</tspan></text><text x="585.0" y="807.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: libera insulina del</tspan><tspan x="585.0" dy="16">páncreas</tspan></text><text x="735.0" y="807.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: sensibiliza a la</tspan><tspan x="735.0" dy="16">insulina</tspan></text><text x="885.0" y="807.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: bloquea el SGLT2</tspan><tspan x="885.0" dy="16">del túbulo proximal</tspan></text><rect x="40.0" y="741.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="868.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="896.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="918.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El SGLT2 reabsorbe cerca del 90 % de la glucosa filtrada; al bloquearlo, hay glucosuria de 60-80 g al día, con pérdida de peso y de presión arterial.</tspan><tspan x="58.0" dy="18">• Beneficio cardiovascular y renal demostrado en insuficiencia cardiaca y enfermedad renal crónica, incluso sin diabetes (ADA 2025; KDIGO 2022).</tspan><tspan x="58.0" dy="18">• Adversos: infecciones genitales por hongos, depleción de volumen y cetoacidosis euglucémica (suspender unos días antes de cirugía).</tspan><tspan x="58.0" dy="18">• Otros: sitagliptina inhibe DPP-4; metformina baja la gluconeogénesis; glimepirida libera insulina; pioglitazona sensibiliza a la insulina.</tspan></text><text x="58.0" y="994.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ADA, Standards of Care in Diabetes (2025); KDIGO, diabetes en enfermedad renal crónica (2022); MINSA, GPC de DM2 en el primer nivel de atención</tspan></text></svg>