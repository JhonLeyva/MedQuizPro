<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1085" viewBox="0 0 1000 1085" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Hipertenso con deterioro cognitivo y síndrome pseudobulbar: infartos lacunares múltiples"><title>Hipertenso con deterioro cognitivo y síndrome pseudobulbar: infartos lacunares múltiples</title><rect x="0.75" y="0.75" width="998.5" height="1083.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Demencias · demencia vascular</tspan></text><rect x="388.0" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="452.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="452.3" dy="0">NEUROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="168.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Demencia vascular subcortical</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La hipertensión daña las arterias pequeñas: infartos lacunares y leucoaraiosis.</tspan><tspan x="58.0" dy="17">Enlentecimiento, alteración de la marcha y síndrome pseudobulbar.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="168.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="166.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 74 años, HTA de 20 años mal</tspan><tspan x="640.0" dy="17">controlada</tspan></text><text x="640.0" y="176.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">2 años de olvidos, enlentecimiento, dificultad para</tspan><tspan x="640.0" dy="16">caminar, hablar y deglutir.</tspan><tspan x="640.0" dy="16">Hachinski 5: orienta a demencia vascular.</tspan></text><rect x="640.0" y="229.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="242.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="242.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="290.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LAGUNAS FRENTE A HIDROCEFALIA</tspan></text><rect x="40.0" y="312.0" width="438.0" height="370.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="52.0" y="322.0" width="142.0" height="20.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="336.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">INFARTOS LACUNARES</tspan></text><rect x="362.6" y="301.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="408.0" y="316.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">◆ ESTE CASO</tspan></text><g transform="translate(119.0,350.0) scale(1.0)"><rect x="0" y="0" width="280" height="260" rx="10" fill="#0b1220"/><ellipse cx="140" cy="132" rx="116" ry="118" fill="#e5e7eb" stroke="none" stroke-width="0" /><ellipse cx="140" cy="132" rx="106" ry="108" fill="#6b7280" stroke="none" stroke-width="0" /><path d="M119 96 C111 120 113 150 127.5 164 L136 150 L136 100 Z" fill="#111827" stroke="none" stroke-width="0" stroke-linejoin="round" /><path d="M161 96 C169 120 167 150 152.5 164 L144 150 L144 100 Z" fill="#111827" stroke="none" stroke-width="0" stroke-linejoin="round" /><ellipse cx="100" cy="118" rx="16" ry="26" fill="#4b5563" stroke="none" stroke-width="0" opacity="0.8"/><ellipse cx="180" cy="118" rx="16" ry="26" fill="#4b5563" stroke="none" stroke-width="0" opacity="0.8"/><circle cx="116" cy="124" r="6.5" fill="#111827" stroke="none" stroke-width="0" /><circle cx="164" cy="130" r="6.5" fill="#111827" stroke="none" stroke-width="0" /><circle cx="124" cy="154" r="6.5" fill="#111827" stroke="none" stroke-width="0" /><circle cx="158" cy="106" r="6.5" fill="#111827" stroke="none" stroke-width="0" /><circle cx="104" cy="96" r="6.5" fill="#111827" stroke="none" stroke-width="0" /><circle cx="176" cy="150" r="6.5" fill="#111827" stroke="none" stroke-width="0" /><circle cx="92" cy="140" r="6.5" fill="#111827" stroke="none" stroke-width="0" /><text x="140" y="11" font-size="9" font-weight="800" fill="#94a3b8" text-anchor="middle" data-max="0">adelante</text></g><text x="54.0" y="630.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="54.0" dy="0">Huecos oscuros (lagunas) en ganglios basales y sustancia blanca gris</tspan><tspan x="54.0" dy="16">oscura alrededor de los ventrículos (leucoaraiosis).</tspan></text><rect x="522.0" y="312.0" width="438.0" height="370.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="534.0" y="322.0" width="178.1" height="20.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1"/><text x="543.0" y="336.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="543.0" dy="0">HIDROCEFALIA NORMOTENSA</tspan></text><g transform="translate(601.0,350.0) scale(1.0)"><rect x="0" y="0" width="280" height="260" rx="10" fill="#0b1220"/><ellipse cx="140" cy="132" rx="116" ry="118" fill="#e5e7eb" stroke="none" stroke-width="0" /><ellipse cx="140" cy="132" rx="106" ry="108" fill="#6b7280" stroke="none" stroke-width="0" /><path d="M96 96 C88 120 90 150 116.0 164 L136 150 L136 100 Z" fill="#111827" stroke="none" stroke-width="0" stroke-linejoin="round" /><path d="M184 96 C192 120 190 150 164.0 164 L144 150 L144 100 Z" fill="#111827" stroke="none" stroke-width="0" stroke-linejoin="round" /><text x="140" y="11" font-size="9" font-weight="800" fill="#94a3b8" text-anchor="middle" data-max="0">adelante</text></g><text x="536.0" y="630.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="536.0" dy="0">Ventrículos grandes sin infartos (esquema de TC).</tspan></text><circle cx="500.0" cy="481.0" r="17" fill="#ea580c" stroke="none" stroke-width="0"/><polygon points="494.0,473.0 494.0,489.0 508.0,481.0" fill="#ffffff"/><text x="40.0" y="712.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OTRAS IMÁGENES</tspan></text><rect x="40.0" y="722.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="723.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="746.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Lagunas múltiples</tspan></text><text x="58.0" y="767.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">HTA de años + pseudobulbar: este caso.</tspan></text><rect x="237.5" y="711.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="282.9" y="726.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="282.9" dy="0">◆ ESTE CASO</tspan></text><rect x="351.3" y="722.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="723.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="746.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Atrofia temporoparietal</tspan></text><text x="369.3" y="767.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Alzheimer.</tspan></text><rect x="662.7" y="722.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="723.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="746.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Hematoma lobar único</tspan></text><text x="680.7" y="767.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Angiopatía amiloide; es agudo.</tspan></text><text x="40.0" y="831.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="841.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="863.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="863.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Hematoma lobar</tspan></text><text x="491.2" y="863.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Atrofia temporoparietal</tspan></text><text x="678.8" y="863.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Ventriculomegalia</tspan></text><rect x="775.5" y="844.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="863.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Lagunas múltiples</tspan></text><rect x="40.0" y="878.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="878.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="899.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Sugiere</tspan></text><text x="303.8" y="899.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Hemorragia aguda</tspan></text><text x="491.2" y="899.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Alzheimer</tspan></text><text x="678.8" y="899.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Hidrocefalia normotensa</tspan></text><text x="866.2" y="899.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Demencia vascular</tspan></text><rect x="40.0" y="841.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="936.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="964.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="986.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• TC típica: múltiples lagunas en sustancia blanca periventricular y ganglios basales, con leucoaraiosis.</tspan><tspan x="58.0" dy="18">• Alzheimer: atrofia temporal y parietal sin lesiones de sustancia blanca.</tspan><tspan x="58.0" dy="18">• Hidrocefalia normotensa: ventrículos grandes sin surcos ampliados; hematoma lobar: angiopatía amiloide.</tspan></text><text x="58.0" y="1044.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Harrison Principios de Medicina Interna 22.ª ed. (2025); AHA/ASA, deterioro cognitivo vascular (2011).</tspan></text></svg>