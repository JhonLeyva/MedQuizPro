<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="882" viewBox="0 0 1000 882" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El factor de riesgo del cáncer gástrico es la infección por Helicobacter pylori"><title>El factor de riesgo del cáncer gástrico es la infección por Helicobacter pylori</title><rect x="0.75" y="0.75" width="998.5" height="880.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Gastroenterología · factores de riesgo del cáncer gástrico</tspan></text><rect x="540.5" y="32.0" width="165.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="623.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="149"><tspan x="623.2" dy="0">GASTROENTEROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cáncer gástrico</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El adenocarcinoma distal es la neoplasia más ligada a una infección.</tspan><tspan x="58.0" dy="17">La IARC clasificó H. pylori como carcinógeno grupo 1 en 1994.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es el factor de riesgo para el cáncer gástrico?</tspan></text><line x1="640.0" y1="189.0" x2="670.0" y2="189.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ ELEVA EL RIESGO DE CÁNCER GÁSTRICO Y QUÉ NO</tspan></text><line x1="410.3" y1="387.0" x2="340.0" y2="409.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="409.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.1" y1="329.1" x2="660.0" y2="305.4" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="305.4" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="387.0" x2="660.0" y2="409.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="409.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="410.9" y1="329.1" x2="340.0" y2="305.4" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="305.4" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="359.0" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="359.0" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="354.5" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">CÁNCER</tspan><tspan x="500.0" dy="19">GÁSTRICO</tspan></text><text x="500.0" y="392.5" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">adenocarcinoma distal</tspan></text><rect x="40.0" y="263.4" width="300.0" height="84.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="297.2" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">H. PYLORI</tspan></text><text x="190.0" y="320.8" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Principal factor modificable (grupo 1)</tspan></text><rect x="144.6" y="337.4" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="352.4" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="363.4" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="364.4" width="6.0" height="89.2" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="392.2" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">OTROS FACTORES</tspan></text><text x="190.0" y="415.9" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Anemia perniciosa, cirugía previa, EBV, CDH1,</tspan><tspan x="190.0" dy="17">sal y tabaco</tspan></text><rect x="660.0" y="263.4" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="264.4" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="810.0" y="297.2" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">NO SON FACTORES</tspan></text><text x="810.0" y="320.8" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Gastritis aguda, diarrea crónica y Giardia</tspan></text><rect x="660.0" y="363.4" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="364.4" width="6.0" height="89.2" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="392.2" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">ESÓFAGO</tspan></text><text x="810.0" y="415.9" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">La esofagitis crónica lleva a Barrett, no al</tspan><tspan x="810.0" dy="17">cáncer gástrico</tspan></text><text x="40.0" y="501.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="513.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="537.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Infección por H. pylori</tspan></text><line x1="248.5" y1="533.5" x2="267.5" y2="533.5" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,528.5 266.5,538.5 274.5,533.5" fill="#0f766e"/><rect x="278.5" y="513.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="537.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Gastritis crónica y atrofia</tspan></text><line x1="487.0" y1="533.5" x2="506.0" y2="533.5" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,528.5 505.0,538.5 513.0,533.5" fill="#0f766e"/><rect x="517.0" y="513.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="537.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Metaplasia intestinal y displasia</tspan></text><line x1="725.5" y1="533.5" x2="744.5" y2="533.5" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,528.5 743.5,538.5 751.5,533.5" fill="#0f766e"/><rect x="755.5" y="513.0" width="204.5" height="41.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="537.5" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Adenocarcinoma gástrico</tspan></text><text x="40.0" y="594.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="604.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="626.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="607.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="626.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Helicobacter pylori</tspan></text><text x="435.0" y="626.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Gastritis aguda</tspan></text><text x="585.0" y="626.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Diarrea crónica</tspan></text><text x="735.0" y="626.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Giardia lamblia</tspan></text><text x="885.0" y="626.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Esofagitis crónica</tspan></text><rect x="40.0" y="641.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="641.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="670.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Factor de riesgo?</tspan></text><text x="285.0" y="662.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: carcinógeno grupo</tspan><tspan x="285.0" dy="16">1 de la IARC</tspan></text><text x="435.0" y="662.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: proceso transitorio,</tspan><tspan x="435.0" dy="16">no premaligno</tspan></text><text x="585.0" y="662.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no se vincula al</tspan><tspan x="585.0" dy="16">cáncer gástrico</tspan></text><text x="735.0" y="662.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no se vincula al</tspan><tspan x="735.0" dy="16">cáncer gástrico</tspan></text><text x="885.0" y="662.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: se liga al esófago</tspan><tspan x="885.0" dy="16">de Barrett</tspan></text><rect x="40.0" y="604.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="715.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="743.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="765.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• H. pylori produce gastritis crónica y, según la cepa (CagA, VacA), la sal y el tabaco, evoluciona a atrofia, metaplasia intestinal y displasia.</tspan><tspan x="58.0" dy="18">• También se asocia con el linfoma gástrico MALT; la erradicación reduce el riesgo, sobre todo en personas sin lesiones avanzadas.</tspan><tspan x="58.0" dy="18">• Otros factores: anemia perniciosa, cirugía gástrica previa, virus de Epstein-Barr, antecedente familiar y mutaciones de CDH1.</tspan><tspan x="58.0" dy="18">• No son factores: gastritis aguda (transitoria), diarrea crónica ni Giardia; la esofagitis crónica se liga al esófago de Barrett, no al estómago.</tspan></text><text x="58.0" y="841.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACG Clinical Guideline: H. pylori. Am J Gastroenterol 2024;119:1730-1753; ESMO, cáncer gástrico. Ann Oncol 2022;33:1005-1020</tspan></text></svg>