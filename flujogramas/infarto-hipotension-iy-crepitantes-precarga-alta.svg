<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Infarto con hipotensión, piel fría, llenado lento, crepitantes e ingurgitación yugular: choque cardiogénico con precarga alta (frío y húmedo)"><title>Infarto con hipotensión, piel fría, llenado lento, crepitantes e ingurgitación yugular: choque cardiogénico con precarga alta (frío y húmedo)</title><rect x="0.75" y="0.75" width="998.5" height="898.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Síndrome coronario agudo · choque cardiogénico</tspan></text><rect x="493.9" y="32.0" width="132.2" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="560.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="116"><tspan x="560.0" dy="0">CARDIOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Choque cardiogénico</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El corazón infartado no bombea: baja el gasto (frío) y la sangre se acumula detrás</tspan><tspan x="58.0" dy="17">(húmedo).</tspan><tspan x="58.0" dy="17">Precarga alta: yugulares ingurgitadas y crepitantes (presión de enclavamiento &gt; 18).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 50 años, diabético</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">30 min de dolor retroesternal opresivo; CK-MB y</tspan><tspan x="640.0" dy="16">troponina altas.</tspan><tspan x="640.0" dy="16">PA 80/50, FC 60, SatO₂ 90 %; piel fría, llenado &gt; 5 s;</tspan><tspan x="640.0" dy="16">crepitantes e ingurgitación yugular.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PERFIL HEMODINÁMICO DE FORRESTER</tspan></text><text x="202.0" y="313.0" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="758"><tspan x="202.0" dy="0">→ PERFUSIÓN</tspan></text><rect x="202.0" y="323.0" width="373.0" height="35.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="388.5" y="345.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="353"><tspan x="388.5" dy="0">Caliente (perfunde)</tspan></text><rect x="587.0" y="323.0" width="373.0" height="35.0" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="773.5" y="345.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="353"><tspan x="773.5" dy="0">Fría (hipoperfusión)</tspan></text><text x="40.0" y="344.5" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="146"><tspan x="40.0" dy="0">↓ CONGESTIÓN</tspan></text><rect x="40.0" y="370.0" width="150.0" height="90.5" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="115.0" y="419.7" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Seco</tspan></text><rect x="202.0" y="370.0" width="373.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="371.0" width="6.0" height="88.5" rx="3" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="388.5" y="398.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">I: caliente y seco</tspan></text><text x="388.5" y="421.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Normal</tspan><tspan x="388.5" dy="17">Vigilar</tspan></text><rect x="587.0" y="370.0" width="373.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="588.0" y="371.0" width="6.0" height="88.5" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="773.5" y="398.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">III: frío y seco</tspan></text><text x="773.5" y="421.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Hipovolemia</tspan><tspan x="773.5" dy="17">Volumen</tspan></text><rect x="40.0" y="472.5" width="150.0" height="90.5" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="115.0" y="513.7" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Húmedo</tspan><tspan x="115.0" dy="17">(congestión)</tspan></text><rect x="202.0" y="472.5" width="373.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="473.5" width="6.0" height="88.5" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="388.5" y="500.8" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">II: caliente y húmedo</tspan></text><text x="388.5" y="523.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Congestión</tspan><tspan x="388.5" dy="17">Diuréticos</tspan></text><rect x="587.0" y="472.5" width="373.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="773.5" y="500.8" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">IV: FRÍO Y HÚMEDO</tspan></text><text x="773.5" y="523.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Choque cardiogénico</tspan><tspan x="773.5" dy="17">Precarga alta</tspan></text><rect x="728.1" y="551.9" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="773.5" y="566.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="773.5" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="612.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="622.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="653.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="653.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Normal</tspan></text><rect x="363.0" y="625.9" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="653.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Alta</tspan></text><text x="585.0" y="653.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Muy baja</tspan></text><text x="735.0" y="653.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Baja</tspan></text><text x="885.0" y="645.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Normal con</tspan><tspan x="885.0" dy="17">poscarga baja</tspan></text><rect x="40.0" y="676.9" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="676.9" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="705.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Precarga?</tspan></text><text x="285.0" y="705.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: hay congestión</tspan></text><text x="435.0" y="697.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: yugulares y</tspan><tspan x="435.0" dy="16">crepitantes</tspan></text><text x="585.0" y="697.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: congestión, no</tspan><tspan x="585.0" dy="16">depleción</tspan></text><text x="735.0" y="705.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: sería frío y seco</tspan></text><text x="885.0" y="697.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: la poscarga sube</tspan><tspan x="885.0" dy="16">(vasoconstricción)</tspan></text><rect x="40.0" y="622.9" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="750.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="778.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="800.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Reperfusión urgente (angioplastia primaria) es lo que más baja la mortalidad.</tspan><tspan x="58.0" dy="18">• Noradrenalina para la PA y dobutamina para el gasto; diurético con cuidado si hay congestión.</tspan><tspan x="58.0" dy="18">• Considerar soporte mecánico en centro especializado.</tspan></text><text x="58.0" y="858.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ESC, síndromes coronarios agudos (2023); AHA/ACC (2025).</tspan></text></svg>