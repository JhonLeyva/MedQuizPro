oke="#ea580c" stroke-width="2.2"/><polygon points="761.0,529.5 761.0,519.5 770.0,524.5" fill="#ea580c"/><rect x="158.0" y="298.0" width="190.0" height="70.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="314.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Autoevaluación con los</tspan><tspan x="168.0" dy="16">estándares</tspan></text><text x="168.0" y="347.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Termina en el informe técnico</tspan></text><circle cx="158.0" cy="298.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="302.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="362.0" y="394.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="372.0" y="410.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Evaluación externa</tspan></text><text x="372.0" y="427.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Evaluadores acreditados; informe</tspan><tspan x="372.0" dy="14.5">de evaluación</tspan></text><circle cx="362.0" cy="394.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="362.0" y="398.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="362.0" dy="0">2</tspan></text><rect x="566.0" y="490.0" width="190.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="576.0" y="506.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Decisión por puntaje exigido</tspan></text><text x="576.0" y="523.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Nacional o Regional</tspan></text><circle cx="566.0" cy="490.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="566.0" y="494.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="566.0" dy="0">3</tspan></text><rect x="770.0" y="490.0" width="190.0" height="69.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="780.0" y="506.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Constancia de acreditación</tspan></text><text x="780.0" y="523.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Certifica el nivel de calidad (este</tspan><tspan x="780.0" dy="14.5">caso)</tspan></text><circle cx="770.0" cy="490.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="770.0" y="494.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="770.0" dy="0">4</tspan></text><rect x="40.0" y="591.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="617.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Certificar el nivel de calidad = constancia de acreditación</tspan></text><text x="60.0" y="636.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El informe externo y la autoevaluación son pasos previos; la categorización es otro proceso.</tspan></text><text x="40.0" y="703.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="713.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="744.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="716.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="735.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Constancia de</tspan><tspan x="285.0" dy="17">acreditación</tspan></text><text x="435.0" y="735.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Informe de</tspan><tspan x="435.0" dy="17">evaluación externa</tspan></text><text x="585.0" y="735.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Informe técnico de</tspan><tspan x="585.0" dy="17">la autoevaluación</tspan></text><text x="735.0" y="735.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Documento de</tspan><tspan x="735.0" dy="17">categorización</tspan></text><text x="885.0" y="735.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Criterios de</tspan><tspan x="885.0" dy="17">evaluación</tspan></text><rect x="40.0" y="767.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="767.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="796.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Documento que</tspan><tspan x="54.0" dy="16">certifica?</tspan></text><text x="285.0" y="796.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: certifica el nivel de</tspan><tspan x="285.0" dy="16">calidad</tspan></text><text x="435.0" y="796.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: sustenta, pero no</tspan><tspan x="435.0" dy="16">certifica</tspan></text><text x="585.0" y="788.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es previo, lo</tspan><tspan x="585.0" dy="16">elabora el propio</tspan><tspan x="585.0" dy="16">servicio</tspan></text><text x="735.0" y="796.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: pertenece a otro</tspan><tspan x="735.0" dy="16">proceso</tspan></text><text x="885.0" y="796.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: son los estándares</tspan><tspan x="885.0" dy="16">utilizados</tspan></text><rect x="40.0" y="713.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="857.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="885.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="907.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Acreditación: evaluación periódica y voluntaria de estándares de calidad (NTS 050, RM 456-2007/MINSA). Habilitación y categorización son obligatorias.</tspan><tspan x="58.0" dy="18">• Dos fases: autoevaluación (informe técnico del propio establecimiento) y evaluación externa (evaluadores acreditados).</tspan><tspan x="58.0" dy="18">• Con el puntaje exigido, la Comisión emite la constancia de acreditación: certifica el cumplimiento del nivel de calidad.</tspan><tspan x="58.0" dy="18">• El informe de evaluación externa sustenta la decisión, pero no certifica. La norma pudo actualizarse; el libro marca B por error en su comentario, la clave</tspan><tspan x="58.0" dy="18">   es A.</tspan></text><text x="58.0" y="1001.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA, NTS 050-MINSA/DGSP-V.02, Acreditación de establecimientos de salud y servicios médicos de apoyo (RM 456-2007/MINSA); MINSA, NTS</tspan><tspan x="58.0" dy="15">021-MINSA/DGSP-V.03 (RM 546-2011/MINSA).</tspan></text></svg>