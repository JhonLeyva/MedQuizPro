"17" fill="#f59e0b" stroke="none" stroke-width="0"/><circle cx="400.0" cy="504.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="493.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Amarillo · si hay riesgo</tspan></text><text x="430.0" y="510.0" font-size="11.5" font-weight="700" font-style="normal" fill="#f59e0b" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Según exposición</tspan></text><text x="430.0" y="526.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Hepatitis A y B, neumococo</tspan></text><rect x="370.0" y="545.0" width="590.0" height="66.0" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.2"/><circle cx="400.0" cy="578.0" r="17" fill="#dc2626" stroke="none" stroke-width="0"/><circle cx="400.0" cy="578.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="567.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Rojo · no se indican</tspan></text><text x="430.0" y="584.0" font-size="11.5" font-weight="700" font-style="normal" fill="#dc2626" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Vivas atenuadas</tspan></text><text x="430.0" y="600.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Sarampión (SPR), varicela, BCG</tspan></text><rect x="854.6" y="534.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="900.0" y="549.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="900.0" dy="0">◆ SEMÁFORO</tspan></text><text x="40.0" y="713.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="723.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="745.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">COVID-19</tspan></text><rect x="363.0" y="726.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Sarampión</tspan></text><text x="585.0" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Pertussis</tspan></text><text x="735.0" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Antitetánica</tspan></text><text x="885.0" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Influenza inactivada</tspan></text><rect x="40.0" y="760.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="760.0" width="144.0" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="781.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿No indicada?</tspan></text><text x="285.0" y="781.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí se indica</tspan></text><text x="435.0" y="781.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: es viva atenuada</tspan></text><text x="585.0" y="781.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí se indica (Tdap)</tspan></text><text x="735.0" y="781.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí se indica</tspan></text><text x="885.0" y="781.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí se indica</tspan></text><rect x="40.0" y="723.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="818.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="846.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="868.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Tdap entre las 20 y 36 semanas (mejor 27-36): protege al bebé de la tosferina.</tspan><tspan x="58.0" dy="18">• Influenza en cualquier trimestre durante la temporada.</tspan><tspan x="58.0" dy="18">• SPR: vacunar antes del embarazo o en el puerperio; evitar embarazo 1 mes tras recibirla.</tspan></text><text x="58.0" y="926.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, vacunas en el embarazo (2025); MINSA Perú, esquema nacional de vacunación.</tspan></text></svg>