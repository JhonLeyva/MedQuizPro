<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Ojo rojo bilateral sin trauma, sin dolor intenso ni baja visual: la causa más frecuente es la conjuntivitis"><title>Ojo rojo bilateral sin trauma, sin dolor intenso ni baja visual: la causa más frecuente es la conjuntivitis</title><rect x="0.75" y="0.75" width="998.5" height="838.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Oftalmología · ojo rojo bilateral</tspan></text><rect x="383.8" y="32.0" width="162.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="465.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="146"><tspan x="465.0" dy="0">OFTALMOLOGÍA Y ORL RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ojo rojo bilateral</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Un proceso conjuntival difuso, bilateral y sin trauma apunta a conjuntivitis.</tspan><tspan x="58.0" dy="17">Las causas intraoculares casi siempre son unilaterales y duelen.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 23 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Congestión ocular bilateral confirmada al examen.</tspan><tspan x="640.0" dy="16">Sin antecedente de traumatismo ocular.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE UBICA LA CAUSA DEL OJO ROJO</tspan></text><rect x="40.0" y="269.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="180"><tspan x="54.0" dy="0">RASGO DEL CASO</tspan></text><text x="420.0" y="291.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="340"><tspan x="420.0" dy="0">Sin dolor ni baja visual</tspan></text><text x="780.0" y="291.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="340"><tspan x="780.0" dy="0">Con dolor, fotofobia o baja visual</tspan></text><rect x="40.0" y="309.0" width="194.0" height="57.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="335.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Bilateral, sin trauma</tspan></text><text x="54.0" y="352.0" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Este caso</tspan></text><rect x="243.0" y="309.0" width="354.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="255.0" y="334.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">Conjuntivitis (viral, bacteriana o alérgica)</tspan></text><text x="255.0" y="350.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">Hiperemia periférica, pupila normal</tspan></text><rect x="496.2" y="298.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="541.6" y="313.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="541.6" dy="0">◆ ESTE CASO</tspan></text><rect x="603.0" y="309.0" width="354.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="615.0" y="334.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">Poco probable: revisar</tspan></text><text x="615.0" y="350.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">Considerar uveítis o queratitis</tspan></text><rect x="40.0" y="372.0" width="194.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="398.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Unilateral</tspan></text><text x="54.0" y="415.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Un solo ojo</tspan></text><rect x="243.0" y="372.0" width="354.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="255.0" y="397.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">Hemorragia subconjuntival o conjuntivitis inicial</tspan></text><text x="255.0" y="413.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">Benigna, bordes netos</tspan></text><rect x="603.0" y="372.0" width="354.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="615.0" y="397.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">Glaucoma agudo, uveítis, iritis o abrasión</tspan></text><text x="615.0" y="413.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">Inyección ciliar y pupila alterada: derivar</tspan></text><text x="44.0" y="451.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Ningún corticoide tópico sin examen con lámpara de hendidura, por el riesgo de queratitis herpética.</tspan></text><text x="40.0" y="499.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="509.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="540.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="540.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Glaucoma agudo</tspan></text><text x="435.0" y="531.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Uveítis anterior</tspan><tspan x="435.0" dy="17">aguda</tspan></text><rect x="513.0" y="512.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="540.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Conjuntivitis</tspan></text><text x="735.0" y="540.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Iritis aguda</tspan></text><text x="885.0" y="531.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Abrasión de la</tspan><tspan x="885.0" dy="17">córnea</tspan></text><rect x="40.0" y="563.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="563.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="592.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Causa más frecuente?</tspan></text><text x="285.0" y="584.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: unilateral, doloroso</tspan><tspan x="285.0" dy="16">y con pupila alterada</tspan></text><text x="435.0" y="584.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: unilateral, con</tspan><tspan x="435.0" dy="16">fotofobia y baja visual</tspan></text><text x="585.0" y="584.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: bilateral, sin dolor</tspan><tspan x="585.0" dy="16">intenso ni baja visual</tspan></text><text x="735.0" y="584.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: dolor, fotofobia y</tspan><tspan x="735.0" dy="16">pupila alterada</tspan></text><text x="885.0" y="584.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: exige trauma y se</tspan><tspan x="885.0" dy="16">tiñe con fluoresceína</tspan></text><rect x="40.0" y="509.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="637.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="665.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="687.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Conjuntivitis: hiperemia conjuntival periférica que se mueve con la conjuntiva, visión conservada, pupila normal y sin fotofobia marcada.</tspan><tspan x="58.0" dy="18">• Viral (adenovirus, adenopatía preauricular), bacteriana o alérgica (prurito, secreción acuosa): tratamiento sintomático y medidas de higiene.</tspan><tspan x="58.0" dy="18">• Glaucoma agudo, uveítis anterior e iritis: dolor, fotofobia, baja visual, inyección ciliar y casi siempre un solo ojo. Abrasión corneal: trauma y tinción con</tspan><tspan x="58.0" dy="18">   fluoresceína.</tspan><tspan x="58.0" dy="18">• Alerta: dolor intenso, fotofobia, pupila irregular, opacidad corneal o falta de mejoría en pocos días obligan a derivar; sin corticoide tópico sin lámpara de</tspan><tspan x="58.0" dy="18">   hendidura.</tspan></text><text x="58.0" y="799.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: StatPearls, Bacterial Conjunctivitis (2026); Kanski Oftalmología Clínica 9.ª ed. (2020)</tspan></text></svg>