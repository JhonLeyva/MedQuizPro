<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1042" viewBox="0 0 1000 1042" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Gestante a término detenida en 6 cm por 4 horas con contracciones de intensidad leve y pelvis ginecoide: dinámica uterina insuficiente, estimular con oxitocina"><title>Gestante a término detenida en 6 cm por 4 horas con contracciones de intensidad leve y pelvis ginecoide: dinámica uterina insuficiente, estimular con oxitocina</title><rect x="0.75" y="0.75" width="998.5" height="1040.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Distocias de la dinámica · trabajo de parto prolongado</tspan></text><rect x="519.9" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="607.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="607.1" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Detención de la fase activa</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Desde los 6 cm se espera un avance de ~1 cm/h; sin cambios por ≥ 4 h con buenas</tspan><tspan x="58.0" dy="17">contracciones o ≥ 6 h con malas = detención.</tspan><tspan x="58.0" dy="17">Si las contracciones son débiles y la pelvis es normal: conducir con oxitocina (y</tspan><tspan x="58.0" dy="17">amniotomía); si son adecuadas y no avanza: cesárea.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante a término</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">6 cm desde hace 4 horas; AU 34 cm, LCF 140.</tspan><tspan x="640.0" dy="16">3 contracciones en 10 min de intensidad +/+++; pelvis</tspan><tspan x="640.0" dy="16">ginecoide.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PARTOGRAMA: DILATACIÓN SEGÚN LAS HORAS</tspan></text><rect x="40.0" y="285.0" width="540.0" height="340.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="190.8" y="305.0" width="185.6" height="272.0" rx="0" fill="#fee2e2" stroke="none" stroke-width="0"/><text x="283.6" y="321.0" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="180"><tspan x="283.6" dy="0">4 h sin cambio</tspan></text><line x1="98.0" y1="577.0" x2="562.0" y2="577.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="581.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">4</tspan></text><line x1="98.0" y1="486.3" x2="562.0" y2="486.3" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="490.3" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">6</tspan></text><line x1="98.0" y1="395.7" x2="562.0" y2="395.7" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="399.7" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">8</tspan></text><line x1="98.0" y1="305.0" x2="562.0" y2="305.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="309.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">10</tspan></text><line x1="98.0" y1="577.0" x2="98.0" y2="582.0" stroke="#94a3b8" stroke-width="1.5"/><text x="98.0" y="596.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="98.0" dy="0">0</tspan></text><line x1="190.8" y1="577.0" x2="190.8" y2="582.0" stroke="#94a3b8" stroke-width="1.5"/><text x="190.8" y="596.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="190.8" dy="0">2</tspan></text><line x1="283.6" y1="577.0" x2="283.6" y2="582.0" stroke="#94a3b8" stroke-width="1.5"/><text x="283.6" y="596.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="283.6" dy="0">4</tspan></text><line x1="376.4" y1="577.0" x2="376.4" y2="582.0" stroke="#94a3b8" stroke-width="1.5"/><text x="376.4" y="596.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="376.4" dy="0">6</tspan></text><line x1="469.2" y1="577.0" x2="469.2" y2="582.0" stroke="#94a3b8" stroke-width="1.5"/><text x="469.2" y="596.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="469.2" dy="0">8</tspan></text><line x1="562.0" y1="577.0" x2="562.0" y2="582.0" stroke="#94a3b8" stroke-width="1.5"/><text x="562.0" y="596.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="562.0" dy="0">10 h</tspan></text><line x1="98.0" y1="577.0" x2="562.0" y2="577.0" stroke="#94a3b8" stroke-width="1.5"/><line x1="98.0" y1="305.0" x2="98.0" y2="577.0" stroke="#94a3b8" stroke-width="1.5"/><text x="330.0" y="615.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="464"><tspan x="330.0" dy="0">Horas desde los 4 cm</tspan></text><text x="56.0" y="441.0" transform="rotate(-90 56.0 441.0)" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Dilatación (cm)</text><polyline points="98.0,577.0 190.8,486.3 376.4,305.0" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="412.0" y1="339.0" x2="434.0" y2="339.0" stroke="#94a3b8" stroke-width="3"/><text x="440.0" y="343.0" font-size="10.5" font-weight="700" font-style="normal" fill="#94a3b8" text-anchor="start" data-max="120"><tspan x="440.0" dy="0">Esperado</tspan></text><polyline points="98.0,577.0 190.8,486.3 376.4,484.1" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="412.0" y1="357.0" x2="434.0" y2="357.0" stroke="#0f766e" stroke-width="3"/><text x="440.0" y="361.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="120"><tspan x="440.0" dy="0">Este caso</tspan></text><line x1="376.4" y1="484.1" x2="376.4" y2="577.0" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4"/><circle cx="376.4" cy="484.1" r="9" fill="#ea580c" stroke="#ffffff" stroke-width="3"/><rect x="327.1" y="459.1" width="98.6" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="376.4" y="474.1" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="376.4" dy="0">◆ 6 cm a las 4 h</tspan></text><rect x="602.0" y="364.5" width="358.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="617.0" y="388.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Detenida en 6 cm por 4 horas</tspan></text><text x="617.0" y="405.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Fase activa sin progreso.</tspan></text><rect x="602.0" y="427.5" width="358.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="617.0" y="451.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Contracciones +/+++</tspan></text><text x="617.0" y="468.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Dinámica insuficiente.</tspan></text><rect x="602.0" y="490.5" width="358.0" height="55.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="617.0" y="514.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Pelvis ginecoide, LCF normal</tspan></text><text x="617.0" y="531.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">No hay desproporción ni sufrimiento.</tspan></text><rect x="40.0" y="643.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="669.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Dinámica insuficiente: oxitocina</tspan></text><text x="60.0" y="688.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Si con buena dinámica no avanza, cesárea.</tspan></text><text x="40.0" y="755.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="765.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="796.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="787.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Estimular con</tspan><tspan x="285.0" dy="17">misoprostol</tspan></text><text x="435.0" y="796.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Programar cesárea</tspan></text><text x="585.0" y="787.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Observar otras 4</tspan><tspan x="585.0" dy="17">horas</tspan></text><rect x="663.0" y="768.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="787.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Estimular con</tspan><tspan x="735.0" dy="17">oxitocina</tspan></text><text x="885.0" y="796.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Tocólisis</tspan></text><rect x="40.0" y="819.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="819.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="848.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Manejo?</tspan></text><text x="285.0" y="840.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no se usa en</tspan><tspan x="285.0" dy="16">trabajo de parto activo</tspan></text><text x="435.0" y="840.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: aún no se intentó</tspan><tspan x="435.0" dy="16">mejorar la dinámica</tspan></text><text x="585.0" y="848.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: ya está detenida</tspan></text><text x="735.0" y="840.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: contracciones</tspan><tspan x="735.0" dy="16">débiles</tspan></text><text x="885.0" y="848.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: frenaría el parto</tspan></text><rect x="40.0" y="765.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="893.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="921.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="943.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Oxitocina 10 UI en 1 L: empezar con 2 mUI/min y subir cada 30-40 min hasta 3-5 contracciones fuertes en 10 min.</tspan><tspan x="58.0" dy="18">• Amniotomía si las membranas están íntegras y la cabeza encajada.</tspan><tspan x="58.0" dy="18">• Si con buena dinámica no avanza en 4 h más: cesárea (desproporción).</tspan></text><text x="58.0" y="1001.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG/SMFM, prevención de la primera cesárea (2014; act.); OMS (2018).</tspan></text></svg>