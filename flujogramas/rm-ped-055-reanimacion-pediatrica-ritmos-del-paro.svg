<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1252" viewBox="0 0 1000 1252" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En el paro pediátrico solo la fibrilación y la taquicardia ventricular sin pulso se desfibrilan"><title>En el paro pediátrico solo la fibrilación y la taquicardia ventricular sin pulso se desfibrilan</title><rect x="0.75" y="0.75" width="998.5" height="1250.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Reanimación pediátrica · ritmos del paro</tspan></text><rect x="439.9" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="489.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="489.0" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ritmos del paro cardiaco</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Son cuatro: asistolia, actividad eléctrica sin pulso, fibrilación ventricular y taquicardia</tspan><tspan x="58.0" dy="17">ventricular sin pulso.</tspan><tspan x="58.0" dy="17">Solo los dos últimos son desfibrilables.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Preescolar de 5 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Cardiopatía y sepsis, con monitoreo ECG continuo.</tspan><tspan x="640.0" dy="16">Presenta paro cardiorrespiratorio: ¿qué ritmo requiere</tspan><tspan x="640.0" dy="16">desfibrilación?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ RITMO SE DESFIBRILA EN EL PARO</tspan></text><rect x="40.0" y="285.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="307.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="180"><tspan x="54.0" dy="0">RITMO DEL PARO</tspan></text><text x="420.0" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="340"><tspan x="420.0" dy="0">¿Se desfibrila?</tspan></text><text x="780.0" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="340"><tspan x="780.0" dy="0">Qué se hace</tspan></text><rect x="40.0" y="325.0" width="194.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="351.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Asistolia</tspan></text><text x="54.0" y="368.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Sin actividad eléctrica</tspan></text><rect x="243.0" y="325.0" width="354.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="255.0" y="350.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">No</tspan></text><text x="255.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">Ritmo no desfibrilable</tspan></text><rect x="603.0" y="325.0" width="354.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="615.0" y="350.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">RCP y adrenalina</tspan></text><text x="615.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">Lo antes posible; causas reversibles</tspan></text><rect x="40.0" y="388.0" width="194.0" height="74.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="414.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Actividad eléctrica sin</tspan><tspan x="54.0" dy="17">pulso</tspan></text><text x="54.0" y="448.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Hay complejos, no hay pulso</tspan></text><rect x="243.0" y="388.0" width="354.0" height="74.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="255.0" y="421.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">No</tspan></text><text x="255.0" y="437.5" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">Ritmo no desfibrilable</tspan></text><rect x="603.0" y="388.0" width="354.0" height="74.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="615.0" y="421.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">RCP y adrenalina</tspan></text><text x="615.0" y="437.5" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">Hipoxia, hipovolemia, acidosis</tspan></text><rect x="40.0" y="468.0" width="194.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="494.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Fibrilación ventricular</tspan></text><text x="54.0" y="511.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Caótica</tspan></text><rect x="243.0" y="468.0" width="354.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="255.0" y="493.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">Sí</tspan></text><text x="255.0" y="509.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">Desfibrilable</tspan></text><rect x="603.0" y="468.0" width="354.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="615.0" y="493.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">Descarga de 2 J/kg y RCP</tspan></text><text x="615.0" y="509.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">Luego 4 J/kg y adrenalina</tspan></text><rect x="40.0" y="531.0" width="194.0" height="74.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="557.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Taquicardia ventricular sin</tspan><tspan x="54.0" dy="17">pulso</tspan></text><text x="54.0" y="591.0" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Este caso</tspan></text><rect x="243.0" y="531.0" width="354.0" height="74.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="255.0" y="564.5" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">SÍ</tspan></text><text x="255.0" y="580.5" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">Desfibrilable</tspan></text><rect x="496.2" y="520.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="541.6" y="535.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="541.6" dy="0">◆ ESTE CASO</tspan></text><rect x="603.0" y="531.0" width="354.0" height="74.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="615.0" y="564.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">Descarga de 2 J/kg y RCP</tspan></text><text x="615.0" y="580.5" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">Amiodarona o lidocaína si persiste</tspan></text><text x="44.0" y="627.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Bradicardia severa y taquicardia sinusal tienen pulso: no se desfibrilan.</tspan></text><text x="40.0" y="669.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DESCARGAS Y FÁRMACOS EN EL RITMO DESFIBRILABLE (AHA 2020)</tspan></text><rect x="40.0" y="681.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="700.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="84"><tspan x="50.0" dy="0">Descarga</tspan></text><text x="150.0" y="700.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="394"><tspan x="150.0" dy="0">Energía</tspan></text><text x="560.0" y="700.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="394"><tspan x="560.0" dy="0">Se acompaña de</tspan></text><rect x="40.0" y="710.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="729.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="84"><tspan x="50.0" dy="0">Primera</tspan></text><text x="150.0" y="729.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="150.0" dy="0">2 J/kg</tspan></text><text x="560.0" y="729.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="560.0" dy="0">RCP durante 2 minutos</tspan></text><rect x="40.0" y="739.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="758.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="84"><tspan x="50.0" dy="0">Segunda</tspan></text><text x="150.0" y="758.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="150.0" dy="0">4 J/kg</tspan></text><text x="560.0" y="758.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="560.0" dy="0">Adrenalina 0,01 mg/kg, repetida cada 3 a 5 minutos</tspan></text><rect x="40.0" y="768.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="787.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="84"><tspan x="50.0" dy="0">Siguientes</tspan></text><text x="150.0" y="787.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="150.0" dy="0">4 a 10 J/kg, sin superar la dosis de adulto</tspan></text><text x="560.0" y="787.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="560.0" dy="0">Amiodarona 5 mg/kg o lidocaína si el ritmo persiste</tspan></text><text x="40.0" y="813.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Entre descargas se hacen 2 minutos de RCP.</tspan></text><text x="40.0" y="860.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="870.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="909.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="909.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Asistolia</tspan></text><text x="435.0" y="909.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Bradicardia severa</tspan></text><text x="585.0" y="909.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Taquicardia sinusal</tspan></text><text x="735.0" y="909.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Bradiarritmia</tspan></text><rect x="813.0" y="873.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="892.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Taquicardia</tspan><tspan x="885.0" dy="17">ventricular sin</tspan><tspan x="885.0" dy="17">pulso</tspan></text><rect x="40.0" y="941.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="941.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="970.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué ritmo se</tspan><tspan x="54.0" dy="16">desfibrila?</tspan></text><text x="285.0" y="962.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: ritmo no</tspan><tspan x="285.0" dy="16">desfibrilable; RCP y</tspan><tspan x="285.0" dy="16">adrenalina</tspan></text><text x="435.0" y="970.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: con pulso; se</tspan><tspan x="435.0" dy="16">oxigena y ventila</tspan></text><text x="585.0" y="962.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: reacción</tspan><tspan x="585.0" dy="16">fisiológica; se trata la</tspan><tspan x="585.0" dy="16">causa</tspan></text><text x="735.0" y="970.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: con pulso; se</tspan><tspan x="735.0" dy="16">oxigena y ventila</tspan></text><text x="885.0" y="978.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: ritmo desfibrilable</tspan></text><rect x="40.0" y="870.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1031.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1059.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1081.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• En niños predominan la asistolia y la actividad eléctrica sin pulso (hipoxia y shock); solo 5-15 % son desfibrilables, más en cardiópatas y en el</tspan><tspan x="58.0" dy="18">   postoperatorio cardiaco.</tspan><tspan x="58.0" dy="18">• AHA 2020: primera descarga de 2 J/kg, segunda de 4 J/kg y luego de 4 a 10 J/kg sin pasar la dosis de adulto, con 2 minutos de RCP entre descargas.</tspan><tspan x="58.0" dy="18">• Adrenalina 0,01 mg/kg tras la segunda descarga cada 3-5 minutos; amiodarona 5 mg/kg o lidocaína si el ritmo persiste. En no desfibrilables: RCP y</tspan><tspan x="58.0" dy="18">   adrenalina cuanto antes.</tspan><tspan x="58.0" dy="18">• Alerta: la bradicardia severa con pulso y mala perfusión no se desfibrila (oxígeno, ventilación y RCP si es menor de 60 por minuto); buscar causas</tspan><tspan x="58.0" dy="18">   reversibles.</tspan></text><text x="58.0" y="1211.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AHA, Soporte vital básico y avanzado pediátrico, guías 2020 (Pediatrics 2021;147, suppl 1; Parte 4); Nelson Tratado de Pediatría, 22.ª ed. (2024)</tspan></text></svg>