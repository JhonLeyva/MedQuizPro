<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1093" viewBox="0 0 1000 1093" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Recolectar datos mínimos de forma continua y analizar tendencias para intervenir es vigilancia de la salud"><title>Recolectar datos mínimos de forma continua y analizar tendencias para intervenir es vigilancia de la salud</title><rect x="0.75" y="0.75" width="998.5" height="1091.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Salud pública · vigilancia</tspan></text><rect x="349.0" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="413.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="413.3" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Vigilancia en salud pública</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Recolección sistemática, continua y oportuna de datos, su análisis y difusión para decidir.</tspan><tspan x="58.0" dy="17">Es una función esencial de la salud pública.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niños con diarrea aguda</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">El médico reúne edad, sexo, procedencia y tiempo de</tspan><tspan x="640.0" dy="16">enfermedad.</tspan><tspan x="640.0" dy="16">Monitorea tendencias y riesgo geográfico.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE RECONOCE LA VIGILANCIA</tspan></text><text x="614.0" y="297.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,309.0 580.0,309.0 543.8,417.0 76.2,417.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="325.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="373.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="424"><tspan x="310.0" dy="0">Datos continuos de diarrea para orientar intervenciones</tspan></text><line x1="565.9" y1="363.0" x2="606.0" y2="363.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="318.0" width="132.4" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="680.2" y="335.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="680.2" dy="0">Vigilancia de la salud</tspan></text><rect x="752.4" y="318.0" width="172.5" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="838.6" y="335.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="838.6" dy="0">Investigación epidemiológica</tspan></text><rect x="614.0" y="350.0" width="164.6" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="696.3" y="367.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="696.3" dy="0">Generación de estadísticas</tspan></text><rect x="784.6" y="350.0" width="150.9" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="860.1" y="367.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="860.1" dy="0">Monitoreo de tendencias</tspan></text><rect x="614.0" y="382.0" width="138.5" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="683.2" y="399.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="683.2" dy="0">Promoción de la salud</tspan></text><polygon points="76.2,421.0 543.8,421.0 507.5,477.0 112.5,477.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="138.5" cy="449.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="138.5" y="453.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="138.5" dy="0">1</tspan></text><text x="320.0" y="453.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="331"><tspan x="320.0" dy="0">¿Se prueba una hipótesis con un diseño?</tspan></text><line x1="529.6" y1="449.0" x2="606.0" y2="449.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="436.0" width="184.6" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="706.3" y="453.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="706.3" dy="0">✕ Investigación epidemiológica</tspan></text><line x1="636.0" y1="449.5" x2="788.6" y2="449.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="112.5,481.0 507.5,481.0 471.2,541.0 148.8,541.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="174.8" cy="511.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="174.8" y="515.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="174.8" dy="0">2</tspan></text><text x="320.0" y="507.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="258"><tspan x="320.0" dy="0">¿Actúa sobre determinantes y no</tspan><tspan x="320.0" dy="17">recoge datos de enfermedad?</tspan></text><line x1="493.4" y1="511.0" x2="606.0" y2="511.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="498.0" width="150.5" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="689.3" y="515.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="689.3" dy="0">✕ Promoción de la salud</tspan></text><line x1="636.0" y1="511.5" x2="754.5" y2="511.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="148.8,545.0 471.2,545.0 435.0,622.0 185.0,622.0" fill="#5eead4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="583.5" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="587.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">3</tspan></text><text x="320.0" y="571.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">¿El fin es solo producir</tspan><tspan x="320.0" dy="17">cifras o seguir una</tspan><tspan x="320.0" dy="17">tendencia?</tspan></text><line x1="457.1" y1="583.5" x2="606.0" y2="583.5" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="570.5" width="176.7" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="702.4" y="588.0" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="702.4" dy="0">✕ Generación de estadísticas</tspan></text><line x1="636.0" y1="584.0" x2="780.7" y2="584.0" stroke="#94a3b8" stroke-width="1.2"/><rect x="796.7" y="570.5" width="163.0" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="878.2" y="588.0" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="878.2" dy="0">✕ Monitoreo de tendencias</tspan></text><line x1="818.7" y1="584.0" x2="949.7" y2="584.0" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="626.0" x2="310.0" y2="645.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,644.0 315.0,644.0 310.0,652.0" fill="#0f766e"/><rect x="140.0" y="656.0" width="340.0" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="685.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">VIGILANCIA DE LA SALUD</tspan></text><text x="310.0" y="709.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Recolecta, analiza y difunde</tspan><tspan x="310.0" dy="17">Para intervenir en la comunidad</tspan></text><rect x="370.6" y="645.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="660.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="663.9" width="346.0" height="76.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="683.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="701.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">El monitoreo de tendencias es un componente de la</tspan><tspan x="628.0" dy="16">vigilancia, no la acción completa.</tspan></text><text x="40.0" y="787.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="797.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="828.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="800.9" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="820.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Vigilancia de la</tspan><tspan x="285.0" dy="17">salud</tspan></text><text x="435.0" y="820.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Investigación</tspan><tspan x="435.0" dy="17">epidemiológica</tspan></text><text x="585.0" y="820.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Generación de</tspan><tspan x="585.0" dy="17">estadísticas</tspan></text><text x="735.0" y="820.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Monitoreo de</tspan><tspan x="735.0" dy="17">tendencias</tspan></text><text x="885.0" y="820.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Promoción de la</tspan><tspan x="885.0" dy="17">salud</tspan></text><rect x="40.0" y="851.9" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="851.9" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="880.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué acción realiza?</tspan></text><text x="285.0" y="872.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: datos continuos,</tspan><tspan x="285.0" dy="16">análisis y acción</tspan></text><text x="435.0" y="872.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: prueba hipótesis</tspan><tspan x="435.0" dy="16">con diseño específico</tspan></text><text x="585.0" y="872.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es solo un</tspan><tspan x="585.0" dy="16">producto de los datos</tspan></text><text x="735.0" y="872.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es un componente</tspan><tspan x="735.0" dy="16">de la vigilancia</tspan></text><text x="885.0" y="872.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: actúa sobre</tspan><tspan x="885.0" dy="16">determinantes</tspan></text><rect x="40.0" y="797.9" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="925.9" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="953.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="975.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Atributos: sistematización, continuidad, simplicidad, oportunidad y utilidad para la acción; detecta cambios de tendencia, brotes y riesgos.</tspan><tspan x="58.0" dy="18">• Datos mínimos (persona, lugar, tiempo) bastan: no hay hipótesis a probar, como en la investigación epidemiológica.</tspan><tspan x="58.0" dy="18">• Estadísticas y monitoreo de tendencias son componentes; el conjunto continuo orientado a intervenir es la vigilancia.</tspan><tspan x="58.0" dy="18">• La promoción de la salud actúa sobre determinantes; no recolecta datos continuos de enfermedad.</tspan></text><text x="58.0" y="1051.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, Reglamento Sanitario Internacional, 3.ª ed. (2005); Teutsch SM, Churchill RE. Principles and Practice of Public Health Surveillance, 3.ª ed. (2010).</tspan></text></svg>