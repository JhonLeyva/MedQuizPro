<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="981" viewBox="0 0 1000 981" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Eficacia es el efecto de una intervención en condiciones experimentales; efectividad, en la práctica real"><title>Eficacia es el efecto de una intervención en condiciones experimentales; efectividad, en la práctica real</title><rect x="0.75" y="0.75" width="998.5" height="979.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Salud pública · eficacia y efectividad</tspan></text><rect x="416.0" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="480.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="480.3" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Evaluación de intervenciones</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Eficacia, efectividad y eficiencia se confunden con facilidad.</tspan><tspan x="58.0" dy="17">Responden preguntas distintas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de definición</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Grado en que una intervención produce un resultado</tspan><tspan x="640.0" dy="16">beneficioso en condiciones experimentales.</tspan><tspan x="640.0" dy="16">¿A qué corresponde?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ CAMBIA ENTRE EL ENSAYO Y LA PRÁCTICA REAL</tspan></text><rect x="40.0" y="285.0" width="385.0" height="180.0" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="232.5" y="311.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="365"><tspan x="232.5" dy="0">CONDICIONES EXPERIMENTALES</tspan></text><text x="56.0" y="341.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Concepto</tspan></text><text x="409.0" y="341.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">Eficacia</tspan></text><line x1="52.0" y1="349.0" x2="413.0" y2="349.0" stroke="#ffffff" stroke-width="1.4"/><text x="56.0" y="367.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Pacientes</tspan></text><text x="409.0" y="367.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">Seleccionados</tspan></text><line x1="52.0" y1="375.0" x2="413.0" y2="375.0" stroke="#ffffff" stroke-width="1.4"/><text x="56.0" y="393.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Seguimiento</tspan></text><text x="409.0" y="393.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">Estricto y controlado</tspan></text><line x1="52.0" y1="401.0" x2="413.0" y2="401.0" stroke="#ffffff" stroke-width="1.4"/><text x="56.0" y="419.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Pregunta</tspan></text><text x="409.0" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">¿Puede funcionar?</tspan></text><line x1="52.0" y1="427.0" x2="413.0" y2="427.0" stroke="#ffffff" stroke-width="1.4"/><text x="56.0" y="445.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Diseño típico</tspan></text><text x="409.0" y="445.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">Ensayo aleatorizado</tspan></text><line x1="52.0" y1="453.0" x2="413.0" y2="453.0" stroke="#ffffff" stroke-width="1.4"/><rect x="575.0" y="285.0" width="385.0" height="180.0" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="767.5" y="311.0" font-size="13" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="365"><tspan x="767.5" dy="0">CONDICIONES HABITUALES</tspan></text><text x="591.0" y="341.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Concepto</tspan></text><text x="944.0" y="341.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">Efectividad</tspan></text><line x1="587.0" y1="349.0" x2="948.0" y2="349.0" stroke="#ffffff" stroke-width="1.4"/><text x="591.0" y="367.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Pacientes</tspan></text><text x="944.0" y="367.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">Heterogéneos</tspan></text><line x1="587.0" y1="375.0" x2="948.0" y2="375.0" stroke="#ffffff" stroke-width="1.4"/><text x="591.0" y="393.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Cumplimiento</tspan></text><text x="944.0" y="393.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">Imperfecto</tspan></text><line x1="587.0" y1="401.0" x2="948.0" y2="401.0" stroke="#ffffff" stroke-width="1.4"/><text x="591.0" y="419.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Pregunta</tspan></text><text x="944.0" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">¿Funciona en la vida real?</tspan></text><line x1="587.0" y1="427.0" x2="948.0" y2="427.0" stroke="#ffffff" stroke-width="1.4"/><text x="591.0" y="445.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Magnitud</tspan></text><text x="944.0" y="445.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">Suele ser menor</tspan></text><line x1="587.0" y1="453.0" x2="948.0" y2="453.0" stroke="#ffffff" stroke-width="1.4"/><rect x="434.0" y="339.0" width="132.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="365.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="118"><tspan x="500.0" dy="0">Misma intervención,</tspan><tspan x="500.0" dy="16">distinto escenario</tspan></text><line x1="429.0" y1="431.0" x2="562.0" y2="431.0" stroke="#0f766e" stroke-width="3"/><polygon points="562.0,436.0 562.0,426.0 571.0,431.0" fill="#0f766e"/><rect x="40.0" y="481.0" width="300.0" height="33.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="56.0" y="502.5" font-size="14" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="56.0" dy="0">▲</tspan></text><text x="72.0" y="499.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="260"><tspan x="72.0" dy="0">En el ensayo se mide la eficacia</tspan></text><rect x="350.0" y="481.0" width="300.0" height="33.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="366.0" y="502.5" font-size="14" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="366.0" dy="0">=</tspan></text><text x="382.0" y="499.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="260"><tspan x="382.0" dy="0">En el servicio se mide la efectividad</tspan></text><rect x="660.0" y="481.0" width="300.0" height="33.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="676.0" y="502.5" font-size="14" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="676.0" dy="0">=</tspan></text><text x="692.0" y="499.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="260"><tspan x="692.0" dy="0">Eficiencia: resultado por recurso usado</tspan></text><rect x="40.0" y="532.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="558.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Efecto en condiciones experimentales = eficacia</tspan></text><text x="60.0" y="577.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Efectividad es la práctica real; eficiencia, costo-beneficio y costo-efectividad incorporan los recursos.</tspan></text><text x="40.0" y="644.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="654.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="676.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="676.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Efectividad</tspan></text><rect x="363.0" y="657.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="676.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Eficacia</tspan></text><text x="585.0" y="676.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Eficiencia</tspan></text><text x="735.0" y="676.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Costo - beneficio</tspan></text><text x="885.0" y="676.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Costo - efectividad</tspan></text><rect x="40.0" y="691.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="691.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="720.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Efecto en condiciones</tspan><tspan x="54.0" dy="16">experimentales?</tspan></text><text x="285.0" y="720.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es el efecto en la</tspan><tspan x="285.0" dy="16">práctica habitual</tspan></text><text x="435.0" y="712.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: efecto en</tspan><tspan x="435.0" dy="16">condiciones ideales o</tspan><tspan x="435.0" dy="16">experimentales</tspan></text><text x="585.0" y="712.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: relaciona</tspan><tspan x="585.0" dy="16">resultados con</tspan><tspan x="585.0" dy="16">recursos</tspan></text><text x="735.0" y="720.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: expresa todo en</tspan><tspan x="735.0" dy="16">dinero</tspan></text><text x="885.0" y="720.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: costo por unidad</tspan><tspan x="885.0" dy="16">de resultado</tspan></text><rect x="40.0" y="654.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="781.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="809.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="831.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Eficacia: efecto en condiciones ideales (ensayo clínico aleatorizado, pacientes seleccionados, seguimiento estricto); responde si la intervención puede</tspan><tspan x="58.0" dy="18">   funcionar.</tspan><tspan x="58.0" dy="18">• Efectividad: efecto en la práctica habitual, con pacientes heterogéneos y cumplimiento imperfecto; suele ser menor que la eficacia.</tspan><tspan x="58.0" dy="18">• Eficiencia: resultados en relación con los recursos usados. Costo-beneficio expresa todo en dinero; costo-efectividad, en unidades naturales de resultado.</tspan><tspan x="58.0" dy="18">• Alerta: un fármaco eficaz en el ensayo puede no ser efectivo en el servicio si falla la adherencia o el acceso.</tspan></text><text x="58.0" y="925.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Last J., A Dictionary of Epidemiology, 6.ª ed.; Cochrane Handbook, versión 6.4 (2023); Drummond y cols., Methods for the Economic Evaluation of Health Care</tspan><tspan x="58.0" dy="15">Programmes, 4.ª ed. (2015).</tspan></text></svg>