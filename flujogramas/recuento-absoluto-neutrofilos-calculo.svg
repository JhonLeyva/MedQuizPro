" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">RAN = leucocitos × (segmentados + abastonados) ÷ 100.</tspan><tspan x="58.0" dy="17">Decide el riesgo de infección grave en quimioterapia.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Escolar de 8 años con LLA</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Control: leucocitos 10 000/mm³.</tspan><tspan x="640.0" dy="16">35 % segmentados, 5 % abastonados, 50 % linfocitos,</tspan><tspan x="640.0" dy="16">10 % monocitos.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="395.0" x2="733.5" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="395.0" x2="266.5" y2