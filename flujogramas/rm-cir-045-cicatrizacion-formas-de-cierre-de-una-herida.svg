<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La herida que cierra sola, por granulación y contracción, cicatriza por segunda intención"><title>La herida que cierra sola, por granulación y contracción, cicatriza por segunda intención</title><rect x="0.75" y="0.75" width="998.5" height="838.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Cicatrización · formas de cierre de una herida</tspan></text><rect x="468.7" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="511.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="511.9" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Formas de cierre</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Primera, segunda y tercera intención (cierre primario diferido).</tspan><tspan x="58.0" dy="17">El tipo depende de la limpieza de la herida y de la pérdida de tejido.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cómo se llama la cicatrización por sus propios</tspan><tspan x="640.0" dy="16">medios y en el tiempo adecuado?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TRES FORMAS DE CERRAR UNA HERIDA</tspan></text><rect x="40.0" y="269.0" width="293.3" height="181.0" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="269.0" width="293.3" height="8.0" rx="4" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="60.0" y="303.0" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="253"><tspan x="60.0" dy="0">Primera intención</tspan></text><rect x="56.0" y="324.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="68.0" y="341.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Bordes</tspan></text><text x="305.3" y="341.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="305.3" dy="0">Afrontados con sutura</tspan></text><rect x="56.0" y="354.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="68.0" y="371.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Cuándo</tspan></text><text x="305.3" y="371.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="305.3" dy="0">Primeras horas</tspan></text><rect x="56.0" y="384.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="68.0" y="401.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Herida</tspan></text><text x="305.3" y="401.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="305.3" dy="0">Limpia, sin pérdida</tspan></text><text x="60.0" y="430.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="253"><tspan x="60.0" dy="0">Poca fibrosis y cicatriz fina.</tspan></text><rect x="353.3" y="269.0" width="293.3" height="181.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><rect x="353.3" y="269.0" width="293.3" height="8.0" rx="4" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="373.3" y="303.0" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="253"><tspan x="373.3" dy="0">Segunda intención</tspan></text><rect x="369.3" y="324.0" width="261.3" height="26.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="381.3" y="341.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="381.3" dy="0">Bordes</tspan></text><text x="618.7" y="341.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="end" data-max="133"><tspan x="618.7" dy="0">✓ Quedan abiertos</tspan></text><rect x="369.3" y="354.0" width="261.3" height="26.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="381.3" y="371.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="381.3" dy="0">Cierra por</tspan></text><text x="618.7" y="371.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="end" data-max="133"><tspan x="618.7" dy="0">✓ Granulación</tspan></text><rect x="369.3" y="384.0" width="261.3" height="26.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="381.3" y="401.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="381.3" dy="0">Herida</tspan></text><text x="618.7" y="401.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="end" data-max="133"><tspan x="618.7" dy="0">✓ Sucia o con pérdida</tspan></text><text x="373.3" y="430.0" font-size="11.5" font-weight="600" font-style="normal" fill="#0f766e" text-anchor="start" data-max="253"><tspan x="373.3" dy="0">Cierra sola, más lenta y con cicatriz mayor.</tspan></text><rect x="529.3" y="262.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="574.7" y="277.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="574.7" dy="0">◆ ESTE CASO</tspan></text><rect x="666.7" y="269.0" width="293.3" height="181.0" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="666.7" y="269.0" width="293.3" height="8.0" rx="4" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="686.7" y="303.0" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="253"><tspan x="686.7" dy="0">Tercera intención</tspan></text><rect x="682.7" y="324.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="694.7" y="341.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="694.7" dy="0">Bordes</tspan></text><text x="932.0" y="341.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="932.0" dy="0">Abiertos 3-5 días</tspan></text><rect x="682.7" y="354.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="694.7" y="371.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="694.7" dy="0">Después</tspan></text><text x="932.0" y="371.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="932.0" dy="0">Cierre con sutura</tspan></text><rect x="682.7" y="384.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="694.7" y="401.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="694.7" dy="0">Herida</tspan></text><text x="932.0" y="401.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="932.0" dy="0">Contaminada</tspan></text><text x="686.7" y="430.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="253"><tspan x="686.7" dy="0">Primaria diferida: cierra al descartar infección.</tspan></text><text x="40.0" y="472.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="400"><tspan x="40.0" dy="0">✓ = dato que coincide con el caso</tspan></text><text x="40.0" y="518.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="528.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="550.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="550.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Secundario tardío</tspan></text><text x="435.0" y="550.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Primera intención</tspan></text><text x="585.0" y="550.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Primario tardío</tspan></text><text x="735.0" y="550.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Tercera intención</tspan></text><rect x="813.0" y="531.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="550.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Segunda intención</tspan></text><rect x="40.0" y="565.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="565.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="602.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Cómo se llama?</tspan></text><text x="285.0" y="594.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no es una forma</tspan><tspan x="285.0" dy="16">reconocida de cierre</tspan></text><text x="435.0" y="586.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es la sutura</tspan><tspan x="435.0" dy="16">inmediata de los</tspan><tspan x="435.0" dy="16">bordes</tspan></text><text x="585.0" y="594.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es otro nombre de</tspan><tspan x="585.0" dy="16">la tercera intención</tspan></text><text x="735.0" y="594.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es el cierre diferido</tspan><tspan x="735.0" dy="16">a los 3-5 días</tspan></text><text x="885.0" y="594.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: queda abierta y</tspan><tspan x="885.0" dy="16">cierra por granulación</tspan></text><rect x="40.0" y="528.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="655.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="683.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="705.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Primera: sutura en las primeras horas (herida limpia). Segunda: abierta, cierra sola por granulación, contracción y epitelización. Tercera: se cierra a los</tspan><tspan x="58.0" dy="18">   3-5 días.</tspan><tspan x="58.0" dy="18">• Fases: inflamatoria (0-4 días), proliferativa (4-21 días: fibroblastos, colágeno III, angiogénesis) y remodelación (hasta 1-2 años: colágeno I).</tspan><tspan x="58.0" dy="18">• Se deja abierta la herida infectada, muy contaminada o con pérdida de tejido; la presión negativa acelera la granulación.</tspan><tspan x="58.0" dy="18">• Bandera roja: eritema que avanza, pus, fiebre o dehiscencia = abrir, drenar y cultivar. Retrasan: diabetes, tabaco, desnutrición, isquemia, corticoides.</tspan></text><text x="58.0" y="799.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Schwartz Principios de Cirugía 11.ª ed.; Sabiston Tratado de Cirugía 21.ª ed..</tspan></text></svg>