<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1178" viewBox="0 0 1000 1178" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Haptoglobina baja, LDH, bilirrubina indirecta y reticulocitos altos: anemia hemolítica"><title>Haptoglobina baja, LDH, bilirrubina indirecta y reticulocitos altos: anemia hemolítica</title><rect x="0.75" y="0.75" width="998.5" height="1176.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Hematología · hemólisis</tspan></text><rect x="343.5" y="32.0" width="120.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="403.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="104"><tspan x="403.8" dy="0">HEMATOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hemólisis</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Destrucción acelerada de eritrocitos, con vida media menor de 120 días.</tspan><tspan x="58.0" dy="17">Puede ser intravascular o extravascular, congénita o adquirida.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de laboratorio</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Haptoglobina disminuida, con LDH, bilirrubina indirecta</tspan><tspan x="640.0" dy="16">y reticulocitos aumentados.</tspan><tspan x="640.0" dy="16">¿Qué anemia indica?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE LEE EL PATRÓN DE HEMÓLISIS</tspan></text><rect x="40.0" y="285.0" width="920.0" height="32.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="306.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="180"><tspan x="54.0" dy="0">EXAMEN</tspan></text><text x="250.0" y="306.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="130"><tspan x="250.0" dy="0">VALOR DEL CASO</tspan></text><text x="400.0" y="306.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="130"><tspan x="400.0" dy="0">NORMAL</tspan></text><text x="550.0" y="306.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="400"><tspan x="550.0" dy="0">QUÉ SIGNIFICA</tspan></text><rect x="40.0" y="323.0" width="920.0" height="40.0" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="347.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Haptoglobina</tspan></text><text x="250.0" y="348.0" font-size="13" font-weight="800" font-style="normal" fill="#2563eb" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Disminuida  ↓</tspan></text><text x="400.0" y="347.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Normal</tspan></text><text x="550.0" y="347.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Se consume al fijar la hemoglobina libre.</tspan></text><rect x="40.0" y="367.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="391.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">LDH</tspan></text><text x="250.0" y="392.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Aumentada  ↑</tspan></text><text x="400.0" y="391.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Normal</tspan></text><text x="550.0" y="391.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Sale del interior del eritrocito destruido.</tspan></text><rect x="40.0" y="411.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="435.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Bilirrubina indirecta</tspan></text><text x="250.0" y="436.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Aumentada  ↑</tspan></text><text x="400.0" y="435.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Normal</tspan></text><text x="550.0" y="435.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Catabolismo del grupo hemo.</tspan></text><rect x="40.0" y="455.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="479.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Reticulocitos</tspan></text><text x="250.0" y="480.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Aumentados  ↑</tspan></text><text x="400.0" y="479.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Normal</tspan></text><text x="550.0" y="479.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">La médula compensa la destrucción.</tspan></text><rect x="40.0" y="513.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="539.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Haptoglobina baja con LDH, bilirrubina indirecta y reticulocitos altos = hemólisis</tspan></text><text x="60.0" y="558.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">En la insuficiencia renal, el trastorno medular y la deficiencia nutricional los reticulocitos están bajos.</tspan></text><text x="40.0" y="619.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">HALLAZGOS QUE SEPARAN LA HEMÓLISIS DE OTRAS ANEMIAS</tspan></text><rect x="40.0" y="631.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="650.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Causa de anemia</tspan></text><text x="290.0" y="650.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Reticulocitos</tspan></text><text x="630.0" y="650.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">Haptoglobina</tspan></text><rect x="40.0" y="660.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="679.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Hemólisis</tspan></text><text x="290.0" y="679.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Aumentados</tspan></text><text x="630.0" y="679.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">Disminuida</tspan></text><rect x="180.6" y="663.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="226.0" y="678.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="226.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="689.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="708.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Insuficiencia renal crónica</tspan></text><text x="290.0" y="708.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Bajos: falta de eritropoyetina</tspan></text><text x="630.0" y="708.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">No baja de manera específica</tspan></text><rect x="40.0" y="718.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="737.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Trastorno medular primario</tspan></text><text x="290.0" y="737.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Bajos</tspan></text><text x="630.0" y="737.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">No baja de manera específica</tspan></text><rect x="40.0" y="747.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="766.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Deficiencia nutricional</tspan></text><text x="290.0" y="766.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Bajos</tspan></text><text x="630.0" y="766.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">No baja de manera específica</tspan></text><text x="40.0" y="792.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">El enunciado del libro decía «aumento de haptoglobina»: es un error; en la hemólisis disminuye.</tspan></text><text x="40.0" y="839.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="849.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="880.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="852.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="880.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hemólisis</tspan></text><text x="435.0" y="871.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Insuficiencia renal</tspan><tspan x="435.0" dy="17">crónica</tspan></text><text x="585.0" y="871.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Trastorno medular</tspan><tspan x="585.0" dy="17">primario</tspan></text><text x="735.0" y="871.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Deficiencia</tspan><tspan x="735.0" dy="17">nutricional</tspan></text><text x="885.0" y="880.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hepatopatía crónica</tspan></text><rect x="40.0" y="903.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="903.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="940.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué anemia indica?</tspan></text><text x="285.0" y="932.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: el patrón de</tspan><tspan x="285.0" dy="16">hemólisis</tspan></text><text x="435.0" y="924.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: tiene reticulocitos</tspan><tspan x="435.0" dy="16">bajos por falta de</tspan><tspan x="435.0" dy="16">eritropoyetina</tspan></text><text x="585.0" y="932.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: los reticulocitos</tspan><tspan x="585.0" dy="16">están bajos</tspan></text><text x="735.0" y="932.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: los reticulocitos</tspan><tspan x="735.0" dy="16">están bajos</tspan></text><text x="885.0" y="924.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no baja la</tspan><tspan x="885.0" dy="16">haptoglobina de</tspan><tspan x="885.0" dy="16">manera específica</tspan></text><rect x="40.0" y="849.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="993.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1021.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1043.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Tres grupos de datos: más producción medular (reticulocitos), más catabolismo de hemoglobina (bilirrubina indirecta) y liberación del contenido</tspan><tspan x="58.0" dy="18">   eritrocitario (LDH).</tspan><tspan x="58.0" dy="18">• La haptoglobina fija la hemoglobina libre y baja hasta ser indetectable: es el dato más específico en la hemólisis intravascular.</tspan><tspan x="58.0" dy="18">• Frotis: esquistocitos, esferocitos o células en diana según la causa; el test de Coombs directo identifica la forma autoinmune.</tspan><tspan x="58.0" dy="18">• Alerta: la haptoglobina es reactante de fase aguda; puede estar falsamente normal en inflamación y baja en hepatopatía.</tspan></text><text x="58.0" y="1137.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Phillips y Henderson, Hemolytic anemia (Am Fam Physician 2018;98:354); Harrison, Principios de Medicina Interna, 21.ª ed. (2022).</tspan></text></svg>