<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="912" viewBox="0 0 1000 912" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La artritis migratoria de grandes articulaciones es la manifestación mayor más frecuente de la fiebre reumática"><title>La artritis migratoria de grandes articulaciones es la manifestación mayor más frecuente de la fiebre reumática</title><rect x="0.75" y="0.75" width="998.5" height="910.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Fiebre reumática · criterios de Jones 2015</tspan></text><rect x="447.5" y="32.0" width="117.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="506.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="101"><tspan x="506.2" dy="0">CARDIOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Fiebre reumática</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Secuela autoinmune de la faringitis por estreptococo del grupo A, 2 a 4 semanas después.</tspan><tspan x="58.0" dy="17">Se diagnostica con los criterios de Jones.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es el criterio mayor más frecuente para el</tspan><tspan x="640.0" dy="16">diagnóstico de fiebre reumática?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><rect x="40.0" y="245.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="271.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Artritis = criterio mayor más frecuente; carditis = el más grave</tspan></text><text x="60.0" y="290.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La fiebre es solo un criterio menor.</tspan></text><text x="40.0" y="351.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CRITERIOS DE JONES 2015 (AHA): SE EXIGE EVIDENCIA DE ESTREPTOCOCO PREVIO</tspan></text><rect x="40.0" y="363.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">Criterio</tspan></text><text x="160.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="389"><tspan x="160.0" dy="0">Población de bajo riesgo</tspan></text><text x="565.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="389"><tspan x="565.0" dy="0">Población de riesgo moderado o alto</tspan></text><rect x="40.0" y="392.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="411.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">Mayores</tspan></text><text x="160.0" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="160.0" dy="0">Carditis (clínica o subclínica), poliartritis, corea, eritema marginado y</tspan><tspan x="160.0" dy="15">nódulos subcutáneos</tspan></text><text x="565.0" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="565.0" dy="0">Carditis (clínica o subclínica), mono o poliartritis o poliartralgia, corea,</tspan><tspan x="565.0" dy="15">eritema marginado y nódulos subcutáneos</tspan></text><rect x="40.0" y="436.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="455.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">Menores</tspan></text><text x="160.0" y="455.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="160.0" dy="0">Poliartralgia; fiebre ≥ 38,5 °C; VSG ≥ 60 mm/h o PCR ≥ 3 mg/dL; PR</tspan><tspan x="160.0" dy="15">prolongado</tspan></text><text x="565.0" y="455.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="565.0" dy="0">Monoartralgia; fiebre ≥ 38 °C; VSG ≥ 30 mm/h o PCR ≥ 3 mg/dL; PR</tspan><tspan x="565.0" dy="15">prolongado</tspan></text><rect x="40.0" y="480.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="499.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">Diagnóstico</tspan></text><text x="160.0" y="499.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="160.0" dy="0">2 mayores, o 1 mayor y 2 menores</tspan></text><text x="565.0" y="499.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="565.0" dy="0">2 mayores, o 1 mayor y 2 menores</tspan></text><text x="40.0" y="525.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Riesgo moderado o alto: incidencia &gt; 2 por 100 000 escolares o prevalencia de cardiopatía reumática &gt; 1 por 1000 habitantes.</tspan></text><text x="40.0" y="572.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="582.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="604.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="604.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Carditis</tspan></text><text x="435.0" y="604.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Eritema marginado</tspan></text><text x="585.0" y="604.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Corea</tspan></text><text x="735.0" y="604.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Fiebre</tspan></text><rect x="813.0" y="585.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="604.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Artritis</tspan></text><rect x="40.0" y="619.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="619.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="648.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Criterio mayor más</tspan><tspan x="54.0" dy="16">frecuente?</tspan></text><text x="285.0" y="640.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es la más grave,</tspan><tspan x="285.0" dy="16">pero no la más</tspan><tspan x="285.0" dy="16">frecuente</tspan></text><text x="435.0" y="656.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es poco frecuente</tspan></text><text x="585.0" y="648.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es tardía y poco</tspan><tspan x="585.0" dy="16">frecuente</tspan></text><text x="735.0" y="656.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es criterio menor</tspan></text><text x="885.0" y="648.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: 60 a 80 % de los</tspan><tspan x="885.0" dy="16">casos</tspan></text><rect x="40.0" y="582.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="709.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="737.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="759.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Evidencia de estreptococo previo más 2 criterios mayores, o 1 mayor y 2 menores. Mayores: carditis, poliartritis, corea, eritema marginado y nódulos</tspan><tspan x="58.0" dy="18">   subcutáneos.</tspan><tspan x="58.0" dy="18">• La artritis migratoria de grandes articulaciones ocurre en 60 a 80 % y responde rápido a los AINE; la carditis (50-60 %) es la más grave porque deja</tspan><tspan x="58.0" dy="18">   valvulopatía crónica.</tspan><tspan x="58.0" dy="18">• La corea es tardía (hasta 3 meses); el eritema marginado y los nódulos subcutáneos son raros. La fiebre es criterio menor.</tspan><tspan x="58.0" dy="18">• En poblaciones de riesgo moderado o alto, la monoartritis o la poliartralgia también cuenta como criterio mayor.</tspan></text><text x="58.0" y="871.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Gewitz MH et al., AHA, Jones Criteria (Circulation 2015;131:1806-18); Nelson 22.ª ed. (2024); Harrison 21.ª ed. (2022).</tspan></text></svg>