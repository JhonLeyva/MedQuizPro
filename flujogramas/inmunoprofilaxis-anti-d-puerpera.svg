<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="857" viewBox="0 0 1000 857" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Puérpera Rh negativa: la inmunoprofilaxis anti-D no sirve si ya tiene anticuerpos anti-D"><title>Puérpera Rh negativa: la inmunoprofilaxis anti-D no sirve si ya tiene anticuerpos anti-D</title><rect x="0.75" y="0.75" width="998.5" height="856.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Isoinmunización Rh · inmunoprofilaxis</tspan></text><rect x="428.3" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="515.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="515.5" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="131.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Inmunoprofilaxis anti-D</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La gammaglobulina anti-D destruye los glóbulos Rh+ del bebé antes de que la madre los</tspan><tspan x="58.0" dy="17">reconozca.</tspan><tspan x="58.0" dy="17">Si la madre ya fabricó anti-D (sensibilizada), la profilaxis llega tarde.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="131.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="129.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Puérpera inmediata Rh negativa</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué impediría indicarle la gammaglobulina anti-D?</tspan></text><line x1="640.0" y1="201.0" x2="670.0" y2="201.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="205.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="221.0" x2="320.0" y2="251.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="251.0" x2="500.0" y2="251.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="251.0" x2="500.0" y2="280.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,279.0 505.0,279.0 500.0,287.0" fill="#94a3b8"/><line x1="500.0" y1="357.0" x2="500.0" y2="387.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="387.0" x2="733.5" y2="387.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="387.0" x2="266.5" y2="416.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,415.0 271.5,415.0 266.5,423.0" fill="#94a3b8"/><line x1="733.5" y1="387.0" x2="733.5" y2="416.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,415.0 738.5,415.0 733.5,423.0" fill="#94a3b8"/><line x1="320.0" y1="221.0" x2="320.0" y2="251.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="251.0" x2="500.0" y2="251.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="251.0" x2="500.0" y2="280.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,279.0 505.0,279.0 500.0,287.0" fill="#0f766e"/><line x1="500.0" y1="357.0" x2="500.0" y2="387.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="387.0" x2="733.5" y2="387.0" stroke="#0f766e" stroke-width="3"/><line x1="733.5" y1="387.0" x2="733.5" y2="416.0" stroke="#0f766e" stroke-width="3"/><polygon points="728.5,415.0 738.5,415.0 733.5,423.0" fill="#0f766e"/><rect x="206.7" y="396.0" width="119.5" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="266.5" y="408.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Negativo y bebé Rh+</tspan></text><rect x="631.1" y="396.0" width="204.9" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="733.5" y="408.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Positivo: anti-D presentes (este caso)</tspan></text><polygon points="240.0,322.0 266.0,287.0 734.0,287.0 760.0,322.0 734.0,357.0 266.0,357.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="322.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="327.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="318.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Puérpera Rh negativa: ¿Coombs indirecto (anticuerpos</tspan><tspan x="519.0" dy="17">anti-D)?</tspan></text><rect x="40.0" y="423.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="266.5" y="459.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Anti-D en &lt; 72 h</tspan></text><text x="266.5" y="482.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">300 µg IM</tspan></text><rect x="507.0" y="423.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="733.5" y="451.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">NO SIRVE LA PROFILAXIS</tspan></text><text x="733.5" y="474.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Ya está sensibilizada</tspan><tspan x="733.5" dy="17">Vigilar futuros embarazos</tspan></text><text x="40.0" y="553.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="563.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="603.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="566.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="594.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Presencia de</tspan><tspan x="285.0" dy="17">anticuerpos anti-D</tspan></text><text x="435.0" y="594.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Que el producto sea</tspan><tspan x="435.0" dy="17">Rh positivo</tspan></text><text x="585.0" y="594.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Si el padre es Rh</tspan><tspan x="585.0" dy="17">positivo</tspan></text><text x="735.0" y="586.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Si el Coombs</tspan><tspan x="735.0" dy="17">indirecto es</tspan><tspan x="735.0" dy="17">negativo</tspan></text><text x="885.0" y="594.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Que sea su primer</tspan><tspan x="885.0" dy="17">parto</tspan></text><rect x="40.0" y="634.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="634.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="663.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Impide la profilaxis?</tspan></text><text x="285.0" y="655.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: ya está</tspan><tspan x="285.0" dy="16">sensibilizada</tspan></text><text x="435.0" y="663.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es la indicación</tspan></text><text x="585.0" y="655.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: hay que ver al</tspan><tspan x="585.0" dy="16">bebé</tspan></text><text x="735.0" y="655.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es la condición</tspan><tspan x="735.0" dy="16">para darla</tspan></text><text x="885.0" y="655.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: se da en cualquier</tspan><tspan x="885.0" dy="16">parto</tspan></text><rect x="40.0" y="563.5" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="708.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="736.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="758.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Se indica en las primeras 72 horas tras el parto si el bebé es Rh+ y la madre no está sensibilizada (Coombs indirecto negativo).</tspan><tspan x="58.0" dy="18">• También a las 28 semanas y tras aborto, ectópico, sangrado o procedimientos.</tspan><tspan x="58.0" dy="18">• Madre ya sensibilizada: no se da; el próximo embarazo se vigila con Doppler de la cerebral media fetal.</tspan></text><text x="58.0" y="816.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG Practice Bulletin n.º 181 (2017, reafirmado); Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>