<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Con radiografía sin fractura y partes blandas inflamadas, el examen inicial es la ecografía"><title>Con radiografía sin fractura y partes blandas inflamadas, el examen inicial es la ecografía</title><rect x="0.75" y="0.75" width="998.5" height="1248.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Traumatología · trauma de rodilla</tspan></text><rect x="396.2" y="32.0" width="135.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="463.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="119"><tspan x="463.8" dy="0">TRAUMATOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Trauma de rodilla sin fractura</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La radiografía descarta fractura pero no ve partes blandas.</tspan><tspan x="58.0" dy="17">La ecografía es un examen inicial accesible y sin radiación.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer con trauma de rodilla</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dolor a la flexión, edema e incapacidad funcional.</tspan><tspan x="640.0" dy="16">Radiografía sin fractura.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE LLEGA AL EXAMEN INICIAL</tspan></text><text x="614.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,293.0 580.0,293.0 543.8,369.0 76.2,369.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="309.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="332.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="424"><tspan x="310.0" dy="0">Trauma de rodilla con radiografía sin fractura y partes blandas</tspan><tspan x="310.0" dy="17">inflamadas</tspan></text><line x1="565.9" y1="331.0" x2="606.0" y2="331.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="302.0" width="80.9" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="654.4" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="654.4" dy="0">Tomografía</tspan></text><rect x="700.9" y="302.0" width="86.8" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="744.3" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="744.3" dy="0">Eco Doppler</tspan></text><rect x="793.6" y="302.0" width="90.7" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="839.0" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="839.0" dy="0">Artrocentesis</tspan></text><rect x="614.0" y="334.0" width="72.4" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="650.2" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="650.2" dy="0">Ecografía</tspan></text><rect x="692.4" y="334.0" width="81.5" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="733.1" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.1" dy="0">Artroscopia</tspan></text><polygon points="76.2,373.0 543.8,373.0 507.5,429.0 112.5,429.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="138.5" cy="401.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="138.5" y="405.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="138.5" dy="0">1</tspan></text><text x="320.0" y="405.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="331"><tspan x="320.0" dy="0">¿Evalúa partes blandas sin radiación?</tspan></text><line x1="529.6" y1="401.0" x2="606.0" y2="401.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="388.0" width="92.8" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="660.4" y="405.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="660.4" dy="0">✕ Tomografía</tspan></text><line x1="636.0" y1="401.5" x2="696.8" y2="401.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="112.5,433.0 507.5,433.0 471.2,493.0 148.8,493.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="174.8" cy="463.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="174.8" y="467.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="174.8" dy="0">2</tspan></text><text x="320.0" y="459.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="258"><tspan x="320.0" dy="0">¿Estudia el aparato extensor,</tspan><tspan x="320.0" dy="17">colaterales y bursas?</tspan></text><line x1="493.4" y1="463.0" x2="606.0" y2="463.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="450.0" width="98.9" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="663.4" y="467.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="663.4" dy="0">✕ Eco Doppler</tspan></text><line x1="636.0" y1="463.5" x2="702.9" y2="463.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="148.8,497.0 471.2,497.0 435.0,557.0 185.0,557.0" fill="#5eead4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="527.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="531.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">3</tspan></text><text x="320.0" y="523.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">¿Es un examen y no un</tspan><tspan x="320.0" dy="17">procedimiento?</tspan></text><line x1="457.1" y1="527.0" x2="606.0" y2="527.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="514.0" width="102.1" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="665.1" y="531.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="665.1" dy="0">✕ Artrocentesis</tspan></text><line x1="636.0" y1="527.5" x2="706.1" y2="527.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="722.1" y="514.0" width="93.0" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="768.6" y="531.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="768.6" dy="0">✕ Artroscopia</tspan></text><line x1="744.1" y1="527.5" x2="805.1" y2="527.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="561.0" x2="310.0" y2="580.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,579.0 315.0,579.0 310.0,587.0" fill="#0f766e"/><rect x="140.0" y="591.0" width="340.0" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="620.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">ECOGRAFÍA</tspan></text><text x="310.0" y="644.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Estudio dinámico de partes blandas</tspan><tspan x="310.0" dy="17">Si hay duda de meniscos o cruzados: resonancia</tspan></text><rect x="370.6" y="580.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="595.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="598.9" width="346.0" height="76.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="618.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="636.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">La artrocentesis se reserva para un derrame importante,</tspan><tspan x="628.0" dy="16">sospecha de infección o cristales.</tspan></text><text x="40.0" y="716.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ESTUDIO DE LA RODILLA SEGÚN LO QUE SE BUSCA</tspan></text><rect x="40.0" y="728.9" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="747.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Sospecha</tspan></text><text x="310.0" y="747.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="644"><tspan x="310.0" dy="0">Estudio</tspan></text><rect x="40.0" y="757.9" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="776.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Fractura</tspan></text><text x="310.0" y="776.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="644"><tspan x="310.0" dy="0">Radiografía; tomografía si es oculta o compleja</tspan></text><rect x="40.0" y="786.9" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="805.9" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Partes blandas</tspan></text><text x="310.0" y="805.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="644"><tspan x="310.0" dy="0">Ecografía de colaterales, tendones y bursas</tspan></text><rect x="200.6" y="790.4" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="246.0" y="805.4" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="246.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="815.9" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="834.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Meniscos y ligamentos cruzados</tspan></text><text x="310.0" y="834.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="644"><tspan x="310.0" dy="0">Resonancia magnética</tspan></text><rect x="40.0" y="844.9" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="863.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Trombosis o lesión vascular</tspan></text><text x="310.0" y="863.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="644"><tspan x="310.0" dy="0">Eco Doppler</tspan></text><text x="40.0" y="913.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="923.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="954.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="946.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Tomografía espiral</tspan><tspan x="285.0" dy="17">multicorte</tspan></text><text x="435.0" y="954.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Eco Doppler</tspan></text><text x="585.0" y="954.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Artrocentesis</tspan></text><rect x="663.0" y="926.9" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="954.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ecografía</tspan></text><text x="885.0" y="954.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Artroscopia</tspan></text><rect x="40.0" y="977.9" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="977.9" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1014.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Examen a solicitar?</tspan></text><text x="285.0" y="1006.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es para fracturas</tspan><tspan x="285.0" dy="16">ocultas o complejas</tspan></text><text x="435.0" y="1006.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: estudia trombosis</tspan><tspan x="435.0" dy="16">o lesión vascular</tspan></text><text x="585.0" y="998.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: se reserva para</tspan><tspan x="585.0" dy="16">derrame importante,</tspan><tspan x="585.0" dy="16">infección o cristales</tspan></text><text x="735.0" y="1006.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: valora partes</tspan><tspan x="735.0" dy="16">blandas sin radiación</tspan></text><text x="885.0" y="998.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es un</tspan><tspan x="885.0" dy="16">procedimiento</tspan><tspan x="885.0" dy="16">terapéutico</tspan></text><rect x="40.0" y="923.9" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1067.9" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1095.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1117.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Sospecha: lesión de partes blandas: desgarro muscular o tendinoso, esguince colateral, bursitis, hematoma o derrame.</tspan><tspan x="58.0" dy="18">• La ecografía valora colaterales, aparato extensor, bursas y colecciones, con estudio dinámico; es limitada para meniscos y ligamentos cruzados.</tspan><tspan x="58.0" dy="18">• Si se sospecha lesión interna (meniscos, cruzados) el estudio de elección es la resonancia magnética, que no figura entre las opciones.</tspan><tspan x="58.0" dy="18">• Los criterios de Ottawa de la rodilla ayudan a decidir si se pide radiografía; la artroscopia es terapéutica, no un examen inicial.</tspan></text><text x="58.0" y="1193.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Assessing diagnostic challenges in acute soft-tissue knee injuries. Bone Jt Open 2024; Diagnostic Musculoskeletal Ultrasound of the Knee Lateral Collateral Ligament.</tspan><tspan x="58.0" dy="15">Int J Sports Phys Ther 2025;20:1763-1768.</tspan></text></svg>