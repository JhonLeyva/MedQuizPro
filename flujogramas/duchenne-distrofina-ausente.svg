pan><tspan x="585.0" dy="16">nemalínica</tspan></text><text x="735.0" y="1026.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es una fosfatasa</tspan></text><text x="885.0" y="1018.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: distrofias</tspan><tspan x="885.0" dy="16">congénitas</tspan></text><rect x="40.0" y="960.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1071.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1099.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1121.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Becker: distrofina presente pero alterada (más leve, más tardía).</tspan><tspan x="58.0" dy="18">• Corticoides (deflazacort o prednisona) retrasan la progresión.</tspan><tspan x="58.0" dy="18">• Vigilar corazón (miocardiopatía) y función respiratoria.</tspan></text><text x="58.0" y="1179.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Guía DMD Care Considerations (2018, act. 2024).</tspan></text></svg>