<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1245" viewBox="0 0 1000 1245" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Con el dispositivo intrauterino el dolor pélvico es la complicación más frecuente entre las opciones"><title>Con el dispositivo intrauterino el dolor pélvico es la complicación más frecuente entre las opciones</title><rect x="0.75" y="0.75" width="998.5" height="1243.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ginecología · dispositivo intrauterino</tspan></text><rect x="420.1" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="499.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="499.8" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Dispositivo intrauterino</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">De cobre o de levonorgestrel; reversible, con falla menor de 1 % al año.</tspan><tspan x="58.0" dy="17">La inserción y el primer año concentran los eventos.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de complicaciones</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es la complicación más frecuente de su uso?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CUÁNDO SOSPECHAR UNA COMPLICACIÓN DEL DISPOSITIVO</tspan></text><rect x="40.0" y="253.0" width="602.0" height="34.0" rx="10" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.2"/><text x="56.0" y="275.0" font-size="11.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="452"><tspan x="56.0" dy="0">QUÉ HACER</tspan></text><text x="626.0" y="275.0" font-size="10.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="end" data-max="100"><tspan x="626.0" dy="0">EN EL CASO</tspan></text><rect x="40.0" y="293.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,308.5 74.0,328.5 50.0,328.5" fill="#dc2626"/><text x="62.0" y="325.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="316.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Dolor pélvico o cólico persistente</tspan></text><text x="84.0" y="333.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Es el síntoma más frecuente; descartar expulsión o infección</tspan></text><text x="626.0" y="323.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="352.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,367.5 74.0,387.5 50.0,387.5" fill="#dc2626"/><text x="62.0" y="384.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="375.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Fiebre, flujo purulento y dolor a la movilización cervical</tspan></text><text x="84.0" y="392.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Enfermedad inflamatoria pélvica, sobre todo en los primeros 20 días</tspan></text><text x="626.0" y="382.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="411.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,426.5 74.0,446.5 50.0,446.5" fill="#dc2626"/><text x="62.0" y="443.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="434.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Hilos no visibles</tspan></text><text x="84.0" y="451.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Expulsión o perforación: ecografía</tspan></text><text x="626.0" y="441.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="470.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,485.5 74.0,505.5 50.0,505.5" fill="#dc2626"/><text x="62.0" y="502.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="493.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Retraso menstrual con dolor</tspan></text><text x="84.0" y="510.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Descartar embarazo, incluido el ectópico</tspan></text><text x="626.0" y="500.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="529.0" width="602.0" height="53.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><polygon points="62.0,544.5 74.0,564.5 50.0,564.5" fill="#cbd5e1"/><text x="62.0" y="561.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="552.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Cambios del sangrado sin dolor</tspan></text><text x="84.0" y="569.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Esperado: aumenta con cobre y disminuye con levonorgestrel</tspan></text><text x="626.0" y="559.5" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">No</tspan></text><rect x="660.0" y="253.0" width="300.0" height="329.0" rx="12" fill="#dc2626" stroke="none" stroke-width="1.5"/><text x="676.0" y="277.0" font-size="10.5" font-weight="800" font-style="normal" fill="#fecaca" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">ANTE DOLOR O HILOS AUSENTES</tspan></text><text x="676.0" y="392.5" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">Descartar embarazo e infección antes</tspan><tspan x="676.0" dy="17">de decidir</tspan></text><text x="676.0" y="426.5" font-size="12" font-weight="500" font-style="normal" fill="#fee2e2" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">Prueba de embarazo, examen pélvico y</tspan><tspan x="676.0" dy="16">ecografía; retirar el dispositivo si hay</tspan><tspan x="676.0" dy="16">embarazo, infección que no cede o</tspan><tspan x="676.0" dy="16">perforación.</tspan></text><rect x="40.0" y="600.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="626.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Dolor pélvico = complicación más frecuente de las opciones</tspan></text><text x="60.0" y="645.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La expulsión, que el libro reconoce como la más frecuente, no figura entre ellas.</tspan></text><text x="40.0" y="706.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EFECTOS DEL DISPOSITIVO SEGÚN EL TIPO</tspan></text><rect x="40.0" y="718.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="737.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Dispositivo</tspan></text><text x="200.0" y="737.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="369"><tspan x="200.0" dy="0">Efecto en el sangrado</tspan></text><text x="585.0" y="737.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="369"><tspan x="585.0" dy="0">Otros eventos</tspan></text><rect x="40.0" y="747.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="766.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Cobre</tspan></text><text x="200.0" y="766.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="200.0" dy="0">Más abundante y más doloroso</tspan></text><text x="585.0" y="766.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="585.0" dy="0">Expulsión, dolor pélvico</tspan></text><rect x="40.0" y="776.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="795.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Levonorgestrel</tspan></text><text x="200.0" y="795.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="200.0" dy="0">Hipomenorrea o amenorrea</tspan></text><text x="585.0" y="795.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="585.0" dy="0">Expulsión, quistes funcionales</tspan></text><rect x="40.0" y="805.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="824.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Ambos</tspan></text><text x="200.0" y="824.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="200.0" dy="0">Falla menor de 1 % al año</tspan></text><text x="585.0" y="824.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="585.0" dy="0">Perforación cerca de 1 por 1000 inserciones</tspan></text><text x="40.0" y="874.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="884.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="906.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="887.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="906.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Dolor pélvico</tspan></text><text x="435.0" y="906.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Dismenorrea</tspan></text><text x="585.0" y="906.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Hipomenorrea</tspan></text><text x="735.0" y="906.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Disquecia</tspan></text><text x="885.0" y="906.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Sequedad vaginal</tspan></text><rect x="40.0" y="921.0" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="921.0" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="958.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Complicación más</tspan><tspan x="54.0" dy="16">frecuente?</tspan></text><text x="285.0" y="950.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: clave del banco por</tspan><tspan x="285.0" dy="16">descarte entre las</tspan><tspan x="285.0" dy="16">opciones</tspan></text><text x="435.0" y="950.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: se asocia más al</tspan><tspan x="435.0" dy="16">uso de cobre que a las</tspan><tspan x="435.0" dy="16">complicaciones</tspan></text><text x="585.0" y="942.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es un efecto del</tspan><tspan x="585.0" dy="16">dispositivo hormonal,</tspan><tspan x="585.0" dy="16">no la complicación</tspan><tspan x="585.0" dy="16">principal</tspan></text><text x="735.0" y="958.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no se relaciona</tspan><tspan x="735.0" dy="16">con el dispositivo</tspan></text><text x="885.0" y="958.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no se relaciona</tspan><tspan x="885.0" dy="16">con el dispositivo</tspan></text><rect x="40.0" y="884.0" width="920.0" height="119.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1027.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1055.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1077.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Durante el uso: dolor pélvico, cambios del sangrado (más abundante con el de cobre; hipomenorrea o amenorrea con el hormonal), expulsión y</tspan><tspan x="58.0" dy="18">   enfermedad inflamatoria pélvica.</tspan><tspan x="58.0" dy="18">• El libro reconoce que la expulsión es la complicación más frecuente, pero no figura entre las opciones; por descarte se marca el dolor pélvico.</tspan><tspan x="58.0" dy="18">• Inserción: dolor, reacción vasovagal y perforación (cerca de 1 por 1000). La enfermedad inflamatoria pélvica se concentra en los primeros 20 días.</tspan><tspan x="58.0" dy="18">• Alerta: embarazo con dispositivo in situ eleva el riesgo de ectópico, aborto y parto pretérmino; sin hilos visibles se descarta expulsión o perforación con</tspan><tspan x="58.0" dy="18">   ecografía.</tspan></text><text x="58.0" y="1189.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, U.S. Selected Practice Recommendations for Contraceptive Use (MMWR Recomm Rep 2024;73(3)); CDC, U.S. Medical Eligibility Criteria (MMWR Recomm Rep</tspan><tspan x="58.0" dy="15">2024;73(4)).</tspan></text></svg>