<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1345" viewBox="0 0 1000 1345" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Lactante con diarrea y shock hipovolémico: bolo de solución isotónica a 20 mL/kg"><title>Lactante con diarrea y shock hipovolémico: bolo de solución isotónica a 20 mL/kg</title><rect x="0.75" y="0.75" width="998.5" height="1343.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · deshidratación grave con shock</tspan></text><rect x="452.9" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="502.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="502.0" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Deshidratación grave</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Criterios OMS: letargia, ojos hundidos, incapacidad para beber y pliegue que desaparece</tspan><tspan x="58.0" dy="17">muy lentamente.</tspan><tspan x="58.0" dy="17">Con mala perfusión es shock hipovolémico.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 3 meses</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Quince deposiciones líquidas en 24 horas, FC 200 y</tspan><tspan x="640.0" dy="16">FR 62.</tspan><tspan x="640.0" dy="16">Ojos hundidos, sin lágrimas, cutis marmórea, llenado</tspan><tspan x="640.0" dy="16">capilar de 4 segundos.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL SHOCK A LA REHIDRATACIÓN</tspan></text><text x="40.0" y="313.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="430"><tspan x="40.0" dy="0">QUÉ SE HACE</tspan></text><text x="516.0" y="313.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="444"><tspan x="516.0" dy="0">QUÉ SE ESPERA</tspan></text><rect x="40.0" y="323.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="352.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="357.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><text x="84.0" y="349.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Reconocer el shock</tspan></text><text x="84.0" y="366.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Taquicardia de 200, piel marmórea y llenado capilar de 4 segundos</tspan></text><line x1="476.0" y1="352.5" x2="503.0" y2="352.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,347.5 502.0,357.5 510.0,352.5" fill="#ea580c"/><rect x="516.0" y="325.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="349.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Shock hipovolémico</tspan></text><text x="530.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Deshidratación grave</tspan></text><line x1="255.0" y1="384.0" x2="255.0" y2="397.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,396.0 260.0,396.0 255.0,404.0" fill="#0f766e"/><rect x="40.0" y="406.0" width="430.0" height="75.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="443.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="448.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">2</tspan></text><text x="84.0" y="432.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Bolo isotónico</tspan></text><text x="84.0" y="449.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Suero fisiológico 0,9 % o lactato de Ringer a 20 mL/kg en 5-20</tspan><tspan x="84.0" dy="16">minutos</tspan></text><line x1="476.0" y1="443.5" x2="503.0" y2="443.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,438.5 502.0,448.5 510.0,443.5" fill="#ea580c"/><rect x="516.0" y="416.0" width="444.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="530.0" y="440.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Opción correcta</tspan></text><text x="530.0" y="457.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Restaura la perfusión</tspan></text><line x1="255.0" y1="483.0" x2="255.0" y2="496.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,495.0 260.0,495.0 255.0,503.0" fill="#0f766e"/><rect x="40.0" y="505.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="534.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="539.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">3</tspan></text><text x="84.0" y="531.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Reevaluar</tspan></text><text x="84.0" y="548.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Perfusión, frecuencia cardiaca y llenado capilar tras cada bolo</tspan></text><line x1="476.0" y1="534.5" x2="503.0" y2="534.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,529.5 502.0,539.5 510.0,534.5" fill="#ea580c"/><rect x="516.0" y="507.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="531.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Persiste el shock</tspan></text><text x="530.0" y="548.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Repetir el bolo, hasta tres veces</tspan></text><line x1="255.0" y1="566.0" x2="255.0" y2="579.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,578.0 260.0,578.0 255.0,586.0" fill="#0f766e"/><rect x="40.0" y="588.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="617.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="622.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">4</tspan></text><text x="84.0" y="614.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Estabilizado</tspan></text><text x="84.0" y="631.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Rehidratación oral o continua; luego electrolitos y glucemia</tspan></text><line x1="476.0" y1="617.5" x2="503.0" y2="617.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,612.5 502.0,622.5 510.0,617.5" fill="#ea580c"/><rect x="516.0" y="590.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="614.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Sin shock</tspan></text><text x="530.0" y="631.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Continuar la reposición</tspan></text><rect x="40.0" y="665.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="691.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Shock por diarrea = bolo isotónico</tspan></text><text x="60.0" y="710.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Albúmina, plasma, dextrosa 5 % y solución hipertónica no son el tratamiento inicial.</tspan></text><text x="40.0" y="771.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SIGNOS DE DESHIDRATACIÓN GRAVE (OMS)</tspan></text><rect x="40.0" y="783.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="802.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Signo</tspan></text><text x="250.0" y="802.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Hallazgo</tspan></text><text x="610.0" y="802.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">En este lactante</tspan></text><rect x="40.0" y="812.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="831.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Estado general</tspan></text><text x="250.0" y="831.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Letárgico o inconsciente</tspan></text><text x="610.0" y="831.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Mala perfusión con cutis marmórea</tspan></text><rect x="40.0" y="841.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="860.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Ojos</tspan></text><text x="250.0" y="860.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Hundidos</tspan></text><text x="610.0" y="860.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Hundidos, sin lágrimas</tspan></text><rect x="40.0" y="870.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="889.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Sed y bebida</tspan></text><text x="250.0" y="889.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">No puede beber o bebe mal</tspan></text><text x="610.0" y="889.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Mucosa oral seca</tspan></text><rect x="40.0" y="899.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="918.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Pliegue cutáneo</tspan></text><text x="250.0" y="918.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Desaparece muy lentamente</tspan></text><text x="610.0" y="918.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Llenado capilar de 4 segundos</tspan></text><text x="40.0" y="944.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Dos o más signos de la lista indican deshidratación grave.</tspan></text><text x="40.0" y="991.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1001.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1032.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="1004.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="1023.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Solución isotónica</tspan><tspan x="285.0" dy="17">en bolo</tspan></text><text x="435.0" y="1023.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Albúmina 5 % en</tspan><tspan x="435.0" dy="17">bolo</tspan></text><text x="585.0" y="1032.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Plasma en 2 horas</tspan></text><text x="735.0" y="1023.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Dextrosa 5 % en</tspan><tspan x="735.0" dy="17">bolo</tspan></text><text x="885.0" y="1023.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Solución</tspan><tspan x="885.0" dy="17">hipertónica 3 % EV</tspan></text><rect x="40.0" y="1055.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1055.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1092.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tratamiento inicial?</tspan></text><text x="285.0" y="1084.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: restaura la</tspan><tspan x="285.0" dy="16">perfusión</tspan></text><text x="435.0" y="1084.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: sin ventaja y de</tspan><tspan x="435.0" dy="16">mayor riesgo</tspan></text><text x="585.0" y="1084.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sin ventaja y de</tspan><tspan x="585.0" dy="16">mayor riesgo</tspan></text><text x="735.0" y="1084.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es hipotónica y no</tspan><tspan x="735.0" dy="16">repone volumen</tspan></text><text x="885.0" y="1076.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es para la</tspan><tspan x="885.0" dy="16">hiponatremia</tspan><tspan x="885.0" dy="16">sintomática</tspan></text><rect x="40.0" y="1001.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1145.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1173.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1195.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Restaurar la perfusión primero: bolo de cristaloide isotónico (suero fisiológico 0,9 % o lactato de Ringer) a 20 mL/kg en 5-20 minutos.</tspan><tspan x="58.0" dy="18">• Reevaluar tras cada bolo y repetir hasta tres veces; al estabilizarse pasar a rehidratación oral o continua.</tspan><tspan x="58.0" dy="18">• Albúmina y plasma no aportan ventaja y son más caros; la dextrosa al 5 % es hipotónica y no repone volumen; la solución hipertónica 3 % es para la</tspan><tspan x="58.0" dy="18">   hiponatremia sintomática.</tspan><tspan x="58.0" dy="18">• Perla: primero volumen, luego se evalúan electrolitos y glucemia. La sal de rehidratación oral es la base en la deshidratación leve o moderada.</tspan></text><text x="58.0" y="1289.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Guarino A et al., ESPGHAN/ESPID, gastroenteritis aguda en niños. J Pediatr Gastroenterol Nutr 2014; OMS, Libro de bolsillo de atención hospitalaria del niño, 2.ª ed.</tspan><tspan x="58.0" dy="15">(2013).</tspan></text></svg>