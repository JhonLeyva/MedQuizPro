<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1080" viewBox="0 0 1000 1080" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La hipercalcemia acorta el intervalo QT: el calcio acorta la meseta del potencial de acción"><title>La hipercalcemia acorta el intervalo QT: el calcio acorta la meseta del potencial de acción</title><rect x="0.75" y="0.75" width="998.5" height="1078.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Electrocardiograma · calcio y QT</tspan></text><rect x="394.2" y="32.0" width="117.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="452.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="101"><tspan x="452.8" dy="0">CARDIOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Calcio y repolarización</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El calcio regula la duración de la meseta (fase 2) del potencial ventricular.</tspan><tspan x="58.0" dy="17">Con más calcio la meseta se acorta: el ST y el QT se acortan.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Dónde está la alteración más característica del ECG</tspan><tspan x="640.0" dy="16">en la hipercalcemia?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CALCIO SÉRICO Y SU EFECTO EN EL ECG</tspan></text><rect x="40.0" y="269.0" width="920.0" height="151.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="295.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Calcio sérico total (mg/dL)</tspan></text><text x="60.0" y="314.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Normal 8,5-10,5. La hipercalcemia grave es emergencia.</tspan></text><rect x="70.0" y="344.0" width="143.3" height="40.0" rx="6" fill="#fef9c3" stroke="#ffffff" stroke-width="2"/><text x="141.7" y="369.0" font-size="12" font-weight="800" font-style="normal" fill="#a16207" text-anchor="middle" data-max="133"><tspan x="141.7" dy="0">Bajo</tspan></text><rect x="213.3" y="344.0" width="191.1" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="308.9" y="369.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="181"><tspan x="308.9" dy="0">Normal</tspan></text><rect x="404.4" y="344.0" width="143.3" height="40.0" rx="6" fill="#fef9c3" stroke="#ffffff" stroke-width="2"/><text x="476.1" y="369.0" font-size="12" font-weight="800" font-style="normal" fill="#a16207" text-anchor="middle" data-max="133"><tspan x="476.1" dy="0">Leve</tspan></text><rect x="547.8" y="344.0" width="191.1" height="40.0" rx="6" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/><text x="643.3" y="369.0" font-size="12" font-weight="800" font-style="normal" fill="#c2410c" text-anchor="middle" data-max="181"><tspan x="643.3" dy="0">Moderada</tspan></text><rect x="738.9" y="344.0" width="191.1" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="834.4" y="369.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="181"><tspan x="834.4" dy="0">Grave</tspan></text><line x1="213.3" y1="384.0" x2="213.3" y2="392.0" stroke="#64748b" stroke-width="1.5"/><text x="213.3" y="406.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="213.3" dy="0">8,5</tspan></text><line x1="404.4" y1="384.0" x2="404.4" y2="392.0" stroke="#64748b" stroke-width="1.5"/><text x="404.4" y="406.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="404.4" dy="0">10,5</tspan></text><line x1="547.8" y1="384.0" x2="547.8" y2="392.0" stroke="#64748b" stroke-width="1.5"/><text x="547.8" y="406.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="547.8" dy="0">12</tspan></text><line x1="738.9" y1="384.0" x2="738.9" y2="392.0" stroke="#64748b" stroke-width="1.5"/><text x="738.9" y="406.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="738.9" dy="0">14</tspan></text><rect x="40.0" y="434.0" width="920.0" height="191.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="460.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Intervalo QT corregido (ms)</tspan></text><text x="60.0" y="479.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La hipercalcemia lo acorta; la hipocalcemia lo alarga.</tspan></text><rect x="70.0" y="509.0" width="195.5" height="40.0" rx="6" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/><text x="167.7" y="534.0" font-size="12" font-weight="800" font-style="normal" fill="#c2410c" text-anchor="middle" data-max="185"><tspan x="167.7" dy="0">QT corto</tspan></text><rect x="265.5" y="509.0" width="390.9" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="460.9" y="534.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="381"><tspan x="460.9" dy="0">Normal</tspan></text><rect x="656.4" y="509.0" width="273.6" height="40.0" rx="6" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/><text x="793.2" y="534.0" font-size="12" font-weight="800" font-style="normal" fill="#c2410c" text-anchor="middle" data-max="264"><tspan x="793.2" dy="0">QT largo</tspan></text><line x1="265.5" y1="549.0" x2="265.5" y2="557.0" stroke="#64748b" stroke-width="1.5"/><text x="265.5" y="571.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="265.5" dy="0">350</tspan></text><line x1="656.4" y1="549.0" x2="656.4" y2="557.0" stroke="#64748b" stroke-width="1.5"/><text x="656.4" y="571.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="656.4" dy="0">450</tspan></text><rect x="60.0" y="583.0" width="880.0" height="30.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/><text x="500.0" y="603.0" font-size="11.5" font-weight="700" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Hipercalcemia: QT corto. Hipocalcemia: QT largo y riesgo de torsades</tspan></text><text x="40.0" y="657.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ CAMBIA CON EL CALCIO ALTO</tspan></text><rect x="40.0" y="667.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="668.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="691.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Se acorta</tspan></text><text x="58.0" y="712.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Segmento ST e intervalo QT</tspan></text><rect x="351.3" y="667.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="668.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="691.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">No cambia</tspan></text><text x="369.3" y="712.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">PR, onda P y onda Q</tspan></text><rect x="662.7" y="667.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="668.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="691.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Si es grave</tspan></text><text x="680.7" y="712.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Bradicardia y bloqueos</tspan></text><text x="40.0" y="776.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="786.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="808.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="808.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Intervalo PR</tspan></text><rect x="363.0" y="789.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="808.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Intervalo QT</tspan></text><text x="585.0" y="808.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Segmento ST</tspan></text><text x="735.0" y="808.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Onda P</tspan></text><text x="885.0" y="808.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Onda Q</tspan></text><rect x="40.0" y="823.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="823.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="860.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Dónde?</tspan></text><text x="285.0" y="852.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no cambia de</tspan><tspan x="285.0" dy="16">forma típica</tspan></text><text x="435.0" y="852.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: se acorta con el</tspan><tspan x="435.0" dy="16">calcio alto</tspan></text><text x="585.0" y="844.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: se acorta como</tspan><tspan x="585.0" dy="16">parte del QT, no es la</tspan><tspan x="585.0" dy="16">medida</tspan></text><text x="735.0" y="852.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no cambia de</tspan><tspan x="735.0" dy="16">forma típica</tspan></text><text x="885.0" y="852.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no cambia de</tspan><tspan x="885.0" dy="16">forma típica</tspan></text><rect x="40.0" y="786.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="913.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="941.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="963.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Hipercalcemia: QT corto por acortamiento del segmento ST; en cifras marcadas la onda T parece nacer del final del QRS.</tspan><tspan x="58.0" dy="18">• Hipocalcemia: lo contrario, ST y QT largos, con riesgo de torsades de pointes.</tspan><tspan x="58.0" dy="18">• El PR, la onda P y la onda Q no cambian de forma típica; en hipercalcemia grave puede haber bradicardia y bloqueos.</tspan><tspan x="58.0" dy="18">• Alerta: calcio &gt; 14 mg/dL o síntomas (confusión, poliuria, deshidratación, arritmias) son emergencia; hidratar con solución salina y tratar la causa.</tspan></text><text x="58.0" y="1039.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Walker MD, Shoback D. Hypercalcemia: a review (JAMA 2022); Harrison, Principios de Medicina Interna, 21.ª ed. (2022)</tspan></text></svg>