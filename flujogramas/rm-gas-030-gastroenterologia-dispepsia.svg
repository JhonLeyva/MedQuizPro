<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1263" viewBox="0 0 1000 1263" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El café y las comidas abundantes y grasas desencadenan con más frecuencia la dispepsia funcional"><title>El café y las comidas abundantes y grasas desencadenan con más frecuencia la dispepsia funcional</title><rect x="0.75" y="0.75" width="998.5" height="1261.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Gastroenterología · dispepsia</tspan></text><rect x="375.7" y="32.0" width="165.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="458.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="149"><tspan x="458.4" dy="0">GASTROENTEROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Dispepsia</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Dolor o ardor epigástrico, plenitud posprandial o saciedad precoz.</tspan><tspan x="58.0" dy="17">Orgánica si hay úlcera, cáncer o reflujo; funcional si no hay lesión (la mayoría).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué ingesta induce más la dispepsia?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CUÁNDO LA DISPEPSIA DEJA DE SER FUNCIONAL</tspan></text><rect x="40.0" y="253.0" width="602.0" height="34.0" rx="10" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.2"/><text x="56.0" y="275.0" font-size="11.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="452"><tspan x="56.0" dy="0">BANDERAS ROJAS DE LA DISPEPSIA</tspan></text><text x="626.0" y="275.0" font-size="10.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="end" data-max="100"><tspan x="626.0" dy="0">EN EL CASO</tspan></text><rect x="40.0" y="293.0" width="602.0" height="53.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><polygon points="62.0,308.5 74.0,328.5 50.0,328.5" fill="#cbd5e1"/><text x="62.0" y="325.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="316.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Edad mayor de 60 años al inicio</tspan></text><text x="84.0" y="333.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Mayor riesgo de cáncer</tspan></text><text x="626.0" y="323.5" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sin dato</tspan></text><rect x="40.0" y="352.0" width="602.0" height="53.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><polygon points="62.0,367.5 74.0,387.5 50.0,387.5" fill="#cbd5e1"/><text x="62.0" y="384.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="375.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Pérdida de peso involuntaria</tspan></text><text x="84.0" y="392.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Sospechar neoplasia</tspan></text><text x="626.0" y="382.5" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sin dato</tspan></text><rect x="40.0" y="411.0" width="602.0" height="53.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><polygon points="62.0,426.5 74.0,446.5 50.0,446.5" fill="#cbd5e1"/><text x="62.0" y="443.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="434.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Disfagia o vómitos persistentes</tspan></text><text x="84.0" y="451.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Obstrucción o lesión orgánica</tspan></text><text x="626.0" y="441.5" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sin dato</tspan></text><rect x="40.0" y="470.0" width="602.0" height="53.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><polygon points="62.0,485.5 74.0,505.5 50.0,505.5" fill="#cbd5e1"/><text x="62.0" y="502.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="493.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Anemia o sangrado digestivo</tspan></text><text x="84.0" y="510.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Úlcera o tumor</tspan></text><text x="626.0" y="500.5" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sin dato</tspan></text><rect x="40.0" y="529.0" width="602.0" height="53.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><polygon points="62.0,544.5 74.0,564.5 50.0,564.5" fill="#cbd5e1"/><text x="62.0" y="561.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="552.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Masa o adenopatía palpable</tspan></text><text x="84.0" y="569.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Cáncer</tspan></text><text x="626.0" y="559.5" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sin dato</tspan></text><rect x="40.0" y="588.0" width="602.0" height="53.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><polygon points="62.0,603.5 74.0,623.5 50.0,623.5" fill="#cbd5e1"/><text x="62.0" y="620.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="611.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Antecedente familiar de cáncer gástrico</tspan></text><text x="84.0" y="628.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Mayor riesgo</tspan></text><text x="626.0" y="618.5" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sin dato</tspan></text><rect x="660.0" y="253.0" width="300.0" height="388.0" rx="12" fill="#dc2626" stroke="none" stroke-width="1.5"/><text x="676.0" y="277.0" font-size="10.5" font-weight="800" font-style="normal" fill="#fecaca" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">SI HAY UNA BANDERA ROJA</tspan></text><text x="676.0" y="446.5" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">Endoscopía alta con biopsia</tspan></text><text x="676.0" y="463.5" font-size="12" font-weight="500" font-style="normal" fill="#fee2e2" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">Si hay alguna bandera roja no se trata de</tspan><tspan x="676.0" dy="16">forma empírica.</tspan></text><rect x="40.0" y="659.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="685.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Sin banderas rojas = dispepsia funcional probable</tspan></text><text x="60.0" y="704.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Desencadenantes: comidas abundantes y grasas, y café.</tspan></text><text x="40.0" y="765.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DISPEPSIA FUNCIONAL SEGÚN ROMA IV: SUBTIPOS (SÍNTOMAS DE 3 MESES, INICIO 6 MESES ANTES, SIN LESIÓN EN LA ENDOSCOPÍA)</tspan></text><rect x="40.0" y="777.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="796.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">Subtipo</tspan></text><text x="175.0" y="796.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="249"><tspan x="175.0" dy="0">Síntoma que lo define</tspan></text><text x="440.0" y="796.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="249"><tspan x="440.0" dy="0">Frecuencia mínima</tspan></text><text x="705.0" y="796.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="249"><tspan x="705.0" dy="0">Opciones terapéuticas (ACG-CAG 2017)</tspan></text><rect x="40.0" y="806.0" width="920.0" height="59.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="825.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">Distrés</tspan><tspan x="50.0" dy="15">posprandial</tspan></text><text x="175.0" y="825.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="175.0" dy="0">Plenitud posprandial molesta y/o saciedad</tspan><tspan x="175.0" dy="15">precoz que impide terminar una comida</tspan><tspan x="175.0" dy="15">normal</tspan></text><text x="440.0" y="825.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="440.0" dy="0">3 días por semana</tspan></text><text x="705.0" y="825.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="705.0" dy="0">Erradicar H. pylori e IBP; si persiste, tricíclico</tspan><tspan x="705.0" dy="15">o procinético</tspan></text><rect x="40.0" y="865.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="884.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">Dolor epigástrico</tspan></text><text x="175.0" y="884.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="175.0" dy="0">Dolor o ardor epigástrico molesto</tspan></text><text x="440.0" y="884.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="440.0" dy="0">1 día por semana</tspan></text><text x="705.0" y="884.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="705.0" dy="0">Erradicar H. pylori e IBP; si persiste, tricíclico</tspan></text><text x="40.0" y="910.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Se pueden superponer. El tratamiento no se elige por subtipo en la guía ACG-CAG 2017 (resumen). La referencia del examen son los criterios de Roma IV.</tspan></text><text x="40.0" y="957.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="967.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="989.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="989.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">AINES</tspan></text><rect x="363.0" y="970.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="989.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Café</tspan></text><text x="585.0" y="989.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Tabaco</tspan></text><text x="735.0" y="989.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Alcohol</tspan></text><text x="885.0" y="989.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Lácteos</tspan></text><rect x="40.0" y="1004.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="1004.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1025.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué induce más</tspan><tspan x="54.0" dy="16">dispepsia?</tspan></text><text x="285.0" y="1025.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: causa más úlcera</tspan><tspan x="285.0" dy="16">y lesión mucosa</tspan></text><text x="435.0" y="1025.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: desencadenante</tspan><tspan x="435.0" dy="16">funcional frecuente</tspan></text><text x="585.0" y="1025.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: causa más lesión</tspan><tspan x="585.0" dy="16">mucosa</tspan></text><text x="735.0" y="1025.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: causa más lesión</tspan><tspan x="735.0" dy="16">mucosa</tspan></text><text x="885.0" y="1025.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: causa intolerancia</tspan><tspan x="885.0" dy="16">a la lactosa</tspan></text><rect x="40.0" y="967.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1078.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1106.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1128.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Roma IV: síntomas de 3 meses con inicio 6 meses antes y sin lesión en la endoscopía; subtipos distrés posprandial (≥ 3 días por semana) y dolor</tspan><tspan x="58.0" dy="18">   epigástrico (≥ 1 día).</tspan><tspan x="58.0" dy="18">• Banderas rojas que obligan a endoscopía: edad mayor de 60 años, pérdida de peso, disfagia, anemia, sangrado, masa o vómitos persistentes.</tspan><tspan x="58.0" dy="18">• Sin banderas rojas y joven: prueba y tratamiento de H. pylori y, si persiste, IBP; en la refractaria, procinéticos o tricíclicos en dosis bajas.</tspan><tspan x="58.0" dy="18">• AINE, tabaco y alcohol se asocian más a lesión mucosa y úlcera; los lácteos a intolerancia a la lactosa.</tspan></text><text x="58.0" y="1222.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Stanghellini V et al., Roma IV (Gastroenterology 2016;150:1380-1392); Moayyedi P et al., ACG y CAG, dispepsia (Am J Gastroenterol 2017;112:988-1013).</tspan></text></svg>