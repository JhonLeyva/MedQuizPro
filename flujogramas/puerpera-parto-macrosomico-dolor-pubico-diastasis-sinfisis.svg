<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1277" viewBox="0 0 1000 1277" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Dolor púbico intenso tras parto de 4 200 g: diástasis de la sínfisis del pubis"><title>Dolor púbico intenso tras parto de 4 200 g: diástasis de la sínfisis del pubis</title><rect x="0.75" y="0.75" width="998.5" height="1275.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Puerperio · lesiones del parto</tspan></text><rect x="375.0" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="462.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="462.2" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Diástasis de la sínfisis del pubis</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Las hormonas del embarazo relajan los ligamentos de la pelvis.</tspan><tspan x="58.0" dy="17">Un feto grande puede separar la sínfisis más de lo normal (&gt; 10 mm).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Puérpera de 24 h, parto vaginal de 4 200 g</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dolor intenso en el pubis y la región lumbar irradiado a</tspan><tspan x="640.0" dy="16">los muslos.</tspan><tspan x="640.0" dy="16">No puede caminar; dolor muy intenso a la palpación de</tspan><tspan x="640.0" dy="16">la sínfisis.</tspan></text><line x1="640.0" y1="237.0" x2="670.0" y2="237.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LAS CUATRO OPCIONES FRENTE AL CASO</tspan></text><line x1="410.3" y1="435.0" x2="340.0" y2="457.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="457.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="379.0" x2="660.0" y2="357.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="357.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="435.0" x2="660.0" y2="457.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="457.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="410.3" y1="379.0" x2="340.0" y2="357.0" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="357.0" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="407.0" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="407.0" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="393.0" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">Dolor sobre la</tspan><tspan x="500.0" dy="19">sínfisis tras parto</tspan><tspan x="500.0" dy="19">grande</tspan></text><rect x="40.0" y="315.0" width="300.0" height="84.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="348.7" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Diástasis de la sínfisis</tspan></text><text x="190.0" y="372.4" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Dolor localizado en el pubis, no puede caminar</tspan></text><rect x="144.6" y="389.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="404.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="415.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="416.0" width="6.0" height="82.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="448.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Luxación sacrococcígea</tspan></text><text x="190.0" y="472.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Dolor en el cóccix al sentarse</tspan></text><rect x="660.0" y="315.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="316.0" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="810.0" y="348.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Fractura del acetábulo</tspan></text><text x="810.0" y="372.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Rara sin trauma de alta energía</tspan></text><rect x="660.0" y="415.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="416.0" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="448.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Bloqueo motor epidural</tspan></text><text x="810.0" y="472.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Debilidad sin dolor; cede en horas</tspan></text><text x="40.0" y="549.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="561.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="594.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Feto de 4 200 g</tspan></text><line x1="248.5" y1="590.0" x2="267.5" y2="590.0" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,585.0 266.5,595.0 274.5,590.0" fill="#0f766e"/><rect x="278.5" y="561.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="594.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Dolor púbico a las 24 h</tspan></text><line x1="487.0" y1="590.0" x2="506.0" y2="590.0" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,585.0 505.0,595.0 513.0,590.0" fill="#0f766e"/><rect x="517.0" y="561.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="585.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Dolor a la palpación de la</tspan><tspan x="619.2" dy="17">sínfisis</tspan></text><line x1="725.5" y1="590.0" x2="744.5" y2="590.0" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,585.0 743.5,595.0 751.5,590.0" fill="#0f766e"/><rect x="755.5" y="561.0" width="204.5" height="58.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="594.0" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Diástasis</tspan></text><text x="40.0" y="659.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="671.0" width="358.0" height="312.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="681.0" width="130.2" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="695.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="316"><tspan x="61.0" dy="0">LA PELVIS DEL CASO</tspan></text><g data-box="54.0 709.0 330.0 250.0"><g transform="translate(54.0,709.0) scale(1.0)"><path d="M160 60 C120 20 60 20 30 50 C14 80 30 120 60 140 L110 170 C130 150 150 130 158 110 Z" fill="#f5f5f4" stroke="#a8a29e" stroke-width="2.5" stroke-linejoin="round" /><path d="M170 60 C210 20 270 20 300 50 C316 80 300 120 270 140 L220 170 C200 150 180 130 172 110 Z" fill="#f5f5f4" stroke="#a8a29e" stroke-width="2.5" stroke-linejoin="round" /><path d="M140 56 H190 L184 120 C176 140 154 140 146 120 Z" fill="#e7e5e4" stroke="#a8a29e" stroke-width="2" stroke-linejoin="round" /><path d="M84 150 C100 190 130 200 150 196 L150 162 C130 164 110 156 100 146 Z" fill="#f5f5f4" stroke="#a8a29e" stroke-width="2" stroke-linejoin="round" /><path d="M246 150 C230 190 200 200 180 196 L180 162 C200 164 220 156 230 146 Z" fill="#f5f5f4" stroke="#a8a29e" stroke-width="2" stroke-linejoin="round" /><rect x="150" y="160" width="30" height="40" fill="#fee2e2" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/><line x1="160.0" y1="214.0" x2="138.0" y2="214.0" stroke="#dc2626" stroke-width="2"/><polygon points="130.0,214.0 139.0,209.7 139.0,218.3" fill="#dc2626"/><line x1="170.0" y1="214.0" x2="192.0" y2="214.0" stroke="#dc2626" stroke-width="2"/><polygon points="200.0,214.0 191.0,218.3 191.0,209.7" fill="#dc2626"/><text x="165" y="238" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">sínfisis separada: dolor que impide caminar</text><text x="165" y="238" font-size="10.5" font-weight="800" fill="#7f1d1d" text-anchor="middle" data-max="0">sínfisis separada: dolor que impide caminar</text></g></g><rect x="420.0" y="671.0" width="540.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="438.0" cy="686.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="438.0" y="690.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="438.0" dy="0">1</tspan></text><text x="456.0" y="691.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="496"><tspan x="456.0" dy="0">La unión de los dos pubis se separa.</tspan></text><rect x="420.0" y="709.0" width="540.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="438.0" cy="724.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="438.0" y="728.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="438.0" dy="0">2</tspan></text><text x="456.0" y="729.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="496"><tspan x="456.0" dy="0">Duele al caminar, al pararse en un pie y al palpar la sínfisis.</tspan></text><rect x="420.0" y="747.0" width="540.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="438.0" cy="762.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="438.0" y="766.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="438.0" dy="0">3</tspan></text><text x="456.0" y="767.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="496"><tspan x="456.0" dy="0">Se confirma con imagen: &gt; 10 mm.</tspan></text><text x="40.0" y="1023.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1033.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1055.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="1055.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Luxación sacrococcígea</tspan></text><text x="491.2" y="1055.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Fractura de acetábulo</tspan></text><rect x="588.0" y="1036.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="678.8" y="1055.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Diástasis de sínfisis</tspan></text><text x="866.2" y="1055.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Bloqueo epidural</tspan></text><rect x="40.0" y="1070.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="588.0" y="1070.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1091.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Encaja?</tspan></text><text x="303.8" y="1091.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No: el dolor sería en el cóccix</tspan></text><text x="491.2" y="1091.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No</tspan></text><text x="678.8" y="1091.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Sí</tspan></text><text x="866.2" y="1091.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No: no duele</tspan></text><rect x="40.0" y="1033.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1128.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1156.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1178.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Dolor exactamente sobre la sínfisis que impide caminar tras un parto macrosómico = diástasis de la sínfisis.</tspan><tspan x="58.0" dy="18">• Confirmación con Rx o eco (separación &gt; 10 mm).</tspan><tspan x="58.0" dy="18">• Tratamiento: reposo, analgesia, faja pélvica y fisioterapia; cirugía solo en separaciones grandes.</tspan></text><text x="58.0" y="1236.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Williams Obstetricia 26.ª ed. (2022); ACOG.</tspan></text></svg>