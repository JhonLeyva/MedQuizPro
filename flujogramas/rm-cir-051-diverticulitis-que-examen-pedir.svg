<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1012" viewBox="0 0 1000 1012" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La tomografía con contraste es el estudio de elección en la diverticulitis aguda"><title>La tomografía con contraste es el estudio de elección en la diverticulitis aguda</title><rect x="0.75" y="0.75" width="998.5" height="1010.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Diverticulitis · qué examen pedir</tspan></text><rect x="391.4" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="434.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="434.6" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Diverticulitis aguda</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Inflamación de divertículos, casi siempre sigmoideos.</tspan><tspan x="58.0" dy="17">La TC confirma, descarta cáncer y mide la complicación.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es el examen auxiliar más importante para</tspan><tspan x="640.0" dy="16">diagnosticar diverticulitis colónica?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE LLEGA AL EXAMEN CORRECTO</tspan></text><text x="614.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,293.0 580.0,293.0 531.7,401.0 88.3,401.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="309.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="357.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="399"><tspan x="310.0" dy="0">Dolor en fosa ilíaca izquierda, fiebre y leucocitosis</tspan></text><line x1="559.8" y1="347.0" x2="606.0" y2="347.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="302.0" width="84.8" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="656.4" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="656.4" dy="0">Diverticulitis</tspan></text><rect x="704.8" y="302.0" width="107.7" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="758.6" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="758.6" dy="0">Cáncer de colon</tspan></text><rect x="614.0" y="334.0" width="150.2" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="689.1" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="689.1" dy="0">Enfermedad inflamatoria</tspan></text><rect x="770.2" y="334.0" width="69.8" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="805.1" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="805.1" dy="0">Isquemia</tspan></text><rect x="614.0" y="366.0" width="124.7" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="676.4" y="383.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="676.4" dy="0">Causa ginecológica</tspan></text><polygon points="88.3,405.0 531.7,405.0 483.3,461.0 136.7,461.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="162.7" cy="433.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="162.7" y="437.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="162.7" dy="0">1</tspan></text><text x="320.0" y="437.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="283"><tspan x="320.0" dy="0">TC con contraste IV en la fase aguda</tspan></text><line x1="511.5" y1="433.0" x2="606.0" y2="433.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="420.0" width="81.9" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="654.9" y="437.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="654.9" dy="0">✕ Isquemia</tspan></text><line x1="636.0" y1="433.5" x2="685.9" y2="433.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="701.9" y="420.0" width="136.8" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="770.3" y="437.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="770.3" dy="0">✕ Causa ginecológica</tspan></text><line x1="723.9" y1="433.5" x2="828.7" y2="433.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="136.7,465.0 483.3,465.0 435.0,525.0 185.0,525.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="495.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="499.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">2</tspan></text><text x="320.0" y="491.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">Colonoscopía a las 6-8</tspan><tspan x="320.0" dy="17">semanas (no en fase aguda)</tspan></text><line x1="463.2" y1="495.0" x2="606.0" y2="495.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="482.0" width="119.8" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="673.9" y="499.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="673.9" dy="0">✕ Cáncer de colon</tspan></text><line x1="636.0" y1="495.5" x2="723.8" y2="495.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="739.8" y="482.0" width="162.3" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="821.0" y="499.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="821.0" dy="0">✕ Enfermedad inflamatoria</tspan></text><line x1="761.8" y1="495.5" x2="892.1" y2="495.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="529.0" x2="310.0" y2="548.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,547.0 315.0,547.0 310.0,555.0" fill="#0f766e"/><rect x="140.0" y="559.0" width="340.0" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="588.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">TC DE ABDOMEN Y PELVIS</tspan></text><text x="310.0" y="612.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Examen más importante en la fase aguda</tspan><tspan x="310.0" dy="17">Define la Hinchey y guía el drenaje o la cirugía</tspan></text><rect x="370.6" y="548.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="563.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="566.9" width="346.0" height="76.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="586.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="604.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">Colonoscopía y enema con contraste pueden perforar un</tspan><tspan x="628.0" dy="16">colon inflamado: se difieren.</tspan></text><text x="40.0" y="690.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="700.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="731.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="731.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Colonoscopía</tspan></text><rect x="363.0" y="703.9" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="731.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">TAC de abdomen</tspan></text><text x="585.0" y="723.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Rx de colon con</tspan><tspan x="585.0" dy="17">contraste</tspan></text><text x="735.0" y="723.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Rx simple de</tspan><tspan x="735.0" dy="17">abdomen</tspan></text><text x="885.0" y="731.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Sigmoidoscopía</tspan></text><rect x="40.0" y="754.9" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="754.9" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="791.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Más importante?</tspan></text><text x="285.0" y="775.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: riesgo de</tspan><tspan x="285.0" dy="16">perforación en fase</tspan><tspan x="285.0" dy="16">aguda</tspan></text><text x="435.0" y="783.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: confirma, estadifica</tspan><tspan x="435.0" dy="16">y guía el tratamiento</tspan></text><text x="585.0" y="783.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: contraindicado en</tspan><tspan x="585.0" dy="16">fase aguda</tspan></text><text x="735.0" y="783.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: solo detecta aire</tspan><tspan x="735.0" dy="16">libre u obstrucción</tspan></text><text x="885.0" y="775.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: explora solo el</tspan><tspan x="885.0" dy="16">recto y el sigmoides</tspan><tspan x="885.0" dy="16">distal</tspan></text><rect x="40.0" y="700.9" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="844.9" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="872.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="894.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• TC de abdomen y pelvis con contraste IV: pared engrosada, grasa pericólica sucia y divertículos; mide abscesos, detecta aire libre y define la Hinchey.</tspan><tspan x="58.0" dy="18">• Ecografía: alternativa en embarazadas o jóvenes de baja sospecha. Rx simple: solo para neumoperitoneo u obstrucción.</tspan><tspan x="58.0" dy="18">• Hinchey modificada: 0 leve, Ia flemón, Ib absceso pericólico, II absceso a distancia, III peritonitis purulenta, IV fecal.</tspan><tspan x="58.0" dy="18">• Colonoscopía y enema con contraste están contraindicados en la fase aguda (perforación); la colonoscopía va a las 6-8 semanas si hubo complicación.</tspan></text><text x="58.0" y="970.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: WSES, diverticulitis aguda del colon izquierdo (2020); ASCRS, diverticulitis (2020); AGA, diverticulitis (2021).</tspan></text></svg>