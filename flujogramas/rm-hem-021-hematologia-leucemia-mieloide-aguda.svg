<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1323" viewBox="0 0 1000 1323" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Mielodisplasia previa, 50 % de blastos y 200 000 leucocitos: leucemia mieloide aguda secundaria con hiperleucocitosis"><title>Mielodisplasia previa, 50 % de blastos y 200 000 leucocitos: leucemia mieloide aguda secundaria con hiperleucocitosis</title><rect x="0.75" y="0.75" width="998.5" height="1321.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Hematología · leucemia mieloide aguda</tspan></text><rect x="432.4" y="32.0" width="120.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="492.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="104"><tspan x="492.7" dy="0">HEMATOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Leucemia mieloide aguda (LMA)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se diagnostica con 20 % o más de blastos mieloides en sangre o médula (OMS 2022).</tspan><tspan x="58.0" dy="17">Un tercio de los síndromes mielodisplásicos evoluciona a LMA.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 81 años con mielodisplasia</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Fiebre, tumoración submandibular con absceso, Hb 8,9</tspan><tspan x="640.0" dy="16">y plaquetas 26 000.</tspan><tspan x="640.0" dy="16">Leucocitos 200 000 con 50 % de blastos en el frotis y el</tspan><tspan x="640.0" dy="16">inmunofenotipo.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">BANDERAS ROJAS DEL PACIENTE</tspan></text><rect x="40.0" y="301.0" width="602.0" height="34.0" rx="10" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.2"/><text x="56.0" y="323.0" font-size="11.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="452"><tspan x="56.0" dy="0">QUÉ HACER CON HIPERLEUCOCITOSIS</tspan></text><text x="626.0" y="323.0" font-size="10.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="end" data-max="100"><tspan x="626.0" dy="0">EN EL CASO</tspan></text><rect x="40.0" y="341.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,356.5 74.0,376.5 50.0,376.5" fill="#dc2626"/><text x="62.0" y="373.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="364.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">50 % de blastos en el frotis y en el inmunofenotipo</tspan></text><text x="84.0" y="381.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Supera el umbral de 20 %: LMA</tspan></text><text x="626.0" y="371.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="400.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,415.5 74.0,435.5 50.0,435.5" fill="#dc2626"/><text x="62.0" y="432.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="423.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Leucocitos 200 000/µL</tspan></text><text x="84.0" y="440.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Hiperleucocitosis: riesgo de leucostasis</tspan></text><text x="626.0" y="430.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="459.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,474.5 74.0,494.5 50.0,494.5" fill="#dc2626"/><text x="62.0" y="491.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="482.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Hb 8,9 g/dL y plaquetas 26 000/µL</tspan></text><text x="84.0" y="499.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Falla medular: riesgo de hemorragia</tspan></text><text x="626.0" y="489.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="518.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,533.5 74.0,553.5 50.0,553.5" fill="#dc2626"/><text x="62.0" y="550.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="541.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Fiebre con absceso submandibular</tspan></text><text x="84.0" y="558.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Infección en paciente neutropénico funcional</tspan></text><text x="626.0" y="548.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="577.0" width="602.0" height="53.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><polygon points="62.0,592.5 74.0,612.5 50.0,612.5" fill="#cbd5e1"/><text x="62.0" y="609.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="600.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Antecedente de mielodisplasia</tspan></text><text x="84.0" y="617.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">LMA secundaria: peor pronóstico</tspan></text><text x="626.0" y="607.5" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">No</tspan></text><rect x="660.0" y="301.0" width="300.0" height="329.0" rx="12" fill="#dc2626" stroke="none" stroke-width="1.5"/><text x="676.0" y="325.0" font-size="10.5" font-weight="800" font-style="normal" fill="#fecaca" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">URGENCIA HEMATOLÓGICA</tspan></text><text x="676.0" y="457.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">Hidratar, citorreducir y tratar la LMA</tspan></text><text x="676.0" y="474.0" font-size="12" font-weight="500" font-style="normal" fill="#fee2e2" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">Hidratación, hidroxiurea o leucoféresis,</tspan><tspan x="676.0" dy="16">prevención del síndrome de lisis tumoral,</tspan><tspan x="676.0" dy="16">antibióticos y quimioterapia de la LMA.</tspan></text><rect x="40.0" y="648.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="674.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Mielodisplasia + 50 % de blastos mieloides = LMA secundaria</tspan></text><text x="60.0" y="693.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Sin blastos es reacción leucemoide o neutrofílica crónica; la LMC tiene Filadelfia.</tspan></text><text x="40.0" y="754.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DIAGNÓSTICO DIFERENCIAL DE LA LEUCOCITOSIS CON BLASTOS</tspan></text><rect x="40.0" y="766.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="785.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Entidad</tspan></text><text x="320.0" y="785.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Dato clave</tspan></text><text x="645.0" y="785.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">En el caso</tspan></text><rect x="40.0" y="795.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="814.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Leucemia mieloide aguda</tspan></text><text x="320.0" y="814.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">20 % o más de blastos mieloides</tspan></text><text x="645.0" y="814.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">50 % de blastos</tspan></text><rect x="210.6" y="798.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="256.0" y="813.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="256.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="824.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="843.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Reacción leucemoide</tspan></text><text x="320.0" y="843.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Infección con granulocitos maduros, sin blastos</tspan></text><text x="645.0" y="843.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">Hay blastos</tspan></text><rect x="40.0" y="853.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="872.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Leucemia mieloide crónica</tspan></text><text x="320.0" y="872.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Todas las etapas de maduración, basofilia y Filadelfia</tspan></text><text x="645.0" y="872.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">No hay blastos al 50 %</tspan></text><rect x="40.0" y="882.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="901.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Leucemia neutrofílica crónica</tspan></text><text x="320.0" y="901.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Mutación CSF3R, sin blastos</tspan></text><text x="645.0" y="901.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">Hay blastos</tspan></text><text x="40.0" y="951.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="961.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="992.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="964.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="983.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Leucemia</tspan><tspan x="285.0" dy="17">mieloblástica aguda</tspan></text><text x="435.0" y="983.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Reacción</tspan><tspan x="435.0" dy="17">leucemoide</tspan></text><text x="585.0" y="983.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Leucemia</tspan><tspan x="585.0" dy="17">linfoblástica aguda</tspan></text><text x="735.0" y="983.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Leucemia mieloide</tspan><tspan x="735.0" dy="17">crónica</tspan></text><text x="885.0" y="983.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Leucemia</tspan><tspan x="885.0" dy="17">neutrofílica crónica</tspan></text><rect x="40.0" y="1015.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1015.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1052.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="1036.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: 50 % de blastos</tspan><tspan x="285.0" dy="16">mieloides con</tspan><tspan x="285.0" dy="16">citopenias</tspan></text><text x="435.0" y="1036.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no hay blastos en</tspan><tspan x="435.0" dy="16">la reacción a una</tspan><tspan x="435.0" dy="16">infección</tspan></text><text x="585.0" y="1044.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sería linfoide y</tspan><tspan x="585.0" dy="16">sobre todo infantil</tspan></text><text x="735.0" y="1044.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no tiene 50 % de</tspan><tspan x="735.0" dy="16">blastos</tspan></text><text x="885.0" y="1052.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no tiene blastos</tspan></text><rect x="40.0" y="961.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1105.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1133.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1155.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Mielodisplasia: citopenias por hematopoyesis ineficaz y displasia, en ancianos. La LMA secundaria tiene peor pronóstico.</tspan><tspan x="58.0" dy="18">• Reacción leucemoide: infección, granulocitos maduros y sin blastos. LMC: todas las etapas de maduración, basofilia y cromosoma Filadelfia. Neutrofílica</tspan><tspan x="58.0" dy="18">   crónica: mutación CSF3R, sin blastos.</tspan><tspan x="58.0" dy="18">• La hiperleucocitosis es una urgencia por leucostasis (disnea, alteración del sensorio) y lisis tumoral: hidratación, hidroxiurea o leucoféresis y</tspan><tspan x="58.0" dy="18">   quimioterapia (ELN 2022).</tspan><tspan x="58.0" dy="18">• Alerta: el tumor submandibular puede ser un sarcoma mieloide; se confirma con inmunohistoquímica para mieloperoxidasa.</tspan></text><text x="58.0" y="1267.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Döhner H. y cols., Diagnosis and management of AML in adults: 2022 ELN recommendations (Blood 2022); Khoury JD y cols., WHO classification of haematolymphoid</tspan><tspan x="58.0" dy="15">tumours, 5.ª ed. (Leukemia 2022); Harrison Principios de Medicina Interna, 21.ª ed. (2022).</tspan></text></svg>