<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="951" viewBox="0 0 1000 951" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la queratoconjuntivitis flictenular el banco marca el prurito ocular; la fotofobia y el lagrimeo son los más prominentes"><title>En la queratoconjuntivitis flictenular el banco marca el prurito ocular; la fotofobia y el lagrimeo son los más prominentes</title><rect x="0.75" y="0.75" width="998.5" height="949.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Oftalmología · queratoconjuntivitis flictenular</tspan></text><rect x="467.9" y="32.0" width="162.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="549.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="146"><tspan x="549.1" dy="0">OFTALMOLOGÍA Y ORL RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Queratoconjuntivitis flictenular</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hipersensibilidad retardada (tipo IV) a antígenos de Staphylococcus aureus o, antes, del</tspan><tspan x="58.0" dy="17">bacilo de la tuberculosis.</tspan><tspan x="58.0" dy="17">Frecuente en niños y adultos jóvenes con blefaritis.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es el síntoma más característico de la</tspan><tspan x="640.0" dy="16">queratoconjuntivitis flictenular?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SÍNTOMAS ORIENTAN A CADA CONJUNTIVITIS</tspan></text><rect x="40.0" y="269.0" width="920.0" height="70.0" rx="12" fill="#ea580c" stroke="none" stroke-width="1.5"/><rect x="54.0" y="288.0" width="74.0" height="32.0" rx="16" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="91.0" y="309.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ea580c" text-anchor="middle" data-max="64"><tspan x="91.0" dy="0">PASO 1</tspan></text><text x="144.0" y="294.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="800"><tspan x="144.0" dy="0">Ojo rojo con molestias: ¿hay flictenas en limbo o córnea?</tspan></text><text x="144.0" y="313.0" font-size="12" font-weight="600" font-style="normal" fill="#fff7ed" text-anchor="start" data-max="800"><tspan x="144.0" dy="0">Nódulo blanquecino rodeado de hiperemia = flictenulosis.</tspan></text><line x1="500.0" y1="341.0" x2="500.0" y2="356.0" stroke="#ea580c" stroke-width="2"/><polygon points="495.0,355.0 505.0,355.0 500.0,363.0" fill="#ea580c"/><rect x="40.0" y="369.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="391.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="170"><tspan x="54.0" dy="0">CUADRO</tspan></text><text x="412.5" y="391.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="345"><tspan x="412.5" dy="0">Flictenular</tspan></text><text x="777.5" y="391.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="345"><tspan x="777.5" dy="0">Viral o alérgica</tspan></text><rect x="40.0" y="409.0" width="184.0" height="72.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="442.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Síntomas centrales</tspan></text><text x="54.0" y="459.5" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Lo que refiere</tspan></text><rect x="233.0" y="409.0" width="359.0" height="72.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="245.0" y="434.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Prurito ocular</tspan></text><text x="245.0" y="450.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Clave del banco</tspan><tspan x="245.0" dy="15">Con lagrimeo, fotofobia y ardor</tspan></text><rect x="491.2" y="398.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="536.6" y="413.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="536.6" dy="0">◆ ESTE CASO</tspan></text><rect x="598.0" y="409.0" width="359.0" height="72.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="610.0" y="434.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Prurito y secreción</tspan></text><text x="610.0" y="450.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Acuosa o mucosa</tspan><tspan x="610.0" dy="15">Edema conjuntival</tspan></text><rect x="40.0" y="487.0" width="184.0" height="72.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="520.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Hallazgo</tspan></text><text x="54.0" y="537.5" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Lo que se ve</tspan></text><rect x="233.0" y="487.0" width="359.0" height="72.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="245.0" y="512.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Flictena</tspan></text><text x="245.0" y="528.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Nódulo blanquecino con hiperemia</tspan><tspan x="245.0" dy="15">Limbo, conjuntiva o córnea</tspan></text><rect x="598.0" y="487.0" width="359.0" height="72.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="610.0" y="519.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Folículos o papilas</tspan></text><text x="610.0" y="535.5" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Sin flictenas</tspan></text><text x="44.0" y="581.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Ante flictenulosis en un niño, descartar tuberculosis latente con PPD o ensayo de liberación de interferón gamma.</tspan></text><text x="40.0" y="629.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="639.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="661.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="642.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="661.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Prurito ocular</tspan></text><text x="435.0" y="661.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Secreción acuosa</tspan></text><text x="585.0" y="661.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Edema</tspan></text><text x="735.0" y="661.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Secreción mucosa</tspan></text><text x="885.0" y="661.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hiperemia</tspan></text><rect x="40.0" y="676.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="676.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="705.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Síntoma</tspan><tspan x="54.0" dy="16">característico?</tspan></text><text x="285.0" y="697.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: clave del banco</tspan><tspan x="285.0" dy="16">(lagrimeo y fotofobia</tspan><tspan x="285.0" dy="16">son más prominentes)</tspan></text><text x="435.0" y="705.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es de conjuntivitis</tspan><tspan x="435.0" dy="16">viral o alérgica</tspan></text><text x="585.0" y="705.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es de conjuntivitis</tspan><tspan x="585.0" dy="16">viral o alérgica</tspan></text><text x="735.0" y="705.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es de conjuntivitis</tspan><tspan x="735.0" dy="16">viral o alérgica</tspan></text><text x="885.0" y="705.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: signo inespecífico</tspan><tspan x="885.0" dy="16">de superficie ocular</tspan></text><rect x="40.0" y="639.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="766.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="794.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="816.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Las flictenas son nódulos blanquecinos o amarillentos con hiperemia en el limbo, la conjuntiva bulbar o la córnea; pueden ulcerarse y dejar cicatriz</tspan><tspan x="58.0" dy="18">   vascularizada.</tspan><tspan x="58.0" dy="18">• Síntomas: lagrimeo, fotofobia, cuerpo extraño, ardor y prurito; el libro del banco da el prurito como el más característico.</tspan><tspan x="58.0" dy="18">• Tratamiento: corticoide tópico de baja potencia por poco tiempo, higiene palpebral, tratar la blefaritis y buscar tuberculosis latente con PPD o IGRA.</tspan><tspan x="58.0" dy="18">• Secreción acuosa o mucosa y edema son de conjuntivitis viral o alérgica; la hiperemia es inespecífica.</tspan></text><text x="58.0" y="910.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Kanski, Oftalmología clínica 9.ª ed. (2020); American Academy of Ophthalmology, Basic and Clinical Science Course (2023-2024).</tspan></text></svg>