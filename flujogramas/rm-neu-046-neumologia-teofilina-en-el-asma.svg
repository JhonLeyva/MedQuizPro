<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1172" viewBox="0 0 1000 1172" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La teofilina es una metilxantina que inhibe la fosfodiesterasa, eleva el AMPc y relaja el músculo liso bronquial"><title>La teofilina es una metilxantina que inhibe la fosfodiesterasa, eleva el AMPc y relaja el músculo liso bronquial</title><rect x="0.75" y="0.75" width="998.5" height="1170.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neumología · teofilina en el asma</tspan></text><rect x="396.9" y="32.0" width="114.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="454.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="99"><tspan x="454.3" dy="0">NEUMOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Broncodilatadores en el asma</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cada grupo actúa en un punto distinto de la señal que contrae o relaja el bronquio.</tspan><tspan x="58.0" dy="17">Solo la teofilina inhibe la fosfodiesterasa.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué fármaco inhibidor de la fosfodiesterasa se usa en</tspan><tspan x="640.0" dy="16">el asma?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DE LA TEOFILINA A LA BRONCODILATACIÓN</tspan></text><rect x="40.0" y="269.0" width="920.0" height="83.0" rx="0" fill="#e0f2fe" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="269.0" width="112.0" height="83.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="314.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Fármaco</tspan></text><rect x="40.0" y="352.0" width="920.0" height="83.0" rx="0" fill="#fef3c7" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="352.0" width="112.0" height="83.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="393.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Célula muscular</tspan><tspan x="96.0" dy="14">lisa</tspan></text><rect x="40.0" y="435.0" width="920.0" height="83.0" rx="0" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="435.0" width="112.0" height="83.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="480.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Vía aérea</tspan></text><line x1="322.0" y1="337.0" x2="322.0" y2="356.0" stroke="#ea580c" stroke-width="2.2"/><polygon points="317.0,356.0 327.0,356.0 322.0,365.0" fill="#ea580c"/><line x1="472.0" y1="393.5" x2="479.0" y2="393.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="479.0,398.5 479.0,388.5 488.0,393.5" fill="#0f766e"/><line x1="638.0" y1="420.0" x2="331.0" y2="447.2" stroke="#0f766e" stroke-width="2.2"/><polygon points="330.5,442.2 331.4,452.2 322.0,448.0" fill="#0f766e"/><rect x="172.0" y="284.0" width="300.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="300.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Teofilina oral o intravenosa</tspan></text><text x="182.0" y="317.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Metilxantina de margen estrecho</tspan></text><circle cx="172.0" cy="284.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="288.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">1</tspan></text><rect x="172.0" y="367.0" width="300.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="182.0" y="383.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Inhibe la fosfodiesterasa</tspan></text><text x="182.0" y="400.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Se degrada menos AMPc y GMPc</tspan></text><circle cx="172.0" cy="367.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="371.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">2</tspan></text><rect x="488.0" y="367.0" width="300.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="498.0" y="383.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="498.0" dy="0">Sube el AMPc intracelular</tspan></text><text x="498.0" y="400.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="498.0" dy="0">Relaja el músculo liso</tspan></text><circle cx="488.0" cy="367.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="488.0" y="371.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="488.0" dy="0">3</tspan></text><rect x="172.0" y="450.0" width="300.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="466.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Broncodilatación</tspan></text><text x="182.0" y="483.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Efecto modesto; tercera línea</tspan></text><circle cx="172.0" cy="450.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="454.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">4</tspan></text><rect x="40.0" y="536.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="562.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Inhibidor de fosfodiesterasa = teofilina</tspan></text><text x="60.0" y="581.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Budesonida, montelukast, tiotropio y salmeterol actúan por otros mecanismos.</tspan></text><text x="40.0" y="642.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">MECANISMO DE LOS FÁRMACOS DE LAS OPCIONES</tspan></text><rect x="40.0" y="654.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="673.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Fármaco</tspan></text><text x="260.0" y="673.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Grupo</tspan></text><text x="615.0" y="673.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Mecanismo</tspan></text><rect x="40.0" y="683.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="702.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Budesonida</tspan></text><text x="260.0" y="702.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Corticoide inhalado</tspan></text><text x="615.0" y="702.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Reprime la transcripción de genes inflamatorios</tspan></text><rect x="40.0" y="712.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="731.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Montelukast</tspan></text><text x="260.0" y="731.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Antileucotrieno</tspan></text><text x="615.0" y="731.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Antagoniza el receptor CysLT1</tspan></text><rect x="40.0" y="741.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="760.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Teofilina</tspan></text><text x="260.0" y="760.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Metilxantina</tspan></text><text x="615.0" y="760.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Inhibe la fosfodiesterasa y antagoniza la adenosina</tspan></text><rect x="150.6" y="744.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="196.0" y="759.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="196.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="770.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="789.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Tiotropio</tspan></text><text x="260.0" y="789.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Antimuscarínico de acción prolongada</tspan></text><text x="615.0" y="789.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Bloquea el receptor muscarínico</tspan></text><rect x="40.0" y="799.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="818.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Salmeterol</tspan></text><text x="260.0" y="818.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Beta-2 agonista de acción prolongada</tspan></text><text x="615.0" y="818.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Activa la adenilil ciclasa y eleva el AMPc</tspan></text><text x="40.0" y="868.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="878.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="900.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="900.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Budesonida</tspan></text><text x="435.0" y="900.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Montelukast</tspan></text><rect x="513.0" y="881.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="900.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Teofilina</tspan></text><text x="735.0" y="900.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Tiotropio</tspan></text><text x="885.0" y="900.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Salmeterol</tspan></text><rect x="40.0" y="915.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="915.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="944.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Inhibe la</tspan><tspan x="54.0" dy="16">fosfodiesterasa?</tspan></text><text x="285.0" y="936.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es un corticoide</tspan><tspan x="285.0" dy="16">inhalado que frena</tspan><tspan x="285.0" dy="16">genes inflamatorios</tspan></text><text x="435.0" y="936.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: antagonista del</tspan><tspan x="435.0" dy="16">receptor CysLT1 de</tspan><tspan x="435.0" dy="16">leucotrienos</tspan></text><text x="585.0" y="936.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: metilxantina que</tspan><tspan x="585.0" dy="16">inhibe la</tspan><tspan x="585.0" dy="16">fosfodiesterasa</tspan></text><text x="735.0" y="936.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: antagonista</tspan><tspan x="735.0" dy="16">muscarínico de acción</tspan><tspan x="735.0" dy="16">prolongada</tspan></text><text x="885.0" y="936.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: agonista beta-2</tspan><tspan x="885.0" dy="16">que activa la adenilil</tspan><tspan x="885.0" dy="16">ciclasa</tspan></text><rect x="40.0" y="878.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1005.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1033.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1055.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Mecanismo: la teofilina inhibe de forma no selectiva las fosfodiesterasas, sube el AMPc y relaja el músculo liso; además antagoniza la adenosina.</tspan><tspan x="58.0" dy="18">• Margen terapéutico estrecho (nivel útil de 5 a 15 µg/mL): la toxicidad produce náuseas, taquiarritmias y convulsiones.</tspan><tspan x="58.0" dy="18">• Ciprofloxacino, macrólidos y cimetidina elevan sus niveles. Hoy es de tercera línea en asma y EPOC.</tspan><tspan x="58.0" dy="18">• Alerta: asmático con vómitos y arritmia que toma teofilina, pedir primero el nivel sérico.</tspan></text><text x="58.0" y="1131.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Goodman y Gilman, Bases farmacológicas de la terapéutica, 14.ª ed. (2023); Katzung, Farmacología básica y clínica, 16.ª ed. (2024); Harrison, 21.ª ed. (2022).</tspan></text></svg>