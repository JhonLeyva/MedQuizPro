<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="843" viewBox="0 0 1000 843" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Niña de 4 años hospitalizada con fiebre, tos, crepitantes bilaterales y leucocitosis con desviación: ceftriaxona"><title>Niña de 4 años hospitalizada con fiebre, tos, crepitantes bilaterales y leucocitosis con desviación: ceftriaxona</title><rect x="0.75" y="0.75" width="998.5" height="842.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Infecciones respiratorias agudas · neumonía en el niño</tspan></text><rect x="524.0" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="580.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="580.5" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Neumonía bacteriana en el niño</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Neumococo es el germen más común entre los 3 meses y los 5 años.</tspan><tspan x="58.0" dy="17">Fiebre, tos, dificultad respiratoria, crepitantes; leucocitosis con desviación izquierda.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niña de 4 años, hospitalizada</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">24 horas de fiebre, tos y dificultad respiratoria.</tspan><tspan x="640.0" dy="16">38 °C, FR 35, crepitantes bilaterales; leucocitosis con</tspan><tspan x="640.0" dy="16">desviación.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="377.0" x2="500.0" y2="407.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="407.0" x2="733.5" y2="407.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="407.0" x2="266.5" y2="436.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,435.0 271.5,435.0 266.5,443.0" fill="#94a3b8"/><line x1="733.5" y1="407.0" x2="733.5" y2="436.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,435.0 738.5,435.0 733.5,443.0" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#0f766e"/><line x1="500.0" y1="377.0" x2="500.0" y2="407.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="407.0" x2="500.0" y2="407.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="407.0" x2="266.5" y2="436.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,435.0 271.5,435.0 266.5,443.0" fill="#0f766e"/><rect x="225.0" y="416.0" width="83.0" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="428.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Sí (este caso)</tspan></text><rect x="719.4" y="416.0" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="428.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">No</tspan></text><polygon points="240.0,342.0 266.0,307.0 734.0,307.0 760.0,342.0 734.0,377.0 266.0,377.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="342.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="347.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="338.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Neumonía bacteriana: ¿hospitalizada por gravedad o sin vía</tspan><tspan x="519.0" dy="17">oral?</tspan></text><rect x="40.0" y="443.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="471.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">CEFTRIAXONA EV</tspan></text><text x="266.5" y="494.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">O ampicilina EV</tspan><tspan x="266.5" dy="17">Pasar a oral al mejorar</tspan></text><rect x="507.0" y="443.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="479.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Amoxicilina oral</tspan></text><text x="733.5" y="502.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Dosis altas, en casa</tspan></text><text x="40.0" y="573.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="583.5" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="606.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="606.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Claritromicina</tspan></text><rect x="363.0" y="586.5" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="606.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Ceftriaxona</tspan></text><text x="585.0" y="606.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Doxiciclina</tspan></text><text x="735.0" y="606.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ciprofloxacina</tspan></text><text x="885.0" y="606.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Amoxicilina oral</tspan></text><rect x="40.0" y="620.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="620.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="649.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Antibiótico?</tspan></text><text x="285.0" y="649.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: para atípicas</tspan></text><text x="435.0" y="641.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: EV en la niña</tspan><tspan x="435.0" dy="16">hospitalizada</tspan></text><text x="585.0" y="641.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: contraindicada &lt; 8</tspan><tspan x="585.0" dy="16">años</tspan></text><text x="735.0" y="641.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no es de elección</tspan><tspan x="735.0" dy="16">en niños</tspan></text><text x="885.0" y="641.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Bastaría sin gravedad;</tspan><tspan x="885.0" dy="16">hospitalizada va EV</tspan></text><rect x="40.0" y="583.5" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="694.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="722.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="744.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Si está hospitalizada por gravedad o no tolera la vía oral: antibiótico EV (ceftriaxona o ampicilina).</tspan><tspan x="58.0" dy="18">• Sin gravedad, en casa: amoxicilina oral en dosis altas (de primera elección).</tspan><tspan x="58.0" dy="18">• Macrólido (claritromicina) solo si se sospecha neumonía atípica (mayores de 5 años).</tspan></text><text x="58.0" y="802.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, manejo de la neumonía infantil (2024); BTS, neumonía en niños (2011); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>