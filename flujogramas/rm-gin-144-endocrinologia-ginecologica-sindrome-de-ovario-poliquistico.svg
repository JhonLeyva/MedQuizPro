<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1232" viewBox="0 0 1000 1232" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En el SOP anovulatorio la resistencia a la insulina es el trastorno metabólico central"><title>En el SOP anovulatorio la resistencia a la insulina es el trastorno metabólico central</title><rect x="0.75" y="0.75" width="998.5" height="1230.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Endocrinología ginecológica · síndrome de ovario poliquístico</tspan></text><rect x="567.1" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="646.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="646.8" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Síndrome de ovario poliquístico (SOP)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Endocrinopatía más frecuente de la mujer en edad reproductiva.</tspan><tspan x="58.0" dy="17">Dos de tres criterios de Rotterdam: hiperandrogenismo, oligoanovulación y morfología</tspan><tspan x="58.0" dy="17">ovárica poliquística.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Paciente con SOP anovulatoria</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">No ovula.</tspan><tspan x="640.0" dy="16">¿Cuál es el riesgo más importante asociado?</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">RIESGOS DEL SOP: CUÁL ES EL CENTRAL</tspan></text><line x1="406.0" y1="416.7" x2="340.0" y2="418.2" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="418.2" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="421.1" y1="465.7" x2="340.0" y2="518.2" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="518.2" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="579.7" y1="364.8" x2="660.0" y2="314.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="314.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="594.0" y1="414.6" x2="660.0" y2="414.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="414.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="579.7" y1="464.4" x2="660.0" y2="514.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="514.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="420.3" y1="364.8" x2="340.0" y2="314.6" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="314.6" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="414.6" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="414.6" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="410.1" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">SOP</tspan><tspan x="500.0" dy="19">ANOVULATORIO</tspan></text><text x="500.0" y="448.1" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">comparar con cada opción</tspan></text><rect x="40.0" y="269.0" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="297.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">RESISTENCIA A LA INSULINA</tspan></text><text x="190.0" y="321.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">50 a 70 %, incluso en delgadas: mecanismo</tspan><tspan x="190.0" dy="17">central</tspan></text><rect x="144.6" y="350.2" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="365.2" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="376.2" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="377.2" width="6.0" height="82.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="409.9" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">DIABETES</tspan></text><text x="190.0" y="433.6" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Es de tipo 2, no de tipo 1</tspan></text><rect x="40.0" y="476.2" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="477.2" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="190.0" y="509.9" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">OBESIDAD</tspan></text><text x="190.0" y="533.6" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Comorbilidad frecuente, no es el mecanismo</tspan></text><rect x="660.0" y="272.6" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="273.6" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="306.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">DISLIPIDEMIA</tspan></text><text x="810.0" y="330.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Comorbilidad metabólica</tspan></text><rect x="660.0" y="372.6" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="373.6" width="6.0" height="82.0" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="406.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">HIPERTRIGLICERIDEMIA</tspan></text><text x="810.0" y="430.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Comorbilidad metabólica</tspan></text><rect x="660.0" y="472.6" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="473.6" width="6.0" height="82.0" rx="3" fill="#6366f1" stroke="none" stroke-width="1.5"/><text x="810.0" y="506.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">HIPERPLASIA ENDOMETRIAL</tspan></text><text x="810.0" y="530.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Estrógenos sin oposición de progesterona</tspan></text><text x="40.0" y="596.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="608.2" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="641.2" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Resistencia a la insulina</tspan></text><line x1="248.5" y1="637.2" x2="267.5" y2="637.2" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,632.2 266.5,642.2 274.5,637.2" fill="#0f766e"/><rect x="278.5" y="608.2" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="641.2" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Más andrógenos ováricos</tspan></text><line x1="487.0" y1="637.2" x2="506.0" y2="637.2" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,632.2 505.0,642.2 513.0,637.2" fill="#0f766e"/><rect x="517.0" y="608.2" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="641.2" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Menos globulina fijadora</tspan></text><line x1="725.5" y1="637.2" x2="744.5" y2="637.2" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,632.2 743.5,642.2 751.5,637.2" fill="#0f766e"/><rect x="755.5" y="608.2" width="204.5" height="58.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="632.7" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Anovulación e</tspan><tspan x="857.8" dy="17">hiperandrogenismo</tspan></text><text x="40.0" y="700.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CRITERIOS DE ROTTERDAM PARA EL SOP (2 DE 3)</tspan></text><rect x="40.0" y="712.2" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="731.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Criterio</tspan></text><text x="260.0" y="731.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="694"><tspan x="260.0" dy="0">Cómo se documenta</tspan></text><rect x="40.0" y="741.2" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="760.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Hiperandrogenismo</tspan></text><text x="260.0" y="760.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="694"><tspan x="260.0" dy="0">Clínico (hirsutismo) o bioquímico</tspan></text><rect x="40.0" y="770.2" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="789.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Oligoanovulación</tspan></text><text x="260.0" y="789.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="694"><tspan x="260.0" dy="0">Ciclos irregulares o ausencia de ovulación</tspan></text><rect x="40.0" y="799.2" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="818.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Morfología ovárica poliquística</tspan></text><text x="260.0" y="818.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="694"><tspan x="260.0" dy="0">Ecografía; en adultas la AMH puede sustituirla (guía 2023)</tspan></text><text x="40.0" y="844.2" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Se excluyen otras causas; tamizaje de diabetes con prueba de tolerancia oral a la glucosa.</tspan></text><text x="40.0" y="891.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="901.2" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="932.2" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="904.2" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="923.7" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Resistencia a la</tspan><tspan x="285.0" dy="17">insulina</tspan></text><text x="435.0" y="932.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Diabetes tipo 1</tspan></text><text x="585.0" y="932.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Obesidad</tspan></text><text x="735.0" y="932.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Dislipidemia</tspan></text><text x="885.0" y="932.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hipertrigliceridemia</tspan></text><rect x="40.0" y="955.2" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="955.2" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="976.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Riesgo del SOP</tspan><tspan x="54.0" dy="16">anovulatorio?</tspan></text><text x="285.0" y="976.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: trastorno central</tspan><tspan x="285.0" dy="16">que explica las demás</tspan></text><text x="435.0" y="976.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: la diabetes</tspan><tspan x="435.0" dy="16">asociada es de tipo 2</tspan></text><text x="585.0" y="976.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es comorbilidad,</tspan><tspan x="585.0" dy="16">no el mecanismo</tspan></text><text x="735.0" y="976.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es comorbilidad,</tspan><tspan x="735.0" dy="16">no el mecanismo</tspan></text><text x="885.0" y="976.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es comorbilidad,</tspan><tspan x="885.0" dy="16">no el mecanismo</tspan></text><rect x="40.0" y="901.2" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1029.2" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1057.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1079.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Criterios de Rotterdam (2 de 3): hiperandrogenismo clínico o bioquímico, oligoanovulación y morfología ovárica poliquística; la guía de 2023 acepta la</tspan><tspan x="58.0" dy="18">   AMH en adultas en lugar de la ecografía.</tspan><tspan x="58.0" dy="18">• Resistencia a la insulina en 50 a 70 %, incluso en delgadas; eleva los andrógenos y baja la globulina fijadora de hormonas sexuales.</tspan><tspan x="58.0" dy="18">• La diabetes asociada es de tipo 2; obesidad, dislipidemia e hipertrigliceridemia son comorbilidades. La anovulación expone el endometrio a estrógenos:</tspan><tspan x="58.0" dy="18">   riesgo de hiperplasia y cáncer.</tspan><tspan x="58.0" dy="18">• Tamizaje de diabetes con prueba de tolerancia oral a la glucosa; base: cambio de estilo de vida, con metformina e inositol como adyuvantes.</tspan></text><text x="58.0" y="1191.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Teede et al., guía internacional basada en evidencia del SOP (Fertil Steril 2023); Williams Obstetricia, 26.ª ed. (2022).</tspan></text></svg>