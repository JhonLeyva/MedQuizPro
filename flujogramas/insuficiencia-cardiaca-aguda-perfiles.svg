<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1215" viewBox="0 0 1000 1215" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Coronario con disnea, ortopnea, crepitantes bilaterales y galope: insuficiencia cardiaca aguda, furosemida"><title>Coronario con disnea, ortopnea, crepitantes bilaterales y galope: insuficiencia cardiaca aguda, furosemida</title><rect x="0.75" y="0.75" width="998.5" height="1214.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Insuficiencia cardiaca · descompensación aguda</tspan></text><rect x="487.8" y="32.0" width="132.2" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="553.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="116"><tspan x="553.9" dy="0">CARDIOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Insuficiencia cardiaca aguda congestiva</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El ventrículo no expulsa bien y el líquido se acumula en los pulmones.</tspan><tspan x="58.0" dy="17">Disnea, ortopnea, crepitantes, galope (S3).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 65 años con coronariopatía</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Disnea, taquipnea, ortopnea.</tspan><tspan x="640.0" dy="16">Crepitantes bilaterales; ritmo de galope.</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#94a3b8"/><line x1="500.0" y1="349.0" x2="500.0" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="379.0" x2="733.5" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="379.0" x2="266.5" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,407.0 271.5,407.0 266.5,415.0" fill="#94a3b8"/><line x1="733.5" y1="379.0" x2="733.5" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,407.0 738.5,407.0 733.5,415.0" fill="#94a3b8"/><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#0f766e"/><line x1="500.0" y1="349.0" x2="500.0" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="379.0" x2="500.0" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="379.0" x2="266.5" y2="408.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,407.0 271.5,407.0 266.5,415.0" fill="#0f766e"/><rect x="182.5" y="388.0" width="168.0" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Caliente y húmedo (este caso)</tspan></text><rect x="689.6" y="388.0" width="87.7" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Frío y húmedo</tspan></text><polygon points="240.0,320.0 266.0,291.0 734.0,291.0 760.0,320.0 734.0,349.0 266.0,349.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="320.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="325.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="324.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Insuficiencia cardiaca aguda: ¿perfusión y congestión?</tspan></text><rect x="40.0" y="415.0" width="453.0" height="73.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">FUROSEMIDA EV</tspan></text><text x="266.5" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Vasodilatador si PA alta</tspan></text><rect x="507.0" y="415.0" width="453.0" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Inotrópico + diurético</tspan></text><text x="733.5" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Dobutamina</tspan></text><text x="40.0" y="528.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="540.5" width="920.0" height="365.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="554.5" width="370.8" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="241.4" y="574.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="241.4" dy="0">PERFILES DE STEVENSON (FORRESTER CLÍNICO)</tspan></text><text x="442.8" y="574.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="499"><tspan x="442.8" dy="0">Cruza perfusión (caliente o frío) y congestión (seco o húmedo).</tspan></text><rect x="56.0" y="614.5" width="213.0" height="140.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="615.1" width="211.8" height="82.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="162.5" y="642.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="197"><tspan x="162.5" dy="0">CALIENTE Y SECO</tspan></text><text x="162.5" y="662.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="189"><tspan x="162.5" dy="0">Compensado</tspan></text><circle cx="72.0" cy="706.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="710.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="82.0" dy="0">Ajustar tratamiento oral</tspan></text><rect x="281.0" y="614.5" width="213.0" height="140.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="282.2" y="615.7" width="210.6" height="82.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="387.5" y="642.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="197"><tspan x="387.5" dy="0">CALIENTE Y HÚMEDO</tspan></text><text x="387.5" y="662.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="189"><tspan x="387.5" dy="0">Congestión</tspan></text><circle cx="297.0" cy="706.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="307.0" y="710.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="175"><tspan x="307.0" dy="0">Crepitantes, ortopnea</tspan></text><circle cx="297.0" cy="729.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="307.0" y="733.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="175"><tspan x="307.0" dy="0">Diuréticos ± vasodilatador</tspan></text><rect x="342.1" y="603.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="387.5" y="618.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="387.5" dy="0">◆ ESTE CASO</tspan></text><rect x="506.0" y="614.5" width="213.0" height="140.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="506.6" y="615.1" width="211.8" height="82.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="612.5" y="642.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="197"><tspan x="612.5" dy="0">FRÍO Y HÚMEDO</tspan></text><text x="612.5" y="662.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="189"><tspan x="612.5" dy="0">Congestión +</tspan><tspan x="612.5" dy="19">hipoperfusión</tspan></text><circle cx="522.0" cy="706.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="532.0" y="710.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="532.0" dy="0">Inotrópico + diurético</tspan></text><rect x="731.0" y="614.5" width="213.0" height="140.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="731.6" y="615.1" width="211.8" height="82.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="837.5" y="642.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="197"><tspan x="837.5" dy="0">FRÍO Y SECO</tspan></text><text x="837.5" y="662.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="189"><tspan x="837.5" dy="0">Hipoperfusión</tspan></text><circle cx="747.0" cy="706.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="757.0" y="710.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="757.0" dy="0">Volumen con cautela</tspan></text><text x="56.0" y="784.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="793.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="808.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="808.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Crepitantes, ortopnea y galope: húmedo</tspan></text><rect x="56.0" y="815.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="830.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="830.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Sin signos de hipoperfusión descritos: caliente</tspan></text><rect x="56.0" y="852.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="875.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Furosemida EV, oxígeno si hace falta y nitratos si la PA está alta.</tspan></text><text x="40.0" y="945.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="955.5" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="978.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="978.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hidroclorotiazida</tspan></text><text x="435.0" y="978.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Bisoprolol</tspan></text><rect x="513.0" y="958.5" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="978.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Furosemida</tspan></text><text x="735.0" y="978.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Nebivolol</tspan></text><text x="885.0" y="978.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Espironolactona</tspan></text><rect x="40.0" y="992.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="992.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1021.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Medicamento?</tspan></text><text x="285.0" y="1013.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: débil para la</tspan><tspan x="285.0" dy="16">congestión aguda</tspan></text><text x="435.0" y="1021.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No se inicia en la crisis</tspan></text><text x="585.0" y="1013.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: quita la congestión</tspan><tspan x="585.0" dy="16">rápido</tspan></text><text x="735.0" y="1021.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No se inicia en la crisis</tspan></text><text x="885.0" y="1013.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Efecto lento; es de</tspan><tspan x="885.0" dy="16">mantenimiento</tspan></text><rect x="40.0" y="955.5" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1066.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1094.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1116.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Diurético de asa EV (furosemida): alivia la congestión en minutos.</tspan><tspan x="58.0" dy="18">• Oxígeno si SatO₂ &lt; 90 %; nitratos si la PA está alta.</tspan><tspan x="58.0" dy="18">• Los betabloqueadores no se inician en la descompensación; la espironolactona no actúa rápido.</tspan></text><text x="58.0" y="1174.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ESC, insuficiencia cardiaca (2021, act. 2023).</tspan></text></svg>