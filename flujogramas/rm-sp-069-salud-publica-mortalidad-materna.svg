<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1101" viewBox="0 0 1000 1101" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La razón de mortalidad materna se expresa por 100 000 nacidos vivos"><title>La razón de mortalidad materna se expresa por 100 000 nacidos vivos</title><rect x="0.75" y="0.75" width="998.5" height="1099.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Salud pública · mortalidad materna</tspan></text><rect x="407.1" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="471.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="471.4" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Razón de mortalidad materna</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Muertes maternas por cada 100 000 nacidos vivos en un año.</tspan><tspan x="58.0" dy="17">Es razón porque los nacidos vivos no son la población en riesgo exacta.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de indicador</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">La razón de muerte materna se calcula con muertes</tspan><tspan x="640.0" dy="16">maternas entre nacidos vivos, multiplicado por...</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DOS PASOS PARA LEER EL INDICADOR</tspan></text><rect x="40.0" y="269.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="314.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="342.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">1</tspan></text><rect x="124.0" y="269.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="297.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Qué va en el numerador y en el denominador?</tspan></text><rect x="136.0" y="311.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="331.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Muertes maternas entre nacidos vivos del mismo año</tspan></text><text x="152.0" y="350.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">El denominador son nacidos vivos, no embarazadas: por eso es razón y no tasa.</tspan></text><line x1="77.0" y1="372.0" x2="77.0" y2="391.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,390.0 82.0,390.0 77.0,398.0" fill="#0f766e"/><text x="134.0" y="390.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="400.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="445.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="473.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">2</tspan></text><rect x="124.0" y="400.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="428.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Por cuánto se multiplica?</tspan></text><rect x="136.0" y="442.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="462.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Por 100 000 nacidos vivos</tspan></text><text x="152.0" y="481.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Con 1000 se expresa la mortalidad general; 10 000, 50 000 y 150 000 no son la convención.</tspan></text><rect x="40.0" y="521.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="547.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Razón de mortalidad materna = muertes maternas / nacidos vivos × 100 000</tspan></text><text x="60.0" y="566.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Muerte materna: hasta 42 días tras terminar el embarazo.</tspan></text><text x="40.0" y="627.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CONSTANTES DE USO HABITUAL EN LOS INDICADORES</tspan></text><rect x="40.0" y="639.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="658.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Indicador</tspan></text><text x="320.0" y="658.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Denominador</tspan></text><text x="645.0" y="658.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">Constante</tspan></text><rect x="40.0" y="668.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="687.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Razón de mortalidad materna</tspan></text><text x="320.0" y="687.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Nacidos vivos</tspan></text><text x="645.0" y="687.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">100 000</tspan></text><rect x="210.6" y="671.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="256.0" y="686.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="256.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="697.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="716.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Tasa de mortalidad bruta</tspan></text><text x="320.0" y="716.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Población a mitad del año</tspan></text><text x="645.0" y="716.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">1000</tspan></text><rect x="40.0" y="726.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="745.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Tasa de mortalidad infantil</tspan></text><text x="320.0" y="745.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Nacidos vivos</tspan></text><text x="645.0" y="745.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">1000</tspan></text><text x="40.0" y="795.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="805.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="827.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="827.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">50 000</tspan></text><text x="435.0" y="827.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">10 000</tspan></text><text x="585.0" y="827.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">150 000</tspan></text><text x="735.0" y="827.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">1000</tspan></text><rect x="813.0" y="808.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="827.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">100 000</tspan></text><rect x="40.0" y="842.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="842.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="871.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Constante?</tspan></text><text x="285.0" y="863.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no es la constante</tspan><tspan x="285.0" dy="16">convencional</tspan></text><text x="435.0" y="863.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no es la constante</tspan><tspan x="435.0" dy="16">convencional</tspan></text><text x="585.0" y="863.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no es la constante</tspan><tspan x="585.0" dy="16">convencional</tspan></text><text x="735.0" y="863.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: se usa para tasas</tspan><tspan x="735.0" dy="16">de mortalidad general</tspan></text><text x="885.0" y="863.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: por 100 000</tspan><tspan x="885.0" dy="16">nacidos vivos</tspan></text><rect x="40.0" y="805.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="916.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="944.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="966.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Muerte materna (OMS): la de una mujer durante el embarazo o en los 42 días tras su terminación, por causa relacionada con el embarazo o agravada</tspan><tspan x="58.0" dy="18">   por él, no accidental.</tspan><tspan x="58.0" dy="18">• Razón de mortalidad materna = muertes maternas / nacidos vivos × 100 000. Los nacidos vivos aproximan a las embarazadas, dato difícil de obtener.</tspan><tspan x="58.0" dy="18">• Es indicador indirecto de acceso a control prenatal, parto institucional y cuidados obstétricos de emergencia.</tspan><tspan x="58.0" dy="18">• No se confunde con la tasa de mortalidad materna, cuyo denominador son las mujeres en edad fértil.</tspan></text><text x="58.0" y="1060.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, Trends in maternal mortality 2000 to 2020 (Ginebra, 2023); Gordis, Epidemiología 6.ª ed. (2019).</tspan></text></svg>