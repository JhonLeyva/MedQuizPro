<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1020" viewBox="0 0 1000 1020" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="HBsAg persistente con anti-HBc IgG, HBeAg negativo y ALT normal: infección crónica (portador inactivo)"><title>HBsAg persistente con anti-HBc IgG, HBeAg negativo y ALT normal: infección crónica (portador inactivo)</title><rect x="0.75" y="0.75" width="998.5" height="1018.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Hepatología · serología de la hepatitis B</tspan></text><rect x="435.8" y="32.0" width="165.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="518.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="149"><tspan x="518.5" dy="0">GASTROENTEROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Serología de la hepatitis B</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Primero aparece el HBsAg; luego el anti-HBc (IgM, después IgG).</tspan><tspan x="58.0" dy="17">Al controlar el virus el HBsAg desaparece y surge el anti-HBs (inmunidad).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 30 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">HBsAg positivo en un examen de rutina; pareja usuario</tspan><tspan x="640.0" dy="16">de drogas.</tspan><tspan x="640.0" dy="16">Anti-HBc IgG, anti-HBs y HBsAg positivos; HBeAg</tspan><tspan x="640.0" dy="16">negativo; igual a los 8 meses, ALT normal.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CUÁNDO APARECE CADA MARCADOR (SEMANAS DESDE LA EXPOSICIÓN; RANGOS ORIENTATIVOS)</tspan></text><line x1="290.0" y1="323.0" x2="290.0" y2="517.0" stroke="#e2e8f0" stroke-width="1"/><text x="290.0" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="290.0" dy="0">0</tspan></text><line x1="371.2" y1="323.0" x2="371.2" y2="517.0" stroke="#e2e8f0" stroke-width="1"/><text x="371.2" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="371.2" dy="0">5</tspan></text><line x1="452.5" y1="323.0" x2="452.5" y2="517.0" stroke="#e2e8f0" stroke-width="1"/><text x="452.5" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="452.5" dy="0">10</tspan></text><line x1="533.8" y1="323.0" x2="533.8" y2="517.0" stroke="#e2e8f0" stroke-width="1"/><text x="533.8" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="533.8" dy="0">15</tspan></text><line x1="615.0" y1="323.0" x2="615.0" y2="517.0" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="615.0" dy="0">20</tspan></text><line x1="696.2" y1="323.0" x2="696.2" y2="517.0" stroke="#e2e8f0" stroke-width="1"/><text x="696.2" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="696.2" dy="0">25</tspan></text><line x1="777.5" y1="323.0" x2="777.5" y2="517.0" stroke="#e2e8f0" stroke-width="1"/><text x="777.5" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="777.5" dy="0">30</tspan></text><line x1="858.8" y1="323.0" x2="858.8" y2="517.0" stroke="#e2e8f0" stroke-width="1"/><text x="858.8" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="858.8" dy="0">35</tspan></text><line x1="940.0" y1="323.0" x2="940.0" y2="517.0" stroke="#e2e8f0" stroke-width="1"/><text x="940.0" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="940.0" dy="0">40</tspan></text><text x="940.0" y="305.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="end" data-max="60"><tspan x="940.0" dy="0">semanas</tspan></text><rect x="40.0" y="327.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="343.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">HBsAg</tspan></text><text x="48.0" y="358.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Primer marcador; su pérdida marca el control</tspan></text><rect x="355.0" y="335.0" width="292.5" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="381.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Anti-HBc IgM</tspan></text><text x="48.0" y="396.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Infección aguda reciente</tspan></text><rect x="387.5" y="373.0" width="357.5" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><rect x="40.0" y="403.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="419.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Anti-HBc IgG</tspan></text><text x="48.0" y="434.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Reemplaza a la IgM; persiste años</tspan></text><rect x="615.0" y="411.0" width="325.0" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="457.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Anti-HBs</tspan></text><text x="48.0" y="472.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Inmunidad: aparece al final</tspan></text><rect x="680.0" y="449.0" width="260.0" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><rect x="40.0" y="479.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="495.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">HBsAg persistente (más de 6 meses)</tspan></text><text x="48.0" y="510.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Infección crónica: el HBsAg no se pierde</tspan></text><rect x="355.0" y="487.0" width="585.0" height="22.0" rx="6" fill="#ea580c" stroke="none" stroke-width="1.5"/><line x1="858.8" y1="325.0" x2="858.8" y2="523.0" stroke="#b91c1c" stroke-width="2.6"/><rect x="773.2" y="523.0" width="171.0" height="22.0" rx="11" fill="#b91c1c" stroke="none" stroke-width="1.5"/><text x="858.8" y="538.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="858.8" dy="0">Caso: HBsAg a los 8 meses</tspan></text><rect x="40.0" y="569.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="595.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">HBsAg persistente + anti-HBc IgG + HBeAg negativo + ALT normal = crónica (portador inactivo)</tspan></text><text x="60.0" y="614.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El anti-HBs coexistente no la convierte en convalecencia.</tspan></text><text x="40.0" y="681.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="691.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="722.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="722.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Aguda</tspan></text><text x="435.0" y="722.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Curada</tspan></text><text x="585.0" y="713.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">En período de</tspan><tspan x="585.0" dy="17">convalecencia</tspan></text><text x="735.0" y="722.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Crónica activa</tspan></text><rect x="813.0" y="694.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="713.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Crónica persistente</tspan><tspan x="885.0" dy="17">(portador inactivo)</tspan></text><rect x="40.0" y="745.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="745.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="782.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué fase es?</tspan></text><text x="285.0" y="766.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: la aguda tiene</tspan><tspan x="285.0" dy="16">anti-HBc IgM y no</tspan><tspan x="285.0" dy="16">anti-HBs</tspan></text><text x="435.0" y="774.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: la curada tiene</tspan><tspan x="435.0" dy="16">HBsAg negativo</tspan></text><text x="585.0" y="774.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: la convalecencia</tspan><tspan x="585.0" dy="16">exige perder el HBsAg</tspan></text><text x="735.0" y="774.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: la activa tiene ALT</tspan><tspan x="735.0" dy="16">y ADN-VHB elevados</tspan></text><text x="885.0" y="766.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: HBsAg persistente,</tspan><tspan x="885.0" dy="16">HBeAg negativo y ALT</tspan><tspan x="885.0" dy="16">normal</tspan></text><rect x="40.0" y="691.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="835.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="863.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="885.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• HBsAg positivo más de 6 meses = infección crónica; el anti-HBs coexiste en una minoría y no indica convalecencia, que exige perder el HBsAg.</tspan><tspan x="58.0" dy="18">• Aguda: HBsAg con anti-HBc IgM y sin anti-HBs. Curada: HBsAg negativo con anti-HBs y anti-HBc. Crónica activa: ADN-VHB y ALT elevados; portador</tspan><tspan x="58.0" dy="18">   inactivo: ADN-VHB bajo y ALT normal.</tspan><tspan x="58.0" dy="18">• Pedir ADN-VHB, ALT y fibrosis; seguimiento cada 6-12 meses porque puede reactivarse.</tspan><tspan x="58.0" dy="18">• Tamizar VIH, VHC y sífilis, vacunar a la pareja y a los contactos susceptibles.</tspan></text><text x="58.0" y="979.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AASLD/IDSA, guía de hepatitis B crónica (Hepatology 2025); OMS, guías de hepatitis B crónica (2024); Harrison 21.ª ed. (2022).</tspan></text></svg>