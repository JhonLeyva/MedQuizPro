fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="581.0" y="367.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="217"><tspan x="581.0" dy="0">Fluida</tspan></text><text x="581.0" y="390.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="217"><tspan x="581.0" dy="0">Con parafasias</tspan></text><rect x="715.3" y="338.0" width="244.7" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="716.3" y="339.0" width="6.0" height="74.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="837.7" y="367.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="217"><tspan x="837.7" dy="0">Fluida</tspan></text><text x="837.7" y="390.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="217"><tspan x="837.7" dy="0">Con dificultad para repetir</tspan></text><rect x="40.0" y="426.0" width="150.0" height="76.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="115.0" y="468.5" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Comprensión</tspan></text><rect x="202.0" y="426.0" width="244.7" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="427.0" width="6.0" height="74.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="324.3" y="455.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="217"><tspan x="324.3" dy="0">Relativamente conservada</tspan></text><text x="324.3" y="478.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="217"><tspan x="324.3" dy="0">Con conciencia del déficit</tspan></text><rect x="458.7" y="426.0" width="244.7" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="459.7" y="427.0" width="6.0" height="74.0" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="581.0" y="455.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="217"><tspan x="581.0" dy="0">Muy alterada</tspan></text><text x="581.0" y="478.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="217"><tspan x="581.0" dy="0">Habla vacía de sentido</tspan></text><rect x="715.3" y="426.0" width="244.7" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="716.3" y="427.0" width="6.0" height="74.0" rx="3" fill="#6366f1" stroke="none" stroke-width="1.5"/><text x="837.7" y="455.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="217"><tspan x="837.7" dy="0">Conservada</tspan></text><text x="837.7" y="478.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="217"><tspan x="837.7" dy="0">Habla y comprensión preservadas</tspan></text><rect x="40.0" y="514.0" width="150.0" height="76.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="115.0" y="556.5" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Repetición</tspan></text><rect x="202.0" y="514.0" width="244.7" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="515.0" width="6.0" height="74.0" rx="3" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="324.3" y="543.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="217"><tspan x="324.3" dy="0">Alterada</tspan></text><text x="324.3" y="566.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="217"><tspan x="324.3" dy="0">Frases difíciles de repetir</tspan></text><rect x="458.7" y="514.0" width="244.7" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="459.7" y="515.0" width="6.0" height="74.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="581.0" y="543.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="217"><tspan x="581.0" dy="0">Alterada</tspan></text><text x="581.0" y="566.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="217"><tspan x="581.0" dy="0">Junto con la comprensión</tspan></text><rect x="715.3" y="514.0" width="244.7" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="716.3" y="515.0" width="6.0" height="74.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="837.7" y="543.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="217"><tspan x="837.7" dy="0">Muy alterada</tspan></text><text x="837.7" y="566.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="217"><tspan x="837.7" dy="0">Es el rasgo distintivo</tspan></text><rect x="40.0" y="602.0" width="150.0" height="91.9" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="115.0" y="652.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Sitio de la lesión</tspan></text><rect x="202.0" y="602.0" width="244.7" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="324.3" y="631.1" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="217"><tspan x="324.3" dy="0">Frontal izquierdo</tspan></text><text x="324.3" y="654.0" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="217"><tspan x="324.3" dy="0">Áreas 44 y 45; rama superior de la</tspan><tspan x="324.3" dy="17">cerebral media</tspan></text><rect x="278.9" y="682.9" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="324.3" y="697.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="324.3" dy="0">◆ ESTE CASO</tspan></text><rect x="458.7" y="602.0" width="244.7" height="91.9" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="459.7" y="603.0" width="6.0" height="89.9" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="581.0" y="630.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="217"><tspan x="581.0" dy="0">Temporal superior posterior</tspan><tspan x="581.0" dy="18.5">izquierdo</tspan></text><text x="581.0" y="671.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="217"><tspan x="581.0" dy="0">Área 22</tspan></text><rect x="715.3" y="602.0" width="244.7" height="91.9" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="716.3" y="603.0" width="6.0" height="89.9" rx="3" fill="#6366f1" stroke="none" stroke-width="1.5"/><text x="837.7" y="630.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="217"><tspan x="837.7" dy="0">Fascículo arqueado o parietal</tspan><tspan x="837.7" dy="18.5">izquierdo</tspan></text><text x="837.7" y="671.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="217"><tspan x="837.7" dy="0">Giro supramarginal</tspan></text><text x="40.0" y="743.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="753.9" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="776.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="776.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Parietal derecho</tspan></text><rect x="363.0" y="756.9" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="776.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Frontal izquierdo</tspan></text><text x="585.0" y="776.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Temporal izquierdo</tspan></text><text x="735.0" y="776.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Temporal derecho</tspan></text><text x="885.0" y="776.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Parietal izquierdo</tspan></text><rect x="40.0" y="790.9" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="790.9" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="827.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Lóbulo de la lesión?</tspan></text><text x="285.0" y="819.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: da aprosodia o</tspan><tspan x="285.0" dy="16">negligencia, no afasia</tspan></text><text x="435.0" y="811.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: áreas 44 y 45,</tspan><tspan x="435.0" dy="16">circunvolución frontal</tspan><tspan x="435.0" dy="16">inferior</tspan></text><text x="585.0" y="819.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sede de la afasia</tspan><tspan x="585.0" dy="16">de Wernicke</tspan></text><text x="735.0" y="819.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no produce afasia;</tspan><tspan x="735.0" dy="16">amusia o aprosodia</tspan></text><text x="885.0" y="819.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: afasia de</tspan><tspan x="885.0" dy="16">conducción</tspan></text><rect x="40.0" y="753.9" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="880.9" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="908.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="930.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Broca: habla no fluente, laboriosa, agramatical y telegráfica; comprensión relativamente conservada, repetición alterada y conciencia del déficit</tspan><tspan x="58.0" dy="18">   (frustración, depresión).</tspan><tspan x="58.0" dy="18">• Se irriga por la rama superior de la cerebral media; suele acompañarse de hemiparesia derecha faciobraquial por vecindad con la corteza motora.</tspan><tspan x="58.0" dy="18">• Wernicke: lesión de la circunvolución temporal superior posterior izquierda (área 22). Conducción: fascículo arqueado o giro supramarginal.</tspan><tspan x="58.0" dy="18">• Una lesión parietal o temporal derecha no produce afasia: aprosodia, negligencia o amusia.</tspan></text><text x="58.0" y="1024.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Kandel, Principles of Neural Science, 6.ª ed. (2021); Harrison Principios de Medicina Interna, 21.ª ed. (2022); Gray's Anatomy, 42.ª ed. (2021)</tspan></text></svg>