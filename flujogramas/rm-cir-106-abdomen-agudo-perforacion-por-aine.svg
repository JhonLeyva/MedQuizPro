<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1095" viewBox="0 0 1000 1095" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="AINE, abdomen en tabla y aire bajo ambos diafragmas: perforación duodenal"><title>AINE, abdomen en tabla y aire bajo ambos diafragmas: perforación duodenal</title><rect x="0.75" y="0.75" width="998.5" height="1093.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Abdomen agudo · perforación por AINE</tspan></text><rect x="433.3" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="476.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="476.5" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Perforación duodenal por AINE</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Los AINE dañan la barrera mucosa y favorecen la úlcera y su perforación.</tspan><tspan x="58.0" dy="17">El aire y el jugo gastroduodenal pasan a la cavidad peritoneal.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 42 años con artritis reumatoidea</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">AINE irregulares; dolor epigástrico de 8 h que limita la</tspan><tspan x="640.0" dy="16">respiración, PA 100/60, FR 28.</tspan><tspan x="640.0" dy="16">Blumberg (+), McBurney (+), sin ruidos. Rx: aire bajo</tspan><tspan x="640.0" dy="16">ambos hemidiafragmas.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL AINE AL ABDOMEN EN TABLA</tspan></text><text x="40.0" y="313.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="430"><tspan x="40.0" dy="0">MECANISMO</tspan></text><text x="516.0" y="313.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="444"><tspan x="516.0" dy="0">QUÉ SE VE EN EL CASO</tspan></text><rect x="40.0" y="323.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="352.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="357.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><text x="84.0" y="349.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">AINE sin protección</tspan></text><text x="84.0" y="366.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Inhiben la COX-1: menos prostaglandinas, moco y bicarbonato</tspan></text><line x1="476.0" y1="352.5" x2="503.0" y2="352.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,347.5 502.0,357.5 510.0,352.5" fill="#ea580c"/><rect x="516.0" y="325.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="349.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Artritis reumatoidea con AINE irregulares</tspan></text><text x="530.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0"></tspan></text><line x1="255.0" y1="384.0" x2="255.0" y2="397.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,396.0 260.0,396.0 255.0,404.0" fill="#0f766e"/><rect x="40.0" y="406.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="435.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="440.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">2</tspan></text><text x="84.0" y="432.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Úlcera duodenal</tspan></text><text x="84.0" y="449.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">La erosión atraviesa toda la pared</tspan></text><line x1="476.0" y1="435.5" x2="503.0" y2="435.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,430.5 502.0,440.5 510.0,435.5" fill="#ea580c"/><rect x="516.0" y="408.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="432.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Dolor epigástrico y náuseas</tspan></text><text x="530.0" y="449.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0"></tspan></text><line x1="255.0" y1="467.0" x2="255.0" y2="480.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,479.0 260.0,479.0 255.0,487.0" fill="#0f766e"/><rect x="40.0" y="489.0" width="430.0" height="72.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="525.0" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="529.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">3</tspan></text><text x="84.0" y="521.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Perforación libre</tspan></text><text x="84.0" y="538.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Aire y jugo ácido entran a la cavidad</tspan></text><line x1="476.0" y1="525.0" x2="503.0" y2="525.0" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,520.0 502.0,530.0 510.0,525.0" fill="#ea580c"/><rect x="516.0" y="489.0" width="444.0" height="72.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="530.0" y="513.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Dolor súbito que limita la respiración; Rx con aire bajo ambos</tspan><tspan x="530.0" dy="17">diafragmas</tspan></text><text x="530.0" y="547.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Este caso</tspan></text><line x1="255.0" y1="563.0" x2="255.0" y2="576.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,575.0 260.0,575.0 255.0,583.0" fill="#0f766e"/><rect x="40.0" y="585.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="614.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="619.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">4</tspan></text><text x="84.0" y="611.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Peritonitis química</tspan></text><text x="84.0" y="628.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">El líquido desciende por la gotiera derecha</tspan></text><line x1="476.0" y1="614.5" x2="503.0" y2="614.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,609.5 502.0,619.5 510.0,614.5" fill="#ea580c"/><rect x="516.0" y="587.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="611.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Abdomen en tabla, Blumberg (+) y McBurney (+), sin ruidos</tspan></text><text x="530.0" y="628.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0"></tspan></text><rect x="40.0" y="662.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="688.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">AINE + abdomen en tabla + aire libre = perforación duodenal</tspan></text><text x="60.0" y="707.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El Blumberg en fosa ilíaca derecha es por el líquido que baja; se opera de urgencia.</tspan></text><text x="40.0" y="774.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="784.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="815.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="806.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Obstrucción</tspan><tspan x="285.0" dy="17">intestinal aguda</tspan></text><text x="435.0" y="806.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Apendicitis aguda</tspan><tspan x="435.0" dy="17">complicada</tspan></text><text x="585.0" y="806.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Aneurisma</tspan><tspan x="585.0" dy="17">disecante</tspan></text><rect x="663.0" y="787.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="806.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Perforación</tspan><tspan x="735.0" dy="17">duodenal</tspan></text><text x="885.0" y="806.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Diverticulitis</tspan><tspan x="885.0" dy="17">complicada</tspan></text><rect x="40.0" y="838.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="838.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="875.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico probable?</tspan></text><text x="285.0" y="859.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: sin vómito</tspan><tspan x="285.0" dy="16">fecaloide ni asas en</tspan><tspan x="285.0" dy="16">pilas</tspan></text><text x="435.0" y="859.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: el dolor empezó en</tspan><tspan x="435.0" dy="16">el epigastrio con aire</tspan><tspan x="435.0" dy="16">libre</tspan></text><text x="585.0" y="867.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: el aire libre no es</tspan><tspan x="585.0" dy="16">de la aorta</tspan></text><text x="735.0" y="859.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: AINE, abdomen en</tspan><tspan x="735.0" dy="16">tabla y aire bajo los</tspan><tspan x="735.0" dy="16">diafragmas</tspan></text><text x="885.0" y="859.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: dolor en el</tspan><tspan x="885.0" dy="16">cuadrante inferior</tspan><tspan x="885.0" dy="16">izquierdo</tspan></text><rect x="40.0" y="784.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="928.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="956.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="978.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Perforación: dolor súbito «en puñalada», abdomen en tabla y neumoperitoneo en la Rx de tórax de pie (70-80 %); si es dudosa y estable, TC.</tspan><tspan x="58.0" dy="18">• El Blumberg y el McBurney positivos no indican apendicitis: el líquido gastroduodenal baja por la gotiera parietocólica derecha.</tspan><tspan x="58.0" dy="18">• Boey (shock, comorbilidad grave, evolución &gt; 24 h): 0 factores = mortalidad baja; 3 factores = cerca de 50 %.</tspan><tspan x="58.0" dy="18">• Cirugía urgente: reanimación, antibiótico, parche de epiplón (Graham), lavado; suspender AINE y erradicar H. pylori.</tspan></text><text x="58.0" y="1054.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: WSES, úlcera péptica perforada (2020); Maastricht VI/Florence, H. pylori (2022); Sabiston Tratado de Cirugía 21.ª ed.</tspan></text></svg>