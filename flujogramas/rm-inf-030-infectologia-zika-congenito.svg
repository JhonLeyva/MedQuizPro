<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="823" viewBox="0 0 1000 823" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La infección por virus del Zika durante la gestación se relaciona con microcefalia"><title>La infección por virus del Zika durante la gestación se relaciona con microcefalia</title><rect x="0.75" y="0.75" width="998.5" height="821.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Infectología · Zika congénito</tspan></text><rect x="368.8" y="32.0" width="121.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="429.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="106"><tspan x="429.7" dy="0">INFECTOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Virus del Zika</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Flavivirus de los mosquitos Aedes; también por vía sexual y de madre a hijo.</tspan><tspan x="58.0" dy="17">Infección materna frecuentemente asintomática.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué patología se relaciona con el Zika durante la</tspan><tspan x="640.0" dy="16">gestación?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL MOSQUITO AL FETO Y CÓMO SE CORTA CADA ESLABÓN</tspan></text><rect x="40.0" y="269.0" width="210.5" height="59.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="145.2" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Mosquito Aedes</tspan></text><text x="145.2" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Transmite el virus</tspan></text><line x1="253.5" y1="298.5" x2="266.5" y2="298.5" stroke="#0f766e" stroke-width="2"/><polygon points="265.5,293.5 265.5,303.5 273.5,298.5" fill="#0f766e"/><line x1="145.2" y1="330.0" x2="145.2" y2="344.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="40.0" y="346.0" width="210.5" height="47.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="145.2" y="360.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">✂ CORTA</tspan></text><text x="145.2" y="377.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Repelente y control del vector</tspan></text><rect x="276.5" y="269.0" width="210.5" height="59.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="381.8" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Gestante</tspan></text><text x="381.8" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Infección a veces asintomática</tspan></text><line x1="490.0" y1="298.5" x2="503.0" y2="298.5" stroke="#0f766e" stroke-width="2"/><polygon points="502.0,293.5 502.0,303.5 510.0,298.5" fill="#0f766e"/><line x1="381.8" y1="330.0" x2="381.8" y2="344.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="276.5" y="346.0" width="210.5" height="47.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="381.8" y="360.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">✂ CORTA</tspan></text><text x="381.8" y="377.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">RT-PCR y ecografía seriada</tspan></text><rect x="513.0" y="269.0" width="210.5" height="59.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="618.2" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Feto</tspan></text><text x="618.2" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Pasa por la placenta</tspan></text><line x1="726.5" y1="298.5" x2="739.5" y2="298.5" stroke="#0f766e" stroke-width="2"/><polygon points="738.5,293.5 738.5,303.5 746.5,298.5" fill="#0f766e"/><line x1="618.2" y1="330.0" x2="618.2" y2="344.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="513.0" y="346.0" width="210.5" height="47.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="618.2" y="360.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">✂ CORTA</tspan></text><text x="618.2" y="377.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">No hay vacuna ni antiviral</tspan></text><rect x="749.5" y="269.0" width="210.5" height="59.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="854.8" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Recién nacido</tspan></text><text x="854.8" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Síndrome congénito</tspan></text><line x1="854.8" y1="330.0" x2="854.8" y2="344.0" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="749.5" y="346.0" width="210.5" height="47.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="854.8" y="360.0" font-size="9.5" font-weight="800" font-style="normal" fill="#ffedd5" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">✂ CORTA</tspan></text><text x="854.8" y="377.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Marca: microcefalia</tspan></text><rect x="810.6" y="382.0" width="88.2" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="854.8" y="397.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="854.8" dy="0">◆ PREGUNTA</tspan></text><rect x="40.0" y="423.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="449.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Zika en la gestación = microcefalia</tspan></text><text x="60.0" y="468.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La hidrocefalia puede ocurrir, pero la manifestación característica es la microcefalia.</tspan></text><text x="40.0" y="535.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="545.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="567.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="567.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Gastrosquisis</tspan></text><text x="435.0" y="567.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Agenesia renal</tspan></text><text x="585.0" y="567.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Hidrocefalia</tspan></text><rect x="663.0" y="548.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="567.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Microcefalia</tspan></text><text x="885.0" y="567.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Agenesia pulmonar</tspan></text><rect x="40.0" y="582.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="582.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="603.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Patología relacionada</tspan><tspan x="54.0" dy="16">con Zika?</tspan></text><text x="285.0" y="603.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: malformación de</tspan><tspan x="285.0" dy="16">origen distinto</tspan></text><text x="435.0" y="603.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: malformación de</tspan><tspan x="435.0" dy="16">origen distinto</tspan></text><text x="585.0" y="603.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: puede ocurrir, pero</tspan><tspan x="585.0" dy="16">no es la característica</tspan></text><text x="735.0" y="603.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: marca del síndrome</tspan><tspan x="735.0" dy="16">congénito</tspan></text><text x="885.0" y="603.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: malformación de</tspan><tspan x="885.0" dy="16">origen distinto</tspan></text><rect x="40.0" y="545.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="656.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="684.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="706.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Síndrome congénito: microcefalia, calcificaciones subcorticales, ventriculomegalia, atrofia cortical, anomalías oculares y artrogriposis.</tspan><tspan x="58.0" dy="18">• No se asocia a gastrosquisis, agenesia renal o pulmonar; la hidrocefalia es menos característica.</tspan><tspan x="58.0" dy="18">• Diagnóstico: RT-PCR en sangre y orina; ecografía seriada en la gestante. En el adulto se asocia al síndrome de Guillain-Barré.</tspan><tspan x="58.0" dy="18">• No hay vacuna ni antiviral: prevención con control del vector y repelente.</tspan></text><text x="58.0" y="782.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Rasmussen SA et al., Zika virus and birth defects, N Engl J Med 2016;374:1981-7; OMS, Zika virus: fact sheet; Harrison Principios de Medicina Interna, 21.ª ed. (2022).</tspan></text></svg>