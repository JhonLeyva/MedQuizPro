<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1195" viewBox="0 0 1000 1195" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Tríada de púrpura palpable, artralgia y dolor abdominal tras una infección respiratoria: Henoch-Schönlein"><title>Tríada de púrpura palpable, artralgia y dolor abdominal tras una infección respiratoria: Henoch-Schönlein</title><rect x="0.75" y="0.75" width="998.5" height="1193.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · vasculitis por IgA</tspan></text><rect x="367.5" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="416.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="416.5" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Púrpura de Henoch-Schönlein</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hoy llamada vasculitis por IgA: vasculitis leucocitoclástica de pequeños vasos.</tspan><tspan x="58.0" dy="17">Es la vasculitis más frecuente de la infancia (3 a 10 años).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño con tríada clásica</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Artralgia, lesiones purpúricas palpables y dolor</tspan><tspan x="640.0" dy="16">abdominal.</tspan><tspan x="640.0" dy="16">Proceso respiratorio hace una semana.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE RECONOCE LA VASCULITIS POR IGA</tspan></text><rect x="40.0" y="285.0" width="453.0" height="95.0" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2.4"/><text x="54.0" y="312.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Tríada del caso</tspan></text><text x="54.0" y="329.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Púrpura palpable en piernas y glúteos</tspan><tspan x="54.0" dy="16">Artralgia y dolor abdominal difuso</tspan><tspan x="54.0" dy="16">Un resfrío una semana antes</tspan></text><rect x="391.2" y="274.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="436.6" y="289.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="436.6" dy="0">◆ ESTE CASO</tspan></text><rect x="507.0" y="285.0" width="453.0" height="95.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="521.0" y="312.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Criterio obligatorio</tspan></text><text x="521.0" y="329.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Púrpura palpable sin trombocitopenia</tspan><tspan x="521.0" dy="16">Más uno: dolor abdominal, IgA en biopsia, artritis o compromiso renal</tspan></text><rect x="40.0" y="394.0" width="453.0" height="79.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="54.0" y="421.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Por qué no es otra</tspan></text><text x="54.0" y="438.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">PTI y Glanzmann: púrpura plana con trastorno plaquetario</tspan><tspan x="54.0" dy="16">Hemofilia: hematomas profundos; Kawasaki: fiebre 5 días</tspan></text><rect x="507.0" y="394.0" width="453.0" height="79.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="521.0" y="421.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Qué vigilar</tspan></text><text x="521.0" y="438.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Invaginación intestinal por edema de pared</tspan><tspan x="521.0" dy="16">Nefritis: presión arterial y orina por 6 meses</tspan></text><rect x="40.0" y="491.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="517.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Púrpura palpable + dolor abdominal + artralgia = Henoch-Schönlein</tspan></text><text x="60.0" y="536.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Las plaquetas y la coagulación son normales.</tspan></text><text x="40.0" y="597.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CRITERIOS EULAR/PRINTO/PRES 2010 DE VASCULITIS POR IGA</tspan></text><rect x="40.0" y="609.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="628.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Criterio</tspan></text><text x="320.0" y="628.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Condición</tspan></text><text x="645.0" y="628.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">En este caso</tspan></text><rect x="40.0" y="638.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="657.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Púrpura palpable</tspan></text><text x="320.0" y="657.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Obligatorio, sin trombocitopenia</tspan></text><text x="645.0" y="657.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">Presente</tspan></text><rect x="210.6" y="641.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="256.0" y="656.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="256.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="667.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="686.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Dolor abdominal difuso</tspan></text><text x="320.0" y="686.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Uno de los cuatro</tspan></text><text x="645.0" y="686.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">Presente</tspan></text><rect x="40.0" y="696.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="715.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Artritis o artralgia</tspan></text><text x="320.0" y="715.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Uno de los cuatro</tspan></text><text x="645.0" y="715.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">Presente</tspan></text><rect x="40.0" y="725.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="744.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Biopsia con IgA predominante</tspan></text><text x="320.0" y="744.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Uno de los cuatro</tspan></text><text x="645.0" y="744.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">No se realizó</tspan></text><rect x="40.0" y="754.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="773.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Compromiso renal (hematuria o</tspan><tspan x="50.0" dy="15">proteinuria)</tspan></text><text x="320.0" y="773.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Uno de los cuatro</tspan></text><text x="645.0" y="773.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">No referido; se controla</tspan></text><text x="40.0" y="838.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="848.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="879.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="851.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="879.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Henoch-Schönlein</tspan></text><text x="435.0" y="870.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Trombastenia de</tspan><tspan x="435.0" dy="17">Glanzmann</tspan></text><text x="585.0" y="870.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Púrpura</tspan><tspan x="585.0" dy="17">trombocitopénica</tspan></text><text x="735.0" y="879.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hemofilia A</tspan></text><text x="885.0" y="870.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Enfermedad de</tspan><tspan x="885.0" dy="17">Kawasaki</tspan></text><rect x="40.0" y="902.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="902.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="939.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Sospecha diagnóstica?</tspan></text><text x="285.0" y="931.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: tríada típica con</tspan><tspan x="285.0" dy="16">plaquetas normales</tspan></text><text x="435.0" y="931.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: púrpura plana por</tspan><tspan x="435.0" dy="16">trastorno plaquetario</tspan></text><text x="585.0" y="931.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: púrpura plana con</tspan><tspan x="585.0" dy="16">plaquetas bajas</tspan></text><text x="735.0" y="931.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: hemartrosis y</tspan><tspan x="735.0" dy="16">TTPa prolongado</tspan></text><text x="885.0" y="923.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: fiebre de cinco</tspan><tspan x="885.0" dy="16">días, conjuntivitis y</tspan><tspan x="885.0" dy="16">adenopatía</tspan></text><rect x="40.0" y="848.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="992.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1020.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1042.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Criterios EULAR/PRINTO/PRES 2010: púrpura palpable (obligatoria) más uno: dolor abdominal, depósito de IgA, artritis o artralgia, o compromiso renal.</tspan><tspan x="58.0" dy="18">• Aparece 1 a 3 semanas después de una infección respiratoria. Plaquetas y coagulación normales: así se distingue de las púrpuras por trastorno</tspan><tspan x="58.0" dy="18">   plaquetario.</tspan><tspan x="58.0" dy="18">• Complicaciones: invaginación intestinal y nefritis; se controlan presión y orina al menos 6 meses. Manejo de soporte; corticoides solo si hay dolor intenso</tspan><tspan x="58.0" dy="18">   o complicación.</tspan><tspan x="58.0" dy="18">• Alerta: púrpura plana con plaquetas bajas es PTI; hemartrosis con TTPa prolongado es hemofilia; fiebre de 5 días con conjuntivitis es Kawasaki.</tspan></text><text x="58.0" y="1154.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Ozen y cols., Criterios EULAR/PRINTO/PRES (Ann Rheum Dis 2010;69:798-806); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>