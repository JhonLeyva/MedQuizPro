<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1203" viewBox="0 0 1000 1203" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Las convulsiones son un síntoma neuroglucopénico; temblor, palpitaciones y diaforesis son adrenérgicos"><title>Las convulsiones son un síntoma neuroglucopénico; temblor, palpitaciones y diaforesis son adrenérgicos</title><rect x="0.75" y="0.75" width="998.5" height="1201.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Endocrinología · hipoglucemia</tspan></text><rect x="381.8" y="32.0" width="140.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="452.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="124"><tspan x="452.0" dy="0">ENDOCRINOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hipoglucemia</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Dos grupos de síntomas según el mecanismo.</tspan><tspan x="58.0" dy="17">Los adrenérgicos avisan; los neuroglucopénicos indican falta de glucosa cerebral.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Paciente diabético con hipoglucemia</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es el síntoma neuroglucopénico?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SÍNTOMAS ADRENÉRGICOS FRENTE A NEUROGLUCOPÉNICOS</tspan></text><rect x="493.0" y="303.0" width="14" height="190" rx="5" fill="#64748b"/><path d="M440.0 508.0 H560.0 L540.0 488.0 H460.0 Z" fill="#475569"/><circle cx="500.0" cy="303.0" r="15" fill="#f59e0b" stroke="#92400e" stroke-width="2"/><line x1="385.4" y1="284.9" x2="614.6" y2="321.1" stroke="#334155" stroke-width="7" stroke-linecap="round"/><line x1="385.4" y1="284.9" x2="357.4" y2="346.9" stroke="#64748b" stroke-width="2"/><line x1="385.4" y1="284.9" x2="413.4" y2="346.9" stroke="#64748b" stroke-width="2"/><path d="M347.4 346.9 H423.4 Q385.4 390.9 347.4 346.9 Z" fill="#64748b"/><text x="385.4" y="361.9" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="385.4" dy="0">ALARMA</tspan></text><line x1="614.6" y1="321.1" x2="586.6" y2="383.1" stroke="#64748b" stroke-width="2"/><line x1="614.6" y1="321.1" x2="642.6" y2="383.1" stroke="#64748b" stroke-width="2"/><path d="M576.6 383.1 H652.6 Q614.6 427.1 576.6 383.1 Z" fill="#ea580c"/><text x="614.6" y="398.1" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="614.6" dy="0">CEREBRO</tspan></text><text x="500.0" y="535.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="300"><tspan x="500.0" dy="0">¿Cuál es neuroglucopénico?</tspan></text><rect x="40.0" y="273.0" width="290.0" height="158.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58.0" y="301.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="58.0" dy="0">Adrenérgicos</tspan></text><circle cx="62.0" cy="326.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="330.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Temblor</tspan></text><circle cx="62.0" cy="352.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="356.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Palpitaciones</tspan></text><circle cx="62.0" cy="378.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="382.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Diaforesis y palidez</tspan></text><circle cx="62.0" cy="404.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="408.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Ansiedad y hambre</tspan></text><rect x="670.0" y="273.0" width="290.0" height="158.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><text x="688.0" y="301.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="254"><tspan x="688.0" dy="0">Neuroglucopénicos (este caso)</tspan></text><circle cx="692.0" cy="326.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="330.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Convulsiones: este caso</tspan></text><circle cx="692.0" cy="352.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="356.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Confusión y conducta extraña</tspan></text><circle cx="692.0" cy="378.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="382.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Cefalea y visión borrosa</tspan></text><circle cx="692.0" cy="404.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="408.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Somnolencia y coma</tspan></text><rect x="844.6" y="262.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="277.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="569.0" width="920.0" height="93.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="597.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Convulsiones = neuroglucopenia</tspan></text><text x="500.0" y="618.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">El cerebro no recibe sustrato suficiente.</tspan><tspan x="500.0" dy="17">Temblor, palpitaciones y diaforesis son adrenérgicos.</tspan></text><text x="40.0" y="696.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">NIVELES DE HIPOGLUCEMIA (ADA)</tspan></text><rect x="40.0" y="708.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="727.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">Nivel</tspan></text><text x="175.0" y="727.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Definición</tspan></text><text x="572.5" y="727.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Síntomas habituales</tspan></text><rect x="40.0" y="737.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="756.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">1</tspan></text><text x="175.0" y="756.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Menor de 70 y mayor o igual a 54 mg/dL</tspan></text><text x="572.5" y="756.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Adrenérgicos como señal de alarma</tspan></text><rect x="40.0" y="766.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="785.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">2</tspan></text><text x="175.0" y="785.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Menor de 54 mg/dL</tspan></text><text x="572.5" y="785.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Neuroglucopénicos: confusión, convulsiones (este caso)</tspan></text><rect x="65.6" y="769.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="111.0" y="784.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="111.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="795.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="814.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">3</tspan></text><text x="175.0" y="814.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Evento grave con alteración cognitiva</tspan></text><text x="572.5" y="814.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Requiere ayuda de terceros</tspan></text><text x="40.0" y="864.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="874.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="896.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="896.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Rigidez</tspan></text><rect x="363.0" y="877.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="896.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Convulsiones</tspan></text><text x="585.0" y="896.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Diaforesis</tspan></text><text x="735.0" y="896.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Palpitaciones</tspan></text><text x="885.0" y="896.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Temblores</tspan></text><rect x="40.0" y="911.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="911.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="932.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Síntoma</tspan><tspan x="54.0" dy="16">neuroglucopénico?</tspan></text><text x="285.0" y="932.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no es</tspan><tspan x="285.0" dy="16">característico</tspan></text><text x="435.0" y="932.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: falta de glucosa en</tspan><tspan x="435.0" dy="16">el cerebro</tspan></text><text x="585.0" y="932.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: síntoma</tspan><tspan x="585.0" dy="16">adrenérgico</tspan></text><text x="735.0" y="932.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: síntoma</tspan><tspan x="735.0" dy="16">adrenérgico</tspan></text><text x="885.0" y="932.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: síntoma</tspan><tspan x="885.0" dy="16">adrenérgico</tspan></text><rect x="40.0" y="874.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="985.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1013.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1035.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Adrenérgicos (glucemia menor de 70 mg/dL): temblor, palpitaciones, ansiedad, hambre, diaforesis y palidez. Neuroglucopénicos (menor de 54):</tspan><tspan x="58.0" dy="18">   confusión, cefalea, visión borrosa, convulsiones y coma.</tspan><tspan x="58.0" dy="18">• ADA: nivel 1 menor de 70 y mayor o igual a 54 mg/dL; nivel 2 menor de 54; nivel 3 es el evento grave con alteración cognitiva que exige ayuda de</tspan><tspan x="58.0" dy="18">   terceros.</tspan><tspan x="58.0" dy="18">• Paciente consciente: 15 a 20 g de glucosa oral y repetir a los 15 minutos; inconsciente: glucagón o dextrosa intravenosa.</tspan><tspan x="58.0" dy="18">• Alerta: la hipoglucemia recurrente causa falta de percepción de las señales de alarma y más eventos graves.</tspan></text><text x="58.0" y="1147.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ADA, Standards of Care in Diabetes-2026, sección 6 (Diabetes Care 2026;49 Suppl 1:S132-S149); Cryer PE et al., Endocrine Society, J Clin Endocrinol Metab</tspan><tspan x="58.0" dy="15">2009;94:709-728.</tspan></text></svg>