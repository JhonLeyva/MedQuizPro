estreptomicina, tobramicina y neomicina.</tspan><tspan x="58.0" dy="17">Se acumulan en la perilinfa y la endolinfa.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de farmacología</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué antibióticos pueden generar disfunción vestibular</tspan><tspan x="640.0" dy="16">y auditiva?</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ GRUPO DAÑA EL OÍDO Y EL EQUILIBRIO</tspan></text><line x1="406.0" y1="421.8" x2="340.0" y2="421.8" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="421.8" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="421.9" y1="474.1" x2="340.0" y2="528.9" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="528.9" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.1" y1="391.9" x2="660.0" y2="368.2" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="368.2" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.1" y1="451.6" x2="660.0" y2="475.3" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="475.3" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="421.9" y1="369.4" x2="340.0" y2="314.6" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="314.6" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="421.8" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="421.8" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="407.8" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">DISFUNCIÓN</tspan><tspan x="500.0" dy="19">VESTIBULAR Y</tspan><tspan x="500.0" dy="19">AUDITIVA</tspan></text><text x="500.0" y="464.8" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">Antibiótico causal</tspan></text><rect x="40.0" y="269.0" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="297.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">AMINOGLUCÓSIDOS</tspan></text><text x="190.0" y="321.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Gentamicina, amikacina, estreptomicina</tspan><tspan x="190.0" dy="17">Vértigo, ataxia e hipoacusia</tspan></text><rect x="144.6" y="350.2" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="365.2" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="376.2" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="377.2" width="6.0" height="89.2" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="405.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">SULFONAMIDAS</tspan></text><text x="190.0" y="428.7" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Cotrimoxazol</tspan><tspan x="190.0" dy="17">Alergia y mielotoxicidad, no ototoxicidad</tspan></text><rect x="40.0" y="483.3" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="484.3" width="6.0" height="89.2" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="190.0" y="512.2" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">CEFALOSPORINAS</tspan></text><text x="190.0" y="535.8" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Betalactámicos</tspan><tspan x="190.0" dy="17">Alergia y encefalopatía a dosis altas</tspan></text><rect x="660.0" y="322.6" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="323.6" width="6.0" height="89.2" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="351.4" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">CARBAPENÉMICOS</tspan></text><text x="810.0" y="375.1" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Betalactámicos</tspan><tspan x="810.0" dy="17">Convulsiones a dosis altas</tspan></text><rect x="660.0" y="429.8" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="430.8" width="6.0" height="89.2" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="458.6" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">QUINOLONAS</tspan></text><text x="810.0" y="482.2" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Ciprofloxacino, levofloxacino</tspan><tspan x="810.0" dy="17">Tendinopatía y prolongación del QT</tspan></text><text x="40.0" y="610.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="622.5" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="647.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Se acumulan en la endolinfa</tspan></text><line x1="248.5" y1="643.0" x2="267.5" y2="643.0" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,638.0 266.5,648.0 274.5,643.0" fill="#0f766e"/><rect x="278.5" y="622.5" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="647.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Mueren células ciliadas</tspan></text><line x1="487.0" y1="643.0" x2="506.0" y2="643.0" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,638.0 505.0,648.0 513.0,643.0" fill="#0f766e"/><rect x="517.0" y="622.5" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="647.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Hipoacusia y vértigo</tspan></text><line x1="725.5" y1="643.0" x2="744.5" y2="643.0" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,638.0 743.5,648.0 751.5,643.0" fill="#0f766e"/><rect x="755.5" y="622.5" width="204.5" height="41.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="647.0" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Daño irreversible</tspan></text><text x="40.0" y="703.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="713.5" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="736.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="716.5" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="736.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Aminoglicósidos</tspan></text><text x="435.0" y="736.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Sulfonamidas</tspan></text><text x="585.0" y="736.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Cefalosporinas</tspan></text><text x="735.0" y="736.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Carbapenémicos</tspan></text><text x="885.0" y="736.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Quinolonas</tspan></text><rect x="40.0" y="750.5" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="750.5" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="787.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Ototóxicos?</tspan></text><text x="285.0" y="779.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: ototoxicidad</tspan><tspan x="285.0" dy="16">vestibular y coclear</tspan></text><text x="435.0" y="771.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: sin toxicidad</tspan><tspan x="435.0" dy="16">vestibular ni auditiva</tspan><tspan x="435.0" dy="16">característica</tspan></text><text x="585.0" y="771.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sin toxicidad</tspan><tspan x="585.0" dy="16">vestibular ni auditiva</tspan><tspan x="585.0" dy="16">característica</tspan></text><text x="735.0" y="771.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: sin toxicidad</tspan><tspan x="735.0" dy="16">vestibular ni auditiva</tspan><tspan x="735.0" dy="16">característica</tspan></text><text x="885.0" y="771.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: sin toxicidad</tspan><tspan x="885.0" dy="16">vestibular ni auditiva</tspan><tspan x="885.0" dy="16">característica</tspan></text><rect x="40.0" y="713.5" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="840.5" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="868.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="890.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Daño irreversible de las células ciliadas del órgano de Corti y del aparato vestibular, por radicales libres y unión al ribosoma mitocondrial.</tspan><tspan x="58.0" dy="18">• Estreptomicina y gentamicina: sobre todo vestibulotoxicidad (vértigo, ataxia, oscilopsia). Amikacina y neomicina: cocleotoxicidad (hipoacusia de</tspan><tspan x="58.0" dy="18">   frecuencias altas, tinnitus).</tspan><tspan x="58.0" dy="18">• Otras toxicidades: nefrotoxicidad, bloqueo neuromuscular y teratogenia. Riesgo mayor con dosis acumulada, insuficiencia renal, diuréticos de asa,</tspan><tspan x="58.0" dy="18">   vancomicina y la mutación mitocondrial A1555G.</tspan><tspan x="58.0" dy="18">• Perla: dosis única diaria y niveles valle reducen el daño; sulfonamidas, cefalosporinas, carbapenémicos y quinolonas no tienen esta toxicidad</tspan><tspan x="58.0" dy="18">   característica.</tspan></text><text x="58.0" y="1020.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Goodman y Gilman 14.ª ed. (2023); Katzung Farmacología básica y clínica 16.ª ed. (2024).</tspan></text></svg>