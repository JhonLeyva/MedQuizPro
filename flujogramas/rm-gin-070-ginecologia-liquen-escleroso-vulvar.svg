"#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="430.2" x2="660.0" y2="452.2" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="452.2" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="421.1" y1="351.1" x2="340.0" y2="298.6" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="298.6" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="402.2" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="402.2" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="397.7" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">LIQUEN</tspan><tspan x="500.0" dy="19">ESCLEROSO</tspan></text><text x="500.0" y="435.7" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">causa no aclarada</tspan></text><rect x="40.0" y="253.0" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="281.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">CAUSA: NO ACLARADA</tspan></text><text x="190.0" y="305.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Multifactorial; no hay un agente único</tspan><tspan x="190.0" dy="17">demostrado</tspan></text><rect x="144.6" y="334.2" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="349.2" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="360.2" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="361.2" width="6.0" height="89.2" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="389.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">AUTOINMUNE PROBABLE</tspan></text><text x="190.0" y="412.7" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Autoanticuerpos contra la proteína de matriz</tspan><tspan x="190.0" dy="17">extracelular 1</tspan></text><rect x="40.0" y="467.3" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="468.3" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="190.0" y="501.1" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">ASOCIACIONES</tspan></text><text x="190.0" y="524.8" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Tiroiditis, vitíligo y alopecia areata</tspan></text><rect x="660.0" y="310.2" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="311.2" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="343.9" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">GENÉTICA</tspan></text><text x="810.0" y="367.6" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Predisposición con HLA clase II</tspan></text><rect x="660.0" y="410.2" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="411.2" width="6.0" height="82.0" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="443.9" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">TRAUMA LOCAL</tspan></text><text x="810.0" y="467.6" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Fenómeno de Koebner</tspan></text><text x="40.0" y="587.3" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="599.3" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="632.3" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Prurito vulvar intenso</tspan></text><line x1="248.5" y1="628.3" x2="267.5" y2="628.3" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,623.3 266.5,633.3 274.5,628.3" fill="#0f766e"/><rect x="278.5" y="599.3" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="632.3" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Placas blancas atróficas</tspan></text><line x1="487.0" y1="628.3" x2="506.0" y2="628.3" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,623.3 505.0,633.3 513.0,628.3" fill="#0f766e"/><rect x="517.0" y="599.3" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="623.8" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Diagnóstico clínico; biopsia si</tspan><tspan x="619.2" dy="17">hay duda</tspan></text><line x1="725.5" y1="628.3" x2="744.5" y2="628.3" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,623.3 743.5,633.3 751.5,628.3" fill="#0f766e"/><rect x="755.5" y="599.3" width="204.5" height="58.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="632.3" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Clobetasol tópico</tspan></text><text x="40.0" y="697.3" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="707.3" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="729.8" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="710.3" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="729.8" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Desconocida</tspan></text><text x="435.0" y="729.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Viral</tspan></text><text x="585.0" y="729.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Autoinmune</tspan></text><text x="735.0" y="729.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hormonal</tspan></text><text x="885.0" y="729.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Metabólica</tspan></text><rect x="40.0" y="744.3" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="744.3" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="789.3" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Etiopatogenia?</tspan></text><text x="285.0" y="773.3" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: no está</tspan><tspan x="285.0" dy="16">completamente</tspan><tspan x="285.0" dy="16">aclarada</tspan></text><text x="435.0" y="781.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no hay un virus</tspan><tspan x="435.0" dy="16">demostrado</tspan></text><text x="585.0" y="765.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es la hipótesis más</tspan><tspan x="585.0" dy="16">aceptada, pero la clave</tspan><tspan x="585.0" dy="16">la deja como</tspan><tspan x="585.0" dy="16">desconocida</tspan></text><text x="735.0" y="781.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no se explica solo</tspan><tspan x="735.0" dy="16">por hormonas</tspan></text><text x="885.0" y="781.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no es un trastorno</tspan><tspan x="885.0" dy="16">metabólico</tspan></text><rect x="40.0" y="707.3" width="920.0" height="119.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="850.3" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="878.3" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="900.3" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Clínica: prurito intenso, placas blanquecinas atróficas apergaminadas, fusión de labios menores, enterramiento del clítoris, estenosis introital, fisuras y</tspan><tspan x="58.0" dy="18">   equimosis.</tspan><tspan x="58.0" dy="18">• Etiopatogenia no completamente aclarada y multifactorial: predisposición genética (HLA clase II), autoanticuerpos contra la proteína de matriz</tspan><tspan x="58.0" dy="18">   extracelular 1, asociación con enfermedades autoinmunes y trauma local (Koebner).</tspan><tspan x="58.0" dy="18">• El libro la considera de causa desconocida; la hipótesis autoinmune es la más aceptada. No es infecciosa ni se explica por una sola alteración hormonal</tspan><tspan x="58.0" dy="18">   o metabólica.</tspan><tspan x="58.0" dy="18">• Tratamiento de primera línea: corticoide tópico ultrapotente (clobetasol); el seguimiento es prolongado por el riesgo de carcinoma escamoso vulvar.</tspan></text><text x="58.0" y="1030.3" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: British Association of Dermatologists, Guías de manejo del liquen escleroso (Br J Dermatol 2018); Williams Obstetricia, 26.ª ed. (2022).</tspan></text></svg>