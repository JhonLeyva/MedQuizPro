<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1398" viewBox="0 0 1000 1398" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Diabético atendido en un I-4: la albuminuria mayor de 300 mg/24 h (nefropatía establecida) es criterio para referirlo al siguiente nivel"><title>Diabético atendido en un I-4: la albuminuria mayor de 300 mg/24 h (nefropatía establecida) es criterio para referirlo al siguiente nivel</title><rect x="0.75" y="0.75" width="998.5" height="1396.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Diabetes · referencia</tspan></text><rect x="323.0" y="32.0" width="155.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="400.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="139"><tspan x="400.7" dy="0">ENDOCRINOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="148.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Criterios de referencia del diabético</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El primer nivel maneja la diabetes no complicada; se refiere ante daño de órganos o falta</tspan><tspan x="58.0" dy="17">de control pese a tratamiento.</tspan><tspan x="58.0" dy="17">Albuminuria &gt; 300 mg/24 h o TFG &lt; 30-45, retinopatía, pie diabético complicado, crisis</tspan><tspan x="58.0" dy="17">hiperglucémicas, cardiopatía.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="148.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="146.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 45 años con DM2</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Diagnosticado en un I-4.</tspan><tspan x="640.0" dy="16">Consulta por más sed.</tspan></text><rect x="640.0" y="209.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="222.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="222.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="270.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CUÁNDO REFERIR AL DIABÉTICO</tspan></text><rect x="40.0" y="282.0" width="602.0" height="34.0" rx="10" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.2"/><text x="56.0" y="304.0" font-size="11.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="452"><tspan x="56.0" dy="0">CRITERIOS DE REFERENCIA</tspan></text><text x="626.0" y="304.0" font-size="10.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="end" data-max="100"><tspan x="626.0" dy="0">EN EL CASO</tspan></text><rect x="40.0" y="322.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,337.5 74.0,357.5 50.0,357.5" fill="#dc2626"/><text x="62.0" y="354.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="345.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Albuminuria &gt; 300 mg/24 h</tspan></text><text x="84.0" y="362.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Esta pregunta</tspan></text><text x="626.0" y="352.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="381.0" width="602.0" height="53.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><polygon points="62.0,396.5 74.0,416.5 50.0,416.5" fill="#cbd5e1"/><text x="62.0" y="413.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="404.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">TFG &lt; 30-45 mL/min</tspan></text><text x="84.0" y="421.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">No se informa</tspan></text><text x="626.0" y="411.5" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">No</tspan></text><rect x="40.0" y="440.0" width="602.0" height="53.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><polygon points="62.0,455.5 74.0,475.5 50.0,475.5" fill="#cbd5e1"/><text x="62.0" y="472.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="463.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Retinopatía</tspan></text><text x="84.0" y="480.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">No se informa</tspan></text><text x="626.0" y="470.5" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">No</tspan></text><rect x="40.0" y="499.0" width="602.0" height="53.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><polygon points="62.0,514.5 74.0,534.5 50.0,534.5" fill="#cbd5e1"/><text x="62.0" y="531.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="522.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Pie diabético complicado</tspan></text><text x="84.0" y="539.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">No</tspan></text><text x="626.0" y="529.5" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">No</tspan></text><rect x="40.0" y="558.0" width="602.0" height="53.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><polygon points="62.0,573.5 74.0,593.5 50.0,593.5" fill="#cbd5e1"/><text x="62.0" y="590.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="581.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Crisis hiperglucémica</tspan></text><text x="84.0" y="598.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">No</tspan></text><text x="626.0" y="588.5" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">No</tspan></text><rect x="660.0" y="282.0" width="300.0" height="329.0" rx="12" fill="#dc2626" stroke="none" stroke-width="1.5"/><text x="676.0" y="306.0" font-size="10.5" font-weight="800" font-style="normal" fill="#fecaca" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">CON 1 CRITERIO</tspan></text><text x="676.0" y="454.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">Referir al siguiente nivel</tspan></text><text x="676.0" y="471.0" font-size="12" font-weight="500" font-style="normal" fill="#fee2e2" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">Nefropatía diabética establecida.</tspan></text><rect x="40.0" y="629.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="655.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Albuminuria &gt; 300 mg/24 h: referir</tspan></text><text x="60.0" y="674.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Lo demás se ajusta en el primer nivel.</tspan></text><text x="40.0" y="741.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="753.0" width="920.0" height="301.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="767.0" width="186.3" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="149.2" y="787.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="149.2" dy="0">ALBUMINURIA (KDIGO)</tspan></text><text x="258.3" y="787.0" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="684"><tspan x="258.3" dy="0">Relación albúmina/creatinina en orina (o albúmina en 24 h).</tspan></text><rect x="56.0" y="827.0" width="288.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="827.6" width="286.8" height="63.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="200.0" y="855.0" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="272"><tspan x="200.0" dy="0">A1</tspan></text><text x="200.0" y="875.0" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="264"><tspan x="200.0" dy="0">&lt; 30 mg/g</tspan></text><circle cx="72.0" cy="900.0" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="904.0" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="82.0" dy="0">Normal</tspan></text><rect x="356.0" y="827.0" width="288.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="356.6" y="827.6" width="286.8" height="63.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="500.0" y="855.0" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="272"><tspan x="500.0" dy="0">A2</tspan></text><text x="500.0" y="875.0" font-size="14" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="264"><tspan x="500.0" dy="0">30-300 mg/g</tspan></text><circle cx="372.0" cy="900.0" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="382.0" y="904.0" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="382.0" dy="0">Moderadamente aumentada</tspan></text><rect x="656.0" y="827.0" width="288.0" height="98.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="657.2" y="828.2" width="285.6" height="63.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="800.0" y="855.0" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="272"><tspan x="800.0" dy="0">A3</tspan></text><text x="800.0" y="875.0" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="264"><tspan x="800.0" dy="0">&gt; 300 mg/g</tspan></text><circle cx="672.0" cy="900.0" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="682.0" y="904.0" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="250"><tspan x="682.0" dy="0">Nefropatía establecida: referir</tspan></text><rect x="754.6" y="816.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="800.0" y="831.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="800.0" dy="0">◆ ESTE CASO</tspan></text><text x="56.0" y="955.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="964.0" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="979.0" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="979.0" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Albuminuria &gt; 300 mg/24 h</tspan></text><rect x="56.0" y="1001.0" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="1024.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">IECA/ARA II e iSGLT2; referir a nefrología o medicina interna.</tspan></text><text x="40.0" y="1094.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1104.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1143.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1135.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Creatinina sérica de</tspan><tspan x="285.0" dy="17">1.2 mg/dl</tspan></text><rect x="363.0" y="1107.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="1135.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Albuminuria mayor</tspan><tspan x="435.0" dy="17">de 300 mg/24 horas</tspan></text><text x="585.0" y="1126.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Confirmación</tspan><tspan x="585.0" dy="17">diagnóstica por</tspan><tspan x="585.0" dy="17">endocrinólogo</tspan></text><text x="735.0" y="1126.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Falta de adherencia</tspan><tspan x="735.0" dy="17">al tratamiento</tspan><tspan x="735.0" dy="17">instalado</tspan></text><text x="885.0" y="1135.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Glucosa en ayunas</tspan><tspan x="885.0" dy="17">de 180 mg/dl</tspan></text><rect x="40.0" y="1175.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="1175.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1204.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Criterio de referencia?</tspan></text><text x="285.0" y="1204.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: leve, vigilar</tspan></text><text x="435.0" y="1196.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: nefropatía</tspan><tspan x="435.0" dy="16">establecida</tspan></text><text x="585.0" y="1196.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: el diagnóstico lo</tspan><tspan x="585.0" dy="16">hace el primer nivel</tspan></text><text x="735.0" y="1196.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: se educa en el</tspan><tspan x="735.0" dy="16">primer nivel</tspan></text><text x="885.0" y="1196.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: se ajusta el</tspan><tspan x="885.0" dy="16">tratamiento</tspan></text><rect x="40.0" y="1104.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1249.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1277.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1299.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• En el I-4: educación, metformina, control de PA y lípidos, tamizaje anual (orina, creatinina, fondo de ojo, pies).</tspan><tspan x="58.0" dy="18">• Glucosa 180 o falta de adherencia: ajustar y educar, no son motivo de referencia por sí solas.</tspan><tspan x="58.0" dy="18">• Con nefropatía: IECA/ARA II e iSGLT2 y seguimiento por nefrología o medicina interna.</tspan></text><text x="58.0" y="1357.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA Perú, guía de diabetes tipo 2 en el primer nivel (2016; act.); ADA Standards of Care in Diabetes 2026.</tspan></text></svg>