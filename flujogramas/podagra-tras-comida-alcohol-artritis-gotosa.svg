" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="831.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="853.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• No iniciar alopurinol durante la crisis si no lo tomaba.</tspan><tspan x="58.0" dy="18">• Confirmar con cristales en aguja, birrefringencia negativa.</tspan><tspan x="58.0" dy="18">• Metas: ácido úrico &lt; 6 mg/dl a largo plazo.</tspan></text><text x="58.0" y="911.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACR – Guideline for the management of gout (2020) · EULAR (2016)</tspan></text></svg>