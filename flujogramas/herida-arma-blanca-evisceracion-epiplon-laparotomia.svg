<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1433" viewBox="0 0 1000 1433" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Herida abdominal por arma blanca con evisceración: laparotomía"><title>Herida abdominal por arma blanca con evisceración: laparotomía</title><rect x="0.75" y="0.75" width="998.5" height="1431.9" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Trauma abdominal penetrante · evisceración</tspan></text><rect x="462.5" y="32.0" width="101.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="513.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="85"><tspan x="513.2" dy="0">CIRUGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Trauma abdominal penetrante por arma blanca</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Lo que decide es si el peritoneo fue violado y si hay signos de lesión.</tspan><tspan x="58.0" dy="17">Evisceración, peritonitis o inestabilidad = laparotomía.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 32 años, herida en hipogastrio</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Estable: PA 120/75, FC 92, Glasgow 15.</tspan><tspan x="640.0" dy="16">Herida de 3 cm con salida parcial del epiplón; abdomen</tspan><tspan x="640.0" dy="16">blando.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="422.2" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="422.2" y1="271.0" x2="422.2" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="417.2,299.0 427.2,299.0 422.2,307.0" fill="#94a3b8"/><line x1="422.2" y1="365.0" x2="422.2" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="395.0" x2="655.7" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="395.0" x2="188.7" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,423.0 193.7,423.0 188.7,431.0" fill="#94a3b8"/><line x1="655.7" y1="395.0" x2="655.7" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="650.7,423.0 660.7,423.0 655.7,431.0" fill="#94a3b8"/><line x1="655.7" y1="489.0" x2="655.7" y2="569.9" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="569.9" x2="811.3" y2="569.9" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="569.9" x2="500.0" y2="598.9" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,597.9 505.0,597.9 500.0,605.9" fill="#94a3b8"/><line x1="811.3" y1="569.9" x2="811.3" y2="598.9" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,597.9 816.3,597.9 811.3,605.9" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="422.2" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="422.2" y1="271.0" x2="422.2" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="417.2,299.0 427.2,299.0 422.2,307.0" fill="#0f766e"/><line x1="422.2" y1="365.0" x2="422.2" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="395.0" x2="422.2" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="395.0" x2="188.7" y2="424.0" stroke="#0f766e" stroke-width="3"/><polygon points="183.7,423.0 193.7,423.0 188.7,431.0" fill="#0f766e"/><rect x="176.6" y="404.0" width="24.1" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="188.7" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">Sí</tspan></text><rect x="641.5" y="404.0" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="655.7" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="655.7" dy="0">No</tspan></text><rect x="462.4" y="578.9" width="75.2" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="500.0" y="591.4" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">Sí o dudoso</tspan></text><rect x="797.2" y="578.9" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="811.3" y="591.4" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">No</tspan></text><polygon points="162.2,336.0 188.2,307.0 656.2,307.0 682.2,336.0 656.2,365.0 188.2,365.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="208.2" cy="336.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="208.2" y="341.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="208.2" dy="0">?</tspan></text><text x="441.2" y="340.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="441.2" dy="0">¿Hay evisceración, peritonitis o inestabilidad?</tspan></text><rect x="40.0" y="431.0" width="297.3" height="108.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="188.7" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">LAPAROTOMÍA EXPLORATORIA</tspan><tspan x="188.7" dy="18.5">URGENTE</tspan></text><text x="188.7" y="500.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Cubrir el epiplón con gasa húmeda estéril</tspan><tspan x="188.7" dy="17">Antibiótico y profilaxis antitetánica</tspan></text><polygon points="395.7,460.0 421.7,431.0 889.7,431.0 915.7,460.0 889.7,489.0 421.7,489.0" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><circle cx="441.7" cy="460.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="441.7" y="465.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="441.7" dy="0">?</tspan></text><text x="674.7" y="464.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="674.7" dy="0">¿La herida penetró el peritoneo?</tspan></text><rect x="351.3" y="605.9" width="297.3" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="634.3" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Observación seriada o laparoscopía</tspan></text><text x="500.0" y="657.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">En paciente estable, sin signos</tspan></text><rect x="662.7" y="605.9" width="297.3" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="634.3" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Lavado y cierre de la herida</tspan></text><text x="811.3" y="657.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Alta con control</tspan></text><text x="40.0" y="719.4" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="731.4" width="328.0" height="392.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="741.4" width="131.3" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="755.4" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="286"><tspan x="61.0" dy="0">ABDOMEN DEL CASO</tspan></text><g data-box="54.0 769.4 300.0 330.0"><g transform="translate(54.0,769.4) scale(1.0)"><path d="M18 16 Q150 -6 282 16 L292 300 Q150 334 8 300 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M28 40 Q150 10 272 40" fill="none" stroke="#d6a684" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M24 42 C60 20 176 22 188 42 L182 66 C150 92 86 110 26 112 Z" fill="#e7a882" stroke="#9a6b52" stroke-width="1.8" stroke-linejoin="round" /><ellipse cx="112" cy="104" rx="11" ry="17" fill="#86efac" stroke="#9a6b52" stroke-width="1.8" transform="rotate(-20 112 104)" /><path d="M178 44 C214 30 256 46 254 84 C252 116 222 132 190 128 C178 126 172 116 180 110 C204 110 222 98 220 80 C218 62 200 58 184 64 Z" fill="#fbcfe8" stroke="#9a6b52" stroke-width="1.8" stroke-linejoin="round" /><ellipse cx="266" cy="78" rx="14" ry="30" fill="#c4b5fd" stroke="#9a6b52" stroke-width="1.8" transform="rotate(12 266 78)" /><path d="M150 118 C124 116 116 142 124 160 C132 176 158 176 170 168" fill="none" stroke="#e879a0" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><path d="M150 136 C176 124 214 122 246 116 C252 124 246 132 238 134 C206 140 178 146 156 150 Z" fill="#fde68a" stroke="#9a6b52" stroke-width="1.8" stroke-linejoin="round" /><path d="M58 262 L52 170" fill="none" stroke="#fed7aa" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 148 L240 146" fill="none" stroke="#fed7aa" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><path d="M250 160 L250 246" fill="none" stroke="#fed7aa" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><path d="M250 246 C250 268 226 286 196 286 C176 286 170 272 160 276" fill="none" stroke="#fed7aa" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="60" cy="270" rx="15" ry="13" fill="#fed7aa" stroke="#9a6b52" stroke-width="1.8" /><path d="M58 282 C56 296 66 304 74 300" fill="none" stroke="#f59e0b" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M92 180 C120 166 150 196 178 176 C206 158 226 190 206 206 C182 222 150 196 126 214 C104 230 136 248 162 236 C190 224 220 240 206 258 C190 272 150 250 120 262 C102 268 84 262 76 266" fill="none" stroke="#fecdd3" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/><path d="M92 262 C84 264 78 266 72 268" fill="none" stroke="#fecdd3" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="150" cy="306" rx="22" ry="12" fill="#fef9c3" stroke="#9a6b52" stroke-width="1.8" /><ellipse cx="150" cy="248" rx="24" ry="14" fill="#fde047" stroke="#a16207" stroke-width="2.5" /><path d="M128 248 L172 248" fill="none" stroke="#7f1d1d" stroke-width="3" stroke-linejoin="round" /><text x="150" y="232" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">epiplón afuera</text><text x="150" y="232" font-size="10.5" font-weight="800" fill="#713f12" text-anchor="middle" data-max="0">epiplón afuera</text><circle cx="196" cy="250" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="196" y="254" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">1</text><text x="10" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">D</text><text x="290" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">I</text></g></g><rect x="390.0" y="731.4" width="570.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="408.0" cy="746.9" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="750.9" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">1</tspan></text><text x="426.0" y="751.4" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="526"><tspan x="426.0" dy="0">Herida de 3 cm en el hipogastrio por la que sale el epiplón (evisceración).</tspan></text><rect x="390.0" y="769.4" width="570.0" height="31.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="408.0" cy="784.9" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="788.9" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">2</tspan></text><text x="426.0" y="789.4" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="526"><tspan x="426.0" dy="0">Si el epiplón está afuera, las tres capas de la pared y el peritoneo están abiertos.</tspan></text><rect x="390.0" y="807.4" width="570.0" height="48.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="408.0" cy="822.9" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="408.0" y="826.9" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">3</tspan></text><text x="426.0" y="827.4" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="526"><tspan x="426.0" dy="0">Aunque el paciente esté estable, puede haber lesión de víscera hueca sin dolor todavía: se</tspan><tspan x="426.0" dy="17">explora.</tspan></text><text x="40.0" y="1163.4" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1173.4" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1195.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="1176.4" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="303.8" y="1195.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Laparotomía</tspan></text><text x="491.2" y="1195.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Lavado peritoneal</tspan></text><text x="678.8" y="1195.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Reintroducir epiplón</tspan></text><text x="866.2" y="1195.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Laparoscopía</tspan></text><rect x="40.0" y="1210.4" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1210.4" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1239.4" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Sirve aquí?</tspan></text><text x="303.8" y="1239.4" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Sí: indicación absoluta</tspan></text><text x="491.2" y="1239.4" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No: es para trauma cerrado</tspan></text><text x="678.8" y="1231.4" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No: contamina y oculta</tspan><tspan x="678.8" dy="16">lesiones</tspan></text><text x="866.2" y="1231.4" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No: la evisceración ya indica</tspan><tspan x="866.2" dy="16">explorar abierto</tspan></text><rect x="40.0" y="1173.4" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1284.4" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1312.4" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1334.4" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Evisceración = el peritoneo está abierto: laparotomía exploratoria urgente aunque esté estable.</tspan><tspan x="58.0" dy="18">• No se reintroduce el epiplón: se cubre con gasa húmeda estéril y se va a sala.</tspan><tspan x="58.0" dy="18">• El lavado peritoneal diagnóstico sirve en el trauma cerrado, no aquí.</tspan></text><text x="58.0" y="1392.4" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ATLS 11.ª ed. (2025); Schwartz Principios de Cirugía 11.ª ed..</tspan></text></svg>