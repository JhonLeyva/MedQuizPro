<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="992" viewBox="0 0 1000 992" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Joven con fiebre vespertina y derrame: exudado linfocítico con ADA de 78 U/L: tuberculosis pleural"><title>Joven con fiebre vespertina y derrame: exudado linfocítico con ADA de 78 U/L: tuberculosis pleural</title><rect x="0.75" y="0.75" width="998.5" height="990.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Tuberculosis extrapulmonar · derrame pleural</tspan></text><rect x="469.8" y="32.0" width="129.8" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="534.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="114"><tspan x="534.7" dy="0">NEUMOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tuberculosis pleural</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Exudado con predominio de linfocitos y ADA alta (&gt; 40 U/L).</tspan><tspan x="58.0" dy="17">La baciloscopía del líquido casi siempre es negativa.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 28 años, Lima</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">1 mes de fiebre vespertina, tos seca y dolor pleurítico</tspan><tspan x="640.0" dy="16">derecho.</tspan><tspan x="640.0" dy="16">Exudado (proteínas 5,1), 85 % linfocitos, glucosa 70,</tspan><tspan x="640.0" dy="16">ADA 78; baciloscopía negativa.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LEE EL LÍQUIDO PLEURAL</tspan></text><text x="202.0" y="313.0" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="758"><tspan x="202.0" dy="0">→ CÉLULA PREDOMINANTE</tspan></text><rect x="202.0" y="323.0" width="373.0" height="35.0" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="388.5" y="345.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="353"><tspan x="388.5" dy="0">Linfocitos</tspan></text><rect x="587.0" y="323.0" width="373.0" height="35.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="773.5" y="345.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="353"><tspan x="773.5" dy="0">Neutrófilos</tspan></text><text x="40.0" y="344.5" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="146"><tspan x="40.0" dy="0">↓ TIPO DE LÍQUIDO</tspan></text><rect x="40.0" y="370.0" width="150.0" height="76.0" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="115.0" y="404.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Exudado + ADA &gt;</tspan><tspan x="115.0" dy="17">40</tspan></text><rect x="202.0" y="370.0" width="373.0" height="76.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="388.5" y="399.6" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">TUBERCULOSIS PLEURAL</tspan></text><text x="388.5" y="422.6" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">ADA 78, linfocitos 85 %</tspan></text><rect x="343.1" y="435.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="388.5" y="450.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="388.5" dy="0">◆ ESTE CASO</tspan></text><rect x="587.0" y="370.0" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="588.0" y="371.0" width="6.0" height="74.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="773.5" y="399.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Empiema</tspan></text><text x="773.5" y="422.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Pus, pH bajo</tspan></text><rect x="40.0" y="458.0" width="150.0" height="76.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="115.0" y="492.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Exudado + ADA</tspan><tspan x="115.0" dy="17">normal</tspan></text><rect x="202.0" y="458.0" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="459.0" width="6.0" height="74.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="388.5" y="487.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Neoplasia, linfoma</tspan></text><text x="388.5" y="510.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Citología, biopsia</tspan></text><rect x="587.0" y="458.0" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="588.0" y="459.0" width="6.0" height="74.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="773.5" y="487.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Paraneumónico</tspan></text><text x="773.5" y="510.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Neumonía de base</tspan></text><rect x="40.0" y="546.0" width="150.0" height="76.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="115.0" y="588.5" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Trasudado</tspan></text><rect x="202.0" y="546.0" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="547.0" width="6.0" height="74.0" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="388.5" y="575.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Falla cardiaca</tspan></text><text x="388.5" y="598.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Bilateral</tspan></text><rect x="587.0" y="546.0" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="588.0" y="547.0" width="6.0" height="74.0" rx="3" fill="#6366f1" stroke="none" stroke-width="1.5"/><text x="773.5" y="575.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Cirrosis, nefrótico</tspan></text><text x="773.5" y="598.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Albúmina baja</tspan></text><text x="40.0" y="672.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="682.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="721.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="704.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Derrame</tspan><tspan x="285.0" dy="17">paraneumónico</tspan><tspan x="285.0" dy="17">complicado</tspan></text><rect x="363.0" y="685.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="721.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Tuberculosis pleural</tspan></text><text x="585.0" y="704.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Derrame por</tspan><tspan x="585.0" dy="17">insuficiencia</tspan><tspan x="585.0" dy="17">cardiaca</tspan></text><text x="735.0" y="721.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Mesotelioma pleural</tspan></text><text x="885.0" y="713.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Tromboembolismo</tspan><tspan x="885.0" dy="17">pulmonar</tspan></text><rect x="40.0" y="753.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="753.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="790.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Encaja?</tspan></text><text x="285.0" y="782.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: predominan</tspan><tspan x="285.0" dy="16">neutrófilos</tspan></text><text x="435.0" y="782.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: exudado linfocítico</tspan><tspan x="435.0" dy="16">+ ADA alta</tspan></text><text x="585.0" y="790.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es trasudado</tspan></text><text x="735.0" y="774.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Menos probable: ADA</tspan><tspan x="735.0" dy="16">no tan alta, mayor</tspan><tspan x="735.0" dy="16">edad</tspan></text><text x="885.0" y="790.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no da ADA tan alta</tspan></text><rect x="40.0" y="682.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="843.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="871.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="893.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• En zona de alta prevalencia, exudado linfocítico con ADA &gt; 40 permite tratar sin biopsia.</tspan><tspan x="58.0" dy="18">• Esquema 2HRZE/4HR; la mayoría se reabsorbe sin drenaje.</tspan><tspan x="58.0" dy="18">• ADA alta también en empiema y linfoma: mirar el tipo de célula.</tspan></text><text x="58.0" y="951.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS (2024); MINSA Perú, NTS de tuberculosis (2023); BTS, pleural disease (2023).</tspan></text></svg>