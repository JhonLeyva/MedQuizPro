<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1033" viewBox="0 0 1000 1033" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la cascada isquémica el ion clave es el calcio, que entra por los receptores NMDA y AMPA"><title>En la cascada isquémica el ion clave es el calcio, que entra por los receptores NMDA y AMPA</title><rect x="0.75" y="0.75" width="998.5" height="1031.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neurología · fisiopatología del ictus</tspan></text><rect x="410.5" y="32.0" width="113.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="467.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="98"><tspan x="467.4" dy="0">NEUROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cascada excitotóxica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Menos flujo, menos oxígeno y glucosa, menos ATP.</tspan><tspan x="58.0" dy="17">Fallan las bombas Na/K y se libera glutamato.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué ion participa en la fisiopatología de la apoplejía</tspan><tspan x="640.0" dy="16">isquémica?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DE LA OCLUSIÓN A LA MUERTE NEURONAL</tspan></text><text x="40.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="430"><tspan x="40.0" dy="0">MECANISMO</tspan></text><text x="516.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="444"><tspan x="516.0" dy="0">QUÉ OCURRE</tspan></text><rect x="40.0" y="291.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="320.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="325.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><text x="84.0" y="317.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Oclusión arterial</tspan></text><text x="84.0" y="334.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Cae el flujo, el oxígeno y la glucosa</tspan></text><line x1="476.0" y1="320.5" x2="503.0" y2="320.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,315.5 502.0,325.5 510.0,320.5" fill="#ea580c"/><rect x="516.0" y="293.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="317.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Falla de ATP</tspan></text><text x="530.0" y="334.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0"></tspan></text><line x1="255.0" y1="352.0" x2="255.0" y2="365.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,364.0 260.0,364.0 255.0,372.0" fill="#0f766e"/><rect x="40.0" y="374.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="403.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="408.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">2</tspan></text><text x="84.0" y="400.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Despolarización</tspan></text><text x="84.0" y="417.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Fallan las bombas de sodio y potasio</tspan></text><line x1="476.0" y1="403.5" x2="503.0" y2="403.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,398.5 502.0,408.5 510.0,403.5" fill="#ea580c"/><rect x="516.0" y="376.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="400.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Liberación de glutamato</tspan></text><text x="530.0" y="417.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0"></tspan></text><line x1="255.0" y1="435.0" x2="255.0" y2="448.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,447.0 260.0,447.0 255.0,455.0" fill="#0f766e"/><rect x="40.0" y="457.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="486.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="491.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">3</tspan></text><text x="84.0" y="483.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Entrada de calcio</tspan></text><text x="84.0" y="500.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Se activan los receptores NMDA y AMPA</tspan></text><line x1="476.0" y1="486.5" x2="503.0" y2="486.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,481.5 502.0,491.5 510.0,486.5" fill="#ea580c"/><rect x="516.0" y="459.0" width="444.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="530.0" y="483.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Calcio intracelular alto</tspan></text><text x="530.0" y="500.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Opción correcta</tspan></text><line x1="255.0" y1="518.0" x2="255.0" y2="531.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,530.0 260.0,530.0 255.0,538.0" fill="#0f766e"/><rect x="40.0" y="540.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="569.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="574.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">4</tspan></text><text x="84.0" y="566.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Muerte celular</tspan></text><text x="84.0" y="583.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Proteasas, lipasas y radicales libres</tspan></text><line x1="476.0" y1="569.5" x2="503.0" y2="569.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,564.5 502.0,574.5 510.0,569.5" fill="#ea580c"/><rect x="516.0" y="542.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="566.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Necrosis y apoptosis</tspan></text><text x="530.0" y="583.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0"></tspan></text><rect x="40.0" y="617.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="643.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Isquemia = entrada de calcio</tspan></text><text x="60.0" y="662.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La penumbra isquémica se salva con reperfusión temprana.</tspan></text><text x="40.0" y="729.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="739.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="761.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="761.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Fósforo</tspan></text><text x="435.0" y="761.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Cloro</tspan></text><text x="585.0" y="761.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Manganeso</tspan></text><rect x="663.0" y="742.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="761.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Calcio</tspan></text><text x="885.0" y="761.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Magnesio</tspan></text><rect x="40.0" y="776.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="776.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="813.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Ion clave?</tspan></text><text x="285.0" y="805.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no es mediador</tspan><tspan x="285.0" dy="16">central</tspan></text><text x="435.0" y="805.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no es mediador</tspan><tspan x="435.0" dy="16">central</tspan></text><text x="585.0" y="805.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no es mediador</tspan><tspan x="585.0" dy="16">central</tspan></text><text x="735.0" y="797.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: la entrada masiva</tspan><tspan x="735.0" dy="16">dispara la</tspan><tspan x="735.0" dy="16">excitotoxicidad</tspan></text><text x="885.0" y="797.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: bloquea el NMDA y</tspan><tspan x="885.0" dy="16">el FAST-MAG no</tspan><tspan x="885.0" dy="16">mostró beneficio</tspan></text><rect x="40.0" y="739.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="866.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="894.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="916.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El glutamato estimula los receptores NMDA y AMPA y entra calcio en masa: activa proteasas (calpaínas), lipasas, endonucleasas y óxido nítrico sintasa.</tspan><tspan x="58.0" dy="18">• Hay radicales libres, daño mitocondrial y muerte celular por necrosis y apoptosis.</tspan><tspan x="58.0" dy="18">• Alrededor del núcleo infartado queda la penumbra isquémica, viable: es el blanco de la trombolisis y la trombectomía.</tspan><tspan x="58.0" dy="18">• El magnesio bloquea el NMDA, pero el sulfato de magnesio (FAST-MAG) no dio beneficio; ningún neuroprotector ha mostrado eficacia.</tspan></text><text x="58.0" y="992.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Campbell y cols., accidente cerebrovascular isquémico (Nat Rev Dis Primers 2019); Kandel, Principles of Neural Science 6.ª ed. (2021).</tspan></text></svg>