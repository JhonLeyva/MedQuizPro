<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1193" viewBox="0 0 1000 1193" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Adolescente varón con hemartrosis tras un trauma, TTPa prolongado, plaquetas y agregación normales: hemofilia A (la más frecuente)"><title>Adolescente varón con hemartrosis tras un trauma, TTPa prolongado, plaquetas y agregación normales: hemofilia A (la más frecuente)</title><rect x="0.75" y="0.75" width="998.5" height="1191.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Coagulopatías hereditarias</tspan></text><rect x="359.9" y="32.0" width="135.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="427.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="119"><tspan x="427.6" dy="0">HEMATOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hemofilias</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ligadas al X (varones): A = déficit de factor VIII (85 %), B = factor IX.</tspan><tspan x="58.0" dy="17">Sangrados profundos (hemartrosis, hematomas musculares); TTPa prolongado con TP y</tspan><tspan x="58.0" dy="17">plaquetas normales.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 16 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Trauma de rodilla con dolor intenso; gran aumento de</tspan><tspan x="640.0" dy="16">volumen.</tspan><tspan x="640.0" dy="16">Hb 11, TTPa 58 s, plaquetas 230 000, agregación</tspan><tspan x="640.0" dy="16">normal; eco: gran hematoma.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PRUEBAS DE COAGULACIÓN: ¿DÓNDE ESTÁ LA FALLA?</tspan></text><rect x="40.0" y="301.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="323.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="130"><tspan x="54.0" dy="0">TTPA</tspan></text><text x="382.5" y="323.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="365"><tspan x="382.5" dy="0">TP normal</tspan></text><text x="767.5" y="323.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="365"><tspan x="767.5" dy="0">TP prolongado</tspan></text><rect x="40.0" y="341.0" width="144.0" height="57.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="367.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="122"><tspan x="54.0" dy="0">Prolongado</tspan></text><text x="54.0" y="384.0" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="122"><tspan x="54.0" dy="0">Vía intrínseca</tspan></text><rect x="193.0" y="341.0" width="379.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="205.0" y="366.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="361"><tspan x="205.0" dy="0">HEMOFILIA A o B (o von Willebrand)</tspan></text><text x="205.0" y="382.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="361"><tspan x="205.0" dy="0">Varón + hemartrosis: A</tspan></text><rect x="471.2" y="330.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="516.6" y="345.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="516.6" dy="0">◆ ESTE CASO</tspan></text><rect x="578.0" y="341.0" width="379.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="590.0" y="373.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="361"><tspan x="590.0" dy="0">Vía común, hepatopatía, CID</tspan></text><rect x="40.0" y="404.0" width="144.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="437.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="122"><tspan x="54.0" dy="0">Normal</tspan></text><rect x="193.0" y="404.0" width="379.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="205.0" y="429.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="361"><tspan x="205.0" dy="0">Plaquetas o vasos</tspan></text><text x="205.0" y="445.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="361"><tspan x="205.0" dy="0">Si sangra</tspan></text><rect x="578.0" y="404.0" width="379.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="590.0" y="436.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="361"><tspan x="590.0" dy="0">Factor VII, warfarina</tspan></text><text x="44.0" y="483.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Agregación normal: no es von Willebrand ni trombopatía.</tspan></text><text x="40.0" y="531.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="543.0" width="920.0" height="323.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="557.0" width="278.3" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="195.1" y="577.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="195.1" dy="0">GRAVEDAD DE LA HEMOFILIA (WFH)</tspan></text><text x="350.3" y="577.0" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="592"><tspan x="350.3" dy="0">Por el nivel de factor VIII (A) o IX (B).</tspan></text><rect x="56.0" y="617.0" width="288.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="617.6" width="286.8" height="63.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="200.0" y="645.0" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="272"><tspan x="200.0" dy="0">5-40 %</tspan></text><text x="200.0" y="665.0" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="264"><tspan x="200.0" dy="0">Leve</tspan></text><circle cx="72.0" cy="690.0" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="694.0" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="82.0" dy="0">Sangra con cirugía o trauma</tspan></text><rect x="356.0" y="617.0" width="288.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="356.6" y="617.6" width="286.8" height="63.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="500.0" y="645.0" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="272"><tspan x="500.0" dy="0">1-5 %</tspan></text><text x="500.0" y="665.0" font-size="14" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="264"><tspan x="500.0" dy="0">Moderada</tspan></text><circle cx="372.0" cy="690.0" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="382.0" y="694.0" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="382.0" dy="0">Sangra con traumas leves</tspan></text><rect x="656.0" y="617.0" width="288.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="656.6" y="617.6" width="286.8" height="63.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="800.0" y="645.0" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="272"><tspan x="800.0" dy="0">&lt; 1 %</tspan></text><text x="800.0" y="665.0" font-size="14" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="264"><tspan x="800.0" dy="0">Grave</tspan></text><circle cx="672.0" cy="690.0" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="682.0" y="694.0" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="682.0" dy="0">Hemartrosis espontáneas</tspan></text><text x="56.0" y="745.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="754.0" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="769.0" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="769.0" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Hemartrosis tras trauma</tspan></text><rect x="56.0" y="776.0" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="791.0" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="791.0" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">El nivel de factor VIII aún no se mide</tspan></text><rect x="56.0" y="813.0" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="836.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Dosar factor VIII y IX; reponer factor; no AINE ni inyecciones IM.</tspan></text><text x="40.0" y="906.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="916.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="947.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="947.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hemofilia B</tspan></text><text x="435.0" y="938.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Deficiencia de</tspan><tspan x="435.0" dy="17">proteína C y S</tspan></text><text x="585.0" y="938.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Enfermedad de von</tspan><tspan x="585.0" dy="17">Willebrand</tspan></text><rect x="663.0" y="919.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="947.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hemofilia A</tspan></text><text x="885.0" y="938.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Trombocitopenia</tspan><tspan x="885.0" dy="17">inmune</tspan></text><rect x="40.0" y="970.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="970.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="999.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="991.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Igual de laboratorio,</tspan><tspan x="285.0" dy="16">pero menos frecuente</tspan></text><text x="435.0" y="999.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: trombosis</tspan></text><text x="585.0" y="991.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: mucosas,</tspan><tspan x="585.0" dy="16">agregación alterada</tspan></text><text x="735.0" y="999.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: la más frecuente</tspan></text><text x="885.0" y="991.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: plaquetas</tspan><tspan x="885.0" dy="16">normales</tspan></text><rect x="40.0" y="916.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1044.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1072.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1094.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Dosar factor VIII y IX para confirmar y graduar (grave &lt; 1 %).</tspan><tspan x="58.0" dy="18">• Reponer factor VIII (o emicizumab en profilaxis); hielo, reposo; no AINE ni inyecciones IM.</tspan><tspan x="58.0" dy="18">• Von Willebrand: sangrado de mucosas y agregación con ristocetina alterada.</tspan></text><text x="58.0" y="1152.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: WFH, guías de manejo de la hemofilia (3.ª ed., 2020; act. 2025); ISTH (2024); Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>