<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="855" viewBox="0 0 1000 855" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La reacción acrosómica ocurre en la zona pelúcida, antes de la fusión con el ovocito"><title>La reacción acrosómica ocurre en la zona pelúcida, antes de la fusión con el ovocito</title><rect x="0.75" y="0.75" width="998.5" height="853.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Embriología · fecundación</tspan></text><rect x="356.5" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="428.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="428.4" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Fecundación</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ocurre en la ampolla de la trompa de Falopio.</tspan><tspan x="58.0" dy="17">Capacitación, unión a la zona pelúcida, reacción acrosómica, fusión y pronúcleos.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuándo se induce la reacción acrosómica?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ORDEN DE LOS EVENTOS DE LA FECUNDACIÓN</tspan></text><rect x="42.0" y="263.0" width="226.0" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="155.0" y="288.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="155.0" dy="0">ANTES</tspan></text><text x="155.0" y="307.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="155.0" dy="0">En el tracto femenino</tspan></text><rect x="272.0" y="263.0" width="226.0" height="56.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="385.0" y="288.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="210"><tspan x="385.0" dy="0">PRIMER CONTACTO</tspan></text><text x="385.0" y="307.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="385.0" dy="0">Zona pelúcida</tspan></text><rect x="502.0" y="263.0" width="226.0" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="288.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="615.0" dy="0">DESPUÉS</tspan></text><text x="615.0" y="307.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="615.0" dy="0">Fusión con el ovocito</tspan></text><rect x="732.0" y="263.0" width="226.0" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="845.0" y="288.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="845.0" dy="0">MÁS TARDE</tspan></text><text x="845.0" y="307.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="845.0" dy="0">Antes de la mitosis</tspan></text><rect x="339.6" y="252.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="385.0" y="267.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="385.0" dy="0">◆ ESTE CASO</tspan></text><rect x="48.0" y="333.0" width="214.0" height="108.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="155.0" y="370.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="155.0" dy="0">CAPACITACIÓN</tspan></text><text x="155.0" y="394.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="155.0" dy="0">Se pierde el glucocálix</tspan><tspan x="155.0" dy="17">Cruza la corona radiada</tspan></text><rect x="278.0" y="333.0" width="214.0" height="108.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="385.0" y="361.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="186"><tspan x="385.0" dy="0">REACCIÓN ACROSÓMICA</tspan></text><text x="385.0" y="385.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="186"><tspan x="385.0" dy="0">ZP3 la desencadena</tspan><tspan x="385.0" dy="17">Libera hialuronidasa y acrosina</tspan><tspan x="385.0" dy="17">Digiere la zona pelúcida</tspan></text><rect x="508.0" y="333.0" width="214.0" height="108.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="615.0" y="361.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="615.0" dy="0">REACCIÓN CORTICAL</tspan></text><text x="615.0" y="385.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="615.0" dy="0">Modifica ZP2</tspan><tspan x="615.0" dy="17">Bloquea la polispermia</tspan><tspan x="615.0" dy="17">Se reanuda la meiosis II</tspan></text><rect x="738.0" y="333.0" width="214.0" height="108.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="845.0" y="361.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="845.0" dy="0">PRONÚCLEOS</tspan></text><text x="845.0" y="385.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="845.0" dy="0">Masculino y femenino</tspan><tspan x="845.0" dy="17">Segundo corpúsculo polar</tspan><tspan x="845.0" dy="17">Cigoto</tspan></text><text x="40.0" y="481.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="491.2" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="530.7" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="494.2" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="522.2" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Luego que penetra</tspan><tspan x="285.0" dy="17">la zona pelúcida</tspan></text><text x="435.0" y="522.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Al formarse el</tspan><tspan x="435.0" dy="17">pronúcleo femenino</tspan></text><text x="585.0" y="522.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Con el segundo</tspan><tspan x="585.0" dy="17">corpúsculo polar</tspan></text><text x="735.0" y="513.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Tras formarse el</tspan><tspan x="735.0" dy="17">pronúcleo</tspan><tspan x="735.0" dy="17">masculino</tspan></text><text x="885.0" y="513.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Tras reanudar la</tspan><tspan x="885.0" dy="17">segunda división</tspan><tspan x="885.0" dy="17">meiótica</tspan></text><rect x="40.0" y="562.2" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="562.2" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="599.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Cuándo se induce?</tspan></text><text x="285.0" y="583.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: al contactar y</tspan><tspan x="285.0" dy="16">atravesar la zona</tspan><tspan x="285.0" dy="16">pelúcida</tspan></text><text x="435.0" y="591.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: ocurre después de</tspan><tspan x="435.0" dy="16">la fusión</tspan></text><text x="585.0" y="583.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: aparece tras la</tspan><tspan x="585.0" dy="16">entrada del</tspan><tspan x="585.0" dy="16">espermatozoide</tspan></text><text x="735.0" y="591.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: los pronúcleos se</tspan><tspan x="735.0" dy="16">forman más tarde</tspan></text><text x="885.0" y="583.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es posterior a la</tspan><tspan x="885.0" dy="16">entrada del</tspan><tspan x="885.0" dy="16">espermatozoide</tspan></text><rect x="40.0" y="491.2" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="652.2" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="680.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="702.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Capacitación en el tracto femenino: se pierden proteínas del glucocálix y el espermatozoide puede reaccionar; luego cruza la corona radiada.</tspan><tspan x="58.0" dy="18">• Reacción acrosómica: la membrana plasmática se fusiona con la acrosómica externa y libera hialuronidasa y acrosina, que digieren la zona pelúcida; la</tspan><tspan x="58.0" dy="18">   desencadena la glucoproteína ZP3 al unirse a su receptor.</tspan><tspan x="58.0" dy="18">• Después: fusión de membranas, reacción cortical (modifica ZP2 y bloquea la polispermia), reanudación de la meiosis II, segundo corpúsculo polar y</tspan><tspan x="58.0" dy="18">   pronúcleos.</tspan><tspan x="58.0" dy="18">• Perla: la inyección intracitoplasmática de espermatozoides salta este paso en la infertilidad masculina grave.</tspan></text><text x="58.0" y="814.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Langman, Embriología médica 14.ª ed. (2019); Moore, Embriología clínica 11.ª ed. (2020).</tspan></text></svg>