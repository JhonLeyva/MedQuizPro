<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="852" viewBox="0 0 1000 852" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Multípara de 39 semanas en expulsivo (dilatación completa) con presentación de nalgas puras y partos vaginales previos: atención del parto vaginal"><title>Multípara de 39 semanas en expulsivo (dilatación completa) con presentación de nalgas puras y partos vaginales previos: atención del parto vaginal</title><rect x="0.75" y="0.75" width="998.5" height="850.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Presentación podálica</tspan></text><rect x="332.6" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="419.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="419.8" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Parto en podálica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Lo ideal: versión cefálica externa a las 36-37 semanas o cesárea programada.</tspan><tspan x="58.0" dy="17">Pero en expulsivo (dilatación completa), multípara con pelvis probada y feto no grande, el</tspan><tspan x="58.0" dy="17">parto vaginal asistido es lo seguro: la cesárea en ese momento no da ventaja.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Multigesta de 39 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">En trabajo de parto: dilatación completa, nalgas puras.</tspan><tspan x="640.0" dy="16">AU 29 cm (feto pequeño); 2 partos vaginales previos</tspan><tspan x="640.0" dy="16">de 3200 g.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PODÁLICA: ¿PARTO VAGINAL O CESÁREA?</tspan></text><rect x="40.0" y="285.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="307.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="160"><tspan x="54.0" dy="0">MOMENTO</tspan></text><text x="405.0" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="350"><tspan x="405.0" dy="0">Multípara, pelvis probada, feto no grande</tspan></text><text x="775.0" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="350"><tspan x="775.0" dy="0">Primigesta o feto grande</tspan></text><rect x="40.0" y="325.0" width="174.0" height="74.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="351.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="152"><tspan x="54.0" dy="0">Expulsivo (dilatación</tspan><tspan x="54.0" dy="17">completa)</tspan></text><text x="54.0" y="385.0" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="152"><tspan x="54.0" dy="0">Este caso</tspan></text><rect x="223.0" y="325.0" width="364.0" height="74.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="235.0" y="358.5" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="346"><tspan x="235.0" dy="0">PARTO VAGINAL ASISTIDO</tspan></text><text x="235.0" y="374.5" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="346"><tspan x="235.0" dy="0">Bracht, Mauriceau</tspan></text><rect x="486.2" y="314.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="531.6" y="329.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="531.6" dy="0">◆ ESTE CASO</tspan></text><rect x="593.0" y="325.0" width="364.0" height="74.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="605.0" y="358.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="346"><tspan x="605.0" dy="0">Cesárea</tspan></text><text x="605.0" y="374.5" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="346"><tspan x="605.0" dy="0">Si no hay contraindicación de tiempo</tspan></text><rect x="40.0" y="405.0" width="174.0" height="74.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="431.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="152"><tspan x="54.0" dy="0">Antes del trabajo de</tspan><tspan x="54.0" dy="17">parto</tspan></text><text x="54.0" y="465.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="152"><tspan x="54.0" dy="0">36-37 semanas</tspan></text><rect x="223.0" y="405.0" width="364.0" height="74.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="235.0" y="438.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="346"><tspan x="235.0" dy="0">Versión cefálica externa</tspan></text><text x="235.0" y="454.5" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="346"><tspan x="235.0" dy="0">O cesárea programada</tspan></text><rect x="593.0" y="405.0" width="364.0" height="74.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="605.0" y="446.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="346"><tspan x="605.0" dy="0">Cesárea programada</tspan></text><text x="44.0" y="501.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">AU de 29 cm sugiere feto pequeño: favorece el parto vaginal.</tspan></text><text x="40.0" y="549.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="559.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="590.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="581.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Parto</tspan><tspan x="285.0" dy="17">instrumentado</tspan></text><text x="435.0" y="581.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Atención de parto</tspan><tspan x="435.0" dy="17">por cesárea</tspan></text><rect x="513.0" y="562.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="581.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Atención de parto</tspan><tspan x="585.0" dy="17">vaginal</tspan></text><text x="735.0" y="581.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Inducción con</tspan><tspan x="735.0" dy="17">oxitocina</tspan></text><text x="885.0" y="581.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Versión cefálica</tspan><tspan x="885.0" dy="17">externa</tspan></text><rect x="40.0" y="613.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="613.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="650.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Conducta?</tspan></text><text x="285.0" y="642.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no se usa fórceps</tspan><tspan x="285.0" dy="16">en la nalga</tspan></text><text x="435.0" y="642.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: ya está en</tspan><tspan x="435.0" dy="16">expulsivo</tspan></text><text x="585.0" y="634.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: expulsivo +</tspan><tspan x="585.0" dy="16">multípara con pelvis</tspan><tspan x="585.0" dy="16">probada</tspan></text><text x="735.0" y="642.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: ya está en</tspan><tspan x="735.0" dy="16">expulsivo</tspan></text><text x="885.0" y="642.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: contraindicada en</tspan><tspan x="885.0" dy="16">trabajo de parto</tspan></text><rect x="40.0" y="559.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="703.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="731.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="753.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Parto vaginal asistido por personal entrenado: no traccionar hasta ver la punta de las escápulas (maniobra de Bracht o Mauriceau).</tspan><tspan x="58.0" dy="18">• Preparado para cesárea de urgencia y con neonatología presente.</tspan><tspan x="58.0" dy="18">• Contraindicaciones del vaginal: feto &gt; 3800 g, hiperextensión de la cabeza, pelvis estrecha, podálica completa/de pie.</tspan></text><text x="58.0" y="811.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG n.º 745 (2018); RCOG Green-top n.º 20b (2017).</tspan></text></svg>