<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1167" viewBox="0 0 1000 1167" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Bocio difuso en un agricultor de Huancavelica, no aislado: el programa de salud pública es promover la sal yodada"><title>Bocio difuso en un agricultor de Huancavelica, no aislado: el programa de salud pública es promover la sal yodada</title><rect x="0.75" y="0.75" width="998.5" height="1165.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Deficiencia de yodo · bocio endémico</tspan></text><rect x="422.1" y="32.0" width="143.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="493.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="127"><tspan x="493.9" dy="0">SALUD PÚBLICA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Bocio endémico</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">En la sierra y la selva el suelo y el agua tienen poco yodo: la tiroides crece para atrapar</tspan><tspan x="58.0" dy="17">más.</tspan><tspan x="58.0" dy="17">La yodación universal de la sal es la medida más eficaz y barata para toda la población.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Agricultor de 50 años, Huancavelica</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Aumento de volumen cervical anterior, blando, sin</tspan><tspan x="640.0" dy="16">nódulos ni dolor.</tspan><tspan x="640.0" dy="16">No es un caso aislado.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE MIDE LA FALTA DE YODO EN UNA POBLACIÓN</tspan></text><rect x="40.0" y="285.0" width="920.0" height="191.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="311.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Yoduria mediana en escolares (µg/L) · OMS</tspan></text><text x="60.0" y="330.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Se mide en la orina de los escolares de la zona.</tspan></text><rect x="70.0" y="360.0" width="57.3" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="98.7" y="385.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="47"><tspan x="98.7" dy="0">Grave</tspan></text><rect x="127.3" y="360.0" width="86.0" height="40.0" rx="6" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/><text x="170.3" y="385.0" font-size="12" font-weight="800" font-style="normal" fill="#c2410c" text-anchor="middle" data-max="76"><tspan x="170.3" dy="0">Moderada</tspan></text><rect x="213.3" y="360.0" width="143.3" height="40.0" rx="6" fill="#fef9c3" stroke="#ffffff" stroke-width="2"/><text x="285.0" y="385.0" font-size="12" font-weight="800" font-style="normal" fill="#a16207" text-anchor="middle" data-max="133"><tspan x="285.0" dy="0">Leve</tspan></text><rect x="356.7" y="360.0" width="286.7" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="500.0" y="385.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="277"><tspan x="500.0" dy="0">Adecuado</tspan></text><rect x="643.3" y="360.0" width="286.7" height="40.0" rx="6" fill="#fef9c3" stroke="#ffffff" stroke-width="2"/><text x="786.7" y="385.0" font-size="12" font-weight="800" font-style="normal" fill="#a16207" text-anchor="middle" data-max="277"><tspan x="786.7" dy="0">Más que adecuado</tspan></text><line x1="127.3" y1="400.0" x2="127.3" y2="408.0" stroke="#64748b" stroke-width="1.5"/><text x="127.3" y="422.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="127.3" dy="0">20</tspan></text><line x1="213.3" y1="400.0" x2="213.3" y2="408.0" stroke="#64748b" stroke-width="1.5"/><text x="213.3" y="422.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="213.3" dy="0">50</tspan></text><line x1="356.7" y1="400.0" x2="356.7" y2="408.0" stroke="#64748b" stroke-width="1.5"/><text x="356.7" y="422.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="356.7" dy="0">100</tspan></text><line x1="643.3" y1="400.0" x2="643.3" y2="408.0" stroke="#64748b" stroke-width="1.5"/><text x="643.3" y="422.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="643.3" dy="0">200</tspan></text><line x1="930.0" y1="400.0" x2="930.0" y2="408.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="422.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">300</tspan></text><rect x="60.0" y="434.0" width="880.0" height="30.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/><text x="500.0" y="454.0" font-size="11.5" font-weight="700" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Este caso: bocio en varios pobladores → deficiencia → sal yodada</tspan></text><text x="40.0" y="516.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="528.0" width="318.0" height="295.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="538.0" width="152.9" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="552.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="276"><tspan x="61.0" dy="0">QUÉ LE PASA AL CUELLO</tspan></text><g data-box="54.0 566.0 290.0 220.0"><g transform="translate(54.0,566.0) scale(0.95)"><ellipse cx="150" cy="115" rx="140" ry="104" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><text x="150" y="222" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">corte del cuello (visto desde abajo)</text><ellipse cx="150" cy="180" rx="22" ry="18" fill="#e7e5e4" stroke="#78716c" stroke-width="2" /><text x="150" y="184" font-size="9.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">vértebra</text><text x="150" y="184" font-size="9.5" font-weight="800" fill="#57534e" text-anchor="middle" data-max="0">vértebra</text><ellipse cx="150" cy="146" rx="14" ry="9" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5" /><path d="M100 96 C96 76 128 72 138 90 L162 90 C172 72 204 76 200 96 C196 116 170 118 162 108 L138 108 C130 118 104 116 100 96 Z" fill="#fda4af" stroke="#be123c" stroke-width="2" stroke-linejoin="round" /><circle cx="150" cy="98" r="14" fill="#e0f2fe" stroke="#0369a1" stroke-width="3" /><text x="150" y="70" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">tráquea</text><text x="150" y="70" font-size="10" font-weight="800" fill="#075985" text-anchor="middle" data-max="0">tráquea</text></g></g><text x="54.0" y="804.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="290"><tspan x="54.0" dy="0">Bocio por déficit de yodo</tspan></text><rect x="378.0" y="528.0" width="582.0" height="93.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="400.0" cy="574.5" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="400.0" y="578.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="400.0" dy="0">1</tspan></text><text x="422.0" y="568.5" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="522"><tspan x="422.0" dy="0">Tiroides grande y blanda</tspan></text><text x="422.0" y="590.0" font-size="12.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="522"><tspan x="422.0" dy="0">Crece para captar más yodo.</tspan></text><rect x="378.0" y="629.0" width="582.0" height="93.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="400.0" cy="675.5" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="400.0" y="679.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="400.0" dy="0">2</tspan></text><text x="422.0" y="669.5" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="522"><tspan x="422.0" dy="0">Sin nódulos ni dolor</tspan></text><text x="422.0" y="691.0" font-size="12.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="522"><tspan x="422.0" dy="0">Bocio difuso simple.</tspan></text><rect x="378.0" y="730.0" width="582.0" height="93.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="400.0" cy="776.5" r="11" fill="#ea580c" stroke="none" stroke-width="0"/><text x="400.0" y="780.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="400.0" dy="0">3</tspan></text><text x="422.0" y="770.5" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="522"><tspan x="422.0" dy="0">Prevenible</tspan></text><text x="422.0" y="792.0" font-size="12.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="522"><tspan x="422.0" dy="0">Con sal yodada toda la vida.</tspan></text><text x="40.0" y="863.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="873.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="912.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="876.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="904.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Promocionar la sal</tspan><tspan x="285.0" dy="17">yodada</tspan></text><text x="435.0" y="904.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Promocionar el</tspan><tspan x="435.0" dy="17">aceite yodado</tspan></text><text x="585.0" y="895.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Retirar de la dieta</tspan><tspan x="585.0" dy="17">alimentos</tspan><tspan x="585.0" dy="17">bociógenos</tspan></text><text x="735.0" y="912.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Potabilizar el agua</tspan></text><text x="885.0" y="904.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Levotiroxina a toda</tspan><tspan x="885.0" dy="17">la población</tspan></text><rect x="40.0" y="944.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="944.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="973.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Programa?</tspan></text><text x="285.0" y="965.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: yodación universal</tspan><tspan x="285.0" dy="16">de la sal</tspan></text><text x="435.0" y="965.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Solo para grupos sin</tspan><tspan x="435.0" dy="16">acceso a sal yodada</tspan></text><text x="585.0" y="965.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: el problema es la</tspan><tspan x="585.0" dy="16">falta de yodo</tspan></text><text x="735.0" y="973.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no aporta yodo</tspan></text><text x="885.0" y="965.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no se trata a toda</tspan><tspan x="885.0" dy="16">la población</tspan></text><rect x="40.0" y="873.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1018.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1046.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1068.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Sal yodada para toda la población (30-40 ppm en el Perú) y vigilancia de la yoduria en escolares.</tspan><tspan x="58.0" dy="18">• Aceite yodado: solo para grupos de riesgo donde no llega la sal.</tspan><tspan x="58.0" dy="18">• No dar levotiroxina a toda la población; en el individuo: TSH y ecografía.</tspan></text><text x="58.0" y="1126.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS/UNICEF/IGN, eliminación de los trastornos por deficiencia de yodo (2007); MINSA Perú.</tspan></text></svg>