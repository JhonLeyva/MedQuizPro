<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1347" viewBox="0 0 1000 1347" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Paciente de zona endémica con fiebre, dolor retroocular, dolor abdominal intenso y vómitos: probable dengue con signos de alarma"><title>Paciente de zona endémica con fiebre, dolor retroocular, dolor abdominal intenso y vómitos: probable dengue con signos de alarma</title><rect x="0.75" y="0.75" width="998.5" height="1346.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Enfermedades metaxénicas · dengue</tspan></text><rect x="418.8" y="32.0" width="136.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="487.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="121"><tspan x="487.1" dy="0">INFECTOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Dengue con signos de alarma</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Al bajar la fiebre (días 3-7) aumenta la fuga de plasma.</tspan><tspan x="58.0" dy="17">Dolor abdominal intenso y vómitos persistentes anuncian el choque: es el grupo B2.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Paciente de 45 años, distrito endémico</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Fiebre persistente y dolor retroocular.</tspan><tspan x="640.0" dy="16">Dolor abdominal intenso y vómitos.</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#94a3b8"/><line x1="500.0" y1="361.0" x2="500.0" y2="391.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="391.0" x2="733.5" y2="391.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="391.0" x2="266.5" y2="420.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,419.0 271.5,419.0 266.5,427.0" fill="#94a3b8"/><line x1="733.5" y1="391.0" x2="733.5" y2="420.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,419.0 738.5,419.0 733.5,427.0" fill="#94a3b8"/><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#0f766e"/><line x1="500.0" y1="361.0" x2="500.0" y2="391.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="391.0" x2="500.0" y2="391.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="391.0" x2="266.5" y2="420.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,419.0 271.5,419.0 266.5,427.0" fill="#0f766e"/><rect x="225.0" y="400.0" width="83.0" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="412.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Sí (este caso)</tspan></text><rect x="719.4" y="400.0" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="412.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">No</tspan></text><polygon points="240.0,326.0 266.0,291.0 734.0,291.0 760.0,326.0 734.0,361.0 266.0,361.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="326.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="331.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="322.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Dengue probable: ¿dolor abdominal intenso o vómitos</tspan><tspan x="519.0" dy="17">persistentes?</tspan></text><rect x="40.0" y="427.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="455.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">CON SIGNOS DE ALARMA</tspan></text><text x="266.5" y="478.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Hospitalizar</tspan><tspan x="266.5" dy="17">Cristaloides EV</tspan></text><rect x="507.0" y="427.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="463.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Sin signos de alarma</tspan></text><text x="733.5" y="486.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">En casa, hidratación oral</tspan></text><text x="40.0" y="557.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="569.5" width="920.0" height="434.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="583.5" width="311.8" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="211.9" y="603.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.9" dy="0">CLASIFICACIÓN DEL DENGUE (OPS/OMS)</tspan></text><text x="383.8" y="595.0" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="558"><tspan x="383.8" dy="0">Ordena el dengue por gravedad; el MINSA la usa para decidir dónde tratar (grupos A, B1, B2</tspan><tspan x="383.8" dy="17">y C).</tspan></text><rect x="56.0" y="647.5" width="288.0" height="183.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="648.1" width="286.8" height="63.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="200.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="272"><tspan x="200.0" dy="0">GRUPOS A Y B1</tspan></text><text x="200.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="264"><tspan x="200.0" dy="0">Dengue sin signos de alarma</tspan></text><circle cx="72.0" cy="720.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="724.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="82.0" dy="0">Fiebre + 2 de: náuseas, exantema, mialgias,</tspan><tspan x="82.0" dy="16">cefalea o dolor retroocular, petequias,</tspan><tspan x="82.0" dy="16">leucopenia</tspan></text><circle cx="72.0" cy="775.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="779.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="82.0" dy="0">A: en casa · B1: observar si hay comorbilidad</tspan><tspan x="82.0" dy="16">o riesgo social</tspan></text><rect x="356.0" y="647.5" width="288.0" height="183.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="357.2" y="648.7" width="285.6" height="63.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="500.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="272"><tspan x="500.0" dy="0">GRUPO B2</tspan></text><text x="500.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="264"><tspan x="500.0" dy="0">Dengue con signos de alarma</tspan></text><circle cx="372.0" cy="720.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="382.0" y="724.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="250"><tspan x="382.0" dy="0">Dolor abdominal intenso y continuo</tspan></text><circle cx="372.0" cy="743.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="382.0" y="747.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="250"><tspan x="382.0" dy="0">Vómitos persistentes</tspan></text><circle cx="372.0" cy="766.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="382.0" y="770.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="250"><tspan x="382.0" dy="0">Líquido acumulado o sangrado de mucosas</tspan></text><circle cx="372.0" cy="789.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="382.0" y="793.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="250"><tspan x="382.0" dy="0">Letargia, hepatomegalia o hematocrito que</tspan><tspan x="382.0" dy="16">sube</tspan></text><rect x="454.6" y="636.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="500.0" y="651.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">◆ ESTE CASO</tspan></text><rect x="656.0" y="647.5" width="288.0" height="183.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="656.6" y="648.1" width="286.8" height="63.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="800.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="272"><tspan x="800.0" dy="0">GRUPO C</tspan></text><text x="800.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="264"><tspan x="800.0" dy="0">Dengue grave</tspan></text><circle cx="672.0" cy="720.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="682.0" y="724.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="682.0" dy="0">Choque o dificultad respiratoria por fuga de</tspan><tspan x="682.0" dy="16">plasma</tspan></text><circle cx="672.0" cy="759.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="682.0" y="763.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="682.0" dy="0">Sangrado grave</tspan></text><circle cx="672.0" cy="782.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="682.0" y="786.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="682.0" dy="0">Daño grave de órganos</tspan></text><text x="56.0" y="860.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="869.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="884.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="884.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Dolor abdominal intenso</tspan></text><rect x="56.0" y="891.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="906.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="906.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Vómitos</tspan></text><rect x="56.0" y="913.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="928.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="928.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Sin choque ni sangrado grave</tspan></text><rect x="56.0" y="950.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="973.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Grupo B2: hospitalizar, cristaloides y control de hematocrito.</tspan></text><text x="40.0" y="1043.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1053.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1093.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1084.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Brote epidémico</tspan><tspan x="285.0" dy="17">por dengue</tspan></text><text x="435.0" y="1084.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Sospechoso de</tspan><tspan x="435.0" dy="17">dengue clásico</tspan></text><text x="585.0" y="1084.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Síndrome de</tspan><tspan x="585.0" dy="17">choque por dengue</tspan></text><rect x="663.0" y="1056.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="1076.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Probable dengue</tspan><tspan x="735.0" dy="17">con signos de</tspan><tspan x="735.0" dy="17">alarma</tspan></text><text x="885.0" y="1093.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Dengue grave</tspan></text><rect x="40.0" y="1124.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="1124.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1153.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Clasificación?</tspan></text><text x="285.0" y="1145.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es para grupos de</tspan><tspan x="285.0" dy="16">casos</tspan></text><text x="435.0" y="1145.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: término antiguo;</tspan><tspan x="435.0" dy="16">hay alarma</tspan></text><text x="585.0" y="1153.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no hay choque</tspan></text><text x="735.0" y="1145.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: con signos de</tspan><tspan x="735.0" dy="16">alarma</tspan></text><text x="885.0" y="1145.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: sin choque ni</tspan><tspan x="885.0" dy="16">sangrado grave</tspan></text><rect x="40.0" y="1053.5" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1198.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1226.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1248.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• «Probable»: cuadro compatible + zona con transmisión; «confirmado»: NS1, PCR o IgM.</tspan><tspan x="58.0" dy="18">• Grupo B2: hospitalizar, cristaloides EV y hematocrito seriado.</tspan><tspan x="58.0" dy="18">• No dar AINE ni corticoides; paracetamol para la fiebre.</tspan></text><text x="58.0" y="1306.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OPS, guía de dengue (2016, act. 2022); MINSA Perú, NTS de atención del dengue (2024).</tspan></text></svg>