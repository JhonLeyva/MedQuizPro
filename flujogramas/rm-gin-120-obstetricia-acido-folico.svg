<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1130" viewBox="0 0 1000 1130" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El ácido fólico antes de la concepción reduce los defectos del tubo neural, como la espina bífida"><title>El ácido fólico antes de la concepción reduce los defectos del tubo neural, como la espina bífida</title><rect x="0.75" y="0.75" width="998.5" height="1128.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · ácido fólico</tspan></text><rect x="345.6" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="425.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="425.3" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ácido fólico</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Participa en la síntesis de nucleótidos y la metilación necesarias para el cierre del tubo</tspan><tspan x="58.0" dy="17">neural, entre los días 21 y 28 tras la concepción.</tspan><tspan x="58.0" dy="17">Se inicia al menos un mes antes y se continúa hasta la semana 12.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de prevención</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué incidencia reduce el suplemento de folatos antes</tspan><tspan x="640.0" dy="16">de la concepción?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DOSIS DE ÁCIDO FÓLICO ANTES DE LA CONCEPCIÓN Y QUÉ PREVIENE</tspan></text><rect x="40.0" y="269.0" width="170.0" height="110.0" rx="16" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="125.0" y="295.0" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="150"><tspan x="125.0" dy="0">PESO DEL CASO</tspan></text><text x="125.0" y="331.0" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Mujer</tspan></text><text x="125.0" y="353.0" font-size="11" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="146"><tspan x="125.0" dy="0">1 mes antes</tspan></text><line x1="214.0" y1="324.0" x2="229.0" y2="324.0" stroke="#0f766e" stroke-width="2"/><polygon points="228.0,319.0 228.0,329.0 236.0,324.0" fill="#0f766e"/><rect x="240.0" y="269.0" width="213.3" height="110.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="346.7" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="197"><tspan x="346.7" dy="0">RIESGO HABITUAL</tspan></text><text x="346.7" y="325.0" font-size="22" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="197"><tspan x="346.7" dy="0">0,4 a 0,8 mg al día</tspan></text><text x="346.7" y="347.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="193"><tspan x="346.7" dy="0">Desde 1 mes antes hasta la</tspan><tspan x="346.7" dy="15">semana 12</tspan></text><text x="473.3" y="335.0" font-size="30" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="40"><tspan x="473.3" dy="0">×</tspan></text><rect x="493.3" y="269.0" width="213.3" height="110.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="600.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="197"><tspan x="600.0" dy="0">HIJO PREVIO CON DTN</tspan></text><text x="600.0" y="325.0" font-size="22" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="197"><tspan x="600.0" dy="0">4 mg al día</tspan></text><text x="600.0" y="347.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="193"><tspan x="600.0" dy="0">Mismo periodo, con prescripción</tspan></text><text x="726.7" y="335.0" font-size="30" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="40"><tspan x="726.7" dy="0">=</tspan></text><rect x="746.7" y="269.0" width="213.3" height="110.0" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="853.3" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="197"><tspan x="853.3" dy="0">VALPROATO O DIABETES</tspan></text><text x="853.3" y="325.0" font-size="22" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="197"><tspan x="853.3" dy="0">4 mg al día</tspan></text><text x="853.3" y="347.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="193"><tspan x="853.3" dy="0">A menudo; obesidad grave o</tspan><tspan x="853.3" dy="15">carbamazepina: valorar</tspan></text><rect x="793.2" y="368.0" width="120.4" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="853.3" y="383.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="853.3" dy="0">◆ DOSIS DEL CASO</tspan></text><text x="44.0" y="415.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="44.0" dy="0">CADA ALTERNATIVA CONTRA EL CÁLCULO</tspan></text><rect x="40.0" y="425.0" width="176.0" height="90.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="128.0" y="443.0" font-size="9.5" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="160"><tspan x="128.0" dy="0">✓ COINCIDE</tspan></text><text x="128.0" y="461.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="128.0" dy="0">Espina bífida</tspan></text><text x="128.0" y="478.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="128.0" dy="0">Se previene</tspan></text><rect x="226.0" y="425.0" width="176.0" height="90.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="314.0" y="443.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="160"><tspan x="314.0" dy="0">✗ NO</tspan></text><text x="314.0" y="461.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="314.0" dy="0">Hipotiroidismo congénito</tspan></text><text x="314.0" y="478.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="314.0" dy="0">No se previene</tspan></text><rect x="412.0" y="425.0" width="176.0" height="90.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="443.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="160"><tspan x="500.0" dy="0">✗ NO</tspan></text><text x="500.0" y="461.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="500.0" dy="0">Trastornos metabólicos</tspan></text><text x="500.0" y="478.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="500.0" dy="0">No se previenen</tspan></text><rect x="598.0" y="425.0" width="176.0" height="90.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="686.0" y="443.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="160"><tspan x="686.0" dy="0">✗ NO</tspan></text><text x="686.0" y="461.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="686.0" dy="0">Macrosomía</tspan></text><text x="686.0" y="478.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="686.0" dy="0">No se reduce</tspan></text><rect x="784.0" y="425.0" width="176.0" height="90.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="872.0" y="443.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="160"><tspan x="872.0" dy="0">✗ NO</tspan></text><text x="872.0" y="461.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="872.0" dy="0">Fisura palatina y labio</tspan><tspan x="872.0" dy="17">leporino</tspan></text><text x="872.0" y="495.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="872.0" dy="0">Asociación inconsistente</tspan></text><rect x="40.0" y="533.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="559.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Folatos preconcepcionales = menos espina bífida</tspan></text><text x="60.0" y="578.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Hipotiroidismo congénito, metabolopatías y macrosomía no dependen de ellos.</tspan></text><text x="40.0" y="639.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEFECTOS DEL TUBO NEURAL Y DETECCIÓN</tspan></text><rect x="40.0" y="651.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="670.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Defecto</tspan></text><text x="260.0" y="670.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Qué es</tspan></text><text x="615.0" y="670.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Detección</tspan></text><rect x="40.0" y="680.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="699.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Espina bífida</tspan></text><text x="260.0" y="699.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Cierre incompleto del tubo neural caudal (este caso)</tspan></text><text x="615.0" y="699.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Alfafetoproteína elevada y ecografía morfológica</tspan></text><rect x="150.6" y="683.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="196.0" y="698.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="196.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="709.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="728.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Anencefalia</tspan></text><text x="260.0" y="728.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Falta de cierre del tubo neural craneal</tspan></text><text x="615.0" y="728.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Ecografía morfológica</tspan></text><rect x="40.0" y="738.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="757.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Encefalocele</tspan></text><text x="260.0" y="757.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Herniación del contenido craneal</tspan></text><text x="615.0" y="757.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Ecografía morfológica</tspan></text><text x="40.0" y="807.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="817.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="848.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="820.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="848.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Espina bífida</tspan></text><text x="435.0" y="839.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hipotiroidismo</tspan><tspan x="435.0" dy="17">congénito</tspan></text><text x="585.0" y="839.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Trastornos</tspan><tspan x="585.0" dy="17">metabólicos</tspan></text><text x="735.0" y="848.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Macrosomía</tspan></text><text x="885.0" y="839.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Fisura palatina y</tspan><tspan x="885.0" dy="17">labio leporino</tspan></text><rect x="40.0" y="871.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="871.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="892.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué reduce el</tspan><tspan x="54.0" dy="16">suplemento de folatos?</tspan></text><text x="285.0" y="892.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: defecto del tubo</tspan><tspan x="285.0" dy="16">neural</tspan></text><text x="435.0" y="892.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no depende de los</tspan><tspan x="435.0" dy="16">folatos</tspan></text><text x="585.0" y="892.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no depende de los</tspan><tspan x="585.0" dy="16">folatos</tspan></text><text x="735.0" y="892.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no reduce la</tspan><tspan x="735.0" dy="16">macrosomía</tspan></text><text x="885.0" y="892.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: asociación</tspan><tspan x="885.0" dy="16">inconsistente y menor</tspan></text><rect x="40.0" y="817.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="945.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="973.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="995.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Los ensayos y la fortificación de alimentos muestran que reduce los defectos del tubo neural: espina bífida, anencefalia y encefalocele.</tspan><tspan x="58.0" dy="18">• Dosis general: 0,4 a 0,8 mg diarios. Se recomiendan 4 mg al día con un hijo previo con defecto del tubo neural, y a menudo con valproato o</tspan><tspan x="58.0" dy="18">   carbamazepina, diabetes pregestacional u obesidad grave.</tspan><tspan x="58.0" dy="18">• No previene el hipotiroidismo congénito ni los trastornos metabólicos y no reduce la macrosomía; la asociación con fisura labiopalatina es inconsistente.</tspan><tspan x="58.0" dy="18">• Detección: alfafetoproteína elevada en el segundo trimestre y ecografía morfológica.</tspan></text><text x="58.0" y="1089.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: USPSTF, Ácido fólico para prevenir defectos del tubo neural (JAMA 2023); ACOG, Practice Bulletin N.º 187 (2017); Williams Obstetricia, 26.ª ed. (2022).</tspan></text></svg>