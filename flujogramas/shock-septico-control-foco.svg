<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1270" viewBox="0 0 1000 1270" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Choque séptico de origen abdominal con foco abordable: controlar el foco lo más pronto posible"><title>Choque séptico de origen abdominal con foco abordable: controlar el foco lo más pronto posible</title><rect x="0.75" y="0.75" width="998.5" height="1269.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Sepsis · control del foco</tspan></text><rect x="344.9" y="32.0" width="101.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="395.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="85"><tspan x="395.5" dy="0">CIRUGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Control del foco en la sepsis</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Drenar, desbridar o retirar lo infectado: sin eso, los antibióticos fracasan.</tspan><tspan x="58.0" dy="17">Se hace apenas sea posible, junto con la reanimación.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Paciente con choque séptico</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Origen abdominal.</tspan><tspan x="640.0" dy="16">Cirugía lo considera un foco abordable.</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#94a3b8"/><line x1="500.0" y1="349.0" x2="500.0" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="379.0" x2="733.5" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="379.0" x2="266.5" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,407.0 271.5,407.0 266.5,415.0" fill="#94a3b8"/><line x1="733.5" y1="379.0" x2="733.5" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,407.0 738.5,407.0 733.5,415.0" fill="#94a3b8"/><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#0f766e"/><line x1="500.0" y1="349.0" x2="500.0" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="379.0" x2="500.0" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="379.0" x2="266.5" y2="408.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,407.0 271.5,407.0 266.5,415.0" fill="#0f766e"/><rect x="201.2" y="388.0" width="130.5" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">En paralelo (este caso)</tspan></text><rect x="683.4" y="388.0" width="100.2" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Al mismo tiempo</tspan></text><polygon points="240.0,320.0 266.0,291.0 734.0,291.0 760.0,320.0 734.0,349.0 266.0,349.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="320.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="325.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="324.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Choque séptico con foco abdominal abordable</tspan></text><rect x="40.0" y="415.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">CONTROL DEL FOCO YA</tspan></text><text x="266.5" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Drenaje o cirugía</tspan><tspan x="266.5" dy="17">Con la reanimación en curso</tspan></text><rect x="507.0" y="415.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="451.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Antibiótico en la 1.ª hora</tspan></text><text x="733.5" y="474.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Cristaloides, noradrenalina</tspan></text><text x="40.0" y="545.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="557.5" width="920.0" height="369.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="571.5" width="218.6" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="165.3" y="591.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="165.3" dy="0">DEFINICIONES DE SEPSIS-3</tspan></text><text x="290.6" y="591.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="651"><tspan x="290.6" dy="0">Separan la sepsis del choque séptico por el soporte que necesita.</tspan></text><rect x="56.0" y="631.5" width="438.0" height="144.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="632.1" width="436.8" height="63.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="275.0" y="659.5" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="422"><tspan x="275.0" dy="0">SOFA ≥ 2</tspan></text><text x="275.0" y="679.5" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="414"><tspan x="275.0" dy="0">Sepsis</tspan></text><circle cx="72.0" cy="704.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="708.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="400"><tspan x="82.0" dy="0">Infección + daño de órganos</tspan></text><circle cx="72.0" cy="727.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="731.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="400"><tspan x="82.0" dy="0">qSOFA ayuda a sospecharla</tspan></text><rect x="506.0" y="631.5" width="438.0" height="144.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="507.2" y="632.7" width="435.6" height="63.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="725.0" y="659.5" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="422"><tspan x="725.0" dy="0">VASOPRESOR + LACTATO &gt; 2</tspan></text><text x="725.0" y="679.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="414"><tspan x="725.0" dy="0">Choque séptico</tspan></text><circle cx="522.0" cy="704.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="532.0" y="708.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="400"><tspan x="532.0" dy="0">PAM ≥ 65 solo con vasopresor</tspan></text><circle cx="522.0" cy="727.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="532.0" y="731.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="400"><tspan x="532.0" dy="0">Lactato &gt; 2 pese a líquidos</tspan></text><circle cx="522.0" cy="750.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="532.0" y="754.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="400"><tspan x="532.0" dy="0">Mortalidad &gt; 40 %</tspan></text><rect x="679.6" y="620.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="725.0" y="635.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="725.0" dy="0">◆ ESTE CASO</tspan></text><text x="56.0" y="805.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="814.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="829.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="829.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">El diagnóstico ya es choque séptico</tspan></text><rect x="56.0" y="836.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="851.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="851.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Foco abdominal abordable</tspan></text><rect x="56.0" y="873.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="896.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Antibiótico, líquidos, noradrenalina y control del foco lo antes posible.</tspan></text><text x="40.0" y="966.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="976.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1016.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1007.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Luego de 6-12</tspan><tspan x="285.0" dy="17">horas de terapia</tspan></text><text x="435.0" y="999.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Esperar que no</tspan><tspan x="435.0" dy="17">dependa de</tspan><tspan x="435.0" dy="17">vasopresores</tspan></text><text x="585.0" y="999.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Luego de al menos</tspan><tspan x="585.0" dy="17">dos dosis de</tspan><tspan x="585.0" dy="17">antibióticos</tspan></text><rect x="663.0" y="979.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="1007.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Lo más pronto</tspan><tspan x="735.0" dy="17">como sea posible</tspan></text><text x="885.0" y="1007.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Solo cuando el</tspan><tspan x="885.0" dy="17">paciente esté afebril</tspan></text><rect x="40.0" y="1047.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="1047.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1076.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Cuándo?</tspan></text><text x="285.0" y="1076.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Es el límite, no la meta</tspan></text><text x="435.0" y="1068.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: sin control del foco</tspan><tspan x="435.0" dy="16">no sale del choque</tspan></text><text x="585.0" y="1076.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: retrasa el control</tspan></text><text x="735.0" y="1076.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: apenas sea posible</tspan></text><text x="885.0" y="1068.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: la fiebre no es el</tspan><tspan x="885.0" dy="16">criterio</tspan></text><rect x="40.0" y="976.5" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1121.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1149.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1171.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Antibiótico en la primera hora, cristaloides 30 mL/kg si hay hipoperfusión y noradrenalina para PAM ≥ 65.</tspan><tspan x="58.0" dy="18">• Control del foco lo antes posible (idealmente en 6-12 horas); no esperar a que el paciente se estabilice del todo.</tspan><tspan x="58.0" dy="18">• Preferir lo menos invasivo que funcione (drenaje percutáneo antes que laparotomía si es posible).</tspan></text><text x="58.0" y="1229.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Surviving Sepsis Campaign 2021; WSES, infecciones intraabdominales (2017, act. 2021).</tspan></text></svg>