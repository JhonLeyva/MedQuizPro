<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1093" viewBox="0 0 1000 1093" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La anomalía cromosómica más frecuente del aborto del primer trimestre es la trisomía autosómica"><title>La anomalía cromosómica más frecuente del aborto del primer trimestre es la trisomía autosómica</title><rect x="0.75" y="0.75" width="998.5" height="1091.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · aborto espontáneo y cariotipo</tspan></text><rect x="453.6" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="533.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="533.3" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Aborto del primer trimestre</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cerca de la mitad tiene un cariotipo anormal del embrión.</tspan><tspan x="58.0" dy="17">El riesgo crece con la edad materna.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">La mayoría de abortos espontáneos del primer</tspan><tspan x="640.0" dy="16">trimestre se deben a anomalías cromosómicas.</tspan><tspan x="640.0" dy="16">¿Cuál es la más frecuente?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DE LA CAUSA MÁS FRECUENTE A LA MENOS FRECUENTE</tspan></text><polygon points="200.0,285.0 300.0,285.0 340.0,356.0 160.0,356.0" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="325.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="88"><tspan x="250.0" dy="0">Trisomías</tspan></text><rect x="486.0" y="285.0" width="474.0" height="71.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="501.0" y="309.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">≈ 50 % de los cariotipos anormales</tspan></text><text x="501.0" y="326.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Trisomías 16, 22, 21, 15 y 13; no disyunción en la meiosis I, más con la edad</tspan><tspan x="501.0" dy="16">materna</tspan></text><rect x="858.2" y="274.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="903.6" y="289.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="903.6" dy="0">◆ ESTE CASO</tspan></text><polygon points="160.0,362.0 340.0,362.0 380.0,433.0 120.0,433.0" fill="#99f6e4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="402.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="168"><tspan x="250.0" dy="0">Monosomía X (45,X)</tspan></text><rect x="486.0" y="362.0" width="474.0" height="71.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="394.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">15-20 %</tspan></text><text x="501.0" y="411.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Embrión que casi nunca llega a término; el síndrome de Turner es la excepción</tspan></text><polygon points="120.0,439.0 380.0,439.0 420.0,510.0 80.0,510.0" fill="#5eead4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="479.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="248"><tspan x="250.0" dy="0">Triploidía</tspan></text><rect x="486.0" y="439.0" width="474.0" height="71.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="471.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">≈ 15 %</tspan></text><text x="501.0" y="488.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Tres juegos de cromosomas; se asocia a mola parcial</tspan></text><polygon points="80.0,516.0 420.0,516.0 460.0,587.0 40.0,587.0" fill="#2dd4bf" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="556.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="328"><tspan x="250.0" dy="0">Reordenamientos y mosaicismo</tspan></text><rect x="486.0" y="516.0" width="474.0" height="71.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="548.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Pocos casos</tspan></text><text x="501.0" y="565.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Translocación equilibrada de un padre: aborto recurrente; mosaicismo, raro</tspan></text><text x="250.0" y="605.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="420"><tspan x="250.0" dy="0">▲ más frecuente · ▼ menos frecuente</tspan></text><rect x="40.0" y="627.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="653.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Trisomía autosómica = la causa cromosómica más frecuente</tspan></text><text x="60.0" y="672.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Después vienen 45,X y la triploidía.</tspan></text><text x="40.0" y="739.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="749.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="780.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="752.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="771.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Trisomía</tspan><tspan x="285.0" dy="17">autosómica</tspan></text><text x="435.0" y="780.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Triploidía</tspan></text><text x="585.0" y="771.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Translocación</tspan><tspan x="585.0" dy="17">equilibrada</tspan></text><text x="735.0" y="780.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Mosaicismo</tspan></text><text x="885.0" y="780.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Monosomía 45,X</tspan></text><rect x="40.0" y="803.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="803.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="840.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Más frecuente?</tspan></text><text x="285.0" y="824.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: cerca de la mitad</tspan><tspan x="285.0" dy="16">de los cariotipos</tspan><tspan x="285.0" dy="16">anormales</tspan></text><text x="435.0" y="824.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: cerca del 15 %,</tspan><tspan x="435.0" dy="16">asociada a mola</tspan><tspan x="435.0" dy="16">parcial</tspan></text><text x="585.0" y="824.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: poco común, y se</tspan><tspan x="585.0" dy="16">sospecha en el aborto</tspan><tspan x="585.0" dy="16">recurrente</tspan></text><text x="735.0" y="832.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: rara como causa</tspan><tspan x="735.0" dy="16">de aborto</tspan></text><text x="885.0" y="832.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: segunda causa,</tspan><tspan x="885.0" dy="16">15-20 %</tspan></text><rect x="40.0" y="749.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="893.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="921.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="943.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Trisomía autosómica: cerca de la mitad de los cariotipos anormales (trisomías 16, 22, 21, 15 y 13); por no disyunción en la meiosis I.</tspan><tspan x="58.0" dy="18">• Monosomía X (45,X): 15-20 %. Triploidía: cerca de 15 %, asociada a mola parcial. Reordenamientos estructurales: pocos.</tspan><tspan x="58.0" dy="18">• Alerta: la translocación equilibrada de uno de los padres se sospecha en el aborto recurrente (≥ 2 pérdidas); estudiar cariotipo de los padres (ESHRE</tspan><tspan x="58.0" dy="18">   2022).</tspan><tspan x="58.0" dy="18">• El mosaicismo es raro como causa del aborto; el aborto afecta al 15-20 % de los embarazos clínicos.</tspan></text><text x="58.0" y="1037.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, Practice Bulletin 200: Early pregnancy loss (2018); ESHRE, Guideline on recurrent pregnancy loss: an update in 2022 (Hum Reprod Open 2023); Williams</tspan><tspan x="58.0" dy="15">Obstetricia 26.ª ed. (2022).</tspan></text></svg>