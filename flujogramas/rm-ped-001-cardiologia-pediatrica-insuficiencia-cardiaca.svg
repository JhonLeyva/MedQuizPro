t><rect x="40.0" y="640.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="671.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="643.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="662.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Disnea y</tspan><tspan x="285.0" dy="17">sudoración al lactar</tspan></text><text x="435.0" y="662.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hepatomegalia y</tspan><tspan x="435.0" dy="17">distensión</tspan></text><text x="585.0" y="662.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Crepitantes y</tspan><tspan x="585.0" dy="17">polipnea</tspan></text><text x="735.0" y="662.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Irritabilidad y</tspan><tspan x="735.0" dy="17">cardiomegalia</tspan></text><text x="885.0" y="662.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Politirajes y aleteo</tspan><tspan x="885.0" dy="17">nasal</tspan></text><rect x="40.0" y="694.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="694.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="723.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Sospecha?</tspan></text><text x="285.0" y="715.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: síntoma típico al</tspan><tspan x="285.0" dy="16">lactar</tspan></text><text x="435.0" y="723.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: hallazgos tardíos</tspan></text><text x="585.0" y="715.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: orientan a</tspan><tspan x="585.0" dy="16">enfermedad pulmonar</tspan></text><text x="735.0" y="723.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: inespecíficos</tspan></text><text x="885.0" y="715.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: indican distrés</tspan><tspan x="885.0" dy="16">respiratorio</tspan></text><rect x="40.0" y="640.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="768.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="796.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="818.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Tomas cortas y repetidas, mala ganancia de peso, taquipnea, taquicardia y hepatomegalia. Ortopnea y edema son raros.</tspan><tspan x="58.0" dy="18">• CIV, ductus y canal AV se hacen sintomáticos a las 4-8 semanas, cuando baja la resistencia pulmonar.</tspan><tspan x="58.0" dy="18">• En las 2 primeras semanas pensar en lesiones ductodependientes (coartación crítica, hipoplasia de cavidades izquierdas).</tspan></text><text x="58.0" y="876.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Nelson Tratado de Pediatría 22.ª ed. (2024); AHA/ACC, cardiopatías congénitas del adulto (2018).</tspan></text></svg>