<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="824" viewBox="0 0 1000 824" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En el lactante, la insuficiencia cardiaca se sospecha por disnea y sudoración profusa al lactar"><title>En el lactante, la insuficiencia cardiaca se sospecha por disnea y sudoración profusa al lactar</title><rect x="0.75" y="0.75" width="998.5" height="822.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Cardiología pediátrica · insuficiencia cardiaca</tspan></text><rect x="470.0" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="519.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="519.1" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Insuficiencia cardiaca en el lactante</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La alimentación es el esfuerzo que desencadena los síntomas.</tspan><tspan x="58.0" dy="17">La causa más frecuente es una cardiopatía congénita con cortocircuito.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué sospecha de IC en un lactante pequeño?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE PRESENTA LA INSUFICIENCIA CARDIACA EN EL LACTANTE</tspan></text><rect x="40.0" y="253.0" width="293.3" height="216.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><rect x="40.0" y="253.0" width="293.3" height="8.0" rx="4" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="60.0" y="287.0" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="253"><tspan x="60.0" dy="0">Insuficiencia cardiaca (cardiopatía</tspan><tspan x="60.0" dy="19">con cortocircuito)</tspan></text><rect x="56.0" y="327.0" width="261.3" height="26.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="68.0" y="344.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Al lactar</tspan></text><text x="305.3" y="344.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="end" data-max="133"><tspan x="305.3" dy="0">✓ Disnea y sudor</tspan></text><rect x="56.0" y="357.0" width="261.3" height="26.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="68.0" y="374.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Tomas</tspan></text><text x="305.3" y="374.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="end" data-max="133"><tspan x="305.3" dy="0">✓ Cortas y repetidas</tspan></text><rect x="56.0" y="387.0" width="261.3" height="26.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="68.0" y="404.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Peso</tspan></text><text x="305.3" y="404.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="end" data-max="133"><tspan x="305.3" dy="0">✓ Mala ganancia</tspan></text><text x="60.0" y="433.0" font-size="11.5" font-weight="600" font-style="normal" fill="#0f766e" text-anchor="start" data-max="253"><tspan x="60.0" dy="0">Aparece a las 4-8 semanas, cuando baja la</tspan><tspan x="60.0" dy="16">resistencia pulmonar.</tspan></text><rect x="215.9" y="246.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="261.3" y="261.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="261.3" dy="0">◆ ESTE CASO</tspan></text><rect x="353.3" y="253.0" width="293.3" height="216.0" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="353.3" y="253.0" width="293.3" height="8.0" rx="4" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="373.3" y="287.0" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="253"><tspan x="373.3" dy="0">Enfermedad respiratoria</tspan><tspan x="373.3" dy="19">(bronquiolitis)</tspan></text><rect x="369.3" y="327.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="381.3" y="344.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="381.3" dy="0">Al lactar</tspan></text><text x="618.7" y="344.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="618.7" dy="0">Tos y rechazo</tspan></text><rect x="369.3" y="357.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="381.3" y="374.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="381.3" dy="0">Cuadro</tspan></text><text x="618.7" y="374.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="618.7" dy="0">Fiebre y coriza</tspan></text><rect x="369.3" y="387.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="381.3" y="404.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="381.3" dy="0">Hígado</tspan></text><text x="618.7" y="404.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="618.7" dy="0">Normal</tspan></text><text x="373.3" y="433.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="253"><tspan x="373.3" dy="0">Politirajes y sibilancias; no hay</tspan><tspan x="373.3" dy="16">hepatomegalia.</tspan></text><rect x="666.7" y="253.0" width="293.3" height="216.0" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="666.7" y="253.0" width="293.3" height="8.0" rx="4" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="686.7" y="287.0" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="253"><tspan x="686.7" dy="0">Signos tardíos de falla cardiaca</tspan></text><rect x="682.7" y="308.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="694.7" y="325.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="694.7" dy="0">Hígado</tspan></text><text x="932.0" y="325.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="932.0" dy="0">Hepatomegalia</tspan></text><rect x="682.7" y="338.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="694.7" y="355.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="694.7" dy="0">Edema</tspan></text><text x="932.0" y="355.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="932.0" dy="0">Raro</tspan></text><rect x="682.7" y="368.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="694.7" y="385.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="694.7" dy="0">Ortopnea</tspan></text><text x="932.0" y="385.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="932.0" dy="0">Rara</tspan></text><text x="686.7" y="414.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="253"><tspan x="686.7" dy="0">Orientan, pero no son lo primero que se nota.</tspan></text><text x="40.0" y="491.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="400"><tspan x="40.0" dy="0">✓ = dato que coincide con el caso</tspan></text><text x="40.0" y="537.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="547.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="578.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="550.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="569.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Disnea y</tspan><tspan x="285.0" dy="17">sudoración al lactar</tspan></text><text x="435.0" y="569.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hepatomegalia y</tspan><tspan x="435.0" dy="17">distensión</tspan></text><text x="585.0" y="569.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Crepitantes y</tspan><tspan x="585.0" dy="17">polipnea</tspan></text><text x="735.0" y="569.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Irritabilidad y</tspan><tspan x="735.0" dy="17">cardiomegalia</tspan></text><text x="885.0" y="569.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Politirajes y aleteo</tspan><tspan x="885.0" dy="17">nasal</tspan></text><rect x="40.0" y="601.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="601.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="630.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Sospecha?</tspan></text><text x="285.0" y="622.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: síntoma típico al</tspan><tspan x="285.0" dy="16">lactar</tspan></text><text x="435.0" y="630.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: hallazgos tardíos</tspan></text><text x="585.0" y="622.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: orientan a</tspan><tspan x="585.0" dy="16">enfermedad pulmonar</tspan></text><text x="735.0" y="630.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: inespecíficos</tspan></text><text x="885.0" y="622.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: indican distrés</tspan><tspan x="885.0" dy="16">respiratorio</tspan></text><rect x="40.0" y="547.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="675.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="703.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="725.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Tomas cortas y repetidas, mala ganancia de peso, taquipnea, taquicardia y hepatomegalia. Ortopnea y edema son raros.</tspan><tspan x="58.0" dy="18">• CIV, ductus y canal AV se hacen sintomáticos a las 4-8 semanas, cuando baja la resistencia pulmonar.</tspan><tspan x="58.0" dy="18">• En las 2 primeras semanas pensar en lesiones ductodependientes (coartación crítica, hipoplasia de cavidades izquierdas).</tspan></text><text x="58.0" y="783.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Nelson Tratado de Pediatría 22.ª ed. (2024); AHA/ACC, cardiopatías congénitas del adulto (2018).</tspan></text></svg>