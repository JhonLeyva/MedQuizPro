<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="914" viewBox="0 0 1000 914" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la gestante con VIH y dilatación mayor de 4 cm la cesárea ya no protege: el parto vaginal es la vía"><title>En la gestante con VIH y dilatación mayor de 4 cm la cesárea ya no protege: el parto vaginal es la vía</title><rect x="0.75" y="0.75" width="998.5" height="913.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">VIH y embarazo · vía del parto</tspan></text><rect x="377.0" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="456.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="456.8" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Vía del parto en VIH</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La cesárea electiva reduce la transmisión solo si se hace antes del trabajo de parto y con</tspan><tspan x="58.0" dy="17">membranas íntegras.</tspan><tspan x="58.0" dy="17">Con carga viral suprimida el parto vaginal es seguro.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante con VIH en el parto</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿En qué situación podría darse parto vaginal?</tspan><tspan x="640.0" dy="16">Opciones: control irregular, RPM &gt; 4 h, inicio de</tspan><tspan x="640.0" dy="16">TARGA, dilatación &gt; 4 cm.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="395.0" x2="811.3" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="395.0" x2="188.7" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,423.0 193.7,423.0 188.7,431.0" fill="#94a3b8"/><line x1="500.0" y1="395.0" x2="500.0" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,423.0 505.0,423.0 500.0,431.0" fill="#94a3b8"/><line x1="811.3" y1="395.0" x2="811.3" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,423.0 816.3,423.0 811.3,431.0" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#0f766e"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="395.0" x2="500.0" y2="424.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,423.0 505.0,423.0 500.0,431.0" fill="#0f766e"/><rect x="109.6" y="404.0" width="158.0" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="188.7" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">Carga viral ≤ 1000 con TARV</tspan></text><rect x="347.2" y="404.0" width="305.6" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="500.0" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">Dilatación &gt; 4 cm o trabajo de parto avanzado (este caso)</tspan></text><rect x="673.7" y="404.0" width="275.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="811.3" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">CV &gt; 1000 o desconocida, con membranas íntegras</tspan></text><polygon points="240.0,336.0 266.0,307.0 734.0,307.0 760.0,336.0 734.0,365.0 266.0,365.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="336.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="341.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="340.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Gestante con VIH que llega al parto</tspan></text><rect x="40.0" y="431.0" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="188.7" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">PARTO VAGINAL</tspan></text><text x="188.7" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Con CV indetectable es seguro</tspan><tspan x="188.7" dy="17">Zidovudina solo si CV &gt; 1000</tspan></text><rect x="351.3" y="431.0" width="297.3" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">PARTO VAGINAL</tspan></text><text x="500.0" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">La cesárea ya no reduce la transmisión</tspan><tspan x="500.0" dy="17">Evitar maniobras invasivas</tspan></text><rect x="662.7" y="431.0" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">CESÁREA ELECTIVA</tspan></text><text x="811.3" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">A las 38 semanas, antes del trabajo de parto</tspan><tspan x="811.3" dy="17">Con zidovudina endovenosa</tspan></text><text x="40.0" y="561.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="571.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="611.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="594.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Paciente con</tspan><tspan x="285.0" dy="17">control prenatal</tspan><tspan x="285.0" dy="17">irregular</tspan></text><text x="435.0" y="594.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Ruptura de</tspan><tspan x="435.0" dy="17">membranas mayor</tspan><tspan x="435.0" dy="17">de 4 horas</tspan></text><text x="585.0" y="602.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Paciente que inicia</tspan><tspan x="585.0" dy="17">TARGA</tspan></text><rect x="663.0" y="574.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="602.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Dilatación más de 4</tspan><tspan x="735.0" dy="17">cm</tspan></text><text x="885.0" y="602.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Multigesta con VIH</tspan><tspan x="885.0" dy="17">hallado en el parto</tspan></text><rect x="40.0" y="642.5" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="642.5" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="679.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Parto vaginal?</tspan></text><text x="285.0" y="663.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: sugiere mala</tspan><tspan x="285.0" dy="16">adherencia y carga</tspan><tspan x="285.0" dy="16">viral alta</tspan></text><text x="435.0" y="663.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: la RPM prolongada</tspan><tspan x="435.0" dy="16">favorece la infección</tspan><tspan x="435.0" dy="16">ascendente</tspan></text><text x="585.0" y="671.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: TARGA reciente,</tspan><tspan x="585.0" dy="16">sin supresión viral</tspan></text><text x="735.0" y="663.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: con &gt; 4 cm la</tspan><tspan x="735.0" dy="16">cesárea ya no aporta</tspan><tspan x="735.0" dy="16">beneficio</tspan></text><text x="885.0" y="671.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: diagnóstico tardío,</tspan><tspan x="885.0" dy="16">viremia sin control</tspan></text><rect x="40.0" y="571.5" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="732.5" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="760.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="782.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Carga viral (CV) cercana al parto ≤ 1000 copias/mL con TARV: parto vaginal. CV &gt; 1000 o desconocida: cesárea electiva a las 38 semanas (DHHS 2024).</tspan><tspan x="58.0" dy="18">• Con dilatación &gt; 4 cm (fase activa) o trabajo de parto avanzado, la cesárea ya no reduce la transmisión: se atiende por vía vaginal.</tspan><tspan x="58.0" dy="18">• Zidovudina endovenosa intraparto si CV &gt; 1000 o desconocida (considerar si 50-999); no es necesaria con CV &lt; 50 en TARV.</tspan><tspan x="58.0" dy="18">• Alerta: control prenatal irregular, TARGA recién iniciada o diagnóstico en el parto implican viremia probable: profilaxis del recién nacido de alto riesgo.</tspan></text><text x="58.0" y="858.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: DHHS, Perinatal HIV Guidelines (2024); NTS 159-MINSA/2019/DGIESP (RM 1138-2019/MINSA); NTS 169-MINSA/2020/DGIESP (RM 1024-2020/MINSA); Williams</tspan><tspan x="58.0" dy="15">Obstetricia, 26.ª ed. (2022).</tspan></text></svg>