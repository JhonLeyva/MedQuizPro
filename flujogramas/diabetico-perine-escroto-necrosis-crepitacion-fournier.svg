nt-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="356.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Celulitis perineal: ¿necrosis, crepitación o toxicidad?</tspan></text><rect x="40.0" y="447.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="475.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">FASCITIS NECROTIZANTE: CIRUGÍA</tspan></text><text x="266.5" y="498.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Desbridamiento urgente</tspan><tspan x="266.5" dy="17">Antibiótico amplio</tspan></text><rect x="507.0" y="447.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="483.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Celulitis o absceso</tspan></text><text x="733.5" y="506.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Antibiótico, drenaje</tspan></text><text x="40.0" y="577.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SIGNOS CON NOMBRE PROPIO</tspan></text><rect x="40.0" y="589.5" width="920.0" height="213.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><line x1="62.0" y1="631.5" x2="938.0" y2="631.5" stroke="#0f766e" stroke-width="2"/><line x1="62.0" y1="631.5" x2="62.0" y2="639.5" stroke="#0f766e" stroke-width="2"/><line x1="938.0" y1="631.5" x2="938.0" y2="639.5" stroke="#0f766e" stroke-width="2"/><rect x="330.1" y="619.5" width="339.7" height="24.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/><text x="500.0" y="635.5" font-size="10.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="326"><tspan x="500.0" dy="0">SIGNOS DE INFECCIÓN NECROTIZANTE · 4 de 4 en el caso</tspan></text><rect x="56.0" y="651.5" width="213.0" height="104.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="76.0" cy="674.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="76.0" y="678.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="76.0" dy="0">1</tspan></text><text x="94.0" y="679.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="167"><tspan x="94.0" dy="0">Dolor desproporcionado</tspan></text><text x="68.0" y="705.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="189"><tspan x="68.0" dy="0">Escroto</tspan></text><rect x="68.0" y="721.5" width="189.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="162.5" y="736.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="177"><tspan x="162.5" dy="0">✓ EN EL CASO</tspan></text><rect x="281.0" y="651.5" width="213.0" height="104.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="301.0" cy="674.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="301.0" y="678.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="301.0" dy="0">2</tspan></text><text x="319.0" y="679.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="167"><tspan x="319.0" dy="0">Necrosis</tspan></text><text x="293.0" y="705.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="189"><tspan x="293.0" dy="0">Zonas negras</tspan></text><rect x="293.0" y="721.5" width="189.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="387.5" y="736.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="177"><tspan x="387.5" dy="0">✓ EN EL CASO</tspan></text><rect x="506.0" y="651.5" width="213.0" height="104.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="526.0" cy="674.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="526.0" y="678.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="526.0" dy="0">3</tspan></text><text x="544.0" y="679.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="167"><tspan x="544.0" dy="0">Crepitación</tspan></text><text x="518.0" y="705.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="189"><tspan x="518.0" dy="0">Gas</tspan></text><rect x="518.0" y="721.5" width="189.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="612.5" y="736.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="177"><tspan x="612.5" dy="0">✓ EN EL CASO</tspan></text><rect x="731.0" y="651.5" width="213.0" height="104.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="751.0" cy="674.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="751.0" y="678.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="751.0" dy="0">4</tspan></text><text x="769.0" y="679.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="167"><tspan x="769.0" dy="0">Toxicidad</tspan></text><text x="743.0" y="705.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="189"><tspan x="743.0" dy="0">T 39 °C, mal estado</tspan></text><rect x="743.0" y="721.5" width="189.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="837.5" y="736.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="177"><tspan x="837.5" dy="0">✓ EN EL CASO</tspan></text><text x="56.0" y="782.5" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">Cada hora de retraso en la cirugía aumenta la mortalidad.</tspan></text><text x="40.0" y="842.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="852.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="883.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="875.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hidroadenitis</tspan><tspan x="285.0" dy="17">supurativa</tspan></text><rect x="363.0" y="855.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="875.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Fascitis</tspan><tspan x="435.0" dy="17">necrotizante</tspan></text><text x="585.0" y="875.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Absceso</tspan><tspan x="585.0" dy="17">isquiorrectal</tspan></text><text x="735.0" y="883.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Fístula anal</tspan></text><text x="885.0" y="875.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Gangrena gaseosa</tspan><tspan x="885.0" dy="17">por clostridios</tspan></text><rect x="40.0" y="906.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="906.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="935.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="927.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: nódulos crónicos</tspan><tspan x="285.0" dy="16">en pliegues</tspan></text><text x="435.0" y="927.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: necrosis +</tspan><tspan x="435.0" dy="16">crepitación + toxicidad</tspan></text><text x="585.0" y="927.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: masa dolorosa, sin</tspan><tspan x="585.0" dy="16">necrosis extensa</tspan></text><text x="735.0" y="935.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: trayecto crónico</tspan></text><text x="885.0" y="927.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Clostridios: más en</tspan><tspan x="885.0" dy="16">músculo tras trauma</tspan></text><rect x="40.0" y="852.5" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="980.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1008.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1030.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Desbridamiento quirúrgico urgente y repetido (cada 24-48 h).</tspan><tspan x="58.0" dy="18">• Antibiótico EV amplio: piperacilina-tazobactam o carbapenem + clindamicina (± vancomicina).</tspan><tspan x="58.0" dy="18">• Reanimación con líquidos; colostomía si compromete el ano.</tspan></text><text x="58.0" y="1088.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: IDSA, infecciones de piel y partes blandas (2014, act. 2024); WSES (2022).</tspan></text></svg>