<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="910" viewBox="0 0 1000 910" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="100 enfermos (80 positivos) y 200 sanos (180 negativos): especificidad de 90 %"><title>100 enfermos (80 positivos) y 200 sanos (180 negativos): especificidad de 90 %</title><rect x="0.75" y="0.75" width="998.5" height="908.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Epidemiología · validez de las pruebas diagnósticas</tspan></text><rect x="506.3" y="32.0" width="143.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="578.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="127"><tspan x="578.0" dy="0">SALUD PÚBLICA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Sensibilidad y especificidad</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Sensibilidad: de los enfermos, cuántos salen positivos (VP / enfermos).</tspan><tspan x="58.0" dy="17">Especificidad: de los sanos, cuántos salen negativos (VN / sanos).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Prueba rápida en 300 personas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">100 enfermos: 80 positivos.</tspan><tspan x="640.0" dy="16">200 sanos: 180 negativos.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TABLA 2 × 2 DE LA PRUEBA</tspan></text><text x="202.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="758"><tspan x="202.0" dy="0">→ REALIDAD</tspan></text><rect x="202.0" y="291.0" width="373.0" height="35.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="388.5" y="313.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="353"><tspan x="388.5" dy="0">Enfermos (100)</tspan></text><rect x="587.0" y="291.0" width="373.0" height="35.0" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="773.5" y="313.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="353"><tspan x="773.5" dy="0">Sanos (200)</tspan></text><text x="40.0" y="305.0" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="146"><tspan x="40.0" dy="0">↓ RESULTADO DE LA</tspan><tspan x="40.0" dy="15">PRUEBA</tspan></text><rect x="40.0" y="338.0" width="150.0" height="76.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="115.0" y="380.5" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Positivo</tspan></text><rect x="202.0" y="338.0" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="339.0" width="6.0" height="74.0" rx="3" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="388.5" y="367.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">80 verdaderos positivos</tspan></text><text x="388.5" y="390.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">VP</tspan></text><rect x="587.0" y="338.0" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="588.0" y="339.0" width="6.0" height="74.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="773.5" y="367.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">20 falsos positivos</tspan></text><text x="773.5" y="390.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">FP = 200 - 180</tspan></text><rect x="40.0" y="426.0" width="150.0" height="76.0" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="115.0" y="468.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Negativo</tspan></text><rect x="202.0" y="426.0" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="427.0" width="6.0" height="74.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="388.5" y="455.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">20 falsos negativos</tspan></text><text x="388.5" y="478.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">FN = 100 - 80</tspan></text><rect x="587.0" y="426.0" width="373.0" height="76.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="773.5" y="455.6" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">180 VERDADEROS NEGATIVOS</tspan></text><text x="773.5" y="478.6" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">VN</tspan></text><rect x="728.1" y="491.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="773.5" y="506.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="773.5" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="514.0" width="150.0" height="76.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="115.0" y="556.5" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Cálculo</tspan></text><rect x="202.0" y="514.0" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="515.0" width="6.0" height="74.0" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="388.5" y="543.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Sensibilidad 80 %</tspan></text><text x="388.5" y="566.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">80 / 100</tspan></text><rect x="587.0" y="514.0" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="588.0" y="515.0" width="6.0" height="74.0" rx="3" fill="#6366f1" stroke="none" stroke-width="1.5"/><text x="773.5" y="543.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">ESPECIFICIDAD 90 %</tspan></text><text x="773.5" y="566.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">180 / 200</tspan></text><text x="40.0" y="640.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="650.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="672.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="672.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">80 %</tspan></text><rect x="363.0" y="653.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="672.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">90 %</tspan></text><text x="585.0" y="672.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">75 %</tspan></text><text x="735.0" y="672.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">85,7 %</tspan></text><text x="885.0" y="672.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">60 %</tspan></text><rect x="40.0" y="687.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="687.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="716.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Corresponde a</tspan></text><text x="285.0" y="716.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sensibilidad (80/100)</tspan></text><text x="435.0" y="708.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Especificidad</tspan><tspan x="435.0" dy="16">(180/200)</tspan></text><text x="585.0" y="716.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No sale de la tabla</tspan></text><text x="735.0" y="716.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No sale de la tabla</tspan></text><text x="885.0" y="716.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No sale de la tabla</tspan></text><rect x="40.0" y="650.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="761.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="789.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="811.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Especificidad = 180 / 200 = 90 %; sensibilidad = 80 / 100 = 80 %.</tspan><tspan x="58.0" dy="18">• Valor predictivo positivo = 80 / (80 + 20) = 80 %; negativo = 180 / (180 + 20) = 90 %.</tspan><tspan x="58.0" dy="18">• Una prueba muy específica sirve para confirmar (pocos falsos positivos).</tspan></text><text x="58.0" y="869.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Gordis, Epidemiología 6.ª ed. (2019); OPS, Módulos de principios de epidemiología (2011).</tspan></text></svg>