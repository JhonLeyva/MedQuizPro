<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="548" viewBox="0 0 1000 548" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Validez de una prueba diagnóstica"><title>Validez de una prueba diagnóstica</title><rect x="0.75" y="0.75" width="998.5" height="546.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16" y="16" width="968" height="56" rx="10" fill="#0f766e"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170" y1="34.0" x2="170" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="634"><tspan x="184.0" dy="0">SALUD PÚBLICA ENAM: VALIDEZ DE UNA PRUEBA DIAGNÓSTICA</tspan></text><rect x="837.9" y="32.0" width="126.1" height="24" rx="12" fill="#134e4a"/><text x="901.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="110"><tspan x="901.0" dy="0">SALUD PÚBLICA</tspan></text><rect x="190.0" y="90.0" width="620" height="67.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="500.0" y="118.5" font-size="14.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Prueba rápida en 300 personas: 100 enfermos y 200 sanos</tspan></text><text x="500.0" y="141.0" font-size="12" font-weight="400" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">80 enfermos con prueba (+) · 180 sanos con prueba (−)</tspan></text><line x1="500.0" y1="157.0" x2="500.0" y2="178.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,177.0 505.0,177.0 500.0,185.0" fill="#0f766e"/><rect x="210.0" y="185.0" width="580" height="70.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="212.5" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="552"><tspan x="500.0" dy="0">ESPECIFICIDAD = VN / (VN + FP)</tspan></text><text x="500.0" y="239.0" font-size="16" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="552"><tspan x="500.0" dy="0">180 / (180 + 20) = 180 / 200 = 90 %</tspan></text><line x1="500.0" y1="255.0" x2="500.0" y2="273.0" stroke="#0f766e" stroke-width="2"/><line x1="270.0" y1="273.0" x2="730.0" y2="273.0" stroke="#0f766e" stroke-width="2"/><line x1="270.0" y1="273.0" x2="270.0" y2="288.0" stroke="#0f766e" stroke-width="2"/><polygon points="265.0,287.0 275.0,287.0 270.0,295.0" fill="#0f766e"/><line x1="730.0" y1="273.0" x2="730.0" y2="288.0" stroke="#0f766e" stroke-width="2"/><polygon points="725.0,287.0 735.0,287.0 730.0,295.0" fill="#0f766e"/><rect x="70.0" y="295.0" width="400" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="270.0" y="322.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="372"><tspan x="270.0" dy="0">Tabla 2 × 2</tspan></text><text x="270.0" y="345.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="372"><tspan x="270.0" dy="0">Enfermos: 80 VP · 20 FN</tspan><tspan x="270.0" dy="17">Sanos: 20 FP · 180 VN</tspan></text><rect x="530.0" y="295.0" width="400" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="730.0" y="322.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="372"><tspan x="730.0" dy="0">Otros indicadores</tspan></text><text x="730.0" y="345.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="372"><tspan x="730.0" dy="0">Sensibilidad = 80 / 100 = 80 %</tspan><tspan x="730.0" dy="17">VPP = 80 / 100 = 80 %</tspan><tspan x="730.0" dy="17">VPN = 180 / 200 = 90 %</tspan></text><rect x="40" y="421.0" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="449.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="471.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Sensibilidad y especificidad son propias de la prueba.</tspan><tspan x="58.0" dy="18">• Los valores predictivos cambian con la prevalencia de la enfermedad.</tspan></text><text x="58.0" y="511.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Gordis Epidemiología 6.ª ed. · Hernández-Ávila, Epidemiología</tspan></text></svg>
