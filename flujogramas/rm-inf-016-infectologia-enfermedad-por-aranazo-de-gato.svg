<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="924" viewBox="0 0 1000 924" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La enfermedad por arañazo de gato la produce Bartonella henselae"><title>La enfermedad por arañazo de gato la produce Bartonella henselae</title><rect x="0.75" y="0.75" width="998.5" height="922.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Infectología · enfermedad por arañazo de gato</tspan></text><rect x="472.0" y="32.0" width="121.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="533.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="106"><tspan x="533.0" dy="0">INFECTOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Enfermedad por arañazo de gato</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Bacilo gramnegativo intracelular facultativo.</tspan><tspan x="58.0" dy="17">El reservorio son los gatos, sobre todo los cachorros; la pulga del gato es el vector.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es el agente etiológico de la enfermedad por</tspan><tspan x="640.0" dy="16">arañazo de gato?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LA CADENA DE LA ENFERMEDAD POR ARAÑAZO DE GATO Y CÓMO CORTARLA</tspan></text><rect x="40.0" y="269.0" width="163.2" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="121.6" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="143"><tspan x="121.6" dy="0">Agente</tspan></text><text x="121.6" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="143"><tspan x="121.6" dy="0">Bartonella henselae, bacilo</tspan><tspan x="121.6" dy="16">gramnegativo</tspan></text><line x1="206.2" y1="306.5" x2="219.2" y2="306.5" stroke="#0f766e" stroke-width="2"/><polygon points="218.2,301.5 218.2,311.5 226.2,306.5" fill="#0f766e"/><line x1="121.6" y1="346.0" x2="121.6" y2="360.0" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="40.0" y="362.0" width="163.2" height="81.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="121.6" y="376.0" font-size="9.5" font-weight="800" font-style="normal" fill="#ffedd5" text-anchor="middle" data-max="143"><tspan x="121.6" dy="0">✂ CORTA</tspan></text><text x="121.6" y="393.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="143"><tspan x="121.6" dy="0">Azitromicina solo en</tspan><tspan x="121.6" dy="16">casos graves o</tspan><tspan x="121.6" dy="16">inmunodeprimidos</tspan></text><rect x="76.2" y="432.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="121.6" y="447.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="121.6" dy="0">◆ ESTE CASO</tspan></text><rect x="229.2" y="269.0" width="163.2" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="310.8" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="143"><tspan x="310.8" dy="0">Reservorio</tspan></text><text x="310.8" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="143"><tspan x="310.8" dy="0">Gatos, sobre todo los</tspan><tspan x="310.8" dy="16">cachorros</tspan></text><line x1="395.4" y1="306.5" x2="408.4" y2="306.5" stroke="#0f766e" stroke-width="2"/><polygon points="407.4,301.5 407.4,311.5 415.4,306.5" fill="#0f766e"/><line x1="310.8" y1="346.0" x2="310.8" y2="360.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="229.2" y="362.0" width="163.2" height="81.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="310.8" y="376.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="143"><tspan x="310.8" dy="0">✂ CORTA</tspan></text><text x="310.8" y="393.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="143"><tspan x="310.8" dy="0">Evitar el juego brusco</tspan><tspan x="310.8" dy="16">con gatitos</tspan></text><rect x="418.4" y="269.0" width="163.2" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="500.0" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="143"><tspan x="500.0" dy="0">Vector</tspan></text><text x="500.0" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="143"><tspan x="500.0" dy="0">Pulga del gato</tspan></text><line x1="584.6" y1="306.5" x2="597.6" y2="306.5" stroke="#0f766e" stroke-width="2"/><polygon points="596.6,301.5 596.6,311.5 604.6,306.5" fill="#0f766e"/><line x1="500.0" y1="346.0" x2="500.0" y2="360.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="418.4" y="362.0" width="163.2" height="81.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="376.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="143"><tspan x="500.0" dy="0">✂ CORTA</tspan></text><text x="500.0" y="393.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="143"><tspan x="500.0" dy="0">Controlar las pulgas del</tspan><tspan x="500.0" dy="16">animal</tspan></text><rect x="607.6" y="269.0" width="163.2" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="689.2" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="143"><tspan x="689.2" dy="0">Inoculación</tspan></text><text x="689.2" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="143"><tspan x="689.2" dy="0">Arañazo o mordedura</tspan></text><line x1="773.8" y1="306.5" x2="786.8" y2="306.5" stroke="#0f766e" stroke-width="2"/><polygon points="785.8,301.5 785.8,311.5 793.8,306.5" fill="#0f766e"/><line x1="689.2" y1="346.0" x2="689.2" y2="360.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="607.6" y="362.0" width="163.2" height="81.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="689.2" y="376.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="143"><tspan x="689.2" dy="0">✂ CORTA</tspan></text><text x="689.2" y="393.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="143"><tspan x="689.2" dy="0">Lavar la herida con</tspan><tspan x="689.2" dy="16">agua y jabón</tspan></text><rect x="796.8" y="269.0" width="163.2" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="878.4" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="143"><tspan x="878.4" dy="0">Huésped</tspan></text><text x="878.4" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="143"><tspan x="878.4" dy="0">Pápula y ganglio regional</tspan><tspan x="878.4" dy="16">doloroso</tspan></text><line x1="878.4" y1="346.0" x2="878.4" y2="360.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="796.8" y="362.0" width="163.2" height="81.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="878.4" y="376.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="143"><tspan x="878.4" dy="0">✂ CORTA</tspan></text><text x="878.4" y="393.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="143"><tspan x="878.4" dy="0">Autolimitada:</tspan><tspan x="878.4" dy="16">tratamiento de soporte</tspan></text><rect x="40.0" y="473.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="499.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Arañazo de gato = Bartonella henselae</tspan></text><text x="60.0" y="518.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">En el Perú, Bartonella bacilliformis causa la enfermedad de Carrión: no es la misma.</tspan></text><text x="40.0" y="585.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="595.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="626.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="598.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="626.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Bartonella henselae</tspan></text><text x="435.0" y="626.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Bordetella pertussis</tspan></text><text x="585.0" y="617.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Chlamydia</tspan><tspan x="585.0" dy="17">trachomatis</tspan></text><text x="735.0" y="617.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Staphylococcus</tspan><tspan x="735.0" dy="17">epidermidis</tspan></text><text x="885.0" y="617.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Streptococcus</tspan><tspan x="885.0" dy="17">pyogenes</tspan></text><rect x="40.0" y="649.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="649.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="686.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Agente?</tspan></text><text x="285.0" y="686.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: reservorio en gatos</tspan></text><text x="435.0" y="686.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: causa la tos ferina</tspan></text><text x="585.0" y="670.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: causa</tspan><tspan x="585.0" dy="16">linfogranuloma</tspan><tspan x="585.0" dy="16">venéreo</tspan></text><text x="735.0" y="678.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no se relaciona</tspan><tspan x="735.0" dy="16">con gatos</tspan></text><text x="885.0" y="678.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: causa faringitis y</tspan><tspan x="885.0" dy="16">erisipela</tspan></text><rect x="40.0" y="595.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="739.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="767.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="789.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Pápula o pústula en el sitio de inoculación a los 3-14 días; a las 1-3 semanas, linfadenopatía regional dolorosa con fiebre baja y malestar.</tspan><tspan x="58.0" dy="18">• Suele ser autolimitada. Complicaciones: síndrome oculoglandular de Parinaud, encefalopatía, osteomielitis; en inmunodeprimidos, angiomatosis bacilar y</tspan><tspan x="58.0" dy="18">   peliosis hepática.</tspan><tspan x="58.0" dy="18">• Diagnóstico: serología o PCR; la tinción de Warthin-Starry muestra bacilos en la biopsia. Tratamiento de soporte; azitromicina en casos graves.</tspan><tspan x="58.0" dy="18">• No confundir con Bartonella bacilliformis, causante de la enfermedad de Carrión, endémica en el Perú.</tspan></text><text x="58.0" y="883.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Harrison 21.ª ed. (2022); Mandell 9.ª ed. (2020); AAP, Red Book 2024-2027.</tspan></text></svg>