<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="923" viewBox="0 0 1000 923" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La extensión de una enfermedad crónica en un año se mide con la prevalencia (de periodo)"><title>La extensión de una enfermedad crónica en un año se mide con la prevalencia (de periodo)</title><rect x="0.75" y="0.75" width="998.5" height="921.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Epidemiología · prevalencia</tspan></text><rect x="364.7" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="429.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="429.0" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Prevalencia</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Proporción de la población que tiene la enfermedad en un momento o periodo, sea caso</tspan><tspan x="58.0" dy="17">nuevo o antiguo.</tspan><tspan x="58.0" dy="17">Prevalencia ≈ incidencia × duración media.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de indicadores</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué indicador es más apropiado para valorar la</tspan><tspan x="640.0" dy="16">extensión de una enfermedad crónica en un año?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><rect x="40.0" y="245.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="271.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Extensión de una enfermedad crónica = prevalencia</tspan></text><text x="60.0" y="290.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Incidencia mide velocidad de aparición; los riesgos atribuibles miden impacto.</tspan></text><text x="40.0" y="351.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ MIDE CADA INDICADOR EPIDEMIOLÓGICO</tspan></text><rect x="40.0" y="363.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Indicador</tspan></text><text x="280.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Cuenta</tspan></text><text x="625.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Qué responde</tspan></text><rect x="40.0" y="392.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="411.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Prevalencia</tspan></text><text x="280.0" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Casos nuevos y antiguos</tspan></text><text x="625.0" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Cuántos enfermos hay: extensión y carga</tspan></text><rect x="170.6" y="395.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="216.0" y="410.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="216.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="421.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="440.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Incidencia acumulada</tspan></text><text x="280.0" y="440.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Solo casos nuevos</tspan></text><text x="625.0" y="440.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Riesgo de enfermar en un periodo</tspan></text><rect x="40.0" y="450.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="469.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Densidad de incidencia</tspan></text><text x="280.0" y="469.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Casos nuevos por persona-tiempo</tspan></text><text x="625.0" y="469.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Velocidad de aparición de casos</tspan></text><rect x="40.0" y="479.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="498.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Riesgo atribuible poblacional y</tspan><tspan x="50.0" dy="15">fracción etiológica</tspan></text><text x="280.0" y="498.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Parte atribuible a una exposición</tspan></text><text x="625.0" y="498.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Impacto potencial de eliminarla</tspan></text><text x="40.0" y="539.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Prevalencia ≈ incidencia × duración media de la enfermedad.</tspan></text><text x="40.0" y="586.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="596.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="627.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="618.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Incidencia</tspan><tspan x="285.0" dy="17">acumulada</tspan></text><text x="435.0" y="618.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Riesgo atribuible</tspan><tspan x="435.0" dy="17">poblacional</tspan></text><rect x="513.0" y="599.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="627.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Prevalencia</tspan></text><text x="735.0" y="618.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Densidad de</tspan><tspan x="735.0" dy="17">incidencia</tspan></text><text x="885.0" y="618.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Fracción etiológica</tspan><tspan x="885.0" dy="17">de riesgo</tspan></text><rect x="40.0" y="650.0" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="650.0" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="687.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Mide la extensión de la</tspan><tspan x="54.0" dy="16">enfermedad?</tspan></text><text x="285.0" y="687.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: cuenta solo casos</tspan><tspan x="285.0" dy="16">nuevos</tspan></text><text x="435.0" y="671.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: cuantifica el</tspan><tspan x="435.0" dy="16">impacto potencial de</tspan><tspan x="435.0" dy="16">eliminar una</tspan><tspan x="435.0" dy="16">exposición</tspan></text><text x="585.0" y="687.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: cuenta casos</tspan><tspan x="585.0" dy="16">nuevos y antiguos</tspan></text><text x="735.0" y="687.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: cuenta solo casos</tspan><tspan x="735.0" dy="16">nuevos</tspan></text><text x="885.0" y="679.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: cuantifica la parte</tspan><tspan x="885.0" dy="16">atribuible a una</tspan><tspan x="885.0" dy="16">exposición</tspan></text><rect x="40.0" y="596.0" width="920.0" height="136.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="756.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="784.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="806.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Mide la carga existente del problema y sirve para planificar recursos. En enfermedades crónicas los casos se acumulan y la prevalencia es alta.</tspan><tspan x="58.0" dy="18">• Un año corresponde a prevalencia de periodo. Incidencia acumulada y densidad de incidencia miden solo casos nuevos: velocidad y riesgo.</tspan><tspan x="58.0" dy="18">• Riesgo atribuible poblacional y fracción etiológica cuantifican qué parte se atribuye a una exposición, no cuántos enfermos hay.</tspan><tspan x="58.0" dy="18">• Perla: mejor tratamiento que prolonga la vida sin curar eleva la prevalencia aunque la incidencia no cambie.</tspan></text><text x="58.0" y="882.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Celentano y Szklo, Gordis Epidemiología, 6.ª ed. (2019); Lash et al., Modern Epidemiology, 4.ª ed. (2021); Porta, A Dictionary of Epidemiology, 6.ª ed. (2014).</tspan></text></svg>