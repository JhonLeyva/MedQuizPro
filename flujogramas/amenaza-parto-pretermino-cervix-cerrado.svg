<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1029" viewBox="0 0 1000 1029" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="33 semanas con contracciones cada 10-15 minutos, pérdida del tapón y cuello blando de 1 cm sin dilatación: amenaza de parto pretérmino"><title>33 semanas con contracciones cada 10-15 minutos, pérdida del tapón y cuello blando de 1 cm sin dilatación: amenaza de parto pretérmino</title><rect x="0.75" y="0.75" width="998.5" height="1027.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Parto pretérmino</tspan></text><rect x="301.1" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="388.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="388.3" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Amenaza de parto pretérmino</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Contracciones regulares entre las 22 y 37 semanas con cambios cervicales leves, sin</tspan><tspan x="58.0" dy="17">dilatación avanzada.</tspan><tspan x="58.0" dy="17">La longitud cervical corta (&lt; 25 mm) aumenta el riesgo.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Primigesta de 33 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dolor tipo cólico cada 10-15 minutos y pérdida del</tspan><tspan x="640.0" dy="16">tapón mucoso sanguinolento.</tspan><tspan x="640.0" dy="16">Cuello anterior, blando, de 1 cm de longitud, sin</tspan><tspan x="640.0" dy="16">dilatación.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CONTRACCIONES ANTES DE LAS 37 SEMANAS</tspan></text><text x="614.0" y="313.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,325.0 580.0,325.0 531.7,433.0 88.3,433.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="341.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="389.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="399"><tspan x="310.0" dy="0">33 semanas: contracciones regulares y tapón mucoso</tspan></text><line x1="559.8" y1="379.0" x2="606.0" y2="379.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="334.0" width="189.5" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="708.7" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="708.7" dy="0">Contracciones de Braxton Hicks</tspan></text><rect x="809.5" y="334.0" width="126.7" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="872.8" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="872.8" dy="0">Falsa labor de parto</tspan></text><rect x="614.0" y="366.0" width="183.8" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="705.9" y="383.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="705.9" dy="0">Trabajo de parto en fase activa</tspan></text><rect x="803.8" y="366.0" width="155.5" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="881.5" y="383.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="881.5" dy="0">Labor de parto prematuro</tspan></text><rect x="614.0" y="398.0" width="175.1" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="701.5" y="415.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="701.5" dy="0">Amenaza de parto prematuro</tspan></text><polygon points="88.3,437.0 531.7,437.0 483.3,513.0 136.7,513.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="162.7" cy="475.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="162.7" y="479.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="162.7" dy="0">1</tspan></text><text x="320.0" y="479.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="283"><tspan x="320.0" dy="0">¿Sin cambios en el cuello?</tspan></text><line x1="511.5" y1="475.0" x2="606.0" y2="475.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="446.0" width="201.6" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="714.8" y="463.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="714.8" dy="0">✕ Contracciones de Braxton Hicks</tspan></text><line x1="636.0" y1="459.5" x2="805.6" y2="459.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="614.0" y="478.0" width="138.8" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="683.4" y="495.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="683.4" dy="0">✕ Falsa labor de parto</tspan></text><line x1="636.0" y1="491.5" x2="742.8" y2="491.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="136.7,517.0 483.3,517.0 435.0,593.0 185.0,593.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="555.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="559.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">2</tspan></text><text x="320.0" y="551.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">¿Dilatación ≥ 3 cm o</tspan><tspan x="320.0" dy="17">borramiento ≥ 80 %?</tspan></text><line x1="463.2" y1="555.0" x2="606.0" y2="555.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="526.0" width="195.7" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="711.8" y="543.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="711.8" dy="0">✕ Trabajo de parto en fase activa</tspan></text><line x1="636.0" y1="539.5" x2="799.7" y2="539.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="614.0" y="558.0" width="167.6" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="697.8" y="575.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="697.8" dy="0">✕ Labor de parto prematuro</tspan></text><line x1="636.0" y1="571.5" x2="771.6" y2="571.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="597.0" x2="310.0" y2="616.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,615.0 315.0,615.0 310.0,623.0" fill="#0f766e"/><rect x="140.0" y="627.0" width="340.0" height="74.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="656.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">AMENAZA DE PARTO PRETÉRMINO</tspan></text><text x="310.0" y="680.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Cambios leves, sin dilatación</tspan></text><rect x="370.6" y="616.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="631.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="634.4" width="346.0" height="60.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="654.4" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="672.4" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">Corticoides + tocolisis 48 h.</tspan></text><text x="40.0" y="741.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="751.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="782.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="782.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Falsa labor de parto</tspan></text><text x="435.0" y="774.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Labor de parto</tspan><tspan x="435.0" dy="17">prematuro</tspan></text><rect x="513.0" y="754.9" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="774.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Amenaza parto</tspan><tspan x="585.0" dy="17">prematuro</tspan></text><text x="735.0" y="774.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Contracciones de</tspan><tspan x="735.0" dy="17">Braxton Hicks</tspan></text><text x="885.0" y="774.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Trabajo de parto en</tspan><tspan x="885.0" dy="17">fase activa</tspan></text><rect x="40.0" y="805.9" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="805.9" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="834.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Encaja?</tspan></text><text x="285.0" y="826.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: hay cambios</tspan><tspan x="285.0" dy="16">cervicales</tspan></text><text x="435.0" y="826.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no hay dilatación</tspan><tspan x="435.0" dy="16">aún</tspan></text><text x="585.0" y="826.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: contracciones +</tspan><tspan x="585.0" dy="16">cambios leves</tspan></text><text x="735.0" y="826.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: son indoloras y sin</tspan><tspan x="735.0" dy="16">cambios</tspan></text><text x="885.0" y="834.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: sin dilatación</tspan></text><rect x="40.0" y="751.9" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="879.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="907.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="929.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Hospitalizar: corticoides (hasta 34 semanas), tocolisis por 48 h (nifedipino) y descartar infección.</tspan><tspan x="58.0" dy="18">• Trabajo de parto pretérmino: dilatación ≥ 3 cm o borramiento ≥ 80 % con contracciones regulares.</tspan><tspan x="58.0" dy="18">• Braxton Hicks: irregulares, indoloras, sin cambios cervicales.</tspan></text><text x="58.0" y="987.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG Practice Bulletin n.º 171 (2016, reafirmado); MINSA Perú; Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>