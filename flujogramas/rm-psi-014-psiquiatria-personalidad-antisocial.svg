<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1088" viewBox="0 0 1000 1088" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Búsqueda del propio beneficio sin culpa ni cambio tras el daño ajeno: trastorno de personalidad antisocial"><title>Búsqueda del propio beneficio sin culpa ni cambio tras el daño ajeno: trastorno de personalidad antisocial</title><rect x="0.75" y="0.75" width="998.5" height="1086.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Psiquiatría · personalidad antisocial</tspan></text><rect x="412.6" y="32.0" width="109.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="467.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="93"><tspan x="467.3" dy="0">PSIQUIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Personalidad antisocial</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Grupo B (dramático, emocional, impulsivo): desprecio y violación de los derechos de los</tspan><tspan x="58.0" dy="17">demás desde la infancia o adolescencia.</tspan><tspan x="58.0" dy="17">Exige 18 años o más.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 40 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Prima su propia satisfacción a costa del sufrimiento</tspan><tspan x="640.0" dy="16">ajeno.</tspan><tspan x="640.0" dy="16">No cambia ni siente culpa a pesar de las</tspan><tspan x="640.0" dy="16">consecuencias.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CRITERIOS DEL TRASTORNO ANTISOCIAL (DSM-5-TR): TRES O MÁS</tspan></text><rect x="40.0" y="301.0" width="602.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="60.0" y="334.5" font-size="14" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">1</tspan></text><rect x="78.0" y="318.5" width="22.0" height="22.0" rx="5" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="89.0" y="334.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="89.0" dy="0">✓</tspan></text><text x="114.0" y="326.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Edad de 18 años o más, con trastorno de conducta antes de los 15</tspan></text><text x="114.0" y="343.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Requisito de inicio: el patrón se remonta a la infancia o adolescencia</tspan></text><rect x="40.0" y="366.0" width="602.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="60.0" y="399.5" font-size="14" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">2</tspan></text><rect x="78.0" y="383.5" width="22.0" height="22.0" rx="5" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="89.0" y="399.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="89.0" dy="0">✓</tspan></text><text x="114.0" y="391.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Incumplimiento de las normas legales, engaño y manipulación</tspan></text><text x="114.0" y="408.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Mentiras repetidas y uso de los demás para su beneficio</tspan></text><rect x="40.0" y="431.0" width="602.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="60.0" y="464.5" font-size="14" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">3</tspan></text><rect x="78.0" y="448.5" width="22.0" height="22.0" rx="5" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="89.0" y="464.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="89.0" dy="0">✓</tspan></text><text x="114.0" y="456.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Impulsividad, irritabilidad y agresiones</tspan></text><text x="114.0" y="473.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Desprecio imprudente por la seguridad propia o ajena</tspan></text><rect x="40.0" y="496.0" width="602.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="60.0" y="529.5" font-size="14" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">4</tspan></text><rect x="78.0" y="513.5" width="22.0" height="22.0" rx="5" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="89.0" y="529.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="89.0" dy="0">✓</tspan></text><text x="114.0" y="521.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Irresponsabilidad sostenida</tspan></text><text x="114.0" y="538.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Fallas repetidas en el trabajo y en las obligaciones</tspan></text><rect x="40.0" y="561.0" width="602.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="60.0" y="594.5" font-size="14" font-weight="800" font-style="normal" fill="#ea580c" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">5</tspan></text><rect x="78.0" y="578.5" width="22.0" height="22.0" rx="5" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="89.0" y="594.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="89.0" dy="0">✓</tspan></text><text x="114.0" y="586.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Ausencia de remordimiento</tspan></text><text x="114.0" y="603.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">No siente culpa ni cambia a pesar de las consecuencias: el dato del caso</tspan></text><rect x="524.3" y="550.0" width="122.5" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="585.6" y="565.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="585.6" dy="0">◆ CLAVE DEL CASO</tspan></text><rect x="660.0" y="301.0" width="300.0" height="317.0" rx="12" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/><text x="676.0" y="327.0" font-size="11.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">NO HACER</tspan></text><text x="682.0" y="406.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="0"><tspan x="682.0" dy="0">✕</tspan></text><text x="700.0" y="406.0" font-size="12" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="start" data-max="244"><tspan x="700.0" dy="0">Buscar un fármaco específico</tspan></text><text x="700.0" y="423.0" font-size="11" font-weight="400" font-style="normal" fill="#7f1d1d" text-anchor="start" data-max="244"><tspan x="700.0" dy="0">No existe; la psicoterapia rinde poco</tspan></text><text x="682.0" y="455.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="0"><tspan x="682.0" dy="0">✕</tspan></text><text x="700.0" y="455.0" font-size="12" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="start" data-max="244"><tspan x="700.0" dy="0">Confundir con esquizoide</tspan></text><text x="700.0" y="472.0" font-size="11" font-weight="400" font-style="normal" fill="#7f1d1d" text-anchor="start" data-max="244"><tspan x="700.0" dy="0">Ese es frío y desapegado, sin intención de</tspan><tspan x="700.0" dy="16">dañar</tspan></text><text x="682.0" y="520.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="0"><tspan x="682.0" dy="0">✕</tspan></text><text x="700.0" y="520.0" font-size="12" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="start" data-max="244"><tspan x="700.0" dy="0">Olvidar el consumo de sustancias</tspan></text><text x="700.0" y="537.0" font-size="11" font-weight="400" font-style="normal" fill="#7f1d1d" text-anchor="start" data-max="244"><tspan x="700.0" dy="0">Es la comorbilidad que se busca y se trata</tspan></text><rect x="40.0" y="636.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="662.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Satisfacción propia a costa de otros + sin culpa = antisocial</tspan></text><text x="60.0" y="681.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Obsesivo, limítrofe, paranoide y esquizoide tienen otros patrones.</tspan></text><text x="40.0" y="748.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="758.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="780.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="780.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Obsesivo</tspan></text><text x="435.0" y="780.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Limítrofe</tspan></text><rect x="513.0" y="761.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="780.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Antisocial</tspan></text><text x="735.0" y="780.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Paranoide</tspan></text><text x="885.0" y="780.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Esquizoide</tspan></text><rect x="40.0" y="795.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="795.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="824.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Trastorno de</tspan><tspan x="54.0" dy="16">personalidad?</tspan></text><text x="285.0" y="824.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: perfeccionismo y</tspan><tspan x="285.0" dy="16">rigidez, con culpa</tspan></text><text x="435.0" y="816.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: inestabilidad</tspan><tspan x="435.0" dy="16">afectiva y miedo al</tspan><tspan x="435.0" dy="16">abandono</tspan></text><text x="585.0" y="824.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: daña a otros sin</tspan><tspan x="585.0" dy="16">culpa ni cambio</tspan></text><text x="735.0" y="816.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: desconfianza</tspan><tspan x="735.0" dy="16">sistemática, sin esa</tspan><tspan x="735.0" dy="16">conducta</tspan></text><text x="885.0" y="816.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: desapego y</tspan><tspan x="885.0" dy="16">frialdad sin intención</tspan><tspan x="885.0" dy="16">de dañar</tspan></text><rect x="40.0" y="758.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="885.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="913.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="935.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• DSM-5-TR: edad mínima de 18 años, trastorno de conducta antes de los 15 y tres o más criterios (normas legales, engaño, impulsividad, agresión,</tspan><tspan x="58.0" dy="18">   imprudencia, irresponsabilidad, falta de remordimiento).</tspan><tspan x="58.0" dy="18">• El dato que decide el caso es la ausencia de remordimiento y de culpa; el esquizoide es frío pero sin intención de dañar.</tspan><tspan x="58.0" dy="18">• Obsesivo: perfeccionismo y rigidez. Limítrofe: inestabilidad afectiva, miedo al abandono y autolesiones. Paranoide: desconfianza sistemática.</tspan><tspan x="58.0" dy="18">• No hay fármaco específico: psicoterapia de eficacia limitada y tratamiento de comorbilidades (consumo de sustancias). Se revisa la conducta antes de los</tspan><tspan x="58.0" dy="18">   15 años.</tspan></text><text x="58.0" y="1047.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: APA, DSM-5-TR (2022); Kaplan y Sadock, Sinopsis de Psiquiatría, 12.ª ed. (2021); Harrison, Principios de Medicina Interna, 21.ª ed. (2022).</tspan></text></svg>