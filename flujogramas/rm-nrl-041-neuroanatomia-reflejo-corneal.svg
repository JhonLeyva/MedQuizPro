<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1149" viewBox="0 0 1000 1149" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La vía aferente del reflejo corneal es el nasociliar, rama del oftálmico (V1) del trigémino"><title>La vía aferente del reflejo corneal es el nasociliar, rama del oftálmico (V1) del trigémino</title><rect x="0.75" y="0.75" width="998.5" height="1147.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neuroanatomía · reflejo corneal</tspan></text><rect x="386.6" y="32.0" width="113.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="443.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="98"><tspan x="443.5" dy="0">NEUROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Reflejo corneal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Parpadeo bilateral al tocar la córnea con un algodón.</tspan><tspan x="58.0" dy="17">Arco polisináptico del tronco encefálico: aferente V1, eferente VII.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué nervio es la vía aferente del reflejo corneal?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">RECORRIDO DEL REFLEJO CORNEAL</tspan></text><rect x="40.0" y="253.0" width="920.0" height="111.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="253.0" width="108.0" height="111.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="312.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Estímulo</tspan></text><rect x="40.0" y="364.0" width="920.0" height="111.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="364.0" width="108.0" height="111.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="423.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Aferente</tspan></text><rect x="40.0" y="475.0" width="920.0" height="111.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="475.0" width="108.0" height="111.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="534.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Centro</tspan></text><rect x="40.0" y="586.0" width="920.0" height="111.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="586.0" width="108.0" height="111.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="645.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Eferente</tspan></text><line x1="348.0" y1="300.5" x2="355.0" y2="300.5" stroke="#ea580c" stroke-width="2.2"/><line x1="355.0" y1="300.5" x2="355.0" y2="411.5" stroke="#ea580c" stroke-width="2.2"/><line x1="355.0" y1="411.5" x2="353.0" y2="411.5" stroke="#ea580c" stroke-width="2.2"/><polygon points="353.0,416.5 353.0,406.5 362.0,411.5" fill="#ea580c"/><line x1="552.0" y1="411.5" x2="559.0" y2="411.5" stroke="#0f766e" stroke-width="2.2"/><line x1="559.0" y1="411.5" x2="559.0" y2="530.5" stroke="#0f766e" stroke-width="2.2"/><line x1="559.0" y1="530.5" x2="557.0" y2="530.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="557.0,535.5 557.0,525.5 566.0,530.5" fill="#0f766e"/><line x1="756.0" y1="530.5" x2="763.0" y2="530.5" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="530.5" x2="763.0" y2="633.5" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="633.5" x2="761.0" y2="633.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="761.0,638.5 761.0,628.5 770.0,633.5" fill="#0f766e"/><rect x="158.0" y="266.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="282.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Algodón en la córnea</tspan></text><text x="168.0" y="299.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Se toca suavemente, sin apoyar</tspan><tspan x="168.0" dy="14.5">sobre las pestañas</tspan></text><circle cx="158.0" cy="266.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="270.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="362.0" y="377.0" width="190.0" height="69.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="372.0" y="393.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Nervio nasociliar (V1)</tspan></text><text x="372.0" y="410.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Ciliares largos, rama del oftálmico</tspan><tspan x="372.0" dy="14.5">del trigémino</tspan></text><circle cx="362.0" cy="377.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="362.0" y="381.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="362.0" dy="0">2</tspan></text><rect x="566.0" y="488.0" width="190.0" height="85.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="576.0" y="504.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Tronco encefálico</tspan></text><text x="576.0" y="521.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Núcleo sensitivo del V, formación</tspan><tspan x="576.0" dy="14.5">reticular y núcleos faciales de</tspan><tspan x="576.0" dy="14.5">ambos lados</tspan></text><circle cx="566.0" cy="488.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="566.0" y="492.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="566.0" dy="0">3</tspan></text><rect x="770.0" y="599.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="780.0" y="615.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Nervio facial (VII)</tspan></text><text x="780.0" y="632.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Orbicular de los párpados:</tspan><tspan x="780.0" dy="14.5">parpadeo bilateral</tspan></text><circle cx="770.0" cy="599.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="770.0" y="603.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="770.0" dy="0">4</tspan></text><rect x="40.0" y="715.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="741.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Aferente = nasociliar (V1); eferente = facial (VII)</tspan></text><text x="60.0" y="760.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El cigomático es rama del maxilar (V2) y el lagrimal no conduce el tacto corneal.</tspan></text><text x="40.0" y="827.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="837.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="859.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="859.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Óptico</tspan></text><text x="435.0" y="859.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Cigomático</tspan></text><rect x="513.0" y="840.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="859.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Nasociliar</tspan></text><text x="735.0" y="859.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Lagrimal</tspan></text><text x="885.0" y="859.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Oculomotor</tspan></text><rect x="40.0" y="874.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="874.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="911.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Vía aferente?</tspan></text><text x="285.0" y="903.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: transmite la visión,</tspan><tspan x="285.0" dy="16">no el tacto corneal</tspan></text><text x="435.0" y="903.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: rama del maxilar</tspan><tspan x="435.0" dy="16">(V2)</tspan></text><text x="585.0" y="895.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: rama del oftálmico</tspan><tspan x="585.0" dy="16">(V1) que da los ciliares</tspan><tspan x="585.0" dy="16">largos</tspan></text><text x="735.0" y="903.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: rama sensitiva de</tspan><tspan x="735.0" dy="16">la glándula lagrimal</tspan></text><text x="885.0" y="903.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: mueve el globo y</tspan><tspan x="885.0" dy="16">eleva el párpado</tspan></text><rect x="40.0" y="837.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="964.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="992.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1014.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La sensibilidad corneal viaja por los nervios ciliares largos, ramas del nasociliar; este es una de las tres ramas del oftálmico junto con frontal y lagrimal.</tspan><tspan x="58.0" dy="18">• Las señales llegan al núcleo sensitivo del trigémino, pasan por la formación reticular y alcanzan ambos núcleos faciales: por eso el parpadeo es</tspan><tspan x="58.0" dy="18">   consensual.</tspan><tspan x="58.0" dy="18">• Lesión de V1: se pierde el reflejo del lado afectado, pero el ojo sano parpadea. Lesión del VII: no cierra el párpado ipsilateral.</tspan><tspan x="58.0" dy="18">• Perla: en el coma, un reflejo corneal abolido indica disfunción pontina.</tspan></text><text x="58.0" y="1108.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Kandel, Principles of Neural Science 6.ª ed. (2021); Bradley y Daroff, Neurología clínica 8.ª ed. (2022).</tspan></text></svg>