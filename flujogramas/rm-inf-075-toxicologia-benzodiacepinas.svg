<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1070" viewBox="0 0 1000 1070" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la sobredosis de clonazepam el antídoto es el flumazenilo, reservado a depresión respiratoria o coma"><title>En la sobredosis de clonazepam el antídoto es el flumazenilo, reservado a depresión respiratoria o coma</title><rect x="0.75" y="0.75" width="998.5" height="1068.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Toxicología · benzodiacepinas</tspan></text><rect x="379.5" y="32.0" width="121.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="440.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="106"><tspan x="440.5" dy="0">INFECTOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Intoxicación por benzodiacepinas</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Potencian al GABA en el receptor GABA-A.</tspan><tspan x="58.0" dy="17">Somnolencia, ataxia, hipotonía y coma superficial.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Joven de 20 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Ingiere 30 tabletas de clonazepam de 2 mg tras una</tspan><tspan x="640.0" dy="16">discusión.</tspan><tspan x="640.0" dy="16">¿Cuál es el antídoto de elección?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SE USA SEGÚN LA SITUACIÓN</tspan></text><rect x="40.0" y="285.0" width="920.0" height="112.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="285.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="345.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Siempre</tspan></text><rect x="40.0" y="397.0" width="920.0" height="112.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="397.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="453.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Antídoto</tspan><tspan x="94.0" dy="14">específico</tspan></text><rect x="40.0" y="509.0" width="920.0" height="112.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="509.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="565.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">No</tspan><tspan x="94.0" dy="14">corresponde</tspan></text><line x1="307.2" y1="340.5" x2="314.2" y2="340.5" stroke="#ea580c" stroke-width="2.2"/><line x1="314.2" y1="340.5" x2="314.2" y2="452.5" stroke="#ea580c" stroke-width="2.2"/><line x1="314.2" y1="452.5" x2="312.2" y2="452.5" stroke="#ea580c" stroke-width="2.2"/><polygon points="312.2,457.5 312.2,447.5 321.2,452.5" fill="#ea580c"/><line x1="470.4" y1="452.5" x2="477.4" y2="452.5" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="452.5" x2="477.4" y2="565.0" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="565.0" x2="475.4" y2="565.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="475.4,570.0 475.4,560.0 484.4,565.0" fill="#0f766e"/><line x1="633.6" y1="565.0" x2="640.6" y2="565.0" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="565.0" x2="640.6" y2="548.5" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="548.5" x2="638.6" y2="548.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="638.6,553.5 638.6,543.5 647.6,548.5" fill="#0f766e"/><line x1="796.8" y1="548.5" x2="803.8" y2="548.5" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="548.5" x2="803.8" y2="564.5" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="564.5" x2="801.8" y2="564.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="801.8,569.5 801.8,559.5 810.8,564.5" fill="#0f766e"/><rect x="158.0" y="298.0" width="149.2" height="85.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="314.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Soporte vital</tspan></text><text x="168.0" y="331.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Vía aérea, oxigenación y</tspan><tspan x="168.0" dy="14.5">monitorización</tspan><tspan x="168.0" dy="14.5">prolongada</tspan></text><circle cx="158.0" cy="298.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="302.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="321.2" y="410.0" width="149.2" height="85.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="331.2" y="426.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Flumazenilo</tspan></text><text x="331.2" y="443.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Si hay depresión</tspan><tspan x="331.2" dy="14.5">respiratoria o coma grave</tspan><tspan x="331.2" dy="14.5">y sin contraindicaciones</tspan></text><circle cx="321.2" cy="410.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="321.2" y="414.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="321.2" dy="0">2</tspan></text><rect x="484.4" y="522.0" width="149.2" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="494.4" y="538.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Atropina y</tspan><tspan x="494.4" dy="16">pralidoxima</tspan></text><text x="494.4" y="571.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Antídotos de los</tspan><tspan x="494.4" dy="14.5">organofosforados</tspan></text><circle cx="484.4" cy="522.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="484.4" y="526.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="484.4" dy="0">3</tspan></text><rect x="647.6" y="522.0" width="149.2" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="657.6" y="538.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Naloxona</tspan></text><text x="657.6" y="555.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Antídoto de los opioides</tspan></text><circle cx="647.6" cy="522.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="647.6" y="526.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="647.6" dy="0">4</tspan></text><rect x="810.8" y="522.0" width="149.2" height="85.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="820.8" y="538.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Carbón activado</tspan></text><text x="820.8" y="555.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Descontaminante en la</tspan><tspan x="820.8" dy="14.5">primera hora con vía</tspan><tspan x="820.8" dy="14.5">aérea protegida</tspan></text><circle cx="810.8" cy="522.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="810.8" y="526.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="810.8" dy="0">5</tspan></text><rect x="40.0" y="639.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="665.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Antídoto de la benzodiacepina = flumazenilo</tspan></text><text x="60.0" y="684.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Atropina, pralidoxima y naloxona corresponden a otros tóxicos; el carbón no es antídoto.</tspan></text><text x="40.0" y="751.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="761.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="783.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="764.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="783.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Flumazenilo</tspan></text><text x="435.0" y="783.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Atropina</tspan></text><text x="585.0" y="783.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Pralidoxima</tspan></text><text x="735.0" y="783.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Naloxona</tspan></text><text x="885.0" y="783.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Carbón activado</tspan></text><rect x="40.0" y="798.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="798.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="835.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Antídoto de elección?</tspan></text><text x="285.0" y="819.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: antagonista del</tspan><tspan x="285.0" dy="16">receptor</tspan><tspan x="285.0" dy="16">benzodiacepínico</tspan></text><text x="435.0" y="827.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: antídoto de</tspan><tspan x="435.0" dy="16">organofosforados</tspan></text><text x="585.0" y="827.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: antídoto de</tspan><tspan x="585.0" dy="16">organofosforados</tspan></text><text x="735.0" y="827.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: antídoto de</tspan><tspan x="735.0" dy="16">opioides</tspan></text><text x="885.0" y="827.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: descontamina, no</tspan><tspan x="885.0" dy="16">es antídoto</tspan></text><rect x="40.0" y="761.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="888.0" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="916.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="938.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El tratamiento es de soporte: vía aérea, oxigenación, monitorización y observación prolongada por la vida media larga.</tspan><tspan x="58.0" dy="18">• Flumazenilo: antagonista competitivo del sitio benzodiacepínico; dosis de 0,2 mg IV titulada; dura menos que el clonazepam y puede requerir repetirse.</tspan><tspan x="58.0" dy="18">• Evitar si hay dependencia, epilepsia o coingestión proconvulsivante (tricíclicos, cocaína, isoniacida): puede causar convulsiones y abstinencia.</tspan><tspan x="58.0" dy="18">• Atropina y pralidoxima son del organofosforado; naloxona, del opioide; el carbón activado no es antídoto. Investigar coingestión de paracetamol.</tspan></text><text x="58.0" y="1014.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Penninga EI y cols. Adverse events associated with flumazenil treatment for the management of suspected benzodiazepine intoxication (Basic Clin Pharmacol Toxicol</tspan><tspan x="58.0" dy="15">2016); Zamani N y cols. Strategies for the treatment of acute benzodiazepine toxicity in a clinical setting: the role of antidotes (Expert Opin Drug Metab Toxicol 2022).</tspan></text></svg>