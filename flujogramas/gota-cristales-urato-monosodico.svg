0" dy="17">Rodilla, ancianos</tspan></text><rect x="668.0" y="203.0" width="292" height="131.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><path d="M668.0,213.0 a10,10 0 0 1 10,-10 h272 a10,10 0 0 1 10,10 v22.0 h-292 z" fill="#e2e8f0"/><text x="814.0" y="227.5" font-size="13.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="264"><tspan x="814.0" dy="0">Artritis séptica</tspan></text><text x="814.0" y="259.0" font-size="12" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="264"><tspan x="814.0" dy="0">Líquido purulento</tspan><tspan x="814.0" dy="17">&gt; 50 000 leucocitos</tspan><tspan x="814.0" dy="17">Gram y cultivo +</tspan></text><line x1="186.0" y1="334.0" x2="186.0" y2="355.0" stroke="#0f766e" stroke-width="2"/><polygon points="181.0,354.0 191.0,354.0 186.0,362.0" fill="#0f766e"/><rect x="100.0" y="362.0" width="800" height="82.5" rx="10" fill="#134e4a" stroke="#134e4a" stroke-width="1.5"/><text x="500.0" y="388.0" font-size="12" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="772"><tspan x="500.0" dy="0">CRISIS DE GOTA</tspan></text><text x="500.0" y="411.0" font-size="12.5" font-weight="400" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="772"><tspan x="500.0" dy="0">AINE, colchicina o corticoide</tspan><tspan x="500.0" dy="17.5">El alopurinol no trata la crisis; si ya lo toma, no suspenderlo</tspan></text><rect x="40" y="470.5" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="498.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="520.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Podagra en varón obeso tras alcohol y comida abundante = gota.</tspan><tspan x="58.0" dy="18">• Meta de uricemia con tratamiento hipouricemiante: &lt; 6 mg/dL.</tspan></text><text x="58.0" y="560.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACR 2020 Gout Guideline · EULAR 2016 · Harrison 21.ª ed.</tspan></text></svg>
