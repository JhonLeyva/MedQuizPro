<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1084" viewBox="0 0 1000 1084" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El edema de las piernas en el tercer trimestre se debe sobre todo a la compresión de la cava inferior"><title>El edema de las piernas en el tercer trimestre se debe sobre todo a la compresión de la cava inferior</title><rect x="0.75" y="0.75" width="998.5" height="1082.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · edema fisiológico del embarazo</tspan></text><rect x="463.2" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="542.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="542.9" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Edema fisiológico</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Aparece en cerca de la mitad de las gestantes, en el tercer trimestre.</tspan><tspan x="58.0" dy="17">Bilateral, simétrico, vespertino y que mejora con el reposo.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante de 30 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Aumento de volumen de las piernas que cede en parte</tspan><tspan x="640.0" dy="16">al reposo.</tspan><tspan x="640.0" dy="16">Sin antecedentes de importancia.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL ÚTERO GRÁVIDO AL EDEMA</tspan></text><text x="40.0" y="297.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="430"><tspan x="40.0" dy="0">QUÉ OCURRE</tspan></text><text x="516.0" y="297.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="444"><tspan x="516.0" dy="0">QUÉ SE OBSERVA</tspan></text><rect x="40.0" y="307.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="336.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="341.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><text x="84.0" y="333.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Útero grávido sobre la cava inferior</tspan></text><text x="84.0" y="350.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Más en decúbito supino y al final del embarazo</tspan></text><line x1="476.0" y1="336.5" x2="503.0" y2="336.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,331.5 502.0,341.5 510.0,336.5" fill="#ea580c"/><rect x="516.0" y="309.0" width="444.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="530.0" y="333.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Sube la presión venosa en las piernas</tspan></text><text x="530.0" y="350.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Retorno venoso lento, sobre todo en la tarde</tspan></text><line x1="255.0" y1="368.0" x2="255.0" y2="381.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,380.0 260.0,380.0 255.0,388.0" fill="#0f766e"/><rect x="40.0" y="390.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="419.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="424.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">2</tspan></text><text x="84.0" y="416.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Retención de sodio y agua</tspan></text><text x="84.0" y="433.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Progesterona y sistema renina-angiotensina-aldosterona</tspan></text><line x1="476.0" y1="419.5" x2="503.0" y2="419.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,414.5 502.0,424.5 510.0,419.5" fill="#ea580c"/><rect x="516.0" y="392.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="416.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Aumenta el líquido extravascular</tspan></text><text x="530.0" y="433.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Edema que deja fóvea</tspan></text><line x1="255.0" y1="451.0" x2="255.0" y2="464.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,463.0 260.0,463.0 255.0,471.0" fill="#0f766e"/><rect x="40.0" y="473.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="502.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="507.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">3</tspan></text><text x="84.0" y="499.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Hemodilución</tspan></text><text x="84.0" y="516.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">El plasma crece más que los eritrocitos</tspan></text><line x1="476.0" y1="502.5" x2="503.0" y2="502.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,497.5 502.0,507.5 510.0,502.5" fill="#ea580c"/><rect x="516.0" y="475.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="499.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Baja la presión oncótica</tspan></text><text x="530.0" y="516.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">El líquido pasa al intersticio</tspan></text><line x1="255.0" y1="534.0" x2="255.0" y2="547.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,546.0 260.0,546.0 255.0,554.0" fill="#0f766e"/><rect x="40.0" y="556.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="585.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="590.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">4</tspan></text><text x="84.0" y="582.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Cuadro final</tspan></text><text x="84.0" y="599.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Suma de los tres mecanismos</tspan></text><line x1="476.0" y1="585.5" x2="503.0" y2="585.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,580.5 502.0,590.5 510.0,585.5" fill="#ea580c"/><rect x="516.0" y="558.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="582.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Edema bilateral, simétrico y vespertino</tspan></text><text x="530.0" y="599.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Cede con reposo y elevación de las piernas</tspan></text><rect x="40.0" y="633.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="659.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Compresión de la vena cava inferior</tspan></text><text x="60.0" y="678.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El gasto cardiaco y el volumen sanguíneo suben en el embarazo normal, la presión venosa de las piernas también.</tspan></text><text x="40.0" y="745.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="755.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="786.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="758.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="777.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Compresión de la</tspan><tspan x="285.0" dy="17">vena cava inferior</tspan></text><text x="435.0" y="777.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Aumento de la</tspan><tspan x="435.0" dy="17">presión arterial</tspan></text><text x="585.0" y="777.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Disminución de la</tspan><tspan x="585.0" dy="17">presión venosa</tspan></text><text x="735.0" y="777.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Aumento del gasto</tspan><tspan x="735.0" dy="17">cardíaco</tspan></text><text x="885.0" y="777.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Disminución del</tspan><tspan x="885.0" dy="17">volumen sanguíneo</tspan></text><rect x="40.0" y="809.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="809.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="846.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Mecanismo?</tspan></text><text x="285.0" y="838.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: el útero comprime</tspan><tspan x="285.0" dy="16">la cava y las ilíacas</tspan></text><text x="435.0" y="830.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: la PA tiende a</tspan><tspan x="435.0" dy="16">bajar a mitad del</tspan><tspan x="435.0" dy="16">embarazo</tspan></text><text x="585.0" y="830.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: la presión venosa</tspan><tspan x="585.0" dy="16">de las piernas sube, no</tspan><tspan x="585.0" dy="16">baja</tspan></text><text x="735.0" y="830.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: sube el gasto</tspan><tspan x="735.0" dy="16">cardiaco, pero no</tspan><tspan x="735.0" dy="16">explica el edema local</tspan></text><text x="885.0" y="830.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: el volumen</tspan><tspan x="885.0" dy="16">sanguíneo aumenta</tspan><tspan x="885.0" dy="16">40-50 %</tspan></text><rect x="40.0" y="755.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="899.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="927.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="949.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Mecanismo principal: el útero grávido comprime la vena cava inferior y las ilíacas, sobre todo en decúbito supino, y sube la presión hidrostática venosa</tspan><tspan x="58.0" dy="18">   de las piernas.</tspan><tspan x="58.0" dy="18">• Contribuyen la retención de sodio y agua (progesterona y aldosterona) y la caída de la presión oncótica por la hemodilución.</tspan><tspan x="58.0" dy="18">• Se alivia con decúbito lateral izquierdo, elevar las piernas y medias de compresión; no se dan diuréticos.</tspan><tspan x="58.0" dy="18">• Banderas rojas: edema unilateral doloroso (trombosis venosa), de cara y manos de aparición brusca, o con PA de 140/90 o más (preeclampsia).</tspan></text><text x="58.0" y="1043.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG Practice Bulletin N.º 222 (Obstet Gynecol 2020); Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>