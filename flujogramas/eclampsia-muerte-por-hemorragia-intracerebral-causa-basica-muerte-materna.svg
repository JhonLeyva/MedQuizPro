<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1123" viewBox="0 0 1000 1123" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Eclampsia que termina en hemorragia intracerebral: la causa básica es la eclampsia"><title>Eclampsia que termina en hemorragia intracerebral: la causa básica es la eclampsia</title><rect x="0.75" y="0.75" width="998.5" height="1122.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Vigilancia epidemiológica · muerte materna</tspan></text><rect x="455.5" y="32.0" width="143.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="527.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="127"><tspan x="527.2" dy="0">SALUD PÚBLICA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Causa básica de muerte (CIE-10)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Es la enfermedad que inició la cadena de eventos que llevó a la muerte.</tspan><tspan x="58.0" dy="17">Es la que se usa para la estadística y la prevención.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Primigesta de 36 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Sin HTA crónica conocida; ingresa con eclampsia.</tspan><tspan x="640.0" dy="16">Fallece por hemorragia intracerebral.</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#94a3b8"/><line x1="500.0" y1="349.0" x2="500.0" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="379.0" x2="733.5" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="379.0" x2="266.5" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,407.0 271.5,407.0 266.5,415.0" fill="#94a3b8"/><line x1="733.5" y1="379.0" x2="733.5" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,407.0 738.5,407.0 733.5,415.0" fill="#94a3b8"/><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#0f766e"/><line x1="500.0" y1="349.0" x2="500.0" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="379.0" x2="733.5" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="733.5" y1="379.0" x2="733.5" y2="408.0" stroke="#0f766e" stroke-width="3"/><polygon points="728.5,407.0 738.5,407.0 733.5,415.0" fill="#0f766e"/><rect x="205.1" y="388.0" width="122.8" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="266.5" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">La complicación final</tspan></text><rect x="668.5" y="388.0" width="129.9" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="733.5" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">La que lo empezó todo</tspan></text><polygon points="240.0,320.0 266.0,291.0 734.0,291.0 760.0,320.0 734.0,349.0 266.0,349.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="320.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="325.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="324.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">¿Qué enfermedad inició la cadena que llevó a la muerte?</tspan></text><rect x="40.0" y="415.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="266.5" y="451.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Causa directa</tspan></text><text x="266.5" y="474.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Hemorragia intracerebral (no es la básica)</tspan></text><rect x="507.0" y="415.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="733.5" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">CAUSA BÁSICA: ECLAMPSIA</tspan></text><text x="733.5" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Se registra en la vigilancia</tspan><tspan x="733.5" dy="17">Muerte materna directa</tspan></text><text x="40.0" y="545.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="557.5" width="351.0" height="272.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="567.5" width="239.7" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="581.5" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="309"><tspan x="61.0" dy="0">CERTIFICADO DE DEFUNCIÓN (ESQUEMA)</tspan></text><g data-box="54.0 595.5 323.0 210.0"><g transform="translate(54.0,595.5) scale(0.95)"><rect x="10" y="6" width="320" height="206" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="170" y="26" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Causas de la muerte (certificado)</text><text x="170" y="26" font-size="10.5" font-weight="800" fill="#0f172a" text-anchor="middle" data-max="0">Causas de la muerte (certificado)</text><rect x="24" y="40" width="290" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="169.0" y="60.675" font-size="10.5" font-weight="800" fill="#334155" text-anchor="middle" data-max="0">a) Directa: hemorragia intracerebral</text><text x="170" y="88" font-size="9.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">debida a ↓</text><text x="170" y="88" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">debida a ↓</text><rect x="24" y="96" width="290" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="169.0" y="116.675" font-size="10.5" font-weight="800" fill="#334155" text-anchor="middle" data-max="0">b) Intermedia: convulsiones</text><text x="170" y="144" font-size="9.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">debida a ↓</text><text x="170" y="144" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">debida a ↓</text><rect x="24" y="152" width="290" height="40" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5"/><text x="169.0" y="175.675" font-size="10.5" font-weight="800" fill="#9a3412" text-anchor="middle" data-max="0">c) Básica: ECLAMPSIA (inició la cadena)</text></g></g><rect x="413.0" y="557.5" width="547.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="431.0" cy="573.0" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="431.0" y="577.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="431.0" dy="0">1</tspan></text><text x="449.0" y="577.5" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="503"><tspan x="449.0" dy="0">Línea a: causa directa (hemorragia).</tspan></text><rect x="413.0" y="595.5" width="547.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="431.0" cy="611.0" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="431.0" y="615.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="431.0" dy="0">2</tspan></text><text x="449.0" y="615.5" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="503"><tspan x="449.0" dy="0">Línea b: intermedia.</tspan></text><rect x="413.0" y="633.5" width="547.0" height="31.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="431.0" cy="649.0" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="431.0" y="653.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="431.0" dy="0">3</tspan></text><text x="449.0" y="653.5" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="503"><tspan x="449.0" dy="0">Última línea: causa básica (eclampsia).</tspan></text><text x="40.0" y="869.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="879.5" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="902.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="882.5" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="303.8" y="902.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Eclampsia</tspan></text><text x="491.2" y="902.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">HTA crónica</tspan></text><text x="678.8" y="902.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Hemorragia intracerebral</tspan></text><text x="866.2" y="902.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Pretérmino</tspan></text><rect x="40.0" y="916.5" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="916.5" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="937.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Tipo</tspan></text><text x="303.8" y="937.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Causa básica</tspan></text><text x="491.2" y="937.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No tenía</tspan></text><text x="678.8" y="937.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Causa directa</tspan></text><text x="866.2" y="937.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No es causa</tspan></text><rect x="40.0" y="879.5" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="974.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1002.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1024.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Cadena: eclampsia → hemorragia intracerebral → muerte. Causa básica: eclampsia.</tspan><tspan x="58.0" dy="18">• La hemorragia es la causa directa; no se registra como básica.</tspan><tspan x="58.0" dy="18">• No había HTA crónica; la edad gestacional no es una causa.</tspan></text><text x="58.0" y="1082.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, CIE-10 y CIE-MM (2012); MINSA Perú, vigilancia de muerte materna.</tspan></text></svg>