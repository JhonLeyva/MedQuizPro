<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1311" viewBox="0 0 1000 1311" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La restricción del crecimiento fetal tipo I (simétrico) se asocia a causas genéticas del propio feto"><title>La restricción del crecimiento fetal tipo I (simétrico) se asocia a causas genéticas del propio feto</title><rect x="0.75" y="0.75" width="998.5" height="1309.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · restricción del crecimiento fetal</tspan></text><rect x="462.5" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="542.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="542.3" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="131.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Restricción del crecimiento fetal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Peso fetal estimado o circunferencia abdominal menor del percentil 3, o menor del 10 con</tspan><tspan x="58.0" dy="17">Doppler alterado.</tspan><tspan x="58.0" dy="17">Precoz si es antes de las 32 semanas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="131.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="129.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de causas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál de los factores se relaciona con el tipo I?</tspan></text><rect x="640.0" y="192.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="205.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="205.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="253.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SE PIENSA EN ESTE ORDEN</tspan></text><rect x="40.0" y="265.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="310.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="338.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">1</tspan></text><rect x="124.0" y="265.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="293.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿El feto es simétrico o asimétrico?</tspan></text><rect x="136.0" y="307.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="327.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Simétrico: todo el cuerpo disminuye de forma proporcional</tspan></text><text x="152.0" y="346.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Es el tipo I; en el II se preserva el cráneo y se reduce el abdomen.</tspan></text><line x1="77.0" y1="368.0" x2="77.0" y2="387.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,386.0 82.0,386.0 77.0,394.0" fill="#0f766e"/><text x="134.0" y="386.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="396.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="441.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="469.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">2</tspan></text><rect x="124.0" y="396.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="424.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Cuándo comienza?</tspan></text><rect x="136.0" y="438.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="458.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Desde etapas tempranas del embarazo</tspan></text><text x="152.0" y="477.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">El tipo II aparece en el tercer trimestre.</tspan></text><line x1="77.0" y1="499.0" x2="77.0" y2="518.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,517.0 82.0,517.0 77.0,525.0" fill="#0f766e"/><text x="134.0" y="517.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="527.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="572.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="600.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">3</tspan></text><rect x="124.0" y="527.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="555.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Cuál es el origen?</tspan></text><rect x="136.0" y="569.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="589.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Alteración intrínseca del feto: genéticos, infecciones, teratógenos</tspan></text><text x="152.0" y="608.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Hipertensión, desprendimiento, placenta previa y toxemia son causas placentarias.</tspan></text><rect x="40.0" y="648.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="674.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Restricción simétrica = causa genética o fetal</tspan></text><text x="60.0" y="693.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Hipertensión, desprendimiento, placenta previa y toxemia corresponden al tipo II.</tspan></text><text x="40.0" y="754.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">RESTRICCIÓN DEL CRECIMIENTO FETAL: TIPO I Y TIPO II</tspan></text><rect x="40.0" y="766.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="785.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Tipo</tspan></text><text x="250.0" y="785.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="224"><tspan x="250.0" dy="0">Proporciones</tspan></text><text x="490.0" y="785.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="224"><tspan x="490.0" dy="0">Inicio</tspan></text><text x="730.0" y="785.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="224"><tspan x="730.0" dy="0">Causas</tspan></text><rect x="40.0" y="795.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="814.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Tipo I</tspan></text><text x="250.0" y="814.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="250.0" dy="0">Cabeza, abdomen y fémur</tspan><tspan x="250.0" dy="15">proporcionalmente disminuidos</tspan></text><text x="490.0" y="814.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="490.0" dy="0">Temprano</tspan></text><text x="730.0" y="814.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="730.0" dy="0">Genéticas, infecciones congénitas y</tspan><tspan x="730.0" dy="15">teratógenos (este caso)</tspan></text><rect x="140.6" y="806.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="186.0" y="821.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="186.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="839.0" width="920.0" height="59.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="858.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Tipo II</tspan></text><text x="250.0" y="858.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="250.0" dy="0">Cráneo preservado y abdomen reducido</tspan></text><text x="490.0" y="858.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="490.0" dy="0">Tercer trimestre</tspan></text><text x="730.0" y="858.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="730.0" dy="0">Insuficiencia placentaria: hipertensión,</tspan><tspan x="730.0" dy="15">desprendimiento, placenta previa,</tspan><tspan x="730.0" dy="15">toxemia</tspan></text><text x="40.0" y="938.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="948.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="987.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="979.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hipertensión</tspan><tspan x="285.0" dy="17">arterial materna</tspan></text><text x="435.0" y="970.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Desprendimiento</tspan><tspan x="435.0" dy="17">prematuro de</tspan><tspan x="435.0" dy="17">placenta</tspan></text><rect x="513.0" y="951.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="987.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Genéticos</tspan></text><text x="735.0" y="987.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Placenta previa</tspan></text><text x="885.0" y="979.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Toxemias del tercer</tspan><tspan x="885.0" dy="17">trimestre</tspan></text><rect x="40.0" y="1019.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="1019.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1040.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Factor relacionado con</tspan><tspan x="54.0" dy="16">el tipo I?</tspan></text><text x="285.0" y="1040.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: causa placentaria,</tspan><tspan x="285.0" dy="16">tipo II</tspan></text><text x="435.0" y="1040.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: causa placentaria,</tspan><tspan x="435.0" dy="16">tipo II</tspan></text><text x="585.0" y="1040.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: alteración</tspan><tspan x="585.0" dy="16">intrínseca del feto</tspan></text><text x="735.0" y="1040.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: causa placentaria,</tspan><tspan x="735.0" dy="16">tipo II</tspan></text><text x="885.0" y="1040.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: causa del tercer</tspan><tspan x="885.0" dy="16">trimestre, tipo II</tspan></text><rect x="40.0" y="948.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1093.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1121.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1143.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Tipo I, simétrico: cabeza, abdomen y fémur disminuidos de forma proporcional desde etapas tempranas por una alteración intrínseca del feto.</tspan><tspan x="58.0" dy="18">• Causas del tipo I: cromosomopatías (trisomías 13 y 18, triploidía), síndromes genéticos, infecciones congénitas (CMV, toxoplasmosis) y teratógenos.</tspan><tspan x="58.0" dy="18">• Tipo II, asimétrico: insuficiencia placentaria en el tercer trimestre (hipertensión, desprendimiento, placenta previa, toxemia), con cráneo preservado y</tspan><tspan x="58.0" dy="18">   abdomen reducido.</tspan><tspan x="58.0" dy="18">• Ante restricción precoz y simétrica: cariotipo o microarray y serología. Seguimiento: Doppler umbilical, líquido amniótico y corticoides si el parto es antes</tspan><tspan x="58.0" dy="18">   de las 34 semanas.</tspan></text><text x="58.0" y="1255.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, Practice Bulletin N.º 227 (2021); ISUOG, guía del feto pequeño y la restricción del crecimiento (Ultrasound Obstet Gynecol 2020); Williams Obstetricia, 26.ª ed.</tspan><tspan x="58.0" dy="15">(2022).</tspan></text></svg>