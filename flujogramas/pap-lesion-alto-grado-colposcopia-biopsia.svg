lto grado: ¿siguiente paso?</tspan></text><rect x="40.0" y="415.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">COLPOSCOPÍA Y BIOPSIA</tspan></text><text x="266.5" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Zonas acetoblancas</tspan><tspan x="266.5" dy="17">NIC 2-3: LEEP</tspan></text><rect x="507.0" y="415.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="451.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Cono LEEP</tspan></text><text x="733.5" y="474.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Seguimiento con VPH</tspan></text><text x="40.0" y="545.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="557.5" width="920.0" height="301.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="571.5" width="322.1" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="217.1" y="591.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="217.1" dy="0">CITOLOGÍA (BETHESDA) Y SU HISTOLOGÍA</tspan></text><text x="394.1" y="591.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="548"><tspan x="394.1" dy="0">La citología orienta; la biopsia confirma.</tspan></text><rect x="56.0" y="631.5" width="213.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="632.1" width="211.8" height="63.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="162.5" y="659.5" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="197"><tspan x="162.5" dy="0">ASC-US</tspan></text><text x="162.5" y="679.5" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="189"><tspan x="162.5" dy="0">Atipia incierta</tspan></text><circle cx="72.0" cy="704.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="708.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="82.0" dy="0">Prueba de VPH</tspan></text><rect x="281.0" y="631.5" width="213.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="281.6" y="632.1" width="211.8" height="63.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="387.5" y="659.5" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="197"><tspan x="387.5" dy="0">LIE BAJO GRADO</tspan></text><text x="387.5" y="679.5" font-size="14" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="189"><tspan x="387.5" dy="0">NIC 1</tspan></text><circle cx="297.0" cy="704.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="307.0" y="708.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="307.0" dy="0">Seguimiento</tspan></text><rect x="506.0" y="631.5" width="213.0" height="98.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="507.2" y="632.7" width="210.6" height="63.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="612.5" y="659.5" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="197"><tspan x="612.5" dy="0">LIE ALTO GRADO</tspan></text><text x="612.5" y="679.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="189"><tspan x="612.5" dy="0">NIC 2-3</tspan></text><circle cx="522.0" cy="704.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="532.0" y="708.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="175"><tspan x="532.0" dy="0">Colposcopía y tratar</tspan></text><rect x="567.1" y="620.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="612.5" y="635.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="612.5" dy="0">◆ ESTE CASO</tspan></text><rect x="731.0" y="631.5" width="213.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="731.6" y="632.1" width="211.8" height="63.0" rx="9" fill="#fee2e2" stroke="none" stroke-width="0"/><text x="837.5" y="659.5" font-size="11" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="197"><tspan x="837.5" dy="0">CARCINOMA</tspan></text><text x="837.5" y="679.5" font-size="14" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="189"><tspan x="837.5" dy="0">Invasor</tspan></text><circle cx="747.0" cy="704.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="757.0" y="708.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="757.0" dy="0">Estadificar</tspan></text><text x="56.0" y="759.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="768.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="783.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="783.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">El PAP informa LIE de alto grado</tspan></text><rect x="56.0" y="805.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="828.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Colposcopía con biopsia.</tspan></text><text x="40.0" y="898.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="908.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="939.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="939.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">PAP seriado</tspan></text><rect x="363.0" y="911.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="931.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Colposcopía y</tspan><tspan x="435.0" dy="17">biopsia</tspan></text><text x="585.0" y="939.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Cono LEEP y AP</tspan></text><text x="735.0" y="939.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Tipificación de VPH</tspan></text><text x="885.0" y="939.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Histerectomía total</tspan></text><rect x="40.0" y="962.5" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="962.5" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="999.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Conducta?</tspan></text><text x="285.0" y="999.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no confirma ni trata</tspan></text><text x="435.0" y="999.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: confirma el grado</tspan></text><text x="585.0" y="983.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Alternativa «ver y</tspan><tspan x="585.0" dy="16">tratar» en casos</tspan><tspan x="585.0" dy="16">elegidos</tspan></text><text x="735.0" y="999.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No cambia la conducta</tspan></text><text x="885.0" y="991.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: excesiva sin</tspan><tspan x="885.0" dy="16">diagnóstico</tspan></text><rect x="40.0" y="908.5" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1052.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1080.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1102.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Colposcopía: zonas acetoblancas y vasos atípicos; biopsia de las más sospechosas.</tspan><tspan x="58.0" dy="18">• NIC 2-3 confirmada: escisión con asa (LEEP o cono).</tspan><tspan x="58.0" dy="18">• En mayores de 25 años con VPH 16 puede hacerse «ver y tratar» (LEEP directo).</tspan></text><text x="58.0" y="1160.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ASCCP (2019, act. 2024); MINSA Perú, guía de cáncer de cuello uterino (2017, act. 2023).</tspan></text></svg>