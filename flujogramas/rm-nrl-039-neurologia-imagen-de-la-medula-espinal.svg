<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1336" viewBox="0 0 1000 1336" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La resonancia magnética es el estudio de elección, sin radiación, para las lesiones de la médula espinal"><title>La resonancia magnética es el estudio de elección, sin radiación, para las lesiones de la médula espinal</title><rect x="0.75" y="0.75" width="998.5" height="1334.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neurología · imagen de la médula espinal</tspan></text><rect x="444.0" y="32.0" width="113.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="98"><tspan x="500.9" dy="0">NEUROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Resonancia magnética</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Mejor contraste de tejidos blandos, en tres planos, sin radiación ni contraste yodado.</tspan><tspan x="58.0" dy="17">Valora médula, raíces, discos y espacio epidural.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de estudio</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué examen es altamente eficaz e inocuo para</tspan><tspan x="640.0" dy="16">lesiones estructurales de la médula y del canal</tspan><tspan x="640.0" dy="16">raquídeo?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ ESTUDIO SE PIDE EN CADA SITUACIÓN</tspan></text><rect x="40.0" y="285.0" width="920.0" height="128.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="285.0" width="108.0" height="128.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="349.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Estudio de</tspan><tspan x="94.0" dy="14">elección</tspan></text><rect x="40.0" y="413.0" width="920.0" height="128.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="413.0" width="108.0" height="128.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="481.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Otros</tspan></text><rect x="40.0" y="541.0" width="920.0" height="128.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="541.0" width="108.0" height="128.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="601.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">No</tspan><tspan x="94.0" dy="14">estructurales o</tspan><tspan x="94.0" dy="14">limitados</tspan></text><line x1="307.2" y1="349.0" x2="314.2" y2="349.0" stroke="#0f766e" stroke-width="2.2"/><line x1="314.2" y1="349.0" x2="314.2" y2="468.5" stroke="#0f766e" stroke-width="2.2"/><line x1="314.2" y1="468.5" x2="312.2" y2="468.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="312.2,473.5 312.2,463.5 321.2,468.5" fill="#0f766e"/><line x1="470.4" y1="468.5" x2="477.4" y2="468.5" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="468.5" x2="477.4" y2="460.5" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="460.5" x2="475.4" y2="460.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="475.4,465.5 475.4,455.5 484.4,460.5" fill="#0f766e"/><line x1="633.6" y1="460.5" x2="640.6" y2="460.5" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="460.5" x2="640.6" y2="588.5" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="588.5" x2="638.6" y2="588.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="638.6,593.5 638.6,583.5 647.6,588.5" fill="#0f766e"/><line x1="796.8" y1="588.5" x2="803.8" y2="588.5" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="588.5" x2="803.8" y2="588.5" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="588.5" x2="801.8" y2="588.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="801.8,593.5 801.8,583.5 810.8,588.5" fill="#0f766e"/><rect x="158.0" y="298.0" width="149.2" height="102.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="168.0" y="314.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Resonancia</tspan><tspan x="168.0" dy="16">magnética</tspan></text><text x="168.0" y="347.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Médula, raíces, discos y</tspan><tspan x="168.0" dy="14.5">canal; T1, T2 y STIR; sin</tspan><tspan x="168.0" dy="14.5">radiación</tspan></text><circle cx="158.0" cy="298.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="302.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="321.2" y="426.0" width="149.2" height="85.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="331.2" y="442.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Tomografía</tspan></text><text x="331.2" y="459.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Superior para hueso,</tspan><tspan x="331.2" dy="14.5">fracturas y calcificación</tspan><tspan x="331.2" dy="14.5">ligamentaria</tspan></text><circle cx="321.2" cy="426.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="321.2" y="430.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="321.2" dy="0">2</tspan></text><rect x="484.4" y="426.0" width="149.2" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="494.4" y="442.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Mielografía</tspan></text><text x="494.4" y="459.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Invasiva; para quien no</tspan><tspan x="494.4" dy="14.5">puede recibir resonancia</tspan></text><circle cx="484.4" cy="426.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="484.4" y="430.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="484.4" dy="0">3</tspan></text><rect x="647.6" y="554.0" width="149.2" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="657.6" y="570.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Radiografía simple</tspan></text><text x="657.6" y="587.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Solo alineamiento y</tspan><tspan x="657.6" dy="14.5">lesiones óseas</tspan></text><circle cx="647.6" cy="554.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="647.6" y="558.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="647.6" dy="0">4</tspan></text><rect x="810.8" y="554.0" width="149.2" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="820.8" y="570.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Electromiografía</tspan></text><text x="820.8" y="587.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Prueba funcional, no</tspan><tspan x="820.8" dy="14.5">estructural</tspan></text><circle cx="810.8" cy="554.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="810.8" y="558.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="810.8" dy="0">5</tspan></text><rect x="40.0" y="687.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="713.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Lesión de médula o canal = resonancia magnética</tspan></text><text x="60.0" y="732.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La tomografía irradia y ve mal la médula; la mielografía es invasiva; la radiografía y la electromiografía no la valoran.</tspan></text><text x="40.0" y="793.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SITUACIONES EN QUE LA RESONANCIA DE COLUMNA ES URGENTE</tspan></text><rect x="40.0" y="805.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="824.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Sospecha</tspan></text><text x="350.0" y="824.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="294"><tspan x="350.0" dy="0">Estudio</tspan></text><text x="660.0" y="824.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="294"><tspan x="660.0" dy="0">Secuencias</tspan></text><rect x="40.0" y="834.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="853.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Compresión medular aguda</tspan></text><text x="350.0" y="853.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="350.0" dy="0">Resonancia urgente</tspan></text><text x="660.0" y="853.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="660.0" dy="0">T1, T2 y STIR</tspan></text><rect x="240.6" y="837.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="286.0" y="852.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="863.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="882.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Síndrome de cauda equina</tspan></text><text x="350.0" y="882.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="350.0" dy="0">Resonancia urgente</tspan></text><text x="660.0" y="882.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="660.0" dy="0">T1, T2 y STIR</tspan></text><rect x="40.0" y="892.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="911.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Espondilodiscitis o absceso epidural</tspan></text><text x="350.0" y="911.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="350.0" dy="0">Resonancia con gadolinio</tspan></text><text x="660.0" y="911.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="660.0" dy="0">T1, T2 y STIR con contraste</tspan></text><text x="40.0" y="961.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="971.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1002.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="993.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Tomografía axial</tspan><tspan x="285.0" dy="17">computarizada</tspan></text><text x="435.0" y="1002.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Mielografía</tspan></text><rect x="513.0" y="974.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="993.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Resonancia</tspan><tspan x="585.0" dy="17">magnética nuclear</tspan></text><text x="735.0" y="993.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Radiografía simple</tspan><tspan x="735.0" dy="17">de columna</tspan></text><text x="885.0" y="1002.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Electromiografía</tspan></text><rect x="40.0" y="1025.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="1025.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1062.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Mejor estudio?</tspan></text><text x="285.0" y="1054.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: irradia y resuelve</tspan><tspan x="285.0" dy="16">mal la médula</tspan></text><text x="435.0" y="1046.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: invasiva, solo si no</tspan><tspan x="435.0" dy="16">se puede hacer</tspan><tspan x="435.0" dy="16">resonancia</tspan></text><text x="585.0" y="1046.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: eficaz e inocua</tspan><tspan x="585.0" dy="16">para médula y canal</tspan><tspan x="585.0" dy="16">raquídeo</tspan></text><text x="735.0" y="1054.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: solo valora</tspan><tspan x="735.0" dy="16">alineamiento y hueso</tspan></text><text x="885.0" y="1046.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es una prueba</tspan><tspan x="885.0" dy="16">funcional, no</tspan><tspan x="885.0" dy="16">estructural</tspan></text><rect x="40.0" y="971.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1115.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1143.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1165.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Detecta mielopatía compresiva, tumores intra y extramedulares, siringomielia, mielitis, esclerosis múltiple, abscesos y hematomas epidurales y</tspan><tspan x="58.0" dy="18">   metástasis.</tspan><tspan x="58.0" dy="18">• Es el estudio urgente en la compresión medular aguda, el síndrome de cauda equina y la sospecha de espondilodiscitis; incluye secuencias T1, T2 y</tspan><tspan x="58.0" dy="18">   STIR.</tspan><tspan x="58.0" dy="18">• La tomografía es mejor para hueso y fracturas, pero resuelve mal la médula y irradia; la mielografía es invasiva; la radiografía solo muestra el hueso.</tspan><tspan x="58.0" dy="18">• Alerta: déficit medular progresivo: la resonancia de toda la columna no debe demorarse más de unas horas. Contraindicación: marcapasos no</tspan><tspan x="58.0" dy="18">   compatible.</tspan></text><text x="58.0" y="1295.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Harrison, 21.ª ed. (2022), enfermedades de la médula espinal; Greenberg, Handbook of Neurosurgery, 10.ª ed. (2023).</tspan></text></svg>