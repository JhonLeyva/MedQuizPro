<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1072" viewBox="0 0 1000 1072" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Hoyuelo con mechón de pelo lumbosacro y examen normal: espina bífida oculta"><title>Hoyuelo con mechón de pelo lumbosacro y examen normal: espina bífida oculta</title><rect x="0.75" y="0.75" width="998.5" height="1070.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Defectos del tubo neural · disrafia espinal</tspan></text><rect x="446.1" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="502.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="502.6" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Disrafias espinales</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Abiertas: la médula o las meninges salen a la superficie (mielomeningocele, meningocele).</tspan><tspan x="58.0" dy="17">Ocultas: piel intacta con marcas en la línea media (mechón, hoyuelo, mancha).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 2 meses en control sano</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Desarrollo y neurológico normales.</tspan><tspan x="640.0" dy="16">Hoyuelo con mechón de pelo denso en la línea media</tspan><tspan x="640.0" dy="16">lumbosacra; sin masa ni salida de LCR.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OCULTA FRENTE A ABIERTA</tspan></text><rect x="40.0" y="295.0" width="438.0" height="358.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="52.0" y="305.0" width="141.6" height="20.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="319.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">ESPINA BÍFIDA OCULTA</tspan></text><rect x="362.6" y="284.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="408.0" y="299.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">◆ ESTE CASO</tspan></text><g transform="translate(159.0,333.0) scale(1.0)"><path d="M20 200 H180" fill="none" stroke="#e9b48f" stroke-width="5" stroke-linejoin="round" /><text x="100" y="214" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">piel</text><circle cx="100" cy="60" r="34" fill="#e7e5e4" stroke="#a8a29e" stroke-width="3" /><circle cx="100" cy="60" r="16" fill="#fef3c7" stroke="#ca8a04" stroke-width="2" /><text x="100" y="64" font-size="9" font-weight="800" fill="#92400e" text-anchor="middle" data-max="0">médula</text><path d="M70 80 L60 130 M130 80 L140 130" fill="none" stroke="#a8a29e" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 130 L84 150 M140 130 L116 150" fill="none" stroke="#a8a29e" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="100" cy="196" rx="8" ry="5" fill="#9a6b52" stroke="none" stroke-width="0" /><path d="M96 192 q-4 -14 -2 -24" stroke="#1f2937" stroke-width="1.4" fill="none"/><path d="M98 192 q-4 -14 -2 -24" stroke="#1f2937" stroke-width="1.4" fill="none"/><path d="M100 192 q-4 -14 -2 -24" stroke="#1f2937" stroke-width="1.4" fill="none"/><path d="M102 192 q-4 -14 -2 -24" stroke="#1f2937" stroke-width="1.4" fill="none"/><path d="M104 192 q-4 -14 -2 -24" stroke="#1f2937" stroke-width="1.4" fill="none"/><text x="116" y="172" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">mechón de pelo</text><text x="116" y="172" font-size="10" font-weight="800" fill="#9a3412" text-anchor="start" data-max="0">mechón de pelo</text><text x="116" y="186" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">y hoyuelo</text><text x="116" y="186" font-size="10" font-weight="800" fill="#9a3412" text-anchor="start" data-max="0">y hoyuelo</text></g><text x="54.0" y="601.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="54.0" dy="0">Arco vertebral sin cerrar, piel intacta con mechón de pelo; médula en su</tspan><tspan x="54.0" dy="16">sitio.</tspan></text><rect x="522.0" y="295.0" width="438.0" height="358.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="534.0" y="305.0" width="131.5" height="20.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1"/><text x="543.0" y="319.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="543.0" dy="0">MIELOMENINGOCELE</tspan></text><g transform="translate(641.0,333.0) scale(1.0)"><path d="M20 200 H180" fill="none" stroke="#e9b48f" stroke-width="5" stroke-linejoin="round" /><text x="100" y="214" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">piel</text><circle cx="100" cy="60" r="34" fill="#e7e5e4" stroke="#a8a29e" stroke-width="3" /><circle cx="100" cy="60" r="16" fill="#fef3c7" stroke="#ca8a04" stroke-width="2" /><text x="100" y="64" font-size="9" font-weight="800" fill="#92400e" text-anchor="middle" data-max="0">médula</text><path d="M70 80 L60 130 M130 80 L140 130" fill="none" stroke="#a8a29e" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><path d="M70 130 C40 196 60 222 100 222 C140 222 160 196 130 130" fill="#fecaca" stroke="#b91c1c" stroke-width="2" stroke-linejoin="round" /><path d="M100 76 L100 206" fill="none" stroke="#ca8a04" stroke-width="6" stroke-linejoin="round" /><text x="100" y="238" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">médula y raíces afuera</text><text x="100" y="238" font-size="10" font-weight="800" fill="#b91c1c" text-anchor="middle" data-max="0">médula y raíces afuera</text></g><text x="536.0" y="601.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="536.0" dy="0">Médula y meninges fuera, en un saco abierto; hay déficit neurológico.</tspan></text><circle cx="500.0" cy="458.0" r="17" fill="#ea580c" stroke="none" stroke-width="0"/><polygon points="494.0,450.0 494.0,466.0 508.0,458.0" fill="#ffffff"/><text x="40.0" y="683.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OTRAS OPCIONES</tspan></text><rect x="40.0" y="693.0" width="297.3" height="85.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="694.0" width="6.0" height="83.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="717.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Espina bífida oculta</tspan></text><text x="58.0" y="738.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Piel intacta, mechón u hoyuelo, examen normal.</tspan></text><rect x="237.5" y="682.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="282.9" y="697.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="282.9" dy="0">◆ ESTE CASO</tspan></text><rect x="351.3" y="693.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="694.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="717.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Seno dérmico</tspan></text><text x="369.3" y="738.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Orificio con trayecto; puede drenar o dar</tspan><tspan x="369.3" dy="16">meningitis.</tspan></text><rect x="662.7" y="693.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="694.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="717.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Meningocele</tspan></text><text x="680.7" y="738.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Masa quística con meninges, cubierta de piel.</tspan></text><text x="40.0" y="818.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="828.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="850.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="850.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Seno dérmico</tspan></text><text x="491.2" y="850.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Mielomeningocele</tspan></text><rect x="588.0" y="831.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="678.8" y="850.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Espina bífida oculta</tspan></text><text x="866.2" y="850.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Meningocele</tspan></text><rect x="40.0" y="865.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="588.0" y="865.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="886.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Clave</tspan></text><text x="303.8" y="886.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Orificio con trayecto</tspan></text><text x="491.2" y="886.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Saco abierto, déficit</tspan></text><text x="678.8" y="886.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Mechón con piel intacta</tspan></text><text x="866.2" y="886.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Masa quística</tspan></text><rect x="40.0" y="828.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="923.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="951.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="973.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Mechón de pelo o hoyuelo en la línea media lumbosacra con piel intacta = espina bífida oculta.</tspan><tspan x="58.0" dy="18">• Ecografía de columna (antes de los 3-6 meses) para descartar médula anclada.</tspan><tspan x="58.0" dy="18">• Seno dérmico: orificio con trayecto que puede drenar o infectarse; meningocele y mielomeningocele: masa visible.</tspan></text><text x="58.0" y="1031.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Nelson Tratado de Pediatría 22.ª ed. (2024); AAP, estigmas cutáneos de disrafia espinal.</tspan></text></svg>