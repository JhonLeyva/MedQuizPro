yle="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Unilocular, de pared fina, sin tabiques, sin partes sólidas ni flujo: casi siempre funcional</tspan><tspan x="58.0" dy="17">(folicular o lúteo) y benigno.</tspan><tspan x="58.0" dy="17">En premenopáusicas de &lt; 5 cm no requiere seguimiento; de 5-7 cm, control ecográfico</tspan><tspan x="58.0" dy="17">anual; más grande o complejo: evaluar cirugía.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 25 años, asintomática</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Eco de rutina: quiste unilocular de 4 cm en el ovario</tspan><tspan x="640.0" dy="16">derecho.</tspan><tspan x="640.0" dy="16">Sin tabiques ni excrecencias.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy