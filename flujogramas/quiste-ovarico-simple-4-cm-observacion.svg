"middle" data-max="128"><tspan x="435.0" dy="0">Sí: simple y &lt; 5 cm</tspan></text><text x="585.0" y="1117.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no es un tumor</tspan><tspan x="585.0" dy="16">germinal</tspan></text><text x="735.0" y="1117.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no lo hacen</tspan><tspan x="735.0" dy="16">desaparecer</tspan></text><text x="885.0" y="1125.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: excesivo</tspan></text><rect x="40.0" y="1025.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1170.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1198.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1220.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Clasificación O-RADS US: quiste simple ≤ 3 cm = 1 (normal); 3-10 cm = 2 (casi seguro benigno).</tspan><tspan x="58.0" dy="18">• Los anticonceptivos no aceleran la desaparición del quiste.</tspan><tspan x="58.0" dy="18">• Volver si hay dolor súbito (torsión o rotura).</tspan></text><text x="58.0" y="1278.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACR O-RADS US (2022); ACOG n.º 174 (2016; masas anexiales); SRU (2019).</tspan></text></svg>