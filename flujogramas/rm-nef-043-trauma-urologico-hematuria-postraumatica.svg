<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1145" viewBox="0 0 1000 1145" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Hematuria tras traumatismo cerrado en paciente estable: tomografía con contraste y fase tardía"><title>Hematuria tras traumatismo cerrado en paciente estable: tomografía con contraste y fase tardía</title><rect x="0.75" y="0.75" width="998.5" height="1144.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Trauma urológico · hematuria postraumática</tspan></text><rect x="462.5" y="32.0" width="182.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="553.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="167"><tspan x="553.8" dy="0">NEFROLOGÍA Y UROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hematuria tras traumatismo cerrado</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La hematuria franca indica lesión del tracto urinario hasta demostrar lo contrario.</tspan><tspan x="58.0" dy="17">Puede venir del riñón, el uréter, la vejiga o la uretra.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 35 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Caída de moto, hemodinámicamente estable.</tspan><tspan x="640.0" dy="16">Hematuria desde hace 2 horas. ¿Qué se solicita para</tspan><tspan x="640.0" dy="16">definir la lesión?</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="395.0" x2="811.3" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="395.0" x2="188.7" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,423.0 193.7,423.0 188.7,431.0" fill="#94a3b8"/><line x1="500.0" y1="395.0" x2="500.0" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,423.0 505.0,423.0 500.0,431.0" fill="#94a3b8"/><line x1="811.3" y1="395.0" x2="811.3" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,423.0 816.3,423.0 811.3,431.0" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#0f766e"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="395.0" x2="500.0" y2="424.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,423.0 505.0,423.0 500.0,431.0" fill="#0f766e"/><rect x="103.2" y="404.0" width="171.0" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="188.7" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">Hemodinámicamente inestable</tspan></text><rect x="444.5" y="404.0" width="110.9" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="500.0" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">Estable (este caso)</tspan></text><rect x="688.4" y="404.0" width="245.9" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="811.3" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">Fractura pélvica o sospecha de lesión vesical</tspan></text><polygon points="240.0,336.0 266.0,307.0 734.0,307.0 760.0,336.0 734.0,365.0 266.0,365.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="336.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="341.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="340.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Hematuria tras traumatismo cerrado</tspan></text><rect x="40.0" y="431.0" width="297.3" height="107.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="188.7" y="467.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">LAPAROTOMÍA</tspan></text><text x="188.7" y="490.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Se opera sin imágenes previas</tspan><tspan x="188.7" dy="17">Control del sangrado</tspan></text><rect x="351.3" y="431.0" width="297.3" height="107.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="467.9" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">TOMOGRAFÍA</tspan></text><text x="500.0" y="490.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Contraste intravenoso y fase tardía</tspan><tspan x="500.0" dy="17">Gradúa la lesión con la escala AAST</tspan></text><rect x="662.7" y="431.0" width="297.3" height="107.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">CISTOGRAFÍA</tspan></text><text x="811.3" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Por tomografía, con la vejiga llena</tspan><tspan x="811.3" dy="17">Si hay sangre en el meato: uretrografía antes de</tspan><tspan x="811.3" dy="17">sondar</tspan></text><text x="40.0" y="572.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ESCALA AAST DEL TRAUMA RENAL (REVISIÓN 2018)</tspan></text><rect x="40.0" y="584.5" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="603.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="54"><tspan x="50.0" dy="0">Grado</tspan></text><text x="120.0" y="603.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="834"><tspan x="120.0" dy="0">Lesión</tspan></text><rect x="40.0" y="613.5" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="632.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="54"><tspan x="50.0" dy="0">I</tspan></text><text x="120.0" y="632.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="834"><tspan x="120.0" dy="0">Contusión o hematoma subcapsular no expansivo, sin laceración</tspan></text><rect x="40.0" y="642.5" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="661.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="54"><tspan x="50.0" dy="0">II</tspan></text><text x="120.0" y="661.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="834"><tspan x="120.0" dy="0">Hematoma perirrenal confinado o laceración parenquimatosa menor de 1 cm, sin extravasación de orina</tspan></text><rect x="40.0" y="671.5" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="690.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="54"><tspan x="50.0" dy="0">III</tspan></text><text x="120.0" y="690.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="834"><tspan x="120.0" dy="0">Laceración parenquimatosa de más de 1 cm, sin rotura del sistema colector</tspan></text><rect x="40.0" y="700.5" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="719.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="54"><tspan x="50.0" dy="0">IV</tspan></text><text x="120.0" y="719.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="834"><tspan x="120.0" dy="0">Laceración que llega al sistema colector con extravasación de orina, o lesión vascular segmentaria con sangrado o infarto</tspan></text><rect x="40.0" y="729.5" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="748.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="54"><tspan x="50.0" dy="0">V</tspan></text><text x="120.0" y="748.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="834"><tspan x="120.0" dy="0">Riñón fragmentado, o lesión o avulsión del pedículo renal con devascularización</tspan></text><text x="40.0" y="774.5" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">La mayoría se maneja de forma conservadora, con reposo, vigilancia y embolización si hay sangrado.</tspan></text><text x="40.0" y="821.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="831.5" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="854.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="834.5" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="854.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Tomografía</tspan></text><text x="435.0" y="854.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Ecografía</tspan></text><text x="585.0" y="854.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Radiografía simple</tspan></text><text x="735.0" y="854.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Gammagrafía</tspan></text><text x="885.0" y="854.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Lavado peritoneal</tspan></text><rect x="40.0" y="868.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="868.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="897.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué solicitaría?</tspan></text><text x="285.0" y="889.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: define y gradúa la</tspan><tspan x="285.0" dy="16">lesión</tspan></text><text x="435.0" y="897.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no gradúa la lesión</tspan></text><text x="585.0" y="897.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no aporta</tspan></text><text x="735.0" y="897.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no aporta</tspan></text><text x="885.0" y="897.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: casi no se usa</tspan></text><rect x="40.0" y="831.5" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="942.5" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="970.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="992.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Estable: tomografía de abdomen y pelvis con contraste intravenoso y fase tardía (urográfica); gradúa el trauma renal con la escala AAST (I a V) y</tspan><tspan x="58.0" dy="18">   muestra extravasación, sangrado y lesiones vasculares.</tspan><tspan x="58.0" dy="18">• Fractura pélvica o sospecha de lesión vesical: agregar cistografía por tomografía con la vejiga llena. Inestable: se opera sin imágenes.</tspan><tspan x="58.0" dy="18">• La ecografía detecta líquido libre pero no gradúa; la radiografía simple y la gammagrafía no aportan; el lavado peritoneal casi no se usa.</tspan><tspan x="58.0" dy="18">• Alerta: sangre en el meato, no pasar sonda hasta descartar lesión uretral con uretrografía retrógrada. La mayoría de los traumas renales se maneja de</tspan><tspan x="58.0" dy="18">   forma conservadora.</tspan></text><text x="58.0" y="1104.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AUA, Urotrauma Guideline 2020 (J Urol 2021); Campbell-Walsh-Wein Urología, 12.ª ed. (2020).</tspan></text></svg>