<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="609" viewBox="0 0 1000 609" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="VIH diagnosticado en el trabajo de parto"><title>VIH diagnosticado en el trabajo de parto</title><rect x="0.75" y="0.75" width="998.5" height="607.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16" y="16" width="968" height="68" rx="10" fill="#0f766e"/><text x="36" y="57.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170" y1="40.0" x2="170" y2="60.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="46.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">GINECOLOGÍA Y OBSTETRICIA ENAM: VIH DIAGNOSTICADO EN EL</tspan><tspan x="184.0" dy="16">TRABAJO DE PARTO</tspan></text><rect x="745.5" y="38.0" width="218.5" height="24" rx="12" fill="#134e4a"/><text x="854.8" y="54.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="202"><tspan x="854.8" dy="0">GINECOLOGÍA Y OBSTETRICIA</tspan></text><rect x="190.0" y="102.0" width="620" height="86.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="500.0" y="130.5" font-size="14.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Gestante de 37 semanas en trabajo de parto, 4 cm, membranas</tspan><tspan x="500.0" dy="19.0">íntegras</tspan></text><text x="500.0" y="172.0" font-size="12" font-weight="400" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Prueba rápida de VIH reactiva, sin tratamiento previo</tspan></text><line x1="500.0" y1="188.0" x2="500.0" y2="209.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,208.0 505.0,208.0 500.0,216.0" fill="#0f766e"/><rect x="210.0" y="216.0" width="580" height="100.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="243.5" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="552"><tspan x="500.0" dy="0">PREVENCIÓN DE LA TRANSMISIÓN VERTICAL</tspan></text><text x="500.0" y="266.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="552"><tspan x="500.0" dy="0">• Zidovudina EV intraparto + TARV a la madre</tspan><tspan x="500.0" dy="17">• CESÁREA inmediata (membranas íntegras,</tspan><tspan x="500.0" dy="17">• sin carga viral suprimida)</tspan></text><line x1="500.0" y1="316.0" x2="500.0" y2="334.0" stroke="#0f766e" stroke-width="2"/><line x1="270.0" y1="334.0" x2="730.0" y2="334.0" stroke="#0f766e" stroke-width="2"/><line x1="270.0" y1="334.0" x2="270.0" y2="349.0" stroke="#0f766e" stroke-width="2"/><polygon points="265.0,348.0 275.0,348.0 270.0,356.0" fill="#0f766e"/><line x1="730.0" y1="334.0" x2="730.0" y2="349.0" stroke="#0f766e" stroke-width="2"/><polygon points="725.0,348.0 735.0,348.0 730.0,356.0" fill="#0f766e"/><rect x="70.0" y="356.0" width="400" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="270.0" y="383.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="372"><tspan x="270.0" dy="0">Recién nacido</tspan></text><text x="270.0" y="406.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="372"><tspan x="270.0" dy="0">Profilaxis antirretroviral</tspan><tspan x="270.0" dy="17">desde las primeras horas</tspan><tspan x="270.0" dy="17">Seguimiento del niño expuesto</tspan></text><rect x="530.0" y="356.0" width="400" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="730.0" y="383.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="372"><tspan x="730.0" dy="0">Alimentación</tspan></text><text x="730.0" y="406.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="372"><tspan x="730.0" dy="0">Suspender la lactancia</tspan><tspan x="730.0" dy="17">materna</tspan><tspan x="730.0" dy="17">Fórmula láctea</tspan></text><rect x="40" y="482.0" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="510.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="532.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Sin TARV ni carga viral indetectable, la cesárea reduce la transmisión materno-infantil.</tspan><tspan x="58.0" dy="18">• Confirmar el diagnóstico materno con pruebas posteriores.</tspan></text><text x="58.0" y="572.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA – NTS para la prevención de la transmisión materno infantil del VIH, sífilis y hepatitis B (RM 1138-2019)</tspan></text></svg>
