<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1249" viewBox="0 0 1000 1249" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Absceso apendicular: drenaje percutáneo más antibiótico"><title>Absceso apendicular: drenaje percutáneo más antibiótico</title><rect x="0.75" y="0.75" width="998.5" height="1247.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Apendicitis complicada · absceso</tspan></text><rect x="399.6" y="32.0" width="101.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="450.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="85"><tspan x="450.2" dy="0">CIRUGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Apendicitis complicada con absceso</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tras varios días de evolución el apéndice perforado queda rodeado y forma un absceso.</tspan><tspan x="58.0" dy="17">En el paciente estable se trata sin cirugía urgente.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 25 años, 6 días de dolor en FID</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Estable, masa dolorosa en FID, sin peritonitis;</tspan><tspan x="640.0" dy="16">leucocitos 23 000.</tspan><tspan x="640.0" dy="16">Ecografía: absceso de 3 cm bien delimitado.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿QUÉ HACER CON EL ABSCESO?</tspan></text><polygon points="220,321.0 260,285.0 740,285.0 780,321.0 740,357.0 260,357.0" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><circle cx="282.0" cy="321.0" r="13" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="282.0" y="326.5" font-size="16" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="282.0" dy="0">?</tspan></text><text x="525.0" y="317.0" font-size="13.5" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="525.0" dy="0">Paciente estable con absceso apendicular: ¿se puede</tspan><tspan x="525.0" dy="18">drenar por punción?</tspan></text><line x1="500.0" y1="357.0" x2="500.0" y2="377.0" stroke="#0f766e" stroke-width="2"/><line x1="190.0" y1="377.0" x2="662.0" y2="377.0" stroke="#0f766e" stroke-width="2"/><line x1="190.0" y1="377.0" x2="190.0" y2="406.0" stroke="#0f766e" stroke-width="2"/><polygon points="185.0,405.0 195.0,405.0 190.0,413.0" fill="#0f766e"/><line x1="662.0" y1="377.0" x2="662.0" y2="406.0" stroke="#ea580c" stroke-width="2"/><polygon points="657.0,405.0 667.0,405.0 662.0,413.0" fill="#ea580c"/><rect x="126.6" y="385.0" width="126.9" height="20.0" rx="10" fill="#64748b" stroke="none" stroke-width="1.5"/><text x="190.0" y="399.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">&lt; 3 cm o sin acceso</tspan></text><rect x="572.3" y="385.0" width="179.5" height="20.0" rx="10" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="662.0" y="399.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="662.0" dy="0">≥ 3 cm y accesible: este caso</tspan></text><rect x="40.0" y="413.0" width="300.0" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="414.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="437.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="270"><tspan x="58.0" dy="0">Antibiótico EV solo</tspan></text><text x="58.0" y="458.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="270"><tspan x="58.0" dy="0">Vigilar la evolución.</tspan><tspan x="58.0" dy="16">Si no mejora: drenaje o cirugía.</tspan></text><rect x="364.0" y="413.0" width="596.0" height="413.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="844.6" y="402.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="417.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><text x="382.0" y="439.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">Drenaje percutáneo + antibiótico EV</tspan></text><text x="382.0" y="461.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">Guiado por ecografía o TC; se deja un catéter hasta que la cavidad se seque.</tspan></text><g transform="translate(502.0,481.0) scale(0.92)"><path d="M18 16 Q150 -6 282 16 L292 300 Q150 334 8 300 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M28 40 Q150 10 272 40" fill="none" stroke="#d6a684" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M24 42 C60 20 176 22 188 42 L182 66 C150 92 86 110 26 112 Z" fill="#e7a882" stroke="#9a6b52" stroke-width="1.8" stroke-linejoin="round" /><ellipse cx="112" cy="104" rx="11" ry="17" fill="#86efac" stroke="#9a6b52" stroke-width="1.8" transform="rotate(-20 112 104)" /><path d="M178 44 C214 30 256 46 254 84 C252 116 222 132 190 128 C178 126 172 116 180 110 C204 110 222 98 220 80 C218 62 200 58 184 64 Z" fill="#fbcfe8" stroke="#9a6b52" stroke-width="1.8" stroke-linejoin="round" /><ellipse cx="266" cy="78" rx="14" ry="30" fill="#c4b5fd" stroke="#9a6b52" stroke-width="1.8" transform="rotate(12 266 78)" /><path d="M150 118 C124 116 116 142 124 160 C132 176 158 176 170 168" fill="none" stroke="#e879a0" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/><path d="M150 136 C176 124 214 122 246 116 C252 124 246 132 238 134 C206 140 178 146 156 150 Z" fill="#fde68a" stroke="#9a6b52" stroke-width="1.8" stroke-linejoin="round" /><path d="M58 262 L52 170" fill="none" stroke="#fed7aa" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 148 L240 146" fill="none" stroke="#fed7aa" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><path d="M250 160 L250 246" fill="none" stroke="#fed7aa" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><path d="M250 246 C250 268 226 286 196 286 C176 286 170 272 160 276" fill="none" stroke="#fed7aa" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="60" cy="270" rx="15" ry="13" fill="#ea580c" stroke="#9a6b52" stroke-width="1.8" /><path d="M58 282 C56 296 66 304 74 300" fill="none" stroke="#ea580c" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M92 180 C120 166 150 196 178 176 C206 158 226 190 206 206 C182 222 150 196 126 214 C104 230 136 248 162 236 C190 224 220 240 206 258 C190 272 150 250 120 262 C102 268 84 262 76 266" fill="none" stroke="#fecdd3" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/><path d="M92 262 C84 264 78 266 72 268" fill="none" stroke="#fecdd3" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="150" cy="306" rx="22" ry="12" fill="#fef9c3" stroke="#9a6b52" stroke-width="1.8" /><ellipse cx="84" cy="262" rx="20" ry="16" fill="#fde68a" stroke="#b45309" stroke-width="2.5" /><path d="M-14 300 L70 266" fill="none" stroke="#1e3a8a" stroke-width="3" stroke-linejoin="round" /><text x="-16" y="318" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">catéter</text><text x="-16" y="318" font-size="10" font-weight="800" fill="#1e3a8a" text-anchor="start" data-max="0">catéter</text><circle cx="84" cy="262" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="84" y="266" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">1</text><text x="10" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">D</text><text x="290" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">I</text></g><text x="382.0" y="808.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">1 = absceso junto al ciego y el apéndice; en azul, el catéter de drenaje introducido por la piel.</tspan></text><text x="40.0" y="860.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SIGUE</tspan></text><rect x="40.0" y="870.0" width="297.3" height="85.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="871.0" width="6.0" height="83.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="894.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Mejora en 48-72 h</tspan></text><text x="58.0" y="915.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Completar antibiótico y retirar el catéter.</tspan></text><rect x="237.5" y="859.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="282.9" y="874.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="282.9" dy="0">◆ ESTE CASO</tspan></text><rect x="351.3" y="870.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="871.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="894.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">No mejora o peritonitis</tspan></text><text x="369.3" y="915.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Cirugía: apendicectomía y drenaje.</tspan></text><rect x="662.7" y="870.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="871.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="894.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Después</tspan></text><text x="680.7" y="915.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Apendicectomía de intervalo (6-8 semanas) según</tspan><tspan x="680.7" dy="16">el caso.</tspan></text><text x="40.0" y="995.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1005.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1027.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="1027.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">ATB EV solo</tspan></text><text x="491.2" y="1027.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Referir</tspan></text><rect x="588.0" y="1008.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="678.8" y="1027.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Drenaje + ATB</tspan></text><text x="866.2" y="1027.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Cirugía inmediata</tspan></text><rect x="40.0" y="1042.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="588.0" y="1042.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1063.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Cuándo?</tspan></text><text x="303.8" y="1063.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Absceso &lt; 3 cm</tspan></text><text x="491.2" y="1063.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Si no hay imagen guiada</tspan></text><text x="678.8" y="1063.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Este caso</tspan></text><text x="866.2" y="1063.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Peritonitis o inestabilidad</tspan></text><rect x="40.0" y="1005.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1100.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1128.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1150.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Absceso apendicular ≥ 3 cm, accesible y paciente estable: drenaje percutáneo guiado por imagen + antibiótico EV.</tspan><tspan x="58.0" dy="18">• Absceso pequeño (&lt; 3 cm) o no drenable: antibiótico solo.</tspan><tspan x="58.0" dy="18">• Operar en plena inflamación aumenta las complicaciones; la apendicectomía de intervalo es opcional.</tspan></text><text x="58.0" y="1208.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: SAGES / EAES; WSES, guía de apendicitis (2020).</tspan></text></svg>