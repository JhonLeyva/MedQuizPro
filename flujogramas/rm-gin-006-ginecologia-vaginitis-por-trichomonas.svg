<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1085" viewBox="0 0 1000 1085" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Flujo maloliente, prurito y cuello en fresa con eritema vaginal en manchas: Trichomonas vaginalis"><title>Flujo maloliente, prurito y cuello en fresa con eritema vaginal en manchas: Trichomonas vaginalis</title><rect x="0.75" y="0.75" width="998.5" height="1083.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ginecología · vaginitis por Trichomonas</tspan></text><rect x="436.5" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="516.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="516.3" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tricomoniasis</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Protozoo flagelado de transmisión sexual.</tspan><tspan x="58.0" dy="17">Produce vaginitis con colpitis macular («cuello en fresa») por microhemorragias.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 28 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Sexualmente activa, sin atraso menstrual.</tspan><tspan x="640.0" dy="16">Flujo abundante, maloliente, con prurito vulvar; eritema</tspan><tspan x="640.0" dy="16">vaginal en manchas y cuello en fresa.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL PARÁSITO AL CUELLO EN FRESA</tspan></text><text x="40.0" y="297.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="400"><tspan x="40.0" dy="0">MECANISMO</tspan></text><text x="486.0" y="297.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="474"><tspan x="486.0" dy="0">LO QUE SE VE EN EL CASO</tspan></text><rect x="40.0" y="307.0" width="400.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="336.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="341.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><text x="84.0" y="333.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="340"><tspan x="84.0" dy="0">Trichomonas vaginalis se adhiere al epitelio</tspan></text><text x="84.0" y="350.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="340"><tspan x="84.0" dy="0">Se transmite por contacto sexual</tspan></text><line x1="446.0" y1="336.5" x2="473.0" y2="336.5" stroke="#ea580c" stroke-width="2"/><polygon points="472.0,331.5 472.0,341.5 480.0,336.5" fill="#ea580c"/><rect x="486.0" y="309.0" width="474.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="333.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="500.0" dy="0">Vaginitis con flujo abundante</tspan></text><text x="500.0" y="350.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="500.0" dy="0">Amarillo verdoso, espumoso, maloliente; pH mayor de 4,5</tspan></text><line x1="240.0" y1="368.0" x2="240.0" y2="381.0" stroke="#0f766e" stroke-width="2"/><polygon points="235.0,380.0 245.0,380.0 240.0,388.0" fill="#0f766e"/><rect x="40.0" y="390.0" width="400.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="419.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="424.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">2</tspan></text><text x="84.0" y="416.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="340"><tspan x="84.0" dy="0">Reacción inflamatoria y lesión del epitelio</tspan></text><text x="84.0" y="433.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="340"><tspan x="84.0" dy="0">Microhemorragias puntiformes en la mucosa</tspan></text><line x1="446.0" y1="419.5" x2="473.0" y2="419.5" stroke="#ea580c" stroke-width="2"/><polygon points="472.0,414.5 472.0,424.5 480.0,419.5" fill="#ea580c"/><rect x="486.0" y="392.0" width="474.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="500.0" y="416.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="444"><tspan x="500.0" dy="0">Colpitis macular: cuello en fresa</tspan></text><text x="500.0" y="433.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="500.0" dy="0">Signo del caso; eritema vaginal en manchas</tspan></text><line x1="240.0" y1="451.0" x2="240.0" y2="464.0" stroke="#0f766e" stroke-width="2"/><polygon points="235.0,463.0 245.0,463.0 240.0,471.0" fill="#0f766e"/><rect x="40.0" y="473.0" width="400.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="502.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="507.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">3</tspan></text><text x="84.0" y="499.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="340"><tspan x="84.0" dy="0">Irritación de la vulva y la uretra</tspan></text><text x="84.0" y="516.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="340"><tspan x="84.0" dy="0">Prurito vulvar, disuria y dispareunia</tspan></text><line x1="446.0" y1="502.5" x2="473.0" y2="502.5" stroke="#ea580c" stroke-width="2"/><polygon points="472.0,497.5 472.0,507.5 480.0,502.5" fill="#ea580c"/><rect x="486.0" y="475.0" width="474.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="499.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="500.0" dy="0">Prurito vulvar</tspan></text><text x="500.0" y="516.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="500.0" dy="0">Dato del caso</tspan></text><line x1="240.0" y1="534.0" x2="240.0" y2="547.0" stroke="#0f766e" stroke-width="2"/><polygon points="235.0,546.0 245.0,546.0 240.0,554.0" fill="#0f766e"/><rect x="40.0" y="556.0" width="400.0" height="76.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="594.0" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="598.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">4</tspan></text><text x="84.0" y="582.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="340"><tspan x="84.0" dy="0">Examen en fresco o amplificación de ácidos</tspan><tspan x="84.0" dy="17">nucleicos</tspan></text><text x="84.0" y="616.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="340"><tspan x="84.0" dy="0">Trofozoítos móviles (sensibilidad 50-60 %)</tspan></text><line x1="446.0" y1="594.0" x2="473.0" y2="594.0" stroke="#ea580c" stroke-width="2"/><polygon points="472.0,589.0 472.0,599.0 480.0,594.0" fill="#ea580c"/><rect x="486.0" y="566.5" width="474.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="590.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="500.0" dy="0">Metronidazol 500 mg cada 12 h por 7 días</tspan></text><text x="500.0" y="607.5" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="500.0" dy="0">Tratar también a la pareja</tspan></text><rect x="40.0" y="650.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="676.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Cuello en fresa + flujo espumoso maloliente = Trichomonas vaginalis</tspan></text><text x="60.0" y="695.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Es una ITS: tamizar VIH y otras infecciones.</tspan></text><text x="40.0" y="762.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="772.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="803.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="803.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Candida albicans</tspan></text><text x="435.0" y="794.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Neisseria</tspan><tspan x="435.0" dy="17">gonorrhoeae</tspan></text><rect x="513.0" y="775.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="794.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Trichomonas</tspan><tspan x="585.0" dy="17">vaginalis</tspan></text><text x="735.0" y="794.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Chlamydia</tspan><tspan x="735.0" dy="17">trachomatis</tspan></text><text x="885.0" y="794.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Gardnerella</tspan><tspan x="885.0" dy="17">vaginalis</tspan></text><rect x="40.0" y="826.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="826.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="855.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Agente más probable?</tspan></text><text x="285.0" y="847.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: flujo grumoso, pH</tspan><tspan x="285.0" dy="16">normal</tspan></text><text x="435.0" y="847.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: cervicitis</tspan><tspan x="435.0" dy="16">mucopurulenta</tspan></text><text x="585.0" y="847.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: flujo espumoso y</tspan><tspan x="585.0" dy="16">cuello en fresa</tspan></text><text x="735.0" y="847.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: cervicitis sin</tspan><tspan x="735.0" dy="16">vaginitis florida</tspan></text><text x="885.0" y="847.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: flujo fluido con olor</tspan><tspan x="885.0" dy="16">a pescado</tspan></text><rect x="40.0" y="772.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="900.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="928.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="950.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Flujo amarillo verdoso, espumoso y maloliente con prurito, disuria y dispareunia; pH vaginal mayor de 4,5.</tspan><tspan x="58.0" dy="18">• Diferenciales: Candida (grumoso, pH normal); Gardnerella (fluido, olor a pescado, sin inflamación); gonococo y clamidia (cervicitis mucopurulenta, sin</tspan><tspan x="58.0" dy="18">   vaginitis florida).</tspan><tspan x="58.0" dy="18">• Diagnóstico: examen en fresco con trofozoítos móviles (sensibilidad de 50-60 %); las pruebas de amplificación de ácidos nucleicos son más sensibles.</tspan><tspan x="58.0" dy="18">• Tratamiento: metronidazol 500 mg dos veces al día por 7 días, con tratamiento de la pareja; se asocia a parto pretérmino.</tspan></text><text x="58.0" y="1044.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, guía de tratamiento de ITS (MMWR 2021;70(4)); ACOG, Practice Bulletin N.º 215 (2020); MINSA, NTS 240-MINSA/DGIESP-2026 (RM 035-2026-MINSA).</tspan></text></svg>