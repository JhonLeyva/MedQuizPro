<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="901" viewBox="0 0 1000 901" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Luces brillantes antes de una cefalea hemicraneal con náuseas y antecedente familiar: migraña con aura"><title>Luces brillantes antes de una cefalea hemicraneal con náuseas y antecedente familiar: migraña con aura</title><rect x="0.75" y="0.75" width="998.5" height="899.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neurología · migraña con aura</tspan></text><rect x="379.8" y="32.0" width="113.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="436.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="98"><tspan x="436.6" dy="0">NEUROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Migraña con aura (clásica)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Aura visual, sensitiva o del lenguaje, completamente reversible, que precede o acompaña a</tspan><tspan x="58.0" dy="17">la cefalea.</tspan><tspan x="58.0" dy="17">La depresión cortical propagada avanza por la corteza occipital a unos 3 mm por minuto.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 50 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Cefalea derecha con náuseas y vómitos recurrentes</tspan><tspan x="640.0" dy="16">desde la infancia.</tspan><tspan x="640.0" dy="16">Antes ve luces brillantes; la madre y la abuela tienen lo</tspan><tspan x="640.0" dy="16">mismo.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LOS TRES DATOS QUE DEFINEN LA MIGRAÑA CON AURA EN ESTA PACIENTE</tspan></text><rect x="42.0" y="311.0" width="302.7" height="56.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="193.3" y="336.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">1. AURA</tspan></text><text x="193.3" y="355.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">Dura 5 a 60 minutos</tspan></text><rect x="348.7" y="311.0" width="302.7" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="500.0" y="336.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">2. CEFALEA</tspan></text><text x="500.0" y="355.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">Con o después del aura</tspan></text><rect x="655.3" y="311.0" width="302.7" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="806.7" y="336.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">3. HERENCIA</tspan></text><text x="806.7" y="355.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">Desde la infancia</tspan></text><rect x="147.9" y="300.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="193.3" y="315.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="193.3" dy="0">◆ ESTE CASO</tspan></text><rect x="48.0" y="381.0" width="290.7" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="193.3" y="409.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">LUCES BRILLANTES</tspan></text><text x="193.3" y="433.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">Escotomas o espectros de fortificación</tspan><tspan x="193.3" dy="17">Reversible y de desarrollo gradual</tspan></text><rect x="354.7" y="381.0" width="290.7" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="409.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">HEMICRÁNEA CON NÁUSEAS</tspan></text><text x="500.0" y="433.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">Cefalea derecha, náuseas y vómitos</tspan><tspan x="500.0" dy="17">Crisis recurrentes</tspan></text><rect x="661.3" y="381.0" width="290.7" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="806.7" y="409.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">MADRE Y ABUELA</tspan></text><text x="806.7" y="433.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">Componente poligénico</tspan><tspan x="806.7" dy="17">Hasta 50-60 % con antecedente familiar</tspan></text><text x="40.0" y="512.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="522.2" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="561.7" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="544.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hipertensión</tspan><tspan x="285.0" dy="17">intracraneal</tspan><tspan x="285.0" dy="17">benigna</tspan></text><text x="435.0" y="553.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hemorragia</tspan><tspan x="435.0" dy="17">subaracnoidea</tspan></text><rect x="513.0" y="525.2" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="561.7" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Migraña clásica</tspan></text><text x="735.0" y="561.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Tumor hipofisario</tspan></text><text x="885.0" y="553.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Cefalea tipo petit</tspan><tspan x="885.0" dy="17">mal</tspan></text><rect x="40.0" y="593.2" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="593.2" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="622.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Presunción</tspan><tspan x="54.0" dy="16">diagnóstica?</tspan></text><text x="285.0" y="622.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: obesa, cefalea</tspan><tspan x="285.0" dy="16">diaria y papiledema</tspan></text><text x="435.0" y="622.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: cefalea súbita e</tspan><tspan x="435.0" dy="16">intensísima, sin aura</tspan></text><text x="585.0" y="622.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: aura visual, cefalea</tspan><tspan x="585.0" dy="16">hemicraneal y herencia</tspan></text><text x="735.0" y="614.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: hemianopsia</tspan><tspan x="735.0" dy="16">bitemporal y alteración</tspan><tspan x="735.0" dy="16">endocrina</tspan></text><text x="885.0" y="622.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no es una entidad</tspan><tspan x="885.0" dy="16">reconocida</tspan></text><rect x="40.0" y="522.2" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="683.2" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="711.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="733.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• ICHD-3: 2 o más crisis con aura reversible que se desarrolla gradualmente en 5 min o más y dura 5-60 min, con cefalea migrañosa asociada o posterior.</tspan><tspan x="58.0" dy="18">• Aura visual: luces brillantes, escotomas centelleantes o espectros de fortificación. Hasta 50-60 % tiene antecedente familiar (herencia poligénica).</tspan><tspan x="58.0" dy="18">• Diferencial: hipertensión intracraneal idiopática (obesa, papiledema), hemorragia subaracnoidea (súbita, sin aura), tumor hipofisario (hemianopsia</tspan><tspan x="58.0" dy="18">   bitemporal).</tspan><tspan x="58.0" dy="18">• El aura aumenta el riesgo de ictus: están contraindicados los anticonceptivos con estrógenos, sobre todo en fumadoras. Agudo: triptanes o AINE;</tspan><tspan x="58.0" dy="18">   prevención: propranolol, topiramato o anti-CGRP.</tspan></text><text x="58.0" y="845.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Headache Classification Committee of the IHS, ICHD-3, Cephalalgia 2018;38:1-211; Ailani J et al., American Headache Society Consensus Statement, Headache</tspan><tspan x="58.0" dy="15">2021;61:1021-1039; Harrison Principios de Medicina Interna, 21.ª ed. (2022)</tspan></text></svg>