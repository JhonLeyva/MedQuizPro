<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="875" viewBox="0 0 1000 875" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Primigesta Rh negativo con Coombs indirecto negativo a las 13 semanas: la inmunoglobulina anti-D profiláctica se aplica a las 28 semanas (y en las 72 h posparto si el RN es Rh positivo)"><title>Primigesta Rh negativo con Coombs indirecto negativo a las 13 semanas: la inmunoglobulina anti-D profiláctica se aplica a las 28 semanas (y en las 72 h posparto si el RN es Rh positivo)</title><rect x="0.75" y="0.75" width="998.5" height="873.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Isoinmunización Rh · profilaxis</tspan></text><rect x="383.8" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="471.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="471.0" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="148.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Profilaxis anti-D</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Evita que la madre Rh(−) forme anticuerpos contra glóbulos Rh(+) del bebé, que dañarían a</tspan><tspan x="58.0" dy="17">los siguientes hijos.</tspan><tspan x="58.0" dy="17">Rutina: 28 semanas y dentro de las 72 h posparto si el RN es Rh(+); además tras</tspan><tspan x="58.0" dy="17">sangrado, aborto, ectópico, amniocentesis o trauma.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="148.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="146.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Primigesta de 13 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Rh negativo.</tspan><tspan x="640.0" dy="16">Coombs indirecto negativo (no sensibilizada).</tspan></text><rect x="640.0" y="209.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="222.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="222.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="270.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CUÁNDO SE APLICA LA ANTI-D</tspan></text><rect x="40.0" y="282.0" width="920.0" height="34.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="52.0" y="304.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="134"><tspan x="52.0" dy="0">MADRE RH (−)</tspan></text><text x="256.0" y="304.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="128"><tspan x="256.0" dy="0">13 sem (hoy)</tspan></text><text x="388.0" y="304.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="128"><tspan x="388.0" dy="0">28 sem</tspan></text><text x="520.0" y="304.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="128"><tspan x="520.0" dy="0">Parto</tspan></text><text x="652.0" y="304.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="128"><tspan x="652.0" dy="0">&lt; 72 h posparto</tspan></text><text x="734.0" y="304.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="220"><tspan x="734.0" dy="0">REGLA</tspan></text><rect x="324.0" y="318.0" width="128.0" height="118.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/><rect x="40.0" y="322.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="352.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Coombs indirecto</tspan></text><line x1="198.0" y1="348.0" x2="710.0" y2="348.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="256.0" cy="343.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="256.0" y="347.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="256.0" dy="0">✓</tspan></text><text x="256.0" y="370.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="256.0" dy="0">Negativo</tspan></text><circle cx="388.0" cy="343.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="388.0" y="370.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="388.0" dy="0">Repetir</tspan></text><rect x="730.0" y="322.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="352.0" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">Debe ser negativo para dar profilaxis.</tspan></text><rect x="40.0" y="380.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="410.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Anti-D 300 µg IM</tspan></text><line x1="198.0" y1="406.0" x2="710.0" y2="406.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="388.0" cy="401.0" r="13" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="388.0" y="405.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">!</tspan></text><text x="388.0" y="428.0" font-size="9.5" font-weight="700" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="128"><tspan x="388.0" dy="0">Dosis</tspan></text><circle cx="652.0" cy="401.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="652.0" y="428.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="652.0" dy="0">Si RN Rh+</tspan></text><rect x="730.0" y="380.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="402.5" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">28 sem y &lt; 72 h posparto; también tras</tspan><tspan x="740.0" dy="15">sangrados.</tspan></text><rect x="354.5" y="307.0" width="67.1" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="388.0" y="322.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">◆ 28 SEM</tspan></text><text x="44.0" y="452.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="44.0" dy="0">✓ hecho · ! dosis de rutina · ○ programado</tspan></text><rect x="40.0" y="476.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="502.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Anti-D a las 28 semanas</tspan></text><text x="60.0" y="521.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Y otra en las 72 h posparto si el bebé es Rh positivo.</tspan></text><text x="40.0" y="588.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="598.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="629.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="601.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="620.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Semana 28 de</tspan><tspan x="285.0" dy="17">gestación</tspan></text><text x="435.0" y="620.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Previo a la siguiente</tspan><tspan x="435.0" dy="17">gestación</tspan></text><text x="585.0" y="620.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Dos semanas</tspan><tspan x="585.0" dy="17">posteriores al parto</tspan></text><text x="735.0" y="620.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Semana 14 de</tspan><tspan x="735.0" dy="17">gestación</tspan></text><text x="885.0" y="629.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Inmediatamente</tspan></text><rect x="40.0" y="652.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="652.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="681.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Cuándo?</tspan></text><text x="285.0" y="681.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: profilaxis de rutina</tspan></text><text x="435.0" y="681.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: llega tarde</tspan></text><text x="585.0" y="681.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: debe ser &lt; 72 h</tspan></text><text x="735.0" y="673.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: solo si hay un</tspan><tspan x="735.0" dy="16">evento</tspan></text><text x="885.0" y="673.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: sin evento</tspan><tspan x="885.0" dy="16">sensibilizante</tspan></text><rect x="40.0" y="598.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="726.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="754.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="776.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Anti-D 300 µg IM a las 28 semanas.</tspan><tspan x="58.0" dy="18">• Repetir Coombs indirecto antes de la dosis.</tspan><tspan x="58.0" dy="18">• Al nacer: grupo del RN; si es Rh(+), anti-D en &lt; 72 h.</tspan></text><text x="58.0" y="834.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, aloinmunización Rh (2017; act.); MINSA Perú.</tspan></text></svg>