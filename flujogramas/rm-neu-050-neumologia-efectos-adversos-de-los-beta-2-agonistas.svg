<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1346" viewBox="0 0 1000 1346" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Los beta-2 agonistas, sobre todo por vía oral, producen hipokalemia al meter potasio en la célula"><title>Los beta-2 agonistas, sobre todo por vía oral, producen hipokalemia al meter potasio en la célula</title><rect x="0.75" y="0.75" width="998.5" height="1344.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neumología · efectos adversos de los beta-2 agonistas</tspan></text><rect x="523.4" y="32.0" width="114.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="580.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="99"><tspan x="580.8" dy="0">NEUMOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Beta-2 agonistas</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Estimulan la bomba Na⁺/K⁺ ATPasa del músculo esquelético.</tspan><tspan x="58.0" dy="17">El potasio pasa al interior de la célula.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué efecto secundario se asocia al uso, sobre todo</tspan><tspan x="640.0" dy="16">oral, de beta-2 agonistas en el asma?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL BETA-2 AGONISTA A LA HIPOKALEMIA Y SU CONDUCTA</tspan></text><rect x="40.0" y="269.0" width="920.0" height="113.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="269.0" width="108.0" height="113.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="329.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Fármaco</tspan></text><rect x="40.0" y="382.0" width="920.0" height="113.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="382.0" width="108.0" height="113.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="442.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Célula</tspan></text><rect x="40.0" y="495.0" width="920.0" height="113.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="495.0" width="108.0" height="113.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="555.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Laboratorio</tspan></text><rect x="40.0" y="608.0" width="920.0" height="113.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="608.0" width="108.0" height="113.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="668.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Conducta</tspan></text><line x1="348.0" y1="325.5" x2="355.0" y2="325.5" stroke="#ea580c" stroke-width="2.2"/><line x1="355.0" y1="325.5" x2="355.0" y2="430.0" stroke="#ea580c" stroke-width="2.2"/><line x1="355.0" y1="430.0" x2="353.0" y2="430.0" stroke="#ea580c" stroke-width="2.2"/><polygon points="353.0,435.0 353.0,425.0 362.0,430.0" fill="#ea580c"/><line x1="552.0" y1="430.0" x2="559.0" y2="430.0" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="430.0" x2="559.0" y2="542.5" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="542.5" x2="557.0" y2="542.5" stroke="#ea580c" stroke-width="2.2"/><polygon points="557.0,547.5 557.0,537.5 566.0,542.5" fill="#ea580c"/><line x1="756.0" y1="542.5" x2="763.0" y2="542.5" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="542.5" x2="763.0" y2="655.5" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="655.5" x2="761.0" y2="655.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="761.0,660.5 761.0,650.5 770.0,655.5" fill="#0f766e"/><rect x="158.0" y="282.0" width="190.0" height="87.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Beta-2 agonista, sobre todo</tspan><tspan x="168.0" dy="16">oral o nebulizado en dosis</tspan><tspan x="168.0" dy="16">altas</tspan></text><text x="168.0" y="347.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Salbutamol</tspan></text><circle cx="158.0" cy="282.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="362.0" y="395.0" width="190.0" height="70.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="372.0" y="411.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Activa la bomba Na⁺/K⁺</tspan><tspan x="372.0" dy="16">ATPasa muscular</tspan></text><text x="372.0" y="444.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">El potasio entra a la célula</tspan></text><circle cx="362.0" cy="395.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="362.0" y="399.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="362.0" dy="0">2</tspan></text><rect x="566.0" y="508.0" width="190.0" height="69.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="576.0" y="524.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Potasio sérico bajo</tspan></text><text x="576.0" y="541.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Se suma el efecto de corticoides,</tspan><tspan x="576.0" dy="14.5">diuréticos y teofilina</tspan></text><circle cx="566.0" cy="508.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="566.0" y="512.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="566.0" dy="0">3</tspan></text><rect x="770.0" y="621.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="780.0" y="637.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Controlar potasio y ECG</tspan></text><text x="780.0" y="654.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Preferir la vía inhalada con</tspan><tspan x="780.0" dy="14.5">cámara</tspan></text><circle cx="770.0" cy="621.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="770.0" y="625.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="770.0" dy="0">4</tspan></text><rect x="40.0" y="739.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="765.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Beta-2 agonistas = hipokalemia</tspan></text><text x="60.0" y="784.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Causan hiperglucemia, no hipoglucemia; no cambian triglicéridos, cloro ni sodio de forma típica.</tspan></text><text x="40.0" y="845.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EFECTOS ADVERSOS DE LOS BETA-2 AGONISTAS</tspan></text><rect x="40.0" y="857.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="876.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Efecto</tspan></text><text x="260.0" y="876.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Mecanismo</tspan></text><text x="615.0" y="876.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Comentario</tspan></text><rect x="40.0" y="886.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="905.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Temblor fino</tspan></text><text x="260.0" y="905.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Receptores beta-2 del músculo esquelético</tspan></text><text x="615.0" y="905.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">El más frecuente; hay tolerancia</tspan></text><rect x="40.0" y="915.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="934.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Taquicardia y palpitaciones</tspan></text><text x="260.0" y="934.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Estímulo cardíaco, mayor con los no selectivos</tspan></text><text x="615.0" y="934.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Menor con salbutamol</tspan></text><rect x="40.0" y="944.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="963.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Hipokalemia</tspan></text><text x="260.0" y="963.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Bomba Na⁺/K⁺ ATPasa: potasio hacia la célula</tspan></text><text x="615.0" y="963.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Dosis dependiente; más con la vía oral</tspan></text><rect x="150.6" y="947.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="196.0" y="962.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="196.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="973.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="992.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Hiperglucemia</tspan></text><text x="260.0" y="992.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Glucogenólisis y lipólisis</tspan></text><text x="615.0" y="992.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">No hipoglucemia</tspan></text><text x="40.0" y="1042.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1052.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1074.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1074.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hipotrigliceridemia</tspan></text><text x="435.0" y="1074.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hipoglicemia</tspan></text><text x="585.0" y="1074.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Hipercloremia</tspan></text><rect x="663.0" y="1055.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="1074.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hipokalemia</tspan></text><text x="885.0" y="1074.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hiponatremia</tspan></text><rect x="40.0" y="1089.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="1089.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1126.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Efecto de los beta-2?</tspan></text><text x="285.0" y="1110.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: sube las grasas</tspan><tspan x="285.0" dy="16">libres, no baja los</tspan><tspan x="285.0" dy="16">triglicéridos</tspan></text><text x="435.0" y="1110.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: produce</tspan><tspan x="435.0" dy="16">hiperglucemia, no</tspan><tspan x="435.0" dy="16">hipoglucemia</tspan></text><text x="585.0" y="1126.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no altera el cloro</tspan></text><text x="735.0" y="1110.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: la bomba Na⁺/K⁺</tspan><tspan x="735.0" dy="16">mete potasio en la</tspan><tspan x="735.0" dy="16">célula</tspan></text><text x="885.0" y="1126.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no altera el sodio</tspan></text><rect x="40.0" y="1052.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1179.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1207.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1229.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Hipokalemia dependiente de la dosis, más marcada por vía oral o con nebulizaciones altas; la potencian corticoides, diuréticos y teofilina.</tspan><tspan x="58.0" dy="18">• Efecto más frecuente: temblor fino; luego taquicardia y palpitaciones, menores con los selectivos (salbutamol). Hay tolerancia con el uso regular.</tspan><tspan x="58.0" dy="18">• También hiperglucemia y aumento de ácidos grasos libres; no producen hipoglucemia, hipotrigliceridemia, hipercloremia ni hiponatremia.</tspan><tspan x="58.0" dy="18">• Alerta: en crisis grave con nebulizaciones repetidas, controlar potasio y ECG; se prefiere la vía inhalada con cámara espaciadora.</tspan></text><text x="58.0" y="1305.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Goodman y Gilman, 14.ª ed. (2023); Katzung, 16.ª ed. (2024); Harrison, 21.ª ed. (2022).</tspan></text></svg>