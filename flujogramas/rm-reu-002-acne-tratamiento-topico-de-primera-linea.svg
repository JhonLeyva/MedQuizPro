<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1036" viewBox="0 0 1000 1036" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Acné con comedones, pápulas, pústulas y nódulos: la base tópica son los retinoides"><title>Acné con comedones, pápulas, pústulas y nódulos: la base tópica son los retinoides</title><rect x="0.75" y="0.75" width="998.5" height="1034.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Acné · tratamiento tópico de primera línea</tspan></text><rect x="448.1" y="32.0" width="227.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="561.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="211"><tspan x="561.9" dy="0">REUMATOLOGÍA Y DERMATOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Acné vulgar</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Enfermedad del folículo pilosebáceo con un componente comedogénico y otro inflamatorio.</tspan><tspan x="58.0" dy="17">El comedón es la lesión inicial.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Adolescente de 15 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dos años de pápulas, pústulas, comedones y lesiones</tspan><tspan x="640.0" dy="16">nódulo-quísticas en el tronco.</tspan><tspan x="640.0" dy="16">¿Cuál es el tratamiento tópico de primera elección?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SE DESCARTA SEGÚN LO QUE HACE CADA TÓPICO</tspan></text><text x="614.0" y="297.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,309.0 580.0,309.0 531.7,385.0 88.3,385.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="325.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="357.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="399"><tspan x="310.0" dy="0">Tópicos para el acné con comedones y lesiones inflamatorias</tspan></text><line x1="559.8" y1="347.0" x2="606.0" y2="347.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="318.0" width="131.9" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="680.0" y="335.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="680.0" dy="0">Peróxido de benzoilo</tspan></text><rect x="751.9" y="318.0" width="108.4" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="806.1" y="335.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="806.1" dy="0">Clindamicina gel</tspan></text><rect x="866.3" y="318.0" width="77.6" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="905.1" y="335.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="905.1" dy="0">Retinoides</tspan></text><rect x="614.0" y="350.0" width="128.0" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="678.0" y="367.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="678.0" dy="0">Ácido azelaico 20 %</tspan></text><rect x="748.0" y="350.0" width="56.0" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="776.0" y="367.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="776.0" dy="0">Azufre</tspan></text><polygon points="88.3,389.0 531.7,389.0 483.3,449.0 136.7,449.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="162.7" cy="419.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="162.7" y="423.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="162.7" dy="0">1</tspan></text><text x="320.0" y="415.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="283"><tspan x="320.0" dy="0">¿Normaliza la queratinización y resuelve el</tspan><tspan x="320.0" dy="17">comedón?</tspan></text><line x1="511.5" y1="419.0" x2="606.0" y2="419.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="406.0" width="120.4" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="674.2" y="423.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="674.2" dy="0">✕ Clindamicina gel</tspan></text><line x1="636.0" y1="419.5" x2="724.4" y2="419.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="740.4" y="406.0" width="67.5" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="774.2" y="423.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="774.2" dy="0">✕ Azufre</tspan></text><line x1="762.4" y1="419.5" x2="797.9" y2="419.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="136.7,453.0 483.3,453.0 435.0,513.0 185.0,513.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="483.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="487.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">2</tspan></text><text x="320.0" y="479.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">¿Es la base tópica en todo</tspan><tspan x="320.0" dy="17">grado, sola o combinada?</tspan></text><line x1="463.2" y1="483.0" x2="606.0" y2="483.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="470.0" width="144.0" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="686.0" y="487.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="686.0" dy="0">✕ Peróxido de benzoilo</tspan></text><line x1="636.0" y1="483.5" x2="748.0" y2="483.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="764.0" y="470.0" width="140.1" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="834.1" y="487.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="834.1" dy="0">✕ Ácido azelaico 20 %</tspan></text><line x1="786.0" y1="483.5" x2="894.1" y2="483.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="517.0" x2="310.0" y2="536.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,535.0 315.0,535.0 310.0,543.0" fill="#0f766e"/><rect x="140.0" y="547.0" width="340.0" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="576.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">RETINOIDES TÓPICOS</tspan></text><text x="310.0" y="600.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Comedolíticos y antiinflamatorios</tspan><tspan x="310.0" dy="17">Se combinan con peróxido de benzoilo</tspan></text><rect x="370.6" y="536.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="551.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="554.9" width="346.0" height="76.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="574.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="592.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">El peróxido de benzoilo es su mejor socio, pero se usa</tspan><tspan x="628.0" dy="16">como combinación y no corrige la queratinización.</tspan></text><text x="40.0" y="678.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="688.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="719.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="711.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Peróxido de</tspan><tspan x="285.0" dy="17">benzoilo</tspan></text><text x="435.0" y="719.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Clindamicina gel</tspan></text><rect x="513.0" y="691.9" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="719.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Retinoides</tspan></text><text x="735.0" y="719.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ácido azelaico 20 %</tspan></text><text x="885.0" y="719.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Azufre</tspan></text><rect x="40.0" y="742.9" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="742.9" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="771.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tópico de primera</tspan><tspan x="54.0" dy="16">elección?</tspan></text><text x="285.0" y="763.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: bactericida, pero</tspan><tspan x="285.0" dy="16">no corrige el comedón</tspan><tspan x="285.0" dy="16">por sí solo</tspan></text><text x="435.0" y="763.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: nunca se usa sola</tspan><tspan x="435.0" dy="16">por la resistencia</tspan><tspan x="435.0" dy="16">bacteriana</tspan></text><text x="585.0" y="763.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: resuelve el</tspan><tspan x="585.0" dy="16">comedón y es</tspan><tspan x="585.0" dy="16">antiinflamatorio</tspan></text><text x="735.0" y="763.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: alternativa si hay</tspan><tspan x="735.0" dy="16">intolerancia o</tspan><tspan x="735.0" dy="16">hiperpigmentación</tspan></text><text x="885.0" y="771.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: evidencia débil, sin</tspan><tspan x="885.0" dy="16">papel de primera línea</tspan></text><rect x="40.0" y="688.9" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="832.9" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="860.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="882.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Retinoides tópicos (adapaleno, tretinoína, tazaroteno): normalizan la queratinización, resuelven el comedón y son antiinflamatorios; base en todo grado</tspan><tspan x="58.0" dy="18">   (AAD 2024).</tspan><tspan x="58.0" dy="18">• Se combinan con peróxido de benzoilo (bactericida, sin resistencia) o con antibiótico tópico; la clindamicina nunca se usa sola por el riesgo de</tspan><tspan x="58.0" dy="18">   resistencia.</tspan><tspan x="58.0" dy="18">• Ácido azelaico: alternativa si no se toleran los otros o hay hiperpigmentación posinflamatoria; el azufre tiene poca evidencia.</tspan><tspan x="58.0" dy="18">• Alerta: con nódulos o quistes los tópicos solos no bastan; se añade antibiótico oral o isotretinoína (teratogénica: evitar el embarazo).</tspan></text><text x="58.0" y="994.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAD, Guidelines of care for the management of acne vulgaris (Reynolds, JAAD 2024); EDF, S3 guideline for the treatment of acne (Nast 2016).</tspan></text></svg>