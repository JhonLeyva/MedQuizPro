<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1026" viewBox="0 0 1000 1026" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Niño de 9 años elegido para un ensayo clínico: además de su asentimiento, la madre debe firmar el consentimiento informado (en un idioma que entienda)"><title>Niño de 9 años elegido para un ensayo clínico: además de su asentimiento, la madre debe firmar el consentimiento informado (en un idioma que entienda)</title><rect x="0.75" y="0.75" width="998.5" height="1024.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ética de la investigación · consentimiento en menores</tspan></text><rect x="519.3" y="32.0" width="143.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="591.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="127"><tspan x="591.0" dy="0">SALUD PÚBLICA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Asentimiento y consentimiento</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El niño que puede entender (≈ desde los 8 años) da su asentimiento: acepta participar</tspan><tspan x="58.0" dy="17">luego de una explicación a su nivel.</tspan><tspan x="58.0" dy="17">Pero el consentimiento legal lo dan los padres o el tutor: sin la firma de la madre no es</tspan><tspan x="58.0" dy="17">válido.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Escolar de 9 años, bilingüe</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Madre quechuahablante.</tspan><tspan x="640.0" dy="16">Elegido para un ensayo clínico; el médico le explica en</tspan><tspan x="640.0" dy="16">castellano.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ HACE VÁLIDA LA PARTICIPACIÓN DE UN NIÑO</tspan></text><line x1="421.1" y1="379.5" x2="340.0" y2="327.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="327.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="421.1" y1="481.7" x2="340.0" y2="534.2" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="534.2" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="402.5" x2="660.0" y2="380.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="380.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="458.6" x2="660.0" y2="480.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="480.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="406.0" y1="430.6" x2="340.0" y2="430.6" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="430.6" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="430.6" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="430.6" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="426.1" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">ENSAYO CON</tspan><tspan x="500.0" dy="19">NIÑOS</tspan></text><text x="500.0" y="464.1" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">9 años</tspan></text><rect x="40.0" y="285.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="286.0" width="6.0" height="82.0" rx="3" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="190.0" y="318.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">ASENTIMIENTO DEL NIÑO</tspan></text><text x="190.0" y="342.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Explicado a su nivel</tspan></text><rect x="40.0" y="385.0" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="413.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">CONSENTIMIENTO DE LA MADRE</tspan></text><text x="190.0" y="437.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Firma obligatoria</tspan><tspan x="190.0" dy="17">Esta pregunta</tspan></text><rect x="144.6" y="466.2" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="481.2" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="492.2" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="493.2" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="190.0" y="525.9" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">EN SU IDIOMA</tspan></text><text x="190.0" y="549.6" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Quechua para la madre</tspan></text><rect x="660.0" y="338.6" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="339.6" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="372.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">COMITÉ DE ÉTICA</tspan></text><text x="810.0" y="396.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Aprueba el estudio</tspan></text><rect x="660.0" y="438.6" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="439.6" width="6.0" height="82.0" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="472.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">LIBRE RETIRO</tspan></text><text x="810.0" y="496.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Sin consecuencias</tspan></text><text x="40.0" y="612.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="624.2" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="657.2" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Explicar al niño</tspan></text><line x1="248.5" y1="653.2" x2="267.5" y2="653.2" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,648.2 266.5,658.2 274.5,653.2" fill="#0f766e"/><rect x="278.5" y="624.2" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="657.2" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Asentimiento</tspan></text><line x1="487.0" y1="653.2" x2="506.0" y2="653.2" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,648.2 505.0,658.2 513.0,653.2" fill="#0f766e"/><rect x="517.0" y="624.2" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="648.7" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Consentimiento de la madre en</tspan><tspan x="619.2" dy="17">quechua</tspan></text><line x1="725.5" y1="653.2" x2="744.5" y2="653.2" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,648.2 743.5,658.2 751.5,653.2" fill="#0f766e"/><rect x="755.5" y="624.2" width="204.5" height="58.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="657.2" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Participa</tspan></text><text x="40.0" y="722.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="732.2" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="771.7" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="763.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Una autoridad</tspan><tspan x="285.0" dy="17">jurídica presente</tspan></text><text x="435.0" y="754.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">El niño firma un</tspan><tspan x="435.0" dy="17">consentimiento en</tspan><tspan x="435.0" dy="17">quechua</tspan></text><rect x="513.0" y="735.2" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="754.7" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">La madre también</tspan><tspan x="585.0" dy="17">debe firmar el</tspan><tspan x="585.0" dy="17">consentimiento</tspan></text><text x="735.0" y="763.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Basta la firma del</tspan><tspan x="735.0" dy="17">niño (&gt; 8 años)</tspan></text><text x="885.0" y="754.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Que el investigador</tspan><tspan x="885.0" dy="17">lo firme en su</tspan><tspan x="885.0" dy="17">nombre</tspan></text><rect x="40.0" y="803.2" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="803.2" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="832.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Condición?</tspan></text><text x="285.0" y="824.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no se requiere</tspan><tspan x="285.0" dy="16">autoridad jurídica</tspan></text><text x="435.0" y="824.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: el que consiente</tspan><tspan x="435.0" dy="16">es la madre</tspan></text><text x="585.0" y="824.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: el consentimiento</tspan><tspan x="585.0" dy="16">es de la madre</tspan></text><text x="735.0" y="824.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: su firma sola no</tspan><tspan x="735.0" dy="16">basta</tspan></text><text x="885.0" y="824.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: el investigador no</tspan><tspan x="885.0" dy="16">firma por él</tspan></text><rect x="40.0" y="732.2" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="877.2" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="905.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="927.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El consentimiento de la madre debe explicarse en quechua (con traductor si hace falta).</tspan><tspan x="58.0" dy="18">• El estudio debe estar aprobado por un comité de ética; el niño puede retirarse cuando quiera.</tspan><tspan x="58.0" dy="18">• Reglamento de ensayos clínicos del Perú (INS) y Declaración de Helsinki.</tspan></text><text x="58.0" y="985.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Declaración de Helsinki (2024); INS, reglamento de ensayos clínicos del Perú.</tspan></text></svg>