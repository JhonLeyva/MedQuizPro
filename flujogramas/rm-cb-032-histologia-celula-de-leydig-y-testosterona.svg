<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1083" viewBox="0 0 1000 1083" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La testosterona se produce en las células de Leydig, bajo la hormona luteinizante"><title>La testosterona se produce en las células de Leydig, bajo la hormona luteinizante</title><rect x="0.75" y="0.75" width="998.5" height="1081.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Histología · célula de Leydig y testosterona</tspan></text><rect x="455.7" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="527.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="527.6" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Células de Leydig</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Células intersticiales entre los túbulos seminíferos.</tspan><tspan x="58.0" dy="17">Poligonales, con citoplasma eosinófilo, gotas lipídicas y retículo liso abundante.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿En qué tipo de célula se produce principalmente la</tspan><tspan x="640.0" dy="16">testosterona?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUIÉN HACE QUÉ EN EL TESTÍCULO</tspan></text><rect x="40.0" y="269.0" width="920.0" height="95.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="269.0" width="108.0" height="95.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="320.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Hipófisis</tspan></text><rect x="40.0" y="364.0" width="920.0" height="95.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="364.0" width="108.0" height="95.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="411.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Célula de</tspan><tspan x="94.0" dy="14">Leydig</tspan></text><rect x="40.0" y="459.0" width="920.0" height="95.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="459.0" width="108.0" height="95.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="506.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Célula de</tspan><tspan x="94.0" dy="14">Sertoli</tspan></text><rect x="40.0" y="554.0" width="920.0" height="95.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="554.0" width="108.0" height="95.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="605.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Célula germinal</tspan></text><line x1="348.0" y1="316.5" x2="355.0" y2="316.5" stroke="#ea580c" stroke-width="2.2"/><line x1="355.0" y1="316.5" x2="355.0" y2="411.5" stroke="#ea580c" stroke-width="2.2"/><line x1="355.0" y1="411.5" x2="353.0" y2="411.5" stroke="#ea580c" stroke-width="2.2"/><polygon points="353.0,416.5 353.0,406.5 362.0,411.5" fill="#ea580c"/><line x1="552.0" y1="411.5" x2="559.0" y2="411.5" stroke="#0f766e" stroke-width="2.2"/><line x1="559.0" y1="411.5" x2="559.0" y2="506.5" stroke="#0f766e" stroke-width="2.2"/><line x1="559.0" y1="506.5" x2="557.0" y2="506.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="557.0,511.5 557.0,501.5 566.0,506.5" fill="#0f766e"/><line x1="756.0" y1="506.5" x2="763.0" y2="506.5" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="506.5" x2="763.0" y2="601.5" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="601.5" x2="761.0" y2="601.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="761.0,606.5 761.0,596.5 770.0,601.5" fill="#0f766e"/><rect x="158.0" y="282.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">LH y FSH</tspan></text><text x="168.0" y="315.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Adenohipófisis: LH hacia el</tspan><tspan x="168.0" dy="14.5">intersticio, FSH hacia el túbulo</tspan></text><circle cx="158.0" cy="282.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="362.0" y="377.0" width="190.0" height="69.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="372.0" y="393.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Sintetiza testosterona</tspan></text><text x="372.0" y="410.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">LH → AMPc → colesterol →</tspan><tspan x="372.0" dy="14.5">pregnenolona → testosterona</tspan></text><circle cx="362.0" cy="377.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="362.0" y="381.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="362.0" dy="0">2</tspan></text><rect x="566.0" y="472.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="576.0" y="488.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Recibe testosterona y FSH</tspan></text><text x="576.0" y="505.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Secreta ABP e inhibina B y</tspan><tspan x="576.0" dy="14.5">mantiene la barrera</tspan></text><circle cx="566.0" cy="472.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="566.0" y="476.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="566.0" dy="0">3</tspan></text><rect x="770.0" y="567.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="780.0" y="583.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Espermatogénesis</tspan></text><text x="780.0" y="600.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Da los espermatozoides con</tspan><tspan x="780.0" dy="14.5">apoyo de Sertoli</tspan></text><circle cx="770.0" cy="567.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="770.0" y="571.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="770.0" dy="0">4</tspan></text><rect x="40.0" y="667.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="693.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Testosterona = célula de Leydig (LH)</tspan></text><text x="60.0" y="712.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La célula de Sertoli (FSH) sostiene la espermatogénesis.</tspan></text><text x="40.0" y="779.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="789.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="811.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="811.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Germinativa</tspan></text><text x="435.0" y="811.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Sertoli</tspan></text><text x="585.0" y="811.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Paneth</tspan></text><rect x="663.0" y="792.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="811.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Leydig</tspan></text><text x="885.0" y="811.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Intercalada</tspan></text><rect x="40.0" y="826.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="826.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="863.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Célula productora?</tspan></text><text x="285.0" y="855.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: da los</tspan><tspan x="285.0" dy="16">espermatozoides</tspan></text><text x="435.0" y="847.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: responde a la FSH</tspan><tspan x="435.0" dy="16">y sostiene a las</tspan><tspan x="435.0" dy="16">germinales</tspan></text><text x="585.0" y="855.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es una célula del</tspan><tspan x="585.0" dy="16">intestino delgado</tspan></text><text x="735.0" y="855.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: célula intersticial</tspan><tspan x="735.0" dy="16">que responde a la LH</tspan></text><text x="885.0" y="855.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: pertenece al túbulo</tspan><tspan x="885.0" dy="16">colector renal</tspan></text><rect x="40.0" y="789.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="916.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="944.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="966.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La LH se une a su receptor en la célula de Leydig, eleva el AMPc y convierte el colesterol en pregnenolona y luego en testosterona.</tspan><tspan x="58.0" dy="18">• La testosterona se difunde a la célula de Sertoli, que responde a la FSH, forma la barrera hematotesticular y secreta inhibina B y ABP.</tspan><tspan x="58.0" dy="18">• Las células germinativas dan los espermatozoides; las de Paneth son células del intestino delgado; las intercaladas son del túbulo colector renal.</tspan><tspan x="58.0" dy="18">• Alerta: el hipogonadismo primario eleva LH y FSH; el central las deja bajas con testosterona baja.</tspan></text><text x="58.0" y="1042.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Ross y Pawlina, Histología: texto y atlas 8.ª ed. (2020); Guyton y Hall, Tratado de fisiología médica 14.ª ed. (2021).</tspan></text></svg>