pan></text><text x="316.0" y="559.4" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="140"><tspan x="316.0" dy="0">Lucha por el control</tspan></text><rect x="416.0" y="499.0" width="168.0" height="90.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="535.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="140"><tspan x="500.0" dy="0">Acuerdos</tspan></text><text x="500.0" y="559.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="140"><tspan x="500.0" dy="0">Roles y cohesión</tspan></text><rect x="600.0" y="499.0" width="168.0" height="90.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="684.0" y="535.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="140"><tspan x="684.0" dy="0">Alto rendimiento</tspan></text><text x="684.0" y="559.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="140"><tspan x="684.0" dy="0">Autonomía</tspan></text><rect x="784.0" y="499.0" width="168.0" height="90.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="868.0" y="535.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="140"><tspan x="868.0" dy="0">Cierre</tspan></text><text x="868.0" y="559.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="140"><tspan x="868.0" dy="0">Termina la tarea</tspan></text><text x="40.0" y="627.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ETAPA DEL CASO · MARCADA LA CORRECTA</tspan></text><rect x="40.0" y="639.0" width="149.4" height="30.0" rx="15" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="114.7" y="658.5" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="114.7" dy="0">✓ Tormenta (storming)</tspan></text><rect x="197.4" y="639.0" width="88.1" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="241.5" y="658.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="241.5" dy="0">Formación</tspan></text><rect x="293.5" y="639.0" width="108.0" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="347.5" y="658.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="347.5" dy="0">Normalización</tspan></text><rect x="409.5" y="639.0" width="96.3" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="457.6" y="658.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="457.6" dy="0">Desempeño</tspan></text><rect x="40.0" y="693.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="721.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="743.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El conflicto es normal; el líder debe mediar y aclarar roles.</tspan><tspan x="58.0" dy="18">• Saltarse la tormenta suele dejar conflictos ocultos.</tspan><tspan x="58.0" dy="18">• En normalización se fijan reglas y confianza.</tspan></text><text x="58.0" y="801.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Tuckman BW (Psychol Bull 1965) · OPS – Liderazgo en salud (2017)</tspan></text></svg>