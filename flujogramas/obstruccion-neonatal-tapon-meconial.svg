<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="972" viewBox="0 0 1000 972" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Recién nacido de 24 horas sin meconio, distensión leve y ano permeable: tapón meconial"><title>Recién nacido de 24 horas sin meconio, distensión leve y ano permeable: tapón meconial</title><rect x="0.75" y="0.75" width="998.5" height="970.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstrucción intestinal neonatal</tspan></text><rect x="385.9" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="442.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="442.4" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Retraso en la eliminación de meconio</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El 99 % de los recién nacidos a término elimina meconio en las primeras 48 horas.</tspan><tspan x="58.0" dy="17">Primero se mira el ano; si es permeable, el enema de contraste orienta la causa.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Recién nacido de 24 horas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">No ha eliminado meconio.</tspan><tspan x="640.0" dy="16">Distensión abdominal discreta; ano permeable.</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="255.0" x2="383.2" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="383.2" y1="255.0" x2="383.2" y2="284.0" stroke="#94a3b8" stroke-width="2"/><polygon points="378.2,283.0 388.2,283.0 383.2,291.0" fill="#94a3b8"/><line x1="383.2" y1="349.0" x2="383.2" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="149.8" y1="379.0" x2="616.8" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="149.8" y1="379.0" x2="149.8" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="144.8,407.0 154.8,407.0 149.8,415.0" fill="#94a3b8"/><line x1="616.8" y1="379.0" x2="616.8" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="611.8,407.0 621.8,407.0 616.8,415.0" fill="#94a3b8"/><line x1="616.8" y1="473.0" x2="616.8" y2="518.5" stroke="#94a3b8" stroke-width="2"/><line x1="383.2" y1="518.5" x2="850.2" y2="518.5" stroke="#94a3b8" stroke-width="2"/><line x1="383.2" y1="518.5" x2="383.2" y2="547.5" stroke="#94a3b8" stroke-width="2"/><polygon points="378.2,546.5 388.2,546.5 383.2,554.5" fill="#94a3b8"/><line x1="616.8" y1="518.5" x2="616.8" y2="547.5" stroke="#94a3b8" stroke-width="2"/><polygon points="611.8,546.5 621.8,546.5 616.8,554.5" fill="#94a3b8"/><line x1="850.2" y1="518.5" x2="850.2" y2="547.5" stroke="#94a3b8" stroke-width="2"/><polygon points="845.2,546.5 855.2,546.5 850.2,554.5" fill="#94a3b8"/><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="255.0" x2="383.2" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="383.2" y1="255.0" x2="383.2" y2="284.0" stroke="#0f766e" stroke-width="3"/><polygon points="378.2,283.0 388.2,283.0 383.2,291.0" fill="#0f766e"/><line x1="383.2" y1="349.0" x2="383.2" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="383.2" y1="379.0" x2="616.8" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="616.8" y1="379.0" x2="616.8" y2="408.0" stroke="#0f766e" stroke-width="3"/><polygon points="611.8,407.0 621.8,407.0 616.8,415.0" fill="#0f766e"/><line x1="616.8" y1="473.0" x2="616.8" y2="518.5" stroke="#0f766e" stroke-width="3"/><line x1="383.2" y1="518.5" x2="616.8" y2="518.5" stroke="#0f766e" stroke-width="3"/><line x1="383.2" y1="518.5" x2="383.2" y2="547.5" stroke="#0f766e" stroke-width="3"/><polygon points="378.2,546.5 388.2,546.5 383.2,554.5" fill="#0f766e"/><rect x="135.6" y="388.0" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="149.8" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="149.8" dy="0">No</tspan></text><rect x="604.7" y="388.0" width="24.1" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="616.8" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="616.8" dy="0">Sí</tspan></text><rect x="308.3" y="527.5" width="150.0" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="383.2" y="540.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="383.2" dy="0">Tapón que sale (este caso)</tspan></text><rect x="562.2" y="527.5" width="109.1" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="616.8" y="540.0" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="616.8" dy="0">Zona de transición</tspan></text><rect x="814.7" y="527.5" width="71.1" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="850.2" y="540.0" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="850.2" dy="0">Microcolon</tspan></text><polygon points="123.2,320.0 149.2,291.0 617.2,291.0 643.2,320.0 617.2,349.0 149.2,349.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="169.2" cy="320.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="169.2" y="325.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="169.2" dy="0">?</tspan></text><text x="402.2" y="324.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="402.2" dy="0">RN sin meconio: ¿el ano es permeable?</tspan></text><rect x="40.0" y="415.0" width="219.5" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="149.8" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="192"><tspan x="149.8" dy="0">Malformación anorrectal</tspan></text><text x="149.8" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="192"><tspan x="149.8" dy="0">Cirugía pediátrica</tspan></text><polygon points="356.8,444.0 382.8,415.0 850.8,415.0 876.8,444.0 850.8,473.0 382.8,473.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="402.8" cy="444.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="402.8" y="449.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="402.8" dy="0">?</tspan></text><text x="635.8" y="448.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="635.8" dy="0">¿Enema de contraste?</tspan></text><rect x="273.5" y="554.5" width="219.5" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="383.2" y="582.8" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="192"><tspan x="383.2" dy="0">TAPÓN MECONIAL</tspan></text><text x="383.2" y="605.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="192"><tspan x="383.2" dy="0">El enema lo expulsa</tspan><tspan x="383.2" dy="17">Vigilar deposiciones</tspan></text><rect x="507.0" y="554.5" width="219.5" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="616.8" y="591.3" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="192"><tspan x="616.8" dy="0">Hirschsprung</tspan></text><text x="616.8" y="614.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="192"><tspan x="616.8" dy="0">Biopsia rectal</tspan></text><rect x="740.5" y="554.5" width="219.5" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="850.2" y="591.3" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="192"><tspan x="850.2" dy="0">Íleo meconial</tspan></text><text x="850.2" y="614.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="192"><tspan x="850.2" dy="0">Buscar fibrosis quística</tspan></text><text x="40.0" y="684.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="694.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="725.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="717.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Megacolon</tspan><tspan x="285.0" dy="17">agangliónico</tspan></text><text x="435.0" y="725.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Fibrosis quística</tspan></text><text x="585.0" y="725.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Hipotiroidismo</tspan></text><rect x="663.0" y="697.9" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="725.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Tapón meconial</tspan></text><text x="885.0" y="725.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Atresia anal</tspan></text><rect x="40.0" y="748.9" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="748.9" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="769.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Más probable a las 24</tspan><tspan x="54.0" dy="16">h?</tspan></text><text x="285.0" y="769.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Posible: si persiste,</tspan><tspan x="285.0" dy="16">biopsia rectal</tspan></text><text x="435.0" y="769.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Posible: íleo meconial</tspan><tspan x="435.0" dy="16">con microcolon</tspan></text><text x="585.0" y="769.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no se presenta así</tspan><tspan x="585.0" dy="16">en el primer día</tspan></text><text x="735.0" y="769.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: lo más frecuente</tspan><tspan x="735.0" dy="16">con ano permeable</tspan></text><text x="885.0" y="769.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: el ano es</tspan><tspan x="885.0" dy="16">permeable</tspan></text><rect x="40.0" y="694.9" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="822.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="850.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="872.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Tapón meconial: el enema de contraste muestra el tapón y además lo expulsa (diagnóstico y tratamiento).</tspan><tspan x="58.0" dy="18">• Si persiste el estreñimiento tras el tapón: biopsia rectal para descartar Hirschsprung; considerar fibrosis quística.</tspan><tspan x="58.0" dy="18">• Íleo meconial (fibrosis quística): microcolon y obstrucción en el íleon.</tspan></text><text x="58.0" y="930.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: APSA, enfermedad de Hirschsprung (2020); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>