<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1118" viewBox="0 0 1000 1118" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La lesión del núcleo subtalámico produce hemibalismo contralateral por desinhibición del tálamo"><title>La lesión del núcleo subtalámico produce hemibalismo contralateral por desinhibición del tálamo</title><rect x="0.75" y="0.75" width="998.5" height="1116.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neurología · ganglios basales</tspan></text><rect x="376.3" y="32.0" width="113.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="433.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="98"><tspan x="433.2" dy="0">NEUROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Núcleo subtalámico</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Estructura glutamatérgica de los ganglios basales que facilita la vía indirecta.</tspan><tspan x="58.0" dy="17">Excita el globo pálido interno y la sustancia negra reticulada, que inhiben el tálamo.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de localización</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">La lesión del subtálamo se manifiesta por…</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">RECORRIDO DE LA LESIÓN DEL SUBTÁLAMO HASTA EL HEMIBALISMO</tspan></text><rect x="40.0" y="253.0" width="920.0" height="95.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="253.0" width="108.0" height="95.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="304.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Subtálamo</tspan></text><rect x="40.0" y="348.0" width="920.0" height="95.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="348.0" width="108.0" height="95.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="399.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Pálido y nigra</tspan></text><rect x="40.0" y="443.0" width="920.0" height="95.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="443.0" width="108.0" height="95.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="494.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Tálamo</tspan></text><rect x="40.0" y="538.0" width="920.0" height="95.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="538.0" width="108.0" height="95.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="589.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Corteza motora</tspan></text><line x1="348.0" y1="292.5" x2="355.0" y2="292.5" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="292.5" x2="355.0" y2="395.5" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="395.5" x2="353.0" y2="395.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="353.0,400.5 353.0,390.5 362.0,395.5" fill="#0f766e"/><line x1="552.0" y1="395.5" x2="559.0" y2="395.5" stroke="#0f766e" stroke-width="2.2"/><line x1="559.0" y1="395.5" x2="559.0" y2="482.5" stroke="#0f766e" stroke-width="2.2"/><line x1="559.0" y1="482.5" x2="557.0" y2="482.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="557.0,487.5 557.0,477.5 566.0,482.5" fill="#0f766e"/><line x1="756.0" y1="482.5" x2="763.0" y2="482.5" stroke="#ea580c" stroke-width="2.2"/><line x1="763.0" y1="482.5" x2="763.0" y2="577.5" stroke="#ea580c" stroke-width="2.2"/><line x1="763.0" y1="577.5" x2="761.0" y2="577.5" stroke="#ea580c" stroke-width="2.2"/><polygon points="761.0,582.5 761.0,572.5 770.0,577.5" fill="#ea580c"/><rect x="158.0" y="266.0" width="190.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="168.0" y="282.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Lesión del subtálamo</tspan></text><text x="168.0" y="299.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Se pierde su efecto excitatorio</tspan></text><circle cx="158.0" cy="266.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="270.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="362.0" y="361.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="372.0" y="377.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Menos activación</tspan></text><text x="372.0" y="394.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Globo pálido interno y nigra</tspan><tspan x="372.0" dy="14.5">reticulada</tspan></text><circle cx="362.0" cy="361.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="362.0" y="365.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="362.0" dy="0">2</tspan></text><rect x="566.0" y="456.0" width="190.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="576.0" y="472.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Tálamo desinhibido</tspan></text><text x="576.0" y="489.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Recibe menos inhibición</tspan></text><circle cx="566.0" cy="456.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="566.0" y="460.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="566.0" dy="0">3</tspan></text><rect x="770.0" y="551.0" width="190.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="780.0" y="567.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Exceso de estímulo</tspan></text><text x="780.0" y="584.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Hemibalismo contralateral</tspan></text><circle cx="770.0" cy="551.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="770.0" y="555.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="770.0" dy="0">4</tspan></text><rect x="40.0" y="651.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="677.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Lesión del subtálamo = hemibalismo</tspan></text><text x="60.0" y="696.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Movimientos involuntarios, bruscos y de gran amplitud del lado contralateral.</tspan></text><text x="40.0" y="763.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="773.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="795.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="795.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hemiplejia</tspan></text><text x="435.0" y="795.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Atetosis</tspan></text><rect x="513.0" y="776.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="795.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Hemibalismo</tspan></text><text x="735.0" y="795.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ataxia</tspan></text><text x="885.0" y="795.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Acinesia</tspan></text><rect x="40.0" y="810.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="810.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="847.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Manifestación?</tspan></text><text x="285.0" y="831.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es secuela de la</tspan><tspan x="285.0" dy="16">vía corticoespinal o la</tspan><tspan x="285.0" dy="16">cápsula interna</tspan></text><text x="435.0" y="839.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: movimientos lentos</tspan><tspan x="435.0" dy="16">y reptantes del estriado</tspan></text><text x="585.0" y="831.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: movimientos</tspan><tspan x="585.0" dy="16">bruscos y proximales</tspan><tspan x="585.0" dy="16">contralaterales</tspan></text><text x="735.0" y="839.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es del cerebelo y</tspan><tspan x="735.0" dy="16">las vías propioceptivas</tspan></text><text x="885.0" y="831.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es de la disfunción</tspan><tspan x="885.0" dy="16">nigroestriada del</tspan><tspan x="885.0" dy="16">Parkinson</tspan></text><rect x="40.0" y="773.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="900.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="928.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="950.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Sin la excitación subtalámica el tálamo se desinhibe y la corteza motora recibe estímulo excesivo: movimientos bruscos, amplios y en ráfaga, proximales</tspan><tspan x="58.0" dy="18">   y contralaterales.</tspan><tspan x="58.0" dy="18">• Causa más común: infarto lacunar (coroideas posteriores o perforantes) en ancianos diabéticos e hipertensos; también tumores, hemorragias,</tspan><tspan x="58.0" dy="18">   desmielinizantes o VIH.</tspan><tspan x="58.0" dy="18">• Tratamiento: haloperidol, valproato o tetrabenazina; suele remitir en semanas a meses.</tspan><tspan x="58.0" dy="18">• Diferencial: hemiplejia (vía corticoespinal o cápsula interna), atetosis (estriado), ataxia (cerebelo), acinesia (nigroestriada en Parkinson).</tspan></text><text x="58.0" y="1062.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Kandel, Principles of Neural Science, 6.ª ed. (2021); Harrison Principios de Medicina Interna, 21.ª ed. (2022); Guyton y Hall, Tratado de Fisiología Médica, 14.ª ed.</tspan><tspan x="58.0" dy="15">(2021)</tspan></text></svg>