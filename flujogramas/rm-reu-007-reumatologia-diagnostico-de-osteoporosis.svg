<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1350" viewBox="0 0 1000 1350" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Mujer de 65 años con dolor dorsolumbar y sospecha de osteoporosis: se confirma con densitometría ósea (DXA)"><title>Mujer de 65 años con dolor dorsolumbar y sospecha de osteoporosis: se confirma con densitometría ósea (DXA)</title><rect x="0.75" y="0.75" width="998.5" height="1348.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Reumatología · diagnóstico de osteoporosis</tspan></text><rect x="461.8" y="32.0" width="227.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="575.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="211"><tspan x="575.5" dy="0">REUMATOLOGÍA Y DERMATOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Diagnóstico de osteoporosis</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se confirma con DXA de columna lumbar y cadera, con el índice T.</tspan><tspan x="58.0" dy="17">Una fractura por fragilidad de cadera o vertebral también lo establece.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 65 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dolor dorsolumbar de dos años.</tspan><tspan x="640.0" dy="16">Se plantea osteoporosis: ¿qué examen lo confirma?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE LLEGA AL DIAGNÓSTICO</tspan></text><text x="614.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,293.0 580.0,293.0 531.7,433.0 88.3,433.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="309.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="364.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="399"><tspan x="310.0" dy="0">Mujer de 65 años con dolor dorsolumbar y sospecha de</tspan><tspan x="310.0" dy="17">osteoporosis</tspan></text><line x1="559.8" y1="363.0" x2="606.0" y2="363.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="302.0" width="159.4" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="693.7" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="693.7" dy="0">Densitometría ósea (DXA)</tspan></text><rect x="614.0" y="334.0" width="230.0" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="729.0" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="729.0" dy="0">Resonancia magnética espectroscópica</tspan></text><rect x="614.0" y="366.0" width="201.9" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="715.0" y="383.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="715.0" dy="0">Resonancia magnética de difusión</tspan></text><rect x="614.0" y="398.0" width="192.1" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="710.1" y="415.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="710.1" dy="0">Resonancia magnética funcional</tspan></text><rect x="812.1" y="398.0" width="109.7" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="866.9" y="415.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="866.9" dy="0">Tomografía ósea</tspan></text><polygon points="88.3,437.0 531.7,437.0 483.3,545.0 136.7,545.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="162.7" cy="491.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="162.7" y="495.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="162.7" dy="0">1</tspan></text><text x="320.0" y="487.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="283"><tspan x="320.0" dy="0">¿Mide la densidad mineral de forma</tspan><tspan x="320.0" dy="17">estandarizada?</tspan></text><line x1="511.5" y1="491.0" x2="606.0" y2="491.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="446.0" width="242.1" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="735.1" y="463.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="735.1" dy="0">✕ Resonancia magnética espectroscópica</tspan></text><line x1="636.0" y1="459.5" x2="846.1" y2="459.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="614.0" y="478.0" width="214.0" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="721.0" y="495.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="721.0" dy="0">✕ Resonancia magnética de difusión</tspan></text><line x1="636.0" y1="491.5" x2="818.0" y2="491.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="614.0" y="510.0" width="204.2" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="716.1" y="527.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="716.1" dy="0">✕ Resonancia magnética funcional</tspan></text><line x1="636.0" y1="523.5" x2="808.2" y2="523.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="136.7,549.0 483.3,549.0 435.0,609.0 185.0,609.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="579.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="583.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">2</tspan></text><text x="320.0" y="575.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">¿Da el índice T que usa la</tspan><tspan x="320.0" dy="17">OMS?</tspan></text><line x1="463.2" y1="579.0" x2="606.0" y2="579.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="566.0" width="121.5" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="674.8" y="583.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="674.8" dy="0">✕ Tomografía ósea</tspan></text><line x1="636.0" y1="579.5" x2="725.5" y2="579.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="613.0" x2="310.0" y2="632.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,631.0 315.0,631.0 310.0,639.0" fill="#0f766e"/><rect x="140.0" y="643.0" width="340.0" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="672.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">DXA DE COLUMNA LUMBAR Y CADERA</tspan></text><text x="310.0" y="696.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Índice T de -2,5 o menor: osteoporosis</tspan><tspan x="310.0" dy="17">Estima el riesgo de fractura</tspan></text><rect x="370.6" y="632.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="647.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="642.9" width="346.0" height="92.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="662.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="680.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">Con dolor dorsolumbar se agrega una radiografía lateral</tspan><tspan x="628.0" dy="16">para ver fracturas vertebrales; después se calcula el</tspan><tspan x="628.0" dy="16">FRAX.</tspan></text><text x="40.0" y="768.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CRITERIO DENSITOMÉTRICO DE LA OMS (ÍNDICE T EN MUJERES POSMENOPÁUSICAS)</tspan></text><rect x="40.0" y="780.9" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="799.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Índice T</tspan></text><text x="290.0" y="799.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="664"><tspan x="290.0" dy="0">Categoría</tspan></text><rect x="40.0" y="809.9" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="828.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">-1,0 o más</tspan></text><text x="290.0" y="828.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="664"><tspan x="290.0" dy="0">Normal</tspan></text><rect x="40.0" y="838.9" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="857.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Entre -1,0 y -2,5</tspan></text><text x="290.0" y="857.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="664"><tspan x="290.0" dy="0">Baja masa ósea (osteopenia)</tspan></text><rect x="40.0" y="867.9" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="886.9" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">-2,5 o menor</tspan></text><text x="290.0" y="886.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="664"><tspan x="290.0" dy="0">Osteoporosis</tspan></text><rect x="180.6" y="871.4" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="226.0" y="886.4" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="226.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="912.9" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Una fractura por fragilidad de cadera o vertebral establece el diagnóstico clínico aun con DXA no osteoporótica.</tspan></text><text x="40.0" y="959.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="969.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1000.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="972.9" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="1000.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Densitometría ósea</tspan></text><text x="435.0" y="992.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">RM</tspan><tspan x="435.0" dy="17">espectroscópica</tspan></text><text x="585.0" y="1000.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">RM de difusión</tspan></text><text x="735.0" y="1000.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">RM funcional</tspan></text><text x="885.0" y="1000.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">TC ósea</tspan></text><rect x="40.0" y="1023.9" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1023.9" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1060.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Examen confirmatorio?</tspan></text><text x="285.0" y="1052.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: estándar con índice</tspan><tspan x="285.0" dy="16">T de columna y cadera</tspan></text><text x="435.0" y="1052.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no mide la</tspan><tspan x="435.0" dy="16">densidad mineral</tspan></text><text x="585.0" y="1052.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no mide la</tspan><tspan x="585.0" dy="16">densidad mineral</tspan></text><text x="735.0" y="1044.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no es una prueba</tspan><tspan x="735.0" dy="16">diagnóstica de</tspan><tspan x="735.0" dy="16">osteoporosis</tspan></text><text x="885.0" y="1052.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no estandariza la</tspan><tspan x="885.0" dy="16">densidad mineral</tspan></text><rect x="40.0" y="969.9" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1113.9" width="920.0" height="218.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1141.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1163.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• DXA de columna lumbar y cadera: índice T de -2,5 o menor = osteoporosis; -1 a -2,5 = baja masa ósea; -1 o más = normal. En premenopáusicas y</tspan><tspan x="58.0" dy="18">   varones jóvenes se usa el índice Z.</tspan><tspan x="58.0" dy="18">• USPSTF 2025: tamizar a toda mujer de 65 años o más y a posmenopáusicas más jóvenes con riesgo aumentado.</tspan><tspan x="58.0" dy="18">• Las resonancias y la tomografía no miden la densidad de forma estandarizada; la resonancia se reserva para sospecha de metástasis, mieloma o</tspan><tspan x="58.0" dy="18">   compresión neurológica.</tspan><tspan x="58.0" dy="18">• Con dolor dorsolumbar se pide además radiografía lateral o evaluación vertebral por DXA para ver fracturas por aplastamiento; luego FRAX y</tspan><tspan x="58.0" dy="18">   alendronato con calcio y vitamina D.</tspan></text><text x="58.0" y="1293.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: USPSTF, tamizaje de osteoporosis (JAMA 2025); Endocrine Society, osteoporosis posmenopáusica (J Clin Endocrinol Metab 2020); Canadá, guía de osteoporosis,</tspan><tspan x="58.0" dy="15">actualización 2023 (CMAJ 2023).</tspan></text></svg>