<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1141" viewBox="0 0 1000 1141" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Niño desnutrido con fractura, relato que no explica la lesión y cicatrices antiguas: sospechar maltrato infantil"><title>Niño desnutrido con fractura, relato que no explica la lesión y cicatrices antiguas: sospechar maltrato infantil</title><rect x="0.75" y="0.75" width="998.5" height="1140.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría social · maltrato infantil</tspan></text><rect x="395.5" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="452.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="452.0" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Maltrato infantil</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Físico, sexual, psicológico o por negligencia (la desnutrición puede ser su señal).</tspan><tspan x="58.0" dy="17">Sospechar cuando la historia no explica la lesión o hay lesiones de distinta antigüedad.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 4 años, desnutrido</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dolor en el brazo; la madre dice que se golpeó</tspan><tspan x="640.0" dy="16">jugando.</tspan><tspan x="640.0" dy="16">Aumento de volumen y limitación; cicatrices antiguas</tspan><tspan x="640.0" dy="16">en las extremidades; Rx: fractura en tallo verde.</tspan></text><line x1="640.0" y1="237.0" x2="670.0" y2="237.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#94a3b8"/><line x1="500.0" y1="381.0" x2="500.0" y2="411.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="411.0" x2="733.5" y2="411.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="411.0" x2="266.5" y2="440.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,439.0 271.5,439.0 266.5,447.0" fill="#94a3b8"/><line x1="733.5" y1="411.0" x2="733.5" y2="440.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,439.0 738.5,439.0 733.5,447.0" fill="#94a3b8"/><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#0f766e"/><line x1="500.0" y1="381.0" x2="500.0" y2="411.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="411.0" x2="500.0" y2="411.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="411.0" x2="266.5" y2="440.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,439.0 271.5,439.0 266.5,447.0" fill="#0f766e"/><rect x="133.4" y="420.0" width="266.1" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="432.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">No: cicatrices antiguas y desnutrición (este caso)</tspan></text><rect x="692.9" y="420.0" width="81.2" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="432.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Sí, coherente</tspan></text><polygon points="240.0,352.0 266.0,323.0 734.0,323.0 760.0,352.0 734.0,381.0 266.0,381.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="352.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="357.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="356.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Lesión en un niño: ¿la historia la explica?</tspan></text><rect x="40.0" y="447.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="475.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">MALTRATO INFANTIL</tspan></text><text x="266.5" y="498.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Proteger y hospitalizar</tspan><tspan x="266.5" dy="17">Denunciar</tspan></text><rect x="507.0" y="447.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="483.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Lesión accidental</tspan></text><text x="733.5" y="506.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Tratar y educar</tspan></text><text x="40.0" y="577.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SEÑALES DE ALARMA</tspan></text><rect x="40.0" y="589.5" width="920.0" height="225.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><line x1="62.0" y1="631.5" x2="938.0" y2="631.5" stroke="#64748b" stroke-width="2"/><line x1="62.0" y1="631.5" x2="62.0" y2="639.5" stroke="#64748b" stroke-width="2"/><line x1="938.0" y1="631.5" x2="938.0" y2="639.5" stroke="#64748b" stroke-width="2"/><rect x="336.5" y="619.5" width="327.0" height="24.0" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/><text x="500.0" y="635.5" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="313"><tspan x="500.0" dy="0">SEÑALES DE ALARMA DE MALTRATO · 3 de 4 en el caso</tspan></text><rect x="56.0" y="651.5" width="213.0" height="116.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="76.0" cy="674.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="76.0" y="678.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="76.0" dy="0">1</tspan></text><text x="94.0" y="679.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="167"><tspan x="94.0" dy="0">Relato que no explica la</tspan><tspan x="94.0" dy="17">lesión</tspan></text><text x="68.0" y="717.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="189"><tspan x="68.0" dy="0">«Se golpeó jugando»</tspan></text><rect x="68.0" y="733.5" width="189.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="162.5" y="748.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="177"><tspan x="162.5" dy="0">✓ EN EL CASO</tspan></text><rect x="281.0" y="651.5" width="213.0" height="116.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="301.0" cy="674.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="301.0" y="678.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="301.0" dy="0">2</tspan></text><text x="319.0" y="679.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="167"><tspan x="319.0" dy="0">Lesiones de distinta</tspan><tspan x="319.0" dy="17">antigüedad</tspan></text><text x="293.0" y="717.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="189"><tspan x="293.0" dy="0">Cicatrices antiguas</tspan></text><rect x="293.0" y="733.5" width="189.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="387.5" y="748.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="177"><tspan x="387.5" dy="0">✓ EN EL CASO</tspan></text><rect x="506.0" y="651.5" width="213.0" height="116.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="526.0" cy="674.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="526.0" y="678.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="526.0" dy="0">3</tspan></text><text x="544.0" y="679.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="167"><tspan x="544.0" dy="0">Desnutrición o descuido</tspan></text><text x="518.0" y="705.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="189"><tspan x="518.0" dy="0">Desnutrido</tspan></text><rect x="518.0" y="733.5" width="189.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="612.5" y="748.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="177"><tspan x="612.5" dy="0">✓ EN EL CASO</tspan></text><rect x="731.0" y="651.5" width="213.0" height="116.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="751.0" cy="674.5" r="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="751.0" y="678.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="751.0" dy="0">4</tspan></text><text x="769.0" y="679.5" font-size="12.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="start" data-max="167"><tspan x="769.0" dy="0">Demora en consultar</tspan></text><text x="743.0" y="705.5" font-size="11.5" font-weight="400" font-style="normal" fill="#64748b" text-anchor="start" data-max="189"><tspan x="743.0" dy="0">No se informa</tspan></text><rect x="743.0" y="733.5" width="189.0" height="22.0" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/><text x="837.5" y="748.5" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="177"><tspan x="837.5" dy="0">— NO DESCRITO</tspan></text><text x="56.0" y="794.5" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">Tres señales presentes: obligación de proteger y denunciar.</tspan></text><text x="40.0" y="854.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="864.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="895.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="867.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="895.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Maltrato infantil</tspan></text><text x="435.0" y="895.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Déficit de Calcio</tspan></text><text x="585.0" y="887.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Osteogénesis</tspan><tspan x="585.0" dy="17">imperfecta</tspan></text><text x="735.0" y="895.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Osteomalacia grave</tspan></text><text x="885.0" y="895.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Raquitismo</tspan></text><rect x="40.0" y="918.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="918.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="947.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Sospecha?</tspan></text><text x="285.0" y="939.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: relato poco creíble</tspan><tspan x="285.0" dy="16">+ cicatrices</tspan></text><text x="435.0" y="939.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no explica las</tspan><tspan x="435.0" dy="16">cicatrices</tspan></text><text x="585.0" y="939.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: escleras azules,</tspan><tspan x="585.0" dy="16">fracturas repetidas</tspan></text><text x="735.0" y="947.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es del adulto</tspan></text><text x="885.0" y="939.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: deformidades, no</tspan><tspan x="885.0" dy="16">cicatrices</tspan></text><rect x="40.0" y="864.5" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="992.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1020.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1042.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Atender la lesión y hospitalizar para protegerlo si hay riesgo.</tspan><tspan x="58.0" dy="18">• Registrar todo con detalle; en menores de 2 años, serie ósea completa.</tspan><tspan x="58.0" dy="18">• Denunciar ante la fiscalía, la policía o la DEMUNA: es obligación del personal de salud.</tspan></text><text x="58.0" y="1100.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAP, evaluación del maltrato físico (2015); Ley n.º 30364; Código de los Niños y Adolescentes; MINSA Perú.</tspan></text></svg>