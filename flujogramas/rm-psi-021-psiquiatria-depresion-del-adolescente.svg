<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="965" viewBox="0 0 1000 965" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la depresión del adolescente el ánimo se expresa sobre todo como irritabilidad"><title>En la depresión del adolescente el ánimo se expresa sobre todo como irritabilidad</title><rect x="0.75" y="0.75" width="998.5" height="963.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Psiquiatría · depresión del adolescente</tspan></text><rect x="430.4" y="32.0" width="109.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="485.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="93"><tspan x="485.1" dy="0">PSIQUIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Depresión en niños y adolescentes</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Mismos criterios que el adulto; el ánimo deprimido puede expresarse como irritabilidad.</tspan><tspan x="58.0" dy="17">Quejas somáticas y bajo rendimiento escolar.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué caracteriza al síndrome depresivo en</tspan><tspan x="640.0" dy="16">adolescentes?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE EXPRESA LA DEPRESIÓN SEGÚN LA EDAD</tspan></text><rect x="40.0" y="269.0" width="385.0" height="180.0" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="232.5" y="295.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="365"><tspan x="232.5" dy="0">ADULTO</tspan></text><text x="56.0" y="325.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Ánimo</tspan></text><text x="409.0" y="325.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">Tristeza</tspan></text><line x1="52.0" y1="333.0" x2="413.0" y2="333.0" stroke="#ffffff" stroke-width="1.4"/><text x="56.0" y="351.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Duración del persistente</tspan></text><text x="409.0" y="351.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">2 años</tspan></text><line x1="52.0" y1="359.0" x2="413.0" y2="359.0" stroke="#ffffff" stroke-width="1.4"/><text x="56.0" y="377.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Síntomas somáticos</tspan></text><text x="409.0" y="377.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">Menos llamativos</tspan></text><line x1="52.0" y1="385.0" x2="413.0" y2="385.0" stroke="#ffffff" stroke-width="1.4"/><text x="56.0" y="403.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Sueño y apetito</tspan></text><text x="409.0" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">Insomnio, hiporexia</tspan></text><line x1="52.0" y1="411.0" x2="413.0" y2="411.0" stroke="#ffffff" stroke-width="1.4"/><text x="56.0" y="429.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Episodio mayor</tspan></text><text x="409.0" y="429.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">2 semanas</tspan></text><line x1="52.0" y1="437.0" x2="413.0" y2="437.0" stroke="#ffffff" stroke-width="1.4"/><rect x="575.0" y="269.0" width="385.0" height="180.0" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="767.5" y="295.0" font-size="13" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="365"><tspan x="767.5" dy="0">ADOLESCENTE</tspan></text><text x="591.0" y="325.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Ánimo</tspan></text><text x="944.0" y="325.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">Irritabilidad</tspan></text><line x1="587.0" y1="333.0" x2="948.0" y2="333.0" stroke="#ffffff" stroke-width="1.4"/><text x="591.0" y="351.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Duración del persistente</tspan></text><text x="944.0" y="351.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">1 año</tspan></text><line x1="587.0" y1="359.0" x2="948.0" y2="359.0" stroke="#ffffff" stroke-width="1.4"/><text x="591.0" y="377.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Síntomas somáticos</tspan></text><text x="944.0" y="377.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">Cefalea, dolor abdominal</tspan></text><line x1="587.0" y1="385.0" x2="948.0" y2="385.0" stroke="#ffffff" stroke-width="1.4"/><text x="591.0" y="403.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Sueño y apetito</tspan></text><text x="944.0" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">Hipersomnia, hiperfagia</tspan></text><line x1="587.0" y1="411.0" x2="948.0" y2="411.0" stroke="#ffffff" stroke-width="1.4"/><text x="591.0" y="429.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Episodio mayor</tspan></text><text x="944.0" y="429.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">2 semanas</tspan></text><line x1="587.0" y1="437.0" x2="948.0" y2="437.0" stroke="#ffffff" stroke-width="1.4"/><rect x="434.0" y="315.0" width="132.0" height="88.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="341.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="118"><tspan x="500.0" dy="0">Criterios del</tspan><tspan x="500.0" dy="16">DSM-5-TR con</tspan><tspan x="500.0" dy="16">matices por edad</tspan></text><line x1="429.0" y1="423.0" x2="562.0" y2="423.0" stroke="#0f766e" stroke-width="3"/><polygon points="562.0,428.0 562.0,418.0 571.0,423.0" fill="#0f766e"/><rect x="40.0" y="465.0" width="300.0" height="48.0" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/><text x="56.0" y="494.0" font-size="14" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="0"><tspan x="56.0" dy="0">▼</tspan></text><text x="72.0" y="483.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="260"><tspan x="72.0" dy="0">La irritabilidad sustituye a la tristeza como</tspan><tspan x="72.0" dy="15">síntoma principal</tspan></text><rect x="350.0" y="465.0" width="300.0" height="48.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="366.0" y="494.0" font-size="14" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="366.0" dy="0">▲</tspan></text><text x="382.0" y="483.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="260"><tspan x="382.0" dy="0">El trastorno persistente exige 1 año en lugar</tspan><tspan x="382.0" dy="15">de 2</tspan></text><rect x="660.0" y="465.0" width="300.0" height="48.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="676.0" y="494.0" font-size="14" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="676.0" dy="0">=</tspan></text><text x="692.0" y="483.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="260"><tspan x="692.0" dy="0">El episodio mayor sigue durando 2</tspan><tspan x="692.0" dy="15">semanas</tspan></text><rect x="40.0" y="531.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="557.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Adolescente deprimido = irritable</tspan></text><text x="60.0" y="576.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La verborrea apunta a manía; las alucinaciones, a una forma psicótica.</tspan></text><text x="40.0" y="643.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="653.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="675.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hiperfagia</tspan></text><text x="435.0" y="675.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Insomnio</tspan></text><text x="585.0" y="675.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Alucinaciones</tspan></text><text x="735.0" y="675.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Verborrea</tspan></text><rect x="813.0" y="656.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="675.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Irritabilidad</tspan></text><rect x="40.0" y="690.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="690.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="727.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Rasgo característico?</tspan></text><text x="285.0" y="711.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es más frecuente</tspan><tspan x="285.0" dy="16">que en el adulto, pero</tspan><tspan x="285.0" dy="16">no define el cuadro</tspan></text><text x="435.0" y="719.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es común a todas</tspan><tspan x="435.0" dy="16">las edades</tspan></text><text x="585.0" y="719.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: solo en formas</tspan><tspan x="585.0" dy="16">psicóticas</tspan></text><text x="735.0" y="719.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es propia de manía</tspan><tspan x="735.0" dy="16">o hipomanía</tspan></text><text x="885.0" y="719.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: puede ser el</tspan><tspan x="885.0" dy="16">síntoma principal</tspan></text><rect x="40.0" y="653.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="780.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="808.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="830.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• DSM-5-TR: en niños y adolescentes el ánimo puede ser irritable; episodio mayor de 2 semanas y trastorno persistente de 1 año (en el adulto, 2 años).</tspan><tspan x="58.0" dy="18">• Más frecuentes que en el adulto: hipersomnia e hiperfagia, pero no definen el cuadro. El insomnio es común a todas las edades; alucinaciones solo si</tspan><tspan x="58.0" dy="18">   hay psicosis.</tspan><tspan x="58.0" dy="18">• La verborrea es de la manía o hipomanía: obliga a descartar un trastorno bipolar antes de dar antidepresivo.</tspan><tspan x="58.0" dy="18">• GLAD-PC 2018: tamizar con PHQ-A desde los 12 años, vigilar el riesgo suicida; depresión moderada o grave: psicoterapia y fluoxetina de primera línea.</tspan></text><text x="58.0" y="924.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: GLAD-PC, depresión adolescente en atención primaria (Pediatrics 2018); APA, DSM-5-TR (2022); Kaplan y Sadock, Sinopsis de Psiquiatría, 12.ª ed. (2021).</tspan></text></svg>