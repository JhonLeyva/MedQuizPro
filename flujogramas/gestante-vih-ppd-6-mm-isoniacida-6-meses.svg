<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Gestante de 14 semanas con VIH, asintomática y PPD de más de 5 mm: infección tuberculosa latente, terapia preventiva con isoniazida por 6 meses"><title>Gestante de 14 semanas con VIH, asintomática y PPD de más de 5 mm: infección tuberculosa latente, terapia preventiva con isoniazida por 6 meses</title><rect x="0.75" y="0.75" width="998.5" height="818.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Tuberculosis latente · VIH y embarazo</tspan></text><rect x="423.3" y="32.0" width="136.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="491.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="121"><tspan x="491.7" dy="0">INFECTOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección tuberculosa latente en VIH</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">En personas con VIH un PPD ≥ 5 mm es positivo (≥ 10 mm en la población general).</tspan><tspan x="58.0" dy="17">Sin TB activa (sin síntomas, Rx normal), se da terapia preventiva: isoniazida 6 meses +</tspan><tspan x="58.0" dy="17">piridoxina (segura en el embarazo).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante de 14 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">VIH positivo, asintomática.</tspan><tspan x="640.0" dy="16">Tuberculina &gt; 6 mm.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PPD: ¿CUÁNDO ES POSITIVO Y QUÉ HACER?</tspan></text><rect x="40.0" y="269.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="160"><tspan x="54.0" dy="0">PACIENTE</tspan></text><text x="405.0" y="291.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="350"><tspan x="405.0" dy="0">PPD 5-9 mm</tspan></text><text x="775.0" y="291.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="350"><tspan x="775.0" dy="0">PPD ≥ 10 mm</tspan></text><rect x="40.0" y="309.0" width="174.0" height="57.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="335.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="152"><tspan x="54.0" dy="0">VIH o inmunosuprimido</tspan></text><text x="54.0" y="352.0" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="152"><tspan x="54.0" dy="0">Este caso</tspan></text><rect x="223.0" y="309.0" width="364.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="235.0" y="334.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="346"><tspan x="235.0" dy="0">POSITIVO: ISONIAZIDA 6 MESES</tspan></text><text x="235.0" y="350.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="346"><tspan x="235.0" dy="0">Tras descartar TB activa</tspan></text><rect x="486.2" y="298.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="531.6" y="313.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="531.6" dy="0">◆ ESTE CASO</tspan></text><rect x="593.0" y="309.0" width="364.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="605.0" y="341.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="346"><tspan x="605.0" dy="0">Positivo: isoniazida</tspan></text><rect x="40.0" y="372.0" width="174.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="405.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="152"><tspan x="54.0" dy="0">Población general</tspan></text><rect x="223.0" y="372.0" width="364.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="235.0" y="397.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="346"><tspan x="235.0" dy="0">Negativo</tspan></text><text x="235.0" y="413.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="346"><tspan x="235.0" dy="0">No requiere</tspan></text><rect x="593.0" y="372.0" width="364.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="605.0" y="397.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="346"><tspan x="605.0" dy="0">Positivo: evaluar profilaxis</tspan></text><text x="605.0" y="413.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="346"><tspan x="605.0" dy="0">Contactos, riesgo</tspan></text><text x="44.0" y="451.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Siempre descartar TB activa antes (síntomas y Rx).</tspan></text><text x="40.0" y="499.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="509.0" width="920.0" height="88.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="557.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="557.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Observación</tspan></text><text x="435.0" y="531.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Isoniazida,</tspan><tspan x="435.0" dy="17">Rifampicina,</tspan><tspan x="435.0" dy="17">Pirazinamida,</tspan><tspan x="435.0" dy="17">Etambutol</tspan></text><text x="585.0" y="540.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Isoniazida,</tspan><tspan x="585.0" dy="17">Rifampicina,</tspan><tspan x="585.0" dy="17">Pirazinamida</tspan></text><rect x="663.0" y="512.0" width="144.0" height="82.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="548.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Isoniazida por 6</tspan><tspan x="735.0" dy="17">meses</tspan></text><text x="885.0" y="548.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Rifampicina por 2</tspan><tspan x="885.0" dy="17">meses</tspan></text><rect x="40.0" y="597.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="597.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="626.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Manejo?</tspan></text><text x="285.0" y="618.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: alto riesgo de TB</tspan><tspan x="285.0" dy="16">activa</tspan></text><text x="435.0" y="626.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no tiene TB activa</tspan></text><text x="585.0" y="626.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no tiene TB activa</tspan></text><text x="735.0" y="626.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: terapia preventiva</tspan></text><text x="885.0" y="618.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: esquema no</tspan><tspan x="885.0" dy="16">recomendado aquí</tspan></text><rect x="40.0" y="509.0" width="920.0" height="138.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="671.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="699.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="721.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Descartar TB activa: síntomas, Rx de tórax con protección abdominal.</tspan><tspan x="58.0" dy="18">• Isoniazida 300 mg/día por 6 meses + piridoxina; vigilar hepatotoxicidad (más en el embarazo y el puerperio).</tspan><tspan x="58.0" dy="18">• Continuar el TARGA; el esquema 3HP no se recomienda en el embarazo.</tspan></text><text x="58.0" y="779.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA Perú, NTS de tuberculosis (2023); OMS, TB preventiva (2024).</tspan></text></svg>