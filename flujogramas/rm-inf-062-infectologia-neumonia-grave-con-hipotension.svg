<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1215" viewBox="0 0 1000 1215" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Neumonía con PA 80/55: la primera actitud es la fluidoterapia con cristaloides"><title>Neumonía con PA 80/55: la primera actitud es la fluidoterapia con cristaloides</title><rect x="0.75" y="0.75" width="998.5" height="1213.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Infectología · neumonía grave con hipotensión</tspan></text><rect x="474.8" y="32.0" width="121.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="535.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="106"><tspan x="535.7" dy="0">INFECTOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Sepsis de foco pulmonar</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Neumonía grave en un alcohólico, con hipotensión, taquipnea y fiebre.</tspan><tspan x="58.0" dy="17">Equivale a hipoperfusión inducida por sepsis o shock séptico incipiente.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 54 años, alcohólico</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Fiebre de 38,6 °C, tos purulenta, dolor en hemitórax</tspan><tspan x="640.0" dy="16">derecho.</tspan><tspan x="640.0" dy="16">FR 25, FC 98, PA 80/55, crepitantes en el tercio medio</tspan><tspan x="640.0" dy="16">derecho.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ HACER PRIMERO Y QUÉ DESPUÉS</tspan></text><rect x="40.0" y="301.0" width="920.0" height="70.0" rx="12" fill="#ea580c" stroke="none" stroke-width="1.5"/><rect x="54.0" y="320.0" width="74.0" height="32.0" rx="16" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="91.0" y="341.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ea580c" text-anchor="middle" data-max="64"><tspan x="91.0" dy="0">PASO 1</tspan></text><text x="144.0" y="326.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="800"><tspan x="144.0" dy="0">PA 80/55 con sepsis de foco pulmonar: hipoperfusión</tspan></text><text x="144.0" y="345.0" font-size="12" font-weight="600" font-style="normal" fill="#fff7ed" text-anchor="start" data-max="800"><tspan x="144.0" dy="0">Sí: reanimación inmediata, sin esperar exámenes.</tspan></text><line x1="500.0" y1="373.0" x2="500.0" y2="388.0" stroke="#ea580c" stroke-width="2"/><polygon points="495.0,387.0 505.0,387.0 500.0,395.0" fill="#ea580c"/><rect x="40.0" y="401.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="423.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="170"><tspan x="54.0" dy="0">MOMENTO</tspan></text><text x="412.5" y="423.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="345"><tspan x="412.5" dy="0">Qué se hace</tspan></text><text x="777.5" y="423.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="345"><tspan x="777.5" dy="0">Cuándo</tspan></text><rect x="40.0" y="441.0" width="184.0" height="57.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="467.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Fluidoterapia</tspan></text><text x="54.0" y="484.0" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Cristaloides</tspan></text><rect x="233.0" y="441.0" width="359.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="245.0" y="466.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Cristaloides, al menos 30 mL/kg</tspan></text><text x="245.0" y="482.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Preferentemente balanceados</tspan></text><rect x="598.0" y="441.0" width="359.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="610.0" y="466.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Primeras 3 horas</tspan></text><text x="610.0" y="482.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Reevaluar con lactato y llenado capilar</tspan></text><rect x="856.2" y="430.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="901.6" y="445.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="901.6" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="504.0" width="184.0" height="74.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="530.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Hemocultivo y</tspan><tspan x="54.0" dy="17">antibiótico</tspan></text><text x="54.0" y="564.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Primera hora</tspan></text><rect x="233.0" y="504.0" width="359.0" height="74.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="245.0" y="537.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Hemocultivos y antibiótico empírico</tspan></text><text x="245.0" y="553.5" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">No demorar el antibiótico</tspan></text><rect x="598.0" y="504.0" width="359.0" height="74.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="610.0" y="537.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">En la primera hora</tspan></text><text x="610.0" y="553.5" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Tras tomar los cultivos</tspan></text><rect x="40.0" y="584.0" width="184.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="610.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Vasopresor</tspan></text><text x="54.0" y="627.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Si persiste la hipotensión</tspan></text><rect x="233.0" y="584.0" width="359.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="245.0" y="609.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Noradrenalina</tspan></text><text x="245.0" y="625.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Meta de PAM de 65 mmHg</tspan></text><rect x="598.0" y="584.0" width="359.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="610.0" y="609.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Después del volumen</tspan></text><text x="610.0" y="625.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Y cuidados intensivos si persiste el shock</tspan></text><text x="40.0" y="675.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SEPSIS Y SHOCK SÉPTICO (SEPSIS-3)</tspan></text><rect x="40.0" y="687.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="706.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="164"><tspan x="50.0" dy="0">Estado</tspan></text><text x="230.0" y="706.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="354"><tspan x="230.0" dy="0">Definición</tspan></text><text x="600.0" y="706.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="354"><tspan x="600.0" dy="0">Conducta inicial</tspan></text><rect x="40.0" y="716.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="735.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="164"><tspan x="50.0" dy="0">Sepsis</tspan></text><text x="230.0" y="735.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="354"><tspan x="230.0" dy="0">Infección con disfunción orgánica (aumento de SOFA de 2 o</tspan><tspan x="230.0" dy="15">más)</tspan></text><text x="600.0" y="735.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="354"><tspan x="600.0" dy="0">Cultivos, antibiótico en la primera hora y cristaloides si hay</tspan><tspan x="600.0" dy="15">hipoperfusión</tspan></text><rect x="120.6" y="727.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="166.0" y="742.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="166.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="760.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="779.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="164"><tspan x="50.0" dy="0">Shock séptico</tspan></text><text x="230.0" y="779.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="354"><tspan x="230.0" dy="0">Sepsis con vasopresor para PAM de 65 mmHg o más y lactato</tspan><tspan x="230.0" dy="15">mayor de 2 mmol/L pese al volumen</tspan></text><text x="600.0" y="779.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="354"><tspan x="600.0" dy="0">Cristaloides primero; noradrenalina si persiste; cuidados</tspan><tspan x="600.0" dy="15">intensivos</tspan></text><text x="40.0" y="844.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="854.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="893.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="876.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Evaluar admisión</tspan><tspan x="285.0" dy="17">en cuidados</tspan><tspan x="285.0" dy="17">intensivos</tspan></text><text x="435.0" y="885.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Solicitar</tspan><tspan x="435.0" dy="17">hemocultivo</tspan></text><rect x="513.0" y="857.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="893.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Fluidoterapia</tspan></text><text x="735.0" y="885.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Metamizol 1 g IM</tspan><tspan x="735.0" dy="17">stat</tspan></text><text x="885.0" y="876.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Apoyo vasopresor</tspan><tspan x="885.0" dy="17">por bomba de</tspan><tspan x="885.0" dy="17">infusión</tspan></text><rect x="40.0" y="925.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="925.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="962.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Primera actitud?</tspan></text><text x="285.0" y="954.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: se solicita si</tspan><tspan x="285.0" dy="16">persiste el shock</tspan></text><text x="435.0" y="954.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: se toma sin</tspan><tspan x="435.0" dy="16">demorar el antibiótico</tspan></text><text x="585.0" y="946.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: reanimar con</tspan><tspan x="585.0" dy="16">volumen antes del</tspan><tspan x="585.0" dy="16">vasopresor</tspan></text><text x="735.0" y="962.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: solo trata la fiebre</tspan></text><text x="885.0" y="954.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: el vasopresor va</tspan><tspan x="885.0" dy="16">tras el volumen</tspan></text><rect x="40.0" y="854.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1015.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1043.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1065.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Surviving Sepsis 2021: cristaloides desde el inicio, al menos 30 mL/kg en las primeras 3 horas si hay hipoperfusión, preferentemente balanceados;</tspan><tspan x="58.0" dy="18">   reevaluar con llenado capilar y lactato.</tspan><tspan x="58.0" dy="18">• Vasopresor (noradrenalina primera línea) si la hipotensión persiste tras el volumen, con meta de PAM de 65 mmHg.</tspan><tspan x="58.0" dy="18">• Hemocultivos y antibiótico empírico en la primera hora, sin demorar el antibiótico; cuidados intensivos si persiste el shock.</tspan><tspan x="58.0" dy="18">• Alcohólico con neumonía: pensar en Klebsiella, neumococo y anaerobios por aspiración; dar tiamina.</tspan></text><text x="58.0" y="1159.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Evans L et al., Surviving Sepsis Campaign 2021, Crit Care Med 2021;49:e1063; Metlay JP et al., ATS/IDSA, Diagnosis and treatment of adults with community-acquired</tspan><tspan x="58.0" dy="15">pneumonia, Am J Respir Crit Care Med 2019;200:e45-e67; Harrison Principios de Medicina Interna, 21.ª ed. (2022)</tspan></text></svg>