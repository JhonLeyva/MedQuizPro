<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1083" viewBox="0 0 1000 1083" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Meningococo sin mejoría con penicilina a las 48 horas: ceftriaxona"><title>Meningococo sin mejoría con penicilina a las 48 horas: ceftriaxona</title><rect x="0.75" y="0.75" width="998.5" height="1081.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Infectología · meningitis meningocócica</tspan></text><rect x="436.5" y="32.0" width="121.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="497.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="106"><tspan x="497.4" dy="0">INFECTOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Neisseria meningitidis</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Diplococo gramnegativo: meningitis con petequias o púrpura y riesgo de sepsis fulminante</tspan><tspan x="58.0" dy="17">(Waterhouse-Friderichsen).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 25 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Meningoencefalitis hospitalizada.</tspan><tspan x="640.0" dy="16">Penicilina G sódica 2 millones cada 4 horas por 48</tspan><tspan x="640.0" dy="16">horas sin mejoría; el cultivo muestra N. meningitidis.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUIÉN HACE QUÉ, EN ORDEN</tspan></text><rect x="40.0" y="285.0" width="920.0" height="95.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="285.0" width="108.0" height="95.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="336.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Emergencia</tspan></text><rect x="40.0" y="380.0" width="920.0" height="95.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="380.0" width="108.0" height="95.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="431.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Laboratorio</tspan></text><rect x="40.0" y="475.0" width="920.0" height="95.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="475.0" width="108.0" height="95.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="526.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Infectología</tspan></text><rect x="40.0" y="570.0" width="920.0" height="95.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="570.0" width="108.0" height="95.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="621.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Salud pública</tspan></text><line x1="348.0" y1="324.5" x2="355.0" y2="324.5" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="324.5" x2="355.0" y2="427.5" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="427.5" x2="353.0" y2="427.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="353.0,432.5 353.0,422.5 362.0,427.5" fill="#0f766e"/><line x1="552.0" y1="427.5" x2="559.0" y2="427.5" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="427.5" x2="559.0" y2="514.5" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="514.5" x2="557.0" y2="514.5" stroke="#ea580c" stroke-width="2.2"/><polygon points="557.0,519.5 557.0,509.5 566.0,514.5" fill="#ea580c"/><line x1="756.0" y1="514.5" x2="763.0" y2="514.5" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="514.5" x2="763.0" y2="617.5" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="617.5" x2="761.0" y2="617.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="761.0,622.5 761.0,612.5 770.0,617.5" fill="#0f766e"/><rect x="158.0" y="298.0" width="190.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="314.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Sin mejoría con penicilina</tspan></text><text x="168.0" y="331.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">48 horas de penicilina G sódica.</tspan></text><circle cx="158.0" cy="298.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="302.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="362.0" y="393.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="372.0" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Cultivo: N. meningitidis</tspan></text><text x="372.0" y="426.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Diplococo gramnegativo;</tspan><tspan x="372.0" dy="14.5">antibiograma.</tspan></text><circle cx="362.0" cy="393.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="362.0" y="397.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="362.0" dy="0">2</tspan></text><rect x="566.0" y="488.0" width="190.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="576.0" y="504.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Ceftriaxona 2 g c/12 h</tspan></text><text x="576.0" y="521.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Por 5 a 7 días; llega bien al LCR.</tspan></text><circle cx="566.0" cy="488.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="566.0" y="492.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="566.0" dy="0">3</tspan></text><rect x="770.0" y="583.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="780.0" y="599.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Profilaxis de contactos</tspan></text><text x="780.0" y="616.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Ciprofloxacino, rifampicina o</tspan><tspan x="780.0" dy="14.5">ceftriaxona; notificar y vacunar.</tspan></text><circle cx="770.0" cy="583.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="770.0" y="587.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="770.0" dy="0">4</tspan></text><rect x="40.0" y="683.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="709.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Meningococo con mala evolución con penicilina = ceftriaxona</tspan></text><text x="60.0" y="728.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Contactos cercanos con profilaxis; vigilar petequias, púrpura y shock.</tspan></text><text x="40.0" y="795.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="805.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="827.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="827.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Cefuroxima</tspan></text><text x="435.0" y="827.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Ampicilina-sulbactam</tspan></text><text x="585.0" y="827.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Cefoxitina</tspan></text><rect x="663.0" y="808.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="827.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ceftriaxona</tspan></text><text x="885.0" y="827.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Aztreonam</tspan></text><rect x="40.0" y="842.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="842.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="871.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Antibiótico?</tspan></text><text x="285.0" y="863.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: peor penetración al</tspan><tspan x="285.0" dy="16">LCR</tspan></text><text x="435.0" y="863.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: sin concentración</tspan><tspan x="435.0" dy="16">fiable en el SNC</tspan></text><text x="585.0" y="863.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sin concentración</tspan><tspan x="585.0" dy="16">fiable en el SNC</tspan></text><text x="735.0" y="863.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: cefalosporina de</tspan><tspan x="735.0" dy="16">tercera generación</tspan></text><text x="885.0" y="863.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no es de primera</tspan><tspan x="885.0" dy="16">línea</tspan></text><rect x="40.0" y="805.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="916.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="944.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="966.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Ceftriaxona 2 g cada 12 horas: atraviesa bien la barrera hematoencefálica y cubre cepas con menor sensibilidad a la penicilina; duración de 5 a 7 días.</tspan><tspan x="58.0" dy="18">• Cefuroxima, cefoxitina y ampicilina-sulbactam no alcanzan concentraciones fiables en el sistema nervioso central; aztreonam no es de primera línea.</tspan><tspan x="58.0" dy="18">• Empírico: ceftriaxona con vancomicina (neumococo resistente) y ampicilina si hay más de 50 años o inmunodepresión (Listeria).</tspan><tspan x="58.0" dy="18">• Contactos cercanos: profilaxis con ciprofloxacino, rifampicina o ceftriaxona, y vacunación.</tspan></text><text x="58.0" y="1042.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Tunkel AR et al., IDSA (Clin Infect Dis 2004;39:1267-1284); van de Beek D et al., ESCMID (Clin Microbiol Infect 2016;22 Suppl 3); NICE NG240 (2024).</tspan></text></svg>