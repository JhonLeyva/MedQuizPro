<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="965" viewBox="0 0 1000 965" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El zinc está indicado en la diarrea aguda: 20 mg al día por 10 a 14 días en el niño de 6 meses a 5 años"><title>El zinc está indicado en la diarrea aguda: 20 mg al día por 10 a 14 días en el niño de 6 meses a 5 años</title><rect x="0.75" y="0.75" width="998.5" height="963.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · zinc en la diarrea aguda</tspan></text><rect x="404.4" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="453.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="453.4" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Zinc y diarrea</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El zinc repara la mucosa intestinal y sostiene la inmunidad celular; la diarrea genera</tspan><tspan x="58.0" dy="17">pérdidas.</tspan><tspan x="58.0" dy="17">OMS y UNICEF: sales de rehidratación de baja osmolaridad y zinc.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 4 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de indicación.</tspan><tspan x="640.0" dy="16">¿En cuál de estas enfermedades se administra zinc?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CUÁNDO Y CUÁNTO ZINC SE DA</tspan></text><rect x="40.0" y="269.0" width="170.0" height="110.0" rx="16" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="125.0" y="295.0" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="150"><tspan x="125.0" dy="0">PESO DEL CASO</tspan></text><text x="125.0" y="331.0" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">4 años</tspan></text><text x="125.0" y="353.0" font-size="11" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="146"><tspan x="125.0" dy="0">Diarrea aguda</tspan></text><line x1="214.0" y1="324.0" x2="229.0" y2="324.0" stroke="#0f766e" stroke-width="2"/><polygon points="228.0,319.0 228.0,329.0 236.0,324.0" fill="#0f766e"/><rect x="240.0" y="269.0" width="213.3" height="110.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="346.7" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="197"><tspan x="346.7" dy="0">NIÑO DE 6 MESES A 5 AÑOS</tspan></text><text x="346.7" y="325.0" font-size="22" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="197"><tspan x="346.7" dy="0">20 mg al día</tspan></text><text x="346.7" y="347.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="193"><tspan x="346.7" dy="0">Por 10 a 14 días, desde el inicio</tspan><tspan x="346.7" dy="15">de la diarrea</tspan></text><text x="473.3" y="335.0" font-size="30" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="40"><tspan x="473.3" dy="0">×</tspan></text><rect x="493.3" y="269.0" width="213.3" height="110.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="600.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="197"><tspan x="600.0" dy="0">MENOR DE 6 MESES</tspan></text><text x="600.0" y="325.0" font-size="22" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="197"><tspan x="600.0" dy="0">10 mg al día</tspan></text><text x="600.0" y="347.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="193"><tspan x="600.0" dy="0">También por 10 a 14 días</tspan></text><text x="726.7" y="335.0" font-size="30" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="40"><tspan x="726.7" dy="0">=</tspan></text><rect x="746.7" y="269.0" width="213.3" height="110.0" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="853.3" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="197"><tspan x="853.3" dy="0">SIEMPRE</tspan></text><text x="853.3" y="325.0" font-size="22" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="197"><tspan x="853.3" dy="0">Con SRO</tspan></text><text x="853.3" y="347.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="193"><tspan x="853.3" dy="0">El zinc no sustituye a la</tspan><tspan x="853.3" dy="15">rehidratación</tspan></text><rect x="793.2" y="368.0" width="120.4" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="853.3" y="383.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="853.3" dy="0">◆ DOSIS DEL CASO</tspan></text><text x="44.0" y="415.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="44.0" dy="0">CADA ALTERNATIVA CONTRA EL CÁLCULO</tspan></text><rect x="40.0" y="425.0" width="176.0" height="73.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="128.0" y="443.0" font-size="9.5" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="160"><tspan x="128.0" dy="0">✓ COINCIDE</tspan></text><text x="128.0" y="461.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="128.0" dy="0">Diarrea aguda</tspan></text><text x="128.0" y="478.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="128.0" dy="0">Indicado: acorta el episodio</tspan></text><rect x="226.0" y="425.0" width="176.0" height="73.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="314.0" y="443.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="160"><tspan x="314.0" dy="0">✗ NO</tspan></text><text x="314.0" y="461.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="314.0" dy="0">Neumonía</tspan></text><text x="314.0" y="478.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="314.0" dy="0">No es tratamiento estándar</tspan></text><rect x="412.0" y="425.0" width="176.0" height="73.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="443.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="160"><tspan x="500.0" dy="0">✗ NO</tspan></text><text x="500.0" y="461.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="500.0" dy="0">Otitis media aguda</tspan></text><text x="500.0" y="478.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="500.0" dy="0">Sin efecto en la evolución</tspan></text><rect x="598.0" y="425.0" width="176.0" height="73.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="686.0" y="443.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="160"><tspan x="686.0" dy="0">✗ NO</tspan></text><text x="686.0" y="461.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="686.0" dy="0">Infección urinaria</tspan></text><text x="686.0" y="478.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="686.0" dy="0">Sin efecto en la evolución</tspan></text><rect x="784.0" y="425.0" width="176.0" height="73.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="872.0" y="443.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="160"><tspan x="872.0" dy="0">✗ NO</tspan></text><text x="872.0" y="461.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="872.0" dy="0">Oxiuriasis</tspan></text><text x="872.0" y="478.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="872.0" dy="0">Requiere antiparasitarios</tspan></text><rect x="40.0" y="516.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="542.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Zinc en la diarrea aguda: 20 mg al día por 10-14 días</tspan></text><text x="60.0" y="561.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Junto con sales de rehidratación oral y alimentación continuada.</tspan></text><text x="40.0" y="628.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="638.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="660.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="660.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Otitis media aguda</tspan></text><text x="435.0" y="660.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Infección urinaria</tspan></text><rect x="513.0" y="641.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="660.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Diarrea aguda</tspan></text><text x="735.0" y="660.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Neumonía</tspan></text><text x="885.0" y="660.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Oxiuriasis</tspan></text><rect x="40.0" y="675.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="675.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="712.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Indicación de zinc?</tspan></text><text x="285.0" y="696.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: se trata con</tspan><tspan x="285.0" dy="16">antibiótico si</tspan><tspan x="285.0" dy="16">corresponde</tspan></text><text x="435.0" y="696.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: se trata con</tspan><tspan x="435.0" dy="16">antibiótico según el</tspan><tspan x="435.0" dy="16">cultivo</tspan></text><text x="585.0" y="712.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: acorta el episodio</tspan></text><text x="735.0" y="696.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: su utilidad es</tspan><tspan x="735.0" dy="16">limitada, no es</tspan><tspan x="735.0" dy="16">tratamiento estándar</tspan></text><text x="885.0" y="704.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: requiere</tspan><tspan x="885.0" dy="16">antiparasitarios</tspan></text><rect x="40.0" y="638.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="765.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="793.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="815.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Dosis OMS: 20 mg al día por 10 a 14 días entre 6 meses y 5 años (10 mg en menores de 6 meses), desde el diagnóstico de la diarrea.</tspan><tspan x="58.0" dy="18">• Reduce la duración y la gravedad del episodio y el riesgo de recurrencia en 2-3 meses; mayor beneficio en desnutridos y diarrea persistente (Cochrane</tspan><tspan x="58.0" dy="18">   2016).</tspan><tspan x="58.0" dy="18">• No sustituye a la rehidratación, que es la base del manejo. Efecto adverso: vómitos.</tspan><tspan x="58.0" dy="18">• No modifica la evolución de la otitis, la infección urinaria ni la oxiuriasis; en la neumonía no forma parte del tratamiento estándar.</tspan></text><text x="58.0" y="909.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Cochrane, Oral zinc for treating diarrhoea in children (Cochrane Database Syst Rev 2016;12:CD005436); ESPGHAN/ESPID, Gastroenteritis aguda en niños (J Pediatr</tspan><tspan x="58.0" dy="15">Gastroenterol Nutr 2014;59:132-52); Zinc supplementation for acute and persistent watery diarrhoea (J Glob Health 2024;14:04212); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>