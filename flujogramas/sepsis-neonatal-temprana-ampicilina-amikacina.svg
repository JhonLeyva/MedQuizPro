<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1285" viewBox="0 0 1000 1285" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Neonato de 3 días hijo de RPM de 72 horas con taquipnea, leucocitosis e infiltrado bilateral: ampicilina + amikacina"><title>Neonato de 3 días hijo de RPM de 72 horas con taquipnea, leucocitosis e infiltrado bilateral: ampicilina + amikacina</title><rect x="0.75" y="0.75" width="998.5" height="1284.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Infecciones neonatales · sepsis neonatal</tspan></text><rect x="440.6" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="497.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="497.1" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Sepsis neonatal temprana</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Aparece en las primeras 72 horas: gérmenes del canal del parto.</tspan><tspan x="58.0" dy="17">Estreptococo del grupo B, E. coli y Listeria; la RPM &gt; 18 h es el principal factor de riesgo.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Neonato a término de 3 días</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Madre primigesta con RPM de 72 horas; Apgar 8, peso</tspan><tspan x="640.0" dy="16">normal.</tspan><tspan x="640.0" dy="16">FR 80, FC 180, irritable; leucocitosis con desviación</tspan><tspan x="640.0" dy="16">izquierda; infiltrado bilateral.</tspan></text><line x1="640.0" y1="237.0" x2="670.0" y2="237.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#94a3b8"/><line x1="500.0" y1="381.0" x2="500.0" y2="411.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="411.0" x2="733.5" y2="411.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="411.0" x2="266.5" y2="440.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,439.0 271.5,439.0 266.5,447.0" fill="#94a3b8"/><line x1="733.5" y1="411.0" x2="733.5" y2="440.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,439.0 738.5,439.0 733.5,447.0" fill="#94a3b8"/><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#0f766e"/><line x1="500.0" y1="381.0" x2="500.0" y2="411.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="411.0" x2="500.0" y2="411.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="411.0" x2="266.5" y2="440.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,439.0 271.5,439.0 266.5,447.0" fill="#0f766e"/><rect x="188.2" y="420.0" width="156.6" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="432.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">≤ 72 horas: día 3 (este caso)</tspan></text><rect x="699.9" y="420.0" width="67.2" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="432.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">&gt; 72 horas</tspan></text><polygon points="240.0,352.0 266.0,323.0 734.0,323.0 760.0,352.0 734.0,381.0 266.0,381.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="352.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="357.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="356.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Neonato con signos de sepsis: ¿edad de inicio?</tspan></text><rect x="40.0" y="447.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="475.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">SEPSIS TEMPRANA</tspan></text><text x="266.5" y="498.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Ampicilina + amikacina</tspan><tspan x="266.5" dy="17">Hemocultivo antes</tspan></text><rect x="507.0" y="447.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="483.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Sepsis tardía</tspan></text><text x="733.5" y="506.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Vancomicina + aminoglucósido o cefalosporina</tspan></text><text x="40.0" y="577.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="589.5" width="920.0" height="369.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="603.5" width="280.2" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="196.1" y="623.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="196.1" dy="0">SEPSIS NEONATAL SEGÚN EL INICIO</tspan></text><text x="352.2" y="623.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="590"><tspan x="352.2" dy="0">Define los gérmenes probables y el antibiótico empírico.</tspan></text><rect x="56.0" y="663.5" width="438.0" height="144.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="57.2" y="664.7" width="435.6" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="275.0" y="691.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="422"><tspan x="275.0" dy="0">≤ 72 HORAS</tspan></text><text x="275.0" y="711.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="414"><tspan x="275.0" dy="0">Temprana</tspan></text><circle cx="72.0" cy="736.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="82.0" y="740.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="400"><tspan x="82.0" dy="0">Gérmenes del canal del parto</tspan></text><circle cx="72.0" cy="759.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="82.0" y="763.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="400"><tspan x="82.0" dy="0">SGB, E. coli, Listeria</tspan></text><circle cx="72.0" cy="782.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="82.0" y="786.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="400"><tspan x="82.0" dy="0">Ampicilina + aminoglucósido</tspan></text><rect x="229.6" y="652.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="275.0" y="667.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="275.0" dy="0">◆ ESTE CASO</tspan></text><rect x="506.0" y="663.5" width="438.0" height="144.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="506.6" y="664.1" width="436.8" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="725.0" y="691.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="422"><tspan x="725.0" dy="0">&gt; 72 HORAS</tspan></text><text x="725.0" y="711.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="414"><tspan x="725.0" dy="0">Tardía</tspan></text><circle cx="522.0" cy="736.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="532.0" y="740.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="400"><tspan x="532.0" dy="0">Gérmenes del hospital o la comunidad</tspan></text><circle cx="522.0" cy="759.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="532.0" y="763.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="400"><tspan x="532.0" dy="0">Estafilococo, gramnegativos</tspan></text><circle cx="522.0" cy="782.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="532.0" y="786.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="400"><tspan x="532.0" dy="0">Vancomicina + amikacina</tspan></text><text x="56.0" y="837.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="846.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="861.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="861.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Inicio al tercer día con RPM de 72 horas</tspan></text><rect x="56.0" y="868.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="883.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="883.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Taquipnea, taquicardia, leucocitosis e infiltrado: neumonía connatal</tspan></text><rect x="56.0" y="905.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="928.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Hemocultivo y ampicilina + amikacina EV; ajustar según cultivo.</tspan></text><text x="40.0" y="998.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1008.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1039.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1031.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Ceftriaxona +</tspan><tspan x="285.0" dy="17">cloranfenicol</tspan></text><text x="435.0" y="1031.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Ceftriaxona +</tspan><tspan x="435.0" dy="17">ampicilina</tspan></text><text x="585.0" y="1031.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Ampicilina +</tspan><tspan x="585.0" dy="17">cloranfenicol</tspan></text><rect x="663.0" y="1011.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="1031.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ampicilina +</tspan><tspan x="735.0" dy="17">amikacina</tspan></text><text x="885.0" y="1031.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Vancomicina +</tspan><tspan x="885.0" dy="17">meropenem</tspan></text><rect x="40.0" y="1062.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="1062.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1091.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Esquema inicial?</tspan></text><text x="285.0" y="1083.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: cloranfenicol tóxico</tspan><tspan x="285.0" dy="16">(gris)</tspan></text><text x="435.0" y="1083.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: ceftriaxona</tspan><tspan x="435.0" dy="16">contraindicada en RN</tspan></text><text x="585.0" y="1091.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: cloranfenicol tóxico</tspan></text><text x="735.0" y="1083.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: cubre SGB, Listeria</tspan><tspan x="735.0" dy="16">y gramnegativos</tspan></text><text x="885.0" y="1083.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: reserva para tardía</tspan><tspan x="885.0" dy="16">o resistente</tspan></text><rect x="40.0" y="1008.5" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1136.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1164.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1186.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Tomar hemocultivo y empezar ampicilina + aminoglucósido (amikacina o gentamicina).</tspan><tspan x="58.0" dy="18">• Si hay meningitis o gramnegativos resistentes: cefotaxima (no ceftriaxona en neonatos: desplaza bilirrubina y precipita con calcio).</tspan><tspan x="58.0" dy="18">• Sepsis tardía (&gt; 72 h, intrahospitalaria): cubrir estafilococo (vancomicina) y gramnegativos.</tspan></text><text x="58.0" y="1244.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAP, manejo de sepsis neonatal de inicio temprano (2018, act. 2024); MINSA Perú, guía de sepsis neonatal; Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>