<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1120" viewBox="0 0 1000 1120" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Ciclos irregulares, sofocos y última regla hace 2 meses: perimenopausia (transición menopáusica)"><title>Ciclos irregulares, sofocos y última regla hace 2 meses: perimenopausia (transición menopáusica)</title><rect x="0.75" y="0.75" width="998.5" height="1118.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ginecología · climaterio</tspan></text><rect x="341.5" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="421.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="421.2" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Transición menopáusica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La menopausia es el cese definitivo de la regla: se diagnostica tras 12 meses de</tspan><tspan x="58.0" dy="17">amenorrea.</tspan><tspan x="58.0" dy="17">La perimenopausia empieza con la irregularidad del ciclo y termina 12 meses después de la</tspan><tspan x="58.0" dy="17">última regla.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 42 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Cinco meses de ciclos irregulares, sofocos, sudoración</tspan><tspan x="640.0" dy="16">nocturna y cambios de carácter.</tspan><tspan x="640.0" dy="16">Última regla hace 2 meses; beta negativa.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ETAPAS SEGÚN LOS MESES DESDE LA ÚLTIMA REGLA</tspan></text><line x1="290.0" y1="307.0" x2="290.0" y2="425.0" stroke="#e2e8f0" stroke-width="1"/><text x="290.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="290.0" dy="0">-6</tspan></text><line x1="355.0" y1="307.0" x2="355.0" y2="425.0" stroke="#e2e8f0" stroke-width="1"/><text x="355.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="355.0" dy="0">-4</tspan></text><line x1="420.0" y1="307.0" x2="420.0" y2="425.0" stroke="#e2e8f0" stroke-width="1"/><text x="420.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="420.0" dy="0">-2</tspan></text><line x1="485.0" y1="307.0" x2="485.0" y2="425.0" stroke="#e2e8f0" stroke-width="1"/><text x="485.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="485.0" dy="0">0</tspan></text><line x1="550.0" y1="307.0" x2="550.0" y2="425.0" stroke="#e2e8f0" stroke-width="1"/><text x="550.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="550.0" dy="0">2</tspan></text><line x1="615.0" y1="307.0" x2="615.0" y2="425.0" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="615.0" dy="0">4</tspan></text><line x1="680.0" y1="307.0" x2="680.0" y2="425.0" stroke="#e2e8f0" stroke-width="1"/><text x="680.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="680.0" dy="0">6</tspan></text><line x1="745.0" y1="307.0" x2="745.0" y2="425.0" stroke="#e2e8f0" stroke-width="1"/><text x="745.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="745.0" dy="0">8</tspan></text><line x1="810.0" y1="307.0" x2="810.0" y2="425.0" stroke="#e2e8f0" stroke-width="1"/><text x="810.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="810.0" dy="0">10</tspan></text><line x1="875.0" y1="307.0" x2="875.0" y2="425.0" stroke="#e2e8f0" stroke-width="1"/><text x="875.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="875.0" dy="0">12</tspan></text><line x1="940.0" y1="307.0" x2="940.0" y2="425.0" stroke="#e2e8f0" stroke-width="1"/><text x="940.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="940.0" dy="0">14</tspan></text><text x="940.0" y="289.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="end" data-max="60"><tspan x="940.0" dy="0">meses</tspan></text><rect x="40.0" y="311.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="327.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Transición temprana</tspan></text><text x="48.0" y="342.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Ciclos que varían 7 días o más</tspan></text><rect x="290.0" y="319.0" width="130.0" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="365.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Transición tardía (este caso)</tspan></text><text x="48.0" y="380.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Amenorrea de 60 días o más; síntomas</tspan></text><rect x="420.0" y="357.0" width="455.0" height="22.0" rx="6" fill="#ea580c" stroke="none" stroke-width="1.5"/><rect x="40.0" y="387.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="403.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Menopausia confirmada</tspan></text><text x="48.0" y="418.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Tras 12 meses de amenorrea</tspan></text><rect x="875.0" y="395.0" width="65.0" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><line x1="550.0" y1="309.0" x2="550.0" y2="431.0" stroke="#b91c1c" stroke-width="2.6"/><rect x="468.4" y="431.0" width="163.2" height="22.0" rx="11" fill="#b91c1c" stroke="none" stroke-width="1.5"/><text x="550.0" y="446.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="550.0" dy="0">Última regla hace 2 meses</tspan></text><rect x="40.0" y="477.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="503.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Irregularidad + sofocos + menos de 12 meses de amenorrea = perimenopausia</tspan></text><text x="60.0" y="522.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Menopausia exige 12 meses sin regla; posmenopausia es el periodo posterior.</tspan></text><text x="40.0" y="583.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ETAPAS DEL CLIMATERIO SEGÚN STRAW+10</tspan></text><rect x="40.0" y="595.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="614.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Etapa</tspan></text><text x="290.0" y="614.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="664"><tspan x="290.0" dy="0">Criterio</tspan></text><rect x="40.0" y="624.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="643.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Transición temprana</tspan></text><text x="290.0" y="643.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="664"><tspan x="290.0" dy="0">Variación de 7 días o más en la duración del ciclo</tspan></text><rect x="40.0" y="653.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="672.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Transición tardía</tspan></text><text x="290.0" y="672.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="664"><tspan x="290.0" dy="0">Amenorrea de 60 días o más</tspan></text><rect x="180.6" y="656.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="226.0" y="671.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="226.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="682.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="701.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Menopausia</tspan></text><text x="290.0" y="701.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="664"><tspan x="290.0" dy="0">12 meses consecutivos de amenorrea sin otra causa</tspan></text><rect x="40.0" y="711.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="730.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Posmenopausia</tspan></text><text x="290.0" y="730.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="664"><tspan x="290.0" dy="0">Periodo posterior a la menopausia</tspan></text><text x="40.0" y="780.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="790.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="812.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="793.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="812.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Perimenopausia</tspan></text><text x="435.0" y="812.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hipotiroidismo</tspan></text><text x="585.0" y="812.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Menopausia</tspan></text><text x="735.0" y="812.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Posmenopausia</tspan></text><text x="885.0" y="812.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hipertiroidismo</tspan></text><rect x="40.0" y="827.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="827.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="864.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico probable?</tspan></text><text x="285.0" y="848.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: irregularidad,</tspan><tspan x="285.0" dy="16">sofocos y menos de 12</tspan><tspan x="285.0" dy="16">meses sin regla</tspan></text><text x="435.0" y="848.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: se confirman con</tspan><tspan x="435.0" dy="16">TSH y no explican bien</tspan><tspan x="435.0" dy="16">los sofocos</tspan></text><text x="585.0" y="856.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no hay 12 meses</tspan><tspan x="585.0" dy="16">de amenorrea</tspan></text><text x="735.0" y="848.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es el periodo</tspan><tspan x="735.0" dy="16">posterior a la</tspan><tspan x="735.0" dy="16">menopausia</tspan></text><text x="885.0" y="848.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: se confirman con</tspan><tspan x="885.0" dy="16">TSH y no explican bien</tspan><tspan x="885.0" dy="16">los sofocos</tspan></text><rect x="40.0" y="790.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="917.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="945.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="967.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• STRAW+10: transición temprana (ciclos que varían 7 días o más) y tardía (amenorrea de 60 días o más); con fluctuaciones hormonales, síntomas</tspan><tspan x="58.0" dy="18">   vasomotores y alteraciones del sueño.</tspan><tspan x="58.0" dy="18">• No cumple menopausia (12 meses sin regla) ni posmenopausia (periodo posterior); la edad media de la menopausia es 51 años.</tspan><tspan x="58.0" dy="18">• El hipo e hipertiroidismo causan irregularidad pero se confirman con TSH y no explican bien los sofocos.</tspan><tspan x="58.0" dy="18">• Alerta: en la perimenopausia aún puede haber ovulación y se requiere anticoncepción; terapia hormonal para síntomas vasomotores moderados a</tspan><tspan x="58.0" dy="18">   severos en menores de 60 años o con menos de 10 años de menopausia.</tspan></text><text x="58.0" y="1079.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: STRAW+10, Harlow et al. (Menopause 2012); NAMS, declaración de posición sobre terapia hormonal (Menopause 2022); Williams Obstetricia, 26.ª ed. (2022).</tspan></text></svg>