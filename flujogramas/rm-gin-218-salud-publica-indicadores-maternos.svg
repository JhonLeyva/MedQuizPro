<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1266" viewBox="0 0 1000 1266" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La razón de mortalidad materna se expresa por 100 000 nacidos vivos"><title>La razón de mortalidad materna se expresa por 100 000 nacidos vivos</title><rect x="0.75" y="0.75" width="998.5" height="1264.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Salud pública · indicadores maternos</tspan></text><rect x="420.8" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="500.5" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Razón de mortalidad materna</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Principal indicador de salud materna.</tspan><tspan x="58.0" dy="17">Muertes maternas de un lugar y periodo, entre los nacidos vivos del mismo periodo.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de indicadores</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Por cuánto se multiplica el cociente de muertes</tspan><tspan x="640.0" dy="16">maternas entre nacidos vivos?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SE PIENSA EN ESTE ORDEN</tspan></text><rect x="40.0" y="269.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="314.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="342.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">1</tspan></text><rect x="124.0" y="269.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="297.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Qué se divide?</tspan></text><rect x="136.0" y="311.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="331.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Muertes maternas entre nacidos vivos del mismo periodo</tspan></text><text x="152.0" y="350.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Generalmente un año, en un lugar determinado.</tspan></text><line x1="77.0" y1="372.0" x2="77.0" y2="391.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,390.0 82.0,390.0 77.0,398.0" fill="#0f766e"/><text x="134.0" y="390.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="400.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="445.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="473.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">2</tspan></text><rect x="124.0" y="400.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="428.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Por cuánto se multiplica?</tspan></text><rect x="136.0" y="442.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="462.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Por 100 000 nacidos vivos</tspan></text><text x="152.0" y="481.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">1000 y 10 000 se usan en la mortalidad infantil o la natalidad.</tspan></text><line x1="77.0" y1="503.0" x2="77.0" y2="522.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,521.0 82.0,521.0 77.0,529.0" fill="#0f766e"/><text x="134.0" y="521.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="531.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="576.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="604.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">3</tspan></text><rect x="124.0" y="531.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="559.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Qué valor y meta hay?</tspan></text><rect x="136.0" y="573.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="593.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">223 por 100 000 en 2020; ODS 3.1: menos de 70 para 2030</tspan></text><text x="152.0" y="612.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Indicador de inequidad y capacidad resolutiva del sistema de salud.</tspan></text><rect x="40.0" y="652.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="678.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Razón de mortalidad materna = por 100 000 nacidos vivos</tspan></text><text x="60.0" y="697.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Los multiplicadores de 1000 y 10 000 son de otros indicadores.</tspan></text><text x="40.0" y="758.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">INDICADORES DE MORTALIDAD MATERNA</tspan></text><rect x="40.0" y="770.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="789.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Indicador</tspan></text><text x="220.0" y="789.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Numerador</tspan></text><text x="595.0" y="789.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Denominador</tspan></text><rect x="40.0" y="799.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="818.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Razón</tspan></text><text x="220.0" y="818.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Muertes maternas</tspan></text><text x="595.0" y="818.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Nacidos vivos x 100 000</tspan></text><rect x="110.6" y="802.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="156.0" y="817.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="156.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="828.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="847.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Tasa</tspan></text><text x="220.0" y="847.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Muertes maternas</tspan></text><text x="595.0" y="847.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Mujeres en edad fértil</tspan></text><rect x="40.0" y="857.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="876.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Proporción</tspan></text><text x="220.0" y="876.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Muertes maternas</tspan></text><text x="595.0" y="876.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Defunciones de mujeres en edad reproductiva</tspan></text><text x="40.0" y="926.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="936.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="958.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="958.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">50 000</tspan></text><text x="435.0" y="958.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">10 000</tspan></text><text x="585.0" y="958.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">150 000</tspan></text><text x="735.0" y="958.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">1000</tspan></text><rect x="813.0" y="939.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="958.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">100 000</tspan></text><rect x="40.0" y="973.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="973.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1010.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Multiplicador correcto?</tspan></text><text x="285.0" y="994.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no es el</tspan><tspan x="285.0" dy="16">multiplicador de la</tspan><tspan x="285.0" dy="16">razón</tspan></text><text x="435.0" y="994.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: se usa en</tspan><tspan x="435.0" dy="16">mortalidad infantil o</tspan><tspan x="435.0" dy="16">natalidad</tspan></text><text x="585.0" y="994.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no es el</tspan><tspan x="585.0" dy="16">multiplicador de la</tspan><tspan x="585.0" dy="16">razón</tspan></text><text x="735.0" y="994.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: se usa en</tspan><tspan x="735.0" dy="16">mortalidad infantil o</tspan><tspan x="735.0" dy="16">natalidad</tspan></text><text x="885.0" y="1002.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: el multiplicador</tspan><tspan x="885.0" dy="16">estándar es 100 000</tspan></text><rect x="40.0" y="936.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1063.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1091.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1113.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Fórmula: muertes maternas / nacidos vivos del mismo periodo x 100 000. Se llama razón porque los nacidos vivos aproximan a las mujeres en riesgo, sin</tspan><tspan x="58.0" dy="18">   incluir abortos ni ectópicos.</tspan><tspan x="58.0" dy="18">• Tasa de mortalidad materna: usa como denominador a las mujeres en edad fértil. Proporción: participación de estas causas en las defunciones de</tspan><tspan x="58.0" dy="18">   mujeres en edad reproductiva.</tspan><tspan x="58.0" dy="18">• OMS: razón mundial de 223 por 100 000 nacidos vivos en 2020; meta 3.1 de los ODS: menos de 70 para 2030.</tspan><tspan x="58.0" dy="18">• Alerta: los multiplicadores de 1000 o 10 000 son de mortalidad infantil o natalidad. Tres demoras: decidir, llegar y recibir atención.</tspan></text><text x="58.0" y="1225.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, Tendencias de la mortalidad materna 2000-2020 (2023); OMS, CIE-MM (2012).</tspan></text></svg>