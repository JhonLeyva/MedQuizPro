<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1287" viewBox="0 0 1000 1287" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En el adolescente con anorexia nerviosa, de las opciones, la actividad física exagerada es la conducta característica"><title>En el adolescente con anorexia nerviosa, de las opciones, la actividad física exagerada es la conducta característica</title><rect x="0.75" y="0.75" width="998.5" height="1285.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Psiquiatría · anorexia nerviosa</tspan></text><rect x="380.5" y="32.0" width="109.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="435.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="93"><tspan x="435.2" dy="0">PSIQUIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Anorexia nerviosa (DSM-5-TR)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Restricción de la ingesta con peso bajo, miedo a ganar peso y alteración de la percepción</tspan><tspan x="58.0" dy="17">corporal.</tspan><tspan x="58.0" dy="17">Subtipo restrictivo y subtipo con atracones o purgas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Adolescente</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es la característica principal de la anorexia</tspan><tspan x="640.0" dy="16">nerviosa en el adolescente?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SE PIENSA EN ESTE ORDEN</tspan></text><rect x="40.0" y="269.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="314.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="342.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">1</tspan></text><rect x="124.0" y="269.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="297.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Qué define la anorexia?</tspan></text><rect x="136.0" y="311.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="331.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Restricción con peso bajo y miedo intenso a ganar peso</tspan></text><text x="152.0" y="350.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Hay distorsión de la imagen corporal: descarta la percepción adecuada.</tspan></text><line x1="77.0" y1="372.0" x2="77.0" y2="391.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,390.0 82.0,390.0 77.0,398.0" fill="#0f766e"/><text x="134.0" y="390.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="400.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="445.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="473.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">2</tspan></text><rect x="124.0" y="400.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="428.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Qué conducta ayuda a perder peso?</tspan></text><rect x="136.0" y="442.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="462.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Actividad física exagerada, a veces compulsiva</tspan></text><text x="152.0" y="481.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Va junto con la restricción dietética.</tspan></text><line x1="77.0" y1="503.0" x2="77.0" y2="522.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,521.0 82.0,521.0 77.0,529.0" fill="#0f766e"/><text x="134.0" y="521.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="531.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="576.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="604.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">3</tspan></text><rect x="124.0" y="531.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="559.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Qué no corresponde?</tspan></text><rect x="136.0" y="573.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="593.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Peso alto, aceptar el hambre o mal rendimiento escolar</tspan></text><text x="152.0" y="612.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Suelen ser estudiantes perfeccionistas y de alto rendimiento.</tspan></text><rect x="40.0" y="652.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="678.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Actividad física exagerada = conducta de la anorexia entre las opciones</tspan></text><text x="60.0" y="697.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El criterio nuclear del DSM es el miedo a engordar con distorsión de la imagen.</tspan></text><text x="40.0" y="758.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CRITERIOS DE LA ANOREXIA NERVIOSA (DSM-5-TR)</tspan></text><rect x="40.0" y="770.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="789.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Criterio</tspan></text><text x="300.0" y="789.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="654"><tspan x="300.0" dy="0">Contenido</tspan></text><rect x="40.0" y="799.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="818.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">A. Restricción</tspan></text><text x="300.0" y="818.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="654"><tspan x="300.0" dy="0">Ingesta menor a la requerida con peso significativamente bajo para la edad, el sexo y el desarrollo</tspan></text><rect x="40.0" y="828.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="847.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">B. Miedo</tspan></text><text x="300.0" y="847.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="654"><tspan x="300.0" dy="0">Miedo intenso a ganar peso o conductas persistentes que lo impiden, como la actividad física excesiva</tspan></text><rect x="40.0" y="857.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="876.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">C. Percepción</tspan></text><text x="300.0" y="876.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="654"><tspan x="300.0" dy="0">Alteración de la percepción del peso o la forma corporal, con negación de la gravedad</tspan></text><text x="40.0" y="902.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Subtipos: restrictivo y con atracones o purgas.</tspan></text><text x="40.0" y="949.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="959.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="998.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="962.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="990.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Actividad física</tspan><tspan x="285.0" dy="17">exagerada</tspan></text><text x="435.0" y="990.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Mantener peso por</tspan><tspan x="435.0" dy="17">encima de lo normal</tspan></text><text x="585.0" y="981.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Aceptación de la</tspan><tspan x="585.0" dy="17">sensación de</tspan><tspan x="585.0" dy="17">hambre</tspan></text><text x="735.0" y="990.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Mal rendimiento</tspan><tspan x="735.0" dy="17">escolar</tspan></text><text x="885.0" y="981.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Adecuada</tspan><tspan x="885.0" dy="17">percepción del peso</tspan><tspan x="885.0" dy="17">o la forma</tspan></text><rect x="40.0" y="1030.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1030.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1059.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Característica</tspan><tspan x="54.0" dy="16">principal?</tspan></text><text x="285.0" y="1059.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: conducta que</tspan><tspan x="285.0" dy="16">ayuda a perder peso</tspan></text><text x="435.0" y="1059.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: contradice el</tspan><tspan x="435.0" dy="16">diagnóstico</tspan></text><text x="585.0" y="1059.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: siente el hambre</tspan><tspan x="585.0" dy="16">pero la reprime</tspan></text><text x="735.0" y="1051.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: suelen ser</tspan><tspan x="735.0" dy="16">estudiantes de alto</tspan><tspan x="735.0" dy="16">rendimiento</tspan></text><text x="885.0" y="1059.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: hay distorsión de</tspan><tspan x="885.0" dy="16">la imagen corporal</tspan></text><rect x="40.0" y="959.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1120.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1148.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1170.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Criterios DSM-5-TR: restricción que lleva a peso bajo, miedo intenso a ganar peso y distorsión de la imagen corporal con negación de la gravedad.</tspan><tspan x="58.0" dy="18">• La actividad física excesiva, a veces compulsiva, ayuda a perder peso; es la mejor de las opciones, aunque el criterio nuclear es el miedo a engordar.</tspan><tspan x="58.0" dy="18">• Complicaciones: bradicardia, amenorrea, osteopenia y síndrome de realimentación (vigilar la hipofosfatemia).</tspan><tspan x="58.0" dy="18">• Tratamiento en adolescentes: terapia basada en la familia; bradicardia o hipotensión ortostática marcan la hospitalización.</tspan></text><text x="58.0" y="1246.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Golden NH et al. SAHM, restrictive eating disorders. J Adolesc Health 2022;71:648-654; Crone C et al. Am J Psychiatry 2023;180:167-171; APA, DSM-5-TR (2022).</tspan></text></svg>