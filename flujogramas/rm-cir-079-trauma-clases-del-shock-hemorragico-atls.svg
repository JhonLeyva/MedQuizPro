<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="981" viewBox="0 0 1000 981" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Confuso, FC mayor de 120, hipotenso, FR 30-40 y diuresis de 5-15 mL/h: shock hemorrágico clase III"><title>Confuso, FC mayor de 120, hipotenso, FR 30-40 y diuresis de 5-15 mL/h: shock hemorrágico clase III</title><rect x="0.75" y="0.75" width="998.5" height="979.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Trauma · clases del shock hemorrágico (ATLS)</tspan></text><rect x="475.3" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="518.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="518.5" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Clasificación ATLS</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cuatro clases según el porcentaje de volumen perdido.</tspan><tspan x="58.0" dy="17">La hipotensión aparece recién en la clase III.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 30 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Accidente de tránsito, hemoperitoneo probable.</tspan><tspan x="640.0" dy="16">Confuso, pálido, FC &gt; 120, hipotenso, FR 30-40 y</tspan><tspan x="640.0" dy="16">diuresis de 5-15 mL/h.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><rect x="40.0" y="261.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="287.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Clase III: pérdida de 31-40 % con hipotensión</tspan></text><text x="60.0" y="306.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Transfusión balanceada 1:1:1 y hemostasia precoz; la taquicardia sola engaña.</tspan></text><text x="40.0" y="367.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASES DEL SHOCK HEMORRÁGICO (ATLS)</tspan></text><rect x="40.0" y="379.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="398.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">Clase</tspan></text><text x="175.0" y="398.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="143"><tspan x="175.0" dy="0">Pérdida de sangre</tspan></text><text x="334.0" y="398.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="143"><tspan x="334.0" dy="0">FC y presión arterial</tspan></text><text x="493.0" y="398.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="143"><tspan x="493.0" dy="0">FR y diuresis</tspan></text><text x="652.0" y="398.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="143"><tspan x="652.0" dy="0">Estado mental</tspan></text><text x="811.0" y="398.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="143"><tspan x="811.0" dy="0">Conducta</tspan></text><rect x="40.0" y="408.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="427.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">I</tspan></text><text x="175.0" y="427.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="143"><tspan x="175.0" dy="0">&lt; 15 % (&lt; 750 mL)</tspan></text><text x="334.0" y="427.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="143"><tspan x="334.0" dy="0">FC normal; PA y presión</tspan><tspan x="334.0" dy="15">de pulso normales</tspan></text><text x="493.0" y="427.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="143"><tspan x="493.0" dy="0">FR 14-20; diuresis &gt; 30</tspan><tspan x="493.0" dy="15">mL/h</tspan></text><text x="652.0" y="427.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="143"><tspan x="652.0" dy="0">Ansiedad leve</tspan></text><text x="811.0" y="427.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="143"><tspan x="811.0" dy="0">Observar y controlar la</tspan><tspan x="811.0" dy="15">hemorragia</tspan></text><rect x="40.0" y="452.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="471.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">II</tspan></text><text x="175.0" y="471.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="143"><tspan x="175.0" dy="0">15-30 % (750-1500 mL)</tspan></text><text x="334.0" y="471.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="143"><tspan x="334.0" dy="0">FC 100-120; PA normal;</tspan><tspan x="334.0" dy="15">presión de pulso baja</tspan></text><text x="493.0" y="471.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="143"><tspan x="493.0" dy="0">FR 20-30; diuresis 20-30</tspan><tspan x="493.0" dy="15">mL/h</tspan></text><text x="652.0" y="471.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="143"><tspan x="652.0" dy="0">Ansioso</tspan></text><text x="811.0" y="471.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="143"><tspan x="811.0" dy="0">Cristaloides; sangre si</tspan><tspan x="811.0" dy="15">persiste</tspan></text><rect x="40.0" y="496.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="515.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">III</tspan></text><text x="175.0" y="515.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="143"><tspan x="175.0" dy="0">31-40 % (1500-2000 mL)</tspan></text><text x="334.0" y="515.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="143"><tspan x="334.0" dy="0">FC 120-140; hipotensión;</tspan><tspan x="334.0" dy="15">presión de pulso baja</tspan></text><text x="493.0" y="515.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="143"><tspan x="493.0" dy="0">FR 30-40; diuresis 5-15</tspan><tspan x="493.0" dy="15">mL/h</tspan></text><text x="652.0" y="515.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="143"><tspan x="652.0" dy="0">Ansioso o confuso</tspan></text><text x="811.0" y="515.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="143"><tspan x="811.0" dy="0">Transfusión y hemostasia</tspan><tspan x="811.0" dy="15">precoz</tspan></text><rect x="65.6" y="507.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="111.0" y="522.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="111.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="540.0" width="920.0" height="59.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="559.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">IV</tspan></text><text x="175.0" y="559.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="143"><tspan x="175.0" dy="0">&gt; 40 % (&gt; 2000 mL)</tspan></text><text x="334.0" y="559.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="143"><tspan x="334.0" dy="0">FC &gt; 140; hipotensión;</tspan><tspan x="334.0" dy="15">presión de pulso muy</tspan><tspan x="334.0" dy="15">baja</tspan></text><text x="493.0" y="559.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="143"><tspan x="493.0" dy="0">FR &gt; 35; anuria</tspan></text><text x="652.0" y="559.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="143"><tspan x="652.0" dy="0">Confuso o letárgico</tspan></text><text x="811.0" y="559.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="143"><tspan x="811.0" dy="0">Transfusión masiva y</tspan><tspan x="811.0" dy="15">quirófano</tspan></text><text x="40.0" y="615.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Adulto de 70 kg. Cifras de FC, FR y diuresis: valores clásicos del ATLS 9.ª ed.; la 10.ª (2018) los expresa como tendencias y añade el déficit de base (0 a −2, −2 a −6, −6 a −10,</tspan><tspan x="40.0" dy="15">≤ −10). Orientativas: no se pudo verificar en línea si la 11.ª ed. (2025) cambió la tabla.</tspan></text><text x="40.0" y="677.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="687.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="709.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="709.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">IV</tspan></text><text x="435.0" y="709.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">I</tspan></text><text x="585.0" y="709.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">II</tspan></text><rect x="663.0" y="690.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="709.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">III</tspan></text><text x="885.0" y="709.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">V</tspan></text><rect x="40.0" y="724.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="724.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="761.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Clase?</tspan></text><text x="285.0" y="745.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es la de pérdida</tspan><tspan x="285.0" dy="16">mayor de 40 %, con</tspan><tspan x="285.0" dy="16">anuria</tspan></text><text x="435.0" y="753.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: sin cambios</tspan><tspan x="435.0" dy="16">hemodinámicos</tspan></text><text x="585.0" y="745.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sin hipotensión y</tspan><tspan x="585.0" dy="16">con diuresis</tspan><tspan x="585.0" dy="16">conservada</tspan></text><text x="735.0" y="745.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: 31-40 % con</tspan><tspan x="735.0" dy="16">hipotensión y diuresis</tspan><tspan x="735.0" dy="16">de 5-15</tspan></text><text x="885.0" y="761.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no existe clase V</tspan></text><rect x="40.0" y="687.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="814.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="842.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="864.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Clase I: &lt; 15 % (&lt; 750 mL) · II: 15-30 %, FC 100-120, presión de pulso baja · III: 31-40 % (1500-2000 mL), FC 120-140, hipotensión, FR 30-40, diuresis</tspan><tspan x="58.0" dy="18">   5-15 mL/h · IV: &gt; 40 %, FC &gt; 140, anuria.</tspan><tspan x="58.0" dy="18">• Clase III-IV: transfusión masiva balanceada 1:1:1, control quirúrgico o por embolización de la hemorragia, ácido tranexámico en las primeras 3 h.</tspan><tspan x="58.0" dy="18">• Alertas: la taquicardia sola engaña (betabloqueo, ancianos, atletas); hipotermia, acidosis y coagulopatía forman la tríada letal.</tspan></text><text x="58.0" y="940.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ATLS, 10.ª ed. (2018) y 11.ª ed. (2025); WSES, trauma abdominal cerrado (2017); CRASH-2 (Lancet 2010)</tspan></text></svg>