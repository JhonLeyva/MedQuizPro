<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1037" viewBox="0 0 1000 1037" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Fiebre, faringitis, cefalea y mialgias 2 a 3 días con recuperación completa: poliomielitis abortiva"><title>Fiebre, faringitis, cefalea y mialgias 2 a 3 días con recuperación completa: poliomielitis abortiva</title><rect x="0.75" y="0.75" width="998.5" height="1035.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Infectología pediátrica · poliomielitis</tspan></text><rect x="415.3" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="464.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="464.3" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección por poliovirus</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Asintomática en la gran mayoría.</tspan><tspan x="58.0" dy="17">Entre los sintomáticos, la forma más frecuente es la abortiva o enfermedad menor.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Preescolar de 4 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Fiebre, malestar, anorexia, cefalea y mialgias por 2-3</tspan><tspan x="640.0" dy="16">días, congestión faríngea.</tspan><tspan x="640.0" dy="16">Recuperación neurológica completa.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">FORMAS CLÍNICAS DE LA INFECCIÓN POR POLIOVIRUS</tspan></text><rect x="42.0" y="295.0" width="302.7" height="56.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="193.3" y="320.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">2-3 DÍAS</tspan></text><text x="193.3" y="339.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">Enfermedad menor</tspan></text><rect x="348.7" y="295.0" width="302.7" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="500.0" y="320.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">FASE MENÍNGEA</tspan></text><text x="500.0" y="339.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">Sin parálisis</tspan></text><rect x="655.3" y="295.0" width="302.7" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="806.7" y="320.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">FASE PARALÍTICA</tspan></text><text x="806.7" y="339.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">Daño del asta anterior</tspan></text><rect x="147.9" y="284.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="193.3" y="299.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="193.3" dy="0">◆ ESTE CASO</tspan></text><rect x="48.0" y="365.0" width="290.7" height="108.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="193.3" y="393.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">ABORTIVA</tspan></text><text x="193.3" y="417.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">Fiebre, faringitis, cefalea y mialgias</tspan><tspan x="193.3" dy="17">Sin compromiso del SNC</tspan><tspan x="193.3" dy="17">Recuperación completa</tspan></text><rect x="354.7" y="365.0" width="290.7" height="108.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="393.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">NO PARALÍTICA</tspan></text><text x="500.0" y="417.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">Rigidez de nuca</tspan><tspan x="500.0" dy="17">Pleocitosis en el LCR</tspan><tspan x="500.0" dy="17">Meningitis aséptica</tspan></text><rect x="661.3" y="365.0" width="290.7" height="108.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="806.7" y="393.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">PARALÍTICA</tspan></text><text x="806.7" y="417.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">Parálisis flácida asimétrica</tspan><tspan x="806.7" dy="17">Arreflexia, sin déficit sensitivo</tspan><tspan x="806.7" dy="17">Notificación inmediata</tspan></text><text x="40.0" y="507.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">FORMAS CLÍNICAS DE LA POLIOMIELITIS</tspan></text><rect x="40.0" y="519.2" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="538.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="149"><tspan x="50.0" dy="0">Forma</tspan></text><text x="215.0" y="538.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="362"><tspan x="215.0" dy="0">Hallazgos</tspan></text><text x="592.5" y="538.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="362"><tspan x="592.5" dy="0">Evolución</tspan></text><rect x="40.0" y="548.2" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="567.2" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="149"><tspan x="50.0" dy="0">Abortiva</tspan></text><text x="215.0" y="567.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="362"><tspan x="215.0" dy="0">Fiebre, faringitis, cefalea, mialgias, anorexia, vómitos</tspan></text><text x="592.5" y="567.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="362"><tspan x="592.5" dy="0">Recuperación completa en pocos días</tspan></text><rect x="105.6" y="551.7" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="151.0" y="566.7" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="151.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="577.2" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="596.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="149"><tspan x="50.0" dy="0">No paralítica</tspan></text><text x="215.0" y="596.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="362"><tspan x="215.0" dy="0">Lo anterior más rigidez de nuca y pleocitosis en el LCR</tspan></text><text x="592.5" y="596.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="362"><tspan x="592.5" dy="0">Recuperación sin secuelas motoras</tspan></text><rect x="40.0" y="606.2" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="625.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="149"><tspan x="50.0" dy="0">Paralítica</tspan></text><text x="215.0" y="625.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="362"><tspan x="215.0" dy="0">Parálisis flácida asimétrica, arreflexia, sin trastorno sensitivo</tspan></text><text x="592.5" y="625.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="362"><tspan x="592.5" dy="0">Secuelas motoras posibles</tspan></text><text x="40.0" y="651.2" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Confirmación: cultivo o PCR de heces y faringe.</tspan></text><text x="40.0" y="698.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="708.2" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="739.2" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="730.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Poliomielitis no</tspan><tspan x="285.0" dy="17">paralítica</tspan></text><text x="435.0" y="730.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Poliomielitis</tspan><tspan x="435.0" dy="17">paralítica</tspan></text><text x="585.0" y="730.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Síndrome de</tspan><tspan x="585.0" dy="17">Guillain-Barré</tspan></text><text x="735.0" y="739.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Mielitis transversa</tspan></text><rect x="813.0" y="711.2" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="730.7" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Poliomielitis</tspan><tspan x="885.0" dy="17">abortiva</tspan></text><rect x="40.0" y="762.2" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="762.2" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="799.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="783.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: tendría meningitis</tspan><tspan x="285.0" dy="16">aséptica (rigidez de</tspan><tspan x="285.0" dy="16">nuca)</tspan></text><text x="435.0" y="791.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: dejaría parálisis</tspan><tspan x="435.0" dy="16">flácida persistente</tspan></text><text x="585.0" y="791.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es simétrico y</tspan><tspan x="585.0" dy="16">ascendente</tspan></text><text x="735.0" y="791.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: tendría nivel</tspan><tspan x="735.0" dy="16">sensitivo y esfínteres</tspan></text><text x="885.0" y="791.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: febril inespecífico y</tspan><tspan x="885.0" dy="16">recuperación completa</tspan></text><rect x="40.0" y="708.2" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="852.2" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="880.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="902.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Abortiva: cuadro febril inespecífico de 2 a 3 días sin compromiso del sistema nervioso central y con recuperación completa.</tspan><tspan x="58.0" dy="18">• No paralítica: añade meningitis aséptica (rigidez de nuca, pleocitosis). Paralítica: parálisis flácida asimétrica, arreflexia, sin trastorno sensitivo.</tspan><tspan x="58.0" dy="18">• Diferenciar: Guillain-Barré es simétrico y ascendente con disociación albuminocitológica; la mielitis transversa tiene nivel sensitivo y alteración</tspan><tspan x="58.0" dy="18">   esfinteriana.</tspan><tspan x="58.0" dy="18">• Alerta: toda parálisis flácida aguda en menores de 15 años obliga a notificar y a estudiar heces (cultivo o PCR). La vacunación completa es la prevención.</tspan></text><text x="58.0" y="996.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: NTS 196-MINSA/DGIESP-2022, Esquema Nacional de Vacunación; Nelson Tratado de Pediatría 22.ª ed. (2024); Harrison, 21.ª ed. (2022)</tspan></text></svg>