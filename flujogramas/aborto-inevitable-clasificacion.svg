<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1264" viewBox="0 0 1000 1264" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="15 semanas con dolor, sangrado, pérdida de líquido amniótico y orificios abiertos: aborto inevitable"><title>15 semanas con dolor, sangrado, pérdida de líquido amniótico y orificios abiertos: aborto inevitable</title><rect x="0.75" y="0.75" width="998.5" height="1263.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Hemorragias de la primera mitad del embarazo · aborto</tspan></text><rect x="524.7" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="611.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="611.9" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Aborto inevitable</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El embarazo ya no puede continuar: cuello abierto y membranas rotas, sin expulsión aún.</tspan><tspan x="58.0" dy="17">La pérdida de líquido amniótico lo distingue de la amenaza.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante de 15 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dolor en hipogastrio, sangrado y pérdida de líquido</tspan><tspan x="640.0" dy="16">amniótico.</tspan><tspan x="640.0" dy="16">Orificios cervicales abiertos.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="395.0" x2="733.5" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="395.0" x2="266.5" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,423.0 271.5,423.0 266.5,431.0" fill="#94a3b8"/><line x1="733.5" y1="395.0" x2="733.5" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,423.0 738.5,423.0 733.5,431.0" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#0f766e"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="395.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="395.0" x2="266.5" y2="424.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,423.0 271.5,423.0 266.5,431.0" fill="#0f766e"/><rect x="172.8" y="404.0" width="187.3" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Sí + pérdida de líquido (este caso)</tspan></text><rect x="719.4" y="404.0" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">No</tspan></text><polygon points="240.0,336.0 266.0,307.0 734.0,307.0 760.0,336.0 734.0,365.0 266.0,365.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="336.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="341.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="340.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Sangrado antes de las 22 semanas: ¿el cuello está abierto?</tspan></text><rect x="40.0" y="431.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">ABORTO INEVITABLE</tspan></text><text x="266.5" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Misoprostol o aspiración</tspan><tspan x="266.5" dy="17">Anti-D si es Rh negativa</tspan></text><rect x="507.0" y="431.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="467.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Amenaza o retenido</tspan></text><text x="733.5" y="490.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Ecografía</tspan></text><text x="40.0" y="561.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="573.5" width="920.0" height="381.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="587.5" width="254.6" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="183.3" y="607.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="183.3" dy="0">FORMAS CLÍNICAS DEL ABORTO</tspan></text><text x="326.6" y="607.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="615"><tspan x="326.6" dy="0">Se definen por el cuello, el sangrado y la ecografía.</tspan></text><rect x="56.0" y="647.5" width="168.0" height="156.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="648.1" width="166.8" height="82.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="140.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="152"><tspan x="140.0" dy="0">CUELLO CERRADO</tspan></text><text x="140.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="144"><tspan x="140.0" dy="0">Amenaza de aborto</tspan></text><circle cx="72.0" cy="739.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="743.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="82.0" dy="0">Sangrado escaso</tspan></text><circle cx="72.0" cy="762.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="766.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="82.0" dy="0">Embrión vivo</tspan></text><rect x="236.0" y="647.5" width="168.0" height="156.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="237.2" y="648.7" width="165.6" height="82.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="320.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="152"><tspan x="320.0" dy="0">CUELLO ABIERTO</tspan></text><text x="320.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="144"><tspan x="320.0" dy="0">Inevitable o en</tspan><tspan x="320.0" dy="19">curso</tspan></text><circle cx="252.0" cy="739.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="262.0" y="743.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="262.0" dy="0">Sangrado y dolor</tspan></text><circle cx="252.0" cy="762.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="262.0" y="766.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="262.0" dy="0">Membranas rotas o</tspan><tspan x="262.0" dy="16">restos en el cuello</tspan></text><rect x="274.6" y="636.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="320.0" y="651.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="320.0" dy="0">◆ ESTE CASO</tspan></text><rect x="416.0" y="647.5" width="168.0" height="156.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="416.6" y="648.1" width="166.8" height="82.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="500.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">CUELLO ABIERTO</tspan></text><text x="500.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="144"><tspan x="500.0" dy="0">Incompleto</tspan></text><circle cx="432.0" cy="739.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="442.0" y="743.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="442.0" dy="0">Salieron parte de los</tspan><tspan x="442.0" dy="16">restos</tspan></text><circle cx="432.0" cy="778.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="442.0" y="782.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="442.0" dy="0">Sangrado persistente</tspan></text><rect x="596.0" y="647.5" width="168.0" height="156.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="596.6" y="648.1" width="166.8" height="82.0" rx="9" fill="#fee2e2" stroke="none" stroke-width="0"/><text x="680.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="152"><tspan x="680.0" dy="0">CUELLO CERRADO</tspan></text><text x="680.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="144"><tspan x="680.0" dy="0">Completo</tspan></text><circle cx="612.0" cy="739.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="622.0" y="743.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="622.0" dy="0">Útero vacío</tspan></text><circle cx="612.0" cy="762.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="622.0" y="766.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="622.0" dy="0">Sangrado que cede</tspan></text><rect x="776.0" y="647.5" width="168.0" height="156.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="776.6" y="648.1" width="166.8" height="82.0" rx="9" fill="#fecaca" stroke="none" stroke-width="0"/><text x="860.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="middle" data-max="152"><tspan x="860.0" dy="0">CUELLO CERRADO</tspan></text><text x="860.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="middle" data-max="144"><tspan x="860.0" dy="0">Retenido (frustro)</tspan></text><circle cx="792.0" cy="739.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="802.0" y="743.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="802.0" dy="0">Embrión sin latido o</tspan><tspan x="802.0" dy="16">saco vacío</tspan></text><circle cx="792.0" cy="778.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="802.0" y="782.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="802.0" dy="0">Sin expulsión</tspan></text><text x="56.0" y="833.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="842.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="857.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="857.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Cuello abierto con pérdida de líquido amniótico</tspan></text><rect x="56.0" y="864.5" width="20.0" height="20.0" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="66.0" y="879.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✕</tspan></text><text x="88.0" y="879.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Aún no expulsó restos: no es incompleto</tspan></text><rect x="56.0" y="901.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="924.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Evacuación uterina con misoprostol o aspiración; anti-D si corresponde.</tspan></text><text x="40.0" y="994.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1004.5" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1027.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1027.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Aborto frustrado</tspan></text><text x="435.0" y="1027.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Aborto incompleto</tspan></text><rect x="513.0" y="1007.5" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="1027.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Aborto inevitable</tspan></text><text x="735.0" y="1027.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Aborto inminente</tspan></text><text x="885.0" y="1027.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Amenaza de aborto</tspan></text><rect x="40.0" y="1041.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="1041.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1070.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="1062.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: cuello cerrado, sin</tspan><tspan x="285.0" dy="16">expulsión</tspan></text><text x="435.0" y="1062.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: aún no salieron</tspan><tspan x="435.0" dy="16">restos</tspan></text><text x="585.0" y="1062.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: cuello abierto +</tspan><tspan x="585.0" dy="16">líquido</tspan></text><text x="735.0" y="1062.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No es un término</tspan><tspan x="735.0" dy="16">oficial</tspan></text><text x="885.0" y="1070.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: cuello cerrado</tspan></text><rect x="40.0" y="1004.5" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1115.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1143.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1165.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Evacuar el útero: misoprostol (o mifepristona + misoprostol) o aspiración; antibiótico si hay signos de infección.</tspan><tspan x="58.0" dy="18">• Anti-D si es Rh negativa; analgesia y apoyo emocional.</tspan><tspan x="58.0" dy="18">• Vigilar sangrado e infección (aborto séptico).</tspan></text><text x="58.0" y="1223.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, Abortion care guideline (2022); ACOG; MINSA Perú.</tspan></text></svg>