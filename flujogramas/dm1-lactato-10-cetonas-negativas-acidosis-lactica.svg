<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1267" viewBox="0 0 1000 1267" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Diabético en choque con acidosis metabólica de anión gap alto, lactato 10 y cetonas negativas: acidosis láctica"><title>Diabético en choque con acidosis metabólica de anión gap alto, lactato 10 y cetonas negativas: acidosis láctica</title><rect x="0.75" y="0.75" width="998.5" height="1266.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Acidosis metabólica · anión gap alto</tspan></text><rect x="415.3" y="32.0" width="155.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="493.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="139"><tspan x="493.0" dy="0">ENDOCRINOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Acidosis láctica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Por hipoperfusión (choque, sepsis): los tejidos sin oxígeno producen ácido láctico.</tspan><tspan x="58.0" dy="17">En un diabético, la clave es medir cetonas: si son negativas y el lactato está alto, no es</tspan><tspan x="58.0" dy="17">cetoacidosis.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 22 años con DM1</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dolor abdominal, confusión, Kussmaul; PA 80/40, piel</tspan><tspan x="640.0" dy="16">fría, cianosis.</tspan><tspan x="640.0" dy="16">Glucosa 480, cetonas negativas, pH 7,15, HCO₃ 8,</tspan><tspan x="640.0" dy="16">anión gap 18, lactato 10.</tspan></text><line x1="640.0" y1="237.0" x2="670.0" y2="237.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#94a3b8"/><line x1="500.0" y1="393.0" x2="500.0" y2="423.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="423.0" x2="733.5" y2="423.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="423.0" x2="266.5" y2="452.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,451.0 271.5,451.0 266.5,459.0" fill="#94a3b8"/><line x1="733.5" y1="423.0" x2="733.5" y2="452.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,451.0 738.5,451.0 733.5,459.0" fill="#94a3b8"/><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#0f766e"/><line x1="500.0" y1="393.0" x2="500.0" y2="423.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="423.0" x2="500.0" y2="423.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="423.0" x2="266.5" y2="452.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,451.0 271.5,451.0 266.5,459.0" fill="#0f766e"/><rect x="195.0" y="432.0" width="143.0" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="444.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">No: lactato 10 (este caso)</tspan></text><rect x="721.4" y="432.0" width="24.1" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="444.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Sí</tspan></text><polygon points="240.0,358.0 266.0,323.0 734.0,323.0 760.0,358.0 734.0,393.0 266.0,393.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="358.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="363.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="354.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Acidosis con anión gap alto en un diabético: ¿cetonas</tspan><tspan x="519.0" dy="17">positivas?</tspan></text><rect x="40.0" y="459.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="487.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">ACIDOSIS LÁCTICA</tspan></text><text x="266.5" y="510.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Tratar el choque</tspan><tspan x="266.5" dy="17">Buscar la causa</tspan></text><rect x="507.0" y="459.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="495.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Cetoacidosis diabética</tspan></text><text x="733.5" y="518.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Insulina + líquidos</tspan></text><text x="40.0" y="589.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="601.5" width="920.0" height="339.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="615.5" width="434.2" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="273.1" y="635.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="273.1" dy="0">CAUSAS DE ACIDOSIS CON ANIÓN GAP ALTO (GOLDMARK)</tspan></text><text x="506.2" y="635.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="436"><tspan x="506.2" dy="0">Mnemotecnia de los ácidos que suben el anión gap.</tspan></text><rect x="56.0" y="675.5" width="168.0" height="114.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="57.2" y="676.7" width="165.6" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="140.0" y="703.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="152"><tspan x="140.0" dy="0">LACTATO</tspan></text><text x="140.0" y="723.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="144"><tspan x="140.0" dy="0">L-lactato</tspan></text><circle cx="72.0" cy="748.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="82.0" y="752.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="82.0" dy="0">Choque, sepsis</tspan></text><rect x="94.6" y="664.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="140.0" y="679.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="140.0" dy="0">◆ ESTE CASO</tspan></text><rect x="236.0" y="675.5" width="168.0" height="114.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="236.6" y="676.1" width="166.8" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="320.0" y="703.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="152"><tspan x="320.0" dy="0">CETONAS</tspan></text><text x="320.0" y="723.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="144"><tspan x="320.0" dy="0">Cetoacidosis</tspan></text><circle cx="252.0" cy="748.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="262.0" y="752.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="262.0" dy="0">Diabetes, ayuno,</tspan><tspan x="262.0" dy="16">alcohol</tspan></text><rect x="416.0" y="675.5" width="168.0" height="114.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="416.6" y="676.1" width="166.8" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="500.0" y="703.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">TÓXICOS</tspan></text><text x="500.0" y="723.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="144"><tspan x="500.0" dy="0">Metanol, glicoles</tspan></text><circle cx="432.0" cy="748.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="442.0" y="752.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="442.0" dy="0">Brecha osmolar</tspan></text><rect x="596.0" y="675.5" width="168.0" height="114.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="596.6" y="676.1" width="166.8" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="680.0" y="703.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="152"><tspan x="680.0" dy="0">RIÑÓN</tspan></text><text x="680.0" y="723.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="144"><tspan x="680.0" dy="0">Uremia</tspan></text><circle cx="612.0" cy="748.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="622.0" y="752.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="622.0" dy="0">Falla renal</tspan></text><rect x="776.0" y="675.5" width="168.0" height="114.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="776.6" y="676.1" width="166.8" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="860.0" y="703.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="152"><tspan x="860.0" dy="0">SALICILATOS</tspan></text><text x="860.0" y="723.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="144"><tspan x="860.0" dy="0">Aspirina</tspan></text><circle cx="792.0" cy="748.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="802.0" y="752.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="802.0" dy="0">+ alcalosis respiratoria</tspan></text><text x="56.0" y="819.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="828.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="843.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="843.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Lactato 10 mmol/L</tspan></text><rect x="56.0" y="850.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="865.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="865.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Cetonas negativas</tspan></text><rect x="56.0" y="887.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="910.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Reanimación y tratar la causa.</tspan></text><text x="40.0" y="980.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="990.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1021.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1013.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Cetoacidosis</tspan><tspan x="285.0" dy="17">diabética</tspan></text><rect x="363.0" y="993.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="1021.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Acidosis láctica</tspan></text><text x="585.0" y="1013.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Intoxicación por</tspan><tspan x="585.0" dy="17">salicilatos</tspan></text><text x="735.0" y="1013.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ingestión de</tspan><tspan x="735.0" dy="17">metanol</tspan></text><text x="885.0" y="1013.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Estado</tspan><tspan x="885.0" dy="17">hiperosmolar</tspan></text><rect x="40.0" y="1044.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="1044.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1073.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="1073.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: cetonas negativas</tspan></text><text x="435.0" y="1065.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: lactato 10, cetonas</tspan><tspan x="435.0" dy="16">negativas</tspan></text><text x="585.0" y="1065.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no hay ingesta ni</tspan><tspan x="585.0" dy="16">alcalosis respiratoria</tspan></text><text x="735.0" y="1065.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no hay ingesta ni</tspan><tspan x="735.0" dy="16">problemas visuales</tspan></text><text x="885.0" y="1065.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: hay acidosis</tspan><tspan x="885.0" dy="16">marcada</tspan></text><rect x="40.0" y="990.5" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1118.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1146.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1168.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Tratar la causa del choque: líquidos, buscar sepsis o isquemia mesentérica.</tspan><tspan x="58.0" dy="18">• Insulina para la hiperglucemia, corregir el potasio.</tspan><tspan x="58.0" dy="18">• Bicarbonato solo si pH &lt; 7,0 o hiperpotasemia grave.</tspan></text><text x="58.0" y="1226.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Surviving Sepsis Campaign (2021); Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>