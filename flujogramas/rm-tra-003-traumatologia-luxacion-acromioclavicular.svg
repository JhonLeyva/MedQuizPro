<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="960" viewBox="0 0 1000 960" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Signo de la tecla tras caída sobre el hombro: se compromete el ligamento acromioclavicular"><title>Signo de la tecla tras caída sobre el hombro: se compromete el ligamento acromioclavicular</title><rect x="0.75" y="0.75" width="998.5" height="958.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Traumatología · luxación acromioclavicular</tspan></text><rect x="455.0" y="32.0" width="135.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="522.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="119"><tspan x="522.7" dy="0">TRAUMATOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Luxación acromioclavicular</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Caída sobre el hombro con el brazo aducido, frecuente en jóvenes deportistas.</tspan><tspan x="58.0" dy="17">Estabilidad horizontal: ligamentos acromioclaviculares; vertical: coracoclaviculares.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Adolescente de 16 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Caída sobre el hombro.</tspan><tspan x="640.0" dy="16">Signo de la tecla positivo.</tspan><tspan x="640.0" dy="16">¿Qué ligamento está comprometido?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ LIGAMENTO DA EL SIGNO DE LA TECLA</tspan></text><rect x="40.0" y="297.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="323.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Signo de la tecla = lesión acromioclavicular</tspan></text><text x="60.0" y="342.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Esternoclavicular, coracohumeral y glenohumeral pertenecen a otras articulaciones.</tspan></text><text x="40.0" y="403.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN DE ROCKWOOD DE LA LESIÓN ACROMIOCLAVICULAR</tspan></text><rect x="40.0" y="415.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="434.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="64"><tspan x="50.0" dy="0">Tipo</tspan></text><text x="130.0" y="434.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="404"><tspan x="130.0" dy="0">Ligamentos y clavícula</tspan></text><text x="550.0" y="434.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="404"><tspan x="550.0" dy="0">Tratamiento habitual</tspan></text><rect x="40.0" y="444.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="463.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="64"><tspan x="50.0" dy="0">I</tspan></text><text x="130.0" y="463.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="404"><tspan x="130.0" dy="0">Esguince acromioclavicular; coracoclavicular íntegro</tspan></text><text x="550.0" y="463.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="404"><tspan x="550.0" dy="0">Reposo, cabestrillo y rehabilitación</tspan></text><rect x="40.0" y="473.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="492.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="64"><tspan x="50.0" dy="0">II</tspan></text><text x="130.0" y="492.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="404"><tspan x="130.0" dy="0">Ruptura acromioclavicular; coracoclavicular parcial</tspan></text><text x="550.0" y="492.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="404"><tspan x="550.0" dy="0">Conservador</tspan></text><rect x="40.0" y="502.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="521.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="64"><tspan x="50.0" dy="0">III</tspan></text><text x="130.0" y="521.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="404"><tspan x="130.0" dy="0">Ruptura de ambos ligamentos; la clavícula asciende</tspan></text><text x="550.0" y="521.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="404"><tspan x="550.0" dy="0">Conservador en la mayoría; cirugía en casos seleccionados</tspan></text><rect x="40.0" y="531.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="550.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="64"><tspan x="50.0" dy="0">IV a VI</tspan></text><text x="130.0" y="550.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="404"><tspan x="130.0" dy="0">Desplazamiento posterior (IV), ascenso marcado (V) o inferior (VI)</tspan></text><text x="550.0" y="550.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="404"><tspan x="550.0" dy="0">Suelen requerir cirugía</tspan></text><text x="40.0" y="576.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Todos los tipos comprometen al ligamento acromioclavicular; el signo de la tecla aparece cuando la clavícula se desplaza.</tspan></text><text x="40.0" y="623.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="633.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="655.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="655.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Esternoclavicular</tspan></text><text x="435.0" y="655.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Esternocostal</tspan></text><text x="585.0" y="655.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Coracohumeral</tspan></text><rect x="663.0" y="636.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="655.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Acromioclavicular</tspan></text><text x="885.0" y="655.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Glenohumeral</tspan></text><rect x="40.0" y="670.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="670.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="699.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Ligamento</tspan><tspan x="54.0" dy="16">comprometido?</tspan></text><text x="285.0" y="691.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es de la</tspan><tspan x="285.0" dy="16">articulación del</tspan><tspan x="285.0" dy="16">extremo medial</tspan></text><text x="435.0" y="699.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: une costilla y</tspan><tspan x="435.0" dy="16">esternón</tspan></text><text x="585.0" y="699.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es del hombro, no</tspan><tspan x="585.0" dy="16">de la clavícula</tspan></text><text x="735.0" y="699.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: articulación que da</tspan><tspan x="735.0" dy="16">el signo de la tecla</tspan></text><text x="885.0" y="699.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no se asocia al</tspan><tspan x="885.0" dy="16">signo</tspan></text><rect x="40.0" y="633.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="760.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="788.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="810.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Signo de la tecla: al presionar el extremo lateral de la clavícula desciende y se reduce, pero vuelve a elevarse al soltar, como una tecla de piano.</tspan><tspan x="58.0" dy="18">• Rockwood: I esguince; II ruptura acromioclavicular con lesión parcial del coracoclavicular; III ruptura de ambos; IV a VI con desplazamiento posterior,</tspan><tspan x="58.0" dy="18">   superior marcado o inferior.</tspan><tspan x="58.0" dy="18">• Tipos I y II, y la mayoría de los III: reposo, cabestrillo y rehabilitación. Tipos IV a VI: suelen requerir cirugía.</tspan><tspan x="58.0" dy="18">• Perla: radiografías con carga y comparación con el lado sano ayudan a graduar la separación.</tspan></text><text x="58.0" y="904.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Frank RM et al., Current concepts in acromioclavicular joint instability, BMC Musculoskelet Disord 2022; Rockwood and Green's Fractures in Adults 9.ª ed. (2019);</tspan><tspan x="58.0" dy="15">Campbell's Operative Orthopaedics 14.ª ed. (2020).</tspan></text></svg>