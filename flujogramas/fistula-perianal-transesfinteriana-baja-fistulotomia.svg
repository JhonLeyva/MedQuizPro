<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1262" viewBox="0 0 1000 1262" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Fístula perianal transesfinteriana baja: fistulotomía"><title>Fístula perianal transesfinteriana baja: fistulotomía</title><rect x="0.75" y="0.75" width="998.5" height="1261.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Patología anal · fístula anorrectal</tspan></text><rect x="395.5" y="32.0" width="101.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="446.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="85"><tspan x="446.1" dy="0">CIRUGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Fístula perianal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Trayecto que une el canal anal con la piel, casi siempre tras un absceso.</tspan><tspan x="58.0" dy="17">La técnica depende de cuánto esfínter atraviesa el trayecto.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 45 años con abscesos previos</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">6 meses de supuración intermitente; orificio externo a 2</tspan><tspan x="640.0" dy="16">cm del ano.</tspan><tspan x="640.0" dy="16">Transesfinteriana baja, trayecto único, &lt; 30 % del</tspan><tspan x="640.0" dy="16">esfínter externo; continente.</tspan></text><line x1="640.0" y1="237.0" x2="670.0" y2="237.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#94a3b8"/><line x1="500.0" y1="393.0" x2="500.0" y2="423.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="423.0" x2="733.5" y2="423.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="423.0" x2="266.5" y2="452.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,451.0 271.5,451.0 266.5,459.0" fill="#94a3b8"/><line x1="733.5" y1="423.0" x2="733.5" y2="452.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,451.0 738.5,451.0 733.5,459.0" fill="#94a3b8"/><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#0f766e"/><line x1="500.0" y1="393.0" x2="500.0" y2="423.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="423.0" x2="500.0" y2="423.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="423.0" x2="266.5" y2="452.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,451.0 271.5,451.0 266.5,459.0" fill="#0f766e"/><rect x="254.4" y="432.0" width="24.1" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="444.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Sí</tspan></text><rect x="677.5" y="432.0" width="112.1" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="444.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">No: alta o compleja</tspan></text><polygon points="240.0,358.0 266.0,323.0 734.0,323.0 760.0,358.0 734.0,393.0 266.0,393.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="358.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="363.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="354.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">¿Fístula simple: baja, &lt; 30 % del esfínter externo y sin</tspan><tspan x="519.0" dy="17">incontinencia?</tspan></text><rect x="40.0" y="459.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="487.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">FISTULOTOMÍA</tspan></text><text x="266.5" y="510.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Abrir todo el trayecto y dejar que cicatrice</tspan><tspan x="266.5" dy="17">Curación &gt; 90 %</tspan></text><rect x="507.0" y="459.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="495.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Técnicas que preservan el esfínter</tspan></text><text x="733.5" y="518.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Sedal, colgajo de avance o LIFT</tspan></text><text x="40.0" y="589.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="601.5" width="348.0" height="334.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="611.5" width="158.5" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="625.5" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="306"><tspan x="61.0" dy="0">TRAYECTO DE LA FÍSTULA</tspan></text><g data-box="54.0 639.5 320.0 272.0"><g transform="translate(54.0,639.5) scale(1.0)"><path d="M20 250 L20 120 L120 104 L120 0 L200 0 L200 104 L300 120 L300 250 Z" fill="#fef3c7" stroke="none" stroke-width="0" stroke-linejoin="round" /><text x="52" y="200" font-size="10" font-weight="800" fill="#a16207" text-anchor="middle" data-max="0">grasa</text><path d="M110 0 L110 104 L136 116 L136 226 L150 236 L164 226 L164 116 L190 104 L190 0" fill="#fbcfe8" stroke="#be185d" stroke-width="1.5" stroke-linejoin="round" /><path d="M136 116 L136 226 M164 116 L164 226" fill="none" stroke="#f9a8d4" stroke-width="12" stroke-linejoin="round" /><path d="M116 122 L116 160" fill="none" stroke="#dc2626" stroke-width="18" stroke-linejoin="round" /><path d="M116 164 L116 200" fill="none" stroke="#dc2626" stroke-width="18" stroke-linejoin="round" /><path d="M116 204 L116 236" fill="none" stroke="#dc2626" stroke-width="18" stroke-linejoin="round" /><path d="M184 122 L184 160" fill="none" stroke="#dc2626" stroke-width="18" stroke-linejoin="round" /><path d="M184 164 L184 200" fill="none" stroke="#dc2626" stroke-width="18" stroke-linejoin="round" /><path d="M184 204 L184 236" fill="none" stroke="#dc2626" stroke-width="18" stroke-linejoin="round" /><path d="M112 112 L24 60" fill="none" stroke="#b91c1c" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/><path d="M188 112 L296 60" fill="none" stroke="#b91c1c" stroke-width="12" stroke-linejoin="round" stroke-linecap="round"/><line x1="140" y1="176" x2="160" y2="176" stroke="#111827" stroke-width="1.6" stroke-dasharray="3 2"/><path d="M10 244 L140 244 M160 244 L310 244" fill="none" stroke="#e9b48f" stroke-width="5" stroke-linejoin="round" /><text x="150" y="60" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Recto</text><text x="150" y="60" font-size="10.5" font-weight="800" fill="#9d174d" text-anchor="middle" data-max="0">Recto</text><text x="20" y="48" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Elevador del ano</text><text x="20" y="48" font-size="10" font-weight="800" fill="#7f1d1d" text-anchor="start" data-max="0">Elevador del ano</text><text x="100" y="146" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="end" data-max="0">EAE</text><text x="100" y="146" font-size="10.5" font-weight="800" fill="#7f1d1d" text-anchor="end" data-max="0">EAE</text><text x="224" y="212" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">EAI</text><text x="224" y="212" font-size="10.5" font-weight="800" fill="#be185d" text-anchor="start" data-max="0">EAI</text><line x1="222" y1="208" x2="168" y2="206" stroke="#be185d" stroke-width="1.3"/><circle cx="168" cy="206" r="2.6" fill="#be185d"/><text x="224" y="180" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Línea dentada</text><text x="224" y="180" font-size="10" font-weight="800" fill="#0f172a" text-anchor="start" data-max="0">Línea dentada</text><line x1="222" y1="176" x2="160" y2="176" stroke="#334155" stroke-width="1.3"/><circle cx="160" cy="176" r="2.6" fill="#334155"/><path d="M137 180 L118 206 L96 224 L64 244" fill="none" stroke="#ea580c" stroke-width="4" stroke-linejoin="round" stroke-dasharray="6 3"/><circle cx="137" cy="180" r="4" fill="#7f1d1d" stroke="none" stroke-width="0" /><circle cx="64" cy="244" r="5" fill="#b91c1c" stroke="#7f1d1d" stroke-width="1.5" /><text x="34" y="266" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Trayecto por la parte baja del EAE</text><text x="34" y="266" font-size="10.5" font-weight="800" fill="#9a3412" text-anchor="start" data-max="0">Trayecto por la parte baja del EAE</text></g></g><rect x="410.0" y="601.5" width="550.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="428.0" cy="617.0" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="428.0" y="621.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="428.0" dy="0">1</tspan></text><text x="446.0" y="621.5" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="506"><tspan x="446.0" dy="0">Orificio interno en la línea dentada.</tspan></text><rect x="410.0" y="639.5" width="550.0" height="31.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="428.0" cy="655.0" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="428.0" y="659.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="428.0" dy="0">2</tspan></text><text x="446.0" y="659.5" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="506"><tspan x="446.0" dy="0">El trayecto cruza solo la parte baja del esfínter externo (EAE).</tspan></text><rect x="410.0" y="677.5" width="550.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="428.0" cy="693.0" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="428.0" y="697.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="428.0" dy="0">3</tspan></text><text x="446.0" y="697.5" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="506"><tspan x="446.0" dy="0">Cortar esa porción pequeña no altera la continencia: se puede abrir el trayecto.</tspan></text><text x="40.0" y="975.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="985.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1016.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="1016.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Fistulectomía</tspan></text><rect x="400.5" y="988.5" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="1016.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Fistulotomía</tspan></text><text x="678.8" y="1016.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Solo drenajes</tspan></text><text x="866.2" y="1008.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Resección amplia del</tspan><tspan x="866.2" dy="17">esfínter</tspan></text><rect x="40.0" y="1039.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="1039.5" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1068.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Por qué</tspan></text><text x="303.8" y="1060.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Deja una herida mayor sin</tspan><tspan x="303.8" dy="16">ventaja</tspan></text><text x="491.2" y="1068.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Elección en fístula simple</tspan></text><text x="678.8" y="1068.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No cura el trayecto</tspan></text><text x="866.2" y="1068.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Causa incontinencia</tspan></text><rect x="40.0" y="985.5" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1113.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1141.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1163.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Fístula simple (interesfinteriana o transesfinteriana baja, &lt; 30 % del EAE) sin incontinencia: fistulotomía.</tspan><tspan x="58.0" dy="18">• Fístula alta o compleja: sedal, colgajo de avance o LIFT para proteger la continencia.</tspan><tspan x="58.0" dy="18">• Mujeres con fístula anterior: cuidado, su esfínter anterior es corto.</tspan></text><text x="58.0" y="1221.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ASCRS, guía de abscesos y fístulas anorrectales (2022).</tspan></text></svg>