<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="943" viewBox="0 0 1000 943" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El esguince grado II es una rotura parcial del ligamento que puede causar inestabilidad"><title>El esguince grado II es una rotura parcial del ligamento que puede causar inestabilidad</title><rect x="0.75" y="0.75" width="998.5" height="941.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Traumatología · grados del esguince</tspan></text><rect x="416.0" y="32.0" width="135.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="483.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="119"><tspan x="483.7" dy="0">TRAUMATOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Esguince</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Lesión ligamentaria graduada según el daño de las fibras.</tspan><tspan x="58.0" dy="17">Tres grados: I, II y III.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de clasificación</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué ocurre en las lesiones ligamentarias de grado II?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><rect x="40.0" y="229.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="255.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Esguince grado II = rotura parcial</tspan></text><text x="60.0" y="274.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El estiramiento sin inestabilidad es grado I; la rotura completa con inestabilidad es grado III.</tspan></text><text x="40.0" y="335.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">GRADOS DEL ESGUINCE LIGAMENTARIO</tspan></text><rect x="40.0" y="347.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="366.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">Grado</tspan></text><text x="175.0" y="366.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="249"><tspan x="175.0" dy="0">Lesión</tspan></text><text x="440.0" y="366.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="249"><tspan x="440.0" dy="0">Laxitud</tspan></text><text x="705.0" y="366.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="249"><tspan x="705.0" dy="0">Tratamiento</tspan></text><rect x="40.0" y="376.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="395.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">I</tspan></text><text x="175.0" y="395.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="175.0" dy="0">Estiramiento con microrroturas; dolor y</tspan><tspan x="175.0" dy="15">edema leves</tspan></text><text x="440.0" y="395.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="440.0" dy="0">Sin laxitud; tope firme</tspan></text><text x="705.0" y="395.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="705.0" dy="0">Funcional: reposo relativo, hielo, compresión</tspan><tspan x="705.0" dy="15">y elevación</tspan></text><rect x="40.0" y="420.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="439.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">II</tspan></text><text x="175.0" y="439.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="175.0" dy="0">Rotura parcial; dolor, edema y equimosis</tspan><tspan x="175.0" dy="15">moderados</tspan></text><text x="440.0" y="439.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="440.0" dy="0">Leve a moderada; tope blando</tspan></text><text x="705.0" y="439.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="705.0" dy="0">Funcional con ortesis y rehabilitación</tspan></text><rect x="65.6" y="431.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="111.0" y="446.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="111.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="464.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="483.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">III</tspan></text><text x="175.0" y="483.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="175.0" dy="0">Rotura completa</tspan></text><text x="440.0" y="483.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="440.0" dy="0">Franca, con inestabilidad</tspan></text><text x="705.0" y="483.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="705.0" dy="0">Puede requerir reparación quirúrgica</tspan></text><text x="40.0" y="509.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">El esguince de tobillo con puntos de Ottawa positivos necesita radiografía.</tspan></text><text x="40.0" y="556.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="566.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="605.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="569.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="588.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Roturas parciales</tspan><tspan x="285.0" dy="17">con posible</tspan><tspan x="285.0" dy="17">inestabilidad</tspan></text><text x="435.0" y="597.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Estiramientos sin</tspan><tspan x="435.0" dy="17">inestabilidad</tspan></text><text x="585.0" y="597.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Roturas completas</tspan><tspan x="585.0" dy="17">con inestabilidad</tspan></text><text x="735.0" y="588.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Roturas completas</tspan><tspan x="735.0" dy="17">y síndrome</tspan><tspan x="735.0" dy="17">compartimental</tspan></text><text x="885.0" y="588.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Estiramientos y</tspan><tspan x="885.0" dy="17">síndrome</tspan><tspan x="885.0" dy="17">compartimental</tspan></text><rect x="40.0" y="637.0" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="637.0" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="682.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Grado II?</tspan></text><text x="285.0" y="674.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: rotura parcial, con</tspan><tspan x="285.0" dy="16">posible inestabilidad</tspan></text><text x="435.0" y="682.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es el grado I</tspan></text><text x="585.0" y="682.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es el grado III</tspan></text><text x="735.0" y="658.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: el síndrome</tspan><tspan x="735.0" dy="16">compartimental no</tspan><tspan x="735.0" dy="16">forma parte de la</tspan><tspan x="735.0" dy="16">clasificación</tspan></text><text x="885.0" y="658.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: el síndrome</tspan><tspan x="885.0" dy="16">compartimental no</tspan><tspan x="885.0" dy="16">forma parte de la</tspan><tspan x="885.0" dy="16">clasificación</tspan></text><rect x="40.0" y="566.0" width="920.0" height="153.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="743.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="771.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="793.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Grado I: estiramiento con microrroturas, dolor y edema leves, sin laxitud y con tope firme.</tspan><tspan x="58.0" dy="18">• Grado II: rotura parcial, con dolor, edema y equimosis moderados, pérdida de función y laxitud leve a moderada con tope blando.</tspan><tspan x="58.0" dy="18">• Grado III: rotura completa, laxitud franca e inestabilidad; puede doler menos que el II porque se interrumpen las fibras nerviosas.</tspan><tspan x="58.0" dy="18">• Los grados I y II se tratan de forma funcional (reposo relativo, hielo, compresión, elevación, ortesis y rehabilitación precoz); el III puede requerir cirugía.</tspan><tspan x="58.0" dy="18">   Puntos de Ottawa positivos: radiografía.</tspan></text><text x="58.0" y="887.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Lateral Ankle Ligament Sprains Revision 2021. J Orthop Sports Phys Ther 2021;51:CPG1-CPG80; Current Concept Review: Acute Lateral Ankle Injury Classification</tspan><tspan x="58.0" dy="15">Systems. J Foot Ankle Surg 2023.</tspan></text></svg>