ont-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">EXPOSICIÓN OCUPACIONAL</tspan></text><text x="188.7" y="605.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Lavar con agua y jabón</tspan><tspan x="188.7" dy="17">Reportar y evaluar la fuente</tspan></text><rect x="351.3" y="554.5" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="591.3" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Sin riesgo</tspan></text><text x="500.0" y="614.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Solo curación</tspan></text><rect x="662.7" y="415.0" width="297.3" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Exposición no ocupacional</tspan></text><text x="811.3" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Sexual o por otras vías</tspan></text><text x="40.0" y="688.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CONDUCTA</tspan></text><rect x="40.0" y="698.9" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="721.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="701.9" width="369.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="397.5" y="721.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="355"><tspan x="397.5" dy="0">Hacer</tspan></text><text x="772.5" y="721.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="355"><tspan x="772.5" dy="0">No hacer</tspan></text><rect x="40.0" y="735.9" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="735.9" width="369.0" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="756.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Herida</tspan></text><text x="397.5" y="756.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="353"><tspan x="397.5" dy="0">Lavar con agua y jabón</tspan></text><text x="772.5" y="756.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="353"><tspan x="772.5" dy="0">Exprimir o usar lejía</tspan></text><rect x="40.0" y="769.9" width="920.0" height="34.0" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="769.9" width="369.0" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="790.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">VIH</tspan></text><text x="397.5" y="790.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="353"><tspan x="397.5" dy="0">TAR 28 días si la fuente es de riesgo</tspan></text><text x="772.5" y="790.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="353"><tspan x="772.5" dy="0">Esperar el resultado de la fuente</tspan></text><rect x="40.0" y="698.9" width="920.0" height="105.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="827.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="855.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="877.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Iniciar la profilaxis idealmente en las primeras 2 horas.</tspan><tspan x="58.0" dy="18">• Pruebas basales de VIH, VHB y VHC al trabajador.</tspan><tspan x="58.0" dy="18">• Vacunar contra hepatitis B al personal de salud.</tspan></text><text x="58.0" y="935.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA – NTS 204: Profilaxis posexposición al VIH (2023) · CDC (2025)</tspan></text></svg>