<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="929" viewBox="0 0 1000 929" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Para suplementar vitamina D en un anciano con dolores musculares y fracturas, la forma adecuada es el colecalciferol (vitamina D3)"><title>Para suplementar vitamina D en un anciano con dolores musculares y fracturas, la forma adecuada es el colecalciferol (vitamina D3)</title><rect x="0.75" y="0.75" width="998.5" height="927.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Vitamina D · osteoporosis</tspan></text><rect x="353.6" y="32.0" width="155.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="431.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="139"><tspan x="431.2" dy="0">ENDOCRINOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="148.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Formas de la vitamina D</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Colecalciferol (D3): la forma nutricional; el hígado la convierte en 25-OH-D (reserva) y el</tspan><tspan x="58.0" dy="17">riñón en 1,25-(OH)₂-D (activa) según la necesidad.</tspan><tspan x="58.0" dy="17">Calcitriol (forma activa): solo si el riñón no la activa (ERC avanzada, hipoparatiroidismo); da</tspan><tspan x="58.0" dy="17">más hipercalcemia.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="148.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="146.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 76 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dolores musculares y fracturas por fragilidad.</tspan><tspan x="640.0" dy="16">Se indica suplemento de vitamina D.</tspan></text><rect x="640.0" y="209.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="222.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="222.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="270.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DE LA VITAMINA D3 A LA FORMA ACTIVA</tspan></text><text x="40.0" y="294.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="430"><tspan x="40.0" dy="0">PASO</tspan></text><text x="516.0" y="294.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="444"><tspan x="516.0" dy="0">PARA QUÉ</tspan></text><rect x="40.0" y="304.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="333.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="338.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><text x="84.0" y="330.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Colecalciferol (D3)</tspan></text><text x="84.0" y="347.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Piel con sol o suplemento</tspan></text><line x1="476.0" y1="333.5" x2="503.0" y2="333.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,328.5 502.0,338.5 510.0,333.5" fill="#ea580c"/><rect x="516.0" y="306.0" width="444.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="530.0" y="330.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Lo que se indica</tspan></text><text x="530.0" y="347.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Este caso</tspan></text><line x1="255.0" y1="365.0" x2="255.0" y2="378.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,377.0 260.0,377.0 255.0,385.0" fill="#0f766e"/><rect x="40.0" y="387.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="416.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="421.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">2</tspan></text><text x="84.0" y="413.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Hígado: 25-OH-D (calcidiol)</tspan></text><text x="84.0" y="430.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">La reserva; la que se mide</tspan></text><line x1="476.0" y1="416.5" x2="503.0" y2="416.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,411.5 502.0,421.5 510.0,416.5" fill="#ea580c"/><rect x="516.0" y="389.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="413.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Meta ≥ 30 ng/mL</tspan></text><text x="530.0" y="430.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0"></tspan></text><line x1="255.0" y1="448.0" x2="255.0" y2="461.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,460.0 260.0,460.0 255.0,468.0" fill="#0f766e"/><rect x="40.0" y="470.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="499.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="504.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">3</tspan></text><text x="84.0" y="496.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Riñón: 1,25-(OH)₂-D (calcitriol)</tspan></text><text x="84.0" y="513.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Forma activa, regulada por PTH</tspan></text><line x1="476.0" y1="499.5" x2="503.0" y2="499.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,494.5 502.0,504.5 510.0,499.5" fill="#ea580c"/><rect x="516.0" y="472.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="496.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Absorbe calcio en el intestino</tspan></text><text x="530.0" y="513.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Fortalece el hueso</tspan></text><rect x="40.0" y="547.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="573.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Colecalciferol</tspan></text><text x="60.0" y="592.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El cuerpo lo activa según lo que necesita; menos hipercalcemia que el calcitriol.</tspan></text><text x="40.0" y="659.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="669.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="691.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="691.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Calcitriol</tspan></text><text x="435.0" y="691.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Teriparatide</tspan></text><text x="585.0" y="691.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Cinacalcet</tspan></text><rect x="663.0" y="672.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="691.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Colecalciferol</tspan></text><text x="885.0" y="691.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Calcitonina</tspan></text><rect x="40.0" y="706.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="706.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="735.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Forma adecuada?</tspan></text><text x="285.0" y="727.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Solo si el riñón no</tspan><tspan x="285.0" dy="16">activa</tspan></text><text x="435.0" y="727.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es anabólico de</tspan><tspan x="435.0" dy="16">hueso, no vitamina D</tspan></text><text x="585.0" y="727.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es para</tspan><tspan x="585.0" dy="16">hiperparatiroidismo</tspan></text><text x="735.0" y="727.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: vitamina D</tspan><tspan x="735.0" dy="16">nutricional</tspan></text><text x="885.0" y="735.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es otra hormona</tspan></text><rect x="40.0" y="669.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="780.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="808.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="830.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Colecalciferol 800-2000 UI/día (o dosis de carga si 25-OH-D &lt; 20 ng/mL) + calcio de la dieta.</tspan><tspan x="58.0" dy="18">• Medir 25-OH-D; meta ≥ 30 ng/mL.</tspan><tspan x="58.0" dy="18">• Tratar la osteoporosis: bisfosfonato (alendronato, zoledronato) tras corregir la vitamina D.</tspan></text><text x="58.0" y="888.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Endocrine Society, vitamina D (2024); AACE, osteoporosis (2020).</tspan></text></svg>