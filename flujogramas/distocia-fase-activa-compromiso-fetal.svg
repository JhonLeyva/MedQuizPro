<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1123" viewBox="0 0 1000 1123" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Fase activa detenida 6 horas en 6 cm con desaceleraciones: cesárea"><title>Fase activa detenida 6 horas en 6 cm con desaceleraciones: cesárea</title><rect x="0.75" y="0.75" width="998.5" height="1121.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Distocias · trabajo de parto detenido</tspan></text><rect x="415.3" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="502.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="502.5" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Detención de la fase activa</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La fase activa empieza a los 6 cm (OMS 2018, ACOG).</tspan><tspan x="58.0" dy="17">Detención: sin cambio por ≥ 4 h con contracciones adecuadas o ≥ 6 h si son inadecuadas,</tspan><tspan x="58.0" dy="17">con membranas rotas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante a término, fase activa</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">6 cm sin avance por 6 horas, membranas íntegras.</tspan><tspan x="640.0" dy="16">Contracciones 3 en 10 minutos de 40 segundos;</tspan><tspan x="640.0" dy="16">desaceleraciones de la FCF.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="577.8" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="577.8" y1="271.0" x2="577.8" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="572.8,299.0 582.8,299.0 577.8,307.0" fill="#94a3b8"/><line x1="577.8" y1="377.0" x2="577.8" y2="407.0" stroke="#94a3b8" stroke-width="2"/><line x1="344.3" y1="407.0" x2="811.3" y2="407.0" stroke="#94a3b8" stroke-width="2"/><line x1="344.3" y1="407.0" x2="344.3" y2="436.0" stroke="#94a3b8" stroke-width="2"/><polygon points="339.3,435.0 349.3,435.0 344.3,443.0" fill="#94a3b8"/><line x1="811.3" y1="407.0" x2="811.3" y2="436.0" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,435.0 816.3,435.0 811.3,443.0" fill="#94a3b8"/><line x1="344.3" y1="516.5" x2="344.3" y2="546.5" stroke="#94a3b8" stroke-width="2"/><line x1="344.3" y1="546.5" x2="344.3" y2="575.5" stroke="#94a3b8" stroke-width="2"/><polygon points="339.3,574.5 349.3,574.5 344.3,582.5" fill="#94a3b8"/><line x1="344.3" y1="640.5" x2="344.3" y2="670.5" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="670.5" x2="500.0" y2="670.5" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="670.5" x2="188.7" y2="699.5" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,698.5 193.7,698.5 188.7,706.5" fill="#94a3b8"/><line x1="500.0" y1="670.5" x2="500.0" y2="699.5" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,698.5 505.0,698.5 500.0,706.5" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="577.8" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="577.8" y1="271.0" x2="577.8" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="572.8,299.0 582.8,299.0 577.8,307.0" fill="#0f766e"/><line x1="577.8" y1="377.0" x2="577.8" y2="407.0" stroke="#0f766e" stroke-width="3"/><line x1="344.3" y1="407.0" x2="577.8" y2="407.0" stroke="#0f766e" stroke-width="3"/><line x1="344.3" y1="407.0" x2="344.3" y2="436.0" stroke="#0f766e" stroke-width="3"/><polygon points="339.3,435.0 349.3,435.0 344.3,443.0" fill="#0f766e"/><line x1="344.3" y1="516.5" x2="344.3" y2="546.5" stroke="#0f766e" stroke-width="3"/><line x1="344.3" y1="546.5" x2="344.3" y2="575.5" stroke="#0f766e" stroke-width="3"/><polygon points="339.3,574.5 349.3,574.5 344.3,582.5" fill="#0f766e"/><line x1="344.3" y1="640.5" x2="344.3" y2="670.5" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="670.5" x2="344.3" y2="670.5" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="670.5" x2="188.7" y2="699.5" stroke="#0f766e" stroke-width="3"/><polygon points="183.7,698.5 193.7,698.5 188.7,706.5" fill="#0f766e"/><rect x="256.8" y="416.0" width="175.1" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="344.3" y="428.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="344.3" dy="0">Sí: 6 cm por 6 horas (este caso)</tspan></text><rect x="797.2" y="416.0" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="811.3" y="428.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">No</tspan></text><rect x="147.2" y="679.5" width="83.0" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="188.7" y="692.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">Sí (este caso)</tspan></text><rect x="485.9" y="679.5" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="500.0" y="692.0" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">No</tspan></text><polygon points="317.8,342.0 343.8,307.0 811.8,307.0 837.8,342.0 811.8,377.0 343.8,377.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="363.8" cy="342.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="363.8" y="347.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="363.8" dy="0">?</tspan></text><text x="596.8" y="338.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="596.8" dy="0">¿Dilatación ≥ 6 cm sin cambios ≥ 4 h (o ≥ 6 h con</tspan><tspan x="596.8" dy="17">contracciones débiles)?</tspan></text><rect x="84.3" y="443.0" width="520.0" height="73.5" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><text x="344.3" y="471.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="492"><tspan x="344.3" dy="0">Detención de la fase activa</tspan></text><text x="344.3" y="494.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="492"><tspan x="344.3" dy="0">Evaluar bienestar fetal</tspan></text><rect x="84.3" y="443.0" width="520.0" height="73.5" rx="10" fill="none" stroke="#0f766e" stroke-width="2.2"/><polygon points="84.3,611.5 110.3,582.5 578.3,582.5 604.3,611.5 578.3,640.5 110.3,640.5" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="130.3" cy="611.5" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="130.3" y="616.5" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="130.3" dy="0">?</tspan></text><text x="363.3" y="616.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="363.3" dy="0">¿Desaceleraciones o registro no tranquilizador?</tspan></text><rect x="40.0" y="706.5" width="297.3" height="73.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="188.7" y="734.8" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">CESÁREA</tspan></text><text x="188.7" y="757.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Reanimación intrauterina mientras se prepara</tspan></text><rect x="351.3" y="706.5" width="297.3" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="734.8" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Amniotomía y oxitocina</tspan></text><text x="500.0" y="757.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Reevaluar en 2-4 horas</tspan></text><rect x="662.7" y="443.0" width="297.3" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="471.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Progreso normal</tspan></text><text x="811.3" y="494.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Vigilancia con partograma</tspan></text><text x="40.0" y="819.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="829.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="860.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="832.9" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="860.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Cesárea</tspan></text><text x="435.0" y="852.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Decúbito lateral</tspan><tspan x="435.0" dy="17">derecho</tspan></text><text x="585.0" y="852.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Realizar</tspan><tspan x="585.0" dy="17">amniotomía</tspan></text><text x="735.0" y="852.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Acentuar con</tspan><tspan x="735.0" dy="17">oxitocina</tspan></text><text x="885.0" y="852.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Esperar dilatación</tspan><tspan x="885.0" dy="17">completa</tspan></text><rect x="40.0" y="883.9" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="883.9" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="920.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Adecuada?</tspan></text><text x="285.0" y="912.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: detención +</tspan><tspan x="285.0" dy="16">sufrimiento fetal</tspan></text><text x="435.0" y="904.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: si se cambia de</tspan><tspan x="435.0" dy="16">posición es al lado</tspan><tspan x="435.0" dy="16">izquierdo</tspan></text><text x="585.0" y="912.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no corrige el riesgo</tspan><tspan x="585.0" dy="16">fetal</tspan></text><text x="735.0" y="904.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: la oxitocina</tspan><tspan x="735.0" dy="16">empeora las</tspan><tspan x="735.0" dy="16">desaceleraciones</tspan></text><text x="885.0" y="920.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: 6 h sin avance</tspan></text><rect x="40.0" y="829.9" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="973.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1001.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1023.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Detención de la dilatación + desaceleraciones (bienestar fetal no tranquilizador) = cesárea.</tspan><tspan x="58.0" dy="18">• Si el feto estuviera bien, antes de llamarla detención se rompen membranas y se refuerzan contracciones con oxitocina.</tspan><tspan x="58.0" dy="18">• Ante desaceleraciones: decúbito lateral izquierdo, suspender oxitocina, oxígeno si hay hipoxemia materna y evaluar el registro.</tspan></text><text x="58.0" y="1081.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, Obstetric Care Consensus n.º 1 (2014, reafirmado); OMS, recomendaciones de cuidados intraparto (2018); Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>