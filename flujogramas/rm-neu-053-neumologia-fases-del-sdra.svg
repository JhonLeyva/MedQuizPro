<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1067" viewBox="0 0 1000 1067" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la fase exudativa del SDRA se altera la producción de tensoactivo y se colapsan los alvéolos"><title>En la fase exudativa del SDRA se altera la producción de tensoactivo y se colapsan los alvéolos</title><rect x="0.75" y="0.75" width="998.5" height="1065.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neumología · fases del SDRA</tspan></text><rect x="374.3" y="32.0" width="114.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="431.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="99"><tspan x="431.8" dy="0">NEUMOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="131.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Síndrome de distrés respiratorio agudo</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Definición de Berlín: inicio en la primera semana, opacidades bilaterales, edema no</tspan><tspan x="58.0" dy="17">cardiogénico y PaO2/FiO2 menor de 300 con PEEP de 5 o más.</tspan><tspan x="58.0" dy="17">Evoluciona en tres fases.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="131.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="129.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué ocurre en la primera fase del SDRA?</tspan></text><rect x="640.0" y="192.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="205.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="205.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="253.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LAS TRES FASES DEL SDRA</tspan></text><rect x="42.0" y="275.0" width="302.7" height="56.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="193.3" y="300.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">DÍAS 1 A 7</tspan></text><text x="193.3" y="319.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">Fase exudativa</tspan></text><rect x="348.7" y="275.0" width="302.7" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="500.0" y="300.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">DÍAS 7 A 21</tspan></text><text x="500.0" y="319.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">Fase proliferativa</tspan></text><rect x="655.3" y="275.0" width="302.7" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="806.7" y="300.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">DESPUÉS</tspan></text><text x="806.7" y="319.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">Fase fibrótica</tspan></text><rect x="147.9" y="264.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="193.3" y="279.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="193.3" dy="0">◆ ESTE CASO</tspan></text><rect x="48.0" y="345.0" width="290.7" height="108.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="193.3" y="373.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">FALLA EL SURFACTANTE</tspan></text><text x="193.3" y="397.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">Daño de neumocitos I y II</tspan><tspan x="193.3" dy="17">Edema rico en proteínas y membranas</tspan><tspan x="193.3" dy="17">hialinas</tspan></text><rect x="354.7" y="345.0" width="290.7" height="108.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="382.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">REPARACIÓN</tspan></text><text x="500.0" y="406.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">Hiperplasia de neumocitos tipo II</tspan><tspan x="500.0" dy="17">Reparación epitelial</tspan></text><rect x="661.3" y="345.0" width="290.7" height="108.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="806.7" y="382.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">FIBROSIS</tspan></text><text x="806.7" y="406.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">Proliferación de fibroblastos</tspan><tspan x="806.7" dy="17">Depósito de colágeno</tspan></text><text x="40.0" y="487.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">GRAVEDAD DEL SDRA SEGÚN LA DEFINICIÓN DE BERLÍN (PEEP DE 5 CMH2O O MÁS)</tspan></text><rect x="40.0" y="499.2" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="518.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Gravedad</tspan></text><text x="260.0" y="518.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">PaO2/FiO2</tspan></text><text x="615.0" y="518.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Mortalidad</tspan></text><rect x="40.0" y="528.2" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="547.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Leve</tspan></text><text x="260.0" y="547.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">200 a 300</tspan></text><text x="615.0" y="547.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">27 %</tspan></text><rect x="40.0" y="557.2" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="576.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Moderada</tspan></text><text x="260.0" y="576.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">100 a 200</tspan></text><text x="615.0" y="576.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">32 %</tspan></text><rect x="40.0" y="586.2" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="605.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Grave</tspan></text><text x="260.0" y="605.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Menos de 100</tspan></text><text x="615.0" y="605.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">45 %</tspan></text><text x="40.0" y="631.2" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Ventilación protectora con 6 mL/kg y presión meseta &lt; 30 cmH2O; prono más de 12 horas en la forma grave (ARDS Definition Task Force, JAMA 2012).</tspan></text><text x="40.0" y="678.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="688.2" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="727.7" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="719.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Fibrosis intersticial</tspan><tspan x="285.0" dy="17">con colágeno</tspan></text><text x="435.0" y="719.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Proliferación de</tspan><tspan x="435.0" dy="17">fibroblastos</tspan></text><text x="585.0" y="719.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Hiperplasia de</tspan><tspan x="585.0" dy="17">neumocitos tipo II</tspan></text><text x="735.0" y="710.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Presión capilar</tspan><tspan x="735.0" dy="17">elevada por falla</tspan><tspan x="735.0" dy="17">izquierda</tspan></text><rect x="813.0" y="691.2" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="710.7" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Pérdida de la</tspan><tspan x="885.0" dy="17">producción de</tspan><tspan x="885.0" dy="17">tensoactivo</tspan></text><rect x="40.0" y="759.2" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="759.2" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="788.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué ocurre en la</tspan><tspan x="54.0" dy="16">primera fase?</tspan></text><text x="285.0" y="788.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es de la fase</tspan><tspan x="285.0" dy="16">fibrótica</tspan></text><text x="435.0" y="788.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es de la fase</tspan><tspan x="435.0" dy="16">fibrótica tardía</tspan></text><text x="585.0" y="788.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es de la fase</tspan><tspan x="585.0" dy="16">proliferativa</tspan></text><text x="735.0" y="780.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: define el edema</tspan><tspan x="735.0" dy="16">cardiogénico, que</tspan><tspan x="735.0" dy="16">excluye SDRA</tspan></text><text x="885.0" y="788.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: el daño alveolar</tspan><tspan x="885.0" dy="16">altera el surfactante</tspan></text><rect x="40.0" y="688.2" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="849.2" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="877.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="899.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Fase exudativa (primeros 7 días): daño a la barrera alveolocapilar y a los neumocitos I y II; falla el surfactante, hay colapso, edema rico en proteínas y</tspan><tspan x="58.0" dy="18">   membranas hialinas.</tspan><tspan x="58.0" dy="18">• Fase proliferativa (días 7 a 21): hiperplasia de neumocitos tipo II. Fase fibrótica: fibroblastos y colágeno.</tspan><tspan x="58.0" dy="18">• Manejo: volumen corriente de 6 mL/kg de peso ideal, presión meseta &lt; 30 cmH2O, PEEP, prono más de 12 horas si es grave y dexametasona según</tspan><tspan x="58.0" dy="18">   guías recientes.</tspan><tspan x="58.0" dy="18">• Alerta: una presión capilar elevada por falla izquierda es criterio de exclusión del SDRA.</tspan></text><text x="58.0" y="1011.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Matthay MA et al., Acute respiratory distress syndrome (Nat Rev Dis Primers 2019); Fan E et al., ARDS: advances in diagnosis and treatment (JAMA 2018); Harrison,</tspan><tspan x="58.0" dy="15">21.ª ed. (2022).</tspan></text></svg>