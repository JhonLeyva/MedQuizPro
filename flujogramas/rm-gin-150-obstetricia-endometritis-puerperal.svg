<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1073" viewBox="0 0 1000 1073" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la endometritis puerperal el antibiótico parenteral se suspende tras 24 a 48 horas afebril y asintomática"><title>En la endometritis puerperal el antibiótico parenteral se suspende tras 24 a 48 horas afebril y asintomática</title><rect x="0.75" y="0.75" width="998.5" height="1071.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · endometritis puerperal</tspan></text><rect x="410.5" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="490.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="490.3" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Endometritis puerperal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección polimicrobiana de la decidua y el miometrio tras el parto.</tspan><tspan x="58.0" dy="17">Más frecuente tras cesárea, parto prolongado y corioamnionitis.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Paciente en tratamiento</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Endometritis puerperal con antibióticos endovenosos.</tspan><tspan x="640.0" dy="16">¿Cuántas horas afebril para suspenderlos?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL DIAGNÓSTICO A LA SUSPENSIÓN DEL ANTIBIÓTICO</tspan></text><text x="44.0" y="283.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">El último paso es el del caso: cuántas horas sin fiebre.</tspan></text><line x1="155.0" y1="322.0" x2="293.0" y2="322.0" stroke="#99f6e4" stroke-width="6"/><line x1="339.0" y1="322.0" x2="477.0" y2="322.0" stroke="#99f6e4" stroke-width="6"/><line x1="523.0" y1="322.0" x2="661.0" y2="322.0" stroke="#99f6e4" stroke-width="6"/><line x1="707.0" y1="322.0" x2="845.0" y2="322.0" stroke="#99f6e4" stroke-width="6"/><circle cx="132.0" cy="322.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="132.0" y="326.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="132.0" dy="0">1</tspan></text><rect x="45.0" y="356.0" width="174.0" height="92.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="132.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">Diagnóstico</tspan></text><text x="132.0" y="393.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">Fiebre 38 °C o más, dolor</tspan><tspan x="132.0" dy="16">uterino y loquios fétidos</tspan></text><circle cx="316.0" cy="322.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="316.0" y="326.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="316.0" dy="0">2</tspan></text><rect x="229.0" y="356.0" width="174.0" height="92.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="316.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">Clindamicina más</tspan><tspan x="316.0" dy="17">gentamicina</tspan></text><text x="316.0" y="410.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">Endovenosa; ampicilina si no</tspan><tspan x="316.0" dy="16">responde</tspan></text><circle cx="500.0" cy="322.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="326.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="500.0" dy="0">3</tspan></text><rect x="413.0" y="356.0" width="174.0" height="92.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">Evolución a las 48-72</tspan><tspan x="500.0" dy="17">horas</tspan></text><text x="500.0" y="410.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">Si no cede: absceso, restos o</tspan><tspan x="500.0" dy="16">tromboflebitis pélvica</tspan></text><circle cx="684.0" cy="322.0" r="22" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><text x="684.0" y="326.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="38"><tspan x="684.0" dy="0">4</tspan></text><rect x="597.0" y="356.0" width="174.0" height="92.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="684.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">Afebril y asintomática</tspan></text><text x="684.0" y="393.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">24 a 48 horas seguidas</tspan></text><rect x="650.5" y="437.0" width="67.1" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="684.0" y="452.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="684.0" dy="0">◆ 24-48 H</tspan></text><circle cx="868.0" cy="322.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="868.0" y="326.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="868.0" dy="0">5</tspan></text><rect x="781.0" y="356.0" width="174.0" height="92.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="868.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">Suspender</tspan></text><text x="868.0" y="393.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">Sin completar tratamiento oral</tspan></text><rect x="40.0" y="480.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="506.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Afebril 24 a 48 horas = suspender el antibiótico</tspan></text><text x="60.0" y="525.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Con menos de 12 horas la fiebre puede reaparecer; esperar 72-96 horas alarga la estancia.</tspan></text><text x="40.0" y="586.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ENDOMETRITIS PUERPERAL: FACTORES DE RIESGO Y ESQUEMA</tspan></text><rect x="40.0" y="598.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="617.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Aspecto</tspan></text><text x="250.0" y="617.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="704"><tspan x="250.0" dy="0">Contenido</tspan></text><rect x="40.0" y="627.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="646.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Factores de riesgo</tspan></text><text x="250.0" y="646.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="704"><tspan x="250.0" dy="0">Cesárea, trabajo de parto prolongado, rotura prolongada de membranas, corioamnionitis, manipulación intrauterina</tspan></text><rect x="40.0" y="656.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="675.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Esquema de elección</tspan></text><text x="250.0" y="675.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="704"><tspan x="250.0" dy="0">Clindamicina más gentamicina endovenosas; ampicilina añadida si no mejora</tspan></text><rect x="40.0" y="685.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="704.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Suspensión</tspan></text><text x="250.0" y="704.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="704"><tspan x="250.0" dy="0">Afebril y asintomática 24 a 48 horas; no requiere antibiótico oral posterior</tspan></text><rect x="140.6" y="688.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="186.0" y="703.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="186.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="754.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="764.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="786.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="767.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="786.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">24 a 48 horas</tspan></text><text x="435.0" y="786.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">8 a 12 horas</tspan></text><text x="585.0" y="786.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">72 a 96 horas</tspan></text><text x="735.0" y="786.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">4 a 6 horas</tspan></text><text x="885.0" y="786.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">12 a 20 horas</tspan></text><rect x="40.0" y="801.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="801.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="830.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Horas afebril para</tspan><tspan x="54.0" dy="16">suspender?</tspan></text><text x="285.0" y="830.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: criterio práctico y</tspan><tspan x="285.0" dy="16">de consenso</tspan></text><text x="435.0" y="830.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: la fiebre puede</tspan><tspan x="435.0" dy="16">reaparecer</tspan></text><text x="585.0" y="822.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: prolonga el</tspan><tspan x="585.0" dy="16">tratamiento y la</tspan><tspan x="585.0" dy="16">estancia</tspan></text><text x="735.0" y="838.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: insuficiente</tspan></text><text x="885.0" y="838.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: insuficiente</tspan></text><rect x="40.0" y="764.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="891.0" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="919.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="941.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Sospecha: fiebre de 38 °C o más, dolor uterino, subinvolución y loquios fétidos entre 24 horas y 6 semanas del puerperio.</tspan><tspan x="58.0" dy="18">• Esquema de elección: clindamicina más gentamicina endovenosas; se añade ampicilina si no responde, para cubrir enterococo.</tspan><tspan x="58.0" dy="18">• Se suspende tras 24 a 48 horas afebril y asintomática, sin completar tratamiento oral (Cochrane 2015). Menos de 12 horas es insuficiente.</tspan><tspan x="58.0" dy="18">• Alerta: fiebre persistente a las 48-72 horas con buen esquema: buscar absceso pélvico, restos retenidos o tromboflebitis pélvica séptica.</tspan></text><text x="58.0" y="1017.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Cochrane, Antibiotic regimens for postpartum endometritis (Cochrane Database Syst Rev 2015); ACOG, Practice Bulletin N.º 199 (2018); Williams Obstetricia, 26.ª ed.</tspan><tspan x="58.0" dy="15">(2022).</tspan></text></svg>