<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="978" viewBox="0 0 1000 978" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Lactante de 1 mes con hipoactividad, estreñimiento, piel áspera, fontanelas amplias e ictericia: hipotiroidismo congénito"><title>Lactante de 1 mes con hipoactividad, estreñimiento, piel áspera, fontanelas amplias e ictericia: hipotiroidismo congénito</title><rect x="0.75" y="0.75" width="998.5" height="976.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · hipotiroidismo congénito</tspan></text><rect x="412.5" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="461.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="461.6" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hipotiroidismo congénito</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">1 de cada 2000-3000 recién nacidos; la causa más frecuente es la disgenesia tiroidea.</tspan><tspan x="58.0" dy="17">Al nacer los signos son sutiles por la hormona materna.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 1 mes</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer con hipoactividad y estreñimiento.</tspan><tspan x="640.0" dy="16">Piel áspera, fontanelas amplias e ictericia.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL NACIMIENTO AL TRATAMIENTO: EL TIEMPO DECIDE EL PRONÓSTICO</tspan></text><text x="44.0" y="283.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Cada etapa y lo que corresponde hacer; el caso llega con 1 mes.</tspan></text><line x1="155.0" y1="322.0" x2="293.0" y2="322.0" stroke="#99f6e4" stroke-width="6"/><line x1="339.0" y1="322.0" x2="477.0" y2="322.0" stroke="#99f6e4" stroke-width="6"/><line x1="523.0" y1="322.0" x2="661.0" y2="322.0" stroke="#99f6e4" stroke-width="6"/><line x1="707.0" y1="322.0" x2="845.0" y2="322.0" stroke="#99f6e4" stroke-width="6"/><circle cx="132.0" cy="322.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="132.0" y="326.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="132.0" dy="0">Nacer</tspan></text><rect x="45.0" y="356.0" width="174.0" height="108.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="132.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">Signos sutiles</tspan></text><text x="132.0" y="393.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">La hormona materna que</tspan><tspan x="132.0" dy="16">cruza la placenta los</tspan><tspan x="132.0" dy="16">enmascara</tspan></text><circle cx="316.0" cy="322.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="316.0" y="326.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="316.0" dy="0">48 h-5 d</tspan></text><rect x="229.0" y="356.0" width="174.0" height="108.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="316.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">Tamizaje con TSH en talón</tspan></text><text x="316.0" y="393.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">Detecta al niño antes de que</tspan><tspan x="316.0" dy="16">aparezcan los signos</tspan></text><circle cx="500.0" cy="322.0" r="22" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><text x="500.0" y="326.5" font-size="9.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="38"><tspan x="500.0" dy="0">1 mes</tspan></text><rect x="413.0" y="356.0" width="174.0" height="108.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="500.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">Ictericia, estreñimiento,</tspan><tspan x="500.0" dy="17">hipoactividad</tspan></text><text x="500.0" y="410.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">Aquí llega el caso: piel áspera</tspan><tspan x="500.0" dy="16">y fontanelas amplias</tspan></text><rect x="408.3" y="453.0" width="183.4" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="500.0" y="468.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">◆ CASO: SIN TAMIZAJE PREVIO</tspan></text><circle cx="684.0" cy="322.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="684.0" y="326.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="684.0" dy="0">Dx</tspan></text><rect x="597.0" y="356.0" width="174.0" height="108.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="684.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">TSH alta y T4 libre baja</tspan></text><text x="684.0" y="393.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">Pedir ambas y no esperar para</tspan><tspan x="684.0" dy="16">tratar</tspan></text><circle cx="868.0" cy="322.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="868.0" y="326.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="868.0" dy="0">Tratar</tspan></text><rect x="781.0" y="356.0" width="174.0" height="108.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="868.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">Levotiroxina 10-15</tspan><tspan x="868.0" dy="17">µg/kg/día</tspan></text><text x="868.0" y="410.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">Idealmente en las 2-3</tspan><tspan x="868.0" dy="16">primeras semanas: evita el</tspan><tspan x="868.0" dy="16">daño neurológico</tspan></text><rect x="40.0" y="496.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="522.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Hipoactividad, estreñimiento, piel áspera, fontanelas amplias e ictericia = hipotiroidismo congénito</tspan></text><text x="60.0" y="541.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Se trata sin demora con levotiroxina.</tspan></text><text x="40.0" y="608.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="618.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="649.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="649.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Citomegalovirus</tspan></text><text x="435.0" y="649.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Síndrome de Down</tspan></text><rect x="513.0" y="621.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="640.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Hipotiroidismo</tspan><tspan x="585.0" dy="17">congénito</tspan></text><text x="735.0" y="649.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Parálisis cerebral</tspan></text><text x="885.0" y="649.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Fenilcetonuria</tspan></text><rect x="40.0" y="672.0" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="672.0" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="717.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="701.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: da microcefalia,</tspan><tspan x="285.0" dy="16">calcificaciones y</tspan><tspan x="285.0" dy="16">hepatoesplenomegalia</tspan></text><text x="435.0" y="709.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: tiene fenotipo</tspan><tspan x="435.0" dy="16">característico</tspan></text><text x="585.0" y="693.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: ictericia,</tspan><tspan x="585.0" dy="16">estreñimiento,</tspan><tspan x="585.0" dy="16">hipoactividad y piel</tspan><tspan x="585.0" dy="16">áspera</tspan></text><text x="735.0" y="701.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no explica la piel</tspan><tspan x="735.0" dy="16">áspera ni el</tspan><tspan x="735.0" dy="16">estreñimiento</tspan></text><text x="885.0" y="701.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: da retraso y olor a</tspan><tspan x="885.0" dy="16">ratón sin signos</tspan><tspan x="885.0" dy="16">tiroideos</tspan></text><rect x="40.0" y="618.0" width="920.0" height="136.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="778.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="806.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="828.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Signos: ictericia prolongada (más de 2 semanas), hipoactividad, succión débil, estreñimiento, llanto ronco, macroglosia, hernia umbilical, piel seca y</tspan><tspan x="58.0" dy="18">   fontanelas amplias.</tspan><tspan x="58.0" dy="18">• Tamizaje neonatal con TSH en talón entre las 48 horas y los 5 días (NTS 154-2019). Confirmación: TSH alta y T4 libre baja (ENDO-ERN 2021).</tspan><tspan x="58.0" dy="18">• Tratamiento: levotiroxina 10-15 µg/kg/día; si no se inicia en las primeras 2-3 semanas hay daño neurológico irreversible.</tspan><tspan x="58.0" dy="18">• Diferenciales: CMV congénito (microcefalia, calcificaciones), Down (fenotipo propio), fenilcetonuria (olor a ratón, sin signos tiroideos).</tspan></text><text x="58.0" y="922.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ENDO-ERN, Congenital hypothyroidism: 2020-2021 consensus guidelines update (Thyroid 2021;31:387-419); MINSA, NTS 154-MINSA/2019/DGIESP (RM</tspan><tspan x="58.0" dy="15">558-2019/MINSA); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>