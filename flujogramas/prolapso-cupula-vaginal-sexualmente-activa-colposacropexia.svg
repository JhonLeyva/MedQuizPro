<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1408" viewBox="0 0 1000 1408" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Prolapso de cúpula vaginal en mujer sexualmente activa: colposacropexia"><title>Prolapso de cúpula vaginal en mujer sexualmente activa: colposacropexia</title><rect x="0.75" y="0.75" width="998.5" height="1406.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Prolapso de órganos pélvicos · prolapso apical</tspan></text><rect x="478.2" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="565.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="565.4" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Prolapso de cúpula vaginal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tras una histerectomía, el fondo de la vagina desciende.</tspan><tspan x="58.0" dy="17">La técnica depende de si la paciente quiere conservar la vagina funcional.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 60 años, sexualmente activa</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Histerectomía abdominal hace 15 años.</tspan><tspan x="640.0" dy="16">Prolapso estadio IV: cúpula a +7 cm.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿QUÉ TÉCNICA PESA MÁS EN ESTA PACIENTE?</tspan></text><rect x="493.0" y="319.0" width="14" height="190" rx="5" fill="#64748b"/><path d="M440.0 524.0 H560.0 L540.0 504.0 H460.0 Z" fill="#475569"/><circle cx="500.0" cy="319.0" r="11" fill="#f59e0b" stroke="#92400e" stroke-width="2"/><line x1="385.4" y1="337.1" x2="614.6" y2="300.9" stroke="#334155" stroke-width="7" stroke-linecap="round"/><line x1="385.4" y1="337.1" x2="357.4" y2="399.1" stroke="#64748b" stroke-width="2"/><line x1="385.4" y1="337.1" x2="413.4" y2="399.1" stroke="#64748b" stroke-width="2"/><path d="M347.4 399.1 H423.4 Q385.4 443.1 347.4 399.1 Z" fill="#ea580c"/><text x="385.4" y="414.1" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="385.4" dy="0">elige</tspan></text><line x1="614.6" y1="300.9" x2="586.6" y2="362.9" stroke="#64748b" stroke-width="2"/><line x1="614.6" y1="300.9" x2="642.6" y2="362.9" stroke="#64748b" stroke-width="2"/><path d="M576.6 362.9 H652.6 Q614.6 406.9 576.6 362.9 Z" fill="#64748b"/><text x="614.6" y="377.9" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="614.6" dy="0">no</tspan></text><text x="500.0" y="551.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="300"><tspan x="500.0" dy="0">Prolapso de cúpula estadio IV, vida sexual activa</tspan></text><rect x="40.0" y="289.0" width="290.0" height="148.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><text x="58.0" y="317.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="254"><tspan x="58.0" dy="0">Colposacropexia laparoscópica</tspan></text><circle cx="62.0" cy="342.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="346.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Fija el ápice vaginal al promontorio con</tspan><tspan x="74.0" dy="16">malla</tspan></text><circle cx="62.0" cy="384.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="388.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Conserva la vagina funcional</tspan></text><circle cx="62.0" cy="410.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="414.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Muy duradera para el prolapso apical</tspan></text><rect x="214.6" y="278.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="260.0" y="293.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="260.0" dy="0">◆ ESTE CASO</tspan></text><rect x="670.0" y="289.0" width="290.0" height="132.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="688.0" y="317.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="688.0" dy="0">Colpocleisis total</tspan></text><circle cx="692.0" cy="342.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="346.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Cierra el canal vaginal</tspan></text><circle cx="692.0" cy="368.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="372.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Impide las relaciones sexuales</tspan></text><circle cx="692.0" cy="394.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="398.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Ideal en mujeres mayores sin vida sexual</tspan></text><rect x="40.0" y="585.0" width="920.0" height="76.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="613.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Colposacropexia laparoscópica</tspan></text><text x="500.0" y="634.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">La colporrafia sola no corrige el defecto apical.</tspan></text><text x="40.0" y="701.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="713.0" width="348.0" height="368.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="723.0" width="151.3" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="737.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="306"><tspan x="61.0" dy="0">QUÉ CORRIGE LA MALLA</tspan></text><g data-box="54.0 751.0 320.0 306.0"><g transform="translate(54.0,751.0) scale(1.0)"><ellipse cx="58" cy="170" rx="16" ry="30" fill="#e7e5e4" stroke="#a8a29e" stroke-width="2" transform="rotate(20 58 170)" /><path d="M246 20 C300 70 300 170 250 236 L236 226 C280 164 278 76 232 32 Z" fill="#e7e5e4" stroke="#a8a29e" stroke-width="2" stroke-linejoin="round" /><text x="40" y="214" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">pubis</text><text x="298" y="250" font-size="10" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">sacro</text><line x1="20" y1="262" x2="300" y2="262" stroke="#e9b48f" stroke-width="3"/><text x="24" y="256" font-size="10" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">periné</text><path d="M252 40 C262 110 236 170 204 206 C190 222 182 240 178 262" fill="none" stroke="#fcd34d" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/><path d="M252 40 C262 110 236 170 204 206 C190 222 182 240 178 262" fill="none" stroke="#d97706" stroke-width="2" stroke-linejoin="round" /><path d="M150 230 C142 244 136 254 128 262" fill="none" stroke="#f9a8d4" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/><path d="M150 230 C142 244 136 254 128 262" fill="none" stroke="#be185d" stroke-width="1.5" stroke-linejoin="round" /><path d="M78 110 C74 70 140 62 146 104 C150 136 132 150 108 150 C88 150 80 132 78 110 Z" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" stroke-linejoin="round" /><ellipse cx="130" cy="274" rx="26" ry="12" fill="#f9a8d4" stroke="#be185d" stroke-width="2" /><text x="160" y="300" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">cúpula vaginal evertida (sin útero)</text><text x="160" y="300" font-size="10.5" font-weight="800" fill="#9d174d" text-anchor="middle" data-max="0">cúpula vaginal evertida (sin útero)</text><path d="M150 232 C200 200 240 130 256 96" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-dasharray="6 3"/><text x="196" y="128" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">malla al promontorio</text><text x="196" y="128" font-size="10.5" font-weight="800" fill="#1d4ed8" text-anchor="start" data-max="0">malla al promontorio</text></g></g><rect x="410.0" y="713.0" width="550.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="428.0" cy="728.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="428.0" y="732.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="428.0" dy="0">1</tspan></text><text x="446.0" y="733.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="506"><tspan x="446.0" dy="0">Sin útero, la cúpula vaginal se evierte fuera del introito.</tspan></text><rect x="410.0" y="751.0" width="550.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="428.0" cy="766.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="428.0" y="770.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="428.0" dy="0">2</tspan></text><text x="446.0" y="771.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="506"><tspan x="446.0" dy="0">La malla (azul) sube el ápice y lo fija al promontorio sacro.</tspan></text><rect x="410.0" y="789.0" width="550.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="428.0" cy="804.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="428.0" y="808.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="428.0" dy="0">3</tspan></text><text x="446.0" y="809.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="506"><tspan x="446.0" dy="0">Así la vagina conserva longitud y eje.</tspan></text><text x="40.0" y="1121.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1131.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1162.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="1162.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Colpocleisis</tspan></text><text x="491.2" y="1153.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Colpoperineoplastía</tspan><tspan x="491.2" dy="17">anterior</tspan></text><rect x="588.0" y="1134.0" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="678.8" y="1162.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Colposacropexia</tspan></text><text x="866.2" y="1162.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Colporrafia ant. y post.</tspan></text><rect x="40.0" y="1185.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="588.0" y="1185.0" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1206.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Corrige el ápice y</tspan><tspan x="54.0" dy="16">conserva la vagina?</tspan></text><text x="303.8" y="1214.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No: la cierra</tspan></text><text x="491.2" y="1214.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No: no corrige el ápice</tspan></text><text x="678.8" y="1214.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Sí</tspan></text><text x="866.2" y="1214.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No: no corrige el ápice</tspan></text><rect x="40.0" y="1131.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1259.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1287.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1309.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Prolapso de cúpula grave en mujer sexualmente activa: colposacropexia (malla del ápice vaginal al promontorio).</tspan><tspan x="58.0" dy="18">• Conserva la longitud y el eje de la vagina.</tspan><tspan x="58.0" dy="18">• Colpocleisis: solo en mujeres sin deseo de vida sexual (cierra la vagina).</tspan></text><text x="58.0" y="1367.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG n.º 214 (2019); Te Linde Ginecología Quirúrgica 12.ª ed.</tspan></text></svg>