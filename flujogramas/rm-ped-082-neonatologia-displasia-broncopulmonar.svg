<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1326" viewBox="0 0 1000 1326" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Prematuro con membrana hialina, un mes de ventilación y dependencia de oxígeno: displasia broncopulmonar"><title>Prematuro con membrana hialina, un mes de ventilación y dependencia de oxígeno: displasia broncopulmonar</title><rect x="0.75" y="0.75" width="998.5" height="1324.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neonatología · displasia broncopulmonar</tspan></text><rect x="444.7" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="493.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="493.7" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Displasia broncopulmonar</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hoy llamada enfermedad pulmonar crónica del prematuro.</tspan><tspan x="58.0" dy="17">Requiere oxígeno o soporte respiratorio a las 36 semanas de edad posmenstrual.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 5 meses prematuro</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Membrana hialina y un mes de ventilación mecánica.</tspan><tspan x="640.0" dy="16">Desnutrición, dependencia de oxígeno y dos</tspan><tspan x="640.0" dy="16">hospitalizaciones previas.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ EXPLICA LA DEPENDENCIA DE OXÍGENO A LOS 5 MESES</tspan></text><line x1="421.9" y1="385.4" x2="340.0" y2="330.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="330.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="421.9" y1="490.1" x2="340.0" y2="544.9" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="544.9" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.1" y1="407.9" x2="660.0" y2="384.2" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="384.2" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="465.8" x2="660.0" y2="487.8" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="487.8" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="406.0" y1="437.8" x2="340.0" y2="437.8" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="437.8" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="437.8" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="437.8" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="433.3" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">¿QUÉ</tspan><tspan x="500.0" dy="19">DIAGNÓSTICO?</tspan></text><text x="500.0" y="471.3" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">prematuro con oxígeno</tspan></text><rect x="40.0" y="285.0" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="286.0" width="6.0" height="89.2" rx="3" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="190.0" y="313.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">MEMBRANA HIALINA</tspan></text><text x="190.0" y="337.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Enfermedad aguda del recién nacido</tspan><tspan x="190.0" dy="17">No persiste a los 5 meses</tspan></text><rect x="40.0" y="392.2" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="421.0" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">DISPLASIA BRONCOPULMONAR</tspan></text><text x="190.0" y="444.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Prematuro, un mes de ventilación y oxígeno</tspan><tspan x="190.0" dy="17">Desnutrición y reingresos por infecciones</tspan></text><rect x="144.6" y="473.3" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="488.3" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="499.3" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="500.3" width="6.0" height="89.2" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="190.0" y="528.2" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">BRONCONEUMONÍA</tspan></text><text x="190.0" y="551.8" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Cuadro agudo</tspan><tspan x="190.0" dy="17">No explica la dependencia crónica de oxígeno</tspan></text><rect x="660.0" y="342.2" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="343.2" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="375.9" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">BRONQUIECTASIA</tspan></text><text x="810.0" y="399.6" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Poco probable a esta edad</tspan></text><rect x="660.0" y="442.2" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="443.2" width="6.0" height="89.2" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="471.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">ANOMALÍA CONGÉNITA</tspan></text><text x="810.0" y="494.7" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">No tendría el antecedente de ventilación</tspan><tspan x="810.0" dy="17">mecánica</tspan></text><text x="40.0" y="626.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="638.5" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="663.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Prematuro con surfactante</tspan><tspan x="142.2" dy="17">deficiente</tspan></text><line x1="248.5" y1="667.5" x2="267.5" y2="667.5" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,662.5 266.5,672.5 274.5,667.5" fill="#0f766e"/><rect x="278.5" y="638.5" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="671.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Ventilación mecánica y oxígeno</tspan></text><line x1="487.0" y1="667.5" x2="506.0" y2="667.5" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,662.5 505.0,672.5 513.0,667.5" fill="#0f766e"/><rect x="517.0" y="638.5" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="671.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Alveolarización alterada</tspan></text><line x1="725.5" y1="667.5" x2="744.5" y2="667.5" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,662.5 743.5,672.5 751.5,667.5" fill="#0f766e"/><rect x="755.5" y="638.5" width="204.5" height="58.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="663.0" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Oxígeno a las 36 semanas y</tspan><tspan x="857.8" dy="17">reingresos</tspan></text><text x="40.0" y="730.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">GRAVEDAD DE LA DISPLASIA BRONCOPULMONAR SEGÚN EL SOPORTE A LAS 36 SEMANAS (JENSEN 2019)</tspan></text><rect x="40.0" y="742.5" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="761.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Grado</tspan></text><text x="200.0" y="761.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="754"><tspan x="200.0" dy="0">Soporte respiratorio a las 36 semanas</tspan></text><rect x="40.0" y="771.5" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="790.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Sin displasia</tspan></text><text x="200.0" y="790.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="754"><tspan x="200.0" dy="0">Sin soporte</tspan></text><rect x="40.0" y="800.5" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="819.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Grado 1</tspan></text><text x="200.0" y="819.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="754"><tspan x="200.0" dy="0">Cánula nasal de 2 L/min o menos</tspan></text><rect x="40.0" y="829.5" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="848.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Grado 2</tspan></text><text x="200.0" y="848.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="754"><tspan x="200.0" dy="0">Cánula nasal de más de 2 L/min o presión positiva no invasiva</tspan></text><rect x="40.0" y="858.5" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="877.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Grado 3</tspan></text><text x="200.0" y="877.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="754"><tspan x="200.0" dy="0">Ventilación mecánica invasiva</tspan></text><text x="40.0" y="903.5" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">El enunciado no da el soporte a las 36 semanas, por lo que no se asigna un grado.</tspan></text><text x="40.0" y="950.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="960.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="991.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="991.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Membrana hialina</tspan></text><rect x="363.0" y="963.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="983.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Displasia</tspan><tspan x="435.0" dy="17">broncopulmonar</tspan></text><text x="585.0" y="991.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Bronconeumonía</tspan></text><text x="735.0" y="991.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Bronquiectasia</tspan></text><text x="885.0" y="983.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Anomalía congénita</tspan><tspan x="885.0" dy="17">broncopulmonar</tspan></text><rect x="40.0" y="1014.5" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="1014.5" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1043.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico más</tspan><tspan x="54.0" dy="16">probable?</tspan></text><text x="285.0" y="1035.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es una</tspan><tspan x="285.0" dy="16">enfermedad aguda</tspan><tspan x="285.0" dy="16">neonatal</tspan></text><text x="435.0" y="1035.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: secuela crónica con</tspan><tspan x="435.0" dy="16">dependencia de</tspan><tspan x="435.0" dy="16">oxígeno</tspan></text><text x="585.0" y="1035.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no explica la</tspan><tspan x="585.0" dy="16">dependencia crónica</tspan><tspan x="585.0" dy="16">de oxígeno</tspan></text><text x="735.0" y="1043.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: poco probable a</tspan><tspan x="735.0" dy="16">esta edad</tspan></text><text x="885.0" y="1043.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no tendría ese</tspan><tspan x="885.0" dy="16">antecedente</tspan></text><rect x="40.0" y="960.5" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1104.5" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1132.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1154.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Causa multifactorial: inmadurez y déficit de surfactante, barotrauma y volutrauma, toxicidad por oxígeno, inflamación e infección; se altera la</tspan><tspan x="58.0" dy="18">   alveolarización.</tspan><tspan x="58.0" dy="18">• Jensen 2019 (NICHD): gravedad según el soporte a las 36 semanas: grado 1 cánula ≤2 L/min; grado 2 cánula &gt;2 L/min o presión positiva no invasiva;</tspan><tspan x="58.0" dy="18">   grado 3 ventilación invasiva.</tspan><tspan x="58.0" dy="18">• Manejo: oxígeno para saturar 92-95 %, nutrición hipercalórica, diuréticos o corticoides selectivos, vigilancia de hipertensión pulmonar, vacunas y</tspan><tspan x="58.0" dy="18">   nirsevimab o palivizumab.</tspan><tspan x="58.0" dy="18">• Seguimiento: crecimiento, neurodesarrollo y ecocardiografía. La membrana hialina es aguda y no persiste a los 5 meses.</tspan></text><text x="58.0" y="1284.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Jensen EA et al., Am J Respir Crit Care Med 2019;200:751-759; Nelson Tratado de Pediatría 22.ª ed. (2024)</tspan></text></svg>