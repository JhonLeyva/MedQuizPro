<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1309" viewBox="0 0 1000 1309" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la infección por C. difficile se usa vancomicina oral (125 mg cada 6 horas por 10 días); la fidaxomicina es la preferida hoy"><title>En la infección por C. difficile se usa vancomicina oral (125 mg cada 6 horas por 10 días); la fidaxomicina es la preferida hoy</title><rect x="0.75" y="0.75" width="998.5" height="1307.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Infectología · Clostridioides difficile</tspan></text><rect x="410.5" y="32.0" width="121.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="471.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="106"><tspan x="471.4" dy="0">INFECTOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección por C. difficile</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Bacilo anaerobio esporulado; crece tras clindamicina, cefalosporinas o quinolonas.</tspan><tspan x="58.0" dy="17">Las toxinas A y B causan diarrea y colitis pseudomembranosa.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de tratamiento</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué antibiótico es más eficaz en la infección intestinal</tspan><tspan x="640.0" dy="16">por C. difficile?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PASOS DEL TRATAMIENTO DE LA INFECCIÓN POR C. DIFFICILE</tspan></text><polygon points="200.0,269.0 300.0,269.0 340.0,340.0 160.0,340.0" fill="#ccfbf1" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="309.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="88"><tspan x="250.0" dy="0">1 · Confirmar</tspan></text><rect x="486.0" y="269.0" width="474.0" height="71.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="301.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Cuadro compatible y prueba de heces</tspan></text><text x="501.0" y="318.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Suspender el antibiótico causal si es posible</tspan></text><polygon points="160.0,346.0 340.0,346.0 380.0,417.0 120.0,417.0" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="386.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="250.0" dy="0">2 · Primer episodio</tspan></text><rect x="486.0" y="346.0" width="474.0" height="71.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="501.0" y="370.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Vancomicina oral 125 mg c/6 h por 10 días</tspan></text><text x="501.0" y="387.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Opción de la pregunta; la guía 2021 prefiere fidaxomicina 200 mg c/12 h por 10</tspan><tspan x="501.0" dy="16">días</tspan></text><rect x="858.2" y="335.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="903.6" y="350.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="903.6" dy="0">◆ ESTE CASO</tspan></text><polygon points="120.0,423.0 380.0,423.0 420.0,494.0 80.0,494.0" fill="#5eead4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="463.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="248"><tspan x="250.0" dy="0">3 · Fulminante</tspan></text><rect x="486.0" y="423.0" width="474.0" height="71.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="455.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Vancomicina oral 500 mg c/6 h más metronidazol IV</tspan></text><text x="501.0" y="472.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Vancomicina rectal si hay íleo</tspan></text><polygon points="80.0,500.0 420.0,500.0 460.0,571.0 40.0,571.0" fill="#2dd4bf" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="540.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="328"><tspan x="250.0" dy="0">4 · Sin mejoría o megacolon</tspan></text><rect x="486.0" y="500.0" width="474.0" height="71.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="532.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Valorar cirugía</tspan></text><text x="501.0" y="549.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Colectomía en el megacolon tóxico o la perforación</tspan></text><text x="250.0" y="589.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="420"><tspan x="250.0" dy="0">▲ primero · ▼ después</tspan></text><rect x="40.0" y="611.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="637.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Vancomicina oral 125 mg cada 6 horas por 10 días</tspan></text><text x="60.0" y="656.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Bacitracina, ácido fusídico, eritromicina y nitazoxanida no son tratamiento de elección.</tspan></text><text x="40.0" y="717.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">GRAVEDAD DE LA INFECCIÓN POR C. DIFFICILE (IDSA/SHEA 2017, ACTUALIZACIÓN 2021)</tspan></text><rect x="40.0" y="729.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="748.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">Gravedad</tspan></text><text x="160.0" y="748.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="389"><tspan x="160.0" dy="0">Criterio</tspan></text><text x="565.0" y="748.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="389"><tspan x="565.0" dy="0">Tratamiento</tspan></text><rect x="40.0" y="758.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="777.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">No grave</tspan></text><text x="160.0" y="777.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="160.0" dy="0">Leucocitos ≤ 15 000/µL y creatinina &lt; 1,5 mg/dL</tspan></text><text x="565.0" y="777.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="565.0" dy="0">Fidaxomicina 200 mg c/12 h (preferida) o vancomicina oral 125 mg c/6</tspan><tspan x="565.0" dy="15">h, 10 días</tspan></text><rect x="40.0" y="802.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="821.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">Grave</tspan></text><text x="160.0" y="821.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="160.0" dy="0">Leucocitos ≥ 15 000/µL o creatinina &gt; 1,5 mg/dL</tspan></text><text x="565.0" y="821.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="565.0" dy="0">Igual: fidaxomicina o vancomicina oral, 10 días</tspan></text><rect x="40.0" y="831.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="850.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">Fulminante</tspan></text><text x="160.0" y="850.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="160.0" dy="0">Hipotensión o shock, íleo o megacolon tóxico</tspan></text><text x="565.0" y="850.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="565.0" dy="0">Vancomicina oral 500 mg c/6 h más metronidazol IV; vancomicina</tspan><tspan x="565.0" dy="15">rectal si hay íleo; valorar cirugía</tspan></text><text x="40.0" y="891.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">El metronidazol solo se acepta en el episodio no grave si no hay fidaxomicina ni vancomicina.</tspan></text><text x="40.0" y="938.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="948.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="970.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="951.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="970.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Vancomicina oral</tspan></text><text x="435.0" y="970.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Bacitracina</tspan></text><text x="585.0" y="970.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Ácido fusídico</tspan></text><text x="735.0" y="970.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Eritromicina</tspan></text><text x="885.0" y="970.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Nitazoxanida</tspan></text><rect x="40.0" y="985.0" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="985.0" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1030.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Antibiótico más eficaz?</tspan></text><text x="285.0" y="1006.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: oral, no se absorbe</tspan><tspan x="285.0" dy="16">y alcanza alta</tspan><tspan x="285.0" dy="16">concentración en el</tspan><tspan x="285.0" dy="16">colon</tspan></text><text x="435.0" y="1022.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: sin evidencia en C.</tspan><tspan x="435.0" dy="16">difficile</tspan></text><text x="585.0" y="1022.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sin evidencia en C.</tspan><tspan x="585.0" dy="16">difficile</tspan></text><text x="735.0" y="1022.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: sin evidencia en C.</tspan><tspan x="735.0" dy="16">difficile</tspan></text><text x="885.0" y="1022.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: alternativa con</tspan><tspan x="885.0" dy="16">datos limitados</tspan></text><rect x="40.0" y="948.0" width="920.0" height="119.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1091.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1119.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1141.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Diagnóstico: cuadro compatible más prueba de heces, idealmente glutamato deshidrogenasa más toxina o PCR en algoritmo.</tspan><tspan x="58.0" dy="18">• IDSA/SHEA 2021: primer episodio con fidaxomicina 200 mg cada 12 horas por 10 días; vancomicina oral 125 mg cada 6 horas por 10 días es alternativa</tspan><tspan x="58.0" dy="18">   aceptable y sigue siendo la opción de las claves.</tspan><tspan x="58.0" dy="18">• Fulminante (hipotensión, íleo o megacolon): vancomicina oral 500 mg cada 6 horas más metronidazol intravenoso; vancomicina rectal si hay íleo y</tspan><tspan x="58.0" dy="18">   valorar cirugía.</tspan><tspan x="58.0" dy="18">• Alerta: suspender el antibiótico causal. Bacitracina, ácido fusídico y eritromicina no tienen evidencia; la nitazoxanida solo tiene datos limitados.</tspan></text><text x="58.0" y="1253.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Johnson S et al., IDSA/SHEA Focused Update C. difficile 2021, Clin Infect Dis 2021;73:e1029-e1044; Kelly CR et al., ACG Guideline C. difficile, Am J Gastroenterol</tspan><tspan x="58.0" dy="15">2021;116:1124-1147; Harrison Principios de Medicina Interna 21.ª ed. (2022).</tspan></text></svg>