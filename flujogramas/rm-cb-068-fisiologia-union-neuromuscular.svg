<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="872" viewBox="0 0 1000 872" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El potencial de acción de la fibra muscular se inicia con la liberación de acetilcolina en la placa motora"><title>El potencial de acción de la fibra muscular se inicia con la liberación de acetilcolina en la placa motora</title><rect x="0.75" y="0.75" width="998.5" height="870.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Fisiología · unión neuromuscular</tspan></text><rect x="396.1" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="468.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="468.1" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Placa motora</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La motoneurona alfa libera acetilcolina por exocitosis.</tspan><tspan x="58.0" dy="17">El receptor nicotínico es un canal catiónico ionotrópico.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">El inicio de un potencial de acción en el músculo</tspan><tspan x="640.0" dy="16">esquelético requiere la secreción de...?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DE LA MOTONEURONA A LA CONTRACCIÓN</tspan></text><rect x="40.0" y="269.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="145.2" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Motoneurona alfa</tspan></text><text x="145.2" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">El potencial abre canales de calcio</tspan><tspan x="145.2" dy="16">presinápticos</tspan></text><line x1="253.5" y1="306.5" x2="266.5" y2="306.5" stroke="#0f766e" stroke-width="2"/><polygon points="265.5,301.5 265.5,311.5 273.5,306.5" fill="#0f766e"/><line x1="145.2" y1="346.0" x2="145.2" y2="360.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="40.0" y="362.0" width="210.5" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="145.2" y="376.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">✂ CORTA</tspan></text><text x="145.2" y="393.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">El calcio libera las vesículas</tspan></text><rect x="276.5" y="269.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="381.8" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Terminal presináptico</tspan></text><text x="381.8" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Exocitosis de acetilcolina</tspan></text><line x1="490.0" y1="306.5" x2="503.0" y2="306.5" stroke="#0f766e" stroke-width="2"/><polygon points="502.0,301.5 502.0,311.5 510.0,306.5" fill="#0f766e"/><line x1="381.8" y1="346.0" x2="381.8" y2="360.0" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="276.5" y="362.0" width="210.5" height="64.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="381.8" y="376.0" font-size="9.5" font-weight="800" font-style="normal" fill="#ffedd5" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">✂ CORTA</tspan></text><text x="381.8" y="393.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">El botulismo bloquea este paso</tspan></text><rect x="337.0" y="415.0" width="89.4" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="381.8" y="430.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="381.8" dy="0">◆ ESTE PASO</tspan></text><rect x="513.0" y="269.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="618.2" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Placa motora</tspan></text><text x="618.2" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Receptor nicotínico: entra sodio y se</tspan><tspan x="618.2" dy="16">genera el potencial de placa</tspan></text><line x1="726.5" y1="306.5" x2="739.5" y2="306.5" stroke="#0f766e" stroke-width="2"/><polygon points="738.5,301.5 738.5,311.5 746.5,306.5" fill="#0f766e"/><line x1="618.2" y1="346.0" x2="618.2" y2="360.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="513.0" y="362.0" width="210.5" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="618.2" y="376.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">✂ CORTA</tspan></text><text x="618.2" y="393.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">La miastenia gravis reduce los</tspan><tspan x="618.2" dy="16">receptores</tspan></text><rect x="749.5" y="269.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="854.8" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Fibra muscular</tspan></text><text x="854.8" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Potencial de acción, calcio del</tspan><tspan x="854.8" dy="16">retículo y contracción</tspan></text><line x1="854.8" y1="346.0" x2="854.8" y2="360.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="749.5" y="362.0" width="210.5" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="854.8" y="376.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">✂ CORTA</tspan></text><text x="854.8" y="393.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">La acetilcolinesterasa termina la</tspan><tspan x="854.8" dy="16">señal</tspan></text><rect x="40.0" y="456.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="482.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Potencial de acción muscular = acetilcolina</tspan></text><text x="60.0" y="501.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Cloro y potasio son iones; noradrenalina y adrenalina no actúan en la placa motora.</tspan></text><text x="40.0" y="568.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="578.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="600.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="581.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="600.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Acetilcolina</tspan></text><text x="435.0" y="600.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Cloro</tspan></text><text x="585.0" y="600.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Potasio</tspan></text><text x="735.0" y="600.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Noradrenalina</tspan></text><text x="885.0" y="600.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Adrenalina</tspan></text><rect x="40.0" y="615.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="615.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="644.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Transmisor que inicia</tspan><tspan x="54.0" dy="16">el potencial?</tspan></text><text x="285.0" y="644.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: activa el receptor</tspan><tspan x="285.0" dy="16">nicotínico del músculo</tspan></text><text x="435.0" y="644.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es un ion, no un</tspan><tspan x="435.0" dy="16">mensajero</tspan></text><text x="585.0" y="644.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es un ion, no un</tspan><tspan x="585.0" dy="16">mensajero</tspan></text><text x="735.0" y="636.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: actúa en el</tspan><tspan x="735.0" dy="16">sistema nervioso</tspan><tspan x="735.0" dy="16">simpático</tspan></text><text x="885.0" y="644.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: actúa en la médula</tspan><tspan x="885.0" dy="16">suprarrenal</tspan></text><rect x="40.0" y="578.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="705.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="733.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="755.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Secuencia: potencial en la motoneurona, entrada de calcio, exocitosis de acetilcolina, receptor nicotínico, entrada de sodio y potencial de placa terminal.</tspan><tspan x="58.0" dy="18">• Si el potencial de placa supera el umbral nace el potencial de acción muscular, que libera calcio del retículo sarcoplásmico y produce la contracción.</tspan><tspan x="58.0" dy="18">• La acetilcolinesterasa degrada el transmisor y termina la señal. Noradrenalina y adrenalina son del sistema simpático, no de la unión esquelética.</tspan><tspan x="58.0" dy="18">• Alertas: miastenia gravis (menos receptores), botulismo (bloquea la liberación) y Lambert-Eaton (canales de calcio presinápticos).</tspan></text><text x="58.0" y="831.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Guyton y Hall, 14.ª ed. (2021); Harrison, 21.ª ed. (2022).</tspan></text></svg>