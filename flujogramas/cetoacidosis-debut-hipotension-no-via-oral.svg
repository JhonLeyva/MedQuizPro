<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1330" viewBox="0 0 1000 1330" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Debut diabético en cetoacidosis con PA 80/60 y FC 130 en UCI: lo que NO se debe hacer es dar líquidos por vía oral"><title>Debut diabético en cetoacidosis con PA 80/60 y FC 130 en UCI: lo que NO se debe hacer es dar líquidos por vía oral</title><rect x="0.75" y="0.75" width="998.5" height="1328.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Cetoacidosis diabética · manejo</tspan></text><rect x="389.3" y="32.0" width="155.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="467.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="139"><tspan x="467.0" dy="0">ENDOCRINOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cetoacidosis con hipotensión</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Déficit de agua de 5-7 L: la reposición es endovenosa (suero fisiológico 1-1,5 L la primera</tspan><tspan x="58.0" dy="17">hora).</tspan><tspan x="58.0" dy="17">La vía oral es lenta, poco segura (vómitos, conciencia) e insuficiente para el choque.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 28 años, debut de DM</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Cetoacidosis diabética en UCI.</tspan><tspan x="640.0" dy="16">PA 80/60, FC 130, SatO₂ 96 %, Glasgow 15.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ HACER Y QUÉ NO EN LA CETOACIDOSIS</tspan></text><rect x="40.0" y="269.0" width="602.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="60.0" y="302.5" font-size="14" font-weight="800" font-style="normal" fill="#ea580c" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">1</tspan></text><rect x="78.0" y="286.5" width="22.0" height="22.0" rx="5" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="89.0" y="302.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="89.0" dy="0">✓</tspan></text><text x="114.0" y="294.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Suero fisiológico EV</tspan></text><text x="114.0" y="311.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">1-1,5 L la 1.ª hora</tspan></text><rect x="566.0" y="258.0" width="39.1" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="585.6" y="273.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="585.6" dy="0">◆ SÍ</tspan></text><rect x="40.0" y="334.0" width="602.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="60.0" y="367.5" font-size="14" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">2</tspan></text><rect x="78.0" y="351.5" width="22.0" height="22.0" rx="5" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="89.0" y="367.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="89.0" dy="0">✓</tspan></text><text x="114.0" y="359.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Potasio antes de la insulina si K &lt; 3,3</tspan></text><text x="114.0" y="376.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Evita arritmias</tspan></text><rect x="40.0" y="399.0" width="602.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="60.0" y="432.5" font-size="14" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">3</tspan></text><rect x="78.0" y="416.5" width="22.0" height="22.0" rx="5" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="89.0" y="432.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="89.0" dy="0">✓</tspan></text><text x="114.0" y="424.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Insulina en infusión</tspan></text><text x="114.0" y="441.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">0,1 U/kg/h</tspan></text><rect x="40.0" y="464.0" width="602.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="60.0" y="497.5" font-size="14" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">4</tspan></text><rect x="78.0" y="481.5" width="22.0" height="22.0" rx="5" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="89.0" y="497.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="89.0" dy="0">✓</tspan></text><text x="114.0" y="489.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Monitoreo de potasio y glucosa</tspan></text><text x="114.0" y="506.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Cada 1-2 horas</tspan></text><rect x="660.0" y="269.0" width="300.0" height="252.0" rx="12" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/><text x="676.0" y="295.0" font-size="11.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">NO HACER</tspan></text><text x="682.0" y="349.5" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="0"><tspan x="682.0" dy="0">✕</tspan></text><text x="700.0" y="349.5" font-size="12" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="start" data-max="244"><tspan x="700.0" dy="0">Líquidos por vía oral</tspan></text><text x="700.0" y="366.5" font-size="11" font-weight="400" font-style="normal" fill="#7f1d1d" text-anchor="start" data-max="244"><tspan x="700.0" dy="0">Insuficiente en choque (este caso)</tspan></text><text x="682.0" y="398.5" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="0"><tspan x="682.0" dy="0">✕</tspan></text><text x="700.0" y="398.5" font-size="12" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="start" data-max="244"><tspan x="700.0" dy="0">Insulina con K &lt; 3,3</tspan></text><text x="700.0" y="415.5" font-size="11" font-weight="400" font-style="normal" fill="#7f1d1d" text-anchor="start" data-max="244"><tspan x="700.0" dy="0">Hipopotasemia grave</tspan></text><text x="682.0" y="447.5" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="0"><tspan x="682.0" dy="0">✕</tspan></text><text x="700.0" y="447.5" font-size="12" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="start" data-max="244"><tspan x="700.0" dy="0">Bicarbonato de rutina</tspan></text><text x="700.0" y="464.5" font-size="11" font-weight="400" font-style="normal" fill="#7f1d1d" text-anchor="start" data-max="244"><tspan x="700.0" dy="0">Solo si pH &lt; 6,9</tspan></text><rect x="40.0" y="539.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="565.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">En choque, nada de vía oral</tspan></text><text x="60.0" y="584.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Hidratación EV rápida.</tspan></text><text x="40.0" y="651.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="663.0" width="920.0" height="323.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="677.0" width="340.7" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="226.3" y="697.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="226.3" dy="0">GRAVEDAD DE LA CETOACIDOSIS (ADA 2024)</tspan></text><text x="412.7" y="697.0" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="529"><tspan x="412.7" dy="0">Por el pH, el bicarbonato y el estado mental.</tspan></text><rect x="56.0" y="737.0" width="288.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="737.6" width="286.8" height="63.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="200.0" y="765.0" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="272"><tspan x="200.0" dy="0">LEVE</tspan></text><text x="200.0" y="785.0" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="264"><tspan x="200.0" dy="0">pH 7,25-7,30</tspan></text><circle cx="72.0" cy="810.0" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="814.0" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="82.0" dy="0">HCO₃ 15-18, alerta</tspan></text><rect x="356.0" y="737.0" width="288.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="356.6" y="737.6" width="286.8" height="63.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="500.0" y="765.0" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="272"><tspan x="500.0" dy="0">MODERADA</tspan></text><text x="500.0" y="785.0" font-size="14" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="264"><tspan x="500.0" dy="0">pH 7,00-7,24</tspan></text><circle cx="372.0" cy="810.0" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="382.0" y="814.0" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="382.0" dy="0">HCO₃ 10-14, somnoliento</tspan></text><rect x="656.0" y="737.0" width="288.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="656.6" y="737.6" width="286.8" height="63.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="800.0" y="765.0" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="272"><tspan x="800.0" dy="0">GRAVE</tspan></text><text x="800.0" y="785.0" font-size="14" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="264"><tspan x="800.0" dy="0">pH &lt; 7,00</tspan></text><circle cx="672.0" cy="810.0" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="682.0" y="814.0" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="682.0" dy="0">HCO₃ &lt; 10, estupor o coma</tspan></text><text x="56.0" y="865.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="874.0" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="889.0" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="889.0" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">PA 80/60 y FC 130: deshidratación grave</tspan></text><rect x="56.0" y="896.0" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="911.0" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="911.0" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Glasgow 15; falta la gasometría</tspan></text><rect x="56.0" y="933.0" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="956.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Suero fisiológico EV, potasio y luego insulina en infusión; nada por vía oral.</tspan></text><text x="40.0" y="1026.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1036.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1075.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1058.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Insulina EV para</tspan><tspan x="285.0" dy="17">corregir el medio</tspan><tspan x="285.0" dy="17">interno</tspan></text><text x="435.0" y="1067.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Fluidoterapia EV</tspan><tspan x="435.0" dy="17">(baja la taquicardia)</tspan></text><text x="585.0" y="1067.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Oxígeno si lo</tspan><tspan x="585.0" dy="17">necesita</tspan></text><rect x="663.0" y="1039.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="1067.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Líquidos por vía</tspan><tspan x="735.0" dy="17">oral</tspan></text><text x="885.0" y="1067.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Monitorizar el</tspan><tspan x="885.0" dy="17">potasio sérico</tspan></text><rect x="40.0" y="1107.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="1107.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1136.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué NO hacer?</tspan></text><text x="285.0" y="1136.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí se hace</tspan></text><text x="435.0" y="1136.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí se hace</tspan></text><text x="585.0" y="1136.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí, si lo necesita</tspan></text><text x="735.0" y="1128.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: no se debe</tspan><tspan x="735.0" dy="16">(choque)</tspan></text><text x="885.0" y="1136.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí se hace</tspan></text><rect x="40.0" y="1036.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1181.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1209.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1231.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Suero fisiológico EV; potasio según su valor; insulina en infusión 0,1 U/kg/h si K ≥ 3,3.</tspan><tspan x="58.0" dy="18">• Agregar dextrosa cuando la glucosa llegue a 200-250 mg/dL.</tspan><tspan x="58.0" dy="18">• Monitorizar potasio, glucosa, brecha aniónica y estado mental cada 1-2 horas.</tspan></text><text x="58.0" y="1289.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ADA/EASD/JBDS/AACE/DTS, consenso de crisis hiperglucémicas (2024); ADA Standards of Care in Diabetes 2026.</tspan></text></svg>