<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1004" viewBox="0 0 1000 1004" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La fenitoína es el prototipo de los anticonvulsivantes que bloquean los canales de sodio"><title>La fenitoína es el prototipo de los anticonvulsivantes que bloquean los canales de sodio</title><rect x="0.75" y="0.75" width="998.5" height="1002.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Farmacología · antiepilépticos</tspan></text><rect x="379.1" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="451.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="451.0" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Mecanismos de los antiepilépticos</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Bloqueo de canales de sodio o calcio, potenciación del GABA y menor excitación</tspan><tspan x="58.0" dy="17">glutamatérgica.</tspan><tspan x="58.0" dy="17">Cada fármaco encaja en uno de esos mecanismos.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué anticonvulsivante actúa inhibiendo los canales de</tspan><tspan x="640.0" dy="16">sodio?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DÓNDE ACTÚA CADA FÁRMACO EN LA SINAPSIS</tspan></text><rect x="40.0" y="269.0" width="920.0" height="99.0" rx="0" fill="#e0f2fe" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="269.0" width="112.0" height="99.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="322.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Canal de sodio</tspan></text><rect x="40.0" y="368.0" width="920.0" height="83.0" rx="0" fill="#fef3c7" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="368.0" width="112.0" height="83.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="413.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Canal de calcio</tspan></text><rect x="40.0" y="451.0" width="920.0" height="83.0" rx="0" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="451.0" width="112.0" height="83.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="496.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Vía del GABA</tspan></text><line x1="322.0" y1="353.0" x2="322.0" y2="372.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="317.0,372.0 327.0,372.0 322.0,381.0" fill="#0f766e"/><line x1="472.0" y1="409.5" x2="479.0" y2="409.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="479.0,414.5 479.0,404.5 488.0,409.5" fill="#0f766e"/><line x1="638.0" y1="436.0" x2="331.0" y2="463.2" stroke="#0f766e" stroke-width="2.2"/><polygon points="330.5,458.2 331.4,468.2 322.0,464.0" fill="#0f766e"/><rect x="172.0" y="284.0" width="300.0" height="69.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="182.0" y="300.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Fenitoína</tspan></text><text x="182.0" y="317.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Se une al canal inactivo y frena las descargas</tspan><tspan x="182.0" dy="14.5">repetitivas de alta frecuencia</tspan></text><circle cx="172.0" cy="284.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="288.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">1</tspan></text><rect x="172.0" y="383.0" width="300.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="399.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Gabapentina y pregabalina</tspan></text><text x="182.0" y="416.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Subunidad alfa-2-delta de los canales de calcio</tspan></text><circle cx="172.0" cy="383.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="387.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">2</tspan></text><rect x="488.0" y="383.0" width="300.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="498.0" y="399.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="498.0" dy="0">Etosuximida</tspan></text><text x="498.0" y="416.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="498.0" dy="0">Bloquea los canales de calcio tipo T talámicos</tspan></text><circle cx="488.0" cy="383.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="488.0" y="387.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="488.0" dy="0">3</tspan></text><rect x="172.0" y="466.0" width="300.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="482.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Vigabatrina</tspan></text><text x="182.0" y="499.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Inhibe de forma irreversible la GABA transaminasa</tspan></text><circle cx="172.0" cy="466.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="470.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">4</tspan></text><rect x="40.0" y="552.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="578.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Bloqueo de canales de sodio = fenitoína</tspan></text><text x="60.0" y="597.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Pregabalina y gabapentina actúan en canales de calcio; etosuximida en calcio tipo T; vigabatrina en el GABA.</tspan></text><text x="40.0" y="664.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="674.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="696.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="677.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="696.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Fenitoína</tspan></text><text x="435.0" y="696.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Pregabalina</tspan></text><text x="585.0" y="696.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Gabapentina</tspan></text><text x="735.0" y="696.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Etosuximida</tspan></text><text x="885.0" y="696.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Vigabatrina</tspan></text><rect x="40.0" y="711.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="711.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="740.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Bloquea canales de</tspan><tspan x="54.0" dy="16">sodio?</tspan></text><text x="285.0" y="732.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: prototipo de</tspan><tspan x="285.0" dy="16">bloqueador del canal</tspan><tspan x="285.0" dy="16">en estado inactivo</tspan></text><text x="435.0" y="732.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: actúa sobre la</tspan><tspan x="435.0" dy="16">subunidad alfa-2-delta</tspan><tspan x="435.0" dy="16">de canales de calcio</tspan></text><text x="585.0" y="732.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: actúa sobre la</tspan><tspan x="585.0" dy="16">subunidad alfa-2-delta</tspan><tspan x="585.0" dy="16">de canales de calcio</tspan></text><text x="735.0" y="732.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: bloquea canales</tspan><tspan x="735.0" dy="16">de calcio tipo T</tspan><tspan x="735.0" dy="16">talámicos</tspan></text><text x="885.0" y="740.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: inhibe la GABA</tspan><tspan x="885.0" dy="16">transaminasa</tspan></text><rect x="40.0" y="674.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="801.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="829.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="851.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Fenitoína: se une al canal en estado inactivo y retrasa su recuperación; frena descargas repetitivas sin alterar la actividad normal. Protege de crisis</tspan><tspan x="58.0" dy="18">   focales y tónico-clónicas, no de ausencias.</tspan><tspan x="58.0" dy="18">• Cinética de saturación (orden cero), margen estrecho e inductora enzimática. Efectos: nistagmo, ataxia, hiperplasia gingival, hirsutismo, déficit de folato.</tspan><tspan x="58.0" dy="18">• Por vía intravenosa: hipotensión y arritmias; infundir lento y con monitorización. La fosfenitoína es la prodroga hidrosoluble más segura.</tspan><tspan x="58.0" dy="18">• Gabapentina y pregabalina: subunidad alfa-2-delta de canales de calcio. Etosuximida: calcio tipo T. Vigabatrina: inhibe la GABA transaminasa (pérdida</tspan><tspan x="58.0" dy="18">   del campo visual).</tspan></text><text x="58.0" y="963.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Goodman y Gilman, 14.ª ed. (2023); Katzung, 16.ª ed. (2024).</tspan></text></svg>