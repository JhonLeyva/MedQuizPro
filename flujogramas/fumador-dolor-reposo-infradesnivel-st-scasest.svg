" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="855.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="877.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Troponina normal inicial no descarta infarto.</tspan><tspan x="58.0" dy="18">• Estratificar el riesgo (GRACE) para la coronariografía.</tspan><tspan x="58.0" dy="18">• Estatina de alta intensidad desde el inicio.</tspan></text><text x="58.0" y="935.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ESC – Acute coronary syndromes guidelines (2023)</tspan></text></svg>