<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="845" viewBox="0 0 1000 845" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Mujer de 58 años con sangrado sin antecedentes, TTPa prolongado que no corrige con la mezcla: inhibidor de un factor (hemofilia adquirida)"><title>Mujer de 58 años con sangrado sin antecedentes, TTPa prolongado que no corrige con la mezcla: inhibidor de un factor (hemofilia adquirida)</title><rect x="0.75" y="0.75" width="998.5" height="844.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Hemostasia · prueba de mezcla</tspan></text><rect x="385.3" y="32.0" width="135.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="452.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="119"><tspan x="452.9" dy="0">HEMATOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="148.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Prueba de mezcla</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se mezcla el plasma del paciente con plasma normal: si el TTPa se corrige, faltaba un</tspan><tspan x="58.0" dy="17">factor; si no, hay un inhibidor.</tspan><tspan x="58.0" dy="17">Inhibidor + sangrado en un adulto mayor = anticuerpo contra el factor VIII (hemofilia A</tspan><tspan x="58.0" dy="17">adquirida).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="148.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="146.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 58 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Diátesis hemorrágica, sin antecedentes de sangrado.</tspan><tspan x="640.0" dy="16">TTPa prolongado; la prueba de mezcla no corrige.</tspan></text><line x1="640.0" y1="218.0" x2="670.0" y2="218.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="222.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="238.0" x2="320.0" y2="268.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="268.0" x2="500.0" y2="268.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="268.0" x2="500.0" y2="297.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,296.0 505.0,296.0 500.0,304.0" fill="#94a3b8"/><line x1="500.0" y1="362.0" x2="500.0" y2="392.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="392.0" x2="733.5" y2="392.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="392.0" x2="266.5" y2="421.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,420.0 271.5,420.0 266.5,428.0" fill="#94a3b8"/><line x1="733.5" y1="392.0" x2="733.5" y2="421.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,420.0 738.5,420.0 733.5,428.0" fill="#94a3b8"/><line x1="320.0" y1="238.0" x2="320.0" y2="268.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="268.0" x2="500.0" y2="268.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="268.0" x2="500.0" y2="297.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,296.0 505.0,296.0 500.0,304.0" fill="#0f766e"/><line x1="500.0" y1="362.0" x2="500.0" y2="392.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="392.0" x2="500.0" y2="392.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="392.0" x2="266.5" y2="421.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,420.0 271.5,420.0 266.5,428.0" fill="#0f766e"/><rect x="222.9" y="401.0" width="87.1" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="413.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">No (este caso)</tspan></text><rect x="721.4" y="401.0" width="24.1" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="413.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Sí</tspan></text><polygon points="240.0,333.0 266.0,304.0 734.0,304.0 760.0,333.0 734.0,362.0 266.0,362.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="333.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="338.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="337.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">TTPa prolongado: ¿corrige al mezclar con plasma normal?</tspan></text><rect x="40.0" y="428.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="456.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">INHIBIDOR</tspan></text><text x="266.5" y="479.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Sangra: anti-factor VIII</tspan><tspan x="266.5" dy="17">Trombosis: anticoagulante lúpico</tspan></text><rect x="507.0" y="428.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="464.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Déficit de factor</tspan></text><text x="733.5" y="487.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">VIII, IX, XI; vitamina K</tspan></text><text x="40.0" y="558.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="568.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="599.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="571.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="591.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Inhibidores de los</tspan><tspan x="285.0" dy="17">factores</tspan></text><text x="435.0" y="591.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hiperhomo-</tspan><tspan x="435.0" dy="17">cisteinemia</tspan></text><text x="585.0" y="591.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Insuficiencia de</tspan><tspan x="585.0" dy="17">antitrombina III</tspan></text><text x="735.0" y="591.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Mutación de</tspan><tspan x="735.0" dy="17">protrombina</tspan></text><text x="885.0" y="591.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Déficit de vitamina</tspan><tspan x="885.0" dy="17">K</tspan></text><rect x="40.0" y="622.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="622.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="651.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Sospecha?</tspan></text><text x="285.0" y="643.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: no corrige con</tspan><tspan x="285.0" dy="16">plasma normal</tspan></text><text x="435.0" y="651.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: da trombosis</tspan></text><text x="585.0" y="643.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: da trombosis, no</tspan><tspan x="585.0" dy="16">alarga el TTPa</tspan></text><text x="735.0" y="651.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: da trombosis</tspan></text><text x="885.0" y="643.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: corregiría con la</tspan><tspan x="885.0" dy="16">mezcla</tspan></text><rect x="40.0" y="568.5" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="696.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="724.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="746.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Dosar factor VIII y el inhibidor (unidades Bethesda).</tspan><tspan x="58.0" dy="18">• Sangrado: agentes de puente (factor VII activado recombinante) o emicizumab; inmunosupresión (corticoide ± rituximab).</tspan><tspan x="58.0" dy="18">• Inhibidor con TROMBOSIS (no sangrado): anticoagulante lúpico.</tspan></text><text x="58.0" y="804.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Consenso internacional de hemofilia A adquirida (2020); Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>