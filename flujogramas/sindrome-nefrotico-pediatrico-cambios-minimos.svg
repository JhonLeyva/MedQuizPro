<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="597" viewBox="0 0 1000 597" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Síndrome nefrótico vs. nefrítico"><title>Síndrome nefrótico vs. nefrítico</title><rect x="0.75" y="0.75" width="998.5" height="595.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16" y="16" width="968" height="56" rx="10" fill="#0f766e"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170" y1="34.0" x2="170" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="572"><tspan x="184.0" dy="0">NEFROLOGÍA Y UROLOGÍA ENAM: SÍNDROME NEFRÓTICO VS. NEFRÍTICO</tspan></text><rect x="776.3" y="32.0" width="187.7" height="24" rx="12" fill="#134e4a"/><text x="870.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="172"><tspan x="870.1" dy="0">NEFROLOGÍA Y UROLOGÍA</tspan></text><rect x="190.0" y="90.0" width="620" height="67.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="500.0" y="118.5" font-size="14.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Niño de 6 años con edema palpebral y pretibial</tspan></text><text x="500.0" y="141.0" font-size="12" font-weight="400" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Proteinuria +++, albúmina 2 g/dL, creatinina y FG normales</tspan></text><line x1="500.0" y1="157.0" x2="500.0" y2="177.0" stroke="#0f766e" stroke-width="2"/><line x1="250.0" y1="177.0" x2="750.0" y2="177.0" stroke="#0f766e" stroke-width="2"/><line x1="250.0" y1="177.0" x2="250.0" y2="196.0" stroke="#0f766e" stroke-width="2"/><polygon points="245.0,195.0 255.0,195.0 250.0,203.0" fill="#0f766e"/><line x1="750.0" y1="177.0" x2="750.0" y2="196.0" stroke="#0f766e" stroke-width="2"/><polygon points="745.0,195.0 755.0,195.0 750.0,203.0" fill="#0f766e"/><rect x="40.0" y="203.0" width="420" height="131.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><path d="M40.0,213.0 a10,10 0 0 1 10,-10 h400 a10,10 0 0 1 10,10 v22.0 h-420 z" fill="#0f766e"/><text x="250.0" y="227.5" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="392"><tspan x="250.0" dy="0">Síndrome nefrótico</tspan></text><text x="250.0" y="259.0" font-size="12" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="392"><tspan x="250.0" dy="0">Proteinuria masiva</tspan><tspan x="250.0" dy="17">Hipoalbuminemia &lt; 2.5 g/dL</tspan><tspan x="250.0" dy="17">Edema, hiperlipidemia</tspan><tspan x="250.0" dy="17">Sin hematuria</tspan></text><rect x="367.8" y="193.0" width="84.2" height="20" rx="10" fill="#f59e0b"/><text x="409.9" y="207.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="409.9" dy="0">✓ RESPUESTA</tspan></text><rect x="540.0" y="203.0" width="420" height="131.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><path d="M540.0,213.0 a10,10 0 0 1 10,-10 h400 a10,10 0 0 1 10,10 v22.0 h-420 z" fill="#e2e8f0"/><text x="750.0" y="227.5" font-size="13.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="392"><tspan x="750.0" dy="0">Síndrome nefrítico</tspan></text><text x="750.0" y="259.0" font-size="12" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="392"><tspan x="750.0" dy="0">Hematuria, cilindros</tspan><tspan x="750.0" dy="17">hemáticos</tspan><tspan x="750.0" dy="17">HTA, oliguria</tspan><tspan x="750.0" dy="17">Edema leve</tspan></text><line x1="250.0" y1="334.0" x2="250.0" y2="355.0" stroke="#0f766e" stroke-width="2"/><polygon points="245.0,354.0 255.0,354.0 250.0,362.0" fill="#0f766e"/><rect x="100.0" y="362.0" width="800" height="82.5" rx="10" fill="#134e4a" stroke="#134e4a" stroke-width="1.5"/><text x="500.0" y="388.0" font-size="12" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="772"><tspan x="500.0" dy="0">EN EL NIÑO</tspan></text><text x="500.0" y="411.0" font-size="12.5" font-weight="400" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="772"><tspan x="500.0" dy="0">Causa más frecuente: enfermedad de cambios mínimos</tspan><tspan x="500.0" dy="17.5">Tratamiento: prednisona; corticosensible en la mayoría</tspan></text><rect x="40" y="470.5" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="498.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="520.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Nefrótico = proteinuria; nefrítico = hematuria con hipertensión.</tspan><tspan x="58.0" dy="18">• Riesgo de trombosis e infecciones (peritonitis por neumococo).</tspan></text><text x="58.0" y="560.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: KDIGO 2021 Glomerular Diseases · Nelson Tratado de Pediatría 22.ª ed.</tspan></text></svg>
