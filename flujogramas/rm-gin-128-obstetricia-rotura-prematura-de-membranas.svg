<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1127" viewBox="0 0 1000 1127" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="RPM pretérmino a las 30 semanas sin infección: conducta expectante con antibióticos de latencia"><title>RPM pretérmino a las 30 semanas sin infección: conducta expectante con antibióticos de latencia</title><rect x="0.75" y="0.75" width="998.5" height="1125.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · rotura prematura de membranas</tspan></text><rect x="466.6" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="546.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="546.4" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">RPM pretérmino</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Rotura antes de las 37 semanas y antes del inicio del trabajo de parto.</tspan><tspan x="58.0" dy="17">El riesgo principal es la infección intraamniótica.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante de 30 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Rotura de membranas hace tres días, signos vitales</tspan><tspan x="640.0" dy="16">normales, LCF de 145 por minuto y sin dinámica</tspan><tspan x="640.0" dy="16">uterina.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ORDEN DE LAS MEDIDAS EN LA RPM PRETÉRMINO SIN INFECCIÓN</tspan></text><text x="44.0" y="299.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Se aplican en conjunto durante la hospitalización; el antibiótico es la medida que pide el caso.</tspan></text><line x1="155.0" y1="338.0" x2="293.0" y2="338.0" stroke="#99f6e4" stroke-width="6"/><line x1="339.0" y1="338.0" x2="477.0" y2="338.0" stroke="#99f6e4" stroke-width="6"/><line x1="523.0" y1="338.0" x2="661.0" y2="338.0" stroke="#99f6e4" stroke-width="6"/><line x1="707.0" y1="338.0" x2="845.0" y2="338.0" stroke="#99f6e4" stroke-width="6"/><circle cx="132.0" cy="338.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="132.0" y="342.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="132.0" dy="0">1</tspan></text><rect x="45.0" y="372.0" width="174.0" height="92.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="132.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">Hospitalizar y vigilar</tspan></text><text x="132.0" y="409.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">Temperatura, dolor uterino,</tspan><tspan x="132.0" dy="16">LCF y líquido; examen con</tspan><tspan x="132.0" dy="16">espéculo, sin tactos repetidos</tspan></text><circle cx="316.0" cy="338.0" r="22" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><text x="316.0" y="342.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="38"><tspan x="316.0" dy="0">2</tspan></text><rect x="229.0" y="372.0" width="174.0" height="92.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="316.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">Antibiótico de latencia</tspan></text><text x="316.0" y="409.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">Ampicilina y eritromicina IV por</tspan><tspan x="316.0" dy="16">48 h, luego amoxicilina y</tspan><tspan x="316.0" dy="16">eritromicina hasta 7 días</tspan></text><rect x="266.9" y="453.0" width="98.1" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="316.0" y="468.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="316.0" dy="0">◆ ANTIBIÓTICO</tspan></text><circle cx="500.0" cy="338.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="342.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="500.0" dy="0">3</tspan></text><rect x="413.0" y="372.0" width="174.0" height="92.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">Corticoides prenatales</tspan></text><text x="500.0" y="409.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">Entre las 24 y 34 semanas</tspan><tspan x="500.0" dy="16">para maduración pulmonar</tspan></text><circle cx="684.0" cy="338.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="684.0" y="342.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="684.0" dy="0">4</tspan></text><rect x="597.0" y="372.0" width="174.0" height="92.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="684.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">Sulfato de magnesio</tspan></text><text x="684.0" y="409.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">Neuroprotección si el parto es</tspan><tspan x="684.0" dy="16">inminente antes de las 32</tspan><tspan x="684.0" dy="16">semanas</tspan></text><circle cx="868.0" cy="338.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="868.0" y="342.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="868.0" dy="0">5</tspan></text><rect x="781.0" y="372.0" width="174.0" height="92.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="868.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">Terminar el embarazo si</tspan><tspan x="868.0" dy="17">hay infección</tspan></text><text x="868.0" y="426.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">Fiebre, taquicardia fetal, dolor</tspan><tspan x="868.0" dy="16">uterino o líquido fétido</tspan></text><rect x="40.0" y="496.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="522.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">RPM pretérmino sin infección = antibiótico de latencia</tspan></text><text x="60.0" y="541.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Inducir o hacer cesárea a las 30 semanas no tiene indicación; los tactos repetidos aumentan la infección.</tspan></text><text x="40.0" y="602.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ANTIBIÓTICOS DE LATENCIA EN LA RPM PRETÉRMINO (ACOG 2020)</tspan></text><rect x="40.0" y="614.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="633.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="144"><tspan x="50.0" dy="0">Fase</tspan></text><text x="210.0" y="633.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="364"><tspan x="210.0" dy="0">Fármacos</tspan></text><text x="590.0" y="633.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="364"><tspan x="590.0" dy="0">Duración</tspan></text><rect x="40.0" y="643.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="662.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="144"><tspan x="50.0" dy="0">Inicial</tspan></text><text x="210.0" y="662.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="364"><tspan x="210.0" dy="0">Ampicilina y eritromicina por vía intravenosa</tspan></text><text x="590.0" y="662.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="364"><tspan x="590.0" dy="0">48 horas</tspan></text><rect x="100.6" y="646.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="146.0" y="661.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="146.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="672.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="691.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="144"><tspan x="50.0" dy="0">Continuación</tspan></text><text x="210.0" y="691.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="364"><tspan x="210.0" dy="0">Amoxicilina y eritromicina por vía oral</tspan></text><text x="590.0" y="691.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="364"><tspan x="590.0" dy="0">Hasta completar 7 días</tspan></text><rect x="40.0" y="701.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="720.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="144"><tspan x="50.0" dy="0">Estreptococo B</tspan></text><text x="210.0" y="720.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="364"><tspan x="210.0" dy="0">Profilaxis según el cultivo</tspan></text><text x="590.0" y="720.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="364"><tspan x="590.0" dy="0">Durante el trabajo de parto</tspan></text><text x="40.0" y="770.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="780.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="811.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="783.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="811.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Antibioticoterapia</tspan></text><text x="435.0" y="811.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Inducir el parto</tspan></text><text x="585.0" y="811.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Realizar cesárea</tspan></text><text x="735.0" y="811.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ecografía Doppler</tspan></text><text x="885.0" y="802.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Tacto vaginal cada 8</tspan><tspan x="885.0" dy="17">horas</tspan></text><rect x="40.0" y="834.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="834.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="863.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Indicación más</tspan><tspan x="54.0" dy="16">apropiada?</tspan></text><text x="285.0" y="863.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: reduce la infección</tspan><tspan x="285.0" dy="16">y prolonga la gestación</tspan></text><text x="435.0" y="855.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: expone a</tspan><tspan x="435.0" dy="16">prematuridad extrema</tspan><tspan x="435.0" dy="16">sin indicación</tspan></text><text x="585.0" y="855.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: expone a</tspan><tspan x="585.0" dy="16">prematuridad extrema</tspan><tspan x="585.0" dy="16">sin indicación</tspan></text><text x="735.0" y="855.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no previene</tspan><tspan x="735.0" dy="16">complicaciones por sí</tspan><tspan x="735.0" dy="16">sola</tspan></text><text x="885.0" y="855.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: los tactos</tspan><tspan x="885.0" dy="16">repetidos aumentan la</tspan><tspan x="885.0" dy="16">infección</tspan></text><rect x="40.0" y="780.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="924.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="952.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="974.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Sin corioamnionitis, desprendimiento ni compromiso fetal: hospitalización y conducta expectante hasta las 34 semanas.</tspan><tspan x="58.0" dy="18">• Antibiótico de latencia: ampicilina y eritromicina IV por 48 h, luego amoxicilina y eritromicina orales hasta completar 7 días; prolonga la gestación y reduce</tspan><tspan x="58.0" dy="18">   la corioamnionitis.</tspan><tspan x="58.0" dy="18">• Además: corticoides entre las 24 y 34 semanas, sulfato de magnesio si el parto es inminente antes de las 32 semanas y profilaxis para estreptococo B</tspan><tspan x="58.0" dy="18">   según el cultivo.</tspan><tspan x="58.0" dy="18">• Alerta: fiebre, taquicardia fetal, dolor uterino o líquido fétido obligan a terminar el embarazo. Evitar tactos repetidos; usar espéculo.</tspan></text><text x="58.0" y="1086.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, Practice Bulletin N.º 217, rotura prematura de membranas (2020); Williams Obstetricia, 26.ª ed. (2022).</tspan></text></svg>