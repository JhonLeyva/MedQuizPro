<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1267" viewBox="0 0 1000 1267" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="A los 24 meses el niño construye una torre de 6 a 7 cubos"><title>A los 24 meses el niño construye una torre de 6 a 7 cubos</title><rect x="0.75" y="0.75" width="998.5" height="1265.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · desarrollo motor fino</tspan></text><rect x="388.6" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="437.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="437.7" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hitos del desarrollo</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se evalúan cuatro áreas: motricidad gruesa, fina y adaptativa, lenguaje y social.</tspan><tspan x="58.0" dy="17">La torre de cubos mide la coordinación visuomotora fina.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de hito</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿A qué edad en meses se logra una torre de 7 cubos?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CUÁNTOS CUBOS APILA EL NIÑO SEGÚN LA EDAD</tspan></text><line x1="290.0" y1="275.0" x2="290.0" y2="507.0" stroke="#e2e8f0" stroke-width="1"/><text x="290.0" y="271.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="290.0" dy="0">0</tspan></text><line x1="398.3" y1="275.0" x2="398.3" y2="507.0" stroke="#e2e8f0" stroke-width="1"/><text x="398.3" y="271.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="398.3" dy="0">6</tspan></text><line x1="506.7" y1="275.0" x2="506.7" y2="507.0" stroke="#e2e8f0" stroke-width="1"/><text x="506.7" y="271.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="506.7" dy="0">12</tspan></text><line x1="615.0" y1="275.0" x2="615.0" y2="507.0" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="271.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="615.0" dy="0">18</tspan></text><line x1="723.3" y1="275.0" x2="723.3" y2="507.0" stroke="#e2e8f0" stroke-width="1"/><text x="723.3" y="271.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="723.3" dy="0">24</tspan></text><line x1="831.7" y1="275.0" x2="831.7" y2="507.0" stroke="#e2e8f0" stroke-width="1"/><text x="831.7" y="271.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="831.7" dy="0">30</tspan></text><line x1="940.0" y1="275.0" x2="940.0" y2="507.0" stroke="#e2e8f0" stroke-width="1"/><text x="940.0" y="271.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="940.0" dy="0">36</tspan></text><text x="940.0" y="257.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="end" data-max="60"><tspan x="940.0" dy="0">meses</tspan></text><rect x="40.0" y="279.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="295.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Suelta cubos en una taza</tspan></text><text x="48.0" y="310.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">12 meses</tspan></text><rect x="506.7" y="287.0" width="54.2" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="333.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Torre de 2 cubos</tspan></text><text x="48.0" y="348.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">15 meses</tspan></text><rect x="560.8" y="325.0" width="54.2" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><rect x="40.0" y="355.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="371.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Torre de 3 o 4 cubos</tspan></text><text x="48.0" y="386.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">18 meses</tspan></text><rect x="615.0" y="363.0" width="108.3" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Torre de 6 o 7 cubos</tspan></text><text x="48.0" y="424.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">24 meses: opción correcta</tspan></text><rect x="723.3" y="401.0" width="108.3" height="22.0" rx="6" fill="#ea580c" stroke="none" stroke-width="1.5"/><rect x="40.0" y="431.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="447.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Torre de 8 o más cubos</tspan></text><text x="48.0" y="462.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">30 a 36 meses</tspan></text><rect x="831.7" y="439.0" width="108.3" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="485.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Copia un puente de 3 cubos</tspan></text><text x="48.0" y="500.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">36 meses</tspan></text><rect x="940.0" y="477.0" width="6.0" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><line x1="723.3" y1="277.0" x2="723.3" y2="513.0" stroke="#b91c1c" stroke-width="2.6"/><rect x="631.9" y="513.0" width="182.8" height="22.0" rx="11" fill="#b91c1c" stroke="none" stroke-width="1.5"/><text x="723.3" y="528.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="723.3" dy="0">Caso: 7 cubos a los 24 meses</tspan></text><rect x="40.0" y="559.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="585.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">7 cubos = 24 meses</tspan></text><text x="60.0" y="604.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Menos cubos corresponden a edades menores; 8 o más, a 30 a 36 meses.</tspan></text><text x="40.0" y="665.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TORRE DE CUBOS POR EDAD</tspan></text><rect x="40.0" y="677.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="696.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Edad</tspan></text><text x="220.0" y="696.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="734"><tspan x="220.0" dy="0">Logro</tspan></text><rect x="40.0" y="706.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="725.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">12 meses</tspan></text><text x="220.0" y="725.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="734"><tspan x="220.0" dy="0">Suelta cubos dentro de una taza</tspan></text><rect x="40.0" y="735.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="754.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">15 meses</tspan></text><text x="220.0" y="754.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="734"><tspan x="220.0" dy="0">Torre de 2 cubos</tspan></text><rect x="40.0" y="764.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="783.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">18 meses</tspan></text><text x="220.0" y="783.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="734"><tspan x="220.0" dy="0">Torre de 3 o 4 cubos</tspan></text><rect x="40.0" y="793.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="812.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">24 meses</tspan></text><text x="220.0" y="812.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="734"><tspan x="220.0" dy="0">Torre de 6 o 7 cubos</tspan></text><rect x="110.6" y="796.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="156.0" y="811.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="156.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="822.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="841.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">30 a 36 meses</tspan></text><text x="220.0" y="841.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="734"><tspan x="220.0" dy="0">Torre de 8 o más cubos</tspan></text><rect x="40.0" y="851.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="870.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">36 meses</tspan></text><text x="220.0" y="870.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="734"><tspan x="220.0" dy="0">Copia un puente de 3 cubos y un círculo</tspan></text><text x="40.0" y="896.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Las escalas varían en uno o dos cubos entre fuentes (Nelson 22.ª ed.).</tspan></text><text x="40.0" y="943.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="953.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="975.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="956.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="975.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">24</tspan></text><text x="435.0" y="975.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">15</tspan></text><text x="585.0" y="975.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">18</tspan></text><text x="735.0" y="975.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">12</tspan></text><text x="885.0" y="975.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">20</tspan></text><rect x="40.0" y="990.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="990.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1019.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Edad para 7 cubos?</tspan></text><text x="285.0" y="1011.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: rango de 6 a 7</tspan><tspan x="285.0" dy="16">cubos</tspan></text><text x="435.0" y="1011.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: corresponde a</tspan><tspan x="435.0" dy="16">torre de 2 cubos</tspan></text><text x="585.0" y="1011.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: corresponde a</tspan><tspan x="585.0" dy="16">torre de 3 o 4 cubos</tspan></text><text x="735.0" y="1011.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: suelta cubos en</tspan><tspan x="735.0" dy="16">una taza</tspan></text><text x="885.0" y="1011.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: aún corresponde a</tspan><tspan x="885.0" dy="16">4 o 5 cubos</tspan></text><rect x="40.0" y="953.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1064.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1092.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1114.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Secuencia: 12 meses suelta cubos en una taza; 15 meses torre de 2; 18 meses de 3 o 4; 24 meses de 6 o 7; 30 a 36 meses de 8 o más; 36 meses copia</tspan><tspan x="58.0" dy="18">   un puente de 3 cubos.</tspan><tspan x="58.0" dy="18">• Las escalas difieren en uno o dos cubos entre fuentes: la pregunta se contesta por el rango de edad.</tspan><tspan x="58.0" dy="18">• Alerta: retraso de 2 o más desviaciones estándar obliga a aplicar una escala validada, descartar déficit auditivo o visual y derivar a estimulación temprana</tspan><tspan x="58.0" dy="18">   o neuropediatría.</tspan><tspan x="58.0" dy="18">• Alerta: la regresión de hitos ya adquiridos sugiere un trastorno neurodegenerativo, no un simple retraso.</tspan></text><text x="58.0" y="1226.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAP, Vigilancia y cribado del desarrollo y la conducta (Lipkin y cols., Pediatrics 2020;145:e20193449); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>