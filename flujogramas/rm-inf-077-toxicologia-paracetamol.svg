<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="952" viewBox="0 0 1000 952" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la intoxicación por paracetamol con más de 8 horas se indica N-acetilcisteína: repone el glutatión"><title>En la intoxicación por paracetamol con más de 8 horas se indica N-acetilcisteína: repone el glutatión</title><rect x="0.75" y="0.75" width="998.5" height="950.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Toxicología · paracetamol</tspan></text><rect x="352.9" y="32.0" width="121.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="413.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="106"><tspan x="413.8" dy="0">INFECTOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Intoxicación por paracetamol</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El metabolito NAPQI agota el glutatión y necrosa el hepatocito centrolobulillar.</tspan><tspan x="58.0" dy="17">El antídoto repone el glutatión.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Ingestión de paracetamol</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Han pasado más de 8 horas.</tspan><tspan x="640.0" dy="16">¿Qué tratamiento está indicado?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SE INDICA SEGÚN LAS HORAS DESDE LA INGESTIÓN</tspan></text><line x1="290.0" y1="291.0" x2="290.0" y2="485.0" stroke="#e2e8f0" stroke-width="1"/><text x="290.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="290.0" dy="0">0</tspan></text><line x1="398.3" y1="291.0" x2="398.3" y2="485.0" stroke="#e2e8f0" stroke-width="1"/><text x="398.3" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="398.3" dy="0">12</tspan></text><line x1="506.7" y1="291.0" x2="506.7" y2="485.0" stroke="#e2e8f0" stroke-width="1"/><text x="506.7" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="506.7" dy="0">24</tspan></text><line x1="615.0" y1="291.0" x2="615.0" y2="485.0" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="615.0" dy="0">36</tspan></text><line x1="723.3" y1="291.0" x2="723.3" y2="485.0" stroke="#e2e8f0" stroke-width="1"/><text x="723.3" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="723.3" dy="0">48</tspan></text><line x1="831.7" y1="291.0" x2="831.7" y2="485.0" stroke="#e2e8f0" stroke-width="1"/><text x="831.7" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="831.7" dy="0">60</tspan></text><line x1="940.0" y1="291.0" x2="940.0" y2="485.0" stroke="#e2e8f0" stroke-width="1"/><text x="940.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="940.0" dy="0">72</tspan></text><text x="940.0" y="273.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="end" data-max="60"><tspan x="940.0" dy="0">horas</tspan></text><rect x="40.0" y="295.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="311.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Carbón activado</tspan></text><text x="48.0" y="326.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Solo si la ingestión es reciente</tspan></text><rect x="290.0" y="303.0" width="18.1" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="349.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">N-acetilcisteína: máxima eficacia</tspan></text><text x="48.0" y="364.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Dentro de las 8 a 10 horas</tspan></text><rect x="290.0" y="341.0" width="90.3" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><rect x="40.0" y="371.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="387.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">N-acetilcisteína tardía (este caso)</tspan></text><text x="48.0" y="402.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Conserva beneficio; no esperar el nivel</tspan></text><rect x="362.2" y="379.0" width="577.8" height="22.0" rx="6" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="48.0" y="425.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Nomograma de Rumack-Matthew</tspan></text><text x="48.0" y="440.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Se interpreta desde las 4 horas</tspan></text><rect x="326.1" y="417.0" width="180.6" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><rect x="40.0" y="447.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="463.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Fase de daño hepático</tspan></text><text x="48.0" y="478.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Transaminasas altas; falla fulminante</tspan></text><rect x="506.7" y="455.0" width="433.3" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><line x1="362.2" y1="293.0" x2="362.2" y2="491.0" stroke="#b91c1c" stroke-width="2.6"/><rect x="333.3" y="491.0" width="57.9" height="22.0" rx="11" fill="#b91c1c" stroke="none" stroke-width="1.5"/><text x="362.2" y="506.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="362.2" dy="0">8 horas</tspan></text><rect x="40.0" y="537.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="563.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Paracetamol después de 8 horas = N-acetilcisteína</tspan></text><text x="60.0" y="582.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El carbón activado ya no sirve; piridoxina, pralidoxima y furosemida no son su antídoto.</tspan></text><text x="40.0" y="649.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="659.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="681.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="681.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Carbón activado</tspan></text><rect x="363.0" y="662.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="681.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">N-acetilcisteína</tspan></text><text x="585.0" y="681.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Piridoxina</tspan></text><text x="735.0" y="681.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Pralidoxima</tspan></text><text x="885.0" y="681.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Furosemida</tspan></text><rect x="40.0" y="696.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="696.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="717.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tratamiento después</tspan><tspan x="54.0" dy="16">de 8 horas?</tspan></text><text x="285.0" y="717.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: solo útil en la</tspan><tspan x="285.0" dy="16">primera hora o dos</tspan></text><text x="435.0" y="717.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: repone el glutatión</tspan><tspan x="435.0" dy="16">y conserva beneficio</tspan></text><text x="585.0" y="717.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: antídoto de la</tspan><tspan x="585.0" dy="16">isoniazida</tspan></text><text x="735.0" y="717.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: antídoto de los</tspan><tspan x="735.0" dy="16">organofosforados</tspan></text><text x="885.0" y="725.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no es un antídoto</tspan></text><rect x="40.0" y="659.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="770.0" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="798.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="820.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Dosis tóxica: más de 150 mg/kg o más de 7,5 a 10 g en el adulto. Fases: asintomática o náuseas; hepática (24-72 h); falla hepática fulminante.</tspan><tspan x="58.0" dy="18">• La N-acetilcisteína tiene máxima eficacia dentro de las 8 a 10 horas, pero conserva beneficio si se da más tarde: no se espera el nivel sérico.</tspan><tspan x="58.0" dy="18">• El carbón activado solo sirve en la primera hora o dos. Nomograma de Rumack-Matthew a partir de las 4 horas de la ingestión.</tspan><tspan x="58.0" dy="18">• Alerta: ingestión de hora desconocida o incierta = tratar siempre con N-acetilcisteína. Piridoxina es para isoniazida y pralidoxima para organofosforados.</tspan></text><text x="58.0" y="896.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Chiew AL y cols., Updated guidelines for the management of paracetamol poisoning in Australia and New Zealand (Med J Aust 2020); Heard KJ, Acetylcysteine for</tspan><tspan x="58.0" dy="15">acetaminophen poisoning (N Engl J Med 2008).</tspan></text></svg>