<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1108" viewBox="0 0 1000 1108" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En el asma el parámetro más disminuido es el VEF1: patrón obstructivo con relación VEF1/CVF menor de 0,70"><title>En el asma el parámetro más disminuido es el VEF1: patrón obstructivo con relación VEF1/CVF menor de 0,70</title><rect x="0.75" y="0.75" width="998.5" height="1106.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neumología · espirometría del asma</tspan></text><rect x="413.3" y="32.0" width="114.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="470.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="99"><tspan x="470.8" dy="0">NEUMOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Asma bronquial</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Inflamación crónica con obstrucción variable y reversible al flujo espiratorio.</tspan><tspan x="58.0" dy="17">Tos, sibilancias, disnea y opresión, a menudo nocturnas o estacionales.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 18 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Tos seca, opresión torácica y disnea intermitente que</tspan><tspan x="640.0" dy="16">empeora en invierno desde hace 2 años.</tspan><tspan x="640.0" dy="16">Sibilantes en ambos campos.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ INDICA LA RELACIÓN VEF1/CVF</tspan></text><rect x="40.0" y="285.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="311.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Relación VEF1/CVF (%)</tspan></text><text x="60.0" y="330.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Menos de 70 % indica obstrucción al flujo espiratorio.</tspan></text><rect x="70.0" y="394.0" width="430.0" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="285.0" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="420"><tspan x="285.0" dy="0">Obstructivo: asma, EPOC</tspan></text><rect x="500.0" y="394.0" width="430.0" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="715.0" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="420"><tspan x="715.0" dy="0">Normal o restrictivo</tspan></text><line x1="70.0" y1="434.0" x2="70.0" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="70.0" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="70.0" dy="0">40 %</tspan></text><line x1="213.3" y1="434.0" x2="213.3" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="213.3" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="213.3" dy="0">50 %</tspan></text><line x1="356.7" y1="434.0" x2="356.7" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="356.7" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="356.7" dy="0">60 %</tspan></text><line x1="500.0" y1="434.0" x2="500.0" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="500.0" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="500.0" dy="0">70 %</tspan></text><line x1="643.3" y1="434.0" x2="643.3" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="643.3" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="643.3" dy="0">80 %</tspan></text><line x1="786.7" y1="434.0" x2="786.7" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="786.7" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="786.7" dy="0">90 %</tspan></text><line x1="930.0" y1="434.0" x2="930.0" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">100 %</tspan></text><polygon points="376.3,380.0 394.3,380.0 385.3,392.0" fill="#ea580c"/><rect x="276.8" y="354.0" width="217.2" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="385.3" y="369.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="205"><tspan x="385.3" dy="0">◆ ASMA: VEF1/CVF MENOR DE 70 %</tspan></text><text x="40.0" y="502.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ DECIDE EL PATRÓN</tspan></text><rect x="40.0" y="512.0" width="297.3" height="85.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="513.0" width="6.0" height="83.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="536.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">VEF1 muy disminuido</tspan></text><text x="58.0" y="557.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Más que la CVF: patrón obstructivo del asma</tspan></text><rect x="351.3" y="512.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="513.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="536.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Reversibilidad</tspan></text><text x="369.3" y="557.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Aumento de 12 % y 200 mL tras broncodilatador</tspan></text><rect x="662.7" y="512.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="513.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="536.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Capacidad vital y pulmonar total</tspan></text><text x="680.7" y="557.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Bajan en el patrón restrictivo, con relación normal</tspan><tspan x="680.7" dy="16">o alta</tspan></text><text x="40.0" y="631.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PATRONES ESPIROMÉTRICOS</tspan></text><rect x="40.0" y="643.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="662.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Patrón</tspan></text><text x="250.0" y="662.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="164"><tspan x="250.0" dy="0">VEF1</tspan></text><text x="430.0" y="662.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="164"><tspan x="430.0" dy="0">CVF</tspan></text><text x="610.0" y="662.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="164"><tspan x="610.0" dy="0">VEF1/CVF</tspan></text><text x="790.0" y="662.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="164"><tspan x="790.0" dy="0">Ejemplo</tspan></text><rect x="40.0" y="672.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="691.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Obstructivo</tspan></text><text x="250.0" y="691.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="164"><tspan x="250.0" dy="0">Muy disminuido</tspan></text><text x="430.0" y="691.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="164"><tspan x="430.0" dy="0">Normal o algo baja</tspan></text><text x="610.0" y="691.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="164"><tspan x="610.0" dy="0">Menor de 0,70</tspan></text><text x="790.0" y="691.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="164"><tspan x="790.0" dy="0">Asma, EPOC</tspan></text><rect x="140.6" y="675.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="186.0" y="690.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="186.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="701.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="720.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Restrictivo</tspan></text><text x="250.0" y="720.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="164"><tspan x="250.0" dy="0">Disminuido</tspan></text><text x="430.0" y="720.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="164"><tspan x="430.0" dy="0">Disminuida</tspan></text><text x="610.0" y="720.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="164"><tspan x="610.0" dy="0">Normal o alta</tspan></text><text x="790.0" y="720.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="164"><tspan x="790.0" dy="0">Fibrosis pulmonar</tspan></text><text x="40.0" y="770.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="780.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="819.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="783.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="819.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">VEF1</tspan></text><text x="435.0" y="811.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Volumen de reserva</tspan><tspan x="435.0" dy="17">inspiratoria</tspan></text><text x="585.0" y="802.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Volumen de</tspan><tspan x="585.0" dy="17">ventilación</tspan><tspan x="585.0" dy="17">pulmonar</tspan></text><text x="735.0" y="811.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Capacidad</tspan><tspan x="735.0" dy="17">inspiratoria</tspan></text><text x="885.0" y="819.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Capacidad vital</tspan></text><rect x="40.0" y="851.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="851.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="880.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Parámetro más</tspan><tspan x="54.0" dy="16">disminuido?</tspan></text><text x="285.0" y="880.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: obstrucción</tspan><tspan x="285.0" dy="16">espiratoria al flujo</tspan></text><text x="435.0" y="888.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: cambia poco</tspan></text><text x="585.0" y="888.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: cambia poco</tspan></text><text x="735.0" y="888.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: cambia poco</tspan></text><text x="885.0" y="872.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: baja poco, solo</tspan><tspan x="885.0" dy="16">con atrapamiento en</tspan><tspan x="885.0" dy="16">las crisis</tspan></text><rect x="40.0" y="780.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="941.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="969.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="991.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La limitación al flujo reduce sobre todo el VEF1 más que la CVF: la relación VEF1/CVF cae por debajo de 0,70 (o del límite inferior de lo normal).</tspan><tspan x="58.0" dy="18">• Reversibilidad: aumento del VEF1 de 12 % y 200 mL o más tras broncodilatador, o variabilidad del flujo espiratorio máximo mayor de 10 %.</tspan><tspan x="58.0" dy="18">• El volumen de reserva inspiratoria y la capacidad inspiratoria cambian poco; en las crisis hay atrapamiento aéreo y sube el volumen residual.</tspan><tspan x="58.0" dy="18">• Alerta: una espirometría normal no excluye asma si está asintomático: prueba de broncoprovocación con metacolina.</tspan></text><text x="58.0" y="1067.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: GINA 2025; ERS/ATS, Eur Respir J 2022;60:2101499; Guyton y Hall, 14.ª ed. (2021).</tspan></text></svg>