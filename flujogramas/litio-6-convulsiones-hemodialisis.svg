<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1240" viewBox="0 0 1000 1240" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Paciente bipolar con litio de 6 mEq/L, convulsiones, alteración de conciencia, ataxia, arritmia y creatinina alta: intoxicación grave, hemodiálisis"><title>Paciente bipolar con litio de 6 mEq/L, convulsiones, alteración de conciencia, ataxia, arritmia y creatinina alta: intoxicación grave, hemodiálisis</title><rect x="0.75" y="0.75" width="998.5" height="1239.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Toxicología · litio</tspan></text><rect x="302.3" y="32.0" width="124.2" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="364.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="108"><tspan x="364.4" dy="0">PSIQUIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Intoxicación por litio</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Rango terapéutico 0,6-1,2 mEq/L; tóxico &gt; 1,5; el riñón lo elimina.</tspan><tspan x="58.0" dy="17">Neurológica: temblor grueso, ataxia, disartria, confusión, convulsiones y coma; arritmias.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 52 años, bipolar</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Intento de suicidio; convulsiones y alteración de</tspan><tspan x="640.0" dy="16">conciencia.</tspan><tspan x="640.0" dy="16">Somnolienta, movimientos involuntarios, ataxia,</tspan><tspan x="640.0" dy="16">disartria, arritmia; creatinina 1,8, litio 6.</tspan></text><line x1="640.0" y1="237.0" x2="670.0" y2="237.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#94a3b8"/><line x1="500.0" y1="393.0" x2="500.0" y2="423.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="423.0" x2="733.5" y2="423.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="423.0" x2="266.5" y2="452.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,451.0 271.5,451.0 266.5,459.0" fill="#94a3b8"/><line x1="733.5" y1="423.0" x2="733.5" y2="452.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,451.0 738.5,451.0 733.5,459.0" fill="#94a3b8"/><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#0f766e"/><line x1="500.0" y1="393.0" x2="500.0" y2="423.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="423.0" x2="500.0" y2="423.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="423.0" x2="266.5" y2="452.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,451.0 271.5,451.0 266.5,459.0" fill="#0f766e"/><rect x="178.5" y="432.0" width="176.0" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="444.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Sí: 6 + convulsiones (este caso)</tspan></text><rect x="705.7" y="432.0" width="55.6" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="444.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">No: leve</tspan></text><polygon points="240.0,358.0 266.0,323.0 734.0,323.0 760.0,358.0 734.0,393.0 266.0,393.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="358.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="363.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="354.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Intoxicación por litio: ¿nivel &gt; 4 con falla renal, &gt; 5, o</tspan><tspan x="519.0" dy="17">síntomas graves?</tspan></text><rect x="40.0" y="459.0" width="453.0" height="73.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="487.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">HEMODIÁLISIS</tspan></text><text x="266.5" y="510.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Repetir niveles (rebote)</tspan></text><rect x="507.0" y="459.0" width="453.0" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="487.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Suero salino</tspan></text><text x="733.5" y="510.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Suspender el litio</tspan></text><text x="40.0" y="572.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="584.5" width="920.0" height="346.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="598.5" width="331.9" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="222.0" y="618.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="222.0" dy="0">GRAVEDAD DE LA INTOXICACIÓN POR LITIO</tspan></text><text x="403.9" y="618.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="538"><tspan x="403.9" dy="0">Por los síntomas (más que por el nivel).</tspan></text><rect x="56.0" y="658.5" width="288.0" height="121.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="659.1" width="286.8" height="63.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="200.0" y="686.5" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="272"><tspan x="200.0" dy="0">LEVE</tspan></text><text x="200.0" y="706.5" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="264"><tspan x="200.0" dy="0">1,5-2,5 mEq/L</tspan></text><circle cx="72.0" cy="731.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="735.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="82.0" dy="0">Temblor, náuseas</tspan></text><rect x="356.0" y="658.5" width="288.0" height="121.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="356.6" y="659.1" width="286.8" height="63.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="500.0" y="686.5" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="272"><tspan x="500.0" dy="0">MODERADA</tspan></text><text x="500.0" y="706.5" font-size="14" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="264"><tspan x="500.0" dy="0">2,5-3,5</tspan></text><circle cx="372.0" cy="731.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="382.0" y="735.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="382.0" dy="0">Confusión, ataxia</tspan></text><rect x="656.0" y="658.5" width="288.0" height="121.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="657.2" y="659.7" width="285.6" height="63.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="800.0" y="686.5" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="272"><tspan x="800.0" dy="0">GRAVE</tspan></text><text x="800.0" y="706.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="264"><tspan x="800.0" dy="0">&gt; 3,5</tspan></text><circle cx="672.0" cy="731.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="682.0" y="735.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="250"><tspan x="682.0" dy="0">Convulsiones, coma</tspan></text><circle cx="672.0" cy="754.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="682.0" y="758.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="250"><tspan x="682.0" dy="0">Arritmia</tspan></text><rect x="754.6" y="647.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="800.0" y="662.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="800.0" dy="0">◆ ESTE CASO</tspan></text><text x="56.0" y="809.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="818.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="833.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="833.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Litio 6 mEq/L</tspan></text><rect x="56.0" y="840.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="855.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="855.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Convulsiones y arritmia</tspan></text><rect x="56.0" y="877.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="900.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Hemodiálisis urgente.</tspan></text><text x="40.0" y="970.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="980.5" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1003.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1003.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Lavado gástrico</tspan></text><text x="435.0" y="1003.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Fluidoterapia</tspan></text><text x="585.0" y="1003.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Diuréticos</tspan></text><rect x="663.0" y="983.5" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="1003.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hemodiálisis</tspan></text><text x="885.0" y="1003.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Naloxona</tspan></text><rect x="40.0" y="1017.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="1017.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1046.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tratamiento?</tspan></text><text x="285.0" y="1038.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Poco útil; no se une al</tspan><tspan x="285.0" dy="16">carbón</tspan></text><text x="435.0" y="1038.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Apoyo, no basta en</tspan><tspan x="435.0" dy="16">grave</tspan></text><text x="585.0" y="1038.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: empeoran la</tspan><tspan x="585.0" dy="16">retención</tspan></text><text x="735.0" y="1046.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: lo elimina rápido</tspan></text><text x="885.0" y="1046.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no es opioide</tspan></text><rect x="40.0" y="980.5" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1091.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1119.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1141.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Hemodiálisis: litio &gt; 4 con falla renal, o &gt; 5, o síntomas graves (convulsiones, coma, arritmia).</tspan><tspan x="58.0" dy="18">• Suero salino si hay deshidratación; no da carbón activado (no se une al litio).</tspan><tspan x="58.0" dy="18">• Irrigación intestinal total si tomó tabletas de liberación prolongada.</tspan></text><text x="58.0" y="1199.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: EXTRIP, litio (2015); Goldfrank (11.ª ed.).</tspan></text></svg>