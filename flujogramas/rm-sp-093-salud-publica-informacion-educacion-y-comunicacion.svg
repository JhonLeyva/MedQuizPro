<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="984" viewBox="0 0 1000 984" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Exponer a la familia los factores de riesgo y las acciones para reducirlos es una charla"><title>Exponer a la familia los factores de riesgo y las acciones para reducirlos es una charla</title><rect x="0.75" y="0.75" width="998.5" height="982.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Salud pública · información, educación y comunicación</tspan></text><rect x="527.4" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="591.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="591.7" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">IEC</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Información, educación y comunicación: actividades que informan y modifican conductas.</tspan><tspan x="58.0" dy="17">Surgió con el enfoque de prevenir más que curar.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Visita domiciliaria por diarrea</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niños con más de cinco episodios de diarrea aguda al</tspan><tspan x="640.0" dy="16">año.</tspan><tspan x="640.0" dy="16">El médico reúne a padres y hermanos y expone los</tspan><tspan x="640.0" dy="16">factores de riesgo.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE RECONOCE LA ACCIÓN DE IEC</tspan></text><rect x="40.0" y="301.0" width="920.0" height="70.0" rx="12" fill="#ea580c" stroke="none" stroke-width="1.5"/><rect x="54.0" y="320.0" width="74.0" height="32.0" rx="16" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="91.0" y="341.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ea580c" text-anchor="middle" data-max="64"><tspan x="91.0" dy="0">PASO 1</tspan></text><text x="144.0" y="326.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="800"><tspan x="144.0" dy="0">Médico reúne a padres y hermanos y expone riesgos y acciones</tspan></text><text x="144.0" y="345.0" font-size="12" font-weight="600" font-style="normal" fill="#fff7ed" text-anchor="start" data-max="800"><tspan x="144.0" dy="0">Sí: es una exposición oral a un grupo pequeño.</tspan></text><line x1="500.0" y1="373.0" x2="500.0" y2="388.0" stroke="#ea580c" stroke-width="2"/><polygon points="495.0,387.0 505.0,387.0 500.0,395.0" fill="#ea580c"/><rect x="40.0" y="401.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="423.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="170"><tspan x="54.0" dy="0">ACCIÓN</tspan></text><text x="412.5" y="423.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="345"><tspan x="412.5" dy="0">Qué hace</tspan></text><text x="777.5" y="423.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="345"><tspan x="777.5" dy="0">Diferencia</tspan></text><rect x="40.0" y="441.0" width="184.0" height="57.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="467.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Charla</tspan></text><text x="54.0" y="484.0" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Exposición a un grupo</tspan></text><rect x="233.0" y="441.0" width="359.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="245.0" y="466.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Presentación hablada de un tema</tspan></text><text x="245.0" y="482.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Informa, motiva y cambia actitudes</tspan></text><rect x="598.0" y="441.0" width="359.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="610.0" y="466.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Es el caso</tspan></text><text x="610.0" y="482.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Grupo pequeño en la visita domiciliaria</tspan></text><rect x="856.2" y="430.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="901.6" y="445.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="901.6" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="504.0" width="184.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="530.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Entrevista</tspan></text><text x="54.0" y="547.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Diálogo individual</tspan></text><rect x="233.0" y="504.0" width="359.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="245.0" y="529.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Recoge datos de una persona</tspan></text><text x="245.0" y="545.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Pregunta y escucha</tspan></text><rect x="598.0" y="504.0" width="359.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="610.0" y="529.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">No es el caso</tspan></text><text x="610.0" y="545.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">El médico expone, no interroga</tspan></text><rect x="40.0" y="567.0" width="184.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="593.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Capacitación</tspan></text><text x="54.0" y="610.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Formación en destrezas</tspan></text><rect x="233.0" y="567.0" width="359.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="245.0" y="592.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Enseña una destreza con práctica</tspan></text><text x="245.0" y="608.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Taller o curso</tspan></text><rect x="598.0" y="567.0" width="359.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="610.0" y="592.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">No es el caso</tspan></text><text x="610.0" y="608.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">No hay práctica de una habilidad</tspan></text><text x="40.0" y="664.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="674.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="705.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="705.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Entrevista</tspan></text><text x="435.0" y="705.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Capacitación</tspan></text><text x="585.0" y="705.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Coordinación</tspan></text><rect x="663.0" y="677.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="705.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Charla</tspan></text><text x="885.0" y="696.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Educación</tspan><tspan x="885.0" dy="17">comunitaria</tspan></text><rect x="40.0" y="728.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="728.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="749.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué acción de IEC</tspan><tspan x="54.0" dy="16">hizo?</tspan></text><text x="285.0" y="749.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no recoge datos,</tspan><tspan x="285.0" dy="16">expone un tema</tspan></text><text x="435.0" y="757.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no forma destrezas</tspan></text><text x="585.0" y="749.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no hay acuerdo</tspan><tspan x="585.0" dy="16">con otra institución</tspan></text><text x="735.0" y="749.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: exposición a un</tspan><tspan x="735.0" dy="16">grupo</tspan></text><text x="885.0" y="749.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es un proceso más</tspan><tspan x="885.0" dy="16">amplio y sostenido</tspan></text><rect x="40.0" y="674.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="802.0" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="830.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="852.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Charla: presentación hablada de un tema a un grupo pequeño para informar, motivar y cambiar actitudes; es lo que hace el médico.</tspan><tspan x="58.0" dy="18">• Entrevista: diálogo individual para recoger datos. Capacitación: formación en destrezas, con práctica. Coordinación: acuerdos con otras instituciones.</tspan><tspan x="58.0" dy="18">• Educación comunitaria: trabajo sostenido con una población, más amplio que una visita.</tspan><tspan x="58.0" dy="18">• Alerta: los contenidos de la charla son lavado de manos, agua segura y eliminación sanitaria de excretas.</tspan></text><text x="58.0" y="928.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS/UNICEF, Diarrea: por qué los niños siguen muriendo (2009); OMS, Guía de manejo de la diarrea aguda en el niño (2024); MINSA, Modelo de Atención Integral de</tspan><tspan x="58.0" dy="15">Salud basado en Familia y Comunidad (RM 464-2011/MINSA).</tspan></text></svg>