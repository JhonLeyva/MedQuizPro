<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1186" viewBox="0 0 1000 1186" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la lesión renal aguda oligúrica el agua libre se retiene y el sodio plasmático baja: hiponatremia dilucional"><title>En la lesión renal aguda oligúrica el agua libre se retiene y el sodio plasmático baja: hiponatremia dilucional</title><rect x="0.75" y="0.75" width="998.5" height="1184.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Nefrología · lesión renal aguda</tspan></text><rect x="381.8" y="32.0" width="182.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="473.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="167"><tspan x="473.1" dy="0">NEFROLOGÍA Y UROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Lesión renal aguda (KDIGO)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Creatinina +0,3 mg/dL en 48 horas, 1,5 veces la basal en 7 días o diuresis &lt; 0,5 mL/kg/h</tspan><tspan x="58.0" dy="17">por 6 horas.</tspan><tspan x="58.0" dy="17">El riñón pierde la capacidad de excretar agua, sodio, potasio, fosfato y ácidos.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">En la insuficiencia renal aguda, ¿cuál es el trastorno</tspan><tspan x="640.0" dy="16">electrolítico que se encuentra?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SE ENCUENTRA EN LA SANGRE EN LA LESIÓN RENAL AGUDA OLIGÚRICA (PATRÓN ESPERADO)</tspan></text><rect x="40.0" y="269.0" width="920.0" height="32.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="290.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="180"><tspan x="54.0" dy="0">EXAMEN</tspan></text><text x="250.0" y="290.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="130"><tspan x="250.0" dy="0">VALOR DEL CASO</tspan></text><text x="400.0" y="290.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="130"><tspan x="400.0" dy="0">NORMAL</tspan></text><text x="550.0" y="290.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="400"><tspan x="550.0" dy="0">QUÉ SIGNIFICA</tspan></text><rect x="40.0" y="307.0" width="920.0" height="40.0" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="331.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Sodio</tspan></text><text x="250.0" y="332.0" font-size="13" font-weight="800" font-style="normal" fill="#2563eb" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Bajo  ↓</tspan></text><text x="400.0" y="331.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">135-145 mEq/L</tspan></text><text x="550.0" y="331.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Hiponatremia dilucional por retención de agua libre: la opción del caso.</tspan></text><rect x="40.0" y="351.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="375.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Potasio</tspan></text><text x="250.0" y="376.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Alto  ↑</tspan></text><text x="400.0" y="375.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">3,5-5,0 mEq/L</tspan></text><text x="550.0" y="375.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">No se excreta: riesgo de arritmias y de paro.</tspan></text><rect x="40.0" y="395.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Fosfato</tspan></text><text x="250.0" y="420.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Alto  ↑</tspan></text><text x="400.0" y="419.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">2,5-4,5 mg/dL</tspan></text><text x="550.0" y="419.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Se acumula al caer la filtración.</tspan></text><rect x="40.0" y="439.0" width="920.0" height="40.0" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="463.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Calcio</tspan></text><text x="250.0" y="464.0" font-size="13" font-weight="800" font-style="normal" fill="#2563eb" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Bajo  ↓</tspan></text><text x="400.0" y="463.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">8,5-10,5 mg/dL</tspan></text><text x="550.0" y="463.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Tiende a bajar; la hipercalcemia es excepcional.</tspan></text><rect x="40.0" y="483.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="507.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Magnesio</tspan></text><text x="250.0" y="508.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Alto  ↑</tspan></text><text x="400.0" y="507.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">1,7-2,2 mg/dL</tspan></text><text x="550.0" y="507.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Se retiene: no hay hipomagnesemia.</tspan></text><rect x="40.0" y="527.0" width="920.0" height="40.0" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="551.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Bicarbonato</tspan></text><text x="250.0" y="552.0" font-size="13" font-weight="800" font-style="normal" fill="#2563eb" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Bajo  ↓</tspan></text><text x="400.0" y="551.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">22-26 mEq/L</tspan></text><text x="550.0" y="551.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Acidosis metabólica por ácidos no excretados.</tspan></text><rect x="40.0" y="585.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="611.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Oliguria + agua libre retenida = hiponatremia</tspan></text><text x="60.0" y="630.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Hipopotasemia, hipomagnesemia e hipofosforemia son lo contrario de lo esperado.</tspan></text><text x="40.0" y="691.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ESTADIOS DE LA LESIÓN RENAL AGUDA (KDIGO 2012)</tspan></text><rect x="40.0" y="703.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="722.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="64"><tspan x="50.0" dy="0">Estadio</tspan></text><text x="130.0" y="722.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="404"><tspan x="130.0" dy="0">Creatinina sérica</tspan></text><text x="550.0" y="722.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="404"><tspan x="550.0" dy="0">Diuresis</tspan></text><rect x="40.0" y="732.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="751.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="64"><tspan x="50.0" dy="0">1</tspan></text><text x="130.0" y="751.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="404"><tspan x="130.0" dy="0">1,5 a 1,9 veces la basal, o aumento de 0,3 mg/dL o más</tspan></text><text x="550.0" y="751.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="404"><tspan x="550.0" dy="0">&lt; 0,5 mL/kg/h por 6 a 12 horas</tspan></text><rect x="40.0" y="761.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="780.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="64"><tspan x="50.0" dy="0">2</tspan></text><text x="130.0" y="780.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="404"><tspan x="130.0" dy="0">2,0 a 2,9 veces la basal</tspan></text><text x="550.0" y="780.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="404"><tspan x="550.0" dy="0">&lt; 0,5 mL/kg/h por 12 horas o más</tspan></text><rect x="40.0" y="790.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="809.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="64"><tspan x="50.0" dy="0">3</tspan></text><text x="130.0" y="809.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="404"><tspan x="130.0" dy="0">3,0 veces la basal, o 4,0 mg/dL o más, o inicio de diálisis</tspan></text><text x="550.0" y="809.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="404"><tspan x="550.0" dy="0">&lt; 0,3 mL/kg/h por 24 horas o más, o anuria por 12 horas o más</tspan></text><text x="40.0" y="835.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Se clasifica con el criterio peor, de creatinina o de diuresis.</tspan></text><text x="40.0" y="882.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="892.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="914.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="914.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hipopotasemia</tspan></text><text x="435.0" y="914.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hipercalcemia</tspan></text><text x="585.0" y="914.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Hipomagnesemia</tspan></text><rect x="663.0" y="895.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="914.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hiponatremia</tspan></text><text x="885.0" y="914.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hipofosforemia</tspan></text><rect x="40.0" y="929.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="929.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="966.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Trastorno electrolítico?</tspan></text><text x="285.0" y="958.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: el potasio sube, no</tspan><tspan x="285.0" dy="16">baja</tspan></text><text x="435.0" y="958.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: lo habitual es</tspan><tspan x="435.0" dy="16">hipocalcemia</tspan></text><text x="585.0" y="958.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: el magnesio se</tspan><tspan x="585.0" dy="16">acumula</tspan></text><text x="735.0" y="950.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: retención de agua</tspan><tspan x="735.0" dy="16">libre que diluye el</tspan><tspan x="735.0" dy="16">sodio</tspan></text><text x="885.0" y="958.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: el fosfato se</tspan><tspan x="885.0" dy="16">acumula</tspan></text><rect x="40.0" y="892.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1019.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1047.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1069.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Fase oligúrica: se retiene agua libre y el sodio plasmático se diluye (hiponatremia dilucional), a menudo con sobrecarga de volumen.</tspan><tspan x="58.0" dy="18">• Se acumulan potasio, fosfato y magnesio; el calcio tiende a bajar y hay acidosis metabólica. La hiperpotasemia es la complicación más peligrosa.</tspan><tspan x="58.0" dy="18">• Hiperpotasemia con cambios en el ECG: gluconato de calcio, insulina con glucosa y preparar la diálisis.</tspan><tspan x="58.0" dy="18">• Alerta: en la oliguria se restringe el agua libre antes que dar sodio; la hipercalcemia solo aparece en la fase diurética de la rabdomiólisis.</tspan></text><text x="58.0" y="1145.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: KDIGO, Clinical Practice Guideline for Acute Kidney Injury (2012); Harrison Principios de Medicina Interna, 21.ª ed. (2022).</tspan></text></svg>