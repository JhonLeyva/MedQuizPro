<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1122" viewBox="0 0 1000 1122" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Brote por estafilococo: 80 de 100 expuestos al sándwich enfermaron, tasa de ataque en expuestos de 80 %"><title>Brote por estafilococo: 80 de 100 expuestos al sándwich enfermaron, tasa de ataque en expuestos de 80 %</title><rect x="0.75" y="0.75" width="998.5" height="1120.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Salud pública · tasa de ataque</tspan></text><rect x="378.4" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="442.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="442.7" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tasa de ataque</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Proporción de personas expuestas que enferman en un periodo limitado.</tspan><tspan x="58.0" dy="17">Se calcula en expuestos, no expuestos y global.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Reunión de 200 participantes</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">100 casos con vómitos, diarrea y cefalea; etiología</tspan><tspan x="640.0" dy="16">estafilocócica.</tspan><tspan x="640.0" dy="16">Expuestos 80 enfermos y 20 sanos; no expuestos 20</tspan><tspan x="640.0" dy="16">enfermos y 80 sanos.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE CALCULA CON EL CUADRO DE 2 X 2</tspan></text><rect x="40.0" y="301.0" width="920.0" height="32.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="322.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="180"><tspan x="54.0" dy="0">EXAMEN</tspan></text><text x="250.0" y="322.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="130"><tspan x="250.0" dy="0">VALOR DEL CASO</tspan></text><text x="400.0" y="322.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="130"><tspan x="400.0" dy="0">NORMAL</tspan></text><text x="550.0" y="322.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="400"><tspan x="550.0" dy="0">QUÉ SIGNIFICA</tspan></text><rect x="40.0" y="339.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="363.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Expuestos</tspan></text><text x="250.0" y="364.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">80 / 100  ↑</tspan></text><text x="400.0" y="363.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Enfermos entre expuestos</tspan></text><text x="550.0" y="363.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Tasa de ataque en expuestos: 80 %.</tspan></text><rect x="40.0" y="383.0" width="920.0" height="40.0" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="407.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">No expuestos</tspan></text><text x="250.0" y="408.0" font-size="13" font-weight="800" font-style="normal" fill="#2563eb" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">20 / 100  ↓</tspan></text><text x="400.0" y="407.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Enfermos / no expuestos</tspan></text><text x="550.0" y="407.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Tasa de ataque en no expuestos: 20 %.</tspan></text><rect x="40.0" y="427.0" width="920.0" height="40.0" rx="8" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="451.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Global</tspan></text><text x="250.0" y="452.0" font-size="13" font-weight="800" font-style="normal" fill="#15803d" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">100 / 200</tspan></text><text x="400.0" y="451.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Todos los participantes</tspan></text><text x="550.0" y="451.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">50 %: mezcla ambos grupos, distractor.</tspan></text><rect x="40.0" y="471.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="495.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Riesgo relativo</tspan></text><text x="250.0" y="496.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">80 / 20 = 4  ↑</tspan></text><text x="400.0" y="495.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Expuestos / no expuestos</tspan></text><text x="550.0" y="495.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Asociación fuerte.</tspan></text><rect x="40.0" y="529.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="555.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">80 enfermos entre 100 expuestos = 80 %</tspan></text><text x="60.0" y="574.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">100 % supone que todos enfermaron; 20 % es la de no expuestos; 50 % la global.</tspan></text><text x="40.0" y="635.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CUADRO DE 2 X 2 DEL BROTE</tspan></text><rect x="40.0" y="647.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="666.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Grupo</tspan></text><text x="310.0" y="666.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="149"><tspan x="310.0" dy="0">Enfermos</tspan></text><text x="475.0" y="666.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="149"><tspan x="475.0" dy="0">Sanos</tspan></text><text x="640.0" y="666.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="149"><tspan x="640.0" dy="0">Total</tspan></text><text x="805.0" y="666.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="149"><tspan x="805.0" dy="0">Tasa de ataque</tspan></text><rect x="40.0" y="676.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="695.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Expuestos al sándwich</tspan></text><text x="310.0" y="695.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="149"><tspan x="310.0" dy="0">80</tspan></text><text x="475.0" y="695.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="149"><tspan x="475.0" dy="0">20</tspan></text><text x="640.0" y="695.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="149"><tspan x="640.0" dy="0">100</tspan></text><text x="805.0" y="695.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="149"><tspan x="805.0" dy="0">80 %</tspan></text><rect x="200.6" y="679.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="246.0" y="694.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="246.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="705.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="724.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">No expuestos</tspan></text><text x="310.0" y="724.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="149"><tspan x="310.0" dy="0">20</tspan></text><text x="475.0" y="724.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="149"><tspan x="475.0" dy="0">80</tspan></text><text x="640.0" y="724.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="149"><tspan x="640.0" dy="0">100</tspan></text><text x="805.0" y="724.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="149"><tspan x="805.0" dy="0">20 %</tspan></text><rect x="40.0" y="734.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="753.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Total</tspan></text><text x="310.0" y="753.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="149"><tspan x="310.0" dy="0">100</tspan></text><text x="475.0" y="753.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="149"><tspan x="475.0" dy="0">100</tspan></text><text x="640.0" y="753.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="149"><tspan x="640.0" dy="0">200</tspan></text><text x="805.0" y="753.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="149"><tspan x="805.0" dy="0">50 %</tspan></text><text x="40.0" y="803.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="813.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="835.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="816.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="835.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">80 %</tspan></text><text x="435.0" y="835.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">100 %</tspan></text><text x="585.0" y="835.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">20 %</tspan></text><text x="735.0" y="835.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">50 %</tspan></text><text x="885.0" y="835.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">8 %</tspan></text><rect x="40.0" y="850.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="850.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="879.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tasa de ataque en</tspan><tspan x="54.0" dy="16">expuestos?</tspan></text><text x="285.0" y="879.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: 80 enfermos entre</tspan><tspan x="285.0" dy="16">100 expuestos</tspan></text><text x="435.0" y="871.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: supondría que</tspan><tspan x="435.0" dy="16">todos los expuestos</tspan><tspan x="435.0" dy="16">enfermaron</tspan></text><text x="585.0" y="879.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es la tasa en no</tspan><tspan x="585.0" dy="16">expuestos</tspan></text><text x="735.0" y="887.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es la tasa global</tspan></text><text x="885.0" y="879.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no sale de ningún</tspan><tspan x="885.0" dy="16">cálculo</tspan></text><rect x="40.0" y="813.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="940.0" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="968.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="990.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Tasa de ataque en expuestos: 80/100 = 80 %. En no expuestos: 20/100 = 20 %. Global: 100/200 = 50 % (distractor que mezcla ambos grupos).</tspan><tspan x="58.0" dy="18">• Riesgo relativo 80/20 = 4 y riesgo atribuible 60 %: el sándwich explica la mayoría de los casos; el 20 % en no expuestos sugiere otra exposición.</tspan><tspan x="58.0" dy="18">• Intoxicación estafilocócica: toxina preformada, vómitos y diarrea a las 1 a 6 horas, de corta duración.</tspan><tspan x="58.0" dy="18">• Alerta: el alimento con mayor tasa en expuestos y menor en no expuestos es el principal sospechoso.</tspan></text><text x="58.0" y="1066.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, Principles of Epidemiology in Public Health Practice, 3.ª ed. (2012); Gordis, Epidemiología, 6.ª ed. (2019); Heymann, Control of Communicable Diseases Manual,</tspan><tspan x="58.0" dy="15">21.ª ed. (APHA, 2022).</tspan></text></svg>