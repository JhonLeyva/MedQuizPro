<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1086" viewBox="0 0 1000 1086" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La toxina botulínica impide liberar acetilcolina en la terminal presináptica: botulismo"><title>La toxina botulínica impide liberar acetilcolina en la terminal presináptica: botulismo</title><rect x="0.75" y="0.75" width="998.5" height="1084.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neurología · unión neuromuscular</tspan></text><rect x="403.0" y="32.0" width="113.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="459.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="98"><tspan x="459.9" dy="0">NEUROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Botulismo</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La toxina de Clostridium botulinum es una endopeptidasa que corta proteínas SNARE.</tspan><tspan x="58.0" dy="17">Resulta una parálisis flácida descendente y simétrica.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué entidad se produce por déficit de acetilcolina en</tspan><tspan x="640.0" dy="16">la unión neuromuscular?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ HACE LA TOXINA BOTULÍNICA EN LA UNIÓN NEUROMUSCULAR</tspan></text><rect x="40.0" y="269.0" width="920.0" height="99.0" rx="0" fill="#e0f2fe" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="269.0" width="112.0" height="99.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="322.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Sangre</tspan></text><rect x="40.0" y="368.0" width="920.0" height="83.0" rx="0" fill="#ede9fe" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="368.0" width="112.0" height="83.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="409.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Terminal</tspan><tspan x="96.0" dy="14">presináptica</tspan></text><rect x="40.0" y="451.0" width="920.0" height="83.0" rx="0" fill="#fef3c7" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="451.0" width="112.0" height="83.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="492.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Hendidura</tspan><tspan x="96.0" dy="14">sináptica</tspan></text><rect x="40.0" y="534.0" width="920.0" height="83.0" rx="0" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="534.0" width="112.0" height="83.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="579.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Fibra muscular</tspan></text><line x1="472.0" y1="318.5" x2="480.0" y2="314.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="482.2,319.0 477.7,310.1 488.0,310.5" fill="#0f766e"/><line x1="638.0" y1="337.0" x2="330.9" y2="379.8" stroke="#ea580c" stroke-width="2.2"/><polygon points="330.2,374.8 331.6,384.7 322.0,381.0" fill="#ea580c"/><line x1="472.0" y1="409.5" x2="479.0" y2="409.5" stroke="#ea580c" stroke-width="2.2"/><polygon points="479.0,414.5 479.0,404.5 488.0,409.5" fill="#ea580c"/><line x1="638.0" y1="436.0" x2="331.0" y2="463.2" stroke="#0f766e" stroke-width="2.2"/><polygon points="330.5,458.2 331.4,468.2 322.0,464.0" fill="#0f766e"/><line x1="472.0" y1="492.5" x2="479.0" y2="492.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="479.0,497.5 479.0,487.5 488.0,492.5" fill="#0f766e"/><line x1="638.0" y1="519.0" x2="331.0" y2="546.2" stroke="#0f766e" stroke-width="2.2"/><polygon points="330.5,541.2 331.4,551.2 322.0,547.0" fill="#0f766e"/><line x1="472.0" y1="575.5" x2="479.0" y2="575.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="479.0,580.5 479.0,570.5 488.0,575.5" fill="#0f766e"/><rect x="172.0" y="284.0" width="300.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="300.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Ingreso de la toxina</tspan></text><text x="182.0" y="317.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Alimento mal conservado, herida o intestino del</tspan><tspan x="182.0" dy="14.5">lactante.</tspan></text><circle cx="172.0" cy="284.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="288.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">1</tspan></text><rect x="488.0" y="284.0" width="300.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="498.0" y="300.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="498.0" dy="0">Toxina botulínica</tspan></text><text x="498.0" y="317.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="498.0" dy="0">Pasa a la terminal del nervio motor.</tspan></text><circle cx="488.0" cy="284.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="488.0" y="288.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="488.0" dy="0">2</tspan></text><rect x="172.0" y="383.0" width="300.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="182.0" y="399.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Corta las proteínas SNARE</tspan></text><text x="182.0" y="416.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Las vesículas no se fusionan con la membrana.</tspan></text><circle cx="172.0" cy="383.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="387.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">3</tspan></text><rect x="488.0" y="383.0" width="300.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="498.0" y="399.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="280"><tspan x="498.0" dy="0">No se libera acetilcolina</tspan></text><text x="498.0" y="416.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="498.0" dy="0">Es el déficit presináptico de la pregunta.</tspan></text><circle cx="488.0" cy="383.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="488.0" y="387.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="488.0" dy="0">4</tspan></text><rect x="172.0" y="466.0" width="300.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="482.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Hendidura sin acetilcolina</tspan></text><text x="182.0" y="499.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">El receptor no se activa.</tspan></text><circle cx="172.0" cy="466.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="470.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">5</tspan></text><rect x="488.0" y="466.0" width="300.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="498.0" y="482.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="498.0" dy="0">Receptor postsináptico intacto</tspan></text><text x="498.0" y="499.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="498.0" dy="0">Diferencia con la miastenia: allí hay anticuerpos.</tspan></text><circle cx="488.0" cy="466.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="488.0" y="470.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="488.0" dy="0">6</tspan></text><rect x="172.0" y="549.0" width="300.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="565.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Fibra sin estímulo</tspan></text><text x="182.0" y="582.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">No se contrae: sin fasciculaciones ni espasmos.</tspan></text><circle cx="172.0" cy="549.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="553.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">7</tspan></text><rect x="488.0" y="549.0" width="300.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="498.0" y="565.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="498.0" dy="0">Parálisis flácida descendente</tspan></text><text x="498.0" y="582.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="498.0" dy="0">Diplopía, ptosis, disfagia; pupilas dilatadas; sin fiebre.</tspan></text><circle cx="488.0" cy="549.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="488.0" y="553.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="488.0" dy="0">8</tspan></text><rect x="40.0" y="635.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="661.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Botulismo = fallo presináptico de la liberación de acetilcolina</tspan></text><text x="60.0" y="680.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Antitoxina equina precoz y soporte ventilatorio.</tspan></text><text x="40.0" y="747.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="757.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="788.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="760.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="788.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Botulismo</tspan></text><text x="435.0" y="788.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Miastenia gravis</tspan></text><text x="585.0" y="788.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Polimiositis</tspan></text><text x="735.0" y="779.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Parálisis periódica</tspan><tspan x="735.0" dy="17">hiperkalémica</tspan></text><text x="885.0" y="788.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Tétanos</tspan></text><rect x="40.0" y="811.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="811.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="848.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Déficit de acetilcolina?</tspan></text><text x="285.0" y="840.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: la toxina bloquea su</tspan><tspan x="285.0" dy="16">liberación</tspan></text><text x="435.0" y="840.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: hay anticuerpos</tspan><tspan x="435.0" dy="16">contra el receptor</tspan></text><text x="585.0" y="840.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es una miopatía</tspan><tspan x="585.0" dy="16">inflamatoria</tspan></text><text x="735.0" y="840.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es una canalopatía</tspan><tspan x="735.0" dy="16">muscular</tspan></text><text x="885.0" y="832.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: bloquea</tspan><tspan x="885.0" dy="16">neurotransmisores</tspan><tspan x="885.0" dy="16">inhibidores</tspan></text><rect x="40.0" y="757.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="901.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="929.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="951.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Empieza en los pares craneales: visión borrosa, diplopía, ptosis, disartria y disfagia; pupilas dilatadas, disautonomía anticolinérgica, sin fiebre ni déficit</tspan><tspan x="58.0" dy="18">   sensitivo.</tspan><tspan x="58.0" dy="18">• Miastenia gravis: anticuerpos contra el receptor postsináptico (no hay déficit de liberación). Tétanos: bloquea glicina y GABA y causa espasmos rígidos.</tspan><tspan x="58.0" dy="18">• Polimiositis es una miopatía inflamatoria; la parálisis periódica hiperkalémica es una canalopatía muscular.</tspan><tspan x="58.0" dy="18">• Tratamiento: antitoxina botulínica equina precoz y soporte ventilatorio; en el lactante, inmunoglobulina humana.</tspan></text><text x="58.0" y="1045.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Harrison 21.ª ed. (2022); Nelson Tratado de Pediatría 22.ª ed. (2024); Mandell 9.ª ed. (2020).</tspan></text></svg>