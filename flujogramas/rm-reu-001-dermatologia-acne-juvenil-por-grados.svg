<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="906" viewBox="0 0 1000 906" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En el acné grado III predomina la pústula"><title>En el acné grado III predomina la pústula</title><rect x="0.75" y="0.75" width="998.5" height="904.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Dermatología · acné juvenil por grados</tspan></text><rect x="429.7" y="32.0" width="227.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="543.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="211"><tspan x="543.4" dy="0">REUMATOLOGÍA Y DERMATOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="131.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Acné vulgar</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Inflamación crónica de la unidad pilosebácea: sebo, hiperqueratinización, Cutibacterium</tspan><tspan x="58.0" dy="17">acnes e inflamación.</tspan><tspan x="58.0" dy="17">La clasificación clásica por grados sigue siendo útil en el examen.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="131.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="129.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué lesión caracteriza al acné juvenil grado III?</tspan></text><rect x="640.0" y="192.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="205.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="205.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="253.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">GRADOS DEL ACNÉ DE MENOR A MAYOR GRAVEDAD</tspan></text><rect x="40.0" y="277.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="303.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Grado III = pustuloso: se suman las pústulas</tspan></text><text x="60.0" y="322.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Se añade antibiótico; el grado IV o con cicatrices requiere isotretinoína oral con control de embarazo.</tspan></text><text x="40.0" y="383.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN DEL ACNÉ POR GRADOS</tspan></text><rect x="40.0" y="395.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="414.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="114"><tspan x="50.0" dy="0">Grado</tspan></text><text x="180.0" y="414.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="247"><tspan x="180.0" dy="0">Tipo</tspan></text><text x="443.3" y="414.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="247"><tspan x="443.3" dy="0">Lesiones</tspan></text><text x="706.7" y="414.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="247"><tspan x="706.7" dy="0">Manejo</tspan></text><rect x="40.0" y="424.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="443.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="114"><tspan x="50.0" dy="0">I</tspan></text><text x="180.0" y="443.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="247"><tspan x="180.0" dy="0">Comedogénico</tspan></text><text x="443.3" y="443.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="247"><tspan x="443.3" dy="0">Comedones abiertos y cerrados</tspan></text><text x="706.7" y="443.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="247"><tspan x="706.7" dy="0">Retinoide tópico con peróxido de benzoílo</tspan></text><rect x="40.0" y="453.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="472.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="114"><tspan x="50.0" dy="0">II</tspan></text><text x="180.0" y="472.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="247"><tspan x="180.0" dy="0">Papuloso</tspan></text><text x="443.3" y="472.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="247"><tspan x="443.3" dy="0">Comedones y pápulas</tspan></text><text x="706.7" y="472.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="247"><tspan x="706.7" dy="0">Retinoide tópico con peróxido de benzoílo</tspan></text><rect x="40.0" y="482.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="501.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="114"><tspan x="50.0" dy="0">III</tspan></text><text x="180.0" y="501.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="247"><tspan x="180.0" dy="0">Pustuloso</tspan></text><text x="443.3" y="501.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="247"><tspan x="443.3" dy="0">Se suman las pústulas</tspan></text><text x="706.7" y="501.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="247"><tspan x="706.7" dy="0">Se añade antibiótico</tspan></text><rect x="70.6" y="485.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="116.0" y="500.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="116.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="511.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="530.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="114"><tspan x="50.0" dy="0">IV</tspan></text><text x="180.0" y="530.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="247"><tspan x="180.0" dy="0">Nódulo-quístico</tspan></text><text x="443.3" y="530.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="247"><tspan x="443.3" dy="0">Nódulos y quistes; cicatrices</tspan></text><text x="706.7" y="530.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="247"><tspan x="706.7" dy="0">Isotretinoína oral, con control de embarazo</tspan></text><text x="40.0" y="556.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Resumen de la clasificación clásica por lesión predominante; otros textos nombran los grados de otro modo. Las guías actuales (AAD 2024) tratan por gravedad: leve,</tspan><tspan x="40.0" dy="15">moderada o grave.</tspan></text><text x="40.0" y="618.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="628.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="650.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="631.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="650.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Pústula</tspan></text><text x="435.0" y="650.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Pápulas</tspan></text><text x="585.0" y="650.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Comedones</tspan></text><text x="735.0" y="650.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Nódulos</tspan></text><text x="885.0" y="650.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Nódulo quiste</tspan></text><rect x="40.0" y="665.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="665.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="694.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Lesión del grado III?</tspan></text><text x="285.0" y="686.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: define el acné</tspan><tspan x="285.0" dy="16">pustuloso</tspan></text><text x="435.0" y="686.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: corresponde al</tspan><tspan x="435.0" dy="16">grado II</tspan></text><text x="585.0" y="686.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: corresponde al</tspan><tspan x="585.0" dy="16">grado I</tspan></text><text x="735.0" y="686.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: corresponde al</tspan><tspan x="735.0" dy="16">grado IV</tspan></text><text x="885.0" y="686.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: corresponde al</tspan><tspan x="885.0" dy="16">grado IV</tspan></text><rect x="40.0" y="628.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="739.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="767.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="789.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Grado I comedogénico (comedones); II papuloso (+ pápulas); III pustuloso (+ pústulas); IV nódulo-quístico, con alto riesgo de cicatrices.</tspan><tspan x="58.0" dy="18">• Las guías actuales clasifican por gravedad (leve, moderado, grave) y por la lesión predominante.</tspan><tspan x="58.0" dy="18">• Leve: retinoide tópico con peróxido de benzoílo; moderado: se añade antibiótico; grave o con cicatrices: isotretinoína oral.</tspan><tspan x="58.0" dy="18">• Isotretinoína: control estricto de embarazo; el acné nodular grave es su indicación clásica.</tspan></text><text x="58.0" y="865.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAD, Guidelines of care for the management of acne vulgaris (Reynolds, JAAD 2024); Fitzpatrick Dermatología 9.ª ed.</tspan></text></svg>