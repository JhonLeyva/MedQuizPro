<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1174" viewBox="0 0 1000 1174" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Lactante no inmunizado con tos paroxística emetizante y estridor de 3 semanas: tos ferina"><title>Lactante no inmunizado con tos paroxística emetizante y estridor de 3 semanas: tos ferina</title><rect x="0.75" y="0.75" width="998.5" height="1172.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · tos ferina</tspan></text><rect x="320.3" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="369.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="369.3" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tos ferina</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección por Bordetella pertussis: toxina pertussis y citotoxina traqueal lesionan el epitelio</tspan><tspan x="58.0" dy="17">ciliado.</tspan><tspan x="58.0" dy="17">Tres fases: catarral, paroxística y de convalecencia.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 6 meses</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Sin vacunas. Tos paroxística, emetizante, con estridor,</tspan><tspan x="640.0" dy="16">de 3 semanas.</tspan><tspan x="640.0" dy="16">¿Diagnóstico más probable?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">FASES DE LA TOS FERINA (SEMANAS DESDE EL INICIO; RANGOS ORIENTATIVOS)</tspan></text><line x1="290.0" y1="307.0" x2="290.0" y2="463.0" stroke="#e2e8f0" stroke-width="1"/><text x="290.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="290.0" dy="0">0</tspan></text><line x1="398.3" y1="307.0" x2="398.3" y2="463.0" stroke="#e2e8f0" stroke-width="1"/><text x="398.3" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="398.3" dy="0">2</tspan></text><line x1="506.7" y1="307.0" x2="506.7" y2="463.0" stroke="#e2e8f0" stroke-width="1"/><text x="506.7" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="506.7" dy="0">4</tspan></text><line x1="615.0" y1="307.0" x2="615.0" y2="463.0" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="615.0" dy="0">6</tspan></text><line x1="723.3" y1="307.0" x2="723.3" y2="463.0" stroke="#e2e8f0" stroke-width="1"/><text x="723.3" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="723.3" dy="0">8</tspan></text><line x1="831.7" y1="307.0" x2="831.7" y2="463.0" stroke="#e2e8f0" stroke-width="1"/><text x="831.7" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="831.7" dy="0">10</tspan></text><line x1="940.0" y1="307.0" x2="940.0" y2="463.0" stroke="#e2e8f0" stroke-width="1"/><text x="940.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="940.0" dy="0">12</tspan></text><text x="940.0" y="289.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="end" data-max="60"><tspan x="940.0" dy="0">semanas</tspan></text><rect x="40.0" y="311.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="327.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Fase catarral</tspan></text><text x="48.0" y="342.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Como un resfriado; muy contagiosa</tspan></text><rect x="290.0" y="319.0" width="108.3" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="365.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Fase paroxística</tspan></text><text x="48.0" y="380.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Accesos, «gallito» y vómito</tspan></text><rect x="398.3" y="357.0" width="216.7" height="22.0" rx="6" fill="#ea580c" stroke="none" stroke-width="1.5"/><rect x="40.0" y="387.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="403.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Fase de convalecencia</tspan></text><text x="48.0" y="418.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Cede de forma gradual</tspan></text><rect x="615.0" y="395.0" width="325.0" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="441.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Linfocitosis con leucocitosis</tspan></text><text x="48.0" y="456.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Hemograma de la fase paroxística</tspan></text><rect x="398.3" y="433.0" width="216.7" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><line x1="452.5" y1="309.0" x2="452.5" y2="469.0" stroke="#b91c1c" stroke-width="2.6"/><rect x="377.5" y="469.0" width="150.1" height="22.0" rx="11" fill="#b91c1c" stroke="none" stroke-width="1.5"/><text x="452.5" y="484.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="452.5" dy="0">Caso: tos de 3 semanas</tspan></text><rect x="40.0" y="515.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="541.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Tos paroxística emetizante con estridor en un lactante sin vacunas = tos ferina</tspan></text><text x="60.0" y="560.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Azitromicina y profilaxis de contactos; vigilar apneas.</tspan></text><text x="40.0" y="621.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">FASES DE LA TOS FERINA</tspan></text><rect x="40.0" y="633.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="652.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Fase</tspan></text><text x="250.0" y="652.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Duración</tspan></text><text x="610.0" y="652.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Clínica</tspan></text><rect x="40.0" y="662.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="681.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Catarral</tspan></text><text x="250.0" y="681.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">1-2 semanas</tspan></text><text x="610.0" y="681.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Indistinguible de un resfriado; muy contagiosa</tspan></text><rect x="40.0" y="691.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="710.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Paroxística</tspan></text><text x="250.0" y="710.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">2-6 semanas</tspan></text><text x="610.0" y="710.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Accesos de tos, estridor inspiratorio, cianosis y vómito</tspan><tspan x="610.0" dy="15">posterior</tspan></text><rect x="140.6" y="702.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="186.0" y="717.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="186.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="735.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="754.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Convalecencia</tspan></text><text x="250.0" y="754.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Semanas a meses</tspan></text><text x="610.0" y="754.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">La tos disminuye de forma gradual</tspan></text><text x="40.0" y="804.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="814.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="845.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="845.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Neumonía atípica</tspan></text><text x="435.0" y="845.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Tos coqueluchoide</tspan></text><text x="585.0" y="836.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Laringotraqueítis</tspan><tspan x="585.0" dy="17">aguda</tspan></text><rect x="663.0" y="817.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="845.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Tos ferina</tspan></text><text x="885.0" y="845.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Bronquitis aguda</tspan></text><rect x="40.0" y="868.0" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="868.0" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="905.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico más</tspan><tspan x="54.0" dy="16">probable?</tspan></text><text x="285.0" y="897.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es propia del</tspan><tspan x="285.0" dy="16">escolar, con tos seca e</tspan><tspan x="285.0" dy="16">inicio insidioso</tspan></text><text x="435.0" y="889.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: la «tos</tspan><tspan x="435.0" dy="16">coqueluchoide» es un</tspan><tspan x="435.0" dy="16">cuadro parecido, no la</tspan><tspan x="435.0" dy="16">enfermedad</tspan></text><text x="585.0" y="905.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: dura pocos días,</tspan><tspan x="585.0" dy="16">con tos perruna</tspan></text><text x="735.0" y="897.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: fase paroxística en</tspan><tspan x="735.0" dy="16">un lactante sin</tspan><tspan x="735.0" dy="16">vacunas</tspan></text><text x="885.0" y="897.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no produce</tspan><tspan x="885.0" dy="16">paroxismos de</tspan><tspan x="885.0" dy="16">semanas</tspan></text><rect x="40.0" y="814.0" width="920.0" height="136.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="974.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1002.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1024.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Caso clínico (OMS/CDC): tos de 2 semanas o más con accesos, «gallito» inspiratorio o vómito tras la tos. La linfocitosis marcada apoya el diagnóstico.</tspan><tspan x="58.0" dy="18">• Confirmación: PCR o cultivo de aspirado nasofaríngeo. Tratamiento: macrólido (azitromicina 5 días) y quimioprofilaxis a los contactos.</tspan><tspan x="58.0" dy="18">• Alerta: en menores de 3 meses puede haber apneas y cianosis sin tos típica; se hospitaliza. La tos coqueluchoide (adenovirus, Mycoplasma) no es la</tspan><tspan x="58.0" dy="18">   enfermedad.</tspan><tspan x="58.0" dy="18">• Prevención: vacuna con tos ferina (esquema nacional) y vacunación materna en el tercer trimestre para proteger al recién nacido.</tspan></text><text x="58.0" y="1118.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, Pertussis vaccines: position paper (Wkly Epidemiol Rec 2015;90:433-58); CDC, Recommended antimicrobial agents for pertussis (MMWR 2005;54(RR-14));</tspan><tspan x="58.0" dy="15">MINSA, NTS 196-MINSA/DGIESP-2022 (Esquema Nacional de Vacunación, RM 884-2022/MINSA); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>