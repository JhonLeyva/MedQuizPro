e" stroke-width="0"/><text x="498.0" y="455.6" font-size="15" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">1</tspan></text><text x="528.0" y="435.1" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Tipo II: fijar si es inestable</tspan></text><text x="528.0" y="458.1" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Seudoartrosis por escasa irrigación; cirugía en jóvenes o con</tspan><tspan x="528.0" dy="17">desplazamiento</tspan></text><rect x="829.4" y="394.0" width="121.1" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="409.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ MÁS FRECUENTE</tspan></text><line x1="498.0" y1="498.2" x2="498.0" y2="511.2" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,510.2 503.0,510.2 498.0,518.2" fill="#0f766e"/><rect x="470.0" y="520.2" width="490.0" height="84.0" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="562.2" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="567.2" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">2</tspan></text><text x="528.0" y="555.2" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Tipo III: collar o halo</tspan></text><text x="528.0" y="578.2" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Buena consolidación si es estable</tspan></text><text x="40.0" y="649.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="659.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="681.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="662.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="681.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Extensión</tspan></text><text x="435.0" y="681.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Rotación</tspan></text><text x="585.0" y="681.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Depresión</tspan></text><text x="735.0" y="681.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Elevación</tspan></text><text x="885.0" y="681.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Flexión</tspan></text><rect x="40.0" y="696.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="696.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="733.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Fuerza más frecuente?</tspan></text><text x="285.0" y="725.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: según el libro, 48 %</tspan><tspan x="285.0" dy="16">de los casos</tspan></text><text x="435.0" y="725.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no es un</tspan><tspan x="435.0" dy="16">mecanismo típico</tspan></text><text x="585.0" y="725.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no es un</tspan><tspan x="585.0" dy="16">mecanismo típico</tspan></text><text x="735.0" y="725.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no es un</tspan><tspan x="735.0" dy="16">mecanismo típico</tspan></text><text x="885.0" y="717.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: en otras series</tspan><tspan x="885.0" dy="16">predomina, pero el</tspan><tspan x="885.0" dy="16">libro da menos casos</tspan></text><rect x="40.0" y="659.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="786.0" width="920.0" height="218.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="814.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="836.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Anderson y D'Alonzo: tipo I avulsión de la punta (estable); tipo II en la base (más frecuente, seudoartrosis por mala irrigación); tipo III hasta el cuerpo del</tspan><tspan x="58.0" dy="18">   axis (consolida bien).</tspan><tspan x="58.0" dy="18">• Mecanismo: combinación de flexión, extensión y rotación. Las series clásicas (48 % extensión, 32 % flexión) atribuyen la mayoría a la extensión; otras</tspan><tspan x="58.0" dy="18">   series prefieren la flexión.</tspan><tspan x="58.0" dy="18">• Clínica: dolor y rigidez cervical alta, el paciente sostiene la cabeza con la mano; el déficit neurológico es raro. Se diagnostica con radiografía transoral y</tspan><tspan x="58.0" dy="18">   TC.</tspan><tspan x="58.0" dy="18">• Tipo I y III estable: collar o halo. Tipo II desplazado o inestable: fijación quirúrgica; en el anciano, manejo no quirúrgico es opción aceptable.</tspan></text><text x="58.0" y="966.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Nonoperative versus operative management of type II odontoid fracture in older adults, J Neurosurg Spine 2024; Rockwood and Green's Fractures in Adults 9.ª ed.</tspan><tspan x="58.0" dy="15">(2019); Campbell's Operative Orthopaedics 14.ª ed. (2020).</tspan></text></svg>