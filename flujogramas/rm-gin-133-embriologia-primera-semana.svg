<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1135" viewBox="0 0 1000 1135" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La implantación ocurre en la etapa de blastocisto, hacia el día 6 a 7 tras la fecundación"><title>La implantación ocurre en la etapa de blastocisto, hacia el día 6 a 7 tras la fecundación</title><rect x="0.75" y="0.75" width="998.5" height="1133.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Embriología · primera semana</tspan></text><rect x="378.4" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="458.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="458.2" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">De la fecundación a la implantación</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La fecundación ocurre en la ampolla de la trompa y forma el cigoto.</tspan><tspan x="58.0" dy="17">Después vienen la segmentación, la mórula y el blastocisto.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de embriología</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿En qué etapa del desarrollo se produce la</tspan><tspan x="640.0" dy="16">implantación endometrial?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ETAPAS DE LA PRIMERA SEMANA SEGÚN EL DÍA</tspan></text><line x1="290.0" y1="291.0" x2="290.0" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="290.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="290.0" dy="0">0</tspan></text><line x1="355.0" y1="291.0" x2="355.0" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="355.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="355.0" dy="0">1</tspan></text><line x1="420.0" y1="291.0" x2="420.0" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="420.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="420.0" dy="0">2</tspan></text><line x1="485.0" y1="291.0" x2="485.0" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="485.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="485.0" dy="0">3</tspan></text><line x1="550.0" y1="291.0" x2="550.0" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="550.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="550.0" dy="0">4</tspan></text><line x1="615.0" y1="291.0" x2="615.0" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="615.0" dy="0">5</tspan></text><line x1="680.0" y1="291.0" x2="680.0" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="680.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="680.0" dy="0">6</tspan></text><line x1="745.0" y1="291.0" x2="745.0" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="745.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="745.0" dy="0">7</tspan></text><line x1="810.0" y1="291.0" x2="810.0" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="810.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="810.0" dy="0">8</tspan></text><line x1="875.0" y1="291.0" x2="875.0" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="875.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="875.0" dy="0">9</tspan></text><line x1="940.0" y1="291.0" x2="940.0" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="940.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="940.0" dy="0">10</tspan></text><text x="940.0" y="273.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="end" data-max="60"><tspan x="940.0" dy="0">días</tspan></text><rect x="40.0" y="295.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="311.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Cigoto (en la ampolla)</tspan></text><text x="48.0" y="326.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Fecundación: 46 cromosomas</tspan></text><rect x="290.0" y="303.0" width="65.0" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="349.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Blastómeros</tspan></text><text x="48.0" y="364.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Segmentación por mitosis, en la trompa</tspan></text><rect x="355.0" y="341.0" width="130.0" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><rect x="40.0" y="371.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="387.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Mórula</tspan></text><text x="48.0" y="402.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">12 a 16 células; ingresa al útero</tspan></text><rect x="485.0" y="379.0" width="130.0" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="425.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Blastocisto con implantación</tspan></text><text x="48.0" y="440.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Pierde la zona pelúcida y se implanta (día 6 a 7)</tspan></text><rect x="615.0" y="417.0" width="195.0" height="22.0" rx="6" fill="#ea580c" stroke="none" stroke-width="1.5"/><line x1="712.5" y1="293.0" x2="712.5" y2="453.0" stroke="#b91c1c" stroke-width="2.6"/><rect x="668.2" y="453.0" width="88.6" height="22.0" rx="11" fill="#b91c1c" stroke="none" stroke-width="1.5"/><text x="712.5" y="468.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="712.5" dy="0">Implantación</tspan></text><rect x="40.0" y="499.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="525.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Implantación endometrial = blastocisto</tspan></text><text x="60.0" y="544.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El oocito no está fecundado; cigoto, blastómeros y mórula aún no se implantan.</tspan></text><text x="40.0" y="605.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ETAPAS DEL DESARROLLO ANTES Y DURANTE LA IMPLANTACIÓN</tspan></text><rect x="40.0" y="617.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="636.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Etapa</tspan></text><text x="250.0" y="636.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Dónde está</tspan></text><text x="610.0" y="636.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Característica</tspan></text><rect x="40.0" y="646.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="665.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Oocito maduro</tspan></text><text x="250.0" y="665.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Ampolla de la trompa</tspan></text><text x="610.0" y="665.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">No fecundado</tspan></text><rect x="40.0" y="675.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="694.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Cigoto</tspan></text><text x="250.0" y="694.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Trompa</tspan></text><text x="610.0" y="694.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">46 cromosomas, primera célula</tspan></text><rect x="40.0" y="704.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="723.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Blastómeros</tspan></text><text x="250.0" y="723.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Trompa</tspan></text><text x="610.0" y="723.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Divisiones mitóticas de la segmentación</tspan></text><rect x="40.0" y="733.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="752.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Mórula</tspan></text><text x="250.0" y="752.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Entra al útero (día 3 a 4)</tspan></text><text x="610.0" y="752.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">12 a 16 células compactas, con zona pelúcida</tspan></text><rect x="40.0" y="762.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="781.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Blastocisto</tspan></text><text x="250.0" y="781.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Útero (día 5 a 7)</tspan></text><text x="610.0" y="781.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Embrioblasto y trofoblasto; se implanta</tspan></text><rect x="140.6" y="765.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="186.0" y="780.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="186.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="831.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="841.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="863.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="844.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="863.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Blastocisto</tspan></text><text x="435.0" y="863.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Oocito maduro</tspan></text><text x="585.0" y="863.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Mórula</tspan></text><text x="735.0" y="863.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Blastómero</tspan></text><text x="885.0" y="863.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Cigoto</tspan></text><rect x="40.0" y="878.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="878.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="907.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Etapa de la</tspan><tspan x="54.0" dy="16">implantación?</tspan></text><text x="285.0" y="907.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: el trofoblasto</tspan><tspan x="285.0" dy="16">invade el endometrio</tspan></text><text x="435.0" y="907.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: aún no está</tspan><tspan x="435.0" dy="16">fecundado</tspan></text><text x="585.0" y="907.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: conserva la zona</tspan><tspan x="585.0" dy="16">pelúcida</tspan></text><text x="735.0" y="899.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: son las células del</tspan><tspan x="735.0" dy="16">cigoto en</tspan><tspan x="735.0" dy="16">segmentación</tspan></text><text x="885.0" y="907.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: se halla en la</tspan><tspan x="885.0" dy="16">trompa</tspan></text><rect x="40.0" y="841.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="968.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="996.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1018.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Cigoto (46 cromosomas) → blastómeros por mitosis → mórula de 12 a 16 células hacia el día 3 o 4, que entra en la cavidad uterina.</tspan><tspan x="58.0" dy="18">• El blastocisto tiene embrioblasto (masa celular interna) y trofoblasto; pierde la zona pelúcida hacia el día 5 o 6.</tspan><tspan x="58.0" dy="18">• Hacia el día 6 a 7 el trofoblasto se adhiere al endometrio secretor y lo invade: forma citotrofoblasto y sincitiotrofoblasto, que secreta hCG.</tspan><tspan x="58.0" dy="18">• Alerta: la implantación fuera del útero, favorecida por el daño tubárico, es el embarazo ectópico; la hCG solo se detecta tras la implantación.</tspan></text><text x="58.0" y="1094.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Langman Embriología Médica, 14.ª ed. (2019); Moore Embriología Clínica, 11.ª ed. (2020); Williams Obstetricia, 26.ª ed. (2022).</tspan></text></svg>