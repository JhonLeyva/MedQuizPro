<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Coinfección TB-VIH"><title>Coinfección TB-VIH</title><rect x="0.75" y="0.75" width="998.5" height="558.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16" y="16" width="968" height="56" rx="10" fill="#0f766e"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170" y1="34.0" x2="170" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="634"><tspan x="184.0" dy="0">SALUD PÚBLICA ENAM: COINFECCIÓN TB-VIH</tspan></text><rect x="837.9" y="32.0" width="126.1" height="24" rx="12" fill="#134e4a"/><text x="901.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="110"><tspan x="901.0" dy="0">SALUD PÚBLICA</tspan></text><rect x="190.0" y="90.0" width="620" height="67.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="500.0" y="118.5" font-size="14.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Zona endémica de TB con aumento reciente de VIH</tspan></text><text x="500.0" y="141.0" font-size="12" font-weight="400" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Deficiente terapia preventiva para TB en personas con VIH</tspan></text><line x1="500.0" y1="157.0" x2="500.0" y2="239.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,238.0 505.0,238.0 500.0,246.0" fill="#0f766e"/><rect x="330.0" y="246.0" width="340" height="100.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="273.5" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="500.0" dy="0">LA COINFECCIÓN TB-VIH AUMENTA</tspan></text><text x="500.0" y="296.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="500.0" dy="0">El VIH es el mayor factor de riesgo</tspan><tspan x="500.0" dy="17">para pasar de infección latente</tspan><tspan x="500.0" dy="17">a tuberculosis activa</tspan></text><line x1="310.0" y1="235.0" x2="330.0" y2="235.0" stroke="#0ea5e9" stroke-width="2"/><circle cx="330.0" cy="235.0" r="4" fill="#0ea5e9"/><rect x="40.0" y="185.0" width="270" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="186.0" width="6" height="98.0" rx="3" fill="#0ea5e9"/><text x="184.0" y="212.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="224"><tspan x="184.0" dy="0">Tamizaje</tspan></text><text x="184.0" y="235.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="224"><tspan x="184.0" dy="0">Buscar TB en toda</tspan><tspan x="184.0" dy="17">persona con VIH</tspan><tspan x="184.0" dy="17">en cada consulta</tspan></text><line x1="690.0" y1="235.0" x2="670.0" y2="235.0" stroke="#8b5cf6" stroke-width="2"/><circle cx="670.0" cy="235.0" r="4" fill="#8b5cf6"/><rect x="690.0" y="185.0" width="270" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="691.0" y="186.0" width="6" height="98.0" rx="3" fill="#8b5cf6"/><text x="834.0" y="212.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="224"><tspan x="834.0" dy="0">Terapia preventiva</tspan></text><text x="834.0" y="235.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="224"><tspan x="834.0" dy="0">Isoniacida o</tspan><tspan x="834.0" dy="17">3HP (rifapentina +</tspan><tspan x="834.0" dy="17">isoniacida)</tspan></text><line x1="310.0" y1="357.0" x2="330.0" y2="357.0" stroke="#f59e0b" stroke-width="2"/><circle cx="330.0" cy="357.0" r="4" fill="#f59e0b"/><rect x="40.0" y="307.0" width="270" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="308.0" width="6" height="98.0" rx="3" fill="#f59e0b"/><text x="184.0" y="334.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="224"><tspan x="184.0" dy="0">TARV</tspan></text><text x="184.0" y="357.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="224"><tspan x="184.0" dy="0">Inicio precoz del</tspan><tspan x="184.0" dy="17">tratamiento</tspan><tspan x="184.0" dy="17">antirretroviral</tspan></text><line x1="690.0" y1="357.0" x2="670.0" y2="357.0" stroke="#10b981" stroke-width="2"/><circle cx="670.0" cy="357.0" r="4" fill="#10b981"/><rect x="690.0" y="307.0" width="270" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="691.0" y="308.0" width="6" height="98.0" rx="3" fill="#10b981"/><text x="834.0" y="334.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="224"><tspan x="834.0" dy="0">Control</tspan></text><text x="834.0" y="357.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="224"><tspan x="834.0" dy="0">Ventilación, estudio</tspan><tspan x="834.0" dy="17">de contactos y</tspan><tspan x="834.0" dy="17">diagnóstico molecular</tspan></text><rect x="40" y="433.0" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="461.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="483.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Sin terapia preventiva, la reactivación de TB en personas con VIH se multiplica.</tspan><tspan x="58.0" dy="18">• Ofrecer prueba de VIH a toda persona con tuberculosis.</tspan></text><text x="58.0" y="523.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA – NTS N.° 200-MINSA/DGIESP-2023 (Tuberculosis) · OMS 2024 TB Preventive Treatment</tspan></text></svg>
