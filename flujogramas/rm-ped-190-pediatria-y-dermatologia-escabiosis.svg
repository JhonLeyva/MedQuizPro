 stroke-width="1.5"/><text x="206.0" y="772.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="206.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="783.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="802.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Adulto</tspan></text><text x="270.0" y="802.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Interdigitales, muñecas, codos, axilas, areolas, cintura y</tspan><tspan x="270.0" dy="15">genitales</tspan></text><text x="620.0" y="802.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Cara</tspan></text><text x="40.0" y="867.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="877.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="899.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="880.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="899.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Palmas y plantas</tspan></text><text x="435.0" y="899.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Muñecas</tspan></text><text x="585.0" y="899.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Región perineal</tspan></text><text x="735.0" y="899.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Glúteos</tspan></text><text x="885.0" y="899.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Pliegues axilares</tspan></text><rect x="40.0" y="914.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="914.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="943.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Dónde se afecta?</tspan></text><text x="285.0" y="935.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: dato clásico del</tspan><tspan x="285.0" dy="16">lactante</tspan></text><text x="435.0" y="935.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: más en adulto y</tspan><tspan x="435.0" dy="16">niño mayor</tspan></text><text x="585.0" y="935.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: más en adulto y</tspan><tspan x="585.0" dy="16">niño mayor</tspan></text><text x="735.0" y="935.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es la dermatitis del</tspan><tspan x="735.0" dy="16">pañal</tspan></text><text x="885.0" y="935.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: más en adulto y</tspan><tspan x="885.0" dy="16">niño mayor</tspan></text><rect x="40.0" y="877.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="988.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1016.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1038.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Lactantes y niños pequeños: palmas, plantas, cuero cabelludo, cara y cuello, con vesículas, pústulas y nódulos. Adulto: espacios interdigitales, muñecas,</tspan><tspan x="58.0" dy="18">   codos, axilas, areolas, cintura y genitales, sin cara.</tspan><tspan x="58.0" dy="18">• Los glúteos se afectan en la dermatitis del pañal, que no produce prurito generalizado.</tspan><tspan x="58.0" dy="18">• Diagnóstico clínico con contacto pruriginoso; confirmar con dermatoscopia o raspado. Tratamiento: permetrina al 5 % del cuello a los pies (en lactantes</tspan><tspan x="58.0" dy="18">   también cara y cuero cabelludo), repetida a los 7 días.</tspan><tspan x="58.0" dy="18">• Alerta: tratar a todos los contactos y lavar la ropa; el prurito puede persistir semanas y no indica fracaso.</tspan></text><text x="58.0" y="1150.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Nelson Tratado de Pediatría, 22.ª ed. (2024); Harrison Principios de Medicina Interna, 21.ª ed. (2022).</tspan></text></svg>