<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1219" viewBox="0 0 1000 1219" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Obesidad abdominal, triglicéridos altos y HDL bajo: el hígado produce VLDL en exceso"><title>Obesidad abdominal, triglicéridos altos y HDL bajo: el hígado produce VLDL en exceso</title><rect x="0.75" y="0.75" width="998.5" height="1217.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Síndrome metabólico · dislipidemia aterogénica</tspan></text><rect x="481.6" y="32.0" width="140.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="551.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="124"><tspan x="551.9" dy="0">ENDOCRINOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Resistencia a la insulina</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Más ácidos grasos libres llegan al hígado, que sintetiza más triglicéridos y VLDL.</tspan><tspan x="58.0" dy="17">Resultado: TG altos, HDL bajo y LDL pequeñas y densas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 55 años, chofer</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Cefalea, mareos, cansancio y somnolencia; PA 140/90,</tspan><tspan x="640.0" dy="16">IMC 35, obesidad abdominal.</tspan><tspan x="640.0" dy="16">CT 350, VLDL 150, HDL 35, LDL 175, TG 400.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LA RESISTENCIA A LA INSULINA ALTERA LOS LÍPIDOS</tspan></text><rect x="40.0" y="285.0" width="920.0" height="112.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="285.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="345.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Tejido adiposo</tspan></text><rect x="40.0" y="397.0" width="920.0" height="112.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="397.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="457.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Hígado</tspan></text><rect x="40.0" y="509.0" width="920.0" height="112.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="509.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="569.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Sangre</tspan></text><rect x="40.0" y="621.0" width="920.0" height="112.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="621.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="681.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Diagnóstico</tspan></text><line x1="348.0" y1="341.0" x2="355.0" y2="341.0" stroke="#ea580c" stroke-width="2.2"/><line x1="355.0" y1="341.0" x2="355.0" y2="453.0" stroke="#ea580c" stroke-width="2.2"/><line x1="355.0" y1="453.0" x2="353.0" y2="453.0" stroke="#ea580c" stroke-width="2.2"/><polygon points="353.0,458.0 353.0,448.0 362.0,453.0" fill="#ea580c"/><line x1="552.0" y1="453.0" x2="559.0" y2="453.0" stroke="#0f766e" stroke-width="2.2"/><line x1="559.0" y1="453.0" x2="559.0" y2="565.0" stroke="#0f766e" stroke-width="2.2"/><line x1="559.0" y1="565.0" x2="557.0" y2="565.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="557.0,570.0 557.0,560.0 566.0,565.0" fill="#0f766e"/><line x1="756.0" y1="565.0" x2="763.0" y2="565.0" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="565.0" x2="763.0" y2="668.5" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="668.5" x2="761.0" y2="668.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="761.0,673.5 761.0,663.5 770.0,668.5" fill="#0f766e"/><rect x="158.0" y="298.0" width="190.0" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="314.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Obesidad visceral y</tspan><tspan x="168.0" dy="16">resistencia a la insulina</tspan></text><text x="168.0" y="347.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Más ácidos grasos libres; la</tspan><tspan x="168.0" dy="14.5">lipólisis no se frena</tspan></text><circle cx="158.0" cy="298.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="302.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="362.0" y="410.0" width="190.0" height="86.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="372.0" y="426.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Más síntesis de triglicéridos</tspan><tspan x="372.0" dy="16">y de VLDL</tspan></text><text x="372.0" y="459.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Sobreproducción hepática de</tspan><tspan x="372.0" dy="14.5">VLDL</tspan></text><circle cx="362.0" cy="410.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="362.0" y="414.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="362.0" dy="0">2</tspan></text><rect x="566.0" y="522.0" width="190.0" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="576.0" y="538.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">TG 400, VLDL 150, HDL 35,</tspan><tspan x="576.0" dy="16">LDL pequeñas y densas</tspan></text><text x="576.0" y="571.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Dislipidemia aterogénica; apo B</tspan><tspan x="576.0" dy="14.5">alta</tspan></text><circle cx="566.0" cy="522.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="566.0" y="526.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="566.0" dy="0">3</tspan></text><rect x="770.0" y="634.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="780.0" y="650.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Síndrome metabólico</tspan></text><text x="780.0" y="667.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Cintura grande, PA 140/90, TG</tspan><tspan x="780.0" dy="14.5">alto, HDL bajo</tspan></text><circle cx="770.0" cy="634.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="770.0" y="638.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="770.0" dy="0">4</tspan></text><rect x="40.0" y="751.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="777.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Resistencia a la insulina = más VLDL hepática</tspan></text><text x="60.0" y="796.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La apo B alta y la lipoproteína lipasa baja son consecuencia.</tspan></text><text x="40.0" y="863.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="873.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="912.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="904.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Consumo excesivo</tspan><tspan x="285.0" dy="17">de alcohol</tspan></text><text x="435.0" y="904.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Dieta abundante en</tspan><tspan x="435.0" dy="17">carbohidratos</tspan></text><text x="585.0" y="904.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Incremento de la</tspan><tspan x="585.0" dy="17">apolipoproteína B</tspan></text><rect x="663.0" y="876.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="895.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Producción</tspan><tspan x="735.0" dy="17">excesiva de VLDL</tspan><tspan x="735.0" dy="17">en el hígado</tspan></text><text x="885.0" y="904.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Aumento de la</tspan><tspan x="885.0" dy="17">actividad de LPL</tspan></text><rect x="40.0" y="944.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="944.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="981.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Causa?</tspan></text><text x="285.0" y="973.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: agrava, pero no</tspan><tspan x="285.0" dy="16">explica el mecanismo</tspan></text><text x="435.0" y="973.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: agrava, pero no es</tspan><tspan x="435.0" dy="16">la causa</tspan></text><text x="585.0" y="965.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es una</tspan><tspan x="585.0" dy="16">consecuencia, no la</tspan><tspan x="585.0" dy="16">causa</tspan></text><text x="735.0" y="965.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: la resistencia a la</tspan><tspan x="735.0" dy="16">insulina estimula el</tspan><tspan x="735.0" dy="16">hígado</tspan></text><text x="885.0" y="973.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: la lipoproteína</tspan><tspan x="885.0" dy="16">lipasa disminuye</tspan></text><rect x="40.0" y="873.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1034.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1062.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1084.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Síndrome metabólico (armonización 2009): 3 de 5 criterios: cintura aumentada, TG ≥ 150, HDL &lt; 40 (varón) o &lt; 50 (mujer), PA ≥ 130/85, glucosa ≥ 100</tspan><tspan x="58.0" dy="18">   mg/dL.</tspan><tspan x="58.0" dy="18">• Dislipidemia aterogénica: la insulina deja de frenar la lipólisis, la lipoproteína lipasa disminuye (no aumenta) y el hígado produce más VLDL.</tspan><tspan x="58.0" dy="18">• La apo B alta es consecuencia (una por partícula); la dieta rica en carbohidratos y el alcohol agravan, pero no explican el mecanismo.</tspan><tspan x="58.0" dy="18">• Alerta: somnolencia, cefalea e IMC 35 con HTA: descartar apnea del sueño; TG &gt; 500 mg/dL elevan el riesgo de pancreatitis.</tspan></text><text x="58.0" y="1178.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ESC/EAS, dislipidemia (2019) y actualización focalizada (2025); ACC/AHA, dislipidemia (2026); Alberti KG et al., definición del síndrome metabólico (Circulation 2009)</tspan></text></svg>