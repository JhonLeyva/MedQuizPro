<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="955" viewBox="0 0 1000 955" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Sinusitis, baño en un lago y meningitis purulenta con Gram negativo: Naegleria fowleri"><title>Sinusitis, baño en un lago y meningitis purulenta con Gram negativo: Naegleria fowleri</title><rect x="0.75" y="0.75" width="998.5" height="953.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neuroinfección · meningoencefalitis amebiana primaria</tspan></text><rect x="526.1" y="32.0" width="121.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="587.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="106"><tspan x="587.0" dy="0">INFECTOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Meningoencefalitis amebiana primaria</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Naegleria fowleri, ameba de vida libre termófila de aguas dulces cálidas.</tspan><tspan x="58.0" dy="17">Evoluciona como una meningitis bacteriana fulminante.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 25 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">4 días de cefalea, fiebre, vómitos y 2 convulsiones;</tspan><tspan x="640.0" dy="16">sinusitis previa y baño en un lago.</tspan><tspan x="640.0" dy="16">Rigidez de nuca y parálisis de pares III y VI; LCR</tspan><tspan x="640.0" dy="16">purulento con glucosa 25.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DE LA LAGUNA AL CEREBRO: LA RUTA DE NAEGLERIA FOWLERI</tspan></text><rect x="40.0" y="301.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="145.2" y="321.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Reservorio</tspan></text><text x="145.2" y="338.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Agua dulce cálida: lagos y piscinas</tspan><tspan x="145.2" dy="16">mal cloradas</tspan></text><line x1="253.5" y1="338.5" x2="266.5" y2="338.5" stroke="#0f766e" stroke-width="2"/><polygon points="265.5,333.5 265.5,343.5 273.5,338.5" fill="#0f766e"/><line x1="145.2" y1="378.0" x2="145.2" y2="392.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="40.0" y="394.0" width="210.5" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="145.2" y="408.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">✂ CORTA</tspan></text><text x="145.2" y="425.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">No nadar con la cabeza</tspan><tspan x="145.2" dy="16">sumergida en agua tibia</tspan></text><rect x="276.5" y="301.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="381.8" y="321.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Entrada</tspan></text><text x="381.8" y="338.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Al nadar, el agua llega a la mucosa</tspan><tspan x="381.8" dy="16">nasal</tspan></text><line x1="490.0" y1="338.5" x2="503.0" y2="338.5" stroke="#0f766e" stroke-width="2"/><polygon points="502.0,333.5 502.0,343.5 510.0,338.5" fill="#0f766e"/><line x1="381.8" y1="378.0" x2="381.8" y2="392.0" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="276.5" y="394.0" width="210.5" height="64.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="381.8" y="408.0" font-size="9.5" font-weight="800" font-style="normal" fill="#ffedd5" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">✂ CORTA</tspan></text><text x="381.8" y="425.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Pinza nasal; sinusitis previa</tspan><tspan x="381.8" dy="16">facilita la entrada</tspan></text><rect x="336.3" y="447.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="381.8" y="462.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="381.8" dy="0">◆ ESTE CASO</tspan></text><rect x="513.0" y="301.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="618.2" y="321.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Invasión</tspan></text><text x="618.2" y="338.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Lámina cribosa y nervio olfatorio</tspan><tspan x="618.2" dy="16">hasta el cerebro</tspan></text><line x1="726.5" y1="338.5" x2="739.5" y2="338.5" stroke="#0f766e" stroke-width="2"/><polygon points="738.5,333.5 738.5,343.5 746.5,338.5" fill="#0f766e"/><line x1="618.2" y1="378.0" x2="618.2" y2="392.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="513.0" y="394.0" width="210.5" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="618.2" y="408.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">✂ CORTA</tspan></text><text x="618.2" y="425.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Incubación de 1 a 9 días</tspan></text><rect x="749.5" y="301.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="854.8" y="321.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Enfermedad</tspan></text><text x="854.8" y="338.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Meningitis purulenta fulminante con</tspan><tspan x="854.8" dy="16">Gram negativo</tspan></text><line x1="854.8" y1="378.0" x2="854.8" y2="392.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="749.5" y="394.0" width="210.5" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="854.8" y="408.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">✂ CORTA</tspan></text><text x="854.8" y="425.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Anfotericina B más miltefosina</tspan></text><rect x="40.0" y="488.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="514.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Agua dulce + LCR purulento sin gérmenes = Naegleria fowleri</tspan></text><text x="60.0" y="533.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Se confirma con trofozoítos móviles en fresco o PCR.</tspan></text><text x="40.0" y="600.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="610.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="641.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="632.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Streptococcus</tspan><tspan x="285.0" dy="17">pneumoniae</tspan></text><text x="435.0" y="641.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Acanthamoeba sp</tspan></text><rect x="513.0" y="613.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="641.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Naegleria fowleri</tspan></text><text x="735.0" y="632.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Neisseria</tspan><tspan x="735.0" dy="17">meningitidis</tspan></text><text x="885.0" y="632.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Cryptococcus</tspan><tspan x="885.0" dy="17">neoformans</tspan></text><rect x="40.0" y="664.0" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="664.0" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="709.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Germen probable?</tspan></text><text x="285.0" y="685.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no hay</tspan><tspan x="285.0" dy="16">antecedente de agua</tspan><tspan x="285.0" dy="16">dulce y el Gram sería</tspan><tspan x="285.0" dy="16">positivo</tspan></text><text x="435.0" y="693.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: encefalitis</tspan><tspan x="435.0" dy="16">granulomatosa</tspan><tspan x="435.0" dy="16">subaguda</tspan></text><text x="585.0" y="693.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: lago, sinusitis y</tspan><tspan x="585.0" dy="16">LCR purulento sin</tspan><tspan x="585.0" dy="16">gérmenes</tspan></text><text x="735.0" y="701.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: el Gram mostraría</tspan><tspan x="735.0" dy="16">diplococos</tspan></text><text x="885.0" y="701.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: meningitis</tspan><tspan x="885.0" dy="16">linfocitaria</tspan></text><rect x="40.0" y="610.0" width="920.0" height="136.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="770.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="798.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="820.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Los trofozoítos entran por la mucosa nasal al nadar o bucear, cruzan la lámina cribosa y llegan al cerebro por el nervio olfatorio; incubación de 1 a 9 días.</tspan><tspan x="58.0" dy="18">• LCR purulento con polimorfonucleares, proteínas altas e hipoglucorraquia, pero Gram y cultivos negativos: se ven trofozoítos móviles en fresco o PCR.</tspan><tspan x="58.0" dy="18">• El antecedente de agua dulce orienta frente al neumococo y al meningococo. Acanthamoeba: encefalitis granulomatosa subaguda en inmunodeprimidos;</tspan><tspan x="58.0" dy="18">   Cryptococcus: meningitis linfocitaria.</tspan><tspan x="58.0" dy="18">• Mortalidad mayor de 95 %; tratamiento con anfotericina B más miltefosina, en cuanto se sospeche.</tspan></text><text x="58.0" y="914.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, Naegleria fowleri, información clínica; Cope JR, Ali IK (Curr Infect Dis Rep 2016;18:31); Harrison 21.ª ed. (2022).</tspan></text></svg>