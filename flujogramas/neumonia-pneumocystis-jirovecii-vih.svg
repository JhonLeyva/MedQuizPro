<svg xmlns="http://www.w3.org/2000/svg" width="820" height="961" viewBox="0 0 820 961" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Neumonía por Pneumocystis jirovecii en VIH"><title>Neumonía por Pneumocystis jirovecii en VIH</title><rect width="820" height="961" fill="#ffffff"/><rect x="0" y="0" width="820" height="112" fill="#0f766e"/><text x="40" y="34" font-size="13" font-weight="600" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="740"><tspan x="40" dy="0">MedQuizPlus · Flujograma</tspan></text><text x="40" y="70" font-size="24" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="740"><tspan x="40" dy="0">Neumonía por Pneumocystis jirovecii en VIH</tspan></text><text x="40" y="96" font-size="13" font-weight="400" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="740"><tspan x="40" dy="0">ENAM 2020 · INF-005 · Infectología</tspan></text><rect x="90" y="144" width="640" height="98" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="108" y="172" font-size="11" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="604"><tspan x="108" dy="0">INICIO</tspan></text><text x="108" y="196" font-size="16" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Paciente con VIH sin tratamiento antirretroviral (CD4 &lt;</tspan><tspan x="108" dy="22">200/mm³)</tspan></text><line x1="410.0" y1="244" x2="410.0" y2="264" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,262 417.0,262 410.0,272" fill="#94a3b8"/><rect x="90" y="274" width="640" height="76" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="302" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="326" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Disnea progresiva, tos seca y fiebre de semanas de evolución</tspan></text><line x1="410.0" y1="352" x2="410.0" y2="372" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,370 417.0,370 410.0,380" fill="#94a3b8"/><rect x="90" y="382" width="640" height="98" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><circle cx="120" cy="431.0" r="12" fill="#d97706"/><text x="120" y="436.0" font-size="15" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="120" dy="0">?</tspan></text><text x="142" y="410" font-size="11" font-weight="700" font-style="normal" fill="#b45309" text-anchor="start" data-max="570"><tspan x="142" dy="0">DECISIÓN</tspan></text><text x="142" y="434" font-size="16" font-weight="600" font-style="normal" fill="#78350f" text-anchor="start" data-max="570"><tspan x="142" dy="0">¿Rx con infiltrado intersticial bilateral, DHL elevada e</tspan><tspan x="142" dy="22">hipoxemia?</tspan></text><line x1="410.0" y1="482" x2="410.0" y2="502" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,500 417.0,500 410.0,510" fill="#94a3b8"/><rect x="90" y="512" width="640" height="76" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="540" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="564" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Sospechar neumonía por Pneumocystis jirovecii</tspan></text><line x1="410.0" y1="590" x2="410.0" y2="610" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,608 417.0,608 410.0,618" fill="#94a3b8"/><rect x="90" y="620" width="640" height="76" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="648" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="672" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Confirmar en esputo inducido o lavado broncoalveolar</tspan></text><line x1="410.0" y1="698" x2="410.0" y2="718" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,716 417.0,716 410.0,726" fill="#94a3b8"/><rect x="90" y="728" width="640" height="76" rx="12" fill="#134e4a" stroke="#134e4a" stroke-width="2"/><text x="108" y="756" font-size="11" font-weight="700" font-style="normal" fill="#5eead4" text-anchor="start" data-max="604"><tspan x="108" dy="0">CONDUCTA FINAL</tspan></text><text x="108" y="780" font-size="16" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Cotrimoxazol por 21 días + corticoide si PaO₂ &lt; 70 mmHg</tspan></text><rect x="40" y="834" width="740" height="77" rx="10" fill="#f0fdfa" stroke="#99f6e4"/><rect x="40" y="834" width="6" height="77" rx="3" fill="#14b8a6"/><text x="62" y="860" font-size="14" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="704"><tspan x="62" dy="0">Perla clínica</tspan></text><text x="62" y="884" font-size="15" font-weight="400" font-style="normal" fill="#134e4a" text-anchor="start" data-max="704"><tspan x="62" dy="0">Todo paciente con CD4 &lt; 200/mm³ debe recibir profilaxis con cotrimoxazol.</tspan></text><text x="410.0" y="939" font-size="11" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="740"><tspan x="410.0" dy="0">MedQuizPlus · Material de estudio: contrasta siempre con las guías clínicas vigentes.</tspan></text></svg>
