<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="782" viewBox="0 0 1000 782" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Potasio e insulina en la cetoacidosis"><title>Potasio e insulina en la cetoacidosis</title><rect x="0.75" y="0.75" width="998.5" height="780.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">ENDOCRINOLOGÍA ENAM: CETOACIDOSIS DIABÉTICA</tspan></text><rect x="526.7" y="32.0" width="121.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="587.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="105"><tspan x="587.4" dy="0">ENDOCRINOLOGÍA</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cetoacidosis diabética</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Líquidos, potasio e insulina, en ese orden</tspan><tspan x="58.0" dy="17">La insulina mete potasio a las células: no iniciar si K &lt; 3,3</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 18 años con CAD</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">pH 7,12 · HCO₃⁻ 8 · glucosa 480 · cetonuria</tspan><tspan x="640.0" dy="16">K 3,2 tras hidratación con salino</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">POTASIO SÉRICO</tspan></text><rect x="70.0" y="279.0" width="34.0" height="330.0" rx="17" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="75.0" y="503.0" width="24.0" height="102.0" rx="8" fill="#10b981" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="554.0" x2="130.0" y2="554.0" stroke="#0f766e" stroke-width="3"/><rect x="130.0" y="504.0" width="330.0" height="100.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="144.0" y="526.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">&lt; 3,3</tspan></text><text x="240.0" y="526.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Bajo</tspan></text><text x="144.0" y="547.0" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">REPONER K PRIMERO</tspan><tspan x="144.0" dy="15">Diferir insulina</tspan></text><rect x="354.6" y="493.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="400.0" y="508.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="400.0" dy="0">◆ ESTE CASO</tspan></text><rect x="75.0" y="393.0" width="24.0" height="102.0" rx="8" fill="#f59e0b" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="444.0" x2="130.0" y2="444.0" stroke="#f59e0b" stroke-width="2"/><rect x="130.0" y="394.0" width="330.0" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="416.0" font-size="12" font-weight="800" font-style="normal" fill="#f59e0b" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">3,3-5,2</tspan></text><text x="240.0" y="416.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Normal</tspan></text><text x="144.0" y="437.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Insulina + K EV</tspan></text><rect x="75.0" y="283.0" width="24.0" height="102.0" rx="8" fill="#f97316" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="334.0" x2="130.0" y2="334.0" stroke="#f97316" stroke-width="2"/><rect x="130.0" y="284.0" width="330.0" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="306.0" font-size="12" font-weight="800" font-style="normal" fill="#f97316" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">&gt; 5,2</tspan></text><text x="240.0" y="306.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Alto</tspan></text><text x="144.0" y="327.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Insulina sin K</tspan></text><text x="470.0" y="283.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="490"><tspan x="470.0" dy="0">ORDEN EN ESTE CASO</tspan></text><rect x="470.0" y="297.0" width="490.0" height="84.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><circle cx="498.0" cy="339.0" r="17" fill="#ffffff" stroke="none" stroke-width="0"/><text x="498.0" y="344.0" font-size="15" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">1</tspan></text><text x="528.0" y="332.0" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Reponer potasio</tspan></text><text x="528.0" y="355.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">20-30 mEq/h EV</tspan></text><rect x="860.7" y="286.0" width="58.5" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="301.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ PASO</tspan></text><line x1="498.0" y1="383.0" x2="498.0" y2="396.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,395.0 503.0,395.0 498.0,403.0" fill="#0f766e"/><rect x="470.0" y="405.0" width="490.0" height="84.0" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="447.0" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="452.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">2</tspan></text><text x="528.0" y="440.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Insulina cuando K ≥ 3,3</tspan></text><text x="528.0" y="463.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">0,1 U/kg/h</tspan></text><line x1="498.0" y1="491.0" x2="498.0" y2="504.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,503.0 503.0,503.0 498.0,511.0" fill="#0f766e"/><rect x="470.0" y="513.0" width="490.0" height="84.0" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="555.0" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="560.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">3</tspan></text><text x="528.0" y="548.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Dextrosa si glucosa &lt; 250</tspan></text><text x="528.0" y="571.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Hasta cerrar el anión gap</tspan></text><rect x="40.0" y="633.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="661.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="683.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Bicarbonato solo si pH &lt; 6,9.</tspan><tspan x="58.0" dy="18">• Controlar potasio cada 2 horas.</tspan><tspan x="58.0" dy="18">• Buscar el desencadenante (infección, abandono).</tspan></text><text x="58.0" y="741.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ADA – Standards of Care in Diabetes (2025) · Kitabchi AE. Diabetes Care (2009)</tspan></text></svg>