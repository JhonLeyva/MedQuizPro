<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1097" viewBox="0 0 1000 1097" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Al realimentar a un lactante desnutrido la complicación clásica es la hipofosfatemia"><title>Al realimentar a un lactante desnutrido la complicación clásica es la hipofosfatemia</title><rect x="0.75" y="0.75" width="998.5" height="1095.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Nutrición pediátrica · síndrome de realimentación</tspan></text><rect x="491.9" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="540.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="540.9" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Síndrome de realimentación</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Alteraciones de electrolitos, líquidos y metabolismo al reiniciar el aporte calórico en un</tspan><tspan x="58.0" dy="17">desnutrido.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante desnutrido en su primera semana</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Se reinicia la alimentación.</tspan><tspan x="640.0" dy="16">¿Qué complicación puede presentarse?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL PLATO DE COMIDA AL FOSFATO BAJO</tspan></text><rect x="40.0" y="269.0" width="210.5" height="76.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="145.2" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Reinicio del aporte calórico</tspan></text><text x="145.2" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Carbohidratos en un desnutrido</tspan></text><line x1="253.5" y1="307.0" x2="266.5" y2="307.0" stroke="#0f766e" stroke-width="2"/><polygon points="265.5,302.0 265.5,312.0 273.5,307.0" fill="#0f766e"/><line x1="145.2" y1="347.0" x2="145.2" y2="361.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="40.0" y="363.0" width="210.5" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="145.2" y="377.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">✂ CORTA</tspan></text><text x="145.2" y="394.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Vuelve el metabolismo</tspan><tspan x="145.2" dy="16">anabólico</tspan></text><rect x="276.5" y="269.0" width="210.5" height="76.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="381.8" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Sube la insulina</tspan></text><text x="381.8" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Responde a la glucosa</tspan></text><line x1="490.0" y1="307.0" x2="503.0" y2="307.0" stroke="#0f766e" stroke-width="2"/><polygon points="502.0,302.0 502.0,312.0 510.0,307.0" fill="#0f766e"/><line x1="381.8" y1="347.0" x2="381.8" y2="361.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="276.5" y="363.0" width="210.5" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="381.8" y="377.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">✂ CORTA</tspan></text><text x="381.8" y="394.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Desplaza iones al interior de la</tspan><tspan x="381.8" dy="16">célula</tspan></text><rect x="513.0" y="269.0" width="210.5" height="76.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="618.2" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Fosfato, potasio y magnesio</tspan><tspan x="618.2" dy="17">caen</tspan></text><text x="618.2" y="323.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Pasan al medio intracelular</tspan></text><line x1="726.5" y1="307.0" x2="739.5" y2="307.0" stroke="#0f766e" stroke-width="2"/><polygon points="738.5,302.0 738.5,312.0 746.5,307.0" fill="#0f766e"/><line x1="618.2" y1="347.0" x2="618.2" y2="361.0" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="513.0" y="363.0" width="210.5" height="64.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="618.2" y="377.0" font-size="9.5" font-weight="800" font-style="normal" fill="#ffedd5" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">✂ CORTA</tspan></text><text x="618.2" y="394.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Hipofosfatemia en los primeros</tspan><tspan x="618.2" dy="16">días</tspan></text><rect x="546.4" y="416.0" width="143.7" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="618.2" y="431.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="618.2" dy="0">◆ MARCADOR CLÁSICO</tspan></text><rect x="749.5" y="269.0" width="210.5" height="76.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="854.8" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Consecuencias</tspan></text><text x="854.8" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Tiamina consumida; sodio y agua</tspan><tspan x="854.8" dy="16">retenidos</tspan></text><line x1="854.8" y1="347.0" x2="854.8" y2="361.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="749.5" y="363.0" width="210.5" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="854.8" y="377.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">✂ CORTA</tspan></text><text x="854.8" y="394.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Debilidad, arritmias, falla</tspan><tspan x="854.8" dy="16">cardiaca, convulsiones</tspan></text><rect x="40.0" y="457.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="483.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Realimentación = hipofosfatemia</tspan></text><text x="60.0" y="502.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Potasio y magnesio también bajan; la hiperkalemia y la hipercalcemia no son lo esperado.</tspan></text><text x="40.0" y="563.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ELECTROLITOS Y NUTRIENTES EN EL SÍNDROME DE REALIMENTACIÓN</tspan></text><rect x="40.0" y="575.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="594.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Elemento</tspan></text><text x="220.0" y="594.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Qué ocurre</tspan></text><text x="595.0" y="594.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Consecuencia</tspan></text><rect x="40.0" y="604.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="623.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Fosfato</tspan></text><text x="220.0" y="623.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Desciende: marcador clásico</tspan></text><text x="595.0" y="623.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Debilidad, falla cardiaca y respiratoria, rabdomiólisis</tspan></text><rect x="110.6" y="607.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="156.0" y="622.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="156.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="633.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="652.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Potasio y magnesio</tspan></text><text x="220.0" y="652.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Descienden</tspan></text><text x="595.0" y="652.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Arritmias</tspan></text><rect x="40.0" y="662.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="681.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Sodio y agua</tspan></text><text x="220.0" y="681.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Se retienen</tspan></text><text x="595.0" y="681.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Edema y sobrecarga de volumen</tspan></text><rect x="40.0" y="691.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="710.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Tiamina</tspan></text><text x="220.0" y="710.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Se consume</tspan></text><text x="595.0" y="710.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Riesgo neurológico y acidosis láctica</tspan></text><text x="40.0" y="760.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="770.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="792.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="773.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="792.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hipofosfatemia</tspan></text><text x="435.0" y="792.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hiponatremia</tspan></text><text x="585.0" y="792.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Hipercalcemia</tspan></text><text x="735.0" y="792.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hiperkalemia</tspan></text><text x="885.0" y="792.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hipernatremia</tspan></text><rect x="40.0" y="807.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="807.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="836.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Complicación</tspan><tspan x="54.0" dy="16">esperada?</tspan></text><text x="285.0" y="836.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: el fosfato entra a la</tspan><tspan x="285.0" dy="16">célula con la insulina</tspan></text><text x="435.0" y="828.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: hay retención de</tspan><tspan x="435.0" dy="16">sodio, no hiponatremia</tspan><tspan x="435.0" dy="16">primaria</tspan></text><text x="585.0" y="836.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no forma parte del</tspan><tspan x="585.0" dy="16">cuadro</tspan></text><text x="735.0" y="836.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: el potasio</tspan><tspan x="735.0" dy="16">desciende</tspan></text><text x="885.0" y="828.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: hay retención de</tspan><tspan x="885.0" dy="16">sodio, no</tspan><tspan x="885.0" dy="16">hipernatremia primaria</tspan></text><rect x="40.0" y="770.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="897.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="925.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="947.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Mecanismo: llegan carbohidratos, sube la insulina y el fosfato, el potasio y el magnesio entran a la célula; se consume tiamina y se retiene sodio y agua.</tspan><tspan x="58.0" dy="18">• Marcador clásico: hipofosfatemia en los primeros días. Produce debilidad, insuficiencia cardiaca y respiratoria, arritmias, rabdomiólisis y convulsiones.</tspan><tspan x="58.0" dy="18">• Prevención: identificar el riesgo, empezar con pocas calorías (10 a 20 kcal/kg/día en el alto riesgo, ASPEN 2020), subir poco a poco y dar fosfato,</tspan><tspan x="58.0" dy="18">   potasio, magnesio y tiamina.</tspan><tspan x="58.0" dy="18">• Alerta: edema o insuficiencia cardiaca en un desnutrido que recibe nutrición abundante sugiere realimentación, no infección.</tspan></text><text x="58.0" y="1041.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: da Silva y cols., Consenso ASPEN sobre síndrome de realimentación (Nutr Clin Pract 2020); OMS, Manejo de la desnutrición aguda grave (2013); Nelson Tratado de</tspan><tspan x="58.0" dy="15">Pediatría 22.ª ed. (2024).</tspan></text></svg>