le" data-max="269"><tspan x="188.7" dy="0">HIPERTENSIÓN PORTAL</tspan></text><text x="188.7" y="605.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Cirrosis (la más frecuente)</tspan></text><rect x="351.3" y="554.5" width="297.3" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="582.8" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Portal poshepática</tspan></text><text x="500.0" y="605.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Falla cardiaca, Budd-Chiari</tspan></text><rect x="662.7" y="415.0" width="297.3" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Causa peritoneal</tspan></text><text x="811.3" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Carcinomatosis, TB, pancreatitis</tspan></text><text x="40.0" y="671.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">GASA</tspan></text><rect x="40.0" y="681.9" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="704.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="684.9" width="369.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="397.5" y="704.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="355"><tspan x="397.5" dy="0">≥ 1,1</tspan></text><text x="772.5" y="704.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="355"><tspan x="772.5" dy="0">&lt; 1,1</tspan></text><rect x="40.0" y="718.9" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="718.9" width="369.0" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="739.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Mecanismo</tspan></text><text x="397.5" y="739.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="353"><tspan x="397.5" dy="0">Presión portal alta</tspan></text><text x="772.5" y="739.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="353"><tspan x="772.5" dy="0">Inflamación o tumor peritoneal</tspan></text><rect x="40.0" y="752.9" width="920.0" height="34.0" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="752.9" width="369.0" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="773.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Ejemplos</tspan></text><text x="397.5" y="773.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="353"><tspan x="397.5" dy="0">Cirrosis, falla cardiaca</tspan></text><text x="772.5" y="773.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="353"><tspan x="772.5" dy="0">TB peritoneal, carcinomatosis</tspan></text><rect x="40.0" y="681.9" width="920.0" height="105.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="810.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="838.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="860.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Siempre pedir recuento celular y cultivo.</tspan><tspan x="58.0" dy="18">• El síndrome de Meigs suele tener GASA alto.</tspan><tspan x="58.0" dy="18">• Citología si se sospecha cáncer.</tspan></text><text x="58.0" y="918.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AASLD – Management of ascites (2021) · Harrison. Principios de Medicina Interna 22.ª ed. (2025)</tspan></text></svg>