reteral: ¿&lt; 10 mm, sin fiebre ni riñón único, con</tspan><tspan x="519.0" dy="17">dolor controlado?</tspan></text><rect x="40.0" y="427.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="455.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">TRATAMIENTO MÉDICO EXPULSIVO</tspan></text><text x="266.5" y="478.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Tamsulosina</tspan><tspan x="266.5" dy="17">Control 4-6 semanas</tspan></text><rect x="507.0" y="427.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="463.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Ureteroscopía o drenaje</tspan></text><text x="733.5" y="486.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Según el caso</tspan></text><text x="40.0" y="557.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="569.5" width="920.0" height="346.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="583.5" width="290.2" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="201.1" y="603.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="201.1" dy="0">TAMAÑO DEL CÁLCULO Y EXPULSIÓN</tspan></text><text x="362.2" y="603.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="580"><tspan x="362.2" dy="0">Cuanto más grande, menos probable que salga solo.</tspan></text><rect x="56.0" y="64