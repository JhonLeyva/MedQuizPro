.</tspan><tspan x="58.0" dy="18">• Ajustar según cultivos.</tspan><tspan x="58.0" dy="18">• Amikacina + penicilina: mala en abscesos.</tspan></text><text x="58.0" y="746.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: IDSA – Intra-abdominal infections (2010) · Guía Sanford de terapéutica antimicrobiana (2024)</tspan></text></svg>