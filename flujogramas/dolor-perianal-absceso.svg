width="211.8" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="612.5" y="659.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="197"><tspan x="612.5" dy="0">INTERESFINTÉRICO</tspan></text><text x="612.5" y="679.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="189"><tspan x="612.5" dy="0">Entre esfínteres</tspan></text><circle cx="522.0" cy="704.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="532.0" y="708.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="532.0" dy="0">Dolor sin masa visible</tspan></text><rect x="731.0" y="631.5" width="213.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="731.6" y="632.1" width="211.8" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="837.5" y="659.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="197"><tspan x="837.5" dy="0">SUPRAELEVADOR</tspan></text><text x="837.5" y="679.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="189"><tspan x="837.5" dy="0">Raro</tspan></text><circle cx="747.0" cy="704.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="757.0" y="708.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="757.0" dy="0">Dolor pélvico, fiebre</tspan></text><text x="56.0" y="759.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="768.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="783.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="783.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Tumefacción visible del periné con flogosis</tspan></text><rect x="56.0" y="790.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="805.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="805.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Fiebre y dolor perianal</tspan></text><rect x="56.0" y="827.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="850.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Drenaje quirúrgico y antibiótico por la diabetes.</tspan></text><text x="40.0" y="920.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="930.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="961.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="933.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="961.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Absceso perianal</tspan></text><text x="435.0" y="953.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hemorroide</tspan><tspan x="435.0" dy="17">trombosada</tspan></text><text x="585.0" y="961.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Fisura anal</tspan></text><text x="735.0" y="961.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Cáncer de recto</tspan></text><text x="885.0" y="961.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Quiste pilonidal</tspan></text><rect x="40.0" y="984.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="984.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1013.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="1005.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: dolor + fiebre +</tspan><tspan x="285.0" dy="16">flogosis</tspan></text><text x="435.0" y="1005.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: nódulo azulado sin</tspan><tspan x="435.0" dy="16">fiebre</tspan></text><text x="585.0" y="1005.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: dolor al defecar,</tspan><tspan x="585.0" dy="16">sin fiebre</tspan></text><text x="735.0" y="1005.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: sangrado, sin</tspan><tspan x="735.0" dy="16">fiebre aguda</tspan></text><text x="885.0" y="1005.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: en el pliegue</tspan><tspan x="885.0" dy="16">sacro, no perianal</tspan></text><rect x="40.0" y="930.5" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1058.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1086.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1108.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Drenaje quirúrgico urgente: no esperar a que «madure» ni tratar solo con antibióticos.</tspan><tspan x="58.0" dy="18">• Antibiótico además en diabéticos, inmunodeprimidos o con celulitis extensa.</tspan><tspan x="58.0" dy="18">• En diabéticos vigilar gangrena de Fournier; 30-50 % quedan con fístula.</tspan></text><text x="58.0" y="1166.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ASCRS, abscesos y fístulas anorrectales (2022).</tspan></text></svg>