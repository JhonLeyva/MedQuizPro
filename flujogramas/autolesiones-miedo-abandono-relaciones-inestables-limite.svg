<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1058" viewBox="0 0 1000 1058" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Mujer con relaciones inestables, autolesiones, amenazas suicidas, impulsividad, consumo de drogas y miedo intenso al abandono: trastorno límite de la personalidad"><title>Mujer con relaciones inestables, autolesiones, amenazas suicidas, impulsividad, consumo de drogas y miedo intenso al abandono: trastorno límite de la personalidad</title><rect x="0.75" y="0.75" width="998.5" height="1056.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Trastornos de la personalidad</tspan></text><rect x="377.0" y="32.0" width="124.2" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="439.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="108"><tspan x="439.2" dy="0">PSIQUIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Trastorno límite de la personalidad</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Patrón persistente de inestabilidad en las relaciones, la autoimagen y el ánimo, con mucha</tspan><tspan x="58.0" dy="17">impulsividad.</tspan><tspan x="58.0" dy="17">DSM-5-TR: ≥ 5 de 9 criterios (miedo al abandono, relaciones intensas e inestables,</tspan><tspan x="58.0" dy="17">autoimagen inestable, impulsividad, autolesiones, inestabilidad afectiva, vacío, ira, ideas</tspan><tspan x="58.0" dy="17">paranoides transitorias).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 34 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Tercer matrimonio; discute constantemente; se corta</tspan><tspan x="640.0" dy="16">los brazos; amenaza con suicidarse.</tspan><tspan x="640.0" dy="16">Pelea con vecinos; marihuana ocasional; miedo a que</tspan><tspan x="640.0" dy="16">el esposo la abandone.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CRITERIOS DSM-5-TR (≥ 5 DE 9)</tspan></text><rect x="40.0" y="301.0" width="672.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="56.0" y="323.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="start" data-max="542"><tspan x="56.0" dy="0">LO QUE TIENE ELLA</tspan></text><text x="696.0" y="323.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="100"><tspan x="696.0" dy="0">EN EL CASO</tspan></text><rect x="40.0" y="335.0" width="672.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="345.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="360.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="359.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="522"><tspan x="86.0" dy="0">Miedo intenso al abandono</tspan></text><text x="86.0" y="375.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="522"><tspan x="86.0" dy="0">Teme que el esposo la deje</tspan></text><text x="696.0" y="359.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="696.0" dy="0">Sí</tspan></text><rect x="40.0" y="381.0" width="672.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="391.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="406.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="405.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="522"><tspan x="86.0" dy="0">Relaciones inestables e intensas</tspan></text><text x="86.0" y="421.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="522"><tspan x="86.0" dy="0">Tercer matrimonio, peleas</tspan></text><text x="696.0" y="405.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="696.0" dy="0">Sí</tspan></text><rect x="40.0" y="427.0" width="672.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="437.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="452.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="451.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="522"><tspan x="86.0" dy="0">Impulsividad dañina</tspan></text><text x="86.0" y="467.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="522"><tspan x="86.0" dy="0">Marihuana</tspan></text><text x="696.0" y="451.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="696.0" dy="0">Sí</tspan></text><rect x="40.0" y="473.0" width="672.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="483.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="498.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="497.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="522"><tspan x="86.0" dy="0">Autolesiones o amenazas suicidas</tspan></text><text x="86.0" y="513.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="522"><tspan x="86.0" dy="0">Cortes y amenazas</tspan></text><text x="696.0" y="497.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="696.0" dy="0">Sí</tspan></text><rect x="40.0" y="519.0" width="672.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="529.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="544.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="543.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="522"><tspan x="86.0" dy="0">Ira intensa e inapropiada</tspan></text><text x="86.0" y="559.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="522"><tspan x="86.0" dy="0">Pelea con vecinos</tspan></text><text x="696.0" y="543.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="696.0" dy="0">Sí</tspan></text><rect x="40.0" y="565.0" width="672.0" height="46.0" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="575.0" width="20.0" height="20.0" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="64.0" y="590.0" font-size="12" font-weight="800" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">?</tspan></text><text x="86.0" y="589.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="522"><tspan x="86.0" dy="0">Sentimiento crónico de vacío</tspan></text><text x="86.0" y="605.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="522"><tspan x="86.0" dy="0">Preguntar</tspan></text><text x="696.0" y="589.0" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="696.0" dy="0">Sin dato</tspan></text><rect x="40.0" y="611.0" width="672.0" height="57.0" rx="0" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="56.0" y="633.0" font-size="11" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="640"><tspan x="56.0" dy="0">5 de 9 presentes · ≥ 5 de 9 = trastorno límite</tspan></text><text x="56.0" y="653.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="640"><tspan x="56.0" dy="0">Trastorno límite de la personalidad: terapia dialéctico-conductual.</tspan></text><rect x="40.0" y="301.0" width="672.0" height="367.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="732.0" y="301.0" width="228.0" height="397.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="744.0" y="311.0" width="102.2" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="753.0" y="325.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="753.0" dy="0">AUTOLESIONES</tspan></text><g data-box="746.0 339.0 200.0 320.0"><g transform="translate(776.0,339.0) scale(0.6)"><circle cx="120" cy="40" r="28" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M110 66 H130 V80 H110 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 80 H170 L176 170 H64 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M64 170 H176 L170 240 H70 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 240 H170 L164 268 H76 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 84 L50 92 L36 170 L54 174 L66 120 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M36 170 L54 174 L46 238 L28 236 Z" fill="#fecaca" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="37" cy="250" rx="10" ry="15" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M76 268 H118 L114 360 H84 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M84 360 H114 L108 418 H90 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="98" cy="426" rx="15" ry="7" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M170.0 84 L190.0 92 L204.0 170 L186.0 174 L174.0 120 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M204.0 170 L186.0 174 L194.0 238 L212.0 236 Z" fill="#fecaca" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="203.0" cy="250.0" rx="10.0" ry="15.0" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M164.0 268 H122.0 L126.0 360 H156.0 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M156.0 360 H126.0 L132.0 418 H150.0 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="142.0" cy="426.0" rx="15.0" ry="7.0" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="110" cy="36" r="3" fill="#334155" stroke="none" stroke-width="0" /><circle cx="130" cy="36" r="3" fill="#334155" stroke="none" stroke-width="0" /><path d="M112 52 Q120 57 128 52" fill="none" stroke="#9a6b52" stroke-width="1.6"/><text x="4" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">D</text><text x="236" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">I</text></g></g><text x="746.0" y="675.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="200"><tspan x="746.0" dy="0">Cortes en los antebrazos.</tspan></text><text x="40.0" y="738.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="748.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="787.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="770.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Fase maníaca de un</tspan><tspan x="285.0" dy="17">trastorno afectivo</tspan><tspan x="285.0" dy="17">bipolar</tspan></text><text x="435.0" y="770.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Trastorno de</tspan><tspan x="435.0" dy="17">ansiedad</tspan><tspan x="435.0" dy="17">generalizada</tspan></text><text x="585.0" y="770.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Trastorno de</tspan><tspan x="585.0" dy="17">personalidad</tspan><tspan x="585.0" dy="17">esquizotípico</tspan></text><rect x="663.0" y="751.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="779.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Trastorno de</tspan><tspan x="735.0" dy="17">personalidad limite</tspan></text><text x="885.0" y="779.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Trastorno</tspan><tspan x="885.0" dy="17">obsesivo-compulsivo</tspan></text><rect x="40.0" y="819.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="819.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="856.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="848.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no hay episodio</tspan><tspan x="285.0" dy="16">maníaco</tspan></text><text x="435.0" y="840.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: preocupación</tspan><tspan x="435.0" dy="16">excesiva, sin</tspan><tspan x="435.0" dy="16">autolesiones</tspan></text><text x="585.0" y="856.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: excéntrico, aislado</tspan></text><text x="735.0" y="840.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: inestabilidad +</tspan><tspan x="735.0" dy="16">autolesiones +</tspan><tspan x="735.0" dy="16">abandono</tspan></text><text x="885.0" y="848.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: obsesiones y</tspan><tspan x="885.0" dy="16">compulsiones</tspan></text><rect x="40.0" y="748.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="909.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="937.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="959.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Psicoterapia: terapia dialéctico-conductual (la de más evidencia).</tspan><tspan x="58.0" dy="18">• Fármacos solo para síntomas (no curan el trastorno); evitar benzodiacepinas.</tspan><tspan x="58.0" dy="18">• Evaluar el riesgo suicida en cada consulta.</tspan></text><text x="58.0" y="1017.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: APA, DSM-5-TR (2022); NICE CG78.</tspan></text></svg>