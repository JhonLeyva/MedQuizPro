" dy="0">Almidón.</tspan></text><rect x="510.0" y="470.0" width="450.0" height="181.0" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="510.0" y="470.0" width="450.0" height="8.0" rx="4" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="530.0" y="504.0" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="410"><tspan x="530.0" dy="0">Amilasa</tspan></text><rect x="526.0" y="525.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="542.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Sustrato</tspan></text><text x="932.0" y="542.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">Almidón</tspan></text><rect x="526.0" y="555.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="572.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Origen</tspan></text><text x="932.0" y="572.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">Saliva, páncreas</tspan></text><rect x="526.0" y="585.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="602.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">No es</tspan></text><text x="932.0" y="602.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">Disacaridasa</tspan></text><text x="530.0" y="631.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="530.0" dy="0">Polisacárido.</tspan></text><text x="40.0" y="673.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="400"><tspan x="40.0" dy="0">✓ = dato que coincide con el caso</tspan></text><text x="40.0" y="719.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="729.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="751.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="751.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Sacarasa</tspan></text><text x="435.0" y="751.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Amilasa</tspan></text><text x="585.0" y="751.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Maltasa</tspan></text><rect x="663.0" y="732.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="751.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Lactasa</tspan></text><text x="885.0" y="751.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Lipasa</tspan></text><rect x="40.0" y="766.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="766.0" width="144.0" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="787.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Enzima?</tspan></text><text x="285.0" y="787.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: sacarosa (azúcar)</tspan></text><text x="435.0" y="787.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: almidón</tspan></text><text x="585.0" y="787.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: maltosa</tspan></text><text x="735.0" y="787.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: digiere la lactosa</tspan></text><text x="885.0" y="787.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: grasas</tspan></text><rect x="40.0" y="729.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="824.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="852.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="874.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Prueba del hidrógeno espirado o mejoría al retirar la lactosa.</tspan><tspan x="58.0" dy="18">• Lácteos sin lactosa, yogur y quesos maduros (menos lactosa); lactasa en tabletas.</tspan><tspan x="58.0" dy="18">• Asegurar calcio y vitamina D.</tspan></text><text x="58.0" y="932.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ESPGHA