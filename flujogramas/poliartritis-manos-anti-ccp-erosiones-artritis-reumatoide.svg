<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1117" viewBox="0 0 1000 1117" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Mujer de 35 años con 4 meses de poliartritis de manos y muñecas, rigidez matutina, anti-CCP positivo y erosiones: artritis reumatoide"><title>Mujer de 35 años con 4 meses de poliartritis de manos y muñecas, rigidez matutina, anti-CCP positivo y erosiones: artritis reumatoide</title><rect x="0.75" y="0.75" width="998.5" height="1115.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Artritis reumatoide</tspan></text><rect x="312.1" y="32.0" width="143.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="383.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="127"><tspan x="383.6" dy="0">REUMATOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Criterios ACR/EULAR 2010</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Articulaciones (0-5) + serología FR/anti-CCP (0-3) + reactantes (0-1) + duración ≥ 6</tspan><tspan x="58.0" dy="17">semanas (0-1): ≥ 6 = artritis reumatoide.</tspan><tspan x="58.0" dy="17">Las erosiones típicas en la Rx bastan por sí solas para clasificarla.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 35 años, 4 meses</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dolor de pequeñas y medianas articulaciones con</tspan><tspan x="640.0" dy="16">rigidez matutina; tumefacción de manos y muñecas.</tspan><tspan x="640.0" dy="16">Anti-CCP (+), ANA (+); Rx: osteopenia periarticular y</tspan><tspan x="640.0" dy="16">erosiones.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ACR/EULAR 2010 PUNTO POR PUNTO</tspan></text><rect x="40.0" y="301.0" width="540.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="56.0" y="323.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="start" data-max="430"><tspan x="56.0" dy="0">ACR/EULAR 2010</tspan></text><text x="562.0" y="323.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">PUNTOS</tspan></text><rect x="40.0" y="335.0" width="540.0" height="34.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="342.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="357.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="356.5" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="420"><tspan x="86.0" dy="0">Articulaciones: &gt; 10 con al menos una pequeña</tspan></text><text x="562.0" y="357.0" font-size="13" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">5</tspan></text><rect x="40.0" y="369.0" width="540.0" height="34.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="376.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="391.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="390.5" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="420"><tspan x="86.0" dy="0">Anti-CCP positivo (alto)</tspan></text><text x="562.0" y="391.0" font-size="13" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">3</tspan></text><rect x="40.0" y="403.0" width="540.0" height="34.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="410.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="425.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="424.5" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="420"><tspan x="86.0" dy="0">Duración ≥ 6 semanas (4 meses)</tspan></text><text x="562.0" y="425.0" font-size="13" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">1</tspan></text><rect x="40.0" y="437.0" width="540.0" height="34.0" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="444.0" width="20.0" height="20.0" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="86.0" y="458.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="420"><tspan x="86.0" dy="0">PCR o VSG altas (no informadas)</tspan></text><text x="562.0" y="459.0" font-size="13" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">1</tspan></text><rect x="40.0" y="471.0" width="540.0" height="40.0" rx="0" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="56.0" y="496.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="430"><tspan x="56.0" dy="0">Puntaje de este caso</tspan></text><text x="562.0" y="497.0" font-size="16" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">9</tspan></text><rect x="40.0" y="301.0" width="540.0" height="210.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="664.0" cy="351.0" r="46" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/><text x="664.0" y="351.0" font-size="26" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="0"><tspan x="664.0" dy="0">9</tspan></text><text x="664.0" y="371.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="664.0" dy="0">de 10</tspan></text><text x="724.0" y="337.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="230"><tspan x="724.0" dy="0">INTERPRETACIÓN</tspan></text><text x="724.0" y="357.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="230"><tspan x="724.0" dy="0">≥ 6: artritis reumatoide</tspan></text><rect x="634.0" y="413.0" width="326.0" height="52.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="634.0" y="413.0" width="10.0" height="52.0" rx="4" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="656.0" y="435.0" font-size="12" font-weight="800" font-style="normal" fill="#10b981" text-anchor="start" data-max="100"><tspan x="656.0" dy="0">&lt; 6</tspan></text><text x="760.0" y="435.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">No clasifica</tspan></text><text x="760.0" y="453.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Seguir y reevaluar.</tspan></text><rect x="634.0" y="473.0" width="326.0" height="52.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><rect x="634.0" y="473.0" width="10.0" height="52.0" rx="4" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="656.0" y="495.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="100"><tspan x="656.0" dy="0">≥ 6</tspan></text><text x="760.0" y="495.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Artritis reumatoide</tspan></text><text x="760.0" y="513.0" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Metotrexato precoz.</tspan></text><polygon points="614.0,490.0 614.0,508.0 630.0,499.0" fill="#f59e0b"/><rect x="852.6" y="462.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="898.0" y="477.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="898.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="565.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SIGNOS CON NOMBRE PROPIO</tspan></text><rect x="40.0" y="577.0" width="920.0" height="213.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><line x1="62.0" y1="619.0" x2="938.0" y2="619.0" stroke="#0f766e" stroke-width="2"/><line x1="62.0" y1="619.0" x2="62.0" y2="627.0" stroke="#0f766e" stroke-width="2"/><line x1="938.0" y1="619.0" x2="938.0" y2="627.0" stroke="#0f766e" stroke-width="2"/><rect x="370.4" y="607.0" width="259.2" height="24.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/><text x="500.0" y="623.0" font-size="10.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="245"><tspan x="500.0" dy="0">PISTAS CLÁSICAS DE AR · 3 de 3 en el caso</tspan></text><rect x="56.0" y="639.0" width="288.0" height="104.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="76.0" cy="662.0" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="76.0" y="666.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="76.0" dy="0">1</tspan></text><text x="94.0" y="667.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="242"><tspan x="94.0" dy="0">Rigidez matutina &gt; 1 h</tspan></text><text x="68.0" y="693.0" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="264"><tspan x="68.0" dy="0">Sí</tspan></text><rect x="68.0" y="709.0" width="264.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="200.0" y="724.0" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="252"><tspan x="200.0" dy="0">✓ EN EL CASO</tspan></text><rect x="356.0" y="639.0" width="288.0" height="104.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="376.0" cy="662.0" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="376.0" y="666.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="376.0" dy="0">2</tspan></text><text x="394.0" y="667.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="242"><tspan x="394.0" dy="0">Poliartritis simétrica de manos</tspan></text><text x="368.0" y="693.0" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="264"><tspan x="368.0" dy="0">Manos y muñecas</tspan></text><rect x="368.0" y="709.0" width="264.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="500.0" y="724.0" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="252"><tspan x="500.0" dy="0">✓ EN EL CASO</tspan></text><rect x="656.0" y="639.0" width="288.0" height="104.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="676.0" cy="662.0" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="676.0" y="666.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="676.0" dy="0">3</tspan></text><text x="694.0" y="667.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="242"><tspan x="694.0" dy="0">Erosiones en la Rx</tspan></text><text x="668.0" y="693.0" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="264"><tspan x="668.0" dy="0">Sí</tspan></text><rect x="668.0" y="709.0" width="264.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="800.0" y="724.0" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="252"><tspan x="800.0" dy="0">✓ EN EL CASO</tspan></text><text x="56.0" y="770.0" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">Las erosiones típicas bastan para clasificarla.</tspan></text><text x="40.0" y="830.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="840.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="871.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="843.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="871.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Artritis reumatoide</tspan></text><text x="435.0" y="871.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Osteoartrosis</tspan></text><text x="585.0" y="862.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Lupus eritematoso</tspan><tspan x="585.0" dy="17">sistémico</tspan></text><text x="735.0" y="862.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Enfermedad mixta</tspan><tspan x="735.0" dy="17">del tejido conectivo</tspan></text><text x="885.0" y="871.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Fiebre reumática</tspan></text><rect x="40.0" y="894.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="894.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="923.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="915.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: ≥ 6 puntos +</tspan><tspan x="285.0" dy="16">erosiones</tspan></text><text x="435.0" y="915.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no hay erosiones</tspan><tspan x="435.0" dy="16">ni anti-CCP</tspan></text><text x="585.0" y="915.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sin otros dominios</tspan><tspan x="585.0" dy="16">de lupus</tspan></text><text x="735.0" y="923.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: requiere anti-RNP</tspan></text><text x="885.0" y="915.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: niños tras</tspan><tspan x="885.0" dy="16">estreptococo</tspan></text><rect x="40.0" y="840.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="968.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="996.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1018.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Metotrexato precoz (+ ácido fólico); corticoide a dosis baja por poco tiempo.</tspan><tspan x="58.0" dy="18">• Si no mejora en 3-6 meses: biológico (anti-TNF) o inhibidor de JAK.</tspan><tspan x="58.0" dy="18">• ANA positivo puede verse en AR; descartar lupus si hay otros datos.</tspan></text><text x="58.0" y="1076.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACR/EULAR (2010); EULAR, manejo de AR (2022).</tspan></text></svg>