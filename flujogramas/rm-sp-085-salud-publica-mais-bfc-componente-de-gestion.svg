<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1075" viewBox="0 0 1000 1075" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La gestión con enfoque territorial implica instrumentos integrados de control gerencial y vigilancia ciudadana"><title>La gestión con enfoque territorial implica instrumentos integrados de control gerencial y vigilancia ciudadana</title><rect x="0.75" y="0.75" width="998.5" height="1073.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Salud pública · MAIS-BFC, componente de gestión</tspan></text><rect x="498.0" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="562.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="562.3" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">MAIS-BFC</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Aprobado por RM 464-2011/MINSA.</tspan><tspan x="58.0" dy="17">Cuatro componentes: gestión, organización, prestación de servicios y financiamiento.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de contenido</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Desarrollo del proceso de gestión con enfoque</tspan><tspan x="640.0" dy="16">territorial.</tspan><tspan x="640.0" dy="16">¿Qué implica?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PROCESOS DENTRO DEL COMPONENTE DE GESTIÓN DEL MAIS-BFC</tspan></text><rect x="40.0" y="285.0" width="450.0" height="181.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><rect x="40.0" y="285.0" width="450.0" height="8.0" rx="4" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="60.0" y="319.0" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="410"><tspan x="60.0" dy="0">Gestión territorial</tspan></text><rect x="56.0" y="340.0" width="418.0" height="26.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="68.0" y="357.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Qué es</tspan></text><text x="462.0" y="357.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">✓ Articulación política, institucional y social</tspan></text><rect x="56.0" y="370.0" width="418.0" height="26.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="68.0" y="387.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Implica</tspan></text><text x="462.0" y="387.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">✓ Control gerencial y vigilancia ciudadana</tspan></text><rect x="56.0" y="400.0" width="418.0" height="26.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="68.0" y="417.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Meta</tspan></text><text x="462.0" y="417.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">✓ Abordar determinantes sociales</tspan></text><text x="60.0" y="446.0" font-size="11.5" font-weight="600" font-style="normal" fill="#0f766e" text-anchor="start" data-max="410"><tspan x="60.0" dy="0">Es la opción del enunciado.</tspan></text><rect x="372.6" y="278.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="418.0" y="293.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="418.0" dy="0">◆ ESTE CASO</tspan></text><rect x="510.0" y="285.0" width="450.0" height="181.0" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="510.0" y="285.0" width="450.0" height="8.0" rx="4" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="530.0" y="319.0" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="410"><tspan x="530.0" dy="0">Gestión de recursos humanos</tspan></text><rect x="526.0" y="340.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="357.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Dotación</tspan></text><text x="932.0" y="357.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">Con equidad y pertinencia</tspan></text><rect x="526.0" y="370.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="387.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Capacidades</tspan></text><text x="932.0" y="387.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">Desarrollo de competencias</tspan></text><rect x="526.0" y="400.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="417.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Retención y selección</tspan></text><text x="932.0" y="417.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">Políticas de personal</tspan></text><text x="530.0" y="446.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="530.0" dy="0">Otro proceso del mismo componente.</tspan></text><rect x="40.0" y="486.0" width="450.0" height="181.0" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="486.0" width="450.0" height="8.0" rx="4" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="60.0" y="520.0" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="410"><tspan x="60.0" dy="0">Gestión de medicamentos</tspan></text><rect x="56.0" y="541.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="68.0" y="558.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Qué es</tspan></text><text x="462.0" y="558.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">Acceso y uso racional</tspan></text><rect x="56.0" y="571.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="68.0" y="588.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Incluye</tspan></text><text x="462.0" y="588.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">Programación y abastecimiento</tspan></text><rect x="56.0" y="601.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="68.0" y="618.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Meta</tspan></text><text x="462.0" y="618.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">Disponibilidad</tspan></text><text x="60.0" y="647.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="60.0" dy="0">No corresponde a la pregunta.</tspan></text><rect x="510.0" y="486.0" width="450.0" height="181.0" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="510.0" y="486.0" width="450.0" height="8.0" rx="4" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="530.0" y="520.0" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="410"><tspan x="530.0" dy="0">Gestión de la información</tspan></text><rect x="526.0" y="541.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="558.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Qué es</tspan></text><text x="932.0" y="558.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">Sistemas de datos en salud</tspan></text><rect x="526.0" y="571.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="588.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Incluye</tspan></text><text x="932.0" y="588.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">Registro y análisis</tspan></text><rect x="526.0" y="601.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="618.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Meta</tspan></text><text x="932.0" y="618.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">Decidir con evidencia</tspan></text><text x="530.0" y="647.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="530.0" dy="0">No corresponde a la pregunta.</tspan></text><text x="40.0" y="689.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="400"><tspan x="40.0" dy="0">✓ = dato que coincide con el caso</tspan></text><text x="40.0" y="735.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="745.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="784.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="748.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="767.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Control gerencial y</tspan><tspan x="285.0" dy="17">vigilancia</tspan><tspan x="285.0" dy="17">ciudadana</tspan></text><text x="435.0" y="767.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Dotación de</tspan><tspan x="435.0" dy="17">equipos con</tspan><tspan x="435.0" dy="17">equidad</tspan></text><text x="585.0" y="767.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Desarrollo de</tspan><tspan x="585.0" dy="17">capacidades del</tspan><tspan x="585.0" dy="17">equipo</tspan></text><text x="735.0" y="776.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Retención de los</tspan><tspan x="735.0" dy="17">equipos de salud</tspan></text><text x="885.0" y="776.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Reclutamiento,</tspan><tspan x="885.0" dy="17">selección y contrato</tspan></text><rect x="40.0" y="816.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="816.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="837.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué implica la gestión</tspan><tspan x="54.0" dy="16">territorial?</tspan></text><text x="285.0" y="837.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: control gerencial y</tspan><tspan x="285.0" dy="16">vigilancia ciudadana</tspan></text><text x="435.0" y="837.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es de gestión de</tspan><tspan x="435.0" dy="16">recursos humanos</tspan></text><text x="585.0" y="837.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es de gestión de</tspan><tspan x="585.0" dy="16">recursos humanos</tspan></text><text x="735.0" y="837.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es de gestión de</tspan><tspan x="735.0" dy="16">recursos humanos</tspan></text><text x="885.0" y="837.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es de gestión de</tspan><tspan x="885.0" dy="16">recursos humanos</tspan></text><rect x="40.0" y="745.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="890.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="918.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="940.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La gestión territorial articula lo político, institucional, gubernamental y social en un territorio para abordar los determinantes sociales de la salud.</tspan><tspan x="58.0" dy="18">• Implica instrumentos integrados de control gerencial y vigilancia ciudadana. El componente de gestión incluye además recursos humanos, medicamentos</tspan><tspan x="58.0" dy="18">   e información.</tspan><tspan x="58.0" dy="18">• Dotación, desarrollo de capacidades, retención y reclutamiento son procesos de la gestión de recursos humanos, otra parte del mismo componente.</tspan><tspan x="58.0" dy="18">• Alerta: no confundir los cuatro componentes del modelo con los procesos dentro de la gestión.</tspan></text><text x="58.0" y="1034.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA, Modelo de Atención Integral de Salud basado en Familia y Comunidad (RM 464-2011/MINSA); OPS/OMS, Redes integradas de servicios de salud (2010).</tspan></text></svg>