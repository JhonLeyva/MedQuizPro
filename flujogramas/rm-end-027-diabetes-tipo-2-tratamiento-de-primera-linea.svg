<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1114" viewBox="0 0 1000 1114" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la diabetes tipo 2 sin contraindicaciones, el fármaco inicial es la metformina"><title>En la diabetes tipo 2 sin contraindicaciones, el fármaco inicial es la metformina</title><rect x="0.75" y="0.75" width="998.5" height="1112.9" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Diabetes tipo 2 · tratamiento de primera línea</tspan></text><rect x="465.2" y="32.0" width="140.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="535.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="124"><tspan x="535.5" dy="0">ENDOCRINOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Metformina</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Disminuye la gluconeogénesis hepática y mejora la sensibilidad a la insulina.</tspan><tspan x="58.0" dy="17">No produce hipoglucemia por sí sola y es de bajo costo.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué fármaco es de primera línea en la diabetes tipo 2</tspan><tspan x="640.0" dy="16">sin nefropatía, alcoholismo ni disfunción hepática?</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="255.0" x2="422.2" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="422.2" y1="255.0" x2="422.2" y2="284.0" stroke="#94a3b8" stroke-width="2"/><polygon points="417.2,283.0 427.2,283.0 422.2,291.0" fill="#94a3b8"/><line x1="422.2" y1="349.0" x2="422.2" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="379.0" x2="655.7" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="379.0" x2="188.7" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,407.0 193.7,407.0 188.7,415.0" fill="#94a3b8"/><line x1="655.7" y1="379.0" x2="655.7" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="650.7,407.0 660.7,407.0 655.7,415.0" fill="#94a3b8"/><line x1="655.7" y1="506.9" x2="655.7" y2="536.9" stroke="#94a3b8" stroke-width="2"/><line x1="655.7" y1="536.9" x2="655.7" y2="565.9" stroke="#94a3b8" stroke-width="2"/><polygon points="650.7,564.9 660.7,564.9 655.7,572.9" fill="#94a3b8"/><line x1="655.7" y1="630.9" x2="655.7" y2="660.9" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="660.9" x2="811.3" y2="660.9" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="660.9" x2="500.0" y2="689.9" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,688.9 505.0,688.9 500.0,696.9" fill="#94a3b8"/><line x1="811.3" y1="660.9" x2="811.3" y2="689.9" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,688.9 816.3,688.9 811.3,696.9" fill="#94a3b8"/><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="255.0" x2="422.2" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="422.2" y1="255.0" x2="422.2" y2="284.0" stroke="#0f766e" stroke-width="3"/><polygon points="417.2,283.0 427.2,283.0 422.2,291.0" fill="#0f766e"/><line x1="422.2" y1="349.0" x2="422.2" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="422.2" y1="379.0" x2="655.7" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="655.7" y1="379.0" x2="655.7" y2="408.0" stroke="#0f766e" stroke-width="3"/><polygon points="650.7,407.0 660.7,407.0 655.7,415.0" fill="#0f766e"/><line x1="655.7" y1="506.9" x2="655.7" y2="536.9" stroke="#0f766e" stroke-width="3"/><line x1="655.7" y1="536.9" x2="655.7" y2="565.9" stroke="#0f766e" stroke-width="3"/><polygon points="650.7,564.9 660.7,564.9 655.7,572.9" fill="#0f766e"/><line x1="655.7" y1="630.9" x2="655.7" y2="660.9" stroke="#0f766e" stroke-width="3"/><line x1="655.7" y1="660.9" x2="811.3" y2="660.9" stroke="#0f766e" stroke-width="3"/><line x1="811.3" y1="660.9" x2="811.3" y2="689.9" stroke="#0f766e" stroke-width="3"/><polygon points="806.3,688.9 816.3,688.9 811.3,696.9" fill="#0f766e"/><rect x="90.4" y="388.0" width="196.5" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="188.7" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">¿Contraindicación a la metformina?</tspan></text><rect x="560.7" y="388.0" width="190.0" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="655.7" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="655.7" dy="0">Sin contraindicaciones (este caso)</tspan></text><rect x="487.9" y="669.9" width="24.1" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="500.0" y="682.4" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">Sí</tspan></text><rect x="797.2" y="669.9" width="28.3" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="811.3" y="682.4" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">No</tspan></text><polygon points="162.2,320.0 188.2,291.0 656.2,291.0 682.2,320.0 656.2,349.0 188.2,349.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="208.2" cy="320.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="208.2" y="325.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="208.2" dy="0">?</tspan></text><text x="441.2" y="324.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="441.2" dy="0">Diabetes tipo 2 recién diagnosticada</tspan></text><rect x="40.0" y="415.0" width="297.3" height="91.9" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="188.7" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">SÍ: TFG &lt; 30, hepatopatía grave,</tspan><tspan x="188.7" dy="18.5">alcoholismo</tspan></text><text x="188.7" y="484.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Elegir otro fármaco</tspan></text><rect x="395.7" y="415.0" width="520.0" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="655.7" y="452.6" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="492"><tspan x="655.7" dy="0">METFORMINA</tspan></text><text x="655.7" y="475.5" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="492"><tspan x="655.7" dy="0">Inicio de la terapia</tspan></text><polygon points="395.7,601.9 421.7,572.9 889.7,572.9 915.7,601.9 889.7,630.9 421.7,630.9" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="441.7" cy="601.9" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="441.7" y="606.9" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="441.7" dy="0">?</tspan></text><text x="674.7" y="606.4" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="674.7" dy="0">¿Enfermedad cardiovascular, renal o IC?</tspan></text><rect x="351.3" y="696.9" width="297.3" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="725.3" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">AGREGAR iSGLT2 o GLP-1</tspan></text><text x="500.0" y="748.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Beneficio cardiorrenal</tspan></text><rect x="662.7" y="696.9" width="297.3" height="73.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="811.3" y="725.3" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">METFORMINA SOLA</tspan></text><text x="811.3" y="748.2" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Control con HbA1c cada 3 meses</tspan></text><text x="40.0" y="810.4" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="820.4" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="842.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="823.4" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="842.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Metformina</tspan></text><text x="435.0" y="842.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Acarbosa</tspan></text><text x="585.0" y="842.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Glibenclamida</tspan></text><text x="735.0" y="842.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Exenatida</tspan></text><text x="885.0" y="842.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Nateglinida</tspan></text><rect x="40.0" y="857.4" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="857.4" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="894.4" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Primera línea?</tspan></text><text x="285.0" y="878.4" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: eficaz, sin</tspan><tspan x="285.0" dy="16">hipoglucemia, de bajo</tspan><tspan x="285.0" dy="16">costo</tspan></text><text x="435.0" y="886.4" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: menos eficaz y</tspan><tspan x="435.0" dy="16">flatulenta</tspan></text><text x="585.0" y="878.4" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: causa</tspan><tspan x="585.0" dy="16">hipoglucemia y</tspan><tspan x="585.0" dy="16">aumento de peso</tspan></text><text x="735.0" y="878.4" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: agonista GLP-1</tspan><tspan x="735.0" dy="16">inyectable de segunda</tspan><tspan x="735.0" dy="16">línea</tspan></text><text x="885.0" y="878.4" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: causa</tspan><tspan x="885.0" dy="16">hipoglucemia y</tspan><tspan x="885.0" dy="16">aumento de peso</tspan></text><rect x="40.0" y="820.4" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="947.4" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="975.4" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="997.4" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Metformina baja la HbA1c cerca de 1-1,5 %, es neutra o favorable en peso y no causa hipoglucemia en monoterapia.</tspan><tspan x="58.0" dy="18">• Contraindicaciones: TFG &lt; 30 mL/min, hepatopatía grave, alcoholismo y riesgo de acidosis láctica; el enunciado las excluye.</tspan><tspan x="58.0" dy="18">• ADA 2025: con enfermedad cardiovascular, renal o insuficiencia cardiaca se agrega un iSGLT2 o un agonista GLP-1 sin esperar fracaso.</tspan><tspan x="58.0" dy="18">• Efectos adversos: digestivos y déficit de vitamina B12 a largo plazo; acarbosa, glibenclamida y nateglinida son de segunda línea.</tspan></text><text x="58.0" y="1073.4" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ADA, Standards of Care in Diabetes (2025), cap. 9; ADA/EASD, consenso de hiperglucemia en diabetes tipo 2 (2022).</tspan></text></svg>