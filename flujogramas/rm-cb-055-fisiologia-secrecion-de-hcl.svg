<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1003" viewBox="0 0 1000 1003" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La célula parietal transporta H+ con la bomba H+/K+ ATPasa y Cl- por canales: forma el ácido clorhídrico"><title>La célula parietal transporta H+ con la bomba H+/K+ ATPasa y Cl- por canales: forma el ácido clorhídrico</title><rect x="0.75" y="0.75" width="998.5" height="1001.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Fisiología · secreción de HCl</tspan></text><rect x="370.2" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="442.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="442.1" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Secreción de HCl</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El ácido se forma dentro de la célula parietal, no en la luz.</tspan><tspan x="58.0" dy="17">El H+ sale por la bomba y el Cl- por canales.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué células del estómago transportan H+ y Cl-?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL CO2 AL ÁCIDO CLORHÍDRICO EN LA CÉLULA PARIETAL</tspan></text><rect x="40.0" y="253.0" width="920.0" height="83.0" rx="0" fill="#e0f2fe" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="253.0" width="112.0" height="83.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="298.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Sangre</tspan></text><rect x="40.0" y="336.0" width="920.0" height="83.0" rx="0" fill="#fef3c7" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="336.0" width="112.0" height="83.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="381.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Célula parietal</tspan></text><rect x="40.0" y="419.0" width="920.0" height="83.0" rx="0" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="419.0" width="112.0" height="83.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="460.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Membrana</tspan><tspan x="96.0" dy="14">apical</tspan></text><rect x="40.0" y="502.0" width="920.0" height="83.0" rx="0" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="502.0" width="112.0" height="83.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="547.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Luz gástrica</tspan></text><line x1="322.0" y1="321.0" x2="322.0" y2="340.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="317.0,340.0 327.0,340.0 322.0,349.0" fill="#0f766e"/><line x1="322.0" y1="404.0" x2="322.0" y2="423.0" stroke="#ea580c" stroke-width="2.2"/><polygon points="317.0,423.0 327.0,423.0 322.0,432.0" fill="#ea580c"/><line x1="322.0" y1="487.0" x2="322.0" y2="506.0" stroke="#ea580c" stroke-width="2.2"/><polygon points="317.0,506.0 327.0,506.0 322.0,515.0" fill="#ea580c"/><rect x="172.0" y="268.0" width="300.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="284.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">CO2 entra a la célula</tspan></text><text x="182.0" y="301.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Difunde desde la sangre</tspan></text><circle cx="172.0" cy="268.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="272.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">1</tspan></text><rect x="172.0" y="351.0" width="300.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="367.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Anhidrasa carbónica: H+ y bicarbonato</tspan></text><text x="182.0" y="384.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">El bicarbonato sale a la sangre por Cl-/HCO3-</tspan></text><circle cx="172.0" cy="351.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="355.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">2</tspan></text><rect x="172.0" y="434.0" width="300.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="182.0" y="450.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">H+/K+ ATPasa y canal de Cl-</tspan></text><text x="182.0" y="467.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">El omeprazol bloquea la bomba</tspan></text><circle cx="172.0" cy="434.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="438.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">3</tspan></text><rect x="172.0" y="517.0" width="300.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="182.0" y="533.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">HCl en la luz</tspan></text><text x="182.0" y="550.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Pepsinógeno se activa a pepsina</tspan></text><circle cx="172.0" cy="517.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="521.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">4</tspan></text><rect x="40.0" y="603.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="629.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">H+ y Cl- los transporta la célula parietal</tspan></text><text x="60.0" y="648.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Mucosas, cimógenas, absortivas e intercaladas no forman ácido.</tspan></text><text x="40.0" y="715.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="725.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="747.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="747.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Mucosas</tspan></text><text x="435.0" y="747.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Absortivas</tspan></text><text x="585.0" y="747.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Cimógenas</tspan></text><rect x="663.0" y="728.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="747.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Parietales</tspan></text><text x="885.0" y="747.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Intercaladas</tspan></text><rect x="40.0" y="762.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="762.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="783.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Células que</tspan><tspan x="54.0" dy="16">transportan H+ y Cl-?</tspan></text><text x="285.0" y="783.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: secretan moco y</tspan><tspan x="285.0" dy="16">bicarbonato</tspan></text><text x="435.0" y="783.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: pertenecen al</tspan><tspan x="435.0" dy="16">intestino</tspan></text><text x="585.0" y="783.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: secretan</tspan><tspan x="585.0" dy="16">pepsinógeno</tspan></text><text x="735.0" y="783.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: forman el HCl con</tspan><tspan x="735.0" dy="16">la bomba y canales</tspan></text><text x="885.0" y="783.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: son del túbulo</tspan><tspan x="885.0" dy="16">colector renal</tspan></text><rect x="40.0" y="725.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="836.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="864.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="886.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El CO2 se hidrata por la anhidrasa carbónica y forma H+ y bicarbonato; el H+ sale a la luz por la H+/K+ ATPasa a cambio de K+.</tspan><tspan x="58.0" dy="18">• El Cl- sale por canales apicales y en la luz se combina con el H+: HCl. El bicarbonato sale a la sangre a cambio de Cl-.</tspan><tspan x="58.0" dy="18">• Eso causa la marea alcalina posprandial en la sangre venosa del estómago.</tspan><tspan x="58.0" dy="18">• El omeprazol inhibe la bomba de forma irreversible y es más eficaz 30 minutos antes de comer, cuando la bomba está activa.</tspan></text><text x="58.0" y="962.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Guyton y Hall Tratado de Fisiología Médica 14.ª ed. (2021); Ganong Fisiología Médica 26.ª ed. (2019)</tspan></text></svg>