<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1067" viewBox="0 0 1000 1067" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Oligoartritis de tobillos dos semanas después de una diarrea disentérica: artritis reactiva"><title>Oligoartritis de tobillos dos semanas después de una diarrea disentérica: artritis reactiva</title><rect x="0.75" y="0.75" width="998.5" height="1065.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · artritis reactiva</tspan></text><rect x="353.1" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="402.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="402.2" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Artritis reactiva</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Artritis estéril, asimétrica, de miembros inferiores, 1 a 4 semanas después de una infección.</tspan><tspan x="58.0" dy="17">Se asocia a HLA-B27.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Preescolar de 6 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dolor e hinchazón de ambos tobillos; lesiones orales.</tspan><tspan x="640.0" dy="16">Diarrea disentérica dos semanas antes.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PISTAS DEL CASO QUE APUNTAN A ARTRITIS REACTIVA</tspan></text><rect x="40.0" y="269.0" width="602.0" height="34.0" rx="10" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.2"/><text x="56.0" y="291.0" font-size="11.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="452"><tspan x="56.0" dy="0">PISTAS DEL CASO</tspan></text><text x="626.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="end" data-max="100"><tspan x="626.0" dy="0">EN EL CASO</tspan></text><rect x="40.0" y="309.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,324.5 74.0,344.5 50.0,344.5" fill="#dc2626"/><text x="62.0" y="341.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="332.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Diarrea disentérica 2 semanas antes</tspan></text><text x="84.0" y="349.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Infección previa: ventana de 1 a 4 semanas</tspan></text><text x="626.0" y="339.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="368.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,383.5 74.0,403.5 50.0,403.5" fill="#dc2626"/><text x="62.0" y="400.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="391.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Artritis de ambos tobillos</tspan></text><text x="84.0" y="408.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Oligoartritis de miembros inferiores</tspan></text><text x="626.0" y="398.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="427.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,442.5 74.0,462.5 50.0,462.5" fill="#dc2626"/><text x="62.0" y="459.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="450.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Lesiones orales</tspan></text><text x="84.0" y="467.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Úlceras orales, parte del cuadro</tspan></text><text x="626.0" y="457.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="486.0" width="602.0" height="53.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><polygon points="62.0,501.5 74.0,521.5 50.0,521.5" fill="#cbd5e1"/><text x="62.0" y="518.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="509.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Evolución de más de 6 semanas</tspan></text><text x="84.0" y="526.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Exigida por la artritis idiopática juvenil</tspan></text><text x="626.0" y="516.5" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">No</tspan></text><rect x="40.0" y="545.0" width="602.0" height="53.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><polygon points="62.0,560.5 74.0,580.5 50.0,580.5" fill="#cbd5e1"/><text x="62.0" y="577.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="568.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Exantema malar o pápulas de Gottron</tspan></text><text x="84.0" y="585.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Lupus y dermatomiositis</tspan></text><text x="626.0" y="575.5" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">No</tspan></text><rect x="660.0" y="269.0" width="300.0" height="329.0" rx="12" fill="#dc2626" stroke="none" stroke-width="1.5"/><text x="676.0" y="293.0" font-size="10.5" font-weight="800" font-style="normal" fill="#fecaca" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">TRATAMIENTO</tspan></text><text x="676.0" y="425.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">AINE, y sulfasalazina si persiste</tspan></text><text x="676.0" y="442.0" font-size="12" font-weight="500" font-style="normal" fill="#fee2e2" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">Antiinflamatorios, infiltración intraarticular con</tspan><tspan x="676.0" dy="16">corticoide si hace falta y sulfasalazina si</tspan><tspan x="676.0" dy="16">persiste; antibióticos solo si hay Chlamydia.</tspan></text><rect x="40.0" y="616.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="642.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Artritis tras infección enteral + lesiones orales = artritis reactiva</tspan></text><text x="60.0" y="661.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Es una forma de artritis postinfecciosa, pero la reactiva es el diagnóstico más preciso.</tspan></text><text x="40.0" y="728.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="738.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="769.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="760.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Artritis idiopática</tspan><tspan x="285.0" dy="17">juvenil</tspan></text><text x="435.0" y="760.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Artritis</tspan><tspan x="435.0" dy="17">postinfecciosa</tspan></text><text x="585.0" y="760.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Lupus eritematoso</tspan><tspan x="585.0" dy="17">sistémico</tspan></text><text x="735.0" y="760.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Dermatomiositis</tspan><tspan x="735.0" dy="17">juvenil</tspan></text><rect x="813.0" y="741.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="769.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Artritis reactiva</tspan></text><rect x="40.0" y="792.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="792.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="829.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="821.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: exige más de 6</tspan><tspan x="285.0" dy="16">semanas</tspan></text><text x="435.0" y="821.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: término general,</tspan><tspan x="435.0" dy="16">menos preciso</tspan></text><text x="585.0" y="813.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: faltan exantema</tspan><tspan x="585.0" dy="16">malar y</tspan><tspan x="585.0" dy="16">autoanticuerpos</tspan></text><text x="735.0" y="813.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: faltan debilidad</tspan><tspan x="735.0" dy="16">proximal y pápulas de</tspan><tspan x="735.0" dy="16">Gottron</tspan></text><text x="885.0" y="813.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: artritis estéril tras</tspan><tspan x="885.0" dy="16">diarrea con lesiones</tspan><tspan x="885.0" dy="16">orales</tspan></text><rect x="40.0" y="738.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="882.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="910.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="932.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Gatillos: Salmonella, Shigella, Yersinia, Campylobacter o Chlamydia. Tríada clásica: artritis, uretritis y conjuntivitis; también úlceras orales, entesitis y</tspan><tspan x="58.0" dy="18">   balanitis.</tspan><tspan x="58.0" dy="18">• La artritis idiopática juvenil exige más de 6 semanas y exclusión de otras causas; lupus y dermatomiositis tienen exantema malar o pápulas de Gottron.</tspan><tspan x="58.0" dy="18">• Tratamiento: AINE, infiltración con corticoide y sulfasalazina si persiste; antibióticos solo para Chlamydia.</tspan><tspan x="58.0" dy="18">• Alerta: la mayoría remite en 3 a 6 meses, pero algunos desarrollan espondiloartritis.</tspan></text><text x="58.0" y="1026.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Nelson Tratado de Pediatría, 22.ª ed. (2024), artritis reactiva y postinfecciosa; Harrison Principios de Medicina Interna, 21.ª ed. (2022).</tspan></text></svg>