 text-anchor="middle" data-max="186"><tspan x="845.0" dy="0">Gomas, aorta</tspan></text><text x="845.0" y="560.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="845.0" dy="0">Neurosífilis</tspan></text><text x="40.0" y="628.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TRATAMIENTO · MARCADO EL CORRECTO</tspan></text><rect x="40.0" y="640.2" width="157.9" height="30.0" rx="15" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="118.9" y="659.7" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="118.9" dy="0">✓ Penicilina benzatínica</tspan></text><rect x="205.9" y="640.2" width="92.9" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="252.3" y="659.7" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="252.3" dy="0">Ceftriaxona</tspan></text><rect x="306.8" y="640.2" width="97.0" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="355.3" y="659.7" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="355.3" dy="0">Azitromicina</tspan></text><rect x="411.8" y="640.2" width="108.0" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="465.8" y="659.7" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="465.8" dy="0">Ciprofloxacino</tspan></text><rect x="40.0" y="694.2" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="722.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="744.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Penicilina benzatínica 2,4 millones UI IM, dosis única.</tspan><tspan x="58.0" dy="18">• Latente tardía: una dosis semanal por 3 semanas.</tspan><tspan x="58.0" dy="18">• Controlar el RPR a los 6 y 12 meses.</tspan></text><text x="58.0" y="802.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA – NTS 204: ITS (2023) · CDC – STI Treatment Guidelines (2021)</tspan></text></svg>