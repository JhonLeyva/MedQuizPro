<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="990" viewBox="0 0 1000 990" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El tipo I de Todani (dilatación fusiforme del colédoco) es el quiste más frecuente"><title>El tipo I de Todani (dilatación fusiforme del colédoco) es el quiste más frecuente</title><rect x="0.75" y="0.75" width="998.5" height="988.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Quistes de colédoco · clasificación de Todani</tspan></text><rect x="467.7" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="510.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="510.9" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Quistes de la vía biliar</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Dilataciones congénitas de la vía biliar, más en mujeres y en Asia.</tspan><tspan x="58.0" dy="17">Asociadas a una unión pancreatobiliar anómala.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de clasificación</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Clasificación de Todani.</tspan><tspan x="640.0" dy="16">¿Cuál es el tipo más frecuente?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><rect x="40.0" y="245.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="271.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Tipo I = el más frecuente (80-90 %)</tspan></text><text x="60.0" y="290.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Se reseca el quiste completo y se hace hepaticoyeyunostomía en Y de Roux; no se drena al intestino.</tspan></text><text x="40.0" y="351.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN DE TODANI DE LOS QUISTES DE COLÉDOCO</tspan></text><rect x="40.0" y="363.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="114"><tspan x="50.0" dy="0">Tipo</tspan></text><text x="180.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="182"><tspan x="180.0" dy="0">Forma</tspan></text><text x="377.5" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="182"><tspan x="377.5" dy="0">Sitio</tspan></text><text x="575.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="182"><tspan x="575.0" dy="0">Frecuencia</tspan></text><text x="772.5" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="182"><tspan x="772.5" dy="0">Tratamiento</tspan></text><rect x="40.0" y="392.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="411.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="114"><tspan x="50.0" dy="0">I</tspan></text><text x="180.0" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="180.0" dy="0">Dilatación fusiforme o sacular</tspan></text><text x="377.5" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="377.5" dy="0">Colédoco extrahepático</tspan></text><text x="575.0" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="575.0" dy="0">80-90 %</tspan></text><text x="772.5" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="772.5" dy="0">Resección del quiste + Y de</tspan><tspan x="772.5" dy="15">Roux</tspan></text><rect x="70.6" y="403.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="116.0" y="418.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="116.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="436.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="455.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="114"><tspan x="50.0" dy="0">II</tspan></text><text x="180.0" y="455.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="180.0" dy="0">Divertículo</tspan></text><text x="377.5" y="455.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="377.5" dy="0">Pared del colédoco</tspan></text><text x="575.0" y="455.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="575.0" dy="0">Raro</tspan></text><text x="772.5" y="455.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="772.5" dy="0">Diverticulectomía</tspan></text><rect x="40.0" y="465.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="484.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="114"><tspan x="50.0" dy="0">III</tspan></text><text x="180.0" y="484.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="180.0" dy="0">Coledococele</tspan></text><text x="377.5" y="484.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="377.5" dy="0">Colédoco intraduodenal</tspan></text><text x="575.0" y="484.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="575.0" dy="0">1-4 %</tspan></text><text x="772.5" y="484.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="772.5" dy="0">Esfinterotomía endoscópica o</tspan><tspan x="772.5" dy="15">resección transduodenal</tspan></text><rect x="40.0" y="509.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="528.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="114"><tspan x="50.0" dy="0">IVa</tspan></text><text x="180.0" y="528.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="180.0" dy="0">Quistes múltiples</tspan></text><text x="377.5" y="528.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="377.5" dy="0">Intra y extrahepáticos</tspan></text><text x="575.0" y="528.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="575.0" dy="0">15-20 % (IV)</tspan></text><text x="772.5" y="528.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="772.5" dy="0">Resección extrahepática + Y de</tspan><tspan x="772.5" dy="15">Roux ± hepatectomía</tspan></text><rect x="40.0" y="553.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="572.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="114"><tspan x="50.0" dy="0">IVb</tspan></text><text x="180.0" y="572.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="180.0" dy="0">Quistes múltiples</tspan></text><text x="377.5" y="572.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="377.5" dy="0">Solo extrahepáticos</tspan></text><text x="575.0" y="572.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="575.0" dy="0">Menos frecuente</tspan></text><text x="772.5" y="572.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="772.5" dy="0">Resección + Y de Roux</tspan></text><rect x="40.0" y="582.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="601.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="114"><tspan x="50.0" dy="0">V</tspan></text><text x="180.0" y="601.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="180.0" dy="0">Quistes intrahepáticos (Caroli)</tspan></text><text x="377.5" y="601.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="377.5" dy="0">Intrahepático</tspan></text><text x="575.0" y="601.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="575.0" dy="0">Raro</tspan></text><text x="772.5" y="601.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="772.5" dy="0">Hepatectomía o trasplante según</tspan><tspan x="772.5" dy="15">extensión</tspan></text><text x="40.0" y="666.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="676.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="698.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="679.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="698.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">I</tspan></text><text x="435.0" y="698.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">II</tspan></text><text x="585.0" y="698.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">III</tspan></text><text x="735.0" y="698.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">IV</tspan></text><text x="885.0" y="698.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">V</tspan></text><rect x="40.0" y="713.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="713.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="742.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tipo más frecuente?</tspan></text><text x="285.0" y="734.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: 80-90 % de los</tspan><tspan x="285.0" dy="16">casos</tspan></text><text x="435.0" y="734.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: divertículo, raro (2</tspan><tspan x="435.0" dy="16">%)</tspan></text><text x="585.0" y="742.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: coledococele, raro</tspan></text><text x="735.0" y="742.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: múltiples, 10-20 %</tspan></text><text x="885.0" y="734.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: enfermedad de</tspan><tspan x="885.0" dy="16">Caroli, rara</tspan></text><rect x="40.0" y="676.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="787.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="815.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="837.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• I fusiforme o sacular del colédoco (80-90 %) · II divertículo · III coledococele · IV múltiples (IVa intra y extrahepáticos, IVb extrahepáticos) · V enfermedad</tspan><tspan x="58.0" dy="18">   de Caroli.</tspan><tspan x="58.0" dy="18">• Clínica: dolor, ictericia y masa palpable (tríada clásica, rara y sobre todo pediátrica); en el adulto, colangitis o pancreatitis. Diagnóstico: ecografía y</tspan><tspan x="58.0" dy="18">   colangiorresonancia.</tspan><tspan x="58.0" dy="18">• Neoplasia biliar en 10-30 % de los quistes, con riesgo que crece con la edad: resección completa del quiste con hepaticoyeyunostomía en Y de Roux; no</tspan><tspan x="58.0" dy="18">   el drenaje interno.</tspan></text><text x="58.0" y="949.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Todani et al., Am J Surg 1977;134:263-269; Soares et al., J Am Coll Surg 2014;219:1167-1180; Sabiston Tratado de Cirugía 21.ª ed.</tspan></text></svg>