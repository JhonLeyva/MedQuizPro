<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1197" viewBox="0 0 1000 1197" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Contusión toracoabdominal con choque, yugulares ingurgitadas, ruidos apagados, bajo voltaje y pericardiocentesis fallida: toracotomía"><title>Contusión toracoabdominal con choque, yugulares ingurgitadas, ruidos apagados, bajo voltaje y pericardiocentesis fallida: toracotomía</title><rect x="0.75" y="0.75" width="998.5" height="1196.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Trauma torácico · taponamiento cardiaco</tspan></text><rect x="442.7" y="32.0" width="101.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="493.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="85"><tspan x="493.3" dy="0">CIRUGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="183.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Taponamiento traumático refractario</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La sangre del pericardio coagula: la aguja no la saca.</tspan><tspan x="58.0" dy="17">Si la pericardiocentesis falla y el paciente se muere, se abre el tórax.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="183.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="181.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 32 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Contusión grave toracoabdominal; equimosis en tórax</tspan><tspan x="640.0" dy="16">bajo y epigastrio.</tspan><tspan x="640.0" dy="16">PA 60/30, pulso imperceptible, ruidos poco audibles,</tspan><tspan x="640.0" dy="16">yugulares ingurgitadas; QRS de bajo voltaje;</tspan><tspan x="640.0" dy="16">pericardiocentesis fallida.</tspan></text><line x1="640.0" y1="253.0" x2="670.0" y2="253.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="257.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="273.0" x2="320.0" y2="303.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="303.0" x2="500.0" y2="303.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="303.0" x2="500.0" y2="332.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,331.0 505.0,331.0 500.0,339.0" fill="#94a3b8"/><line x1="500.0" y1="397.0" x2="500.0" y2="427.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="427.0" x2="733.5" y2="427.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="427.0" x2="266.5" y2="456.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,455.0 271.5,455.0 266.5,463.0" fill="#94a3b8"/><line x1="733.5" y1="427.0" x2="733.5" y2="456.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,455.0 738.5,455.0 733.5,463.0" fill="#94a3b8"/><line x1="320.0" y1="273.0" x2="320.0" y2="303.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="303.0" x2="500.0" y2="303.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="303.0" x2="500.0" y2="332.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,331.0 505.0,331.0 500.0,339.0" fill="#0f766e"/><line x1="500.0" y1="397.0" x2="500.0" y2="427.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="427.0" x2="500.0" y2="427.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="427.0" x2="266.5" y2="456.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,455.0 271.5,455.0 266.5,463.0" fill="#0f766e"/><rect x="178.0" y="436.0" width="176.9" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="448.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">No y está en choque (este caso)</tspan></text><rect x="687.0" y="436.0" width="93.1" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="448.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Sí, se estabiliza</tspan></text><polygon points="240.0,368.0 266.0,339.0 734.0,339.0 760.0,368.0 734.0,397.0 266.0,397.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="368.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="373.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="372.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Taponamiento traumático: ¿funcionó la pericardiocentesis?</tspan></text><rect x="40.0" y="463.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="491.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">TORACOTOMÍA EXPLORATORIA</tspan></text><text x="266.5" y="514.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Abrir el pericardio</tspan><tspan x="266.5" dy="17">Reparar el corazón</tspan></text><rect x="507.0" y="463.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="499.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Cirugía urgente</tspan></text><text x="733.5" y="522.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Esternotomía o ventana</tspan></text><text x="40.0" y="593.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SIGNOS CON NOMBRE PROPIO</tspan></text><rect x="40.0" y="605.5" width="920.0" height="265.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><line x1="737.0" y1="687.5" x2="938.0" y2="687.5" stroke="#0f766e" stroke-width="2"/><line x1="737.0" y1="687.5" x2="737.0" y2="695.5" stroke="#0f766e" stroke-width="2"/><line x1="938.0" y1="687.5" x2="938.0" y2="695.5" stroke="#0f766e" stroke-width="2"/><rect x="764.7" y="675.5" width="145.6" height="24.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/><text x="837.5" y="691.5" font-size="10.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="132"><tspan x="837.5" dy="0">ECG · 1 de 1 en el caso</tspan></text><line x1="62.0" y1="647.5" x2="713.0" y2="647.5" stroke="#0f766e" stroke-width="2"/><line x1="62.0" y1="647.5" x2="62.0" y2="655.5" stroke="#0f766e" stroke-width="2"/><line x1="713.0" y1="647.5" x2="713.0" y2="655.5" stroke="#0f766e" stroke-width="2"/><rect x="279.0" y="635.5" width="217.0" height="24.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/><text x="387.5" y="651.5" font-size="10.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="203"><tspan x="387.5" dy="0">TRÍADA DE BECK · 3 de 3 en el caso</tspan></text><rect x="56.0" y="707.5" width="213.0" height="116.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="76.0" cy="730.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="76.0" y="734.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="76.0" dy="0">1</tspan></text><text x="94.0" y="735.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="167"><tspan x="94.0" dy="0">Hipotensión</tspan></text><text x="68.0" y="761.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="189"><tspan x="68.0" dy="0">60/30</tspan></text><rect x="68.0" y="789.5" width="189.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="162.5" y="804.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="177"><tspan x="162.5" dy="0">✓ EN EL CASO</tspan></text><rect x="281.0" y="707.5" width="213.0" height="116.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="301.0" cy="730.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="301.0" y="734.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="301.0" dy="0">2</tspan></text><text x="319.0" y="735.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="167"><tspan x="319.0" dy="0">Yugulares ingurgitadas</tspan></text><text x="293.0" y="761.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="189"><tspan x="293.0" dy="0">Marcada</tspan></text><rect x="293.0" y="789.5" width="189.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="387.5" y="804.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="177"><tspan x="387.5" dy="0">✓ EN EL CASO</tspan></text><rect x="506.0" y="707.5" width="213.0" height="116.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="526.0" cy="730.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="526.0" y="734.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="526.0" dy="0">3</tspan></text><text x="544.0" y="735.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="167"><tspan x="544.0" dy="0">Ruidos cardiacos</tspan><tspan x="544.0" dy="17">apagados</tspan></text><text x="518.0" y="773.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="189"><tspan x="518.0" dy="0">Poco audibles</tspan></text><rect x="518.0" y="789.5" width="189.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="612.5" y="804.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="177"><tspan x="612.5" dy="0">✓ EN EL CASO</tspan></text><rect x="731.0" y="707.5" width="213.0" height="116.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="751.0" cy="730.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="751.0" y="734.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="751.0" dy="0">4</tspan></text><text x="769.0" y="735.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="167"><tspan x="769.0" dy="0">QRS de bajo voltaje</tspan></text><text x="743.0" y="761.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="189"><tspan x="743.0" dy="0">Todas las derivaciones</tspan></text><rect x="743.0" y="789.5" width="189.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="837.5" y="804.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="177"><tspan x="837.5" dy="0">✓ EN EL CASO</tspan></text><text x="56.0" y="850.5" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">Beck completa y punción fallida: toracotomía ya.</tspan></text><text x="40.0" y="910.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="920.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="951.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="923.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="943.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Toracotomía</tspan><tspan x="285.0" dy="17">exploratoria</tspan></text><text x="435.0" y="943.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Toracoscopía</tspan><tspan x="435.0" dy="17">diagnóstica</tspan></text><text x="585.0" y="951.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Ventana pericárdica</tspan></text><text x="735.0" y="943.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Decorticación</tspan><tspan x="735.0" dy="17">pericárdica</tspan></text><text x="885.0" y="943.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Repetir la</tspan><tspan x="885.0" dy="17">pericardiocentesis</tspan></text><rect x="40.0" y="974.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="974.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1003.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Procedimiento?</tspan></text><text x="285.0" y="995.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: abre el pericardio y</tspan><tspan x="285.0" dy="16">repara</tspan></text><text x="435.0" y="1003.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: paciente inestable</tspan></text><text x="585.0" y="1003.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Solo en estables</tspan></text><text x="735.0" y="995.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es para pericarditis</tspan><tspan x="735.0" dy="16">constrictiva</tspan></text><text x="885.0" y="995.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: ya falló, sangre</tspan><tspan x="885.0" dy="16">coagulada</tspan></text><rect x="40.0" y="920.5" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1048.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1076.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1098.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Toracotomía de emergencia (anterolateral izquierda) para abrir el pericardio y controlar el sangrado.</tspan><tspan x="58.0" dy="18">• La ventana pericárdica es para pacientes estables.</tspan><tspan x="58.0" dy="18">• Repetir la punción pierde tiempo: la sangre está coagulada.</tspan></text><text x="58.0" y="1156.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ATLS 11.ª ed. (2025).</tspan></text></svg>