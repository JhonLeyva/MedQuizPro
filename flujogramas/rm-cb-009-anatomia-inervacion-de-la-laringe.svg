<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="946" viewBox="0 0 1000 946" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El nervio laríngeo recurrente inerva las cuerdas vocales; el superior solo el cricotiroideo"><title>El nervio laríngeo recurrente inerva las cuerdas vocales; el superior solo el cricotiroideo</title><rect x="0.75" y="0.75" width="998.5" height="944.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Anatomía · inervación de la laringe</tspan></text><rect x="405.8" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="477.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="477.7" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="131.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Nervios de la laringe</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ambos son ramas del vago (X).</tspan><tspan x="58.0" dy="17">El recurrente mueve casi todos los músculos; el superior tensa las cuerdas y da</tspan><tspan x="58.0" dy="17">sensibilidad.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="131.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="129.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué nervio inerva las cuerdas vocales?</tspan></text><rect x="640.0" y="192.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="205.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="205.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="253.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL VAGO A LA LARINGE</tspan></text><text x="40.0" y="277.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="430"><tspan x="40.0" dy="0">NERVIO</tspan></text><text x="516.0" y="277.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="444"><tspan x="516.0" dy="0">QUÉ HACE</tspan></text><rect x="40.0" y="287.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="316.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="321.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><text x="84.0" y="313.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Vago (X)</tspan></text><text x="84.0" y="330.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Origen de ambos nervios laríngeos</tspan></text><line x1="476.0" y1="316.5" x2="503.0" y2="316.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,311.5 502.0,321.5 510.0,316.5" fill="#ea580c"/><rect x="516.0" y="289.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="313.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Rama del neumogástrico</tspan></text><text x="530.0" y="330.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0"></tspan></text><line x1="255.0" y1="348.0" x2="255.0" y2="361.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,360.0 260.0,360.0 255.0,368.0" fill="#0f766e"/><rect x="40.0" y="370.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="399.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="404.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">2</tspan></text><text x="84.0" y="396.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Laríngeo superior</tspan></text><text x="84.0" y="413.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Tensa las cuerdas y da sensibilidad</tspan></text><line x1="476.0" y1="399.5" x2="503.0" y2="399.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,394.5 502.0,404.5 510.0,399.5" fill="#ea580c"/><rect x="516.0" y="372.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="396.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Rama externa: cricotiroideo</tspan></text><text x="530.0" y="413.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Voz aguda</tspan></text><line x1="255.0" y1="431.0" x2="255.0" y2="444.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,443.0 260.0,443.0 255.0,451.0" fill="#0f766e"/><rect x="40.0" y="453.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="482.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="487.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">3</tspan></text><text x="84.0" y="479.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Laríngeo recurrente</tspan></text><text x="84.0" y="496.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Mueve casi toda la laringe</tspan></text><line x1="476.0" y1="482.5" x2="503.0" y2="482.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,477.5 502.0,487.5 510.0,482.5" fill="#ea580c"/><rect x="516.0" y="455.0" width="444.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="530.0" y="479.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Todos los músculos intrínsecos, incluidas las cuerdas</tspan></text><text x="530.0" y="496.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Este caso</tspan></text><rect x="40.0" y="530.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="556.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Cuerdas vocales = laríngeo recurrente</tspan></text><text x="60.0" y="575.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Si se lesiona: disfonía; si es bilateral, estridor.</tspan></text><text x="40.0" y="642.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="652.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="674.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="674.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hipogloso</tspan></text><text x="435.0" y="674.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Simpático cervical</tspan></text><rect x="513.0" y="655.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="674.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Laríngeo recurrente</tspan></text><text x="735.0" y="674.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Laríngeo superior</tspan></text><text x="885.0" y="674.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Glosofaríngeo</tspan></text><rect x="40.0" y="689.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="689.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="726.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué nervio?</tspan></text><text x="285.0" y="726.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: mueve la lengua</tspan></text><text x="435.0" y="718.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es el simpático de</tspan><tspan x="435.0" dy="16">la glándula y vasos</tspan></text><text x="585.0" y="718.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: motor de casi toda</tspan><tspan x="585.0" dy="16">la laringe</tspan></text><text x="735.0" y="710.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: solo tensa las</tspan><tspan x="735.0" dy="16">cuerdas y da</tspan><tspan x="735.0" dy="16">sensibilidad</tspan></text><text x="885.0" y="718.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: da sensibilidad</tspan><tspan x="885.0" dy="16">faríngea</tspan></text><rect x="40.0" y="652.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="779.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="807.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="829.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Laríngeo superior: rama interna (sensitiva sobre las cuerdas) y rama externa (motor del cricotiroideo, que tensa las cuerdas).</tspan><tspan x="58.0" dy="18">• Recurrente: todos los músculos intrínsecos restantes, incluido el cricoaritenoideo posterior (único abductor). Izquierdo: rodea el arco aórtico; derecho: la</tspan><tspan x="58.0" dy="18">   subclavia.</tspan><tspan x="58.0" dy="18">• Lesión del recurrente (cirugía de tiroides, cáncer de pulmón, aneurisma): disfonía; bilateral: estridor.</tspan></text><text x="58.0" y="905.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Moore Anatomía con orientación clínica 8.ª ed.; Cummings Otolaryngology 7.ª ed.; AAO-HNS, disfonía (2018).</tspan></text></svg>