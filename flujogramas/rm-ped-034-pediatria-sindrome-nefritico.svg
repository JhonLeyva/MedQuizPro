<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1269" viewBox="0 0 1000 1269" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Edema, orina rojiza y faringitis dos semanas antes: glomerulonefritis postinfecciosa (postestreptocócica)"><title>Edema, orina rojiza y faringitis dos semanas antes: glomerulonefritis postinfecciosa (postestreptocócica)</title><rect x="0.75" y="0.75" width="998.5" height="1267.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · síndrome nefrítico</tspan></text><rect x="372.2" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="421.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="421.3" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Glomerulonefritis postestreptocócica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Síndrome nefrítico típico del niño de 5 a 12 años.</tspan><tspan x="58.0" dy="17">Aparece 1 a 3 semanas tras faringitis o 3 a 6 semanas tras piodermitis.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 7 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Edema de miembros inferiores y edema bipalpebral</tspan><tspan x="640.0" dy="16">con orina rojiza.</tspan><tspan x="640.0" dy="16">Faringitis aguda hace 2 semanas.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LOS DATOS QUE ARMAN EL SÍNDROME NEFRÍTICO POSTESTREPTOCÓCICO</tspan></text><line x1="410.3" y1="419.0" x2="340.0" y2="441.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="441.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="363.0" x2="660.0" y2="341.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="341.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="419.0" x2="660.0" y2="441.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="441.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="410.3" y1="363.0" x2="340.0" y2="341.0" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="341.0" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="391.0" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="391.0" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="396.0" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">Síndrome nefrítico</tspan></text><rect x="40.0" y="299.0" width="300.0" height="84.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="332.7" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Hematuria macroscópica</tspan></text><text x="190.0" y="356.4" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Orina color té o coca-cola; cilindros hemáticos</tspan></text><rect x="144.6" y="373.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="388.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="399.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="400.0" width="6.0" height="82.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="432.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Edema palpebral y de miembros</tspan></text><text x="190.0" y="456.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Matutino, facial; con oliguria</tspan></text><rect x="660.0" y="299.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="300.0" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="810.0" y="332.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Hipertensión arterial</tspan></text><text x="810.0" y="356.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Por retención de sal y agua</tspan></text><rect x="660.0" y="399.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="400.0" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="432.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Complemento y serología</tspan></text><text x="810.0" y="456.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">C3 bajo; ASO o anti-DNasa B elevados</tspan></text><text x="40.0" y="533.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="545.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="578.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Faringitis 1 a 3 semanas antes</tspan></text><line x1="248.5" y1="574.0" x2="267.5" y2="574.0" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,569.0 266.5,579.0 274.5,574.0" fill="#0f766e"/><rect x="278.5" y="545.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="569.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Inmunocomplejos y</tspan><tspan x="380.8" dy="17">complemento</tspan></text><line x1="487.0" y1="574.0" x2="506.0" y2="574.0" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,569.0 505.0,579.0 513.0,574.0" fill="#0f766e"/><rect x="517.0" y="545.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="578.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Síndrome nefrítico</tspan></text><line x1="725.5" y1="574.0" x2="744.5" y2="574.0" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,569.0 743.5,579.0 751.5,574.0" fill="#0f766e"/><rect x="755.5" y="545.0" width="204.5" height="58.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="569.5" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Soporte: sal, diuréticos,</tspan><tspan x="857.8" dy="17">antihipertensivos</tspan></text><text x="40.0" y="637.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DIAGNÓSTICO DIFERENCIAL DEL EDEMA CON ORINA ANORMAL EN EL NIÑO</tspan></text><rect x="40.0" y="649.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="668.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Entidad</tspan></text><text x="260.0" y="668.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Datos clave</tspan></text><text x="615.0" y="668.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Complemento</tspan></text><rect x="40.0" y="678.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="697.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Glomerulonefritis</tspan><tspan x="50.0" dy="15">postestreptocócica</tspan></text><text x="260.0" y="697.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Hematuria, edema e hipertensión 1 a 3 semanas tras</tspan><tspan x="260.0" dy="15">faringitis</tspan></text><text x="615.0" y="697.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">C3 bajo</tspan></text><rect x="150.6" y="689.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="196.0" y="704.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="196.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="722.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="741.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Nefropatía por IgA</tspan></text><text x="260.0" y="741.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Hematuria 1 a 2 días tras la infección</tspan></text><text x="615.0" y="741.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Normal</tspan></text><rect x="40.0" y="751.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="770.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Síndrome nefrótico</tspan></text><text x="260.0" y="770.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Proteinuria masiva y edema, sin hematuria</tspan></text><text x="615.0" y="770.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Normal</tspan></text><rect x="40.0" y="780.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="799.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Glomerulonefritis membranosa</tspan></text><text x="260.0" y="799.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Rara en niños</tspan></text><text x="615.0" y="799.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Normal</tspan></text><rect x="40.0" y="809.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="828.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Síndrome urémico hemolítico</tspan></text><text x="260.0" y="828.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Tras diarrea: anemia hemolítica, plaquetopenia y lesión renal</tspan></text><text x="615.0" y="828.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Variable</tspan></text><text x="40.0" y="878.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="888.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="919.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="891.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="910.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Glomerulonefritis</tspan><tspan x="285.0" dy="17">postinfecciosa</tspan></text><text x="435.0" y="919.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Nefropatía por IgA</tspan></text><text x="585.0" y="919.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Síndrome nefrótico</tspan></text><text x="735.0" y="910.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Glomerulonefritis</tspan><tspan x="735.0" dy="17">membranosa</tspan></text><text x="885.0" y="910.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Síndrome urémico</tspan><tspan x="885.0" dy="17">hemolítico</tspan></text><rect x="40.0" y="942.0" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="942.0" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="979.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico más</tspan><tspan x="54.0" dy="16">probable?</tspan></text><text x="285.0" y="979.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: nefrítico 2 semanas</tspan><tspan x="285.0" dy="16">tras faringitis</tspan></text><text x="435.0" y="963.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: la hematuria</tspan><tspan x="435.0" dy="16">aparece 1 a 2 días</tspan><tspan x="435.0" dy="16">después de la</tspan><tspan x="435.0" dy="16">infección</tspan></text><text x="585.0" y="979.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: proteinuria masiva</tspan><tspan x="585.0" dy="16">sin hematuria</tspan></text><text x="735.0" y="987.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: rara en niños</tspan></text><text x="885.0" y="971.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: sigue a una</tspan><tspan x="885.0" dy="16">diarrea, con anemia</tspan><tspan x="885.0" dy="16">hemolítica</tspan></text><rect x="40.0" y="888.0" width="920.0" height="136.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1048.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1076.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1098.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Tríada nefrítica: hematuria macroscópica (orina color té), edema palpebral o facial matutino e hipertensión, con oliguria; proteinuria leve y cilindros</tspan><tspan x="58.0" dy="18">   hemáticos.</tspan><tspan x="58.0" dy="18">• Inmunocomplejos con activación del complemento por vía alterna: C3 bajo que se normaliza en 6 a 8 semanas; ASO o anti-DNasa B elevados.</tspan><tspan x="58.0" dy="18">• Diferencias: nefropatía por IgA (hematuria 1 a 2 días tras la infección, complemento normal), nefrótico (proteinuria masiva sin hematuria) y SUH (tras</tspan><tspan x="58.0" dy="18">   diarrea, anemia hemolítica).</tspan><tspan x="58.0" dy="18">• Tratamiento de soporte: restricción de sal y líquidos, diuréticos de asa y antihipertensivos; penicilina si hay infección activa. Alerta: C3 bajo más de 12</tspan><tspan x="58.0" dy="18">   semanas obliga a biopsia.</tspan></text><text x="58.0" y="1228.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: KDIGO, Clinical Practice Guideline for the Management of Glomerular Diseases, Kidney Int 2021;100(4S):S1-S276; Nelson 22.ª ed. (2024).</tspan></text></svg>