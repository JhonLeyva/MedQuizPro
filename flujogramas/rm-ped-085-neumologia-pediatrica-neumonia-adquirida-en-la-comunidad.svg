<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1100" viewBox="0 0 1000 1100" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Fiebre, taquipnea y matidez con vibraciones vocales aumentadas: síndrome de condensación por neumonía"><title>Fiebre, taquipnea y matidez con vibraciones vocales aumentadas: síndrome de condensación por neumonía</title><rect x="0.75" y="0.75" width="998.5" height="1098.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neumología pediátrica · neumonía adquirida en la comunidad</tspan></text><rect x="562.3" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="611.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="611.3" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Neumonía adquirida en la comunidad</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Diagnóstico clínico: fiebre, tos y taquipnea.</tspan><tspan x="58.0" dy="17">La radiografía confirma en casos graves, dudosos o complicados.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 1 año</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Cinco días de rinorrea y tos, 2 de fiebre de 39 °C y</tspan><tspan x="640.0" dy="16">dificultad respiratoria.</tspan><tspan x="640.0" dy="16">FR 58, aleteo nasal, matidez en el tercio superior</tspan><tspan x="640.0" dy="16">derecho, subcrepitantes.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE DISTINGUEN LOS SÍNDROMES PLEUROPULMONARES</tspan></text><text x="202.0" y="313.0" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="758"><tspan x="202.0" dy="0">→ SIGNO</tspan></text><rect x="202.0" y="323.0" width="244.7" height="35.0" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="324.3" y="345.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="225"><tspan x="324.3" dy="0">Percusión</tspan></text><rect x="458.7" y="323.0" width="244.7" height="35.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="581.0" y="345.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="225"><tspan x="581.0" dy="0">Vibraciones vocales</tspan></text><rect x="715.3" y="323.0" width="244.7" height="35.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="837.7" y="345.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="225"><tspan x="837.7" dy="0">Murmullo vesicular</tspan></text><text x="40.0" y="344.5" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="146"><tspan x="40.0" dy="0">↓ SÍNDROME</tspan></text><rect x="40.0" y="370.0" width="150.0" height="76.0" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="115.0" y="404.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Condensación (este</tspan><tspan x="115.0" dy="17">caso)</tspan></text><rect x="202.0" y="370.0" width="244.7" height="76.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="324.3" y="399.6" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="217"><tspan x="324.3" dy="0">Matidez</tspan></text><text x="324.3" y="422.6" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="217"><tspan x="324.3" dy="0">Tercio superior derecho</tspan></text><rect x="278.9" y="435.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="324.3" y="450.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="324.3" dy="0">◆ ESTE CASO</tspan></text><rect x="458.7" y="370.0" width="244.7" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="459.7" y="371.0" width="6.0" height="74.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="581.0" y="399.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="217"><tspan x="581.0" dy="0">Aumentadas</tspan></text><text x="581.0" y="422.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="217"><tspan x="581.0" dy="0">Tejido consolidado</tspan></text><rect x="715.3" y="370.0" width="244.7" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="716.3" y="371.0" width="6.0" height="74.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="837.7" y="399.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="217"><tspan x="837.7" dy="0">Disminuido</tspan></text><text x="837.7" y="422.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="217"><tspan x="837.7" dy="0">Subcrepitantes</tspan></text><rect x="40.0" y="458.0" width="150.0" height="76.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="115.0" y="500.5" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Derrame pleural</tspan></text><rect x="202.0" y="458.0" width="244.7" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="459.0" width="6.0" height="74.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="324.3" y="487.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="217"><tspan x="324.3" dy="0">Matidez franca</tspan></text><text x="324.3" y="510.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="217"><tspan x="324.3" dy="0">En la base</tspan></text><rect x="458.7" y="458.0" width="244.7" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="459.7" y="459.0" width="6.0" height="74.0" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="581.0" y="487.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="217"><tspan x="581.0" dy="0">Disminuidas</tspan></text><text x="581.0" y="510.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="217"><tspan x="581.0" dy="0">O abolidas</tspan></text><rect x="715.3" y="458.0" width="244.7" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="716.3" y="459.0" width="6.0" height="74.0" rx="3" fill="#6366f1" stroke="none" stroke-width="1.5"/><text x="837.7" y="487.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="217"><tspan x="837.7" dy="0">Disminuido</tspan></text><text x="837.7" y="510.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="217"><tspan x="837.7" dy="0">O abolido</tspan></text><rect x="40.0" y="546.0" width="150.0" height="76.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="115.0" y="588.5" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Atelectasia</tspan></text><rect x="202.0" y="546.0" width="244.7" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="547.0" width="6.0" height="74.0" rx="3" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="324.3" y="575.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="217"><tspan x="324.3" dy="0">Matidez</tspan></text><text x="324.3" y="598.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="217"><tspan x="324.3" dy="0">Con pérdida de volumen</tspan></text><rect x="458.7" y="546.0" width="244.7" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="459.7" y="547.0" width="6.0" height="74.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="581.0" y="575.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="217"><tspan x="581.0" dy="0">Disminuidas</tspan></text><text x="581.0" y="598.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="217"><tspan x="581.0" dy="0">Sin subcrepitantes</tspan></text><rect x="715.3" y="546.0" width="244.7" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="716.3" y="547.0" width="6.0" height="74.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="837.7" y="575.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="217"><tspan x="837.7" dy="0">Disminuido</tspan></text><text x="837.7" y="598.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="217"><tspan x="837.7" dy="0">Desviación mediastínica</tspan></text><rect x="40.0" y="634.0" width="150.0" height="76.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="115.0" y="676.5" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Asma o bronquitis</tspan></text><rect x="202.0" y="634.0" width="244.7" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="635.0" width="6.0" height="74.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="324.3" y="663.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="217"><tspan x="324.3" dy="0">Sonoridad normal</tspan></text><text x="324.3" y="686.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="217"><tspan x="324.3" dy="0">O hipersonoridad</tspan></text><rect x="458.7" y="634.0" width="244.7" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="459.7" y="635.0" width="6.0" height="74.0" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="581.0" y="663.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="217"><tspan x="581.0" dy="0">Normales</tspan></text><text x="581.0" y="686.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="217"><tspan x="581.0" dy="0">Sin cambios</tspan></text><rect x="715.3" y="634.0" width="244.7" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="716.3" y="635.0" width="6.0" height="74.0" rx="3" fill="#6366f1" stroke="none" stroke-width="1.5"/><text x="837.7" y="663.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="217"><tspan x="837.7" dy="0">Con sibilancias</tspan></text><text x="837.7" y="686.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="217"><tspan x="837.7" dy="0">O roncus</tspan></text><text x="40.0" y="760.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="770.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="792.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="773.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="792.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Neumonía</tspan></text><text x="435.0" y="792.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Asma</tspan></text><text x="585.0" y="792.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Derrame pleural</tspan></text><text x="735.0" y="792.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Atelectasia</tspan></text><text x="885.0" y="792.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Bronquitis</tspan></text><rect x="40.0" y="807.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="807.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="844.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico probable?</tspan></text><text x="285.0" y="828.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: fiebre, matidez y</tspan><tspan x="285.0" dy="16">vibraciones</tspan><tspan x="285.0" dy="16">aumentadas</tspan></text><text x="435.0" y="836.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no da matidez ni</tspan><tspan x="435.0" dy="16">fiebre alta</tspan></text><text x="585.0" y="836.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: tendría vibraciones</tspan><tspan x="585.0" dy="16">disminuidas</tspan></text><text x="735.0" y="836.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: sin subcrepitantes</tspan><tspan x="735.0" dy="16">diseminados</tspan></text><text x="885.0" y="836.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no da síndrome de</tspan><tspan x="885.0" dy="16">condensación</tspan></text><rect x="40.0" y="770.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="897.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="925.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="947.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Taquipnea según la OMS: 40 o más por minuto entre los 12 meses y los 5 años. Aleteo nasal y tiraje indican gravedad.</tspan><tspan x="58.0" dy="18">• Condensación: matidez, vibraciones vocales aumentadas, murmullo vesicular disminuido y subcrepitantes. Derrame: matidez franca con vibraciones</tspan><tspan x="58.0" dy="18">   disminuidas.</tspan><tspan x="58.0" dy="18">• Atelectasia: matidez con pérdida de volumen y a veces desviación mediastínica. Asma y bronquitis no dan matidez ni vibraciones aumentadas.</tspan><tspan x="58.0" dy="18">• Tratamiento (IDSA/PIDS 2011): hospitalizar con oxígeno si hay tiraje o hipoxemia; amoxicilina a dosis altas en los casos bacterianos sin gravedad.</tspan><tspan x="58.0" dy="18">   Vacuna antineumocócica y contra Hib previenen.</tspan></text><text x="58.0" y="1059.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: IDSA/PIDS, Bradley JS et al., Clin Infect Dis 2011;53:e25-e76; Nelson Tratado de Pediatría 22.ª ed. (2024)</tspan></text></svg>