<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="799" viewBox="0 0 1000 799" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Entre los anestésicos de la lista, la procaína es el único éster"><title>Entre los anestésicos de la lista, la procaína es el único éster</title><rect x="0.75" y="0.75" width="998.5" height="798.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Anestesiología · anestésicos locales (variante)</tspan></text><rect x="474.8" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="518.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="518.0" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cómo reconocer un éster</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Los ésteres no tienen una «i» antes de «caína».</tspan><tspan x="58.0" dy="17">Se hidrolizan por colinesterasas del plasma.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál de estos anestésicos es del grupo éster?</tspan></text><line x1="640.0" y1="189.0" x2="670.0" y2="189.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="209.0" x2="320.0" y2="239.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="239.0" x2="500.0" y2="239.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="239.0" x2="500.0" y2="268.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,267.0 505.0,267.0 500.0,275.0" fill="#94a3b8"/><line x1="500.0" y1="333.0" x2="500.0" y2="363.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="363.0" x2="733.5" y2="363.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="363.0" x2="266.5" y2="392.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,391.0 271.5,391.0 266.5,399.0" fill="#94a3b8"/><line x1="733.5" y1="363.0" x2="733.5" y2="392.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,391.0 738.5,391.0 733.5,399.0" fill="#94a3b8"/><line x1="320.0" y1="209.0" x2="320.0" y2="239.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="239.0" x2="500.0" y2="239.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="239.0" x2="500.0" y2="268.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,267.0 505.0,267.0 500.0,275.0" fill="#0f766e"/><line x1="500.0" y1="333.0" x2="500.0" y2="363.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="363.0" x2="733.5" y2="363.0" stroke="#0f766e" stroke-width="3"/><line x1="733.5" y1="363.0" x2="733.5" y2="392.0" stroke="#0f766e" stroke-width="3"/><polygon points="728.5,391.0 738.5,391.0 733.5,399.0" fill="#0f766e"/><rect x="187.0" y="372.0" width="159.1" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="266.5" y="384.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Sí (lidocaína, bupivacaína…)</tspan></text><rect x="689.9" y="372.0" width="87.1" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="733.5" y="384.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">No (este caso)</tspan></text><polygon points="240.0,304.0 266.0,275.0 734.0,275.0 760.0,304.0 734.0,333.0 266.0,333.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="304.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="309.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="308.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">¿Lleva una «i» antes de «caína»?</tspan></text><rect x="40.0" y="399.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="266.5" y="427.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">AMIDA</tspan></text><text x="266.5" y="450.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Metabolismo hepático</tspan><tspan x="266.5" dy="17">Alergia rara</tspan></text><rect x="507.0" y="399.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="733.5" y="427.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">ÉSTER: PROCAÍNA</tspan></text><text x="733.5" y="450.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Hidrólisis plasmática</tspan><tspan x="733.5" dy="17">Produce PABA</tspan></text><text x="40.0" y="529.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="539.5" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="562.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="542.5" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="562.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Procaína</tspan></text><text x="435.0" y="562.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Lidocaína</tspan></text><text x="585.0" y="562.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Bupivacaína</tspan></text><text x="735.0" y="562.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Mepivacaína</tspan></text><text x="885.0" y="562.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Prilocaína</tspan></text><rect x="40.0" y="576.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="576.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="605.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Éster?</tspan></text><text x="285.0" y="597.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: único éster de la</tspan><tspan x="285.0" dy="16">lista</tspan></text><text x="435.0" y="605.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es amida</tspan></text><text x="585.0" y="605.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es amida</tspan></text><text x="735.0" y="605.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es amida</tspan></text><text x="885.0" y="605.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es amida</tspan></text><rect x="40.0" y="539.5" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="650.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="678.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="700.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Regla práctica: las amidas llevan «i» antes de «caína» (lidocaína, bupivacaína, mepivacaína, prilocaína).</tspan><tspan x="58.0" dy="18">• La cocaína, también éster, es el único anestésico local con vasoconstricción propia.</tspan><tspan x="58.0" dy="18">• En tejido infectado y ácido disminuye la eficacia: la forma no ionizada es la que atraviesa la membrana.</tspan></text><text x="58.0" y="758.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Miller Anestesia 9.ª ed.; Katzung Farmacología Básica y Clínica 15.ª ed.</tspan></text></svg>