<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1256" viewBox="0 0 1000 1256" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La colecistitis aguda nace casi siempre de un cálculo que obstruye el conducto cístico"><title>La colecistitis aguda nace casi siempre de un cálculo que obstruye el conducto cístico</title><rect x="0.75" y="0.75" width="998.5" height="1254.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Vía biliar · mecanismo de la colecistitis aguda</tspan></text><rect x="470.1" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="513.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="513.2" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Colecistitis aguda</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Inflamación de la pared vesicular: litiásica en más del 90 % de los casos.</tspan><tspan x="58.0" dy="17">La alitiásica (5-10 %) aparece en críticos, ayuno prolongado o nutrición parenteral.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es la causa más frecuente de colecistitis aguda?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL CÁLCULO A LA COLECISTITIS</tspan></text><text x="40.0" y="265.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="430"><tspan x="40.0" dy="0">MECANISMO</tspan></text><text x="516.0" y="265.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="444"><tspan x="516.0" dy="0">QUÉ SE OBSERVA</tspan></text><rect x="40.0" y="275.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="304.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="309.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><text x="84.0" y="301.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Un cálculo se impacta en el cístico o el bacinete</tspan></text><text x="84.0" y="318.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Más del 90 % de las colecistitis son litiásicas</tspan></text><line x1="476.0" y1="304.5" x2="503.0" y2="304.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,299.5 502.0,309.5 510.0,304.5" fill="#ea580c"/><rect x="516.0" y="277.0" width="444.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="530.0" y="301.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Obstrucción del cístico</tspan></text><text x="530.0" y="318.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Causa más frecuente</tspan></text><line x1="255.0" y1="336.0" x2="255.0" y2="349.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,348.0 260.0,348.0 255.0,356.0" fill="#0f766e"/><rect x="40.0" y="358.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="387.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">2</tspan></text><text x="84.0" y="384.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">La vesícula no se vacía y sube la presión</tspan></text><text x="84.0" y="401.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Distensión y edema de la pared</tspan></text><line x1="476.0" y1="387.5" x2="503.0" y2="387.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,382.5 502.0,392.5 510.0,387.5" fill="#ea580c"/><rect x="516.0" y="360.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="384.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Dolor &gt; 6 h en hipocondrio derecho</tspan></text><text x="530.0" y="401.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Signo de Murphy</tspan></text><line x1="255.0" y1="419.0" x2="255.0" y2="432.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,431.0 260.0,431.0 255.0,439.0" fill="#0f766e"/><rect x="40.0" y="441.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="470.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="475.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">3</tspan></text><text x="84.0" y="467.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Inflamación química y luego bacteriana</tspan></text><text x="84.0" y="484.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">E. coli, Klebsiella, enterococo y anaerobios</tspan></text><line x1="476.0" y1="470.5" x2="503.0" y2="470.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,465.5 502.0,475.5 510.0,470.5" fill="#ea580c"/><rect x="516.0" y="443.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="467.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Fiebre y leucocitosis</tspan></text><text x="530.0" y="484.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">PCR elevada</tspan></text><line x1="255.0" y1="502.0" x2="255.0" y2="515.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,514.0 260.0,514.0 255.0,522.0" fill="#0f766e"/><rect x="40.0" y="524.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="553.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="558.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">4</tspan></text><text x="84.0" y="550.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Sin tratamiento: isquemia, necrosis o perforación</tspan></text><text x="84.0" y="567.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Empiema, gangrena o enfisematosa</tspan></text><line x1="476.0" y1="553.5" x2="503.0" y2="553.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,548.5 502.0,558.5 510.0,553.5" fill="#ea580c"/><rect x="516.0" y="526.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="550.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Pared engrosada y líquido perivesicular</tspan></text><text x="530.0" y="567.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Hallazgos de la ecografía</tspan></text><rect x="40.0" y="601.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="627.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Cálculo en el cístico = colecistitis aguda litiásica</tspan></text><text x="60.0" y="646.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La infección y la isquemia son consecuencias; no el punto de partida.</tspan></text><text x="40.0" y="707.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">GRAVEDAD DE LA COLECISTITIS AGUDA (GUÍAS DE TOKIO 2018)</tspan></text><rect x="40.0" y="719.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="738.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="114"><tspan x="50.0" dy="0">Grado</tspan></text><text x="180.0" y="738.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="379"><tspan x="180.0" dy="0">Criterio</tspan></text><text x="575.0" y="738.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="379"><tspan x="575.0" dy="0">Conducta</tspan></text><rect x="40.0" y="748.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="767.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="114"><tspan x="50.0" dy="0">I</tspan></text><text x="180.0" y="767.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="379"><tspan x="180.0" dy="0">Leve: no cumple criterios de grado II ni III</tspan></text><text x="575.0" y="767.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="379"><tspan x="575.0" dy="0">Colecistectomía laparoscópica temprana</tspan></text><rect x="40.0" y="777.0" width="920.0" height="59.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="796.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="114"><tspan x="50.0" dy="0">II</tspan></text><text x="180.0" y="796.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="379"><tspan x="180.0" dy="0">Moderada, uno o más: leucocitos &gt; 18 000, masa dolorosa en</tspan><tspan x="180.0" dy="15">hipocondrio derecho, más de 72 h de evolución, inflamación local</tspan><tspan x="180.0" dy="15">marcada (gangrena, absceso, peritonitis biliar, enfisematosa)</tspan></text><text x="575.0" y="796.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="379"><tspan x="575.0" dy="0">Colecistectomía temprana si el equipo es experto; si no, antibiótico y</tspan><tspan x="575.0" dy="15">drenaje</tspan></text><rect x="40.0" y="836.0" width="920.0" height="59.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="855.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="114"><tspan x="50.0" dy="0">III</tspan></text><text x="180.0" y="855.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="379"><tspan x="180.0" dy="0">Grave, disfunción de un órgano: hipotensión que requiere</tspan><tspan x="180.0" dy="15">vasopresor, conciencia alterada, PaO2/FiO2 &lt; 300, oliguria o</tspan><tspan x="180.0" dy="15">creatinina &gt; 2 mg/dL, INR &gt; 1,5 o plaquetas &lt; 100 000</tspan></text><text x="575.0" y="855.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="379"><tspan x="575.0" dy="0">Soporte de órganos y drenaje vesicular urgente; colecistectomía</tspan><tspan x="575.0" dy="15">temprana solo en centro avanzado con falla reversible</tspan></text><text x="40.0" y="935.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="945.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="976.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="967.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Isquemia de la</tspan><tspan x="285.0" dy="17">pared vesicular</tspan></text><rect x="363.0" y="948.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="967.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Obstrucción del</tspan><tspan x="435.0" dy="17">cístico</tspan></text><text x="585.0" y="967.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Embolia de la</tspan><tspan x="585.0" dy="17">arteria cística</tspan></text><text x="735.0" y="976.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Infección bacteriana</tspan></text><text x="885.0" y="967.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Inflamación de la</tspan><tspan x="885.0" dy="17">mucosa</tspan></text><rect x="40.0" y="999.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="999.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1036.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Causa más frecuente?</tspan></text><text x="285.0" y="1028.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es una causa rara,</tspan><tspan x="285.0" dy="16">en alitiásica</tspan></text><text x="435.0" y="1020.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: el cálculo</tspan><tspan x="435.0" dy="16">impactado inicia el</tspan><tspan x="435.0" dy="16">cuadro</tspan></text><text x="585.0" y="1028.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es muy poco</tspan><tspan x="585.0" dy="16">frecuente</tspan></text><text x="735.0" y="1020.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: la infección es</tspan><tspan x="735.0" dy="16">secundaria a la</tspan><tspan x="735.0" dy="16">obstrucción</tspan></text><text x="885.0" y="1020.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es una</tspan><tspan x="885.0" dy="16">consecuencia, no el</tspan><tspan x="885.0" dy="16">inicio</tspan></text><rect x="40.0" y="945.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1089.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1117.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1139.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Tokio 2018: sospecha = 1 signo local (Murphy, dolor o masa en hipocondrio derecho) + 1 sistémico (fiebre, leucocitosis, PCR); definitivo = más imagen.</tspan><tspan x="58.0" dy="18">• Ecografía: signo de Murphy ecográfico, pared &gt; 4 mm, líquido pericolecístico, cálculo impactado y vesícula distendida.</tspan><tspan x="58.0" dy="18">• Tratamiento: antibióticos y colecistectomía laparoscópica temprana (en la primera semana si es posible); en grado III, drenaje y soporte.</tspan><tspan x="58.0" dy="18">• Banderas rojas: gas en la pared (enfisematosa), pared irregular (gangrena) o ictericia con colédoco dilatado (coledocolitiasis).</tspan></text><text x="58.0" y="1215.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Guías de Tokio 2018 (TG18); WSES, colecistitis aguda (2020); EsSalud-IETSI, GPC de colelitiasis, colecistitis aguda y coledocolitiasis (GPC N.º 11, 2018).</tspan></text></svg>