<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1002" viewBox="0 0 1000 1002" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En el personal de salud se consideran enfermedades profesionales la hepatitis, el VIH, la tuberculosis y la COVID-19 (riesgo biológico)"><title>En el personal de salud se consideran enfermedades profesionales la hepatitis, el VIH, la tuberculosis y la COVID-19 (riesgo biológico)</title><rect x="0.75" y="0.75" width="998.5" height="1000.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Salud ocupacional · personal de salud</tspan></text><rect x="426.3" y="32.0" width="143.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="498.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="127"><tspan x="498.0" dy="0">SALUD PÚBLICA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Enfermedad profesional</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Es la causada por el trabajo o su ambiente; en salud, el riesgo principal es biológico.</tspan><tspan x="58.0" dy="17">Hepatitis B y C y VIH por pinchazos y sangre; tuberculosis y COVID-19 por el aire.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuáles son enfermedades profesionales</tspan><tspan x="640.0" dy="16">del personal de salud?</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">RIESGOS DEL TRABAJO EN SALUD</tspan></text><line x1="406.0" y1="411.0" x2="340.0" y2="411.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="411.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="420.3" y1="460.8" x2="340.0" y2="511.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="511.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="383.0" x2="660.0" y2="361.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="361.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="439.0" x2="660.0" y2="461.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="461.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="420.3" y1="361.2" x2="340.0" y2="311.0" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="311.0" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="411.0" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="411.0" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="406.5" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">RIESGO</tspan><tspan x="500.0" dy="19">BIOLÓGICO</tspan></text><text x="500.0" y="444.5" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">este caso</tspan></text><rect x="40.0" y="269.0" width="300.0" height="84.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="302.7" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">BIOLÓGICO</tspan></text><text x="190.0" y="326.4" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Hepatitis B y C, VIH, TB, COVID-19</tspan></text><rect x="144.6" y="343.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="358.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="369.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="370.0" width="6.0" height="82.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="402.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">QUÍMICO</tspan></text><text x="190.0" y="426.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Citostáticos, desinfectantes</tspan></text><rect x="40.0" y="469.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="470.0" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="190.0" y="502.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">FÍSICO</tspan></text><text x="190.0" y="526.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Radiación, ruido</tspan></text><rect x="660.0" y="319.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="320.0" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="352.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">ERGONÓMICO</tspan></text><text x="810.0" y="376.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Cargar pacientes, posturas</tspan></text><rect x="660.0" y="419.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="420.0" width="6.0" height="82.0" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="452.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">PSICOSOCIAL</tspan></text><text x="810.0" y="476.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Turnos, estrés, violencia</tspan></text><text x="40.0" y="589.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="601.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="625.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Vacunar (hepatitis B)</tspan></text><line x1="248.5" y1="621.5" x2="267.5" y2="621.5" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,616.5 266.5,626.5 274.5,621.5" fill="#0f766e"/><rect x="278.5" y="601.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="625.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Bioseguridad</tspan></text><line x1="487.0" y1="621.5" x2="506.0" y2="621.5" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,616.5 505.0,626.5 513.0,621.5" fill="#0f766e"/><rect x="517.0" y="601.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="625.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Notificar accidentes</tspan></text><line x1="725.5" y1="621.5" x2="744.5" y2="621.5" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,616.5 743.5,626.5 751.5,621.5" fill="#0f766e"/><rect x="755.5" y="601.0" width="204.5" height="41.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="625.5" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Vigilancia médica</tspan></text><text x="40.0" y="682.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="692.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="731.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="714.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Tos ferina, VIH,</tspan><tspan x="285.0" dy="17">tuberculosis,</tspan><tspan x="285.0" dy="17">dengue</tspan></text><rect x="363.0" y="695.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="714.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hepatitis, VIH,</tspan><tspan x="435.0" dy="17">tuberculosis,</tspan><tspan x="435.0" dy="17">COVID-19</tspan></text><text x="585.0" y="714.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Hepatitis,</tspan><tspan x="585.0" dy="17">tuberculosis,</tspan><tspan x="585.0" dy="17">malaria, dengue</tspan></text><text x="735.0" y="714.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">VIH, tuberculosis,</tspan><tspan x="735.0" dy="17">fiebre amarilla,</tspan><tspan x="735.0" dy="17">COVID-19</tspan></text><text x="885.0" y="714.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Diabetes,</tspan><tspan x="885.0" dy="17">hipertensión, asma,</tspan><tspan x="885.0" dy="17">obesidad</tspan></text><rect x="40.0" y="763.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="763.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="800.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Cuáles?</tspan></text><text x="285.0" y="792.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: tos ferina y dengue</tspan><tspan x="285.0" dy="16">no son las típicas</tspan></text><text x="435.0" y="792.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: biológicas del</tspan><tspan x="435.0" dy="16">trabajo en salud</tspan></text><text x="585.0" y="784.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: malaria y dengue</tspan><tspan x="585.0" dy="16">son vectoriales, no del</tspan><tspan x="585.0" dy="16">trabajo</tspan></text><text x="735.0" y="784.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: la fiebre amarilla</tspan><tspan x="735.0" dy="16">no es del trabajo en</tspan><tspan x="735.0" dy="16">salud</tspan></text><text x="885.0" y="792.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no son causadas</tspan><tspan x="885.0" dy="16">por el trabajo</tspan></text><rect x="40.0" y="692.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="853.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="881.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="903.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Vacuna de hepatitis B a todo el personal y control de anticuerpos.</tspan><tspan x="58.0" dy="18">• Ante un pinchazo: lavar, notificar y evaluar profilaxis de VIH en &lt; 72 h.</tspan><tspan x="58.0" dy="18">• Respiradores N95 en TB y COVID-19; tamizaje anual de TB.</tspan></text><text x="58.0" y="961.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA Perú, Ley 29783 y listado de enfermedades profesionales; OMS/OIT, salud del trabajador de salud.</tspan></text></svg>