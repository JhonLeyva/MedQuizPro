<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1013" viewBox="0 0 1000 1013" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Entre los factores de riesgo de muerte por asma, el biológico es la resistencia a los corticoides (no mejora con ellos)"><title>Entre los factores de riesgo de muerte por asma, el biológico es la resistencia a los corticoides (no mejora con ellos)</title><rect x="0.75" y="0.75" width="998.5" height="1011.8" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Asma · riesgo de muerte</tspan></text><rect x="345.6" y="32.0" width="129.8" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="410.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="114"><tspan x="410.5" dy="0">NEUMOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="148.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Factores de riesgo de asma fatal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Biológicos: crisis graves previas (intubación, UCI), resistencia a corticoides, hipoxemia, uso</tspan><tspan x="58.0" dy="17">excesivo de salbutamol.</tspan><tspan x="58.0" dy="17">Ambientales (tabaco), asistenciales (mal control) y psicosociales (problemas mentales,</tspan><tspan x="58.0" dy="17">pobreza).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="148.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="146.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es un factor BIOLÓGICO</tspan><tspan x="640.0" dy="16">de mortalidad en el asma?</tspan></text><line x1="640.0" y1="218.0" x2="670.0" y2="218.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="222.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="270.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">FACTORES DE RIESGO DE MUERTE POR ASMA</tspan></text><line x1="406.0" y1="433.3" x2="340.0" y2="434.8" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="434.8" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="421.9" y1="483.5" x2="340.0" y2="538.3" stroke="#cbd5e1" stroke-width="2"/><cir