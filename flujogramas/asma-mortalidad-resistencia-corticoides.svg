="472.9" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">FÁRMACOS</tspan></text><text x="810.0" y="496.6" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Exceso de salbutamol solo</tspan></text><text x="40.0" y="616.3" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="628.3" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="652.8" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Identificar el riesgo</tspan></text><line x1="248.5" y1="648.8" x2="267.5" y2="648.8" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,643.8 266.5,653.8 274.5,648.8" fill="#0f766e"/><rect x="278.5" y="628.3" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="652.8" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Corticoide inhalado siempre</tspan></text><line x1="487.0" y1="648.8" x2="506.0" y2="648.8" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,643.8 505.0,653.8 513.0,648.8" fill="#0f766e"/><rect x="517.0" y="628.3" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="652.8" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Plan de acción escrito</tspan></text><line x1="725.5" y1="648.8" x2="744.5" y2="648.8" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,643.8 743.5,653.8 751.5,648.8" fill="#0f766e"/><rect x="755.5" y="628.3" width="204.5" height="41.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="652.8" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Control frecuente</tspan></text><text x="40.0" y="709.3" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="719.3" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="758.8" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="722.3" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="750.3" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Resistencia a</tspan><tspan x="285.0" dy="17">corticosteroides</tspan></text><text x="435.0" y="750.3" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Exposición al humo</tspan><tspan x="435.0" dy="17">del tabaco</tspan></text><text x="585.0" y="750.3" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Asistencia médica</tspan><tspan x="585.0" dy="17">inadecuada</tspan></text><text x="735.0" y="741.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Trastorno</tspan><tspan x="735.0" dy="17">psicológico en la</tspan><tspan x="735.0" dy="17">madre</tspan></text><text x="885.0" y="758.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Sexo femenino</tspan></text><rect x="40.0" y="790.3" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="790.3" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="819.3" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Factor biológico?</tspan></text><text x="285.0" y="811.3" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: biológico del</tspan><tspan x="285.0" dy="16">paciente</tspan></text><text x="435.0" y="819.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Ambiental</tspan></text><text x="585.0" y="819.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Asistencial</tspan></text><text x="735.0" y="819.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Psicosocial</tspan></text><text x="885.0" y="811.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No es un factor de</tspan><tspan x="885.0" dy="16">mortalidad establecido</tspan></text><rect x="40.0" y="719.3" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="864.3" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="892.3" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="914.3" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Identificar al paciente de riesgo y darle plan de acción escrito y control frecuente.</tspan><tspan x="58.0" dy="18">• Más de 1 inhalador de salbutamol al mes (&gt; 200 dosis): mal control y riesgo.</tspan><tspan x="58.0" dy="18">• GINA: no usar salbutamol solo; siempre con corticoide inhalado.</tspan></text><text x="58.0" y="972.3" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: GINA 2025; MINSA Perú.</tspan></text></svg>