<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" viewBox="0 0 1000 880" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Un orificio perianal con secreción fétida intermitente es una fístula anal criptoglandular"><title>Un orificio perianal con secreción fétida intermitente es una fístula anal criptoglandular</title><rect x="0.75" y="0.75" width="998.5" height="878.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Patología anal · fístula perianal</tspan></text><rect x="383.2" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="426.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="426.4" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Fístula perianal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Trayecto entre la cripta anal infectada y la piel perianal.</tspan><tspan x="58.0" dy="17">Más del 90 % nace de un absceso perianal previo, drenado o espontáneo.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Chofer de 45 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Secreción fétida periódica por un orificio a 1 cm del</tspan><tspan x="640.0" dy="16">ano.</tspan><tspan x="640.0" dy="16">¿Diagnóstico más probable?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE LLEGA A LA FÍSTULA</tspan></text><rect x="42.0" y="295.0" width="302.7" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="193.3" y="320.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">1 · CRIPTA INFECTADA</tspan></text><text x="193.3" y="339.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">Origen</tspan></text><rect x="348.7" y="295.0" width="302.7" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="500.0" y="320.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">2 · ABSCESO</tspan></text><text x="500.0" y="339.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">Fase aguda</tspan></text><rect x="655.3" y="295.0" width="302.7" height="56.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="806.7" y="320.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">3 · FÍSTULA</tspan></text><text x="806.7" y="339.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">Fase crónica</tspan></text><rect x="761.3" y="284.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="806.7" y="299.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="806.7" dy="0">◆ ESTE CASO</tspan></text><rect x="48.0" y="365.0" width="290.7" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="193.3" y="393.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">GLÁNDULA ANAL OBSTRUIDA</tspan></text><text x="193.3" y="417.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">Infección criptoglandular</tspan><tspan x="193.3" dy="17">Dolor leve, prurito</tspan></text><rect x="354.7" y="365.0" width="290.7" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="393.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">TUMOR PERIANAL DOLOROSO</tspan></text><text x="500.0" y="417.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">Se drena al exterior</tspan><tspan x="500.0" dy="17">30-50 % evoluciona a fístula</tspan></text><rect x="661.3" y="365.0" width="290.7" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="806.7" y="393.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">ORIFICIO CON SECRECIÓN FÉTIDA</tspan></text><text x="806.7" y="417.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">Supura de forma intermitente</tspan><tspan x="806.7" dy="17">Se cierra y reabsorbe: nuevo absceso</tspan></text><text x="40.0" y="494.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SE BUSCA AL EXAMINAR</tspan></text><rect x="40.0" y="506.2" width="120.9" height="30.0" rx="15" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="100.5" y="525.7" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="100.5" dy="0">✓ Orificio externo</tspan></text><rect x="168.9" y="506.2" width="120.3" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="229.1" y="525.7" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="229.1" dy="0">Cordón palpable</tspan></text><rect x="297.2" y="506.2" width="131.2" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="362.9" y="525.7" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="362.9" dy="0">Regla de Goodsall</tspan></text><rect x="436.5" y="506.2" width="92.9" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="482.9" y="525.7" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="482.9" dy="0">Tacto rectal</tspan></text><rect x="537.4" y="506.2" width="130.5" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="602.6" y="525.7" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="602.6" dy="0">RM si es compleja</tspan></text><text x="40.0" y="576.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="586.2" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="608.7" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="608.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Forúnculo</tspan></text><text x="435.0" y="608.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hemorroides</tspan></text><text x="585.0" y="608.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Fisura</tspan></text><text x="735.0" y="608.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Absceso</tspan></text><rect x="813.0" y="589.2" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="608.7" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Fístula</tspan></text><rect x="40.0" y="623.2" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="623.2" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="660.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="644.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es una colección</tspan><tspan x="285.0" dy="16">aguda y dolorosa, sin</tspan><tspan x="285.0" dy="16">secreción periódica</tspan></text><text x="435.0" y="652.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: sangra al defecar,</tspan><tspan x="435.0" dy="16">sin orificio con pus</tspan></text><text x="585.0" y="652.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: dolor al defecar</tspan><tspan x="585.0" dy="16">con sangre escasa</tspan></text><text x="735.0" y="652.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es aguda y</tspan><tspan x="735.0" dy="16">dolorosa</tspan></text><text x="885.0" y="652.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: orificio con</tspan><tspan x="885.0" dy="16">secreción intermitente</tspan></text><rect x="40.0" y="586.2" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="713.2" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="741.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="763.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Regla de Goodsall: orificio posterior a la línea transversa, trayecto curvo hacia la línea media posterior; anterior, trayecto radial recto.</tspan><tspan x="58.0" dy="18">• Parks: interesfintérica, transesfintérica, supraesfintérica y extraesfintérica; guía la cirugía.</tspan><tspan x="58.0" dy="18">• Fístula simple: fistulotomía. Compleja (alta o con esfínter): sedal, colgajo o ligadura del trayecto (LIFT); RM para el trayecto.</tspan><tspan x="58.0" dy="18">• Alerta: fístulas múltiples, recidivantes o con diarrea = enfermedad de Crohn.</tspan></text><text x="58.0" y="839.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ASCRS, abscesos y fístulas anorrectales (2022); Sabiston Tratado de Cirugía 21.ª ed.</tspan></text></svg>