<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1026" viewBox="0 0 1000 1026" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Maratonista en ejercicio aeróbico prolongado: en el hígado se activa la gluconeogénesis cuando se agota el glucógeno"><title>Maratonista en ejercicio aeróbico prolongado: en el hígado se activa la gluconeogénesis cuando se agota el glucógeno</title><rect x="0.75" y="0.75" width="998.5" height="1024.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Bioquímica · metabolismo en el ejercicio</tspan></text><rect x="439.9" y="32.0" width="158.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="519.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="143"><tspan x="519.3" dy="0">CIENCIAS BÁSICAS ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Glucosa en el ejercicio prolongado</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Al inicio el hígado libera glucosa desde su glucógeno (glucogenólisis).</tspan><tspan x="58.0" dy="17">Al agotarse, la fabrica desde lactato, alanina y glicerol (gluconeogénesis), impulsada por</tspan><tspan x="58.0" dy="17">glucagón alto e insulina baja.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Maratonista</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Ejercicio aeróbico prolongado.</tspan><tspan x="640.0" dy="16">¿Qué pasa en el hígado?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DE DÓNDE SALE LA GLUCOSA DEL HÍGADO</tspan></text><rect x="40.0" y="269.0" width="540.0" height="340.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="330.0" y="289.0" width="232.0" height="272.0" rx="0" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="446.0" y="305.0" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="226"><tspan x="446.0" dy="0">ejercicio prolongado</tspan></text><line x1="98.0" y1="561.0" x2="562.0" y2="561.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="565.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">0</tspan></text><line x1="98.0" y1="425.0" x2="562.0" y2="425.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="429.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">50</tspan></text><line x1="98.0" y1="289.0" x2="562.0" y2="289.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="293.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">100</tspan></text><line x1="98.0" y1="561.0" x2="98.0" y2="566.0" stroke="#94a3b8" stroke-width="1.5"/><text x="98.0" y="580.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="98.0" dy="0">0</tspan></text><line x1="252.7" y1="561.0" x2="252.7" y2="566.0" stroke="#94a3b8" stroke-width="1.5"/><text x="252.7" y="580.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="252.7" dy="0">60</tspan></text><line x1="407.3" y1="561.0" x2="407.3" y2="566.0" stroke="#94a3b8" stroke-width="1.5"/><text x="407.3" y="580.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="407.3" dy="0">120</tspan></text><line x1="562.0" y1="561.0" x2="562.0" y2="566.0" stroke="#94a3b8" stroke-width="1.5"/><text x="562.0" y="580.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="562.0" dy="0">180</tspan></text><line x1="98.0" y1="561.0" x2="562.0" y2="561.0" stroke="#94a3b8" stroke-width="1.5"/><line x1="98.0" y1="289.0" x2="98.0" y2="561.0" stroke="#94a3b8" stroke-width="1.5"/><text x="330.0" y="599.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="464"><tspan x="330.0" dy="0">Tiempo de ejercicio (min)</tspan></text><text x="56.0" y="425.0" transform="rotate(-90 56.0 425.0)" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Aporte (%)</text><polyline points="98.0,343.4 201.1,370.6 304.2,425.0 407.3,465.8 562.0,506.6" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="412.0" y1="323.0" x2="434.0" y2="323.0" stroke="#94a3b8" stroke-width="3"/><text x="440.0" y="327.0" font-size="10.5" font-weight="700" font-style="normal" fill="#94a3b8" text-anchor="start" data-max="120"><tspan x="440.0" dy="0">Glucogenólisis</tspan></text><polyline points="98.0,506.6 201.1,479.4 304.2,425.0 407.3,384.2 562.0,343.4" fill="none" stroke="#f97316" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="412.0" y1="341.0" x2="434.0" y2="341.0" stroke="#f97316" stroke-width="3"/><text x="440.0" y="345.0" font-size="10.5" font-weight="700" font-style="normal" fill="#f97316" text-anchor="start" data-max="120"><tspan x="440.0" dy="0">Gluconeogénesis</tspan></text><line x1="407.3" y1="384.2" x2="407.3" y2="561.0" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4"/><circle cx="407.3" cy="384.2" r="9" fill="#ea580c" stroke="#ffffff" stroke-width="3"/><rect x="371.7" y="359.2" width="71.2" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="407.3" y="374.2" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="407.3" dy="0">◆ maratón</tspan></text><rect x="602.0" y="348.5" width="358.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="617.0" y="372.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Glucagón ↑, insulina ↓</tspan></text><text x="617.0" y="389.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Encienden la gluconeogénesis.</tspan></text><rect x="602.0" y="411.5" width="358.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="617.0" y="435.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Lactato, alanina, glicerol</tspan></text><text x="617.0" y="452.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Materia prima.</tspan></text><rect x="602.0" y="474.5" width="358.0" height="55.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="617.0" y="498.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Glucogenogénesis y lipogénesis</tspan></text><text x="617.0" y="515.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Se apagan.</tspan></text><rect x="40.0" y="627.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="653.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Activación de la gluconeogénesis</tspan></text><text x="60.0" y="672.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Mantiene la glucosa cuando falta glucógeno.</tspan></text><text x="40.0" y="739.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="749.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="780.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="752.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="771.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Activación de la</tspan><tspan x="285.0" dy="17">gluconeogénesis</tspan></text><text x="435.0" y="771.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Reducción de la</tspan><tspan x="435.0" dy="17">glicólisis</tspan></text><text x="585.0" y="771.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Reducción de la</tspan><tspan x="585.0" dy="17">glucogenólisis</tspan></text><text x="735.0" y="771.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Activación de la</tspan><tspan x="735.0" dy="17">glucogenosíntesis</tspan></text><text x="885.0" y="771.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Activación de la</tspan><tspan x="885.0" dy="17">lipogénesis</tspan></text><rect x="40.0" y="803.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="803.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="832.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Efecto en el hígado?</tspan></text><text x="285.0" y="832.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: fabrica glucosa</tspan></text><text x="435.0" y="824.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: el músculo la</tspan><tspan x="435.0" dy="16">aumenta</tspan></text><text x="585.0" y="832.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: al inicio aumenta</tspan></text><text x="735.0" y="824.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: la insulina está</tspan><tspan x="735.0" dy="16">baja</tspan></text><text x="885.0" y="824.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: la insulina está</tspan><tspan x="885.0" dy="16">baja</tspan></text><rect x="40.0" y="749.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="877.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="905.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="927.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Ciclo de Cori: lactato del músculo → glucosa en el hígado.</tspan><tspan x="58.0" dy="18">• Ciclo glucosa-alanina: aminoácidos del músculo como fuente.</tspan><tspan x="58.0" dy="18">• Se apagan la síntesis de glucógeno y la lipogénesis (insulina baja).</tspan></text><text x="58.0" y="985.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Guyton y Hall, Tratado de fisiología médica 14.ª ed.; Lehninger, Principios de bioquímica 8.ª ed.</tspan></text></svg>