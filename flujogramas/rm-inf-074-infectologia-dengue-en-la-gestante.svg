<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1182" viewBox="0 0 1000 1182" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Gestante con fiebre, mialgias y dolor retroorbitario tras viaje a Tumbes: sospecha de dengue, se interna con vigilancia"><title>Gestante con fiebre, mialgias y dolor retroorbitario tras viaje a Tumbes: sospecha de dengue, se interna con vigilancia</title><rect x="0.75" y="0.75" width="998.5" height="1180.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Infectología · dengue en la gestante</tspan></text><rect x="411.2" y="32.0" width="121.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="472.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="106"><tspan x="472.1" dy="0">INFECTOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Dengue</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Virus transmitido por Aedes aegypti.</tspan><tspan x="58.0" dy="17">Fases febril, crítica (días 3 a 7, con posible fuga plasmática, hemoconcentración,</tspan><tspan x="58.0" dy="17">plaquetopenia y choque) y de recuperación.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante de 19 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Fiebre continua de 39 °C desde hoy, mialgia intensa y</tspan><tspan x="640.0" dy="16">dolor retroorbitario.</tspan><tspan x="640.0" dy="16">Hace 3 días estuvo en Tumbes; la fiebre cae con</tspan><tspan x="640.0" dy="16">antifebriles sin normalizarse.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EVOLUCIÓN DEL DENGUE Y QUÉ VIGILAR EN CADA FASE</tspan></text><line x1="290.0" y1="323.0" x2="290.0" y2="479.0" stroke="#e2e8f0" stroke-width="1"/><text x="290.0" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="290.0" dy="0">0</tspan></text><line x1="355.0" y1="323.0" x2="355.0" y2="479.0" stroke="#e2e8f0" stroke-width="1"/><text x="355.0" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="355.0" dy="0">1</tspan></text><line x1="420.0" y1="323.0" x2="420.0" y2="479.0" stroke="#e2e8f0" stroke-width="1"/><text x="420.0" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="420.0" dy="0">2</tspan></text><line x1="485.0" y1="323.0" x2="485.0" y2="479.0" stroke="#e2e8f0" stroke-width="1"/><text x="485.0" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="485.0" dy="0">3</tspan></text><line x1="550.0" y1="323.0" x2="550.0" y2="479.0" stroke="#e2e8f0" stroke-width="1"/><text x="550.0" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="550.0" dy="0">4</tspan></text><line x1="615.0" y1="323.0" x2="615.0" y2="479.0" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="615.0" dy="0">5</tspan></text><line x1="680.0" y1="323.0" x2="680.0" y2="479.0" stroke="#e2e8f0" stroke-width="1"/><text x="680.0" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="680.0" dy="0">6</tspan></text><line x1="745.0" y1="323.0" x2="745.0" y2="479.0" stroke="#e2e8f0" stroke-width="1"/><text x="745.0" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="745.0" dy="0">7</tspan></text><line x1="810.0" y1="323.0" x2="810.0" y2="479.0" stroke="#e2e8f0" stroke-width="1"/><text x="810.0" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="810.0" dy="0">8</tspan></text><line x1="875.0" y1="323.0" x2="875.0" y2="479.0" stroke="#e2e8f0" stroke-width="1"/><text x="875.0" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="875.0" dy="0">9</tspan></text><line x1="940.0" y1="323.0" x2="940.0" y2="479.0" stroke="#e2e8f0" stroke-width="1"/><text x="940.0" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="940.0" dy="0">10</tspan></text><text x="940.0" y="305.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="end" data-max="60"><tspan x="940.0" dy="0">días</tspan></text><rect x="40.0" y="327.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="343.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Fase febril</tspan></text><text x="48.0" y="358.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Fiebre, mialgias y dolor retroorbitario</tspan></text><rect x="355.0" y="335.0" width="390.0" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="381.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Fase crítica</tspan></text><text x="48.0" y="396.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Fuga plasmática y choque</tspan></text><rect x="485.0" y="373.0" width="260.0" height="22.0" rx="6" fill="#ea580c" stroke="none" stroke-width="1.5"/><rect x="40.0" y="403.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="419.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Vigilancia continua en internamiento</tspan></text><text x="48.0" y="434.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Hematocrito, plaquetas, feto</tspan></text><rect x="355.0" y="411.0" width="455.0" height="22.0" rx="6" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="48.0" y="457.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Fase de recuperación</tspan></text><text x="48.0" y="472.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Reabsorción del líquido</tspan></text><rect x="745.0" y="449.0" width="195.0" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><line x1="355.0" y1="325.0" x2="355.0" y2="485.0" stroke="#b91c1c" stroke-width="2.6"/><rect x="318.9" y="485.0" width="72.2" height="22.0" rx="11" fill="#b91c1c" stroke="none" stroke-width="1.5"/><text x="355.0" y="500.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="355.0" dy="0">Hoy: día 1</tspan></text><rect x="40.0" y="531.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="557.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Gestante con sospecha de dengue = internamiento con vigilancia</tspan></text><text x="60.0" y="576.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El alta con AINES o con medidas aisladas deja sin control la fase crítica.</tspan></text><text x="40.0" y="637.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">GRUPOS DE MANEJO DEL DENGUE (OMS 2009)</tspan></text><rect x="40.0" y="649.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="668.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">Grupo</tspan></text><text x="175.0" y="668.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Quién</tspan></text><text x="572.5" y="668.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Conducta</tspan></text><rect x="40.0" y="678.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="697.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">A</tspan></text><text x="175.0" y="697.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Sin signos de alarma ni comorbilidad ni riesgo social</tspan></text><text x="572.5" y="697.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Ambulatorio con hidratación y control</tspan></text><rect x="40.0" y="707.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="726.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">B</tspan></text><text x="175.0" y="726.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Comorbilidad (por ejemplo gestación) o riesgo social</tspan></text><text x="572.5" y="726.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Hospitalizar u observar estrechamente</tspan></text><rect x="65.6" y="710.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="111.0" y="725.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="111.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="736.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="755.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">C</tspan></text><text x="175.0" y="755.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Signos de alarma o dengue grave</tspan></text><text x="572.5" y="755.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Hospitalización y reposición intensiva de líquidos</tspan></text><text x="40.0" y="781.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">La NTS 211-MINSA/DGIESP-2024 mantiene la lógica de grupos A, B y C.</tspan></text><text x="40.0" y="828.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="838.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="869.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="869.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Alta con AINES</tspan></text><text x="435.0" y="860.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Alta con</tspan><tspan x="435.0" dy="17">paracetamol</tspan></text><text x="585.0" y="860.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">3 litros de agua y</tspan><tspan x="585.0" dy="17">control mañana</tspan></text><text x="735.0" y="860.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Alta con medios</tspan><tspan x="735.0" dy="17">físicos</tspan></text><rect x="813.0" y="841.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="860.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Internamiento con</tspan><tspan x="885.0" dy="17">vigilancia continua</tspan></text><rect x="40.0" y="892.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="892.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="929.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué indicación sigue?</tspan></text><text x="285.0" y="913.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: los AINES están</tspan><tspan x="285.0" dy="16">contraindicados en</tspan><tspan x="285.0" dy="16">dengue</tspan></text><text x="435.0" y="921.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es grupo B, no</tspan><tspan x="435.0" dy="16">ambulatorio</tspan></text><text x="585.0" y="913.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: la hidratación sola</tspan><tspan x="585.0" dy="16">y el control tardío son</tspan><tspan x="585.0" dy="16">insuficientes</tspan></text><text x="735.0" y="921.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: los medios físicos</tspan><tspan x="735.0" dy="16">solos son insuficientes</tspan></text><text x="885.0" y="913.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: gestante con riesgo</tspan><tspan x="885.0" dy="16">requiere vigilancia</tspan><tspan x="885.0" dy="16">continua</tspan></text><rect x="40.0" y="838.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="982.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1010.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1032.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Cuadro compatible con un caso probable de dengue en una persona que estuvo en zona endémica.</tspan><tspan x="58.0" dy="18">• La gestación es una condición de riesgo: pasa al grupo B de la OMS (comorbilidad o riesgo social), no al A ambulatorio. Requiere hospitalización u</tspan><tspan x="58.0" dy="18">   observación estrecha.</tspan><tspan x="58.0" dy="18">• Vigilar con hemograma seriado, hematocrito y plaquetas, los signos de alarma (dolor abdominal, vómitos persistentes, sangrado, letargia) y la salud fetal.</tspan><tspan x="58.0" dy="18">• Alerta: evitar AINES y aspirina; el dengue en el embarazo aumenta el riesgo de parto prematuro, hemorragia y transmisión vertical.</tspan></text><text x="58.0" y="1126.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, Dengue: guías para el diagnóstico, tratamiento, prevención y control (2009); MINSA, NTS N.º 211-MINSA/DGIESP-2024, Atención integral del paciente con</tspan><tspan x="58.0" dy="15">dengue; Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>