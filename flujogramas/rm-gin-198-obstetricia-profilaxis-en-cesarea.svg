<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1218" viewBox="0 0 1000 1218" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La medida más efectiva contra la infección uterina tras cesárea es la profilaxis antibiótica previa a la incisión"><title>La medida más efectiva contra la infección uterina tras cesárea es la profilaxis antibiótica previa a la incisión</title><rect x="0.75" y="0.75" width="998.5" height="1216.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · profilaxis en cesárea</tspan></text><rect x="399.0" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="478.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="478.7" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Endometritis posparto</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección uterina más frecuente tras la cesárea: fiebre, dolor uterino, loquios fétidos y</tspan><tspan x="58.0" dy="17">leucocitosis.</tspan><tspan x="58.0" dy="17">Es polimicrobiana, por flora vaginal ascendente.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de prevención</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué medida reduce más el riesgo de infección uterina</tspan><tspan x="640.0" dy="16">tras la cesárea?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ MEDIDAS REDUCEN LA INFECCIÓN UTERINA TRAS LA CESÁREA</tspan></text><rect x="40.0" y="269.0" width="920.0" height="160.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="269.0" width="108.0" height="160.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="349.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Medida más</tspan><tspan x="94.0" dy="14">efectiva</tspan></text><rect x="40.0" y="429.0" width="920.0" height="160.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="429.0" width="108.0" height="160.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="509.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Medidas que</tspan><tspan x="94.0" dy="14">ayudan</tspan></text><rect x="40.0" y="589.0" width="920.0" height="160.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="589.0" width="108.0" height="160.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="669.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">No previenen la</tspan><tspan x="94.0" dy="14">infección</tspan></text><line x1="280.0" y1="349.0" x2="287.0" y2="349.0" stroke="#0f766e" stroke-width="2.2"/><line x1="287.0" y1="349.0" x2="287.0" y2="333.0" stroke="#0f766e" stroke-width="2.2"/><line x1="287.0" y1="333.0" x2="285.0" y2="333.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="285.0,338.0 285.0,328.0 294.0,333.0" fill="#0f766e"/><line x1="416.0" y1="333.0" x2="423.0" y2="333.0" stroke="#0f766e" stroke-width="2.2"/><line x1="423.0" y1="333.0" x2="423.0" y2="493.0" stroke="#0f766e" stroke-width="2.2"/><line x1="423.0" y1="493.0" x2="421.0" y2="493.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="421.0,498.0 421.0,488.0 430.0,493.0" fill="#0f766e"/><line x1="552.0" y1="493.0" x2="559.0" y2="493.0" stroke="#0f766e" stroke-width="2.2"/><line x1="559.0" y1="493.0" x2="559.0" y2="501.5" stroke="#0f766e" stroke-width="2.2"/><line x1="559.0" y1="501.5" x2="557.0" y2="501.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="557.0,506.5 557.0,496.5 566.0,501.5" fill="#0f766e"/><line x1="688.0" y1="501.5" x2="695.0" y2="501.5" stroke="#0f766e" stroke-width="2.2"/><line x1="695.0" y1="501.5" x2="695.0" y2="653.0" stroke="#0f766e" stroke-width="2.2"/><line x1="695.0" y1="653.0" x2="693.0" y2="653.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="693.0,658.0 693.0,648.0 702.0,653.0" fill="#0f766e"/><line x1="824.0" y1="653.0" x2="831.0" y2="653.0" stroke="#0f766e" stroke-width="2.2"/><line x1="831.0" y1="653.0" x2="831.0" y2="644.5" stroke="#0f766e" stroke-width="2.2"/><line x1="831.0" y1="644.5" x2="829.0" y2="644.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="829.0,649.5 829.0,639.5 838.0,644.5" fill="#0f766e"/><rect x="158.0" y="282.0" width="122.0" height="134.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="168.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="102"><tspan x="168.0" dy="0">Profilaxis</tspan><tspan x="168.0" dy="16">antibiótica</tspan></text><text x="168.0" y="331.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="168.0" dy="0">Cefazolina IV 2 g (3</tspan><tspan x="168.0" dy="14.5">g si pesa 120 kg o</tspan><tspan x="168.0" dy="14.5">más) en los 60</tspan><tspan x="168.0" dy="14.5">minutos previos a la</tspan><tspan x="168.0" dy="14.5">incisión</tspan></text><circle cx="158.0" cy="282.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="294.0" y="282.0" width="122.0" height="102.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="304.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="304.0" dy="0">Azitromicina</tspan><tspan x="304.0" dy="16">añadida</tspan></text><text x="304.0" y="331.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="304.0" dy="0">Si hay trabajo de</tspan><tspan x="304.0" dy="14.5">parto o membranas</tspan><tspan x="304.0" dy="14.5">rotas</tspan></text><circle cx="294.0" cy="282.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="294.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="294.0" dy="0">2</tspan></text><rect x="430.0" y="442.0" width="122.0" height="102.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="440.0" y="458.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="440.0" dy="0">Piel con</tspan><tspan x="440.0" dy="16">clorhexidina</tspan></text><text x="440.0" y="491.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="440.0" dy="0">Preparación</tspan><tspan x="440.0" dy="14.5">cutánea con alcohol</tspan><tspan x="440.0" dy="14.5">antes de incidir</tspan></text><circle cx="430.0" cy="442.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="430.0" y="446.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="430.0" dy="0">3</tspan></text><rect x="566.0" y="442.0" width="122.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="576.0" y="458.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="576.0" dy="0">Destreza del</tspan><tspan x="576.0" dy="16">cirujano y tiempo</tspan><tspan x="576.0" dy="16">operatorio corto</tspan></text><text x="576.0" y="507.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="576.0" dy="0">Útiles, con menos</tspan><tspan x="576.0" dy="14.5">respaldo que los</tspan><tspan x="576.0" dy="14.5">antibióticos</tspan></text><circle cx="566.0" cy="442.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="566.0" y="446.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="566.0" dy="0">4</tspan></text><rect x="702.0" y="602.0" width="122.0" height="102.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="712.0" y="618.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="712.0" dy="0">Rasurado</tspan><tspan x="712.0" dy="16">perineal</tspan></text><text x="712.0" y="651.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="712.0" dy="0">No previene y</tspan><tspan x="712.0" dy="14.5">puede aumentar la</tspan><tspan x="712.0" dy="14.5">infección</tspan></text><circle cx="702.0" cy="602.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="702.0" y="606.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="702.0" dy="0">5</tspan></text><rect x="838.0" y="602.0" width="122.0" height="85.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="848.0" y="618.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="848.0" dy="0">Oxitócicos</tspan></text><text x="848.0" y="635.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="848.0" dy="0">Controlan la</tspan><tspan x="848.0" dy="14.5">hemorragia, no la</tspan><tspan x="848.0" dy="14.5">infección</tspan></text><circle cx="838.0" cy="602.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="838.0" y="606.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="838.0" dy="0">6</tspan></text><rect x="40.0" y="767.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="793.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Cesárea = antibiótico antes de la incisión</tspan></text><text x="60.0" y="812.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Rasurado y oxitócicos no previenen la infección uterina.</tspan></text><text x="40.0" y="879.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="889.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="920.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="892.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="911.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Profilaxis</tspan><tspan x="285.0" dy="17">antibiótica</tspan></text><text x="435.0" y="911.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Habilidad y destreza</tspan><tspan x="435.0" dy="17">del cirujano</tspan></text><text x="585.0" y="920.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Rasurado perineal</tspan></text><text x="735.0" y="911.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Oxitócicos en el</tspan><tspan x="735.0" dy="17">perioperatorio</tspan></text><text x="885.0" y="911.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Reducción del</tspan><tspan x="885.0" dy="17">tiempo operatorio</tspan></text><rect x="40.0" y="943.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="943.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="980.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Medida más efectiva?</tspan></text><text x="285.0" y="972.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: mayor respaldo en</tspan><tspan x="285.0" dy="16">la evidencia</tspan></text><text x="435.0" y="972.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: útil, pero con</tspan><tspan x="435.0" dy="16">menos respaldo</tspan></text><text x="585.0" y="964.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no previene y</tspan><tspan x="585.0" dy="16">puede aumentar la</tspan><tspan x="585.0" dy="16">infección</tspan></text><text x="735.0" y="964.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: controlan la</tspan><tspan x="735.0" dy="16">hemorragia, no la</tspan><tspan x="735.0" dy="16">infección</tspan></text><text x="885.0" y="972.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: útil, pero con</tspan><tspan x="885.0" dy="16">menos respaldo</tspan></text><rect x="40.0" y="889.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1033.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1061.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1083.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Una revisión Cochrane mostró que la profilaxis reduce endometritis, infección de herida y urinaria, tanto en cesárea electiva como de urgencia.</tspan><tspan x="58.0" dy="18">• Pauta: cefazolina IV 2 g (3 g si pesa 120 kg o más) en los 60 minutos previos a la incisión; se añade azitromicina si hay trabajo de parto o membranas</tspan><tspan x="58.0" dy="18">   rotas.</tspan><tspan x="58.0" dy="18">• La destreza del cirujano y la brevedad operatoria ayudan, pero con menos respaldo. El rasurado perineal no previene y puede aumentar la infección.</tspan><tspan x="58.0" dy="18">• Los oxitócicos controlan la hemorragia, no la infección. Clave: clorhexidina-alcohol en la piel y antibiótico antes de la incisión, no tras pinzar el cordón.</tspan></text><text x="58.0" y="1177.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, Practice Bulletin 199 (2018); Williams Obstetricia, 26.ª ed. (2022).</tspan></text></svg>