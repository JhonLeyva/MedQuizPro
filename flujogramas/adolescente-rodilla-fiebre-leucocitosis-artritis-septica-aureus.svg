<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="901" viewBox="0 0 1000 901" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Adolescente con fiebre, monoartritis aguda de rodilla y leucocitosis con desviación izquierda: artritis séptica, el germen más probable es Staphylococcus aureus"><title>Adolescente con fiebre, monoartritis aguda de rodilla y leucocitosis con desviación izquierda: artritis séptica, el germen más probable es Staphylococcus aureus</title><rect x="0.75" y="0.75" width="998.5" height="899.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Artritis séptica</tspan></text><rect x="288.2" y="32.0" width="150.2" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="363.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="134"><tspan x="363.3" dy="0">TRAUMATOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Artritis séptica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección de la articulación: dolor intenso, no apoya, rodilla caliente y roja, fiebre. Urgencia:</tspan><tspan x="58.0" dy="17">el cartílago se destruye en días.</tspan><tspan x="58.0" dy="17">S. aureus es el germen más frecuente a cualquier edad; en adolescentes sexualmente</tspan><tspan x="58.0" dy="17">activos pensar también en gonococo.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 13 años, 3 días</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dolor en la rodilla derecha que impide caminar; fiebre</tspan><tspan x="640.0" dy="16">38,5 °C.</tspan><tspan x="640.0" dy="16">Rodilla aumentada de volumen con signos</tspan><tspan x="640.0" dy="16">inflamatorios; leucocitos 25 000, 10 % abastonados.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">GERMEN DE LA ARTRITIS SÉPTICA SEGÚN LA EDAD</tspan></text><rect x="40.0" y="301.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="323.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="160"><tspan x="54.0" dy="0">EDAD</tspan></text><text x="405.0" y="323.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="350"><tspan x="405.0" dy="0">Germen más frecuente</tspan></text><text x="775.0" y="323.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="350"><tspan x="775.0" dy="0">Además pensar en</tspan></text><rect x="40.0" y="341.0" width="174.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="367.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="152"><tspan x="54.0" dy="0">Neonato</tspan></text><text x="54.0" y="384.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="152"><tspan x="54.0" dy="0">&lt; 3 meses</tspan></text><rect x="223.0" y="341.0" width="364.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="235.0" y="366.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="346"><tspan x="235.0" dy="0">S. aureus, estreptococo B</tspan></text><text x="235.0" y="382.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="346"><tspan x="235.0" dy="0">Y gramnegativos</tspan></text><rect x="593.0" y="341.0" width="364.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="605.0" y="366.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="346"><tspan x="605.0" dy="0">Candida</tspan></text><text x="605.0" y="382.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="346"><tspan x="605.0" dy="0">En UCI neonatal</tspan></text><rect x="40.0" y="404.0" width="174.0" height="57.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="430.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="152"><tspan x="54.0" dy="0">Niño y adolescente</tspan></text><text x="54.0" y="447.0" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="152"><tspan x="54.0" dy="0">Este caso</tspan></text><rect x="223.0" y="404.0" width="364.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="235.0" y="429.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="346"><tspan x="235.0" dy="0">STAPHYLOCOCCUS AUREUS</tspan></text><text x="235.0" y="445.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="346"><tspan x="235.0" dy="0">Cefazolina u oxacilina</tspan></text><rect x="486.2" y="393.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="531.6" y="408.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="531.6" dy="0">◆ ESTE CASO</tspan></text><rect x="593.0" y="404.0" width="364.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="605.0" y="436.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="346"><tspan x="605.0" dy="0">Kingella (&lt; 4 años), S. pyogenes</tspan></text><rect x="40.0" y="467.0" width="174.0" height="60.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="493.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="152"><tspan x="54.0" dy="0">Joven sexualmente</tspan><tspan x="54.0" dy="17">activo</tspan></text><rect x="223.0" y="467.0" width="364.0" height="60.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="235.0" y="493.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="346"><tspan x="235.0" dy="0">S. aureus</tspan></text><text x="235.0" y="509.5" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="346"><tspan x="235.0" dy="0">Sigue siendo el primero</tspan></text><rect x="593.0" y="467.0" width="364.0" height="60.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="605.0" y="493.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="346"><tspan x="605.0" dy="0">Gonococo</tspan></text><text x="605.0" y="509.5" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="346"><tspan x="605.0" dy="0">Ceftriaxona</tspan></text><text x="44.0" y="549.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Haemophilus casi desapareció con la vacuna.</tspan></text><text x="40.0" y="597.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="607.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="646.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="610.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="638.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Staphylococcus</tspan><tspan x="285.0" dy="17">aureus</tspan></text><text x="435.0" y="646.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Escherichia coli</tspan></text><text x="585.0" y="629.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Corynebacterium</tspan><tspan x="585.0" dy="17">(Arcanobacterium)</tspan><tspan x="585.0" dy="17">pyogenes</tspan></text><text x="735.0" y="638.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Haemophilus</tspan><tspan x="735.0" dy="17">influenzae</tspan></text><text x="885.0" y="638.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Streptococcus</tspan><tspan x="885.0" dy="17">pneumoniae</tspan></text><rect x="40.0" y="678.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="678.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="707.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Germen?</tspan></text><text x="285.0" y="707.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: el más frecuente</tspan></text><text x="435.0" y="699.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: neonatos y adultos</tspan><tspan x="435.0" dy="16">mayores</tspan></text><text x="585.0" y="699.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no causa artritis</tspan><tspan x="585.0" dy="16">séptica habitual</tspan></text><text x="735.0" y="699.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: raro desde la</tspan><tspan x="735.0" dy="16">vacuna Hib</tspan></text><text x="885.0" y="699.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: poco frecuente en</tspan><tspan x="885.0" dy="16">articulaciones</tspan></text><rect x="40.0" y="607.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="752.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="780.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="802.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Artrocentesis antes del antibiótico: &gt; 50 000 leucocitos con &gt; 90 % neutrófilos, Gram y cultivo; hemocultivos.</tspan><tspan x="58.0" dy="18">• Antibiótico EV empírico: cefazolina u oxacilina (± vancomicina si hay SARM en la comunidad).</tspan><tspan x="58.0" dy="18">• Lavado articular (artroscopía o artrotomía).</tspan></text><text x="58.0" y="860.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: IDSA/PIDS, artritis séptica pediátrica (2023); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>