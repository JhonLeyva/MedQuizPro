<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1270" viewBox="0 0 1000 1270" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Para predecir una nueva preeclampsia se usa el Doppler de las arterias uterinas, que mide la resistencia placentaria"><title>Para predecir una nueva preeclampsia se usa el Doppler de las arterias uterinas, que mide la resistencia placentaria</title><rect x="0.75" y="0.75" width="998.5" height="1268.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · predicción de preeclampsia</tspan></text><rect x="439.3" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="519.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="519.0" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Fisiopatología de la preeclampsia</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Invasión trofoblástica incompleta de las arterias espirales y resistencia alta uteroplacentaria.</tspan><tspan x="58.0" dy="17">Aumento de sFlt-1, descenso de PlGF y disfunción endotelial.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Segundigesta de 26 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Preeclampsia en el primer embarazo.</tspan><tspan x="640.0" dy="16">Normotensa y con examen clínico normal.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE ELIGE EL EXAMEN QUE PREDICE LA PREECLAMPSIA</tspan></text><text x="614.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,293.0 580.0,293.0 531.7,401.0 88.3,401.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="309.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="348.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="399"><tspan x="310.0" dy="0">Preeclampsia previa y gestación de 26 semanas: ¿qué examen</tspan><tspan x="310.0" dy="17">la predice?</tspan></text><line x1="559.8" y1="347.0" x2="606.0" y2="347.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="302.0" width="167.2" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="697.6" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="697.6" dy="0">Doppler de arterias uterinas</tspan></text><rect x="787.2" y="302.0" width="144.3" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="859.4" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="859.4" dy="0">Proteinuria de 24 horas</tspan></text><rect x="614.0" y="334.0" width="110.3" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="669.2" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="669.2" dy="0">Creatinina sérica</tspan></text><rect x="730.3" y="334.0" width="120.8" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="790.7" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="790.7" dy="0">Perfil biofísico fetal</tspan></text><rect x="614.0" y="366.0" width="131.3" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="679.6" y="383.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="679.6" dy="0">Perfil de coagulación</tspan></text><polygon points="88.3,405.0 531.7,405.0 483.3,465.0 136.7,465.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="162.7" cy="435.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="162.7" y="439.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="162.7" dy="0">1</tspan></text><text x="320.0" y="431.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="283"><tspan x="320.0" dy="0">¿Evalúa el bienestar fetal y no el riesgo</tspan><tspan x="320.0" dy="17">materno?</tspan></text><line x1="511.5" y1="435.0" x2="606.0" y2="435.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="422.0" width="132.9" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="680.4" y="439.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="680.4" dy="0">✕ Perfil biofísico fetal</tspan></text><line x1="636.0" y1="435.5" x2="736.9" y2="435.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="136.7,469.0 483.3,469.0 435.0,546.0 185.0,546.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="507.5" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="511.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">2</tspan></text><text x="320.0" y="495.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">¿Sirve para diagnosticar o</tspan><tspan x="320.0" dy="17">graduar la enfermedad ya</tspan><tspan x="320.0" dy="17">instalada?</tspan></text><line x1="463.2" y1="507.5" x2="606.0" y2="507.5" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="478.5" width="156.4" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="692.2" y="496.0" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="692.2" dy="0">✕ Proteinuria de 24 horas</tspan></text><line x1="636.0" y1="492.0" x2="760.4" y2="492.0" stroke="#94a3b8" stroke-width="1.2"/><rect x="776.4" y="478.5" width="122.4" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="837.6" y="496.0" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="837.6" dy="0">✕ Creatinina sérica</tspan></text><line x1="798.4" y1="492.0" x2="888.9" y2="492.0" stroke="#94a3b8" stroke-width="1.2"/><rect x="614.0" y="510.5" width="143.4" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="685.7" y="528.0" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="685.7" dy="0">✕ Perfil de coagulación</tspan></text><line x1="636.0" y1="524.0" x2="747.4" y2="524.0" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="550.0" x2="310.0" y2="569.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,568.0 315.0,568.0 310.0,576.0" fill="#0f766e"/><rect x="140.0" y="580.0" width="340.0" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="609.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">DOPPLER DE ARTERIAS UTERINAS</tspan></text><text x="310.0" y="633.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Mide la resistencia uteroplacentaria</tspan><tspan x="310.0" dy="17">Índice de pulsatilidad o muesca protodiastólica</tspan></text><rect x="370.6" y="569.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="584.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="587.9" width="346.0" height="76.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="607.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="625.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">Con preeclampsia previa se indica además ácido</tspan><tspan x="628.0" dy="16">acetilsalicílico en dosis baja antes de las 16 semanas.</tspan></text><text x="40.0" y="705.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PRUEBAS DE LA PREGUNTA: PREDICCIÓN O DIAGNÓSTICO</tspan></text><rect x="40.0" y="717.9" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="736.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="294"><tspan x="50.0" dy="0">Prueba</tspan></text><text x="360.0" y="736.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="594"><tspan x="360.0" dy="0">Para qué sirve</tspan></text><rect x="40.0" y="746.9" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="765.9" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="294"><tspan x="50.0" dy="0">Doppler de arterias uterinas</tspan></text><text x="360.0" y="765.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="594"><tspan x="360.0" dy="0">Predice preeclampsia y restricción del crecimiento (11-13+6 semanas y segundo trimestre)</tspan></text><rect x="250.6" y="750.4" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="296.0" y="765.4" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="296.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="775.9" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="794.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="294"><tspan x="50.0" dy="0">Proteinuria de 24 horas</tspan></text><text x="360.0" y="794.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="594"><tspan x="360.0" dy="0">Diagnóstico y gravedad</tspan></text><rect x="40.0" y="804.9" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="823.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="294"><tspan x="50.0" dy="0">Creatinina sérica</tspan></text><text x="360.0" y="823.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="594"><tspan x="360.0" dy="0">Gravedad: afectación renal</tspan></text><rect x="40.0" y="833.9" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="852.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="294"><tspan x="50.0" dy="0">Perfil de coagulación</tspan></text><text x="360.0" y="852.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="594"><tspan x="360.0" dy="0">Gravedad: coagulopatía</tspan></text><rect x="40.0" y="862.9" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="881.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="294"><tspan x="50.0" dy="0">Perfil biofísico fetal</tspan></text><text x="360.0" y="881.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="594"><tspan x="360.0" dy="0">Bienestar fetal</tspan></text><text x="40.0" y="931.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="941.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="972.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="944.9" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="964.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Doppler de arterias</tspan><tspan x="285.0" dy="17">uterinas</tspan></text><text x="435.0" y="964.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Proteinuria de 24</tspan><tspan x="435.0" dy="17">horas</tspan></text><text x="585.0" y="972.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Creatinina sérica</tspan></text><text x="735.0" y="972.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Perfil biofísico fetal</tspan></text><text x="885.0" y="964.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Perfil de</tspan><tspan x="885.0" dy="17">coagulación</tspan></text><rect x="40.0" y="995.9" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="995.9" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1016.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Predice una nueva</tspan><tspan x="54.0" dy="16">preeclampsia?</tspan></text><text x="285.0" y="1016.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: mide la resistencia</tspan><tspan x="285.0" dy="16">uteroplacentaria</tspan></text><text x="435.0" y="1016.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: sirve para</tspan><tspan x="435.0" dy="16">diagnóstico o gravedad</tspan></text><text x="585.0" y="1016.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sirve para</tspan><tspan x="585.0" dy="16">diagnóstico o gravedad</tspan></text><text x="735.0" y="1016.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: evalúa el bienestar</tspan><tspan x="735.0" dy="16">fetal</tspan></text><text x="885.0" y="1016.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: sirve para valorar</tspan><tspan x="885.0" dy="16">gravedad</tspan></text><rect x="40.0" y="941.9" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1069.9" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1097.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1119.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El Doppler de las arterias uterinas mide la resistencia (índice de pulsatilidad o muesca protodiastólica); su elevación predice preeclampsia, sobre todo</tspan><tspan x="58.0" dy="18">   temprana, y restricción del crecimiento.</tspan><tspan x="58.0" dy="18">• Rinde más combinado con factores maternos, presión arterial media y PlGF entre las 11 y 13+6 semanas, y se repite en el segundo trimestre.</tspan><tspan x="58.0" dy="18">• Prevención: con preeclampsia previa se indica ácido acetilsalicílico en dosis baja antes de las 16 semanas, y calcio si la ingesta es baja.</tspan><tspan x="58.0" dy="18">• Alerta: proteinuria, creatinina y coagulación sirven para diagnóstico y gravedad, no para predecir; el perfil biofísico evalúa el bienestar fetal.</tspan></text><text x="58.0" y="1213.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG Practice Bulletin N.º 222, Obstet Gynecol 2020;135:e237-e260; GPC 03-2025 INS/MINSA de trastornos hipertensivos del embarazo; IETSI-EsSalud GPC de</tspan><tspan x="58.0" dy="15">preeclampsia (R.112-2021); Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>