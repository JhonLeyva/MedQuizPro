<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1123" viewBox="0 0 1000 1123" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La menopausia precoz es la que ocurre antes de los 40 años"><title>La menopausia precoz es la que ocurre antes de los 40 años</title><rect x="0.75" y="0.75" width="998.5" height="1121.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Endocrinología ginecológica · menopausia</tspan></text><rect x="452.9" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="532.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="532.7" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Menopausia</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cese definitivo de la menstruación por pérdida de la función folicular; se diagnostica tras 12</tspan><tspan x="58.0" dy="17">meses de amenorrea.</tspan><tspan x="58.0" dy="17">La edad media ronda los 50-51 años.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Por debajo de qué edad se considera menopausia</tspan><tspan x="640.0" dy="16">precoz?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ PRUEBA O DIAGNÓSTICO CORRESPONDE A CADA EDAD</tspan></text><line x1="290.0" y1="291.0" x2="290.0" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="290.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="290.0" dy="0">30</tspan></text><line x1="398.3" y1="291.0" x2="398.3" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="398.3" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="398.3" dy="0">35</tspan></text><line x1="506.7" y1="291.0" x2="506.7" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="506.7" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="506.7" dy="0">40</tspan></text><line x1="615.0" y1="291.0" x2="615.0" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="615.0" dy="0">45</tspan></text><line x1="723.3" y1="291.0" x2="723.3" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="723.3" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="723.3" dy="0">50</tspan></text><line x1="831.7" y1="291.0" x2="831.7" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="831.7" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="831.7" dy="0">55</tspan></text><line x1="940.0" y1="291.0" x2="940.0" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="940.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="940.0" dy="0">60</tspan></text><text x="940.0" y="273.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="end" data-max="60"><tspan x="940.0" dy="0">años</tspan></text><rect x="40.0" y="295.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="311.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Menopausia precoz (este caso)</tspan></text><text x="48.0" y="326.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Antes de los 40 años</tspan></text><rect x="290.0" y="303.0" width="216.7" height="22.0" rx="6" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="48.0" y="349.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Menopausia temprana</tspan></text><text x="48.0" y="364.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Entre 40 y 45 años</tspan></text><rect x="506.7" y="341.0" width="108.3" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><rect x="40.0" y="371.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="387.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Edad media de la menopausia</tspan></text><text x="48.0" y="402.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Alrededor de 50-51 años</tspan></text><rect x="723.3" y="379.0" width="21.7" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="425.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Menopausia tardía</tspan></text><text x="48.0" y="440.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Después de los 55 años</tspan></text><rect x="831.7" y="417.0" width="108.3" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><line x1="506.7" y1="293.0" x2="506.7" y2="453.0" stroke="#b91c1c" stroke-width="2.6"/><rect x="455.8" y="453.0" width="101.7" height="22.0" rx="11" fill="#b91c1c" stroke="none" stroke-width="1.5"/><text x="506.7" y="468.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="506.7" dy="0">Límite: 40 años</tspan></text><rect x="40.0" y="499.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="525.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Menopausia precoz = antes de los 40 años</tspan></text><text x="60.0" y="544.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">45, 42, 38 y 35 años no son puntos de corte aceptados.</tspan></text><text x="40.0" y="605.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">MENOPAUSIA SEGÚN LA EDAD DE PRESENTACIÓN</tspan></text><rect x="40.0" y="617.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="636.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Tipo</tspan></text><text x="280.0" y="636.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Edad</tspan></text><text x="625.0" y="636.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Dato clave</tspan></text><rect x="40.0" y="646.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="665.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Precoz</tspan></text><text x="280.0" y="665.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Antes de los 40 años</tspan></text><text x="625.0" y="665.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Amenorrea de 4 meses o más y FSH mayor de 25 UI/L dos</tspan><tspan x="625.0" dy="15">veces (ESHRE 2024)</tspan></text><rect x="170.6" y="657.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="216.0" y="672.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="216.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="690.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="709.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Temprana</tspan></text><text x="280.0" y="709.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">40 a 45 años</tspan></text><text x="625.0" y="709.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Mayor riesgo cardiovascular y óseo que la natural</tspan></text><rect x="40.0" y="719.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="738.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Natural</tspan></text><text x="280.0" y="738.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Media de 50-51 años</tspan></text><text x="625.0" y="738.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Se diagnostica tras 12 meses de amenorrea</tspan></text><rect x="40.0" y="748.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="767.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Tardía</tspan></text><text x="280.0" y="767.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Después de los 55 años</tspan></text><text x="625.0" y="767.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Mayor exposición a estrógenos</tspan></text><text x="40.0" y="817.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="827.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="849.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="830.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">40 años</tspan></text><text x="435.0" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">45 años</tspan></text><text x="585.0" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">42 años</tspan></text><text x="735.0" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">35 años</tspan></text><text x="885.0" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">38 años</tspan></text><rect x="40.0" y="864.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="864.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="893.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Edad límite?</tspan></text><text x="285.0" y="885.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: antes de los 40</tspan><tspan x="285.0" dy="16">años</tspan></text><text x="435.0" y="885.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: 40 a 45 años es</tspan><tspan x="435.0" dy="16">menopausia temprana</tspan></text><text x="585.0" y="885.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no es un punto de</tspan><tspan x="585.0" dy="16">corte aceptado</tspan></text><text x="735.0" y="885.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no es un punto de</tspan><tspan x="735.0" dy="16">corte aceptado</tspan></text><text x="885.0" y="885.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no es un punto de</tspan><tspan x="885.0" dy="16">corte aceptado</tspan></text><rect x="40.0" y="827.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="938.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="966.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="988.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Precoz o insuficiencia ovárica prematura: antes de los 40 años; temprana: entre 40 y 45; tardía: después de los 55.</tspan><tspan x="58.0" dy="18">• ESHRE 2024: oligoamenorrea o amenorrea de al menos 4 meses y FSH mayor de 25 UI/L en dos mediciones separadas más de 4 semanas.</tspan><tspan x="58.0" dy="18">• Causas: genéticas (Turner, premutación de FMR1), autoinmunes, iatrogénicas (quimioterapia, radioterapia, ooforectomía), infecciosas o idiopáticas.</tspan><tspan x="58.0" dy="18">• Mayor riesgo de osteoporosis, enfermedad cardiovascular y depresión: terapia hormonal hasta cerca de los 50-51 años salvo contraindicación; consejería</tspan><tspan x="58.0" dy="18">   sobre fertilidad.</tspan></text><text x="58.0" y="1082.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ESHRE, guía basada en evidencia de insuficiencia ovárica prematura (Hum Reprod Open 2024); Berek y Novak, Ginecología, 16.ª ed. (2020)</tspan></text></svg>