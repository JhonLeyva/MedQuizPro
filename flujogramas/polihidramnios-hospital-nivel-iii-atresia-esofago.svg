"11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="219.5" dy="0">Potter</tspan></text><rect x="258.9" y="640.2" width="142.2" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="330.0" y="659.7" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="330.0" dy="0">Hipoplasia pulmonar</tspan></text><rect x="409.1" y="640.2" width="136.0" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="477.1" y="659.7" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="477.1" dy="0">Riñón en herradura</tspan></text><rect x="40.0" y="694.2" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="722.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="744.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Potter e hipoplasia pulmonar van con oligohidramnios.</tspan><tspan x="58.0" dy="18">• Pasar sonda orogástrica al nacer.</tspan><tspan x="58.0" dy="18">• Otras causas: diabetes, anomalías del SNC.</tspan></text><text x="58.0" y="802.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Williams Obstetrics 26.ª ed. (2022) · Nelson Tratado de Pediatría 22.ª ed. (2024)</tspan></text></svg>