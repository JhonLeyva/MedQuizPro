<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1337" viewBox="0 0 1000 1337" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Los inhibidores de la ECA están contraindicados en el embarazo por la fetopatía renal e hipoplasia pulmonar"><title>Los inhibidores de la ECA están contraindicados en el embarazo por la fetopatía renal e hipoplasia pulmonar</title><rect x="0.75" y="0.75" width="998.5" height="1335.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Farmacología · antihipertensivos en el embarazo</tspan></text><rect x="487.1" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="566.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="566.9" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">IECA en el embarazo</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Bloquean el sistema renina-angiotensina fetal.</tspan><tspan x="58.0" dy="17">Contraindicados sobre todo en el segundo y tercer trimestre.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué antihipertensivo está contraindicado en el</tspan><tspan x="640.0" dy="16">embarazo?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ANTIHIPERTENSIVOS SEGUROS FRENTE A CONTRAINDICADOS EN EL EMBARAZO</tspan></text><rect x="493.0" y="319.0" width="14" height="190" rx="5" fill="#64748b"/><path d="M440.0 524.0 H560.0 L540.0 504.0 H460.0 Z" fill="#475569"/><circle cx="500.0" cy="319.0" r="15" fill="#f59e0b" stroke="#92400e" stroke-width="2"/><line x1="385.4" y1="300.9" x2="614.6" y2="337.1" stroke="#334155" stroke-width="7" stroke-linecap="round"/><line x1="385.4" y1="300.9" x2="357.4" y2="362.9" stroke="#64748b" stroke-width="2"/><line x1="385.4" y1="300.9" x2="413.4" y2="362.9" stroke="#64748b" stroke-width="2"/><path d="M347.4 362.9 H423.4 Q385.4 406.9 347.4 362.9 Z" fill="#64748b"/><text x="385.4" y="377.9" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="385.4" dy="0">USAR</tspan></text><line x1="614.6" y1="337.1" x2="586.6" y2="399.1" stroke="#64748b" stroke-width="2"/><line x1="614.6" y1="337.1" x2="642.6" y2="399.1" stroke="#64748b" stroke-width="2"/><path d="M576.6 399.1 H652.6 Q614.6 443.1 576.6 399.1 Z" fill="#ea580c"/><text x="614.6" y="414.1" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="614.6" dy="0">EVITAR</tspan></text><text x="500.0" y="551.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="300"><tspan x="500.0" dy="0">¿Cuál está contraindicado?</tspan></text><rect x="40.0" y="289.0" width="290.0" height="158.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58.0" y="317.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="58.0" dy="0">Seguros</tspan></text><circle cx="62.0" cy="342.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="346.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Nifedipino y otros bloqueadores de calcio</tspan></text><circle cx="62.0" cy="368.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="372.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Alfametildopa</tspan></text><circle cx="62.0" cy="394.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="398.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Labetalol</tspan></text><circle cx="62.0" cy="420.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="424.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Hidralazina en crisis hipertensivas</tspan></text><rect x="670.0" y="289.0" width="290.0" height="174.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><text x="688.0" y="317.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="254"><tspan x="688.0" dy="0">Contraindicados (este caso)</tspan></text><circle cx="692.0" cy="342.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="346.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">IECA (enalapril, captopril): este caso</tspan></text><circle cx="692.0" cy="368.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="372.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">ARA-II (losartán)</tspan></text><circle cx="692.0" cy="394.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="398.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Inhibidores directos de la renina</tspan></text><circle cx="692.0" cy="420.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="424.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Fetopatía: oligohidramnios, hipoplasia</tspan><tspan x="704.0" dy="16">pulmonar y falla renal</tspan></text><rect x="844.6" y="278.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="293.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="585.0" width="920.0" height="93.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="613.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">IECA = contraindicado en el embarazo</tspan></text><text x="500.0" y="634.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Producen oliguria fetal, oligohidramnios e hipoplasia pulmonar.</tspan><tspan x="500.0" dy="17">Los demás fármacos de la lista son seguros.</tspan></text><text x="40.0" y="712.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ANTIHIPERTENSIVOS EN EL EMBARAZO</tspan></text><rect x="40.0" y="724.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="743.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Fármaco</tspan></text><text x="300.0" y="743.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Situación</tspan></text><text x="635.0" y="743.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Comentario</tspan></text><rect x="40.0" y="753.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="772.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Labetalol</tspan></text><text x="300.0" y="772.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Primera línea</tspan></text><text x="635.0" y="772.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Opción de primera línea (ACOG 203)</tspan></text><rect x="40.0" y="782.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="801.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Nifedipino de liberación prolongada</tspan></text><text x="300.0" y="801.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Primera línea</tspan></text><text x="635.0" y="801.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">También se usa en crisis hipertensivas</tspan></text><rect x="40.0" y="811.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="830.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Alfametildopa</tspan></text><text x="300.0" y="830.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Aceptado (clave del banco)</tspan></text><text x="635.0" y="830.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Larga experiencia y seguimiento de los hijos</tspan></text><rect x="40.0" y="840.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="859.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Hidralazina</tspan></text><text x="300.0" y="859.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Crisis hipertensivas</tspan></text><text x="635.0" y="859.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Vía parenteral</tspan></text><rect x="40.0" y="869.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="888.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Hidroclorotiazida</tspan></text><text x="300.0" y="888.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">No se inicia de rutina</tspan></text><text x="635.0" y="888.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Puede reducir el volumen plasmático</tspan></text><rect x="40.0" y="898.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="917.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Atenolol</tspan></text><text x="300.0" y="917.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Se evita</tspan></text><text x="635.0" y="917.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Asociado a restricción del crecimiento fetal</tspan></text><rect x="40.0" y="927.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="946.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">IECA y ARA-II</tspan></text><text x="300.0" y="946.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Contraindicados</tspan></text><text x="635.0" y="946.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Fetotoxicidad: oligohidramnios y displasia renal</tspan></text><rect x="190.6" y="930.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="236.0" y="945.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="236.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="996.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1006.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1037.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="1009.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="1037.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Inhibidor de la ECA</tspan></text><text x="435.0" y="1028.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Inhibidor de los</tspan><tspan x="435.0" dy="17">canales de calcio</tspan></text><text x="585.0" y="1037.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Alfametildopa</tspan></text><text x="735.0" y="1037.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Labetalol</tspan></text><text x="885.0" y="1037.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hidralazina</tspan></text><rect x="40.0" y="1060.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1060.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1089.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Contraindicado?</tspan></text><text x="285.0" y="1081.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: fetopatía renal e</tspan><tspan x="285.0" dy="16">hipoplasia pulmonar</tspan></text><text x="435.0" y="1081.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: seguro en el</tspan><tspan x="435.0" dy="16">embarazo</tspan></text><text x="585.0" y="1081.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: seguro, larga</tspan><tspan x="585.0" dy="16">experiencia</tspan></text><text x="735.0" y="1081.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: seguro en el</tspan><tspan x="735.0" dy="16">embarazo</tspan></text><text x="885.0" y="1081.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: seguro, parenteral</tspan><tspan x="885.0" dy="16">en crisis</tspan></text><rect x="40.0" y="1006.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1134.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1162.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1184.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Fetopatía por IECA: hipoperfusión y falla renal fetal, oligohidramnios, hipoplasia pulmonar, contracturas, retraso de la osificación del cráneo e hipotensión</tspan><tspan x="58.0" dy="18">   neonatal.</tspan><tspan x="58.0" dy="18">• Los ARA-II y los inhibidores directos de la renina tienen la misma contraindicación.</tspan><tspan x="58.0" dy="18">• Seguros: bloqueadores de calcio (nifedipino), alfametildopa, labetalol e hidralazina (parenteral en crisis).</tspan><tspan x="58.0" dy="18">• Alerta: mujer en edad fértil con IECA: anticoncepción eficaz y suspenderlo en cuanto se confirme el embarazo; el riesgo del primer trimestre es menor,</tspan><tspan x="58.0" dy="18">   pero no nulo.</tspan></text><text x="58.0" y="1296.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA/INS, GPC 03-2025 trastornos hipertensivos del embarazo; ACOG, Practice Bulletin 203 (2019); Williams Obstetricia, 26.ª ed. (2022).</tspan></text></svg>