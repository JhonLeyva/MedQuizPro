<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1120" viewBox="0 0 1000 1120" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El túbulo contorneado proximal reabsorbe 80 a 85 % del bicarbonato filtrado"><title>El túbulo contorneado proximal reabsorbe 80 a 85 % del bicarbonato filtrado</title><rect x="0.75" y="0.75" width="998.5" height="1118.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Fisiología renal · reabsorción de bicarbonato</tspan></text><rect x="465.2" y="32.0" width="182.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="556.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="167"><tspan x="556.5" dy="0">NEFROLOGÍA Y UROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Bicarbonato en la nefrona</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se filtra libremente y el riñón recupera casi toda la carga.</tspan><tspan x="58.0" dy="17">Con bicarbonato plasmático normal casi no aparece en la orina.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de fisiología</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿En qué parte de la nefrona se reabsorbe la mayor</tspan><tspan x="640.0" dy="16">parte del bicarbonato?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CUÁNTO BICARBONATO RECUPERA CADA SEGMENTO</tspan></text><polygon points="200.0,269.0 300.0,269.0 353.3,325.0 146.7,325.0" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="302.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="88"><tspan x="250.0" dy="0">1</tspan></text><rect x="486.0" y="269.0" width="474.0" height="56.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="501.0" y="293.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Túbulo contorneado proximal</tspan></text><text x="501.0" y="310.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">80 a 85 % del bicarbonato filtrado; NHE3, H+-ATPasa y anhidrasa carbónica</tspan></text><rect x="858.2" y="258.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="903.6" y="273.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="903.6" dy="0">◆ ESTE CASO</tspan></text><polygon points="146.7,331.0 353.3,331.0 406.7,387.0 93.3,387.0" fill="#99f6e4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="364.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="195"><tspan x="250.0" dy="0">2</tspan></text><rect x="486.0" y="331.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="355.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Asa gruesa ascendente de Henle</tspan></text><text x="501.0" y="372.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">10 a 15 % del bicarbonato filtrado</tspan></text><polygon points="93.3,393.0 406.7,393.0 460.0,449.0 40.0,449.0" fill="#5eead4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="426.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="301"><tspan x="250.0" dy="0">3</tspan></text><rect x="486.0" y="393.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="417.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Túbulo distal y colector</tspan></text><text x="501.0" y="434.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Fracción restante; en el colector se afina la acidificación de la orina</tspan></text><text x="250.0" y="467.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="420"><tspan x="250.0" dy="0">▲ mayor reabsorción · ▼ menor reabsorción</tspan></text><rect x="40.0" y="489.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="515.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Mayor reabsorción de bicarbonato = túbulo contorneado proximal</tspan></text><text x="60.0" y="534.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Los demás segmentos recuperan una fracción menor.</tspan></text><text x="40.0" y="595.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">REABSORCIÓN DE BICARBONATO POR SEGMENTO</tspan></text><rect x="40.0" y="607.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="626.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Segmento</tspan></text><text x="300.0" y="626.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Fracción</tspan></text><text x="635.0" y="626.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Nota clínica</tspan></text><rect x="40.0" y="636.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="655.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Túbulo proximal</tspan></text><text x="300.0" y="655.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">80 a 85 %</tspan></text><text x="635.0" y="655.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Acidosis tubular tipo 2; acetazolamida</tspan></text><rect x="190.6" y="639.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="236.0" y="654.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="236.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="665.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="684.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Asa gruesa ascendente</tspan></text><text x="300.0" y="684.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">10 a 15 %</tspan></text><text x="635.0" y="684.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Reabsorbe parte del bicarbonato remanente</tspan></text><rect x="40.0" y="694.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="713.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Distal y colector</tspan></text><text x="300.0" y="713.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Resto</tspan></text><text x="635.0" y="713.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Acidosis tubular tipo 1 por falla en secretar hidrogeniones</tspan></text><text x="40.0" y="763.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="773.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="804.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="776.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="795.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Túbulo contorneado</tspan><tspan x="285.0" dy="17">proximal</tspan></text><text x="435.0" y="795.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Túbulo contorneado</tspan><tspan x="435.0" dy="17">distal</tspan></text><text x="585.0" y="795.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Asa delgada de</tspan><tspan x="585.0" dy="17">Henle</tspan></text><text x="735.0" y="795.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Asa gruesa de</tspan><tspan x="735.0" dy="17">Henle</tspan></text><text x="885.0" y="804.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Túbulo colector</tspan></text><rect x="40.0" y="827.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="827.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="856.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Mayor reabsorción de</tspan><tspan x="54.0" dy="16">bicarbonato?</tspan></text><text x="285.0" y="856.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: 80 a 85 % del</tspan><tspan x="285.0" dy="16">bicarbonato filtrado</tspan></text><text x="435.0" y="856.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: reabsorbe una</tspan><tspan x="435.0" dy="16">fracción menor</tspan></text><text x="585.0" y="856.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: reabsorbe una</tspan><tspan x="585.0" dy="16">fracción menor</tspan></text><text x="735.0" y="856.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: recupera 10 a 15</tspan><tspan x="735.0" dy="16">%</tspan></text><text x="885.0" y="848.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: afina la</tspan><tspan x="885.0" dy="16">acidificación final de la</tspan><tspan x="885.0" dy="16">orina</tspan></text><rect x="40.0" y="773.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="917.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="945.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="967.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Reparto: 80 a 85 % en el túbulo proximal, 10 a 15 % en el asa gruesa ascendente y el resto en el túbulo distal y el colector.</tspan><tspan x="58.0" dy="18">• Mecanismo proximal: el intercambiador Na+/H+ (NHE3) secreta H+, que se une al HCO3- filtrado; la anhidrasa carbónica lo convierte en agua y CO2,</tspan><tspan x="58.0" dy="18">   que difunde y se regenera como HCO3- dentro de la célula.</tspan><tspan x="58.0" dy="18">• La acetazolamida inhibe la anhidrasa carbónica: bicarbonaturia y acidosis hiperclorémica. Acidosis tubular tipo 2 es proximal; la tipo 1 es distal (falla</tspan><tspan x="58.0" dy="18">   secretar H+).</tspan><tspan x="58.0" dy="18">• Alerta: el síndrome de Fanconi (disfunción proximal) cursa con glucosuria, aminoaciduria y fosfaturia.</tspan></text><text x="58.0" y="1079.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Guyton y Hall, 14.ª ed. (2021); Harrison, Principios de Medicina Interna, 21.ª ed. (2022).</tspan></text></svg>