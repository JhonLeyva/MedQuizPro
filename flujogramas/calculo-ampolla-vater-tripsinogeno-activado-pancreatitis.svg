oke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/><rect x="339.6" y="444.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="385.0" y="459.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="385.0" dy="0">◆ ESTE CASO</tspan></text><rect x="48.0" y="499.0" width="214.0" height="93.3" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="155.0" y="537.4" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="155.0" dy="0">Presión alta</tspan></text><text x="155.0" y="561.1" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="155.0" dy="0">Reflujo y estasis</tspan></text><rect x="278.0" y="499.0" width="214.0" height="93.3" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="385.0" y="527.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="186"><tspan x="385.0" dy="0">TRIPSINÓGENO →</tspan><tspan x="385.0" dy="19.2">TRIPSINA</tspan></text><text x="385.0" y="570.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="186"><tspan x="385.0" dy="0">Dentro del páncreas</tspan></text><rect x="508.0" y="499.0" width="214.0" height="93.3" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="615.0" y="537.4" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="615.0" dy="0">Autodigestión</tspan></text><text x="615.0" y="561.1" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="615.0" dy="0">Elastasa, fosfolipasa</tspan></text><rect x="738.0" y="499.0" width="214.0" height="93.3" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="845.0" y="537.4" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="845.0" dy="0">Inflamación</tspan></text><text x="845.0" y="561.1" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="845.0" dy="0">SIRS, falla orgánica</tspan></text><text x="40.0" y="630.3" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EVENTO CLAVE · MARCADO EL CORRECTO</tspan></text><rect x="40.0" y="642.3" width="165.4" height="30.0" rx="15" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="122.7" y="661.8" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="122.7" dy="0">✓ Tripsinógeno a tripsina</tspan></text><rect x="213.4" y="642.3" width="137.4" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="282.0" y="661.8" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="282.0" dy="0">Bilis activa enzimas</tspan></text><rect x="358.7" y="642.3" width="133.3" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="425.4" y="661.8" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="425.4" dy="0">Quimotripsinógeno</tspan></text><rect x="500.0" y="642.3" width="119.6" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="559.8" y="661.8" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="559.8" dy="0">Enzimas biliares</tspan></text><rect x="40.0" y="696.3" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="724.3" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="746.3" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Normalmente la enteropeptidasa activa la tripsina en el duodeno.</tspan><tspan x="58.0" dy="18">• El inhibidor de tripsina (SPINK1) protege al páncreas.</tspan><tspan x="58.0" dy="18">• Tratamiento: hidratación, analgesia y dieta precoz.</tspan></text><text x="58.0" y="804.3" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Robbins y Cotran. Patología estructural y funcional 10.ª ed. (2021)</tspan></text></svg>