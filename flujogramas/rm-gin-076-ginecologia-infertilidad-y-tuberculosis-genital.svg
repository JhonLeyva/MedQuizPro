<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1036" viewBox="0 0 1000 1036" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Con ciclos regulares y tuberculosis previa, el factor de la infertilidad es tubárico"><title>Con ciclos regulares y tuberculosis previa, el factor de la infertilidad es tubárico</title><rect x="0.75" y="0.75" width="998.5" height="1034.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ginecología · infertilidad y tuberculosis genital</tspan></text><rect x="476.1" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="555.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="555.9" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tuberculosis genital</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Casi siempre secundaria a un foco pulmonar, por vía hematógena.</tspan><tspan x="58.0" dy="17">Afecta las trompas en más de 90 % de los casos.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 36 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Infertilidad de 5 años, ciclos de 28 a 30 días.</tspan><tspan x="640.0" dy="16">Tuberculosis pulmonar a los 23 años.</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ COMPROMETE LA TUBERCULOSIS GENITAL Y QUÉ DESCARTA EL CASO</tspan></text><line x1="406.0" y1="411.0" x2="340.0" y2="411.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="411.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="420.3" y1="460.8" x2="340.0" y2="511.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="511.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="383.0" x2="660.0" y2="361.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="361.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.1" y1="440.9" x2="660.0" y2="464.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="464.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="420.3" y1="361.2" x2="340.0" y2="311.0" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="311.0" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="411.0" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="411.0" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="416.0" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">TB GENITAL</tspan></text><text x="500.0" y="435.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">infertilidad tubárica</tspan></text><rect x="40.0" y="269.0" width="300.0" height="84.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="302.7" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">TROMPAS: MÁS DE 90 %</tspan></text><text x="190.0" y="326.4" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Obstrucción, hidrosálpinx y adherencias</tspan></text><rect x="144.6" y="343.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="358.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="369.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="370.0" width="6.0" height="82.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="402.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">ENDOMETRIO: CERCA DE 50 %</tspan></text><text x="190.0" y="426.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Sinequias tipo síndrome de Asherman</tspan></text><rect x="40.0" y="469.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="470.0" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="190.0" y="502.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">CUELLO Y OVARIO: RAROS</tspan></text><text x="190.0" y="526.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">El factor cervical casi nunca es tuberculoso</tspan></text><rect x="660.0" y="315.4" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="316.4" width="6.0" height="89.2" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="344.2" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">OVULACIÓN CONSERVADA</tspan></text><text x="810.0" y="367.9" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Ciclos de 28 a 30 días: factor ovárico</tspan><tspan x="810.0" dy="17">improbable</tspan></text><rect x="660.0" y="422.6" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="423.6" width="6.0" height="82.0" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="456.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">DEFINICIÓN DE INFERTILIDAD</tspan></text><text x="810.0" y="480.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">12 meses, o 6 si la mujer tiene más de 35 años</tspan></text><text x="40.0" y="589.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="601.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="634.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Tuberculosis pulmonar previa</tspan></text><line x1="248.5" y1="630.0" x2="267.5" y2="630.0" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,625.0 266.5,635.0 274.5,630.0" fill="#0f766e"/><rect x="278.5" y="601.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="625.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Diseminación hematógena a la</tspan><tspan x="380.8" dy="17">trompa</tspan></text><line x1="487.0" y1="630.0" x2="506.0" y2="630.0" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,625.0 505.0,635.0 513.0,630.0" fill="#0f766e"/><rect x="517.0" y="601.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="634.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Obstrucción tubárica</tspan></text><line x1="725.5" y1="630.0" x2="744.5" y2="630.0" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,625.0 743.5,635.0 751.5,630.0" fill="#0f766e"/><rect x="755.5" y="601.0" width="204.5" height="58.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="634.0" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Histerosalpingografía</tspan></text><text x="40.0" y="699.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="709.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="731.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="731.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Ovárico</tspan></text><rect x="363.0" y="712.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="731.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Tubárico</tspan></text><text x="585.0" y="731.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Uterino</tspan></text><text x="735.0" y="731.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Endometrial</tspan></text><text x="885.0" y="731.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Cervical</tspan></text><rect x="40.0" y="746.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="746.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="783.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Factor de infertilidad?</tspan></text><text x="285.0" y="775.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: ciclos regulares,</tspan><tspan x="285.0" dy="16">ovulación casi segura</tspan></text><text x="435.0" y="775.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: la tuberculosis</tspan><tspan x="435.0" dy="16">obstruye las trompas</tspan></text><text x="585.0" y="775.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: menos probable,</tspan><tspan x="585.0" dy="16">aunque puede coexistir</tspan></text><text x="735.0" y="767.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: puede coexistir,</tspan><tspan x="735.0" dy="16">pero no explica el</tspan><tspan x="735.0" dy="16">cuadro principal</tspan></text><text x="885.0" y="775.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: casi nunca lo</tspan><tspan x="885.0" dy="16">causa la tuberculosis</tspan></text><rect x="40.0" y="709.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="836.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="864.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="886.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Infertilidad: ausencia de embarazo tras 12 meses sin protección (6 meses si la mujer tiene más de 35 años, como aquí).</tspan><tspan x="58.0" dy="18">• Ciclos regulares de 28 a 30 días indican ovulación casi segura: el factor ovárico es improbable.</tspan><tspan x="58.0" dy="18">• La tuberculosis genital compromete trompas (más de 90 %: obstrucción, hidrosálpinx, adherencias) y luego endometrio (cerca de 50 %, sinequias); cuello</tspan><tspan x="58.0" dy="18">   y ovario, raramente.</tspan><tspan x="58.0" dy="18">• Diagnóstico: histerosalpingografía, histeroscopía y estudio de tuberculosis; el tratamiento sigue la NTS 221-MINSA/DGIESP-2024.</tspan></text><text x="58.0" y="980.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: NTS 221-MINSA/DGIESP-2024, Prevención y control de la tuberculosis; ASRM, Evaluación de la fertilidad de la mujer infértil (Fertil Steril 2021); Harrison Principios de</tspan><tspan x="58.0" dy="15">Medicina Interna, 21.ª ed. (2022).</tspan></text></svg>