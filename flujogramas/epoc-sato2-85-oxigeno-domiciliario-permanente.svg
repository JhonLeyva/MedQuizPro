<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1124" viewBox="0 0 1000 1124" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="EPOC con SatO₂ de 85 % en reposo y hematocrito de 49 %: el oxígeno domiciliario se usa de forma continua (≥ 15 h/día) porque aumenta la supervivencia"><title>EPOC con SatO₂ de 85 % en reposo y hematocrito de 49 %: el oxígeno domiciliario se usa de forma continua (≥ 15 h/día) porque aumenta la supervivencia</title><rect x="0.75" y="0.75" width="998.5" height="1122.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">EPOC · oxigenoterapia crónica</tspan></text><rect x="382.5" y="32.0" width="129.8" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="447.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="114"><tspan x="447.4" dy="0">NEUMOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Oxigenoterapia crónica domiciliaria</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Indicada con PaO₂ ≤ 55 mmHg o SatO₂ ≤ 88 % en reposo, o PaO₂ 56-59 con policitemia</tspan><tspan x="58.0" dy="17">(Hto &gt; 55 %), cor pulmonale o edema.</tspan><tspan x="58.0" dy="17">Es de los pocos tratamientos que prolongan la vida en la EPOC: ≥ 15 horas al día, mejor</tspan><tspan x="58.0" dy="17">24.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 66 años, fumador, EPOC</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">No quiere usar el oxígeno indicado; buena adherencia</tspan><tspan x="640.0" dy="16">a broncodilatadores.</tspan><tspan x="640.0" dy="16">Más disnea; SatO₂ 85 % al aire; Hto 49 %.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿CUMPLE CRITERIO DE OXÍGENO CRÓNICO?</tspan></text><rect x="40.0" y="285.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="311.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">SatO₂ en reposo, aire ambiente (%)</tspan></text><text x="60.0" y="330.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">≤ 88 % (o PaO₂ ≤ 55) = oxígeno continuo.</tspan></text><rect x="70.0" y="394.0" width="344.0" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="242.0" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="334"><tspan x="242.0" dy="0">Oxígeno ≥ 15 h/día</tspan></text><rect x="414.0" y="394.0" width="516.0" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="672.0" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="506"><tspan x="672.0" dy="0">No indicado (salvo otros criterios)</tspan></text><line x1="414.0" y1="434.0" x2="414.0" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="414.0" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="414.0" dy="0">88</tspan></text><polygon points="276.0,380.0 294.0,380.0 285.0,392.0" fill="#ea580c"/><rect x="220.5" y="354.0" width="128.9" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="285.0" y="369.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="117"><tspan x="285.0" dy="0">◆ ESTE CASO: 85 %</tspan></text><rect x="40.0" y="484.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="510.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Hematocrito (%)</tspan></text><text x="60.0" y="529.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">&gt; 55 % suma indicación si la PaO₂ es 56-59.</tspan></text><rect x="70.0" y="593.0" width="645.0" height="40.0" rx="6" fill="#fef9c3" stroke="#ffffff" stroke-width="2"/><text x="392.5" y="618.0" font-size="12" font-weight="800" font-style="normal" fill="#a16207" text-anchor="middle" data-max="635"><tspan x="392.5" dy="0">Normal-alto</tspan></text><rect x="715.0" y="593.0" width="215.0" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="822.5" y="618.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="205"><tspan x="822.5" dy="0">Policitemia</tspan></text><line x1="715.0" y1="633.0" x2="715.0" y2="641.0" stroke="#64748b" stroke-width="1.5"/><text x="715.0" y="655.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="715.0" dy="0">55</tspan></text><polygon points="448.0,579.0 466.0,579.0 457.0,591.0" fill="#ea580c"/><rect x="428.4" y="553.0" width="57.2" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="457.0" y="568.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="45"><tspan x="457.0" dy="0">◆ 49 %</tspan></text><text x="40.0" y="701.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO USARLO</tspan></text><rect x="40.0" y="711.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="712.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="735.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">≥ 15 horas al día</tspan></text><text x="58.0" y="756.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Mejor 24 h</tspan></text><rect x="351.3" y="711.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="712.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="735.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Flujo bajo</tspan></text><text x="369.3" y="756.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Meta 88-92 %</tspan></text><rect x="662.7" y="711.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="712.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="735.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Seguir broncodilatadores</tspan></text><text x="680.7" y="756.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Y dejar de fumar</tspan></text><text x="40.0" y="820.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="830.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="869.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="861.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Solo en las</tspan><tspan x="285.0" dy="17">descompensaciones</tspan></text><text x="435.0" y="861.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Dosis altas</tspan><tspan x="435.0" dy="17">intermitentes</tspan></text><rect x="513.0" y="833.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="852.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Uso permanente</tspan><tspan x="585.0" dy="17">(aumenta la</tspan><tspan x="585.0" dy="17">supervivencia)</tspan></text><text x="735.0" y="861.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">No dar porque el</tspan><tspan x="735.0" dy="17">Hto está alto</tspan></text><text x="885.0" y="861.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Suspender los</tspan><tspan x="885.0" dy="17">broncodilatadores</tspan></text><rect x="40.0" y="901.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="901.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="930.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Actitud correcta?</tspan></text><text x="285.0" y="930.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: pierde el beneficio</tspan></text><text x="435.0" y="922.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: dosis bajas y</tspan><tspan x="435.0" dy="16">continuas</tspan></text><text x="585.0" y="922.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: ≥ 15 h/día prolonga</tspan><tspan x="585.0" dy="16">la vida</tspan></text><text x="735.0" y="922.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: el Hto alto es otra</tspan><tspan x="735.0" dy="16">razón para darlo</tspan></text><text x="885.0" y="930.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: deben continuar</tspan></text><rect x="40.0" y="830.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="975.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1003.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1025.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Explicar que el beneficio depende de las horas de uso (≥ 15 h/día).</tspan><tspan x="58.0" dy="18">• Meta SatO₂ 88-92 %; no fumar cerca del oxígeno (riesgo de quemaduras).</tspan><tspan x="58.0" dy="18">• Dejar de fumar y rehabilitación pulmonar también mejoran el pronóstico.</tspan></text><text x="58.0" y="1083.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: GOLD 2025; ATS, oxígeno domiciliario (2020).</tspan></text></svg>