x1="310.0" y1="493.0" x2="310.0" y2="512.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,511.0 315.0,511.0 310.0,519.0" fill="#0f766e"/><rect x="140.0" y="523.0" width="340.0" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="552.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">HEMOCULTIVO</tspan></text><text x="310.0" y="576.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">No crece ni está en sangre</tspan><tspan x="310.0" dy="17">No sirve</tspan></text><rect x="370.6" y="512.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="527.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="538.9" width="346.0" height="60.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="558.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="576.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">Lavado: &gt; 90 % de sensibilidad.</tspan></text><rect x="40.0" y="638.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="666.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="688.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Tinción de Grocott o PCR.</tspan><tspan x="58.0" dy="18">• CD4 &lt; 200, LDH alta.</tspan><tspan x="58.0" dy="18">• Cotrimoxazol + corticoide si PaO2 &lt; 70.</tspan></text><text x="58.0" y="746.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Murray. Microbiología médica 9.ª ed. (2021)</tspan></text></svg>