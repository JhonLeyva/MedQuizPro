<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1112" viewBox="0 0 1000 1112" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Mujer joven con baja de peso, intolerancia al calor, temblor, taquicardia y amenorrea con TSH baja y T4 libre alta: hipertiroidismo, metimazol"><title>Mujer joven con baja de peso, intolerancia al calor, temblor, taquicardia y amenorrea con TSH baja y T4 libre alta: hipertiroidismo, metimazol</title><rect x="0.75" y="0.75" width="998.5" height="1111.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Tiroides · hipertiroidismo</tspan></text><rect x="350.1" y="32.0" width="155.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="427.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="139"><tspan x="427.8" dy="0">ENDOCRINOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hipertiroidismo</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Exceso de hormona tiroidea; en la mujer joven, la causa más común es la enfermedad de</tspan><tspan x="58.0" dy="17">Graves.</tspan><tspan x="58.0" dy="17">TSH baja y T4 libre alta confirman el hipertiroidismo primario.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 25 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Debilidad, intolerancia al calor, baja de peso con</tspan><tspan x="640.0" dy="16">apetito, amenorrea 5 meses.</tspan><tspan x="640.0" dy="16">Piel caliente y húmeda, temblor fino, taquicardia; TSH</tspan><tspan x="640.0" dy="16">baja, T4L alta, β-hCG negativa.</tspan></text><line x1="640.0" y1="237.0" x2="670.0" y2="237.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#94a3b8"/><line x1="500.0" y1="381.0" x2="500.0" y2="411.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="411.0" x2="733.5" y2="411.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="411.0" x2="266.5" y2="440.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,439.0 271.5,439.0 266.5,447.0" fill="#94a3b8"/><line x1="733.5" y1="411.0" x2="733.5" y2="440.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,439.0 738.5,439.0 733.5,447.0" fill="#94a3b8"/><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#0f766e"/><line x1="500.0" y1="381.0" x2="500.0" y2="411.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="411.0" x2="500.0" y2="411.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="411.0" x2="266.5" y2="440.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,439.0 271.5,439.0 266.5,447.0" fill="#0f766e"/><rect x="180.1" y="420.0" width="172.7" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="432.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">No: β-hCG negativa (este caso)</tspan></text><rect x="721.4" y="420.0" width="24.1" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="432.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Sí</tspan></text><polygon points="240.0,352.0 266.0,323.0 734.0,323.0 760.0,352.0 734.0,381.0 266.0,381.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="352.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="357.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="356.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">TSH baja con T4 libre alta: ¿embarazo en el 1.er trimestre?</tspan></text><rect x="40.0" y="447.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="475.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">METIMAZOL</tspan></text><text x="266.5" y="498.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">+ propranolol</tspan><tspan x="266.5" dy="17">Control de hemograma</tspan></text><rect x="507.0" y="447.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="483.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Propiltiouracilo</tspan></text><text x="733.5" y="506.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Solo 1.er trimestre</tspan></text><text x="40.0" y="577.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SIGNOS CON NOMBRE PROPIO</tspan></text><rect x="40.0" y="589.5" width="920.0" height="179.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><line x1="62.0" y1="631.5" x2="938.0" y2="631.5" stroke="#0f766e" stroke-width="2"/><line x1="62.0" y1="631.5" x2="62.0" y2="639.5" stroke="#0f766e" stroke-width="2"/><line x1="938.0" y1="631.5" x2="938.0" y2="639.5" stroke="#0f766e" stroke-width="2"/><rect x="433.8" y="619.5" width="132.5" height="24.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/><text x="500.0" y="635.5" font-size="10.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="118"><tspan x="500.0" dy="0">TRÍADA DE GRAVES</tspan></text><rect x="56.0" y="651.5" width="288.0" height="70.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="76.0" cy="674.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="76.0" y="678.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="76.0" dy="0">1</tspan></text><text x="94.0" y="679.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="242"><tspan x="94.0" dy="0">Bocio</tspan></text><text x="68.0" y="705.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="264"><tspan x="68.0" dy="0">No se describe</tspan></text><rect x="356.0" y="651.5" width="288.0" height="70.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="376.0" cy="674.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="376.0" y="678.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="376.0" dy="0">2</tspan></text><text x="394.0" y="679.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="242"><tspan x="394.0" dy="0">Oftalmopatía</tspan></text><text x="368.0" y="705.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="264"><tspan x="368.0" dy="0">No se describe</tspan></text><rect x="656.0" y="651.5" width="288.0" height="70.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="676.0" cy="674.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="676.0" y="678.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="676.0" dy="0">3</tspan></text><text x="694.0" y="679.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="242"><tspan x="694.0" dy="0">Mixedema pretibial</tspan></text><text x="668.0" y="705.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="264"><tspan x="668.0" dy="0">No se describe</tspan></text><text x="56.0" y="748.5" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">Si aparecen, confirman Graves; si no, pedir TRAb.</tspan></text><text x="40.0" y="808.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="818.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="858.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="821.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="858.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Metimazol</tspan></text><text x="435.0" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Ácido acetil</tspan><tspan x="435.0" dy="17">salicílico</tspan></text><text x="585.0" y="858.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Levotiroxina</tspan></text><text x="735.0" y="858.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Prednisona</tspan></text><text x="885.0" y="841.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Yodo radiactivo</tspan><tspan x="885.0" dy="17">durante el</tspan><tspan x="885.0" dy="17">embarazo</tspan></text><rect x="40.0" y="889.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="889.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="918.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tratamiento?</tspan></text><text x="285.0" y="910.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: antitiroideo de</tspan><tspan x="285.0" dy="16">elección</tspan></text><text x="435.0" y="910.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no trata el</tspan><tspan x="435.0" dy="16">hipertiroidismo</tspan></text><text x="585.0" y="910.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es para</tspan><tspan x="585.0" dy="16">hipotiroidismo</tspan></text><text x="735.0" y="910.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Solo en tiroiditis u</tspan><tspan x="735.0" dy="16">oftalmopatía</tspan></text><text x="885.0" y="910.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Contraindicado en el</tspan><tspan x="885.0" dy="16">embarazo</tspan></text><rect x="40.0" y="818.5" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="963.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="991.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1013.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Metimazol de primera línea (propiltiouracilo solo en el 1.er trimestre del embarazo o tormenta tiroidea).</tspan><tspan x="58.0" dy="18">• Betabloqueador (propranolol) para los síntomas.</tspan><tspan x="58.0" dy="18">• Pedir TRAb (anticuerpos contra el receptor de TSH) o gammagrafía para la causa; vigilar agranulocitosis (fiebre, dolor de garganta).</tspan></text><text x="58.0" y="1071.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ATA, hipertiroidismo (2016); ETA, enfermedad de Graves (2018).</tspan></text></svg>