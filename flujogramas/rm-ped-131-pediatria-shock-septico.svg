<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1292" viewBox="0 0 1000 1292" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En el shock séptico frío refractario a dopamina el siguiente fármaco es la adrenalina"><title>En el shock séptico frío refractario a dopamina el siguiente fármaco es la adrenalina</title><rect x="0.75" y="0.75" width="998.5" height="1290.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · shock séptico</tspan></text><rect x="347.0" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="396.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="396.0" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Shock séptico pediátrico</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Sepsis con disfunción cardiovascular que persiste tras fluidos.</tspan><tspan x="58.0" dy="17">Frío: gasto bajo y vasoconstricción; caliente: vasodilatación.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 2 años con celulitis</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">FC 196, PA 50/35, extremidades frías, llenado capilar</tspan><tspan x="640.0" dy="16">lento.</tspan><tspan x="640.0" dy="16">Ya recibió fluidos y dopamina sin mejoría.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ FÁRMACO SE USA SEGÚN EL TIPO DE SHOCK</tspan></text><rect x="40.0" y="285.0" width="920.0" height="127.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="285.0" width="108.0" height="127.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="348.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Shock frío (este</tspan><tspan x="94.0" dy="14">caso)</tspan></text><rect x="40.0" y="412.0" width="920.0" height="127.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="412.0" width="108.0" height="127.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="479.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Shock caliente</tspan></text><rect x="40.0" y="539.0" width="920.0" height="127.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="539.0" width="108.0" height="127.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="602.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Otros usos o</tspan><tspan x="94.0" dy="14">tercera línea</tspan></text><line x1="307.2" y1="348.5" x2="314.2" y2="348.5" stroke="#0f766e" stroke-width="2.2"/><line x1="314.2" y1="348.5" x2="314.2" y2="459.5" stroke="#0f766e" stroke-width="2.2"/><line x1="314.2" y1="459.5" x2="312.2" y2="459.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="312.2,464.5 312.2,454.5 321.2,459.5" fill="#0f766e"/><line x1="470.4" y1="459.5" x2="477.4" y2="459.5" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="459.5" x2="477.4" y2="595.0" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="595.0" x2="475.4" y2="595.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="475.4,600.0 475.4,590.0 484.4,595.0" fill="#0f766e"/><line x1="633.6" y1="595.0" x2="640.6" y2="595.0" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="595.0" x2="640.6" y2="594.5" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="594.5" x2="638.6" y2="594.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="638.6,599.5 638.6,589.5 647.6,594.5" fill="#0f766e"/><line x1="796.8" y1="594.5" x2="803.8" y2="594.5" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="594.5" x2="803.8" y2="586.5" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="586.5" x2="801.8" y2="586.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="801.8,591.5 801.8,581.5 810.8,586.5" fill="#0f766e"/><rect x="158.0" y="298.0" width="149.2" height="101.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="168.0" y="314.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Adrenalina</tspan></text><text x="168.0" y="331.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Primera línea; vía</tspan><tspan x="168.0" dy="14.5">periférica o intraósea</tspan><tspan x="168.0" dy="14.5">mientras llega el acceso</tspan><tspan x="168.0" dy="14.5">central</tspan></text><circle cx="158.0" cy="298.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="302.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="321.2" y="425.0" width="149.2" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="331.2" y="441.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Noradrenalina</tspan></text><text x="331.2" y="458.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Vasodilatación con pulsos</tspan><tspan x="331.2" dy="14.5">saltones</tspan></text><circle cx="321.2" cy="425.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="321.2" y="429.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="321.2" dy="0">2</tspan></text><rect x="484.4" y="552.0" width="149.2" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="494.4" y="568.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Milrinona o</tspan><tspan x="494.4" dy="16">dobutamina</tspan></text><text x="494.4" y="601.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Bajo gasto con presión</tspan><tspan x="494.4" dy="14.5">arterial adecuada</tspan></text><circle cx="484.4" cy="552.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="484.4" y="556.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="484.4" dy="0">3</tspan></text><rect x="647.6" y="552.0" width="149.2" height="85.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="657.6" y="568.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Vasopresina</tspan></text><text x="657.6" y="585.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Shock vasopléjico</tspan><tspan x="657.6" dy="14.5">resistente a</tspan><tspan x="657.6" dy="14.5">catecolaminas</tspan></text><circle cx="647.6" cy="552.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="647.6" y="556.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="647.6" dy="0">4</tspan></text><rect x="810.8" y="552.0" width="149.2" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="820.8" y="568.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Atropina</tspan></text><text x="820.8" y="585.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Solo bradicardia de</tspan><tspan x="820.8" dy="14.5">origen vagal</tspan></text><circle cx="810.8" cy="552.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="810.8" y="556.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="810.8" dy="0">5</tspan></text><rect x="40.0" y="684.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="710.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Shock frío refractario a dopamina = adrenalina</tspan></text><text x="60.0" y="729.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La vasopresina es de tercera línea y la atropina no sube la presión.</tspan></text><text x="40.0" y="790.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SHOCK SÉPTICO PEDIÁTRICO SEGÚN LA PERFUSIÓN</tspan></text><rect x="40.0" y="802.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="821.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Tipo</tspan></text><text x="250.0" y="821.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Hallazgos</tspan></text><text x="610.0" y="821.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Fármaco de elección</tspan></text><rect x="40.0" y="831.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="850.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Frío</tspan></text><text x="250.0" y="850.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Extremidades frías, llenado capilar lento, pulsos débiles</tspan></text><text x="610.0" y="850.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Adrenalina</tspan></text><rect x="140.6" y="834.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="186.0" y="849.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="186.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="860.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="879.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Caliente</tspan></text><text x="250.0" y="879.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Extremidades tibias, pulsos saltones, llenado rápido</tspan></text><text x="610.0" y="879.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Noradrenalina</tspan></text><text x="40.0" y="905.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Surviving Sepsis Campaign pediátrica 2020. Siempre con fluidos, antibiótico en la primera hora y control del foco.</tspan></text><text x="40.0" y="952.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="962.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="984.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="965.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="984.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Adrenalina</tspan></text><text x="435.0" y="984.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Atropina</tspan></text><text x="585.0" y="984.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Milrinona</tspan></text><text x="735.0" y="984.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Vasopresina</tspan></text><text x="885.0" y="984.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Dobutamina</tspan></text><rect x="40.0" y="999.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="999.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1036.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Siguiente medida?</tspan></text><text x="285.0" y="1020.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: inotrópico de</tspan><tspan x="285.0" dy="16">primera línea en el</tspan><tspan x="285.0" dy="16">shock frío</tspan></text><text x="435.0" y="1028.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: se reserva para</tspan><tspan x="435.0" dy="16">bradicardia vagal</tspan></text><text x="585.0" y="1020.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: inodilatador si hay</tspan><tspan x="585.0" dy="16">bajo gasto con PA</tspan><tspan x="585.0" dy="16">adecuada</tspan></text><text x="735.0" y="1028.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: tercera línea en</tspan><tspan x="735.0" dy="16">shock vasopléjico</tspan></text><text x="885.0" y="1028.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no es el paso en</tspan><tspan x="885.0" dy="16">hipotensión refractaria</tspan></text><rect x="40.0" y="962.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1089.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1117.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1139.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Shock frío: taquicardia, hipotensión, extremidades frías y llenado capilar lento. La Campaña Sobrevivir a la Sepsis 2020 elige adrenalina como primera</tspan><tspan x="58.0" dy="18">   línea.</tspan><tspan x="58.0" dy="18">• Shock caliente (pulsos saltones, vasodilatación): noradrenalina. La vasopresina es de tercera línea en el shock vasopléjico resistente.</tspan><tspan x="58.0" dy="18">• Milrinona y dobutamina son inodilatadores para bajo gasto con presión adecuada; la atropina se reserva para bradicardia vagal.</tspan><tspan x="58.0" dy="18">• Antibiótico de amplio espectro en la primera hora (cubrir S. aureus y estreptococos en foco cutáneo) y control del foco. La adrenalina puede darse por vía</tspan><tspan x="58.0" dy="18">   periférica o intraósea.</tspan></text><text x="58.0" y="1251.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Weiss y cols., Surviving Sepsis Campaign pediátrica (Pediatr Crit Care Med 2020); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>