<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1017" viewBox="0 0 1000 1017" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El dolor referido en el hombro izquierdo por rotura esplénica es el signo de Kehr"><title>El dolor referido en el hombro izquierdo por rotura esplénica es el signo de Kehr</title><rect x="0.75" y="0.75" width="998.5" height="1015.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Trauma abdominal · signo de Kehr</tspan></text><rect x="403.7" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="446.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="446.9" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Rotura esplénica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El bazo es, con el hígado, el órgano más lesionado en el trauma abdominal cerrado.</tspan><tspan x="58.0" dy="17">La sangre libre irrita el peritoneo del diafragma izquierdo.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cómo se llama el signo que sugiere rotura esplénica?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL BAZO ROTO AL DOLOR EN EL HOMBRO</tspan></text><text x="40.0" y="265.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="430"><tspan x="40.0" dy="0">MECANISMO</tspan></text><text x="516.0" y="265.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="444"><tspan x="516.0" dy="0">QUÉ SE OBSERVA</tspan></text><rect x="40.0" y="275.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="304.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="309.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><text x="84.0" y="301.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">El bazo se rompe en un trauma abdominal cerrado</tspan></text><text x="84.0" y="318.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Es el órgano más lesionado junto con el hígado</tspan></text><line x1="476.0" y1="304.5" x2="503.0" y2="304.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,299.5 502.0,309.5 510.0,304.5" fill="#ea580c"/><rect x="516.0" y="277.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="301.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Hemoperitoneo</tspan></text><text x="530.0" y="318.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Sangre libre en el abdomen</tspan></text><line x1="255.0" y1="336.0" x2="255.0" y2="349.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,348.0 260.0,348.0 255.0,356.0" fill="#0f766e"/><rect x="40.0" y="358.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="387.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">2</tspan></text><text x="84.0" y="384.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">La sangre irrita el peritoneo del diafragma izquierdo</tspan></text><text x="84.0" y="401.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">El diafragma se inerva por el nervio frénico (C3-C5)</tspan></text><line x1="476.0" y1="387.5" x2="503.0" y2="387.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,382.5 502.0,392.5 510.0,387.5" fill="#ea580c"/><rect x="516.0" y="360.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="384.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Dolor en hipocondrio izquierdo</tspan></text><text x="530.0" y="401.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Hipotensión y taquicardia</tspan></text><line x1="255.0" y1="419.0" x2="255.0" y2="432.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,431.0 260.0,431.0 255.0,439.0" fill="#0f766e"/><rect x="40.0" y="441.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="470.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="475.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">3</tspan></text><text x="84.0" y="467.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">El dolor se refiere al hombro por la misma raíz nerviosa</tspan></text><text x="84.0" y="484.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">La piel del hombro comparte C3-C5</tspan></text><line x1="476.0" y1="470.5" x2="503.0" y2="470.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,465.5 502.0,475.5 510.0,470.5" fill="#ea580c"/><rect x="516.0" y="443.0" width="444.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="530.0" y="467.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Signo de Kehr</tspan></text><text x="530.0" y="484.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Hombro izquierdo; peor en Trendelenburg</tspan></text><line x1="255.0" y1="502.0" x2="255.0" y2="515.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,514.0 260.0,514.0 255.0,522.0" fill="#0f766e"/><rect x="40.0" y="524.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="553.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="558.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">4</tspan></text><text x="84.0" y="550.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">El manejo depende de la hemodinamia</tspan></text><text x="84.0" y="567.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">FAST positiva e inestable: laparotomía</tspan></text><line x1="476.0" y1="553.5" x2="503.0" y2="553.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,548.5 502.0,558.5 510.0,553.5" fill="#ea580c"/><rect x="516.0" y="526.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="550.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Estable: tomografía</tspan></text><text x="530.0" y="567.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Vigilancia o embolización</tspan></text><rect x="40.0" y="601.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="627.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Hombro izquierdo doloroso + trauma = signo de Kehr</tspan></text><text x="60.0" y="646.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Obturador y psoas son de apendicitis; Grey Turner y Cullen, de pancreatitis.</tspan></text><text x="40.0" y="713.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="723.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="745.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="726.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Kehr</tspan></text><text x="435.0" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Obturador</tspan></text><text x="585.0" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Grey Turner</tspan></text><text x="735.0" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Cullen</tspan></text><text x="885.0" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Psoas</tspan></text><rect x="40.0" y="760.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="760.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="789.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Signo de rotura</tspan><tspan x="54.0" dy="16">esplénica?</tspan></text><text x="285.0" y="789.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: dolor referido en el</tspan><tspan x="285.0" dy="16">hombro izquierdo</tspan></text><text x="435.0" y="781.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es una maniobra</tspan><tspan x="435.0" dy="16">de la apendicitis</tspan><tspan x="435.0" dy="16">pélvica</tspan></text><text x="585.0" y="781.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: equimosis en</tspan><tspan x="585.0" dy="16">flancos de la</tspan><tspan x="585.0" dy="16">pancreatitis</tspan></text><text x="735.0" y="789.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: equimosis</tspan><tspan x="735.0" dy="16">periumbilical</tspan></text><text x="885.0" y="781.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es una maniobra</tspan><tspan x="885.0" dy="16">de la apendicitis</tspan><tspan x="885.0" dy="16">retrocecal</tspan></text><rect x="40.0" y="723.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="850.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="878.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="900.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Mecanismo: sangre bajo el diafragma, nervio frénico (C3-C5) y dolor referido en la piel del hombro izquierdo; se acentúa en Trendelenburg.</tspan><tspan x="58.0" dy="18">• No es exclusivo del bazo: también aparece en el embarazo ectópico roto, la lesión hepática y la lesión diafragmática.</tspan><tspan x="58.0" dy="18">• Obturador y psoas son maniobras de la apendicitis; Grey Turner y Cullen son equimosis de la pancreatitis necrohemorrágica o del hemoperitoneo.</tspan><tspan x="58.0" dy="18">• Conducta: inestable con FAST positiva, laparotomía; estable, tomografía con vigilancia o embolización según el grado.</tspan></text><text x="58.0" y="976.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: WSES, lesión esplénica: clasificación y guía en adultos y niños (World J Emerg Surg 2017); ATLS, 11.ª ed. (2025); Sabiston, 21.ª ed. (2021).</tspan></text></svg>