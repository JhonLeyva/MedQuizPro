normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Modelo de Atención Integral basado en Familia y Comunidad.</tspan><tspan x="58.0" dy="17">Visión biopsicosocial y multidimensional.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Definición dada</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Provisión continua y con calidad de promoción,</tspan><tspan x="640.0" dy="16">prevención, recuperación y rehabilitación para la</tspan><tspan x="640.0" dy="16">persona en su familia y comunidad.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ CONCEPTO ENCAJA CON LA DEFINICIÓN</tspan></text><rect x="40.0" y="285.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="307.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="170"><tspan x="54.0" dy="0">CONCEPTO</tspan></text><text x="412.5" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="345"><tspan x="412.5" dy="0">Qué describe</tspan></text><text x="777.5" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="345"><tspan x="777.5" dy="0">¿Coincide con la definición?</tspan></text><rect x="40.0" y="325.0" width="184.0" height="74.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="351.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Atención integral de</tspan><tspan x="54.0" dy="17">salud</tspan></text><text x="54.0" y="385.0" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Atención integral de salud</tspan></text><rect x="233.0" y="325.0" width="359.0" height="74.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="245.0" y="350.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Provisión continua y de calidad, de promoción a</tspan><tspan x="245.0" dy="16">rehabilitación</tspan></text><text x="245.0" y="382.5" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Descripción literal</tspan></text><rect x="598.0" y="325.0" width="359.0" height="74.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="610.0" y="358.5" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Sí (este caso)</tspan></text><text x="610.0" y="374.5" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Persona, familia y comunidad</tspan></text><rect x="856.2" y="314.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="901.6" y="329.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="901.6" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="405.0" width="184.0" height="74.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="431.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Modelo de atención en</tspan><tspan x="54.0" dy="17">salud</tspan></text><text x="54.0" y="465.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Modelo de atención en salud</tspan></text><rect x="233.0" y="405.0" width="359.0" height="74.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="245.0" y="438.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Forma de organizar la atención</tspan></text><text x="245.0" y="454.5" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Marco general</tspan></text><rect x="598.0" y="405.0" width="359.0" height="74.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="610.0" y="438.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">No</tspan></text><text x="610.0" y="454.5" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">No define la provisión</tspan></text><rect x="40.0" y="485.0" width="184.0" height="74.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="511.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Atención primaria de</tspan><tspan x="54.0" dy="17">salud</tspan></text><text x="54.0" y="545.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Atención primaria de salud</tspan></text><rect x="233.0" y="485.0" width="359.0" height="74.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="245.0" y="518.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Estrategia del primer nivel de atención</tspan></text><text x="245.0" y="534.5" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Puerta de entrada</tspan></text><rect x="598.0" y="485.0" width="359.0" height="74.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="610.0" y="518.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">No</tspan></text><text x="610.0" y="534.5" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Es un nivel, no la definición</tspan></text><text x="44.0" y="581.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Atención orientada a la comunidad y servicio de salud integral tampoco coinciden con la definición del MAIS-BFC.</tspan></text><text x="40.0" y="629.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="639.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="670.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="661.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Servicio de salud</tspan><tspan x="285.0" dy="17">integral</tspan></text><text x="435.0" y="661.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Modelo de atención</tspan><tspan x="435.0" dy="17">en salud</tspan></text><text x="585.0" y="661.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Atención orientada</tspan><tspan x="585.0" dy="17">a la comunidad</tspan></text><rect x="663.0" y="642.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="661.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Atención integral de</tspan><tspan x="735.0" dy="17">salud</tspan></text><text x="885.0" y="661.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Atención primaria</tspan><tspan x="885.0" dy="17">de salud</tspan></text><rect x="40.0" y="693.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="693.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="730.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿A qué corresponde?</tspan></text><text x="285.0" y="722.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: término genérico</tspan><tspan x="285.0" dy="16">sin esa definición</tspan></text><text x="435.0" y="714.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: organiza el</tspan><tspan x="435.0" dy="16">sistema, no define la</tspan><tspan x="435.0" dy="16">atención</tspan></text><text x="585.0" y="722.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: se limita a la</tspan><tspan x="585.0" dy="16">comunidad</tspan></text><text x="735.0" y="722.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: es la definición</tspan><tspan x="735.0" dy="16">literal del modelo</tspan></text><text x="885.0" y="722.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es una estrategia</tspan><tspan x="885.0" dy="16">de primer nivel</tspan></text><rect x="40.0" y="639.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="783.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="811.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="833.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Atención integral: parte de las necesidades de salud de la persona en su entorno, no de la enfermedad aislada.</tspan><tspan x="58.0" dy="18">• Propone acciones coherentes dirigidas al individuo, la familia y la comunidad, con corresponsabilidad de salud, sociedad y otros sectores.</tspan><tspan x="58.0" dy="18">• Modelo de atención: organiza cómo se brinda; atención primaria: estrategia del primer nivel; atención orientada a la comunidad: solo el ámbito</tspan><tspan x="58.0" dy="18">   comunitario.</tspan><tspan x="58.0" dy="18">• Declaración de Astaná (2018): refuerza la atención primaria como base del sistema.</tspan></text><text x="58.0" y="927.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA, MAIS-BFC (RM 464-2011/MINSA); OMS y UNICEF, Declaración de Astaná (2018).</tspan></text></svg>