lescente, joven, adulto y adulto mayor.</tspan><tspan x="58.0" dy="17">Cada etapa tiene su paquete de atención.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de intervalo</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es el intervalo de edad de la etapa adolescente?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ETAPAS DE VIDA SEGÚN LA EDAD</tspan></text><rect x="40.0" y="253.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="279.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Edad en años</tspan></text><text x="60.0" y="298.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Cada etapa tiene su propio paquete de atención.</tspan></text><rect x="70.0" y="362.0" width="147.4" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="143.7" y="387.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="137"><tspan x="143.7" dy="0">0 a 11</tspan></text><rect x="217.4" y="362.0" width="73.7" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="254.3" y="387.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="64"><tspan x="254.3" dy="0">12 a 17</tspan></text><rect x="291.1" y="362.0" width="147.4" height="40.0" rx="6" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/><text x="364.9" y="387.0" font-size="12" font-weight="800" font-style="normal" fill="#c2410c" text-anchor="middle" data-max="137"><tspan x="364.9" dy="0">18 a 29</tspan></text><rect x="438.6" y="362.0" width="368.6" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="622.9" y="387.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="359"><tspan x="622.9" dy="0">30 a 59</tspan></text><rect x="807.1" y="362.0" width="122.9" height="40.0" rx="6" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/><text x="868.6" y="387.0" font-size="12" font-weight="800" font-style="normal" fill="#c2410c" text-anchor="middle" data-max="113"><tspan x="868.6" dy="0">60 +</tspan></text><line x1="70.0" y1="402.0" x2="70.0" y2="410.0" stroke="#64748b" stroke-width="1.5"/><text x="70.0" y="424.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="70.0" dy="0">0 a</tspan></text><line x1="217.4" y1="402.0" x2="217.4" y2="410.0" stroke="#64748b" stroke-width="1.5"/><text x="217.4" y="424.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="217.4" dy="0">12 a</tspan></text><line x1="291.1" y1="402.0" x2="291.1" y2="410.0" stroke="#64748b" stroke-width="1.5"/><text x="291.1" y="424.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="291.1" dy="0">18 a</tspan></text><line x1="438.6" y1="402.0" x2="438.6" y2="410.0" stroke="#64748b" stroke-width="1.5"/><text x="438.6" y="424.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="438.6" dy="0">30 a</tspan></text><line x1="807.1" y1="402.0" x2="807.1" y2="410.0" stroke="#64748b" stroke-width="1.5"/><text x="807.1" y="424.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="807.1" dy="0">60 a</tspan></text><line x1="930.0" y1="402.0" x2="930.0" y2="410.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="424.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">70 a</tspan></text><polygon points="245.3,348.0 263.3,348.0 254.3,360.0" fill="#ea580c"/><rect x="156.0" y="322.0" width="196.6" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="254.3" y="337.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="185"><tspan x="254.3" dy="0">◆ ADOLESCENTE: 12 A 17 AÑOS</tspan></text><text x="40.0" y="470.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ DECIDE EL INTERVALO</tspan></text><rect x="40.0" y="480.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="481.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="504.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Modelo peruano (MAIS-BFC)</tspan></text><text x="58.0" y="525.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">12 a 17 años, 11 meses y 29 días</tspan></text><rect x="351.3" y="480.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="481.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="504.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Definición de la OMS</tspan></text><text x="369.3" y="525.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">10 a 19 años; no es el rango del examen</tspan></text><rect x="662.7" y="480.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="481.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="504.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Opciones con 11 o 18 años</tspan></text><text x="680.7" y="525.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Mezclan niñez o juventud con la adolescencia</tspan></text><text x="40.0" y="583.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ETAPAS DE VIDA EN EL MAIS-BFC</tspan></text><rect x="40.0" y="595.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="614.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Etapa</tspan></text><text x="250.0" y="614.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="704"><tspan x="250.0" dy="0">Edad</tspan></text><rect x="40.0" y="624.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="643.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Niña y niño</tspan></text><text x="250.0" y="643.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="704"><tspan x="250.0" dy="0">0 a 11 años</tspan></text><rect x="40.0" y="653.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="672.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Adolescente</tspan></text><text x="250.0" y="672.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="704"><tspan x="250.0" dy="0">12 a 17 años, 11 meses y 29 días</tspan></text><rect x="140.6" y="656.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="186.0" y="671.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="186.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="682.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="701.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Joven</tspan></text><text x="250.0" y="701.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="704"><tspan x="250.0" dy="0">18 a 29 años</tspan></text><rect x="40.0" y="711.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="730.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Adulto</tspan></text><text x="250.0" y="730.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="704"><tspan x="250.0" dy="0">30 a 59 años</tspan></text><rect x="40.0" y="740.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="759.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Adulto mayor</tspan></text><text x="250.0" y="759.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="704"><tspan x="250.0" dy="0">60 años a más</tspan></text><text x="40.0" y="809.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="819.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="841.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="841.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">11-17</tspan></text><text x="435.0" y="841.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">12-18</tspan></text><rect x="513.0" y="822.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="841.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">12-17</tspan></text><text x="735.0" y="841.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">13-18</tspan></text><text x="885.0" y="841.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">11-18</tspan></text><rect x="40.0" y="856.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="856.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="885.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Intervalo adolescente?</tspan></text><text x="285.0" y="877.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: incluye 11 años, de</tspan><tspan x="285.0" dy="16">niñez</tspan></text><text x="435.0" y="877.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: llega a 18, de</tspan><tspan x="435.0" dy="16">joven</tspan></text><text x="585.0" y="885.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: 12 a 17 años</tspan></text><text x="735.0" y="877.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: empieza en 13 y</tspan><tspan x="735.0" dy="16">llega a 18</tspan></text><text x="885.0" y="885.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: incluye 11 y 18</tspan></text><rect x="40.0" y="819.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="930.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="958.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="980.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Niña y niño: 0 a 11 años. Adolescente: 12 a 17 años, 11 meses y 29 días. Joven: 18 a 29. Adulto: 30 a 59. Adulto mayor: 60 años a más.</tspan><tspan x="58.0" dy="18">• Dos subgrupos adolescentes: 12 a 14 años y 15 a 17 años 11 meses 29 días (maduración puberal, autonomía y riesgos).</tspan><tspan x="58.0" dy="18">• Riesgos predominantes: embarazo, violencia, consumo de sustancias, salud mental y conductas sexuales de riesgo.</tspan><tspan x="58.0" dy="18">• La OMS define adolescencia de 10 a 19 años; el examen pide el rango del modelo peruano.</tspan></text><text x="58.0" y="1056.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA, MAIS-BFC (RM 464-2011/MINSA); OMS, Salud del adolescente y del adulto joven, nota descriptiva (2024).</tspan></text></svg>