<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1105" viewBox="0 0 1000 1105" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Mujer con 5 meses de astenia, diarrea y pérdida de peso, hipotensa, con piel hiperpigmentada, hiperpotasemia, hiponatremia e hipoglucemia: enfermedad de Addison"><title>Mujer con 5 meses de astenia, diarrea y pérdida de peso, hipotensa, con piel hiperpigmentada, hiperpotasemia, hiponatremia e hipoglucemia: enfermedad de Addison</title><rect x="0.75" y="0.75" width="998.5" height="1103.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Insuficiencia suprarrenal primaria</tspan></text><rect x="399.6" y="32.0" width="155.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="477.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="139"><tspan x="477.3" dy="0">ENDOCRINOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Enfermedad de Addison</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Destrucción de la corteza suprarrenal (autoinmune; en el Perú también tuberculosis): falta</tspan><tspan x="58.0" dy="17">cortisol y aldosterona.</tspan><tspan x="58.0" dy="17">La hipófisis sube la ACTH (y la MSH que viene con ella): la piel se oscurece.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 35 años, 5 meses</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Astenia, diarrea y pérdida de peso.</tspan><tspan x="640.0" dy="16">PA 85/60, piel hiperpigmentada; K alto, Na bajo y</tspan><tspan x="640.0" dy="16">glucosa baja.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DE LA GLÁNDULA DAÑADA A LO QUE VES</tspan></text><text x="40.0" y="297.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="430"><tspan x="40.0" dy="0">MECANISMO</tspan></text><text x="516.0" y="297.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="444"><tspan x="516.0" dy="0">EN ESTE CASO</tspan></text><rect x="40.0" y="307.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="336.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="341.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><text x="84.0" y="333.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Se destruye la corteza suprarrenal</tspan></text><text x="84.0" y="350.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Autoinmune o tuberculosis</tspan></text><line x1="476.0" y1="336.5" x2="503.0" y2="336.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,331.5 502.0,341.5 510.0,336.5" fill="#ea580c"/><rect x="516.0" y="309.0" width="444.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="530.0" y="333.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">5 meses de evolución</tspan></text><text x="530.0" y="350.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Astenia y baja de peso</tspan></text><line x1="255.0" y1="368.0" x2="255.0" y2="381.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,380.0 260.0,380.0 255.0,388.0" fill="#0f766e"/><rect x="40.0" y="390.0" width="430.0" height="116.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="448.0" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="452.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">2</tspan></text><text x="84.0" y="444.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Falta cortisol</tspan></text><text x="84.0" y="461.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Menos glucosa y menos tono vascular</tspan></text><line x1="476.0" y1="448.0" x2="503.0" y2="448.0" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,443.0 502.0,453.0 510.0,448.0" fill="#ea580c"/><rect x="516.0" y="390.0" width="444.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="530.0" y="414.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Hipoglucemia</tspan></text><text x="530.0" y="431.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0"></tspan></text><rect x="516.0" y="451.0" width="444.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="530.0" y="475.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">PA 85/60</tspan></text><text x="530.0" y="492.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Diarrea, astenia</tspan></text><line x1="255.0" y1="508.0" x2="255.0" y2="521.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,520.0 260.0,520.0 255.0,528.0" fill="#0f766e"/><rect x="40.0" y="530.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="559.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="564.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">3</tspan></text><text x="84.0" y="556.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Falta aldosterona</tspan></text><text x="84.0" y="573.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Se pierde sodio y se retiene potasio</tspan></text><line x1="476.0" y1="559.5" x2="503.0" y2="559.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,554.5 502.0,564.5 510.0,559.5" fill="#ea580c"/><rect x="516.0" y="532.0" width="444.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="530.0" y="556.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Hiponatremia e hiperpotasemia</tspan></text><text x="530.0" y="573.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0"></tspan></text><line x1="255.0" y1="591.0" x2="255.0" y2="604.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,603.0 260.0,603.0 255.0,611.0" fill="#0f766e"/><rect x="40.0" y="613.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="642.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="647.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">4</tspan></text><text x="84.0" y="639.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">ACTH muy alta</tspan></text><text x="84.0" y="656.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Arrastra MSH (melanocitos)</tspan></text><line x1="476.0" y1="642.5" x2="503.0" y2="642.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,637.5 502.0,647.5 510.0,642.5" fill="#ea580c"/><rect x="516.0" y="615.0" width="444.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="530.0" y="639.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Piel hiperpigmentada</tspan></text><text x="530.0" y="656.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Pliegues, encías, cicatrices</tspan></text><rect x="40.0" y="690.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="716.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Hipotensión + hiperpigmentación + Na bajo + K alto + glucosa baja = Addison</tspan></text><text x="60.0" y="735.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Hidrocortisona + fludrocortisona.</tspan></text><text x="40.0" y="802.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="812.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="843.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="815.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="834.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Enfermedad de</tspan><tspan x="285.0" dy="17">Addison</tspan></text><text x="435.0" y="843.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hiperaldosteronismo</tspan></text><text x="585.0" y="843.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Feocromocitoma</tspan></text><text x="735.0" y="834.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hipotiroidismo</tspan><tspan x="735.0" dy="17">primario</tspan></text><text x="885.0" y="843.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hipoparatiroidismo</tspan></text><rect x="40.0" y="866.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="866.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="903.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="887.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: falta cortisol y</tspan><tspan x="285.0" dy="16">aldosterona + piel</tspan><tspan x="285.0" dy="16">oscura</tspan></text><text x="435.0" y="895.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: HTA con potasio</tspan><tspan x="435.0" dy="16">bajo</tspan></text><text x="585.0" y="895.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: crisis de HTA y</tspan><tspan x="585.0" dy="16">taquicardia</tspan></text><text x="735.0" y="887.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no explica el</tspan><tspan x="735.0" dy="16">potasio alto ni la piel</tspan><tspan x="735.0" dy="16">oscura</tspan></text><text x="885.0" y="903.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: daría calcio bajo</tspan></text><rect x="40.0" y="812.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="956.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="984.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1006.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Confirmar: cortisol matinal bajo y ACTH alta; prueba de estímulo con ACTH (cosintropina).</tspan><tspan x="58.0" dy="18">• Crisis addisoniana: hidrocortisona 100 mg EV + suero salino; no esperar los resultados.</tspan><tspan x="58.0" dy="18">• Crónico: hidrocortisona + fludrocortisona; doblar la dosis si hay fiebre o estrés.</tspan></text><text x="58.0" y="1064.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Endocrine Society, insuficiencia suprarrenal primaria (2016); Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>