<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="682" viewBox="0 0 1000 682" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Destellos y cortina en el campo visual"><title>Destellos y cortina en el campo visual</title><rect x="0.75" y="0.75" width="998.5" height="680.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">OFTALMOLOGÍA ENAM: DESPRENDIMIENTO DE RETINA</tspan></text><rect x="536.7" y="32.0" width="108.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="590.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="92"><tspan x="590.7" dy="0">OFTALMOLOGÍA</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Desprendimiento de retina</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La retina se separa y deja de funcionar</tspan><tspan x="58.0" dy="17">Fotopsias, moscas volantes y sombra en cortina; la miopía alta es factor de riesgo</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 54 años con miopía severa</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">1 día de destellos, moscas volantes</tspan><tspan x="640.0" dy="16">Sombra como cortina en el campo visual · menos</tspan><tspan x="640.0" dy="16">agudeza</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SÍNTOMAS DE ALARMA</tspan></text><rect x="40.0" y="285.0" width="540.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="56.0" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="start" data-max="430"><tspan x="56.0" dy="0">SÍNTOMAS DEL CASO</tspan></text><text x="562.0" y="307.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">PUNTOS</tspan></text><rect x="40.0" y="319.0" width="540.0" height="34.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="326.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="341.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="340.5" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="420"><tspan x="86.0" dy="0">Fotopsias (destellos)</tspan></text><text x="562.0" y="341.0" font-size="13" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">✓</tspan></text><rect x="40.0" y="353.0" width="540.0" height="34.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="360.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="375.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="374.5" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="420"><tspan x="86.0" dy="0">Moscas volantes nuevas</tspan></text><text x="562.0" y="375.0" font-size="13" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">✓</tspan></text><rect x="40.0" y="387.0" width="540.0" height="34.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="394.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="409.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="408.5" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="420"><tspan x="86.0" dy="0">Sombra en cortina</tspan></text><text x="562.0" y="409.0" font-size="13" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">✓</tspan></text><rect x="40.0" y="421.0" width="540.0" height="34.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="428.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="443.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="442.5" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="420"><tspan x="86.0" dy="0">Miopía alta</tspan></text><text x="562.0" y="443.0" font-size="13" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">✓</tspan></text><rect x="40.0" y="455.0" width="540.0" height="40.0" rx="0" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="56.0" y="480.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="430"><tspan x="56.0" dy="0">Síntomas presentes</tspan></text><text x="562.0" y="481.0" font-size="16" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">4</tspan></text><rect x="40.0" y="285.0" width="540.0" height="210.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="664.0" cy="335.0" r="46" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/><text x="664.0" y="335.0" font-size="26" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="0"><tspan x="664.0" dy="0">4</tspan></text><text x="664.0" y="355.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="664.0" dy="0">de 4</tspan></text><text x="724.0" y="321.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="230"><tspan x="724.0" dy="0">INTERPRETACIÓN</tspan></text><text x="724.0" y="341.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="230"><tspan x="724.0" dy="0">Desprendimiento de retina:</tspan><tspan x="724.0" dy="17">urgencia</tspan></text><rect x="634.0" y="397.0" width="326.0" height="52.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="634.0" y="397.0" width="10.0" height="52.0" rx="4" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="656.0" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#10b981" text-anchor="start" data-max="100"><tspan x="656.0" dy="0">Sin cortina</tspan></text><text x="760.0" y="419.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Desprendimiento de vítreo</tspan></text><text x="760.0" y="437.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Fondo de ojo en 24-48 h</tspan></text><rect x="634.0" y="457.0" width="326.0" height="52.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><rect x="634.0" y="457.0" width="10.0" height="52.0" rx="4" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="656.0" y="479.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="100"><tspan x="656.0" dy="0">Con cortina</tspan></text><text x="760.0" y="479.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Desprendimiento de retina</tspan></text><text x="760.0" y="497.0" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Oftalmología urgente: cirugía</tspan></text><polygon points="614.0,474.0 614.0,492.0 630.0,483.0" fill="#f59e0b"/><rect x="852.6" y="446.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="898.0" y="461.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="898.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="533.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="561.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="583.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Si la mácula aún está aplicada, operar pronto preserva la visión central.</tspan><tspan x="58.0" dy="18">• Glaucoma agudo: dolor, ojo rojo, presión alta.</tspan><tspan x="58.0" dy="18">• La catarata avanza lentamente, sin destellos.</tspan></text><text x="58.0" y="641.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAO – Preferred Practice Pattern: posterior vitreous detachment, retinal breaks and lattice (2019)</tspan></text></svg>