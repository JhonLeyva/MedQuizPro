<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1058" viewBox="0 0 1000 1058" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El financiamiento del Seguro Integral de Salud se dirige a la demanda: paga por las prestaciones que reciben los asegurados"><title>El financiamiento del Seguro Integral de Salud se dirige a la demanda: paga por las prestaciones que reciben los asegurados</title><rect x="0.75" y="0.75" width="998.5" height="1056.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Aseguramiento · Seguro Integral de Salud</tspan></text><rect x="447.4" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="511.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="511.7" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">SIS</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Organismo público ejecutor del MINSA y IAFAS pública.</tspan><tspan x="58.0" dy="17">Ley 29344 de Aseguramiento Universal en Salud (TUO: DS 020-2014-SA).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de financiamiento</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿A qué se dirige el financiamiento del SIS?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">HACIA DÓNDE VA EL DINERO</tspan></text><rect x="40.0" y="253.0" width="920.0" height="112.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="253.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="309.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Oferta (no es el</tspan><tspan x="94.0" dy="14">caso)</tspan></text><rect x="40.0" y="365.0" width="920.0" height="112.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="365.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="421.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Demanda (este</tspan><tspan x="94.0" dy="14">caso)</tspan></text><rect x="40.0" y="477.0" width="920.0" height="112.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="477.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="533.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Contenido del</tspan><tspan x="94.0" dy="14">plan</tspan></text><line x1="307.2" y1="308.5" x2="314.2" y2="308.5" stroke="#ea580c" stroke-width="2.2"/><line x1="314.2" y1="308.5" x2="314.2" y2="420.5" stroke="#ea580c" stroke-width="2.2"/><line x1="314.2" y1="420.5" x2="312.2" y2="420.5" stroke="#ea580c" stroke-width="2.2"/><polygon points="312.2,425.5 312.2,415.5 321.2,420.5" fill="#ea580c"/><line x1="470.4" y1="420.5" x2="477.4" y2="420.5" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="420.5" x2="477.4" y2="421.0" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="421.0" x2="475.4" y2="421.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="475.4,426.0 475.4,416.0 484.4,421.0" fill="#0f766e"/><line x1="633.6" y1="421.0" x2="640.6" y2="421.0" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="421.0" x2="640.6" y2="524.5" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="524.5" x2="638.6" y2="524.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="638.6,529.5 638.6,519.5 647.6,524.5" fill="#0f766e"/><line x1="796.8" y1="524.5" x2="803.8" y2="524.5" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="524.5" x2="803.8" y2="524.5" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="524.5" x2="801.8" y2="524.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="801.8,529.5 801.8,519.5 810.8,524.5" fill="#0f766e"/><rect x="158.0" y="266.0" width="149.2" height="85.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="282.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Financiar la oferta</tspan></text><text x="168.0" y="299.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Infraestructura, equipos y</tspan><tspan x="168.0" dy="14.5">plazas del</tspan><tspan x="168.0" dy="14.5">establecimiento</tspan></text><circle cx="158.0" cy="266.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="270.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="321.2" y="378.0" width="149.2" height="85.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="331.2" y="394.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Financiar la demanda</tspan></text><text x="331.2" y="411.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Se paga por las</tspan><tspan x="331.2" dy="14.5">prestaciones que reciben</tspan><tspan x="331.2" dy="14.5">los afiliados</tspan></text><circle cx="321.2" cy="378.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="321.2" y="382.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="321.2" dy="0">2</tspan></text><rect x="484.4" y="378.0" width="149.2" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="494.4" y="394.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Transferencia al</tspan><tspan x="494.4" dy="16">establecimiento</tspan></text><text x="494.4" y="427.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Público o privado con</tspan><tspan x="494.4" dy="14.5">convenio</tspan></text><circle cx="484.4" cy="378.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="484.4" y="382.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="484.4" dy="0">3</tspan></text><rect x="647.6" y="490.0" width="149.2" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="657.6" y="506.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Plan Esencial (PEAS)</tspan></text><text x="657.6" y="523.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Incluye enfermedades</tspan><tspan x="657.6" dy="14.5">prevalentes y estrategias</tspan></text><circle cx="647.6" cy="490.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="647.6" y="494.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="647.6" dy="0">4</tspan></text><rect x="810.8" y="490.0" width="149.2" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="820.8" y="506.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Regímenes</tspan></text><text x="820.8" y="523.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Subsidiado y</tspan><tspan x="820.8" dy="14.5">semicontributivo</tspan></text><circle cx="810.8" cy="490.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="810.8" y="494.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="810.8" dy="0">5</tspan></text><rect x="40.0" y="607.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="633.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">SIS = financiamiento de la demanda</tspan></text><text x="60.0" y="652.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Enfermedades prevalentes y estrategias sanitarias son contenido del plan, no el destino del pago.</tspan></text><text x="40.0" y="719.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="729.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="760.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="760.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">La oferta</tspan></text><text x="435.0" y="751.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Los problemas</tspan><tspan x="435.0" dy="17">epidemiológicos</tspan></text><text x="585.0" y="751.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Las estrategias</tspan><tspan x="585.0" dy="17">sanitarias</tspan></text><rect x="663.0" y="732.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="760.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">La demanda</tspan></text><text x="885.0" y="751.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Enfermedades</tspan><tspan x="885.0" dy="17">prevalentes</tspan></text><rect x="40.0" y="783.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="783.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="820.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿A qué se dirige?</tspan></text><text x="285.0" y="812.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: sería subsidio a</tspan><tspan x="285.0" dy="16">infraestructura y plazas</tspan></text><text x="435.0" y="812.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: se cubren dentro</tspan><tspan x="435.0" dy="16">del plan</tspan></text><text x="585.0" y="812.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: se cubren dentro</tspan><tspan x="585.0" dy="16">del plan</tspan></text><text x="735.0" y="804.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: paga por</tspan><tspan x="735.0" dy="16">prestaciones de</tspan><tspan x="735.0" dy="16">asegurados</tspan></text><text x="885.0" y="812.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: se cubren dentro</tspan><tspan x="885.0" dy="16">del plan</tspan></text><rect x="40.0" y="729.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="873.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="901.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="923.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Administra el régimen subsidiado (financiamiento público total para pobreza y pobreza extrema) y el semicontributivo (aporte más subsidio).</tspan><tspan x="58.0" dy="18">• Cubre el Plan Esencial de Aseguramiento en Salud (PEAS).</tspan><tspan x="58.0" dy="18">• Mecanismo: transferencia al establecimiento, público o privado con convenio, por las prestaciones brindadas a sus afiliados: financia la demanda.</tspan><tspan x="58.0" dy="18">• Financiar la oferta sería subsidiar infraestructura y plazas; las estrategias sanitarias y las enfermedades prevalentes se cubren dentro del plan, no son el</tspan><tspan x="58.0" dy="18">   destino.</tspan></text><text x="58.0" y="1017.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Ley 29344 (2009) y TUO aprobado por DS 020-2014-SA; Seguro Integral de Salud, normativa en gob.pe.</tspan></text></svg>