<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1012" viewBox="0 0 1000 1012" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la tibia no desplazada con edema se espera 24 a 72 horas antes del yeso circular; antes, férula"><title>En la tibia no desplazada con edema se espera 24 a 72 horas antes del yeso circular; antes, férula</title><rect x="0.75" y="0.75" width="998.5" height="1010.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Traumatología · fractura de tibia sin desplazamiento</tspan></text><rect x="506.3" y="32.0" width="135.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="573.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="119"><tspan x="573.9" dy="0">TRAUMATOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Fractura diafisaria de tibia</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">No desplazada: puede tratarse sin cirugía.</tspan><tspan x="58.0" dy="17">Un yeso circular sobre el edema puede causar síndrome compartimental.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Tercio medio de tibia</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Sin desplazamiento y con edema marcado.</tspan><tspan x="640.0" dy="16">¿En qué horas se coloca el yeso?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SE INDICA SEGÚN LAS HORAS DESDE LA LESIÓN</tspan></text><rect x="40.0" y="269.0" width="920.0" height="34.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="52.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="134"><tspan x="52.0" dy="0">MEDIDA</tspan></text><text x="242.8" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="102"><tspan x="242.8" dy="0">0 a 9 h</tspan></text><text x="348.4" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="102"><tspan x="348.4" dy="0">10 a 18 h</tspan></text><text x="454.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="102"><tspan x="454.0" dy="0">19 a 23 h</tspan></text><text x="559.6" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="102"><tspan x="559.6" dy="0">24 a 72 h</tspan></text><text x="665.2" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="102"><tspan x="665.2" dy="0">72 a 96 h</tspan></text><text x="734.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="220"><tspan x="734.0" dy="0">REGLA</tspan></text><rect x="508.8" y="305.0" width="101.6" height="234.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/><rect x="40.0" y="309.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="331.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Férula posterior</tspan><tspan x="50.0" dy="16">abierta</tspan></text><line x1="198.0" y1="335.0" x2="710.0" y2="335.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="242.8" cy="330.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="242.8" y="334.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="242.8" dy="0">✓</tspan></text><text x="242.8" y="357.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="242.8" dy="0">Sí</tspan></text><circle cx="348.4" cy="330.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="348.4" y="334.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="348.4" dy="0">✓</tspan></text><text x="348.4" y="357.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="348.4" dy="0">Sí</tspan></text><circle cx="454.0" cy="330.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="454.0" y="334.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="454.0" dy="0">✓</tspan></text><text x="454.0" y="357.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="454.0" dy="0">Sí</tspan></text><rect x="730.0" y="309.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="339.0" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">Permite que el edema se expanda.</tspan></text><rect x="40.0" y="367.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="389.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Elevación, hielo y</tspan><tspan x="50.0" dy="16">analgesia</tspan></text><line x1="198.0" y1="393.0" x2="710.0" y2="393.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="242.8" cy="388.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="242.8" y="392.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="242.8" dy="0">✓</tspan></text><text x="242.8" y="415.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="242.8" dy="0">Sí</tspan></text><circle cx="348.4" cy="388.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="348.4" y="392.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="348.4" dy="0">✓</tspan></text><text x="348.4" y="415.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="348.4" dy="0">Sí</tspan></text><circle cx="454.0" cy="388.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="454.0" y="392.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="454.0" dy="0">✓</tspan></text><text x="454.0" y="415.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="454.0" dy="0">Sí</tspan></text><rect x="730.0" y="367.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="397.0" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">Control clínico a las pocas horas.</tspan></text><rect x="40.0" y="425.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="447.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Yeso circular</tspan><tspan x="50.0" dy="16">definitivo</tspan></text><line x1="198.0" y1="451.0" x2="710.0" y2="451.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="559.6" cy="446.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="559.6" y="450.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="559.6" dy="0">✓</tspan></text><text x="559.6" y="473.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="559.6" dy="0">Sí</tspan></text><circle cx="665.2" cy="446.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="665.2" y="450.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="665.2" dy="0">✓</tspan></text><text x="665.2" y="473.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="665.2" dy="0">Sí</tspan></text><rect x="730.0" y="425.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="447.5" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">Cuando el edema cede, sin dejarlo más</tspan><tspan x="740.0" dy="15">allá de 72 a 96 horas.</tspan></text><rect x="40.0" y="483.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="505.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Carga progresiva</tspan><tspan x="50.0" dy="16">con tutor funcional</tspan></text><line x1="198.0" y1="509.0" x2="710.0" y2="509.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="559.6" cy="504.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="559.6" y="508.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="559.6" dy="0">✓</tspan></text><text x="559.6" y="531.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="559.6" dy="0">Sí</tspan></text><circle cx="665.2" cy="504.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="665.2" y="508.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="665.2" dy="0">✓</tspan></text><text x="665.2" y="531.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="665.2" dy="0">Sí</tspan></text><rect x="730.0" y="483.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="513.0" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">Después del yeso circular.</tspan></text><rect x="506.0" y="294.0" width="107.3" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="559.6" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="559.6" dy="0">◆ 24 A 72 HORAS</tspan></text><text x="44.0" y="555.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="44.0" dy="0">✓ se indica · sin marca: no se indica en ese rango</tspan></text><rect x="40.0" y="579.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="605.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Yeso circular a las 24 a 72 horas</tspan></text><text x="60.0" y="624.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Antes del día 1 comprime el miembro edematoso; más allá de 72 a 96 horas retrasa la consolidación.</tspan></text><text x="40.0" y="691.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="701.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="723.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="723.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">10-18</tspan></text><text x="435.0" y="723.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">72-96</tspan></text><text x="585.0" y="723.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">01-09</tspan></text><rect x="663.0" y="704.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="723.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">24-72</tspan></text><text x="885.0" y="723.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">19-23</tspan></text><rect x="40.0" y="738.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="738.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="767.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Periodo para el yeso?</tspan></text><text x="285.0" y="759.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: el edema aún es</tspan><tspan x="285.0" dy="16">máximo</tspan></text><text x="435.0" y="759.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: se retrasa más de</tspan><tspan x="435.0" dy="16">lo necesario</tspan></text><text x="585.0" y="759.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: el edema aún es</tspan><tspan x="585.0" dy="16">máximo</tspan></text><text x="735.0" y="759.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: el edema cede y se</tspan><tspan x="735.0" dy="16">pone el yeso circular</tspan></text><text x="885.0" y="759.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: sigue dentro del</tspan><tspan x="885.0" dy="16">periodo de edema</tspan></text><rect x="40.0" y="701.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="812.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="840.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="862.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Primeras horas: férula posterior abierta, elevación del miembro, hielo, analgesia y control clínico a las pocas horas.</tspan><tspan x="58.0" dy="18">• Entre 24 y 72 horas, cuando cede el edema, se cambia a yeso circular definitivo con rodilla en ligera flexión y tobillo en neutro.</tspan><tspan x="58.0" dy="18">• Luego se pasa a carga progresiva con tutor funcional.</tspan><tspan x="58.0" dy="18">• Alerta: dolor creciente bajo el yeso, dolor al estirar los dedos o parestesias obligan a abrirlo; es la causa iatrogénica más frecuente de síndrome</tspan><tspan x="58.0" dy="18">   compartimental.</tspan></text><text x="58.0" y="956.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Rockwood and Green's Fractures in Adults, 9.ª ed. (2019); Campbell's Operative Orthopaedics, 14.ª ed. (2021); Schmidt AH, J Am Acad Orthop Surg 2020 (PMID</tspan><tspan x="58.0" dy="15">31977609).</tspan></text></svg>