<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1132" viewBox="0 0 1000 1132" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Dolor intenso y desproporcionado tras inmovilizar una fractura: síndrome compartimental"><title>Dolor intenso y desproporcionado tras inmovilizar una fractura: síndrome compartimental</title><rect x="0.75" y="0.75" width="998.5" height="1130.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Traumatología · síndrome compartimental</tspan></text><rect x="447.5" y="32.0" width="135.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="515.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="119"><tspan x="515.1" dy="0">TRAUMATOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Dolor desproporcionado</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Es la manifestación más temprana del síndrome compartimental agudo.</tspan><tspan x="58.0" dy="17">Aparece tras colocar férula o yeso en un miembro traumatizado.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 30 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Accidente de tránsito con trauma moderado del</tspan><tspan x="640.0" dy="16">miembro inferior derecho.</tspan><tspan x="640.0" dy="16">Se inmoviliza por sospecha de fractura y luego</tspan><tspan x="640.0" dy="16">presenta dolor intenso y desproporcionado.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ BUSCAR TRAS INMOVILIZAR UNA FRACTURA CON DOLOR DESPROPORCIONADO</tspan></text><rect x="40.0" y="301.0" width="602.0" height="34.0" rx="10" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.2"/><text x="56.0" y="323.0" font-size="11.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="452"><tspan x="56.0" dy="0">SIGNOS DEL SÍNDROME COMPARTIMENTAL</tspan></text><text x="626.0" y="323.0" font-size="10.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="end" data-max="100"><tspan x="626.0" dy="0">EN EL CASO</tspan></text><rect x="40.0" y="341.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,356.5 74.0,376.5 50.0,376.5" fill="#dc2626"/><text x="62.0" y="373.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="364.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Dolor desproporcionado que no cede con analgésicos</tspan></text><text x="84.0" y="381.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">El más temprano y característico</tspan></text><text x="626.0" y="371.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="400.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,415.5 74.0,435.5 50.0,435.5" fill="#dc2626"/><text x="62.0" y="432.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="423.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Dolor al estiramiento pasivo del músculo</tspan></text><text x="84.0" y="440.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Con compartimento tenso a la palpación</tspan></text><text x="626.0" y="430.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="459.0" width="602.0" height="53.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><polygon points="62.0,474.5 74.0,494.5 50.0,494.5" fill="#cbd5e1"/><text x="62.0" y="491.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="482.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Parestesias</tspan></text><text x="84.0" y="499.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Tardío: sufre el nervio</tspan></text><text x="626.0" y="489.5" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sin dato</tspan></text><rect x="40.0" y="518.0" width="602.0" height="53.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><polygon points="62.0,533.5 74.0,553.5 50.0,553.5" fill="#cbd5e1"/><text x="62.0" y="550.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="541.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Palidez y parálisis</tspan></text><text x="84.0" y="558.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Tardíos</tspan></text><text x="626.0" y="548.5" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sin dato</tspan></text><rect x="40.0" y="577.0" width="602.0" height="53.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><polygon points="62.0,592.5 74.0,612.5 50.0,612.5" fill="#cbd5e1"/><text x="62.0" y="609.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="600.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Ausencia de pulso</tspan></text><text x="84.0" y="617.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Muy tardío; un pulso presente no lo descarta</tspan></text><text x="626.0" y="607.5" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sin dato</tspan></text><rect x="660.0" y="301.0" width="300.0" height="329.0" rx="12" fill="#dc2626" stroke="none" stroke-width="1.5"/><text x="676.0" y="325.0" font-size="10.5" font-weight="800" font-style="normal" fill="#fecaca" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">CONDUCTA INMEDIATA</tspan></text><text x="676.0" y="456.5" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">Retirar yeso y vendajes, miembro a</tspan><tspan x="676.0" dy="17">nivel del corazón</tspan></text><text x="676.0" y="490.5" font-size="12" font-weight="500" font-style="normal" fill="#fee2e2" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">Medir la presión compartimental; fasciotomía</tspan><tspan x="676.0" dy="16">urgente si hay sospecha.</tspan></text><rect x="40.0" y="648.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="674.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Dolor desproporcionado tras inmovilizar = síndrome compartimental</tspan></text><text x="60.0" y="693.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Hemartrosis, fascitis, tromboembolia y disrupción vascular tienen otro curso y otros signos.</tspan></text><text x="40.0" y="760.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="770.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="801.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="773.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="792.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Síndrome</tspan><tspan x="285.0" dy="17">compartimental</tspan></text><text x="435.0" y="801.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hemartrosis</tspan></text><text x="585.0" y="792.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Fascitis</tspan><tspan x="585.0" dy="17">necrotizante</tspan></text><text x="735.0" y="801.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Tromboembolia</tspan></text><text x="885.0" y="801.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Disrupción vascular</tspan></text><rect x="40.0" y="824.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="824.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="861.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico probable?</tspan></text><text x="285.0" y="845.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: dolor</tspan><tspan x="285.0" dy="16">desproporcionado tras</tspan><tspan x="285.0" dy="16">inmovilizar</tspan></text><text x="435.0" y="845.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: dolor articular con</tspan><tspan x="435.0" dy="16">derrame, sin tensión</tspan><tspan x="435.0" dy="16">muscular</tspan></text><text x="585.0" y="845.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: cursa con sepsis,</tspan><tspan x="585.0" dy="16">crepitación y lesiones</tspan><tspan x="585.0" dy="16">cutáneas</tspan></text><text x="735.0" y="853.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: aparece días</tspan><tspan x="735.0" dy="16">después</tspan></text><text x="885.0" y="845.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: isquemia y</tspan><tspan x="885.0" dy="16">ausencia de pulsos</tspan><tspan x="885.0" dy="16">desde el inicio</tspan></text><rect x="40.0" y="770.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="914.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="942.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="964.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Hematoma y edema en compartimentos inextensibles, agravados por un vendaje constrictivo, elevan la presión: primero cae el retorno venoso y luego la</tspan><tspan x="58.0" dy="18">   perfusión.</tspan><tspan x="58.0" dy="18">• Examen: compartimento tenso y dolor al estiramiento pasivo. Las cinco P (dolor, palidez, parestesia, parálisis, ausencia de pulso) son tardías.</tspan><tspan x="58.0" dy="18">• Manejo: retirar yesos y vendajes, miembro a nivel del corazón, mantener la presión arterial, medir la presión compartimental y fasciotomía urgente si hay</tspan><tspan x="58.0" dy="18">   sospecha.</tspan><tspan x="58.0" dy="18">• Paciente sedado o inconsciente: vigilar con presión compartimental y por el mecanismo. Hemartrosis: derrame articular sin tensión muscular.</tspan></text><text x="58.0" y="1076.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Schmidt AH. Acute compartment syndrome. Injury 2017;48 Suppl 1:S22-S25; Rockwood and Green's Fractures in Adults 9.ª ed. (2019); Campbell's Operative</tspan><tspan x="58.0" dy="15">Orthopaedics 14.ª ed. (2020).</tspan></text></svg>