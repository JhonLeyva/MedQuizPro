<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1081" viewBox="0 0 1000 1081" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Aunque tenga las vacunas completas, el rotavirus sigue siendo el agente más frecuente de la diarrea del lactante"><title>Aunque tenga las vacunas completas, el rotavirus sigue siendo el agente más frecuente de la diarrea del lactante</title><rect x="0.75" y="0.75" width="998.5" height="1079.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · diarrea aguda en lactante vacunado</tspan></text><rect x="474.1" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="523.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="523.2" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Rotavirus y vacunación</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Las vacunas protegen sobre todo de las formas graves (85-98 %); no dan inmunidad</tspan><tspan x="58.0" dy="17">esterilizante.</tspan><tspan x="58.0" dy="17">En el Perú se aplica a los 2 y 4 meses.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 10 meses</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Fiebre, vómitos y 10 deposiciones líquidas.</tspan><tspan x="640.0" dy="16">Inmunizaciones completas.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE LLEGA AL AGENTE MÁS PROBABLE</tspan></text><text x="614.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,293.0 580.0,293.0 543.8,369.0 76.2,369.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="309.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="341.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="424"><tspan x="310.0" dy="0">Lactante vacunado con fiebre, vómitos y diarrea líquida</tspan></text><line x1="565.9" y1="331.0" x2="606.0" y2="331.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="302.0" width="71.7" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="649.9" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="649.9" dy="0">Rotavirus</tspan></text><rect x="691.7" y="302.0" width="126.0" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="754.7" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="754.7" dy="0">Adenovirus entérico</tspan></text><rect x="823.7" y="302.0" width="75.6" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="861.5" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="861.5" dy="0">Calicivirus</tspan></text><rect x="614.0" y="334.0" width="74.3" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="651.2" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="651.2" dy="0">Astrovirus</tspan></text><rect x="694.3" y="334.0" width="81.5" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="735.1" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="735.1" dy="0">Enterovirus</tspan></text><polygon points="76.2,373.0 543.8,373.0 507.5,433.0 112.5,433.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="138.5" cy="403.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="138.5" y="407.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="138.5" dy="0">1</tspan></text><text x="320.0" y="399.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="331"><tspan x="320.0" dy="0">Cuadro agudo con vómitos, fiebre y diarrea acuosa:</tspan><tspan x="320.0" dy="17">etiología viral</tspan></text><line x1="529.6" y1="403.0" x2="606.0" y2="403.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="390.0" width="93.6" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="660.8" y="407.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="660.8" dy="0">✕ Enterovirus</tspan></text><line x1="636.0" y1="403.5" x2="697.6" y2="403.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="112.5,437.0 507.5,437.0 471.2,497.0 148.8,497.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="174.8" cy="467.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="174.8" y="471.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="174.8" dy="0">2</tspan></text><text x="320.0" y="463.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="258"><tspan x="320.0" dy="0">La vacuna previene la forma grave, no</tspan><tspan x="320.0" dy="17">toda infección</tspan></text><polygon points="148.8,501.0 471.2,501.0 435.0,578.0 185.0,578.0" fill="#5eead4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="539.5" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="543.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">3</tspan></text><text x="320.0" y="527.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">Los otros virus dan cuadros</tspan><tspan x="320.0" dy="17">más leves y menos</tspan><tspan x="320.0" dy="17">frecuentes</tspan></text><line x1="457.1" y1="539.5" x2="606.0" y2="539.5" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="526.5" width="137.5" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="682.7" y="544.0" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="682.7" dy="0">✕ Adenovirus entérico</tspan></text><line x1="636.0" y1="540.0" x2="741.5" y2="540.0" stroke="#94a3b8" stroke-width="1.2"/><rect x="757.5" y="526.5" width="87.7" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="801.3" y="544.0" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="801.3" dy="0">✕ Calicivirus</tspan></text><line x1="779.5" y1="540.0" x2="835.2" y2="540.0" stroke="#94a3b8" stroke-width="1.2"/><rect x="851.2" y="526.5" width="85.8" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="894.1" y="544.0" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="894.1" dy="0">✕ Astrovirus</tspan></text><line x1="873.2" y1="540.0" x2="927.0" y2="540.0" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="582.0" x2="310.0" y2="601.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,600.0 315.0,600.0 310.0,608.0" fill="#0f766e"/><rect x="140.0" y="612.0" width="340.0" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="641.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">ROTAVIRUS</tspan></text><text x="310.0" y="665.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Primer agente, aun con vacunas completas</tspan><tspan x="310.0" dy="17">Rehidratación, zinc y alimentación continuada</tspan></text><rect x="370.6" y="601.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="616.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="619.9" width="346.0" height="76.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="639.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="657.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">Las vacunas reducen 85-98 % las formas graves, pero no</tspan><tspan x="628.0" dy="16">eliminan al rotavirus como primer agente.</tspan></text><text x="40.0" y="743.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="753.9" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="776.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="756.9" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="776.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Rotavirus</tspan></text><text x="435.0" y="776.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Adenovirus</tspan></text><text x="585.0" y="776.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Calicivirus</tspan></text><text x="735.0" y="776.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Astrovirus</tspan></text><text x="885.0" y="776.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Enterovirus</tspan></text><rect x="40.0" y="790.9" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="790.9" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="827.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Agente más frecuente?</tspan></text><text x="285.0" y="811.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: sigue siendo el</tspan><tspan x="285.0" dy="16">agente principal pese a</tspan><tspan x="285.0" dy="16">la vacuna</tspan></text><text x="435.0" y="811.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: causa cuadros</tspan><tspan x="435.0" dy="16">más leves y menos</tspan><tspan x="435.0" dy="16">frecuentes</tspan></text><text x="585.0" y="811.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: causa cuadros</tspan><tspan x="585.0" dy="16">más leves y menos</tspan><tspan x="585.0" dy="16">frecuentes</tspan></text><text x="735.0" y="811.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: causa cuadros</tspan><tspan x="735.0" dy="16">más leves y menos</tspan><tspan x="735.0" dy="16">frecuentes</tspan></text><text x="885.0" y="819.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es raramente</tspan><tspan x="885.0" dy="16">causal</tspan></text><rect x="40.0" y="753.9" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="880.9" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="908.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="930.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Cuadro típico: vómitos y fiebre, luego deposiciones líquidas sin sangre y riesgo de deshidratación; adenovirus 40-41, calicivirus y astrovirus dan cuadros</tspan><tspan x="58.0" dy="18">   más leves.</tspan><tspan x="58.0" dy="18">• Manejo de soporte: plan de rehidratación según el grado, zinc por 10-14 días y alimentación continuada. Sin antibióticos ni antidiarreicos.</tspan><tspan x="58.0" dy="18">• La vacuna monovalente es de 2 dosis y la pentavalente humano-bovina de 3; el niño vacunado puede infectarse por otros genotipos.</tspan><tspan x="58.0" dy="18">• Alerta: vigilar la intususcepción (dolor cólico y heces en jalea de grosella) en las primeras semanas tras la vacuna.</tspan></text><text x="58.0" y="1024.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ESPGHAN/ESPID, Gastroenteritis aguda en niños (J Pediatr Gastroenterol Nutr 2014;59:132-52); MINSA, NTS 196-MINSA/DGIESP-2022 (Esquema Nacional de</tspan><tspan x="58.0" dy="15">Vacunación, RM 884-2022/MINSA); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>