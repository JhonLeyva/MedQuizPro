tspan></text><text x="500.0" y="679.5" font-size="14" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="144"><tspan x="500.0" dy="0">Moderado</tspan></text><circle cx="432.0" cy="704.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="442.0" y="708.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="442.0" dy="0">Entre 1 cm arriba y 1</tspan><tspan x="442.0" dy="16">cm abajo del himen</tspan></text><rect x="596.0" y="631.5" width="168.0" height="114.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="596.6" y="632.1" width="166.8" height="63.0" rx="9" fill="#fee2e2" stroke="none" stroke-width="0"/><text x="680.0" y="659.5" font-size="11" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="152"><tspan x="680.0" dy="0">ESTADIO III</tspan></text><text x="680.0" y="679.5" font-size="14" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="144"><tspan x="680.0" dy="0">Avanzado</tspan></text><circle cx="612.0" cy="704.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="622.0" y="708.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="622.0" dy="0">&gt; 1 cm fuera del himen,</tspan><tspan x="622.0" dy="16">sin salir todo</tspan></text><rect x="776.0" y="631.5" width="168.0" height="114.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="777.2" y="632.7" width="165.6" height="63.0" rx="9" fill="#fecaca" stroke="none" stroke-width="0"/><text x="860.0" y="659.5" font-size="11" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="middle" data-max="152"><tspan x="860.0" dy="0">ESTADIO IV</tspan></text><text x="860.0" y="679.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="144"><tspan x="860.0" dy="0">Total</tspan></text><circle cx="792.0" cy="704.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="802.0" y="708.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="802.0" dy="0">Eversión completa</tspan></text><rect x="814.6" y="620.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="860.0" y="635.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="860.0" dy="0">◆ ESTE CASO</tspan></text><text x="56.0" y="775.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="784.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="799.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="799.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Prolapso total: el útero y la vagina están afuera</tspan></text><rect x="56.0" y="821.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="844.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Estrógenos tópicos para curar las úlceras y luego cirugía.</tspan></text><text x="40.0" y="914.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="924.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="955.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="947.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Sesiones de</tspan><tspan x="285.0" dy="17">cauterización</tspan></text><text x="435.0" y="947.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Curaciones diarias</tspan><tspan x="435.0" dy="17">con yodopovidona</tspan></text><text x="585.0" y="947.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Aplicación tópica</tspan><tspan x="585.0" dy="17">de antibióticos</tspan></text><rect x="663.0" y="927.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="947.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Aplicación tópica</tspan><tspan x="735.0" dy="17">de estrógenos</tspan></text><text x="885.0" y="955.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Pesario y alta</tspan></text><rect x="40.0" y="978.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="978.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="999.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Preparación de</tspan><tspan x="54.0" dy="16">elección?</tspan></text><text x="285.0" y="999.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: daña más la</tspan><tspan x="285.0" dy="16">mucosa</tspan></text><text x="435.0" y="999.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no mejora el</tspan><tspan x="435.0" dy="16">trofismo</tspan></text><text x="585.0" y="1007.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Solo si hay infección</tspan></text><text x="735.0" y="999.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: trofismo y</tspan><tspan x="735.0" dy="16">cicatrización</tspan></text><text x="885.0" y="999.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: con úlceras se</tspan><tspan x="885.0" dy="16">lesiona más</tspan></text><rect x="40.0" y="924.5" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1052.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1080.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1102.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Preparar con estrógenos vaginales 2-4 semanas: engrosan la mucosa y cicatrizan las úlceras antes de la cirugía.</tspan><tspan x="58.0" dy="18">• Biopsiar úlceras que no curan (descartar cáncer).</tspan><tspan x="58.0" dy="18">• Cirugía según el caso: histerectomía vaginal con colpopexia o colpocleisis en mujeres sin vida sexual.</tspan></text><text x="58.0" y="1160.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: IUGA/ICS, terminología del prolapso (2016); NICE NG123 (2019); ACOG Practice Bulletin n.º 214 (2019).</tspan></text></svg>