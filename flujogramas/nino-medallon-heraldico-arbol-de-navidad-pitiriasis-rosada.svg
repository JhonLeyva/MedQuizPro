<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="824" viewBox="0 0 1000 824" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Placa inicial y erupción en árbol de navidad"><title>Placa inicial y erupción en árbol de navidad</title><rect x="0.75" y="0.75" width="998.5" height="822.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">DERMATOLOGÍA ENAM: PITIRIASIS ROSADA</tspan></text><rect x="469.1" y="32.0" width="109.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="523.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="93"><tspan x="523.6" dy="0">DERMATOLOGÍA</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Pitiriasis rosada</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Placa heráldica seguida de máculas ovaladas en 'árbol de navidad'</tspan><tspan x="58.0" dy="17">Probable origen viral (herpes 6/7); se cura sola en 6-8 semanas</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 7 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Medallón en el tronco; a los 10 días se disemina por la</tspan><tspan x="640.0" dy="16">espalda</tspan><tspan x="640.0" dy="16">Sin prurito · rinofaringitis previa · máculas rosadas</tspan><tspan x="640.0" dy="16">descamativas</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EMBUDO DIAGNÓSTICO</tspan></text><text x="614.0" y="313.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,325.0 580.0,325.0 531.7,401.0 88.3,401.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="341.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="373.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="399"><tspan x="310.0" dy="0">Placas descamativas en el tronco</tspan></text><line x1="559.8" y1="363.0" x2="606.0" y2="363.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="334.0" width="105.1" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="666.5" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="666.5" dy="0">Pitiriasis rosada</tspan></text><rect x="725.1" y="334.0" width="89.6" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="769.9" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="769.9" dy="0">Tiña corporis</tspan></text><rect x="820.7" y="334.0" width="133.2" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="887.3" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="887.3" dy="0">Dermatitis seborreica</tspan></text><rect x="614.0" y="366.0" width="69.7" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="648.9" y="383.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="648.9" dy="0">Psoriasis</tspan></text><polygon points="88.3,405.0 531.7,405.0 483.3,461.0 136.7,461.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="162.7" cy="433.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="162.7" y="437.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="162.7" dy="0">1</tspan></text><text x="320.0" y="437.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="283"><tspan x="320.0" dy="0">Placa heráldica que precede a la erupción</tspan></text><line x1="511.5" y1="433.0" x2="606.0" y2="433.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="420.0" width="101.5" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="664.7" y="437.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="664.7" dy="0">✕ Tiña corporis</tspan></text><line x1="636.0" y1="433.5" x2="705.5" y2="433.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="721.5" y="420.0" width="81.8" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="762.4" y="437.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="762.4" dy="0">✕ Psoriasis</tspan></text><line x1="743.5" y1="433.5" x2="793.3" y2="433.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="136.7,465.0 483.3,465.0 435.0,525.0 185.0,525.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="495.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="499.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">2</tspan></text><text x="320.0" y="491.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">Patrón en árbol de navidad</tspan><tspan x="320.0" dy="17">en la espalda</tspan></text><line x1="463.2" y1="495.0" x2="606.0" y2="495.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="482.0" width="145.3" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="686.6" y="499.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="686.6" dy="0">✕ Dermatitis seborreica</tspan></text><line x1="636.0" y1="495.5" x2="749.3" y2="495.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="529.0" x2="310.0" y2="548.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,547.0 315.0,547.0 310.0,555.0" fill="#0f766e"/><rect x="140.0" y="559.0" width="340.0" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="588.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">PITIRIASIS ROSADA</tspan></text><text x="310.0" y="612.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Tranquilizar: autolimitada</tspan><tspan x="310.0" dy="17">Emolientes; antihistamínico si pica</tspan></text><rect x="370.6" y="548.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="563.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="566.9" width="346.0" height="76.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="586.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="604.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">En adolescentes con riesgo sexual, descartar sífilis</tspan><tspan x="628.0" dy="16">secundaria (palmas y plantas).</tspan></text><rect x="40.0" y="674.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="702.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="724.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La tiña tiene borde activo y KOH positivo.</tspan><tspan x="58.0" dy="18">• La psoriasis tiene escama nacarada en codos y rodillas.</tspan><tspan x="58.0" dy="18">• No deja cicatriz.</tspan></text><text x="58.0" y="782.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Fitzpatrick's Dermatology 9.ª ed. (2019) · Nelson Tratado de Pediatría 22.ª ed. (2024)</tspan></text></svg>