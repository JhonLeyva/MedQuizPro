<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1422" viewBox="0 0 1000 1422" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Debilidad simétrica ascendente con arreflexia tras una diarrea: síndrome de Guillain-Barré"><title>Debilidad simétrica ascendente con arreflexia tras una diarrea: síndrome de Guillain-Barré</title><rect x="0.75" y="0.75" width="998.5" height="1420.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neuropatías · parálisis flácida aguda</tspan></text><rect x="416.0" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="480.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="480.3" dy="0">NEUROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Síndrome de Guillain-Barré</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Polirradiculoneuropatía autoinmune tras una infección (Campylobacter, virus).</tspan><tspan x="58.0" dy="17">Debilidad simétrica que sube desde las piernas, sin reflejos, con poca alteración sensitiva.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 30 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">3 días de debilidad simétrica en las piernas; diarrea</tspan><tspan x="640.0" dy="16">acuosa una semana antes.</tspan><tspan x="640.0" dy="16">Fuerza 3/5, arreflexia rotuliana y aquiliana, hipotonía;</tspan><tspan x="640.0" dy="16">sensibilidad y esfínteres normales; afebril.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DE LA DEBILIDAD A LA CAUSA</tspan></text><text x="614.0" y="313.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,325.0 580.0,325.0 543.8,401.0 76.2,401.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="341.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="373.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="424"><tspan x="310.0" dy="0">Debilidad simétrica de piernas con arreflexia</tspan></text><line x1="565.9" y1="363.0" x2="606.0" y2="363.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="334.0" width="107.0" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="667.5" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="667.5" dy="0">Miastenia gravis</tspan></text><rect x="727.0" y="334.0" width="116.2" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="785.1" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="785.1" dy="0">Mielitis transversa</tspan></text><rect x="849.2" y="334.0" width="84.1" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="891.3" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="891.3" dy="0">Poliomielitis</tspan></text><rect x="614.0" y="366.0" width="93.9" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="661.0" y="383.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="661.0" dy="0">Guillain-Barré</tspan></text><polygon points="76.2,405.0 543.8,405.0 507.5,465.0 112.5,465.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="138.5" cy="435.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="138.5" y="439.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="138.5" dy="0">1</tspan></text><text x="320.0" y="431.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="331"><tspan x="320.0" dy="0">¿Fatiga que empeora al usar el músculo, ptosis,</tspan><tspan x="320.0" dy="17">reflejos normales?</tspan></text><line x1="529.6" y1="435.0" x2="606.0" y2="435.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="422.0" width="119.1" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="673.6" y="439.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="673.6" dy="0">✕ Miastenia gravis</tspan></text><line x1="636.0" y1="435.5" x2="723.1" y2="435.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="112.5,469.0 507.5,469.0 471.2,529.0 148.8,529.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="174.8" cy="499.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="174.8" y="503.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="174.8" dy="0">2</tspan></text><text x="320.0" y="495.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="258"><tspan x="320.0" dy="0">¿Nivel sensitivo y vejiga</tspan><tspan x="320.0" dy="17">comprometida?</tspan></text><line x1="493.4" y1="499.0" x2="606.0" y2="499.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="486.0" width="128.3" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="678.1" y="503.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="678.1" dy="0">✕ Mielitis transversa</tspan></text><line x1="636.0" y1="499.5" x2="732.3" y2="499.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="148.8,533.0 471.2,533.0 435.0,593.0 185.0,593.0" fill="#5eead4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="563.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="567.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">3</tspan></text><text x="320.0" y="559.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">¿Fiebre y parálisis</tspan><tspan x="320.0" dy="17">asimétrica sin vacuna?</tspan></text><line x1="457.1" y1="563.0" x2="606.0" y2="563.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="550.0" width="96.2" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="662.1" y="567.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="662.1" dy="0">✕ Poliomielitis</tspan></text><line x1="636.0" y1="563.5" x2="700.2" y2="563.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="597.0" x2="310.0" y2="616.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,615.0 315.0,615.0 310.0,623.0" fill="#0f766e"/><rect x="140.0" y="627.0" width="340.0" height="74.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="656.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Guillain-Barré</tspan></text><text x="310.0" y="680.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Ascendente, simétrico, sin reflejos, tras diarrea</tspan></text><rect x="370.6" y="616.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="631.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="626.4" width="346.0" height="76.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="646.4" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="664.4" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">Sensibilidad y esfínteres normales con arreflexia: nervio</tspan><tspan x="628.0" dy="16">periférico, no médula.</tspan></text><text x="40.0" y="741.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="753.9" width="278.0" height="374.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="763.9" width="96.9" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="777.9" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="236"><tspan x="61.0" dy="0">CÓMO AVANZA</tspan></text><g data-box="54.0 791.9 250.0 312.0"><g transform="translate(94.0,791.9) scale(0.7)"><circle cx="120" cy="40" r="28" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M110 66 H130 V80 H110 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 80 H170 L176 170 H64 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M64 170 H176 L170 240 H70 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 240 H170 L164 268 H76 Z" fill="#fde7d4" stroke="#e9b48f" st