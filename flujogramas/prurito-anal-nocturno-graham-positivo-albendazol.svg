<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="772" viewBox="0 0 1000 772" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Tratamiento de la oxiuriasis"><title>Tratamiento de la oxiuriasis</title><rect x="0.75" y="0.75" width="998.5" height="770.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">PEDIATRÍA ENAM: OXIURIASIS</tspan></text><rect x="385.2" y="32.0" width="78.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="424.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="63"><tspan x="424.7" dy="0">PEDIATRÍA</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Oxiuriasis</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Enterobius vermicularis: prurito anal nocturno</tspan><tspan x="58.0" dy="17">Diagnóstico con cinta adhesiva (test de Graham)</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Preescolar de 3 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Prurito perianal nocturno y ardor al orinar</tspan><tspan x="640.0" dy="16">Urocultivo negativo · Graham positivo</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EMBUDO DEL TRATAMIENTO</tspan></text><text x="614.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,293.0 580.0,293.0 531.7,349.0 88.3,349.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="309.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="331.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="399"><tspan x="310.0" dy="0">Graham positivo</tspan></text><line x1="559.8" y1="321.0" x2="606.0" y2="321.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="308.0" width="80.2" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="654.1" y="325.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="654.1" dy="0">Albendazol</tspan></text><rect x="700.2" y="308.0" width="89.4" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="744.9" y="325.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="744.9" dy="0">Metronidazol</tspan></text><rect x="795.6" y="308.0" width="77.6" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="834.4" y="325.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="834.4" dy="0">Cefalexina</tspan></text><rect x="879.2" y="308.0" width="77.6" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="918.0" y="325.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="918.0" dy="0">Piperazina</tspan></text><polygon points="88.3,353.0 531.7,353.0 483.3,409.0 136.7,409.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="162.7" cy="381.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="162.7" y="385.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="162.7" dy="0">1</tspan></text><text x="320.0" y="385.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="283"><tspan x="320.0" dy="0">Es un helminto, no bacteria ni protozoo</tspan></text><line x1="511.5" y1="381.0" x2="606.0" y2="381.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="368.0" width="101.5" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="664.7" y="385.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="664.7" dy="0">✕ Metronidazol</tspan></text><line x1="636.0" y1="381.5" x2="705.5" y2="381.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="721.5" y="368.0" width="89.7" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="766.3" y="385.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="766.3" dy="0">✕ Cefalexina</tspan></text><line x1="743.5" y1="381.5" x2="801.2" y2="381.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="136.7,413.0 483.3,413.0 435.0,473.0 185.0,473.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="443.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="447.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">2</tspan></text><text x="320.0" y="439.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">Piperazina: menos eficaz, en</tspan><tspan x="320.0" dy="17">desuso</tspan></text><line x1="463.2" y1="443.0" x2="606.0" y2="443.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="430.0" width="89.7" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="658.9" y="447.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="658.9" dy="0">✕ Piperazina</tspan></text><line x1="636.0" y1="443.5" x2="693.7" y2="443.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="477.0" x2="310.0" y2="496.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,495.0 315.0,495.0 310.0,503.0" fill="#0f766e"/><rect x="140.0" y="507.0" width="340.0" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="536.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">ALBENDAZOL</tspan></text><text x="310.0" y="560.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">400 mg dosis única</tspan><tspan x="310.0" dy="17">Repetir a las 2 semanas</tspan></text><rect x="370.6" y="496.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="511.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="522.9" width="346.0" height="60.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="542.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="560.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">Tratar a toda la familia y lavar ropa de cama.</tspan></text><rect x="40.0" y="622.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="650.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="672.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Cortar uñas y lavar manos: evita la reinfección.</tspan><tspan x="58.0" dy="18">• Puede causar vulvovaginitis en niñas.</tspan><tspan x="58.0" dy="18">• Alternativa: mebendazol.</tspan></text><text x="58.0" y="730.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Nelson Tratado de Pediatría 22.ª ed. (2024) · CDC – Enterobiasis (2024)</tspan></text></svg>