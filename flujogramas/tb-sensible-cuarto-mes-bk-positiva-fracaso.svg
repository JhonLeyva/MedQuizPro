yle="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="171.3" dy="0">Conversión</tspan></text><rect x="225.4" y="640.2" width="159.3" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="305.1" y="659.7" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="305.1" dy="0">Pérdida de seguimiento</tspan></text><rect x="392.7" y="640.2" width="128.5" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="456.9" y="659.7" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="456.9" dy="0">Reacción adversa</tspan></text><rect x="40.0" y="694.2" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="722.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="744.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Pérdida de seguimiento: interrupción ≥ 30 días.</tspan><tspan x="58.0" dy="18">• Pedir prueba molecular y cultivo con sensibilidad.</tspan><tspan x="58.0" dy="18">• Ajustar el esquema según el resultado.</tspan></text><text x="58.0" y="802.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA – NTS 200: Atención integral de la tuberculosis (2023)</tspan></text></svg>