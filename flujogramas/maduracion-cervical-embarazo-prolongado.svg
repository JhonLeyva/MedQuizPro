<svg xmlns="http://www.w3.org/2000/svg" width="820" height="924" viewBox="0 0 820 924" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Maduración cervical en el embarazo prolongado"><title>Maduración cervical en el embarazo prolongado</title><rect width="820" height="924" fill="#ffffff"/><rect x="0" y="0" width="820" height="112" fill="#0f766e"/><text x="40" y="34" font-size="13" font-weight="600" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="740"><tspan x="40" dy="0">MedQuizPlus · Flujograma</tspan></text><text x="40" y="70" font-size="24" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="740"><tspan x="40" dy="0">Maduración cervical en el embarazo prolongado</tspan></text><text x="40" y="96" font-size="13" font-weight="400" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="740"><tspan x="40" dy="0">ENAM 2020 · GIN-008 · Ginecología y Obstetricia</tspan></text><rect x="90" y="144" width="640" height="76" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="108" y="172" font-size="11" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="604"><tspan x="108" dy="0">INICIO</tspan></text><text x="108" y="196" font-size="16" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Gestación de 41 semanas con bienestar fetal conservado</tspan></text><line x1="410.0" y1="222" x2="410.0" y2="242" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,240 417.0,240 410.0,250" fill="#94a3b8"/><rect x="90" y="252" width="640" height="104" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><circle cx="120" cy="304.0" r="12" fill="#d97706"/><text x="120" y="309.0" font-size="15" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="120" dy="0">?</tspan></text><text x="142" y="280" font-size="11" font-weight="700" font-style="normal" fill="#b45309" text-anchor="start" data-max="570"><tspan x="142" dy="0">DECISIÓN</tspan></text><text x="142" y="304" font-size="16" font-weight="600" font-style="normal" fill="#78350f" text-anchor="start" data-max="570"><tspan x="142" dy="0">¿Score de Bishop favorable (mayor de 6)?</tspan></text><text x="142" y="332" font-size="14" font-weight="500" font-style="italic" fill="#92400e" text-anchor="start" data-max="570"><tspan x="142" dy="0">↳ Sí → inducción directa con oxitocina</tspan></text><line x1="410.0" y1="358" x2="410.0" y2="378" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,376 417.0,376 410.0,386" fill="#94a3b8"/><rect x="90" y="388" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="416" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="440" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Bishop desfavorable: cérvix posterior, largo, cerrado y de</tspan><tspan x="108" dy="22">consistencia dura</tspan></text><line x1="410.0" y1="488" x2="410.0" y2="508" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,506 417.0,506 410.0,516" fill="#94a3b8"/><rect x="90" y="518" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="546" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="570" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Maduración cervical: misoprostol o dinoprostona (o sonda</tspan><tspan x="108" dy="22">Foley)</tspan></text><line x1="410.0" y1="618" x2="410.0" y2="638" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,636 417.0,636 410.0,646" fill="#94a3b8"/><rect x="90" y="648" width="640" height="98" rx="12" fill="#134e4a" stroke="#134e4a" stroke-width="2"/><text x="108" y="676" font-size="11" font-weight="700" font-style="normal" fill="#5eead4" text-anchor="start" data-max="604"><tspan x="108" dy="0">CONDUCTA FINAL</tspan></text><text x="108" y="700" font-size="16" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Reevaluar el Bishop e inducir el trabajo de parto con</tspan><tspan x="108" dy="22">oxitocina</tspan></text><rect x="40" y="776" width="740" height="98" rx="10" fill="#f0fdfa" stroke="#99f6e4"/><rect x="40" y="776" width="6" height="98" rx="3" fill="#14b8a6"/><text x="62" y="802" font-size="14" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="704"><tspan x="62" dy="0">Perla clínica</tspan></text><text x="62" y="826" font-size="15" font-weight="400" font-style="normal" fill="#134e4a" text-anchor="start" data-max="704"><tspan x="62" dy="0">Inducir con un cérvix desfavorable aumenta el fracaso de la inducción y la</tspan><tspan x="62" dy="21">tasa de cesárea.</tspan></text><text x="410.0" y="902" font-size="11" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="740"><tspan x="410.0" dy="0">MedQuizPlus · Material de estudio: contrasta siempre con las guías clínicas vigentes.</tspan></text></svg>
