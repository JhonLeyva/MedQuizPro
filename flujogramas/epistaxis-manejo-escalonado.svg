<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="989" viewBox="0 0 1000 989" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Epistaxis justo después de retirar una sonda nasogástrica: taponamiento nasal anterior"><title>Epistaxis justo después de retirar una sonda nasogástrica: taponamiento nasal anterior</title><rect x="0.75" y="0.75" width="998.5" height="987.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Otorrinolaringología · epistaxis</tspan></text><rect x="384.5" y="32.0" width="196.8" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="482.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="181"><tspan x="482.9" dy="0">OTORRINOLARINGOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Epistaxis anterior</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El 90 % sangra del área de Kiesselbach, en la parte anterior del tabique.</tspan><tspan x="58.0" dy="17">Un trauma local (sonda, dedo, sequedad) es la causa más común.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 50 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Se le retiró una sonda nasogástrica.</tspan><tspan x="640.0" dy="16">Sangrado nasal inmediato.</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="255.0" x2="422.2" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="422.2" y1="255.0" x2="422.2" y2="284.0" stroke="#94a3b8" stroke-width="2"/><polygon points="417.2,283.0 427.2,283.0 422.2,291.0" fill="#94a3b8"/><line x1="422.2" y1="349.0" x2="422.2" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="379.0" x2="655.7" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="379.0" x2="188.7" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,407.0 193.7,407.0 188.7,415.0" fill="#94a3b8"/><line x1="655.7" y1="379.0" x2="655.7" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="650.7,407.0 660.7,407.0 655.7,415.0" fill="#94a3b8"/><line x1="655.7" y1="473.0" x2="655.7" y2="535.5" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="535.5" x2="811.3" y2="535.5" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="535.5" x2="500.0" y2="564.5" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,563.5 505.0,563.5 500.0,571.5" fill="#94a3b8"/><line x1="811.3" y1="535.5" x2="811.3" y2="564.5" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,563.5 816.3,563.5 811.3,571.5" fill="#94a3b8"/><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="255.0" x2="422.2" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="422.2" y1="255.0" x2="422.2" y2="284.0" stroke="#0f766e" stroke-width="3"/><polygon points="417.2,283.0 427.2,283.0 422.2,291.0" fill="#0f766e"/><line x1="422.2" y1="349.0" x2="422.2" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="379.0" x2="422.2" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="379.0" x2="188.7" y2="408.0" stroke="#0f766e" stroke-width="3"/><polygon points="183.7,407.0 193.7,407.0 188.7,415.0" fill="#0f766e"/><rect x="83.0" y="388.0" width="211.4" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="188.7" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">Anterior: trauma por sonda (este caso)</tspan></text><rect x="472.8" y="544.5" width="54.4" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="500.0" y="557.0" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">Primero</tspan></text><rect x="776.4" y="544.5" width="69.9" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="811.3" y="557.0" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">Refractaria</tspan></text><polygon points="162.2,320.0 188.2,291.0 656.2,291.0 682.2,320.0 656.2,349.0 188.2,349.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="208.2" cy="320.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="208.2" y="325.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="208.2" dy="0">?</tspan></text><text x="441.2" y="324.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="441.2" dy="0">Epistaxis: ¿de dónde sangra?</tspan></text><rect x="40.0" y="415.0" width="297.3" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="188.7" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">TAPONAMIENTO ANTERIOR</tspan></text><text x="188.7" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Tras compresión 10-15 min</tspan><tspan x="188.7" dy="17">Cauterizar si se ve el vaso</tspan></text><polygon points="395.7,444.0 421.7,415.0 889.7,415.0 915.7,444.0 889.7,473.0 421.7,473.0" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><circle cx="441.7" cy="444.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="441.7" y="449.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="441.7" dy="0">?</tspan></text><text x="674.7" y="448.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="674.7" dy="0">Posterior o no cede</tspan></text><rect x="351.3" y="571.5" width="297.3" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="599.8" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Taponamiento posterior</tspan></text><text x="500.0" y="622.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Sonda con balón</tspan></text><rect x="662.7" y="571.5" width="297.3" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="599.8" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Ligadura esfenopalatina</tspan></text><text x="811.3" y="622.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Por endoscopia</tspan></text><text x="40.0" y="684.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="694.9" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="734.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="734.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Cauterización</tspan></text><text x="435.0" y="725.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Taponamiento nasal</tspan><tspan x="435.0" dy="17">posterior</tspan></text><rect x="513.0" y="697.9" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="725.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Taponamiento nasal</tspan><tspan x="585.0" dy="17">anterior</tspan></text><text x="735.0" y="734.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Pegamento</tspan></text><text x="885.0" y="717.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Ligadura de la</tspan><tspan x="885.0" dy="17">arteria</tspan><tspan x="885.0" dy="17">esfenopalatina</tspan></text><rect x="40.0" y="765.9" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="765.9" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="794.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿De elección?</tspan></text><text x="285.0" y="786.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Solo si se ve el punto</tspan><tspan x="285.0" dy="16">que sangra</tspan></text><text x="435.0" y="786.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es para sangrado</tspan><tspan x="435.0" dy="16">posterior</tspan></text><text x="585.0" y="786.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: trauma anterior por</tspan><tspan x="585.0" dy="16">la sonda</tspan></text><text x="735.0" y="786.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no es tratamiento</tspan><tspan x="735.0" dy="16">estándar</tspan></text><text x="885.0" y="786.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: para epistaxis</tspan><tspan x="885.0" dy="16">posterior refractaria</tspan></text><rect x="40.0" y="694.9" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="839.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="867.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="889.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Primero: sentarla inclinada hacia adelante y apretar las alas nasales 10-15 minutos (± vasoconstrictor).</tspan><tspan x="58.0" dy="18">• Si sigue: taponamiento anterior (gasa o material reabsorbible); cauterizar solo si se ve el punto.</tspan><tspan x="58.0" dy="18">• Si sangra por detrás o no cede: taponamiento posterior, endoscopia o ligadura de la esfenopalatina.</tspan></text><text x="58.0" y="947.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAO-HNS, Clinical Practice Guideline: Nosebleed (Epistaxis) (2020); Cummings Otolaryngology 7.ª ed. (2021).</tspan></text></svg>