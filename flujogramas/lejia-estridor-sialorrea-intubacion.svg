<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1217" viewBox="0 0 1000 1217" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Niño que ingirió lejía hace 20 minutos con estridor, sialorrea y SatO₂ 91 %: lo primero es asegurar la vía aérea (intubación)"><title>Niño que ingirió lejía hace 20 minutos con estridor, sialorrea y SatO₂ 91 %: lo primero es asegurar la vía aérea (intubación)</title><rect x="0.75" y="0.75" width="998.5" height="1216.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Toxicología pediátrica · cáusticos</tspan></text><rect x="398.7" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="455.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="455.2" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ingestión de cáusticos</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Los álcalis (lejía) causan necrosis por licuefacción: quemaduras profundas en boca,</tspan><tspan x="58.0" dy="17">esófago y laringe.</tspan><tspan x="58.0" dy="17">Estridor o dificultad respiratoria = edema de la vía aérea: puede cerrarse en minutos.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 3 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Ingirió lejía hace 20 minutos; estridor, dolor abdominal,</tspan><tspan x="640.0" dy="16">náuseas y vómitos.</tspan><tspan x="640.0" dy="16">FR 40, SatO₂ 91 %; mucosa oral eritematosa, sialorrea;</tspan><tspan x="640.0" dy="16">murmullo disminuido.</tspan></text><line x1="640.0" y1="237.0" x2="670.0" y2="237.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#94a3b8"/><line x1="500.0" y1="381.0" x2="500.0" y2="411.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="411.0" x2="733.5" y2="411.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="411.0" x2="266.5" y2="440.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,439.0 271.5,439.0 266.5,447.0" fill="#94a3b8"/><line x1="733.5" y1="411.0" x2="733.5" y2="440.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,439.0 738.5,439.0 733.5,447.0" fill="#94a3b8"/><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#0f766e"/><line x1="500.0" y1="381.0" x2="500.0" y2="411.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="411.0" x2="500.0" y2="411.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="411.0" x2="266.5" y2="440.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,439.0 271.5,439.0 266.5,447.0" fill="#0f766e"/><rect x="225.0" y="420.0" width="83.0" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="432.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Sí (este caso)</tspan></text><rect x="719.4" y="420.0" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="432.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">No</tspan></text><polygon points="240.0,352.0 266.0,323.0 734.0,323.0 760.0,352.0 734.0,381.0 266.0,381.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="352.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="357.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="356.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Ingestión de cáustico: ¿estridor o dificultad respiratoria?</tspan></text><rect x="40.0" y="447.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="475.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">INTUBACIÓN</tspan></text><text x="266.5" y="498.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Vía aérea segura</tspan><tspan x="266.5" dy="17">Luego endoscopía</tspan></text><rect x="507.0" y="447.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="483.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Nada por boca</tspan></text><text x="733.5" y="506.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Endoscopía en 12-48 h</tspan></text><text x="40.0" y="577.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="589.5" width="920.0" height="301.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="603.5" width="332.4" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="222.2" y="623.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="222.2" dy="0">CLASIFICACIÓN ENDOSCÓPICA DE ZARGAR</tspan></text><text x="404.4" y="623.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="538"><tspan x="404.4" dy="0">Grado de la quemadura esofágica; predice la estenosis.</tspan></text><rect x="56.0" y="663.5" width="213.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="664.1" width="211.8" height="63.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="162.5" y="691.5" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="197"><tspan x="162.5" dy="0">GRADO 0-1</tspan></text><text x="162.5" y="711.5" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="189"><tspan x="162.5" dy="0">Normal o edema</tspan></text><circle cx="72.0" cy="736.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="740.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="82.0" dy="0">Alta pronto</tspan></text><rect x="281.0" y="663.5" width="213.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="281.6" y="664.1" width="211.8" height="63.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="387.5" y="691.5" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="197"><tspan x="387.5" dy="0">GRADO 2A</tspan></text><text x="387.5" y="711.5" font-size="14" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="189"><tspan x="387.5" dy="0">Úlceras superficiales</tspan></text><circle cx="297.0" cy="736.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="307.0" y="740.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="307.0" dy="0">Buen pronóstico</tspan></text><rect x="506.0" y="663.5" width="213.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="506.6" y="664.1" width="211.8" height="63.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="612.5" y="691.5" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="197"><tspan x="612.5" dy="0">GRADO 2B</tspan></text><text x="612.5" y="711.5" font-size="14" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="189"><tspan x="612.5" dy="0">Úlceras circunferenciales</tspan></text><circle cx="522.0" cy="736.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="532.0" y="740.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="532.0" dy="0">Riesgo de estenosis</tspan></text><rect x="731.0" y="663.5" width="213.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="731.6" y="664.1" width="211.8" height="63.0" rx="9" fill="#fee2e2" stroke="none" stroke-width="0"/><text x="837.5" y="691.5" font-size="11" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="197"><tspan x="837.5" dy="0">GRADO 3</tspan></text><text x="837.5" y="711.5" font-size="14" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="189"><tspan x="837.5" dy="0">Necrosis</tspan></text><circle cx="747.0" cy="736.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="757.0" y="740.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="757.0" dy="0">Estenosis, perforación</tspan></text><text x="56.0" y="791.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">PARA UBICAR ESTE CASO</tspan></text><rect x="56.0" y="800.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="815.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="815.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Falta la endoscopía; primero la vía aérea</tspan></text><rect x="56.0" y="837.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="860.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Intubar, nada por boca, endoscopía en 12-48 h.</tspan></text><text x="40.0" y="930.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="940.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="971.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="943.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="963.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Intubación</tspan><tspan x="285.0" dy="17">endotraqueal</tspan></text><text x="435.0" y="971.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Carbón activado</tspan></text><text x="585.0" y="963.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Corticoides</tspan><tspan x="585.0" dy="17">endovenoso</tspan></text><text x="735.0" y="971.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Lavado gástrico</tspan></text><text x="885.0" y="963.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Inducción del</tspan><tspan x="885.0" dy="17">vómito</tspan></text><rect x="40.0" y="994.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="994.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1023.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Inicial?</tspan></text><text x="285.0" y="1015.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: estridor = vía aérea</tspan><tspan x="285.0" dy="16">en riesgo</tspan></text><text x="435.0" y="1015.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no adsorbe</tspan><tspan x="435.0" dy="16">cáusticos</tspan></text><text x="585.0" y="1023.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No es lo urgente</tspan></text><text x="735.0" y="1023.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: perfora y reexpone</tspan></text><text x="885.0" y="1015.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: reexpone el</tspan><tspan x="885.0" dy="16">esófago</tspan></text><rect x="40.0" y="940.5" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1068.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1096.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1118.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Con estridor: intubación temprana por personal experto (o vía aérea quirúrgica).</tspan><tspan x="58.0" dy="18">• NO inducir el vómito, NO lavado gástrico, NO carbón activado, NO neutralizar.</tspan><tspan x="58.0" dy="18">• Endoscopía en 12-48 h para clasificar la lesión (Zargar); nada por boca.</tspan></text><text x="58.0" y="1176.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ESGE/ESPGHAN, ingestión de cáusticos en niños (2021); Goldfrank's 11.ª ed.</tspan></text></svg>