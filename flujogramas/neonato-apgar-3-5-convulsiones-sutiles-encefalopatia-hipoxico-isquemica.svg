<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1131" viewBox="0 0 1000 1131" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Asfixia al nacer y convulsiones sutiles a las 12 horas: encefalopatía hipóxico-isquémica"><title>Asfixia al nacer y convulsiones sutiles a las 12 horas: encefalopatía hipóxico-isquémica</title><rect x="0.75" y="0.75" width="998.5" height="1129.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neonatología · asfixia perinatal</tspan></text><rect x="383.9" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="440.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="440.3" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Encefalopatía hipóxico-isquémica (EHI)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Daño cerebral por falta de oxígeno y sangre alrededor del parto.</tspan><tspan x="58.0" dy="17">Da alteración de la conciencia y convulsiones en las primeras 24 h.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Neonato de 41 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Apgar 3 y 5; necesitó ventilación a presión positiva.</tspan><tspan x="640.0" dy="16">A las 12 h: hipoalerta, desviación ocular, pedaleo y</tspan><tspan x="640.0" dy="16">succión anómala.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿CUMPLE EL CUADRO DE EHI?</tspan></text><rect x="40.0" y="285.0" width="642.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="56.0" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="start" data-max="512"><tspan x="56.0" dy="0">DATOS DE ENCEFALOPATÍA HIPÓXICO-ISQUÉMICA</tspan></text><text x="666.0" y="307.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="100"><tspan x="666.0" dy="0">EN EL CASO</tspan></text><rect x="40.0" y="319.0" width="642.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="329.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="344.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="343.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">Apgar ≤ 5 a los 5 minutos</tspan></text><text x="86.0" y="359.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">Apgar 3 y 5</tspan></text><text x="666.0" y="343.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="666.0" dy="0">Sí</tspan></text><rect x="40.0" y="365.0" width="642.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="375.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="390.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="389.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">Necesitó reanimación al nacer</tspan></text><text x="86.0" y="405.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">Ventilación a presión positiva</tspan></text><text x="666.0" y="389.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="666.0" dy="0">Sí</tspan></text><rect x="40.0" y="411.0" width="642.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="421.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="436.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="435.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">Alteración de la conciencia</tspan></text><text x="86.0" y="451.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">Hipoalerta</tspan></text><text x="666.0" y="435.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="666.0" dy="0">Sí</tspan></text><rect x="40.0" y="457.0" width="642.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="467.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="482.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="481.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">Convulsiones en las primeras 24 h</tspan></text><text x="86.0" y="497.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">Sutiles a las 12 h</tspan></text><text x="666.0" y="481.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="666.0" dy="0">Sí</tspan></text><rect x="40.0" y="503.0" width="642.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="513.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="528.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="527.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">Sin fiebre ni otros signos de infección</tspan></text><text x="86.0" y="543.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="492"><tspan x="86.0" dy="0">No descritos: la meningitis es menos probable</tspan></text><text x="666.0" y="527.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="666.0" dy="0">Sí</tspan></text><rect x="40.0" y="549.0" width="642.0" height="57.0" rx="0" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="56.0" y="571.0" font-size="11" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="610"><tspan x="56.0" dy="0">Cumple 5 de 5 · asfixia + encefalopatía</tspan></text><text x="56.0" y="591.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="610"><tspan x="56.0" dy="0">Encefalopatía hipóxico-isquémica: tratar convulsiones y dar soporte en UCI neonatal</tspan></text><rect x="40.0" y="285.0" width="642.0" height="321.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="702.0" y="285.0" width="258.0" height="392.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="714.0" y="295.0" width="151.8" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="723.0" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="723.0" dy="0">CONVULSIONES SUTILES</tspan></text><g data-box="716.0 323.0 230.0 300.0"><g transform="translate(723.0,323.0) scale(0.9)"><path d="M76 128 C72 110 168 110 164 128 L172 222 C160 248 80 248 68 222 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M72 180 H168 L172 222 C160 248 80 248 68 222 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M76 132 L40 170 L52 184 L82 156 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M164 132 L200 170 L188 184 L158 156 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><circle cx="44" cy="182" r="10" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="196" cy="182" r="10" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M84 236 L70 300 L94 304 L108 244 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M156 236 L170 300 L146 304 L132 244 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="80" cy="308" rx="14" ry="7" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><ellipse cx="160" cy="308" rx="14" ry="7" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="120" cy="70" r="54" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="100" cy="66" r="4" fill="#334155" stroke="none" stroke-width="0" /><circle cx="140" cy="66" r="4" fill="#334155" stroke="none" stroke-width="0" /><path d="M110 96 Q120 102 130 96" fill="none" stroke="#9a6b52" stroke-width="2"/><path d="M116 76 Q120 86 124 76" fill="none" stroke="#9a6b52" stroke-width="2" stroke-linejoin="round" /><circle cx="120" cy="214" r="3" fill="#9a6b52" stroke="none" stroke-width="0" /><circle cx="146" cy="50" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="146" y="54" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">1</text><circle cx="146" cy="106" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="146" y="110" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">2</text><circle cx="60" cy="286" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="60" y="290" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">3</text></g></g><text x="716.0" y="639.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="716.0" dy="0">1 desviación ocular, 2 succión anómala, 3</tspan><tspan x="716.0" dy="15">pedaleo.</tspan></text><text x="40.0" y="709.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">POR QUÉ NO LAS OTRAS</tspan></text><rect x="40.0" y="719.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="720.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="743.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Meningitis neonatal</tspan></text><text x="58.0" y="764.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Fiebre o hipotermia, riesgo infeccioso, LCR</tspan><tspan x="58.0" dy="16">alterado.</tspan></text><rect x="351.3" y="719.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="720.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="743.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Hipocalcemia o error metabólico</tspan></text><text x="369.3" y="764.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Sin antecedente de asfixia; el error metabólico</tspan><tspan x="369.3" dy="16">aparece tras comer.</tspan></text><rect x="662.7" y="719.0" width="297.3" height="85.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="663.7" y="720.0" width="6.0" height="83.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="680.7" y="743.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Lo correcto</tspan></text><text x="680.7" y="764.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Asfixia + encefalopatía temprana = EHI.</tspan></text><rect x="860.2" y="708.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="905.6" y="723.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="905.6" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="844.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="854.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="885.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="885.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Meningitis neonatal</tspan></text><rect x="400.5" y="857.0" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="876.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Encefalopatía</tspan><tspan x="491.2" dy="17">hipóxico-isquémica</tspan></text><text x="678.8" y="876.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Error congénito del</tspan><tspan x="678.8" dy="17">metabolismo</tspan></text><text x="866.2" y="885.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Hipocalcemia</tspan></text><rect x="40.0" y="908.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="908.0" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="937.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Clave</tspan></text><text x="303.8" y="937.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Infección, LCR</tspan></text><text x="491.2" y="929.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Asfixia + convulsiones</tspan><tspan x="491.2" dy="16">precoces</tspan></text><text x="678.8" y="937.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Tras iniciar la alimentación</tspan></text><text x="866.2" y="937.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Calcio bajo, sin asfixia</tspan></text><rect x="40.0" y="854.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="982.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1010.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1032.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Asfixia (Apgar bajo + reanimación) + encefalopatía + convulsiones en las primeras 24 h = EHI.</tspan><tspan x="58.0" dy="18">• Las convulsiones sutiles del neonato: mirada desviada, pedaleo, chupeteo, apneas.</tspan><tspan x="58.0" dy="18">• Hipotermia terapéutica si se inicia antes de las 6 h; tratar las convulsiones y dar soporte.</tspan></text><text x="58.0" y="1090.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAP y ACOG, encefalopatía neonatal (2014-2019); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>