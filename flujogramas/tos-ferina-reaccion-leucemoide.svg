<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="901" viewBox="0 0 1000 901" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Lactante de 45 días con tos ferina: la leucocitosis extrema (&gt; 50 000) es el factor de peor pronóstico"><title>Lactante de 45 días con tos ferina: la leucocitosis extrema (&gt; 50 000) es el factor de peor pronóstico</title><rect x="0.75" y="0.75" width="998.5" height="899.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Infecciones respiratorias · tos ferina</tspan></text><rect x="414.0" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="470.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="470.5" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tos ferina (Bordetella pertussis)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Toxina que causa linfocitosis y paroxismos de tos con estridor inspiratorio.</tspan><tspan x="58.0" dy="17">En menores de 3 meses es grave: apneas, neumonía, hipertensión pulmonar y muerte.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 45 días con tos ferina</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué dato anuncia el peor pronóstico?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LAS FASES DE LA TOS FERINA</tspan></text><rect x="42.0" y="253.0" width="302.7" height="216.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="193.3" y="271.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">CATARRAL</tspan></text><text x="193.3" y="461.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">1-2 semanas</tspan></text><rect x="348.7" y="253.0" width="302.7" height="216.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="500.0" y="271.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">PAROXÍSTICA</tspan></text><text x="500.0" y="461.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">2-6 semanas</tspan></text><rect x="655.3" y="253.0" width="302.7" height="216.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="806.7" y="271.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">CONVALECENCIA</tspan></text><text x="806.7" y="461.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">Semanas</tspan></text><path d="M 60.0,427.7 L 206.7,422.6 L 353.3,381.8 L 500.0,351.2 L 646.7,356.3 L 793.3,402.2 L 940.0,422.6" fill="none" stroke="#dc2626" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="58.0" y1="293.0" x2="80.0" y2="293.0" stroke="#dc2626" stroke-width="3"/><text x="86.0" y="297.0" font-size="10.5" font-weight="700" font-style="normal" fill="#dc2626" text-anchor="start" data-max="200"><tspan x="86.0" dy="0">Intensidad de la tos</tspan></text><line x1="500.0" y1="305.0" x2="500.0" y2="445.0" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/><rect x="454.6" y="428.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="500.0" y="443.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">◆ ESTE CASO</tspan></text><rect x="48.0" y="483.0" width="290.7" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="193.3" y="520.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">MUY CONTAGIOSA</tspan></text><text x="193.3" y="544.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">Resfrío, tos leve</tspan></text><rect x="354.7" y="483.0" width="290.7" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="511.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">PAROXISMOS</tspan></text><text x="500.0" y="535.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">Tos en accesos, estridor, vómitos</tspan><tspan x="500.0" dy="17">En lactantes: apneas, cianosis</tspan></text><rect x="661.3" y="483.0" width="290.7" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="806.7" y="520.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">MEJORA LENTA</tspan></text><text x="806.7" y="544.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">Tos que se va apagando</tspan></text><text x="40.0" y="614.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="624.2" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="655.2" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="627.2" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="646.7" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Leucocitosis &gt; 50</tspan><tspan x="285.0" dy="17">000 mononuclear</tspan></text><text x="435.0" y="646.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Linfocitos atípicos &gt;</tspan><tspan x="435.0" dy="17">18 %</tspan></text><text x="585.0" y="646.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Leucocitosis 15 000</tspan><tspan x="585.0" dy="17">neutrofílica</tspan></text><text x="735.0" y="646.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Más paroxismos</tspan><tspan x="735.0" dy="17">cianosantes</tspan></text><text x="885.0" y="646.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Fiebre persistente</tspan><tspan x="885.0" dy="17">de 38 °C</tspan></text><rect x="40.0" y="678.2" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="678.2" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="707.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Peor pronóstico?</tspan></text><text x="285.0" y="699.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: hipertensión</tspan><tspan x="285.0" dy="16">pulmonar</tspan></text><text x="435.0" y="707.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no es típico</tspan></text><text x="585.0" y="707.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: leve y neutrofílica</tspan></text><text x="735.0" y="699.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Preocupa, pero menos</tspan><tspan x="735.0" dy="16">que la hiperleucocitosis</tspan></text><text x="885.0" y="699.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: la tos ferina suele</tspan><tspan x="885.0" dy="16">no dar fiebre</tspan></text><rect x="40.0" y="624.2" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="752.2" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="780.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="802.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Leucocitosis &gt; 50 000 (linfocitos): la sangre espesa tapa los vasos pulmonares: hipertensión pulmonar refractaria.</tspan><tspan x="58.0" dy="18">• Tratamiento: azitromicina 5 días (de elección en &lt; 1 mes); hospitalizar a los menores de 3-4 meses.</tspan><tspan x="58.0" dy="18">• Prevención: vacuna Tdap a la gestante (semanas 27-36) y vacunación del lactante a los 2 meses.</tspan></text><text x="58.0" y="860.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, Pertussis for clinicians (2024); MINSA Perú, esquema de vacunación (2024); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>