an></text><text x="491.2" y="1038.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Comparar 2 medias</tspan></text><text x="678.8" y="1038.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Proporciones</tspan></text><text x="866.2" y="1038.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Muchas variables</tspan></text><rect x="40.0" y="963.9" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1075.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1103.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1125.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• IMC numérico, 2 grupos independientes, normalidad y homocedasticidad: t de Student para muestras independientes.</tspan><tspan x="58.0" dy="18">• Kolmogorov-Smirnov solo prueba si los datos son normales.</tspan><tspan x="58.0" dy="18">• Chi cuadrado compara proporciones (variables categóricas).</tspan></text><text x="58.0" y="1183.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Gordis, Epidemiología 6.ª ed.; Dawson-Trapp, Bioestadística médica.</tspan></text></svg>