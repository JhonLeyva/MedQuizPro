<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1051" viewBox="0 0 1000 1051" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El tramadol baja el umbral convulsivo por su acción serotoninérgica y noradrenérgica"><title>El tramadol baja el umbral convulsivo por su acción serotoninérgica y noradrenérgica</title><rect x="0.75" y="0.75" width="998.5" height="1049.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Farmacología · ruta del tramadol</tspan></text><rect x="392.8" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="436.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="436.0" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tramadol</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Opioide débil, agonista μ que además inhibe la recaptación de serotonina y noradrenalina.</tspan><tspan x="58.0" dy="17">Se activa en el hígado por CYP2D6.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Convulsiones tras un analgésico</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Posoperatorio de colecistectomía; 2 horas después,</tspan><tspan x="640.0" dy="16">crisis tonicoclónicas.</tspan><tspan x="640.0" dy="16">¿Qué analgésico se relaciona?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">RECORRIDO DEL FÁRMACO HASTA LA CONVULSIÓN</tspan></text><rect x="40.0" y="285.0" width="920.0" height="83.0" rx="0" fill="#e0f2fe" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="285.0" width="112.0" height="83.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="330.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Sangre</tspan></text><rect x="40.0" y="368.0" width="920.0" height="100.0" rx="0" fill="#fef3c7" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="368.0" width="112.0" height="100.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="422.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Hígado</tspan></text><rect x="40.0" y="468.0" width="920.0" height="83.0" rx="0" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="468.0" width="112.0" height="83.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="509.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Membrana</tspan><tspan x="96.0" dy="14">neuronal</tspan></text><rect x="40.0" y="551.0" width="920.0" height="100.0" rx="0" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="551.0" width="112.0" height="100.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="605.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Sinapsis</tspan></text><line x1="322.0" y1="353.0" x2="322.0" y2="372.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="317.0,372.0 327.0,372.0 322.0,381.0" fill="#0f766e"/><line x1="322.0" y1="453.0" x2="322.0" y2="472.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="317.0,472.0 327.0,472.0 322.0,481.0" fill="#0f766e"/><line x1="322.0" y1="536.0" x2="322.0" y2="555.0" stroke="#ea580c" stroke-width="2.2"/><polygon points="317.0,555.0 327.0,555.0 322.0,564.0" fill="#ea580c"/><line x1="472.0" y1="601.0" x2="480.1" y2="596.7" stroke="#ea580c" stroke-width="2.2"/><polygon points="482.4,601.1 477.7,592.3 488.0,592.5" fill="#ea580c"/><rect x="172.0" y="300.0" width="300.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="316.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Tramadol por vía oral o IV</tspan></text><text x="182.0" y="333.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Absorción rápida</tspan></text><circle cx="172.0" cy="300.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="304.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">1</tspan></text><rect x="172.0" y="383.0" width="300.0" height="70.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="399.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">CYP2D6 → metabolito activo</tspan><tspan x="182.0" dy="16">(O-desmetiltramadol)</tspan></text><text x="182.0" y="432.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Mayor afinidad por el receptor μ</tspan></text><circle cx="172.0" cy="383.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="387.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">2</tspan></text><rect x="172.0" y="483.0" width="300.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="499.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Agonista del receptor μ</tspan></text><text x="182.0" y="516.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Analgesia y depresión respiratoria</tspan></text><circle cx="172.0" cy="483.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="487.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">3</tspan></text><rect x="172.0" y="566.0" width="300.0" height="70.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="182.0" y="582.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Bloquea la recaptación de serotonina y</tspan><tspan x="182.0" dy="16">noradrenalina</tspan></text><text x="182.0" y="615.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Más monoaminas en la sinapsis</tspan></text><circle cx="172.0" cy="566.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="570.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">4</tspan></text><rect x="488.0" y="566.0" width="300.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="498.0" y="582.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="280"><tspan x="498.0" dy="0">Menor umbral convulsivo</tspan></text><text x="498.0" y="599.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="498.0" dy="0">Crisis tonicoclónica</tspan></text><circle cx="488.0" cy="566.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="488.0" y="570.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="488.0" dy="0">5</tspan></text><rect x="40.0" y="669.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="695.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Opioide + inhibidor de la recaptación = riesgo de convulsión</tspan></text><text x="60.0" y="714.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Dosis altas o interacciones con antidepresivos lo aumentan.</tspan></text><text x="40.0" y="781.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="791.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="813.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="794.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="813.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Tramadol</tspan></text><text x="435.0" y="813.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Meloxicam</tspan></text><text x="585.0" y="813.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Ketorolaco</tspan></text><text x="735.0" y="813.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Paracetamol</tspan></text><text x="885.0" y="813.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Celecoxib</tspan></text><rect x="40.0" y="828.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="828.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="857.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Analgésico?</tspan></text><text x="285.0" y="849.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: baja el umbral</tspan><tspan x="285.0" dy="16">convulsivo</tspan></text><text x="435.0" y="849.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: AINE con riesgo</tspan><tspan x="435.0" dy="16">digestivo y renal</tspan></text><text x="585.0" y="849.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: AINE, no produce</tspan><tspan x="585.0" dy="16">convulsiones</tspan></text><text x="735.0" y="849.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: hepatotoxicidad</tspan><tspan x="735.0" dy="16">solo en sobredosis</tspan></text><text x="885.0" y="849.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: AINE selectivo con</tspan><tspan x="885.0" dy="16">riesgo cardiovascular</tspan></text><rect x="40.0" y="791.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="902.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="930.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="952.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Riesgo mayor con dosis altas, insuficiencia renal o hepática, epilepsia o con ISRS, tricíclicos e IMAO (también síndrome serotoninérgico).</tspan><tspan x="58.0" dy="18">• Tratamiento: benzodiazepinas y suspender el fármaco; la naloxona no revierte bien las convulsiones.</tspan><tspan x="58.0" dy="18">• Los AINE producen gastropatía, sangrado y nefrotoxicidad, pero no convulsiones; el paracetamol, hepatotoxicidad en sobredosis.</tspan></text><text x="58.0" y="1010.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: PROSPECT, analgesia en colecistectomía laparoscópica (2020); Katzung Farmacología Básica y Clínica 15.ª ed.; OMS, escalera analgésica.</tspan></text></svg>