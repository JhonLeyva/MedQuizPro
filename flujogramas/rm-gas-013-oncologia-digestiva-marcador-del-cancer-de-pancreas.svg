<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Masa de cuerpo y cola de páncreas: el marcador más útil es el CA 19-9"><title>Masa de cuerpo y cola de páncreas: el marcador más útil es el CA 19-9</title><rect x="0.75" y="0.75" width="998.5" height="1058.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Oncología digestiva · marcador del cáncer de páncreas</tspan></text><rect x="525.4" y="32.0" width="165.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="608.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="149"><tspan x="608.2" dy="0">GASTROENTEROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Adenocarcinoma ductal de páncreas</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El cuerpo y la cola dan tumores silentes, sin ictericia, que se diagnostican tarde.</tspan><tspan x="58.0" dy="17">El CA 19-9 es un antígeno sialilado de Lewis.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 65 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dolor epigástrico de 1 mes y pérdida de peso, sin</tspan><tspan x="640.0" dy="16">ictericia.</tspan><tspan x="640.0" dy="16">TC: tumor de 6 cm entre el cuerpo y la cola del</tspan><tspan x="640.0" dy="16">páncreas.</tspan></text><line x1="640.0" y1="237.0" x2="670.0" y2="237.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ MARCADOR PERTENECE A CADA TUMOR</tspan></text><line x1="406.0" y1="448.7" x2="340.0" y2="450.2" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="450.2" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="421.1" y1="497.7" x2="340.0" y2="550.2" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="550.2" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.1" y1="416.7" x2="660.0" y2="393.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="393.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="474.6" x2="660.0" y2="496.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="496.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="420.3" y1="396.8" x2="340.0" y2="346.6" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="346.6" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="446.6" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="446.6" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="451.6" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">MARCADORES</tspan></text><text x="500.0" y="470.6" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">tumor y marcador</tspan></text><rect x="40.0" y="301.0" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="329.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">CA 19-9: PÁNCREAS</tspan></text><text x="190.0" y="353.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Adenocarcinoma ductal; indetectable en Lewis</tspan><tspan x="190.0" dy="17">negativos</tspan></text><rect x="144.6" y="382.2" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="397.2" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="408.2" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="409.2" width="6.0" height="82.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="441.9" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">CEA: COLORRECTAL</tspan></text><text x="190.0" y="465.6" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Seguimiento tras la cirugía</tspan></text><rect x="40.0" y="508.2" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="509.2" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="190.0" y="541.9" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">CA 125: OVARIO</tspan></text><text x="190.0" y="565.6" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Tumores epiteliales del ovario</tspan></text><rect x="660.0" y="351.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="352.0" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="384.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">CA 15-3 Y CA 27-29: MAMA</tspan></text><text x="810.0" y="408.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Seguimiento de la enfermedad metastásica</tspan></text><rect x="660.0" y="451.0" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="452.0" width="6.0" height="89.2" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="479.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">LÍMITE DEL CA 19-9</tspan></text><text x="810.0" y="503.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">También sube en colestasis, colangitis y</tspan><tspan x="810.0" dy="17">pancreatitis</tspan></text><text x="40.0" y="628.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="640.2" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="664.7" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Masa en cuerpo y cola con</tspan><tspan x="142.2" dy="17">dolor y pérdida de peso</tspan></text><line x1="248.5" y1="669.2" x2="267.5" y2="669.2" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,664.2 266.5,674.2 274.5,669.2" fill="#0f766e"/><rect x="278.5" y="640.2" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="664.7" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Sospecha de adenocarcinoma</tspan><tspan x="380.8" dy="17">ductal</tspan></text><line x1="487.0" y1="669.2" x2="506.0" y2="669.2" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,664.2 505.0,674.2 513.0,669.2" fill="#0f766e"/><rect x="517.0" y="640.2" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="664.7" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">CA 19-9 basal y TC</tspan><tspan x="619.2" dy="17">pancreática</tspan></text><line x1="725.5" y1="669.2" x2="744.5" y2="669.2" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,664.2 743.5,674.2 751.5,669.2" fill="#0f766e"/><rect x="755.5" y="640.2" width="204.5" height="58.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="673.2" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Biopsia por ecoendoscopia</tspan></text><text x="40.0" y="738.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="748.2" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="770.7" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="770.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">CEA</tspan></text><text x="435.0" y="770.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">CA 125</tspan></text><text x="585.0" y="770.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">CA 15-3</tspan></text><text x="735.0" y="770.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">CA 27-29</tspan></text><rect x="813.0" y="751.2" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="770.7" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">CA 19-9</tspan></text><rect x="40.0" y="785.2" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="785.2" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="814.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Marcador más</tspan><tspan x="54.0" dy="16">indicado?</tspan></text><text x="285.0" y="814.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es del cáncer</tspan><tspan x="285.0" dy="16">colorrectal</tspan></text><text x="435.0" y="814.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es del cáncer de</tspan><tspan x="435.0" dy="16">ovario</tspan></text><text x="585.0" y="814.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es del cáncer de</tspan><tspan x="585.0" dy="16">mama</tspan></text><text x="735.0" y="814.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es del cáncer de</tspan><tspan x="735.0" dy="16">mama</tspan></text><text x="885.0" y="806.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: marcador del</tspan><tspan x="885.0" dy="16">adenocarcinoma de</tspan><tspan x="885.0" dy="16">páncreas</tspan></text><rect x="40.0" y="748.2" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="875.2" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="903.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="925.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El CA 19-9 se eleva en la mayoría de los casos; sirve para carga tumoral, pronóstico y reacción al tratamiento. Se mide antes de operar y en el</tspan><tspan x="58.0" dy="18">   seguimiento.</tspan><tspan x="58.0" dy="18">• No sirve para tamizaje: también sube en colestasis benigna, colangitis y pancreatitis, y es indetectable en 5-10 % de personas Lewis negativas.</tspan><tspan x="58.0" dy="18">• CEA: colorrectal; CA 125: ovario; CA 15-3 y CA 27-29: mama.</tspan><tspan x="58.0" dy="18">• El diagnóstico es histológico (punción guiada por ecoendoscopia) y la resecabilidad se define con TC pancreática en fases arterial y portal.</tspan></text><text x="58.0" y="1019.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Conroy T et al., ESMO (Ann Oncol 2023;34:987); Sohal DPS et al., ASCO (J Clin Oncol 2020;38:3217); DeVita 12.ª ed. (2022).</tspan></text></svg>