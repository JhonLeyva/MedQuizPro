<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1026" viewBox="0 0 1000 1026" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Si la glucemia tiene media 95 y mediana 90, la mitad de los sujetos tiene valores menores de 90 mg/dL (distribución con cola a la derecha)"><title>Si la glucemia tiene media 95 y mediana 90, la mitad de los sujetos tiene valores menores de 90 mg/dL (distribución con cola a la derecha)</title><rect x="0.75" y="0.75" width="998.5" height="1024.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Bioestadística · medidas de tendencia central</tspan></text><rect x="468.7" y="32.0" width="143.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="540.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="127"><tspan x="540.4" dy="0">SALUD PÚBLICA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Media, mediana y moda</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Mediana: el valor del medio al ordenar los datos (el 50 % queda por debajo).</tspan><tspan x="58.0" dy="17">Si la media es mayor que la mediana, hay valores altos que la «jalan»: asimetría positiva</tspan><tspan x="58.0" dy="17">(cola a la derecha).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Muestra de glucemias</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Media aritmética: 95 mg/dL.</tspan><tspan x="640.0" dy="16">Mediana: 90 mg/dL.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DISTRIBUCIÓN CON COLA A LA DERECHA</tspan></text><rect x="40.0" y="269.0" width="540.0" height="340.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="98.0" y="289.0" width="139.2" height="272.0" rx="0" fill="#ccfbf1" stroke="none" stroke-width="0"/><text x="167.6" y="305.0" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="133"><tspan x="167.6" dy="0">50 %</tspan></text><rect x="237.2" y="289.0" width="324.8" height="272.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="0"/><text x="399.6" y="305.0" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="319"><tspan x="399.6" dy="0">50 %</tspan></text><line x1="98.0" y1="561.0" x2="562.0" y2="561.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="565.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">0</tspan></text><line x1="98.0" y1="425.0" x2="562.0" y2="425.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="429.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">50</tspan></text><line x1="98.0" y1="289.0" x2="562.0" y2="289.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="293.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">100</tspan></text><line x1="98.0" y1="561.0" x2="98.0" y2="566.0" stroke="#94a3b8" stroke-width="1.5"/><text x="98.0" y="580.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="98.0" dy="0">60</tspan></text><line x1="190.8" y1="561.0" x2="190.8" y2="566.0" stroke="#94a3b8" stroke-width="1.5"/><text x="190.8" y="580.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="190.8" dy="0">80</tspan></text><line x1="237.2" y1="561.0" x2="237.2" y2="566.0" stroke="#94a3b8" stroke-width="1.5"/><text x="237.2" y="580.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="237.2" dy="0">90</tspan></text><line x1="260.4" y1="561.0" x2="260.4" y2="566.0" stroke="#94a3b8" stroke-width="1.5"/><text x="260.4" y="580.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="260.4" dy="0">95</tspan></text><line x1="376.4" y1="561.0" x2="376.4" y2="566.0" stroke="#94a3b8" stroke-width="1.5"/><text x="376.4" y="580.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="376.4" dy="0">120</tspan></text><line x1="469.2" y1="561.0" x2="469.2" y2="566.0" stroke="#94a3b8" stroke-width="1.5"/><text x="469.2" y="580.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="469.2" dy="0">140</tspan></text><line x1="562.0" y1="561.0" x2="562.0" y2="566.0" stroke="#94a3b8" stroke-width="1.5"/><text x="562.0" y="580.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="562.0" dy="0">160</tspan></text><line x1="98.0" y1="561.0" x2="562.0" y2="561.0" stroke="#94a3b8" stroke-width="1.5"/><line x1="98.0" y1="289.0" x2="98.0" y2="561.0" stroke="#94a3b8" stroke-width="1.5"/><text x="330.0" y="599.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="464"><tspan x="330.0" dy="0">Glucemia (mg/dL)</tspan></text><text x="56.0" y="425.0" transform="rotate(-90 56.0 425.0)" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Número de personas</text><polyline points="98.0,555.6 125.8,533.8 153.7,479.4 181.5,392.4 209.4,321.6 223.3,310.8 237.2,321.6 260.4,354.3 283.6,397.8 320.7,446.8 367.1,490.3 422.8,522.9 492.4,544.7 562.0,555.6" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="237.2" y1="321.6" x2="237.2" y2="561.0" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4"/><circle cx="237.2" cy="321.6" r="9" fill="#ea580c" stroke="#ffffff" stroke-width="3"/><rect x="193.9" y="296.6" width="86.7" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="237.2" y="311.6" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="237.2" dy="0">◆ Mediana 90</tspan></text><rect x="602.0" y="348.5" width="358.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="617.0" y="372.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Mediana 90: la mitad está por debajo</tspan></text><text x="617.0" y="389.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Por definición (percentil 50).</tspan></text><rect x="602.0" y="411.5" width="358.0" height="55.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="617.0" y="435.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Media 95: jalada por valores altos</tspan></text><text x="617.0" y="452.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Cola a la derecha (asimetría positiva).</tspan></text><rect x="602.0" y="474.5" width="358.0" height="55.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="617.0" y="498.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Moda: el pico</tspan></text><text x="617.0" y="515.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Aquí ~87, pero el enunciado no la da.</tspan></text><rect x="40.0" y="627.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="653.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La mitad de los sujetos tiene &lt; 90 mg/dL</tspan></text><text x="60.0" y="672.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Media &gt; mediana = asimetría positiva.</tspan></text><text x="40.0" y="739.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="749.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="780.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="752.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="771.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">La mitad tiene &lt; 90</tspan><tspan x="285.0" dy="17">mg/dL</tspan></text><text x="435.0" y="771.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">La mitad tiene &lt; 95</tspan><tspan x="435.0" dy="17">mg/dL</tspan></text><text x="585.0" y="771.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">El valor más</tspan><tspan x="585.0" dy="17">frecuente es 90</tspan></text><text x="735.0" y="780.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">La DE es 5 mg/dL</tspan></text><text x="885.0" y="771.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">La moda es 95</tspan><tspan x="885.0" dy="17">mg/dL</tspan></text><rect x="40.0" y="803.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="803.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="832.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Verdadera?</tspan></text><text x="285.0" y="824.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: definición de</tspan><tspan x="285.0" dy="16">mediana</tspan></text><text x="435.0" y="824.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: 95 es la media, no</tspan><tspan x="435.0" dy="16">la mitad</tspan></text><text x="585.0" y="824.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: eso es la moda</tspan><tspan x="585.0" dy="16">(desconocida)</tspan></text><text x="735.0" y="832.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no se deduce</tspan></text><text x="885.0" y="824.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: la moda no se</tspan><tspan x="885.0" dy="16">conoce</tspan></text><rect x="40.0" y="749.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="877.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="905.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="927.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Moda: el valor más frecuente (no se puede saber con estos datos).</tspan><tspan x="58.0" dy="18">• La desviación estándar mide la dispersión: no se calcula con media y mediana.</tspan><tspan x="58.0" dy="18">• En datos asimétricos se prefiere informar la mediana.</tspan></text><text x="58.0" y="985.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Daniel, Bioestadística 4.ª ed.; Gordis, Epidemiología 6.ª ed..</tspan></text></svg>