<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="950" viewBox="0 0 1000 950" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Otitis media aguda en un niño de 15 kg: amoxicilina a dosis alta, 400 mg cada 8 horas"><title>Otitis media aguda en un niño de 15 kg: amoxicilina a dosis alta, 400 mg cada 8 horas</title><rect x="0.75" y="0.75" width="998.5" height="948.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · otitis media aguda</tspan></text><rect x="372.9" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="422.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="422.0" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Otitis media aguda supurada</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Streptococcus pneumoniae, Haemophilus influenzae no tipificable y Moraxella catarrhalis.</tspan><tspan x="58.0" dy="17">Primera línea: amoxicilina a dosis alta.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 4 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Peso de 15 kg con otitis media aguda supurada.</tspan><tspan x="640.0" dy="16">¿Qué dosis y qué intervalo de amoxicilina?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÁLCULO DE LA DOSIS DE AMOXICILINA CON EL PESO DEL NIÑO</tspan></text><rect x="40.0" y="269.0" width="170.0" height="110.0" rx="16" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="125.0" y="295.0" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="150"><tspan x="125.0" dy="0">PESO DEL CASO</tspan></text><text x="125.0" y="331.0" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">4 años</tspan></text><text x="125.0" y="353.0" font-size="11" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="146"><tspan x="125.0" dy="0">15 kg</tspan></text><line x1="214.0" y1="324.0" x2="229.0" y2="324.0" stroke="#0f766e" stroke-width="2"/><polygon points="228.0,319.0 228.0,329.0 236.0,324.0" fill="#0f766e"/><rect x="240.0" y="269.0" width="213.3" height="110.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="346.7" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="197"><tspan x="346.7" dy="0">DOSIS ALTA</tspan></text><text x="346.7" y="325.0" font-size="22" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="197"><tspan x="346.7" dy="0">80 a 90 mg/kg/día</tspan></text><text x="346.7" y="347.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="193"><tspan x="346.7" dy="0">Vence a neumococos con</tspan><tspan x="346.7" dy="15">sensibilidad disminuida</tspan></text><text x="473.3" y="335.0" font-size="30" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="40"><tspan x="473.3" dy="0">×</tspan></text><rect x="493.3" y="269.0" width="213.3" height="110.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="600.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="197"><tspan x="600.0" dy="0">TOTAL DIARIO EN 15 KG</tspan></text><text x="600.0" y="325.0" font-size="22" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="197"><tspan x="600.0" dy="0">1200-1350 mg/día</tspan></text><text x="600.0" y="347.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="193"><tspan x="600.0" dy="0">15 kg × 80 a 90 mg/kg</tspan></text><text x="726.7" y="335.0" font-size="30" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="40"><tspan x="726.7" dy="0">=</tspan></text><rect x="746.7" y="269.0" width="213.3" height="110.0" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="853.3" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="197"><tspan x="853.3" dy="0">REPARTIDA EN 3 TOMAS</tspan></text><text x="853.3" y="325.0" font-size="22" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="197"><tspan x="853.3" dy="0">400 a 450 mg</tspan></text><text x="853.3" y="347.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="193"><tspan x="853.3" dy="0">Cada 8 horas (2 tomas: 600 a 675</tspan><tspan x="853.3" dy="15">mg cada 12 h)</tspan></text><rect x="793.2" y="368.0" width="120.4" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="853.3" y="383.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="853.3" dy="0">◆ DOSIS DEL CASO</tspan></text><text x="44.0" y="415.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="44.0" dy="0">CADA ALTERNATIVA CONTRA EL CÁLCULO</tspan></text><rect x="40.0" y="425.0" width="176.0" height="90.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="128.0" y="443.0" font-size="9.5" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="160"><tspan x="128.0" dy="0">✓ COINCIDE</tspan></text><text x="128.0" y="461.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="128.0" dy="0">400 mg cada 8 horas =</tspan><tspan x="128.0" dy="17">1200 mg/día</tspan></text><text x="128.0" y="495.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="128.0" dy="0">Elección</tspan></text><rect x="226.0" y="425.0" width="176.0" height="90.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="314.0" y="443.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="160"><tspan x="314.0" dy="0">✗ NO</tspan></text><text x="314.0" y="461.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="314.0" dy="0">200 mg cada 12 horas =</tspan><tspan x="314.0" dy="17">400 mg/día</tspan></text><text x="314.0" y="495.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="314.0" dy="0">Subterapéutica</tspan></text><rect x="412.0" y="425.0" width="176.0" height="90.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="443.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="160"><tspan x="500.0" dy="0">✗ NO</tspan></text><text x="500.0" y="461.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="500.0" dy="0">250 mg cada 12 horas =</tspan><tspan x="500.0" dy="17">500 mg/día</tspan></text><text x="500.0" y="495.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="500.0" dy="0">Subterapéutica</tspan></text><rect x="598.0" y="425.0" width="176.0" height="90.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="686.0" y="443.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="160"><tspan x="686.0" dy="0">✗ NO</tspan></text><text x="686.0" y="461.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="686.0" dy="0">400 mg cada 24 horas =</tspan><tspan x="686.0" dy="17">400 mg/día</tspan></text><text x="686.0" y="495.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="686.0" dy="0">Una toma, insuficiente</tspan></text><rect x="784.0" y="425.0" width="176.0" height="90.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="872.0" y="443.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="160"><tspan x="872.0" dy="0">✗ NO</tspan></text><text x="872.0" y="461.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="872.0" dy="0">100 mg cada 8 horas =</tspan><tspan x="872.0" dy="17">300 mg/día</tspan></text><text x="872.0" y="495.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="872.0" dy="0">Subterapéutica</tspan></text><rect x="40.0" y="533.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="559.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Amoxicilina 400 mg cada 8 horas</tspan></text><text x="60.0" y="578.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Es la única opción que alcanza los 80 a 90 mg/kg/día.</tspan></text><text x="40.0" y="645.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="655.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="686.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="658.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="677.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">400 mg cada 8</tspan><tspan x="285.0" dy="17">horas</tspan></text><text x="435.0" y="677.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">200 mg cada 12</tspan><tspan x="435.0" dy="17">horas</tspan></text><text x="585.0" y="677.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">250 mg cada 12</tspan><tspan x="585.0" dy="17">horas</tspan></text><text x="735.0" y="677.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">400 mg cada 24</tspan><tspan x="735.0" dy="17">horas</tspan></text><text x="885.0" y="677.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">100 mg cada 8</tspan><tspan x="885.0" dy="17">horas</tspan></text><rect x="40.0" y="709.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="709.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="738.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Dosis y frecuencia?</tspan></text><text x="285.0" y="730.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: 1200 mg/día, 80</tspan><tspan x="285.0" dy="16">mg/kg/día en 3 tomas</tspan></text><text x="435.0" y="730.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: 400 mg al día,</tspan><tspan x="435.0" dy="16">menos de 30 mg/kg</tspan></text><text x="585.0" y="730.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: 500 mg al día,</tspan><tspan x="585.0" dy="16">menos de 35 mg/kg</tspan></text><text x="735.0" y="730.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: una sola toma,</tspan><tspan x="735.0" dy="16">insuficiente</tspan></text><text x="885.0" y="730.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: 300 mg al día,</tspan><tspan x="885.0" dy="16">subterapéutica</tspan></text><rect x="40.0" y="655.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="783.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="811.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="833.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Amoxicilina a 80 a 90 mg/kg/día vence a los neumococos con sensibilidad disminuida a penicilina. En 15 kg: 1200 a 1350 mg al día.</tspan><tspan x="58.0" dy="18">• Repartida en 3 tomas: 400 mg cada 8 horas, única opción que llega a la dosis. La AAP 2013 admite 2 tomas diarias con igual eficacia.</tspan><tspan x="58.0" dy="18">• Amoxicilina-clavulánico si recibió amoxicilina en los 30 días previos, tiene conjuntivitis purulenta o falla a las 48-72 horas.</tspan><tspan x="58.0" dy="18">• Duración: 10 días en menores de 2 años y 5 a 7 días en niños de 6 años o más con enfermedad leve. En niños mayores sin gravedad se puede observar.</tspan></text><text x="58.0" y="909.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Lieberthal AS et al., AAP, Diagnosis and Management of Acute Otitis Media, Pediatrics 2013;131:e964; Nelson 22.ª ed. (2024).</tspan></text></svg>