<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1054" viewBox="0 0 1000 1054" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Fluorizar el agua de una localidad es una intervención comunitaria que previene la caries"><title>Fluorizar el agua de una localidad es una intervención comunitaria que previene la caries</title><rect x="0.75" y="0.75" width="998.5" height="1052.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Salud pública · paquetes del MAIS-BFC</tspan></text><rect x="431.7" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="496.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="496.0" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Paquetes de atención del MAIS-BFC</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Dirigidos a la persona, la familia y la comunidad.</tspan><tspan x="58.0" dy="17">La comunidad recibe actividades de promoción y prevención en sus escenarios.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Establecimiento de salud</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Fluoriza el agua para consumo humano de las</tspan><tspan x="640.0" dy="16">localidades.</tspan><tspan x="640.0" dy="16">Objetivo: prevenir la caries. ¿Qué actividad es?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">A QUIÉN SE DIRIGE CADA PAQUETE DE ATENCIÓN</tspan></text><rect x="40.0" y="285.0" width="920.0" height="95.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="285.0" width="108.0" height="95.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="336.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Persona</tspan></text><rect x="40.0" y="380.0" width="920.0" height="95.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="380.0" width="108.0" height="95.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="431.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Familia</tspan></text><rect x="40.0" y="475.0" width="920.0" height="95.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="475.0" width="108.0" height="95.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="526.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Comunidad</tspan></text><line x1="348.0" y1="332.5" x2="355.0" y2="332.5" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="332.5" x2="355.0" y2="419.5" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="419.5" x2="353.0" y2="419.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="353.0,424.5 353.0,414.5 362.0,419.5" fill="#0f766e"/><line x1="552.0" y1="419.5" x2="559.0" y2="419.5" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="419.5" x2="559.0" y2="522.5" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="522.5" x2="557.0" y2="522.5" stroke="#ea580c" stroke-width="2.2"/><polygon points="557.0,527.5 557.0,517.5 566.0,522.5" fill="#ea580c"/><line x1="756.0" y1="522.5" x2="763.0" y2="522.5" stroke="#ea580c" stroke-width="2.2"/><line x1="763.0" y1="522.5" x2="763.0" y2="522.5" stroke="#ea580c" stroke-width="2.2"/><line x1="763.0" y1="522.5" x2="761.0" y2="522.5" stroke="#ea580c" stroke-width="2.2"/><polygon points="761.0,527.5 761.0,517.5 770.0,522.5" fill="#ea580c"/><rect x="158.0" y="298.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="314.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Paquete a la persona</tspan></text><text x="168.0" y="331.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Atención individual por etapa de</tspan><tspan x="168.0" dy="14.5">vida</tspan></text><circle cx="158.0" cy="298.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="302.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="362.0" y="393.0" width="190.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="372.0" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Paquete a la familia</tspan></text><text x="372.0" y="426.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Visita domiciliaria y plan familiar</tspan></text><circle cx="362.0" cy="393.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="362.0" y="397.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="362.0" dy="0">2</tspan></text><rect x="566.0" y="488.0" width="190.0" height="69.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="576.0" y="504.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Intervención comunitaria</tspan></text><text x="576.0" y="521.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Actividades para toda la</tspan><tspan x="576.0" dy="14.5">población de la localidad</tspan></text><circle cx="566.0" cy="488.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="566.0" y="492.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="566.0" dy="0">3</tspan></text><rect x="770.0" y="488.0" width="190.0" height="69.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="780.0" y="504.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Fluorización del agua</tspan></text><text x="780.0" y="521.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Prevención específica de la</tspan><tspan x="780.0" dy="14.5">caries en todos los habitantes</tspan></text><circle cx="770.0" cy="488.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="770.0" y="492.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="770.0" dy="0">4</tspan></text><rect x="40.0" y="588.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="614.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Fluorizar el agua de la localidad = intervención comunitaria</tspan></text><text x="60.0" y="633.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">No depende de la decisión individual ni involucra a la comunidad como ejecutora.</tspan></text><text x="40.0" y="700.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="710.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="741.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="732.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Participación</tspan><tspan x="285.0" dy="17">comunitaria</tspan></text><text x="435.0" y="741.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Acción social</tspan></text><text x="585.0" y="732.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Promoción de la</tspan><tspan x="585.0" dy="17">salud</tspan></text><rect x="663.0" y="713.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="732.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Intervención</tspan><tspan x="735.0" dy="17">comunitaria</tspan></text><text x="885.0" y="732.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Intervención</tspan><tspan x="885.0" dy="17">sanitaria</tspan></text><rect x="40.0" y="764.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="764.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="793.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué tipo de actividad</tspan><tspan x="54.0" dy="16">es?</tspan></text><text x="285.0" y="785.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: la ejecuta el</tspan><tspan x="285.0" dy="16">servicio, no la</tspan><tspan x="285.0" dy="16">comunidad</tspan></text><text x="435.0" y="801.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no es acción social</tspan></text><text x="585.0" y="785.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: defendible en</tspan><tspan x="585.0" dy="16">sentido amplio, pero no</tspan><tspan x="585.0" dy="16">es la clave</tspan></text><text x="735.0" y="785.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: actúa sobre toda la</tspan><tspan x="735.0" dy="16">población de la</tspan><tspan x="735.0" dy="16">localidad</tspan></text><text x="885.0" y="793.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: término amplio sin</tspan><tspan x="885.0" dy="16">precisar el nivel</tspan></text><rect x="40.0" y="710.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="854.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="882.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="904.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Intervención comunitaria: promoción y prevención para necesidades de la población en escuelas, centros laborales y redes sociales.</tspan><tspan x="58.0" dy="18">• La fluorización actúa sobre toda la localidad y no sobre un individuo: es prevención específica de la caries a nivel comunitario.</tspan><tspan x="58.0" dy="18">• Participación comunitaria y acción social son formas de involucrar a la gente; la fluorización la ejecuta el servicio. Intervención sanitaria es el término más</tspan><tspan x="58.0" dy="18">   amplio.</tspan><tspan x="58.0" dy="18">• Alerta: la clave del banco es intervención comunitaria; promoción de la salud es defendible en sentido amplio.</tspan></text><text x="58.0" y="998.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA, Modelo de Atención Integral de Salud basado en Familia y Comunidad (RM 464-2011/MINSA); Iheozor-Ejiofor y cols., Cochrane Database Syst Rev 2015; OMS,</tspan><tspan x="58.0" dy="15">Fluoruros y salud bucodental.</tspan></text></svg>