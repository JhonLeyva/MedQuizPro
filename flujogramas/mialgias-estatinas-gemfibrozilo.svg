<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1004" viewBox="0 0 820 1004" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Mialgias por estatinas y gemfibrozilo"><title>Mialgias por estatinas y gemfibrozilo</title><rect width="820" height="1004" fill="#ffffff"/><rect x="0" y="0" width="820" height="112" fill="#0f766e"/><text x="40" y="34" font-size="13" font-weight="600" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="740"><tspan x="40" dy="0">MedQuizPlus · Flujograma</tspan></text><text x="40" y="70" font-size="24" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="740"><tspan x="40" dy="0">Mialgias por estatinas y gemfibrozilo</tspan></text><text x="40" y="96" font-size="13" font-weight="400" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="740"><tspan x="40" dy="0">ENAM 2020 · CB-002 · Ciencias Básicas</tspan></text><rect x="90" y="144" width="640" height="76" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="108" y="172" font-size="11" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="604"><tspan x="108" dy="0">INICIO</tspan></text><text x="108" y="196" font-size="16" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Paciente que recibe una estatina junto con un fibrato</tspan></text><line x1="410.0" y1="222" x2="410.0" y2="242" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,240 417.0,240 410.0,250" fill="#94a3b8"/><rect x="90" y="252" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="280" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="304" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">El gemfibrozilo inhibe el metabolismo de la estatina y eleva</tspan><tspan x="108" dy="22">su nivel en sangre</tspan></text><line x1="410.0" y1="352" x2="410.0" y2="372" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,370 417.0,370 410.0,380" fill="#94a3b8"/><rect x="90" y="382" width="640" height="76" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><circle cx="120" cy="420.0" r="12" fill="#d97706"/><text x="120" y="425.0" font-size="15" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="120" dy="0">?</tspan></text><text x="142" y="410" font-size="11" font-weight="700" font-style="normal" fill="#b45309" text-anchor="start" data-max="570"><tspan x="142" dy="0">DECISIÓN</tspan></text><text x="142" y="434" font-size="16" font-weight="600" font-style="normal" fill="#78350f" text-anchor="start" data-max="570"><tspan x="142" dy="0">¿Dolor o debilidad muscular, u orina oscura?</tspan></text><line x1="410.0" y1="460" x2="410.0" y2="480" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,478 417.0,478 410.0,488" fill="#94a3b8"/><rect x="90" y="490" width="640" height="76" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="518" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="542" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Dosar CPK y función renal</tspan></text><line x1="410.0" y1="568" x2="410.0" y2="588" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,586 417.0,586 410.0,596" fill="#94a3b8"/><rect x="90" y="598" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="626" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="650" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Suspender o ajustar el hipolipemiante; si se necesita</tspan><tspan x="108" dy="22">fibrato, preferir fenofibrato</tspan></text><line x1="410.0" y1="698" x2="410.0" y2="718" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,716 417.0,716 410.0,726" fill="#94a3b8"/><rect x="90" y="728" width="640" height="98" rx="12" fill="#134e4a" stroke="#134e4a" stroke-width="2"/><text x="108" y="756" font-size="11" font-weight="700" font-style="normal" fill="#5eead4" text-anchor="start" data-max="604"><tspan x="108" dy="0">CONDUCTA FINAL</tspan></text><text x="108" y="780" font-size="16" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">CPK mayor de 10 veces lo normal o rabdomiólisis: suspender e</tspan><tspan x="108" dy="22">hidratar</tspan></text><rect x="40" y="856" width="740" height="98" rx="10" fill="#f0fdfa" stroke="#99f6e4"/><rect x="40" y="856" width="6" height="98" rx="3" fill="#14b8a6"/><text x="62" y="882" font-size="14" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="704"><tspan x="62" dy="0">Perla clínica</tspan></text><text x="62" y="906" font-size="15" font-weight="400" font-style="normal" fill="#134e4a" text-anchor="start" data-max="704"><tspan x="62" dy="0">Estatina + gemfibrozilo es la asociación con mayor riesgo de miopatía; con</tspan><tspan x="62" dy="21">fenofibrato el riesgo es menor.</tspan></text><text x="410.0" y="982" font-size="11" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="740"><tspan x="410.0" dy="0">MedQuizPlus · Material de estudio: contrasta siempre con las guías clínicas vigentes.</tspan></text></svg>
