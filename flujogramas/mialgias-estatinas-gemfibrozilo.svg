<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="578" viewBox="0 0 1000 578" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Miopatía por estatinas y fibratos"><title>Miopatía por estatinas y fibratos</title><rect x="0.75" y="0.75" width="998.5" height="576.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16" y="16" width="968" height="56" rx="10" fill="#0f766e"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170" y1="34.0" x2="170" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="611"><tspan x="184.0" dy="0">CIENCIAS BÁSICAS ENAM: MIOPATÍA POR ESTATINAS Y FIBRATOS</tspan></text><rect x="814.8" y="32.0" width="149.2" height="24" rx="12" fill="#134e4a"/><text x="889.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="133"><tspan x="889.4" dy="0">CIENCIAS BÁSICAS</tspan></text><rect x="190.0" y="90.0" width="620" height="67.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="500.0" y="118.5" font-size="14.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Varón de 62 años con atorvastatina + gemfibrozilo</tspan></text><text x="500.0" y="141.0" font-size="12" font-weight="400" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Mialgias en miembros inferiores desde hace 2 meses</tspan></text><line x1="500.0" y1="157.0" x2="500.0" y2="178.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,177.0 505.0,177.0 500.0,185.0" fill="#0f766e"/><rect x="210.0" y="185.0" width="580" height="100.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="212.5" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="552"><tspan x="500.0" dy="0">MIALGIAS POR MEDICAMENTOS</tspan></text><text x="500.0" y="235.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="552"><tspan x="500.0" dy="0">• El gemfibrozilo inhibe la glucuronidación</tspan><tspan x="500.0" dy="17">• de la estatina: aumenta su nivel sérico</tspan><tspan x="500.0" dy="17">• y el riesgo de miopatía y rabdomiólisis</tspan></text><line x1="500.0" y1="285.0" x2="500.0" y2="303.0" stroke="#0f766e" stroke-width="2"/><line x1="270.0" y1="303.0" x2="730.0" y2="303.0" stroke="#0f766e" stroke-width="2"/><line x1="270.0" y1="303.0" x2="270.0" y2="318.0" stroke="#0f766e" stroke-width="2"/><polygon points="265.0,317.0 275.0,317.0 270.0,325.0" fill="#0f766e"/><line x1="730.0" y1="303.0" x2="730.0" y2="318.0" stroke="#0f766e" stroke-width="2"/><polygon points="725.0,317.0 735.0,317.0 730.0,325.0" fill="#0f766e"/><rect x="70.0" y="325.0" width="400" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="270.0" y="352.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="372"><tspan x="270.0" dy="0">Evaluar</tspan></text><text x="270.0" y="375.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="372"><tspan x="270.0" dy="0">CPK y función renal</tspan><tspan x="270.0" dy="17">Color de la orina</tspan><tspan x="270.0" dy="17">(mioglobinuria)</tspan></text><rect x="530.0" y="325.0" width="400" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="730.0" y="352.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="372"><tspan x="730.0" dy="0">Conducta</tspan></text><text x="730.0" y="375.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="372"><tspan x="730.0" dy="0">Suspender o ajustar dosis</tspan><tspan x="730.0" dy="17">Si se necesita fibrato:</tspan><tspan x="730.0" dy="17">fenofibrato (menor riesgo)</tspan></text><rect x="40" y="451.0" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="479.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="501.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• CPK &gt; 10 veces el límite normal o rabdomiólisis: suspender la estatina e hidratar.</tspan><tspan x="58.0" dy="18">• La asociación estatina + gemfibrozilo es la de mayor riesgo de miopatía.</tspan></text><text x="58.0" y="541.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACC/AHA Guideline on Blood Cholesterol · Goodman &amp; Gilman 14.ª ed.</tspan></text></svg>
