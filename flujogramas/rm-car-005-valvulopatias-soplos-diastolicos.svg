<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="786" viewBox="0 0 1000 786" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El soplo de Austin Flint se ausculta en la insuficiencia aórtica"><title>El soplo de Austin Flint se ausculta en la insuficiencia aórtica</title><rect x="0.75" y="0.75" width="998.5" height="784.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Valvulopatías · soplos diastólicos</tspan></text><rect x="398.9" y="32.0" width="117.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="457.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="101"><tspan x="457.6" dy="0">CARDIOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Soplo de Austin Flint</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Retumbo mesodiastólico apical en la insuficiencia aórtica grave.</tspan><tspan x="58.0" dy="17">El chorro regurgitante hace vibrar el velo mitral anterior.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿En qué valvulopatía se ausculta?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DOS SOPLOS QUE SUENAN EN LA DIÁSTOLE</tspan></text><rect x="40.0" y="253.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="275.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="190"><tspan x="54.0" dy="0">VALVULOPATÍA</tspan></text><text x="427.5" y="275.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="335"><tspan x="427.5" dy="0">Soplo</tspan></text><text x="782.5" y="275.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="335"><tspan x="782.5" dy="0">Signos que la distinguen</tspan></text><rect x="40.0" y="293.0" width="204.0" height="57.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="319.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="182"><tspan x="54.0" dy="0">Insuficiencia aórtica</tspan></text><text x="54.0" y="336.0" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="182"><tspan x="54.0" dy="0">Reflujo hacia el ventrículo</tspan></text><rect x="253.0" y="293.0" width="349.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="265.0" y="318.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="331"><tspan x="265.0" dy="0">Diastólico aspirativo + Austin Flint</tspan></text><text x="265.0" y="334.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="331"><tspan x="265.0" dy="0">Borde esternal izquierdo y ápex</tspan></text><rect x="501.2" y="282.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="546.6" y="297.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="546.6" dy="0">◆ ESTE CASO</tspan></text><rect x="608.0" y="293.0" width="349.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="620.0" y="318.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="331"><tspan x="620.0" dy="0">Pulso amplio y saltón</tspan></text><text x="620.0" y="334.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="331"><tspan x="620.0" dy="0">Corrigan, Musset, Quincke</tspan></text><rect x="40.0" y="356.0" width="204.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="382.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="182"><tspan x="54.0" dy="0">Estenosis mitral</tspan></text><text x="54.0" y="399.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="54.0" dy="0">Obstrucción del llenado</tspan></text><rect x="253.0" y="356.0" width="349.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="265.0" y="381.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="331"><tspan x="265.0" dy="0">Retumbo con chasquido de apertura</tspan></text><text x="265.0" y="397.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="331"><tspan x="265.0" dy="0">Ápex</tspan></text><rect x="608.0" y="356.0" width="349.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="620.0" y="381.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="331"><tspan x="620.0" dy="0">Primer ruido intenso, FA</tspan></text><text x="620.0" y="397.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="331"><tspan x="620.0" dy="0">Aurícula izquierda grande</tspan></text><text x="44.0" y="435.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">El Austin Flint es un retumbo funcional: no hay chasquido de apertura.</tspan></text><text x="40.0" y="483.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="493.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="524.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="524.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Estenosis mitral</tspan></text><rect x="363.0" y="496.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="524.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Insuficiencia aórtica</tspan></text><text x="585.0" y="515.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Insuficiencia</tspan><tspan x="585.0" dy="17">tricuspídea</tspan></text><text x="735.0" y="524.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Estenosis aórtica</tspan></text><text x="885.0" y="515.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Estenosis</tspan><tspan x="885.0" dy="17">tricuspídea</tspan></text><rect x="40.0" y="547.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="547.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="584.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Valvulopatía?</tspan></text><text x="285.0" y="576.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: tiene chasquido de</tspan><tspan x="285.0" dy="16">apertura</tspan></text><text x="435.0" y="568.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: el chorro</tspan><tspan x="435.0" dy="16">regurgitante golpea el</tspan><tspan x="435.0" dy="16">velo mitral</tspan></text><text x="585.0" y="584.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: da soplo sistólico</tspan></text><text x="735.0" y="576.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: soplo sistólico</tspan><tspan x="735.0" dy="16">eyectivo</tspan></text><text x="885.0" y="576.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: soplo diastólico</tspan><tspan x="885.0" dy="16">tricuspídeo</tspan></text><rect x="40.0" y="493.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="637.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="665.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="687.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Insuficiencia aórtica: soplo diastólico aspirativo, presión de pulso amplia, Corrigan, Musset, Quincke y Duroziez.</tspan><tspan x="58.0" dy="18">• Estenosis mitral orgánica: chasquido de apertura y primer ruido intenso (el Austin Flint no los tiene).</tspan><tspan x="58.0" dy="18">• En la insuficiencia aórtica aguda (endocarditis, disección) hay edema pulmonar y shock: cirugía urgente.</tspan></text><text x="58.0" y="745.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACC/AHA, valvulopatías (2020); ESC/EACTS, valvulopatías (2021); Braunwald Tratado de Cardiología 12.ª ed.</tspan></text></svg>