#ffffff" text-anchor="middle" data-max="0"><tspan x="162.7" dy="0">1</tspan></text><text x="320.0" y="431.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="283"><tspan x="320.0" dy="0">Temblor fino, hiperreflexia, más</tspan><tspan x="320.0" dy="17">deposiciones: tirotoxicosis</tspan></text><line x1="511.5" y1="435.0" x2="606.0" y2="435.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="422.0" width="86.4" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="657.2" y="439.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="657.2" dy="0">✕ Diuréticos</tspan></text><line x1="636.0" y1="435.5" x2="690.4" y2="435.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="706.4" y="422.0" width="105.4" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="759.1" y="439.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="759.1" dy="0">✕ Antipsicóticos</tspan></text><line x1="728.4" y1="435.5" x2="801.8" y2="435.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="136.7,469.0 483.3,469.0 435.0,546.0 185.0,546.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="507.5" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="511.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">2</tspan></text><text x="320.0" y="495.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">Sin bocio, pérdida de peso</tspan><tspan x="320.0" dy="17">con aumento del ritmo</tspan><tspan x="320.0" dy="17">evacuatorio</tspan></text><line x1="463.2" y1="507.5" x2="606.0" y2="507.5" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="494.5" width="98.9" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="663.4" y="512.0" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="663.4" dy="0">✕ Anfetaminas</tspan></text><line x1="636.0" y1="508.0" x2="702.9" y2="508.0" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="550.0" x2="310.0" y2="569.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,568.0 315.0,568.0 310.0,576.0" fill="#0f766e"/><rect x="140.0" y="580.0" width="340.0" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="609.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">HORMONA TIROIDEA</tspan></text><text x="310.0" y="633.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">TSH suprimida, T4 alta, tiroglobulina baja</tspan><tspan x="310.0" dy="17">Suspender el producto y propranolol</tspan></text><rect x="370.6" y="569.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="584.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="587.9" width="346.0" height="76.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="607.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="625.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">La tiroglobulina baja distingue la ingesta de hormona de</tspan><tspan x="628.0" dy="16">la tiroiditis.</tspan></text><rect x="40.0" y="695.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="723.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="745.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La captación de yodo está baja.</tspan><tspan x="58.0" dy="18">• Los productos 'naturales' para adelgazar pueden contener T3/T4.</tspan><tspan x="58.0" dy="18">• La hipokalemia puede venir de la diarrea.</tspan></text><text x="58.0" y="803.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ATA – Guidelines for hyperthyroidism and other causes of thyrotoxicosis (2016)</tspan></text></svg>