<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="587" viewBox="0 0 1000 587" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Meningitis tuberculosa"><title>Meningitis tuberculosa</title><rect x="0.75" y="0.75" width="998.5" height="585.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16" y="16" width="968" height="56" rx="10" fill="#0f766e"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170" y1="34.0" x2="170" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="642"><tspan x="184.0" dy="0">INFECTOLOGÍA ENAM: MENINGITIS TUBERCULOSA</tspan></text><rect x="845.6" y="32.0" width="118.4" height="24" rx="12" fill="#134e4a"/><text x="904.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="102"><tspan x="904.8" dy="0">INFECTOLOGÍA</tspan></text><rect x="190.0" y="90.0" width="620" height="86.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="500.0" y="118.5" font-size="14.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Mujer de 35 años con 3 semanas de febrícula y sudoración</tspan><tspan x="500.0" dy="19.0">nocturna</tspan></text><text x="500.0" y="160.0" font-size="12" font-weight="400" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Somnolencia, cefalea, vómitos, rigidez de nuca, Kernig positivo</tspan></text><line x1="500.0" y1="176.0" x2="500.0" y2="195.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,194.0 505.0,194.0 500.0,202.0" fill="#0f766e"/><polygon points="180.0,237.0 220.0,202.0 780.0,202.0 820.0,237.0 780.0,272.0 220.0,272.0" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><circle cx="242.0" cy="237.0" r="13" fill="#f59e0b"/><text x="242.0" y="242.5" font-size="16" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="242.0" dy="0">?</tspan></text><text x="514.0" y="233.0" font-size="13.5" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="470"><tspan x="514.0" dy="0">Punción lumbar: ¿LCR con linfocitos, proteínas altas</tspan><tspan x="514.0" dy="18">y glucosa baja?</tspan></text><line x1="500.0" y1="272.0" x2="500.0" y2="294.0" stroke="#0f766e" stroke-width="2"/><line x1="270.0" y1="294.0" x2="730.0" y2="294.0" stroke="#0f766e" stroke-width="2"/><line x1="270.0" y1="294.0" x2="270.0" y2="327.0" stroke="#0f766e" stroke-width="2"/><polygon points="265.0,326.0 275.0,326.0 270.0,334.0" fill="#0f766e"/><rect x="254.0" y="302.0" width="32.0" height="20" rx="10" fill="#059669"/><text x="270.0" y="316.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="270.0" dy="0">SÍ</tspan></text><line x1="730.0" y1="294.0" x2="730.0" y2="327.0" stroke="#0f766e" stroke-width="2"/><polygon points="725.0,326.0 735.0,326.0 730.0,334.0" fill="#0f766e"/><rect x="714.0" y="302.0" width="32.0" height="20" rx="10" fill="#e11d48"/><text x="730.0" y="316.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="730.0" dy="0">NO</tspan></text><rect x="70.0" y="334.0" width="400" height="100.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="270.0" y="361.5" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="372"><tspan x="270.0" dy="0">MENINGITIS TUBERCULOSA</tspan></text><text x="270.0" y="384.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="372"><tspan x="270.0" dy="0">ADA en LCR elevada</tspan><tspan x="270.0" dy="17">GeneXpert MTB/RIF en LCR</tspan><tspan x="270.0" dy="17">Tratamiento antiTB + corticoide</tspan></text><rect x="377.8" y="324.0" width="84.2" height="20" rx="10" fill="#f59e0b"/><text x="419.9" y="338.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="419.9" dy="0">✓ RESPUESTA</tspan></text><rect x="530.0" y="334.0" width="400" height="100.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="730.0" y="361.5" font-size="13.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="372"><tspan x="730.0" dy="0">Neutrófilos predominantes</tspan></text><text x="730.0" y="384.0" font-size="12" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="372"><tspan x="730.0" dy="0">Pensar en meningitis</tspan><tspan x="730.0" dy="17">bacteriana aguda</tspan><tspan x="730.0" dy="17">Ceftriaxona ± vancomicina</tspan></text><rect x="40" y="460.0" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="488.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="510.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Síndrome meníngeo SUBAGUDO + síntomas constitucionales = meningitis tuberculosa.</tspan><tspan x="58.0" dy="18">• TAC antes de la punción si hay focalización o edema de papila.</tspan></text><text x="58.0" y="550.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA – NTS N.° 200-MINSA/DGIESP-2023 (Tuberculosis) · OMS 2022 Consolidated TB Guidelines</tspan></text></svg>
