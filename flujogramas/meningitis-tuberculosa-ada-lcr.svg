<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1274" viewBox="0 0 1000 1274" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="3 semanas de febrícula y sudor nocturno con cefalea, vómitos, somnolencia y signos meníngeos: meningitis tuberculosa, ADA en LCR"><title>3 semanas de febrícula y sudor nocturno con cefalea, vómitos, somnolencia y signos meníngeos: meningitis tuberculosa, ADA en LCR</title><rect x="0.75" y="0.75" width="998.5" height="1273.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Tuberculosis extrapulmonar · meningitis tuberculosa</tspan></text><rect x="512.2" y="32.0" width="136.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="580.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="121"><tspan x="580.5" dy="0">INFECTOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Meningitis tuberculosa</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Meningitis subaguda (semanas) con síntomas generales; afecta la base del cerebro y los</tspan><tspan x="58.0" dy="17">pares craneales.</tspan><tspan x="58.0" dy="17">LCR: linfocitos, proteínas altas y glucosa muy baja; ADA alta.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 35 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">3 semanas de malestar, hiporexia, febrícula y sudor</tspan><tspan x="640.0" dy="16">nocturno.</tspan><tspan x="640.0" dy="16">Somnolienta, cefalea intensa, vómitos, rigidez de nuca</tspan><tspan x="640.0" dy="16">y Kernig (+).</tspan></text><line x1="640.0" y1="237.0" x2="670.0" y2="237.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#94a3b8"/><line x1="500.0" y1="393.0" x2="500.0" y2="423.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="423.0" x2="811.3" y2="423.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="423.0" x2="188.7" y2="452.0" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,451.0 193.7,451.0 188.7,459.0" fill="#94a3b8"/><line x1="500.0" y1="423.0" x2="500.0" y2="452.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,451.0 505.0,451.0 500.0,459.0" fill="#94a3b8"/><line x1="811.3" y1="423.0" x2="811.3" y2="452.0" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,451.0 816.3,451.0 811.3,459.0" fill="#94a3b8"/><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#0f766e"/><line x1="500.0" y1="393.0" x2="500.0" y2="423.0" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="423.0" x2="500.0" y2="423.0" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="423.0" x2="188.7" y2="452.0" stroke="#0f766e" stroke-width="3"/><polygon points="183.7,451.0 193.7,451.0 188.7,459.0" fill="#0f766e"/><rect x="66.4" y="432.0" width="244.5" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="188.7" y="444.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">Linfocitos, glucosa baja, ADA alta (este caso)</tspan></text><rect x="430.3" y="432.0" width="139.4" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="500.0" y="444.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">Neutrófilos, inicio agudo</tspan></text><rect x="739.5" y="432.0" width="143.7" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="811.3" y="444.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">Tinta china o antígeno (+)</tspan></text><polygon points="240.0,358.0 266.0,323.0 734.0,323.0 760.0,358.0 734.0,393.0 266.0,393.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="358.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="363.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="354.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Meningitis subaguda con síntomas generales: punción</tspan><tspan x="519.0" dy="17">lumbar</tspan></text><rect x="40.0" y="459.0" width="297.3" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="188.7" y="487.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">MENINGITIS TUBERCULOSA</tspan></text><text x="188.7" y="510.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">ADA en LCR + Xpert Ultra</tspan><tspan x="188.7" dy="17">Antituberculosos + dexametasona</tspan></text><rect x="351.3" y="459.0" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="495.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Meningitis bacteriana</tspan></text><text x="500.0" y="518.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Ceftriaxona + vancomicina</tspan></text><rect x="662.7" y="459.0" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="495.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Criptococosis</tspan></text><text x="811.3" y="518.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Anfotericina + flucitosina</tspan></text><text x="40.0" y="589.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="601.5" width="920.0" height="346.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="615.5" width="307.4" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="209.7" y="635.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="209.7" dy="0">ESTADIOS DE LA MENINGITIS TB (BMRC)</tspan></text><text x="379.4" y="635.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="563"><tspan x="379.4" dy="0">British Medical Research Council: predice el pronóstico.</tspan></text><rect x="56.0" y="675.5" width="288.0" height="121.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="676.1" width="286.8" height="63.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="200.0" y="703.5" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="272"><tspan x="200.0" dy="0">ESTADIO I</tspan></text><text x="200.0" y="723.5" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="264"><tspan x="200.0" dy="0">Leve</tspan></text><circle cx="72.0" cy="748.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="752.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="82.0" dy="0">Glasgow 15</tspan></text><circle cx="72.0" cy="771.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="775.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="82.0" dy="0">Sin déficit focal</tspan></text><rect x="356.0" y="675.5" width="288.0" height="121.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="357.2" y="676.7" width="285.6" height="63.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="500.0" y="703.5" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="272"><tspan x="500.0" dy="0">ESTADIO II</tspan></text><text x="500.0" y="723.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="264"><tspan x="500.0" dy="0">Moderado</tspan></text><circle cx="372.0" cy="748.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="382.0" y="752.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="250"><tspan x="382.0" dy="0">Glasgow 11-14</tspan></text><circle cx="372.0" cy="771.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="382.0" y="775.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="250"><tspan x="382.0" dy="0">o Glasgow 15 con déficit focal</tspan></text><rect x="454.6" y="664.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="500.0" y="679.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">◆ ESTE CASO</tspan></text><rect x="656.0" y="675.5" width="288.0" height="121.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="656.6" y="676.1" width="286.8" height="63.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="800.0" y="703.5" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="272"><tspan x="800.0" dy="0">ESTADIO III</tspan></text><text x="800.0" y="723.5" font-size="14" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="264"><tspan x="800.0" dy="0">Grave</tspan></text><circle cx="672.0" cy="748.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="682.0" y="752.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="682.0" dy="0">Glasgow ≤ 10</tspan></text><text x="56.0" y="826.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="835.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="850.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="850.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Somnolienta: Glasgow probable 11-14</tspan></text><rect x="56.0" y="857.5" width="20.0" height="20.0" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="66.0" y="872.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✕</tspan></text><text x="88.0" y="872.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Sin coma: no es estadio III</tspan></text><rect x="56.0" y="894.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="917.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Antituberculosos 9-12 meses + dexametasona; vigilar hidrocefalia.</tspan></text><text x="40.0" y="987.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="997.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1028.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1028.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">TAC cerebral</tspan></text><text x="435.0" y="1028.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">PPD</tspan></text><rect x="513.0" y="1000.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="1020.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">ADA en líquido</tspan><tspan x="585.0" dy="17">cefalorraquídeo</tspan></text><text x="735.0" y="1028.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Rx de tórax</tspan></text><text x="885.0" y="1028.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Electroencefalograma</tspan></text><rect x="40.0" y="1051.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="1051.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1080.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Examen de elección?</tspan></text><text x="285.0" y="1072.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Antes de la punción si</tspan><tspan x="285.0" dy="16">hay focalidad</tspan></text><text x="435.0" y="1072.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no diagnostica la</tspan><tspan x="435.0" dy="16">meningitis</tspan></text><text x="585.0" y="1072.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: rápido y orienta a</tspan><tspan x="585.0" dy="16">TB</tspan></text><text x="735.0" y="1080.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Útil, puede ser normal</tspan></text><text x="885.0" y="1080.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no diagnostica</tspan></text><rect x="40.0" y="997.5" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1125.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1153.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1175.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Punción lumbar (con TC antes si hay déficit focal o edema de papila): ADA &gt; 8-10 U/L apoya el diagnóstico.</tspan><tspan x="58.0" dy="18">• La OMS recomienda además Xpert MTB/RIF Ultra en LCR (detecta resistencia a rifampicina); el cultivo tarda semanas.</tspan><tspan x="58.0" dy="18">• Tratar sin esperar: esquema antituberculoso 9-12 meses + dexametasona.</tspan></text><text x="58.0" y="1233.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, consolidated guidelines on tuberculosis: diagnosis (2024); MINSA Perú, NTS de tuberculosis (2023); Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>