<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1086" viewBox="0 0 1000 1086" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la unión neuromuscular esquelética el único neurotransmisor es la acetilcolina"><title>En la unión neuromuscular esquelética el único neurotransmisor es la acetilcolina</title><rect x="0.75" y="0.75" width="998.5" height="1084.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Fisiología · unión neuromuscular</tspan></text><rect x="396.1" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="468.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="468.1" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Unión neuromuscular</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Sinapsis colinérgica: la motoneurona alfa libera acetilcolina.</tspan><tspan x="58.0" dy="17">Se sintetiza a partir de colina y acetil-CoA por la colina acetiltransferasa.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es el único neurotransmisor que actúa en la</tspan><tspan x="640.0" dy="16">unión neuromuscular?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DÓNDE ACTÚA CADA NEUROTRANSMISOR</tspan></text><rect x="40.0" y="269.0" width="920.0" height="127.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="269.0" width="108.0" height="127.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="332.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Unión</tspan><tspan x="94.0" dy="14">neuromuscular</tspan></text><rect x="40.0" y="396.0" width="920.0" height="127.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="396.0" width="108.0" height="127.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="451.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Sistema</tspan><tspan x="94.0" dy="14">nervioso</tspan><tspan x="94.0" dy="14">central:</tspan><tspan x="94.0" dy="14">inhibidores</tspan></text><rect x="40.0" y="523.0" width="920.0" height="127.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="523.0" width="108.0" height="127.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="578.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Sistema</tspan><tspan x="94.0" dy="14">nervioso</tspan><tspan x="94.0" dy="14">central:</tspan><tspan x="94.0" dy="14">moduladores</tspan></text><line x1="307.2" y1="332.5" x2="314.2" y2="332.5" stroke="#0f766e" stroke-width="2.2"/><line x1="314.2" y1="332.5" x2="314.2" y2="443.5" stroke="#0f766e" stroke-width="2.2"/><line x1="314.2" y1="443.5" x2="312.2" y2="443.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="312.2,448.5 312.2,438.5 321.2,443.5" fill="#0f766e"/><line x1="470.4" y1="443.5" x2="477.4" y2="443.5" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="443.5" x2="477.4" y2="443.5" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="443.5" x2="475.4" y2="443.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="475.4,448.5 475.4,438.5 484.4,443.5" fill="#0f766e"/><line x1="633.6" y1="443.5" x2="640.6" y2="443.5" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="443.5" x2="640.6" y2="570.5" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="570.5" x2="638.6" y2="570.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="638.6,575.5 638.6,565.5 647.6,570.5" fill="#0f766e"/><line x1="796.8" y1="570.5" x2="803.8" y2="570.5" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="570.5" x2="803.8" y2="570.5" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="570.5" x2="801.8" y2="570.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="801.8,575.5 801.8,565.5 810.8,570.5" fill="#0f766e"/><rect x="158.0" y="282.0" width="149.2" height="101.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="168.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Acetilcolina</tspan></text><text x="168.0" y="315.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Motoneurona alfa y</tspan><tspan x="168.0" dy="14.5">receptor nicotínico</tspan><tspan x="168.0" dy="14.5">muscular; la única en la</tspan><tspan x="168.0" dy="14.5">unión</tspan></text><circle cx="158.0" cy="282.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="321.2" y="409.0" width="149.2" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="331.2" y="425.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Glicina</tspan></text><text x="331.2" y="442.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Inhibidor, sobre todo en</tspan><tspan x="331.2" dy="14.5">la médula espinal</tspan></text><circle cx="321.2" cy="409.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="321.2" y="413.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="321.2" dy="0">2</tspan></text><rect x="484.4" y="409.0" width="149.2" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="494.4" y="425.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">GABA</tspan></text><text x="494.4" y="442.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Inhibidor, sobre todo en</tspan><tspan x="494.4" dy="14.5">el cerebro</tspan></text><circle cx="484.4" cy="409.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="484.4" y="413.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="484.4" dy="0">3</tspan></text><rect x="647.6" y="536.0" width="149.2" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="657.6" y="552.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Dopamina</tspan></text><text x="657.6" y="569.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Neurotransmisor del</tspan><tspan x="657.6" dy="14.5">sistema nervioso central</tspan></text><circle cx="647.6" cy="536.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="647.6" y="540.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="647.6" dy="0">4</tspan></text><rect x="810.8" y="536.0" width="149.2" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="820.8" y="552.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Serotonina</tspan></text><text x="820.8" y="569.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Neurotransmisor del</tspan><tspan x="820.8" dy="14.5">sistema nervioso central</tspan></text><circle cx="810.8" cy="536.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="810.8" y="540.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="810.8" dy="0">5</tspan></text><rect x="40.0" y="668.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="694.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Unión neuromuscular = acetilcolina</tspan></text><text x="60.0" y="713.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Los otros cuatro actúan en el sistema nervioso central, no en el músculo esquelético.</tspan></text><text x="40.0" y="780.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="790.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="812.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="793.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="812.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Acetilcolina</tspan></text><text x="435.0" y="812.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Dopamina</tspan></text><text x="585.0" y="812.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Glicina</tspan></text><text x="735.0" y="812.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Serotonina</tspan></text><text x="885.0" y="812.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">GABA</tspan></text><rect x="40.0" y="827.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="827.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="848.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Único neurotransmisor</tspan><tspan x="54.0" dy="16">de la unión?</tspan></text><text x="285.0" y="848.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: sinapsis colinérgica</tspan><tspan x="285.0" dy="16">con receptor nicotínico</tspan></text><text x="435.0" y="848.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es del sistema</tspan><tspan x="435.0" dy="16">nervioso central</tspan></text><text x="585.0" y="848.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: inhibidor, sobre</tspan><tspan x="585.0" dy="16">todo en médula espinal</tspan></text><text x="735.0" y="848.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es del sistema</tspan><tspan x="735.0" dy="16">nervioso central</tspan></text><text x="885.0" y="848.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: inhibidor, sobre</tspan><tspan x="885.0" dy="16">todo en el cerebro</tspan></text><rect x="40.0" y="790.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="901.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="929.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="951.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Receptores nicotínicos musculares de cinco subunidades: su apertura despolariza la placa terminal. La acetilcolinesterasa hidroliza el transmisor en</tspan><tspan x="58.0" dy="18">   acetato y colina.</tspan><tspan x="58.0" dy="18">• Clínica: rocuronio y succinilcolina actúan sobre el receptor; neostigmina y piridostigmina revierten el bloqueo y tratan la miastenia.</tspan><tspan x="58.0" dy="18">• Organofosforados: crisis colinérgica por acumulación de acetilcolina. Botulismo: la toxina impide la liberación y causa parálisis flácida descendente.</tspan><tspan x="58.0" dy="18">• Dopamina, serotonina, glicina y GABA son neurotransmisores del sistema nervioso central; glicina y GABA son inhibidores.</tspan></text><text x="58.0" y="1045.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Guyton y Hall, 14.ª ed. (2021); Goodman y Gilman, 14.ª ed. (2023).</tspan></text></svg>