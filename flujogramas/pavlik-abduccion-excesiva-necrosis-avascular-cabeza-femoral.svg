<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="922" viewBox="0 0 1000 922" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Lactante con displasia de cadera tratada con arnés de Pavlik en abducción excesiva: la complicación es la necrosis avascular de la cabeza femoral"><title>Lactante con displasia de cadera tratada con arnés de Pavlik en abducción excesiva: la complicación es la necrosis avascular de la cabeza femoral</title><rect x="0.75" y="0.75" width="998.5" height="920.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Displasia de cadera · complicaciones del tratamiento</tspan></text><rect x="511.8" y="32.0" width="150.2" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="586.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="134"><tspan x="586.9" dy="0">TRAUMATOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="148.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Arnés de Pavlik</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Mantiene las caderas en flexión (90-100°) y abducción moderada para que la cabeza</tspan><tspan x="58.0" dy="17">femoral se centre.</tspan><tspan x="58.0" dy="17">Abducción forzada comprime los vasos de la cabeza femoral: necrosis avascular. Flexión</tspan><tspan x="58.0" dy="17">excesiva: parálisis del nervio femoral.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="148.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="146.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 2 meses</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Ortolani y Barlow positivos: arnés de Pavlik.</tspan><tspan x="640.0" dy="16">A las 2 semanas: irritable, abducción excesiva.</tspan></text><rect x="640.0" y="209.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="222.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="222.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="270.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LA ABDUCCIÓN DEL ARNÉS Y LA CABEZA FEMORAL</tspan></text><rect x="40.0" y="282.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="308.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Abducción de la cadera en el arnés (grados)</tspan></text><text x="60.0" y="327.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Abducción moderada y suave; forzarla comprime la irrigación de la cabeza femoral.</tspan></text><rect x="70.0" y="391.0" width="286.7" height="40.0" rx="6" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/><text x="213.3" y="416.0" font-size="12" font-weight="800" font-style="normal" fill="#c2410c" text-anchor="middle" data-max="277"><tspan x="213.3" dy="0">Insuficiente: se luxa</tspan></text><rect x="356.7" y="391.0" width="286.7" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="500.0" y="416.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="277"><tspan x="500.0" dy="0">Zona segura</tspan></text><rect x="643.3" y="391.0" width="286.7" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="786.7" y="416.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="277"><tspan x="786.7" dy="0">Excesiva: necrosis</tspan></text><line x1="356.7" y1="431.0" x2="356.7" y2="439.0" stroke="#64748b" stroke-width="1.5"/><text x="356.7" y="453.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="356.7" dy="0">30°</tspan></text><line x1="643.3" y1="431.0" x2="643.3" y2="439.0" stroke="#64748b" stroke-width="1.5"/><text x="643.3" y="453.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="643.3" dy="0">60°</tspan></text><polygon points="825.4,377.0 843.4,377.0 834.4,389.0" fill="#ea580c"/><rect x="759.3" y="351.0" width="150.2" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="834.4" y="366.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="138"><tspan x="834.4" dy="0">◆ ESTE CASO: excesiva</tspan></text><text x="40.0" y="499.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">COMPLICACIONES DEL ARNÉS</tspan></text><rect x="40.0" y="509.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="510.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="533.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Necrosis avascular</tspan></text><text x="58.0" y="554.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Por abducción forzada</tspan></text><rect x="351.3" y="509.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="510.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="533.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Parálisis del nervio femoral</tspan></text><text x="369.3" y="554.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Por flexión excesiva</tspan></text><rect x="662.7" y="509.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="510.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="533.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Falla en reducir</tspan></text><text x="680.7" y="554.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Suspender a las 3-4 semanas</tspan></text><text x="40.0" y="618.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="628.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="667.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="631.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="650.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Necrosis avascular</tspan><tspan x="285.0" dy="17">de la cabeza del</tspan><tspan x="285.0" dy="17">fémur</tspan></text><text x="435.0" y="659.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Epífisis femoral</tspan><tspan x="435.0" dy="17">capital deslizada</tspan></text><text x="585.0" y="650.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Artrosis de</tspan><tspan x="585.0" dy="17">articulación</tspan><tspan x="585.0" dy="17">coxo-femoral</tspan></text><text x="735.0" y="650.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Sinovitis</tspan><tspan x="735.0" dy="17">monoarticular</tspan><tspan x="735.0" dy="17">transitoria</tspan></text><text x="885.0" y="659.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Displasia residual</tspan><tspan x="885.0" dy="17">de cadera</tspan></text><rect x="40.0" y="699.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="699.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="728.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Hallazgo?</tspan></text><text x="285.0" y="720.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: abducción excesiva</tspan><tspan x="285.0" dy="16">comprime vasos</tspan></text><text x="435.0" y="720.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: adolescentes</tspan><tspan x="435.0" dy="16">obesos</tspan></text><text x="585.0" y="728.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: adultos</tspan></text><text x="735.0" y="728.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: niños de 3-8 años</tspan></text><text x="885.0" y="720.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Es un riesgo, pero no</tspan><tspan x="885.0" dy="16">explica la urgencia</tspan></text><rect x="40.0" y="628.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="773.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="801.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="823.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Ajustar el arnés: abducción dentro de la «zona segura» (sin forzar).</tspan><tspan x="58.0" dy="18">• Control con ecografía; si no se reduce en 3-4 semanas, suspender el arnés.</tspan><tspan x="58.0" dy="18">• Las otras opciones no ocurren a esta edad (epifisiólisis y sinovitis son de niños mayores).</tspan></text><text x="58.0" y="881.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAOS, displasia de cadera (2022); POSNA.</tspan></text></svg>