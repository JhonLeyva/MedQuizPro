<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="952" viewBox="0 0 1000 952" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Una úlcera gástrica del cuerpo más una duodenal es una úlcera de Johnson tipo II"><title>Una úlcera gástrica del cuerpo más una duodenal es una úlcera de Johnson tipo II</title><rect x="0.75" y="0.75" width="998.5" height="950.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Cirugía gástrica · clasificación de Johnson</tspan></text><rect x="452.2" y="32.0" width="165.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="535.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="149"><tspan x="535.0" dy="0">GASTROENTEROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Clasificación de Johnson</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Describió la úlcera gástrica según su localización y se relaciona con la secreción de ácido.</tspan><tspan x="58.0" dy="17">Una úlcera gástrica asociada a una duodenal tiene hiperacidez.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 35 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Síntomas ulcerosos de varios años.</tspan><tspan x="640.0" dy="16">Endoscopía: úlcera en el cuerpo gástrico y otra en el</tspan><tspan x="640.0" dy="16">duodeno.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><rect x="40.0" y="261.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="287.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Cuerpo gástrico + duodeno = Johnson II</tspan></text><text x="60.0" y="306.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Hiperacidez: biopsia de la úlcera gástrica y búsqueda de H. pylori.</tspan></text><text x="40.0" y="367.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN DE JOHNSON DE LA ÚLCERA PÉPTICA GÁSTRICA</tspan></text><rect x="40.0" y="379.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="398.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">Tipo</tspan></text><text x="175.0" y="398.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="249"><tspan x="175.0" dy="0">Localización</tspan></text><text x="440.0" y="398.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="249"><tspan x="440.0" dy="0">Secreción de ácido</tspan></text><text x="705.0" y="398.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="249"><tspan x="705.0" dy="0">Dato clave</tspan></text><rect x="40.0" y="408.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="427.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">I</tspan></text><text x="175.0" y="427.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="175.0" dy="0">Curvatura menor, en el cuerpo</tspan></text><text x="440.0" y="427.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="440.0" dy="0">Normal o baja</tspan></text><text x="705.0" y="427.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="705.0" dy="0">La más frecuente</tspan></text><rect x="40.0" y="437.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="456.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">II</tspan></text><text x="175.0" y="456.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="175.0" dy="0">Cuerpo gástrico más úlcera duodenal activa</tspan><tspan x="175.0" dy="15">o cicatrizada</tspan></text><text x="440.0" y="456.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="440.0" dy="0">Alta (hiperacidez)</tspan></text><text x="705.0" y="456.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="705.0" dy="0">Asociación con la duodenal</tspan></text><rect x="65.6" y="448.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="111.0" y="463.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="111.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="481.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="500.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">III</tspan></text><text x="175.0" y="500.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="175.0" dy="0">Prepilórica</tspan></text><text x="440.0" y="500.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="440.0" dy="0">Alta (hiperacidez)</tspan></text><text x="705.0" y="500.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="705.0" dy="0">Se comporta como la duodenal</tspan></text><rect x="40.0" y="510.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="529.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">IV</tspan></text><text x="175.0" y="529.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="175.0" dy="0">Subcardial, cerca de la unión gastroesofágica</tspan></text><text x="440.0" y="529.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="440.0" dy="0">Normal o baja</tspan></text><text x="705.0" y="529.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="705.0" dy="0">Manejo quirúrgico difícil</tspan></text><rect x="40.0" y="539.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="558.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">V</tspan></text><text x="175.0" y="558.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="175.0" dy="0">Inducida por AINE, en cualquier parte</tspan></text><text x="440.0" y="558.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="440.0" dy="0">Sin patrón fijo</tspan></text><text x="705.0" y="558.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="705.0" dy="0">Suspender el AINE</tspan></text><text x="40.0" y="584.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Johnson (1965) describió los tipos I a III; el IV y el V se añadieron después. El caso describe cuerpo gástrico más duodeno: tipo II.</tspan></text><text x="40.0" y="631.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="641.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="663.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="663.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">IV</tspan></text><rect x="363.0" y="644.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="663.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">II</tspan></text><text x="585.0" y="663.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">III</tspan></text><text x="735.0" y="663.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">I</tspan></text><text x="885.0" y="663.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">V</tspan></text><rect x="40.0" y="678.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="678.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="707.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Grado de Johnson?</tspan></text><text x="285.0" y="699.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: tipo IV es</tspan><tspan x="285.0" dy="16">subcardial</tspan></text><text x="435.0" y="699.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: gástrica del cuerpo</tspan><tspan x="435.0" dy="16">más duodenal</tspan></text><text x="585.0" y="699.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: tipo III es</tspan><tspan x="585.0" dy="16">prepilórica</tspan></text><text x="735.0" y="699.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: tipo I es solo del</tspan><tspan x="735.0" dy="16">cuerpo</tspan></text><text x="885.0" y="707.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: tipo V es por AINE</tspan></text><rect x="40.0" y="641.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="752.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="780.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="802.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Tipo I: curvatura menor del cuerpo, la más frecuente, ácido normal o bajo. Tipo II: úlcera gástrica del cuerpo con úlcera duodenal activa o cicatrizada,</tspan><tspan x="58.0" dy="18">   hiperacidez.</tspan><tspan x="58.0" dy="18">• Tipo III: prepilórica, con hiperacidez. Tipo IV: subcardial, cerca de la unión gastroesofágica. Tipo V: por AINE, en cualquier parte.</tspan><tspan x="58.0" dy="18">• Toda úlcera gástrica se biopsia y se controla con endoscopía hasta su cicatrización para descartar adenocarcinoma, e investigar H. pylori.</tspan><tspan x="58.0" dy="18">• H. pylori: tratamiento de erradicación con prueba de control posterior (ACG 2024).</tspan></text><text x="58.0" y="896.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Johnson HD (Ann Surg 1965;162:996-1004); Sabiston 21.ª ed.; Harrison Principios de Medicina Interna 21.ª ed. (2022); Chey WD et al., ACG, H. pylori (Am J</tspan><tspan x="58.0" dy="15">Gastroenterol 2024;119:1730-1753).</tspan></text></svg>