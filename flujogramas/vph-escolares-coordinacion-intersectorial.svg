a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">COMUNIDAD</tspan></text><text x="810.0" y="492.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Agentes comunitarios</tspan></text><text x="40.0" y="605.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="617.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="641.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Acuerdo con la UGEL</tspan></text><line x1="248.5" y1="637.5" x2="267.5" y2="637.5" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,632.5 266.5,642.5 274.5,637.5" fill="#0f766e"/><rect x="278.5" y="617.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="641.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Vacunar en el colegio</tspan></text><line x1="487.0" y1="637.5" x2="506.0" y2="637.5" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,632.5 505.0,642.5 513.0,637.5" fill="#0f766e"/><rect x="517.0" y="617.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="641.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Informar a los padres</tspan></text><line x1="725.5" y1="637.5" x2="744.5" y2="637.5" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,632.5 743.5,642.5 751.5,637.5" fill="#0f766e"/><rect x="755.5" y="617.0" width="204.5" height="41.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="641.5" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Medir cobertura</tspan></text><text x="40.0" y="698.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="708.0" width="920.0" height="88.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="756.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="711.0" width="144.0" height="82.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="747.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Coordinación</tspan><tspan x="285.0" dy="17">intersectorial</tspan></text><text x="435.0" y="747.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Notificación por</tspan><tspan x="435.0" dy="17">escrito a los padres</tspan></text><text x="585.0" y="730.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Disponer que los</tspan><tspan x="585.0" dy="17">agentes</tspan><tspan x="585.0" dy="17">comunitarios</tspan><tspan x="585.0" dy="17">vacunen</tspan></text><text x="735.0" y="747.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Informar al</tspan><tspan x="735.0" dy="17">gobierno local</tspan></text><text x="885.0" y="739.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Suspender la</tspan><tspan x="885.0" dy="17">vacunación hasta</tspan><tspan x="885.0" dy="17">las vacaciones</tspan></text><rect x="40.0" y="796.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="796.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="825.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué priorizar?</tspan></text><text x="285.0" y="817.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: vacunar donde</tspan><tspan x="285.0" dy="16">están los niños</tspan></text><text x="435.0" y="817.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Insuficiente: no lleva la</tspan><tspan x="435.0" dy="16">vacuna</tspan></text><text x="585.0" y="817.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No resuelve: no están</tspan><tspan x="585.0" dy="16">en casa</tspan></text><text x="735.0" y="825.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Es parte, pero no basta</tspan></text><text x="885.0" y="817.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: se pierden</tspan><tspan x="885.0" dy="16">oportunidades</tspan></text><rect x="40.0" y="708.0" width="920.0" height="138.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="870.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="898.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="920.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Vacuna VPH: dosis única en niñas y niños de 9 a 13 años (MINSA).</tspan><tspan x="58.0" dy="18">• Acordar con la UGEL y los directores: fechas, consentimiento de los padres y registro.</tspan><tspan x="58.0" dy="18">• Medir la cobertura por colegio y volver por los ausentes.</tspan></text><text x="58.0" y="978.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA Perú, esquema nacional de vacunación (2025); OMS, vacunas contra el VPH (2022).</tspan></text></svg>