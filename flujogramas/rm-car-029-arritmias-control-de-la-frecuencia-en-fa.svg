<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="785" viewBox="0 0 1000 785" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Fibrilación auricular rápida con disnea: digoxina entre las opciones de control de frecuencia"><title>Fibrilación auricular rápida con disnea: digoxina entre las opciones de control de frecuencia</title><rect x="0.75" y="0.75" width="998.5" height="783.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Arritmias · control de la frecuencia en FA</tspan></text><rect x="442.0" y="32.0" width="117.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="101"><tspan x="500.7" dy="0">CARDIOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Control de frecuencia</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Meta: menos de 110 lpm en reposo.</tspan><tspan x="58.0" dy="17">El fármaco depende de si hay insuficiencia cardiaca con FE reducida.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 48 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Palpitaciones, síncope y disnea.</tspan><tspan x="640.0" dy="16">FC 140, QRS estrecho irregular; PA 110/70.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ FÁRMACO SEGÚN LA FUNCIÓN VENTRICULAR</tspan></text><rect x="40.0" y="269.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="170"><tspan x="54.0" dy="0">SITUACIÓN</tspan></text><text x="412.5" y="291.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="345"><tspan x="412.5" dy="0">Sin insuficiencia cardiaca</tspan></text><text x="777.5" y="291.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="345"><tspan x="777.5" dy="0">Con IC aguda o hipotensión</tspan></text><rect x="40.0" y="309.0" width="184.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="335.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">FE conservada</tspan></text><text x="54.0" y="352.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">PA estable</tspan></text><rect x="233.0" y="309.0" width="359.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="245.0" y="334.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Betabloqueante o diltiazem</tspan></text><text x="245.0" y="350.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Metoprolol, esmolol</tspan></text><rect x="598.0" y="309.0" width="359.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="610.0" y="334.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Digoxina o amiodarona</tspan></text><text x="610.0" y="350.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">No deprimen la contractilidad</tspan></text><rect x="40.0" y="372.0" width="184.0" height="57.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="398.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">FE reducida</tspan></text><text x="54.0" y="415.0" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Congestión</tspan></text><rect x="233.0" y="372.0" width="359.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="245.0" y="397.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Betabloqueante cuidadoso</tspan></text><text x="245.0" y="413.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Si está compensado</tspan></text><rect x="598.0" y="372.0" width="359.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="610.0" y="397.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">DIGOXINA o amiodarona</tspan></text><text x="610.0" y="413.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Este caso: disnea</tspan></text><rect x="856.2" y="361.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="901.6" y="376.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="901.6" dy="0">◆ ESTE CASO</tspan></text><text x="44.0" y="451.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Meta de reposo: &lt; 110 lpm. Los antiarrítmicos de ritmo se evitan en cardiopatía estructural.</tspan></text><text x="40.0" y="499.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="509.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="531.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="531.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Lidocaína</tspan></text><text x="435.0" y="531.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Adenosina</tspan></text><text x="585.0" y="531.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Labetalol</tspan></text><text x="735.0" y="531.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Propafenona</tspan></text><rect x="813.0" y="512.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="531.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Digoxina</tspan></text><rect x="40.0" y="546.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="546.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="583.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Control de frecuencia?</tspan></text><text x="285.0" y="575.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es para arritmias</tspan><tspan x="285.0" dy="16">ventriculares</tspan></text><text x="435.0" y="583.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no revierte la FA</tspan></text><text x="585.0" y="575.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no es de uso</tspan><tspan x="585.0" dy="16">habitual en FA</tspan></text><text x="735.0" y="575.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: antiarrítmico de</tspan><tspan x="735.0" dy="16">ritmo</tspan></text><text x="885.0" y="567.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: control de</tspan><tspan x="885.0" dy="16">frecuencia útil en IC o</tspan><tspan x="885.0" dy="16">hipotensión</tspan></text><rect x="40.0" y="509.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="636.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="664.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="686.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Sin IC: betabloqueante (metoprolol, esmolol) o diltiazem/verapamilo.</tspan><tspan x="58.0" dy="18">• Con IC aguda o hipotensión: digoxina o amiodarona IV (no deprimen la contractilidad).</tspan><tspan x="58.0" dy="18">• Labetalol no es un fármaco habitual de control de frecuencia en FA; lidocaína y adenosina no revierten la FA; propafenona es de ritmo (clase Ic).</tspan></text><text x="58.0" y="744.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ESC/EACTS, fibrilación auricular (2024); AHA/ACC/HRS, fibrilación auricular (2023)</tspan></text></svg>