<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="956" viewBox="0 0 1000 956" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La enfermedad inflamatoria pélvica recurrente lesiona las trompas: la causa más probable es la obstrucción tubárica"><title>La enfermedad inflamatoria pélvica recurrente lesiona las trompas: la causa más probable es la obstrucción tubárica</title><rect x="0.75" y="0.75" width="998.5" height="954.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ginecología · infertilidad secundaria</tspan></text><rect x="414.6" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="494.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="494.4" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infertilidad secundaria</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Falta de embarazo tras 12 meses de relaciones sin protección, con un embarazo previo.</tspan><tspan x="58.0" dy="17">La enfermedad pélvica inflamatoria daña el epitelio ciliado de las trompas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 30 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Un hijo, DIU retirado por EPI a repetición.</tspan><tspan x="640.0" dy="16">Sin dismenorrea; dos años sin embarazo. ¿Cuál es la</tspan><tspan x="640.0" dy="16">causa probable?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL DIU A LA INFERTILIDAD TUBÁRICA</tspan></text><rect x="40.0" y="285.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="145.2" y="305.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Infección ascendente</tspan></text><text x="145.2" y="322.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Chlamydia, gonococo y flora mixta</tspan></text><line x1="253.5" y1="322.5" x2="266.5" y2="322.5" stroke="#0f766e" stroke-width="2"/><polygon points="265.5,317.5 265.5,327.5 273.5,322.5" fill="#0f766e"/><line x1="145.2" y1="362.0" x2="145.2" y2="376.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="40.0" y="378.0" width="210.5" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="145.2" y="392.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">✂ CORTA</tspan></text><text x="145.2" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">EPI a repetición: tratar a la</tspan><tspan x="145.2" dy="16">paciente y a la pareja</tspan></text><rect x="276.5" y="285.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="381.8" y="305.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Daño del epitelio ciliado</tspan></text><text x="381.8" y="322.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">La trompa pierde su movimiento</tspan></text><line x1="490.0" y1="322.5" x2="503.0" y2="322.5" stroke="#0f766e" stroke-width="2"/><polygon points="502.0,317.5 502.0,327.5 510.0,322.5" fill="#0f766e"/><line x1="381.8" y1="362.0" x2="381.8" y2="376.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="276.5" y="378.0" width="210.5" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="381.8" y="392.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">✂ CORTA</tspan></text><text x="381.8" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Cada episodio aumenta el</tspan><tspan x="381.8" dy="16">riesgo</tspan></text><rect x="513.0" y="285.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="618.2" y="305.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Adherencias e hidrosálpinx</tspan></text><text x="618.2" y="322.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Fibrosis y colección en la trompa</tspan></text><line x1="726.5" y1="322.5" x2="739.5" y2="322.5" stroke="#0f766e" stroke-width="2"/><polygon points="738.5,317.5 738.5,327.5 746.5,322.5" fill="#0f766e"/><line x1="618.2" y1="362.0" x2="618.2" y2="376.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="513.0" y="378.0" width="210.5" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="618.2" y="392.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">✂ CORTA</tspan></text><text x="618.2" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Se ven en la</tspan><tspan x="618.2" dy="16">histerosalpingografía</tspan></text><rect x="749.5" y="285.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="854.8" y="305.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Obstrucción tubárica</tspan></text><text x="854.8" y="322.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">El óvulo no encuentra al</tspan><tspan x="854.8" dy="16">espermatozoide</tspan></text><line x1="854.8" y1="362.0" x2="854.8" y2="376.0" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="749.5" y="378.0" width="210.5" height="64.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="854.8" y="392.0" font-size="9.5" font-weight="800" font-style="normal" fill="#ffedd5" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">✂ CORTA</tspan></text><text x="854.8" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Fecundación in vitro si es</tspan><tspan x="854.8" dy="16">bilateral</tspan></text><rect x="809.3" y="431.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="854.8" y="446.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="854.8" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="472.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="498.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">EPI recurrente + infertilidad sin dismenorrea = obstrucción tubárica</tspan></text><text x="60.0" y="517.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Anovulación, cervicitis, adenomiosis y endometriosis no explican el cuadro.</tspan></text><text x="40.0" y="584.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="594.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="625.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="597.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="616.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Obstrucción</tspan><tspan x="285.0" dy="17">tubárica</tspan></text><text x="435.0" y="616.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Anovulación</tspan><tspan x="435.0" dy="17">crónica</tspan></text><text x="585.0" y="625.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Cervicitis crónica</tspan></text><text x="735.0" y="625.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Adenomiosis</tspan></text><text x="885.0" y="625.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Endometriosis</tspan></text><rect x="40.0" y="648.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="648.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="685.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Causa probable?</tspan></text><text x="285.0" y="677.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: la EPI recurrente</tspan><tspan x="285.0" dy="16">ocluye las trompas</tspan></text><text x="435.0" y="669.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no hay ciclos</tspan><tspan x="435.0" dy="16">irregulares ni</tspan><tspan x="435.0" dy="16">hirsutismo</tspan></text><text x="585.0" y="677.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: rara vez impide la</tspan><tspan x="585.0" dy="16">concepción por sí sola</tspan></text><text x="735.0" y="677.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: daría dismenorrea,</tspan><tspan x="735.0" dy="16">que no tiene</tspan></text><text x="885.0" y="669.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: daría dismenorrea</tspan><tspan x="885.0" dy="16">y dispareunia, que no</tspan><tspan x="885.0" dy="16">tiene</tspan></text><rect x="40.0" y="594.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="738.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="766.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="788.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Chlamydia, gonococo y flora mixta ascienden y destruyen el epitelio ciliado: adherencias, hidrosálpinx y oclusión. El riesgo tubárico crece con cada</tspan><tspan x="58.0" dy="18">   episodio de EPI.</tspan><tspan x="58.0" dy="18">• La anovulación da ciclos irregulares; endometriosis y adenomiosis dan dismenorrea y dispareunia, y no hay datos de ellas. La cervicitis crónica rara vez</tspan><tspan x="58.0" dy="18">   impide sola el embarazo.</tspan><tspan x="58.0" dy="18">• Estudio inicial: histerosalpingografía. Con oclusión bilateral, la alternativa eficaz es la fecundación in vitro.</tspan><tspan x="58.0" dy="18">• Alerta: tratar la EPI de inmediato y a la pareja; el retraso aumenta las secuelas y el riesgo de embarazo ectópico.</tspan></text><text x="58.0" y="900.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ASRM, Evaluación de la fertilidad de la mujer infértil (Fertil Steril 2021); CDC, Guía de tratamiento de ITS 2021 (MMWR Recomm Rep 2021); Williams Obstetricia, 26.ª</tspan><tspan x="58.0" dy="15">ed. (2022).</tspan></text></svg>