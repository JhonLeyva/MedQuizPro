ill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="773.5" y="594.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="773.5" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="624.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="652.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="674.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Seno urogenital: vestíbulo o uretra prostática.</tspan><tspan x="58.0" dy="18">• Gubernáculo: ligamento redondo en la mujer.</tspan><tspan x="58.0" dy="18">• Fusión incompleta: escroto bífido.</tspan></text><text x="58.0" y="732.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Langman. Embriología médica 15.ª ed. (2023)</tspan></text></svg>