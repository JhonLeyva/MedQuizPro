0.0,336.0 266.0,307.0 734.0,307.0 760.0,336.0 734.0,365.0 266.0,365.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="336.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="341.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="340.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">¿Qué nivel de control pide el caso?</tspan></text><rect x="40.0" y="431.0" width="297.3" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="188.7" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">VENTILACIÓN NATURAL</tspan></text><text x="188.7" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Ventanas y puertas opuestas</tspan><tspan x="188.7" dy="17">Luz UV, extractores</tspan></text><rect x="351.3" y="431.0" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="467.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Detectar y tratar rápido</tspan></text><text x="500.0" y="490.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Triaje del sintomático respiratorio</tspan></text><rect x="662.7" y="431.0" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="467.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Respirador N95</tspan></text><text x="811.3" y="490.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Para el trabajador</tspan></text><text x="40.0" y="561.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="573.5" width="920.0" height="324.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="587.5" width="293.3" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="202.6" y="607.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="202.6" dy="0">JERARQUÍA DE CONTROLES DE LA TB</tspan></text><text x="365.3" y="607.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="577"><tspan x="365.3" dy="0">OMS 2019: se aplican juntos, en este orden de importancia.</tspan></text><rect x="56.0" y="647.5" width="288.0" height="121.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="648.1" width="286.8" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="200.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="272"><tspan x="200.0" dy="0">1.º</tspan></text><text x="200.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="264"><tspan x="200.0" dy="0">Administrativo</tspan></text><circle cx="72.0" cy="720.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="724.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="82.0" dy="0">Triaje, separar al tosedor</tspan></text><circle cx="72.0" cy="743.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="747.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="82.0" dy="0">Tratamiento rápido</tspan></text><rect x="356.0" y="647.5" width="288.0" height="121.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="357.2" y="648.7" width="285.6" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="500.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="272"><tspan x="500.0" dy="0">2.º</tspan></text><text x="500.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="264"><tspan x="500.0" dy="0">Ambiental</tspan></text><circle cx="372.0" cy="720.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="382.0" y="724.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="250"><tspan x="382.0" dy="0">Ventilación natural o mecánica</tspan></text><circle cx="372.0" cy="743.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="382.0" y="747.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="250"><tspan x="382.0" dy="0">Luz ultravioleta</tspan></text><rect x="454.6" y="636.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="500.0" y="651.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">◆ ESTE CASO</tspan></text><rect x="656.0" y="647.5" width="288.0" height="121.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="656.6" y="648.1" width="286.8" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="800.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="272"><tspan x="800.0" dy="0">3.º</tspan></text><text x="800.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="264"><tspan x="800.0" dy="0">Protección respiratoria</tspan></text><circle cx="672.0" cy="720.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="682.0" y="724.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="682.0" dy="0">Respirador N95 al trabajador</tspan></text><circle cx="672.0" cy="743.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="682.0" y="747.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="682.0" dy="0">Mascarilla al paciente</tspan></text><text x="56.0" y="798.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="807.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="822.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="822.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">La remodelación cerró la circulación del aire: falla ambiental</tspan></text><rect x="56.0" y="844.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="867.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Abrir ventilación cruzada, redistribuir consultorios y reforzar el triaje de sintomáticos respiratorios.</tspan></text><text x="40.0" y="937.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="947.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="987.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="950.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="978.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Maximizar la</tspan><tspan x="285.0" dy="17">ventilación natural</tspan></text><text x="435.0" y="978.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Prevención con</tspan><tspan x="435.0" dy="17">isoniacida</tspan></text><text x="585.0" y="978.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Fortalecer estudio</tspan><tspan x="585.0" dy="17">de contactos</tspan></text><text x="735.0" y="970.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Asegurar la</tspan><tspan x="735.0" dy="17">disponibilidad de</tspan><tspan x="735.0" dy="17">respiradores</tspan></text><text x="885.0" y="970.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Mascarilla</tspan><tspan x="885.0" dy="17">quirúrgica para</tspan><tspan x="885.0" dy="17">todo el personal</tspan></text><rect x="40.0" y="1018.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1018.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1047.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Control ambiental?</tspan></text><text x="285.0" y="1047.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: diluye los aerosoles</tspan></text><text x="435.0" y="1039.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es tratamiento</tspan><tspan x="435.0" dy="16">preventivo</tspan></text><text x="585.0" y="1047.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es administrativo</tspan></text><text x="735.0" y="1039.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es protección</tspan><tspan x="735.0" dy="16">personal</tspan></text><text x="885.0" y="1039.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no protege al</tspan><tspan x="885.0" dy="16">trabajador</tspan></text><rect x="40.0" y="947.5" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1092.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1120.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1142.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Control ambiental de elección: ventilación natural cruzada (ventanas y puertas opuestas abiertas); luz UV y extractores si no basta.</tspan><tspan x="58.0" dy="18">• Administrativo (el más importante en general): detectar, separar y tratar rápido al sintomático respiratorio.</tspan><tspan x="58.0" dy="18">• Protección personal: respirador N95 para el trabajador; mascarilla quirúrgica solo para el paciente.</tspan></text><text x="58.0" y="1200.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, guías de prevención y control de infecciones de TB (2019); MINSA Perú, NTS de tuberculosis (2023).</tspan></text></svg>