<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="967" viewBox="0 0 1000 967" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Hernia estrangulada: cuándo el asa ya no es viable"><title>Hernia estrangulada: cuándo el asa ya no es viable</title><rect x="0.75" y="0.75" width="998.5" height="965.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Hernias · estrangulación intestinal</tspan></text><rect x="403.0" y="32.0" width="101.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="453.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="85"><tspan x="453.6" dy="0">CIRUGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Viabilidad del asa en la hernia estrangulada</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tras liberar el anillo se mira color, brillo, peristalsis y pulso del mesenterio.</tspan><tspan x="58.0" dy="17">Si no se recupera con calor y tiempo, el asa está necrótica y se reseca.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 70 años en cirugía de urgencia</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Hernia inguinal estrangulada con fiebre y leucocitosis.</tspan><tspan x="640.0" dy="16">Se expone el asa herniada: ¿qué obliga a resecar?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE JUZGA EL ASA EN LA CIRUGÍA</tspan></text><rect x="40.0" y="269.0" width="310.0" height="400.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="279.0" width="157.1" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="293.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">TRES ASPECTOS DEL ASA</tspan></text><g data-box="60.0 305.0 270.0 320.0"><g transform="translate(60.0,305.0) scale(1.0)"><rect x="0" y="0" width="270" height="98" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><path d="M12 26 C32 8 84 8 104 26 L104 46 C84 28 32 28 12 46 Z" fill="#f9a8d4" stroke="#374151" stroke-width="1.5" stroke-linejoin="round" /><path d="M24 40 L58 88 L92 40" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" stroke-linejoin="round" /><path d="M58 88 L58 50" fill="none" stroke="#dc2626" stroke-width="3" stroke-linejoin="round" /><text x="118" y="30" font-size="13" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Viable</text><text x="118" y="30" font-size="13" font-weight="800" fill="#0f172a" text-anchor="start" data-max="0">Viable</text><text x="118" y="52.0" font-size="10.5" font-weight="600" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Rosada y brillante,</text><text x="118" y="52.0" font-size="10.5" font-weight="600" fill="#334155" text-anchor="start" data-max="0">Rosada y brillante,</text><text x="118" y="65.65" font-size="10.5" font-weight="600" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">con peristalsis y pulso</text><text x="118" y="65.65" font-size="10.5" font-weight="600" fill="#334155" text-anchor="start" data-max="0">con peristalsis y pulso</text><text x="118" y="84" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">pulso (+)</text><text x="118" y="84" font-size="10.5" font-weight="800" fill="#dc2626" text-anchor="start" data-max="0">pulso (+)</text><rect x="0" y="106" width="270" height="98" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><path d="M12 132 C32 114 84 114 104 132 L104 152 C84 134 32 134 12 152 Z" fill="#a855f7" stroke="#374151" stroke-width="1.5" stroke-linejoin="round" /><path d="M24 146 L58 194 L92 146" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" stroke-linejoin="round" /><path d="M58 194 L58 156" fill="none" stroke="#dc2626" stroke-width="3" stroke-linejoin="round" /><text x="118" y="136" font-size="13" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Recuperable</text><text x="118" y="136" font-size="13" font-weight="800" fill="#0f172a" text-anchor="start" data-max="0">Recuperable</text><text x="118" y="158.0" font-size="10.5" font-weight="600" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Violácea: vuelve al rosado</text><text x="118" y="158.0" font-size="10.5" font-weight="600" fill="#334155" text-anchor="start" data-max="0">Violácea: vuelve al rosado</text><text x="118" y="171.65" font-size="10.5" font-weight="600" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">al liberar y calentar</text><text x="118" y="171.65" font-size="10.5" font-weight="600" fill="#334155" text-anchor="start" data-max="0">al liberar y calentar</text><text x="118" y="190" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">pulso (+)</text><text x="118" y="190" font-size="10.5" font-weight="800" fill="#dc2626" text-anchor="start" data-max="0">pulso (+)</text><rect x="0" y="212" width="270" height="98" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/><path d="M12 238 C32 220 84 220 104 238 L104 258 C84 240 32 240 12 258 Z" fill="#1f2937" stroke="#374151" stroke-width="1.5" stroke-linejoin="round" /><path d="M24 252 L58 300 L92 252" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" stroke-linejoin="round" /><path d="M58 300 L58 262" fill="none" stroke="#6b7280" stroke-width="3" stroke-linejoin="round" /><text x="118" y="242" font-size="13" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Necrosis</text><text x="118" y="242" font-size="13" font-weight="800" fill="#ea580c" text-anchor="start" data-max="0">Necrosis</text><text x="118" y="264.0" font-size="10.5" font-weight="600" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Negra, sin brillo, sin</text><text x="118" y="264.0" font-size="10.5" font-weight="600" fill="#334155" text-anchor="start" data-max="0">Negra, sin brillo, sin</text><text x="118" y="277.65" font-size="10.5" font-weight="600" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">peristalsis ni pulso</text><text x="118" y="277.65" font-size="10.5" font-weight="600" fill="#334155" text-anchor="start" data-max="0">peristalsis ni pulso</text><text x="118" y="296" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">sin pulso</text><text x="118" y="296" font-size="10.5" font-weight="800" fill="#6b7280" text-anchor="start" data-max="0">sin pulso</text></g></g><rect x="48.0" y="621.0" width="294.0" height="42.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0"/><text x="195.0" y="642.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="280"><tspan x="195.0" dy="0">El caso (enmarcado): asa negra, sin brillo y sin pulso</tspan><tspan x="195.0" dy="15">en el mesenterio.</tspan></text><text x="370.0" y="281.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="590"><tspan x="370.0" dy="0">LO QUE SE VE EN EL ASA</tspan></text><rect x="370.0" y="291.0" width="590.0" height="28.0" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/><circle cx="386.0" cy="305.0" r="9" fill="#dc2626" stroke="none" stroke-width="0"/><text x="386.0" y="309.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">!</tspan></text><text x="404.0" y="309.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Coloración negruzca que no cambia</tspan></text><rect x="370.0" y="323.0" width="590.0" height="28.0" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/><circle cx="386.0" cy="337.0" r="9" fill="#dc2626" stroke="none" stroke-width="0"/><text x="386.0" y="341.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">!</tspan></text><text x="404.0" y="341.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Sin pulso en los vasos del mesenterio</tspan></text><rect x="370.0" y="355.0" width="590.0" height="28.0" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/><circle cx="386.0" cy="369.0" r="9" fill="#dc2626" stroke="none" stroke-width="0"/><text x="386.0" y="373.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">!</tspan></text><text x="404.0" y="373.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Sin peristalsis ni brillo seroso</tspan></text><rect x="370.0" y="387.0" width="590.0" height="28.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="386.0" cy="401.0" r="9" fill="#16a34a" stroke="none" stroke-width="0"/><text x="386.0" y="405.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">✓</tspan></text><text x="404.0" y="405.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="546"><tspan x="404.0" dy="0">Probado tras liberar el anillo y calentar</tspan></text><rect x="370.0" y="429.0" width="590.0" height="66.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><circle cx="400.0" cy="462.0" r="17" fill="#16a34a" stroke="none" stroke-width="0"/><circle cx="400.0" cy="462.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="451.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Rosada, brillante, con pulso</tspan></text><text x="430.0" y="468.0" font-size="11.5" font-weight="700" font-style="normal" fill="#16a34a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Viable</tspan></text><text x="430.0" y="484.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Solo reducir y reparar la hernia.</tspan></text><rect x="370.0" y="503.0" width="590.0" height="66.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><circle cx="400.0" cy="536.0" r="17" fill="#f59e0b" stroke="none" stroke-width="0"/><circle cx="400.0" cy="536.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="525.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Violácea que mejora al liberar</tspan></text><text x="430.0" y="542.0" font-size="11.5" font-weight="700" font-style="normal" fill="#f59e0b" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Recuperable</tspan></text><text x="430.0" y="558.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Compresas tibias y esperar: si vuelve el color, no se reseca.</tspan></text><rect x="370.0" y="577.0" width="590.0" height="66.0" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.2"/><circle cx="400.0" cy="610.0" r="17" fill="#dc2626" stroke="none" stroke-width="0"/><circle cx="400.0" cy="610.0" r="7" fill="#ffffff" stroke="none" stroke-width="0"/><text x="430.0" y="599.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Negra, sin pulso ni peristalsis</tspan></text><text x="430.0" y="616.0" font-size="11.5" font-weight="700" font-style="normal" fill="#dc2626" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Necrosis: resecar</tspan></text><text x="430.0" y="632.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="500"><tspan x="430.0" dy="0">Resección del segmento y anastomosis.</tspan></text><rect x="854.6" y="566.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="900.0" y="581.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="900.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="713.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="723.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="745.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Líquido serohemático</tspan></text><text x="491.2" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Violáceo que mejora</tspan></text><rect x="588.0" y="726.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="678.8" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Negra y sin pulso</tspan></text><text x="866.2" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Recupera el rosado</tspan></text><rect x="40.0" y="760.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="588.0" y="760.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="781.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Qué indica</tspan></text><text x="303.8" y="781.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Sufrimiento, no necrosis</tspan></text><text x="491.2" y="781.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Asa viable</tspan></text><text x="678.8" y="781.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Necrosis irreversible</tspan></text><text x="866.2" y="781.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Asa viable</tspan></text><rect x="40.0" y="723.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="818.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="846.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="868.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Asa negra que no recupera el color + sin pulso mesentérico + sin peristalsis = necrosis: resecar.</tspan><tspan x="58.0" dy="18">• Edema violáceo que mejora al liberar y calentar = asa viable: no se reseca.</tspan><tspan x="58.0" dy="18">• Tras la resección: anastomosis primaria si el paciente lo permite.</tspan></text><text x="58.0" y="926.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Schwartz Principios de Cirugía 11.ª ed.; Sabiston Tratado de Cirugía 21.ª ed..</tspan></text></svg>