<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="955" viewBox="0 0 1000 955" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El efecto Hawthorne: participar en un estudio hace que las personas modifiquen su conducta"><title>El efecto Hawthorne: participar en un estudio hace que las personas modifiquen su conducta</title><rect x="0.75" y="0.75" width="998.5" height="953.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Metodología · efecto Hawthorne</tspan></text><rect x="388.6" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="452.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="452.9" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Efecto Hawthorne</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Nombre tomado de estudios de productividad en la fábrica Hawthorne (años 1920).</tspan><tspan x="58.0" dy="17">La conducta cambia por saberse observado.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">En un ensayo clínico controlado, ¿a qué se denomina</tspan><tspan x="640.0" dy="16">efecto Hawthorne?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ CAMBIA CUANDO LA PERSONA SABE QUE ES OBSERVADA</tspan></text><rect x="40.0" y="269.0" width="385.0" height="154.0" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="232.5" y="295.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="365"><tspan x="232.5" dy="0">SIN SENTIRSE OBSERVADO</tspan></text><text x="56.0" y="325.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Conducta</tspan></text><text x="409.0" y="325.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">Habitual, como en la práctica</tspan></text><line x1="52.0" y1="333.0" x2="413.0" y2="333.0" stroke="#ffffff" stroke-width="1.4"/><text x="56.0" y="351.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Adherencia</tspan></text><text x="409.0" y="351.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">La de la vida diaria</tspan></text><line x1="52.0" y1="359.0" x2="413.0" y2="359.0" stroke="#ffffff" stroke-width="1.4"/><text x="56.0" y="377.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Síntomas declarados</tspan></text><text x="409.0" y="377.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">Sin influencia del estudio</tspan></text><line x1="52.0" y1="385.0" x2="413.0" y2="385.0" stroke="#ffffff" stroke-width="1.4"/><text x="56.0" y="403.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Validez externa</tspan></text><text x="409.0" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">Se conserva</tspan></text><line x1="52.0" y1="411.0" x2="413.0" y2="411.0" stroke="#ffffff" stroke-width="1.4"/><rect x="575.0" y="269.0" width="385.0" height="154.0" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="767.5" y="295.0" font-size="13" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="365"><tspan x="767.5" dy="0">PARTICIPANDO EN EL ESTUDIO</tspan></text><text x="591.0" y="325.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Conducta</tspan></text><text x="944.0" y="325.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">Se modifica</tspan></text><line x1="587.0" y1="333.0" x2="948.0" y2="333.0" stroke="#ffffff" stroke-width="1.4"/><text x="591.0" y="351.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Adherencia</tspan></text><text x="944.0" y="351.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">Mejora sin causa del fármaco</tspan></text><line x1="587.0" y1="359.0" x2="948.0" y2="359.0" stroke="#ffffff" stroke-width="1.4"/><text x="591.0" y="377.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Síntomas declarados</tspan></text><text x="944.0" y="377.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">Pueden ser menos</tspan></text><line x1="587.0" y1="385.0" x2="948.0" y2="385.0" stroke="#ffffff" stroke-width="1.4"/><text x="591.0" y="403.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Validez externa</tspan></text><text x="944.0" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">Se afecta</tspan></text><line x1="587.0" y1="411.0" x2="948.0" y2="411.0" stroke="#ffffff" stroke-width="1.4"/><rect x="434.0" y="310.0" width="132.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="336.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="118"><tspan x="500.0" dy="0">Formar parte de la</tspan><tspan x="500.0" dy="16">investigación</tspan></text><line x1="429.0" y1="402.0" x2="562.0" y2="402.0" stroke="#0f766e" stroke-width="3"/><polygon points="562.0,407.0 562.0,397.0 571.0,402.0" fill="#0f766e"/><rect x="40.0" y="439.0" width="300.0" height="33.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="56.0" y="460.5" font-size="14" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="56.0" dy="0">▲</tspan></text><text x="72.0" y="457.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="260"><tspan x="72.0" dy="0">La conducta cambia por ser observada</tspan></text><rect x="350.0" y="439.0" width="300.0" height="33.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="366.0" y="460.5" font-size="14" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="366.0" dy="0">=</tspan></text><text x="382.0" y="457.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="260"><tspan x="382.0" dy="0">La mejoría no depende de la intervención</tspan></text><rect x="660.0" y="439.0" width="300.0" height="33.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="676.0" y="460.5" font-size="14" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="676.0" dy="0">=</tspan></text><text x="692.0" y="457.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="260"><tspan x="692.0" dy="0">El placebo es otro fenómeno distinto</tspan></text><rect x="40.0" y="490.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="516.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Efecto Hawthorne = la participación modifica la conducta</tspan></text><text x="60.0" y="535.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Placebo, cegamiento, ética y consentimiento son conceptos distintos.</tspan></text><text x="40.0" y="602.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="612.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="651.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="615.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="643.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Participar modifica</tspan><tspan x="285.0" dy="17">el comportamiento</tspan></text><text x="435.0" y="634.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Sentirse bien con</tspan><tspan x="435.0" dy="17">productos sin</tspan><tspan x="435.0" dy="17">acción</tspan></text><text x="585.0" y="634.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Problema de ética</tspan><tspan x="585.0" dy="17">del diseño</tspan><tspan x="585.0" dy="17">experimental</tspan></text><text x="735.0" y="643.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Enmascaramiento</tspan><tspan x="735.0" dy="17">del ensayo</tspan></text><text x="885.0" y="634.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Renuncia al</tspan><tspan x="885.0" dy="17">consentimiento</tspan><tspan x="885.0" dy="17">informado</tspan></text><rect x="40.0" y="683.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="683.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="712.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Cambio de conducta</tspan><tspan x="54.0" dy="16">por participar?</tspan></text><text x="285.0" y="704.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: la participación</tspan><tspan x="285.0" dy="16">modifica el</tspan><tspan x="285.0" dy="16">comportamiento</tspan></text><text x="435.0" y="712.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: eso es el efecto</tspan><tspan x="435.0" dy="16">placebo</tspan></text><text x="585.0" y="712.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es un asunto ético</tspan><tspan x="585.0" dy="16">distinto</tspan></text><text x="735.0" y="712.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: el cegamiento es</tspan><tspan x="735.0" dy="16">una herramienta</tspan></text><text x="885.0" y="712.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es otro asunto, no</tspan><tspan x="885.0" dy="16">un efecto</tspan></text><rect x="40.0" y="612.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="773.0" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="801.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="823.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Los participantes se adhieren mejor, cuidan la dieta o declaran menos síntomas solo por estar en el estudio, sin relación con la intervención.</tspan><tspan x="58.0" dy="18">• Afecta sobre todo la validez externa: en la práctica real nadie vigila tanto. Puede sesgar si difiere entre brazos (McCambridge 2014).</tspan><tspan x="58.0" dy="18">• No es el efecto placebo (mejoría tras una sustancia sin acción) ni el cegamiento (herramienta contra sesgos); tampoco un problema ético.</tspan><tspan x="58.0" dy="18">• Perla: grupo control concurrente, cegamiento y mediciones poco intrusivas reducen la influencia de la observación.</tspan></text><text x="58.0" y="899.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: McCambridge, Witton y Elbourne, J Clin Epidemiol (2014;67:267-277); CONSORT 2025 (Hopewell et al., BMJ 2025;389:e081123); Celentano y Szklo, Gordis</tspan><tspan x="58.0" dy="15">Epidemiología, 6.ª ed. (2019).</tspan></text></svg>