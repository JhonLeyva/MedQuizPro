<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1305" viewBox="0 0 1000 1305" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El síntoma característico de la placenta previa es el sangrado vaginal indoloro"><title>El síntoma característico de la placenta previa es el sangrado vaginal indoloro</title><rect x="0.75" y="0.75" width="998.5" height="1303.3" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · placenta previa, síntoma cardinal</tspan></text><rect x="471.4" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="551.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="551.2" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Placenta previa</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La placenta cubre el orificio cervical interno o queda cerca de él.</tspan><tspan x="58.0" dy="17">El sangrado es materno: el feto suele estar bien.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es el signo o síntoma característico y seguro de</tspan><tspan x="640.0" dy="16">la placenta previa?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL SÍNTOMA AL DIAGNÓSTICO DE PLACENTA PREVIA</tspan></text><text x="614.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,293.0 580.0,293.0 551.0,369.0 69.0,369.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="309.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="341.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="438"><tspan x="310.0" dy="0">Gestante con sangrado vaginal en el segundo o tercer trimestre</tspan></text><line x1="569.5" y1="331.0" x2="606.0" y2="331.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="302.0" width="103.1" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="665.6" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="665.6" dy="0">Placenta previa</tspan></text><rect x="723.1" y="302.0" width="115.6" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="780.9" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="780.9" dy="0">Hipertonía uterina</tspan></text><rect x="844.7" y="302.0" width="50.1" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="869.7" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="869.7" dy="0">Dolor</tspan></text><rect x="614.0" y="334.0" width="162.0" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="695.0" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="695.0" dy="0">Ausencia de latidos fetales</tspan></text><rect x="782.0" y="334.0" width="105.8" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="834.9" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="834.9" dy="0">Líquido verdoso</tspan></text><polygon points="69.0,373.0 551.0,373.0 522.0,429.0 98.0,429.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="124.0" cy="401.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="124.0" y="405.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="124.0" dy="0">1</tspan></text><text x="320.0" y="405.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="360"><tspan x="320.0" dy="0">¿Hay útero blando y sin hipertonía?</tspan></text><line x1="540.5" y1="401.0" x2="606.0" y2="401.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="388.0" width="127.7" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="677.8" y="405.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="677.8" dy="0">✕ Hipertonía uterina</tspan></text><line x1="636.0" y1="401.5" x2="731.7" y2="401.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="98.0,433.0 522.0,433.0 493.0,489.0 127.0,489.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="153.0" cy="461.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="153.0" y="465.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="153.0" dy="0">2</tspan></text><text x="320.0" y="465.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="302"><tspan x="320.0" dy="0">¿El sangrado es indoloro?</tspan></text><line x1="511.5" y1="461.0" x2="606.0" y2="461.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="448.0" width="62.2" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="645.1" y="465.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="645.1" dy="0">✕ Dolor</tspan></text><line x1="636.0" y1="461.5" x2="666.2" y2="461.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="127.0,493.0 493.0,493.0 464.0,549.0 156.0,549.0" fill="#5eead4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="182.0" cy="521.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="182.0" y="525.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="182.0" dy="0">3</tspan></text><text x="320.0" y="525.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="244"><tspan x="320.0" dy="0">¿Hay latidos fetales presentes?</tspan></text><line x1="482.5" y1="521.0" x2="606.0" y2="521.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="508.0" width="173.5" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="700.7" y="525.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="700.7" dy="0">✕ Ausencia de latidos fetales</tspan></text><line x1="636.0" y1="521.5" x2="777.5" y2="521.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="156.0,553.0 464.0,553.0 435.0,613.0 185.0,613.0" fill="#2dd4bf" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="583.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="587.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">4</tspan></text><text x="320.0" y="579.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">¿El líquido amniótico es</tspan><tspan x="320.0" dy="17">claro?</tspan></text><line x1="453.5" y1="583.0" x2="606.0" y2="583.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="570.0" width="117.8" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="672.9" y="587.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="672.9" dy="0">✕ Líquido verdoso</tspan></text><line x1="636.0" y1="583.5" x2="721.8" y2="583.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="617.0" x2="310.0" y2="636.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,635.0 315.0,635.0 310.0,643.0" fill="#0f766e"/><rect x="140.0" y="647.0" width="340.0" height="111.8" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="676.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">SANGRADO INDOLORO = PLACENTA</tspan><tspan x="310.0" dy="19.9">PREVIA</tspan></text><text x="310.0" y="720.6" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Ecografía transvaginal</tspan><tspan x="310.0" dy="17">Sin tacto vaginal</tspan></text><rect x="370.6" y="636.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="651.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="664.9" width="346.0" height="76.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="684.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="702.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">Más del 70 % de las placentas previas debuta con</tspan><tspan x="628.0" dy="16">sangrado.</tspan></text><text x="40.0" y="792.8" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PLACENTA PREVIA Y PLACENTA BAJA (RCOG GREEN-TOP 27A): DEFINICIÓN ECOGRÁFICA</tspan></text><rect x="40.0" y="804.8" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="823.8" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Categoría</tspan></text><text x="280.0" y="823.8" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Hallazgo ecográfico (más de 16 semanas)</tspan></text><text x="625.0" y="823.8" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Conducta</tspan></text><rect x="40.0" y="833.8" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="852.8" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Placenta previa</tspan></text><text x="280.0" y="852.8" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">La placenta cubre directamente el orificio cervical interno</tspan></text><text x="625.0" y="852.8" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Hospitalizar si sangra; cesárea programada; no hacer tacto</tspan><tspan x="625.0" dy="15">vaginal</tspan></text><rect x="170.6" y="844.8" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="216.0" y="859.8" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="216.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="877.8" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="896.8" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Placenta baja</tspan></text><text x="280.0" y="896.8" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">El borde placentario está a menos de 20 mm del orificio</tspan><tspan x="280.0" dy="15">interno, sin cubrirlo</tspan></text><text x="625.0" y="896.8" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Repetir la ecografía transvaginal al final del embarazo y</tspan><tspan x="625.0" dy="15">decidir la vía del parto</tspan></text><text x="40.0" y="937.8" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Si la ecografía del segundo trimestre es anormal se repite más adelante: el segmento inferior aún no se forma y muchas placentas «suben». Definiciones ecográficas de la</tspan><tspan x="40.0" dy="15">RCOG 27a (edición 2018, vigente en sus criterios; edición 2026 publicada en BJOG 2026;133:e93-e128).</tspan></text><text x="40.0" y="999.8" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1009.8" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1040.8" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1040.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hipertonía uterina</tspan></text><text x="435.0" y="1040.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Dolor</tspan></text><rect x="513.0" y="1012.8" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="1040.8" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Sangrado vaginal</tspan></text><text x="735.0" y="1032.3" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ausencia de latidos</tspan><tspan x="735.0" dy="17">fetales</tspan></text><text x="885.0" y="1032.3" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Líquido amniótico</tspan><tspan x="885.0" dy="17">verdoso</tspan></text><rect x="40.0" y="1063.8" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="1063.8" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1092.8" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Síntoma seguro?</tspan></text><text x="285.0" y="1084.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es del</tspan><tspan x="285.0" dy="16">desprendimiento</tspan></text><text x="435.0" y="1084.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es del</tspan><tspan x="435.0" dy="16">desprendimiento</tspan></text><text x="585.0" y="1084.8" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: indoloro, rojo vivo y</tspan><tspan x="585.0" dy="16">recurrente</tspan></text><text x="735.0" y="1084.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: el feto suele estar</tspan><tspan x="735.0" dy="16">vivo</tspan></text><text x="885.0" y="1084.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: sugiere hipoxia</tspan><tspan x="885.0" dy="16">fetal</tspan></text><rect x="40.0" y="1009.8" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1137.8" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1165.8" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1187.8" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Sangrado vaginal rojo brillante, indoloro, recurrente, del segundo o tercer trimestre y sin contracciones: es el síntoma en más del 70 % de los casos.</tspan><tspan x="58.0" dy="18">• Diagnóstico: ecografía transvaginal (placenta sobre el orificio interno o a menos de 20 mm de él); no tacto vaginal.</tspan><tspan x="58.0" dy="18">• Hipertonía y dolor pertenecen al desprendimiento; los latidos fetales suelen estar presentes porque la pérdida es materna.</tspan><tspan x="58.0" dy="18">• El líquido amniótico meconial sugiere hipoxia fetal, no placenta previa.</tspan></text><text x="58.0" y="1263.8" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Williams Obstetricia 26.ª ed. (2022); RCOG Green-top Guideline N.º 27a: Placenta Praevia and Placenta Accreta Spectrum. BJOG 2026;133:e93-e128.</tspan></text></svg>