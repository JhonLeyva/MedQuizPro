<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1238" viewBox="0 0 1000 1238" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En ictericia con litiasis vesicular se estudia la vía biliar con colangiografía endoscópica"><title>En ictericia con litiasis vesicular se estudia la vía biliar con colangiografía endoscópica</title><rect x="0.75" y="0.75" width="998.5" height="1236.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Vía biliar · ictericia y coledocolitiasis</tspan></text><rect x="416.7" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="459.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="459.9" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Coledocolitiasis</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cálculo en el colédoco: ictericia, cólico y alteración del patrón colestásico.</tspan><tspan x="58.0" dy="17">Se sospecha en toda ictericia con litiasis vesicular.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 40 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Tres días de ictericia leve y cólico en hipocondrio</tspan><tspan x="640.0" dy="16">derecho, sin fiebre.</tspan><tspan x="640.0" dy="16">Antecedente de colecistitis crónica. ¿Examen para el</tspan><tspan x="640.0" dy="16">diagnóstico?</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DIAGNÓSTICO DIFERENCIAL DE LA ICTERICIA DEL CASO</tspan></text><text x="614.0" y="313.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,325.0 580.0,325.0 531.7,401.0 88.3,401.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="341.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="373.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="399"><tspan x="310.0" dy="0">Ictericia + cólico + litiasis vesicular</tspan></text><line x1="559.8" y1="363.0" x2="606.0" y2="363.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="334.0" width="128.6" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="678.3" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="678.3" dy="0">Hepatitis viral aguda</tspan></text><rect x="748.6" y="334.0" width="185.6" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="841.4" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="841.4" dy="0">Cáncer de cabeza de páncreas</tspan></text><rect x="614.0" y="366.0" width="109.7" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="668.8" y="383.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="668.8" dy="0">Colangitis aguda</tspan></text><rect x="729.7" y="366.0" width="114.2" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="786.8" y="383.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="786.8" dy="0">Colecistitis aguda</tspan></text><rect x="849.9" y="366.0" width="103.8" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="901.8" y="383.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="901.8" dy="0">Coledocolitiasis</tspan></text><polygon points="88.3,405.0 531.7,405.0 483.3,461.0 136.7,461.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="162.7" cy="433.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="162.7" y="437.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="162.7" dy="0">1</tspan></text><text x="320.0" y="437.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="283"><tspan x="320.0" dy="0">¿Hay cólico biliar y litiasis conocida?</tspan></text><line x1="511.5" y1="433.0" x2="606.0" y2="433.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="420.0" width="140.7" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="684.4" y="437.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="684.4" dy="0">✕ Hepatitis viral aguda</tspan></text><line x1="636.0" y1="433.5" x2="744.7" y2="433.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="760.7" y="420.0" width="197.7" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="859.6" y="437.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="859.6" dy="0">✕ Cáncer de cabeza de páncreas</tspan></text><line x1="782.7" y1="433.5" x2="948.4" y2="433.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="136.7,465.0 483.3,465.0 435.0,521.0 185.0,521.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="493.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="497.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">2</tspan></text><text x="320.0" y="497.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">¿Sin fiebre ni shock?</tspan></text><line x1="463.2" y1="493.0" x2="606.0" y2="493.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="480.0" width="121.8" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="674.9" y="497.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="674.9" dy="0">✕ Colangitis aguda</tspan></text><line x1="636.0" y1="493.5" x2="725.8" y2="493.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="741.8" y="480.0" width="126.3" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="804.9" y="497.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="804.9" dy="0">✕ Colecistitis aguda</tspan></text><line x1="763.8" y1="493.5" x2="858.1" y2="493.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="525.0" x2="310.0" y2="544.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,543.0 315.0,543.0 310.0,551.0" fill="#0f766e"/><rect x="140.0" y="555.0" width="340.0" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="584.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">COLEDOCOLITIASIS</tspan></text><text x="310.0" y="608.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Estudiar la vía biliar</tspan><tspan x="310.0" dy="17">CPRE: diagnostica y extrae el cálculo</tspan></text><rect x="370.6" y="544.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="559.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="562.9" width="346.0" height="76.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="582.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="600.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">Si el riesgo es solo intermedio, la colangiorresonancia o la</tspan><tspan x="628.0" dy="16">ecoendoscopia confirman sin invadir.</tspan></text><text x="40.0" y="680.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PROBABILIDAD DE COLEDOCOLITIASIS SEGÚN ASGE 2019</tspan></text><rect x="40.0" y="692.9" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="711.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="159"><tspan x="50.0" dy="0">Riesgo</tspan></text><text x="225.0" y="711.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="356"><tspan x="225.0" dy="0">Criterios</tspan></text><text x="597.5" y="711.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="356"><tspan x="597.5" dy="0">Conducta</tspan></text><rect x="40.0" y="721.9" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="740.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="159"><tspan x="50.0" dy="0">Alto</tspan></text><text x="225.0" y="740.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="356"><tspan x="225.0" dy="0">Cálculo en imagen, colangitis ascendente, o bilirrubina total &gt; 4</tspan><tspan x="225.0" dy="15">mg/dL con colédoco dilatado</tspan></text><text x="597.5" y="740.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="356"><tspan x="597.5" dy="0">CPRE directa con esfinterotomía</tspan></text><rect x="40.0" y="765.9" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="784.9" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="159"><tspan x="50.0" dy="0">Intermedio</tspan></text><text x="225.0" y="784.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="356"><tspan x="225.0" dy="0">Hepatograma alterado, edad &gt; 55 años o colédoco dilatado en</tspan><tspan x="225.0" dy="15">imagen</tspan></text><text x="597.5" y="784.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="356"><tspan x="597.5" dy="0">Colangiorresonancia, ecoendoscopia o colangiografía/ecografía</tspan><tspan x="597.5" dy="15">intraoperatoria</tspan></text><rect x="115.6" y="776.9" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="161.0" y="791.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="161.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="809.9" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="828.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="159"><tspan x="50.0" dy="0">Bajo</tspan></text><text x="225.0" y="828.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="356"><tspan x="225.0" dy="0">Ningún criterio</tspan></text><text x="597.5" y="828.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="356"><tspan x="597.5" dy="0">Colecistectomía sin más estudios de la vía biliar</tspan></text><text x="40.0" y="854.9" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">El caso (ictericia leve sin fiebre, ni cálculo ni bilirrubina &gt; 4 mg/dL descritos) es riesgo intermedio; pasa a alto si la imagen muestra el cálculo o hay colangitis. La clave del</tspan><tspan x="40.0" dy="15">banco elige la colangiografía endoscópica.</tspan></text><text x="40.0" y="916.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="926.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="957.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="949.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Tomografía</tspan><tspan x="285.0" dy="17">abdominal</tspan></text><text x="435.0" y="949.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Ecografía</tspan><tspan x="435.0" dy="17">endoscópica</tspan></text><rect x="513.0" y="929.9" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="949.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Colangiografía</tspan><tspan x="585.0" dy="17">endoscópica</tspan></text><text x="735.0" y="949.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Colecistografía</tspan><tspan x="735.0" dy="17">endovenosa</tspan></text><text x="885.0" y="949.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Ecografía</tspan><tspan x="885.0" dy="17">abdominal</tspan></text><rect x="40.0" y="980.9" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="980.9" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1017.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Examen indicado?</tspan></text><text x="285.0" y="1009.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es menos útil para</tspan><tspan x="285.0" dy="16">el colédoco distal</tspan></text><text x="435.0" y="1001.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es un estudio de</tspan><tspan x="435.0" dy="16">apoyo, no el de</tspan><tspan x="435.0" dy="16">elección aquí</tspan></text><text x="585.0" y="1001.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: diagnostica y</tspan><tspan x="585.0" dy="16">permite extraer el</tspan><tspan x="585.0" dy="16">cálculo</tspan></text><text x="735.0" y="1017.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: ya no se usa</tspan></text><text x="885.0" y="1001.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es el estudio</tspan><tspan x="885.0" dy="16">inicial, no ve bien el</tspan><tspan x="885.0" dy="16">colédoco</tspan></text><rect x="40.0" y="926.9" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1070.9" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1098.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1120.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• ASGE 2019: alta probabilidad (cálculo en imagen, colangitis, o bilirrubina &gt; 4 mg/dL con colédoco dilatado) = CPRE directa, que diagnostica y trata.</tspan><tspan x="58.0" dy="18">• Probabilidad intermedia (pruebas hepáticas alteradas, colédoco dilatado o edad &gt; 55): ecoendoscopia o colangiorresonancia antes de la CPRE.</tspan><tspan x="58.0" dy="18">• Baja probabilidad: colecistectomía con colangiografía intraoperatoria. La ecografía abdominal inicial no ve bien el colédoco distal.</tspan><tspan x="58.0" dy="18">• Bandera roja: fiebre, ictericia y dolor (tríada de Charcot) = colangitis; antibióticos y drenaje urgente de la vía biliar.</tspan></text><text x="58.0" y="1196.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ASGE, coledocolitiasis (2019); ESGE (2019); EsSalud-IETSI, GPC N.º 11 de colelitiasis y coledocolitiasis (2018); Schwartz Principios de Cirugía 11.ª ed.</tspan></text></svg>