<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1034" viewBox="0 0 820 1034" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Síndrome de cola de caballo tras anestesia raquídea"><title>Síndrome de cola de caballo tras anestesia raquídea</title><rect width="820" height="1034" fill="#ffffff"/><rect x="0" y="0" width="820" height="142" fill="#0f766e"/><text x="40" y="34" font-size="13" font-weight="600" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="740"><tspan x="40" dy="0">MedQuizPlus · Flujograma</tspan></text><text x="40" y="70" font-size="24" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="740"><tspan x="40" dy="0">Síndrome de cola de caballo tras anestesia</tspan><tspan x="40" dy="30">raquídea</tspan></text><text x="40" y="126" font-size="13" font-weight="400" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="740"><tspan x="40" dy="0">ENAM 2020 · NRL-007 · Neurología</tspan></text><rect x="90" y="174" width="640" height="76" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="108" y="202" font-size="11" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="604"><tspan x="108" dy="0">INICIO</tspan></text><text x="108" y="226" font-size="16" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Postoperatorio con anestesia raquídea</tspan></text><line x1="410.0" y1="252" x2="410.0" y2="272" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,270 417.0,270 410.0,280" fill="#94a3b8"/><rect x="90" y="282" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="310" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="334" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Retención urinaria, incontinencia fecal y anestesia en silla</tspan><tspan x="108" dy="22">de montar</tspan></text><line x1="410.0" y1="382" x2="410.0" y2="402" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,400 417.0,400 410.0,410" fill="#94a3b8"/><rect x="90" y="412" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="440" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="464" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Debilidad y pérdida sensitiva en miembros inferiores con</tspan><tspan x="108" dy="22">hiporreflexia</tspan></text><line x1="410.0" y1="512" x2="410.0" y2="532" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,530 417.0,530 410.0,540" fill="#94a3b8"/><rect x="90" y="542" width="640" height="76" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><circle cx="120" cy="580.0" r="12" fill="#d97706"/><text x="120" y="585.0" font-size="15" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="120" dy="0">?</tspan></text><text x="142" y="570" font-size="11" font-weight="700" font-style="normal" fill="#b45309" text-anchor="start" data-max="570"><tspan x="142" dy="0">DECISIÓN</tspan></text><text x="142" y="594" font-size="16" font-weight="600" font-style="normal" fill="#78350f" text-anchor="start" data-max="570"><tspan x="142" dy="0">¿Sospecha de compresión por hematoma o absceso epidural?</tspan></text><line x1="410.0" y1="620" x2="410.0" y2="640" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,638 417.0,638 410.0,648" fill="#94a3b8"/><rect x="90" y="650" width="640" height="76" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="678" font-size="11" font-weight="700"