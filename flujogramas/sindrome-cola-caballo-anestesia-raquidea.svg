<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1039" viewBox="0 0 1000 1039" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Tras raquianestesia: pérdida motora y sensitiva de piernas con disfunción vesical e intestinal: síndrome de cola de caballo"><title>Tras raquianestesia: pérdida motora y sensitiva de piernas con disfunción vesical e intestinal: síndrome de cola de caballo</title><rect x="0.75" y="0.75" width="998.5" height="1037.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Complicaciones de la anestesia neuroaxial</tspan></text><rect x="452.3" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="516.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="516.6" dy="0">NEUROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="152.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Síndrome de cola de caballo</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Lesión de las raíces lumbosacras bajo el cono medular.</tspan><tspan x="58.0" dy="17">Debilidad y anestesia en silla de montar de las piernas, retención urinaria y falta de control</tspan><tspan x="58.0" dy="17">intestinal.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="152.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="150.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Posoperado de apendicectomía con anestesia</tspan><tspan x="640.0" dy="17">raquídea</tspan></text><text x="640.0" y="176.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Al primer día: disfunción intestinal y vesical.</tspan><tspan x="640.0" dy="16">Pérdida sensitiva y motora de miembros inferiores.</tspan></text><rect x="640.0" y="213.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="226.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="226.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="274.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DÉFICIT NEUROLÓGICO TRAS LA RAQUÍDEA</tspan></text><rect x="40.0" y="286.0" width="450.0" height="181.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><rect x="40.0" y="286.0" width="450.0" height="8.0" rx="4" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="60.0" y="320.0" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="410"><tspan x="60.0" dy="0">Cola de caballo</tspan></text><rect x="56.0" y="341.0" width="418.0" height="26.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="68.0" y="358.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Piernas</tspan></text><text x="462.0" y="358.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">✓ Débiles y sin sensibilidad</tspan></text><rect x="56.0" y="371.0" width="418.0" height="26.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="68.0" y="388.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Esfínteres</tspan></text><text x="462.0" y="388.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">✓ Vejiga e intestino</tspan></text><rect x="56.0" y="401.0" width="418.0" height="26.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="68.0" y="418.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Urgencia</tspan></text><text x="462.0" y="418.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">✓ RM ya</tspan></text><text x="60.0" y="447.0" font-size="11.5" font-weight="600" font-style="normal" fill="#0f766e" text-anchor="start" data-max="410"><tspan x="60.0" dy="0">Este caso.</tspan></text><rect x="372.6" y="279.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="418.0" y="294.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="418.0" dy="0">◆ ESTE CASO</tspan></text><rect x="510.0" y="286.0" width="450.0" height="181.0" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="510.0" y="286.0" width="450.0" height="8.0" rx="4" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="530.0" y="320.0" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="410"><tspan x="530.0" dy="0">Cefalea pospunción</tspan></text><rect x="526.0" y="341.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="358.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Síntoma</tspan></text><text x="932.0" y="358.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">Cefalea al pararse</tspan></text><rect x="526.0" y="371.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="388.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Déficit</tspan></text><text x="932.0" y="388.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">No</tspan></text><rect x="526.0" y="401.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="418.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Tratamiento</tspan></text><text x="932.0" y="418.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">Parche hemático</tspan></text><text x="530.0" y="447.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="530.0" dy="0">Postural.</tspan></text><rect x="40.0" y="487.0" width="450.0" height="181.0" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="487.0" width="450.0" height="8.0" rx="4" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="60.0" y="521.0" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="410"><tspan x="60.0" dy="0">Radiculopatía</tspan></text><rect x="56.0" y="542.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="68.0" y="559.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Raíz</tspan></text><text x="462.0" y="559.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">Una sola</tspan></text><rect x="56.0" y="572.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="68.0" y="589.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Esfínteres</tspan></text><text x="462.0" y="589.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">Normales</tspan></text><rect x="56.0" y="602.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="68.0" y="619.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Dolor</tspan></text><text x="462.0" y="619.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">Irradiado</tspan></text><text x="60.0" y="648.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="60.0" dy="0">Hernia discal.</tspan></text><rect x="510.0" y="487.0" width="450.0" height="181.0" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="510.0" y="487.0" width="450.0" height="8.0" rx="4" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="530.0" y="521.0" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="410"><tspan x="530.0" dy="0">Conversivo</tspan></text><rect x="526.0" y="542.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="559.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Examen</tspan></text><text x="932.0" y="559.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">No anatómico</tspan></text><rect x="526.0" y="572.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="589.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Pruebas</tspan></text><text x="932.0" y="589.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">Normales</tspan></text><rect x="526.0" y="602.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="619.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Diagnóstico</tspan></text><text x="932.0" y="619.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">De exclusión</tspan></text><text x="530.0" y="648.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="530.0" dy="0">Primero descartar lo orgánico.</tspan></text><text x="40.0" y="690.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="400"><tspan x="40.0" dy="0">✓ = dato que coincide con el caso</tspan></text><text x="40.0" y="736.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="746.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="777.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="768.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Radiculitis</tspan><tspan x="285.0" dy="17">compresiva</tspan></text><rect x="363.0" y="749.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="768.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Síndrome de cola</tspan><tspan x="435.0" dy="17">de caballo</tspan></text><text x="585.0" y="768.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Hernia del núcleo</tspan><tspan x="585.0" dy="17">pulposo</tspan></text><text x="735.0" y="768.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Síndrome</tspan><tspan x="735.0" dy="17">conversivo</tspan></text><text x="885.0" y="777.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Cefalea pospunción</tspan></text><rect x="40.0" y="800.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="800.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="837.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Encaja?</tspan></text><text x="285.0" y="829.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: una sola raíz, sin</tspan><tspan x="285.0" dy="16">esfínteres</tspan></text><text x="435.0" y="829.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: déficit bilateral +</tspan><tspan x="435.0" dy="16">esfínteres</tspan></text><text x="585.0" y="829.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sin relación con la</tspan><tspan x="585.0" dy="16">raquídea, una raíz</tspan></text><text x="735.0" y="821.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: diagnóstico de</tspan><tspan x="735.0" dy="16">exclusión, hay causa</tspan><tspan x="735.0" dy="16">orgánica</tspan></text><text x="885.0" y="829.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: cefalea postural</tspan><tspan x="885.0" dy="16">sin déficit</tspan></text><rect x="40.0" y="746.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="890.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="918.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="940.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Urgencia: RM de columna para descartar hematoma o absceso epidural (descompresión en &lt; 8-12 h).</tspan><tspan x="58.0" dy="18">• Causas tras la raquídea: hematoma epidural (anticoagulantes), toxicidad del anestésico local, infección.</tspan><tspan x="58.0" dy="18">• La cefalea pospunción es postural y no da déficit motor ni esfinteriano.</tspan></text><text x="58.0" y="998.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ASRA, guía de anestesia regional en anticoagulados (2018, act.); Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>