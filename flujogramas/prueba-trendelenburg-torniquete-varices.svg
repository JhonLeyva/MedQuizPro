 stroke-width="1.5"/><text x="58.0" y="755.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="777.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Llenado rápido desde arriba: safena incompetente.</tspan><tspan x="58.0" dy="18">• Llenado con torniquete: perforantes incompetentes.</tspan><tspan x="58.0" dy="18">• Hoy se confirma con eco Doppler.</tspan></text><text x="58.0" y="835.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Rutherford's Vascular Surgery 10.ª ed. (2022)</tspan></text></svg>