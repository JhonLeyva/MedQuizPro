/text><polygon points="76.2,373.0 543.8,373.0 507.5,429.0 112.5,429.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="138.5" cy="401.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="138.5" y="405.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="138.5" dy="0">1</tspan></text><text x="320.0" y="405.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="331"><tspan x="320.0" dy="0">¿Hay dos variables cuantitativas continuas?</tspan></text><line x1="529.6" y1="401.0" x2="606.0" y2="401.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="388.0" width="96.9" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="662.4" y="405.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="662.4" dy="0">✕ De sectores</tspan></text><line x1="636.0" y1="401.5" x2="700.9" y2="401.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="716.9" y="388.0" width="85.8" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="759.8" y="405.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="759.8" dy="0">✕ De barras</tspan></text><line x1="738.9" y1="401.5" x2="792.7" y2="401.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="112.5,433.0 507.5,433.0 471.2,489.0 148.8,489.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="174.8" cy="461.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="174.8" y="465.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="174.8" dy="0">2</tspan></text><text x="320.0" y="465.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="258"><tspan x="320.0" dy="0">¿Se mide la relación entre ambas?</tspan></text><line x1="493.4" y1="461.0" x2="606.0" y2="461.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="448.0" width="94.3" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="661.1" y="465.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="661.1" dy="0">✕ Histograma</tspan></text><line x1="636.0" y1="461.5" x2="698.3" y2="461.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="714.3" y="448.0" width="114.6" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="771.6" y="465.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="771.6" dy="0">✕ De tallo y hojas</tspan></text><line x1="736.3" y1="461.5" x2="818.8" y2="461.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="148.8,493.0 471.2,493.0 435.0,570.0 185.0,570.0" fill="#5eead4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="531.5" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="535.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">3</tspan></text><text x="320.0" y="519.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">¿Cada paciente aporta un</tspan><tspan x="320.0" dy="17">punto con dos</tspan><tspan x="320.0" dy="17">coordenadas?</tspan></text><line x1="310.0" y1="574.0" x2="310.0" y2="593.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,592.0 315.0,592.0 310.0,600.0" fill="#0f766e"/><rect x="140.0" y="604.0" width="340.0" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="633.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">DIAGRAMA DE DISPERSIÓN</tspan></text><text x="310.0" y="657.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Nube de puntos</tspan><tspan x="310.0" dy="17">Base de la correlación</tspan></text><rect x="370.6" y="593.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="608.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="611.9" width="346.0" height="76.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="631.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="649.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">Histograma y tallo y hojas describen una sola variable;</tspan><tspan x="628.0" dy="16">sectores y barras, variables cualitativas o discretas.</tspan></text><text x="40.0" y="735.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="745.9" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="768.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="768.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">De sectores</tspan></text><rect x="363.0" y="748.9" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="768.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">De dispersión</tspan></text><text x="585.0" y="768.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Histograma</tspan></text><text x="735.0" y="768.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">De barras</tspan></text><text x="885.0" y="768.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">De tallo y hojas</tspan></text><rect x="40.0" y="782.9" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="782.9" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="811.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Gráfico para dos</tspan><tspan x="54.0" dy="16">variables cuantitativas?</tspan></text><text x="285.0" y="803.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: muestra</tspan><tspan x="285.0" dy="16">proporciones de una</tspan><tspan x="285.0" dy="16">cualitativa</tspan></text><text x="435.0" y="803.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: un punto por</tspan><tspan x="435.0" dy="16">paciente con ambos</tspan><tspan x="435.0" dy="16">valores</tspan></text><text x="585.0" y="811.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: describe una sola</tspan><tspan x="585.0" dy="16">variable</tspan></text><text x="735.0" y="811.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es para variables</tspan><tspan x="735.0" dy="16">cualitativas o discretas</tspan></text><text x="885.0" y="811.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: describe una sola</tspan><tspan x="885.0" dy="16">variable</tspan></text><rect x="40.0" y="745.9" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="872.9" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="900.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="922.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Diagrama de dispersión: cada paciente es un punto (glucosa, proteínas); muestra asociación, dirección, forma y valores atípicos.</tspan><tspan x="58.0" dy="18">• Es la base del coeficiente de correlación (Pearson o Spearman) y de la regresión. En meningitis bacteriana se espera relación inversa: glucosa baja,</tspan><tspan x="58.0" dy="18">   proteínas altas.</tspan><tspan x="58.0" dy="18">• Histograma y tallo y hojas describen una sola variable; barras, variables cualitativas o discretas; sectores, proporciones de una cualitativa.</tspan><tspan x="58.0" dy="18">• Perla: graficar primero; la dispersión revela asociaciones no lineales y valores extremos que la correlación sola oculta.</tspan></text><text x="58.0" y="1016.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Armitage, Berry y Matthews, Statistical Methods in Medical Research, 4.ª ed. (2002); Altman, Practical Statistics for Medical Research (1991); Celentano y Szklo, Gordis</tspan><tspan x="58.0" dy="15">Epidemiología, 6.ª ed. (2019).</tspan></text></svg>