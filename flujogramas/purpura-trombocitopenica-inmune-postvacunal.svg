<svg xmlns="http://www.w3.org/2000/svg" width="820" height="881" viewBox="0 0 820 881" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Púrpura trombocitopénica inmune postvacunal"><title>Púrpura trombocitopénica inmune postvacunal</title><rect width="820" height="881" fill="#ffffff"/><rect x="0" y="0" width="820" height="112" fill="#0f766e"/><text x="40" y="34" font-size="13" font-weight="600" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="740"><tspan x="40" dy="0">MedQuizPlus · Flujograma</tspan></text><text x="40" y="70" font-size="24" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="740"><tspan x="40" dy="0">Púrpura trombocitopénica inmune postvacunal</tspan></text><text x="40" y="96" font-size="13" font-weight="400" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="740"><tspan x="40" dy="0">ENAM 2020 · PED-028 · Pediatría y Neonatología</tspan></text><rect x="90" y="144" width="640" height="76" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="108" y="172" font-size="11" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="604"><tspan x="108" dy="0">INICIO</tspan></text><text x="108" y="196" font-size="16" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Niño con petequias, equimosis o sangrado de mucosas</tspan></text><line x1="410.0" y1="222" x2="410.0" y2="242" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,240 417.0,240 410.0,250" fill="#94a3b8"/><rect x="90" y="252" width="640" height="76" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="280" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="304" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Antecedente de infección viral o vacuna 2 a 4 semanas antes</tspan></text><line x1="410.0" y1="330" x2="410.0" y2="350" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,348 417.0,348 410.0,358" fill="#94a3b8"/><rect x="90" y="360" width="640" height="126" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><circle cx="120" cy="423.0" r="12" fill="#d97706"/><text x="120" y="428.0" font-size="15" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="120" dy="0">?</tspan></text><text x="142" y="388" font-size="11" font-weight="700" font-style="normal" fill="#b45309" text-anchor="start" data-max="570"><tspan x="142" dy="0">DECISIÓN</tspan></text><text x="142" y="412" font-size="16" font-weight="600" font-style="normal" fill="#78350f" text-anchor="start" data-max="570"><tspan x="142" dy="0">¿Trombocitopenia aislada (hemoglobina y leucocitos</tspan><tspan x="142" dy="22">normales) sin visceromegalias?</tspan></text><text x="142" y="462" font-size="14" font-weight="500" font-style="italic" fill="#92400e" text-anchor="start" data-max="570"><tspan x="142" dy="0">↳ No → descartar leucemia o aplasia con aspirado de médula ósea</tspan></text><line x1="410.0" y1="488" x2="410.0" y2="508" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,506 417.0,506 410.0,516" fill="#94a3b8"/><rect x="90" y="518" width="640" height="76" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="546" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="570" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Sí → púrpura trombocitopénica inmune</tspan></text><line x1="410.0" y1="596" x2="410.0" y2="616" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,614 417.0,614 410.0,624" fill="#94a3b8"/><rect x="90" y="626" width="640" height="98" rx="12" fill="#134e4a" stroke="#134e4a" stroke-width="2"/><text x="108" y="654" font-size="11" font-weight="700" font-style="normal" fill="#5eead4" text-anchor="start" data-max="604"><tspan x="108" dy="0">CONDUCTA FINAL</tspan></text><text x="108" y="678" font-size="16" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Sangrado leve: observación. Sangrado importante: corticoides</tspan><tspan x="108" dy="22">o inmunoglobulina</tspan></text><rect x="40" y="754" width="740" height="77" rx="10" fill="#f0fdfa" stroke="#99f6e4"/><rect x="40" y="754" width="6" height="77" rx="3" fill="#14b8a6"/><text x="62" y="780" font-size="14" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="704"><tspan x="62" dy="0">Perla clínica</tspan></text><text x="62" y="804" font-size="15" font-weight="400" font-style="normal" fill="#134e4a" text-anchor="start" data-max="704"><tspan x="62" dy="0">La mayoría de las PTI en la infancia remiten solas en semanas o meses.</tspan></text><text x="410.0" y="859" font-size="11" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="740"><tspan x="410.0" dy="0">MedQuizPlus · Material de estudio: contrasta siempre con las guías clínicas vigentes.</tspan></text></svg>
