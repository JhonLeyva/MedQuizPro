<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1206" viewBox="0 0 1000 1206" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La curva normal es simétrica respecto de su media; media, mediana y moda coinciden"><title>La curva normal es simétrica respecto de su media; media, mediana y moda coinciden</title><rect x="0.75" y="0.75" width="998.5" height="1204.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Bioestadística · distribución normal de Gauss</tspan></text><rect x="470.0" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="534.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="534.3" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Distribución normal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Curva continua en campana, definida por la media y la desviación estándar.</tspan><tspan x="58.0" dy="17">Su área total es 1 (100 % de la probabilidad).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál enunciado es característico de la curva normal</tspan><tspan x="640.0" dy="16">de Gauss?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CURVA NORMAL Y REGLA EMPÍRICA</tspan></text><rect x="40.0" y="269.0" width="540.0" height="340.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="98.0" y="289.0" width="99.4" height="272.0" rx="0" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="147.7" y="305.0" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="93"><tspan x="147.7" dy="0"></tspan></text><rect x="197.4" y="289.0" width="66.3" height="272.0" rx="0" fill="#e0f2f1" stroke="none" stroke-width="0"/><text x="230.6" y="305.0" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="60"><tspan x="230.6" dy="0">95 %</tspan></text><rect x="263.7" y="289.0" width="132.6" height="272.0" rx="0" fill="#ccfbf1" stroke="none" stroke-width="0"/><text x="330.0" y="305.0" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="127"><tspan x="330.0" dy="0"></tspan></text><rect x="396.3" y="289.0" width="66.3" height="272.0" rx="0" fill="#e0f2f1" stroke="none" stroke-width="0"/><text x="429.4" y="305.0" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="60"><tspan x="429.4" dy="0">95 %</tspan></text><rect x="462.6" y="289.0" width="99.4" height="272.0" rx="0" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="512.3" y="305.0" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="93"><tspan x="512.3" dy="0"></tspan></text><line x1="98.0" y1="561.0" x2="562.0" y2="561.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="565.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">0</tspan></text><line x1="98.0" y1="425.0" x2="562.0" y2="425.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="429.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">50</tspan></text><line x1="98.0" y1="289.0" x2="562.0" y2="289.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="293.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">100</tspan></text><line x1="131.1" y1="561.0" x2="131.1" y2="566.0" stroke="#94a3b8" stroke-width="1.5"/><text x="131.1" y="580.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="131.1" dy="0">-3</tspan></text><line x1="197.4" y1="561.0" x2="197.4" y2="566.0" stroke="#94a3b8" stroke-width="1.5"/><text x="197.4" y="580.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="197.4" dy="0">-2</tspan></text><line x1="263.7" y1="561.0" x2="263.7" y2="566.0" stroke="#94a3b8" stroke-width="1.5"/><text x="263.7" y="580.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="263.7" dy="0">-1</tspan></text><line x1="330.0" y1="561.0" x2="330.0" y2="566.0" stroke="#94a3b8" stroke-width="1.5"/><text x="330.0" y="580.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="330.0" dy="0">media</tspan></text><line x1="396.3" y1="561.0" x2="396.3" y2="566.0" stroke="#94a3b8" stroke-width="1.5"/><text x="396.3" y="580.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="396.3" dy="0">1</tspan></text><line x1="462.6" y1="561.0" x2="462.6" y2="566.0" stroke="#94a3b8" stroke-width="1.5"/><text x="462.6" y="580.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="462.6" dy="0">2</tspan></text><line x1="528.9" y1="561.0" x2="528.9" y2="566.0" stroke="#94a3b8" stroke-width="1.5"/><text x="528.9" y="580.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="528.9" dy="0">3</tspan></text><line x1="98.0" y1="561.0" x2="562.0" y2="561.0" stroke="#94a3b8" stroke-width="1.5"/><line x1="98.0" y1="289.0" x2="98.0" y2="561.0" stroke="#94a3b8" stroke-width="1.5"/><text x="330.0" y="599.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="464"><tspan x="330.0" dy="0">Desviaciones estándar respecto de la media</tspan></text><text x="56.0" y="425.0" transform="rotate(-90 56.0 425.0)" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Densidad relativa (%)</text><polyline points="98.0,560.5 111.3,559.9 124.5,558.8 137.8,556.9 151.0,553.9 164.3,549.0 177.5,541.7 190.8,531.1 204.1,516.4 217.3,496.8 230.6,472.6 243.8,444.0 257.1,412.5 270.3,379.6 283.6,348.0 296.9,321.1 310.1,301.0 323.4,290.4 336.6,290.4 349.9,301.0 363.1,321.1 376.4,348.0 389.7,379.6 402.9,412.5 416.2,444.0 429.4,472.6 442.7,496.8 455.9,516.4 469.2,531.1 482.5,541.7 495.7,549.0 509.0,553.9 522.2,556.9 535.5,558.8 548.7,559.9 562.0,560.5" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="330.0" y1="289.0" x2="330.0" y2="561.0" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4"/><circle cx="330.0" cy="289.0" r="9" fill="#ea580c" stroke="#ffffff" stroke-width="3"/><rect x="252.2" y="264.0" width="155.7" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="330.0" y="279.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="330.0" dy="0">◆ Media = mediana = moda</tspan></text><rect x="602.0" y="348.5" width="358.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="617.0" y="372.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Simétrica respecto de la media</tspan></text><text x="617.0" y="389.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Las dos colas son iguales: este caso.</tspan></text><rect x="602.0" y="411.5" width="358.0" height="55.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="617.0" y="435.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Área total igual a 1</tspan></text><text x="617.0" y="452.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Es 100 % de la probabilidad, no cero.</tspan></text><rect x="602.0" y="474.5" width="358.0" height="55.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="617.0" y="498.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Regla empírica</tspan></text><text x="617.0" y="515.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">68 % a ±1, 95 % a ±2 y 99,7 % a ±3 desviaciones.</tspan></text><rect x="40.0" y="627.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="653.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Normal = simétrica respecto de la media</tspan></text><text x="60.0" y="672.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La asimetría es propia de las distribuciones sesgadas.</tspan></text><text x="40.0" y="733.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">REGLA EMPÍRICA DE LA DISTRIBUCIÓN NORMAL</tspan></text><rect x="40.0" y="745.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="764.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Intervalo</tspan></text><text x="350.0" y="764.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="350.0" dy="0">Porcentaje de valores</tspan></text><rect x="40.0" y="774.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="793.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Media ± 1 desviación estándar</tspan></text><text x="350.0" y="793.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="604"><tspan x="350.0" dy="0">Cerca de 68 %</tspan></text><rect x="40.0" y="803.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="822.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Media ± 2 (1,96) desviaciones</tspan></text><text x="350.0" y="822.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="604"><tspan x="350.0" dy="0">Cerca de 95 %</tspan></text><rect x="40.0" y="832.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="851.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Media ± 3 desviaciones</tspan></text><text x="350.0" y="851.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="604"><tspan x="350.0" dy="0">Cerca de 99,7 %</tspan></text><text x="40.0" y="901.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="911.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="942.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="933.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Mediana fuera del</tspan><tspan x="285.0" dy="17">centro</tspan></text><text x="435.0" y="933.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Asimétrica según</tspan><tspan x="435.0" dy="17">su mediana</tspan></text><text x="585.0" y="933.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">El área bajo la curva</tspan><tspan x="585.0" dy="17">es cero</tspan></text><text x="735.0" y="933.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Asimétrica respecto</tspan><tspan x="735.0" dy="17">a su moda</tspan></text><rect x="813.0" y="914.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="933.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Simétrica respecto</tspan><tspan x="885.0" dy="17">a su media</tspan></text><rect x="40.0" y="965.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="965.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="994.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Característico?</tspan></text><text x="285.0" y="986.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: la mediana está en</tspan><tspan x="285.0" dy="16">el centro</tspan></text><text x="435.0" y="986.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es simétrica</tspan><tspan x="435.0" dy="16">respecto de la mediana</tspan></text><text x="585.0" y="994.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: el área total es 1</tspan></text><text x="735.0" y="986.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es simétrica</tspan><tspan x="735.0" dy="16">respecto de la moda</tspan></text><text x="885.0" y="986.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: simétrica respecto</tspan><tspan x="885.0" dy="16">de la media</tspan></text><rect x="40.0" y="911.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1039.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1067.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1089.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Es simétrica respecto de la media; media, mediana y moda coinciden en el centro. Es asintótica al eje y el área bajo la curva es 1, no cero.</tspan><tspan x="58.0" dy="18">• Regla empírica: 68 % de los valores a ±1 desviación estándar, 95 % a ±2 (1,96) y 99,7 % a ±3.</tspan><tspan x="58.0" dy="18">• Normal estándar: media 0 y desviación 1; Z = (valor - media) / desviación estándar.</tspan><tspan x="58.0" dy="18">• La asimetría es de las distribuciones sesgadas (media hacia la cola). Si no hay normalidad se usan pruebas no paramétricas.</tspan></text><text x="58.0" y="1165.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Gordis, Epidemiología 6.ª ed. (2019); Szklo y Nieto, Epidemiology: Beyond the Basics 4.ª ed. (2019); Rothman, Modern Epidemiology 4.ª ed. (2021).</tspan></text></svg>