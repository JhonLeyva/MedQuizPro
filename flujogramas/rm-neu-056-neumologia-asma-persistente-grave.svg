<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1245" viewBox="0 0 1000 1245" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En el asma persistente grave el pilar es el corticoide inhalado a dosis altas y el corticoide sistémico en la dosis mínima eficaz"><title>En el asma persistente grave el pilar es el corticoide inhalado a dosis altas y el corticoide sistémico en la dosis mínima eficaz</title><rect x="0.75" y="0.75" width="998.5" height="1243.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neumología · asma persistente grave</tspan></text><rect x="420.1" y="32.0" width="114.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="477.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="99"><tspan x="477.6" dy="0">NEUMOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Asma persistente grave</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Inflamación crónica con hiperreactividad y obstrucción variable.</tspan><tspan x="58.0" dy="17">Se trata en escalones según el control.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de tratamiento</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué se indica en el asma persistente grave?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ESCALONES DEL TRATAMIENTO DEL ASMA SEGÚN LA GRAVEDAD</tspan></text><rect x="70.0" y="263.0" width="34.0" height="330.0" rx="17" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="75.0" y="487.0" width="24.0" height="102.0" rx="8" fill="#10b981" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="538.0" x2="130.0" y2="538.0" stroke="#10b981" stroke-width="2"/><rect x="130.0" y="488.0" width="330.0" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="510.0" font-size="12" font-weight="800" font-style="normal" fill="#10b981" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Pasos 1-2</tspan></text><text x="240.0" y="510.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Asma leve</tspan></text><text x="144.0" y="531.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Controlador a demanda o dosis baja</tspan></text><rect x="75.0" y="377.0" width="24.0" height="102.0" rx="8" fill="#f59e0b" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="428.0" x2="130.0" y2="428.0" stroke="#f59e0b" stroke-width="2"/><rect x="130.0" y="378.0" width="330.0" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="400.0" font-size="12" font-weight="800" font-style="normal" fill="#f59e0b" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Paso 3</tspan></text><text x="240.0" y="400.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Asma moderada</tspan></text><text x="144.0" y="421.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Corticoide inhalado en dosis baja con broncodilatador</tspan><tspan x="144.0" dy="15">de acción prolongada</tspan></text><rect x="75.0" y="267.0" width="24.0" height="102.0" rx="8" fill="#f97316" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="318.0" x2="130.0" y2="318.0" stroke="#0f766e" stroke-width="3"/><rect x="130.0" y="268.0" width="330.0" height="100.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="144.0" y="290.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Pasos 4-5</tspan></text><text x="240.0" y="290.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Persistente grave</tspan></text><text x="144.0" y="311.0" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Dosis alta, biológicos y corticoide oral mínimo</tspan></text><rect x="354.6" y="257.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="400.0" y="272.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="400.0" dy="0">◆ ESTE CASO</tspan></text><text x="470.0" y="267.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="490"><tspan x="470.0" dy="0">QUÉ SE INDICA EN LA FORMA GRAVE</tspan></text><rect x="470.0" y="281.0" width="490.0" height="84.0" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="323.0" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="328.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">1</tspan></text><text x="528.0" y="316.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Optimizar el inhalador</tspan></text><text x="528.0" y="339.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Corticoide inhalado en dosis alta con beta 2 de acción prolongada</tspan></text><line x1="498.0" y1="367.0" x2="498.0" y2="380.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,379.0 503.0,379.0 498.0,387.0" fill="#0f766e"/><rect x="470.0" y="389.0" width="490.0" height="84.0" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="431.0" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="436.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">2</tspan></text><text x="528.0" y="424.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Añadir antimuscarínico y evaluar biológico</tspan></text><text x="528.0" y="447.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Anti IgE, anti IL-5, anti IL-4R o anti TSLP según el fenotipo</tspan></text><line x1="498.0" y1="475.0" x2="498.0" y2="488.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,487.0 503.0,487.0 498.0,495.0" fill="#0f766e"/><rect x="470.0" y="497.0" width="490.0" height="84.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><circle cx="498.0" cy="539.0" r="17" fill="#ffffff" stroke="none" stroke-width="0"/><text x="498.0" y="544.0" font-size="15" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">3</tspan></text><text x="528.0" y="532.0" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Corticoide sistémico</tspan></text><text x="528.0" y="555.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Dosis mínima eficaz por su toxicidad: clave de este examen</tspan></text><rect x="857.8" y="486.0" width="64.5" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="501.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ CLAVE</tspan></text><text x="40.0" y="627.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ESCALONES DE TRATAMIENTO DEL ASMA (GINA 2024)</tspan></text><rect x="40.0" y="639.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="658.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">Paso</tspan></text><text x="175.0" y="658.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Tratamiento controlador</tspan></text><text x="572.5" y="658.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Nota</tspan></text><rect x="40.0" y="668.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="687.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">1 y 2</tspan></text><text x="175.0" y="687.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Corticoide inhalado en dosis baja, a demanda o diario</tspan></text><text x="572.5" y="687.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Asma leve</tspan></text><rect x="40.0" y="697.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="716.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">3</tspan></text><text x="175.0" y="716.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Corticoide inhalado dosis baja con beta 2 de acción prolongada</tspan></text><text x="572.5" y="716.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Mantenimiento</tspan></text><rect x="40.0" y="726.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="745.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">4</tspan></text><text x="175.0" y="745.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Dosis media o alta del corticoide inhalado con beta 2 de acción</tspan><tspan x="175.0" dy="15">prolongada</tspan></text><text x="572.5" y="745.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Se añade antimuscarínico si no hay control</tspan></text><rect x="40.0" y="770.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="789.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">5</tspan></text><text x="175.0" y="789.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Terapia biológica según fenotipo; corticoide oral en dosis mínima</tspan><tspan x="175.0" dy="15">como último recurso</tspan></text><text x="572.5" y="789.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Derivar para evaluar el fenotipo</tspan></text><rect x="65.6" y="781.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="111.0" y="796.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="111.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="854.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="864.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="895.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="867.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="886.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Corticoide</tspan><tspan x="285.0" dy="17">sistémico</tspan></text><text x="435.0" y="895.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Antihistamínico</tspan></text><text x="585.0" y="895.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Antileucotrieno</tspan></text><text x="735.0" y="886.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Cromoglicato</tspan><tspan x="735.0" dy="17">sódico</tspan></text><text x="885.0" y="895.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Teofilina</tspan></text><rect x="40.0" y="918.0" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="918.0" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="963.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué se indica?</tspan></text><text x="285.0" y="939.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: se añade en el</tspan><tspan x="285.0" dy="16">asma grave no</tspan><tspan x="285.0" dy="16">controlada, a la dosis</tspan><tspan x="285.0" dy="16">mínima eficaz</tspan></text><text x="435.0" y="963.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no trata el asma</tspan></text><text x="585.0" y="955.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: alternativa de</tspan><tspan x="585.0" dy="16">menor potencia</tspan></text><text x="735.0" y="955.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: poco eficaz y en</tspan><tspan x="735.0" dy="16">desuso</tspan></text><text x="885.0" y="947.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: estrecho margen</tspan><tspan x="885.0" dy="16">terapéutico, tercera</tspan><tspan x="885.0" dy="16">línea</tspan></text><rect x="40.0" y="864.0" width="920.0" height="136.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1024.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1052.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1074.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El pilar es el corticoide inhalado; en la forma grave se usa a dosis alta con beta 2 de acción prolongada y, si no controla, corticoide oral: la clave del</tspan><tspan x="58.0" dy="18">   examen.</tspan><tspan x="58.0" dy="18">• GINA 2024, pasos 4 y 5: se suman antimuscarínico de acción prolongada, terapia biológica (anti IgE, IL-5, IL-4R, TSLP) y corticoide oral como último</tspan><tspan x="58.0" dy="18">   recurso.</tspan><tspan x="58.0" dy="18">• Los antihistamínicos no tratan el asma; el cromoglicato está en desuso; el antileucotrieno es de menor potencia; la teofilina es de estrecho margen,</tspan><tspan x="58.0" dy="18">   tercera línea.</tspan><tspan x="58.0" dy="18">• Alerta: dos o más cursos de corticoide oral al año obligan a evaluar fenotipo y terapia biológica con neumología.</tspan></text><text x="58.0" y="1204.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: GINA, Global Strategy for Asthma Management and Prevention, actualización 2024 (ginasthma.org); Katzung, 16.ª ed. (2024).</tspan></text></svg>