<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1092" viewBox="0 0 1000 1092" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La prueba ideal para evaluar las várices es el eco Doppler"><title>La prueba ideal para evaluar las várices es el eco Doppler</title><rect x="0.75" y="0.75" width="998.5" height="1091.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Cirugía vascular · várices</tspan></text><rect x="351.1" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="394.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="394.3" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Várices</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Venas superficiales dilatadas y tortuosas (≥ 3 mm) por incompetencia valvular.</tspan><tspan x="58.0" dy="17">Factores: sexo femenino, embarazo, edad, obesidad, bipedestación.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es la prueba ideal de evaluación?</tspan></text><line x1="640.0" y1="189.0" x2="670.0" y2="189.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="209.0" x2="320.0" y2="239.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="239.0" x2="500.0" y2="239.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="239.0" x2="500.0" y2="268.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,267.0 505.0,267.0 500.0,275.0" fill="#94a3b8"/><line x1="500.0" y1="333.0" x2="500.0" y2="363.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="363.0" x2="811.3" y2="363.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="363.0" x2="188.7" y2="392.0" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,391.0 193.7,391.0 188.7,399.0" fill="#94a3b8"/><line x1="500.0" y1="363.0" x2="500.0" y2="392.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,391.0 505.0,391.0 500.0,399.0" fill="#94a3b8"/><line x1="811.3" y1="363.0" x2="811.3" y2="392.0" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,391.0 816.3,391.0 811.3,399.0" fill="#94a3b8"/><line x1="320.0" y1="209.0" x2="320.0" y2="239.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="239.0" x2="500.0" y2="239.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="239.0" x2="500.0" y2="268.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,267.0 505.0,267.0 500.0,275.0" fill="#0f766e"/><line x1="500.0" y1="333.0" x2="500.0" y2="363.0" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="363.0" x2="500.0" y2="363.0" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="363.0" x2="188.7" y2="392.0" stroke="#0f766e" stroke-width="3"/><polygon points="183.7,391.0 193.7,391.0 188.7,399.0" fill="#0f766e"/><rect x="102.0" y="372.0" width="173.3" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="188.7" y="384.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">Eco Doppler dúplex (este caso)</tspan></text><rect x="450.8" y="372.0" width="98.4" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="500.0" y="384.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">Pruebas clínicas</tspan></text><rect x="732.7" y="372.0" width="157.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="811.3" y="384.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">Flebografía o pletismografía</tspan></text><polygon points="240.0,304.0 266.0,275.0 734.0,275.0 760.0,304.0 734.0,333.0 266.0,333.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="304.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="309.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="308.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Várices: ¿cómo se estudian?</tspan></text><rect x="40.0" y="399.0" width="297.3" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="188.7" y="427.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">PRUEBA IDEAL</tspan></text><text x="188.7" y="450.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Reflujo, calibre y trombos</tspan><tspan x="188.7" dy="17">En bipedestación</tspan></text><rect x="351.3" y="399.0" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="435.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">TRENDELENBURG · PERTHES</tspan></text><text x="500.0" y="458.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Valor histórico</tspan></text><rect x="662.7" y="399.0" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="435.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">CASOS ESPECIALES</tspan></text><text x="811.3" y="458.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Invasiva o poco usada</tspan></text><text x="40.0" y="523.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN CLÍNICA CEAP 2020 DE LA ENFERMEDAD VENOSA CRÓNICA</tspan></text><rect x="40.0" y="535.5" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="554.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="84"><tspan x="50.0" dy="0">Clase</tspan></text><text x="150.0" y="554.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="394"><tspan x="150.0" dy="0">Hallazgo</tspan></text><text x="560.0" y="554.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="394"><tspan x="560.0" dy="0">Conducta</tspan></text><rect x="40.0" y="564.5" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="583.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="84"><tspan x="50.0" dy="0">C0</tspan></text><text x="150.0" y="583.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="150.0" dy="0">Sin signos visibles ni palpables</tspan></text><text x="560.0" y="583.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="560.0" dy="0">Sin tratamiento</tspan></text><rect x="40.0" y="593.5" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="612.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="84"><tspan x="50.0" dy="0">C1</tspan></text><text x="150.0" y="612.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="150.0" dy="0">Telangiectasias o venas reticulares</tspan></text><text x="560.0" y="612.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="560.0" dy="0">Escleroterapia (estética) si hay síntomas</tspan></text><rect x="40.0" y="622.5" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="641.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="84"><tspan x="50.0" dy="0">C2</tspan></text><text x="150.0" y="641.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="150.0" dy="0">Várices (≥ 3 mm en bipedestación; C2r si son recurrentes)</tspan></text><text x="560.0" y="641.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="560.0" dy="0">Compresión; ablación térmica o escleroterapia si hay reflujo</tspan></text><rect x="40.0" y="651.5" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="670.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="84"><tspan x="50.0" dy="0">C3</tspan></text><text x="150.0" y="670.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="150.0" dy="0">Edema</tspan></text><text x="560.0" y="670.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="560.0" dy="0">Compresión; tratar el reflujo</tspan></text><rect x="40.0" y="680.5" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="699.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="84"><tspan x="50.0" dy="0">C4</tspan></text><text x="150.0" y="699.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="150.0" dy="0">Cambios cutáneos: pigmentación o eccema (4a); lipodermatoesclerosis</tspan><tspan x="150.0" dy="15">o atrofia blanca (4b); corona flebectática (4c)</tspan></text><text x="560.0" y="699.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="560.0" dy="0">Compresión y tratar el reflujo</tspan></text><rect x="40.0" y="724.5" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="743.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="84"><tspan x="50.0" dy="0">C5</tspan></text><text x="150.0" y="743.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="150.0" dy="0">Úlcera cicatrizada</tspan></text><text x="560.0" y="743.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="560.0" dy="0">Compresión permanente; ablación</tspan></text><rect x="40.0" y="753.5" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="772.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="84"><tspan x="50.0" dy="0">C6</tspan></text><text x="150.0" y="772.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="150.0" dy="0">Úlcera activa (C6r si es recurrente)</tspan></text><text x="560.0" y="772.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="394"><tspan x="560.0" dy="0">Compresión y curación; ablación del reflujo</tspan></text><text x="40.0" y="822.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="832.5" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="855.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="835.5" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="855.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Doppler</tspan></text><text x="435.0" y="855.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Pletismografía</tspan></text><text x="585.0" y="855.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Flebografía</tspan></text><text x="735.0" y="855.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Perthes</tspan></text><text x="885.0" y="855.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Brodie</tspan></text><rect x="40.0" y="869.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="869.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="898.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Ideal?</tspan></text><text x="285.0" y="898.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: dúplex Doppler</tspan></text><text x="435.0" y="890.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: mide la bomba</tspan><tspan x="435.0" dy="16">muscular</tspan></text><text x="585.0" y="898.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: invasiva</tspan></text><text x="735.0" y="890.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: prueba clínica</tspan><tspan x="735.0" dy="16">histórica</tspan></text><text x="885.0" y="890.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: prueba clínica</tspan><tspan x="885.0" dy="16">histórica</tspan></text><rect x="40.0" y="832.5" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="943.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="971.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="993.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Doppler dúplex en bipedestación antes de tratar: reflujo, calibre y trombosis profunda.</tspan><tspan x="58.0" dy="18">• Complicaciones: tromboflebitis, pigmentación, eccema varicoso, lipodermatoesclerosis y úlcera del maléolo medial.</tspan><tspan x="58.0" dy="18">• Tratamiento: compresión, ablación térmica o escleroterapia.</tspan></text><text x="58.0" y="1051.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ESVS, enfermedad venosa crónica (2022); CEAP 2020 (Lurie, J Vasc Surg Venous Lymphat Disord 2020); Sabiston Tratado de Cirugía 21.ª ed.</tspan></text></svg>