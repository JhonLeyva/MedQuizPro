<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1058" viewBox="0 0 1000 1058" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Entre las opciones, la epilepsia mioclónica progresiva es la forma mioclónica definida y más característica"><title>Entre las opciones, la epilepsia mioclónica progresiva es la forma mioclónica definida y más característica</title><rect x="0.75" y="0.75" width="998.5" height="1056.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neurología pediátrica · epilepsias mioclónicas</tspan></text><rect x="472.8" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="521.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="521.8" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Epilepsias mioclónicas</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Grupo heterogéneo: fenómenos no epilépticos, síndromes autolimitados y encefalopatías.</tspan><tspan x="58.0" dy="17">El EEG, la neuroimagen y a veces el estudio genético o metabólico orientan.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de clasificación</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">En la epilepsia mioclónica de la infancia, ¿cuál es la</tspan><tspan x="640.0" dy="16">presentación más frecuente?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TRES GRUPOS DE CUADROS CON MIOCLONÍAS EN LA INFANCIA</tspan></text><rect x="40.0" y="269.0" width="920.0" height="95.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="269.0" width="108.0" height="95.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="320.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">No epiléptico</tspan></text><rect x="40.0" y="364.0" width="920.0" height="95.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="364.0" width="108.0" height="95.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="411.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Síndrome</tspan><tspan x="94.0" dy="14">autolimitado</tspan></text><rect x="40.0" y="459.0" width="920.0" height="95.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="459.0" width="108.0" height="95.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="510.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Progresivo</tspan></text><line x1="416.0" y1="308.5" x2="423.0" y2="308.5" stroke="#0f766e" stroke-width="2.2"/><line x1="423.0" y1="308.5" x2="423.0" y2="411.5" stroke="#0f766e" stroke-width="2.2"/><line x1="423.0" y1="411.5" x2="421.0" y2="411.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="421.0,416.5 421.0,406.5 430.0,411.5" fill="#0f766e"/><line x1="688.0" y1="411.5" x2="695.0" y2="411.5" stroke="#ea580c" stroke-width="2.2"/><line x1="695.0" y1="411.5" x2="695.0" y2="506.5" stroke="#ea580c" stroke-width="2.2"/><line x1="695.0" y1="506.5" x2="693.0" y2="506.5" stroke="#ea580c" stroke-width="2.2"/><polygon points="693.0,511.5 693.0,501.5 702.0,506.5" fill="#ea580c"/><rect x="158.0" y="282.0" width="258.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="238"><tspan x="168.0" dy="0">Mioclonías benignas del lactante</tspan></text><text x="168.0" y="315.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="238"><tspan x="168.0" dy="0">EEG normal; ceden de manera espontánea</tspan></text><circle cx="158.0" cy="282.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="430.0" y="377.0" width="258.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="440.0" y="393.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="238"><tspan x="440.0" dy="0">Epilepsia mioclónica de la infancia</tspan></text><text x="440.0" y="410.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="238"><tspan x="440.0" dy="0">Inicio a los 6 meses-3 años, desarrollo previo</tspan><tspan x="440.0" dy="14.5">normal, buen pronóstico</tspan></text><circle cx="430.0" cy="377.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="430.0" y="381.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="430.0" dy="0">2</tspan></text><rect x="702.0" y="472.0" width="258.0" height="69.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="712.0" y="488.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="238"><tspan x="712.0" dy="0">Epilepsia mioclónica progresiva</tspan></text><text x="712.0" y="505.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="238"><tspan x="712.0" dy="0">Mioclonías, crisis tonicoclónicas, deterioro</tspan><tspan x="712.0" dy="14.5">cognitivo y signos cerebelosos</tspan></text><circle cx="702.0" cy="472.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="702.0" y="476.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="702.0" dy="0">3</tspan></text><rect x="40.0" y="572.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="598.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Progresiva = la forma mioclónica definida entre las opciones</tspan></text><text x="60.0" y="617.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Las ausencias no son mioclónicas; las progresivas son raras, no frecuentes.</tspan></text><text x="40.0" y="684.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="694.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="733.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="697.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="716.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Epilepsia</tspan><tspan x="285.0" dy="17">mioclónica</tspan><tspan x="285.0" dy="17">progresiva</tspan></text><text x="435.0" y="716.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Mioclonías</tspan><tspan x="435.0" dy="17">benignas del</tspan><tspan x="435.0" dy="17">lactante</tspan></text><text x="585.0" y="716.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Epilepsia</tspan><tspan x="585.0" dy="17">mioclónica</tspan><tspan x="585.0" dy="17">compleja</tspan></text><text x="735.0" y="716.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Epilepsia</tspan><tspan x="735.0" dy="17">mioclónica típica de</tspan><tspan x="735.0" dy="17">la infancia</tspan></text><text x="885.0" y="733.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Crisis de ausencia</tspan></text><rect x="40.0" y="765.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="765.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="794.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Presentación más</tspan><tspan x="54.0" dy="16">característica?</tspan></text><text x="285.0" y="794.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: entidad definida</tspan><tspan x="285.0" dy="16">entre las opciones</tspan></text><text x="435.0" y="786.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: fenómeno no</tspan><tspan x="435.0" dy="16">epiléptico con EEG</tspan><tspan x="435.0" dy="16">normal</tspan></text><text x="585.0" y="794.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no es una entidad</tspan><tspan x="585.0" dy="16">reconocida por la ILAE</tspan></text><text x="735.0" y="794.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no es una entidad</tspan><tspan x="735.0" dy="16">reconocida por la ILAE</tspan></text><text x="885.0" y="794.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: las ausencias no</tspan><tspan x="885.0" dy="16">son mioclónicas</tspan></text><rect x="40.0" y="694.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="855.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="883.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="905.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Progresivas: mioclonías, crisis tonicoclónicas, deterioro cognitivo y signos cerebelosos (Unverricht-Lundborg, Lafora, MERRF, lipofuscinosis, sialidosis).</tspan><tspan x="58.0" dy="18">• Mioclonías benignas del lactante: fenómeno no epiléptico, EEG normal, ceden solas. Epilepsia mioclónica de la infancia: autolimitada, inicio a los 6</tspan><tspan x="58.0" dy="18">   meses-3 años, ILAE 2022.</tspan><tspan x="58.0" dy="18">• La epilepsia mioclónica juvenil es la más frecuente en adolescentes. Las ausencias no son mioclónicas y las otras opciones no son entidades</tspan><tspan x="58.0" dy="18">   reconocidas por la ILAE.</tspan><tspan x="58.0" dy="18">• Alerta: la regresión del desarrollo con mioclonías obliga a descartar una causa progresiva.</tspan></text><text x="58.0" y="1017.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ILAE, Zuberi SM et al., Epilepsia 2022;63:1349-1397; Nelson Tratado de Pediatría 22.ª ed. (2024)</tspan></text></svg>