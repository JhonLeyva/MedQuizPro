<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="914" viewBox="0 0 1000 914" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Ve bien de cerca y entrecierra los párpados para ver de lejos: miopía"><title>Ve bien de cerca y entrecierra los párpados para ver de lejos: miopía</title><rect x="0.75" y="0.75" width="998.5" height="912.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Oftalmología pediátrica · errores refractivos</tspan></text><rect x="458.4" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="507.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="507.5" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Miopía</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La imagen lejana se forma por delante de la retina, casi siempre por un globo ocular largo.</tspan><tspan x="58.0" dy="17">Se corrige con lentes cóncavas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Adolescente de 12 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Ve bien de cerca.</tspan><tspan x="640.0" dy="16">Contrae los párpados para ver de lejos.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><rect x="40.0" y="245.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="271.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Ve bien de cerca y entrecierra para ver de lejos = miopía</tspan></text><text x="60.0" y="290.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Hipermetropía, astigmatismo, anisometropía y glaucoma infantil tienen otra presentación.</tspan></text><text x="40.0" y="351.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ERRORES REFRACTIVOS Y GLAUCOMA INFANTIL: CÓMO VE EL NIÑO</tspan></text><rect x="40.0" y="363.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Entidad</tspan></text><text x="220.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="234"><tspan x="220.0" dy="0">Mecanismo</tspan></text><text x="470.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="234"><tspan x="470.0" dy="0">Cómo ve</tspan></text><text x="720.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="234"><tspan x="720.0" dy="0">Corrección o manejo</tspan></text><rect x="40.0" y="392.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="411.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Miopía</tspan></text><text x="220.0" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="234"><tspan x="220.0" dy="0">Imagen por delante de la retina</tspan></text><text x="470.0" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="234"><tspan x="470.0" dy="0">Bien de cerca, mal de lejos; achina los</tspan><tspan x="470.0" dy="15">ojos</tspan></text><text x="720.0" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="234"><tspan x="720.0" dy="0">Lentes cóncavas</tspan></text><rect x="110.6" y="403.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="156.0" y="418.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="156.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="436.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="455.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Hipermetropía</tspan></text><text x="220.0" y="455.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="234"><tspan x="220.0" dy="0">Imagen por detrás de la retina</tspan></text><text x="470.0" y="455.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="234"><tspan x="470.0" dy="0">Dificultad de cerca; cefalea con la lectura</tspan></text><text x="720.0" y="455.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="234"><tspan x="720.0" dy="0">Lentes convexas</tspan></text><rect x="40.0" y="465.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="484.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Astigmatismo</tspan></text><text x="220.0" y="484.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="234"><tspan x="220.0" dy="0">Curvatura corneal desigual</tspan></text><text x="470.0" y="484.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="234"><tspan x="470.0" dy="0">Borroso a todas las distancias</tspan></text><text x="720.0" y="484.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="234"><tspan x="720.0" dy="0">Lentes cilíndricas</tspan></text><rect x="40.0" y="494.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="513.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Anisometropía</tspan></text><text x="220.0" y="513.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="234"><tspan x="220.0" dy="0">Refracción distinta en ambos ojos</tspan></text><text x="470.0" y="513.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="234"><tspan x="470.0" dy="0">Riesgo de ambliopía</tspan></text><text x="720.0" y="513.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="234"><tspan x="720.0" dy="0">Corregir y tratar la ambliopía</tspan></text><rect x="40.0" y="523.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="542.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Glaucoma infantil</tspan></text><text x="220.0" y="542.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="234"><tspan x="220.0" dy="0">Aumento de la presión intraocular</tspan></text><text x="470.0" y="542.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="234"><tspan x="470.0" dy="0">Fotofobia, epífora y globo grande</tspan></text><text x="720.0" y="542.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="234"><tspan x="720.0" dy="0">Derivar al oftalmólogo</tspan></text><text x="40.0" y="592.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="602.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="624.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="624.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hipermetropía</tspan></text><text x="435.0" y="624.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Astigmatismo</tspan></text><text x="585.0" y="624.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Anisometropía</tspan></text><rect x="663.0" y="605.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="624.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Miopía</tspan></text><text x="885.0" y="624.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Glaucoma</tspan></text><rect x="40.0" y="639.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="639.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="668.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico más</tspan><tspan x="54.0" dy="16">probable?</tspan></text><text x="285.0" y="660.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: ve mal de cerca y</tspan><tspan x="285.0" dy="16">compensa</tspan><tspan x="285.0" dy="16">acomodando</tspan></text><text x="435.0" y="660.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: la visión es</tspan><tspan x="435.0" dy="16">borrosa a todas las</tspan><tspan x="435.0" dy="16">distancias</tspan></text><text x="585.0" y="660.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es diferencia de</tspan><tspan x="585.0" dy="16">refracción entre ambos</tspan><tspan x="585.0" dy="16">ojos</tspan></text><text x="735.0" y="668.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: ve bien de cerca y</tspan><tspan x="735.0" dy="16">mal de lejos</tspan></text><text x="885.0" y="660.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: cursa con</tspan><tspan x="885.0" dy="16">fotofobia, epífora y</tspan><tspan x="885.0" dy="16">globo grande</tspan></text><rect x="40.0" y="602.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="729.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="757.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="779.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Visión nítida de cerca y borrosa de lejos; se sienta cerca de la pizarra y achina los ojos, con efecto estenopeico que reduce el círculo de desenfoque.</tspan><tspan x="58.0" dy="18">• Aparece en la edad escolar y progresa en la adolescencia; más riesgo con padres miopes, poco tiempo al aire libre y mucho trabajo de cerca.</tspan><tspan x="58.0" dy="18">• Hipermetropía: dificultad de cerca con cefalea al leer. Astigmatismo: borroso a toda distancia. Anisometropía: diferencia entre ojos con riesgo de</tspan><tspan x="58.0" dy="18">   ambliopía.</tspan><tspan x="58.0" dy="18">• Alerta: la miopía alta predispone a desprendimiento de retina, glaucoma y maculopatía; atropina en dosis bajas y lentes especiales frenan la progresión.</tspan></text><text x="58.0" y="873.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Flitcroft DI et al., IMI, definición y clasificación de la miopía, Invest Ophthalmol Vis Sci 2019; Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>