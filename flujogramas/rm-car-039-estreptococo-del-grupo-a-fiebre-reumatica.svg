<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1281" viewBox="0 0 1000 1281" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La complicación más severa del estreptococo beta hemolítico es la fiebre reumática"><title>La complicación más severa del estreptococo beta hemolítico es la fiebre reumática</title><rect x="0.75" y="0.75" width="998.5" height="1279.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Estreptococo del grupo A · fiebre reumática</tspan></text><rect x="457.5" y="32.0" width="117.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="516.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="101"><tspan x="516.1" dy="0">CARDIOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Fiebre reumática</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Complicación no supurativa tardía de la faringoamigdalitis por S. pyogenes (grupo A).</tspan><tspan x="58.0" dy="17">Su gravedad es la cardiopatía reumática crónica.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es la complicación más severa de la infección</tspan><tspan x="640.0" dy="16">por estreptococo beta hemolítico?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DE LA FARINGITIS A LA CARDIOPATÍA</tspan></text><text x="40.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="430"><tspan x="40.0" dy="0">MECANISMO</tspan></text><text x="516.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="444"><tspan x="516.0" dy="0">POR QUÉ IMPORTA</tspan></text><rect x="40.0" y="291.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="320.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="325.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><text x="84.0" y="317.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Faringoamigdalitis por S. pyogenes</tspan></text><text x="84.0" y="334.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Bacteria beta hemolítica del grupo A</tspan></text><line x1="476.0" y1="320.5" x2="503.0" y2="320.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,315.5 502.0,325.5 510.0,320.5" fill="#ea580c"/><rect x="516.0" y="293.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="317.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Es la puerta de entrada de toda la cadena</tspan></text><text x="530.0" y="334.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0"></tspan></text><line x1="255.0" y1="352.0" x2="255.0" y2="365.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,364.0 260.0,364.0 255.0,372.0" fill="#0f766e"/><rect x="40.0" y="374.0" width="430.0" height="75.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="411.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="416.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">2</tspan></text><text x="84.0" y="400.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Mimetismo molecular</tspan></text><text x="84.0" y="417.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">La proteína M se parece a antígenos del corazón, articulación,</tspan><tspan x="84.0" dy="16">cerebro y piel</tspan></text><line x1="476.0" y1="411.5" x2="503.0" y2="411.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,406.5 502.0,416.5 510.0,411.5" fill="#ea580c"/><rect x="516.0" y="384.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="408.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Aparece 2 a 4 semanas después</tspan></text><text x="530.0" y="425.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0"></tspan></text><line x1="255.0" y1="451.0" x2="255.0" y2="464.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,463.0 260.0,463.0 255.0,471.0" fill="#0f766e"/><rect x="40.0" y="473.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="502.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="507.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">3</tspan></text><text x="84.0" y="499.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Fiebre reumática aguda</tspan></text><text x="84.0" y="516.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Carditis, poliartritis migratoria, corea, eritema marginado y nódulos</tspan></text><line x1="476.0" y1="502.5" x2="503.0" y2="502.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,497.5 502.0,507.5 510.0,502.5" fill="#ea580c"/><rect x="516.0" y="475.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="499.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Se diagnostica con los criterios de Jones</tspan></text><text x="530.0" y="516.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0"></tspan></text><line x1="255.0" y1="534.0" x2="255.0" y2="547.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,546.0 260.0,546.0 255.0,554.0" fill="#0f766e"/><rect x="40.0" y="556.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="585.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="590.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">4</tspan></text><text x="84.0" y="582.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Cardiopatía reumática crónica</tspan></text><text x="84.0" y="599.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Estenosis o insuficiencia valvular, sobre todo mitral</tspan></text><line x1="476.0" y1="585.5" x2="503.0" y2="585.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,580.5 502.0,590.5 510.0,585.5" fill="#ea580c"/><rect x="516.0" y="558.0" width="444.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="530.0" y="582.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">La complicación más severa</tspan></text><text x="530.0" y="599.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Este caso</tspan></text><rect x="40.0" y="633.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="659.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Fiebre reumática: su gravedad es la cardiopatía crónica</tspan></text><text x="60.0" y="678.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Es la causa de cardiopatía adquirida en jóvenes de países de bajos ingresos.</tspan></text><text x="40.0" y="739.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CRITERIOS DE JONES 2015 (AHA): SE EXIGE EVIDENCIA DE ESTREPTOCOCO PREVIO</tspan></text><rect x="40.0" y="751.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="770.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">Criterio</tspan></text><text x="160.0" y="770.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="389"><tspan x="160.0" dy="0">Población de bajo riesgo</tspan></text><text x="565.0" y="770.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="389"><tspan x="565.0" dy="0">Población de riesgo moderado o alto</tspan></text><rect x="40.0" y="780.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="799.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">Mayores</tspan></text><text x="160.0" y="799.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="160.0" dy="0">Carditis (clínica o subclínica), poliartritis, corea, eritema marginado y</tspan><tspan x="160.0" dy="15">nódulos subcutáneos</tspan></text><text x="565.0" y="799.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="565.0" dy="0">Carditis (clínica o subclínica), mono o poliartritis o poliartralgia, corea,</tspan><tspan x="565.0" dy="15">eritema marginado y nódulos subcutáneos</tspan></text><rect x="40.0" y="824.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="843.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">Menores</tspan></text><text x="160.0" y="843.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="160.0" dy="0">Poliartralgia; fiebre ≥ 38,5 °C; VSG ≥ 60 mm/h o PCR ≥ 3 mg/dL; PR</tspan><tspan x="160.0" dy="15">prolongado</tspan></text><text x="565.0" y="843.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="565.0" dy="0">Monoartralgia; fiebre ≥ 38 °C; VSG ≥ 30 mm/h o PCR ≥ 3 mg/dL; PR</tspan><tspan x="565.0" dy="15">prolongado</tspan></text><rect x="40.0" y="868.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="887.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">Diagnóstico</tspan></text><text x="160.0" y="887.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="160.0" dy="0">2 mayores, o 1 mayor y 2 menores</tspan></text><text x="565.0" y="887.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="565.0" dy="0">2 mayores, o 1 mayor y 2 menores</tspan></text><text x="40.0" y="913.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Riesgo moderado o alto: incidencia &gt; 2 por 100 000 escolares o prevalencia de cardiopatía reumática &gt; 1 por 1000 habitantes.</tspan></text><text x="40.0" y="960.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="970.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1001.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1001.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Artritis séptica</tspan></text><text x="435.0" y="992.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Síndrome urémico</tspan><tspan x="435.0" dy="17">hemolítico</tspan></text><text x="585.0" y="1001.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Miocarditis</tspan></text><text x="735.0" y="1001.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Osteomielitis</tspan></text><rect x="813.0" y="973.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="1001.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Fiebre reumática</tspan></text><rect x="40.0" y="1024.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="1024.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1061.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Más grave?</tspan></text><text x="285.0" y="1053.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es supurativa, por</tspan><tspan x="285.0" dy="16">otros gérmenes</tspan></text><text x="435.0" y="1045.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: lo causa E. coli</tspan><tspan x="435.0" dy="16">productora de toxina</tspan><tspan x="435.0" dy="16">Shiga</tspan></text><text x="585.0" y="1053.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es solo una parte</tspan><tspan x="585.0" dy="16">de la carditis</tspan></text><text x="735.0" y="1053.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es supurativa, por</tspan><tspan x="735.0" dy="16">otros gérmenes</tspan></text><text x="885.0" y="1053.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: deja daño valvular</tspan><tspan x="885.0" dy="16">crónico</tspan></text><rect x="40.0" y="970.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1114.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1142.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1164.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Aparece 2-4 semanas después de la faringitis, por mimetismo molecular entre la proteína M y antígenos del corazón, articulación, cerebro y piel.</tspan><tspan x="58.0" dy="18">• Criterios de Jones 2015 (AHA): 2 mayores, o 1 mayor y 2 menores, con evidencia de estreptococo previo.</tspan><tspan x="58.0" dy="18">• Mayores: carditis, poliartritis migratoria, corea de Sydenham, eritema marginado y nódulos subcutáneos.</tspan><tspan x="58.0" dy="18">• La penicilina benzatínica previene las recurrencias; el síndrome urémico hemolítico lo causa E. coli productora de toxina Shiga.</tspan></text><text x="58.0" y="1240.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Gewitz MH et al., AHA, Jones Criteria (Circulation 2015;131:1806-18); Harrison Principios de Medicina Interna 21.ª ed. (2022)</tspan></text></svg>