<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1291" viewBox="0 0 1000 1291" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La orina colúrica del recién nacido ictérico se debe a bilirrubina conjugada hidrosoluble que se filtra por el riñón"><title>La orina colúrica del recién nacido ictérico se debe a bilirrubina conjugada hidrosoluble que se filtra por el riñón</title><rect x="0.75" y="0.75" width="998.5" height="1289.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neonatología · ictericia y coluria</tspan></text><rect x="391.4" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="440.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="440.4" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Metabolismo de la bilirrubina</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El hem se convierte en biliverdina y en bilirrubina indirecta, liposoluble y unida a albúmina.</tspan><tspan x="58.0" dy="17">El hepatocito la conjuga con ácido glucurónico y la hace hidrosoluble.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de fisiopatología</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">En la ictericia del recién nacido, ¿a qué se debe la</tspan><tspan x="640.0" dy="16">orina colúrica?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CAMINO DE LA BILIRRUBINA Y ORIGEN DE LA COLURIA</tspan></text><rect x="40.0" y="269.0" width="920.0" height="112.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="269.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="329.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Sangre</tspan></text><rect x="40.0" y="381.0" width="920.0" height="112.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="381.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="441.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Hígado</tspan></text><rect x="40.0" y="493.0" width="920.0" height="112.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="493.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="553.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Bilis y orina</tspan></text><line x1="307.2" y1="325.0" x2="314.2" y2="325.0" stroke="#0f766e" stroke-width="2.2"/><line x1="314.2" y1="325.0" x2="314.2" y2="437.0" stroke="#0f766e" stroke-width="2.2"/><line x1="314.2" y1="437.0" x2="312.2" y2="437.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="312.2,442.0 312.2,432.0 321.2,437.0" fill="#0f766e"/><line x1="470.4" y1="437.0" x2="477.4" y2="437.0" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="437.0" x2="477.4" y2="549.0" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="549.0" x2="475.4" y2="549.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="475.4,554.0 475.4,544.0 484.4,549.0" fill="#0f766e"/><line x1="633.6" y1="549.0" x2="640.6" y2="549.0" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="549.0" x2="640.6" y2="325.0" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="325.0" x2="638.6" y2="325.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="638.6,330.0 638.6,320.0 647.6,325.0" fill="#0f766e"/><line x1="796.8" y1="325.0" x2="803.8" y2="325.0" stroke="#ea580c" stroke-width="2.2"/><line x1="803.8" y1="325.0" x2="803.8" y2="540.5" stroke="#ea580c" stroke-width="2.2"/><line x1="803.8" y1="540.5" x2="801.8" y2="540.5" stroke="#ea580c" stroke-width="2.2"/><polygon points="801.8,545.5 801.8,535.5 810.8,540.5" fill="#ea580c"/><rect x="158.0" y="282.0" width="149.2" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Hem a bilirrubina</tspan><tspan x="168.0" dy="16">indirecta</tspan></text><text x="168.0" y="331.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Liposoluble, unida a</tspan><tspan x="168.0" dy="14.5">albúmina; no se filtra</tspan></text><circle cx="158.0" cy="282.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="321.2" y="394.0" width="149.2" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="331.2" y="410.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Captación y</tspan><tspan x="331.2" dy="16">conjugación</tspan></text><text x="331.2" y="443.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Proteínas Y y Z;</tspan><tspan x="331.2" dy="14.5">glucuroniltransferasa</tspan></text><circle cx="321.2" cy="394.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="321.2" y="398.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="321.2" dy="0">2</tspan></text><rect x="484.4" y="506.0" width="149.2" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="494.4" y="522.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Bilirrubina directa en</tspan><tspan x="494.4" dy="16">bilis</tspan></text><text x="494.4" y="555.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Hidrosoluble; sale al</tspan><tspan x="494.4" dy="14.5">intestino</tspan></text><circle cx="484.4" cy="506.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="484.4" y="510.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="484.4" dy="0">3</tspan></text><rect x="647.6" y="282.0" width="149.2" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="657.6" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Con colestasis</tspan><tspan x="657.6" dy="16">regurgita</tspan></text><text x="657.6" y="331.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">La directa pasa a la</tspan><tspan x="657.6" dy="14.5">sangre</tspan></text><circle cx="647.6" cy="282.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="647.6" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="647.6" dy="0">4</tspan></text><rect x="810.8" y="506.0" width="149.2" height="69.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="820.8" y="522.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Se filtra: coluria</tspan></text><text x="820.8" y="539.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Orina oscura y heces</tspan><tspan x="820.8" dy="14.5">acólicas</tspan></text><circle cx="810.8" cy="506.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="810.8" y="510.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="810.8" dy="0">5</tspan></text><rect x="40.0" y="623.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="649.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Coluria = bilirrubina directa hidrosoluble</tspan></text><text x="60.0" y="668.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La indirecta unida a albúmina no pasa a la orina.</tspan></text><text x="40.0" y="729.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">HIPERBILIRRUBINEMIA INDIRECTA FRENTE A DIRECTA</tspan></text><rect x="40.0" y="741.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="760.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Rasgo</tspan></text><text x="270.0" y="760.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Indirecta</tspan></text><text x="620.0" y="760.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Directa</tspan></text><rect x="40.0" y="770.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="789.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Solubilidad</tspan></text><text x="270.0" y="789.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Liposoluble, unida a albúmina</tspan></text><text x="620.0" y="789.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Hidrosoluble</tspan></text><rect x="40.0" y="799.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="818.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Orina y heces</tspan></text><text x="270.0" y="818.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Orina normal</tspan></text><text x="620.0" y="818.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Coluria y heces acólicas</tspan></text><rect x="40.0" y="828.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="847.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Causas</tspan></text><text x="270.0" y="847.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Hemólisis, inmadurez hepática</tspan></text><text x="620.0" y="847.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Colestasis: atresia biliar, hepatitis, quiste de colédoco</tspan></text><text x="40.0" y="873.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">La clave C del libro fue reformulada por el banco para que sea clínicamente correcta.</tspan></text><text x="40.0" y="920.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="930.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="969.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="961.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Circulación de</tspan><tspan x="285.0" dy="17">bilirrubina libre</tspan></text><text x="435.0" y="961.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Ligazón a proteína</tspan><tspan x="435.0" dy="17">Z y ligandina</tspan></text><rect x="513.0" y="933.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="952.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Bilirrubina</tspan><tspan x="585.0" dy="17">conjugada</tspan><tspan x="585.0" dy="17">hidrosoluble filtrada</tspan></text><text x="735.0" y="961.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Catabolismo del</tspan><tspan x="735.0" dy="17">hem</tspan></text><text x="885.0" y="952.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Degradación de</tspan><tspan x="885.0" dy="17">hemoglobina</tspan><tspan x="885.0" dy="17">eritrocitaria</tspan></text><rect x="40.0" y="1001.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="1001.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1030.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿A qué se debe la</tspan><tspan x="54.0" dy="16">coluria?</tspan></text><text x="285.0" y="1030.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: la libre va unida a</tspan><tspan x="285.0" dy="16">albúmina y no se filtra</tspan></text><text x="435.0" y="1030.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es un paso de</tspan><tspan x="435.0" dy="16">captación hepática</tspan></text><text x="585.0" y="1030.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: hidrosoluble, se</tspan><tspan x="585.0" dy="16">filtra por el riñón</tspan></text><text x="735.0" y="1022.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es el origen de la</tspan><tspan x="735.0" dy="16">bilirrubina, no explica</tspan><tspan x="735.0" dy="16">la coluria</tspan></text><text x="885.0" y="1030.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: genera bilirrubina</tspan><tspan x="885.0" dy="16">indirecta</tspan></text><rect x="40.0" y="930.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1091.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1119.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1141.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La bilirrubina indirecta unida a albúmina no se filtra por el glomérulo; por eso la ictericia indirecta no tiñe la orina.</tspan><tspan x="58.0" dy="18">• La directa (conjugada) es hidrosoluble; con colestasis regurgita al plasma y se elimina por la orina: coluria con heces acólicas.</tspan><tspan x="58.0" dy="18">• Causas: atresia de vías biliares, hepatitis neonatal, quiste de colédoco, sepsis. Según el comentario del banco, directa mayor de 1 mg/dL con total menor</tspan><tspan x="58.0" dy="18">   de 5, o más de 20 % del total, es patológica.</tspan><tspan x="58.0" dy="18">• Alerta: ictericia de más de 14 días en el término obliga a medir bilirrubina fraccionada; la atresia biliar se opera antes de los 60 días.</tspan></text><text x="58.0" y="1235.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Kemper AR y cols., AAP, hiperbilirrubinemia neonatal, revisión 2022. Pediatrics 2022;150:e2022058859; NTS 214-2024 MINSA, Atención integral de la persona recién</tspan><tspan x="58.0" dy="15">nacida; Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>