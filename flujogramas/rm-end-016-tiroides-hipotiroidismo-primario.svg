<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="931" viewBox="0 0 1000 931" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Hipotiroidismo primario en mujer de 46 años: levotiroxina 50 a 100 microgramos al día"><title>Hipotiroidismo primario en mujer de 46 años: levotiroxina 50 a 100 microgramos al día</title><rect x="0.75" y="0.75" width="998.5" height="929.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Tiroides · hipotiroidismo primario</tspan></text><rect x="398.7" y="32.0" width="140.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="468.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="124"><tspan x="468.9" dy="0">ENDOCRINOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hipotiroidismo primario</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">TSH alta con T4 libre baja; la causa más frecuente es la tiroiditis de Hashimoto.</tspan><tspan x="58.0" dy="17">La levotiroxina se ajusta por edad y cardiopatía.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 46 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Seis meses de fatiga, letargia, aumento de peso,</tspan><tspan x="640.0" dy="16">intolerancia al frío, ronquera y estreñimiento.</tspan><tspan x="640.0" dy="16">TSH 26 mUI/L, T4 libre baja, ECG normal. Inicia</tspan><tspan x="640.0" dy="16">levotiroxina.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DOSIS INICIAL DE LEVOTIROXINA SEGÚN EL PACIENTE</tspan></text><rect x="40.0" y="301.0" width="170.0" height="93.0" rx="16" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="125.0" y="327.0" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="150"><tspan x="125.0" dy="0">PESO DEL CASO</tspan></text><text x="125.0" y="363.0" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">46 años</tspan></text><text x="125.0" y="385.0" font-size="11" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="146"><tspan x="125.0" dy="0">TSH 26 mUI/L</tspan></text><line x1="214.0" y1="347.5" x2="229.0" y2="347.5" stroke="#0f766e" stroke-width="2"/><polygon points="228.0,342.5 228.0,352.5 236.0,347.5" fill="#0f766e"/><rect x="240.0" y="301.0" width="213.3" height="93.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="346.7" y="323.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="197"><tspan x="346.7" dy="0">JOVEN SANO</tspan></text><text x="346.7" y="357.0" font-size="22" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="197"><tspan x="346.7" dy="0">1,6 µg/kg</tspan></text><text x="346.7" y="379.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="193"><tspan x="346.7" dy="0">Dosis completa desde el inicio</tspan></text><text x="473.3" y="358.5" font-size="30" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="40"><tspan x="473.3" dy="0">×</tspan></text><rect x="493.3" y="301.0" width="213.3" height="93.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="600.0" y="323.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="197"><tspan x="600.0" dy="0">MAYOR DE 50-60 O CARDIÓPATA</tspan></text><text x="600.0" y="357.0" font-size="22" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="197"><tspan x="600.0" dy="0">25-50 µg</tspan></text><text x="600.0" y="379.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="193"><tspan x="600.0" dy="0">Subir cada 6-8 semanas</tspan></text><text x="726.7" y="358.5" font-size="30" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="40"><tspan x="726.7" dy="0">=</tspan></text><rect x="746.7" y="301.0" width="213.3" height="93.0" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="853.3" y="323.0" font-size="10.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="197"><tspan x="853.3" dy="0">ESTE CASO: 46 AÑOS, TSH 26</tspan></text><text x="853.3" y="357.0" font-size="22" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="197"><tspan x="853.3" dy="0">50-100 µg</tspan></text><text x="853.3" y="379.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="193"><tspan x="853.3" dy="0">Sin cardiopatía; ECG normal</tspan></text><rect x="793.2" y="383.0" width="120.4" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="853.3" y="398.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="853.3" dy="0">◆ DOSIS DEL CASO</tspan></text><text x="44.0" y="430.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="44.0" dy="0">CADA ALTERNATIVA CONTRA EL CÁLCULO</tspan></text><rect x="40.0" y="440.0" width="176.0" height="73.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="128.0" y="458.0" font-size="9.5" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="160"><tspan x="128.0" dy="0">✓ COINCIDE</tspan></text><text x="128.0" y="476.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="128.0" dy="0">50 - 100 µg al día</tspan></text><text x="128.0" y="493.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="128.0" dy="0">Elección</tspan></text><rect x="226.0" y="440.0" width="176.0" height="73.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="314.0" y="458.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="160"><tspan x="314.0" dy="0">✗ NO</tspan></text><text x="314.0" y="476.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="314.0" dy="0">150 - 200 µg al día</tspan></text><text x="314.0" y="493.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="314.0" dy="0">Excesiva</tspan></text><rect x="412.0" y="440.0" width="176.0" height="73.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="458.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="160"><tspan x="500.0" dy="0">✗ NO</tspan></text><text x="500.0" y="476.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="500.0" dy="0">10 - 20 µg al día</tspan></text><text x="500.0" y="493.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="500.0" dy="0">Subterapéutica</tspan></text><rect x="598.0" y="440.0" width="176.0" height="73.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="686.0" y="458.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="160"><tspan x="686.0" dy="0">✗ NO</tspan></text><text x="686.0" y="476.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="686.0" dy="0">25 - 50 µg al día</tspan></text><text x="686.0" y="493.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="686.0" dy="0">Para ancianos o cardiópatas</tspan></text><rect x="784.0" y="440.0" width="176.0" height="73.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="872.0" y="458.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="160"><tspan x="872.0" dy="0">✗ NO</tspan></text><text x="872.0" y="476.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="872.0" dy="0">100 - 150 µg al día</tspan></text><text x="872.0" y="493.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="872.0" dy="0">Cercana a dosis completa</tspan></text><rect x="40.0" y="531.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="557.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">50-100 µg de levotiroxina al día</tspan></text><text x="60.0" y="576.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Control de TSH a las 6-8 semanas para ajustar.</tspan></text><text x="40.0" y="643.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="653.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="656.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="675.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">50 - 100</tspan></text><text x="435.0" y="675.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">150 - 200</tspan></text><text x="585.0" y="675.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">10 - 20</tspan></text><text x="735.0" y="675.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">25 - 50</tspan></text><text x="885.0" y="675.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">100 - 150</tspan></text><rect x="40.0" y="690.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="690.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="719.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Dosis inicial (µg/día)?</tspan></text><text x="285.0" y="711.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: esquema</tspan><tspan x="285.0" dy="16">intermedio aceptado</tspan></text><text x="435.0" y="711.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: excesiva, arriesga</tspan><tspan x="435.0" dy="16">arritmia</tspan></text><text x="585.0" y="719.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: subterapéutica</tspan></text><text x="735.0" y="711.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: baja para este</tspan><tspan x="735.0" dy="16">caso</tspan></text><text x="885.0" y="711.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: dosis completa, sin</tspan><tspan x="885.0" dy="16">ajuste</tspan></text><rect x="40.0" y="653.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="764.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="792.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="814.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Dosis completa: 1,6 µg/kg/día en jóvenes sanos; en mayores de 50-60 años o con cardiopatía se parte de 25-50 µg y se sube cada 6-8 semanas.</tspan><tspan x="58.0" dy="18">• Para esta mujer de 46 años, sin coronariopatía y con TSH muy alta, 50-100 µg/día es un esquema intermedio aceptado.</tspan><tspan x="58.0" dy="18">• Tomar en ayunas, 30-60 min antes del desayuno y separada de calcio y hierro.</tspan><tspan x="58.0" dy="18">• Meta: TSH entre 0,5 y 4,0 mUI/L; control a las 6-8 semanas. Dosis de 150-200 µg arriesgan arritmia o angina; 10-20 µg es subterapéutica.</tspan></text><text x="58.0" y="890.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Jonklaas et al., ATA, Thyroid (2014); Garber et al., AACE/ATA, Endocr Pract (2012); Harrison Principios de Medicina Interna 21.ª ed. (2022)</tspan></text></svg>