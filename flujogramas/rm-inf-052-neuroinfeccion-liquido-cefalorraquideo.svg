<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1209" viewBox="0 0 1000 1209" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="LCR con 90 % de mononucleares, proteínas levemente altas y glucosa normal: meningoencefalitis viral"><title>LCR con 90 % de mononucleares, proteínas levemente altas y glucosa normal: meningoencefalitis viral</title><rect x="0.75" y="0.75" width="998.5" height="1207.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neuroinfección · líquido cefalorraquídeo</tspan></text><rect x="438.5" y="32.0" width="121.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="499.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="106"><tspan x="499.5" dy="0">INFECTOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Meningoencefalitis</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Síndrome meníngeo (cefalea, fiebre, rigidez de nuca, Kernig y Brudzinski) con compromiso</tspan><tspan x="58.0" dy="17">del sensorio.</tspan><tspan x="58.0" dy="17">El LCR define la etiología.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 18 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pródromo respiratorio de 3 días; luego somnolencia,</tspan><tspan x="640.0" dy="16">cefalea y vómitos.</tspan><tspan x="640.0" dy="16">T 39 °C, estupor, rigidez de nuca; LCR 300 células, 90</tspan><tspan x="640.0" dy="16">% mononucleares.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LEER EL LCR DE LA PACIENTE</tspan></text><rect x="40.0" y="301.0" width="920.0" height="32.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="322.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="180"><tspan x="54.0" dy="0">EXAMEN</tspan></text><text x="250.0" y="322.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="130"><tspan x="250.0" dy="0">VALOR DEL CASO</tspan></text><text x="400.0" y="322.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="130"><tspan x="400.0" dy="0">NORMAL</tspan></text><text x="550.0" y="322.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="400"><tspan x="550.0" dy="0">QUÉ SIGNIFICA</tspan></text><rect x="40.0" y="339.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="363.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Leucocitos</tspan></text><text x="250.0" y="364.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">300 /µL  ↑</tspan></text><text x="400.0" y="363.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">0-5 /µL</tspan></text><text x="550.0" y="363.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Pleocitosis moderada.</tspan></text><rect x="40.0" y="383.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="407.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Tipo de célula</tspan></text><text x="250.0" y="408.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">90 % mononuc.  ↑</tspan></text><text x="400.0" y="407.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Escasas</tspan></text><text x="550.0" y="407.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Predominio mononuclear: orienta a causa viral.</tspan></text><rect x="40.0" y="427.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="451.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Proteínas</tspan></text><text x="250.0" y="452.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">55 mg/dL  ↑</tspan></text><text x="400.0" y="451.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">15-45 mg/dL</tspan></text><text x="550.0" y="451.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Leve elevación: las bacterianas superan 100 mg/dL.</tspan></text><rect x="40.0" y="471.0" width="920.0" height="40.0" rx="8" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="495.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Glucosa</tspan></text><text x="250.0" y="496.0" font-size="13" font-weight="800" font-style="normal" fill="#15803d" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">60 mg/dL</tspan></text><text x="400.0" y="495.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">≥ 60 % de la glucemia</tspan></text><text x="550.0" y="495.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Normal: descarta bacteriana y tuberculosa.</tspan></text><rect x="40.0" y="529.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="555.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Mononucleares + glucosa normal + proteínas levemente altas = viral</tspan></text><text x="60.0" y="574.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Con sospecha de herpes simple, iniciar aciclovir sin esperar la PCR.</tspan></text><text x="40.0" y="635.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PERFIL DEL LCR SEGÚN LA CAUSA (VALORES ORIENTATIVOS)</tspan></text><rect x="40.0" y="647.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="666.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="84"><tspan x="50.0" dy="0">Dato</tspan></text><text x="150.0" y="666.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="257"><tspan x="150.0" dy="0">Viral</tspan></text><text x="423.3" y="666.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="257"><tspan x="423.3" dy="0">Bacteriana</tspan></text><text x="696.7" y="666.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="257"><tspan x="696.7" dy="0">Tuberculosa</tspan></text><rect x="40.0" y="676.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="695.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="84"><tspan x="50.0" dy="0">Células</tspan></text><text x="150.0" y="695.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="257"><tspan x="150.0" dy="0">10-1000, mononucleares</tspan></text><text x="423.3" y="695.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="257"><tspan x="423.3" dy="0">Más de 1000, neutrófilos</tspan></text><text x="696.7" y="695.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="257"><tspan x="696.7" dy="0">100-500, linfocitos (neutrófilos al inicio)</tspan></text><rect x="40.0" y="705.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="724.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="84"><tspan x="50.0" dy="0">Proteínas</tspan></text><text x="150.0" y="724.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="257"><tspan x="150.0" dy="0">50-100 mg/dL (leve)</tspan></text><text x="423.3" y="724.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="257"><tspan x="423.3" dy="0">Más de 100 mg/dL</tspan></text><text x="696.7" y="724.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="257"><tspan x="696.7" dy="0">Altas (100-500 mg/dL)</tspan></text><rect x="40.0" y="734.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="753.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="84"><tspan x="50.0" dy="0">Glucosa</tspan></text><text x="150.0" y="753.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="257"><tspan x="150.0" dy="0">Normal</tspan></text><text x="423.3" y="753.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="257"><tspan x="423.3" dy="0">Menos de 40 % de la glucemia</tspan></text><text x="696.7" y="753.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="257"><tspan x="696.7" dy="0">Baja (relación menor de 0,5)</tspan></text><rect x="40.0" y="763.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="782.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="84"><tspan x="50.0" dy="0">Curso</tspan></text><text x="150.0" y="782.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="257"><tspan x="150.0" dy="0">Agudo, pródromo viral</tspan></text><text x="423.3" y="782.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="257"><tspan x="423.3" dy="0">Agudo, grave</tspan></text><text x="696.7" y="782.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="257"><tspan x="696.7" dy="0">Subagudo</tspan></text><text x="40.0" y="808.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Rangos clásicos de texto (Harrison 21.ª ed.); hay superposición entre causas. El caso cumple la columna viral.</tspan></text><text x="40.0" y="855.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="865.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="896.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="896.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Absceso epidural</tspan></text><text x="435.0" y="887.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Tromboflebitis</tspan><tspan x="435.0" dy="17">intracraneal</tspan></text><text x="585.0" y="887.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Meningoencefalitis</tspan><tspan x="585.0" dy="17">tuberculosa</tspan></text><rect x="663.0" y="868.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="887.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Meningoencefalitis</tspan><tspan x="735.0" dy="17">viral</tspan></text><text x="885.0" y="887.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Meningoencefalitis</tspan><tspan x="885.0" dy="17">bacteriana</tspan></text><rect x="40.0" y="919.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="919.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="956.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico probable?</tspan></text><text x="285.0" y="948.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: complicación focal</tspan><tspan x="285.0" dy="16">de infección contigua</tspan></text><text x="435.0" y="940.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: complicación focal</tspan><tspan x="435.0" dy="16">con LCR</tspan><tspan x="435.0" dy="16">parainfeccioso</tspan></text><text x="585.0" y="948.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: tendría glucosa</tspan><tspan x="585.0" dy="16">baja y curso subagudo</tspan></text><text x="735.0" y="940.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: mononucleares,</tspan><tspan x="735.0" dy="16">glucosa normal y</tspan><tspan x="735.0" dy="16">pródromo respiratorio</tspan></text><text x="885.0" y="948.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: tendría neutrófilos</tspan><tspan x="885.0" dy="16">e hipoglucorraquia</tspan></text><rect x="40.0" y="865.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1009.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1037.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1059.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Patrón viral: pleocitosis leve o moderada con predominio mononuclear, proteínas poco elevadas y glucosa normal (60 mg/dL).</tspan><tspan x="58.0" dy="18">• Bacteriana: miles de células con polimorfonucleares, proteínas muy altas e hipoglucorraquia (menos de 40 % de la glucemia). Tuberculosa: mononuclear,</tspan><tspan x="58.0" dy="18">   pero con glucosa baja y curso subagudo.</tspan><tspan x="58.0" dy="18">• El absceso epidural y la tromboflebitis intracraneal son complicaciones focales de una infección contigua.</tspan><tspan x="58.0" dy="18">• Bandera roja: alteración del sensorio, convulsiones o signos temporales = iniciar aciclovir sin esperar la PCR para herpes simple.</tspan></text><text x="58.0" y="1153.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Tunkel AR et al., IDSA, Encephalitis (Clin Infect Dis 2008;47:303-27); van de Beek D et al., ESCMID (Clin Microbiol Infect 2016;22 Suppl 3:S37); Harrison 21.ª ed.</tspan><tspan x="58.0" dy="15">(2022).</tspan></text></svg>