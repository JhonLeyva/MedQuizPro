<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="835" viewBox="0 0 1000 835" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Madre Rh negativo cuyo recién nacido también es Rh negativo: no se indica la inmunoglobulina anti-D (no hay riesgo de sensibilización)"><title>Madre Rh negativo cuyo recién nacido también es Rh negativo: no se indica la inmunoglobulina anti-D (no hay riesgo de sensibilización)</title><rect x="0.75" y="0.75" width="998.5" height="833.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Isoinmunización Rh</tspan></text><rect x="318.2" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="405.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="405.4" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Profilaxis anti-D</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La madre Rh(−) se sensibiliza solo si recibe glóbulos rojos Rh(+) del bebé.</tspan><tspan x="58.0" dy="17">Si el recién nacido es Rh(−) no hay antígeno D que la sensibilice: no se da anti-D.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 32 años, Rh negativo</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Recién nacido Rh negativo.</tspan><tspan x="640.0" dy="16">Coombs directo positivo en el RN (buscar otra causa:</tspan><tspan x="640.0" dy="16">ABO u otros anticuerpos).</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿DAR ANTI-D DESPUÉS DEL PARTO?</tspan></text><rect x="40.0" y="285.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="307.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="180"><tspan x="54.0" dy="0">RECIÉN NACIDO</tspan></text><text x="420.0" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="340"><tspan x="420.0" dy="0">Madre no sensibilizada (Coombs indirecto −)</tspan></text><text x="780.0" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="340"><tspan x="780.0" dy="0">Madre ya sensibilizada (Coombs indirecto +)</tspan></text><rect x="40.0" y="325.0" width="194.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="351.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Rh positivo</tspan></text><text x="54.0" y="368.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Tiene el antígeno D</tspan></text><rect x="243.0" y="325.0" width="354.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="255.0" y="350.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">Anti-D en &lt; 72 h</tspan></text><text x="255.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">300 µg IM</tspan></text><rect x="603.0" y="325.0" width="354.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="615.0" y="350.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">No sirve</tspan></text><text x="615.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">Ya tiene anticuerpos</tspan></text><rect x="40.0" y="388.0" width="194.0" height="57.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="414.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Rh negativo</tspan></text><text x="54.0" y="431.0" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">No tiene antígeno D</tspan></text><rect x="243.0" y="388.0" width="354.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="255.0" y="413.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">No indicar</tspan></text><text x="255.0" y="429.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">No hay riesgo</tspan></text><rect x="496.2" y="377.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="541.6" y="392.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="541.6" dy="0">◆ ESTE CASO</tspan></text><rect x="603.0" y="388.0" width="354.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="615.0" y="420.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">No indicar</tspan></text><text x="44.0" y="467.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">La pregunta clave es el Rh del recién nacido: aquí es negativo.</tspan></text><text x="40.0" y="515.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="525.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="564.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="556.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Indicar dentro de</tspan><tspan x="285.0" dy="17">las 24 horas</tspan></text><rect x="363.0" y="528.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="564.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">No indicar profilaxis</tspan></text><text x="585.0" y="556.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Indicar dentro de</tspan><tspan x="585.0" dy="17">las 48 horas</tspan></text><text x="735.0" y="556.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Indicar dentro de</tspan><tspan x="735.0" dy="17">las 72 horas</tspan></text><text x="885.0" y="547.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Indicar a las 28</tspan><tspan x="885.0" dy="17">semanas del</tspan><tspan x="885.0" dy="17">siguiente embarazo</tspan></text><rect x="40.0" y="596.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="596.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="633.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Profilaxis anti-D?</tspan></text><text x="285.0" y="633.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: el RN no es Rh(+)</tspan></text><text x="435.0" y="625.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: no hay riesgo de</tspan><tspan x="435.0" dy="16">sensibilización</tspan></text><text x="585.0" y="633.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: el RN no es Rh(+)</tspan></text><text x="735.0" y="633.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: el RN no es Rh(+)</tspan></text><text x="885.0" y="617.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Se decidirá en el</tspan><tspan x="885.0" dy="16">próximo embarazo, no</tspan><tspan x="885.0" dy="16">ahora</tspan></text><rect x="40.0" y="525.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="686.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="714.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="736.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Anti-D 300 µg IM en las primeras 72 h posparto SOLO si el RN es Rh(+) y la madre no está sensibilizada (Coombs indirecto negativo).</tspan><tspan x="58.0" dy="18">• Además: a las 28 semanas y tras aborto, ectópico, amniocentesis, sangrado o trauma.</tspan><tspan x="58.0" dy="18">• Un Coombs directo positivo con RN Rh(−) orienta a incompatibilidad ABO u otros anticuerpos.</tspan></text><text x="58.0" y="794.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, prevención de la aloinmunización Rh (2017; act. 2024); MINSA Perú.</tspan></text></svg>