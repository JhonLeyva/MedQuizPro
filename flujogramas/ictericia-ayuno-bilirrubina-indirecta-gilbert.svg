PERBILIRRUBINEMIAS HEREDITARIAS</tspan></text><text x="376.1" y="635.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="566"><tspan x="376.1" dy="0">Según el tipo de bilirrubina y la gravedad.</tspan></text><rect x="56.0" y="675.5" width="213.0" height="121.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="57.2" y="676.7" width="210.6" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="162.5" y="703.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="197"><tspan x="162.5" dy="0">INDIRECTA LEVE</tspan></text><text x="162.5" y="723.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="189"><tspan x="162.5" dy="0">Gilbert</tspan></text><circle cx="72.0" cy="748.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="82.0" y="752.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="175"><tspan x="82.0" dy="0">Sube con ayuno</tspan></text><circle cx="72.0" cy="771.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="82.0" y="775.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="175"><tspan x="82.0" dy="0">Benigno</tspan></text><rect x="117.1" y="664.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="162.5" y="679.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="162.5" dy="0">◆ ESTE CASO</tspan></text><rect x="281.0" y="675.5" width="213.0" height="121.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="281.6" y="676.1" width="211.8" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="387.5" y="703.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="197"><tspan x="387.5" dy="0">INDIRECTA GRAVE</tspan></text><text x="387.5" y="723.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="189"><tspan x="387.5" dy="0">Crigler-Najjar</tspan></text><circle cx="297.0" cy="748.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="307.0" y="752.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="307.0" dy="0">Neonatal, kernícterus</tspan></text><rect x="506.0" y="675.5" width="213.0" height="121.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="506.6" y="676.1" width="211.8" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="612.5" y="703.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="197"><tspan x="612.5" dy="0">DIRECTA</tspan></text><text x="612.5" y="723.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="189"><tspan x="612.5" dy="0">Dubin-Johnson</tspan></text><circle cx="522.0" cy="748.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="532.0" y="752.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="532.0" dy="0">Hígado negro</tspan></text><rect x="731.0" y="675.5" width="213.0" height="121.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="731.6" y="676.1" width="211.8" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="837.5" y="703.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="197"><tspan x="837.5" dy="0">DIRECTA</tspan></text><text x="837.5" y="723.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="189"><tspan x="837.5" dy="0">Rotor</tspan></text><circle cx="747.0" cy="748.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="757.0" y="752.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="757.0" dy="0">Hígado normal</tspan></text><text x="56.0" y="826.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="835.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="850.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="850.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Bilirrubina directa 0,3: es indirecta</tspan></text><rect x="56.0" y="857.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="872.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="872.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Aparece con el ayuno</tspan></text><rect x="56.0" y="894.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="917.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Tranquilizar; no requiere tratamiento.</tspan></text><text x="40.0" y="987.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="997.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1028.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1028.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Anemia hemolítica</tspan></text><rect x="363.0" y="1000.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="1028.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Síndrome de Gilbert</tspan></text><text x="585.0" y="1028.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Hepatitis viral</tspan></text><text x="735.0" y="1028.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Cirrosis hepática</tspan></text><text x="885.0" y="1020.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Síndrome de</tspan><tspan x="885.0" dy="17">Dubin-Johnson</tspan></text><rect x="40.0" y="1051.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="1051.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1080.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="1072.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: DHL y</tspan><tspan x="285.0" dy="16">haptoglobina normales</tspan></text><text x="435.0" y="1072.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: indirecta alta con</tspan><tspan x="435.0" dy="16">ayuno</tspan></text><text x="585.0" y="1072.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: transaminasas</tspan><tspan x="585.0" dy="16">normales</tspan></text><text x="735.0" y="1080.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: hígado normal</tspan></text><text x="885.0" y="1072.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: daría bilirrubina</tspan><tspan x="885.0" dy="16">directa</tspan></text><rect x="40.0" y="997.5" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1125.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1153.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1175.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Diagnóstico por exclusión: sin hemólisis y con enzimas hepáticas normales.</tspan><tspan x="58.0" dy="18">• No requiere tratamiento; es benigno.</tspan><tspan x="58.0" dy="18">• Dubin-Johnson: bilirrubina DIRECTA alta, hígado negro.</tspan></text><text x="58.0" y="1233.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Harrison Principios de Medicina Interna 22.ª ed. (2025); AASLD.</tspan></text></svg>