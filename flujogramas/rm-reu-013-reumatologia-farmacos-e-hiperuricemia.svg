<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="931" viewBox="0 0 1000 931" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La hidroclorotiazida eleva el ácido úrico y puede precipitar un ataque de gota"><title>La hidroclorotiazida eleva el ácido úrico y puede precipitar un ataque de gota</title><rect x="0.75" y="0.75" width="998.5" height="929.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Reumatología · fármacos e hiperuricemia</tspan></text><rect x="443.4" y="32.0" width="227.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="557.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="211"><tspan x="557.1" dy="0">REUMATOLOGÍA Y DERMATOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Fármacos que elevan el urato</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tiazidas y diuréticos de asa compiten con el urato por los transportadores tubulares y</tspan><tspan x="58.0" dy="17">reducen su excreción.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 70 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Hipertenso, diabético e hipertiroideo.</tspan><tspan x="640.0" dy="16">Dolor y aumento de volumen en la primera articulación</tspan><tspan x="640.0" dy="16">metatarsofalángica derecha. ¿Qué fármaco lo explica?</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">FÁRMACOS DEL PACIENTE Y SU EFECTO SOBRE EL URATO</tspan></text><line x1="410.3" y1="363.0" x2="340.0" y2="341.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="341.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="410.3" y1="419.0" x2="340.0" y2="441.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="441.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="363.0" x2="660.0" y2="341.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="341.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="419.0" x2="660.0" y2="441.0" stroke="#0f766e" stroke-width="3"/><circle cx="660.0" cy="441.0" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="391.0" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="391.0" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="396.0" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">PODAGRA</tspan></text><text x="500.0" y="415.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">ataque agudo de gota</tspan></text><rect x="40.0" y="299.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="300.0" width="6.0" height="82.0" rx="3" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="190.0" y="332.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">INSULINA Y METFORMINA</tspan></text><text x="190.0" y="356.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">No elevan el urato</tspan></text><rect x="40.0" y="399.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="400.0" width="6.0" height="82.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="432.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">ENALAPRIL</tspan></text><text x="190.0" y="456.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Tos, angioedema, hiperpotasemia</tspan></text><rect x="660.0" y="299.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="300.0" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="810.0" y="332.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">LEVOTIROXINA</tspan></text><text x="810.0" y="356.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Sin efecto uricémico relevante</tspan></text><rect x="660.0" y="399.0" width="300.0" height="84.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="810.0" y="432.7" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">HIDROCLOROTIAZIDA</tspan></text><text x="810.0" y="456.4" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Eleva el urato: causa del ataque</tspan></text><rect x="764.6" y="473.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="810.0" y="488.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="810.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="533.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="545.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="578.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Tiazida contrae el volumen</tspan></text><line x1="248.5" y1="574.0" x2="267.5" y2="574.0" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,569.0 266.5,579.0 274.5,574.0" fill="#0f766e"/><rect x="278.5" y="545.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="569.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Compite por transportadores</tspan><tspan x="380.8" dy="17">tubulares</tspan></text><line x1="487.0" y1="574.0" x2="506.0" y2="574.0" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,569.0 505.0,579.0 513.0,574.0" fill="#0f766e"/><rect x="517.0" y="545.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="578.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Baja la excreción de urato</tspan></text><line x1="725.5" y1="574.0" x2="744.5" y2="574.0" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,569.0 743.5,579.0 751.5,574.0" fill="#0f766e"/><rect x="755.5" y="545.0" width="204.5" height="58.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="569.5" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Sube el urato y precipita el</tspan><tspan x="857.8" dy="17">ataque</tspan></text><text x="40.0" y="643.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="653.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="675.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Insulina</tspan></text><text x="435.0" y="675.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Metformina</tspan></text><text x="585.0" y="675.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Enalapril</tspan></text><rect x="663.0" y="656.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="675.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hidroclorotiazida</tspan></text><text x="885.0" y="675.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Levotiroxina</tspan></text><rect x="40.0" y="690.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="690.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="719.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Fármaco asociado?</tspan></text><text x="285.0" y="711.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: causa</tspan><tspan x="285.0" dy="16">hipoglucemia</tspan></text><text x="435.0" y="711.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: causa acidosis</tspan><tspan x="435.0" dy="16">láctica</tspan></text><text x="585.0" y="711.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: causa tos e</tspan><tspan x="585.0" dy="16">hiperpotasemia</tspan></text><text x="735.0" y="711.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: reduce la excreción</tspan><tspan x="735.0" dy="16">renal de urato</tspan></text><text x="885.0" y="711.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: sin efecto</tspan><tspan x="885.0" dy="16">uricémico relevante</tspan></text><rect x="40.0" y="653.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="764.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="792.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="814.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Podagra: ataque agudo de gota. La hidroclorotiazida reduce la excreción renal de urato por contracción de volumen y competencia tubular.</tspan><tspan x="58.0" dy="18">• Otros fármacos hiperuricemiantes: diuréticos de asa, aspirina en dosis bajas, pirazinamida, etambutol y ciclosporina.</tspan><tspan x="58.0" dy="18">• Insulina y metformina no elevan el urato; enalapril produce tos e hiperpotasemia; levotiroxina no tiene efecto relevante.</tspan><tspan x="58.0" dy="18">• Tratamiento: colchicina en dosis bajas o corticoide corto (evitar AINE por hipertensión y riesgo renal); cambiar la tiazida por losartán.</tspan></text><text x="58.0" y="890.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACR, Guía de manejo de la gota (Arthritis Care Res 2020); EULAR, manejo de la gota (Ann Rheum Dis 2017;76:29-42); Katzung 16.ª ed. (2024).</tspan></text></svg>