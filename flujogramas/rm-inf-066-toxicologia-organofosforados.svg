<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1137" viewBox="0 0 1000 1137" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la intoxicación por organofosforados el fármaco de elección es la atropina"><title>En la intoxicación por organofosforados el fármaco de elección es la atropina</title><rect x="0.75" y="0.75" width="998.5" height="1135.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Toxicología · organofosforados</tspan></text><rect x="385.7" y="32.0" width="121.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="446.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="106"><tspan x="446.6" dy="0">INFECTOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Organofosforados</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Malatión, paratión y clorpirifós fosforilan la acetilcolinesterasa de forma irreversible.</tspan><tspan x="58.0" dy="17">Se acumula acetilcolina y aparece un síndrome colinérgico.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es el medicamento de elección en la</tspan><tspan x="640.0" dy="16">intoxicación?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DE LA ENZIMA INHIBIDA AL ANTÍDOTO</tspan></text><rect x="40.0" y="269.0" width="920.0" height="100.0" rx="0" fill="#fef3c7" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="269.0" width="112.0" height="100.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="319.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Sinapsis</tspan><tspan x="96.0" dy="14">colinérgica</tspan></text><rect x="40.0" y="369.0" width="920.0" height="99.0" rx="0" fill="#e0f2fe" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="369.0" width="112.0" height="99.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="418.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Exceso de</tspan><tspan x="96.0" dy="14">acetilcolina</tspan></text><rect x="40.0" y="468.0" width="920.0" height="99.0" rx="0" fill="#ede9fe" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="468.0" width="112.0" height="99.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="517.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Receptor</tspan><tspan x="96.0" dy="14">muscarínico</tspan></text><rect x="40.0" y="567.0" width="920.0" height="100.0" rx="0" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="567.0" width="112.0" height="100.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="621.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Antídoto</tspan></text><line x1="322.0" y1="354.0" x2="322.0" y2="373.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="317.0,373.0 327.0,373.0 322.0,382.0" fill="#0f766e"/><line x1="322.0" y1="453.0" x2="322.0" y2="472.0" stroke="#ea580c" stroke-width="2.2"/><polygon points="317.0,472.0 327.0,472.0 322.0,481.0" fill="#ea580c"/><line x1="322.0" y1="552.0" x2="322.0" y2="571.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="317.0,571.0 327.0,571.0 322.0,580.0" fill="#0f766e"/><rect x="172.0" y="284.0" width="300.0" height="70.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="300.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">El organofosforado fosforila la</tspan><tspan x="182.0" dy="16">acetilcolinesterasa</tspan></text><text x="182.0" y="333.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Inhibición irreversible; la enzima envejece en horas</tspan></text><circle cx="172.0" cy="284.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="288.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">1</tspan></text><rect x="172.0" y="384.0" width="300.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="400.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Se acumula acetilcolina</tspan></text><text x="182.0" y="417.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Síndrome colinérgico: broncorrea, miosis, bradicardia y</tspan><tspan x="182.0" dy="14.5">fasciculaciones</tspan></text><circle cx="172.0" cy="384.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="388.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">2</tspan></text><rect x="172.0" y="483.0" width="300.0" height="69.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="182.0" y="499.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">La atropina bloquea el receptor muscarínico</tspan></text><text x="182.0" y="516.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Antagonista competitivo; se titula hasta secar</tspan><tspan x="182.0" dy="14.5">secreciones</tspan></text><circle cx="172.0" cy="483.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="487.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">3</tspan></text><rect x="172.0" y="582.0" width="300.0" height="70.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="598.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Pralidoxima y benzodiacepinas completan el</tspan><tspan x="182.0" dy="16">manejo</tspan></text><text x="182.0" y="631.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">La oxima reactiva la enzima antes del envejecimiento</tspan></text><circle cx="172.0" cy="582.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="586.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">4</tspan></text><rect x="40.0" y="685.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="711.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Atropina = antídoto de los efectos muscarínicos</tspan></text><text x="60.0" y="730.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Pilocarpina, adrenalina y acetilcolina no antagonizan; el miperideno es del parkinsonismo.</tspan></text><text x="40.0" y="797.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="807.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="829.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="810.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="829.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Atropina</tspan></text><text x="435.0" y="829.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Pilocarpina</tspan></text><text x="585.0" y="829.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Adrenalina</tspan></text><text x="735.0" y="829.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Acetilcolina</tspan></text><text x="885.0" y="829.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Miperideno</tspan></text><rect x="40.0" y="844.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="844.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="881.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Fármaco de elección?</tspan></text><text x="285.0" y="865.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: antagonista</tspan><tspan x="285.0" dy="16">muscarínico</tspan><tspan x="285.0" dy="16">competitivo</tspan></text><text x="435.0" y="873.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: agravaría el</tspan><tspan x="435.0" dy="16">exceso colinérgico</tspan></text><text x="585.0" y="873.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no antagoniza el</tspan><tspan x="585.0" dy="16">exceso colinérgico</tspan></text><text x="735.0" y="865.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es el</tspan><tspan x="735.0" dy="16">neurotransmisor</tspan><tspan x="735.0" dy="16">acumulado</tspan></text><text x="885.0" y="873.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: anticolinérgico del</tspan><tspan x="885.0" dy="16">parkinsonismo</tspan></text><rect x="40.0" y="807.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="934.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="962.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="984.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Cuadro: miosis, salivación, lagrimeo, broncorrea, broncoespasmo, bradicardia, vómitos, diarrea y diaforesis; fasciculaciones, debilidad, convulsiones y</tspan><tspan x="58.0" dy="18">   coma.</tspan><tspan x="58.0" dy="18">• La muerte es por insuficiencia respiratoria. Primero: vía aérea, retirar la ropa y lavar la piel.</tspan><tspan x="58.0" dy="18">• Atropina 1 a 5 mg IV (0,02-0,05 mg/kg en niños), duplicada cada 5 a 10 minutos hasta secar las secreciones bronquiales; no se guía por la midriasis ni</tspan><tspan x="58.0" dy="18">   por la frecuencia cardíaca.</tspan><tspan x="58.0" dy="18">• Añadir pralidoxima antes del envejecimiento de la enzima y benzodiacepinas para las convulsiones. La atropina no revierte la parálisis nicotínica.</tspan></text><text x="58.0" y="1096.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Eddleston M et al., Lancet 2008;371:597-607; Goodman y Gilman, 14.ª ed. (2023); Harrison, 21.ª ed. (2022).</tspan></text></svg>