<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1038" viewBox="0 0 1000 1038" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Mujer con litiasis e infecciones urinarias repetidas, fiebre y dolor lumbar de un mes, anemia y macrófagos espumosos en la orina: pielonefritis xantogranulomatosa"><title>Mujer con litiasis e infecciones urinarias repetidas, fiebre y dolor lumbar de un mes, anemia y macrófagos espumosos en la orina: pielonefritis xantogranulomatosa</title><rect x="0.75" y="0.75" width="998.5" height="1036.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Infecciones renales crónicas</tspan></text><rect x="370.2" y="32.0" width="127.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="433.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="111"><tspan x="433.9" dy="0">NEFROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Pielonefritis xantogranulomatosa</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección crónica destructiva del riñón, casi siempre con cálculo coraliforme obstructivo</tspan><tspan x="58.0" dy="17">(Proteus, E. coli).</tspan><tspan x="58.0" dy="17">El riñón se llena de macrófagos espumosos (con lípidos); puede parecer un tumor.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 62 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Un mes de fiebre y dolor lumbar derecho; litiasis e ITU</tspan><tspan x="640.0" dy="16">repetidas.</tspan><tspan x="640.0" dy="16">Hb 9; leucocituria; macrófagos espumosos en la orina.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">RIÑÓN CON INFECCIÓN CRÓNICA: ¿CUÁL?</tspan></text><rect x="40.0" y="285.0" width="450.0" height="181.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><rect x="40.0" y="285.0" width="450.0" height="8.0" rx="4" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="60.0" y="319.0" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="410"><tspan x="60.0" dy="0">Xantogranulomatosa</tspan></text><rect x="56.0" y="340.0" width="418.0" height="26.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="68.0" y="357.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Cálculo</tspan></text><text x="462.0" y="357.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">✓ Coraliforme</tspan></text><rect x="56.0" y="370.0" width="418.0" height="26.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="68.0" y="387.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Orina</tspan></text><text x="462.0" y="387.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">✓ Macrófagos espumosos</tspan></text><rect x="56.0" y="400.0" width="418.0" height="26.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="68.0" y="417.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Trato</tspan></text><text x="462.0" y="417.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">✓ Nefrectomía</tspan></text><text x="60.0" y="446.0" font-size="11.5" font-weight="600" font-style="normal" fill="#0f766e" text-anchor="start" data-max="410"><tspan x="60.0" dy="0">Este caso.</tspan></text><rect x="372.6" y="278.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="418.0" y="293.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="418.0" dy="0">◆ ESTE CASO</tspan></text><rect x="510.0" y="285.0" width="450.0" height="181.0" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="510.0" y="285.0" width="450.0" height="8.0" rx="4" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="530.0" y="319.0" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="410"><tspan x="530.0" dy="0">TB renal</tspan></text><rect x="526.0" y="340.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="357.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Orina</tspan></text><text x="932.0" y="357.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">Piuria estéril</tspan></text><rect x="526.0" y="370.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="387.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Prueba</tspan></text><text x="932.0" y="387.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">BAAR, cultivo</tspan></text><rect x="526.0" y="400.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="417.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Rx</tspan></text><text x="932.0" y="417.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">Calcificaciones</tspan></text><text x="530.0" y="446.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="530.0" dy="0">Micobacteria.</tspan></text><rect x="40.0" y="486.0" width="450.0" height="181.0" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="486.0" width="450.0" height="8.0" rx="4" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="60.0" y="520.0" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="410"><tspan x="60.0" dy="0">Absceso renal</tspan></text><rect x="56.0" y="541.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="68.0" y="558.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Curso</tspan></text><text x="462.0" y="558.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">Agudo</tspan></text><rect x="56.0" y="571.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="68.0" y="588.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">TC</tspan></text><text x="462.0" y="588.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">Colección</tspan></text><rect x="56.0" y="601.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="68.0" y="618.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Trato</tspan></text><text x="462.0" y="618.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">Drenaje</tspan></text><text x="60.0" y="647.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="60.0" dy="0">Colección.</tspan></text><rect x="510.0" y="486.0" width="450.0" height="181.0" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="510.0" y="486.0" width="450.0" height="8.0" rx="4" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="530.0" y="520.0" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="410"><tspan x="530.0" dy="0">Cáncer renal</tspan></text><rect x="526.0" y="541.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="558.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Clínica</tspan></text><text x="932.0" y="558.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">Hematuria, masa</tspan></text><rect x="526.0" y="571.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="588.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">TC</tspan></text><text x="932.0" y="588.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">Masa que realza</tspan></text><rect x="526.0" y="601.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="618.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Fiebre</tspan></text><text x="932.0" y="618.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">A veces</tspan></text><text x="530.0" y="647.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="530.0" dy="0">Tumor.</tspan></text><text x="40.0" y="689.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="400"><tspan x="40.0" dy="0">✓ = dato que coincide con el caso</tspan></text><text x="40.0" y="735.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="745.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="776.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="776.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Tuberculosis renal</tspan></text><text x="435.0" y="776.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Absceso renal</tspan></text><text x="585.0" y="767.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Adenocarcinoma</tspan><tspan x="585.0" dy="17">renal</tspan></text><rect x="663.0" y="748.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="767.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Pielonefritis</tspan><tspan x="735.0" dy="17">xantogranulomatosa</tspan></text><text x="885.0" y="776.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Riñón poliquístico</tspan></text><rect x="40.0" y="799.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="799.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="836.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="836.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Piuria estéril, BAAR</tspan></text><text x="435.0" y="828.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Colección en la TC,</tspan><tspan x="435.0" dy="16">curso agudo</tspan></text><text x="585.0" y="828.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Hematuria, masa</tspan><tspan x="585.0" dy="16">sólida</tspan></text><text x="735.0" y="820.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: cálculo +</tspan><tspan x="735.0" dy="16">macrófagos</tspan><tspan x="735.0" dy="16">espumosos</tspan></text><text x="885.0" y="836.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: hereditario, quistes</tspan></text><rect x="40.0" y="745.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="889.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="917.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="939.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• TC: riñón grande, cálculo coraliforme y cavidades («pata de oso»).</tspan><tspan x="58.0" dy="18">• Antibiótico y luego nefrectomía (el riñón suele no funcionar).</tspan><tspan x="58.0" dy="18">• Más frecuente en mujeres de mediana edad y diabéticas.</tspan></text><text x="58.0" y="997.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: EAU, infecciones urológicas (2024).</tspan></text></svg>