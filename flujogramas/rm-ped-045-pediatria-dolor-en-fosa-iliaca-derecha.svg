<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1107" viewBox="0 0 1000 1107" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Escolar con resfrío, faringe congestiva, fiebre alta y linfocitosis sin desviación izquierda: adenitis mesentérica"><title>Escolar con resfrío, faringe congestiva, fiebre alta y linfocitosis sin desviación izquierda: adenitis mesentérica</title><rect x="0.75" y="0.75" width="998.5" height="1105.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · dolor en fosa ilíaca derecha</tspan></text><rect x="427.0" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="476.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="476.0" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Adenitis mesentérica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Inflamación de los ganglios del mesenterio, sobre todo del íleon terminal.</tspan><tspan x="58.0" dy="17">Sigue a una infección respiratoria o digestiva; se diagnostica por exclusión.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Escolar con dolor abdominal</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Resfriado previo y dolor en fosa ilíaca derecha de 48</tspan><tspan x="640.0" dy="16">horas.</tspan><tspan x="640.0" dy="16">Fiebre de 39,8 °C, McBurney y rebote positivos;</tspan><tspan x="640.0" dy="16">linfocitosis sin desviación izquierda.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ADENITIS MESENTÉRICA FRENTE A APENDICITIS AGUDA</tspan></text><rect x="493.0" y="351.0" width="14" height="190" rx="5" fill="#64748b"/><path d="M440.0 556.0 H560.0 L540.0 536.0 H460.0 Z" fill="#475569"/><circle cx="500.0" cy="351.0" r="15" fill="#f59e0b" stroke="#92400e" stroke-width="2"/><line x1="385.4" y1="369.1" x2="614.6" y2="332.9" stroke="#334155" stroke-width="7" stroke-linecap="round"/><line x1="385.4" y1="369.1" x2="357.4" y2="431.1" stroke="#64748b" stroke-width="2"/><line x1="385.4" y1="369.1" x2="413.4" y2="431.1" stroke="#64748b" stroke-width="2"/><path d="M347.4 431.1 H423.4 Q385.4 475.1 347.4 431.1 Z" fill="#ea580c"/><text x="385.4" y="446.1" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="385.4" dy="0">PROBABLE</tspan></text><line x1="614.6" y1="332.9" x2="586.6" y2="394.9" stroke="#64748b" stroke-width="2"/><line x1="614.6" y1="332.9" x2="642.6" y2="394.9" stroke="#64748b" stroke-width="2"/><path d="M576.6 394.9 H652.6 Q614.6 438.9 576.6 394.9 Z" fill="#64748b"/><text x="614.6" y="409.9" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="614.6" dy="0">DESCARTAR</tspan></text><text x="500.0" y="583.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="300"><tspan x="500.0" dy="0">¿Cuál explica mejor el cuadro?</tspan></text><rect x="40.0" y="321.0" width="290.0" height="190.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><text x="58.0" y="349.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="254"><tspan x="58.0" dy="0">Adenitis mesentérica (este caso)</tspan></text><circle cx="62.0" cy="374.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="378.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Resfrío previo y faringe congestiva</tspan></text><circle cx="62.0" cy="400.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="404.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Fiebre alta desde el inicio; dolor que no</tspan><tspan x="74.0" dy="16">migra</tspan></text><circle cx="62.0" cy="442.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="446.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Linfocitosis sin desviación izquierda</tspan></text><circle cx="62.0" cy="468.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="472.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Ecografía: 3 o más ganglios mayores de 5</tspan><tspan x="74.0" dy="16">mm y apéndice normal</tspan></text><rect x="214.6" y="310.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="260.0" y="325.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="260.0" dy="0">◆ ESTE CASO</tspan></text><rect x="670.0" y="321.0" width="290.0" height="190.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="688.0" y="349.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="688.0" dy="0">Apendicitis aguda</tspan></text><circle cx="692.0" cy="374.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="378.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Dolor periumbilical que migra a la fosa ilíaca</tspan><tspan x="704.0" dy="16">derecha</tspan></text><circle cx="692.0" cy="416.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="420.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Anorexia y vómitos posteriores al dolor</tspan></text><circle cx="692.0" cy="442.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="446.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Fiebre moderada, neutrofilia y PCR elevada</tspan></text><circle cx="692.0" cy="468.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="472.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Defensa localizada; apéndice no</tspan><tspan x="704.0" dy="16">compresible</tspan></text><rect x="40.0" y="617.0" width="920.0" height="93.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="645.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Resfrío + faringe congestiva + linfocitosis = adenitis mesentérica</tspan></text><text x="500.0" y="666.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Se confirma con ecografía y observación seriada.</tspan><tspan x="500.0" dy="17">El rebote franco obliga a repetir examen y ecografía.</tspan></text><text x="40.0" y="750.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="760.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="791.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="791.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Infección urinaria</tspan></text><text x="435.0" y="782.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Divertículo de</tspan><tspan x="435.0" dy="17">Meckel</tspan></text><rect x="513.0" y="763.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="782.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Adenitis</tspan><tspan x="585.0" dy="17">mesentérica</tspan></text><text x="735.0" y="791.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Litiasis renal</tspan></text><text x="885.0" y="791.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Apendicitis aguda</tspan></text><rect x="40.0" y="814.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="814.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="843.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico más</tspan><tspan x="54.0" dy="16">probable?</tspan></text><text x="285.0" y="843.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: sin disuria ni</tspan><tspan x="285.0" dy="16">leucocituria</tspan></text><text x="435.0" y="851.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: sangrado indoloro</tspan></text><text x="585.0" y="835.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: resfrío previo,</tspan><tspan x="585.0" dy="16">faringe congestiva,</tspan><tspan x="585.0" dy="16">linfocitosis</tspan></text><text x="735.0" y="835.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: cólico irradiado a</tspan><tspan x="735.0" dy="16">genitales con</tspan><tspan x="735.0" dy="16">hematuria</tspan></text><text x="885.0" y="843.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: migra, con</tspan><tspan x="885.0" dy="16">neutrofilia y PCR alta</tspan></text><rect x="40.0" y="760.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="904.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="932.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="954.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• A favor: antecedente de resfrío, faringe congestiva, fiebre alta desde el inicio, dolor que no migra y linfocitosis sin desviación izquierda.</tspan><tspan x="58.0" dy="18">• Ecografía: tres o más ganglios mayores de 5 mm de eje corto y apéndice normal, compresible y menor de 6 mm. Evolución benigna: analgesia y</tspan><tspan x="58.0" dy="18">   observación.</tspan><tspan x="58.0" dy="18">• Apendicitis: dolor periumbilical que migra, anorexia, vómitos posteriores, fiebre moderada, neutrofilia, PCR elevada y defensa; ayudan Alvarado y la</tspan><tspan x="58.0" dy="18">   escala pediátrica (PAS).</tspan><tspan x="58.0" dy="18">• Alerta: el rebote franco es atípico de adenitis; repetir examen y ecografía antes de descartar apendicitis.</tspan></text><text x="58.0" y="1066.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: WSES, guías de Jerusalén de apendicitis aguda, actualización 2020 (World J Emerg Surg 2020;15:27); Nelson Tratado de Pediatría, 22.ª ed. (2024)</tspan></text></svg>