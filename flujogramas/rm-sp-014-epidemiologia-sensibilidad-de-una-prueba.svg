<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1033" viewBox="0 0 1000 1033" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La sensibilidad es la probabilidad de que una persona con la enfermedad dé resultado positivo"><title>La sensibilidad es la probabilidad de que una persona con la enfermedad dé resultado positivo</title><rect x="0.75" y="0.75" width="998.5" height="1031.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Epidemiología · sensibilidad de una prueba</tspan></text><rect x="455.6" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="519.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="519.9" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Sensibilidad</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Verdaderos positivos entre todos los enfermos: VP / (VP + FN).</tspan><tspan x="58.0" dy="17">No depende de la prevalencia.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de definición</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">La sensibilidad de una prueba diagnóstica es la</tspan><tspan x="640.0" dy="16">probabilidad de que una persona...</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EJEMPLO ILUSTRATIVO: 1000 PERSONAS, 200 ENFERMAS</tspan></text><text x="280.0" y="283.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="300"><tspan x="280.0" dy="0">ENFERMEDAD DE EJEMPLO</tspan></text><text x="205.0" y="309.0" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="150"><tspan x="205.0" dy="0">Enfermos</tspan></text><text x="355.0" y="309.0" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="150"><tspan x="355.0" dy="0">Sanos</tspan></text><text x="80.0" y="385.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="80"><tspan x="80.0" dy="0">Prueba</tspan></text><text x="80.0" y="432.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="80"><tspan x="80.0" dy="0">Prueba</tspan><tspan x="80.0" dy="13">negativa</tspan></text><text x="80.0" y="340.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="80"><tspan x="80.0" dy="0">Prueba</tspan><tspan x="80.0" dy="13">positiva</tspan></text><rect x="130.0" y="321.0" width="150.0" height="70.0" rx="0" fill="#dcfce7" stroke="#ffffff" stroke-width="3"/><text x="205.0" y="351.0" font-size="24" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="130"><tspan x="205.0" dy="0">180</tspan></text><text x="205.0" y="373.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="130"><tspan x="205.0" dy="0">verdadero +</tspan></text><rect x="280.0" y="321.0" width="150.0" height="70.0" rx="0" fill="#fee2e2" stroke="#ffffff" stroke-width="3"/><text x="355.0" y="351.0" font-size="24" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="130"><tspan x="355.0" dy="0">80</tspan></text><text x="355.0" y="373.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="130"><tspan x="355.0" dy="0">falso +</tspan></text><rect x="130.0" y="391.0" width="150.0" height="70.0" rx="0" fill="#fee2e2" stroke="#ffffff" stroke-width="3"/><text x="205.0" y="421.0" font-size="24" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="130"><tspan x="205.0" dy="0">20</tspan></text><text x="205.0" y="443.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="130"><tspan x="205.0" dy="0">falso −</tspan></text><rect x="280.0" y="391.0" width="150.0" height="70.0" rx="0" fill="#dcfce7" stroke="#ffffff" stroke-width="3"/><text x="355.0" y="421.0" font-size="24" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="130"><tspan x="355.0" dy="0">720</tspan></text><text x="355.0" y="443.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="130"><tspan x="355.0" dy="0">verdadero −</tspan></text><rect x="40.0" y="479.0" width="91.5" height="102.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.4"/><text x="85.8" y="497.0" font-size="10.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="82"><tspan x="85.8" dy="0">Sensibilidad</tspan></text><text x="85.8" y="539.0" font-size="21" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="82"><tspan x="85.8" dy="0">90 %</tspan></text><text x="85.8" y="557.0" font-size="9.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="84"><tspan x="85.8" dy="0">VP / (VP + FN)</tspan></text><text x="85.8" y="571.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="84"><tspan x="85.8" dy="0">180/200</tspan></text><rect x="139.5" y="479.0" width="91.5" height="102.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="185.2" y="497.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="82"><tspan x="185.2" dy="0">Especificidad</tspan></text><text x="185.2" y="539.0" font-size="21" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="82"><tspan x="185.2" dy="0">90 %</tspan></text><text x="185.2" y="557.0" font-size="9.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="84"><tspan x="185.2" dy="0">VN / (VN + FP)</tspan></text><text x="185.2" y="571.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="84"><tspan x="185.2" dy="0">720/800</tspan></text><rect x="239.0" y="479.0" width="91.5" height="102.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="284.8" y="497.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="82"><tspan x="284.8" dy="0">Valor</tspan><tspan x="284.8" dy="14.9">predictivo +</tspan></text><text x="284.8" y="539.0" font-size="21" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="82"><tspan x="284.8" dy="0">69 %</tspan></text><text x="284.8" y="557.0" font-size="9.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="84"><tspan x="284.8" dy="0">VP / (VP + FP)</tspan></text><text x="284.8" y="571.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="84"><tspan x="284.8" dy="0">180/260</tspan></text><rect x="338.5" y="479.0" width="91.5" height="102.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="384.2" y="497.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="82"><tspan x="384.2" dy="0">Valor</tspan><tspan x="384.2" dy="14.9">predictivo −</tspan></text><text x="384.2" y="539.0" font-size="21" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="82"><tspan x="384.2" dy="0">97 %</tspan></text><text x="384.2" y="557.0" font-size="9.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="84"><tspan x="384.2" dy="0">VN / (VN + FN)</tspan></text><text x="384.2" y="571.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="84"><tspan x="384.2" dy="0">720/740</tspan></text><rect x="470.0" y="269.0" width="490.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="480.0" y="285.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="470"><tspan x="480.0" dy="0">Sensibilidad = 90 %</tspan></text><text x="480.0" y="302.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="470"><tspan x="480.0" dy="0">Detecta 180 de los 200 enfermos.</tspan></text><rect x="470.0" y="332.0" width="490.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="480.0" y="348.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="470"><tspan x="480.0" dy="0">Especificidad = 90 %</tspan></text><text x="480.0" y="365.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="470"><tspan x="480.0" dy="0">720 de 800 sanos dan negativo.</tspan></text><rect x="470.0" y="395.0" width="490.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="480.0" y="411.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="470"><tspan x="480.0" dy="0">Valores predictivos</tspan></text><text x="480.0" y="428.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="470"><tspan x="480.0" dy="0">Cambian con la prevalencia; la sensibilidad no.</tspan></text><rect x="40.0" y="599.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="625.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Sensibilidad = enfermos con prueba positiva</tspan></text><text x="60.0" y="644.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Sana con resultado negativo es la especificidad.</tspan></text><text x="40.0" y="711.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="721.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="760.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="752.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Enferma dé</tspan><tspan x="285.0" dy="17">negativo</tspan></text><text x="435.0" y="743.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Con negativo no</tspan><tspan x="435.0" dy="17">tenga la</tspan><tspan x="435.0" dy="17">enfermedad</tspan></text><text x="585.0" y="760.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Sana dé negativo</tspan></text><text x="735.0" y="752.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Con positivo tenga</tspan><tspan x="735.0" dy="17">la enfermedad</tspan></text><rect x="813.0" y="724.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="752.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Con la enfermedad</tspan><tspan x="885.0" dy="17">dé positivo</tspan></text><rect x="40.0" y="792.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="792.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="821.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Sensibilidad?</tspan></text><text x="285.0" y="813.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es la tasa de falsos</tspan><tspan x="285.0" dy="16">negativos</tspan></text><text x="435.0" y="813.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es el valor</tspan><tspan x="435.0" dy="16">predictivo negativo</tspan></text><text x="585.0" y="821.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es la especificidad</tspan></text><text x="735.0" y="813.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es el valor</tspan><tspan x="735.0" dy="16">predictivo positivo</tspan></text><text x="885.0" y="813.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: enferma con</tspan><tspan x="885.0" dy="16">resultado positivo</tspan></text><rect x="40.0" y="721.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="866.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="894.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="916.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Sensibilidad = VP / (VP + FN). Especificidad = VN / (VN + FP): sana con resultado negativo.</tspan><tspan x="58.0" dy="18">• Valor predictivo positivo: quien da positivo tiene la enfermedad. Valor predictivo negativo: quien da negativo no la tiene. Dependen de la prevalencia.</tspan><tspan x="58.0" dy="18">• Prueba muy sensible con resultado negativo descarta (SnNout); muy específica con resultado positivo confirma (SpPin).</tspan><tspan x="58.0" dy="18">• Con prevalencia baja el valor predictivo positivo cae, aunque la prueba sea buena: falsos positivos del tamizaje masivo.</tspan></text><text x="58.0" y="992.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Gordis, Epidemiología 6.ª ed. (2019); Szklo y Nieto, Epidemiology: Beyond the Basics 4.ª ed. (2019); Rothman, Modern Epidemiology 4.ª ed. (2021).</tspan></text></svg>