<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1021" viewBox="0 0 1000 1021" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Placenta previa total con tres cesáreas previas: el mayor riesgo es el acretismo placentario"><title>Placenta previa total con tres cesáreas previas: el mayor riesgo es el acretismo placentario</title><rect x="0.75" y="0.75" width="998.5" height="1019.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · espectro de placenta acreta</tspan></text><rect x="439.3" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="519.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="519.0" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Espectro del acretismo placentario</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Acreta, increta y percreta: invasión anormal del miometrio por las vellosidades.</tspan><tspan x="58.0" dy="17">Defecto de decidua basal sobre una cicatriz uterina.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante de 32 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Tres cesáreas previas.</tspan><tspan x="640.0" dy="16">Ecografía con placenta previa total. ¿Cuál es el mayor</tspan><tspan x="640.0" dy="16">riesgo?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">RIESGO DE ACRETISMO CON PLACENTA PREVIA SEGÚN LAS CESÁREAS PREVIAS</tspan></text><rect x="70.0" y="295.0" width="34.0" height="330.0" rx="17" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="75.0" y="546.5" width="24.0" height="74.5" rx="8" fill="#10b981" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="583.8" x2="130.0" y2="583.8" stroke="#10b981" stroke-width="2"/><rect x="130.0" y="547.5" width="330.0" height="72.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="569.5" font-size="12" font-weight="800" font-style="normal" fill="#10b981" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">1 cesárea</tspan></text><text x="240.0" y="569.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Cerca de 3 %</tspan></text><text x="144.0" y="590.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Riesgo bajo, pero se descarta con ecografía</tspan></text><rect x="75.0" y="464.0" width="24.0" height="74.5" rx="8" fill="#f59e0b" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="501.2" x2="130.0" y2="501.2" stroke="#f59e0b" stroke-width="2"/><rect x="130.0" y="465.0" width="330.0" height="72.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="487.0" font-size="12" font-weight="800" font-style="normal" fill="#f59e0b" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">2 cesáreas</tspan></text><text x="240.0" y="487.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Cerca de 11 %</tspan></text><text x="144.0" y="508.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Riesgo intermedio</tspan></text><rect x="75.0" y="381.5" width="24.0" height="74.5" rx="8" fill="#f97316" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="418.8" x2="130.0" y2="418.8" stroke="#0f766e" stroke-width="3"/><rect x="130.0" y="382.5" width="330.0" height="72.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="144.0" y="404.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">3 cesáreas</tspan></text><text x="240.0" y="404.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Cerca de 40 %</tspan></text><text x="144.0" y="425.5" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Riesgo muy alto: acretismo es el mayor peligro</tspan></text><rect x="354.6" y="371.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="400.0" y="386.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="400.0" dy="0">◆ ESTE CASO</tspan></text><rect x="75.0" y="299.0" width="24.0" height="74.5" rx="8" fill="#e11d48" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="336.2" x2="130.0" y2="336.2" stroke="#e11d48" stroke-width="2"/><rect x="130.0" y="300.0" width="330.0" height="72.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="322.0" font-size="12" font-weight="800" font-style="normal" fill="#e11d48" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">4 o más</tspan></text><text x="240.0" y="322.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Más de 60 %</tspan></text><text x="144.0" y="343.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Riesgo máximo</tspan></text><text x="470.0" y="299.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="490"><tspan x="470.0" dy="0">QUÉ SE HACE CON PLACENTA PREVIA Y CICATRICES</tspan></text><rect x="470.0" y="313.0" width="490.0" height="84.0" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="355.0" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="360.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">1</tspan></text><text x="528.0" y="348.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Ecografía Doppler</tspan></text><text x="528.0" y="371.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Busca signos de invasión del miometrio</tspan></text><line x1="498.0" y1="399.0" x2="498.0" y2="412.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,411.0 503.0,411.0 498.0,419.0" fill="#0f766e"/><rect x="470.0" y="421.0" width="490.0" height="84.0" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="463.0" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="468.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">2</tspan></text><text x="528.0" y="456.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Resonancia magnética en casos dudosos</tspan></text><text x="528.0" y="479.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Precisa la profundidad de la invasión</tspan></text><line x1="498.0" y1="507.0" x2="498.0" y2="520.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,519.0 503.0,519.0 498.0,527.0" fill="#0f766e"/><rect x="470.0" y="529.0" width="490.0" height="84.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><circle cx="498.0" cy="571.0" r="17" fill="#ffffff" stroke="none" stroke-width="0"/><text x="498.0" y="576.0" font-size="15" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">3</tspan></text><text x="528.0" y="564.0" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Planificar el parto en un centro con banco de sangre</tspan></text><text x="528.0" y="587.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Cesárea programada con equipo multidisciplinario</tspan></text><rect x="857.8" y="518.0" width="64.5" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="533.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ CLAVE</tspan></text><text x="40.0" y="665.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="675.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="714.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="697.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Desprendimiento</tspan><tspan x="285.0" dy="17">prematuro de</tspan><tspan x="285.0" dy="17">placenta</tspan></text><text x="435.0" y="714.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Vasa previa</tspan></text><text x="585.0" y="714.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Rotura uterina</tspan></text><text x="735.0" y="706.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Rotura prematura</tspan><tspan x="735.0" dy="17">de membranas</tspan></text><rect x="813.0" y="678.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="706.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Acretismo</tspan><tspan x="885.0" dy="17">placentario</tspan></text><rect x="40.0" y="746.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="746.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="783.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Mayor riesgo?</tspan></text><text x="285.0" y="775.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: se asocia a</tspan><tspan x="285.0" dy="16">hipertensión o trauma</tspan></text><text x="435.0" y="767.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: ocurre con</tspan><tspan x="435.0" dy="16">inserción velamentosa</tspan><tspan x="435.0" dy="16">del cordón</tspan></text><text x="585.0" y="775.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: se liga al trabajo</tspan><tspan x="585.0" dy="16">de parto con cicatriz</tspan></text><text x="735.0" y="767.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no es el riesgo</tspan><tspan x="735.0" dy="16">principal de la placenta</tspan><tspan x="735.0" dy="16">previa</tspan></text><text x="885.0" y="775.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: el riesgo crece con</tspan><tspan x="885.0" dy="16">cada cicatriz</tspan></text><rect x="40.0" y="675.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="836.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="864.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="886.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Con placenta previa el riesgo de acretismo es de 3 % con una cesárea, cerca de 11 % con dos, 40 % con tres y más de 60 % con cuatro o más (cifras</tspan><tspan x="58.0" dy="18">   aproximadas).</tspan><tspan x="58.0" dy="18">• Consecuencias: hemorragia masiva en el parto, histerectomía obstétrica, transfusión masiva, lesión de vejiga o uréteres y mortalidad materna.</tspan><tspan x="58.0" dy="18">• Sospecha por ecografía Doppler; la resonancia magnética aclara los casos dudosos.</tspan><tspan x="58.0" dy="18">• Alerta: el desprendimiento prematuro no se vincula con la placenta previa; la rotura uterina se liga al trabajo de parto con cicatriz.</tspan></text><text x="58.0" y="980.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG y SMFM, Obstetric Care Consensus N.º 7, Espectro de placenta acreta (Obstet Gynecol 2018); Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>