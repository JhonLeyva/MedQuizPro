<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1329" viewBox="0 0 1000 1329" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La laringomalacia es la anomalía laríngea congénita más común y la causa principal de estridor en el lactante"><title>La laringomalacia es la anomalía laríngea congénita más común y la causa principal de estridor en el lactante</title><rect x="0.75" y="0.75" width="998.5" height="1327.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Otorrinolaringología pediátrica · estridor congénito</tspan></text><rect x="501.4" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="550.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="550.5" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Laringomalacia</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Colapso dinámico de las estructuras supraglóticas durante la inspiración.</tspan><tspan x="58.0" dy="17">Epiglotis en omega, aritenoides redundantes y pliegues aritenoepiglóticos cortos.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es la anomalía congénita laríngea más común</tspan><tspan x="640.0" dy="16">que causa estridor?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CAUSAS DE ESTRIDOR CONGÉNITO, DE LA MÁS A LA MENOS FRECUENTE</tspan></text><polygon points="200.0,269.0 300.0,269.0 340.0,340.0 160.0,340.0" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="309.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="88"><tspan x="250.0" dy="0">1</tspan></text><rect x="486.0" y="269.0" width="474.0" height="71.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="501.0" y="293.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Laringomalacia</tspan></text><text x="501.0" y="310.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Estridor inspiratorio que empeora con llanto y alimentación; se resuelve a los</tspan><tspan x="501.0" dy="16">12-24 meses</tspan></text><rect x="858.2" y="258.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="903.6" y="273.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="903.6" dy="0">◆ ESTE CASO</tspan></text><polygon points="160.0,346.0 340.0,346.0 380.0,417.0 120.0,417.0" fill="#99f6e4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="386.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="168"><tspan x="250.0" dy="0">2</tspan></text><rect x="486.0" y="346.0" width="474.0" height="71.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="378.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Parálisis de las cuerdas vocales</tspan></text><text x="501.0" y="395.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Segunda causa; llanto débil o dificultad respiratoria según sea uni o bilateral</tspan></text><polygon points="120.0,423.0 380.0,423.0 420.0,494.0 80.0,494.0" fill="#5eead4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="463.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="248"><tspan x="250.0" dy="0">3</tspan></text><rect x="486.0" y="423.0" width="474.0" height="71.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="455.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Estenosis subglótica congénita</tspan></text><text x="501.0" y="472.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Estridor bifásico</tspan></text><polygon points="80.0,500.0 420.0,500.0 460.0,571.0 40.0,571.0" fill="#2dd4bf" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="540.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="328"><tspan x="250.0" dy="0">4</tspan></text><rect x="486.0" y="500.0" width="474.0" height="71.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="524.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Hemangioma subglótico y membranas laríngeas</tspan></text><text x="501.0" y="541.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Hemangioma: estridor bifásico progresivo a los 2-4 meses; membranas: llanto</tspan><tspan x="501.0" dy="16">débil y ronco</tspan></text><text x="250.0" y="589.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="420"><tspan x="250.0" dy="0">▲ más frecuente · ▼ menos frecuente</tspan></text><rect x="40.0" y="611.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="637.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Estridor congénito = laringomalacia</tspan></text><text x="60.0" y="656.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Las otras causas dan estridor bifásico o alteran la voz; requieren endoscopia.</tspan></text><text x="40.0" y="717.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CAUSAS DE ESTRIDOR CONGÉNITO: DATO QUE ORIENTA</tspan></text><rect x="40.0" y="729.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="748.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Causa</tspan></text><text x="250.0" y="748.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Cómo suena y cuándo</tspan></text><text x="610.0" y="748.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Conducta</tspan></text><rect x="40.0" y="758.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="777.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Laringomalacia</tspan></text><text x="250.0" y="777.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Inspiratorio; peor con llanto, comida y supino; mejora en prono</tspan></text><text x="610.0" y="777.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Laringoscopia flexible; observar; supraglotoplastia si es grave</tspan></text><rect x="140.6" y="761.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="186.0" y="776.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="186.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="787.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="806.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Parálisis de cuerdas vocales</tspan></text><text x="250.0" y="806.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Llanto débil o estridor con dificultad respiratoria</tspan></text><text x="610.0" y="806.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Laringoscopia y estudio de la causa</tspan></text><rect x="40.0" y="816.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="835.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Estenosis subglótica</tspan><tspan x="50.0" dy="15">congénita</tspan></text><text x="250.0" y="835.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Estridor bifásico</tspan></text><text x="610.0" y="835.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Endoscopia de la vía aérea</tspan></text><rect x="40.0" y="860.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="879.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Hemangioma subglótico</tspan></text><text x="250.0" y="879.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Bifásico progresivo a los 2-4 meses; a veces hemangiomas en</tspan><tspan x="250.0" dy="15">barba</tspan></text><text x="610.0" y="879.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Propranolol</tspan></text><rect x="40.0" y="904.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="923.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Membranas laríngeas</tspan></text><text x="250.0" y="923.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Llanto débil y ronco</tspan></text><text x="610.0" y="923.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Endoscopia y resección</tspan></text><text x="40.0" y="973.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="983.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1022.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="986.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="1022.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Laringomalacia</tspan></text><text x="435.0" y="1005.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Estenosis</tspan><tspan x="435.0" dy="17">subglótica</tspan><tspan x="435.0" dy="17">congénita</tspan></text><text x="585.0" y="1005.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Membranas</tspan><tspan x="585.0" dy="17">laríngeas</tspan><tspan x="585.0" dy="17">congénitas</tspan></text><text x="735.0" y="1014.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Parálisis de las</tspan><tspan x="735.0" dy="17">cuerdas vocales</tspan></text><text x="885.0" y="1005.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hemangioma</tspan><tspan x="885.0" dy="17">subglótico</tspan><tspan x="885.0" dy="17">congénito</tspan></text><rect x="40.0" y="1054.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1054.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1091.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Anomalía más común?</tspan></text><text x="285.0" y="1075.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: explica la mayoría</tspan><tspan x="285.0" dy="16">de los estridores</tspan><tspan x="285.0" dy="16">congénitos</tspan></text><text x="435.0" y="1083.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: estridor bifásico,</tspan><tspan x="435.0" dy="16">menos frecuente</tspan></text><text x="585.0" y="1083.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: llanto débil y</tspan><tspan x="585.0" dy="16">ronco, poco frecuente</tspan></text><text x="735.0" y="1083.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es la segunda</tspan><tspan x="735.0" dy="16">causa</tspan></text><text x="885.0" y="1075.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: aparece a los 2-4</tspan><tspan x="885.0" dy="16">meses; responde a</tspan><tspan x="885.0" dy="16">propranolol</tspan></text><rect x="40.0" y="983.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1144.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1172.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1194.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Estridor inspiratorio agudo desde las primeras semanas, peor con el llanto, la alimentación y el decúbito supino; mejora en prono. Pico a los 6-8 meses.</tspan><tspan x="58.0" dy="18">• Casi todos se resuelven solos entre los 12 y 24 meses; se asocia con reflujo gastroesofágico. Diagnóstico clínico, confirmado con laringoscopia flexible</tspan><tspan x="58.0" dy="18">   con el niño despierto.</tspan><tspan x="58.0" dy="18">• Forma grave (dificultad respiratoria, falla de medro, apneas, hipertensión pulmonar): supraglotoplastia. Leve: observación y orientación a los padres.</tspan><tspan x="58.0" dy="18">• Alerta: estridor bifásico, de inicio tardío, con cianosis o voz alterada obliga a hacer endoscopia para descartar otra lesión.</tspan></text><text x="58.0" y="1288.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: International Pediatric ORL Group (IPOG), consenso sobre laringomalacia (Int J Pediatr Otorhinolaryngol 2016;86:256-261); Nelson Tratado de Pediatría, 22.ª ed. (2024)</tspan></text></svg>