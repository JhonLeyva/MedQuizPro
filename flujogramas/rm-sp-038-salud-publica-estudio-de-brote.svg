<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="979" viewBox="0 0 1000 979" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Tres casos que pasan a 24 en un día con alimento común: se inicia el estudio de brote"><title>Tres casos que pasan a 24 en un día con alimento común: se inicia el estudio de brote</title><rect x="0.75" y="0.75" width="998.5" height="977.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Salud pública · estudio de brote</tspan></text><rect x="388.6" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="452.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="452.9" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Brote</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Aumento inusual de casos en un lugar y tiempo delimitados, con nexo epidemiológico.</tspan><tspan x="58.0" dy="17">Su estudio busca la fuente y el mecanismo de transmisión.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Estudiantes con diarrea sanguinolenta</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Fiebre, vómitos y diarrea con moco y sangre.</tspan><tspan x="640.0" dy="16">De 3 a 24 afectados en un día; alimentos de un mismo</tspan><tspan x="640.0" dy="16">lugar.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ORDEN DEL ESTUDIO DE UN BROTE</tspan></text><text x="44.0" y="299.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">El primer paso es abrir el estudio; las demás opciones son etapas contenidas en él.</tspan></text><line x1="155.0" y1="338.0" x2="293.0" y2="338.0" stroke="#99f6e4" stroke-width="6"/><line x1="339.0" y1="338.0" x2="477.0" y2="338.0" stroke="#99f6e4" stroke-width="6"/><line x1="523.0" y1="338.0" x2="661.0" y2="338.0" stroke="#99f6e4" stroke-width="6"/><line x1="707.0" y1="338.0" x2="845.0" y2="338.0" stroke="#99f6e4" stroke-width="6"/><circle cx="132.0" cy="338.0" r="22" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><text x="132.0" y="342.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="38"><tspan x="132.0" dy="0">1</tspan></text><rect x="45.0" y="372.0" width="174.0" height="92.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="132.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">Estudio de brote</tspan></text><text x="132.0" y="409.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">Se inicia ante el aumento</tspan><tspan x="132.0" dy="16">inusual de casos con</tspan><tspan x="132.0" dy="16">exposición común</tspan></text><rect x="64.6" y="453.0" width="134.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="132.0" y="468.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="132.0" dy="0">◆ ESTUDIO DE BROTE</tspan></text><circle cx="316.0" cy="338.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="316.0" y="342.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="316.0" dy="0">2</tspan></text><rect x="229.0" y="372.0" width="174.0" height="92.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="316.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">Confirmar y definir casos</tspan></text><text x="316.0" y="409.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">Verificar diagnóstico, definir y</tspan><tspan x="316.0" dy="16">buscar casos</tspan></text><circle cx="500.0" cy="338.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="342.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="500.0" dy="0">3</tspan></text><rect x="413.0" y="372.0" width="174.0" height="92.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">Describir y formular</tspan><tspan x="500.0" dy="17">hipótesis</tspan></text><text x="500.0" y="426.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">Tiempo, lugar y persona;</tspan><tspan x="500.0" dy="16">hipótesis de la fuente</tspan></text><circle cx="684.0" cy="338.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="684.0" y="342.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="684.0" dy="0">4</tspan></text><rect x="597.0" y="372.0" width="174.0" height="92.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="684.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">Contrastar</tspan></text><text x="684.0" y="409.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">Tasas de ataque, casos y</tspan><tspan x="684.0" dy="16">controles o cohortes; muestras</tspan></text><circle cx="868.0" cy="338.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="868.0" y="342.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="868.0" dy="0">5</tspan></text><rect x="781.0" y="372.0" width="174.0" height="92.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="868.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">Controlar y comunicar</tspan></text><text x="868.0" y="409.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">Retirar el alimento sospechoso</tspan><tspan x="868.0" dy="16">y notificar</tspan></text><rect x="40.0" y="496.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="522.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Brote sospechado = iniciar el estudio de brote</tspan></text><text x="60.0" y="541.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Equipo, hipótesis, tasa de ataque y etiología son partes del estudio.</tspan></text><text x="40.0" y="608.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="618.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="657.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="621.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="649.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Estudio de brote de</tspan><tspan x="285.0" dy="17">enfermedad</tspan></text><text x="435.0" y="649.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Elaborar una</tspan><tspan x="435.0" dy="17">hipótesis</tspan></text><text x="585.0" y="640.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Conformar el</tspan><tspan x="585.0" dy="17">equipo de</tspan><tspan x="585.0" dy="17">investigación</tspan></text><text x="735.0" y="649.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Determinar la tasa</tspan><tspan x="735.0" dy="17">de ataque</tspan></text><text x="885.0" y="649.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Identificar la</tspan><tspan x="885.0" dy="17">etiología</tspan></text><rect x="40.0" y="689.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="689.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="718.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Conducta</tspan><tspan x="54.0" dy="16">epidemiológica?</tspan></text><text x="285.0" y="718.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: engloba todos los</tspan><tspan x="285.0" dy="16">pasos siguientes</tspan></text><text x="435.0" y="718.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es un paso dentro</tspan><tspan x="435.0" dy="16">del estudio</tspan></text><text x="585.0" y="718.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es un paso dentro</tspan><tspan x="585.0" dy="16">del estudio</tspan></text><text x="735.0" y="718.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es un paso dentro</tspan><tspan x="735.0" dy="16">del estudio</tspan></text><text x="885.0" y="710.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es un paso dentro</tspan><tspan x="885.0" dy="16">del estudio, no frena el</tspan><tspan x="885.0" dy="16">control</tspan></text><rect x="40.0" y="618.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="779.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="807.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="829.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Cuadro de disentería con exposición común y crecimiento rápido: brote probable de origen alimentario. La conducta es iniciar el estudio de brote.</tspan><tspan x="58.0" dy="18">• Pasos: confirmar el brote y el diagnóstico, definir y buscar casos, describir por tiempo, lugar y persona, formular y contrastar hipótesis, tomar muestras,</tspan><tspan x="58.0" dy="18">   controlar y comunicar.</tspan><tspan x="58.0" dy="18">• Conformar el equipo, la hipótesis, la tasa de ataque y la etiología son etapas contenidas dentro del estudio de brote.</tspan><tspan x="58.0" dy="18">• Alerta: el control no espera la etiología; se notifica de inmediato y se retira el alimento sospechoso.</tspan></text><text x="58.0" y="923.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, Principles of Epidemiology in Public Health Practice, 3.ª ed. (2012); OMS, Foodborne disease outbreaks: guidelines for investigation and control (2008); Gordis,</tspan><tspan x="58.0" dy="15">Epidemiología, 6.ª ed. (2019).</tspan></text></svg>