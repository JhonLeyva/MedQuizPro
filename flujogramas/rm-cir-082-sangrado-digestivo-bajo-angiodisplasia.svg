<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="971" viewBox="0 0 1000 971" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La angiodisplasia se localiza con más frecuencia en el ciego y el colon ascendente"><title>La angiodisplasia se localiza con más frecuencia en el ciego y el colon ascendente</title><rect x="0.75" y="0.75" width="998.5" height="969.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Sangrado digestivo bajo · angiodisplasia</tspan></text><rect x="441.3" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="484.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="484.5" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Angiodisplasia</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Malformación vascular adquirida de la mucosa, con vasos dilatados y frágiles.</tspan><tspan x="58.0" dy="17">Causa sangrado indoloro e intermitente.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿En qué segmento digestivo es más frecuente?</tspan></text><line x1="640.0" y1="189.0" x2="670.0" y2="189.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DÓNDE ESTÁ Y CON QUÉ SE ASOCIA LA ANGIODISPLASIA</tspan></text><line x1="406.0" y1="395.0" x2="340.0" y2="395.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="395.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="420.3" y1="444.8" x2="340.0" y2="495.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="495.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="579.7" y1="345.2" x2="660.0" y2="295.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="295.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="594.0" y1="395.0" x2="660.0" y2="395.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="395.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="579.7" y1="444.8" x2="660.0" y2="495.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="495.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="420.3" y1="345.2" x2="340.0" y2="295.0" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="295.0" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="395.0" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="395.0" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="400.0" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">ANGIODISPLASIA</tspan></text><text x="500.0" y="419.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">colon</tspan></text><rect x="40.0" y="253.0" width="300.0" height="84.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="286.7" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">CIEGO Y COLON ASCENDENTE</tspan></text><text x="190.0" y="310.4" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Localización más frecuente</tspan></text><rect x="144.6" y="327.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="342.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="353.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="354.0" width="6.0" height="82.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="386.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">MAYORES DE 60 AÑOS</tspan></text><text x="190.0" y="410.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Degenerativa, adquirida</tspan></text><rect x="40.0" y="453.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="454.0" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="190.0" y="486.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">ESTENOSIS AÓRTICA</tspan></text><text x="190.0" y="510.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Síndrome de Heyde</tspan></text><rect x="660.0" y="253.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="254.0" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="286.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">ERC Y ANTICOAGULANTES</tspan></text><text x="810.0" y="310.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Más riesgo de sangrado</tspan></text><rect x="660.0" y="353.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="354.0" width="6.0" height="82.0" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="386.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">DIAGNÓSTICO</tspan></text><text x="810.0" y="410.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Colonoscopia; cápsula si es de delgado</tspan></text><rect x="660.0" y="453.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="454.0" width="6.0" height="82.0" rx="3" fill="#6366f1" stroke="none" stroke-width="1.5"/><text x="810.0" y="486.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">TRATAMIENTO</tspan></text><text x="810.0" y="510.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Argón; octreótido si recurre</tspan></text><text x="40.0" y="573.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="585.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="609.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Pérdida de multímeros de von</tspan><tspan x="142.2" dy="17">Willebrand</tspan></text><line x1="248.5" y1="614.0" x2="267.5" y2="614.0" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,609.0 266.5,619.0 274.5,614.0" fill="#0f766e"/><rect x="278.5" y="585.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="609.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Vasos frágiles en el colon</tspan><tspan x="380.8" dy="17">derecho</tspan></text><line x1="487.0" y1="614.0" x2="506.0" y2="614.0" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,609.0 505.0,619.0 513.0,614.0" fill="#0f766e"/><rect x="517.0" y="585.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="609.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Sangrado indoloro e</tspan><tspan x="619.2" dy="17">intermitente</tspan></text><line x1="725.5" y1="614.0" x2="744.5" y2="614.0" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,609.0 743.5,619.0 751.5,614.0" fill="#0f766e"/><rect x="755.5" y="585.0" width="204.5" height="58.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="618.0" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Anemia ferropénica crónica</tspan></text><text x="40.0" y="683.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="693.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="715.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="696.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="715.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Colon ascendente</tspan></text><text x="435.0" y="715.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Colon descendente</tspan></text><text x="585.0" y="715.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Íleon terminal</tspan></text><text x="735.0" y="715.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Sigmoides</tspan></text><text x="885.0" y="715.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Recto</tspan></text><rect x="40.0" y="730.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="730.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="759.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Segmento?</tspan></text><text x="285.0" y="751.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: ciego y colon</tspan><tspan x="285.0" dy="16">derecho, de pared fina</tspan></text><text x="435.0" y="751.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: menos frecuente</tspan><tspan x="435.0" dy="16">que el colon derecho</tspan></text><text x="585.0" y="759.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: poco frecuente</tspan></text><text x="735.0" y="751.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: sitio típico de</tspan><tspan x="735.0" dy="16">diverticulosis</tspan></text><text x="885.0" y="751.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: sitio típico de</tspan><tspan x="885.0" dy="16">hemorroides</tspan></text><rect x="40.0" y="693.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="804.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="832.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="854.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Ciego y colon ascendente, en mayores de 60 años; se asocia con estenosis aórtica (síndrome de Heyde), enfermedad renal crónica y anticoagulantes.</tspan><tspan x="58.0" dy="18">• Clínica: hemorragia baja indolora o anemia ferropénica crónica. Colonoscopia: lesión roja en helecho; cápsula endoscópica si es de delgado; angiografía</tspan><tspan x="58.0" dy="18">   si sangra.</tspan><tspan x="58.0" dy="18">• Tratamiento: coagulación con argón; si recurre, octreótido; la cirugía queda como último recurso (ACG, hemorragia digestiva baja, 2023).</tspan></text><text x="58.0" y="930.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACG, hemorragia digestiva baja (Sengupta et al., 2023); ESGE, angiodisplasias (2020); Sabiston Tratado de Cirugía 21.ª ed.</tspan></text></svg>