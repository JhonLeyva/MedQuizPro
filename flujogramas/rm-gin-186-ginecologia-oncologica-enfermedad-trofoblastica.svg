<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1081" viewBox="0 0 1000 1081" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Mola persistente: vaciamiento uterino y quimioterapia con metotrexato, según la clave del banco"><title>Mola persistente: vaciamiento uterino y quimioterapia con metotrexato, según la clave del banco</title><rect x="0.75" y="0.75" width="998.5" height="1079.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ginecología oncológica · enfermedad trofoblástica</tspan></text><rect x="498.7" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="578.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="578.5" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Enfermedad trofoblástica gestacional</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Mola completa y parcial (premalignas) y neoplasia trofoblástica gestacional.</tspan><tspan x="58.0" dy="17">Se vigila con la hCG tras evacuar.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 34 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Aborto hace dos años.</tspan><tspan x="640.0" dy="16">Mola hidatiforme persistente: vaciamiento uterino y</tspan><tspan x="640.0" dy="16">terapia con...</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SEGUIMIENTO Y TRATAMIENTO DE LA MOLA</tspan></text><text x="44.0" y="299.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Se avanza solo si el paso anterior no basta; el último es el fármaco del caso.</tspan></text><line x1="155.0" y1="338.0" x2="293.0" y2="338.0" stroke="#99f6e4" stroke-width="6"/><line x1="339.0" y1="338.0" x2="477.0" y2="338.0" stroke="#99f6e4" stroke-width="6"/><line x1="523.0" y1="338.0" x2="661.0" y2="338.0" stroke="#99f6e4" stroke-width="6"/><line x1="707.0" y1="338.0" x2="845.0" y2="338.0" stroke="#99f6e4" stroke-width="6"/><circle cx="132.0" cy="338.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="132.0" y="342.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="132.0" dy="0">1</tspan></text><rect x="45.0" y="372.0" width="174.0" height="92.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="132.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">Evacuación por</tspan><tspan x="132.0" dy="17">aspiración</tspan></text><text x="132.0" y="426.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">Primer tratamiento de toda</tspan><tspan x="132.0" dy="16">mola</tspan></text><circle cx="316.0" cy="338.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="316.0" y="342.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="316.0" dy="0">2</tspan></text><rect x="229.0" y="372.0" width="174.0" height="92.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="316.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">hCG seriada</tspan></text><text x="316.0" y="409.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">Semanal hasta normalizar,</tspan><tspan x="316.0" dy="16">luego control mensual</tspan></text><circle cx="500.0" cy="338.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="342.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="500.0" dy="0">3</tspan></text><rect x="413.0" y="372.0" width="174.0" height="92.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">Anticoncepción</tspan></text><text x="500.0" y="409.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">Evita confundir un embarazo</tspan><tspan x="500.0" dy="16">con la recaída</tspan></text><circle cx="684.0" cy="338.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="684.0" y="342.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="684.0" dy="0">4</tspan></text><rect x="597.0" y="372.0" width="174.0" height="92.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="684.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">Meseta o ascenso de la</tspan><tspan x="684.0" dy="17">hCG</tspan></text><text x="684.0" y="426.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">Neoplasia trofoblástica</tspan><tspan x="684.0" dy="16">gestacional: estadificar</tspan></text><circle cx="868.0" cy="338.0" r="22" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><text x="868.0" y="342.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="38"><tspan x="868.0" dy="0">5</tspan></text><rect x="781.0" y="372.0" width="174.0" height="92.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="868.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">Metotrexato</tspan></text><text x="868.0" y="409.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">Fármaco único si el puntaje es</tspan><tspan x="868.0" dy="16">de 6 o menos</tspan></text><rect x="813.1" y="453.0" width="109.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="868.0" y="468.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="868.0" dy="0">◆ METOTREXATO</tspan></text><rect x="40.0" y="496.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="522.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Mola persistente de bajo riesgo = metotrexato</tspan></text><text x="60.0" y="541.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Alto riesgo: poliquimioterapia con EMA-CO.</tspan></text><text x="40.0" y="602.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">NEOPLASIA TROFOBLÁSTICA: PUNTAJE DE RIESGO Y TRATAMIENTO</tspan></text><rect x="40.0" y="614.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="633.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Puntaje FIGO/OMS</tspan></text><text x="220.0" y="633.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Riesgo</tspan></text><text x="595.0" y="633.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Tratamiento</tspan></text><rect x="40.0" y="643.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="662.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">6 o menos</tspan></text><text x="220.0" y="662.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Bajo</tspan></text><text x="595.0" y="662.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Metotrexato o actinomicina D como único fármaco</tspan></text><rect x="110.6" y="646.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="156.0" y="661.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="156.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="672.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="691.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">7 o más</tspan></text><text x="220.0" y="691.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Alto</tspan></text><text x="595.0" y="691.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Quimioterapia combinada EMA-CO</tspan></text><text x="40.0" y="741.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="751.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="773.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="754.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="773.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Metotrexato</tspan></text><text x="435.0" y="773.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Misoprostol</tspan></text><text x="585.0" y="773.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Sulfato ferroso</tspan></text><text x="735.0" y="773.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Vincristina</tspan></text><text x="885.0" y="773.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Carbonato de calcio</tspan></text><rect x="40.0" y="788.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="788.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="825.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Terapia profiláctica?</tspan></text><text x="285.0" y="809.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: antimetabolito</tspan><tspan x="285.0" dy="16">usado como</tspan><tspan x="285.0" dy="16">quimioterapia</tspan></text><text x="435.0" y="817.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es un uterotónico,</tspan><tspan x="435.0" dy="16">no un quimioterápico</tspan></text><text x="585.0" y="817.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: corrige la anemia,</tspan><tspan x="585.0" dy="16">no trata la mola</tspan></text><text x="735.0" y="809.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no es el fármaco</tspan><tspan x="735.0" dy="16">de la enfermedad</tspan><tspan x="735.0" dy="16">trofoblástica</tspan></text><text x="885.0" y="809.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no trata la</tspan><tspan x="885.0" dy="16">enfermedad</tspan><tspan x="885.0" dy="16">trofoblástica</tspan></text><rect x="40.0" y="751.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="878.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="906.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="928.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Tras evacuar la mola por aspiración, 15 a 20 % de las completas y 1 a 5 % de las parciales evolucionan a neoplasia: meseta o ascenso de la hCG</tspan><tspan x="58.0" dy="18">   (criterios FIGO).</tspan><tspan x="58.0" dy="18">• La quimioprofilaxis con dosis única de actinomicina D o metotrexato reduce la evolución en pacientes de alto riesgo (edad mayor de 40, hCG mayor de</tspan><tspan x="58.0" dy="18">   100 000, útero grande).</tspan><tspan x="58.0" dy="18">• Neoplasia de bajo riesgo (puntaje 6 o menos): metotrexato o actinomicina D como único fármaco; alto riesgo (7 o más): esquema combinado EMA-CO.</tspan><tspan x="58.0" dy="18">• Alerta: el libro reconoce que la actinomicina D sería la mejor opción, pero no figura entre las alternativas. Vincristina no es el fármaco profiláctico.</tspan></text><text x="58.0" y="1040.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Ngan HYS et al., FIGO 2021, Int J Gynaecol Obstet 2021;155 Suppl 1:86-93; Williams Obstetricia, 26.ª ed. (2022).</tspan></text></svg>