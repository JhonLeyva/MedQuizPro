<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1301" viewBox="0 0 1000 1301" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En el hipertenso el mecanismo más frecuente de ictus es la trombosis: el infarto isquémico supera 80 % de los casos"><title>En el hipertenso el mecanismo más frecuente de ictus es la trombosis: el infarto isquémico supera 80 % de los casos</title><rect x="0.75" y="0.75" width="998.5" height="1299.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neurología · ictus e hipertensión</tspan></text><rect x="393.4" y="32.0" width="113.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="450.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="98"><tspan x="450.3" dy="0">NEUROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ictus e hipertensión</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La hipertensión es el principal factor de riesgo modificable de todo tipo de ictus.</tspan><tspan x="58.0" dy="17">El infarto isquémico es cerca de 85 % y el hemorrágico cerca de 15 %.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">La hipertensión es la causa más común de ictus.</tspan><tspan x="640.0" dy="16">¿Cuál es el mecanismo más frecuente?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">MECANISMOS DEL ICTUS, DEL MÁS AL MENOS FRECUENTE EN EL HIPERTENSO</tspan></text><polygon points="200.0,269.0 300.0,269.0 340.0,340.0 160.0,340.0" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="309.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="88"><tspan x="250.0" dy="0">1</tspan></text><rect x="486.0" y="269.0" width="474.0" height="71.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="501.0" y="293.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Trombosis: aterosclerosis y lipohialinosis</tspan></text><text x="501.0" y="310.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Dentro del infarto isquémico (cerca de 85 %); la hipertensión la favorece de</tspan><tspan x="501.0" dy="16">forma directa</tspan></text><rect x="858.2" y="258.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="903.6" y="273.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="903.6" dy="0">◆ ESTE CASO</tspan></text><polygon points="160.0,346.0 340.0,346.0 380.0,417.0 120.0,417.0" fill="#99f6e4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="386.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="168"><tspan x="250.0" dy="0">2</tspan></text><rect x="486.0" y="346.0" width="474.0" height="71.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="378.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Embolia: sobre todo cardioembólica</tspan></text><text x="501.0" y="395.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Segundo lugar entre los infartos; fibrilación auricular</tspan></text><polygon points="120.0,423.0 380.0,423.0 420.0,494.0 80.0,494.0" fill="#5eead4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="463.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="248"><tspan x="250.0" dy="0">3</tspan></text><rect x="486.0" y="423.0" width="474.0" height="71.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="455.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Hemorragia intraparenquimatosa hipertensiva</tspan></text><text x="501.0" y="472.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Cerca de 15 % de los ictus: putamen, tálamo, protuberancia, cerebelo</tspan></text><polygon points="80.0,500.0 420.0,500.0 460.0,571.0 40.0,571.0" fill="#2dd4bf" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="540.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="328"><tspan x="250.0" dy="0">4</tspan></text><rect x="486.0" y="500.0" width="474.0" height="71.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="532.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Subaracnoidea por ruptura de aneurisma</tspan></text><text x="501.0" y="549.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Depende más de tabaquismo y factores genéticos</tspan></text><text x="250.0" y="589.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="420"><tspan x="250.0" dy="0">▲ más frecuente · ▼ menos frecuente</tspan></text><rect x="40.0" y="611.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="637.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Hipertensión + ictus = trombosis</tspan></text><text x="60.0" y="656.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La hemorragia y la ruptura de aneurisma son menos comunes que el infarto trombótico.</tspan></text><text x="40.0" y="717.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TIPOS DE ICTUS Y SU RELACIÓN CON LA HIPERTENSIÓN</tspan></text><rect x="40.0" y="729.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="748.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Tipo</tspan></text><text x="340.0" y="748.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="299"><tspan x="340.0" dy="0">Frecuencia</tspan></text><text x="655.0" y="748.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="299"><tspan x="655.0" dy="0">Relación con la presión arterial</tspan></text><rect x="40.0" y="758.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="777.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Isquémico trombótico</tspan></text><text x="340.0" y="777.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="340.0" dy="0">Principal (isquémicos cerca de 85 %)</tspan></text><text x="655.0" y="777.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="655.0" dy="0">Daña la pared arterial y favorece la placa y el infarto</tspan><tspan x="655.0" dy="15">lacunar</tspan></text><rect x="230.6" y="769.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="276.0" y="784.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="276.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="802.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="821.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Isquémico embólico</tspan></text><text x="340.0" y="821.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="340.0" dy="0">Segundo entre los infartos</tspan></text><text x="655.0" y="821.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="655.0" dy="0">Origen cardíaco, sobre todo fibrilación auricular</tspan></text><rect x="40.0" y="831.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="850.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Hemorragia intraparenquimatosa</tspan></text><text x="340.0" y="850.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="340.0" dy="0">Cerca de 15 % (hemorrágicos)</tspan></text><text x="655.0" y="850.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="655.0" dy="0">Rotura de arterias perforantes: putamen, tálamo,</tspan><tspan x="655.0" dy="15">protuberancia, cerebelo</tspan></text><rect x="40.0" y="875.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="894.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Hemorragia subaracnoidea</tspan></text><text x="340.0" y="894.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="340.0" dy="0">Menos frecuente</tspan></text><text x="655.0" y="894.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="655.0" dy="0">Aneurisma: más ligada a tabaquismo y genética</tspan></text><text x="40.0" y="944.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="954.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="985.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="976.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hemorragia</tspan><tspan x="285.0" dy="17">subaracnoidea</tspan></text><text x="435.0" y="976.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Ruptura de</tspan><tspan x="435.0" dy="17">aneurisma</tspan></text><rect x="513.0" y="957.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="985.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Trombosis</tspan></text><text x="735.0" y="985.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hemorragia</tspan></text><text x="885.0" y="985.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Embolia</tspan></text><rect x="40.0" y="1008.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="1008.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1037.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Mecanismo más</tspan><tspan x="54.0" dy="16">frecuente?</tspan></text><text x="285.0" y="1029.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es una causa de</tspan><tspan x="285.0" dy="16">hemorragia, menos</tspan><tspan x="285.0" dy="16">común</tspan></text><text x="435.0" y="1037.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: depende más de</tspan><tspan x="435.0" dy="16">tabaco y genética</tspan></text><text x="585.0" y="1029.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: la hipertensión</tspan><tspan x="585.0" dy="16">favorece la trombosis</tspan><tspan x="585.0" dy="16">arterial</tspan></text><text x="735.0" y="1029.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es menos</tspan><tspan x="735.0" dy="16">frecuente que el infarto</tspan><tspan x="735.0" dy="16">trombótico</tspan></text><text x="885.0" y="1029.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es el segundo</tspan><tspan x="885.0" dy="16">mecanismo, de origen</tspan><tspan x="885.0" dy="16">cardíaco</tspan></text><rect x="40.0" y="954.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1098.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1126.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1148.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Isquémico: cerca de 85 % de los ictus; hemorrágico: cerca de 15 %. La hipertensión daña el endotelio, acelera la placa y engruesa la media vascular.</tspan><tspan x="58.0" dy="18">• Trombosis: aterosclerosis de grandes arterias y lipohialinosis de perforantes (infarto lacunar). La embolia cardiogénica (fibrilación auricular) es la</tspan><tspan x="58.0" dy="18">   segunda.</tspan><tspan x="58.0" dy="18">• Hemorragia intraparenquimatosa hipertensiva: putamen, tálamo, protuberancia y cerebelo. La subaracnoidea por aneurisma depende más de tabaco y</tspan><tspan x="58.0" dy="18">   genética.</tspan><tspan x="58.0" dy="18">• Prevención: bajar la presión arterial es la medida de mayor impacto, con meta por debajo de 130/80 mmHg (AHA/ASA 2021).</tspan></text><text x="58.0" y="1260.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AHA/ASA, Guideline for the Prevention of Stroke in Patients With Stroke and TIA (Kleindorfer, Stroke 2021;52:e364); Harrison, 21.ª ed. (2022).</tspan></text></svg>