<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la vida fetal la eritropoyetina se produce sobre todo en el hígado; el riñón la asume después del nacimiento"><title>En la vida fetal la eritropoyetina se produce sobre todo en el hígado; el riñón la asume después del nacimiento</title><rect x="0.75" y="0.75" width="998.5" height="998.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Fisiología · eritropoyetina fetal</tspan></text><rect x="381.1" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="453.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="453.1" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Eritropoyetina</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Glucoproteína de unos 34 kDa; su síntesis responde a la hipoxia tisular.</tspan><tspan x="58.0" dy="17">HIF-2α la estimula; no la inhibe.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de fisiología</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Dónde se produce la eritropoyetina durante la</tspan><tspan x="640.0" dy="16">eritropoyesis fetal?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DÓNDE SE PRODUCE LA ERITROPOYETINA ANTES Y DESPUÉS DEL NACIMIENTO</tspan></text><rect x="40.0" y="269.0" width="385.0" height="180.0" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="232.5" y="295.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="365"><tspan x="232.5" dy="0">VIDA FETAL</tspan></text><text x="56.0" y="325.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Sitio principal</tspan></text><text x="409.0" y="325.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">Hígado</tspan></text><line x1="52.0" y1="333.0" x2="413.0" y2="333.0" stroke="#ffffff" stroke-width="1.4"/><text x="56.0" y="351.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Eritropoyesis</tspan></text><text x="409.0" y="351.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">Hígado y luego médula</tspan></text><line x1="52.0" y1="359.0" x2="413.0" y2="359.0" stroke="#ffffff" stroke-width="1.4"/><text x="56.0" y="377.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Estímulo</tspan></text><text x="409.0" y="377.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">Hipoxia vía HIF</tspan></text><line x1="52.0" y1="385.0" x2="413.0" y2="385.0" stroke="#ffffff" stroke-width="1.4"/><text x="56.0" y="403.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">EPO materna</tspan></text><text x="409.0" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">No cruza la placenta</tspan></text><line x1="52.0" y1="411.0" x2="413.0" y2="411.0" stroke="#ffffff" stroke-width="1.4"/><text x="56.0" y="429.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Inicio</tspan></text><text x="409.0" y="429.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">Mucho antes del 3.er trimestre</tspan></text><line x1="52.0" y1="437.0" x2="413.0" y2="437.0" stroke="#ffffff" stroke-width="1.4"/><rect x="575.0" y="269.0" width="385.0" height="180.0" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="767.5" y="295.0" font-size="13" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="365"><tspan x="767.5" dy="0">DESPUÉS DEL NACIMIENTO</tspan></text><text x="591.0" y="325.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Sitio principal</tspan></text><text x="944.0" y="325.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">Riñón (cerca de 90 %)</tspan></text><line x1="587.0" y1="333.0" x2="948.0" y2="333.0" stroke="#ffffff" stroke-width="1.4"/><text x="591.0" y="351.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Células</tspan></text><text x="944.0" y="351.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">Intersticiales peritubulares</tspan></text><line x1="587.0" y1="359.0" x2="948.0" y2="359.0" stroke="#ffffff" stroke-width="1.4"/><text x="591.0" y="377.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Estímulo</tspan></text><text x="944.0" y="377.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">Hipoxia vía HIF</tspan></text><line x1="587.0" y1="385.0" x2="948.0" y2="385.0" stroke="#ffffff" stroke-width="1.4"/><text x="591.0" y="403.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Cambio</tspan></text><text x="944.0" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">Progresivo en semanas</tspan></text><line x1="587.0" y1="411.0" x2="948.0" y2="411.0" stroke="#ffffff" stroke-width="1.4"/><text x="591.0" y="429.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">En el prematuro</tspan></text><text x="944.0" y="429.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">El cambio se retrasa</tspan></text><line x1="587.0" y1="437.0" x2="948.0" y2="437.0" stroke="#ffffff" stroke-width="1.4"/><rect x="434.0" y="323.0" width="132.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="349.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="118"><tspan x="500.0" dy="0">Cambio de la fuente</tspan><tspan x="500.0" dy="16">hepática a la renal</tspan></text><line x1="429.0" y1="415.0" x2="562.0" y2="415.0" stroke="#0f766e" stroke-width="3"/><polygon points="562.0,420.0 562.0,410.0 571.0,415.0" fill="#0f766e"/><rect x="40.0" y="465.0" width="300.0" height="48.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="56.0" y="494.0" font-size="14" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="56.0" dy="0">▲</tspan></text><text x="72.0" y="483.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="260"><tspan x="72.0" dy="0">El hígado cede la producción al riñón</tspan></text><rect x="350.0" y="465.0" width="300.0" height="48.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="366.0" y="494.0" font-size="14" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="366.0" dy="0">=</tspan></text><text x="382.0" y="483.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="260"><tspan x="382.0" dy="0">HIF sigue siendo el estímulo</tspan></text><rect x="660.0" y="465.0" width="300.0" height="48.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="676.0" y="494.0" font-size="14" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="676.0" dy="0">=</tspan></text><text x="692.0" y="483.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="260"><tspan x="692.0" dy="0">La anemia del prematuro refleja el cambio</tspan><tspan x="692.0" dy="15">tardío</tspan></text><rect x="40.0" y="531.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="557.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Feto = EPO hepática; adulto = EPO renal</tspan></text><text x="60.0" y="576.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">HIF estimula la EPO, el túbulo proximal no es el sitio y la materna no cruza la placenta.</tspan></text><text x="40.0" y="643.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="653.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="684.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="675.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Se inicia en el tercer</tspan><tspan x="285.0" dy="17">trimestre</tspan></text><text x="435.0" y="675.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Túbulo proximal</tspan><tspan x="435.0" dy="17">renal</tspan></text><text x="585.0" y="684.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Se inhibe por HIF</tspan></text><text x="735.0" y="675.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">No ocurre; basta la</tspan><tspan x="735.0" dy="17">materna</tspan></text><rect x="813.0" y="656.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="684.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Células hepáticas</tspan></text><rect x="40.0" y="707.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="707.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="736.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Dónde se produce en</tspan><tspan x="54.0" dy="16">el feto?</tspan></text><text x="285.0" y="728.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: comienza mucho</tspan><tspan x="285.0" dy="16">antes del tercer</tspan><tspan x="285.0" dy="16">trimestre</tspan></text><text x="435.0" y="728.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: el riñón asume la</tspan><tspan x="435.0" dy="16">producción después</tspan><tspan x="435.0" dy="16">del nacimiento</tspan></text><text x="585.0" y="728.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: HIF estimula la</tspan><tspan x="585.0" dy="16">producción, no la</tspan><tspan x="585.0" dy="16">inhibe</tspan></text><text x="735.0" y="736.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: la EPO materna no</tspan><tspan x="735.0" dy="16">cruza la placenta</tspan></text><text x="885.0" y="736.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: fuente hepática</tspan><tspan x="885.0" dy="16">fetal (clave del banco)</tspan></text><rect x="40.0" y="653.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="797.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="825.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="847.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• En normoxia la prolil-hidroxilasa marca a HIF para su degradación; en hipoxia HIF se estabiliza y estimula la transcripción de EPO (la opción de inhibición</tspan><tspan x="58.0" dy="18">   es falsa).</tspan><tspan x="58.0" dy="18">• La eritropoyesis pasa del saco vitelino al hígado y luego a la médula ósea; la fuente fetal principal de EPO es hepática.</tspan><tspan x="58.0" dy="18">• Tras el nacimiento el riñón (células intersticiales peritubulares corticales) pasa a ser la fuente dominante (cerca de 90 %); por eso la enfermedad renal</tspan><tspan x="58.0" dy="18">   crónica causa anemia.</tspan><tspan x="58.0" dy="18">• La EPO no atraviesa la placenta: la materna no sustituye a la fetal. Perla: el roxadustat inhibe la prolil-hidroxilasa y estabiliza HIF.</tspan></text><text x="58.0" y="959.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Guyton y Hall Tratado de Fisiología Médica, 14.ª ed. (2021); Nelson Tratado de Pediatría, 22.ª ed. (2024).</tspan></text></svg>