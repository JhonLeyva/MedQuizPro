<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1025" viewBox="0 0 1000 1025" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Gestante con altura uterina de 21 cm y movimientos fetales recién percibidos: por el examen clínico tiene unas 21 semanas (la FUR de 27 semanas no coincide)"><title>Gestante con altura uterina de 21 cm y movimientos fetales recién percibidos: por el examen clínico tiene unas 21 semanas (la FUR de 27 semanas no coincide)</title><rect x="0.75" y="0.75" width="998.5" height="1023.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Control prenatal · altura uterina</tspan></text><rect x="385.9" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="473.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="473.1" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Altura uterina y edad gestacional</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Entre las 20 y 36 semanas la altura uterina en cm ≈ semanas de gestación (± 2 cm). A las</tspan><tspan x="58.0" dy="17">20 semanas llega al ombligo.</tspan><tspan x="58.0" dy="17">Movimientos fetales: primigestas los notan a las 18-20 semanas, multíparas a las 16-18.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 32 años, G1 P1001</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Primer control; por FUR tendría 27 semanas.</tspan><tspan x="640.0" dy="16">Sintió movimientos la semana pasada; AU 21 cm; LCF</tspan><tspan x="640.0" dy="16">140.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ALTURA UTERINA SEGÚN LAS SEMANAS</tspan></text><rect x="40.0" y="285.0" width="540.0" height="340.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="175.3" y="305.0" width="309.3" height="272.0" rx="0" fill="#ccfbf1" stroke="none" stroke-width="0"/><text x="330.0" y="321.0" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="303"><tspan x="330.0" dy="0">cm ≈ semanas</tspan></text><line x1="98.0" y1="577.0" x2="562.0" y2="577.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="581.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">14</tspan></text><line x1="98.0" y1="509.0" x2="562.0" y2="509.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="513.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">20</tspan></text><line x1="98.0" y1="441.0" x2="562.0" y2="441.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="445.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">26</tspan></text><line x1="98.0" y1="373.0" x2="562.0" y2="373.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="377.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">32</tspan></text><line x1="98.0" y1="305.0" x2="562.0" y2="305.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="309.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">38</tspan></text><line x1="98.0" y1="577.0" x2="98.0" y2="582.0" stroke="#94a3b8" stroke-width="1.5"/><text x="98.0" y="596.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="98.0" dy="0">16</tspan></text><line x1="175.3" y1="577.0" x2="175.3" y2="582.0" stroke="#94a3b8" stroke-width="1.5"/><text x="175.3" y="596.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="175.3" dy="0">20</tspan></text><line x1="252.7" y1="577.0" x2="252.7" y2="582.0" stroke="#94a3b8" stroke-width="1.5"/><text x="252.7" y="596.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="252.7" dy="0">24</tspan></text><line x1="310.7" y1="577.0" x2="310.7" y2="582.0" stroke="#94a3b8" stroke-width="1.5"/><text x="310.7" y="596.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="310.7" dy="0">27</tspan></text><line x1="407.3" y1="577.0" x2="407.3" y2="582.0" stroke="#94a3b8" stroke-width="1.5"/><text x="407.3" y="596.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="407.3" dy="0">32</tspan></text><line x1="484.7" y1="577.0" x2="484.7" y2="582.0" stroke="#94a3b8" stroke-width="1.5"/><text x="484.7" y="596.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="484.7" dy="0">36</tspan></text><line x1="562.0" y1="577.0" x2="562.0" y2="582.0" stroke="#94a3b8" stroke-width="1.5"/><text x="562.0" y="596.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="562.0" dy="0">40</tspan></text><line x1="98.0" y1="577.0" x2="562.0" y2="577.0" stroke="#94a3b8" stroke-width="1.5"/><line x1="98.0" y1="305.0" x2="98.0" y2="577.0" stroke="#94a3b8" stroke-width="1.5"/><text x="330.0" y="615.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="464"><tspan x="330.0" dy="0">Semanas de gestación</tspan></text><text x="56.0" y="441.0" transform="rotate(-90 56.0 441.0)" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Altura uterina (cm)</text><polyline points="98.0,554.3 175.3,509.0 252.7,463.7 330.0,418.3 407.3,373.0 484.7,339.0 562.0,350.3" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="194.7" y1="497.7" x2="194.7" y2="577.0" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4"/><circle cx="194.7" cy="497.7" r="9" fill="#ea580c" stroke="#ffffff" stroke-width="3"/><rect x="156.0" y="472.7" width="77.4" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="194.7" y="487.7" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="194.7" dy="0">◆ AU 21 cm</tspan></text><rect x="602.0" y="364.5" width="358.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="617.0" y="388.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">AU 21 cm ≈ 21 semanas</tspan></text><text x="617.0" y="405.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">El examen clínico.</tspan></text><rect x="602.0" y="427.5" width="358.0" height="55.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="617.0" y="451.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">FUR: 27 semanas</tspan></text><text x="617.0" y="468.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">No coincide: pedir eco para fechar.</tspan></text><rect x="602.0" y="490.5" width="358.0" height="55.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="617.0" y="514.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Movimientos recién percibidos</tspan></text><text x="617.0" y="531.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Apoya ~20 semanas.</tspan></text><rect x="40.0" y="643.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="669.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Por el examen: ~21 semanas</tspan></text><text x="60.0" y="688.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La discordancia con la FUR obliga a una ecografía.</tspan></text><text x="40.0" y="755.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="765.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="787.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="787.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">25</tspan></text><rect x="363.0" y="768.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="787.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">21</tspan></text><text x="585.0" y="787.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">17</tspan></text><text x="735.0" y="787.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">27</tspan></text><text x="885.0" y="787.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">31</tspan></text><rect x="40.0" y="802.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="802.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="831.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Semanas?</tspan></text><text x="285.0" y="823.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no coincide con la</tspan><tspan x="285.0" dy="16">AU</tspan></text><text x="435.0" y="831.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: AU 21 ≈ 21 sem</tspan></text><text x="585.0" y="831.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: muy poco</tspan></text><text x="735.0" y="823.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Es la FUR, no el</tspan><tspan x="735.0" dy="16">examen</tspan></text><text x="885.0" y="831.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: muy alto</tspan></text><rect x="40.0" y="765.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="876.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="904.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="926.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Si la AU no coincide con la FUR (&gt; 3 cm): ecografía para fechar y descartar restricción del crecimiento.</tspan><tspan x="58.0" dy="18">• Clínicamente: ~21 semanas.</tspan><tspan x="58.0" dy="18">• Causas de AU baja para la FUR: FUR errónea, restricción, oligohidramnios.</tspan></text><text x="58.0" y="984.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Williams Obstetricia 26.ª ed. (2022); MINSA Perú.</tspan></text></svg>