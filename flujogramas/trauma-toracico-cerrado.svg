<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1157" viewBox="0 0 1000 1157" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Fracturas costales dobles del 2.º al 6.º arco con dificultad respiratoria: tórax inestable"><title>Fracturas costales dobles del 2.º al 6.º arco con dificultad respiratoria: tórax inestable</title><rect x="0.75" y="0.75" width="998.5" height="1155.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Trauma torácico · tórax inestable</tspan></text><rect x="394.8" y="32.0" width="101.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="445.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="85"><tspan x="445.5" dy="0">CIRUGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tórax inestable (volet costal)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Dos o más costillas seguidas rotas en dos o más sitios: un segmento se mueve al revés</tspan><tspan x="58.0" dy="17">(respiración paradójica).</tspan><tspan x="58.0" dy="17">Lo grave es la contusión pulmonar que hay debajo y el dolor que impide respirar.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 34 años, accidente de tránsito</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Disnea, FR 27, FC 105; murmullo disminuido en</tspan><tspan x="640.0" dy="16">hemitórax izquierdo.</tspan><tspan x="640.0" dy="16">Rx: doble trazo de fractura del 2.º al 6.º arco; senos</tspan><tspan x="640.0" dy="16">costofrénicos libres.</tspan></text><line x1="640.0" y1="237.0" x2="670.0" y2="237.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="287.0" x2="577.8" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="577.8" y1="287.0" x2="577.8" y2="316.0" stroke="#94a3b8" stroke-width="2"/><polygon points="572.8,315.0 582.8,315.0 577.8,323.0" fill="#94a3b8"/><line x1="577.8" y1="393.0" x2="577.8" y2="423.0" stroke="#94a3b8" stroke-width="2"/><line x1="344.3" y1="423.0" x2="811.3" y2="423.0" stroke="#94a3b8" stroke-width="2"/><line x1="344.3" y1="423.0" x2="344.3" y2="452.0" stroke="#94a3b8" stroke-width="2"/><polygon points="339.3,451.0 349.3,451.0 344.3,459.0" fill="#94a3b8"/><line x1="811.3" y1="423.0" x2="811.3" y2="452.0" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,451.0 816.3,451.0 811.3,459.0" fill="#94a3b8"/><line x1="344.3" y1="549.5" x2="344.3" y2="579.5" stroke="#94a3b8" stroke-width="2"/><line x1="344.3" y1="579.5" x2="344.3" y2="608.5" stroke="#94a3b8" stroke-width="2"/><polygon points="339.3,607.5 349.3,607.5 344.3,615.5" fill="#94a3b8"/><line x1="344.3" y1="673.5" x2="344.3" y2="703.5" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="703.5" x2="500.0" y2="703.5" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="703.5" x2="188.7" y2="732.5" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,731.5 193.7,731.5 188.7,739.5" fill="#94a3b8"/><line x1="500.0" y1="703.5" x2="500.0" y2="732.5" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,731.5 505.0,731.5 500.0,739.5" fill="#94a3b8"/><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="287.0" x2="577.8" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="577.8" y1="287.0" x2="577.8" y2="316.0" stroke="#0f766e" stroke-width="3"/><polygon points="572.8,315.0 582.8,315.0 577.8,323.0" fill="#0f766e"/><line x1="577.8" y1="393.0" x2="577.8" y2="423.0" stroke="#0f766e" stroke-width="3"/><line x1="344.3" y1="423.0" x2="577.8" y2="423.0" stroke="#0f766e" stroke-width="3"/><line x1="344.3" y1="423.0" x2="344.3" y2="452.0" stroke="#0f766e" stroke-width="3"/><polygon points="339.3,451.0 349.3,451.0 344.3,459.0" fill="#0f766e"/><line x1="344.3" y1="549.5" x2="344.3" y2="579.5" stroke="#0f766e" stroke-width="3"/><line x1="344.3" y1="579.5" x2="344.3" y2="608.5" stroke="#0f766e" stroke-width="3"/><polygon points="339.3,607.5 349.3,607.5 344.3,615.5" fill="#0f766e"/><line x1="344.3" y1="673.5" x2="344.3" y2="703.5" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="703.5" x2="344.3" y2="703.5" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="703.5" x2="188.7" y2="732.5" stroke="#0f766e" stroke-width="3"/><polygon points="183.7,731.5 193.7,731.5 188.7,739.5" fill="#0f766e"/><rect x="268.0" y="432.0" width="152.6" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="344.3" y="444.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="344.3" dy="0">Sí: 2.º a 6.º arco (este caso)</tspan></text><rect x="797.2" y="432.0" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="811.3" y="444.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">No</tspan></text><rect x="147.2" y="712.5" width="83.0" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="188.7" y="725.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">Sí (este caso)</tspan></text><rect x="485.9" y="712.5" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="500.0" y="725.0" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">No</tspan></text><polygon points="317.8,358.0 343.8,323.0 811.8,323.0 837.8,358.0 811.8,393.0 343.8,393.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="363.8" cy="358.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="363.8" y="363.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="363.8" dy="0">?</tspan></text><text x="596.8" y="354.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="596.8" dy="0">¿Dos o más costillas seguidas con doble fractura (segmento</tspan><tspan x="596.8" dy="17">libre)?</tspan></text><rect x="84.3" y="459.0" width="520.0" height="90.5" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><text x="344.3" y="487.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="492"><tspan x="344.3" dy="0">TÓRAX INESTABLE</tspan></text><text x="344.3" y="510.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="492"><tspan x="344.3" dy="0">Oxígeno, analgesia y monitoreo</tspan><tspan x="344.3" dy="17">Buscar contusión pulmonar</tspan></text><rect x="84.3" y="459.0" width="520.0" height="90.5" rx="10" fill="none" stroke="#0f766e" stroke-width="2.2"/><polygon points="84.3,644.5 110.3,615.5 578.3,615.5 604.3,644.5 578.3,673.5 110.3,673.5" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="130.3" cy="644.5" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="130.3" y="649.5" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="130.3" dy="0">?</tspan></text><text x="363.3" y="649.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="363.3" dy="0">¿Insuficiencia respiratoria (disnea, FR &gt; 25, hipoxemia)?</tspan></text><rect x="40.0" y="739.5" width="297.3" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="188.7" y="767.8" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">INTUBAR Y VENTILAR</tspan></text><text x="188.7" y="790.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Ventilación con presión positiva</tspan><tspan x="188.7" dy="17">Analgesia y fijación diferida si se indica</tspan></text><rect x="351.3" y="739.5" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="767.8" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Manejo conservador</tspan></text><text x="500.0" y="790.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Bloqueo regional o epidural</tspan><tspan x="500.0" dy="17">Fisioterapia respiratoria</tspan></text><rect x="662.7" y="459.0" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="495.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Fractura costal simple</tspan></text><text x="811.3" y="518.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Analgesia y control</tspan></text><text x="40.0" y="869.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="879.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="910.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="910.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">TC de tórax</tspan></text><text x="435.0" y="910.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Drenaje torácico</tspan></text><text x="585.0" y="910.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Analgesia óptima</tspan></text><rect x="663.0" y="882.9" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="902.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Intubación</tspan><tspan x="735.0" dy="17">orotraqueal</tspan></text><text x="885.0" y="902.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Fijación costal</tspan><tspan x="885.0" dy="17">inmediata</tspan></text><rect x="40.0" y="933.9" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="933.9" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="962.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Correcto ahora?</tspan></text><text x="285.0" y="954.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: primero asegurar</tspan><tspan x="285.0" dy="16">la vía aérea</tspan></text><text x="435.0" y="954.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no hay hemotórax</tspan><tspan x="435.0" dy="16">ni neumotórax</tspan></text><text x="585.0" y="954.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Necesaria, pero no</tspan><tspan x="585.0" dy="16">basta con IR</tspan></text><text x="735.0" y="954.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: insuficiencia</tspan><tspan x="735.0" dy="16">respiratoria</tspan></text><text x="885.0" y="954.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es diferida y</tspan><tspan x="885.0" dy="16">selectiva</tspan></text><rect x="40.0" y="879.9" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1007.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1035.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1057.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Manejo: oxígeno, analgesia potente (bloqueo regional o epidural) y vigilancia; el tórax se fija solo en casos seleccionados.</tspan><tspan x="58.0" dy="18">• Intubar si hay insuficiencia respiratoria (hipoxemia, fatiga, FR alta) pese al oxígeno y la analgesia.</tspan><tspan x="58.0" dy="18">• Senos libres: no hay hemotórax que drenar; la tomografía no es lo primero si respira mal.</tspan></text><text x="58.0" y="1115.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ATLS 11.ª ed. (2025); EAST, guía de fracturas costales (2023).</tspan></text></svg>