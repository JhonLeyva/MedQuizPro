<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="956" viewBox="0 0 1000 956" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En el aborto incompleto estable de 10 semanas se evacúa con aspiración manual endouterina (AMEU)"><title>En el aborto incompleto estable de 10 semanas se evacúa con aspiración manual endouterina (AMEU)</title><rect x="0.75" y="0.75" width="998.5" height="954.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · aborto incompleto</tspan></text><rect x="384.5" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="464.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="464.3" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Aborto incompleto</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Expulsión parcial de los productos de la concepción, con cuello abierto y sangrado.</tspan><tspan x="58.0" dy="17">Opciones: expectante, médico (misoprostol) o evacuación quirúrgica.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Paciente estable, 10 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Aborto incompleto por fecha de última regla.</tspan><tspan x="640.0" dy="16">¿Cuál es el manejo más adecuado?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE EVACÚA EL ÚTERO EN EL ABORTO INCOMPLETO</tspan></text><rect x="40.0" y="269.0" width="385.0" height="154.0" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="232.5" y="295.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="365"><tspan x="232.5" dy="0">LEGRADO CON CURETA</tspan></text><text x="56.0" y="325.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Técnica</tspan></text><text x="409.0" y="325.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">Raspado con cureta cortante</tspan></text><line x1="52.0" y1="333.0" x2="413.0" y2="333.0" stroke="#ffffff" stroke-width="1.4"/><text x="56.0" y="351.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Seguridad</tspan></text><text x="409.0" y="351.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">Más perforación y sinequias</tspan></text><line x1="52.0" y1="359.0" x2="413.0" y2="359.0" stroke="#ffffff" stroke-width="1.4"/><text x="56.0" y="377.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Dolor y sangrado</tspan></text><text x="409.0" y="377.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">Mayores</tspan></text><line x1="52.0" y1="385.0" x2="413.0" y2="385.0" stroke="#ffffff" stroke-width="1.4"/><text x="56.0" y="403.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Estado actual</tspan></text><text x="409.0" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">Obsoleto</tspan></text><line x1="52.0" y1="411.0" x2="413.0" y2="411.0" stroke="#ffffff" stroke-width="1.4"/><rect x="575.0" y="269.0" width="385.0" height="154.0" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="767.5" y="295.0" font-size="13" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="365"><tspan x="767.5" dy="0">ASPIRACIÓN ENDOUTERINA</tspan></text><text x="591.0" y="325.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Técnica</tspan></text><text x="944.0" y="325.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">Aspiración manual o eléctrica</tspan></text><line x1="587.0" y1="333.0" x2="948.0" y2="333.0" stroke="#ffffff" stroke-width="1.4"/><text x="591.0" y="351.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Seguridad</tspan></text><text x="944.0" y="351.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">Más segura</tspan></text><line x1="587.0" y1="359.0" x2="948.0" y2="359.0" stroke="#ffffff" stroke-width="1.4"/><text x="591.0" y="377.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Dolor y sangrado</tspan></text><text x="944.0" y="377.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">Menores</tspan></text><line x1="587.0" y1="385.0" x2="948.0" y2="385.0" stroke="#ffffff" stroke-width="1.4"/><text x="591.0" y="403.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Eficacia</tspan></text><text x="944.0" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">Cerca de 98 %</tspan></text><line x1="587.0" y1="411.0" x2="948.0" y2="411.0" stroke="#ffffff" stroke-width="1.4"/><rect x="434.0" y="302.0" width="132.0" height="88.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="328.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="118"><tspan x="500.0" dy="0">Evacuación</tspan><tspan x="500.0" dy="16">quirúrgica antes de</tspan><tspan x="500.0" dy="16">12 a 14 semanas</tspan></text><line x1="429.0" y1="410.0" x2="562.0" y2="410.0" stroke="#0f766e" stroke-width="3"/><polygon points="562.0,415.0 562.0,405.0 571.0,410.0" fill="#0f766e"/><rect x="40.0" y="439.0" width="300.0" height="48.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="56.0" y="468.0" font-size="14" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="56.0" dy="0">▲</tspan></text><text x="72.0" y="457.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="260"><tspan x="72.0" dy="0">Menos perforación, sinequias y síndrome</tspan><tspan x="72.0" dy="15">de Asherman</tspan></text><rect x="350.0" y="439.0" width="300.0" height="48.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="366.0" y="468.0" font-size="14" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="366.0" dy="0">▲</tspan></text><text x="382.0" y="457.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="260"><tspan x="382.0" dy="0">Procedimiento más rápido y con menos</tspan><tspan x="382.0" dy="15">sangrado</tspan></text><rect x="660.0" y="439.0" width="300.0" height="48.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="676.0" y="468.0" font-size="14" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="676.0" dy="0">=</tspan></text><text x="692.0" y="457.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="260"><tspan x="692.0" dy="0">La indicación (aborto incompleto) no</tspan><tspan x="692.0" dy="15">cambia</tspan></text><rect x="40.0" y="505.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="531.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Aborto incompleto estable &lt; 12 semanas = AMEU</tspan></text><text x="60.0" y="550.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Histerosonografía e histeroscopía son estudios; la revisión instrumentada es del parto.</tspan></text><text x="40.0" y="617.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="627.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="658.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="630.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="649.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Aspiración manual</tspan><tspan x="285.0" dy="17">endouterina</tspan></text><text x="435.0" y="658.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Histerosonografía</tspan></text><text x="585.0" y="658.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Legrado uterino</tspan></text><text x="735.0" y="649.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Revisión</tspan><tspan x="735.0" dy="17">instrumentada</tspan></text><text x="885.0" y="658.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Histeroscopía</tspan></text><rect x="40.0" y="681.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="681.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="710.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Manejo más</tspan><tspan x="54.0" dy="16">adecuado?</tspan></text><text x="285.0" y="710.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: más segura, rápida</tspan><tspan x="285.0" dy="16">y con menos sangrado</tspan></text><text x="435.0" y="710.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es un estudio</tspan><tspan x="435.0" dy="16">diagnóstico, no trata</tspan></text><text x="585.0" y="702.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: obsoleto por riesgo</tspan><tspan x="585.0" dy="16">de perforación y</tspan><tspan x="585.0" dy="16">sinequias</tspan></text><text x="735.0" y="702.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: se usa tras el parto</tspan><tspan x="735.0" dy="16">o en gestación</tspan><tspan x="735.0" dy="16">avanzada</tspan></text><text x="885.0" y="710.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es un estudio</tspan><tspan x="885.0" dy="16">diagnóstico, no trata</tspan></text><rect x="40.0" y="627.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="771.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="799.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="821.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Si se elige evacuar una gestación menor de 12 a 14 semanas, el método de elección es la aspiración endouterina, manual o eléctrica: eficacia cercana a</tspan><tspan x="58.0" dy="18">   98 %.</tspan><tspan x="58.0" dy="18">• El legrado con cureta es obsoleto: más perforación, sinequias y síndrome de Asherman. Histerosonografía e histeroscopía diagnostican, no tratan.</tspan><tspan x="58.0" dy="18">• Alerta: inestabilidad, fiebre o sospecha de aborto séptico exigen reanimación, antibióticos y evacuación inmediata.</tspan><tspan x="58.0" dy="18">• Rh negativo no sensibilizada: inmunoglobulina anti-D; ofrecer consejería anticonceptiva antes del alta.</tspan></text><text x="58.0" y="915.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, Practice Bulletin 200 (2018); Williams Obstetricia, 26.ª ed. (2022).</tspan></text></svg>