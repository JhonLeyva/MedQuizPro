<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="838" viewBox="0 0 1000 838" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Tipos de psicosis"><title>Tipos de psicosis</title><rect x="0.75" y="0.75" width="998.5" height="836.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">PSIQUIATRÍA ENAM: PSICOSIS PARANOIDE</tspan></text><rect x="461.6" y="32.0" width="90.2" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="506.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="74"><tspan x="506.7" dy="0">PSIQUIATRÍA</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Psicosis paranoide</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Predominan delirios de persecución y perjuicio</tspan><tspan x="58.0" dy="17">Interpreta hechos neutros como ataques (autorreferencia), teme ser envenenada</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 18 años con familia disfuncional</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Cree que sus hermanos hablan mal de ella y le envían</tspan><tspan x="640.0" dy="16">el ruido de un avión</tspan><tspan x="640.0" dy="16">No come por miedo a ser envenenada</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">MAPA DEL TEMA</tspan></text><line x1="406.0" y1="432.7" x2="340.0" y2="434.2" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="434.2" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="421.1" y1="481.7" x2="340.0" y2="534.2" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="534.2" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="402.5" x2="660.0" y2="380.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="380.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="458.6" x2="660.0" y2="480.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="480.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="420.3" y1="380.8" x2="340.0" y2="330.6" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="330.6" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="430.6" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="430.6" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="435.6" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">PSICOSIS</tspan></text><text x="500.0" y="454.6" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">Según lo que predomina</tspan></text><rect x="40.0" y="285.0" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="313.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">PARANOIDE</tspan></text><text x="190.0" y="337.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Persecución, perjuicio</tspan><tspan x="190.0" dy="17">Temor al envenenamiento</tspan></text><rect x="144.6" y="366.2" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="381.2" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="392.2" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="393.2" width="6.0" height="82.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="425.9" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Catatónica</tspan></text><text x="190.0" y="449.6" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Inmovilidad, negativismo</tspan></text><rect x="40.0" y="492.2" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="493.2" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="190.0" y="525.9" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Confusional</tspan></text><text x="190.0" y="549.6" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Desorientación, causa orgánica</tspan></text><rect x="660.0" y="338.6" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="339.6" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="372.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Desorganizada</tspan></text><text x="810.0" y="396.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Lenguaje y conducta caóticos</tspan></text><rect x="660.0" y="438.6" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="439.6" width="6.0" height="82.0" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="472.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Afectiva</tspan></text><text x="810.0" y="496.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Manía o depresión</tspan></text><text x="40.0" y="612.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="624.2" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="648.7" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Ideas de perjuicio</tspan></text><line x1="248.5" y1="644.7" x2="267.5" y2="644.7" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,639.7 266.5,649.7 274.5,644.7" fill="#0f766e"/><rect x="278.5" y="624.2" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="648.7" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Autorreferencia</tspan></text><line x1="487.0" y1="644.7" x2="506.0" y2="644.7" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,639.7 505.0,649.7 513.0,644.7" fill="#0f766e"/><rect x="517.0" y="624.2" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="648.7" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Miedo a ser envenenada</tspan></text><line x1="725.5" y1="644.7" x2="744.5" y2="644.7" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,639.7 743.5,649.7 751.5,644.7" fill="#0f766e"/><rect x="755.5" y="624.2" width="204.5" height="41.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="648.7" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">PARANOIDE</tspan></text><rect x="40.0" y="689.2" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="717.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="739.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Descartar consumo de sustancias y causas orgánicas.</tspan><tspan x="58.0" dy="18">• Tratamiento: antipsicóticos y apoyo familiar.</tspan><tspan x="58.0" dy="18">• Si dura ≥ 6 meses con deterioro: esquizofrenia.</tspan></text><text x="58.0" y="797.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: APA – DSM-5-TR (2022) · APA – Guideline for schizophrenia (2020)</tspan></text></svg>