<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1274" viewBox="0 0 1000 1274" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Embolia pulmonar con hipotensión y VD dilatado: trombólisis sistémica"><title>Embolia pulmonar con hipotensión y VD dilatado: trombólisis sistémica</title><rect x="0.75" y="0.75" width="998.5" height="1272.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Tromboembolismo pulmonar · alto riesgo</tspan></text><rect x="444.7" y="32.0" width="132.2" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="510.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="116"><tspan x="510.8" dy="0">CARDIOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tromboembolismo pulmonar de alto riesgo</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El coágulo obstruye la arteria pulmonar: el VD se dilata y falla.</tspan><tspan x="58.0" dy="17">Con hipotensión o shock hay que disolver el coágulo ya.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Agricultor de 70 años, obeso, viaje largo</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Disnea súbita, dolor torácico y síncope; PA 80/50, FC</tspan><tspan x="640.0" dy="16">125, SatO₂ 82 %.</tspan><tspan x="640.0" dy="16">ECG: taquicardia y eje a la derecha; eco: VD dilatado.</tspan><tspan x="640.0" dy="16">Sin sangrado ni hemorragia cerebral.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿QUÉ TAN GRAVE ES LA EMBOLIA?</tspan></text><polygon points="220,336.0 260,301.0 740,301.0 780,336.0 740,371.0 260,371.0" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><circle cx="282.0" cy="336.0" r="13" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="282.0" y="341.5" font-size="16" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="282.0" dy="0">?</tspan></text><text x="525.0" y="341.0" font-size="13.5" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="525.0" dy="0">Sospecha de TEP: ¿hay hipotensión o shock que no cede?</tspan></text><line x1="500.0" y1="371.0" x2="500.0" y2="391.0" stroke="#0f766e" stroke-width="2"/><line x1="190.0" y1="391.0" x2="662.0" y2="391.0" stroke="#0f766e" stroke-width="2"/><line x1="190.0" y1="391.0" x2="190.0" y2="420.0" stroke="#0f766e" stroke-width="2"/><polygon points="185.0,419.0 195.0,419.0 190.0,427.0" fill="#0f766e"/><line x1="662.0" y1="391.0" x2="662.0" y2="420.0" stroke="#ea580c" stroke-width="2"/><polygon points="657.0,419.0 667.0,419.0 662.0,427.0" fill="#ea580c"/><rect x="141.1" y="399.0" width="97.7" height="20.0" rx="10" fill="#64748b" stroke="none" stroke-width="1.5"/><text x="190.0" y="413.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">No: PA estable</tspan></text><rect x="585.3" y="399.0" width="153.3" height="20.0" rx="10" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="662.0" y="413.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="662.0" dy="0">Sí: PA 80/50, VD dilatado</tspan></text><rect x="40.0" y="427.0" width="300.0" height="101.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="428.0" width="6.0" height="99.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="451.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="270"><tspan x="58.0" dy="0">Anticoagular y estratificar</tspan></text><text x="58.0" y="472.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="270"><tspan x="58.0" dy="0">Heparina; troponina y eco para el riesgo</tspan><tspan x="58.0" dy="16">intermedio.</tspan><tspan x="58.0" dy="16">AngioTC para confirmar.</tspan></text><rect x="364.0" y="427.0" width="596.0" height="374.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="844.6" y="416.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="431.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><text x="382.0" y="453.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">Trombólisis sistémica</tspan></text><text x="382.0" y="475.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">Si no hay contraindicación y la PA no se recupera con fluidos o vasopresor.</tspan><tspan x="382.0" dy="16">Luego anticoagular y trasladar a mayor complejidad.</tspan></text><g transform="translate(532.0,511.0) scale(1.0)"><ellipse cx="82" cy="74" rx="42" ry="34" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2" /><text x="82" y="78" font-size="11" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">AD</text><text x="82" y="78" font-size="11" font-weight="800" fill="#1e3a8a" text-anchor="middle" data-max="0">AD</text><ellipse cx="184" cy="74" rx="40" ry="30" fill="#fecaca" stroke="#b91c1c" stroke-width="2" /><text x="184" y="78" font-size="11" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">AI</text><text x="184" y="78" font-size="11" font-weight="800" fill="#7f1d1d" text-anchor="middle" data-max="0">AI</text><ellipse cx="186" cy="166" rx="44" ry="54" fill="#f87171" stroke="#991b1b" stroke-width="2" /><ellipse cx="186" cy="166" rx="36" ry="46" fill="#fecaca" stroke="none" stroke-width="0" /><text x="186" y="170" font-size="12" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">VI</text><text x="186" y="170" font-size="12" font-weight="800" fill="#7f1d1d" text-anchor="middle" data-max="0">VI</text><ellipse cx="96" cy="160" rx="82" ry="74" fill="#fca5a5" stroke="#991b1b" stroke-width="2" /><ellipse cx="96" cy="160" rx="76" ry="68" fill="#bfdbfe" stroke="none" stroke-width="0" /><text x="96" y="164" font-size="12" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">VD</text><text x="96" y="164" font-size="12" font-weight="800" fill="#1e3a8a" text-anchor="middle" data-max="0">VD</text><text x="96" y="244" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">VD dilatado aplasta al VI</text><text x="96" y="244" font-size="10.5" font-weight="800" fill="#ea580c" text-anchor="middle" data-max="0">VD dilatado aplasta al VI</text></g><text x="382.0" y="783.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">Eco del caso (esquema): el VD dilatado empuja el tabique y aplasta al VI.</tspan></text><text x="40.0" y="835.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ MÁS</tspan></text><rect x="40.0" y="845.0" width="297.3" height="85.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="846.0" width="6.0" height="83.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="869.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Trombólisis</tspan></text><text x="58.0" y="890.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Alteplasa 100 mg en 2 horas.</tspan></text><rect x="237.5" y="834.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="282.9" y="849.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="282.9" dy="0">◆ ESTE CASO</tspan></text><rect x="351.3" y="845.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="846.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="869.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Si no se puede</tspan></text><text x="369.3" y="890.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Embolectomía quirúrgica o por catéter.</tspan></text><rect x="662.7" y="845.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="846.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="869.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">No esperar la angioTC</tspan></text><text x="680.7" y="890.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">El paciente inestable no se traslada a otro centro</tspan><tspan x="680.7" dy="16">antes.</tspan></text><text x="40.0" y="970.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="980.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1019.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="1011.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Heparina y derivar a</tspan><tspan x="303.8" dy="17">embolectomía</tspan></text><rect x="400.5" y="983.0" width="181.5" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="1002.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Trombólisis si no</tspan><tspan x="491.2" dy="17">responde a</tspan><tspan x="491.2" dy="17">fluidos/vasopresor</tspan></text><text x="678.8" y="1019.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Derivar para angioTC</tspan></text><text x="866.2" y="1019.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Esperar la angioTC</tspan></text><rect x="40.0" y="1051.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="1051.0" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1080.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="1072.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Omite la trombólisis</tspan><tspan x="303.8" dy="16">disponible</tspan></text><text x="491.2" y="1080.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Ninguno</tspan></text><text x="678.8" y="1080.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Traslado de un inestable</tspan></text><text x="866.2" y="1080.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Retrasa el tratamiento</tspan></text><rect x="40.0" y="980.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1125.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1153.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1175.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• TEP con hipotensión persistente pese a fluidos o vasopresor: trombólisis sistémica (alteplasa) y luego anticoagulación.</tspan><tspan x="58.0" dy="18">• Inestable: no esperar la angioTC; el eco con VD dilatado basta para decidir.</tspan><tspan x="58.0" dy="18">• Si la trombólisis está contraindicada o falla: embolectomía quirúrgica o por catéter.</tspan></text><text x="58.0" y="1233.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ESC, embolia pulmonar (2019); CHEST (2021).</tspan></text></svg>