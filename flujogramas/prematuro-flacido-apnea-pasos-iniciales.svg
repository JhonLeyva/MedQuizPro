<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="830" viewBox="0 0 1000 830" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Prematuro de 34 semanas que nace flácido y sin respirar: primero calor, secar, posicionar la vía aérea y aspirar si hace falta"><title>Prematuro de 34 semanas que nace flácido y sin respirar: primero calor, secar, posicionar la vía aérea y aspirar si hace falta</title><rect x="0.75" y="0.75" width="998.5" height="828.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Reanimación neonatal · pasos iniciales</tspan></text><rect x="431.1" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="487.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="487.5" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="148.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Reanimación neonatal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Al nacer se pregunta: ¿a término?, ¿tono?, ¿respira o llora?; si alguna es no, pasos</tspan><tspan x="58.0" dy="17">iniciales.</tspan><tspan x="58.0" dy="17">Pasos iniciales en 30 s; si sigue sin respirar o FC &lt; 100: ventilación con presión positiva en</tspan><tspan x="58.0" dy="17">el «minuto de oro».</tspan></text><rect x="620.0" y="90.0" width="340.0" height="148.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="146.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Recién nacido de 34 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Parto eutócico.</tspan><tspan x="640.0" dy="16">Nace flácido y sin esfuerzo respiratorio.</tspan></text><rect x="640.0" y="209.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="222.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="222.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="270.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ALGORITMO DE REANIMACIÓN NEONATAL</tspan></text><rect x="42.0" y="292.0" width="226.0" height="56.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="155.0" y="317.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="210"><tspan x="155.0" dy="0">30 S</tspan></text><text x="155.0" y="336.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="155.0" dy="0">Pasos iniciales</tspan></text><rect x="272.0" y="292.0" width="226.0" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="385.0" y="317.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="385.0" dy="0">60 S</tspan></text><text x="385.0" y="336.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="385.0" dy="0">Minuto de oro</tspan></text><rect x="502.0" y="292.0" width="226.0" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="317.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="615.0" dy="0">SI FC &lt; 60</tspan></text><text x="615.0" y="336.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="615.0" dy="0">Tras 30 s de VPP</tspan></text><rect x="732.0" y="292.0" width="226.0" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="845.0" y="317.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="845.0" dy="0">SI SIGUE &lt; 60</tspan></text><text x="845.0" y="336.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="845.0" dy="0"></tspan></text><rect x="109.6" y="281.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="155.0" y="296.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="155.0" dy="0">◆ ESTE CASO</tspan></text><rect x="48.0" y="362.0" width="214.0" height="108.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="155.0" y="390.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="186"><tspan x="155.0" dy="0">CALOR Y VÍA AÉREA</tspan></text><text x="155.0" y="414.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="186"><tspan x="155.0" dy="0">Secar, posicionar, aspirar si</tspan><tspan x="155.0" dy="17">hace falta</tspan><tspan x="155.0" dy="17">Este caso</tspan></text><rect x="278.0" y="362.0" width="214.0" height="108.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="385.0" y="407.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="385.0" dy="0">VPP</tspan></text><text x="385.0" y="431.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="385.0" dy="0">Si apnea o FC &lt; 100</tspan></text><rect x="508.0" y="362.0" width="214.0" height="108.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="615.0" y="407.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="615.0" dy="0">COMPRESIONES</tspan></text><text x="615.0" y="431.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="615.0" dy="0">3:1 con O₂ 100 %</tspan></text><rect x="738.0" y="362.0" width="214.0" height="108.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="845.0" y="407.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="845.0" dy="0">ADRENALINA</tspan></text><text x="845.0" y="431.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="845.0" dy="0">EV por vena umbilical</tspan></text><text x="40.0" y="510.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="520.2" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="559.7" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="523.2" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="551.2" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Calor, secar,</tspan><tspan x="285.0" dy="17">posicionar y aspirar</tspan></text><text x="435.0" y="551.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Calor y ventilación</tspan><tspan x="435.0" dy="17">a presión positiva</tspan></text><text x="585.0" y="542.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Aspirar y</tspan><tspan x="585.0" dy="17">ventilación</tspan><tspan x="585.0" dy="17">mecánica</tspan></text><text x="735.0" y="542.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Proveer oxígeno al</tspan><tspan x="735.0" dy="17">100% con cánula</tspan><tspan x="735.0" dy="17">nasal</tspan></text><text x="885.0" y="542.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Administrar</tspan><tspan x="885.0" dy="17">adrenalina</tspan><tspan x="885.0" dy="17">endovenosa</tspan></text><rect x="40.0" y="591.2" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="591.2" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="628.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué sigue?</tspan></text><text x="285.0" y="628.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: pasos iniciales</tspan></text><text x="435.0" y="620.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Siguiente paso si no</tspan><tspan x="435.0" dy="16">responde</tspan></text><text x="585.0" y="612.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: ventilación</tspan><tspan x="585.0" dy="16">mecánica no es el</tspan><tspan x="585.0" dy="16">paso</tspan></text><text x="735.0" y="620.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no respira,</tspan><tspan x="735.0" dy="16">necesita VPP</tspan></text><text x="885.0" y="620.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: solo si FC &lt; 60</tspan><tspan x="885.0" dy="16">tras VPP</tspan></text><rect x="40.0" y="520.2" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="681.2" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="709.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="731.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Calor (bolsa plástica en &lt; 32 semanas), secar, posicionar en olfateo, aspirar solo si hay secreciones, estimular.</tspan><tspan x="58.0" dy="18">• Sin respiración o FC &lt; 100: VPP con aire (21-30 % de O₂ en prematuros) a 40-60 por minuto.</tspan><tspan x="58.0" dy="18">• FC &lt; 60 tras 30 s de VPP efectiva: compresiones 3:1 y adrenalina EV.</tspan></text><text x="58.0" y="789.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AHA/ILCOR, guías de reanimación 2025, reanimación neonatal; ILCOR 2025; MINSA Perú.</tspan></text></svg>