<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1193" viewBox="0 0 1000 1193" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Un ciclo menstrual de 19 a 20 días es polimenorrea: ciclos más cortos de lo normal"><title>Un ciclo menstrual de 19 a 20 días es polimenorrea: ciclos más cortos de lo normal</title><rect x="0.75" y="0.75" width="998.5" height="1191.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ginecología · trastornos del ritmo menstrual</tspan></text><rect x="461.8" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="541.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="541.6" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ciclo menstrual normal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">FIGO 2018: ciclo de 24 a 38 días, menstruación hasta 8 días y 5 a 80 mL.</tspan><tspan x="58.0" dy="17">Los trastornos del ritmo se nombran por la frecuencia.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de nomenclatura</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer con menstruaciones cada 19 a 20 días: ¿qué</tspan><tspan x="640.0" dy="16">patrón es?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DURACIÓN DEL CICLO EN DÍAS Y PATRÓN MENSTRUAL</tspan></text><rect x="40.0" y="269.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="295.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Duración del ciclo menstrual (días)</tspan></text><text x="60.0" y="314.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Del primer día de una regla al primer día de la siguiente.</tspan></text><rect x="70.0" y="378.0" width="240.8" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="190.4" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="231"><tspan x="190.4" dy="0">Polimenorrea</tspan></text><rect x="310.8" y="378.0" width="240.8" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="431.2" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="231"><tspan x="431.2" dy="0">Ciclo normal (FIGO)</tspan></text><rect x="551.6" y="378.0" width="378.4" height="40.0" rx="6" fill="#fef9c3" stroke="#ffffff" stroke-width="2"/><text x="740.8" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#a16207" text-anchor="middle" data-max="368"><tspan x="740.8" dy="0">Oligomenorrea</tspan></text><line x1="70.0" y1="418.0" x2="70.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="70.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="70.0" dy="0">10 d</tspan></text><line x1="224.8" y1="418.0" x2="224.8" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="224.8" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="224.8" dy="0">19 d</tspan></text><line x1="310.8" y1="418.0" x2="310.8" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="310.8" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="310.8" dy="0">24 d</tspan></text><line x1="551.6" y1="418.0" x2="551.6" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="551.6" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="551.6" dy="0">38 d</tspan></text><line x1="930.0" y1="418.0" x2="930.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">60 d</tspan></text><polygon points="224.4,364.0 242.4,364.0 233.4,376.0" fill="#ea580c"/><rect x="188.3" y="338.0" width="90.2" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="233.4" y="353.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="78"><tspan x="233.4" dy="0">◆ 19-20 DÍAS</tspan></text><text x="40.0" y="486.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OTROS TÉRMINOS DE LA PREGUNTA</tspan></text><rect x="40.0" y="496.0" width="219.5" height="85.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="497.0" width="6.0" height="83.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="520.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="190"><tspan x="58.0" dy="0">Polimenorrea</tspan></text><text x="58.0" y="541.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="190"><tspan x="58.0" dy="0">Ciclos cortos; es el caso</tspan></text><rect x="273.5" y="496.0" width="219.5" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="274.5" y="497.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="291.5" y="520.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="190"><tspan x="291.5" dy="0">Oligomenorrea</tspan></text><text x="291.5" y="541.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="190"><tspan x="291.5" dy="0">Ciclos mayores de 35 días</tspan></text><rect x="507.0" y="496.0" width="219.5" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="508.0" y="497.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="525.0" y="520.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="190"><tspan x="525.0" dy="0">Menorragia e hipermenorrea</tspan></text><text x="525.0" y="541.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="190"><tspan x="525.0" dy="0">Cantidad o duración excesiva, no el</tspan><tspan x="525.0" dy="16">ritmo</tspan></text><rect x="740.5" y="496.0" width="219.5" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="741.5" y="497.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="758.5" y="520.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="190"><tspan x="758.5" dy="0">Hipomenorrea</tspan></text><text x="758.5" y="541.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="190"><tspan x="758.5" dy="0">Flujo escaso; sinequias o Asherman</tspan></text><text x="40.0" y="615.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PATRONES MENSTRUALES SEGÚN RITMO Y CANTIDAD</tspan></text><rect x="40.0" y="627.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="646.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Término</tspan></text><text x="310.0" y="646.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Qué altera</tspan></text><text x="640.0" y="646.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Definición</tspan></text><rect x="40.0" y="656.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="675.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Polimenorrea</tspan></text><text x="310.0" y="675.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Ritmo</tspan></text><text x="640.0" y="675.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Ciclos menores de 24 días (FIGO) o de 21 (textos</tspan><tspan x="640.0" dy="15">clásicos)</tspan></text><rect x="200.6" y="667.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="246.0" y="682.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="246.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="700.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="719.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Oligomenorrea</tspan></text><text x="310.0" y="719.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Ritmo</tspan></text><text x="640.0" y="719.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Ciclos mayores de 35 días</tspan></text><rect x="40.0" y="729.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="748.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Menorragia</tspan></text><text x="310.0" y="748.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Cantidad y duración</tspan></text><text x="640.0" y="748.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Sangrado regular y excesivo; hoy sangrado menstrual</tspan><tspan x="640.0" dy="15">abundante</tspan></text><rect x="40.0" y="773.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="792.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Hipermenorrea</tspan></text><text x="310.0" y="792.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Cantidad</tspan></text><text x="640.0" y="792.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Más flujo con duración normal</tspan></text><rect x="40.0" y="802.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="821.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Hipomenorrea</tspan></text><text x="310.0" y="821.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Cantidad</tspan></text><text x="640.0" y="821.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Flujo reducido; sinequias uterinas o Asherman</tspan></text><text x="40.0" y="871.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="881.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="903.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="903.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Oligomenorrea</tspan></text><text x="435.0" y="903.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Menorragia</tspan></text><rect x="513.0" y="884.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="903.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Polimenorrea</tspan></text><text x="735.0" y="903.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hipermenorrea</tspan></text><text x="885.0" y="903.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hipomenorrea</tspan></text><rect x="40.0" y="918.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="918.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="947.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Patrón de ciclos de 19</tspan><tspan x="54.0" dy="16">a 20 días?</tspan></text><text x="285.0" y="947.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: ciclos mayores de</tspan><tspan x="285.0" dy="16">35 días</tspan></text><text x="435.0" y="947.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es sangrado</tspan><tspan x="435.0" dy="16">regular y excesivo</tspan></text><text x="585.0" y="939.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: ciclos cortos,</tspan><tspan x="585.0" dy="16">menores de 21 o de 24</tspan><tspan x="585.0" dy="16">días</tspan></text><text x="735.0" y="947.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: más cantidad con</tspan><tspan x="735.0" dy="16">duración normal</tspan></text><text x="885.0" y="947.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: menor flujo</tspan><tspan x="885.0" dy="16">menstrual</tspan></text><rect x="40.0" y="881.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1008.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1036.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1058.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Polimenorrea: ciclos cortos, menores de 24 días por FIGO o menores de 21 en los textos clásicos; 19 a 20 días cumple ambos criterios.</tspan><tspan x="58.0" dy="18">• Oligomenorrea: ciclos mayores de 35 días (sangrado infrecuente); se asocia a ovario poliquístico, hiperprolactinemia y disfunción tiroidea.</tspan><tspan x="58.0" dy="18">• Menorragia (hoy sangrado menstrual abundante): regular y excesivo; hipermenorrea: más cantidad con duración normal; hipomenorrea: menos flujo</tspan><tspan x="58.0" dy="18">   (sinequias, Asherman).</tspan><tspan x="58.0" dy="18">• Estudio de la polimenorrea con PALM-COEIN: disfunción ovulatoria, fase lútea corta, patología tiroidea y causas estructurales.</tspan></text><text x="58.0" y="1152.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Munro MG et al., The two FIGO systems for normal and abnormal uterine bleeding, Int J Gynaecol Obstet 2018;143:393-408; Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>