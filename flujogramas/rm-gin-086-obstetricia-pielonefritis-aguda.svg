<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1237" viewBox="0 0 1000 1237" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Gestante de 27 semanas con fiebre, escalofríos y dolor lumbar: pielonefritis aguda"><title>Gestante de 27 semanas con fiebre, escalofríos y dolor lumbar: pielonefritis aguda</title><rect x="0.75" y="0.75" width="998.5" height="1235.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · pielonefritis aguda</tspan></text><rect x="386.6" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="466.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="466.4" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Pielonefritis aguda</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección del parénquima renal y de la pelvis.</tspan><tspan x="58.0" dy="17">Es la causa no obstétrica más frecuente de hospitalización en el embarazo.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante de 27 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Escalofríos, fiebre, náuseas y molestias urinarias.</tspan><tspan x="640.0" dy="16">Dolor lumbar y T 38 °C.</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DIAGNÓSTICO DIFERENCIAL DE LA FIEBRE CON DOLOR LUMBAR EN LA GESTANTE</tspan></text><line x1="421.1" y1="363.5" x2="340.0" y2="311.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="311.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="406.0" y1="412.5" x2="340.0" y2="411.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="411.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="386.5" x2="660.0" y2="364.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="364.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="442.6" x2="660.0" y2="464.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="464.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="420.3" y1="464.4" x2="340.0" y2="514.6" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="514.6" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="414.6" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="414.6" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="419.6" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">PIELONEFRITIS</tspan></text><text x="500.0" y="438.6" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">fiebre + dolor lumbar</tspan></text><rect x="40.0" y="269.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="270.0" width="6.0" height="82.0" rx="3" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="190.0" y="302.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">CISTITIS</tspan></text><text x="190.0" y="326.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Disuria y polaquiuria sin fiebre ni dolor lumbar</tspan></text><rect x="40.0" y="369.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="370.0" width="6.0" height="82.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="402.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">CORIOAMNIONITIS</tspan></text><text x="190.0" y="426.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Dolor uterino, taquicardia fetal y líquido fétido</tspan></text><rect x="40.0" y="469.0" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="497.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">PIELONEFRITIS AGUDA</tspan></text><text x="190.0" y="521.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Fiebre, escalofríos, dolor lumbar y puño</tspan><tspan x="190.0" dy="17">percusión</tspan></text><rect x="144.6" y="550.2" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="565.2" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="660.0" y="322.6" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="323.6" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="356.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">LITIASIS RENAL</tspan></text><text x="810.0" y="380.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Cólico con hematuria, sin escalofríos</tspan></text><rect x="660.0" y="422.6" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="423.6" width="6.0" height="82.0" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="456.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">APENDICITIS AGUDA</tspan></text><text x="810.0" y="480.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Dolor en fosa ilíaca derecha, fiebre tardía</tspan></text><text x="40.0" y="596.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="608.2" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="632.7" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Gestante con fiebre y síntomas</tspan><tspan x="142.2" dy="17">urinarios</tspan></text><line x1="248.5" y1="637.2" x2="267.5" y2="637.2" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,632.2 266.5,642.2 274.5,637.2" fill="#0f766e"/><rect x="278.5" y="608.2" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="632.7" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Dolor lumbar y puño percusión:</tspan><tspan x="380.8" dy="17">infección alta</tspan></text><line x1="487.0" y1="637.2" x2="506.0" y2="637.2" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,632.2 505.0,642.2 513.0,637.2" fill="#0f766e"/><rect x="517.0" y="608.2" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="641.2" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Urocultivo y hemocultivos</tspan></text><line x1="725.5" y1="637.2" x2="744.5" y2="637.2" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,632.2 743.5,642.2 751.5,637.2" fill="#0f766e"/><rect x="755.5" y="608.2" width="204.5" height="58.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="632.7" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Hospitalizar y ceftriaxona</tspan><tspan x="857.8" dy="17">intravenosa</tspan></text><text x="40.0" y="700.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">MANEJO DE LA PIELONEFRITIS AGUDA EN LA GESTANTE</tspan></text><rect x="40.0" y="712.2" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="731.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Etapa</tspan></text><text x="200.0" y="731.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="369"><tspan x="200.0" dy="0">Conducta</tspan></text><text x="585.0" y="731.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="369"><tspan x="585.0" dy="0">Nota</tspan></text><rect x="40.0" y="741.2" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="760.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Diagnóstico</tspan></text><text x="200.0" y="760.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="200.0" dy="0">Urocultivo y hemocultivos</tspan></text><text x="585.0" y="760.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="585.0" dy="0">Fiebre, escalofríos, dolor lumbar y puño percusión positiva</tspan></text><rect x="40.0" y="770.2" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="789.2" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Inicio</tspan></text><text x="200.0" y="789.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="200.0" dy="0">Hospitalizar, hidratar y ceftriaxona intravenosa</tspan></text><text x="585.0" y="789.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="585.0" dy="0">Vigilar el síndrome de dificultad respiratoria del adulto</tspan></text><rect x="90.6" y="773.7" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="136.0" y="788.7" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="136.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="799.2" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="818.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Paso a vía oral</tspan></text><text x="200.0" y="818.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="200.0" dy="0">Tras 24 a 48 horas sin fiebre; completar 10 a 14 días</tspan></text><text x="585.0" y="818.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="585.0" dy="0">Según el antibiograma</tspan></text><rect x="40.0" y="828.2" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="847.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Después</tspan></text><text x="200.0" y="847.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="200.0" dy="0">Nitrofurantoína supresiva hasta el parto</tspan></text><text x="585.0" y="847.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="585.0" dy="0">Evita las recaídas</tspan></text><text x="40.0" y="897.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="907.2" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="929.7" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="929.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Cistitis</tspan></text><text x="435.0" y="929.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Corioamnionitis</tspan></text><rect x="513.0" y="910.2" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="929.7" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Pielonefritis aguda</tspan></text><text x="735.0" y="929.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Litiasis renal</tspan></text><text x="885.0" y="929.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Apendicitis aguda</tspan></text><rect x="40.0" y="944.2" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="944.2" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="973.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico más</tspan><tspan x="54.0" dy="16">probable?</tspan></text><text x="285.0" y="965.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: disuria y</tspan><tspan x="285.0" dy="16">polaquiuria sin fiebre ni</tspan><tspan x="285.0" dy="16">dolor lumbar</tspan></text><text x="435.0" y="965.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: fiebre con dolor</tspan><tspan x="435.0" dy="16">uterino, líquido fétido y</tspan><tspan x="435.0" dy="16">membranas rotas</tspan></text><text x="585.0" y="973.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: fiebre, escalofríos y</tspan><tspan x="585.0" dy="16">dolor lumbar</tspan></text><text x="735.0" y="965.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: cólico intenso con</tspan><tspan x="735.0" dy="16">hematuria, sin</tspan><tspan x="735.0" dy="16">escalofríos</tspan></text><text x="885.0" y="973.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: dolor en fosa ilíaca</tspan><tspan x="885.0" dy="16">derecha, fiebre tardía</tspan></text><rect x="40.0" y="907.2" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1034.2" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1062.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1084.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Aparece en 1 a 2 % de las gestantes, sobre todo en el segundo y tercer trimestre; la favorecen la dilatación del sistema colector, la estasis y la bacteriuria</tspan><tspan x="58.0" dy="18">   asintomática sin tratar.</tspan><tspan x="58.0" dy="18">• Cuadro típico: fiebre con escalofríos, dolor lumbar, náuseas, vómitos, síntomas de cistitis y puño percusión positiva, más frecuente a la derecha.</tspan><tspan x="58.0" dy="18">• Se confirma con urocultivo y hemocultivos. Tratamiento: hospitalizar, hidratar y dar ceftriaxona intravenosa; vía oral tras 24 a 48 horas sin fiebre hasta 10</tspan><tspan x="58.0" dy="18">   a 14 días; nitrofurantoína supresiva hasta el parto.</tspan><tspan x="58.0" dy="18">• Alerta: vigilar el síndrome de dificultad respiratoria del adulto, presente hasta en 2 % de los casos.</tspan></text><text x="58.0" y="1196.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, Clinical Consensus 4 Urinary tract infections in pregnant individuals (2023); Williams Obstetricia, 26.ª ed. (2022).</tspan></text></svg>