<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1132" viewBox="0 0 1000 1132" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Arcos supraciliares palpables y dilatación detenida en 5 cm: presentación de frente, deflexión de segundo grado"><title>Arcos supraciliares palpables y dilatación detenida en 5 cm: presentación de frente, deflexión de segundo grado</title><rect x="0.75" y="0.75" width="998.5" height="1130.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · presentación de frente</tspan></text><rect x="409.2" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="488.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="488.9" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Deflexiones de la cabeza fetal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La cabeza puede estar flexionada (vértice) o deflexionada en tres grados, según la parte</tspan><tspan x="58.0" dy="17">del cráneo palpada.</tspan><tspan x="58.0" dy="17">El punto guía cambia con el grado.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Primigesta en trabajo de parto</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dilatación en 5 cm por más de 3 horas.</tspan><tspan x="640.0" dy="16">En el tacto se palpan los arcos supraciliares del feto.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SE PALPA EN EL TACTO SEGÚN EL GRADO DE DEFLEXIÓN</tspan></text><text x="44.0" y="283.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">La cabeza se extiende de menos a más; el hallazgo del caso es el segundo grado.</tspan></text><line x1="178.0" y1="322.0" x2="362.0" y2="322.0" stroke="#99f6e4" stroke-width="6"/><line x1="408.0" y1="322.0" x2="592.0" y2="322.0" stroke="#99f6e4" stroke-width="6"/><line x1="638.0" y1="322.0" x2="822.0" y2="322.0" stroke="#99f6e4" stroke-width="6"/><circle cx="155.0" cy="322.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="155.0" y="326.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="155.0" dy="0">Vért.</tspan></text><rect x="45.0" y="356.0" width="220.0" height="75.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="155.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="155.0" dy="0">Flexionada</tspan></text><text x="155.0" y="393.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="155.0" dy="0">Occipucio y fontanela posterior: la más</tspan><tspan x="155.0" dy="16">común</tspan></text><circle cx="385.0" cy="322.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="385.0" y="326.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="385.0" dy="0">I</tspan></text><rect x="275.0" y="356.0" width="220.0" height="75.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="385.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="385.0" dy="0">Bregmática</tspan></text><text x="385.0" y="393.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="385.0" dy="0">Fontanela anterior como punto guía</tspan></text><circle cx="615.0" cy="322.0" r="22" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><text x="615.0" y="326.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="38"><tspan x="615.0" dy="0">II</tspan></text><rect x="505.0" y="356.0" width="220.0" height="75.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="615.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="208"><tspan x="615.0" dy="0">De frente</tspan></text><text x="615.0" y="393.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="615.0" dy="0">Arcos supraciliares y raíz nasal: este</tspan><tspan x="615.0" dy="16">caso</tspan></text><rect x="565.4" y="420.0" width="99.1" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="615.0" y="435.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="615.0" dy="0">◆ DEFLEXIÓN II</tspan></text><circle cx="845.0" cy="322.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="845.0" y="326.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="845.0" dy="0">III</tspan></text><rect x="735.0" y="356.0" width="220.0" height="75.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="845.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="845.0" dy="0">De cara</tspan></text><text x="845.0" y="393.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="845.0" dy="0">Mentón, boca y pómulos</tspan></text><rect x="40.0" y="463.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="489.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Arcos supraciliares = presentación de frente, II grado</tspan></text><text x="60.0" y="508.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La bregmática es de I grado y la de cara de III; la compuesta es otra situación.</tspan></text><text x="40.0" y="569.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEFLEXIONES DE LA PRESENTACIÓN CEFÁLICA</tspan></text><rect x="40.0" y="581.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="600.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">Grado</tspan></text><text x="175.0" y="600.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="249"><tspan x="175.0" dy="0">Nombre</tspan></text><text x="440.0" y="600.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="249"><tspan x="440.0" dy="0">Qué se palpa</tspan></text><text x="705.0" y="600.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="249"><tspan x="705.0" dy="0">Conducta</tspan></text><rect x="40.0" y="610.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="629.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">I</tspan></text><text x="175.0" y="629.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="175.0" dy="0">Bregmática</tspan></text><text x="440.0" y="629.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="440.0" dy="0">Fontanela anterior</tspan></text><text x="705.0" y="629.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="705.0" dy="0">Parto vaginal posible, con vigilancia</tspan></text><rect x="40.0" y="639.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="658.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">II</tspan></text><text x="175.0" y="658.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="175.0" dy="0">De frente</tspan></text><text x="440.0" y="658.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="440.0" dy="0">Arcos supraciliares y raíz nasal</tspan></text><text x="705.0" y="658.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="705.0" dy="0">Si persiste: cesárea; el diámetro de 13,5 cm</tspan><tspan x="705.0" dy="15">impide el encajamiento</tspan></text><rect x="65.6" y="650.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="111.0" y="665.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="111.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="683.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="702.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">III</tspan></text><text x="175.0" y="702.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="175.0" dy="0">De cara</tspan></text><text x="440.0" y="702.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="440.0" dy="0">Mentón, boca y pómulos</tspan></text><text x="705.0" y="702.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="249"><tspan x="705.0" dy="0">Conducta según la posición del mentón</tspan></text><text x="40.0" y="728.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">La presentación de frente persistente no permite el parto vaginal.</tspan></text><text x="40.0" y="775.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="785.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="816.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="788.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="807.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Deflexión de II</tspan><tspan x="285.0" dy="17">grado</tspan></text><text x="435.0" y="807.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Presentación</tspan><tspan x="435.0" dy="17">bregmática</tspan></text><text x="585.0" y="816.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Deflexión de I grado</tspan></text><text x="735.0" y="807.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Deflexión de III</tspan><tspan x="735.0" dy="17">grado</tspan></text><text x="885.0" y="807.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Presentación</tspan><tspan x="885.0" dy="17">compuesta</tspan></text><rect x="40.0" y="839.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="839.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="876.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="868.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: arcos supraciliares</tspan><tspan x="285.0" dy="16">y raíz nasal</tspan></text><text x="435.0" y="868.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: se palparía la</tspan><tspan x="435.0" dy="16">fontanela anterior</tspan></text><text x="585.0" y="860.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: bregmática; el</tspan><tspan x="585.0" dy="16">comentario del libro la</tspan><tspan x="585.0" dy="16">confunde</tspan></text><text x="735.0" y="860.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: se palparían</tspan><tspan x="735.0" dy="16">mentón, boca y</tspan><tspan x="735.0" dy="16">pómulos</tspan></text><text x="885.0" y="868.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: una extremidad</tspan><tspan x="885.0" dy="16">acompaña a la cabeza</tspan></text><rect x="40.0" y="785.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="929.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="957.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="979.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• I grado o bregmática: fontanela anterior. II grado o de frente: arcos supraciliares y raíz nasal. III grado o de cara: mentón, boca y pómulos.</tspan><tspan x="58.0" dy="18">• La de frente es la más inestable y rara (cerca de 1 por 3000 partos): presenta el mayor diámetro, el occipitomentoniano de 13,5 cm, y no encaja en una</tspan><tspan x="58.0" dy="18">   pelvis normal.</tspan><tspan x="58.0" dy="18">• Si persiste, el parto vaginal es imposible y se indica cesárea; a veces se convierte de forma espontánea en vértice o cara.</tspan><tspan x="58.0" dy="18">• La presentación compuesta es la de una extremidad que acompaña a la cabeza. Ante una detención de la dilatación se revisa la actitud de la cabeza con</tspan><tspan x="58.0" dy="18">   un tacto cuidadoso.</tspan></text><text x="58.0" y="1091.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Williams Obstetricia 26.ª ed. (2022); ACOG y SMFM, Obstetric Care Consensus 1, Safe prevention of the primary cesarean delivery. Obstet Gynecol 2014;123:693-711.</tspan></text></svg>