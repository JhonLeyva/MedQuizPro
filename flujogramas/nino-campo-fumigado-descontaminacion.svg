<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1101" viewBox="0 0 1000 1101" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Niño que recoge fruta en un campo fumigado y presenta vómitos, disnea y temblores: lo primero es quitar la ropa y bañarlo"><title>Niño que recoge fruta en un campo fumigado y presenta vómitos, disnea y temblores: lo primero es quitar la ropa y bañarlo</title><rect x="0.75" y="0.75" width="998.5" height="1099.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Toxicología · intoxicación por organofosforados y carbamatos</tspan></text><rect x="566.8" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="623.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="623.3" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Intoxicación por plaguicidas inhibidores de la colinesterasa</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Organofosforados y carbamatos se absorben por la piel, la vía aérea y la boca.</tspan><tspan x="58.0" dy="17">Mientras quede plaguicida en la piel o la ropa, la intoxicación sigue.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 6 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Recogía fruta en un campo fumigado.</tspan><tspan x="640.0" dy="16">Vómitos, disnea y temblores bruscos.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ORDEN DE LA ATENCIÓN</tspan></text><rect x="42.0" y="279.0" width="226.0" height="56.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="155.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="210"><tspan x="155.0" dy="0">1.º</tspan></text><text x="155.0" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="155.0" dy="0">En la puerta</tspan></text><rect x="272.0" y="279.0" width="226.0" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="385.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="385.0" dy="0">2.º</tspan></text><text x="385.0" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="385.0" dy="0">Minutos</tspan></text><rect x="502.0" y="279.0" width="226.0" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="615.0" dy="0">3.º</tspan></text><text x="615.0" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="615.0" dy="0">Minutos</tspan></text><rect x="732.0" y="279.0" width="226.0" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="845.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="845.0" dy="0">4.º</tspan></text><text x="845.0" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="845.0" dy="0">Si hace falta</tspan></text><rect x="109.6" y="268.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="155.0" y="283.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="155.0" dy="0">◆ ESTE CASO</tspan></text><rect x="48.0" y="349.0" width="214.0" height="108.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="155.0" y="377.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="186"><tspan x="155.0" dy="0">DESCONTAMINAR</tspan></text><text x="155.0" y="401.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="186"><tspan x="155.0" dy="0">Quitar la ropa, baño con agua y</tspan><tspan x="155.0" dy="17">jabón</tspan><tspan x="155.0" dy="17">Personal con guantes</tspan></text><rect x="278.0" y="349.0" width="214.0" height="108.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="385.0" y="394.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="385.0" dy="0">ABC</tspan></text><text x="385.0" y="418.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="385.0" dy="0">Oxígeno, aspirar secreciones</tspan></text><rect x="508.0" y="349.0" width="214.0" height="108.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="615.0" y="386.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="615.0" dy="0">ATROPINA</tspan></text><text x="615.0" y="410.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="615.0" dy="0">Dosis crecientes hasta secar los</tspan><tspan x="615.0" dy="17">bronquios</tspan></text><rect x="738.0" y="349.0" width="214.0" height="108.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="845.0" y="394.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="845.0" dy="0">SOPORTE</tspan></text><text x="845.0" y="418.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="845.0" dy="0">Benzodiacepina si convulsiona</tspan></text><text x="40.0" y="497.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SIGNOS CON NOMBRE PROPIO</tspan></text><rect x="40.0" y="509.2" width="920.0" height="265.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><line x1="782.0" y1="591.2" x2="938.0" y2="591.2" stroke="#0f766e" stroke-width="2"/><line x1="782.0" y1="591.2" x2="782.0" y2="599.2" stroke="#0f766e" stroke-width="2"/><line x1="938.0" y1="591.2" x2="938.0" y2="599.2" stroke="#0f766e" stroke-width="2"/><rect x="762.6" y="579.2" width="187.4" height="24.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/><text x="856.3" y="595.2" font-size="10.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="173"><tspan x="856.3" dy="0">NICOTÍNICO · 1 de 1 en el caso</tspan></text><line x1="62.0" y1="551.2" x2="758.0" y2="551.2" stroke="#64748b" stroke-width="2"/><line x1="62.0" y1="551.2" x2="62.0" y2="559.2" stroke="#64748b" stroke-width="2"/><line x1="758.0" y1="551.2" x2="758.0" y2="559.2" stroke="#64748b" stroke-width="2"/><rect x="305.4" y="539.2" width="209.3" height="24.0" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/><text x="410.0" y="555.2" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="195"><tspan x="410.0" dy="0">MUSCARÍNICOS · 2 de 4 en el caso</tspan></text><rect x="56.0" y="611.2" width="168.0" height="116.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="76.0" cy="634.2" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="76.0" y="638.2" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="76.0" dy="0">1</tspan></text><text x="94.0" y="639.2" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="122"><tspan x="94.0" dy="0">Vómitos</tspan></text><text x="68.0" y="665.2" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="144"><tspan x="68.0" dy="0">Sí</tspan></text><rect x="68.0" y="693.2" width="144.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="140.0" y="708.2" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="132"><tspan x="140.0" dy="0">✓ EN EL CASO</tspan></text><rect x="236.0" y="611.2" width="168.0" height="116.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="256.0" cy="634.2" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="256.0" y="638.2" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="256.0" dy="0">2</tspan></text><text x="274.0" y="639.2" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="122"><tspan x="274.0" dy="0">Broncorrea /</tspan><tspan x="274.0" dy="17">disnea</tspan></text><text x="248.0" y="677.2" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="144"><tspan x="248.0" dy="0">Disnea</tspan></text><rect x="248.0" y="693.2" width="144.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="320.0" y="708.2" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="132"><tspan x="320.0" dy="0">✓ EN EL CASO</tspan></text><rect x="416.0" y="611.2" width="168.0" height="116.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="436.0" cy="634.2" r="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="436.0" y="638.2" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="436.0" dy="0">3</tspan></text><text x="454.0" y="639.2" font-size="12.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="start" data-max="122"><tspan x="454.0" dy="0">Miosis</tspan></text><text x="428.0" y="665.2" font-size="11.5" font-weight="400" font-style="normal" fill="#64748b" text-anchor="start" data-max="144"><tspan x="428.0" dy="0">No se menciona</tspan></text><rect x="428.0" y="693.2" width="144.0" height="22.0" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/><text x="500.0" y="708.2" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="132"><tspan x="500.0" dy="0">— NO DESCRITO</tspan></text><rect x="596.0" y="611.2" width="168.0" height="116.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="616.0" cy="634.2" r="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="616.0" y="638.2" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="616.0" dy="0">4</tspan></text><text x="634.0" y="639.2" font-size="12.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="start" data-max="122"><tspan x="634.0" dy="0">Sialorrea, lagrimeo</tspan></text><text x="608.0" y="665.2" font-size="11.5" font-weight="400" font-style="normal" fill="#64748b" text-anchor="start" data-max="144"><tspan x="608.0" dy="0">No se menciona</tspan></text><rect x="608.0" y="693.2" width="144.0" height="22.0" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/><text x="680.0" y="708.2" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="132"><tspan x="680.0" dy="0">— NO DESCRITO</tspan></text><rect x="776.0" y="611.2" width="168.0" height="116.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="796.0" cy="634.2" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="796.0" y="638.2" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="796.0" dy="0">5</tspan></text><text x="814.0" y="639.2" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="122"><tspan x="814.0" dy="0">Temblores,</tspan><tspan x="814.0" dy="17">fasciculaciones</tspan></text><text x="788.0" y="677.2" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="144"><tspan x="788.0" dy="0">Temblores</tspan></text><rect x="788.0" y="693.2" width="144.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="860.0" y="708.2" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="132"><tspan x="860.0" dy="0">✓ EN EL CASO</tspan></text><text x="56.0" y="754.2" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">Exposición en un campo fumigado + signos colinérgicos: descontaminar ya.</tspan></text><text x="40.0" y="814.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="824.2" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="855.2" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="855.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Anticonvulsivantes</tspan></text><rect x="363.0" y="827.2" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="855.2" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Baño corporal</tspan></text><text x="585.0" y="846.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Reposición</tspan><tspan x="585.0" dy="17">electrolítica</tspan></text><text x="735.0" y="846.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Prescribir</tspan><tspan x="735.0" dy="17">antieméticos</tspan></text><text x="885.0" y="846.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Lavado gástrico</tspan><tspan x="885.0" dy="17">inmediato</tspan></text><rect x="40.0" y="878.2" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="878.2" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="907.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Primera medida?</tspan></text><text x="285.0" y="907.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Solo si convulsiona</tspan></text><text x="435.0" y="899.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: corta la absorción</tspan><tspan x="435.0" dy="16">por la piel</tspan></text><text x="585.0" y="907.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Útil, pero después</tspan></text><text x="735.0" y="907.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No trata la causa</tspan></text><text x="885.0" y="899.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: la vía fue la piel,</tspan><tspan x="885.0" dy="16">no la boca</tspan></text><rect x="40.0" y="824.2" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="952.2" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="980.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1002.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Descontaminar con guantes: quitar la ropa (en bolsa cerrada) y lavar piel y pelo con agua y jabón.</tspan><tspan x="58.0" dy="18">• A la vez: vía aérea, oxígeno, aspirar secreciones; atropina hasta secar los bronquios.</tspan><tspan x="58.0" dy="18">• Benzodiacepina si convulsiona; el lavado gástrico no sirve si la exposición fue por la piel.</tspan></text><text x="58.0" y="1060.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Goldfrank's Toxicologic Emergencies 11.ª ed.; OMS, manejo clínico de la intoxicación por plaguicidas; MINSA Perú.</tspan></text></svg>