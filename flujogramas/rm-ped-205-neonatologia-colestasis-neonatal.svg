<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1277" viewBox="0 0 1000 1277" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Ictericia, coluria y acolia desde las 3 semanas con hepatomegalia y hematoma: atresia de vías biliares"><title>Ictericia, coluria y acolia desde las 3 semanas con hepatomegalia y hematoma: atresia de vías biliares</title><rect x="0.75" y="0.75" width="998.5" height="1275.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neonatología · colestasis neonatal</tspan></text><rect x="404.4" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="453.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="453.4" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Atresia de vías biliares</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Colangiopatía fibroobliterante progresiva de los conductos biliares extra e intrahepáticos.</tspan><tspan x="58.0" dy="17">Primera causa de colestasis neonatal quirúrgica y de trasplante hepático pediátrico.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 6 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Tres semanas de ictericia, orinas oscuras y</tspan><tspan x="640.0" dy="16">deposiciones claras.</tspan><tspan x="640.0" dy="16">Hepatomegalia y hematoma tras la vacuna; sano y con</tspan><tspan x="640.0" dy="16">buena ganancia de peso.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ATRESIA DE VÍAS BILIARES FRENTE A LAS OTRAS OPCIONES</tspan></text><rect x="493.0" y="351.0" width="14" height="190" rx="5" fill="#64748b"/><path d="M440.0 556.0 H560.0 L540.0 536.0 H460.0 Z" fill="#475569"/><circle cx="500.0" cy="351.0" r="15" fill="#f59e0b" stroke="#92400e" stroke-width="2"/><line x1="385.4" y1="369.1" x2="614.6" y2="332.9" stroke="#334155" stroke-width="7" stroke-linecap="round"/><line x1="385.4" y1="369.1" x2="357.4" y2="431.1" stroke="#64748b" stroke-width="2"/><line x1="385.4" y1="369.1" x2="413.4" y2="431.1" stroke="#64748b" stroke-width="2"/><path d="M347.4 431.1 H423.4 Q385.4 475.1 347.4 431.1 Z" fill="#ea580c"/><text x="385.4" y="446.1" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="385.4" dy="0">COLESTASIS</tspan></text><line x1="614.6" y1="332.9" x2="586.6" y2="394.9" stroke="#64748b" stroke-width="2"/><line x1="614.6" y1="332.9" x2="642.6" y2="394.9" stroke="#64748b" stroke-width="2"/><path d="M576.6 394.9 H652.6 Q614.6 438.9 576.6 394.9 Z" fill="#64748b"/><text x="614.6" y="409.9" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="614.6" dy="0">OTRAS</tspan></text><text x="500.0" y="583.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="300"><tspan x="500.0" dy="0">¿Qué diagnóstico explica el cuadro?</tspan></text><rect x="40.0" y="321.0" width="290.0" height="158.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><text x="58.0" y="349.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="254"><tspan x="58.0" dy="0">Atresia de vías biliares (este caso)</tspan></text><circle cx="62.0" cy="374.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="378.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Ictericia con bilirrubina directa elevada</tspan></text><circle cx="62.0" cy="400.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="404.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Acolia y coluria</tspan></text><circle cx="62.0" cy="426.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="430.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Hepatomegalia firme</tspan></text><circle cx="62.0" cy="452.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="456.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Coagulopatía por déficit de vitamina K</tspan></text><rect x="214.6" y="310.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="260.0" y="325.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="260.0" dy="0">◆ ESTE CASO</tspan></text><rect x="670.0" y="321.0" width="290.0" height="180.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="688.0" y="349.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="688.0" dy="0">Otras opciones</tspan></text><circle cx="692.0" cy="374.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="378.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Galactosemia: vómitos, sepsis por E. coli y</tspan><tspan x="704.0" dy="16">cataratas</tspan></text><circle cx="692.0" cy="416.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="420.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Ictericia fisiológica y de leche materna:</tspan><tspan x="704.0" dy="16">indirectas</tspan></text><circle cx="692.0" cy="458.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="462.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Estenosis pilórica: vómitos en proyectil sin</tspan><tspan x="704.0" dy="16">ictericia</tspan></text><rect x="40.0" y="617.0" width="920.0" height="93.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="645.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Colestasis directa + acolia + coluria = atresia de vías biliares</tspan></text><text x="500.0" y="666.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Las ictericias indirectas no cursan con acolia ni coluria.</tspan><tspan x="500.0" dy="17">Se corrige con la portoenterostomía de Kasai, idealmente antes de los 60 días.</tspan></text><text x="40.0" y="744.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ICTERICIA DEL LACTANTE SEGÚN EL TIPO DE BILIRRUBINA</tspan></text><rect x="40.0" y="756.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="775.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Causa</tspan></text><text x="300.0" y="775.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Bilirrubina</tspan></text><text x="635.0" y="775.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Heces y orina</tspan></text><rect x="40.0" y="785.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="804.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Atresia de vías biliares</tspan></text><text x="300.0" y="804.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Directa elevada</tspan></text><text x="635.0" y="804.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Acolia y coluria</tspan></text><rect x="190.6" y="788.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="236.0" y="803.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="236.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="814.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="833.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Galactosemia</tspan></text><text x="300.0" y="833.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Directa, con vómitos y sepsis por E. coli</tspan></text><text x="635.0" y="833.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Cataratas desde la primera semana</tspan></text><rect x="40.0" y="843.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="862.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Ictericia fisiológica</tspan></text><text x="300.0" y="862.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Indirecta</tspan></text><text x="635.0" y="862.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Heces y orina normales</tspan></text><rect x="40.0" y="872.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="891.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Ictericia por leche materna</tspan></text><text x="300.0" y="891.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Indirecta</tspan></text><text x="635.0" y="891.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Heces y orina normales</tspan></text><text x="40.0" y="941.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="951.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="982.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="982.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Galactosemia</tspan></text><rect x="363.0" y="954.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="973.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Atresia de vías</tspan><tspan x="435.0" dy="17">biliares</tspan></text><text x="585.0" y="982.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Ictericia fisiológica</tspan></text><text x="735.0" y="982.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Estenosis pilórica</tspan></text><text x="885.0" y="973.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Ictericia por leche</tspan><tspan x="885.0" dy="17">materna</tspan></text><rect x="40.0" y="1005.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="1005.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1042.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico probable?</tspan></text><text x="285.0" y="1026.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: cursa con vómitos,</tspan><tspan x="285.0" dy="16">sepsis por E. coli y</tspan><tspan x="285.0" dy="16">cataratas</tspan></text><text x="435.0" y="1034.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: colestasis directa</tspan><tspan x="435.0" dy="16">con acolia y coluria</tspan></text><text x="585.0" y="1034.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es indirecta y sin</tspan><tspan x="585.0" dy="16">acolia ni coluria</tspan></text><text x="735.0" y="1034.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: vómitos en</tspan><tspan x="735.0" dy="16">proyectil sin ictericia</tspan></text><text x="885.0" y="1034.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es indirecta y sin</tspan><tspan x="885.0" dy="16">acolia ni coluria</tspan></text><rect x="40.0" y="951.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1095.0" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1123.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1145.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Bilirrubina directa mayor de 1 mg/dL, acolia, coluria y hepatomegalia firme en un lactante sano orientan a atresia.</tspan><tspan x="58.0" dy="18">• El hematoma tras la vacuna intramuscular refleja déficit de vitamina K por malabsorción de grasas en la colestasis.</tspan><tspan x="58.0" dy="18">• Hoy se corrige con la portoenterostomía de Kasai, con mejores resultados si se hace antes de los 60 días de vida.</tspan><tspan x="58.0" dy="18">• Alerta: toda ictericia de más de 2 semanas exige bilirrubina directa; la tarjeta colorimétrica de heces ayuda al tamizaje.</tspan></text><text x="58.0" y="1221.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Fawaz R et al. Guideline for the evaluation of cholestatic jaundice in infants. NASPGHAN/ESPGHAN. J Pediatr Gastroenterol Nutr 2017;64:154-168; Nelson Tratado de</tspan><tspan x="58.0" dy="15">Pediatría 22.ª ed. (2024).</tspan></text></svg>