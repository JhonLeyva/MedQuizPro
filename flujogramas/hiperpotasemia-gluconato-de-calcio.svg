<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="652" viewBox="0 0 1000 652" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Hiperpotasemia con cambios en el ECG"><title>Hiperpotasemia con cambios en el ECG</title><rect x="0.75" y="0.75" width="998.5" height="650.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16" y="16" width="968" height="68" rx="10" fill="#0f766e"/><text x="36" y="57.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170" y1="40.0" x2="170" y2="60.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="46.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="572"><tspan x="184.0" dy="0">NEFROLOGÍA Y UROLOGÍA ENAM: HIPERPOTASEMIA CON CAMBIOS EN EL</tspan><tspan x="184.0" dy="16">ECG</tspan></text><rect x="776.3" y="38.0" width="187.7" height="24" rx="12" fill="#134e4a"/><text x="870.1" y="54.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="172"><tspan x="870.1" dy="0">NEFROLOGÍA Y UROLOGÍA</tspan></text><rect x="190.0" y="102.0" width="620" height="86.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="500.0" y="130.5" font-size="14.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Varón de 67 años con ERC 4 que toma enalapril y</tspan><tspan x="500.0" dy="19.0">espironolactona</tspan></text><text x="500.0" y="172.0" font-size="12" font-weight="400" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">K 7.2 mEq/L · ECG con T picudas y QRS ancho</tspan></text><line x1="500.0" y1="188.0" x2="500.0" y2="207.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,206.0 505.0,206.0 500.0,214.0" fill="#0f766e"/><rect x="40.0" y="214.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="62.0" cy="238.0" r="13" fill="#0f766e"/><text x="62.0" y="243.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><rect x="74.0" y="214.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="88.0" y="241.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="88.0" dy="0">Estabilizar</tspan></text><text x="88.0" y="264.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="88.0" dy="0">Gluconato de calcio 10 % EV:</tspan><tspan x="88.0" dy="17">protege el miocardio</tspan></text><line x1="335.0" y1="255.5" x2="345.0" y2="255.5" stroke="#0f766e" stroke-width="2"/><polygon points="344.0,250.5 344.0,260.5 352.0,255.5" fill="#0f766e"/><rect x="354.0" y="214.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="376.0" cy="238.0" r="13" fill="#0f766e"/><text x="376.0" y="243.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="376.0" dy="0">2</tspan></text><rect x="388.0" y="214.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="402.0" y="241.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="402.0" dy="0">Redistribuir</tspan></text><text x="402.0" y="264.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="402.0" dy="0">Insulina + dextrosa EV y</tspan><tspan x="402.0" dy="17">salbutamol nebulizado</tspan></text><line x1="649.0" y1="255.5" x2="659.0" y2="255.5" stroke="#0f766e" stroke-width="2"/><polygon points="658.0,250.5 658.0,260.5 666.0,255.5" fill="#0f766e"/><rect x="668.0" y="214.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="690.0" cy="238.0" r="13" fill="#0f766e"/><text x="690.0" y="243.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="690.0" dy="0">3</tspan></text><rect x="702.0" y="214.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="716.0" y="241.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="716.0" dy="0">Eliminar</tspan></text><text x="716.0" y="264.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="716.0" dy="0">Furosemida, quelantes de</tspan><tspan x="716.0" dy="17">potasio o diálisis</tspan></text><line x1="500.0" y1="297.0" x2="500.0" y2="316.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#0f766e"/><rect x="197.0" y="323.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="219.0" cy="347.0" r="13" fill="#0f766e"/><text x="219.0" y="352.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="219.0" dy="0">4</tspan></text><rect x="231.0" y="323.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="245.0" y="350.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="245.0" dy="0">Suspender</tspan></text><text x="245.0" y="373.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="245.0" dy="0">IECA, espironolactona y otros</tspan><tspan x="245.0" dy="17">fármacos que lo elevan</tspan></text><line x1="492.0" y1="364.5" x2="502.0" y2="364.5" stroke="#0f766e" stroke-width="2"/><polygon points="501.0,359.5 501.0,369.5 509.0,364.5" fill="#0f766e"/><rect x="511.0" y="323.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="533.0" cy="347.0" r="13" fill="#0f766e"/><text x="533.0" y="352.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="533.0" dy="0">5</tspan></text><rect x="545.0" y="323.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="559.0" y="350.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="559.0" dy="0">Monitorizar</tspan></text><text x="559.0" y="373.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="559.0" dy="0">ECG continuo y potasio seriado</tspan></text><line x1="500.0" y1="406.0" x2="500.0" y2="425.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,424.0 505.0,424.0 500.0,432.0" fill="#0f766e"/><rect x="90.0" y="432.0" width="820" height="67.5" rx="10" fill="#134e4a" stroke="#134e4a" stroke-width="1.5"/><text x="500.0" y="458.0" font-size="12" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="792"><tspan x="500.0" dy="0">PRIMERA MEDIDA</tspan></text><text x="500.0" y="483.5" font-size="15" font-weight="400" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="792"><tspan x="500.0" dy="0">Gluconato de calcio endovenoso</tspan></text><rect x="40" y="525.5" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="553.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="575.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El calcio no baja el potasio: solo estabiliza la membrana en minutos.</tspan><tspan x="58.0" dy="18">• QRS ancho u onda sinusoidal = riesgo inminente de paro.</tspan></text><text x="58.0" y="615.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: UK Kidney Association 2023 Hyperkalaemia Guideline · KDIGO · Harrison 21.ª ed.</tspan></text></svg>
