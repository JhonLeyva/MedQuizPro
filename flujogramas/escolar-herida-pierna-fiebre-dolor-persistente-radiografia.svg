"middle" data-max="128"><tspan x="585.0" dy="0">Sí: muestra el daño</tspan><tspan x="585.0" dy="16">óseo</tspan></text><text x="735.0" y="1028.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Inespecífico</tspan></text><text x="885.0" y="1020.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no hay sospecha</tspan><tspan x="885.0" dy="16">de trombosis</tspan></text><rect x="40.0" y="945.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1073.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1101.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1123.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Rx de pierna: reacción perióstica, lisis o absceso de Brodie (subaguda).</tspan><tspan x="58.0" dy="18">• RM si la Rx no es concluyente; PCR y VSG para seguir la evolución.</tspan><tspan x="58.0" dy="18">• Antibiótico antiestafilocócico 4-6 semanas; drenaje si hay absceso o secuestro.</tspan></text><text x="58.0" y="1181.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: IDSA/PIDS, osteomielitis aguda hematógena en niños (2021); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>