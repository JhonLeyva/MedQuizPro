<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1222" viewBox="0 0 1000 1222" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Niño con herida en la pierna que luego tiene celulitis, fiebre y cojera, y tras antibiótico persiste el dolor: sospecha de osteomielitis, Rx de pierna para el seguimiento"><title>Niño con herida en la pierna que luego tiene celulitis, fiebre y cojera, y tras antibiótico persiste el dolor: sospecha de osteomielitis, Rx de pierna para el seguimiento</title><rect x="0.75" y="0.75" width="998.5" height="1220.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Osteomielitis en niños</tspan></text><rect x="333.3" y="32.0" width="150.2" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="408.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="134"><tspan x="408.4" dy="0">TRAUMATOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Osteomielitis</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección del hueso (en niños, sobre todo por S. aureus) por vía sanguínea o por</tspan><tspan x="58.0" dy="17">contigüidad desde una herida.</tspan><tspan x="58.0" dy="17">La Rx al inicio es normal: los cambios óseos aparecen a los 10-14 días; por eso sirve para</tspan><tspan x="58.0" dy="17">el seguimiento (la RM detecta antes).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Escolar de 7 años, zona rural</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Herida en la pantorrilla al caer de un árbol.</tspan><tspan x="640.0" dy="16">A las 2 semanas: eritema caliente, cojera y fiebre;</tspan><tspan x="640.0" dy="16">mejora con antibiótico, pero persiste el dolor.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ EXAMEN VE QUÉ Y CUÁNDO</tspan></text><rect x="40.0" y="285.0" width="350.0" height="350.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="295.0" width="61.2" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">EL NIÑO</tspan></text><g data-box="50.0 321.0 330.0 300.0"><g transform="translate(120.0,321.0) scale(0.8)"><circle cx="110" cy="56" r="42" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="95" cy="52" r="3.5" fill="#334155" stroke="none" stroke-width="0" /><circle cx="125" cy="52" r="3.5" fill="#334155" stroke="none" stroke-width="0" /><path d="M100 74 Q110 80 120 74" fill="none" stroke="#9a6b52" stroke-width="2"/><rect x="102" y="96" width="16" height="10" fill="#fde7d4" stroke="#e9b48f" stroke-width="2"/><path d="M74.0 106 H146.0 L150.0 170 H70.0 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70.0 170 H150.0 C154 206 148.0 222 144.0 232 H76.0 C72.0 222 66 206 70.0 170 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M74.0 110 L50.0 120 L40.0 214 L56.0 216 L70.0 150 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M146.0 110 L170.0 120 L180.0 214 L164.0 216 L150.0 150 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><circle cx="48.0" cy="224" r="10" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="172.0" cy="224" r="10" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M80 232 H106 L104 364 H84 Z" fill="#fecaca" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M114 232 H140 L136 364 H116 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="