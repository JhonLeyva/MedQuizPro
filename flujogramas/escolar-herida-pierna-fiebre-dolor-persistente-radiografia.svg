dema óseo en 3-5 días</tspan></text><rect x="410.0" y="443.0" width="550.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="411.0" y="444.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="428.0" y="467.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">PCR / VSG</tspan></text><text x="428.0" y="488.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="522"><tspan x="428.0" dy="0">Siguen la evolución con el antibiótico</tspan></text><text x="40.0" y="669.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DÍAS DESDE EL INICIO DE LA INFECCIÓN</tspan></text><line x1="350.0" y1="701.0" x2="350.0" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="434.9" y1="701.0" x2="434.9" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="519.7" y1="701.0" x2="519.7" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="604.6" y1="701.0" x2="604.6" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="689.4" y1="701.0" x2="689.4" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="774.3" y1="701.0" x2="774.3" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="859.1" y1="701.0" x2="859.1" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><line x1="944.0" y1="701.0" x2="944.0" y2="855.0" stroke="#e2e8f0" stroke-width="1"/><text x="50.0" y="720.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Partes blandas (celulitis)</tspan></text><text x="50.0" y="734.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">clínica</tspan></text><rect x="350.0" y="712.0" width="84.9" height="20.0" rx="10" fill="#94a3b8" stroke="none" stroke-width="0"