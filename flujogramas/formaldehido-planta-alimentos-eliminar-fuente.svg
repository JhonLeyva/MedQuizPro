<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1045" viewBox="0 0 1000 1045" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Planta con trabajadores irritados por formaldehído, sin protección y con mala ventilación: la medida prioritaria es eliminar o reducir la fuente"><title>Planta con trabajadores irritados por formaldehído, sin protección y con mala ventilación: la medida prioritaria es eliminar o reducir la fuente</title><rect x="0.75" y="0.75" width="998.5" height="1043.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Salud ocupacional · control de riesgos</tspan></text><rect x="428.3" y="32.0" width="143.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="127"><tspan x="500.0" dy="0">SALUD PÚBLICA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Jerarquía de controles</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">De más a menos eficaz: eliminar, sustituir, controles de ingeniería, controles administrativos</tspan><tspan x="58.0" dy="17">y EPP.</tspan><tspan x="58.0" dy="17">El equipo de protección personal es la última barrera, no la primera.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Planta de alimentos</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Irritación ocular, tos y disnea en trabajadores.</tspan><tspan x="640.0" dy="16">Formaldehído alto, sin protección respiratoria y mala</tspan><tspan x="640.0" dy="16">ventilación.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">JERARQUÍA DE CONTROLES (DE MÁS A MENOS EFICAZ)</tspan></text><polygon points="200.0,285.0 300.0,285.0 332.0,341.0 168.0,341.0" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="318.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="88"><tspan x="250.0" dy="0">ELIMINAR</tspan></text><rect x="486.0" y="285.0" width="474.0" height="56.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="501.0" y="309.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Eliminar o reducir la fuente</tspan></text><text x="501.0" y="326.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Quitar el formaldehído o encerrar el proceso</tspan></text><rect x="858.2" y="274.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="903.6" y="289.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="903.6" dy="0">◆ ESTE CASO</tspan></text><polygon points="168.0,347.0 332.0,347.0 364.0,403.0 136.0,403.0" fill="#99f6e4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="380.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="152"><tspan x="250.0" dy="0">SUSTITUIR</tspan></text><rect x="486.0" y="347.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="371.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Cambiar por algo menos tóxico</tspan></text><text x="501.0" y="388.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Otro conservante o desinfectante</tspan></text><polygon points="136.0,409.0 364.0,409.0 396.0,465.0 104.0,465.0" fill="#5eead4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="442.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="216"><tspan x="250.0" dy="0">INGENIERÍA</tspan></text><rect x="486.0" y="409.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="433.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Aislar al trabajador del peligro</tspan></text><text x="501.0" y="450.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Ventilación localizada, campanas</tspan></text><polygon points="104.0,471.0 396.0,471.0 428.0,527.0 72.0,527.0" fill="#2dd4bf" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="504.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="280"><tspan x="250.0" dy="0">ADMINISTRATIVO</tspan></text><rect x="486.0" y="471.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="495.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Cambiar la forma de trabajar</tspan></text><text x="501.0" y="512.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Rotación, capacitación, señales</tspan></text><polygon points="72.0,533.0 428.0,533.0 460.0,589.0 40.0,589.0" fill="#14b8a6" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="566.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="344"><tspan x="250.0" dy="0">EPP</tspan></text><rect x="486.0" y="533.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="557.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Equipo de protección personal</tspan></text><text x="501.0" y="574.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Respiradores, gafas: la última barrera</tspan></text><text x="250.0" y="607.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="420"><tspan x="250.0" dy="0">▲ más eficaz · ▼ menos eficaz</tspan></text><rect x="40.0" y="629.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="655.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Primero eliminar o reducir la fuente</tspan></text><text x="60.0" y="674.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El EPP y la rotación ayudan, pero no resuelven la exposición.</tspan></text><text x="40.0" y="741.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="751.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="790.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="773.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Solicitar equipos de</tspan><tspan x="285.0" dy="17">protección</tspan><tspan x="285.0" dy="17">respiratoria</tspan></text><rect x="363.0" y="754.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="773.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Eliminar o reducir la</tspan><tspan x="435.0" dy="17">fuente de</tspan><tspan x="435.0" dy="17">contaminación</tspan></text><text x="585.0" y="773.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Fortalecer la</tspan><tspan x="585.0" dy="17">educación en</tspan><tspan x="585.0" dy="17">higiene personal</tspan></text><text x="735.0" y="773.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Control médico</tspan><tspan x="735.0" dy="17">anual a</tspan><tspan x="735.0" dy="17">trabajadores</tspan></text><text x="885.0" y="782.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Rotación de turnos</tspan><tspan x="885.0" dy="17">sin otras medidas</tspan></text><rect x="40.0" y="822.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="822.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="851.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Medida prioritaria?</tspan></text><text x="285.0" y="843.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Complementa; no es lo</tspan><tspan x="285.0" dy="16">primero</tspan></text><text x="435.0" y="843.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: lo más eficaz es</tspan><tspan x="435.0" dy="16">quitar la fuente</tspan></text><text x="585.0" y="843.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no controla el</tspan><tspan x="585.0" dy="16">químico</tspan></text><text x="735.0" y="843.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Útil, pero no reduce la</tspan><tspan x="735.0" dy="16">exposición</tspan></text><text x="885.0" y="843.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: sin otras medidas</tspan><tspan x="885.0" dy="16">no protege</tspan></text><rect x="40.0" y="751.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="896.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="924.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="946.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Primero eliminar o sustituir el formaldehído o encerrar el proceso; ventilación localizada (ingeniería).</tspan><tspan x="58.0" dy="18">• Mientras tanto: EPP (respiradores) y rotación como medidas complementarias.</tspan><tspan x="58.0" dy="18">• Vigilancia médica de los expuestos; el formaldehído es cancerígeno (nasofaringe, leucemia).</tspan></text><text x="58.0" y="1004.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: NIOSH, jerarquía de controles; MINSA Perú, Ley 29783 de seguridad y salud en el trabajo; IARC.</tspan></text></svg>