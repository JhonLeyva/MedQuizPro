<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1157" viewBox="0 0 1000 1157" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Muslo muy hinchado tras accidente con dolor a la extensión, parestesias y sin pulsos distales: fasciotomía"><title>Muslo muy hinchado tras accidente con dolor a la extensión, parestesias y sin pulsos distales: fasciotomía</title><rect x="0.75" y="0.75" width="998.5" height="1156.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Emergencias traumatológicas · síndrome compartimental</tspan></text><rect x="538.4" y="32.0" width="150.2" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="613.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="134"><tspan x="613.5" dy="0">TRAUMATOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Síndrome compartimental agudo</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La presión dentro de un compartimento muscular sube y corta la circulación de músculos y</tspan><tspan x="58.0" dy="17">nervios.</tspan><tspan x="58.0" dy="17">El dolor desproporcionado y al estiramiento pasivo es el signo más precoz.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 20 años, accidente en moto</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Muslo izquierdo muy aumentado de volumen, dolor</tspan><tspan x="640.0" dy="16">intenso a la extensión y parestesias.</tspan><tspan x="640.0" dy="16">Pulsos poplíteo y pedio ausentes.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="377.0" x2="500.0" y2="407.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="407.0" x2="733.5" y2="407.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="407.0" x2="266.5" y2="436.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,435.0 271.5,435.0 266.5,443.0" fill="#94a3b8"/><line x1="733.5" y1="407.0" x2="733.5" y2="436.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,435.0 738.5,435.0 733.5,443.0" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#0f766e"/><line x1="500.0" y1="377.0" x2="500.0" y2="407.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="407.0" x2="500.0" y2="407.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="407.0" x2="266.5" y2="436.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,435.0 271.5,435.0 266.5,443.0" fill="#0f766e"/><rect x="225.0" y="416.0" width="83.0" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="428.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Sí (este caso)</tspan></text><rect x="719.4" y="416.0" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="428.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">No</tspan></text><polygon points="240.0,342.0 266.0,307.0 734.0,307.0 760.0,342.0 734.0,377.0 266.0,377.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="342.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="347.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="338.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Trauma de miembro: ¿dolor desproporcionado y al</tspan><tspan x="519.0" dy="17">estiramiento, tensión y parestesias?</tspan></text><rect x="40.0" y="443.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="471.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">FASCIOTOMÍA URGENTE</tspan></text><text x="266.5" y="494.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Abrir todos los compartimentos</tspan><tspan x="266.5" dy="17">Descartar lesión arterial</tspan></text><rect x="507.0" y="443.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="471.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Vigilancia seriada</tspan></text><text x="733.5" y="494.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Elevar a nivel del corazón</tspan><tspan x="733.5" dy="17">Analgesia y control</tspan></text><text x="40.0" y="573.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SIGNOS CON NOMBRE PROPIO</tspan></text><rect x="40.0" y="585.5" width="920.0" height="229.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><line x1="62.0" y1="627.5" x2="938.0" y2="627.5" stroke="#64748b" stroke-width="2"/><line x1="62.0" y1="627.5" x2="62.0" y2="635.5" stroke="#64748b" stroke-width="2"/><line x1="938.0" y1="627.5" x2="938.0" y2="635.5" stroke="#64748b" stroke-width="2"/><rect x="319.7" y="615.5" width="360.6" height="24.0" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/><text x="500.0" y="631.5" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="347"><tspan x="500.0" dy="0">LAS 6 P DEL SÍNDROME COMPARTIMENTAL · 3 de 6 en el caso</tspan></text><rect x="56.0" y="647.5" width="138.0" height="120.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="76.0" cy="670.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="76.0" y="674.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="76.0" dy="0">1</tspan></text><text x="94.0" y="675.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="92"><tspan x="94.0" dy="0">Dolor</tspan></text><text x="68.0" y="701.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="114"><tspan x="68.0" dy="0">Desproporcionado,</tspan><tspan x="68.0" dy="16">a la extensión</tspan></text><rect x="68.0" y="733.5" width="114.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="125.0" y="748.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="102"><tspan x="125.0" dy="0">✓ EN EL CASO</tspan></text><rect x="206.0" y="647.5" width="138.0" height="120.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="226.0" cy="670.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="226.0" y="674.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="226.0" dy="0">2</tspan></text><text x="244.0" y="675.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="92"><tspan x="244.0" dy="0">Parestesias</tspan></text><text x="218.0" y="701.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="114"><tspan x="218.0" dy="0">Presentes</tspan></text><rect x="218.0" y="733.5" width="114.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="275.0" y="748.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="102"><tspan x="275.0" dy="0">✓ EN EL CASO</tspan></text><rect x="356.0" y="647.5" width="138.0" height="120.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="376.0" cy="670.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="376.0" y="674.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="376.0" dy="0">3</tspan></text><text x="394.0" y="675.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="92"><tspan x="394.0" dy="0">Pulso ausente</tspan></text><text x="368.0" y="701.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="114"><tspan x="368.0" dy="0">Poplíteo y pedio</tspan></text><rect x="368.0" y="733.5" width="114.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="425.0" y="748.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="102"><tspan x="425.0" dy="0">✓ EN EL CASO</tspan></text><rect x="506.0" y="647.5" width="138.0" height="120.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="526.0" cy="670.5" r="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="526.0" y="674.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="526.0" dy="0">4</tspan></text><text x="544.0" y="675.5" font-size="12.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="start" data-max="92"><tspan x="544.0" dy="0">Palidez</tspan></text><text x="518.0" y="701.5" font-size="11.5" font-weight="400" font-style="normal" fill="#64748b" text-anchor="start" data-max="114"><tspan x="518.0" dy="0">No se menciona</tspan></text><rect x="518.0" y="733.5" width="114.0" height="22.0" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/><text x="575.0" y="748.5" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="575.0" dy="0">— NO DESCRITO</tspan></text><rect x="656.0" y="647.5" width="138.0" height="120.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="676.0" cy="670.5" r="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="676.0" y="674.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="676.0" dy="0">5</tspan></text><text x="694.0" y="675.5" font-size="12.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="start" data-max="92"><tspan x="694.0" dy="0">Parálisis</tspan></text><text x="668.0" y="701.5" font-size="11.5" font-weight="400" font-style="normal" fill="#64748b" text-anchor="start" data-max="114"><tspan x="668.0" dy="0">No se menciona</tspan></text><rect x="668.0" y="733.5" width="114.0" height="22.0" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/><text x="725.0" y="748.5" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="725.0" dy="0">— NO DESCRITO</tspan></text><rect x="806.0" y="647.5" width="138.0" height="120.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="826.0" cy="670.5" r="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="826.0" y="674.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="826.0" dy="0">6</tspan></text><text x="844.0" y="675.5" font-size="12.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="start" data-max="92"><tspan x="844.0" dy="0">Poiquilotermia</tspan></text><text x="818.0" y="701.5" font-size="11.5" font-weight="400" font-style="normal" fill="#64748b" text-anchor="start" data-max="114"><tspan x="818.0" dy="0">No se menciona</tspan></text><rect x="818.0" y="733.5" width="114.0" height="22.0" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/><text x="875.0" y="748.5" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="875.0" dy="0">— NO DESCRITO</tspan></text><text x="56.0" y="794.5" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">El dolor es el primer signo; palidez, parálisis y ausencia de pulso son tardíos: no esperarlos para operar.</tspan></text><text x="40.0" y="854.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="864.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="895.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="867.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="895.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Fasciotomía</tspan></text><text x="435.0" y="887.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Radiografía de</tspan><tspan x="435.0" dy="17">muslo</tspan></text><text x="585.0" y="895.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Inmovilización</tspan></text><text x="735.0" y="895.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ecografía Doppler</tspan></text><text x="885.0" y="887.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Analgésicos y</tspan><tspan x="885.0" dy="17">observación</tspan></text><rect x="40.0" y="918.5" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="918.5" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="955.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Urgente?</tspan></text><text x="285.0" y="947.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: descomprime y</tspan><tspan x="285.0" dy="16">salva el miembro</tspan></text><text x="435.0" y="947.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No retrasar la cirugía</tspan><tspan x="435.0" dy="16">por la Rx</tspan></text><text x="585.0" y="955.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no baja la presión</tspan></text><text x="735.0" y="939.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Útil si se sospecha</tspan><tspan x="735.0" dy="16">lesión arterial, sin</tspan><tspan x="735.0" dy="16">retrasar</tspan></text><text x="885.0" y="947.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: la necrosis</tspan><tspan x="885.0" dy="16">empieza a las 4-6 h</tspan></text><rect x="40.0" y="864.5" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1008.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1036.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1058.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Diagnóstico clínico; si hay duda, presión compartimental (ΔP = PA diastólica - presión del compartimento &lt; 30 mmHg).</tspan><tspan x="58.0" dy="18">• Tratamiento: fasciotomía urgente de todos los compartimentos; retirar yesos o vendajes apretados.</tspan><tspan x="58.0" dy="18">• La ausencia de pulsos es tardía y obliga además a descartar lesión arterial, sin retrasar la fasciotomía.</tspan></text><text x="58.0" y="1116.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAOS, manejo del síndrome compartimental agudo (2018, act.); ATLS 11.ª ed. (2025).</tspan></text></svg>