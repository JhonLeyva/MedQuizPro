<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="971" viewBox="0 0 1000 971" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Masa testicular indolora de 3 cm en un adulto joven operado de criptorquidia: cáncer testicular"><title>Masa testicular indolora de 3 cm en un adulto joven operado de criptorquidia: cáncer testicular</title><rect x="0.75" y="0.75" width="998.5" height="969.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Urología oncológica · cáncer de testículo</tspan></text><rect x="442.7" y="32.0" width="127.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="506.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="111"><tspan x="506.4" dy="0">NEFROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cáncer testicular</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El tumor sólido más común en varones de 15 a 40 años; el seminoma es el tipo más</tspan><tspan x="58.0" dy="17">frecuente.</tspan><tspan x="58.0" dy="17">Factor de riesgo principal: criptorquidia, aunque se haya operado.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 35 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Operado de criptorquidia en la infancia.</tspan><tspan x="640.0" dy="16">Masa testicular derecha de 3 × 3 cm, indolora;</tspan><tspan x="640.0" dy="16">ecografía la confirma; sin ganglios inguinales.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="422.2" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="422.2" y1="271.0" x2="422.2" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="417.2,299.0 427.2,299.0 422.2,307.0" fill="#94a3b8"/><line x1="422.2" y1="365.0" x2="422.2" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="395.0" x2="655.7" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="395.0" x2="188.7" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,423.0 193.7,423.0 188.7,431.0" fill="#94a3b8"/><line x1="655.7" y1="395.0" x2="655.7" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="650.7,423.0 660.7,423.0 655.7,431.0" fill="#94a3b8"/><line x1="655.7" y1="489.0" x2="655.7" y2="534.5" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="534.5" x2="811.3" y2="534.5" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="534.5" x2="500.0" y2="563.5" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,562.5 505.0,562.5 500.0,570.5" fill="#94a3b8"/><line x1="811.3" y1="534.5" x2="811.3" y2="563.5" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,562.5 816.3,562.5 811.3,570.5" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="422.2" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="422.2" y1="271.0" x2="422.2" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="417.2,299.0 427.2,299.0 422.2,307.0" fill="#0f766e"/><line x1="422.2" y1="365.0" x2="422.2" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="422.2" y1="395.0" x2="655.7" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="655.7" y1="395.0" x2="655.7" y2="424.0" stroke="#0f766e" stroke-width="3"/><polygon points="650.7,423.0 660.7,423.0 655.7,431.0" fill="#0f766e"/><line x1="655.7" y1="489.0" x2="655.7" y2="534.5" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="534.5" x2="655.7" y2="534.5" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="534.5" x2="500.0" y2="563.5" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,562.5 505.0,562.5 500.0,570.5" fill="#0f766e"/><rect x="176.6" y="404.0" width="24.1" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="188.7" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">Sí</tspan></text><rect x="641.5" y="404.0" width="28.3" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="655.7" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="655.7" dy="0">No</tspan></text><rect x="458.5" y="543.5" width="83.0" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="500.0" y="556.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">Sí (este caso)</tspan></text><rect x="762.4" y="543.5" width="97.8" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="811.3" y="556.0" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">No, en el cordón</tspan></text><polygon points="162.2,336.0 188.2,307.0 656.2,307.0 682.2,336.0 656.2,365.0 188.2,365.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="208.2" cy="336.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="208.2" y="341.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="208.2" dy="0">?</tspan></text><text x="441.2" y="340.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="441.2" dy="0">Masa escrotal: ¿transilumina?</tspan></text><rect x="40.0" y="431.0" width="297.3" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="188.7" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Hidrocele</tspan></text><text x="188.7" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Líquido</tspan></text><polygon points="395.7,460.0 421.7,431.0 889.7,431.0 915.7,460.0 889.7,489.0 421.7,489.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="441.7" cy="460.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="441.7" y="465.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="441.7" dy="0">?</tspan></text><text x="674.7" y="464.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="674.7" dy="0">No: ¿dentro del testículo y sólida?</tspan></text><rect x="351.3" y="570.5" width="297.3" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="598.8" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">CÁNCER TESTICULAR</tspan></text><text x="500.0" y="621.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Marcadores + orquiectomía inguinal</tspan><tspan x="500.0" dy="17">Nunca biopsia escrotal</tspan></text><rect x="662.7" y="570.5" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="607.3" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Hernia o varicocele</tspan></text><text x="811.3" y="630.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Ecografía Doppler</tspan></text><text x="40.0" y="700.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="710.9" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="733.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="713.9" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="733.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Cáncer testicular</tspan></text><text x="435.0" y="733.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Linfoma</tspan></text><text x="585.0" y="733.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Hernia inguinal</tspan></text><text x="735.0" y="733.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hidrocele</tspan></text><text x="885.0" y="733.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Varicocele</tspan></text><rect x="40.0" y="747.9" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="747.9" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="776.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Sospecha?</tspan></text><text x="285.0" y="768.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: masa sólida +</tspan><tspan x="285.0" dy="16">criptorquidia</tspan></text><text x="435.0" y="768.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: típico en mayores</tspan><tspan x="435.0" dy="16">de 60 años</tspan></text><text x="585.0" y="768.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no está dentro del</tspan><tspan x="585.0" dy="16">testículo</tspan></text><text x="735.0" y="768.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es líquido,</tspan><tspan x="735.0" dy="16">transilumina</tspan></text><text x="885.0" y="768.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: venas dilatadas,</tspan><tspan x="885.0" dy="16">no masa sólida</tspan></text><rect x="40.0" y="710.9" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="821.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="849.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="871.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Masa sólida intratesticular = cáncer hasta demostrar lo contrario.</tspan><tspan x="58.0" dy="18">• Marcadores (AFP, β-hCG, LDH), luego orquiectomía por vía inguinal; nunca biopsia por el escroto.</tspan><tspan x="58.0" dy="18">• Se disemina a ganglios retroperitoneales (no inguinales): TC de abdomen y tórax.</tspan></text><text x="58.0" y="929.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: EAU, guía de tumores de células germinales del testículo (2025); NCCN Testicular Cancer (2025).</tspan></text></svg>