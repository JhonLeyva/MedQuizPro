<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="982" viewBox="0 0 1000 982" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Síncope de esfuerzo, soplo sistólico eyectivo e HVI en un anciano: estenosis aórtica"><title>Síncope de esfuerzo, soplo sistólico eyectivo e HVI en un anciano: estenosis aórtica</title><rect x="0.75" y="0.75" width="998.5" height="980.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Valvulopatías · estenosis aórtica</tspan></text><rect x="392.1" y="32.0" width="117.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="450.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="101"><tspan x="450.8" dy="0">CARDIOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Estenosis aórtica calcificada</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La valvulopatía más frecuente del anciano.</tspan><tspan x="58.0" dy="17">Tríada: angina, síncope de esfuerzo y disnea.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 80 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Síncope al subir la escalera.</tspan><tspan x="640.0" dy="16">Soplo sistólico eyectivo III/VI e HVI en el ECG.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">HISTORIA NATURAL DE LA ESTENOSIS AÓRTICA</tspan></text><rect x="42.0" y="279.0" width="302.7" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="193.3" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">ASINTOMÁTICA</tspan></text><text x="193.3" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">Años</tspan></text><rect x="348.7" y="279.0" width="302.7" height="56.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="500.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">SINTOMÁTICA (ESTE CASO)</tspan></text><text x="500.0" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">Aparece el síncope</tspan></text><rect x="655.3" y="279.0" width="302.7" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="806.7" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">FALLA CARDIACA</tspan></text><text x="806.7" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">Sin tratamiento</tspan></text><rect x="454.6" y="268.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="500.0" y="283.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">◆ ESTE CASO</tspan></text><rect x="48.0" y="349.0" width="290.7" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="193.3" y="377.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">SOPLO</tspan></text><text x="193.3" y="401.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">Área valvular disminuye</tspan><tspan x="193.3" dy="17">Solo seguimiento</tspan></text><rect x="354.7" y="349.0" width="290.7" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="377.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">REEMPLAZO</tspan></text><text x="500.0" y="401.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">Angina, síncope o disnea</tspan><tspan x="500.0" dy="17">TAVI o cirugía</tspan></text><rect x="661.3" y="349.0" width="290.7" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="806.7" y="377.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">2-3 AÑOS</tspan></text><text x="806.7" y="401.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">Supervivencia muy corta</tspan><tspan x="806.7" dy="17">Evitar esfuerzos y vasodilatadores</tspan></text><text x="40.0" y="474.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">GRAVEDAD DE LA ESTENOSIS AÓRTICA (ECOCARDIOGRAFÍA, ACC/AHA 2020 Y ESC/EACTS 2021)</tspan></text><rect x="40.0" y="486.2" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="505.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">Grado</tspan></text><text x="160.0" y="505.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="186"><tspan x="160.0" dy="0">Velocidad máx.</tspan></text><text x="362.5" y="505.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="186"><tspan x="362.5" dy="0">Gradiente medio</tspan></text><text x="565.0" y="505.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="186"><tspan x="565.0" dy="0">Área valvular</tspan></text><text x="767.5" y="505.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="186"><tspan x="767.5" dy="0">Conducta</tspan></text><rect x="40.0" y="515.2" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="534.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">Leve</tspan></text><text x="160.0" y="534.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="186"><tspan x="160.0" dy="0">2,0-2,9 m/s</tspan></text><text x="362.5" y="534.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="186"><tspan x="362.5" dy="0">&lt; 20 mmHg</tspan></text><text x="565.0" y="534.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="186"><tspan x="565.0" dy="0">&gt; 1,5 cm²</tspan></text><text x="767.5" y="534.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="186"><tspan x="767.5" dy="0">Eco cada 3-5 años</tspan></text><rect x="40.0" y="544.2" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="563.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">Moderada</tspan></text><text x="160.0" y="563.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="186"><tspan x="160.0" dy="0">3,0-3,9 m/s</tspan></text><text x="362.5" y="563.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="186"><tspan x="362.5" dy="0">20-39 mmHg</tspan></text><text x="565.0" y="563.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="186"><tspan x="565.0" dy="0">1,0-1,5 cm²</tspan></text><text x="767.5" y="563.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="186"><tspan x="767.5" dy="0">Eco cada 1-2 años</tspan></text><rect x="40.0" y="573.2" width="920.0" height="59.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="592.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">Grave</tspan></text><text x="160.0" y="592.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="186"><tspan x="160.0" dy="0">≥ 4,0 m/s</tspan></text><text x="362.5" y="592.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="186"><tspan x="362.5" dy="0">≥ 40 mmHg</tspan></text><text x="565.0" y="592.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="186"><tspan x="565.0" dy="0">≤ 1,0 cm²</tspan></text><text x="767.5" y="592.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="186"><tspan x="767.5" dy="0">Con síntomas: reemplazo valvular</tspan><tspan x="767.5" dy="15">(TAVI o cirugía); sin síntomas:</tspan><tspan x="767.5" dy="15">control cada 6-12 meses</tspan></text><text x="40.0" y="648.2" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Grave también si el índice de área es ≤ 0,6 cm²/m². Con área ≤ 1,0 cm² y gradiente bajo, pensar en flujo bajo (confirmar con TC de calcio o ecocardiografía de estrés).</tspan></text><text x="40.0" y="695.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="705.2" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="736.2" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="708.2" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="736.2" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Estenosis aórtica</tspan></text><text x="435.0" y="736.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Insuficiencia aórtica</tspan></text><text x="585.0" y="736.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Insuficiencia mitral</tspan></text><text x="735.0" y="736.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Estenosis mitral</tspan></text><text x="885.0" y="727.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Comunicación</tspan><tspan x="885.0" dy="17">interventricular</tspan></text><rect x="40.0" y="759.2" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="759.2" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="788.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="780.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: síncope + soplo</tspan><tspan x="285.0" dy="16">eyectivo + HVI</tspan></text><text x="435.0" y="788.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: soplo diastólico</tspan></text><text x="585.0" y="780.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: soplo holosistólico</tspan><tspan x="585.0" dy="16">apical</tspan></text><text x="735.0" y="780.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: soplo diastólico</tspan><tspan x="735.0" dy="16">con chasquido</tspan></text><text x="885.0" y="780.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: soplo holosistólico</tspan><tspan x="885.0" dy="16">en el borde esternal</tspan></text><rect x="40.0" y="705.2" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="833.2" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="861.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="883.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Soplo áspero en el foco aórtico irradiado a carótidas, pulso parvus et tardus y segundo ruido débil.</tspan><tspan x="58.0" dy="18">• Eco: área &lt; 1 cm², gradiente medio ≥ 40 mmHg o velocidad ≥ 4 m/s = grave.</tspan><tspan x="58.0" dy="18">• Sintomática grave: reemplazo valvular (cirugía o TAVI); sin tratamiento, la supervivencia es de 2-3 años.</tspan></text><text x="58.0" y="941.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACC/AHA, valvulopatías (2020); ESC/EACTS, valvulopatías (2021); Braunwald Tratado de Cardiología 12.ª ed.</tspan></text></svg>