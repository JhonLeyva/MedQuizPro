<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1018" viewBox="0 0 1000 1018" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Los ruidos cardiacos de baja intensidad distinguen la deshidratación severa de la moderada"><title>Los ruidos cardiacos de baja intensidad distinguen la deshidratación severa de la moderada</title><rect x="0.75" y="0.75" width="998.5" height="1016.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · grados de deshidratación</tspan></text><rect x="414.6" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="463.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="463.7" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Deshidratación del niño</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Leve 3 a 5 %, moderada 6 a 9 % y severa 10 % o más de pérdida de peso.</tspan><tspan x="58.0" dy="17">La presencia de shock define la urgencia.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de signos</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué signo diferencia la deshidratación severa de la</tspan><tspan x="640.0" dy="16">moderada?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SIGNOS DE LOS TRES GRADOS DE DESHIDRATACIÓN</tspan></text><rect x="40.0" y="269.0" width="293.3" height="181.0" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="269.0" width="293.3" height="8.0" rx="4" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="60.0" y="303.0" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="253"><tspan x="60.0" dy="0">Leve (3 a 5 %)</tspan></text><rect x="56.0" y="324.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="68.0" y="341.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Sensorio</tspan></text><text x="305.3" y="341.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="305.3" dy="0">Alerta, sed leve</tspan></text><rect x="56.0" y="354.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="68.0" y="371.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Mucosas</tspan></text><text x="305.3" y="371.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="305.3" dy="0">Poco secas</tspan></text><rect x="56.0" y="384.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="68.0" y="401.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Conducta</tspan></text><text x="305.3" y="401.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="305.3" dy="0">Plan A en casa</tspan></text><text x="60.0" y="430.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="253"><tspan x="60.0" dy="0">Sin signos de gravedad.</tspan></text><rect x="353.3" y="269.0" width="293.3" height="181.0" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="353.3" y="269.0" width="293.3" height="8.0" rx="4" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="373.3" y="303.0" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="253"><tspan x="373.3" dy="0">Moderada (6 a 9 %)</tspan></text><rect x="369.3" y="324.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="381.3" y="341.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="381.3" dy="0">Sensorio</tspan></text><text x="618.7" y="341.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="618.7" dy="0">Irritable, sed</tspan></text><rect x="369.3" y="354.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="381.3" y="371.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="381.3" dy="0">Piel</tspan></text><text x="618.7" y="371.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="618.7" dy="0">Pliegue lento</tspan></text><rect x="369.3" y="384.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="381.3" y="401.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="381.3" dy="0">Perfusión</tspan></text><text x="618.7" y="401.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="618.7" dy="0">Llenado algo lento</tspan></text><text x="373.3" y="430.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="253"><tspan x="373.3" dy="0">Plan B: SRO 75 mL/kg en 4 h.</tspan></text><rect x="666.7" y="269.0" width="293.3" height="181.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><rect x="666.7" y="269.0" width="293.3" height="8.0" rx="4" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="686.7" y="303.0" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="253"><tspan x="686.7" dy="0">Severa (10 % o más)</tspan></text><rect x="682.7" y="324.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="694.7" y="341.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="694.7" dy="0">Sensorio</tspan></text><text x="932.0" y="341.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="932.0" dy="0">Letargia o coma</tspan></text><rect x="682.7" y="354.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="694.7" y="371.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="694.7" dy="0">Pulsos</tspan></text><text x="932.0" y="371.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="932.0" dy="0">Débiles; hipotensión</tspan></text><rect x="682.7" y="384.0" width="261.3" height="26.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="694.7" y="401.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="694.7" dy="0">Ruidos cardiacos</tspan></text><text x="932.0" y="401.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="end" data-max="133"><tspan x="932.0" dy="0">✓ Baja intensidad</tspan></text><text x="686.7" y="430.0" font-size="11.5" font-weight="600" font-style="normal" fill="#0f766e" text-anchor="start" data-max="253"><tspan x="686.7" dy="0">Plan C: bolo IV de 20 mL/kg.</tspan></text><rect x="842.6" y="262.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="888.0" y="277.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="888.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="472.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="400"><tspan x="40.0" dy="0">✓ = dato que coincide con el caso</tspan></text><text x="40.0" y="512.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">GRADOS DE DESHIDRATACIÓN: SIGNOS Y CONDUCTA</tspan></text><rect x="40.0" y="524.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="543.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Grado</tspan></text><text x="260.0" y="543.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Signos que se suman</tspan></text><text x="615.0" y="543.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Conducta</tspan></text><rect x="40.0" y="553.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="572.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Leve</tspan></text><text x="260.0" y="572.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Sed leve, mucosas poco secas</tspan></text><text x="615.0" y="572.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Plan A</tspan></text><rect x="40.0" y="582.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="601.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Moderada</tspan></text><text x="260.0" y="601.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Irritabilidad, ojos hundidos, pliegue lento, taquicardia</tspan></text><text x="615.0" y="601.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Plan B: SRO 75 mL/kg en 4 horas</tspan></text><rect x="40.0" y="611.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="630.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Severa</tspan></text><text x="260.0" y="630.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Letargia, hipotensión, llenado mayor de 3 s, ruidos cardiacos</tspan><tspan x="260.0" dy="15">débiles</tspan></text><text x="615.0" y="630.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Plan C: bolo IV de 20 mL/kg</tspan></text><rect x="150.6" y="622.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="196.0" y="637.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="196.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="695.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="705.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="736.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="708.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="727.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Ruidos cardiacos</tspan><tspan x="285.0" dy="17">de baja intensidad</tspan></text><text x="435.0" y="736.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Irritabilidad</tspan></text><text x="585.0" y="727.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Llenado capilar</tspan><tspan x="585.0" dy="17">lento</tspan></text><text x="735.0" y="736.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Polipnea</tspan></text><text x="885.0" y="736.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Mucosa oral seca</tspan></text><rect x="40.0" y="759.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="759.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="788.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Signo que diferencia?</tspan></text><text x="285.0" y="780.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: aparece solo en la</tspan><tspan x="285.0" dy="16">severa</tspan></text><text x="435.0" y="780.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: también se ve en</tspan><tspan x="435.0" dy="16">la moderada</tspan></text><text x="585.0" y="780.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: llenado prolongado</tspan><tspan x="585.0" dy="16">en ambos grados</tspan></text><text x="735.0" y="780.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: se observa en</tspan><tspan x="735.0" dy="16">ambos grados</tspan></text><text x="885.0" y="780.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: se observa en</tspan><tspan x="885.0" dy="16">ambos grados</tspan></text><rect x="40.0" y="705.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="833.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="861.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="883.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Moderada: irritabilidad o sed, mucosas secas, ojos hundidos, fontanela deprimida, pliegue lento, taquicardia y llenado capilar algo prolongado.</tspan><tspan x="58.0" dy="18">• Severa: se agregan letargia o coma, hipotensión, pulsos débiles, llenado mayor de 3 s, respiración profunda acidótica, oliguria y ruidos cardiacos de baja</tspan><tspan x="58.0" dy="18">   intensidad.</tspan><tspan x="58.0" dy="18">• Irritabilidad, mucosa seca, polipnea y llenado capilar lento están en ambos grados: esa es la trampa de la pregunta.</tspan><tspan x="58.0" dy="18">• Tratamiento: moderada, SRO 75 mL/kg en 4 horas (plan B); severa, bolo IV de 20 mL/kg (plan C).</tspan></text><text x="58.0" y="977.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, Libro de bolsillo de atención hospitalaria del niño, 2.ª ed. (2013); ESPGHAN/ESPID (2014); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>