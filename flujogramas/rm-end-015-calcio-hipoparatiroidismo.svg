<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1029" viewBox="0 0 1000 1029" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La agenesia paratiroidea causa hipocalcemia por falta de hormona paratiroidea"><title>La agenesia paratiroidea causa hipocalcemia por falta de hormona paratiroidea</title><rect x="0.75" y="0.75" width="998.5" height="1027.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Calcio · hipoparatiroidismo</tspan></text><rect x="361.3" y="32.0" width="140.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="431.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="124"><tspan x="431.5" dy="0">ENDOCRINOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hormona paratiroidea</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Mantiene la calcemia: aumenta la resorción ósea, la reabsorción renal de calcio y la</tspan><tspan x="58.0" dy="17">activación de la vitamina D.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de causa</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál de estas condiciones causa hipocalcemia?</tspan></text><line x1="640.0" y1="189.0" x2="670.0" y2="189.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ OPCIONES BAJAN EL CALCIO Y CUÁLES LO SUBEN</tspan></text><line x1="406.0" y1="400.7" x2="340.0" y2="402.2" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="402.2" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="421.1" y1="449.7" x2="340.0" y2="502.2" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="502.2" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.1" y1="368.7" x2="660.0" y2="345.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="345.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="426.6" x2="660.0" y2="448.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="448.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="420.3" y1="348.8" x2="340.0" y2="298.6" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="298.6" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="398.6" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="398.6" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="403.6" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">CALCIO</tspan></text><text x="500.0" y="422.6" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">¿sube o baja?</tspan></text><rect x="40.0" y="253.0" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="281.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">AGENESIA PARATIROIDEA</tspan></text><text x="190.0" y="305.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Sin PTH: calcio BAJO</tspan><tspan x="190.0" dy="17">Fósforo alto</tspan></text><rect x="144.6" y="334.2" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="349.2" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="360.2" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="361.2" width="6.0" height="82.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="393.9" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">INSUFICIENCIA SUPRARRENAL</tspan></text><text x="190.0" y="417.6" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Puede elevar el calcio</tspan></text><rect x="40.0" y="460.2" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="461.2" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="190.0" y="493.9" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">INMOVILIZACIÓN</tspan></text><text x="190.0" y="517.6" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Resorción ósea: calcio ALTO</tspan></text><rect x="660.0" y="303.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="304.0" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="336.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">VITAMINA A (EXCESO)</tspan></text><text x="810.0" y="360.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Estimula osteoclastos: calcio ALTO</tspan></text><rect x="660.0" y="403.0" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="404.0" width="6.0" height="89.2" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="431.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">FEOCROMOCITOMA</tspan></text><text x="810.0" y="455.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">En MEN 2A se asocia a hiperparatiroidismo:</tspan><tspan x="810.0" dy="17">calcio ALTO</tspan></text><text x="40.0" y="580.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="592.2" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="625.2" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Sin paratiroides</tspan></text><line x1="248.5" y1="621.2" x2="267.5" y2="621.2" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,616.2 266.5,626.2 274.5,621.2" fill="#0f766e"/><rect x="278.5" y="592.2" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="616.7" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Menos resorción ósea y menos</tspan><tspan x="380.8" dy="17">vitamina D activa</tspan></text><line x1="487.0" y1="621.2" x2="506.0" y2="621.2" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,616.2 505.0,626.2 513.0,621.2" fill="#0f766e"/><rect x="517.0" y="592.2" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="625.2" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Calcio bajo y fósforo alto</tspan></text><line x1="725.5" y1="621.2" x2="744.5" y2="621.2" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,616.2 743.5,626.2 751.5,621.2" fill="#0f766e"/><rect x="755.5" y="592.2" width="204.5" height="58.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="616.7" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Tetania, Chvostek, Trousseau</tspan><tspan x="857.8" dy="17">y QT largo</tspan></text><text x="40.0" y="690.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="700.2" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="731.2" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="722.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Insuficiencia</tspan><tspan x="285.0" dy="17">suprarrenal</tspan></text><text x="435.0" y="731.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Inmovilización</tspan></text><rect x="513.0" y="703.2" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="722.7" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Agenesia</tspan><tspan x="585.0" dy="17">paratiroidea</tspan></text><text x="735.0" y="722.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ingesta de vitamina</tspan><tspan x="735.0" dy="17">A</tspan></text><text x="885.0" y="731.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Feocromocitoma</tspan></text><rect x="40.0" y="754.2" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="754.2" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="791.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Causa hipocalcemia?</tspan></text><text x="285.0" y="783.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: puede elevar el</tspan><tspan x="285.0" dy="16">calcio</tspan></text><text x="435.0" y="783.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: eleva el calcio por</tspan><tspan x="435.0" dy="16">resorción ósea</tspan></text><text x="585.0" y="783.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: sin PTH cae el</tspan><tspan x="585.0" dy="16">calcio</tspan></text><text x="735.0" y="783.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: eleva el calcio al</tspan><tspan x="735.0" dy="16">activar osteoclastos</tspan></text><text x="885.0" y="775.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: se asocia a</tspan><tspan x="885.0" dy="16">hiperparatiroidismo en</tspan><tspan x="885.0" dy="16">MEN 2A</tspan></text><rect x="40.0" y="700.2" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="844.2" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="872.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="894.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Sin paratiroides (agenesia en DiGeorge con deleción 22q11.2, cirugía cervical o destrucción autoinmune): calcio bajo, fósforo alto y PTH baja o</tspan><tspan x="58.0" dy="18">   inapropiadamente normal.</tspan><tspan x="58.0" dy="18">• Clínica: parestesias periorales, calambres, tetania, signos de Chvostek y Trousseau, laringoespasmo, convulsiones y QT prolongado.</tspan><tspan x="58.0" dy="18">• Bandera roja: tetania, laringoespasmo o convulsiones = gluconato de calcio endovenoso.</tspan><tspan x="58.0" dy="18">• Medir magnesio (si está bajo no sale PTH) y corregir el calcio por albúmina. Las otras cuatro opciones elevan el calcio.</tspan></text><text x="58.0" y="988.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Brandi et al., J Clin Endocrinol Metab (2016); Khan et al., J Bone Miner Res (2022)</tspan></text></svg>