<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="949" viewBox="0 0 1000 949" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Los ácaros del polvo doméstico (Dermatophagoides) son los alérgenos que con más frecuencia inducen asma"><title>Los ácaros del polvo doméstico (Dermatophagoides) son los alérgenos que con más frecuencia inducen asma</title><rect x="0.75" y="0.75" width="998.5" height="947.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neumología · alérgenos del asma</tspan></text><rect x="397.6" y="32.0" width="114.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="455.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="99"><tspan x="455.0" dy="0">NEUMOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Asma alérgica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Fenotipo más común en niños y adultos jóvenes.</tspan><tspan x="58.0" dy="17">Se asocia con rinitis, dermatitis atópica y antecedentes familiares de atopia.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de epidemiología</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuáles son los alérgenos que con mayor frecuencia</tspan><tspan x="640.0" dy="16">inducen asma?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><rect x="40.0" y="245.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="271.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Alérgeno más frecuente del asma = ácaros del polvo</tspan></text><text x="60.0" y="290.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Pólenes, cucarachas, hongos y mascotas siguen en frecuencia.</tspan></text><text x="40.0" y="351.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ALÉRGENOS DEL ASMA Y DÓNDE SE ENCUENTRAN</tspan></text><rect x="40.0" y="363.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Alérgeno</tspan></text><text x="350.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="294"><tspan x="350.0" dy="0">Dónde está</tspan></text><text x="660.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="294"><tspan x="660.0" dy="0">Frecuencia</tspan></text><rect x="40.0" y="392.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="411.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Dermatophagoides (ácaros)</tspan></text><text x="350.0" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="350.0" dy="0">Colchones, almohadas, alfombras y peluches;</tspan><tspan x="350.0" dy="15">ambiente húmedo</tspan></text><text x="660.0" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="660.0" dy="0">El más importante en todo el mundo</tspan></text><rect x="240.6" y="403.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="286.0" y="418.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="436.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="455.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Epitelios de gato y perro</tspan></text><text x="350.0" y="455.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="350.0" dy="0">Caspa y pelo de las mascotas</tspan></text><text x="660.0" y="455.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="660.0" dy="0">Siguen a los ácaros</tspan></text><rect x="40.0" y="465.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="484.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Cucarachas</tspan></text><text x="350.0" y="484.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="350.0" dy="0">Viviendas con plagas</tspan></text><text x="660.0" y="484.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="660.0" dy="0">Siguen a los ácaros</tspan></text><rect x="40.0" y="494.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="513.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Hongos: Alternaria y Aspergillus</tspan></text><text x="350.0" y="513.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="350.0" dy="0">Humedad y esporas</tspan></text><text x="660.0" y="513.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="660.0" dy="0">Siguen a los ácaros</tspan></text><rect x="40.0" y="523.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="542.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Pólenes de árboles, pastos y malezas</tspan></text><text x="350.0" y="542.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="350.0" dy="0">Aire libre, en estaciones definidas</tspan></text><text x="660.0" y="542.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="660.0" dy="0">Estacional</tspan></text><text x="40.0" y="592.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="602.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="633.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="633.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Polen de árboles</tspan></text><text x="435.0" y="633.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Cucarachas</tspan></text><rect x="513.0" y="605.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="633.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Dermatophagoides</tspan></text><text x="735.0" y="633.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Esporas fúngicas</tspan></text><text x="885.0" y="624.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Mascotas</tspan><tspan x="885.0" dy="17">domésticas</tspan></text><rect x="40.0" y="656.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="656.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="685.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Alérgeno más</tspan><tspan x="54.0" dy="16">frecuente?</tspan></text><text x="285.0" y="677.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: estacional, menos</tspan><tspan x="285.0" dy="16">frecuente que los</tspan><tspan x="285.0" dy="16">ácaros</tspan></text><text x="435.0" y="685.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: frecuente, pero</tspan><tspan x="435.0" dy="16">menos que los ácaros</tspan></text><text x="585.0" y="693.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: exposición diaria</tspan></text><text x="735.0" y="685.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: menos frecuentes</tspan><tspan x="735.0" dy="16">que los ácaros</tspan></text><text x="885.0" y="685.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: menos frecuentes</tspan><tspan x="885.0" dy="16">que los ácaros</tspan></text><rect x="40.0" y="602.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="746.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="774.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="796.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Dermatophagoides pteronyssinus y D. farinae prosperan en colchones, almohadas, alfombras y peluches en ambientes húmedos y templados, como la</tspan><tspan x="58.0" dy="18">   costa peruana.</tspan><tspan x="58.0" dy="18">• Siguen epitelios de gato y perro, cucarachas, hongos (Alternaria, Aspergillus) y, por estación, polen de árboles, pastos y malezas.</tspan><tspan x="58.0" dy="18">• La IgE específica se confirma con pruebas cutáneas o IgE sérica. Control ambiental: fundas antiácaros, lavado semanal con agua caliente y humedad</tspan><tspan x="58.0" dy="18">   menor de 50 %.</tspan><tspan x="58.0" dy="18">• Alerta: el humo de tabaco no es alérgeno, pero agrava el asma; la inmunoterapia sublingual se considera en asma alérgica leve a moderada con rinitis.</tspan></text><text x="58.0" y="908.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: GINA, Global Strategy for Asthma Management and Prevention, actualización 2024 (ginasthma.org); Harrison, 21.ª ed. (2022).</tspan></text></svg>