<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1140" viewBox="0 0 1000 1140" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Aislamiento, incoherencia y alucinaciones agudas tras añadir fármacos en un anciano: delirio hipoactivo"><title>Aislamiento, incoherencia y alucinaciones agudas tras añadir fármacos en un anciano: delirio hipoactivo</title><rect x="0.75" y="0.75" width="998.5" height="1138.9" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neurología · delirio del anciano</tspan></text><rect x="385.2" y="32.0" width="113.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="442.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="98"><tspan x="442.1" dy="0">NEUROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Delirio</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Síndrome confusional agudo y fluctuante, de causa orgánica.</tspan><tspan x="58.0" dy="17">Es una emergencia geriátrica y suele ser la primera señal de una enfermedad grave.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 80 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Cognición normal; hace tres días se añadieron dos</tspan><tspan x="640.0" dy="16">fármacos.</tspan><tspan x="640.0" dy="16">Se aísla, está incoherente pero tranquilo y tiene</tspan><tspan x="640.0" dy="16">alucinaciones visuales.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE DISTINGUE EL DELIRIO DE OTRAS CAUSAS DE CONFUSIÓN</tspan></text><text x="202.0" y="313.0" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="758"><tspan x="202.0" dy="0">→ DIAGNÓSTICO</tspan></text><rect x="202.0" y="323.0" width="244.7" height="35.0" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="324.3" y="345.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="225"><tspan x="324.3" dy="0">Delirio</tspan></text><rect x="458.7" y="323.0" width="244.7" height="35.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="581.0" y="345.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="225"><tspan x="581.0" dy="0">Demencia de Alzheimer</tspan></text><rect x="715.3" y="323.0" width="244.7" height="35.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="837.7" y="345.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="225"><tspan x="837.7" dy="0">Ictus agudo</tspan></text><text x="40.0" y="344.5" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="146"><tspan x="40.0" dy="0">↓ RASGO</tspan></text><rect x="40.0" y="370.0" width="150.0" height="90.5" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="115.0" y="419.7" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Inicio</tspan></text><rect x="202.0" y="370.0" width="244.7" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="324.3" y="398.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="217"><tspan x="324.3" dy="0">Agudo, en horas o días</tspan></text><text x="324.3" y="421.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="217"><tspan x="324.3" dy="0">Aquí: 3 días después de añadir</tspan><tspan x="324.3" dy="17">fármacos</tspan></text><rect x="278.9" y="449.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="324.3" y="464.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="324.3" dy="0">◆ ESTE CASO</tspan></text><rect x="458.7" y="370.0" width="244.7" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="459.7" y="371.0" width="6.0" height="88.5" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="581.0" y="406.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="217"><tspan x="581.0" dy="0">Insidioso y progresivo</tspan></text><text x="581.0" y="429.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="217"><tspan x="581.0" dy="0">Meses a años</tspan></text><rect x="715.3" y="370.0" width="244.7" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="716.3" y="371.0" width="6.0" height="88.5" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="837.7" y="406.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="217"><tspan x="837.7" dy="0">Súbito</tspan></text><text x="837.7" y="429.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="217"><tspan x="837.7" dy="0">Déficit neurológico focal</tspan></text><rect x="40.0" y="472.5" width="150.0" height="90.5" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="115.0" y="513.7" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Atención y</tspan><tspan x="115.0" dy="17">conciencia</tspan></text><rect x="202.0" y="472.5" width="244.7" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="473.5" width="6.0" height="88.5" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="324.3" y="500.8" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="217"><tspan x="324.3" dy="0">Alteradas y fluctuantes</tspan></text><text x="324.3" y="523.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="217"><tspan x="324.3" dy="0">Alucinaciones visuales; hipoactivo:</tspan><tspan x="324.3" dy="17">tranquilo y retraído</tspan></text><rect x="458.7" y="472.5" width="244.7" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="459.7" y="473.5" width="6.0" height="88.5" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="581.0" y="509.3" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="217"><tspan x="581.0" dy="0">Atención conservada al inicio</tspan></text><text x="581.0" y="532.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="217"><tspan x="581.0" dy="0">Falla la memoria reciente</tspan></text><rect x="715.3" y="472.5" width="244.7" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="716.3" y="473.5" width="6.0" height="88.5" rx="3" fill="#6366f1" stroke="none" stroke-width="1.5"/><text x="837.7" y="509.3" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="217"><tspan x="837.7" dy="0">Variable según el territorio</tspan></text><text x="837.7" y="532.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="217"><tspan x="837.7" dy="0">Predomina el déficit focal</tspan></text><rect x="40.0" y="574.9" width="150.0" height="90.5" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="115.0" y="624.7" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Qué se hace</tspan></text><rect x="202.0" y="574.9" width="244.7" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="575.9" width="6.0" height="88.5" rx="3" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="324.3" y="603.3" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="217"><tspan x="324.3" dy="0">Retirar el fármaco culpable</tspan></text><text x="324.3" y="626.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="217"><tspan x="324.3" dy="0">Corregir lo metabólico; medidas no</tspan><tspan x="324.3" dy="17">farmacológicas</tspan></text><rect x="458.7" y="574.9" width="244.7" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="459.7" y="575.9" width="6.0" height="88.5" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="581.0" y="611.8" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="217"><tspan x="581.0" dy="0">Evaluación cognitiva</tspan></text><text x="581.0" y="634.7" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="217"><tspan x="581.0" dy="0">Curso crónico, sin urgencia</tspan></text><rect x="715.3" y="574.9" width="244.7" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="716.3" y="575.9" width="6.0" height="88.5" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="837.7" y="611.8" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="217"><tspan x="837.7" dy="0">Neuroimagen urgente</tspan></text><text x="837.7" y="634.7" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="217"><tspan x="837.7" dy="0">Ventana de reperfusión</tspan></text><text x="40.0" y="715.4" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="725.4" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="764.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="728.4" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="764.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Delirio</tspan></text><text x="435.0" y="747.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Enfermedad</tspan><tspan x="435.0" dy="17">cerebrovascular</tspan><tspan x="435.0" dy="17">aguda</tspan></text><text x="585.0" y="756.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Demencia de</tspan><tspan x="585.0" dy="17">Alzheimer</tspan></text><text x="735.0" y="764.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hiperglicemia</tspan></text><text x="885.0" y="764.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hipoglicemia</tspan></text><rect x="40.0" y="796.4" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="796.4" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="825.4" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico</tspan><tspan x="54.0" dy="16">presuntivo?</tspan></text><text x="285.0" y="817.4" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: inicio agudo tras</tspan><tspan x="285.0" dy="16">fármacos, con</tspan><tspan x="285.0" dy="16">alucinaciones</tspan></text><text x="435.0" y="825.4" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: el ictus da déficit</tspan><tspan x="435.0" dy="16">focal</tspan></text><text x="585.0" y="825.4" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es insidiosa y</tspan><tspan x="585.0" dy="16">progresiva</tspan></text><text x="735.0" y="817.4" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no explica solo el</tspan><tspan x="735.0" dy="16">cuadro sin sed ni</tspan><tspan x="735.0" dy="16">poliuria</tspan></text><text x="885.0" y="817.4" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: sin síntomas</tspan><tspan x="885.0" dy="16">autonómicos que lo</tspan><tspan x="885.0" dy="16">expliquen</tspan></text><rect x="40.0" y="725.4" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="886.4" width="920.0" height="236.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="914.4" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="936.4" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• DSM-5-TR (2022): alteración de la atención y la conciencia de inicio agudo y curso fluctuante, con otro déficit cognitivo, por condición médica,</tspan><tspan x="58.0" dy="18">   intoxicación o fármaco.</tspan><tspan x="58.0" dy="18">• Subtipos: hiperactivo, hipoactivo y mixto. El hipoactivo (retraído, tranquilo, contestaciones mínimas) es el más frecuente en el anciano y el que más se</tspan><tspan x="58.0" dy="18">   pasa por alto.</tspan><tspan x="58.0" dy="18">• Fármacos culpables (Beers 2023): anticolinérgicos, benzodiacepinas, opioides, corticoides y antihistamínicos. Medir glucemia para descartar hipo e</tspan><tspan x="58.0" dy="18">   hiperglucemia.</tspan><tspan x="58.0" dy="18">• Manejo: retirar el desencadenante, corregir lo metabólico y las infecciones, y medidas no farmacológicas (orientación, sueño, lentes, audífonos,</tspan><tspan x="58.0" dy="18">   movilización).</tspan></text><text x="58.0" y="1084.4" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: American Psychiatric Association, DSM-5-TR (2022); AGS Beers Criteria Update Expert Panel, 2023 AGS Beers Criteria, J Am Geriatr Soc 2023;71:2052-2081; Harrison</tspan><tspan x="58.0" dy="15">Principios de Medicina Interna, 21.ª ed. (2022)</tspan></text></svg>