<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1151" viewBox="0 0 1000 1151" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La atrofia endometrial es la causa más frecuente del sangrado posmenopáusico escaso y marrón (60 a 80 %)"><title>La atrofia endometrial es la causa más frecuente del sangrado posmenopáusico escaso y marrón (60 a 80 %)</title><rect x="0.75" y="0.75" width="998.5" height="1149.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ginecología · sangrado posmenopáusico</tspan></text><rect x="443.3" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="523.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="523.1" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Sangrado posmenopáusico</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El que ocurre un año o más después de la última menstruación.</tspan><tspan x="58.0" dy="17">Siempre se descarta el cáncer de endometrio.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 59 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Sangrado escaso y marrón oscuro de 8 semanas.</tspan><tspan x="640.0" dy="16">FUR hace 9 años; sin fármacos y examen ginecológico</tspan><tspan x="640.0" dy="16">normal.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CAUSAS DEL SANGRADO POSMENOPÁUSICO, DE LA MÁS A LA MENOS FRECUENTE (ORDEN APROXIMADO)</tspan></text><polygon points="200.0,285.0 300.0,285.0 340.0,341.0 160.0,341.0" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="318.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="88"><tspan x="250.0" dy="0">1</tspan></text><rect x="486.0" y="285.0" width="474.0" height="56.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="501.0" y="309.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Atrofia endometrial y vaginal</tspan></text><text x="501.0" y="326.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">60 a 80 %; sangrado escaso y marrón por falta de estrógenos (este caso)</tspan></text><rect x="858.2" y="274.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="903.6" y="289.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="903.6" dy="0">◆ ESTE CASO</tspan></text><polygon points="160.0,347.0 340.0,347.0 380.0,403.0 120.0,403.0" fill="#99f6e4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="380.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="168"><tspan x="250.0" dy="0">2</tspan></text><rect x="486.0" y="347.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="371.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Pólipos y terapia hormonal</tspan></text><text x="501.0" y="388.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Pólipos endometriales; descartar fármacos</tspan></text><polygon points="120.0,409.0 380.0,409.0 420.0,465.0 80.0,465.0" fill="#5eead4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="442.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="248"><tspan x="250.0" dy="0">3</tspan></text><rect x="486.0" y="409.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="433.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Hiperplasia endometrial</tspan></text><text x="501.0" y="450.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Obesidad o estrógenos sin oposición</tspan></text><polygon points="80.0,471.0 420.0,471.0 460.0,527.0 40.0,527.0" fill="#2dd4bf" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="504.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="328"><tspan x="250.0" dy="0">4</tspan></text><rect x="486.0" y="471.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="495.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Cáncer de endometrio</tspan></text><text x="501.0" y="512.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Cerca de 10 %; la causa que nunca debe omitirse</tspan></text><text x="250.0" y="545.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="420"><tspan x="250.0" dy="0">▲ más frecuente · ▼ menos frecuente</tspan></text><rect x="40.0" y="567.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="593.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Sangrado escaso marrón + FUR hace 9 años = atrofia</tspan></text><text x="60.0" y="612.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El pólipo cervical y la carúncula son locales; la hiperplasia y el cáncer suelen tener factores de riesgo.</tspan></text><text x="40.0" y="673.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ECOGRAFÍA TRANSVAGINAL EN EL SANGRADO POSMENOPÁUSICO</tspan></text><rect x="40.0" y="685.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="704.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Grosor endometrial</tspan></text><text x="250.0" y="704.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="704"><tspan x="250.0" dy="0">Conducta</tspan></text><rect x="40.0" y="714.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="733.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">4 mm o menos</tspan></text><text x="250.0" y="733.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="704"><tspan x="250.0" dy="0">Cáncer improbable: observar y tratar la atrofia</tspan></text><rect x="140.6" y="717.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="186.0" y="732.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="186.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="743.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="762.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Más de 4 mm</tspan></text><text x="250.0" y="762.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="704"><tspan x="250.0" dy="0">Biopsia endometrial (también si es heterogéneo)</tspan></text><text x="40.0" y="812.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="822.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="853.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="853.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Pólipo cervical</tspan></text><rect x="363.0" y="825.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="853.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Atrofia endometrial</tspan></text><text x="585.0" y="844.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Hiperplasia</tspan><tspan x="585.0" dy="17">endometrial</tspan></text><text x="735.0" y="853.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Carúncula uretral</tspan></text><text x="885.0" y="853.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Cáncer endometrial</tspan></text><rect x="40.0" y="876.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="876.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="913.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Causa más frecuente?</tspan></text><text x="285.0" y="897.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: causa local que el</tspan><tspan x="285.0" dy="16">examen normal</tspan><tspan x="285.0" dy="16">descarta</tspan></text><text x="435.0" y="905.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: epitelio fino y frágil</tspan><tspan x="435.0" dy="16">por falta de estrógenos</tspan></text><text x="585.0" y="897.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: suele haber</tspan><tspan x="585.0" dy="16">obesidad o estrógenos</tspan><tspan x="585.0" dy="16">sin oposición</tspan></text><text x="735.0" y="897.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: causa local que el</tspan><tspan x="735.0" dy="16">examen normal</tspan><tspan x="735.0" dy="16">descarta</tspan></text><text x="885.0" y="897.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: cerca de 10 %;</tspan><tspan x="885.0" dy="16">nunca debe pasarse</tspan><tspan x="885.0" dy="16">por alto</tspan></text><rect x="40.0" y="822.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="966.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="994.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1016.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Atrofia del endometrio y de la vagina por déficit de estrógenos: epitelio fino y frágil que sangra poco y de color marrón; 60 a 80 % según las series.</tspan><tspan x="58.0" dy="18">• Siguen pólipos, terapia hormonal, hiperplasia (obesidad o estrógenos sin oposición) y cáncer de endometrio (cerca de 10 %).</tspan><tspan x="58.0" dy="18">• Pólipo cervical y carúncula uretral son causas locales que el examen normal descarta. Ecografía transvaginal: 4 mm o menos hace improbable el cáncer;</tspan><tspan x="58.0" dy="18">   más de 4 mm obliga a biopsia.</tspan><tspan x="58.0" dy="18">• Alerta: la atrofia es diagnóstico de exclusión; se confirma con imagen o biopsia antes de tranquilizar. Tratamiento: estrógenos vaginales en dosis bajas.</tspan></text><text x="58.0" y="1110.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, Committee Opinion 734 (Obstet Gynecol 2018); Williams Obstetricia, 26.ª ed. (2022).</tspan></text></svg>