<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="945" viewBox="0 0 1000 945" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Niño con debilidad flácida de las piernas y nivel sensitivo torácico tras una virosis: mielitis transversa"><title>Niño con debilidad flácida de las piernas y nivel sensitivo torácico tras una virosis: mielitis transversa</title><rect x="0.75" y="0.75" width="998.5" height="943.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Enfermedades de la médula espinal · mielitis transversa</tspan></text><rect x="529.6" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="593.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="593.9" dy="0">NEUROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Mielitis transversa</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Inflamación de la médula, a menudo días o semanas después de una infección viral.</tspan><tspan x="58.0" dy="17">Debilidad de piernas, nivel sensitivo y trastorno de esfínteres; al inicio, flacidez (choque</tspan><tspan x="58.0" dy="17">medular).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Infección viral previa.</tspan><tspan x="640.0" dy="16">Debilidad brusca y progresiva de las piernas, flácida;</tspan><tspan x="640.0" dy="16">nivel sensitivo torácico medio.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEBILIDAD AGUDA DE PIERNAS EN UN NIÑO: ¿DÓNDE ESTÁ LA LESIÓN?</tspan></text><text x="614.0" y="297.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,309.0 580.0,309.0 531.7,385.0 88.3,385.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="325.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="357.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="399"><tspan x="310.0" dy="0">Paraparesia flácida + nivel sensitivo torácico</tspan></text><line x1="559.8" y1="347.0" x2="606.0" y2="347.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="318.0" width="119.5" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="673.7" y="335.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="673.7" dy="0">Meningoencefalitis</tspan></text><rect x="739.5" y="318.0" width="119.5" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="799.2" y="335.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="799.2" dy="0">Esclerosis múltiple</tspan></text><rect x="864.9" y="318.0" width="84.1" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="907.0" y="335.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="907.0" dy="0">Poliomielitis</tspan></text><rect x="614.0" y="350.0" width="153.5" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="690.8" y="367.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="690.8" dy="0">Polineuropatía infecciosa</tspan></text><rect x="773.5" y="350.0" width="116.2" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="831.6" y="367.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="831.6" dy="0">Mielitis transversa</tspan></text><polygon points="88.3,389.0 531.7,389.0 483.3,445.0 136.7,445.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="162.7" cy="417.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="162.7" y="421.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="162.7" dy="0">1</tspan></text><text x="320.0" y="421.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="283"><tspan x="320.0" dy="0">¿Conciencia normal, primer episodio?</tspan></text><line x1="511.5" y1="417.0" x2="606.0" y2="417.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="404.0" width="131.6" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="679.8" y="421.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="679.8" dy="0">✕ Meningoencefalitis</tspan></text><line x1="636.0" y1="417.5" x2="735.6" y2="417.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="751.6" y="404.0" width="131.6" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="817.4" y="421.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="817.4" dy="0">✕ Esclerosis múltiple</tspan></text><line x1="773.6" y1="417.5" x2="873.1" y2="417.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="136.7,449.0 483.3,449.0 435.0,509.0 185.0,509.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="479.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="483.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">2</tspan></text><text x="320.0" y="475.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">¿Hay nivel sensitivo (no es</tspan><tspan x="320.0" dy="17">solo motora ni periférica)?</tspan></text><line x1="463.2" y1="479.0" x2="606.0" y2="479.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="466.0" width="96.2" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="662.1" y="483.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="662.1" dy="0">✕ Poliomielitis</tspan></text><line x1="636.0" y1="479.5" x2="700.2" y2="479.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="716.2" y="466.0" width="165.6" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="799.0" y="483.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="799.0" dy="0">✕ Polineuropatía infecciosa</tspan></text><line x1="738.2" y1="479.5" x2="871.8" y2="479.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="513.0" x2="310.0" y2="532.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,531.0 315.0,531.0 310.0,539.0" fill="#0f766e"/><rect x="140.0" y="543.0" width="340.0" height="74.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="572.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">MIELITIS TRANSVERSA</tspan></text><text x="310.0" y="596.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Nivel sensitivo = médula</tspan></text><rect x="370.6" y="532.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="547.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="550.4" width="346.0" height="60.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="570.4" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="588.4" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">RM urgente + corticoides EV.</tspan></text><text x="40.0" y="657.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="667.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="698.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="690.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Polineuropatía</tspan><tspan x="285.0" dy="17">infecciosa</tspan></text><rect x="363.0" y="670.9" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="698.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Mielitis transversa</tspan></text><text x="585.0" y="698.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Poliomielitis</tspan></text><text x="735.0" y="698.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Meningoencefalitis</tspan></text><text x="885.0" y="698.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Esclerosis múltiple</tspan></text><rect x="40.0" y="721.9" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="721.9" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="750.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="750.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: sin nivel sensitivo</tspan></text><text x="435.0" y="742.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: nivel sensitivo +</tspan><tspan x="435.0" dy="16">paraparesia</tspan></text><text x="585.0" y="742.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: puramente motora,</tspan><tspan x="585.0" dy="16">asimétrica</tspan></text><text x="735.0" y="750.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: conciencia normal</tspan></text><text x="885.0" y="742.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: rara en niños,</tspan><tspan x="885.0" dy="16">recurrente</tspan></text><rect x="40.0" y="667.9" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="795.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="823.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="845.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• RM de columna urgente: descartar compresión medular (tumor, absceso, hematoma).</tspan><tspan x="58.0" dy="18">• Metilprednisolona EV en dosis altas; plasmaféresis si no mejora.</tspan><tspan x="58.0" dy="18">• Buscar NMO (anti-AQP4) y anti-MOG: cambian el tratamiento y el pronóstico.</tspan></text><text x="58.0" y="903.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Transverse Myelitis Consortium Working Group, criterios diagnósticos (2002); AAN, mielitis transversa (2011); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>