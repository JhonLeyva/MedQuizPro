<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1268" viewBox="0 0 1000 1268" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la fractura abierta el desbridamiento quirúrgico urgente es el tratamiento inicial, tras antibiótico e inmovilización provisional"><title>En la fractura abierta el desbridamiento quirúrgico urgente es el tratamiento inicial, tras antibiótico e inmovilización provisional</title><rect x="0.75" y="0.75" width="998.5" height="1266.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Traumatología · fracturas abiertas</tspan></text><rect x="400.3" y="32.0" width="135.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="468.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="119"><tspan x="468.0" dy="0">TRAUMATOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Fractura abierta</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El foco óseo comunica con el exterior y está contaminado.</tspan><tspan x="58.0" dy="17">Riesgo de infección y de pseudoartrosis.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de manejo inicial</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es el manejo inicial de las fracturas abiertas?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TIEMPOS DEL MANEJO DE UNA FRACTURA ABIERTA</tspan></text><line x1="290.0" y1="275.0" x2="290.0" y2="507.0" stroke="#e2e8f0" stroke-width="1"/><text x="290.0" y="271.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="290.0" dy="0">0</tspan></text><line x1="398.3" y1="275.0" x2="398.3" y2="507.0" stroke="#e2e8f0" stroke-width="1"/><text x="398.3" y="271.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="398.3" dy="0">4</tspan></text><line x1="506.7" y1="275.0" x2="506.7" y2="507.0" stroke="#e2e8f0" stroke-width="1"/><text x="506.7" y="271.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="506.7" dy="0">8</tspan></text><line x1="615.0" y1="275.0" x2="615.0" y2="507.0" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="271.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="615.0" dy="0">12</tspan></text><line x1="723.3" y1="275.0" x2="723.3" y2="507.0" stroke="#e2e8f0" stroke-width="1"/><text x="723.3" y="271.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="723.3" dy="0">16</tspan></text><line x1="831.7" y1="275.0" x2="831.7" y2="507.0" stroke="#e2e8f0" stroke-width="1"/><text x="831.7" y="271.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="831.7" dy="0">20</tspan></text><line x1="940.0" y1="275.0" x2="940.0" y2="507.0" stroke="#e2e8f0" stroke-width="1"/><text x="940.0" y="271.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="940.0" dy="0">24</tspan></text><text x="940.0" y="257.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="end" data-max="60"><tspan x="940.0" dy="0">horas</tspan></text><rect x="40.0" y="279.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="295.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Reanimación ATLS y férula</tspan></text><text x="48.0" y="310.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Cobertura estéril e inmovilización provisional</tspan></text><rect x="290.0" y="287.0" width="27.1" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="333.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Antibiótico intravenoso</tspan></text><text x="48.0" y="348.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Cefalosporina; añadir gramnegativos en el tipo III</tspan></text><rect x="290.0" y="325.0" width="27.1" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><rect x="40.0" y="355.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="371.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Antitetánica</tspan></text><text x="48.0" y="386.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Profilaxis</tspan></text><rect x="290.0" y="363.0" width="27.1" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Desbridamiento urgente y lavado</tspan></text><text x="48.0" y="424.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Manejo inicial definitivo</tspan></text><rect x="317.1" y="401.0" width="622.9" height="22.0" rx="6" fill="#ea580c" stroke="none" stroke-width="1.5"/><rect x="40.0" y="431.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="447.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Estabilización ósea</tspan></text><text x="48.0" y="462.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Fijación externa o clavo, tras limpiar</tspan></text><rect x="452.5" y="439.0" width="487.5" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="485.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Cobertura de partes blandas</tspan></text><text x="48.0" y="500.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Cierre o colgajo</tspan></text><rect x="615.0" y="477.0" width="325.0" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><line x1="317.1" y1="277.0" x2="317.1" y2="513.0" stroke="#b91c1c" stroke-width="2.6"/><rect x="291.4" y="513.0" width="51.3" height="22.0" rx="11" fill="#b91c1c" stroke="none" stroke-width="1.5"/><text x="317.1" y="528.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="317.1" dy="0">1 hora</tspan></text><rect x="40.0" y="559.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="585.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Fractura abierta = desbridamiento urgente</tspan></text><text x="60.0" y="604.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La fijación definitiva se hace después de limpiar el foco.</tspan></text><text x="40.0" y="665.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN DE GUSTILO Y ANDERSON</tspan></text><rect x="40.0" y="677.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="696.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Tipo</tspan></text><text x="220.0" y="696.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="734"><tspan x="220.0" dy="0">Herida y lesión</tspan></text><rect x="40.0" y="706.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="725.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">I</tspan></text><text x="220.0" y="725.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="734"><tspan x="220.0" dy="0">Herida menor de 1 cm</tspan></text><rect x="40.0" y="735.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="754.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">II</tspan></text><text x="220.0" y="754.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="734"><tspan x="220.0" dy="0">Herida de 1 a 10 cm sin daño extenso de partes blandas</tspan></text><rect x="40.0" y="764.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="783.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">IIIA</tspan></text><text x="220.0" y="783.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="734"><tspan x="220.0" dy="0">Mayor de 10 cm o alta energía; cobertura posible</tspan></text><rect x="110.6" y="767.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="156.0" y="782.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="156.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="793.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="812.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">IIIB</tspan></text><text x="220.0" y="812.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="734"><tspan x="220.0" dy="0">Pérdida de tejido que requiere colgajo</tspan></text><rect x="40.0" y="822.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="841.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">IIIC</tspan></text><text x="220.0" y="841.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="734"><tspan x="220.0" dy="0">Lesión vascular que requiere reparación</tspan></text><text x="40.0" y="867.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">El caso no precisa el tipo; el manejo inicial es el mismo.</tspan></text><text x="40.0" y="914.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="924.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="955.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="955.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Placas y tornillos</tspan></text><rect x="363.0" y="927.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="946.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Desbridamiento</tspan><tspan x="435.0" dy="17">urgente</tspan></text><text x="585.0" y="955.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Tutores externos</tspan></text><text x="735.0" y="946.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Inmovilización</tspan><tspan x="735.0" dy="17">endomedular</tspan></text><text x="885.0" y="955.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Aparato de yeso</tspan></text><rect x="40.0" y="978.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="978.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1015.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Manejo inicial?</tspan></text><text x="285.0" y="999.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: atrapa la</tspan><tspan x="285.0" dy="16">contaminación sin</tspan><tspan x="285.0" dy="16">limpiar</tspan></text><text x="435.0" y="999.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: tratamiento</tspan><tspan x="435.0" dy="16">definitivo urgente de la</tspan><tspan x="435.0" dy="16">lesión</tspan></text><text x="585.0" y="999.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: estabiliza, pero</tspan><tspan x="585.0" dy="16">después del</tspan><tspan x="585.0" dy="16">desbridamiento</tspan></text><text x="735.0" y="999.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: atrapa la</tspan><tspan x="735.0" dy="16">contaminación sin</tspan><tspan x="735.0" dy="16">limpiar</tspan></text><text x="885.0" y="1007.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: yeso sin limpieza</tspan><tspan x="885.0" dy="16">previa</tspan></text><rect x="40.0" y="924.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1068.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1096.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1118.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Gustilo-Anderson: I herida menor de 1 cm; II de 1 a 10 cm sin daño extenso; III mayor de 10 cm o daño grave (IIIA cobertura posible, IIIB colgajo, IIIC</tspan><tspan x="58.0" dy="18">   lesión vascular).</tspan><tspan x="58.0" dy="18">• Primero ATLS, cobertura estéril, férula provisional, antitetánica y antibiótico IV temprano, de preferencia en la primera hora.</tspan><tspan x="58.0" dy="18">• Desbridamiento urgente con lavado abundante y resección de tejido desvitalizado; luego estabilización ósea y cobertura de partes blandas.</tspan><tspan x="58.0" dy="18">• Alerta: placas, enclavado o yeso sin limpieza previa atrapan la contaminación; la fijación externa es estabilización, no el primer paso.</tspan></text><text x="58.0" y="1212.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Hoff WS y cols. EAST practice management guidelines: update to practice management guidelines for prophylactic antibiotic use in open fractures (J Trauma 2011);</tspan><tspan x="58.0" dy="15">ATLS, 10.ª ed. (American College of Surgeons, 2018).</tspan></text></svg>