<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1202" viewBox="0 0 1000 1202" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la miastenia gravis los anticuerpos atacan el receptor nicotínico de acetilcolina de la placa motora"><title>En la miastenia gravis los anticuerpos atacan el receptor nicotínico de acetilcolina de la placa motora</title><rect x="0.75" y="0.75" width="998.5" height="1200.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neurología · miastenia gravis</tspan></text><rect x="373.6" y="32.0" width="113.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="430.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="98"><tspan x="430.5" dy="0">NEUROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Miastenia gravis</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Enfermedad autoinmune de la unión neuromuscular.</tspan><tspan x="58.0" dy="17">Debilidad fluctuante que empeora con el esfuerzo y mejora con el reposo.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 38 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Ptosis palpebral, dificultad para la marcha y parálisis</tspan><tspan x="640.0" dy="16">del motor ocular externo bilateral.</tspan><tspan x="640.0" dy="16">Debilidad proximal; patología autoinmune de la unión</tspan><tspan x="640.0" dy="16">neuromuscular. ¿Receptores de qué neurotransmisor?</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE PRODUCE LA DEBILIDAD DE LA MIASTENIA GRAVIS</tspan></text><text x="40.0" y="313.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="430"><tspan x="40.0" dy="0">QUÉ OCURRE</tspan></text><text x="516.0" y="313.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="444"><tspan x="516.0" dy="0">EFECTO</tspan></text><rect x="40.0" y="323.0" width="430.0" height="75.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="360.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="365.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><text x="84.0" y="349.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Autoanticuerpos</tspan></text><text x="84.0" y="366.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">IgG contra el receptor nicotínico de acetilcolina (en 10-15 %, MuSK</tspan><tspan x="84.0" dy="16">o LRP4)</tspan></text><line x1="476.0" y1="360.5" x2="503.0" y2="360.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,355.5 502.0,365.5 510.0,360.5" fill="#ea580c"/><rect x="516.0" y="333.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="357.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Bloquean el receptor y activan complemento</tspan></text><text x="530.0" y="374.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Se acelera su degradación</tspan></text><line x1="255.0" y1="400.0" x2="255.0" y2="413.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,412.0 260.0,412.0 255.0,420.0" fill="#0f766e"/><rect x="40.0" y="422.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="451.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="456.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">2</tspan></text><text x="84.0" y="448.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Placa motora</tspan></text><text x="84.0" y="465.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Menos receptores en la superficie postsináptica</tspan></text><line x1="476.0" y1="451.5" x2="503.0" y2="451.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,446.5 502.0,456.5 510.0,451.5" fill="#ea580c"/><rect x="516.0" y="424.0" width="444.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="530.0" y="448.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Receptor de acetilcolina afectado (este caso)</tspan></text><text x="530.0" y="465.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">El potencial de placa no alcanza el umbral</tspan></text><line x1="255.0" y1="483.0" x2="255.0" y2="496.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,495.0 260.0,495.0 255.0,503.0" fill="#0f766e"/><rect x="40.0" y="505.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="534.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="539.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">3</tspan></text><text x="84.0" y="531.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Clínica</tspan></text><text x="84.0" y="548.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Ptosis, oftalmoparesia y debilidad proximal fluctuante</tspan></text><line x1="476.0" y1="534.5" x2="503.0" y2="534.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,529.5 502.0,539.5 510.0,534.5" fill="#ea580c"/><rect x="516.0" y="507.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="531.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Empeora con el esfuerzo y mejora con el reposo</tspan></text><text x="530.0" y="548.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Prueba de hielo o edrofonio</tspan></text><line x1="255.0" y1="566.0" x2="255.0" y2="579.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,578.0 260.0,578.0 255.0,586.0" fill="#0f766e"/><rect x="40.0" y="588.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="617.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="622.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">4</tspan></text><text x="84.0" y="614.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Estudio</tspan></text><text x="84.0" y="631.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Anticuerpos séricos, estimulación repetitiva y tomografía de tórax</tspan></text><line x1="476.0" y1="617.5" x2="503.0" y2="617.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,612.5 502.0,622.5 510.0,617.5" fill="#ea580c"/><rect x="516.0" y="590.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="614.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Buscar timoma o hiperplasia tímica</tspan></text><text x="530.0" y="631.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Timectomía si hay timoma</tspan></text><line x1="255.0" y1="649.0" x2="255.0" y2="662.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,661.0 260.0,661.0 255.0,669.0" fill="#0f766e"/><rect x="40.0" y="671.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="700.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="705.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">5</tspan></text><text x="84.0" y="697.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Tratamiento</tspan></text><text x="84.0" y="714.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Piridostigmina, prednisona y azatioprina</tspan></text><line x1="476.0" y1="700.5" x2="503.0" y2="700.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,695.5 502.0,705.5 510.0,700.5" fill="#ea580c"/><rect x="516.0" y="673.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="697.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Crisis miasténica</tspan></text><text x="530.0" y="714.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Inmunoglobulina o plasmaféresis</tspan></text><rect x="40.0" y="748.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="774.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Miastenia gravis = receptor de acetilcolina</tspan></text><text x="60.0" y="793.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Dopamina, histamina, GABA y serotonina no intervienen en la unión neuromuscular.</tspan></text><text x="40.0" y="860.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="870.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="892.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="892.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Dopamina</tspan></text><text x="435.0" y="892.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Histamina</tspan></text><text x="585.0" y="892.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">GABA</tspan></text><text x="735.0" y="892.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Serotonina</tspan></text><rect x="813.0" y="873.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="892.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Acetilcolina</tspan></text><rect x="40.0" y="907.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="907.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="936.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Receptores afectados?</tspan></text><text x="285.0" y="928.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no interviene en la</tspan><tspan x="285.0" dy="16">unión neuromuscular</tspan></text><text x="435.0" y="928.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no interviene en la</tspan><tspan x="435.0" dy="16">unión neuromuscular</tspan></text><text x="585.0" y="928.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no interviene en la</tspan><tspan x="585.0" dy="16">unión neuromuscular</tspan></text><text x="735.0" y="928.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no interviene en la</tspan><tspan x="735.0" dy="16">unión neuromuscular</tspan></text><text x="885.0" y="928.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: anticuerpos contra</tspan><tspan x="885.0" dy="16">el receptor nicotínico</tspan></text><rect x="40.0" y="870.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="981.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1009.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1031.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Anticuerpos IgG contra el receptor nicotínico de acetilcolina: lo bloquean, aceleran su degradación y activan complemento. En 10-15 % van contra MuSK</tspan><tspan x="58.0" dy="18">   o LRP4.</tspan><tspan x="58.0" dy="18">• Asociada a hiperplasia tímica y timoma: la tomografía de tórax es obligatoria. Diagnóstico: prueba de hielo o edrofonio, anticuerpos séricos y estimulación</tspan><tspan x="58.0" dy="18">   repetitiva (decremento mayor de 10 %).</tspan><tspan x="58.0" dy="18">• Tratamiento: piridostigmina, prednisona y azatioprina; timectomía si hay timoma, o con anticuerpos antirreceptor y menores de 50-65 años. Crisis:</tspan><tspan x="58.0" dy="18">   inmunoglobulina o plasmaféresis.</tspan><tspan x="58.0" dy="18">• Evitar aminoglucósidos, fluoroquinolonas y magnesio, que agravan la debilidad.</tspan></text><text x="58.0" y="1161.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Narayanaswami, International consensus guidance for management of myasthenia gravis: 2020 update (Neurology 2021;96:114); Harrison, 21.ª ed. (2022).</tspan></text></svg>