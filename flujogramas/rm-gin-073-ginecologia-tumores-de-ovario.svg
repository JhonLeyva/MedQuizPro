<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1022" viewBox="0 0 1000 1022" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la mujer joven con tumor sólido de ovario el diagnóstico más probable es el disgerminoma"><title>En la mujer joven con tumor sólido de ovario el diagnóstico más probable es el disgerminoma</title><rect x="0.75" y="0.75" width="998.5" height="1020.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ginecología · tumores de ovario</tspan></text><rect x="390.0" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="469.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="469.8" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tumores germinales</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Entre los 10 y 30 años la mayoría de los tumores ováricos son germinales.</tspan><tspan x="58.0" dy="17">El disgerminoma es el maligno más frecuente.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 21 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Nulípara, aumento del volumen abdominal por 3</tspan><tspan x="640.0" dy="16">meses.</tspan><tspan x="640.0" dy="16">Tumor abdominopélvico de 16 cm, sólido en la</tspan><tspan x="640.0" dy="16">ecografía.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><rect x="40.0" y="277.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="303.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Mujer joven + tumor ovárico sólido y grande = disgerminoma</tspan></text><text x="60.0" y="322.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Los tumores benignos o de bajo potencial (fibroma, Brenner) aparecen en mujeres mayores.</tspan></text><text x="40.0" y="383.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TUMORES SÓLIDOS DE OVARIO: EDAD TÍPICA Y DATO CLAVE</tspan></text><rect x="40.0" y="395.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="414.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Tumor</tspan></text><text x="280.0" y="414.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Origen y edad</tspan></text><text x="625.0" y="414.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Dato clave</tspan></text><rect x="40.0" y="424.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="443.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Disgerminoma</tspan></text><text x="280.0" y="443.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Germinal; 10 a 30 años</tspan></text><text x="625.0" y="443.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">LDH elevada; a veces β-hCG o fosfatasa alcalina</tspan><tspan x="625.0" dy="15">placentaria; muy radiosensible</tspan></text><rect x="170.6" y="435.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="216.0" y="450.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="216.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="468.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="487.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Tumor del saco vitelino</tspan></text><text x="280.0" y="487.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Germinal; mujeres jóvenes</tspan></text><text x="625.0" y="487.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Alfafetoproteína elevada</tspan></text><rect x="40.0" y="497.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="516.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Tumor de la granulosa</tspan></text><text x="280.0" y="516.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Cordones sexuales; sobre todo después de los 50 años</tspan></text><text x="625.0" y="516.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Secreta estrógenos</tspan></text><rect x="40.0" y="526.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="545.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Fibroma de ovario</tspan></text><text x="280.0" y="545.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Estroma; peri y posmenopausia</tspan></text><text x="625.0" y="545.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Benigno</tspan></text><rect x="40.0" y="555.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="574.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Tumor de Brenner</tspan></text><text x="280.0" y="574.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Epitelial; peri y posmenopausia</tspan></text><text x="625.0" y="574.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Bajo potencial o benigno</tspan></text><text x="40.0" y="600.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">El fibroma subseroso es un mioma del útero, no un tumor ovárico.</tspan></text><text x="40.0" y="647.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="657.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="688.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="688.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Fibroma subseroso</tspan></text><text x="435.0" y="679.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Tumor de células de</tspan><tspan x="435.0" dy="17">la granulosa</tspan></text><rect x="513.0" y="660.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="688.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Disgerminoma</tspan></text><text x="735.0" y="688.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Fibroma de ovario</tspan></text><text x="885.0" y="688.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Tumor de Brenner</tspan></text><rect x="40.0" y="711.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="711.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="740.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico más</tspan><tspan x="54.0" dy="16">probable?</tspan></text><text x="285.0" y="740.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es un mioma</tspan><tspan x="285.0" dy="16">uterino, no ovárico</tspan></text><text x="435.0" y="732.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: aparece sobre</tspan><tspan x="435.0" dy="16">todo después de los 50</tspan><tspan x="435.0" dy="16">años</tspan></text><text x="585.0" y="732.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: tumor germinal</tspan><tspan x="585.0" dy="16">sólido de la mujer</tspan><tspan x="585.0" dy="16">joven</tspan></text><text x="735.0" y="740.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: tumor benigno de</tspan><tspan x="735.0" dy="16">mujeres mayores</tspan></text><text x="885.0" y="732.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: benigno o de bajo</tspan><tspan x="885.0" dy="16">potencial, en mujeres</tspan><tspan x="885.0" dy="16">mayores</tspan></text><rect x="40.0" y="657.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="801.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="829.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="851.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El disgerminoma es el equivalente ovárico del seminoma: tumor sólido, lobulado, de crecimiento rápido y gran tamaño, con células claras y estroma</tspan><tspan x="58.0" dy="18">   linfocitario.</tspan><tspan x="58.0" dy="18">• Puede elevar la lactato deshidrogenasa y, a veces, la β-hCG o la fosfatasa alcalina placentaria. Con fenotipo anormal se pide cariotipo (disgenesia</tspan><tspan x="58.0" dy="18">   gonadal).</tspan><tspan x="58.0" dy="18">• Es muy radiosensible y quimiosensible, y el pronóstico es bueno.</tspan><tspan x="58.0" dy="18">• Fibroma y Brenner son benignos o de bajo potencial, de mujeres peri o posmenopáusicas; la granulosa secreta estrógenos y aparece sobre todo</tspan><tspan x="58.0" dy="18">   después de los 50 años.</tspan></text><text x="58.0" y="981.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ESMO Clinical Practice Guidelines, cáncer de ovario no epitelial (Ann Oncol 2018); Williams Obstetricia, 26.ª ed. (2022).</tspan></text></svg>