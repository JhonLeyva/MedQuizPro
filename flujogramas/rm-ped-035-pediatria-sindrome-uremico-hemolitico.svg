<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1066" viewBox="0 0 1000 1066" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Diarrea previa, anemia hemolítica, petequias y oliguria: síndrome urémico hemolítico; hospitalizar y dar soporte sin antibióticos"><title>Diarrea previa, anemia hemolítica, petequias y oliguria: síndrome urémico hemolítico; hospitalizar y dar soporte sin antibióticos</title><rect x="0.75" y="0.75" width="998.5" height="1065.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · síndrome urémico hemolítico</tspan></text><rect x="436.5" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="485.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="485.6" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Síndrome urémico hemolítico típico</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">E. coli productora de toxina Shiga (O157:H7): daña el endotelio renal y forma microtrombos.</tspan><tspan x="58.0" dy="17">Tríada: anemia hemolítica, plaquetopenia e insuficiencia renal aguda.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 6 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Diarrea acuosa tratada con antibióticos; luego fiebre,</tspan><tspan x="640.0" dy="16">irritabilidad, petequias, equimosis y menos diuresis.</tspan><tspan x="640.0" dy="16">Hemograma con anemia hemolítica.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="377.0" x2="500.0" y2="407.0" stroke="#94a3b8" stroke-width="2"/><line x1="149.8" y1="407.0" x2="850.2" y2="407.0" stroke="#94a3b8" stroke-width="2"/><line x1="149.8" y1="407.0" x2="149.8" y2="436.0" stroke="#94a3b8" stroke-width="2"/><polygon points="144.8,435.0 154.8,435.0 149.8,443.0" fill="#94a3b8"/><line x1="383.2" y1="407.0" x2="383.2" y2="436.0" stroke="#94a3b8" stroke-width="2"/><polygon points="378.2,435.0 388.2,435.0 383.2,443.0" fill="#94a3b8"/><line x1="616.8" y1="407.0" x2="616.8" y2="436.0" stroke="#94a3b8" stroke-width="2"/><polygon points="611.8,435.0 621.8,435.0 616.8,443.0" fill="#94a3b8"/><line x1="850.2" y1="407.0" x2="850.2" y2="436.0" stroke="#94a3b8" stroke-width="2"/><polygon points="845.2,435.0 855.2,435.0 850.2,443.0" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#0f766e"/><line x1="500.0" y1="377.0" x2="500.0" y2="407.0" stroke="#0f766e" stroke-width="3"/><line x1="149.8" y1="407.0" x2="500.0" y2="407.0" stroke="#0f766e" stroke-width="3"/><line x1="149.8" y1="407.0" x2="149.8" y2="436.0" stroke="#0f766e" stroke-width="3"/><polygon points="144.8,435.0 154.8,435.0 149.8,443.0" fill="#0f766e"/><rect x="72.6" y="416.0" width="154.3" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="149.8" y="428.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="149.8" dy="0">Tríada completa (este caso)</tspan></text><rect x="304.0" y="416.0" width="158.5" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="383.2" y="428.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="383.2" dy="0">Antibióticos o antidiarreicos</tspan></text><rect x="504.5" y="416.0" width="224.5" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="616.8" y="428.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="616.8" dy="0">Complemento alterado, sin diarrea previa</tspan></text><rect x="740.3" y="416.0" width="219.9" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="850.2" y="428.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="850.2" dy="0">Menos plaquetas y ADAMTS13 muy bajo</tspan></text><polygon points="240.0,342.0 266.0,307.0 734.0,307.0 760.0,342.0 734.0,377.0 266.0,377.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="342.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="347.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="338.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Niño con diarrea previa, anemia hemolítica, petequias y</tspan><tspan x="519.0" dy="17">oliguria</tspan></text><rect x="40.0" y="443.0" width="219.5" height="175.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="149.8" y="471.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="192"><tspan x="149.8" dy="0">SUH TÍPICO</tspan></text><text x="149.8" y="494.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="192"><tspan x="149.8" dy="0">Hospitalizar con nefrología</tspan><tspan x="149.8" dy="17">pediátrica</tspan><tspan x="149.8" dy="17">Líquidos y electrolitos estrictos;</tspan><tspan x="149.8" dy="17">tratar hipertensión</tspan><tspan x="149.8" dy="17">Diálisis si anuria, sobrecarga o</tspan><tspan x="149.8" dy="17">uremia</tspan><tspan x="149.8" dy="17">Glóbulos rojos si Hb &lt; 6 a 7 g/dL</tspan></text><rect x="273.5" y="443.0" width="219.5" height="175.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="383.2" y="513.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="192"><tspan x="383.2" dy="0">CONTRAINDICADOS</tspan></text><text x="383.2" y="536.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="192"><tspan x="383.2" dy="0">Liberan toxina Shiga</tspan><tspan x="383.2" dy="17">Aumentan el riesgo de SUH</tspan></text><rect x="507.0" y="443.0" width="219.5" height="175.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="616.8" y="522.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="192"><tspan x="616.8" dy="0">SUH ATÍPICO</tspan></text><text x="616.8" y="545.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="192"><tspan x="616.8" dy="0">Eculizumab</tspan></text><rect x="740.5" y="443.0" width="219.5" height="175.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="850.2" y="513.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="192"><tspan x="850.2" dy="0">PTT</tspan></text><text x="850.2" y="536.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="192"><tspan x="850.2" dy="0">Rara en niños</tspan><tspan x="850.2" dy="17">Más compromiso neurológico</tspan></text><text x="40.0" y="658.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="668.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="708.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="671.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="691.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hospitalizar,</tspan><tspan x="285.0" dy="17">soporte renal y</tspan><tspan x="285.0" dy="17">transfusión</tspan></text><text x="435.0" y="691.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hidratar rápido,</tspan><tspan x="435.0" dy="17">antibióticos y</tspan><tspan x="435.0" dy="17">oxígeno</tspan></text><text x="585.0" y="691.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Ambulatorio,</tspan><tspan x="585.0" dy="17">diuréticos y</tspan><tspan x="585.0" dy="17">antibióticos</tspan></text><text x="735.0" y="691.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hospitalizar,</tspan><tspan x="735.0" dy="17">hidratar y</tspan><tspan x="735.0" dy="17">antibióticos</tspan></text><text x="885.0" y="691.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hospitalizar,</tspan><tspan x="885.0" dy="17">antibióticos amplios</tspan><tspan x="885.0" dy="17">y transfundir</tspan></text><rect x="40.0" y="739.5" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="739.5" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="784.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Conducta a seguir?</tspan></text><text x="285.0" y="768.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: soporte renal,</tspan><tspan x="285.0" dy="16">transfusión y sin</tspan><tspan x="285.0" dy="16">antibióticos</tspan></text><text x="435.0" y="760.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: los antibióticos</tspan><tspan x="435.0" dy="16">aumentan el riesgo; no</tspan><tspan x="435.0" dy="16">es un manejo</tspan><tspan x="435.0" dy="16">ambulatorio</tspan></text><text x="585.0" y="768.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no debe ser</tspan><tspan x="585.0" dy="16">ambulatorio ni con</tspan><tspan x="585.0" dy="16">antibióticos</tspan></text><text x="735.0" y="776.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: los antibióticos</tspan><tspan x="735.0" dy="16">están contraindicados</tspan></text><text x="885.0" y="768.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: los antibióticos de</tspan><tspan x="885.0" dy="16">amplio espectro están</tspan><tspan x="885.0" dy="16">contraindicados</tspan></text><rect x="40.0" y="668.5" width="920.0" height="153.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="845.5" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="873.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="895.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La tríada aparece 5 a 10 días después de la diarrea, a menudo con sangre. Los antibióticos y los antidiarreicos aumentan el riesgo de SUH al liberar</tspan><tspan x="58.0" dy="18">   toxina: están contraindicados.</tspan><tspan x="58.0" dy="18">• Manejo de soporte en hospital con nefrología pediátrica: control de líquidos y electrolitos, antihipertensivos, diálisis si hay anuria, sobrecarga o uremia</tspan><tspan x="58.0" dy="18">   grave.</tspan><tspan x="58.0" dy="18">• Transfundir glóbulos rojos si la hemoglobina cae por debajo de 6 a 7 g/dL; evitar plaquetas salvo sangrado o procedimiento.</tspan><tspan x="58.0" dy="18">• SUH atípico (complemento): eculizumab. La PTT es rara en niños y tiene ADAMTS13 muy bajo. Nota: el comentario del libro lo atribuía a PTT; el cuadro</tspan><tspan x="58.0" dy="18">   es SUH típico.</tspan></text><text x="58.0" y="1025.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Fakhouri F et al., Haemolytic uraemic syndrome, Lancet 2017;390:681-696; Freedman SB et al., Clin Infect Dis 2016;62:1251-1258; Nelson 22.ª ed. (2024).</tspan></text></svg>