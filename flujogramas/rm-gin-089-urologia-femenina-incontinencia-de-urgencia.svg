<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1178" viewBox="0 0 1000 1178" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Escape de orina con urgencia inminente que no llega al baño: incontinencia urinaria de urgencia"><title>Escape de orina con urgencia inminente que no llega al baño: incontinencia urinaria de urgencia</title><rect x="0.75" y="0.75" width="998.5" height="1176.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Urología femenina · incontinencia de urgencia</tspan></text><rect x="472.1" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="551.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="551.8" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Incontinencia de urgencia</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Pérdida de orina precedida por urgencia miccional (ICS).</tspan><tspan x="58.0" dy="17">Suele deberse a hiperactividad del detrusor.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 31 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Sensación inminente de orinar, no alcanza a llegar al</tspan><tspan x="640.0" dy="16">baño y se escapa la orina.</tspan><tspan x="640.0" dy="16">¿Cuál es el diagnóstico más probable?</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="149.8" y1="395.0" x2="850.2" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="149.8" y1="395.0" x2="149.8" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="144.8,423.0 154.8,423.0 149.8,431.0" fill="#94a3b8"/><line x1="383.2" y1="395.0" x2="383.2" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="378.2,423.0 388.2,423.0 383.2,431.0" fill="#94a3b8"/><line x1="616.8" y1="395.0" x2="616.8" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="611.8,423.0 621.8,423.0 616.8,431.0" fill="#94a3b8"/><line x1="850.2" y1="395.0" x2="850.2" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="845.2,423.0 855.2,423.0 850.2,431.0" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#0f766e"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="149.8" y1="395.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="149.8" y1="395.0" x2="149.8" y2="424.0" stroke="#0f766e" stroke-width="3"/><polygon points="144.8,423.0 154.8,423.0 149.8,431.0" fill="#0f766e"/><rect x="66.3" y="404.0" width="166.8" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="149.8" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="149.8" dy="0">Urgencia y escape (este caso)</tspan></text><rect x="315.0" y="404.0" width="136.5" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="383.2" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="383.2" dy="0">Fuga con tos o ejercicio</tspan></text><rect x="565.2" y="404.0" width="103.2" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="616.8" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="616.8" dy="0">Fuga permanente</tspan></text><rect x="786.2" y="404.0" width="128.1" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="850.2" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="850.2" dy="0">Chorro débil y residuo</tspan></text><polygon points="240.0,336.0 266.0,307.0 734.0,307.0 760.0,336.0 734.0,365.0 266.0,365.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="336.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="341.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="340.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Mujer con escape involuntario de orina</tspan></text><rect x="40.0" y="431.0" width="219.5" height="125.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="149.8" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="192"><tspan x="149.8" dy="0">INCONTINENCIA DE</tspan><tspan x="149.8" dy="18.5">URGENCIA</tspan></text><text x="149.8" y="500.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="192"><tspan x="149.8" dy="0">Hiperactividad del detrusor</tspan><tspan x="149.8" dy="17">Conductual y luego</tspan><tspan x="149.8" dy="17">antimuscarínicos o mirabegrón</tspan></text><rect x="273.5" y="431.0" width="219.5" height="125.9" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="383.2" y="467.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="192"><tspan x="383.2" dy="0">INCONTINENCIA DE</tspan><tspan x="383.2" dy="18.5">ESFUERZO</tspan></text><text x="383.2" y="509.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="192"><tspan x="383.2" dy="0">Falla del soporte uretral</tspan><tspan x="383.2" dy="17">Sin contracción del detrusor</tspan></text><rect x="507.0" y="431.0" width="219.5" height="125.9" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="616.8" y="468.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="192"><tspan x="616.8" dy="0">INCONTINENCIA CONTINUA</tspan></text><text x="616.8" y="491.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="192"><tspan x="616.8" dy="0">Fístula o uréter ectópico</tspan><tspan x="616.8" dy="17">Frecuente tras cirugía pélvica o</tspan><tspan x="616.8" dy="17">radioterapia</tspan></text><rect x="740.5" y="431.0" width="219.5" height="125.9" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="850.2" y="477.1" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="192"><tspan x="850.2" dy="0">DISFUNCIÓN DEL VACIADO</tspan></text><text x="850.2" y="500.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="192"><tspan x="850.2" dy="0">Puede dar rebosamiento</tspan><tspan x="850.2" dy="17">Medir el residuo posmiccional</tspan></text><text x="40.0" y="590.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TIPOS DE INCONTINENCIA SEGÚN EL SÍNTOMA (ICS)</tspan></text><rect x="40.0" y="602.9" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="621.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Tipo</tspan></text><text x="270.0" y="621.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Síntoma</tspan></text><text x="620.0" y="621.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Causa habitual</tspan></text><rect x="40.0" y="631.9" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="650.9" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">De urgencia</tspan></text><text x="270.0" y="650.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Pérdida precedida por urgencia miccional</tspan></text><text x="620.0" y="650.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Hiperactividad del detrusor</tspan></text><rect x="160.6" y="635.4" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="206.0" y="650.4" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="206.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="660.9" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="679.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">De esfuerzo</tspan></text><text x="270.0" y="679.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Fuga con tos o ejercicio</tspan></text><text x="620.0" y="679.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Falla del soporte uretral o del esfínter</tspan></text><rect x="40.0" y="689.9" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="708.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Continua</tspan></text><text x="270.0" y="708.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Fuga permanente</tspan></text><text x="620.0" y="708.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Fístula vesicovaginal o ureterovaginal, uréter ectópico</tspan></text><rect x="40.0" y="718.9" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="737.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Disfunción del vaciado</tspan></text><text x="270.0" y="737.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Chorro débil, esfuerzo y residuo posmiccional</tspan></text><text x="620.0" y="737.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Obstrucción o vejiga hipoactiva; puede dar rebosamiento</tspan></text><text x="40.0" y="787.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="797.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="828.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="800.9" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="820.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Incontinencia</tspan><tspan x="285.0" dy="17">urinaria de urgencia</tspan></text><text x="435.0" y="820.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Incontinencia</tspan><tspan x="435.0" dy="17">urinaria continua</tspan></text><text x="585.0" y="820.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Incontinencia</tspan><tspan x="585.0" dy="17">urinaria de esfuerzo</tspan></text><text x="735.0" y="820.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Disfunción del</tspan><tspan x="735.0" dy="17">vaciado vesical</tspan></text><text x="885.0" y="820.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Fístula</tspan><tspan x="885.0" dy="17">genitourinaria</tspan></text><rect x="40.0" y="851.9" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="851.9" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="880.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico más</tspan><tspan x="54.0" dy="16">probable?</tspan></text><text x="285.0" y="872.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: urgencia con</tspan><tspan x="285.0" dy="16">pérdida antes de llegar</tspan><tspan x="285.0" dy="16">al baño</tspan></text><text x="435.0" y="872.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es una fuga</tspan><tspan x="435.0" dy="16">permanente, día y</tspan><tspan x="435.0" dy="16">noche</tspan></text><text x="585.0" y="880.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: ocurre con tos,</tspan><tspan x="585.0" dy="16">estornudo o ejercicio</tspan></text><text x="735.0" y="880.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: chorro débil,</tspan><tspan x="735.0" dy="16">esfuerzo y residuo</tspan></text><text x="885.0" y="872.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: fuga continua tras</tspan><tspan x="885.0" dy="16">cirugía pélvica o parto</tspan><tspan x="885.0" dy="16">obstruido</tspan></text><rect x="40.0" y="797.9" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="941.9" width="920.0" height="218.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="969.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="991.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El síntoma cardinal es la urgencia con pérdida de orina antes de llegar al baño; integra el síndrome de vejiga hiperactiva (urgencia con o sin</tspan><tspan x="58.0" dy="18">   incontinencia, polaquiuria y nocturia).</tspan><tspan x="58.0" dy="18">• Continua: fuga permanente, sugiere fístula vesicovaginal o ureterovaginal, o uréter ectópico. Esfuerzo: tos o ejercicio. Disfunción del vaciado: chorro débil</tspan><tspan x="58.0" dy="18">   y residuo.</tspan><tspan x="58.0" dy="18">• Evaluación: historia, diario miccional, examen pélvico y urianálisis para descartar infección, hematuria o diabetes mal controlada.</tspan><tspan x="58.0" dy="18">• Alerta: hematuria, dolor o síntomas irritativos de inicio brusco obligan a descartar tumor vesical o cálculo antes de rotular el cuadro como vejiga</tspan><tspan x="58.0" dy="18">   hiperactiva.</tspan></text><text x="58.0" y="1121.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AUA/SUFU, Guideline on idiopathic overactive bladder (J Urol 2024;212:11-20); Haylen B et al., IUGA/ICS, Int Urogynecol J 2017;28:191-213; Campbell-Walsh-Wein,</tspan><tspan x="58.0" dy="15">12.ª ed. (2020).</tspan></text></svg>