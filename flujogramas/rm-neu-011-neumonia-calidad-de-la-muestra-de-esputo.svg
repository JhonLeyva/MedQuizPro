<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1189" viewBox="0 0 1000 1189" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Un esputo es válido para cultivo con más de 25 neutrófilos y menos de 10 células epiteliales por campo"><title>Un esputo es válido para cultivo con más de 25 neutrófilos y menos de 10 células epiteliales por campo</title><rect x="0.75" y="0.75" width="998.5" height="1187.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neumonía · calidad de la muestra de esputo</tspan></text><rect x="459.1" y="32.0" width="114.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="516.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="99"><tspan x="516.5" dy="0">NEUMOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Criterios de Murray y Washington</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se mide en la tinción de Gram, con bajo aumento (100×).</tspan><tspan x="58.0" dy="17">Muchas células epiteliales indican saliva, no secreción bronquial.</tspan><tspan x="58.0" dy="17">Una muestra contaminada no debe cultivarse.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Paciente con neumonía extrahospitalaria</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Se quiere cultivar el esputo.</tspan><tspan x="640.0" dy="16">¿Qué características debe tener la muestra por</tspan><tspan x="640.0" dy="16">campo?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DOS RECUENTOS QUE DECIDEN SI SE CULTIVA EL ESPUTO</tspan></text><rect x="40.0" y="285.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="311.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Neutrófilos por campo de 100×</tspan></text><text x="60.0" y="330.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Muchos neutrófilos indican secreción de vía respiratoria baja.</tspan></text><rect x="70.0" y="394.0" width="430.0" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="285.0" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="420"><tspan x="285.0" dy="0">Pocos: no sirve</tspan></text><rect x="500.0" y="394.0" width="430.0" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="715.0" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="420"><tspan x="715.0" dy="0">Más de 25: sirve</tspan></text><line x1="70.0" y1="434.0" x2="70.0" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="70.0" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="70.0" dy="0">0</tspan></text><line x1="242.0" y1="434.0" x2="242.0" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="242.0" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="242.0" dy="0">10</tspan></text><line x1="500.0" y1="434.0" x2="500.0" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="500.0" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="500.0" dy="0">25</tspan></text><line x1="930.0" y1="434.0" x2="930.0" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">50</tspan></text><polygon points="663.0,380.0 681.0,380.0 672.0,392.0" fill="#ea580c"/><rect x="626.6" y="354.0" width="90.9" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="672.0" y="369.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="79"><tspan x="672.0" dy="0">◆ MÁS DE 25</tspan></text><rect x="40.0" y="484.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="510.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Células epiteliales por campo de 100×</tspan></text><text x="60.0" y="529.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Muchas células epiteliales indican saliva.</tspan></text><rect x="70.0" y="593.0" width="286.7" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="213.3" y="618.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="277"><tspan x="213.3" dy="0">Menos de 10: sirve</tspan></text><rect x="356.7" y="593.0" width="573.3" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="643.3" y="618.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="563"><tspan x="643.3" dy="0">Más de 10: saliva</tspan></text><line x1="70.0" y1="633.0" x2="70.0" y2="641.0" stroke="#64748b" stroke-width="1.5"/><text x="70.0" y="655.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="70.0" dy="0">0</tspan></text><line x1="356.7" y1="633.0" x2="356.7" y2="641.0" stroke="#64748b" stroke-width="1.5"/><text x="356.7" y="655.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="356.7" dy="0">10</tspan></text><line x1="643.3" y1="633.0" x2="643.3" y2="641.0" stroke="#64748b" stroke-width="1.5"/><text x="643.3" y="655.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="643.3" dy="0">20</tspan></text><line x1="930.0" y1="633.0" x2="930.0" y2="641.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="655.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">30</tspan></text><polygon points="204.3,579.0 222.3,579.0 213.3,591.0" fill="#ea580c"/><rect x="159.8" y="553.0" width="107.1" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="213.3" y="568.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="95"><tspan x="213.3" dy="0">◆ MENOS DE 10</tspan></text><text x="40.0" y="701.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE DECIDE</tspan></text><rect x="40.0" y="711.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="712.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="735.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Muestra válida</tspan></text><text x="58.0" y="756.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">&gt; 25 neutrófilos y &lt; 10 células epiteliales</tspan></text><rect x="351.3" y="711.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="712.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="735.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Muestra salival</tspan></text><text x="369.3" y="756.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">&gt; 10 células epiteliales: no cultivar</tspan></text><rect x="662.7" y="711.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="712.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="735.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Antes del antibiótico</tspan></text><text x="680.7" y="756.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Primera muestra de la mañana</tspan></text><text x="40.0" y="820.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="830.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="869.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="852.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">&lt; 5 neutrófilos y &gt;</tspan><tspan x="285.0" dy="17">15 células</tspan><tspan x="285.0" dy="17">epiteliales</tspan></text><text x="435.0" y="852.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">&lt; 20 neutrófilos y &lt;</tspan><tspan x="435.0" dy="17">20 células</tspan><tspan x="435.0" dy="17">epiteliales</tspan></text><rect x="513.0" y="833.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="852.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">&gt; 25 neutrófilos y &lt;</tspan><tspan x="585.0" dy="17">10 células</tspan><tspan x="585.0" dy="17">epiteliales</tspan></text><text x="735.0" y="852.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">&gt; 15 neutrófilos y &gt;</tspan><tspan x="735.0" dy="17">10 células</tspan><tspan x="735.0" dy="17">epiteliales</tspan></text><text x="885.0" y="852.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">&gt; 10 neutrófilos y &lt;</tspan><tspan x="885.0" dy="17">20 células</tspan><tspan x="885.0" dy="17">epiteliales</tspan></text><rect x="40.0" y="901.0" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="901.0" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="946.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Válida?</tspan></text><text x="285.0" y="922.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: menos de 5</tspan><tspan x="285.0" dy="16">neutrófilos y más de 15</tspan><tspan x="285.0" dy="16">células epiteliales es</tspan><tspan x="285.0" dy="16">saliva</tspan></text><text x="435.0" y="930.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: 20 células</tspan><tspan x="435.0" dy="16">epiteliales es</tspan><tspan x="435.0" dy="16">inaceptable</tspan></text><text x="585.0" y="930.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: muchos neutrófilos</tspan><tspan x="585.0" dy="16">y pocas células</tspan><tspan x="585.0" dy="16">epiteliales</tspan></text><text x="735.0" y="930.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: muchas células</tspan><tspan x="735.0" dy="16">epiteliales indican</tspan><tspan x="735.0" dy="16">saliva</tspan></text><text x="885.0" y="938.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: el límite de células</tspan><tspan x="885.0" dy="16">epiteliales es 10</tspan></text><rect x="40.0" y="830.0" width="920.0" height="153.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1007.0" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1035.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1057.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Muestra válida: más de 25 neutrófilos y menos de 10 células epiteliales escamosas por campo de 100×.</tspan><tspan x="58.0" dy="18">• Más de 10 células epiteliales = contaminación con saliva orofaríngea: no se cultiva, porque confunde con la flora normal.</tspan><tspan x="58.0" dy="18">• La sensibilidad del esputo es limitada: las guías lo piden en neumonía grave, sospecha de MRSA o Pseudomonas, o fracaso del tratamiento.</tspan><tspan x="58.0" dy="18">• Tomar la muestra antes del primer antibiótico, idealmente la primera de la mañana.</tspan></text><text x="58.0" y="1133.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Metlay JP et al., ATS/IDSA, neumonía adquirida en la comunidad (Am J Respir Crit Care Med 2019;200:e45-e67); Mandell, Douglas y Bennett Enfermedades Infecciosas</tspan><tspan x="58.0" dy="15">9.ª ed. (2020)</tspan></text></svg>