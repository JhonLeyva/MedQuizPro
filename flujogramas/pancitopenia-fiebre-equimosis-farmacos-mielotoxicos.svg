<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1018" viewBox="0 0 1000 1018" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Mujer con equimosis, fiebre y neumonía con leucocitos 1400, Hb 7,2 y plaquetas 35 000: pancitopenia, lo primero es preguntar por medicamentos mielotóxicos"><title>Mujer con equimosis, fiebre y neumonía con leucocitos 1400, Hb 7,2 y plaquetas 35 000: pancitopenia, lo primero es preguntar por medicamentos mielotóxicos</title><rect x="0.75" y="0.75" width="998.5" height="1016.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Citopenias · pancitopenia</tspan></text><rect x="351.7" y="32.0" width="135.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="419.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="119"><tspan x="419.4" dy="0">HEMATOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Pancitopenia</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Bajan las tres series: anemia (cansancio), leucopenia (infecciones) y plaquetopenia</tspan><tspan x="58.0" dy="17">(sangrados).</tspan><tspan x="58.0" dy="17">Una causa adquirida frecuente y reversible son los fármacos: siempre preguntarlo primero.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 44 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Equimosis, debilidad, tos con esputo amarillo; T 38,4</tspan><tspan x="640.0" dy="16">°C, crepitantes.</tspan><tspan x="640.0" dy="16">Leucocitos 1400, Hb 7,2, plaquetas 35 000.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CAUSAS DE PANCITOPENIA</tspan></text><line x1="406.0" y1="427.0" x2="340.0" y2="427.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="427.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="420.3" y1="476.8" x2="340.0" y2="527.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="527.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="399.0" x2="660.0" y2="377.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="377.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="455.0" x2="660.0" y2="477.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="477.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="420.3" y1="377.2" x2="340.0" y2="327.0" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="327.0" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="427.0" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="427.0" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="432.0" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">FÁRMACOS</tspan></text><text x="500.0" y="451.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">preguntar primero</tspan></text><rect x="40.0" y="285.0" width="300.0" height="84.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="318.7" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">FÁRMACOS</tspan></text><text x="190.0" y="342.4" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Metamizol, cloranfenicol, quimio</tspan></text><rect x="144.6" y="359.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="374.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="385.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="386.0" width="6.0" height="82.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="418.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">APLASIA MEDULAR</tspan></text><text x="190.0" y="442.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Médula vacía</tspan></text><rect x="40.0" y="485.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="486.0" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="190.0" y="518.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">INFILTRACIÓN</tspan></text><text x="190.0" y="542.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Leucemia, metástasis, fibrosis</tspan></text><rect x="660.0" y="335.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="336.0" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="368.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">MEGALOBLÁSTICA</tspan></text><text x="810.0" y="392.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Falta B12 o folato</tspan></text><rect x="660.0" y="435.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="436.0" width="6.0" height="82.0" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="468.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">HIPERESPLENISMO</tspan></text><text x="810.0" y="492.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Bazo grande secuestra</tspan></text><text x="40.0" y="605.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="617.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="641.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Preguntar fármacos</tspan></text><line x1="248.5" y1="637.5" x2="267.5" y2="637.5" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,632.5 266.5,642.5 274.5,637.5" fill="#0f766e"/><rect x="278.5" y="617.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="641.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Frotis y reticulocitos</tspan></text><line x1="487.0" y1="637.5" x2="506.0" y2="637.5" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,632.5 505.0,642.5 513.0,637.5" fill="#0f766e"/><rect x="517.0" y="617.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="641.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">B12, folato, VIH</tspan></text><line x1="725.5" y1="637.5" x2="744.5" y2="637.5" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,632.5 743.5,642.5 751.5,637.5" fill="#0f766e"/><rect x="755.5" y="617.0" width="204.5" height="41.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="641.5" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Biopsia de médula</tspan></text><text x="40.0" y="698.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="708.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="747.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="711.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="739.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Exposición previa a</tspan><tspan x="285.0" dy="17">medicamentos</tspan></text><text x="435.0" y="730.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Antecedentes</tspan><tspan x="435.0" dy="17">familiares de</tspan><tspan x="435.0" dy="17">anemias</tspan></text><text x="585.0" y="739.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Hábitos dietéticos</tspan><tspan x="585.0" dy="17">permanentes</tspan></text><text x="735.0" y="730.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Infecciones</tspan><tspan x="735.0" dy="17">bacterianas</tspan><tspan x="735.0" dy="17">recientes</tspan></text><text x="885.0" y="747.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Viajes recientes</tspan></text><rect x="40.0" y="779.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="779.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="816.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué buscar?</tspan></text><text x="285.0" y="800.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: la causa adquirida</tspan><tspan x="285.0" dy="16">más frecuente y</tspan><tspan x="285.0" dy="16">reversible</tspan></text><text x="435.0" y="808.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Útil en jóvenes; menos</tspan><tspan x="435.0" dy="16">aquí</tspan></text><text x="585.0" y="808.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Pensar en B12 si es</tspan><tspan x="585.0" dy="16">megaloblástica</tspan></text><text x="735.0" y="808.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Puede bajar series,</tspan><tspan x="735.0" dy="16">pero no explica todo</tspan></text><text x="885.0" y="800.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Útil si hay fiebre de</tspan><tspan x="885.0" dy="16">viaje (malaria,</tspan><tspan x="885.0" dy="16">leishmaniasis)</tspan></text><rect x="40.0" y="708.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="869.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="897.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="919.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Fármacos: cloranfenicol, metamizol, metotrexato, quimioterapia, carbamazepina, antitiroideos, AZT.</tspan><tspan x="58.0" dy="18">• Suspender el sospechoso; neutropenia febril → antibiótico de amplio espectro de inmediato.</tspan><tspan x="58.0" dy="18">• Frotis, reticulocitos, B12/folato, VIH y biopsia de médula si no se aclara.</tspan></text><text x="58.0" y="977.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ASH; Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>