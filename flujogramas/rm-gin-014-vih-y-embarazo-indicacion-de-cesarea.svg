<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1216" viewBox="0 0 1000 1216" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Gestante con VIH a término y sin control prenatal: cesárea electiva con zidovudina endovenosa"><title>Gestante con VIH a término y sin control prenatal: cesárea electiva con zidovudina endovenosa</title><rect x="0.75" y="0.75" width="998.5" height="1214.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">VIH y embarazo · indicación de cesárea</tspan></text><rect x="432.5" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="512.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="512.2" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cesárea en la gestante con VIH</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Reduce la transmisión si la carga viral es &gt; 1000 copias/mL o desconocida.</tspan><tspan x="58.0" dy="17">Se hace antes del trabajo de parto y con membranas íntegras.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante con VIH en TARGA</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿En qué situación se indica cesárea?</tspan><tspan x="640.0" dy="16">Término sin control prenatal, dilatación &gt; 4 cm, RPM,</tspan><tspan x="640.0" dy="16">óbito, expulsivo.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DE LA SITUACIÓN DE LA PACIENTE A LA MEDIDA</tspan></text><rect x="40.0" y="285.0" width="920.0" height="112.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="285.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="345.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Situación</tspan></text><rect x="40.0" y="397.0" width="920.0" height="112.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="397.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="457.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Carga viral</tspan></text><rect x="40.0" y="509.0" width="920.0" height="112.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="509.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="569.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Decisión</tspan></text><rect x="40.0" y="621.0" width="920.0" height="112.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="621.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="681.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Medidas</tspan></text><line x1="348.0" y1="333.0" x2="355.0" y2="333.0" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="333.0" x2="355.0" y2="444.5" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="444.5" x2="353.0" y2="444.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="353.0,449.5 353.0,439.5 362.0,444.5" fill="#0f766e"/><line x1="552.0" y1="444.5" x2="559.0" y2="444.5" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="444.5" x2="559.0" y2="565.0" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="565.0" x2="557.0" y2="565.0" stroke="#ea580c" stroke-width="2.2"/><polygon points="557.0,570.0 557.0,560.0 566.0,565.0" fill="#ea580c"/><line x1="756.0" y1="565.0" x2="763.0" y2="565.0" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="565.0" x2="763.0" y2="677.0" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="677.0" x2="761.0" y2="677.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="761.0,682.0 761.0,672.0 770.0,677.0" fill="#0f766e"/><rect x="158.0" y="298.0" width="190.0" height="70.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="168.0" y="314.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Término sin control prenatal</tspan><tspan x="168.0" dy="16">(este caso)</tspan></text><text x="168.0" y="347.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Sin TARV ni exámenes previos</tspan></text><circle cx="158.0" cy="298.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="302.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="362.0" y="410.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="372.0" y="426.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Carga viral desconocida</tspan></text><text x="372.0" y="443.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Se asume &gt; 1000: misma</tspan><tspan x="372.0" dy="14.5">conducta que con viremia alta</tspan></text><circle cx="362.0" cy="410.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="362.0" y="414.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="362.0" dy="0">2</tspan></text><rect x="566.0" y="522.0" width="190.0" height="86.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="576.0" y="538.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Cesárea electiva a las 38</tspan><tspan x="576.0" dy="16">semanas</tspan></text><text x="576.0" y="571.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Antes del trabajo de parto y con</tspan><tspan x="576.0" dy="14.5">membranas íntegras</tspan></text><circle cx="566.0" cy="522.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="566.0" y="526.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="566.0" dy="0">3</tspan></text><rect x="770.0" y="634.0" width="190.0" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="780.0" y="650.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Zidovudina endovenosa y</tspan><tspan x="780.0" dy="16">profilaxis</tspan></text><text x="780.0" y="683.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Recién nacido con</tspan><tspan x="780.0" dy="14.5">antirretrovirales y fórmula láctea</tspan></text><circle cx="770.0" cy="634.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="770.0" y="638.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="770.0" dy="0">4</tspan></text><rect x="40.0" y="751.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="777.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Término sin control prenatal = cesárea electiva</tspan></text><text x="60.0" y="796.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Dilatación &gt; 4 cm, expulsivo, RPM prolongada y óbito fetal no se benefician de ella.</tspan></text><text x="40.0" y="863.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="873.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="912.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="904.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">RPM mayor de</tspan><tspan x="285.0" dy="17">cuatro horas</tspan></text><text x="435.0" y="895.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">La dilatación</tspan><tspan x="435.0" dy="17">cervical es mayor</tspan><tspan x="435.0" dy="17">de 4 cm</tspan></text><rect x="513.0" y="876.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="904.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Gestación a término</tspan><tspan x="585.0" dy="17">sin control prenatal</tspan></text><text x="735.0" y="904.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">La gestación es un</tspan><tspan x="735.0" dy="17">óbito fetal</tspan></text><text x="885.0" y="904.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Periodo expulsivo</tspan><tspan x="885.0" dy="17">con control prenatal</tspan></text><rect x="40.0" y="944.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="944.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="981.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Cesárea?</tspan></text><text x="285.0" y="965.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: con RPM</tspan><tspan x="285.0" dy="16">prolongada la cesárea</tspan><tspan x="285.0" dy="16">ya no aporta</tspan></text><text x="435.0" y="973.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: con &gt; 4 cm la</tspan><tspan x="435.0" dy="16">cesárea no protege</tspan></text><text x="585.0" y="965.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: sin TARV ni carga</tspan><tspan x="585.0" dy="16">viral se asume viremia</tspan><tspan x="585.0" dy="16">alta</tspan></text><text x="735.0" y="973.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no hay un feto vivo</tspan><tspan x="735.0" dy="16">que proteger</tspan></text><text x="885.0" y="973.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: en el expulsivo no</tspan><tspan x="885.0" dy="16">reduce el riesgo</tspan></text><rect x="40.0" y="873.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1034.0" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1062.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1084.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Cesárea electiva a las 38 semanas si la CV cercana al parto es &gt; 1000 copias/mL o se desconoce (DHHS 2024; ACOG 2018).</tspan><tspan x="58.0" dy="18">• Sin beneficio de la cesárea: dilatación avanzada, periodo expulsivo, RPM prolongada y óbito fetal (no hay un feto vivo que proteger).</tspan><tspan x="58.0" dy="18">• Zidovudina endovenosa: 2 mg/kg en 1 hora y luego 1 mg/kg/h hasta el parto; en la cesárea electiva se inicia 3 horas antes.</tspan><tspan x="58.0" dy="18">• Alerta: con CV &lt; 1000 y TARGA la vía vaginal es aceptable; el recién nacido recibe profilaxis antirretroviral y fórmula láctea.</tspan></text><text x="58.0" y="1160.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: DHHS, Perinatal HIV Guidelines (2024); NTS 159-MINSA/2019/DGIESP (RM 1138-2019/MINSA); NTS 169-MINSA/2020/DGIESP (RM 1024-2020/MINSA); Williams</tspan><tspan x="58.0" dy="15">Obstetricia, 26.ª ed. (2022). ACOG, Committee Opinion 751 (Obstet Gynecol 2018;132).</tspan></text></svg>