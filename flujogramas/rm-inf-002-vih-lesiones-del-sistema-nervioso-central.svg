<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="994" viewBox="0 0 1000 994" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La toxoplasmosis cerebral es la causa frecuente de infección secundaria del SNC en el SIDA"><title>La toxoplasmosis cerebral es la causa frecuente de infección secundaria del SNC en el SIDA</title><rect x="0.75" y="0.75" width="998.5" height="992.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">VIH · lesiones del sistema nervioso central</tspan></text><rect x="451.6" y="32.0" width="121.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="512.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="106"><tspan x="512.5" dy="0">INFECTOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección del SNC en SIDA</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Son reactivaciones de gérmenes latentes cuando el CD4 baja.</tspan><tspan x="58.0" dy="17">Toxoplasma persiste como quistes en cerebro y músculo.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es la causa frecuente de infecciones</tspan><tspan x="640.0" dy="16">secundarias del SNC en el SIDA?</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ AFECTA AL SISTEMA NERVIOSO CENTRAL EN EL SIDA</tspan></text><line x1="421.1" y1="363.5" x2="340.0" y2="311.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="311.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="421.1" y1="465.7" x2="340.0" y2="518.2" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="518.2" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="386.5" x2="660.0" y2="364.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="364.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="442.6" x2="660.0" y2="464.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="464.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="406.0" y1="414.6" x2="340.0" y2="414.6" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="414.6" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="414.6" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="414.6" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="419.6" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">SNC EN SIDA</tspan></text><text x="500.0" y="438.6" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">CD4 bajo</tspan></text><rect x="40.0" y="269.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="270.0" width="6.0" height="82.0" rx="3" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="190.0" y="302.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">LINFOMA PRIMARIO</tspan></text><text x="190.0" y="326.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Neoplasia por VEB, no infección</tspan></text><rect x="40.0" y="369.0" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="397.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">TOXOPLASMOSIS CEREBRAL</tspan></text><text x="190.0" y="421.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Reactivación, CD4 &lt; 100</tspan><tspan x="190.0" dy="17">Lesiones con anillo</tspan></text><rect x="144.6" y="450.2" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="465.2" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="476.2" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="477.2" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="190.0" y="509.9" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">MENINGITIS CRIPTOCÓCICA</tspan></text><text x="190.0" y="533.6" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Cefalea subaguda, CD4 &lt; 100</tspan></text><rect x="660.0" y="322.6" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="323.6" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="356.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">CANDIDIASIS CEREBRAL</tspan></text><text x="810.0" y="380.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Rara en el SNC</tspan></text><rect x="660.0" y="422.6" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="423.6" width="6.0" height="82.0" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="456.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">ENCEFALOPATÍA VIRAL</tspan></text><text x="810.0" y="480.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Término sin causa específica</tspan></text><text x="40.0" y="596.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="608.2" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="632.7" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Reactivación del quiste</tspan></text><line x1="248.5" y1="628.7" x2="267.5" y2="628.7" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,623.7 266.5,633.7 274.5,628.7" fill="#0f766e"/><rect x="278.5" y="608.2" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="632.7" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Múltiples lesiones en anillo</tspan></text><line x1="487.0" y1="628.7" x2="506.0" y2="628.7" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,623.7 505.0,633.7 513.0,628.7" fill="#0f766e"/><rect x="517.0" y="608.2" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="632.7" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Tratamiento empírico</tspan></text><line x1="725.5" y1="628.7" x2="744.5" y2="628.7" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,623.7 743.5,633.7 751.5,628.7" fill="#0f766e"/><rect x="755.5" y="608.2" width="204.5" height="41.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="632.7" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Mejora en 1-2 semanas</tspan></text><text x="40.0" y="689.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="699.2" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="730.2" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="730.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Linfoma primario</tspan></text><rect x="363.0" y="702.2" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="721.7" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Toxoplasmosis</tspan><tspan x="435.0" dy="17">cerebral</tspan></text><text x="585.0" y="721.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Meningitis</tspan><tspan x="585.0" dy="17">criptocócica</tspan></text><text x="735.0" y="721.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Candidiasis</tspan><tspan x="735.0" dy="17">cerebral</tspan></text><text x="885.0" y="730.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Encefalopatía viral</tspan></text><rect x="40.0" y="753.2" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="753.2" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="774.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Infección secundaria</tspan><tspan x="54.0" dy="16">del SNC?</tspan></text><text x="285.0" y="774.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es una neoplasia,</tspan><tspan x="285.0" dy="16">no una infección</tspan></text><text x="435.0" y="774.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: reactivación de</tspan><tspan x="435.0" dy="16">quistes con CD4 &lt; 100</tspan></text><text x="585.0" y="774.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es meningitis, no la</tspan><tspan x="585.0" dy="16">más frecuente</tspan></text><text x="735.0" y="782.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es rara en el SNC</tspan></text><text x="885.0" y="774.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: sin término de</tspan><tspan x="885.0" dy="16">causa específica</tspan></text><rect x="40.0" y="699.2" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="827.2" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="855.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="877.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Toxoplasmosis: CD4 &lt; 100 sin profilaxis; fiebre, cefalea, convulsiones, déficit focal y múltiples lesiones con captación en anillo.</tspan><tspan x="58.0" dy="18">• Es la lesión ocupante de espacio cerebral más frecuente en SIDA; se trata de forma empírica y debe mejorar en 1-2 semanas.</tspan><tspan x="58.0" dy="18">• Tratamiento: pirimetamina más sulfadiazina (con ácido folínico) o cotrimoxazol; si no mejora, biopsia o estudio de linfoma.</tspan><tspan x="58.0" dy="18">• El linfoma primario del SNC es una neoplasia (VEB), no una infección; la criptococosis es meningitis, no lesión focal.</tspan></text><text x="58.0" y="953.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: NIH/CDC/IDSA, toxoplasmosis en adultos con VIH (2024-2025); Harrison Principios de Medicina Interna 22.ª ed. (2025)</tspan></text></svg>