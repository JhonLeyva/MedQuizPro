<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="918" viewBox="0 0 1000 918" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La razón de dependencia resume la composición por edad y es el indicador de estructura"><title>La razón de dependencia resume la composición por edad y es el indicador de estructura</title><rect x="0.75" y="0.75" width="998.5" height="916.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Demografía · indicadores de estructura y de dinámica</tspan></text><rect x="515.9" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="580.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="580.2" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Indicadores demográficos</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Estáticos: describen la población en un momento.</tspan><tspan x="58.0" dy="17">Dinámicos: miden el cambio por nacimientos, muertes y migración.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de clasificación</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es un indicador demográfico de la estructura</tspan><tspan x="640.0" dy="16">poblacional?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><rect x="40.0" y="245.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="271.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Composición por edad = razón de dependencia</tspan></text><text x="60.0" y="290.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La densidad es distribución espacial; los demás indicadores miden el cambio.</tspan></text><text x="40.0" y="351.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">INDICADORES DEMOGRÁFICOS SEGÚN LO QUE MIDEN</tspan></text><rect x="40.0" y="363.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Indicador</tspan></text><text x="300.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Qué mide</tspan></text><text x="635.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Tipo</tspan></text><rect x="40.0" y="392.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="411.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Densidad poblacional</tspan></text><text x="300.0" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Distribución espacial</tspan></text><text x="635.0" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Estático (espacial)</tspan></text><rect x="40.0" y="421.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="440.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Tasa global de fecundidad</tspan></text><text x="300.0" y="440.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Nacimientos por mujer</tspan></text><text x="635.0" y="440.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Dinámico</tspan></text><rect x="40.0" y="450.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="469.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Esperanza de vida al nacer</tspan></text><text x="300.0" y="469.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Años que se espera vivir</tspan></text><text x="635.0" y="469.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Dinámico</tspan></text><rect x="40.0" y="479.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="498.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Razón de dependencia</tspan></text><text x="300.0" y="498.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Inactivos entre población en edad de trabajar</tspan></text><text x="635.0" y="498.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Estático (estructura por edad)</tspan></text><rect x="190.6" y="482.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="236.0" y="497.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="236.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="508.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="527.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Tasa de crecimiento anual</tspan></text><text x="300.0" y="527.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Cambio de la población en un año</tspan></text><text x="635.0" y="527.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Dinámico</tspan></text><text x="40.0" y="577.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="587.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="618.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="609.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Densidad</tspan><tspan x="285.0" dy="17">poblacional</tspan></text><text x="435.0" y="609.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Tasa global de</tspan><tspan x="435.0" dy="17">fecundidad</tspan></text><text x="585.0" y="609.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Esperanza de vida</tspan><tspan x="585.0" dy="17">al nacer</tspan></text><rect x="663.0" y="590.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="609.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Razón de</tspan><tspan x="735.0" dy="17">dependencia</tspan></text><text x="885.0" y="609.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Tasa de crecimiento</tspan><tspan x="885.0" dy="17">anual</tspan></text><rect x="40.0" y="641.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="641.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="662.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Indicador de</tspan><tspan x="54.0" dy="16">estructura?</tspan></text><text x="285.0" y="662.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es de distribución</tspan><tspan x="285.0" dy="16">espacial</tspan></text><text x="435.0" y="662.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: mide la evolución</tspan><tspan x="435.0" dy="16">(dinámico)</tspan></text><text x="585.0" y="662.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: mide la evolución</tspan><tspan x="585.0" dy="16">(dinámico)</tspan></text><text x="735.0" y="662.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: composición por</tspan><tspan x="735.0" dy="16">edad</tspan></text><text x="885.0" y="662.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: mide la evolución</tspan><tspan x="885.0" dy="16">(dinámico)</tspan></text><rect x="40.0" y="587.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="715.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="743.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="765.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Estructura: pirámide poblacional, proporción de menores de 15 y mayores de 65 años, índice de envejecimiento, razón de masculinidad y razón de</tspan><tspan x="58.0" dy="18">   dependencia.</tspan><tspan x="58.0" dy="18">• Razón de dependencia = (menores de 15 + mayores de 64) / población en edad de trabajar: relaciona inactivos con activos.</tspan><tspan x="58.0" dy="18">• Densidad = distribución espacial. Fecundidad, esperanza de vida y crecimiento anual = dinámica.</tspan><tspan x="58.0" dy="18">• Transición demográfica: la pirámide pasa de base ancha a rectangular; sube la carga de enfermedades crónicas. Algunos textos agrupan la densidad</tspan><tspan x="58.0" dy="18">   aparte.</tspan></text><text x="58.0" y="877.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Piédrola Gil, Medicina Preventiva y Salud Pública, 12.ª ed. (2015).</tspan></text></svg>