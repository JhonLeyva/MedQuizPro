<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="906" viewBox="0 0 1000 906" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Rotavirus es el agente más frecuente de gastroenteritis en el lactante; la vacuna a los 2 y 4 meses lo previene"><title>Rotavirus es el agente más frecuente de gastroenteritis en el lactante; la vacuna a los 2 y 4 meses lo previene</title><rect x="0.75" y="0.75" width="998.5" height="904.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · gastroenteritis aguda por rotavirus</tspan></text><rect x="469.3" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="518.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="518.4" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Gastroenteritis viral</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Diarrea acuosa con vómitos, sin moco ni sangre.</tspan><tspan x="58.0" dy="17">Rotavirus es el agente más frecuente y el más grave en menores de 5 años.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 10 meses</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Vacunas incompletas.</tspan><tspan x="640.0" dy="16">Dos días de 8 vómitos y 10 deposiciones líquidas sin</tspan><tspan x="640.0" dy="16">moco ni sangre.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL ROTAVIRUS AL LACTANTE Y CÓMO SE CORTA LA CADENA</tspan></text><rect x="40.0" y="285.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="145.2" y="305.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Agente</tspan></text><text x="145.2" y="322.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Rotavirus: virus resistente en el</tspan><tspan x="145.2" dy="16">ambiente</tspan></text><line x1="253.5" y1="322.5" x2="266.5" y2="322.5" stroke="#0f766e" stroke-width="2"/><polygon points="265.5,317.5 265.5,327.5 273.5,322.5" fill="#0f766e"/><line x1="145.2" y1="362.0" x2="145.2" y2="376.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="40.0" y="378.0" width="210.5" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="145.2" y="392.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">✂ CORTA</tspan></text><text x="145.2" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Vacuna a los 2 y 4 meses</tspan></text><rect x="276.5" y="285.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="381.8" y="305.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Salida</tspan></text><text x="381.8" y="322.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Heces con gran cantidad de virus</tspan></text><line x1="490.0" y1="322.5" x2="503.0" y2="322.5" stroke="#0f766e" stroke-width="2"/><polygon points="502.0,317.5 502.0,327.5 510.0,322.5" fill="#0f766e"/><line x1="381.8" y1="362.0" x2="381.8" y2="376.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="276.5" y="378.0" width="210.5" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="381.8" y="392.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">✂ CORTA</tspan></text><text x="381.8" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Lavado de manos y manejo de</tspan><tspan x="381.8" dy="16">pañales</tspan></text><rect x="513.0" y="285.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="618.2" y="305.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Vía</tspan></text><text x="618.2" y="322.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Fecal-oral, manos y objetos</tspan><tspan x="618.2" dy="16">contaminados</tspan></text><line x1="726.5" y1="322.5" x2="739.5" y2="322.5" stroke="#0f766e" stroke-width="2"/><polygon points="738.5,317.5 738.5,327.5 746.5,322.5" fill="#0f766e"/><line x1="618.2" y1="362.0" x2="618.2" y2="376.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="513.0" y="378.0" width="210.5" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="618.2" y="392.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">✂ CORTA</tspan></text><text x="618.2" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Higiene y desinfección de</tspan><tspan x="618.2" dy="16">superficies</tspan></text><rect x="749.5" y="285.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="854.8" y="305.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Huésped</tspan></text><text x="854.8" y="322.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Lactante con vacunas incompletas</tspan></text><line x1="854.8" y1="362.0" x2="854.8" y2="376.0" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="749.5" y="378.0" width="210.5" height="64.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="854.8" y="392.0" font-size="9.5" font-weight="800" font-style="normal" fill="#ffedd5" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">✂ CORTA</tspan></text><text x="854.8" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Completar el esquema de</tspan><tspan x="854.8" dy="16">vacunación</tspan></text><rect x="809.3" y="431.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="854.8" y="446.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="854.8" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="472.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="498.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Lactante con diarrea acuosa y vómitos = rotavirus</tspan></text><text x="60.0" y="517.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Adenovirus, calicivirus, coronavirus y norovirus son menos frecuentes o menos graves.</tspan></text><text x="40.0" y="584.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="594.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="616.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="597.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="616.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Rotavirus</tspan></text><text x="435.0" y="616.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Adenovirus</tspan></text><text x="585.0" y="616.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Calicivirus</tspan></text><text x="735.0" y="616.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Coronavirus</tspan></text><text x="885.0" y="616.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Virus Norwalk</tspan></text><rect x="40.0" y="631.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="631.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="668.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Agente más frecuente?</tspan></text><text x="285.0" y="652.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: el más frecuente y</tspan><tspan x="285.0" dy="16">grave en menores de 5</tspan><tspan x="285.0" dy="16">años</tspan></text><text x="435.0" y="660.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: cuadro más</tspan><tspan x="435.0" dy="16">prolongado</tspan></text><text x="585.0" y="652.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: causa creciente</tspan><tspan x="585.0" dy="16">donde hay vacunación</tspan><tspan x="585.0" dy="16">alta</tspan></text><text x="735.0" y="668.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: poco significativo</tspan></text><text x="885.0" y="652.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: norovirus, causa</tspan><tspan x="885.0" dy="16">creciente en</tspan><tspan x="885.0" dy="16">vacunados</tspan></text><rect x="40.0" y="594.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="721.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="749.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="771.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Rotavirus replica en los enterocitos del intestino delgado y causa malabsorción osmótica y secretoria (enterotoxina NSP4); puede dar convulsiones</tspan><tspan x="58.0" dy="18">   afebriles benignas.</tspan><tspan x="58.0" dy="18">• Norovirus gana importancia donde la cobertura vacunal es alta; adenovirus 40 y 41 da un cuadro más prolongado; coronavirus es poco significativo.</tspan><tspan x="58.0" dy="18">• Vacuna en el Perú a los 2 y 4 meses (NTS 196-2022); primera dosis antes de las 15 semanas y serie completa antes de las 32 semanas.</tspan><tspan x="58.0" dy="18">• Tratamiento: sales de rehidratación oral hipoosmolar, continuar lactancia y alimentación, zinc 10-14 días (OMS). No dar antibióticos ni antidiarreicos.</tspan></text><text x="58.0" y="865.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ESPGHAN/ESPID, Guarino A et al., J Pediatr Gastroenterol Nutr 2014;59:132-152; NTS 196-MINSA/DGIESP-2022; Nelson Tratado de Pediatría 22.ª ed. (2024)</tspan></text></svg>