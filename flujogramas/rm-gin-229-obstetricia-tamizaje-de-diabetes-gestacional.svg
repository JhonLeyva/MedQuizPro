<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1111" viewBox="0 0 1000 1111" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Gestante obesa con macrosomía previa y glucosa basal de 100 mg/dL: solicitar la prueba de tolerancia a la glucosa"><title>Gestante obesa con macrosomía previa y glucosa basal de 100 mg/dL: solicitar la prueba de tolerancia a la glucosa</title><rect x="0.75" y="0.75" width="998.5" height="1109.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · tamizaje de diabetes gestacional</tspan></text><rect x="468.0" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="547.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="547.8" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Diabetes gestacional</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Intolerancia a la glucosa detectada por primera vez en el embarazo.</tspan><tspan x="58.0" dy="17">Riesgo de macrosomía, distocia de hombros, hipoglucemia neonatal y diabetes futura.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante de 22 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Obesa, con macrosomía fetal previa.</tspan><tspan x="640.0" dy="16">Glucosa basal de 100 mg/dL.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE LLEGA A LA CONDUCTA ANTE UNA GLUCOSA DE 100 MG/DL</tspan></text><text x="614.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,293.0 580.0,293.0 543.8,401.0 76.2,401.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="309.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="357.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="424"><tspan x="310.0" dy="0">Glucosa basal de 100 mg/dL con factores de riesgo</tspan></text><line x1="565.9" y1="347.0" x2="606.0" y2="347.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="302.0" width="241.8" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="734.9" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="734.9" dy="0">Realizar prueba de tolerancia a la glucosa</tspan></text><rect x="614.0" y="334.0" width="181.0" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="704.5" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="704.5" dy="0">Iniciar tratamiento con insulina</tspan></text><rect x="801.0" y="334.0" width="150.2" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="876.1" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="876.1" dy="0">Derivar a endocrinología</tspan></text><rect x="614.0" y="366.0" width="135.2" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="681.6" y="383.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="681.6" dy="0">Repetir glucosa basal</tspan></text><rect x="755.2" y="366.0" width="176.4" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="843.4" y="383.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="843.4" dy="0">Monitoreo seriado de glucosa</tspan></text><polygon points="76.2,405.0 543.8,405.0 507.5,461.0 112.5,461.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="138.5" cy="433.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="138.5" y="437.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="138.5" dy="0">1</tspan></text><text x="320.0" y="437.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="331"><tspan x="320.0" dy="0">¿Ya hay diagnóstico de diabetes gestacional?</tspan></text><line x1="529.6" y1="433.0" x2="606.0" y2="433.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="420.0" width="193.1" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="710.5" y="437.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="710.5" dy="0">✕ Iniciar tratamiento con insulina</tspan></text><line x1="636.0" y1="433.5" x2="797.1" y2="433.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="112.5,465.0 507.5,465.0 471.2,525.0 148.8,525.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="174.8" cy="495.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="174.8" y="499.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="174.8" dy="0">2</tspan></text><text x="320.0" y="491.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="258"><tspan x="320.0" dy="0">¿Supera el corte de 105 mg/dL de la</tspan><tspan x="320.0" dy="17">norma?</tspan></text><line x1="493.4" y1="495.0" x2="606.0" y2="495.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="482.0" width="162.3" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="695.2" y="499.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="695.2" dy="0">✕ Derivar a endocrinología</tspan></text><line x1="636.0" y1="495.5" x2="766.3" y2="495.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="782.3" y="482.0" width="147.3" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="856.0" y="499.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="856.0" dy="0">✕ Repetir glucosa basal</tspan></text><line x1="804.3" y1="495.5" x2="919.6" y2="495.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="148.8,529.0 471.2,529.0 435.0,589.0 185.0,589.0" fill="#5eead4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="559.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="563.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">3</tspan></text><text x="320.0" y="555.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">¿Es una prueba de tamizaje</tspan><tspan x="320.0" dy="17">o diagnóstico validada?</tspan></text><line x1="457.1" y1="559.0" x2="606.0" y2="559.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="546.0" width="188.5" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="708.2" y="563.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="708.2" dy="0">✕ Monitoreo seriado de glucosa</tspan></text><line x1="636.0" y1="559.5" x2="792.5" y2="559.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="593.0" x2="310.0" y2="612.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,611.0 315.0,611.0 310.0,619.0" fill="#0f766e"/><rect x="140.0" y="623.0" width="340.0" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="652.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">PRUEBA DE TOLERANCIA A LA GLUCOSA</tspan></text><text x="310.0" y="676.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">75 g con medición en ayunas, 1 y 2 horas</tspan><tspan x="310.0" dy="17">Un valor alterado diagnostica</tspan></text><rect x="370.6" y="612.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="627.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="622.9" width="346.0" height="92.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="642.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="660.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">Clave del libro según la norma peruana; con IADPSG y</tspan><tspan x="628.0" dy="16">OMS una glucemia en ayunas de 92 mg/dL o más ya</tspan><tspan x="628.0" dy="16">diagnostica diabetes gestacional.</tspan></text><text x="40.0" y="754.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="764.9" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="804.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="767.9" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="787.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Realizar prueba de</tspan><tspan x="285.0" dy="17">tolerancia a la</tspan><tspan x="285.0" dy="17">glucosa</tspan></text><text x="435.0" y="795.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Iniciar tratamiento</tspan><tspan x="435.0" dy="17">con insulina</tspan></text><text x="585.0" y="795.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Derivar a</tspan><tspan x="585.0" dy="17">endocrinología</tspan></text><text x="735.0" y="795.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Repetir glucosa</tspan><tspan x="735.0" dy="17">basal</tspan></text><text x="885.0" y="795.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Monitoreo seriado</tspan><tspan x="885.0" dy="17">de glucosa</tspan></text><rect x="40.0" y="835.9" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="835.9" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="872.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Conducta?</tspan></text><text x="285.0" y="856.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: tiene factores de</tspan><tspan x="285.0" dy="16">riesgo y el corte no se</tspan><tspan x="285.0" dy="16">supera</tspan></text><text x="435.0" y="864.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no hay diagnóstico</tspan><tspan x="435.0" dy="16">para tratar</tspan></text><text x="585.0" y="864.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: derivar se reserva</tspan><tspan x="585.0" dy="16">a más de 105 mg/dL</tspan></text><text x="735.0" y="864.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: repetir se hace si</tspan><tspan x="735.0" dy="16">pasa de 105 mg/dL</tspan></text><text x="885.0" y="864.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no es una prueba</tspan><tspan x="885.0" dy="16">de tamizaje</tspan></text><rect x="40.0" y="764.9" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="925.9" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="953.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="975.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Norma peruana citada por el libro: glucosa en ayunas mayor de 105 mg/dL se repite y se deriva; con valor menor y factores de riesgo se pide la prueba</tspan><tspan x="58.0" dy="18">   de tolerancia oral con 75 g.</tspan><tspan x="58.0" dy="18">• Esta paciente tiene 100 mg/dL (no supera el corte) pero con obesidad y macrosomía previa: se indica la PTOG de 75 g.</tspan><tspan x="58.0" dy="18">• Criterios IADPSG con PTOG de 75 g: ayunas 92 mg/dL o más, 1 hora 180 o más, 2 horas 153 o más; un solo valor alterado diagnostica.</tspan><tspan x="58.0" dy="18">• No se inicia insulina ni se deriva por un valor sin diagnóstico; el monitoreo seriado no es una prueba de tamizaje.</tspan></text><text x="58.0" y="1069.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ADA, Standards of Care in Diabetes 2026, sección 15 (Diabetes Care 2026;49 Suppl 1); IADPSG (Diabetes Care 2010;33:676); Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>