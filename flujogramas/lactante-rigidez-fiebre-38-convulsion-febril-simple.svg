<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="956" viewBox="0 0 1000 956" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Lactante de 1 año con una crisis tónica generalizada de pocos minutos con fiebre, despierto y sin signos meníngeos ni focales: convulsión febril simple, bajar la temperatura"><title>Lactante de 1 año con una crisis tónica generalizada de pocos minutos con fiebre, despierto y sin signos meníngeos ni focales: convulsión febril simple, bajar la temperatura</title><rect x="0.75" y="0.75" width="998.5" height="954.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Convulsión febril</tspan></text><rect x="302.5" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="359.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="359.0" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Convulsión febril</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Crisis con fiebre entre los 6 meses y 5 años, sin infección del SNC ni causa metabólica.</tspan><tspan x="58.0" dy="17">Simple: generalizada, &lt; 15 minutos, una sola en 24 h. Compleja: focal, &gt; 15 min o se repite.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 1 año</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Rigidez con relajación de esfínteres de pocos minutos.</tspan><tspan x="640.0" dy="16">T 38 °C, despierto, sin signos meníngeos, tono y</tspan><tspan x="640.0" dy="16">reflejos normales.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿CONVULSIÓN FEBRIL SIMPLE?</tspan></text><rect x="40.0" y="285.0" width="682.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="56.0" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="start" data-max="552"><tspan x="56.0" dy="0">CRITERIOS (TODOS DEBEN CUMPLIRSE)</tspan></text><text x="706.0" y="307.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="100"><tspan x="706.0" dy="0">EN EL CASO</tspan></text><rect x="40.0" y="319.0" width="682.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="329.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="344.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="343.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="532"><tspan x="86.0" dy="0">Edad 6 meses a 5 años</tspan></text><text x="86.0" y="359.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="532"><tspan x="86.0" dy="0">1 año</tspan></text><text x="706.0" y="343.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="706.0" dy="0">Sí</tspan></text><rect x="40.0" y="365.0" width="682.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="375.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="390.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="389.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="532"><tspan x="86.0" dy="0">Generalizada (no focal)</tspan></text><text x="86.0" y="405.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="532"><tspan x="86.0" dy="0">Rigidez generalizada</tspan></text><text x="706.0" y="389.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="706.0" dy="0">Sí</tspan></text><rect x="40.0" y="411.0" width="682.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="421.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="436.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="435.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="532"><tspan x="86.0" dy="0">Dura &lt; 15 minutos</tspan></text><text x="86.0" y="451.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="532"><tspan x="86.0" dy="0">Unos minutos</tspan></text><text x="706.0" y="435.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="706.0" dy="0">Sí</tspan></text><rect x="40.0" y="457.0" width="682.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="467.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="482.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="481.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="532"><tspan x="86.0" dy="0">Una sola en 24 horas</tspan></text><text x="86.0" y="497.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="532"><tspan x="86.0" dy="0">No se describe otra</tspan></text><text x="706.0" y="481.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="706.0" dy="0">Sí</tspan></text><rect x="40.0" y="503.0" width="682.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="513.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="528.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="527.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="532"><tspan x="86.0" dy="0">Sin signos meníngeos ni déficit posterior</tspan></text><text x="86.0" y="543.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="532"><tspan x="86.0" dy="0">Despierto, tono y reflejos normales</tspan></text><text x="706.0" y="527.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="706.0" dy="0">Sí</tspan></text><rect x="40.0" y="549.0" width="682.0" height="57.0" rx="0" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="56.0" y="571.0" font-size="11" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="650"><tspan x="56.0" dy="0">5 de 5 · Todos = simple</tspan></text><text x="56.0" y="591.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="650"><tspan x="56.0" dy="0">Convulsión febril simple: bajar la fiebre, buscar el foco y educar.</tspan></text><rect x="40.0" y="285.0" width="682.0" height="321.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="742.0" y="285.0" width="218.0" height="327.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="754.0" y="295.0" width="143.8" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="763.0" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="763.0" dy="0">LACTANTE CON FIEBRE</tspan></text><g data-box="756.0 323.0 190.0 250.0"><g transform="translate(760.0,323.0) scale(0.75)"><path d="M76 128 C72 110 168 110 164 128 L172 222 C160 248 80 248 68 222 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M72 180 H168 L172 222 C160 248 80 248 68 222 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M76 132 L40 170 L52 184 L82 156 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M164 132 L200 170 L188 184 L158 156 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><circle cx="44" cy="182" r="10" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="196" cy="182" r="10" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M84 236 L70 300 L94 304 L108 244 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M156 236 L170 300 L146 304 L132 244 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="80" cy="308" rx="14" ry="7" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><ellipse cx="160" cy="308" rx="14" ry="7" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="120" cy="70" r="54" fill="#fecaca" stroke="#e9b48f" stroke-width="2" /><circle cx="100" cy="66" r="4" fill="#334155" stroke="none" stroke-width="0" /><circle cx="140" cy="66" r="4" fill="#334155" stroke="none" stroke-width="0" /><path d="M110 96 Q120 102 130 96" fill="none" stroke="#9a6b52" stroke-width="2"/><path d="M116 76 Q120 86 124 76" fill="none" stroke="#9a6b52" stroke-width="2" stroke-linejoin="round" /><circle cx="120" cy="214" r="3" fill="#9a6b52" stroke="none" stroke-width="0" /></g></g><text x="756.0" y="589.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="190"><tspan x="756.0" dy="0">Despierto tras la crisis.</tspan></text><text x="40.0" y="652.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="662.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="701.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="665.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="701.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Bajar la temperatura</tspan></text><text x="435.0" y="693.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Interconsulta a</tspan><tspan x="435.0" dy="17">neurología</tspan></text><text x="585.0" y="693.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Administración de</tspan><tspan x="585.0" dy="17">anticonvulsivantes</tspan></text><text x="735.0" y="693.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Realizar</tspan><tspan x="735.0" dy="17">electroencefalograma</tspan></text><text x="885.0" y="684.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Diazepam</tspan><tspan x="885.0" dy="17">endovenoso de</tspan><tspan x="885.0" dy="17">rutina</tspan></text><rect x="40.0" y="733.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="733.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="762.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Manejo inmediato?</tspan></text><text x="285.0" y="754.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: ya pasó la crisis;</tspan><tspan x="285.0" dy="16">tratar la fiebre</tspan></text><text x="435.0" y="754.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no la necesita la</tspan><tspan x="435.0" dy="16">simple</tspan></text><text x="585.0" y="754.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no previenen la</tspan><tspan x="585.0" dy="16">recurrencia</tspan></text><text x="735.0" y="762.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no está indicado</tspan></text><text x="885.0" y="754.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: solo si la crisis</tspan><tspan x="885.0" dy="16">está activa &gt; 5 min</tspan></text><rect x="40.0" y="662.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="807.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="835.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="857.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Medidas para bajar la fiebre y buscar el foco; tranquilizar y educar a los padres.</tspan><tspan x="58.0" dy="18">• No requiere EEG, neuroimagen ni anticonvulsivante de mantenimiento; la punción lumbar solo si hay signos meníngeos o &lt; 12 meses sin vacunas.</tspan><tspan x="58.0" dy="18">• Si dura &gt; 5 minutos: benzodiacepina (midazolam bucal/IM o diazepam rectal/EV).</tspan></text><text x="58.0" y="915.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAP, convulsión febril simple (2011; reafirmada); NICE.</tspan></text></svg>