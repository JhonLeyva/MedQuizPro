<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1022" viewBox="0 0 1000 1022" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Privación de agua y SIADH tienen ADH alta y orina concentrada; los separa la osmolaridad plasmática (alta en la deshidratación, baja en el SIADH)"><title>Privación de agua y SIADH tienen ADH alta y orina concentrada; los separa la osmolaridad plasmática (alta en la deshidratación, baja en el SIADH)</title><rect x="0.75" y="0.75" width="998.5" height="1020.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Fisiología del agua · ADH</tspan></text><rect x="349.9" y="32.0" width="155.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="427.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="139"><tspan x="427.6" dy="0">ENDOCRINOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">ADH en dos situaciones opuestas</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Sin agua: la sangre se concentra (osmolaridad alta) y la ADH sube de forma ADECUADA.</tspan><tspan x="58.0" dy="17">SIADH: la ADH sube sin motivo, se retiene agua y la sangre se diluye (osmolaridad baja,</tspan><tspan x="58.0" dy="17">sodio bajo).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de concepto</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Persona sana con privación severa de agua frente a</tspan><tspan x="640.0" dy="16">SIADH.</tspan><tspan x="640.0" dy="16">¿Qué parámetro las distingue mejor?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PRIVACIÓN DE AGUA VS SIADH</tspan></text><rect x=