<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="669" viewBox="0 0 1000 669" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Hipertensión severa en la gestación"><title>Hipertensión severa en la gestación</title><rect x="0.75" y="0.75" width="998.5" height="667.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16" y="16" width="968" height="68" rx="10" fill="#0f766e"/><text x="36" y="57.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170" y1="40.0" x2="170" y2="60.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="46.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">GINECOLOGÍA Y OBSTETRICIA ENAM: HIPERTENSIÓN SEVERA EN LA</tspan><tspan x="184.0" dy="16">GESTACIÓN</tspan></text><rect x="745.5" y="38.0" width="218.5" height="24" rx="12" fill="#134e4a"/><text x="854.8" y="54.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="202"><tspan x="854.8" dy="0">GINECOLOGÍA Y OBSTETRICIA</tspan></text><rect x="190.0" y="102.0" width="620" height="86.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="500.0" y="130.5" font-size="14.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Primigesta de 25 semanas con cefalea en un centro de salud</tspan><tspan x="500.0" dy="19.0">I-3</tspan></text><text x="500.0" y="172.0" font-size="12" font-weight="400" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">PA 160/110 mmHg en dos tomas</tspan></text><line x1="500.0" y1="188.0" x2="500.0" y2="207.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,206.0 505.0,206.0 500.0,214.0" fill="#0f766e"/><rect x="40.0" y="214.0" width="292" height="100.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="62.0" cy="238.0" r="13" fill="#0f766e"/><text x="62.0" y="243.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><rect x="74.0" y="214.0" width="258" height="100.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="88.0" y="241.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="88.0" dy="0">Reconocer</tspan></text><text x="88.0" y="264.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="88.0" dy="0">PA ≥ 160/110 mmHg =</tspan><tspan x="88.0" dy="17">hipertensión severa</tspan><tspan x="88.0" dy="17">(emergencia)</tspan></text><line x1="335.0" y1="264.0" x2="345.0" y2="264.0" stroke="#0f766e" stroke-width="2"/><polygon points="344.0,259.0 344.0,269.0 352.0,264.0" fill="#0f766e"/><rect x="354.0" y="214.0" width="292" height="100.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="376.0" cy="238.0" r="13" fill="#0f766e"/><text x="376.0" y="243.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="376.0" dy="0">2</tspan></text><rect x="388.0" y="214.0" width="258" height="100.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="402.0" y="241.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="402.0" dy="0">Antihipertensivo</tspan></text><text x="402.0" y="264.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="402.0" dy="0">Nifedipino VO, o labetalol /</tspan><tspan x="402.0" dy="17">hidralazina EV</tspan></text><line x1="649.0" y1="264.0" x2="659.0" y2="264.0" stroke="#0f766e" stroke-width="2"/><polygon points="658.0,259.0 658.0,269.0 666.0,264.0" fill="#0f766e"/><rect x="668.0" y="214.0" width="292" height="100.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="690.0" cy="238.0" r="13" fill="#0f766e"/><text x="690.0" y="243.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="690.0" dy="0">3</tspan></text><rect x="702.0" y="214.0" width="258" height="100.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="716.0" y="241.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="716.0" dy="0">Sulfato de Mg</tspan></text><text x="716.0" y="264.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="716.0" dy="0">Prevención de eclampsia: 4 g de</tspan><tspan x="716.0" dy="17">carga, luego 1 g/h</tspan></text><line x1="500.0" y1="314.0" x2="500.0" y2="333.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,332.0 505.0,332.0 500.0,340.0" fill="#0f766e"/><rect x="197.0" y="340.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="219.0" cy="364.0" r="13" fill="#0f766e"/><text x="219.0" y="369.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="219.0" dy="0">4</tspan></text><rect x="231.0" y="340.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="245.0" y="367.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="245.0" dy="0">Monitorizar</tspan></text><text x="245.0" y="390.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="245.0" dy="0">PA, diuresis, reflejos y signos</tspan><tspan x="245.0" dy="17">de alarma</tspan></text><line x1="492.0" y1="381.5" x2="502.0" y2="381.5" stroke="#0f766e" stroke-width="2"/><polygon points="501.0,376.5 501.0,386.5 509.0,381.5" fill="#0f766e"/><rect x="511.0" y="340.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="533.0" cy="364.0" r="13" fill="#0f766e"/><text x="533.0" y="369.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="533.0" dy="0">5</tspan></text><rect x="545.0" y="340.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="559.0" y="367.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="559.0" dy="0">Referir</tspan></text><text x="559.0" y="390.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="559.0" dy="0">A establecimiento con capacidad</tspan><tspan x="559.0" dy="17">resolutiva (nivel II–III)</tspan></text><line x1="500.0" y1="423.0" x2="500.0" y2="442.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,441.0 505.0,441.0 500.0,449.0" fill="#0f766e"/><rect x="90.0" y="449.0" width="820" height="67.5" rx="10" fill="#134e4a" stroke="#134e4a" stroke-width="1.5"/><text x="500.0" y="475.0" font-size="12" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="792"><tspan x="500.0" dy="0">CONDUCTA</tspan></text><text x="500.0" y="500.5" font-size="15" font-weight="400" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="792"><tspan x="500.0" dy="0">Estabilizar y referir de inmediato</tspan></text><rect x="40" y="542.5" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="570.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="592.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El primer nivel estabiliza y refiere: no mantiene en observación a una gestante con PA severa.</tspan><tspan x="58.0" dy="18">• Cefalea + PA severa = preeclampsia con criterios de severidad hasta demostrar lo contrario.</tspan></text><text x="58.0" y="632.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: INMP – GPC Trastorno hipertensivo del embarazo en el primer nivel · ACOG 2020</tspan></text></svg>
