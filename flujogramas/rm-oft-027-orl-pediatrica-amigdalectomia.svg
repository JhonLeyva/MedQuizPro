<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1302" viewBox="0 0 1000 1302" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La apnea del sueño por hipertrofia adenoamigdalar es una indicación absoluta de amigdalectomía en el niño"><title>La apnea del sueño por hipertrofia adenoamigdalar es una indicación absoluta de amigdalectomía en el niño</title><rect x="0.75" y="0.75" width="998.5" height="1300.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">ORL pediátrica · amigdalectomía</tspan></text><rect x="393.2" y="32.0" width="162.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="474.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="146"><tspan x="474.4" dy="0">OFTALMOLOGÍA Y ORL RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Amigdalectomía en el niño</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La hipertrofia adenoamigdalar es la causa más frecuente de trastorno respiratorio</tspan><tspan x="58.0" dy="17">obstructivo del sueño.</tspan><tspan x="58.0" dy="17">Las indicaciones se ordenan en absolutas, relativas y no indicadas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de indicación</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es una indicación absoluta de amigdalectomía</tspan><tspan x="640.0" dy="16">en el niño?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">INDICACIONES DE AMIGDALECTOMÍA, DE LA MÁS A LA MENOS URGENTE</tspan></text><polygon points="200.0,269.0 300.0,269.0 340.0,325.0 160.0,325.0" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="302.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="88"><tspan x="250.0" dy="0">1</tspan></text><rect x="486.0" y="269.0" width="474.0" height="56.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="501.0" y="293.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Absolutas: apnea del sueño, sospecha de neoplasia</tspan></text><text x="501.0" y="310.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">También hemorragia amigdalina recurrente y dificultad grave para deglutir</tspan></text><rect x="858.2" y="258.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="903.6" y="273.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="903.6" dy="0">◆ ESTE CASO</tspan></text><polygon points="160.0,331.0 340.0,331.0 380.0,387.0 120.0,387.0" fill="#99f6e4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="364.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="168"><tspan x="250.0" dy="0">2</tspan></text><rect x="486.0" y="331.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="355.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Relativas: amigdalitis recurrente</tspan></text><text x="501.0" y="372.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Solo con criterios de frecuencia (Paradise)</tspan></text><polygon points="120.0,393.0 380.0,393.0 420.0,449.0 80.0,449.0" fill="#5eead4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="426.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="248"><tspan x="250.0" dy="0">3</tspan></text><rect x="486.0" y="393.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="417.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Flemón periamigdalino</tspan></text><text x="501.0" y="434.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Se drena; se opera solo si recurre</tspan></text><polygon points="80.0,455.0 420.0,455.0 460.0,511.0 40.0,511.0" fill="#2dd4bf" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="488.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="328"><tspan x="250.0" dy="0">4</tspan></text><rect x="486.0" y="455.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="479.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Sin indicación: halitosis aislada o amígdala grande asintomática</tspan></text><text x="501.0" y="496.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Se observa</tspan></text><text x="250.0" y="529.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="420"><tspan x="250.0" dy="0">▲ indicación absoluta · ▼ sin indicación</tspan></text><rect x="40.0" y="551.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="577.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Apnea del sueño = indicación absoluta</tspan></text><text x="60.0" y="596.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La amigdalitis recurrente es relativa; la halitosis y la hipertrofia asintomática no se operan.</tspan></text><text x="40.0" y="657.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">INDICACIONES DE AMIGDALECTOMÍA EN EL NIÑO</tspan></text><rect x="40.0" y="669.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="688.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="314"><tspan x="50.0" dy="0">Situación</tspan></text><text x="380.0" y="688.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="279"><tspan x="380.0" dy="0">Tipo de indicación</tspan></text><text x="675.0" y="688.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="279"><tspan x="675.0" dy="0">Conducta</tspan></text><rect x="40.0" y="698.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="717.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="314"><tspan x="50.0" dy="0">Apnea del sueño con amígdalas grandes</tspan></text><text x="380.0" y="717.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="279"><tspan x="380.0" dy="0">Absoluta</tspan></text><text x="675.0" y="717.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="279"><tspan x="675.0" dy="0">Amigdalectomía; polisomnografía previa si hay</tspan><tspan x="675.0" dy="15">comorbilidad</tspan></text><rect x="270.6" y="709.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="316.0" y="724.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="316.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="742.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="761.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="314"><tspan x="50.0" dy="0">Sospecha de neoplasia, hemorragia recurrente o</tspan><tspan x="50.0" dy="15">disfagia grave</tspan></text><text x="380.0" y="761.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="279"><tspan x="380.0" dy="0">Absoluta</tspan></text><text x="675.0" y="761.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="279"><tspan x="675.0" dy="0">Amigdalectomía</tspan></text><rect x="40.0" y="786.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="805.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="314"><tspan x="50.0" dy="0">Amigdalitis recurrente (7 en 1 año, 5 por año en 2</tspan><tspan x="50.0" dy="15">años o 3 por año en 3 años)</tspan></text><text x="380.0" y="805.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="279"><tspan x="380.0" dy="0">Relativa</tspan></text><text x="675.0" y="805.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="279"><tspan x="675.0" dy="0">Amigdalectomía si se cumple la frecuencia</tspan><tspan x="675.0" dy="15">(Paradise)</tspan></text><rect x="40.0" y="830.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="849.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="314"><tspan x="50.0" dy="0">Flemón periamigdalino</tspan></text><text x="380.0" y="849.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="279"><tspan x="380.0" dy="0">Relativa</tspan></text><text x="675.0" y="849.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="279"><tspan x="675.0" dy="0">Drenaje; cirugía solo si recurre</tspan></text><rect x="40.0" y="859.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="878.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="314"><tspan x="50.0" dy="0">Halitosis aislada o hipertrofia asintomática</tspan></text><text x="380.0" y="878.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="279"><tspan x="380.0" dy="0">No indicada</tspan></text><text x="675.0" y="878.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="279"><tspan x="675.0" dy="0">No se opera</tspan></text><text x="40.0" y="928.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="938.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="977.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="977.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Halitosis severa</tspan></text><text x="435.0" y="969.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Amigdalitis</tspan><tspan x="435.0" dy="17">recurrente</tspan></text><rect x="513.0" y="941.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="977.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Apnea del sueño</tspan></text><text x="735.0" y="960.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hipertrofia</tspan><tspan x="735.0" dy="17">amigdalina</tspan><tspan x="735.0" dy="17">asintomática</tspan></text><text x="885.0" y="969.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Flemón</tspan><tspan x="885.0" dy="17">periamigdalino</tspan></text><rect x="40.0" y="1009.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="1009.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1046.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Indicación absoluta?</tspan></text><text x="285.0" y="1038.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no justifica la</tspan><tspan x="285.0" dy="16">cirugía por sí sola</tspan></text><text x="435.0" y="1030.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es indicación</tspan><tspan x="435.0" dy="16">relativa, exige criterios</tspan><tspan x="435.0" dy="16">de frecuencia</tspan></text><text x="585.0" y="1038.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: obstrucción de la</tspan><tspan x="585.0" dy="16">vía aérea con apnea</tspan></text><text x="735.0" y="1030.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: la amígdala grande</tspan><tspan x="735.0" dy="16">asintomática no se</tspan><tspan x="735.0" dy="16">opera</tspan></text><text x="885.0" y="1038.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: se drena y se</tspan><tspan x="885.0" dy="16">opera solo si recurre</tspan></text><rect x="40.0" y="938.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1099.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1127.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1149.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Absolutas: obstrucción de la vía aérea con apnea, sospecha de neoplasia, hemorragia amigdalina recurrente y dificultad grave para deglutir.</tspan><tspan x="58.0" dy="18">• Sospechar apnea por ronquido nocturno, pausas respiratorias, respiración bucal, enuresis, cefalea matutina y bajo rendimiento escolar; polisomnografía</tspan><tspan x="58.0" dy="18">   si hay obesidad, Down o discordancia.</tspan><tspan x="58.0" dy="18">• Amigdalitis recurrente es indicación relativa y exige cumplir los criterios de Paradise; la halitosis aislada y la amígdala grande asintomática no se operan.</tspan><tspan x="58.0" dy="18">• Alerta: retraso del crecimiento, hipertensión pulmonar o cor pulmonale indican obstrucción grave; el flemón periamigdalino se drena y se opera solo si</tspan><tspan x="58.0" dy="18">   recurre.</tspan></text><text x="58.0" y="1261.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAO-HNSF, Clinical Practice Guideline: Tonsillectomy in Children (Update), Otolaryngol Head Neck Surg 2019; Cummings Otolaryngology 7.ª ed. (2021).</tspan></text></svg>