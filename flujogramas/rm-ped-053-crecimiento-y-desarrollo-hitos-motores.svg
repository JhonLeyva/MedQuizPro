<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1103" viewBox="0 0 1000 1103" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="A los 6 meses el lactante pasa de prono a supino, se apoya en sus manos y pasa objetos de una mano a otra"><title>A los 6 meses el lactante pasa de prono a supino, se apoya en sus manos y pasa objetos de una mano a otra</title><rect x="0.75" y="0.75" width="998.5" height="1101.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Crecimiento y desarrollo · hitos motores</tspan></text><rect x="438.6" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="487.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="487.6" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Desarrollo motor</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Sigue una dirección cefalocaudal.</tspan><tspan x="58.0" dy="17">Los hitos de 2022 de los CDC y la AAP sitúan el rodar de prono a supino a los 6 meses.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué actividad motora debe realizar el lactante a los 6</tspan><tspan x="640.0" dy="16">meses?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">HITOS MOTORES SEGÚN LA EDAD</tspan></text><rect x="40.0" y="269.0" width="920.0" height="34.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="52.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="134"><tspan x="52.0" dy="0">HITO</tspan></text><text x="242.8" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="102"><tspan x="242.8" dy="0">2 meses</tspan></text><text x="348.4" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="102"><tspan x="348.4" dy="0">4 meses</tspan></text><text x="454.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="102"><tspan x="454.0" dy="0">6 meses</tspan></text><text x="559.6" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="102"><tspan x="559.6" dy="0">9 meses</tspan></text><text x="665.2" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="102"><tspan x="665.2" dy="0">12 meses</tspan></text><text x="734.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="220"><tspan x="734.0" dy="0">DETALLE</tspan></text><rect x="403.2" y="305.0" width="101.6" height="292.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/><rect x="40.0" y="309.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="331.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Levanta la cabeza en</tspan><tspan x="50.0" dy="16">prono</tspan></text><line x1="198.0" y1="335.0" x2="710.0" y2="335.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="242.8" cy="330.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="242.8" y="334.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="242.8" dy="0">✓</tspan></text><text x="242.8" y="357.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="242.8" dy="0">Sí</tspan></text><rect x="730.0" y="309.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="339.0" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">Primer control cefálico.</tspan></text><rect x="40.0" y="367.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="389.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Sostén cefálico y</tspan><tspan x="50.0" dy="16">comienza a rodar</tspan></text><line x1="198.0" y1="393.0" x2="710.0" y2="393.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="348.4" cy="388.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="348.4" y="392.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="348.4" dy="0">✓</tspan></text><text x="348.4" y="415.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="348.4" dy="0">Sí</tspan></text><rect x="730.0" y="367.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="389.5" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">Su ausencia a los 4 meses es señal de</tspan><tspan x="740.0" dy="15">alarma.</tspan></text><rect x="40.0" y="425.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="439.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Voltea de prono a</tspan><tspan x="50.0" dy="16">supino y se apoya en</tspan><tspan x="50.0" dy="16">las manos</tspan></text><line x1="198.0" y1="451.0" x2="710.0" y2="451.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="454.0" cy="446.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="454.0" y="450.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="454.0" dy="0">✓</tspan></text><text x="454.0" y="473.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="454.0" dy="0">Sí</tspan></text><rect x="730.0" y="425.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="447.5" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">Pasa objetos de una mano a otra;</tspan><tspan x="740.0" dy="15">sentado con apoyo.</tspan></text><rect x="40.0" y="483.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="497.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Se sienta sin apoyo,</tspan><tspan x="50.0" dy="16">gatea y hace pinza</tspan><tspan x="50.0" dy="16">inferior</tspan></text><line x1="198.0" y1="509.0" x2="710.0" y2="509.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="559.6" cy="504.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="559.6" y="508.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="559.6" dy="0">✓</tspan></text><text x="559.6" y="531.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="559.6" dy="0">Sí</tspan></text><rect x="730.0" y="483.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="513.0" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">Gatear y arrastrarse, a los 8-10 meses.</tspan></text><rect x="40.0" y="541.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="563.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Se para con ayuda y</tspan><tspan x="50.0" dy="16">hace pinza fina</tspan></text><line x1="198.0" y1="567.0" x2="710.0" y2="567.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="665.2" cy="562.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="665.2" y="566.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="665.2" dy="0">✓</tspan></text><text x="665.2" y="589.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="665.2" dy="0">Sí</tspan></text><rect x="730.0" y="541.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="563.5" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">Camina con apoyo; solo a los 15</tspan><tspan x="740.0" dy="15">meses.</tspan></text><rect x="416.3" y="294.0" width="75.4" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="454.0" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="454.0" dy="0">◆ 6 MESES</tspan></text><text x="44.0" y="613.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="44.0" dy="0">✓ hito esperado en esa edad</tspan></text><rect x="40.0" y="637.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="663.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">A los 6 meses: voltea de prono a supino</tspan></text><text x="60.0" y="682.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Gateo, ponerse de pie y la pinza fina son hitos posteriores.</tspan></text><text x="40.0" y="749.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="759.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="790.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="762.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="781.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Pasar de posición</tspan><tspan x="285.0" dy="17">prona a supina</tspan></text><text x="435.0" y="790.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Gateo y arrastre</tspan></text><text x="585.0" y="790.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Prensión palmar</tspan></text><text x="735.0" y="790.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ponerse de pie</tspan></text><text x="885.0" y="781.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Prensión con pulgar</tspan><tspan x="885.0" dy="17">y otro dedo</tspan></text><rect x="40.0" y="813.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="813.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="842.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Hito motor de los 6</tspan><tspan x="54.0" dy="16">meses?</tspan></text><text x="285.0" y="842.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: voltea de prono a</tspan><tspan x="285.0" dy="16">supino</tspan></text><text x="435.0" y="842.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es de los 8-10</tspan><tspan x="435.0" dy="16">meses</tspan></text><text x="585.0" y="834.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es un reflejo que</tspan><tspan x="585.0" dy="16">se vuelve voluntario a</tspan><tspan x="585.0" dy="16">los 4-5 meses</tspan></text><text x="735.0" y="842.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es de los 10-12</tspan><tspan x="735.0" dy="16">meses</tspan></text><text x="885.0" y="842.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: la pinza fina es de</tspan><tspan x="885.0" dy="16">los 9-12 meses</tspan></text><rect x="40.0" y="759.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="903.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="931.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="953.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• 2 meses: levanta la cabeza en prono; 4 meses: sostén cefálico y comienza a rodar; 6 meses: voltea en ambos sentidos, se apoya en las manos y pasa</tspan><tspan x="58.0" dy="18">   objetos de una mano a otra.</tspan><tspan x="58.0" dy="18">• 9 meses: se sienta sin apoyo, gatea y hace la pinza inferior; 12 meses: se para con ayuda y hace la pinza fina; 15 meses: camina solo.</tspan><tspan x="58.0" dy="18">• Gatear y arrastrarse son de los 8-10 meses; ponerse de pie, de los 10-12; la prensión palmar es un reflejo que se vuelve voluntario hacia los 4-5 meses.</tspan><tspan x="58.0" dy="18">• Alerta: sin sostén cefálico a los 4 meses, sin sentarse a los 9 o sin caminar a los 18; pesan más la asimetría o el tono muy alterado que el retraso aislado.</tspan></text><text x="58.0" y="1047.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC/AAP, hitos del desarrollo basados en evidencia (Pediatrics 2022;149); Nelson Tratado de Pediatría, 22.ª ed. (2024); MINSA, NTS 137-MINSA/2017/DGIESP, CRED</tspan><tspan x="58.0" dy="15">(RM 537-2017/MINSA)</tspan></text></svg>