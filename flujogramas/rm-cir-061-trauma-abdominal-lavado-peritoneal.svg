<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Lavado peritoneal positivo con hemodinamia comprometida en trauma cerrado: laparotomía exploradora"><title>Lavado peritoneal positivo con hemodinamia comprometida en trauma cerrado: laparotomía exploradora</title><rect x="0.75" y="0.75" width="998.5" height="998.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Trauma abdominal · lavado peritoneal</tspan></text><rect x="422.8" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="466.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="466.0" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Lavado peritoneal diagnóstico (LPD)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se instila solución salina en la cavidad y se analiza el líquido que sale.</tspan><tspan x="58.0" dy="17">Hoy se usa poco: la FAST es la prueba inicial y la TC el estudio del estable.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 25 años, accidente de tránsito</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dolor abdominal difuso, PA 100/50, FC 95, ecografía</tspan><tspan x="640.0" dy="16">normal.</tspan><tspan x="640.0" dy="16">LPD con leucocitos &gt; 500 y eritrocitos &gt; 100 000 por</tspan><tspan x="640.0" dy="16">cc: ¿conducta?</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CONDUCTA SEGÚN ESTABILIDAD Y RESULTADO DEL LAVADO</tspan></text><rect x="40.0" y="301.0" width="920.0" height="70.0" rx="12" fill="#ea580c" stroke="none" stroke-width="1.5"/><rect x="54.0" y="320.0" width="74.0" height="32.0" rx="16" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="91.0" y="341.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ea580c" text-anchor="middle" data-max="64"><tspan x="91.0" dy="0">PASO 1</tspan></text><text x="144.0" y="326.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="800"><tspan x="144.0" dy="0">FAST primero</tspan></text><text x="144.0" y="345.0" font-size="12" font-weight="600" font-style="normal" fill="#fff7ed" text-anchor="start" data-max="800"><tspan x="144.0" dy="0">El LPD queda para cuando no hay ecografía o esta no es concluyente.</tspan></text><line x1="500.0" y1="373.0" x2="500.0" y2="388.0" stroke="#ea580c" stroke-width="2"/><polygon points="495.0,387.0 505.0,387.0 500.0,395.0" fill="#ea580c"/><rect x="40.0" y="401.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="423.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="170"><tspan x="54.0" dy="0">HEMODINAMIA</tspan></text><text x="412.5" y="423.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="345"><tspan x="412.5" dy="0">LPD positivo</tspan></text><text x="777.5" y="423.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="345"><tspan x="777.5" dy="0">LPD negativo</tspan></text><rect x="40.0" y="441.0" width="184.0" height="72.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="474.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Comprometida</tspan></text><text x="54.0" y="491.5" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">PA baja, FC alta (este caso)</tspan></text><rect x="233.0" y="441.0" width="359.0" height="72.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="245.0" y="473.5" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Laparotomía exploradora</tspan></text><text x="245.0" y="489.5" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Control del sangrado y de la contaminación</tspan></text><rect x="491.2" y="430.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="536.6" y="445.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="536.6" dy="0">◆ ESTE CASO</tspan></text><rect x="598.0" y="441.0" width="359.0" height="72.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="610.0" y="466.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Buscar otra fuente</tspan></text><text x="610.0" y="482.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Tórax, pelvis, retroperitoneo</tspan><tspan x="610.0" dy="15">Repetir FAST</tspan></text><rect x="40.0" y="519.0" width="184.0" height="72.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="552.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Estable</tspan></text><text x="54.0" y="569.5" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Sin shock</tspan></text><rect x="233.0" y="519.0" width="359.0" height="72.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="245.0" y="544.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">TC con contraste</tspan></text><text x="245.0" y="560.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Define el órgano lesionado</tspan><tspan x="245.0" dy="15">Operar si hay víscera hueca</tspan></text><rect x="598.0" y="519.0" width="359.0" height="72.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="610.0" y="544.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Observación seriada</tspan></text><text x="610.0" y="560.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Examen abdominal repetido</tspan><tspan x="610.0" dy="15">Hematocrito en control</tspan></text><text x="44.0" y="613.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Una ecografía normal no descarta lesión de víscera hueca ni retroperitoneal.</tspan></text><text x="40.0" y="661.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="671.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="702.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="693.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Laparoscopía</tspan><tspan x="285.0" dy="17">diagnóstica</tspan></text><text x="435.0" y="693.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Catéter venoso</tspan><tspan x="435.0" dy="17">central</tspan></text><text x="585.0" y="702.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">TAC abdominal</tspan></text><rect x="663.0" y="674.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="693.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Laparotomía</tspan><tspan x="735.0" dy="17">exploradora</tspan></text><text x="885.0" y="693.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Resonancia</tspan><tspan x="885.0" dy="17">magnética</tspan></text><rect x="40.0" y="725.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="725.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="762.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Conducta inmediata?</tspan></text><text x="285.0" y="746.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es diagnóstica y el</tspan><tspan x="285.0" dy="16">LPD ya confirmó</tspan><tspan x="285.0" dy="16">sangre</tspan></text><text x="435.0" y="754.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es una vía, no trata</tspan><tspan x="435.0" dy="16">la causa</tspan></text><text x="585.0" y="754.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: exige estabilidad y</tspan><tspan x="585.0" dy="16">retrasa el control</tspan></text><text x="735.0" y="746.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: LPD positivo con</tspan><tspan x="735.0" dy="16">hemodinamia</tspan><tspan x="735.0" dy="16">comprometida</tspan></text><text x="885.0" y="754.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no es un estudio</tspan><tspan x="885.0" dy="16">de urgencia</tspan></text><rect x="40.0" y="671.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="815.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="843.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="865.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• LPD positivo: &gt; 10 mL de sangre al aspirar, &gt; 100 000 eritrocitos/mm³, &gt; 500 leucocitos/mm³, bilis, contenido intestinal o amilasa elevada.</tspan><tspan x="58.0" dy="18">• Trauma cerrado + LPD positivo + hemodinamia comprometida = laparotomía exploradora (ATLS 11, 2025).</tspan><tspan x="58.0" dy="18">• Si está estable, la TC con contraste precisa lesiones de órgano sólido que se pueden manejar sin operar; la laparoscopía es para penetrante estable o</tspan><tspan x="58.0" dy="18">   duda diafragmática.</tspan><tspan x="58.0" dy="18">• Alerta: hipotensión, peritonitis o evisceración = quirófano sin más estudios.</tspan></text><text x="58.0" y="959.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ATLS, 11.ª ed. (2025); WSES, trauma abdominal cerrado (2017); Schwartz Principios de Cirugía 11.ª ed.</tspan></text></svg>