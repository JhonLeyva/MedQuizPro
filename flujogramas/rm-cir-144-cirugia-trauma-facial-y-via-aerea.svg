<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1028" viewBox="0 0 1000 1028" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Trauma facial con intubación orotraqueal imposible y saturación de 80 %: cricotiroidotomía"><title>Trauma facial con intubación orotraqueal imposible y saturación de 80 %: cricotiroidotomía</title><rect x="0.75" y="0.75" width="998.5" height="1026.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Cirugía · trauma facial y vía aérea</tspan></text><rect x="397.6" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="440.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="440.8" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Vía aérea en trauma facial</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Sangre, dientes y fragmentos óseos comprometen la vía; un Glasgow de 8 no la protege.</tspan><tspan x="58.0" dy="17">Primero la vía aérea con control de la columna cervical.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Politraumatizado con cara destruida</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 25 años, hemorragia profusa por nariz y</tspan><tspan x="640.0" dy="16">boca, saturación de 80 %.</tspan><tspan x="640.0" dy="16">Intubación orotraqueal difícil.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE LLEGA A LA VÍA AÉREA QUIRÚRGICA</tspan></text><text x="614.0" y="297.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,309.0 580.0,309.0 531.7,417.0 88.3,417.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="325.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="373.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="399"><tspan x="310.0" dy="0">Trauma facial, Glasgow 8 y saturación de 80 %</tspan></text><line x1="559.8" y1="363.0" x2="606.0" y2="363.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="318.0" width="111.0" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="669.5" y="335.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="669.5" dy="0">Cricotiroidotomía</tspan></text><rect x="731.0" y="318.0" width="147.6" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="804.8" y="335.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="804.8" dy="0">Intubación nasotraqueal</tspan></text><rect x="614.0" y="350.0" width="145.0" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="686.5" y="367.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="686.5" dy="0">Máscara con reservorio</tspan></text><rect x="765.0" y="350.0" width="112.9" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="821.4" y="367.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="821.4" dy="0">Máscara laríngea</tspan></text><rect x="614.0" y="382.0" width="99.9" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="663.9" y="399.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="663.9" dy="0">Cánula binasal</tspan></text><polygon points="88.3,421.0 531.7,421.0 483.3,477.0 136.7,477.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="162.7" cy="449.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="162.7" y="453.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="162.7" dy="0">1</tspan></text><text x="320.0" y="453.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="283"><tspan x="320.0" dy="0">¿Asegura y protege la vía aérea?</tspan></text><line x1="511.5" y1="449.0" x2="606.0" y2="449.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="436.0" width="157.1" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="692.5" y="453.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="692.5" dy="0">✕ Máscara con reservorio</tspan></text><line x1="636.0" y1="449.5" x2="761.1" y2="449.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="777.1" y="436.0" width="112.0" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="833.0" y="453.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="833.0" dy="0">✕ Cánula binasal</tspan></text><line x1="799.1" y1="449.5" x2="879.0" y2="449.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="136.7,481.0 483.3,481.0 435.0,541.0 185.0,541.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="511.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="515.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">2</tspan></text><text x="320.0" y="507.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">¿Se puede usar con fractura</tspan><tspan x="320.0" dy="17">facial y sangre?</tspan></text><line x1="463.2" y1="511.0" x2="606.0" y2="511.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="498.0" width="159.7" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="693.9" y="515.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="693.9" dy="0">✕ Intubación nasotraqueal</tspan></text><line x1="636.0" y1="511.5" x2="763.7" y2="511.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="779.7" y="498.0" width="125.0" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="842.2" y="515.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="842.2" dy="0">✕ Máscara laríngea</tspan></text><line x1="801.7" y1="511.5" x2="894.8" y2="511.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="545.0" x2="310.0" y2="564.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,563.0 315.0,563.0 310.0,571.0" fill="#0f766e"/><rect x="140.0" y="575.0" width="340.0" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="604.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">CRICOTIROIDOTOMÍA</tspan></text><text x="310.0" y="628.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">No puedo intubar ni oxigenar</tspan><tspan x="310.0" dy="17">Vía aérea quirúrgica</tspan></text><rect x="370.6" y="564.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="579.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="582.9" width="346.0" height="76.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="602.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="620.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">La cricotiroidotomía se hace sin demora cuando fracasan</tspan><tspan x="628.0" dy="16">la intubación y la oxigenación.</tspan></text><text x="40.0" y="706.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="716.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="747.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="719.9" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="747.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Cricotiroidotomía</tspan></text><text x="435.0" y="739.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Intubación</tspan><tspan x="435.0" dy="17">nasotraqueal</tspan></text><text x="585.0" y="739.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Máscara con</tspan><tspan x="585.0" dy="17">reservorio</tspan></text><text x="735.0" y="747.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Máscara laríngea</tspan></text><text x="885.0" y="747.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Cánula binasal</tspan></text><rect x="40.0" y="770.9" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="770.9" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="799.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Alternativa para iniciar</tspan><tspan x="54.0" dy="16">el manejo?</tspan></text><text x="285.0" y="799.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: vía aérea quirúrgica</tspan><tspan x="285.0" dy="16">de rescate</tspan></text><text x="435.0" y="791.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: contraindicada si</tspan><tspan x="435.0" dy="16">hay fractura de la base</tspan><tspan x="435.0" dy="16">del cráneo</tspan></text><text x="585.0" y="791.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: solo aporta</tspan><tspan x="585.0" dy="16">oxígeno y no protege</tspan><tspan x="585.0" dy="16">la vía</tspan></text><text x="735.0" y="791.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no sella con</tspan><tspan x="735.0" dy="16">sangre y no protege de</tspan><tspan x="735.0" dy="16">la aspiración</tspan></text><text x="885.0" y="791.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: solo aporta</tspan><tspan x="885.0" dy="16">oxígeno y no protege</tspan><tspan x="885.0" dy="16">la vía</tspan></text><rect x="40.0" y="716.9" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="860.9" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="888.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="910.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• ABCDE: asegurar la vía aérea primero, con control de la columna cervical.</tspan><tspan x="58.0" dy="18">• Si no se logra intubar ni oxigenar es una vía aérea quirúrgica: cricotiroidotomía, rápida, con referencias palpables y baja morbilidad.</tspan><tspan x="58.0" dy="18">• La intubación nasotraqueal está contraindicada si se sospecha fractura de la base del cráneo o del tercio medio facial.</tspan><tspan x="58.0" dy="18">• Alerta: la mascarilla con reservorio y la cánula binasal solo dan oxígeno; la máscara laríngea no sella con sangre ni protege de la aspiración.</tspan></text><text x="58.0" y="986.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Difficult Airway Society, guía de intubación difícil no anticipada en adultos (2025; PMID 41203471); ATLS, 10.ª ed. (American College of Surgeons, 2018).</tspan></text></svg>