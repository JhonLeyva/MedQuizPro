-max="524"><tspan x="58.0" dy="0">Ordena los problemas del ASIS porque los recursos son limitados.</tspan><tspan x="58.0" dy="17">Criterios de la demanda: magnitud, tendencia, gravedad, intervención e interés.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de criterio</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Uno de los criterios de priorización de problemas de la</tspan><tspan x="640.0" dy="16">demanda.</tspan><tspan x="640.0" dy="16">¿Cuál es?</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CRITERIOS PARA PRIORIZAR PROBLEMAS DE LA DEMANDA</tspan></text><line x1="410.3" y1="363.0" x2="340.0" y2="341.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="341.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="410.3" y1="419.0" x2="340.0" y2="441.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="441.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="363.0" x2="660.0" y2=