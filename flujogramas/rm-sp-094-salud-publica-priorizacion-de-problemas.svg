"142.2" dy="17">ASIS</tspan></text><line x1="248.5" y1="574.0" x2="267.5" y2="574.0" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,569.0 266.5,579.0 274.5,574.0" fill="#0f766e"/><rect x="278.5" y="545.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="578.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Recursos limitados</tspan></text><line x1="487.0" y1="574.0" x2="506.0" y2="574.0" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,569.0 505.0,579.0 513.0,574.0" fill="#0f766e"/><rect x="517.0" y="545.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="569.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Aplicar los criterios de la</tspan><tspan x="619.2" dy="17">demanda</tspan></text><line x1="725.5" y1="574.0" x2="744.5" y2="574.0" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,569.0 743.5,579.0 751.5,574.0" fill="#0f766e"/><rect x="755.5" y="545.0" width="204.5" height="58.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="569.5" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Lista ordenada de</tspan><tspan x="857.8" dy="17">prioridades</tspan></text><text x="40.0" y="643.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="653.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="692.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="684.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Cálculo de los</tspan><tspan x="285.0" dy="17">recursos humanos</tspan></text><text x="435.0" y="675.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Análisis de</tspan><tspan x="435.0" dy="17">viabilidad de</tspan><tspan x="435.0" dy="17">objetivos</tspan></text><text x="585.0" y="675.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Tiempo para</tspan><tspan x="585.0" dy="17">actividades</tspan><tspan x="585.0" dy="17">intramurales</tspan></text><text x="735.0" y="684.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Equipamiento del</tspan><tspan x="735.0" dy="17">establecimiento</tspan></text><rect x="813.0" y="656.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="684.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Interés de la</tspan><tspan x="885.0" dy="17">población</tspan></text><rect x="40.0" y="724.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="724.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="753.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Criterio de la</tspan><tspan x="54.0" dy="16">demanda?</tspan></text><text x="285.0" y="753.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es un recurso de la</tspan><tspan x="285.0" dy="16">oferta</tspan></text><text x="435.0" y="753.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es una condición</tspan><tspan x="435.0" dy="16">de la oferta</tspan></text><text x="585.0" y="753.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es una condición</tspan><tspan x="585.0" dy="16">de la oferta</tspan></text><text x="735.0" y="753.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es un recurso de la</tspan><tspan x="735.0" dy="16">oferta</tspan></text><text x="885.0" y="745.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: da respaldo y</tspan><tspan x="885.0" dy="16">participación</tspan><tspan x="885.0" dy="16">comunitaria</tspan></text><rect x="40.0" y="653.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="814.0" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="842.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="864.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Magnitud: cuántas personas afecta (prevalencia, incidencia, mortalidad). Tendencia: si aumenta, se mantiene o disminuye.</tspan><tspan x="58.0" dy="18">• Gravedad o riesgo: letalidad, discapacidad, años de vida perdidos. Capacidad de intervención: existencia de medidas eficaces.</tspan><tspan x="58.0" dy="18">• Interés de la población: da respaldo comunitario y participación en la ejecución.</tspan><tspan x="58.0" dy="18">• Alerta: recursos humanos, tiempo, equipamiento y viabilidad son criterios de la oferta, no de la demanda.</tspan></text><text x="58.0" y="940.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OPS, Programación local: método Hanlon modificado; MINSA, Metodología del análisis de situación de salud local (Perú); MINSA, Modelo de Atención Integral de Salud</tspan><tspan x="58.0" dy="15">basado en Familia y Comunidad (RM 464-2011/MINSA).</tspan></text></svg>