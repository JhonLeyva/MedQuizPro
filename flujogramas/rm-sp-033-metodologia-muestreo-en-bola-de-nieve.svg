<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1151" viewBox="0 0 1000 1151" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Reclutar adictos por referencia de otros adictos es un muestreo en bola de nieve"><title>Reclutar adictos por referencia de otros adictos es un muestreo en bola de nieve</title><rect x="0.75" y="0.75" width="998.5" height="1149.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Metodología · muestreo en bola de nieve</tspan></text><rect x="439.9" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="504.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="504.2" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Muestreo en bola de nieve</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Técnica no probabilística: unos pocos participantes iniciales (semillas) reclutan a otros de</tspan><tspan x="58.0" dy="17">su red.</tspan><tspan x="58.0" dy="17">Típico en poblaciones ocultas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Fobia social en adictos a la heroína</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Se invita a tres adictos y cada uno contacta a dos más.</tspan><tspan x="640.0" dy="16">La muestra crece sucesivamente.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO CRECE LA MUESTRA</tspan></text><rect x="40.0" y="269.0" width="920.0" height="112.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="269.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="329.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Semillas</tspan></text><rect x="40.0" y="381.0" width="920.0" height="112.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="381.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="441.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Primera ola</tspan></text><rect x="40.0" y="493.0" width="920.0" height="112.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="493.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="553.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Segunda ola</tspan></text><rect x="40.0" y="605.0" width="920.0" height="112.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="605.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="665.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Límites</tspan></text><line x1="348.0" y1="308.5" x2="355.0" y2="308.5" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="308.5" x2="355.0" y2="420.5" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="420.5" x2="353.0" y2="420.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="353.0,425.5 353.0,415.5 362.0,420.5" fill="#0f766e"/><line x1="552.0" y1="420.5" x2="559.0" y2="420.5" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="420.5" x2="559.0" y2="532.5" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="532.5" x2="557.0" y2="532.5" stroke="#ea580c" stroke-width="2.2"/><polygon points="557.0,537.5 557.0,527.5 566.0,532.5" fill="#ea580c"/><line x1="756.0" y1="532.5" x2="763.0" y2="532.5" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="532.5" x2="763.0" y2="661.0" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="661.0" x2="761.0" y2="661.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="761.0,666.0 761.0,656.0 770.0,661.0" fill="#0f766e"/><rect x="158.0" y="282.0" width="190.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Se invita a 3 adictos</tspan></text><text x="168.0" y="315.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Entrevista individual</tspan></text><circle cx="158.0" cy="282.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="362.0" y="394.0" width="190.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="372.0" y="410.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Cada uno contacta a 2 más</tspan></text><text x="372.0" y="427.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">6 nuevos participantes</tspan></text><circle cx="362.0" cy="394.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="362.0" y="398.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="362.0" dy="0">2</tspan></text><rect x="566.0" y="506.0" width="190.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="576.0" y="522.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Estos contactan a otros</tspan></text><text x="576.0" y="539.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">La muestra crece sucesivamente</tspan></text><circle cx="566.0" cy="506.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="566.0" y="510.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="566.0" dy="0">3</tspan></text><rect x="770.0" y="618.0" width="190.0" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="780.0" y="634.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Sesgo de selección, sin</tspan><tspan x="780.0" dy="16">generalizar</tspan></text><text x="780.0" y="667.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Cuidar confidencialidad y</tspan><tspan x="780.0" dy="14.5">consentimiento</tspan></text><circle cx="770.0" cy="618.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="770.0" y="622.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="770.0" dy="0">4</tspan></text><rect x="40.0" y="735.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="761.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Reclutamiento en cadena = muestreo en bola de nieve</tspan></text><text x="60.0" y="780.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Es no probabilístico; el sistemático sí es probabilístico.</tspan></text><text x="40.0" y="847.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="857.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="879.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="879.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Por criterio</tspan></text><rect x="363.0" y="860.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="879.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Bola de nieve</tspan></text><text x="585.0" y="879.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Casos consecutivos</tspan></text><text x="735.0" y="879.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Sistemático</tspan></text><text x="885.0" y="879.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Por conveniencia</tspan></text><rect x="40.0" y="894.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="894.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="923.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Reclutamiento por</tspan><tspan x="54.0" dy="16">cadena de contactos?</tspan></text><text x="285.0" y="923.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: elige según el</tspan><tspan x="285.0" dy="16">juicio del investigador</tspan></text><text x="435.0" y="915.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: los participantes</tspan><tspan x="435.0" dy="16">reclutan a otros de su</tspan><tspan x="435.0" dy="16">red</tspan></text><text x="585.0" y="923.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: incluye a todos los</tspan><tspan x="585.0" dy="16">que se presentan</tspan></text><text x="735.0" y="915.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: toma uno cada</tspan><tspan x="735.0" dy="16">cierto intervalo de un</tspan><tspan x="735.0" dy="16">listado</tspan></text><text x="885.0" y="923.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: toma a los</tspan><tspan x="885.0" dy="16">disponibles sin cadena</tspan></text><rect x="40.0" y="857.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="984.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1012.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1034.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Sirve para poblaciones ocultas o estigmatizadas: consumidores de drogas, trabajadoras sexuales, personas con VIH.</tspan><tspan x="58.0" dy="18">• Limita: sesgo de selección (los más conectados entran más), muestra homogénea y sin posibilidad de generalizar ni calcular error muestral.</tspan><tspan x="58.0" dy="18">• Extensión con ponderación: muestreo dirigido por los participantes (respondent-driven sampling).</tspan><tspan x="58.0" dy="18">• Otros: por criterio (juicio del investigador), consecutivos (todos los que se presentan), sistemático (probabilístico, uno cada k) y por conveniencia.</tspan></text><text x="58.0" y="1110.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Celentano y Szklo, Gordis Epidemiología, 6.ª ed. (2019); Lash et al., Modern Epidemiology, 4.ª ed. (2021); Porta, A Dictionary of Epidemiology, 6.ª ed. (2014).</tspan></text></svg>