<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="997" viewBox="0 0 1000 997" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Ataques bruscos de taquicardia, disnea y miedo a morir con estudios normales: trastorno de pánico"><title>Ataques bruscos de taquicardia, disnea y miedo a morir con estudios normales: trastorno de pánico</title><rect x="0.75" y="0.75" width="998.5" height="995.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Psiquiatría · trastorno de pánico</tspan></text><rect x="390.7" y="32.0" width="109.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="445.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="93"><tspan x="445.4" dy="0">PSIQUIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Trastorno de pánico</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ataques recurrentes e inesperados: miedo intenso que llega a su máximo en minutos.</tspan><tspan x="58.0" dy="17">Se acompaña de al menos 4 de 13 síntomas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 24 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Taquicardia, disnea, sudoración y opresión precordial</tspan><tspan x="640.0" dy="16">«como si me fuera a morir».</tspan><tspan x="640.0" dy="16">Dos episodios de 30 a 50 minutos; TSH, T4 y enzimas</tspan><tspan x="640.0" dy="16">cardiacas normales.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO EVOLUCIONA UN ATAQUE Y QUÉ SE HACE DESPUÉS</tspan></text><text x="44.0" y="315.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Del inicio brusco al diagnóstico de trastorno de pánico.</tspan></text><line x1="178.0" y1="354.0" x2="362.0" y2="354.0" stroke="#99f6e4" stroke-width="6"/><line x1="408.0" y1="354.0" x2="592.0" y2="354.0" stroke="#99f6e4" stroke-width="6"/><line x1="638.0" y1="354.0" x2="822.0" y2="354.0" stroke="#99f6e4" stroke-width="6"/><circle cx="155.0" cy="354.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="155.0" y="358.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="155.0" dy="0">0 min</tspan></text><rect x="45.0" y="388.0" width="220.0" height="108.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="155.0" y="408.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="155.0" dy="0">Inicio abrupto de miedo intenso</tspan></text><text x="155.0" y="425.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="155.0" dy="0">Taquicardia, disnea, sudoración y</tspan><tspan x="155.0" dy="16">opresión torácica</tspan></text><circle cx="385.0" cy="354.0" r="22" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><text x="385.0" y="358.5" font-size="9.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="38"><tspan x="385.0" dy="0">30 min</tspan></text><rect x="275.0" y="388.0" width="220.0" height="108.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="385.0" y="408.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="208"><tspan x="385.0" dy="0">Pico del ataque y resolución</tspan></text><text x="385.0" y="425.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="385.0" dy="0">Duración típica; en el caso duraron de</tspan><tspan x="385.0" dy="16">30 a 50 minutos</tspan></text><rect x="355.0" y="485.0" width="59.9" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="385.0" y="500.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="385.0" dy="0">◆ CASO</tspan></text><circle cx="615.0" cy="354.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="615.0" y="358.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="615.0" dy="0">Luego</tspan></text><rect x="505.0" y="388.0" width="220.0" height="108.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="615.0" y="408.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="615.0" dy="0">Descartar causas orgánicas</tspan></text><text x="615.0" y="425.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="615.0" dy="0">TSH, T4 y enzimas cardiacas normales</tspan><tspan x="615.0" dy="16">apoyan el origen psiquiátrico</tspan></text><circle cx="845.0" cy="354.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="845.0" y="358.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="845.0" dy="0">1 mes</tspan></text><rect x="735.0" y="388.0" width="220.0" height="108.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="845.0" y="408.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="845.0" dy="0">Preocupación por nuevos</tspan><tspan x="845.0" dy="17">ataques</tspan></text><text x="845.0" y="442.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="845.0" dy="0">Con ello se confirma el trastorno; se</tspan><tspan x="845.0" dy="16">inicia ISRS y terapia</tspan><tspan x="845.0" dy="16">cognitivo-conductual</tspan></text><rect x="40.0" y="528.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="554.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Ataques recurrentes e inesperados + estudios normales = pánico</tspan></text><text x="60.0" y="573.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El episodio maniaco, el depresivo y el esquizoafectivo son síndromes sostenidos.</tspan></text><text x="40.0" y="640.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="650.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="681.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="653.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="681.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Trastorno de pánico</tspan></text><text x="435.0" y="672.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Depresivo</tspan><tspan x="435.0" dy="17">recurrente</tspan></text><text x="585.0" y="681.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Esquizoafectivo</tspan></text><text x="735.0" y="672.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Reacción al estrés</tspan><tspan x="735.0" dy="17">grave</tspan></text><text x="885.0" y="681.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Episodio maniaco</tspan></text><rect x="40.0" y="704.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="704.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="741.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico probable?</tspan></text><text x="285.0" y="725.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: ataques bruscos</tspan><tspan x="285.0" dy="16">recurrentes con</tspan><tspan x="285.0" dy="16">estudios normales</tspan></text><text x="435.0" y="733.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: exige síndrome</tspan><tspan x="435.0" dy="16">afectivo sostenido</tspan></text><text x="585.0" y="725.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: exige síndrome</tspan><tspan x="585.0" dy="16">afectivo sostenido y</tspan><tspan x="585.0" dy="16">psicosis</tspan></text><text x="735.0" y="733.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: requiere un factor</tspan><tspan x="735.0" dy="16">estresante identificable</tspan></text><text x="885.0" y="725.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: ánimo elevado y</tspan><tspan x="885.0" dy="16">menor sueño durante</tspan><tspan x="885.0" dy="16">días</tspan></text><rect x="40.0" y="650.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="794.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="822.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="844.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• DSM-5-TR: tras al menos un ataque, un mes o más de preocupación persistente por nuevos ataques o cambio de conducta (evitar lugares). Los 13</tspan><tspan x="58.0" dy="18">   síntomas incluyen palpitaciones, disnea, mareo y miedo a morir.</tspan><tspan x="58.0" dy="18">• Antes de aceptarlo se descartan hipertiroidismo, feocromocitoma, arritmias, síndrome coronario, hipoglucemia, estimulantes y abstinencia; aquí TSH y</tspan><tspan x="58.0" dy="18">   enzimas son normales.</tspan><tspan x="58.0" dy="18">• Manía: ánimo elevado y menor sueño por días. Depresivo y esquizoafectivo: síndrome afectivo sostenido. Estrés grave: factor estresante identificable.</tspan><tspan x="58.0" dy="18">• Tratamiento: ISRS (sertralina, escitalopram) más terapia cognitivo-conductual; benzodiazepinas solo a corto plazo.</tspan></text><text x="58.0" y="956.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: APA, DSM-5-TR (2022); Kaplan y Sadock, Sinopsis de Psiquiatría, 12.ª ed. (2021); Harrison, Principios de Medicina Interna, 21.ª ed. (2022).</tspan></text></svg>