<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1137" viewBox="0 0 1000 1137" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Endometritis puerperal tras cesárea: clindamicina, gentamicina y ampicilina"><title>Endometritis puerperal tras cesárea: clindamicina, gentamicina y ampicilina</title><rect x="0.75" y="0.75" width="998.5" height="1135.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Puerperio · endometritis posparto</tspan></text><rect x="400.3" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="480.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="480.0" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Endometritis puerperal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección polimicrobiana de la decidua y el miometrio, más frecuente tras cesárea.</tspan><tspan x="58.0" dy="17">Participan anaerobios, bacilos gramnegativos, estreptococos B y enterococos.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Puérpera tras cesárea</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Cuarto día posoperatorio con fiebre de 39 °C y</tspan><tspan x="640.0" dy="16">taquicardia.</tspan><tspan x="640.0" dy="16">Loquios fétidos, dolor y subinvolución uterina.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">RUTA DEL TRATAMIENTO DE LA ENDOMETRITIS PUERPERAL</tspan></text><rect x="40.0" y="285.0" width="920.0" height="128.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="285.0" width="108.0" height="128.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="353.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Al ingreso</tspan></text><rect x="40.0" y="413.0" width="920.0" height="128.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="413.0" width="108.0" height="128.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="477.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Si no mejora</tspan><tspan x="94.0" dy="14">(48-72 h)</tspan></text><rect x="40.0" y="541.0" width="920.0" height="128.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="541.0" width="108.0" height="128.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="609.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Alta</tspan></text><line x1="307.2" y1="341.0" x2="314.2" y2="341.0" stroke="#ea580c" stroke-width="2.2"/><line x1="314.2" y1="341.0" x2="314.2" y2="341.0" stroke="#ea580c" stroke-width="2.2"/><line x1="314.2" y1="341.0" x2="312.2" y2="341.0" stroke="#ea580c" stroke-width="2.2"/><polygon points="312.2,346.0 312.2,336.0 321.2,341.0" fill="#ea580c"/><line x1="470.4" y1="341.0" x2="477.4" y2="341.0" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="341.0" x2="477.4" y2="477.0" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="477.0" x2="475.4" y2="477.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="475.4,482.0 475.4,472.0 484.4,477.0" fill="#0f766e"/><line x1="633.6" y1="477.0" x2="640.6" y2="477.0" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="477.0" x2="640.6" y2="469.0" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="469.0" x2="638.6" y2="469.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="638.6,474.0 638.6,464.0 647.6,469.0" fill="#0f766e"/><line x1="796.8" y1="469.0" x2="803.8" y2="469.0" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="469.0" x2="803.8" y2="605.0" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="605.0" x2="801.8" y2="605.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="801.8,610.0 801.8,600.0 810.8,605.0" fill="#0f766e"/><rect x="158.0" y="298.0" width="149.2" height="86.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="168.0" y="314.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Clindamicina 900 mg</tspan><tspan x="168.0" dy="16">c/8 h EV</tspan></text><text x="168.0" y="347.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Cubre anaerobios y</tspan><tspan x="168.0" dy="14.5">estreptococos</tspan></text><circle cx="158.0" cy="298.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="302.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="321.2" y="298.0" width="149.2" height="86.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="331.2" y="314.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Gentamicina 5 mg/kg</tspan><tspan x="331.2" dy="16">c/24 h EV</tspan></text><text x="331.2" y="347.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Cubre gramnegativos</tspan><tspan x="331.2" dy="14.5">entéricos</tspan></text><circle cx="321.2" cy="298.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="321.2" y="302.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="321.2" dy="0">2</tspan></text><rect x="484.4" y="426.0" width="149.2" height="102.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="494.4" y="442.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Añadir ampicilina 2 g</tspan><tspan x="494.4" dy="16">c/6 h</tspan></text><text x="494.4" y="475.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Cubre enterococo, que</tspan><tspan x="494.4" dy="14.5">clindamicina y</tspan><tspan x="494.4" dy="14.5">gentamicina no cubren</tspan></text><circle cx="484.4" cy="426.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="484.4" y="430.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="484.4" dy="0">3</tspan></text><rect x="647.6" y="426.0" width="149.2" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="657.6" y="442.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Buscar absceso o</tspan><tspan x="657.6" dy="16">restos</tspan></text><text x="657.6" y="475.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Ecografía o TC si persiste</tspan><tspan x="657.6" dy="14.5">la fiebre</tspan></text><circle cx="647.6" cy="426.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="647.6" y="430.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="647.6" dy="0">4</tspan></text><rect x="810.8" y="554.0" width="149.2" height="102.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="820.8" y="570.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Suspender con 24-48</tspan><tspan x="820.8" dy="16">h sin fiebre</tspan></text><text x="820.8" y="603.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">No se necesitan</tspan><tspan x="820.8" dy="14.5">antibióticos orales</tspan><tspan x="820.8" dy="14.5">después</tspan></text><circle cx="810.8" cy="554.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="810.8" y="558.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="810.8" dy="0">5</tspan></text><rect x="40.0" y="687.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="713.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Endometritis posparto = clindamicina + gentamicina (+ ampicilina)</tspan></text><text x="60.0" y="732.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Las quinolonas y los esquemas sin gramnegativos o sin anaerobios no son de elección.</tspan></text><text x="40.0" y="799.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="809.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="848.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="831.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Penicilina sódica,</tspan><tspan x="285.0" dy="17">metronidazol y</tspan><tspan x="285.0" dy="17">doxiciclina</tspan></text><rect x="363.0" y="812.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="831.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Clindamicina,</tspan><tspan x="435.0" dy="17">gentamicina y</tspan><tspan x="435.0" dy="17">ampicilina</tspan></text><text x="585.0" y="831.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Gentamicina,</tspan><tspan x="585.0" dy="17">norfloxacino y</tspan><tspan x="585.0" dy="17">clindamicina</tspan></text><text x="735.0" y="831.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ciprofloxacino,</tspan><tspan x="735.0" dy="17">clindamicina y</tspan><tspan x="735.0" dy="17">penicilina</tspan></text><text x="885.0" y="831.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Amikacina,</tspan><tspan x="885.0" dy="17">cefuroxima y</tspan><tspan x="885.0" dy="17">penicilina</tspan></text><rect x="40.0" y="880.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="880.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="917.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Esquema apropiado?</tspan></text><text x="285.0" y="901.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: sin cobertura de</tspan><tspan x="285.0" dy="16">gramnegativos</tspan><tspan x="285.0" dy="16">entéricos</tspan></text><text x="435.0" y="901.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: cubre anaerobios,</tspan><tspan x="435.0" dy="16">gramnegativos y</tspan><tspan x="435.0" dy="16">enterococo</tspan></text><text x="585.0" y="909.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: norfloxacino no es</tspan><tspan x="585.0" dy="16">de elección</tspan></text><text x="735.0" y="901.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: quinolona y sin</tspan><tspan x="735.0" dy="16">cobertura de</tspan><tspan x="735.0" dy="16">gramnegativos</tspan></text><text x="885.0" y="909.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: sin cobertura</tspan><tspan x="885.0" dy="16">anaerobia</tspan></text><rect x="40.0" y="809.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="970.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="998.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1020.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Cuadro: fiebre, dolor uterino, loquios malolientes y subinvolución; descartar infección de herida, mastitis, infección urinaria y restos placentarios.</tspan><tspan x="58.0" dy="18">• Esquema de referencia endovenoso: clindamicina 900 mg c/8 h más gentamicina 5 mg/kg c/24 h; cubre anaerobios y gramnegativos.</tspan><tspan x="58.0" dy="18">• Si no mejora en 48-72 h o se sospecha enterococo, añadir ampicilina 2 g c/6 h; ante falla persistente, ecografía o TC por absceso o restos.</tspan><tspan x="58.0" dy="18">• Continuar hasta 24-48 h sin fiebre; no se necesitan antibióticos orales después. Quinolonas y esquemas sin cobertura anaerobia no son de elección.</tspan></text><text x="58.0" y="1096.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, Practice Bulletin 199 (Obstet Gynecol 2018;132); CDC, STI Treatment Guidelines (2021); Williams Obstetricia 26.ª ed. (2022)</tspan></text></svg>