<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="995" viewBox="0 0 1000 995" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En el lactante menor de 3 meses el tope diario de paracetamol es de 60 a 75 mg/kg; la clave marca 75 mg/kg"><title>En el lactante menor de 3 meses el tope diario de paracetamol es de 60 a 75 mg/kg; la clave marca 75 mg/kg</title><rect x="0.75" y="0.75" width="998.5" height="993.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Farmacología · paracetamol en el lactante</tspan></text><rect x="446.8" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="518.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="518.7" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Paracetamol</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se metaboliza por glucuronidación y sulfatación; una fracción pasa por CYP2E1 a NAPQI.</tspan><tspan x="58.0" dy="17">El glutatión neutraliza el NAPQI; al agotarse hay necrosis centrolobulillar.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 1 mes y 15 días</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Cuadro febril viral.</tspan><tspan x="640.0" dy="16">Se prescribe paracetamol; ¿cuál es la dosis mínima</tspan><tspan x="640.0" dy="16">potencialmente tóxica?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DOSIS DE PARACETAMOL EN MG/KG Y QUÉ SIGNIFICA CADA RANGO</tspan></text><rect x="40.0" y="285.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="311.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Paracetamol (mg/kg)</tspan></text><text x="60.0" y="330.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El lactante menor de 3 meses tolera menos que el niño mayor.</tspan></text><rect x="70.0" y="394.0" width="322.5" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="231.2" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="312"><tspan x="231.2" dy="0">Hasta 75 mg/kg al día: rango del lactante pequeño</tspan></text><rect x="392.5" y="394.0" width="322.5" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="553.8" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="312"><tspan x="553.8" dy="0">Más de 75 repetido: riesgo hepático (clave)</tspan></text><rect x="715.0" y="394.0" width="215.0" height="40.0" rx="6" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/><text x="822.5" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#c2410c" text-anchor="middle" data-max="205"><tspan x="822.5" dy="0">150 o más: toxicidad aguda clásica</tspan></text><line x1="177.5" y1="434.0" x2="177.5" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="177.5" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="177.5" dy="0">25</tspan></text><line x1="285.0" y1="434.0" x2="285.0" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="285.0" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="285.0" dy="0">50</tspan></text><line x1="392.5" y1="434.0" x2="392.5" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="392.5" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="392.5" dy="0">75</tspan></text><line x1="500.0" y1="434.0" x2="500.0" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="500.0" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="500.0" dy="0">100</tspan></text><line x1="715.0" y1="434.0" x2="715.0" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="715.0" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="715.0" dy="0">150</tspan></text><line x1="930.0" y1="434.0" x2="930.0" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">200</tspan></text><polygon points="383.5,380.0 401.5,380.0 392.5,392.0" fill="#ea580c"/><rect x="295.5" y="354.0" width="194.1" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="392.5" y="369.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="182"><tspan x="392.5" dy="0">◆ CLAVE DEL BANCO: 75 mg/kg</tspan></text><text x="40.0" y="502.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">POR QUÉ IMPORTA LA EDAD</tspan></text><rect x="40.0" y="512.0" width="297.3" height="85.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="513.0" width="6.0" height="83.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="536.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Menor de 3 meses</tspan></text><text x="58.0" y="557.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Conjugación inmadura, vida media prolongada:</tspan><tspan x="58.0" dy="16">tope de 60 a 75 mg/kg al día</tspan></text><rect x="351.3" y="512.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="513.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="536.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Niño mayor y adulto</tspan></text><text x="369.3" y="557.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Toxicidad aguda desde 150 mg/kg</tspan></text><rect x="662.7" y="512.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="513.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="536.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Dosis habitual</tspan></text><text x="680.7" y="557.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">10 a 15 mg/kg por dosis, cada 6 a 8 horas</tspan></text><text x="40.0" y="637.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="647.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="669.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="669.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">25 mg/kg</tspan></text><rect x="363.0" y="650.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="669.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">75 mg/kg</tspan></text><text x="585.0" y="669.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">200 mg/kg</tspan></text><text x="735.0" y="669.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">50 mg/kg</tspan></text><text x="885.0" y="669.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">150 mg/kg</tspan></text><rect x="40.0" y="684.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="684.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="713.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Dosis mínima</tspan><tspan x="54.0" dy="16">potencialmente tóxica?</tspan></text><text x="285.0" y="713.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: dentro del rango</tspan><tspan x="285.0" dy="16">terapéutico</tspan></text><text x="435.0" y="705.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: tope diario del</tspan><tspan x="435.0" dy="16">menor de 3 meses</tspan><tspan x="435.0" dy="16">(clave del banco)</tspan></text><text x="585.0" y="705.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: umbral de otras</tspan><tspan x="585.0" dy="16">edades o de ingesta</tspan><tspan x="585.0" dy="16">aguda grave</tspan></text><text x="735.0" y="713.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: dentro del rango</tspan><tspan x="735.0" dy="16">terapéutico</tspan></text><text x="885.0" y="705.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: toxicidad aguda</tspan><tspan x="885.0" dy="16">clásica del niño mayor</tspan><tspan x="885.0" dy="16">y adulto</tspan></text><rect x="40.0" y="647.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="774.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="802.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="824.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• En el menor de 3 meses la conjugación es inmadura, el aclaramiento es menor y la vida media se alarga: el tope diario es de unos 60 a 75 mg/kg al día,</tspan><tspan x="58.0" dy="18">   en tomas cada 6 a 8 horas.</tspan><tspan x="58.0" dy="18">• Excederlo de forma repetida puede causar hepatotoxicidad; 75 mg/kg es el umbral que el examen considera. Las dosis de 25 o 50 mg/kg están dentro</tspan><tspan x="58.0" dy="18">   del rango terapéutico (10 a 15 mg/kg por dosis).</tspan><tspan x="58.0" dy="18">• La dosis tóxica aguda del adulto y del niño mayor es de 150 mg/kg o más (opción E), no aplicable al lactante muy pequeño.</tspan><tspan x="58.0" dy="18">• Intoxicación: carbón activado si es precoz y N-acetilcisteína guiada por el nomograma de Rumack-Matthew desde las 4 horas; en ingesta crónica se</tspan><tspan x="58.0" dy="18">   tratan las transaminasas elevadas.</tspan></text><text x="58.0" y="954.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Nelson Tratado de Pediatría, 22.ª ed. (2024); Katzung Farmacología básica y clínica, 16.ª ed. (2024).</tspan></text></svg>