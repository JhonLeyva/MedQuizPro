<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1056" viewBox="0 0 1000 1056" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Úlceras genitales múltiples, blandas y dolorosas, de bordes irregulares: chancroide"><title>Úlceras genitales múltiples, blandas y dolorosas, de bordes irregulares: chancroide</title><rect x="0.75" y="0.75" width="998.5" height="1054.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">ITS · úlcera genital dolorosa</tspan></text><rect x="366.8" y="32.0" width="121.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="427.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="106"><tspan x="427.7" dy="0">INFECTOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Chancroide</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Haemophilus ducreyi; incubación corta de 3 a 7 días.</tspan><tspan x="58.0" dy="17">Úlceras múltiples, dolorosas, de bordes socavados y base sucia, fáciles de sangrar.</tspan><tspan x="58.0" dy="17">Se acompaña de adenopatía inguinal unilateral dolorosa que puede supurar (bubón).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 20 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">7 días tras una relación sexual: múltiples úlceras en el</tspan><tspan x="640.0" dy="16">pene, de bordes irregulares, que sangran y son</tspan><tspan x="640.0" dy="16">blandas y dolorosas.</tspan><tspan x="640.0" dy="16">¿Diagnóstico?</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO DISTINGUIR LAS ÚLCERAS GENITALES</tspan></text><rect x="40.0" y="301.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="323.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="170"><tspan x="54.0" dy="0">INFECCIÓN</tspan></text><text x="412.5" y="323.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="345"><tspan x="412.5" dy="0">Úlcera y dolor</tspan></text><text x="777.5" y="323.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="345"><tspan x="777.5" dy="0">Adenopatía inguinal</tspan></text><rect x="40.0" y="341.0" width="184.0" height="57.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="367.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Chancroide</tspan></text><text x="54.0" y="384.0" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Haemophilus ducreyi</tspan></text><rect x="233.0" y="341.0" width="359.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="245.0" y="366.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Múltiples, blandas y dolorosas</tspan></text><text x="245.0" y="382.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Bordes irregulares, sangran</tspan></text><rect x="598.0" y="341.0" width="359.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="610.0" y="366.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Unilateral y dolorosa</tspan></text><text x="610.0" y="382.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Puede supurar: bubón</tspan></text><rect x="856.2" y="330.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="901.6" y="345.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="901.6" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="404.0" width="184.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="430.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Sífilis primaria</tspan></text><text x="54.0" y="447.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Treponema pallidum</tspan></text><rect x="233.0" y="404.0" width="359.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="245.0" y="429.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Única, indurada e indolora</tspan></text><text x="245.0" y="445.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Chancro limpio</tspan></text><rect x="598.0" y="404.0" width="359.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="610.0" y="429.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Regional e indolora</tspan></text><text x="610.0" y="445.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Sin supuración</tspan></text><rect x="40.0" y="467.0" width="184.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="493.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Herpes genital</tspan></text><text x="54.0" y="510.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Virus herpes simple</tspan></text><rect x="233.0" y="467.0" width="359.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="245.0" y="492.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Vesículas que se rompen</tspan></text><text x="245.0" y="508.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Erosiones superficiales dolorosas</tspan></text><rect x="598.0" y="467.0" width="359.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="610.0" y="492.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Variable</tspan></text><text x="610.0" y="508.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Según primoinfección o recurrencia</tspan></text><rect x="40.0" y="530.0" width="184.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="556.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Donovanosis</tspan></text><text x="54.0" y="573.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Klebsiella granulomatis</tspan></text><rect x="233.0" y="530.0" width="359.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="245.0" y="555.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Roja, granulomatosa e indolora</tspan></text><text x="245.0" y="571.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Crece lentamente</tspan></text><rect x="598.0" y="530.0" width="359.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="610.0" y="555.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Sin adenopatía</tspan></text><text x="610.0" y="571.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Seudobubón posible</tspan></text><rect x="40.0" y="593.0" width="184.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="619.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Linfogranuloma venéreo</tspan></text><text x="54.0" y="636.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="162"><tspan x="54.0" dy="0">Chlamydia L1-L3</tspan></text><rect x="233.0" y="593.0" width="359.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="245.0" y="618.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">Pequeña y transitoria</tspan></text><text x="245.0" y="634.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="245.0" dy="0">A veces pasa inadvertida</tspan></text><rect x="598.0" y="593.0" width="359.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="610.0" y="618.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Bubones</tspan></text><text x="610.0" y="634.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="341"><tspan x="610.0" dy="0">Aparecen después</tspan></text><text x="44.0" y="672.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Toda úlcera genital exige descartar sífilis y VIH: aumentan el riesgo de transmisión.</tspan></text><text x="40.0" y="720.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="730.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="761.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="761.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Sífilis</tspan></text><text x="435.0" y="761.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Donovanosis</tspan></text><text x="585.0" y="761.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Herpes</tspan></text><text x="735.0" y="752.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Linfogranuloma</tspan><tspan x="735.0" dy="17">venéreo</tspan></text><rect x="813.0" y="733.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="761.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Chancroide</tspan></text><rect x="40.0" y="784.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="784.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="821.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="805.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: el chancro es</tspan><tspan x="285.0" dy="16">único, indurado e</tspan><tspan x="285.0" dy="16">indoloro</tspan></text><text x="435.0" y="805.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: la úlcera es</tspan><tspan x="435.0" dy="16">granulomatosa e</tspan><tspan x="435.0" dy="16">indolora</tspan></text><text x="585.0" y="813.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: comienza con</tspan><tspan x="585.0" dy="16">vesículas agrupadas</tspan></text><text x="735.0" y="813.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: la úlcera es</tspan><tspan x="735.0" dy="16">pequeña y transitoria</tspan></text><text x="885.0" y="805.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: múltiples, blandas,</tspan><tspan x="885.0" dy="16">dolorosas y de</tspan><tspan x="885.0" dy="16">incubación corta</tspan></text><rect x="40.0" y="730.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="874.0" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="902.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="924.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Chancroide: úlceras múltiples, blandas y dolorosas, con adenopatía inguinal unilateral dolorosa que puede supurar (bubón).</tspan><tspan x="58.0" dy="18">• Sífilis primaria: chancro único, indurado e indoloro. Herpes: vesículas agrupadas que dejan erosiones. Donovanosis: úlcera roja granulomatosa, indolora.</tspan><tspan x="58.0" dy="18">• Linfogranuloma venéreo (Chlamydia L1-L3): úlcera pequeña y transitoria con bubones.</tspan><tspan x="58.0" dy="18">• Tratamiento (CDC 2021): azitromicina 1 g VO o ceftriaxona 250 mg IM en dosis única; toda úlcera genital exige descartar sífilis y VIH.</tspan></text><text x="58.0" y="1000.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, Sexually Transmitted Infections Treatment Guidelines (MMWR 2021;70(4)); MINSA, NTS 240-MINSA/DGIESP-2026 (ITS); Harrison Principios de Medicina Interna</tspan><tspan x="58.0" dy="15">21.ª ed. (2022)</tspan></text></svg>