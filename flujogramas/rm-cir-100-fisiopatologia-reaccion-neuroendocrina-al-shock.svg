<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1169" viewBox="0 0 1000 1169" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En el shock aumenta la liberación de ACTH como parte de la reacción neuroendocrina"><title>En el shock aumenta la liberación de ACTH como parte de la reacción neuroendocrina</title><rect x="0.75" y="0.75" width="998.5" height="1167.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Fisiopatología · reacción neuroendocrina al shock</tspan></text><rect x="496.0" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="539.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="539.2" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Reacción neuroendocrina</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hipotálamo y simpático mantienen volumen y energía.</tspan><tspan x="58.0" dy="17">Protege al inicio; sostenida, causa catabolismo e inmunosupresión.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es la reacción neuroendocrina que se halla en el</tspan><tspan x="640.0" dy="16">shock?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL ESTÍMULO A LA HORMONA</tspan></text><text x="40.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="430"><tspan x="40.0" dy="0">EJE</tspan></text><text x="516.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="444"><tspan x="516.0" dy="0">QUÉ SUBE</tspan></text><rect x="40.0" y="291.0" width="430.0" height="177.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="379.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="384.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><text x="84.0" y="376.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Hipotálamo-hipófisis</tspan></text><text x="84.0" y="393.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Dolor, hipovolemia e hipoxia</tspan></text><line x1="476.0" y1="379.5" x2="503.0" y2="379.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,374.5 502.0,384.5 510.0,379.5" fill="#ea580c"/><rect x="516.0" y="291.0" width="444.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="530.0" y="315.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">ACTH → cortisol</tspan></text><text x="530.0" y="332.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Este caso</tspan></text><rect x="516.0" y="352.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Vasopresina (ADH)</tspan></text><text x="530.0" y="393.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Retiene agua</tspan></text><rect x="516.0" y="413.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="437.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Hormona del crecimiento</tspan></text><text x="530.0" y="454.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Moviliza energía</tspan></text><line x1="255.0" y1="470.0" x2="255.0" y2="483.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,482.0 260.0,482.0 255.0,490.0" fill="#0f766e"/><rect x="40.0" y="492.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="521.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="526.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">2</tspan></text><text x="84.0" y="518.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Simpático-adrenal</tspan></text><text x="84.0" y="535.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Barorreceptores</tspan></text><line x1="476.0" y1="521.5" x2="503.0" y2="521.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,516.5 502.0,526.5 510.0,521.5" fill="#ea580c"/><rect x="516.0" y="494.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="518.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Adrenalina y noradrenalina</tspan></text><text x="530.0" y="535.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Vasoconstricción y taquicardia</tspan></text><line x1="255.0" y1="553.0" x2="255.0" y2="566.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,565.0 260.0,565.0 255.0,573.0" fill="#0f766e"/><rect x="40.0" y="575.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="604.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="609.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">3</tspan></text><text x="84.0" y="601.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Renina-angiotensina</tspan></text><text x="84.0" y="618.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Riñón hipoperfundido</tspan></text><line x1="476.0" y1="604.5" x2="503.0" y2="604.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,599.5 502.0,609.5 510.0,604.5" fill="#ea580c"/><rect x="516.0" y="577.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="601.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Renina → aldosterona</tspan></text><text x="530.0" y="618.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Retiene sodio</tspan></text><line x1="255.0" y1="636.0" x2="255.0" y2="649.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,648.0 260.0,648.0 255.0,656.0" fill="#0f766e"/><rect x="40.0" y="658.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="687.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="692.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">4</tspan></text><text x="84.0" y="684.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Páncreas</tspan></text><text x="84.0" y="701.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Catecolaminas y cortisol</tspan></text><line x1="476.0" y1="687.5" x2="503.0" y2="687.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,682.5 502.0,692.5 510.0,687.5" fill="#ea580c"/><rect x="516.0" y="660.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="684.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Glucagón sube, insulina baja</tspan></text><text x="530.0" y="701.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Hiperglucemia</tspan></text><rect x="40.0" y="735.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="761.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">ACTH sube; adrenérgico, glucagón y renina también</tspan></text><text x="60.0" y="780.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Las opciones falsas dicen lo contrario de lo que ocurre.</tspan></text><text x="40.0" y="847.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="857.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="896.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="879.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Descenso del</tspan><tspan x="285.0" dy="17">estímulo</tspan><tspan x="285.0" dy="17">adrenérgico</tspan></text><text x="435.0" y="888.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Inhibición del</tspan><tspan x="435.0" dy="17">péptido natriurético</tspan></text><text x="585.0" y="888.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Menor glucagón</tspan><tspan x="585.0" dy="17">pancreático</tspan></text><text x="735.0" y="888.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Disminución de</tspan><tspan x="735.0" dy="17">renina</tspan></text><rect x="813.0" y="860.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="888.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Mayor liberación de</tspan><tspan x="885.0" dy="17">ACTH</tspan></text><rect x="40.0" y="928.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="928.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="957.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Reacción en el shock?</tspan></text><text x="285.0" y="949.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: la actividad</tspan><tspan x="285.0" dy="16">adrenérgica aumenta</tspan></text><text x="435.0" y="949.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no es el cambio</tspan><tspan x="435.0" dy="16">descrito en el shock</tspan></text><text x="585.0" y="949.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: el glucagón</tspan><tspan x="585.0" dy="16">aumenta</tspan></text><text x="735.0" y="957.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: la renina aumenta</tspan></text><text x="885.0" y="949.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: sube la ACTH, con</tspan><tspan x="885.0" dy="16">cortisol alto</tspan></text><rect x="40.0" y="857.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1002.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1030.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1052.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Aumentan: ACTH y cortisol, adrenalina y noradrenalina, glucagón, hormona del crecimiento, renina-angiotensina-aldosterona y ADH.</tspan><tspan x="58.0" dy="18">• Efectos: retención de sodio y agua, vasoconstricción, hiperglucemia por gluconeogénesis y resistencia a la insulina, y catabolismo proteico.</tspan><tspan x="58.0" dy="18">• Disminuyen: insulina (por las catecolaminas) y T3 (síndrome del enfermo eutiroideo).</tspan><tspan x="58.0" dy="18">• Bandera roja: shock refractario a vasopresores con hipoglucemia o hiponatremia = insuficiencia suprarrenal; dar hidrocortisona.</tspan></text><text x="58.0" y="1128.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Schwartz Principios de Cirugía 11.ª ed.; Sabiston Tratado de Cirugía 21.ª ed.; Guyton y Hall, Tratado de Fisiología Médica 14.ª ed.</tspan></text></svg>