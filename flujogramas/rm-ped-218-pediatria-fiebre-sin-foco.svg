<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="993" viewBox="0 0 1000 993" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Los criterios de Rochester estratifican el riesgo de infección bacteriana grave en el lactante febril sin foco"><title>Los criterios de Rochester estratifican el riesgo de infección bacteriana grave en el lactante febril sin foco</title><rect x="0.75" y="0.75" width="998.5" height="991.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · fiebre sin foco</tspan></text><rect x="349.0" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="398.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="398.0" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Fiebre sin foco</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Temperatura de 38 °C o más, menos de 72 horas, sin causa tras historia y examen.</tspan><tspan x="58.0" dy="17">Entre 5 y 10 % son infecciones bacterianas graves.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 3 meses</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Fiebre de 39 °C, malestar e inapetencia; examen</tspan><tspan x="640.0" dy="16">normal.</tspan><tspan x="640.0" dy="16">¿Cómo se determina el riesgo?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LOS SIETE CRITERIOS DE BAJO RIESGO DE ROCHESTER</tspan></text><rect x="40.0" y="285.0" width="540.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="56.0" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="start" data-max="430"><tspan x="56.0" dy="0">CRITERIOS DE ROCHESTER (SE CUMPLEN TODOS)</tspan></text><text x="562.0" y="307.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">PUNTOS</tspan></text><rect x="40.0" y="319.0" width="540.0" height="34.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="326.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="341.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="340.5" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="420"><tspan x="86.0" dy="0">Aspecto sano (examen normal en este caso)</tspan></text><text x="562.0" y="341.0" font-size="13" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">1</tspan></text><rect x="40.0" y="353.0" width="540.0" height="34.0" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="360.0" width="20.0" height="20.0" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="86.0" y="374.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="420"><tspan x="86.0" dy="0">Término y sin comorbilidad</tspan></text><text x="562.0" y="375.0" font-size="13" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">1</tspan></text><rect x="40.0" y="387.0" width="540.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="394.0" width="20.0" height="20.0" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="86.0" y="408.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="420"><tspan x="86.0" dy="0">Sin foco infeccioso en el examen</tspan></text><text x="562.0" y="409.0" font-size="13" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">1</tspan></text><rect x="40.0" y="421.0" width="540.0" height="34.0" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="428.0" width="20.0" height="20.0" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="86.0" y="442.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="420"><tspan x="86.0" dy="0">Leucocitos de 5000 a 15 000/mm³</tspan></text><text x="562.0" y="443.0" font-size="13" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">1</tspan></text><rect x="40.0" y="455.0" width="540.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="462.0" width="20.0" height="20.0" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="86.0" y="476.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="420"><tspan x="86.0" dy="0">Bandas menores de 1500/mm³</tspan></text><text x="562.0" y="477.0" font-size="13" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">1</tspan></text><rect x="40.0" y="489.0" width="540.0" height="34.0" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="496.0" width="20.0" height="20.0" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="86.0" y="510.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="420"><tspan x="86.0" dy="0">Orina con menos de 10 leucocitos por campo</tspan></text><text x="562.0" y="511.0" font-size="13" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">1</tspan></text><rect x="40.0" y="523.0" width="540.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="530.0" width="20.0" height="20.0" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="86.0" y="544.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="420"><tspan x="86.0" dy="0">Heces con menos de 5 leucocitos si hay diarrea</tspan></text><text x="562.0" y="545.0" font-size="13" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">1</tspan></text><rect x="40.0" y="557.0" width="540.0" height="40.0" rx="0" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="56.0" y="582.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="430"><tspan x="56.0" dy="0">Criterios que debe cumplir</tspan></text><text x="562.0" y="583.0" font-size="16" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">7</tspan></text><rect x="40.0" y="285.0" width="540.0" height="312.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="664.0" cy="335.0" r="46" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/><text x="664.0" y="335.0" font-size="26" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="0"><tspan x="664.0" dy="0">7</tspan></text><text x="664.0" y="355.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="664.0" dy="0">de 7</tspan></text><text x="724.0" y="321.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="230"><tspan x="724.0" dy="0">INTERPRETACIÓN</tspan></text><text x="724.0" y="341.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="230"><tspan x="724.0" dy="0">Cumple los 7: bajo riesgo; falla</tspan><tspan x="724.0" dy="17">uno: no es de bajo riesgo</tspan></text><rect x="634.0" y="397.0" width="326.0" height="52.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="634.0" y="397.0" width="10.0" height="52.0" rx="4" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="656.0" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#10b981" text-anchor="start" data-max="100"><tspan x="656.0" dy="0">7 de 7</tspan></text><text x="760.0" y="419.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Bajo riesgo</tspan></text><text x="760.0" y="437.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Cumple todos los criterios.</tspan></text><rect x="634.0" y="457.0" width="326.0" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="634.0" y="457.0" width="10.0" height="64.0" rx="4" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="656.0" y="479.0" font-size="12" font-weight="800" font-style="normal" fill="#e11d48" text-anchor="start" data-max="100"><tspan x="656.0" dy="0">Menos de 7</tspan></text><text x="760.0" y="479.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">No es de bajo riesgo</tspan></text><text x="760.0" y="497.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Evaluar y tratar como riesgo de</tspan><tspan x="760.0" dy="15">infección bacteriana grave.</tspan></text><text x="40.0" y="637.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="647.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="678.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="669.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Solicitar</tspan><tspan x="285.0" dy="17">hemograma</tspan></text><text x="435.0" y="669.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hospitalización del</tspan><tspan x="435.0" dy="17">paciente</tspan></text><rect x="513.0" y="650.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="669.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Criterios de</tspan><tspan x="585.0" dy="17">Rochester</tspan></text><text x="735.0" y="669.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Escala de</tspan><tspan x="735.0" dy="17">observación de Yale</tspan></text><text x="885.0" y="669.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Observación</tspan><tspan x="885.0" dy="17">ambulatoria</tspan></text><rect x="40.0" y="701.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="701.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="722.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué alternativa</tspan><tspan x="54.0" dy="16">estratifica el riesgo?</tspan></text><text x="285.0" y="722.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: aislado no</tspan><tspan x="285.0" dy="16">estratifica el riesgo</tspan></text><text x="435.0" y="722.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es una decisión</tspan><tspan x="435.0" dy="16">posterior a los criterios</tspan></text><text x="585.0" y="722.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: reglas de bajo</tspan><tspan x="585.0" dy="16">riesgo</tspan></text><text x="735.0" y="722.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: solo valora el</tspan><tspan x="735.0" dy="16">aspecto clínico</tspan></text><text x="885.0" y="722.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es una decisión</tspan><tspan x="885.0" dy="16">posterior a los criterios</tspan></text><rect x="40.0" y="647.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="775.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="803.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="825.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Rochester: aspecto sano, término sin comorbilidad, sin foco, leucocitos de 5000 a 15 000/mm³, bandas menores de 1500/mm³, orina con menos de 10</tspan><tspan x="58.0" dy="18">   leucocitos por campo, heces con menos de 5 si hay diarrea.</tspan><tspan x="58.0" dy="18">• Quien cumple todo es de bajo riesgo. La infección urinaria es la infección bacteriana grave más frecuente; en menores de 3 meses la orina se toma por</tspan><tspan x="58.0" dy="18">   sonda.</tspan><tspan x="58.0" dy="18">• AAP 2021 (8 a 60 días) añade procalcitonina, PCR y neutrófilos; con 3 meses el paciente queda fuera de su rango, y Rochester sigue siendo la opción.</tspan><tspan x="58.0" dy="18">• Un hemograma aislado no estratifica; la escala de Yale solo valora el aspecto clínico.</tspan></text><text x="58.0" y="937.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Pantell RH y cols., AAP, Well-Appearing Febrile Infants 8 to 60 Days Old (Pediatrics 2021); Jaskiewicz JA y cols., Rochester criteria (Pediatrics 1994); Nelson, 22.ª ed.</tspan><tspan x="58.0" dy="15">(2024).</tspan></text></svg>