<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1036" viewBox="0 0 1000 1036" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Zika en las Américas desde 2015 con microcefalia: enfermedad emergente"><title>Zika en las Américas desde 2015 con microcefalia: enfermedad emergente</title><rect x="0.75" y="0.75" width="998.5" height="1034.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Epidemiología · enfermedades emergentes</tspan></text><rect x="452.9" y="32.0" width="143.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="524.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="127"><tspan x="524.7" dy="0">SALUD PÚBLICA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Emergente frente a reemergente</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Emergente: aparece por primera vez o crece mucho en un lugar nuevo o con nuevas</tspan><tspan x="58.0" dy="17">formas clínicas.</tspan><tspan x="58.0" dy="17">Reemergente: ya estaba controlada y vuelve (por ejemplo, TB o sarampión).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Virus del Zika</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Antes de 2015 solo brotes pequeños.</tspan><tspan x="640.0" dy="16">2015: Brasil y luego las Américas, con microcefalia por</tspan><tspan x="640.0" dy="16">primera vez.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO CRECEN LOS CASOS</tspan></text><rect x="40.0" y="295.0" width="438.0" height="322.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="52.0" y="305.0" width="117.3" height="20.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="319.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">EMERGENTE: ZIKA</tspan></text><rect x="362.6" y="284.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="408.0" y="299.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">◆ ESTE CASO</tspan></text><g transform="translate(52.0,333.0) scale(1.0)"><rect x="46" y="12" width="250" height="170" fill="#f8fafc" stroke="#cbd5e1"/><polyline points="46.0,178.6 121.0,176.9 146.0,173.5 171.0,80.0 196.0,20.5 221.0,148.0 271.0,168.4" fill="none" stroke="#0f766e" stroke-width="2.5"/><circle cx="196.0" cy="20.5" r="7" fill="#ea580c" stroke="#7c2d12" stroke-width="2" /><text x="206.0" y="10.5" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">2016</text><text x="206.0" y="10.5" font-size="10.5" font-weight="800" fill="#9a3412" text-anchor="start" data-max="0">2016</text><text x="171.0" y="208" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">Año</text><text x="4" y="20" font-size="10" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">Casos (relativo)</text><text x="46.0" y="195" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">2010</text><text x="171.0" y="195" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">2015</text><text x="296.0" y="195" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">2020</text><text x="42" y="186.0" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">0</text><text x="42" y="101.0" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">50</text><text x="42" y="16.0" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">100</text></g><text x="54.0" y="581.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="54.0" dy="0">Casi nada antes y un salto enorme en 2015-2016 en una región nueva.</tspan></text><rect x="522.0" y="295.0" width="438.0" height="322.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="534.0" y="305.0" width="161.9" height="20.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1"/><text x="543.0" y="319.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="543.0" dy="0">REEMERGENTE (EJEMPLO)</tspan></text><g transform="translate(534.0,333.0) scale(1.0)"><rect x="46" y="12" width="250" height="170" fill="#f8fafc" stroke="#cbd5e1"/><polyline points="46.0,63.0 96.0,131.0 146.0,168.4 196.0,173.5 246.0,114.0 271.0,63.0" fill="none" stroke="#0f766e" stroke-width="2.5"/><text x="171.0" y="208" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">Año</text><text x="4" y="20" font-size="10" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">Casos (relativo)</text><text x="46.0" y="195" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">2010</text><text x="171.0" y="195" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">2015</text><text x="296.0" y="195" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">2020</text><text x="42" y="186.0" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">0</text><text x="42" y="101.0" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">50</text><text x="42" y="16.0" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">100</text></g><text x="536.0" y="581.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="536.0" dy="0">Estaba controlada, bajó y vuelve a subir.</tspan></text><circle cx="500.0" cy="448.0" r="17" fill="#ea580c" stroke="none" stroke-width="0"/><polygon points="494.0,440.0 494.0,456.0 508.0,448.0" fill="#ffffff"/><text x="40.0" y="647.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OTRAS OPCIONES</tspan></text><rect x="40.0" y="657.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="658.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="681.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Emergente</tspan></text><text x="58.0" y="702.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Nueva en la región y con microcefalia.</tspan></text><rect x="237.5" y="646.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="282.9" y="661.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="282.9" dy="0">◆ ESTE CASO</tspan></text><rect x="351.3" y="657.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="658.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="681.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Endémica</tspan></text><text x="369.3" y="702.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Presencia constante esperada.</tspan></text><rect x="662.7" y="657.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="658.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="681.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Infecciosa</tspan></text><text x="680.7" y="702.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Correcto pero no describe el cambio.</tspan></text><text x="40.0" y="766.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="776.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="798.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="779.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="303.8" y="798.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Emergente</tspan></text><text x="491.2" y="798.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Infecciosa</tspan></text><text x="678.8" y="798.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Endémica</tspan></text><text x="866.2" y="798.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Reemergente</tspan></text><rect x="40.0" y="813.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="813.0" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="842.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Describe el cambio?</tspan></text><text x="303.8" y="842.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Sí</tspan></text><text x="491.2" y="842.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Muy general</tspan></text><text x="678.8" y="842.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No: no era constante</tspan></text><text x="866.2" y="834.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No: no estaba controlada</tspan><tspan x="866.2" dy="16">antes</tspan></text><rect x="40.0" y="776.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="887.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="915.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="937.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Nueva región + gran aumento + manifestación clínica nueva (microcefalia) = emergente.</tspan><tspan x="58.0" dy="18">• Reemergente sería si hubiera estado controlada en esa región y volviera.</tspan><tspan x="58.0" dy="18">• Endémica: presencia constante esperada.</tspan></text><text x="58.0" y="995.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS/OPS, alerta epidemiológica de Zika (2015-2016); Gordis, Epidemiología 6.ª ed..</tspan></text></svg>