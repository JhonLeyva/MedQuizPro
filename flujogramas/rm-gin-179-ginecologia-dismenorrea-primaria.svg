<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1253" viewBox="0 0 1000 1253" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la dismenorrea primaria de la adolescente la primera línea son los antiinflamatorios no esteroideos"><title>En la dismenorrea primaria de la adolescente la primera línea son los antiinflamatorios no esteroideos</title><rect x="0.75" y="0.75" width="998.5" height="1251.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ginecología · dismenorrea primaria</tspan></text><rect x="409.2" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="488.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="488.9" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Dismenorrea primaria</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Dolor menstrual sin patología pélvica, desde 6 a 24 meses tras la menarquia.</tspan><tspan x="58.0" dy="17">Exceso de prostaglandinas F2alfa y E2.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Adolescente con dismenorrea</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dolor cólico en hipogastrio con la menstruación.</tspan><tspan x="640.0" dy="16">¿Cuál es el tratamiento de primera línea?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ESCALERA DE TRATAMIENTO DE LA DISMENORREA PRIMARIA</tspan></text><polygon points="200.0,269.0 300.0,269.0 340.0,325.0 160.0,325.0" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="302.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="88"><tspan x="250.0" dy="0">1</tspan></text><rect x="486.0" y="269.0" width="474.0" height="56.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="501.0" y="293.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Antiinflamatorios no esteroideos</tspan></text><text x="501.0" y="310.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Ibuprofeno o naproxeno desde el inicio del dolor o de la menstruación</tspan></text><rect x="858.2" y="258.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="903.6" y="273.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="903.6" dy="0">◆ ESTE CASO</tspan></text><polygon points="160.0,331.0 340.0,331.0 380.0,387.0 120.0,387.0" fill="#99f6e4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="364.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="168"><tspan x="250.0" dy="0">2</tspan></text><rect x="486.0" y="331.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="355.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Anticonceptivos hormonales</tspan></text><text x="501.0" y="372.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Si fallan los antiinflamatorios o la paciente desea anticoncepción</tspan></text><polygon points="120.0,393.0 380.0,393.0 420.0,449.0 80.0,449.0" fill="#5eead4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="426.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="248"><tspan x="250.0" dy="0">3</tspan></text><rect x="486.0" y="393.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="417.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Medidas coadyuvantes</tspan></text><text x="501.0" y="434.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Calor local, ejercicio y estimulación nerviosa transcutánea</tspan></text><polygon points="80.0,455.0 420.0,455.0 460.0,511.0 40.0,511.0" fill="#2dd4bf" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="488.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="328"><tspan x="250.0" dy="0">4</tspan></text><rect x="486.0" y="455.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="479.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Buscar causa secundaria</tspan></text><text x="501.0" y="496.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Sin mejoría en 3 meses: endometriosis o adenomiosis por laparoscopía</tspan></text><text x="250.0" y="529.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="420"><tspan x="250.0" dy="0">▲ primer escalón · ▼ si no hay mejoría</tspan></text><rect x="40.0" y="551.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="577.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Dismenorrea primaria = antiinflamatorio no esteroideo</tspan></text><text x="60.0" y="596.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Los otros fármacos de la lista no son de primera línea.</tspan></text><text x="40.0" y="657.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE TRATAMIENTO DE LA DISMENORREA PRIMARIA</tspan></text><rect x="40.0" y="669.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="688.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="314"><tspan x="50.0" dy="0">Opción</tspan></text><text x="380.0" y="688.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="279"><tspan x="380.0" dy="0">Papel</tspan></text><text x="675.0" y="688.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="279"><tspan x="675.0" dy="0">Comentario</tspan></text><rect x="40.0" y="698.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="717.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="314"><tspan x="50.0" dy="0">Antiinflamatorios no esteroideos</tspan></text><text x="380.0" y="717.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="279"><tspan x="380.0" dy="0">Primera línea</tspan></text><text x="675.0" y="717.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="279"><tspan x="675.0" dy="0">Inhiben la síntesis de prostaglandinas; iniciar</tspan><tspan x="675.0" dy="15">temprano</tspan></text><rect x="270.6" y="709.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="316.0" y="724.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="316.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="742.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="761.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="314"><tspan x="50.0" dy="0">Anticonceptivos hormonales</tspan></text><text x="380.0" y="761.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="279"><tspan x="380.0" dy="0">Segunda línea</tspan></text><text x="675.0" y="761.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="279"><tspan x="675.0" dy="0">Atrofian el endometrio; útiles si desea</tspan><tspan x="675.0" dy="15">anticoncepción</tspan></text><rect x="40.0" y="786.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="805.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="314"><tspan x="50.0" dy="0">Calor, ejercicio, estimulación transcutánea</tspan></text><text x="380.0" y="805.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="279"><tspan x="380.0" dy="0">Coadyuvantes</tspan></text><text x="675.0" y="805.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="279"><tspan x="675.0" dy="0">Sin riesgo; complementan el fármaco</tspan></text><rect x="40.0" y="815.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="834.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="314"><tspan x="50.0" dy="0">Anticolinérgicos, inhibidores de serotonina</tspan></text><text x="380.0" y="834.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="279"><tspan x="380.0" dy="0">No recomendados</tspan></text><text x="675.0" y="834.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="279"><tspan x="675.0" dy="0">Sin evidencia de primera línea</tspan></text><rect x="40.0" y="844.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="863.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="314"><tspan x="50.0" dy="0">Antagonistas de las gonadotropinas</tspan></text><text x="380.0" y="863.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="279"><tspan x="380.0" dy="0">Causa secundaria</tspan></text><text x="675.0" y="863.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="279"><tspan x="675.0" dy="0">Se reservan para la endometriosis</tspan></text><text x="40.0" y="913.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="923.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="962.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="926.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="954.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Antiinflamatorios</tspan><tspan x="285.0" dy="17">no esteroideos</tspan></text><text x="435.0" y="954.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Anticonceptivos</tspan><tspan x="435.0" dy="17">orales</tspan></text><text x="585.0" y="962.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Anticolinérgicos</tspan></text><text x="735.0" y="945.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Inhibidores de</tspan><tspan x="735.0" dy="17">recaptación de</tspan><tspan x="735.0" dy="17">serotonina</tspan></text><text x="885.0" y="954.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Antagonista de las</tspan><tspan x="885.0" dy="17">gonadotropinas</tspan></text><rect x="40.0" y="994.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="994.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1023.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Primera línea?</tspan></text><text x="285.0" y="1015.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: reducen las</tspan><tspan x="285.0" dy="16">prostaglandinas</tspan></text><text x="435.0" y="1015.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: segunda línea o si</tspan><tspan x="435.0" dy="16">desea anticoncepción</tspan></text><text x="585.0" y="1015.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no son de primera</tspan><tspan x="585.0" dy="16">línea</tspan></text><text x="735.0" y="1015.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: sin indicación en la</tspan><tspan x="735.0" dy="16">dismenorrea primaria</tspan></text><text x="885.0" y="1015.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: se reservan para</tspan><tspan x="885.0" dy="16">endometriosis</tspan></text><rect x="40.0" y="923.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1068.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1096.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1118.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Los antiinflamatorios no esteroideos (ibuprofeno, naproxeno, ketoprofeno) inhiben la ciclooxigenasa y reducen las prostaglandinas; se inician al comienzo</tspan><tspan x="58.0" dy="18">   del dolor o de la menstruación.</tspan><tspan x="58.0" dy="18">• Si fallan o la paciente desea anticoncepción: anticonceptivos hormonales; calor local, ejercicio y estimulación nerviosa transcutánea son coadyuvantes.</tspan><tspan x="58.0" dy="18">• Sin mejoría tras 3 meses de antiinflamatorios y anticonceptivos: descartar causa secundaria (endometriosis, adenomiosis) por laparoscopía.</tspan><tspan x="58.0" dy="18">• Alerta: anticolinérgicos, inhibidores de la recaptación de serotonina y antagonistas de las gonadotropinas no son de primera línea.</tspan></text><text x="58.0" y="1212.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Burnett M, Lemyre M, SOGC Clinical Practice Guideline 345, J Obstet Gynaecol Can 2017;39:585-95; Williams Obstetricia, 26.ª ed. (2022).</tspan></text></svg>