<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1072" viewBox="0 0 1000 1072" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la osteoporosis el calcio, el fósforo y la fosfatasa alcalina séricos son normales"><title>En la osteoporosis el calcio, el fósforo y la fosfatasa alcalina séricos son normales</title><rect x="0.75" y="0.75" width="998.5" height="1070.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Reumatología · bioquímica de la osteoporosis</tspan></text><rect x="471.4" y="32.0" width="227.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="585.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="211"><tspan x="585.1" dy="0">REUMATOLOGÍA Y DERMATOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Osteoporosis</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La resorción supera a la formación, pero la matriz restante se mineraliza bien.</tspan><tspan x="58.0" dy="17">Por eso la bioquímica sérica es normal.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de laboratorio</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué patrón bioquímico se encuentra en la</tspan><tspan x="640.0" dy="16">osteoporosis?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ ESPERAR EN CADA ENFERMEDAD ÓSEA</tspan></text><rect x="40.0" y="269.0" width="920.0" height="32.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="290.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="180"><tspan x="54.0" dy="0">EXAMEN</tspan></text><text x="250.0" y="290.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="130"><tspan x="250.0" dy="0">VALOR DEL CASO</tspan></text><text x="400.0" y="290.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="130"><tspan x="400.0" dy="0">NORMAL</tspan></text><text x="550.0" y="290.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="400"><tspan x="550.0" dy="0">QUÉ SIGNIFICA</tspan></text><rect x="40.0" y="307.0" width="920.0" height="50.0" rx="8" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="336.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Osteoporosis</tspan></text><text x="250.0" y="337.0" font-size="13" font-weight="800" font-style="normal" fill="#15803d" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Todo normal</tspan></text><text x="400.0" y="336.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Todo normal</tspan></text><text x="550.0" y="328.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Pierde masa ósea sin alterar la mineralización; la FA puede subir tras</tspan><tspan x="550.0" dy="16">una fractura.</tspan></text><rect x="40.0" y="361.0" width="920.0" height="50.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="390.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Osteomalacia</tspan></text><text x="250.0" y="391.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">FA alta  ↑</tspan></text><text x="400.0" y="390.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Calcio normal</tspan></text><text x="550.0" y="382.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Falla la mineralización: calcio normal o bajo, fósforo bajo y fosfatasa</tspan><tspan x="550.0" dy="16">alta.</tspan></text><rect x="40.0" y="415.0" width="920.0" height="50.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="435.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Hiperparatiroidismo</tspan><tspan x="54.0" dy="17">primario</tspan></text><text x="250.0" y="445.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Calcio alto  ↑</tspan></text><text x="400.0" y="444.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Calcio 8,5-10,5 mg/dL</tspan></text><text x="550.0" y="444.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Hipercalcemia con hipofosfatemia.</tspan></text><rect x="40.0" y="469.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="493.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Enfermedad de Paget</tspan></text><text x="250.0" y="494.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">FA muy alta  ↑</tspan></text><text x="400.0" y="493.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">FA normal</tspan></text><text x="550.0" y="493.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Fosfatasa muy alta con calcio y fósforo normales.</tspan></text><rect x="40.0" y="513.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="537.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Mieloma o metástasis</tspan></text><text x="250.0" y="538.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Calcio alto  ↑</tspan></text><text x="400.0" y="537.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Calcio 8,5-10,5 mg/dL</tspan></text><text x="550.0" y="537.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Puede haber hipercalcemia.</tspan></text><rect x="40.0" y="571.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="597.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Calcio, fósforo y FA normales = osteoporosis</tspan></text><text x="60.0" y="616.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Una bioquímica alterada orienta a osteoporosis secundaria u otra osteopatía.</tspan></text><text x="40.0" y="683.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="693.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="732.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="724.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Calcio alto, fósforo</tspan><tspan x="285.0" dy="17">normal, FA alta</tspan></text><text x="435.0" y="724.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Calcio alto, fósforo</tspan><tspan x="435.0" dy="17">normal, FA normal</tspan></text><text x="585.0" y="715.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Calcio normal,</tspan><tspan x="585.0" dy="17">fósforo bajo, FA</tspan><tspan x="585.0" dy="17">normal</tspan></text><text x="735.0" y="724.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Calcio alto, fósforo</tspan><tspan x="735.0" dy="17">bajo, FA baja</tspan></text><rect x="813.0" y="696.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="724.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Calcio, fósforo y FA</tspan><tspan x="885.0" dy="17">normales</tspan></text><rect x="40.0" y="764.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="764.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="801.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Patrón bioquímico?</tspan></text><text x="285.0" y="785.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: la fosfatasa alta es</tspan><tspan x="285.0" dy="16">de osteomalacia o</tspan><tspan x="285.0" dy="16">Paget</tspan></text><text x="435.0" y="785.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: la calcemia</tspan><tspan x="435.0" dy="16">elevada sugiere otra</tspan><tspan x="435.0" dy="16">causa</tspan></text><text x="585.0" y="793.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: la fosforemia baja</tspan><tspan x="585.0" dy="16">sugiere osteomalacia</tspan></text><text x="735.0" y="785.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: sugiere</tspan><tspan x="735.0" dy="16">hiperparatiroidismo o</tspan><tspan x="735.0" dy="16">malignidad</tspan></text><text x="885.0" y="785.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: todo normal, sin</tspan><tspan x="885.0" dy="16">defecto de</tspan><tspan x="885.0" dy="16">mineralización</tspan></text><rect x="40.0" y="693.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="854.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="882.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="904.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Calcio, fósforo y fosfatasa alcalina normales; la fosfatasa puede subir de forma transitoria tras una fractura reciente.</tspan><tspan x="58.0" dy="18">• Osteomalacia: calcio normal o bajo, fósforo bajo y fosfatasa alcalina alta. Hiperparatiroidismo primario: hipercalcemia con hipofosfatemia. Paget:</tspan><tspan x="58.0" dy="18">   fosfatasa muy alta con calcio y fósforo normales.</tspan><tspan x="58.0" dy="18">• Alerta: una osteoporosis con laboratorio alterado es secundaria hasta demostrar lo contrario; se piden calcio, fósforo, creatinina, 25-OH vitamina D, PTH,</tspan><tspan x="58.0" dy="18">   TSH, hemograma y calciuria de 24 horas.</tspan><tspan x="58.0" dy="18">• Los marcadores de recambio (CTX, P1NP) sirven para monitorizar el tratamiento, no para diagnosticar.</tspan></text><text x="58.0" y="1016.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Endocrine Society, osteoporosis posmenopáusica (J Clin Endocrinol Metab 2020); Harrison, Principios de Medicina Interna, 21.ª ed. (2022); Canadá, guía de</tspan><tspan x="58.0" dy="15">osteoporosis, actualización 2023 (CMAJ 2023).</tspan></text></svg>