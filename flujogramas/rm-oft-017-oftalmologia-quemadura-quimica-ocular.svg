<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="932" viewBox="0 0 1000 932" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Quemadura ocular por lejía (álcali): irrigación inmediata y abundante, luego antibiótico tópico"><title>Quemadura ocular por lejía (álcali): irrigación inmediata y abundante, luego antibiótico tópico</title><rect x="0.75" y="0.75" width="998.5" height="930.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Oftalmología · quemadura química ocular</tspan></text><rect x="444.7" y="32.0" width="162.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="525.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="146"><tspan x="525.8" dy="0">OFTALMOLOGÍA Y ORL RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Quemadura química ocular</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Los álcalis saponifican las membranas, penetran a la cámara anterior y destruyen el limbo.</tspan><tspan x="58.0" dy="17">Todo se decide en los primeros minutos.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 12 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Quemadura oftálmica con lejía.</tspan><tspan x="640.0" dy="16">Se diagnostica queratitis traumática. ¿Tratamiento</tspan><tspan x="640.0" dy="16">inicial?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SE HACE Y CUÁNDO</tspan></text><text x="44.0" y="299.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Lavar es lo primero, incluso antes de preguntar o medir la visión.</tspan></text><line x1="178.0" y1="338.0" x2="362.0" y2="338.0" stroke="#99f6e4" stroke-width="6"/><line x1="408.0" y1="338.0" x2="592.0" y2="338.0" stroke="#99f6e4" stroke-width="6"/><line x1="638.0" y1="338.0" x2="822.0" y2="338.0" stroke="#99f6e4" stroke-width="6"/><circle cx="155.0" cy="338.0" r="22" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><text x="155.0" y="342.5" font-size="9.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="38"><tspan x="155.0" dy="0">0 min</tspan></text><rect x="45.0" y="372.0" width="220.0" height="75.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="155.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="208"><tspan x="155.0" dy="0">Irrigar sin demora</tspan></text><text x="155.0" y="409.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="155.0" dy="0">Suero, Ringer o agua limpia; evertir</tspan><tspan x="155.0" dy="16">párpados y retirar partículas.</tspan></text><rect x="72.5" y="436.0" width="164.9" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="155.0" y="451.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="155.0" dy="0">◆ ESTO PIDE LA PREGUNTA</tspan></text><circle cx="385.0" cy="338.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="385.0" y="342.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="385.0" dy="0">15 min+</tspan></text><rect x="275.0" y="372.0" width="220.0" height="75.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="385.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="385.0" dy="0">Seguir hasta pH 7,0-7,4</tspan></text><text x="385.0" y="409.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="385.0" dy="0">Medir con papel indicador y repetir si</tspan><tspan x="385.0" dy="16">vuelve a alcalinizarse.</tspan></text><circle cx="615.0" cy="338.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="615.0" y="342.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="615.0" dy="0">Luego</tspan></text><rect x="505.0" y="372.0" width="220.0" height="75.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="615.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="615.0" dy="0">Antibiótico tópico</tspan></text><text x="615.0" y="409.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="615.0" dy="0">Profilaxis de infección sobre el epitelio</tspan><tspan x="615.0" dy="16">dañado.</tspan></text><circle cx="845.0" cy="338.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="845.0" y="342.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="845.0" dy="0">Control</tspan></text><rect x="735.0" y="372.0" width="220.0" height="75.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="845.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="845.0" dy="0">Cicloplejía y control</tspan></text><text x="845.0" y="409.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="845.0" dy="0">Lágrimas sin conservantes, corticoide</tspan><tspan x="845.0" dy="16">tópico la primera semana.</tspan></text><rect x="40.0" y="479.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="505.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Álcali en el ojo = lavar de inmediato y abundante</tspan></text><text x="60.0" y="524.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Corticoides sistémicos, antiinflamatorios y oclusión no son el primer paso.</tspan></text><text x="40.0" y="591.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="601.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="632.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="623.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Corticoterapia</tspan><tspan x="285.0" dy="17">sistémica</tspan></text><text x="435.0" y="623.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Antiinflamatorios</tspan><tspan x="435.0" dy="17">sistémicos</tspan></text><text x="585.0" y="623.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Oclusión del ojo</tspan><tspan x="585.0" dy="17">afectado</tspan></text><text x="735.0" y="632.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Anestésicos locales</tspan></text><rect x="813.0" y="604.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="623.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Lavado y</tspan><tspan x="885.0" dy="17">antibioticoterapia</tspan></text><rect x="40.0" y="655.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="655.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="684.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tratamiento inicial?</tspan></text><text x="285.0" y="676.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no es tratamiento</tspan><tspan x="285.0" dy="16">inicial</tspan></text><text x="435.0" y="676.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no actúa sobre la</tspan><tspan x="435.0" dy="16">lesión química</tspan></text><text x="585.0" y="676.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: la oclusión retrasa</tspan><tspan x="585.0" dy="16">lo urgente</tspan></text><text x="735.0" y="676.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: su uso prolongado</tspan><tspan x="735.0" dy="16">retrasa la cicatrización</tspan></text><text x="885.0" y="676.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: irrigar y dar</tspan><tspan x="885.0" dy="16">antibiótico</tspan></text><rect x="40.0" y="601.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="729.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="757.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="779.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Lavar antes de la historia clínica o de medir la agudeza visual: suero fisiológico, Ringer lactato o agua limpia, 15 a 30 minutos o más, hasta pH conjuntival</tspan><tspan x="58.0" dy="18">   de 7,0 a 7,4 y con eversión de párpados.</tspan><tspan x="58.0" dy="18">• Luego: antibiótico tópico profiláctico, cicloplejía para el dolor y, con el especialista, lágrimas sin conservantes y corticoide tópico la primera semana;</tspan><tspan x="58.0" dy="18">   ascorbato y doxiciclina en casos graves.</tspan><tspan x="58.0" dy="18">• No son tratamiento inicial: corticoides o antiinflamatorios sistémicos y oclusión; un anestésico puede instilarse solo para facilitar el lavado.</tspan><tspan x="58.0" dy="18">• Alerta: no perder tiempo buscando un neutralizante; el agua es el antídoto. Pronóstico según isquemia limbar (Roper-Hall o Dua).</tspan></text><text x="58.0" y="891.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: StatPearls, Ocular Burns (2026); Kanski Oftalmología Clínica 9.ª ed. (2020)</tspan></text></svg>