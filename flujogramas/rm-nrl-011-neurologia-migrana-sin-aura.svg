<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1152" viewBox="0 0 1000 1152" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Cefalea pulsátil unilateral con náuseas y fotofobia que empeora con el esfuerzo: migraña sin aura"><title>Cefalea pulsátil unilateral con náuseas y fotofobia que empeora con el esfuerzo: migraña sin aura</title><rect x="0.75" y="0.75" width="998.5" height="1150.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neurología · migraña sin aura</tspan></text><rect x="375.7" y="32.0" width="113.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="432.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="98"><tspan x="432.5" dy="0">NEUROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Migraña sin aura</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Trastorno neurovascular primario con activación del sistema trigémino-vascular y liberación</tspan><tspan x="58.0" dy="17">de CGRP.</tspan><tspan x="58.0" dy="17">El diagnóstico es clínico.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 60 años, hipertensa</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Cefalea unilateral pulsátil de intensidad moderada, que</tspan><tspan x="640.0" dy="16">empeora con la actividad física.</tspan><tspan x="640.0" dy="16">Náuseas y fotofobia.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TRES PREGUNTAS QUE LLEVAN AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="285.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="330.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="358.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">1</tspan></text><rect x="124.0" y="285.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="313.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Cumple los criterios ICHD-3 de migraña sin aura?</tspan></text><rect x="136.0" y="327.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="347.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Sí: unilateral, pulsátil, moderada, empeora con la actividad, con náuseas y fotofobia</tspan></text><text x="152.0" y="366.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Se necesitan 5 crisis de 4-72 h, 2 de 4 rasgos del dolor y un síntoma acompañante.</tspan></text><line x1="77.0" y1="388.0" x2="77.0" y2="407.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,406.0 82.0,406.0 77.0,414.0" fill="#0f766e"/><text x="134.0" y="406.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="416.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="461.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="489.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">2</tspan></text><rect x="124.0" y="416.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="444.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Hay bandera roja por tener 60 años e hipertensión?</tspan></text><rect x="136.0" y="458.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="478.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Solo si la cefalea es de inicio nuevo después de los 50 años</tspan></text><text x="152.0" y="497.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Con larga evolución y perfil típico no obliga a estudiar; si es nueva, descartar arteritis de células gigantes.</tspan></text><line x1="77.0" y1="519.0" x2="77.0" y2="538.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,537.0 82.0,537.0 77.0,545.0" fill="#0f766e"/><text x="134.0" y="537.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="547.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="592.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="620.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">3</tspan></text><rect x="124.0" y="547.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="575.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Otra opción explica el cuadro?</tspan></text><rect x="136.0" y="589.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="609.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">No: sinusitis, glaucoma, isquemia y arteritis tienen otro perfil</tspan></text><text x="152.0" y="628.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Sinusitis: fiebre y secreción. Glaucoma: ojo rojo con halos. Isquemia: déficit focal súbito. Arteritis: claudicación y VSG alta.</tspan></text><rect x="40.0" y="668.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="694.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Cefalea típica y de larga evolución = migraña sin aura</tspan></text><text x="60.0" y="713.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El perfil clínico completo orienta; las neuroimágenes se reservan para banderas rojas.</tspan></text><text x="40.0" y="780.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="790.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="821.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="821.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Sinusitis frontal</tspan></text><text x="435.0" y="821.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Glaucoma</tspan></text><text x="585.0" y="821.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Isquemia cerebral</tspan></text><text x="735.0" y="812.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Arteritis de la</tspan><tspan x="735.0" dy="17">temporal</tspan></text><rect x="813.0" y="793.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="821.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Migraña</tspan></text><rect x="40.0" y="844.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="844.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="873.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico más</tspan><tspan x="54.0" dy="16">probable?</tspan></text><text x="285.0" y="865.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: dolor a la presión</tspan><tspan x="285.0" dy="16">del seno, con fiebre y</tspan><tspan x="285.0" dy="16">secreción</tspan></text><text x="435.0" y="865.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: ojo rojo doloroso</tspan><tspan x="435.0" dy="16">con halos y pérdida</tspan><tspan x="435.0" dy="16">visual</tspan></text><text x="585.0" y="873.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: déficit focal súbito,</tspan><tspan x="585.0" dy="16">no cefalea recurrente</tspan></text><text x="735.0" y="865.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: dolor temporal con</tspan><tspan x="735.0" dy="16">claudicación</tspan><tspan x="735.0" dy="16">mandibular y VSG alta</tspan></text><text x="885.0" y="873.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: cumple los criterios</tspan><tspan x="885.0" dy="16">de la ICHD-3</tspan></text><rect x="40.0" y="790.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="934.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="962.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="984.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• ICHD-3: 5 o más crisis de 4 a 72 h, con 2 de 4 rasgos del dolor (unilateral, pulsátil, moderada o grave, agravada por la actividad) y náuseas o vómitos, o</tspan><tspan x="58.0" dy="18">   fotofobia y fonofobia.</tspan><tspan x="58.0" dy="18">• Bandera roja (SNNOOP10): cefalea de inicio nuevo después de los 50 años; obliga a descartar arteritis de células gigantes (cuero cabelludo sensible,</tspan><tspan x="58.0" dy="18">   claudicación mandibular, VSG alta).</tspan><tspan x="58.0" dy="18">• Agudo: AINE o triptanes. Preventivo: propranolol, topiramato o anti-CGRP (AHS 2021).</tspan><tspan x="58.0" dy="18">• Los triptanes están contraindicados en cardiopatía isquémica y enfermedad cerebrovascular: valorar el riesgo vascular de la paciente.</tspan></text><text x="58.0" y="1096.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ICHD-3, Cephalalgia 2018;38:1-211; Ailani J et al., American Headache Society Consensus Statement, Headache 2021;61:1021-1039; Harrison Principios de Medicina</tspan><tspan x="58.0" dy="15">Interna, 21.ª ed. (2022)</tspan></text></svg>