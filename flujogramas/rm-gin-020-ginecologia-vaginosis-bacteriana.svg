<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1205" viewBox="0 0 1000 1205" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Flujo fino, pH 6, olor a pescado con KOH y células clave: vaginosis bacteriana"><title>Flujo fino, pH 6, olor a pescado con KOH y células clave: vaginosis bacteriana</title><rect x="0.75" y="0.75" width="998.5" height="1203.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ginecología · vaginosis bacteriana</tspan></text><rect x="405.1" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="484.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="484.8" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Vaginosis bacteriana</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Disminuyen los lactobacilos y aumentan Gardnerella y anaerobios.</tspan><tspan x="58.0" dy="17">Es la causa más frecuente de flujo en mujeres en edad fértil.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 30 años, esterilizada</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Flujo vaginal homogéneo y fino.</tspan><tspan x="640.0" dy="16">pH 6, prueba de KOH con olor a pescado y células</tspan><tspan x="640.0" dy="16">clave.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LOS CUATRO CRITERIOS DE AMSEL EN LA PACIENTE</tspan></text><rect x="40.0" y="285.0" width="920.0" height="32.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="306.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="180"><tspan x="54.0" dy="0">EXAMEN</tspan></text><text x="250.0" y="306.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="130"><tspan x="250.0" dy="0">VALOR DEL CASO</tspan></text><text x="400.0" y="306.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="130"><tspan x="400.0" dy="0">NORMAL</tspan></text><text x="550.0" y="306.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="400"><tspan x="550.0" dy="0">QUÉ SIGNIFICA</tspan></text><rect x="40.0" y="323.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="347.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Aspecto del flujo</tspan></text><text x="250.0" y="348.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Fino, homogéneo  ↑</tspan></text><text x="400.0" y="347.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Blanco, no adherente</tspan></text><text x="550.0" y="347.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Criterio 1: flujo homogéneo y adherido a la pared.</tspan></text><rect x="40.0" y="367.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="391.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">pH vaginal</tspan></text><text x="250.0" y="392.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">6  ↑</tspan></text><text x="400.0" y="391.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">3,8-4,5</tspan></text><text x="550.0" y="391.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Criterio 2: pH mayor de 4,5 por pérdida de lactobacilos.</tspan></text><rect x="40.0" y="411.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="435.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Prueba de KOH</tspan></text><text x="250.0" y="436.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Olor a pescado  ↑</tspan></text><text x="400.0" y="435.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Sin olor</tspan></text><text x="550.0" y="435.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Criterio 3: las aminas volátiles se liberan con el álcali.</tspan></text><rect x="40.0" y="455.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="479.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Células clave</tspan></text><text x="250.0" y="480.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Presentes  ↑</tspan></text><text x="400.0" y="479.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Ausentes</tspan></text><text x="550.0" y="479.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Criterio 4: células epiteliales cubiertas de bacilos en el fresco.</tspan></text><rect x="40.0" y="499.0" width="920.0" height="40.0" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="523.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Lactobacilos</tspan></text><text x="250.0" y="524.0" font-size="13" font-weight="800" font-style="normal" fill="#2563eb" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Disminuidos  ↓</tspan></text><text x="400.0" y="523.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Predominan</tspan></text><text x="550.0" y="523.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Menos ácido láctico y sobrecrecimiento de anaerobios.</tspan></text><rect x="40.0" y="557.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="583.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">4 de 4 criterios de Amsel = vaginosis bacteriana</tspan></text><text x="60.0" y="602.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Bastan 3; se trata con metronidazol 7 días, sin tratar a la pareja.</tspan></text><text x="40.0" y="663.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PUNTAJE DE NUGENT EN LA TINCIÓN DE GRAM (0-10)</tspan></text><rect x="40.0" y="675.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="694.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="119"><tspan x="50.0" dy="0">Puntaje</tspan></text><text x="185.0" y="694.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="376"><tspan x="185.0" dy="0">Interpretación</tspan></text><text x="577.5" y="694.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="376"><tspan x="577.5" dy="0">Conducta</tspan></text><rect x="40.0" y="704.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="723.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="119"><tspan x="50.0" dy="0">0-3</tspan></text><text x="185.0" y="723.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="376"><tspan x="185.0" dy="0">Flora normal: predominan los lactobacilos</tspan></text><text x="577.5" y="723.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="376"><tspan x="577.5" dy="0">Sin tratamiento</tspan></text><rect x="40.0" y="733.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="752.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="119"><tspan x="50.0" dy="0">4-6</tspan></text><text x="185.0" y="752.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="376"><tspan x="185.0" dy="0">Flora intermedia</tspan></text><text x="577.5" y="752.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="376"><tspan x="577.5" dy="0">Correlacionar con los criterios de Amsel y repetir si persisten</tspan><tspan x="577.5" dy="15">síntomas</tspan></text><rect x="40.0" y="777.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="796.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="119"><tspan x="50.0" dy="0">7-10</tspan></text><text x="185.0" y="796.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="376"><tspan x="185.0" dy="0">Vaginosis bacteriana</tspan></text><text x="577.5" y="796.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="376"><tspan x="577.5" dy="0">Si hay síntomas (también en la gestante): metronidazol 500 mg c/12</tspan><tspan x="577.5" dy="15">h por 7 días</tspan></text><rect x="75.6" y="788.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="121.0" y="803.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="121.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="837.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Suma tres morfotipos: lactobacilos, Gardnerella/Bacteroides y Mobiluncus. Es la prueba de referencia; Amsel es la clínica.</tspan></text><text x="40.0" y="884.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="894.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="925.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="925.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Candidiasis vaginal</tspan></text><text x="435.0" y="925.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Lues</tspan></text><text x="585.0" y="925.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Infección por PVH</tspan></text><text x="735.0" y="925.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Tricomoniasis</tspan></text><rect x="813.0" y="897.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="916.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Vaginosis</tspan><tspan x="885.0" dy="17">bacteriana</tspan></text><rect x="40.0" y="948.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="948.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="985.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="977.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: flujo grumoso con</tspan><tspan x="285.0" dy="16">prurito y pH normal</tspan></text><text x="435.0" y="977.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: chancro o</tspan><tspan x="435.0" dy="16">condilomas planos</tspan></text><text x="585.0" y="977.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: lesiones</tspan><tspan x="585.0" dy="16">verrugosas</tspan></text><text x="735.0" y="969.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: flujo espumoso</tspan><tspan x="735.0" dy="16">verdoso, cérvix en</tspan><tspan x="735.0" dy="16">fresa</tspan></text><text x="885.0" y="977.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: cumple los cuatro</tspan><tspan x="885.0" dy="16">criterios de Amsel</tspan></text><rect x="40.0" y="894.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1038.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1066.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1088.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Criterios de Amsel (3 de 4): flujo homogéneo, pH &gt; 4,5, prueba de aminas positiva y células clave; el Gram con puntaje de Nugent es la referencia.</tspan><tspan x="58.0" dy="18">• Tratamiento (CDC 2021): metronidazol 500 mg c/12 h por 7 días; alternativas: gel de metronidazol o crema de clindamicina.</tspan><tspan x="58.0" dy="18">• Se asocia con parto pretérmino, corioamnionitis, endometritis y mayor riesgo de ITS; en la gestante sintomática se trata.</tspan><tspan x="58.0" dy="18">• No se trata a la pareja varón; la candidiasis (grumoso, pH normal) y la tricomoniasis (espumoso, cérvix en fresa) son los diferenciales.</tspan></text><text x="58.0" y="1164.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, STI Treatment Guidelines (MMWR 2021;70[4]); NTS 240-MINSA/DGIESP-2026; Williams Obstetricia 26.ª ed. (2022)</tspan></text></svg>