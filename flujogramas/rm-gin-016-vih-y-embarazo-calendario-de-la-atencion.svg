<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="988" viewBox="0 0 1000 988" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la gestante con VIH el TARV triple se inicia lo antes posible tras el diagnóstico"><title>En la gestante con VIH el TARV triple se inicia lo antes posible tras el diagnóstico</title><rect x="0.75" y="0.75" width="998.5" height="986.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">VIH y embarazo · calendario de la atención</tspan></text><rect x="451.6" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="531.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="531.3" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">TARV en la gestación</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cuanto antes se suprime la carga viral, menor es el riesgo para el hijo.</tspan><tspan x="58.0" dy="17">Sin tratamiento 15-45 %; con CV indetectable antes del parto, menos de 1 %.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante con VIH nuevo</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Diagnóstico durante el control prenatal.</tspan><tspan x="640.0" dy="16">¿Cuándo se debe iniciar la terapia antirretroviral triple?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SE HACE EN CADA SEMANA DE LA GESTACIÓN</tspan></text><line x1="290.0" y1="291.0" x2="290.0" y2="485.0" stroke="#e2e8f0" stroke-width="1"/><text x="290.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="290.0" dy="0">0</tspan></text><line x1="355.0" y1="291.0" x2="355.0" y2="485.0" stroke="#e2e8f0" stroke-width="1"/><text x="355.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="355.0" dy="0">4</tspan></text><line x1="420.0" y1="291.0" x2="420.0" y2="485.0" stroke="#e2e8f0" stroke-width="1"/><text x="420.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="420.0" dy="0">8</tspan></text><line x1="485.0" y1="291.0" x2="485.0" y2="485.0" stroke="#e2e8f0" stroke-width="1"/><text x="485.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="485.0" dy="0">12</tspan></text><line x1="550.0" y1="291.0" x2="550.0" y2="485.0" stroke="#e2e8f0" stroke-width="1"/><text x="550.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="550.0" dy="0">16</tspan></text><line x1="615.0" y1="291.0" x2="615.0" y2="485.0" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="615.0" dy="0">20</tspan></text><line x1="680.0" y1="291.0" x2="680.0" y2="485.0" stroke="#e2e8f0" stroke-width="1"/><text x="680.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="680.0" dy="0">24</tspan></text><line x1="745.0" y1="291.0" x2="745.0" y2="485.0" stroke="#e2e8f0" stroke-width="1"/><text x="745.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="745.0" dy="0">28</tspan></text><line x1="810.0" y1="291.0" x2="810.0" y2="485.0" stroke="#e2e8f0" stroke-width="1"/><text x="810.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="810.0" dy="0">32</tspan></text><line x1="875.0" y1="291.0" x2="875.0" y2="485.0" stroke="#e2e8f0" stroke-width="1"/><text x="875.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="875.0" dy="0">36</tspan></text><line x1="940.0" y1="291.0" x2="940.0" y2="485.0" stroke="#e2e8f0" stroke-width="1"/><text x="940.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="940.0" dy="0">40</tspan></text><text x="940.0" y="273.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="end" data-max="60"><tspan x="940.0" dy="0">semanas</tspan></text><rect x="40.0" y="295.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="311.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Diagnóstico y tamizaje</tspan></text><text x="48.0" y="326.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Primer control prenatal</tspan></text><rect x="290.0" y="303.0" width="195.0" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="349.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">TARV triple (este caso)</tspan></text><text x="48.0" y="364.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Desde el diagnóstico, sin esperar semana</tspan></text><rect x="306.2" y="341.0" width="633.8" height="22.0" rx="6" fill="#ea580c" stroke="none" stroke-width="1.5"/><rect x="40.0" y="371.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="387.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Repetir el tamizaje</tspan></text><text x="48.0" y="402.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Tercer trimestre</tspan></text><rect x="745.0" y="379.0" width="130.0" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="425.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Carga viral de control</tspan></text><text x="48.0" y="440.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Define la vía del parto</tspan></text><rect x="842.5" y="417.0" width="32.5" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><rect x="40.0" y="447.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="463.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Cesárea si CV &gt; 1000</tspan></text><text x="48.0" y="478.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Electiva a las 38 semanas</tspan></text><rect x="907.5" y="455.0" width="16.2" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><line x1="306.2" y1="293.0" x2="306.2" y2="491.0" stroke="#b91c1c" stroke-width="2.6"/><rect x="264.6" y="491.0" width="83.4" height="22.0" rx="11" fill="#b91c1c" stroke="none" stroke-width="1.5"/><text x="306.2" y="506.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="306.2" dy="0">Diagnóstico</tspan></text><rect x="40.0" y="537.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="563.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Iniciar el TARV lo antes posible</tspan></text><text x="60.0" y="582.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Las normas con semana 12 o 14 quedaron superadas: no se espera una edad gestacional.</tspan></text><text x="40.0" y="649.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="659.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="690.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="690.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Semana 14</tspan></text><text x="435.0" y="690.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Semana 11</tspan></text><text x="585.0" y="690.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Semana 12</tspan></text><text x="735.0" y="690.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Semana 13</tspan></text><rect x="813.0" y="662.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="681.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Lo antes posible</tspan><tspan x="885.0" dy="17">tras el diagnóstico</tspan></text><rect x="40.0" y="713.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="713.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="750.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Semana de inicio?</tspan></text><text x="285.0" y="742.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: plazo de una</tspan><tspan x="285.0" dy="16">norma antigua</tspan></text><text x="435.0" y="742.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no corresponde a</tspan><tspan x="435.0" dy="16">ninguna norma</tspan></text><text x="585.0" y="734.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: plazo de la norma</tspan><tspan x="585.0" dy="16">de 2019; hoy se inicia</tspan><tspan x="585.0" dy="16">de inmediato</tspan></text><text x="735.0" y="742.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no corresponde a</tspan><tspan x="735.0" dy="16">ninguna norma</tspan></text><text x="885.0" y="734.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: inicio inmediato, sin</tspan><tspan x="885.0" dy="16">esperar edad</tspan><tspan x="885.0" dy="16">gestacional</tspan></text><rect x="40.0" y="659.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="803.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="831.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="853.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Guías vigentes (DHHS 2024, OMS 2021): empezar lo antes posible tras el diagnóstico, sin esperar edad gestacional; preferido dolutegravir con 2</tspan><tspan x="58.0" dy="18">   inhibidores nucleósidos.</tspan><tspan x="58.0" dy="18">• Las normas antiguas fijaban un plazo (semana 14, luego 12, NTS 159-2019); esperar retrasa la supresión viral.</tspan><tspan x="58.0" dy="18">• Control: carga viral 2-4 semanas tras iniciar, luego mensual hasta ser indetectable, después cada 3 meses y a las 34-36 semanas.</tspan><tspan x="58.0" dy="18">• Alerta: si ya recibía TARV antes del embarazo se continúa el mismo esquema con supresión viral; el hijo recibe profilaxis y fórmula.</tspan></text><text x="58.0" y="947.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: NTS 159-MINSA/2019/DGIESP (RM 1138-2019/MINSA); NTS 169-MINSA/2020/DGIESP (RM 1024-2020/MINSA); DHHS, Perinatal HIV Guidelines (2024).</tspan></text></svg>