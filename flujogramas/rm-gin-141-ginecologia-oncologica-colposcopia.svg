tart" data-max="184"><tspan x="50.0" dy="0">Metaplasia escamosa</tspan></text><text x="250.0" y="906.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="704"><tspan x="250.0" dy="0">Variante normal de la zona de transformación</tspan></text><rect x="40.0" y="916.9" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="935.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Células endometriales</tspan></text><text x="250.0" y="935.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="704"><tspan x="250.0" dy="0">Estudiar el endometrio</tspan></text><text x="40.0" y="985.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="995.9" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1035.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="998.9" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="1026.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Lesión intraepitelial</tspan><tspan x="285.0" dy="17">de alto grado</tspan></text><text x="435.0" y="1035.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Cervicitis aguda</tspan></text><text x="585.0" y="1026.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Metaplasia</tspan><tspan x="585.0" dy="17">escamosa</tspan></text><text x="735.0" y="1026.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Inflamación vaginal</tspan><tspan x="735.0" dy="17">severa</tspan></text><text x="885.0" y="1018.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Presencia de</tspan><tspan x="885.0" dy="17">células</tspan><tspan x="885.0" dy="17">endometriales</tspan></text><rect x="40.0" y="1066.9" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1066.9" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1095.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Indica colposcopía?</tspan></text><text x="285.0" y="1087.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: citología de alto</tspan><tspan x="285.0" dy="16">grado</tspan></text><text x="435.0" y="1087.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: se trata primero y</tspan><tspan x="435.0" dy="16">se repite la citología</tspan></text><text x="585.0" y="1087.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es un proceso</tspan><tspan x="585.0" dy="16">fisiológico</tspan></text><text x="735.0" y="1087.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: se trata primero y</tspan><tspan x="735.0" dy="16">se repite la citología</tspan></text><text x="885.0" y="1087.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: orientan a estudiar</tspan><tspan x="885.0" dy="16">el endometrio</tspan></text><rect x="40.0" y="995.9" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1140.9" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1168.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1190.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Se indica ante HSIL, carcinoma invasor, ASC-H, AGC, lesiones de bajo grado persistentes, citología insatisfactoria, VPH de alto riesgo persistente o</tspan><tspan x="58.0" dy="18">   genotipos 16 y 18, cuello sospechoso o IVAA positivo.</tspan><tspan x="58.0" dy="18">• La cervicitis aguda y la inflamación vaginal se tratan primero y se repite la citología; la metaplasia escamosa es fisiológica.</tspan><tspan x="58.0" dy="18">• Las células endometriales benignas en una mujer posmenopáusica orientan a estudiar el endometrio, no el cuello.</tspan><tspan x="58.0" dy="18">• Con riesgo de CIN 3+ de 25 % o más se acepta el tratamiento excisional directo tras la colposcopía.</tspan></text><text x="58.0" y="1284.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ASCCP, guías de consenso basadas en riesgo (2019), actualización hasta 2023 (J Low Genit Tract Dis 2024); WHO guideline for screening and treatment of cervical</tspan><tspan x="58.0" dy="15">pre-cancer lesions (2021); Directiva 165-2025 (MINSA).</tspan></text></svg>