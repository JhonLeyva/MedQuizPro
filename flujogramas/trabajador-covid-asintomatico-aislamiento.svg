<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="861" viewBox="0 0 1000 861" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Trabajador asintomático con prueba positiva para COVID-19 y familiares enfermos: aislamiento y monitoreo"><title>Trabajador asintomático con prueba positiva para COVID-19 y familiares enfermos: aislamiento y monitoreo</title><rect x="0.75" y="0.75" width="998.5" height="860.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Salud ocupacional · COVID-19</tspan></text><rect x="378.4" y="32.0" width="143.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="450.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="127"><tspan x="450.1" dy="0">SALUD PÚBLICA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Aislamiento por COVID-19</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El asintomático con prueba positiva contagia: se aísla para cortar la transmisión.</tspan><tspan x="58.0" dy="17">La duración cambió con el tiempo: 14 días en 2020; hoy es más corta.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Trabajador de 34 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Tres familiares con COVID-19 desde hace 2 días.</tspan><tspan x="640.0" dy="16">Asintomático, prueba positiva.</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#94a3b8"/><line x1="500.0" y1="361.0" x2="500.0" y2="391.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="391.0" x2="733.5" y2="391.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="391.0" x2="266.5" y2="420.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,419.0 271.5,419.0 266.5,427.0" fill="#94a3b8"/><line x1="733.5" y1="391.0" x2="733.5" y2="420.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,419.0 738.5,419.0 733.5,427.0" fill="#94a3b8"/><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#0f766e"/><line x1="500.0" y1="361.0" x2="500.0" y2="391.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="391.0" x2="500.0" y2="391.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="391.0" x2="266.5" y2="420.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,419.0 271.5,419.0 266.5,427.0" fill="#0f766e"/><rect x="186.7" y="400.0" width="159.7" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="412.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">No: asintomático (este caso)</tspan></text><rect x="682.2" y="400.0" width="102.6" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="412.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Signos de alarma</tspan></text><polygon points="240.0,326.0 266.0,291.0 734.0,291.0 760.0,326.0 734.0,361.0 266.0,361.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="326.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="331.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="322.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Trabajador con prueba positiva: ¿síntomas o signos de</tspan><tspan x="519.0" dy="17">alarma?</tspan></text><rect x="40.0" y="427.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="455.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">AISLAMIENTO Y MONITOREO</tspan></text><text x="266.5" y="478.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">2020: 14 días; hoy más corto</tspan><tspan x="266.5" dy="17">Volver con mascarilla</tspan></text><rect x="507.0" y="427.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="463.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Evaluación médica</tspan></text><text x="733.5" y="486.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Hospitalizar si hay hipoxemia</tspan></text><text x="40.0" y="557.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="567.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="607.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="570.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="598.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Aislarlo por quince</tspan><tspan x="285.0" dy="17">días y monitorearlo</tspan></text><text x="435.0" y="598.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Pedirle una prueba</tspan><tspan x="435.0" dy="17">en la empresa</tspan></text><text x="585.0" y="590.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Que continúe</tspan><tspan x="585.0" dy="17">laborando porque</tspan><tspan x="585.0" dy="17">es asintomático</tspan></text><text x="735.0" y="590.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Que vuelva a venir</tspan><tspan x="735.0" dy="17">si presenta</tspan><tspan x="735.0" dy="17">síntomas</tspan></text><text x="885.0" y="598.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hospitalizarlo de</tspan><tspan x="885.0" dy="17">inmediato</tspan></text><rect x="40.0" y="638.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="638.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="667.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Indicación?</tspan></text><text x="285.0" y="667.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: aislar y vigilar</tspan></text><text x="435.0" y="667.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: ya está confirmado</tspan></text><text x="585.0" y="667.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: contagia</tspan></text><text x="735.0" y="659.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: contagia mientras</tspan><tspan x="735.0" dy="16">tanto</tspan></text><text x="885.0" y="667.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: asintomático</tspan></text><rect x="40.0" y="567.5" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="712.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="740.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="762.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• En la norma de 2020 (año de la pregunta) se aislaba 14 días con monitoreo de síntomas.</tspan><tspan x="58.0" dy="18">• Hoy (OMS 2023-2025): aislamiento de unos 5 días si es asintomático y mascarilla al volver; más si aparecen síntomas o es inmunodeprimido.</tspan><tspan x="58.0" dy="18">• Hospitalizar solo si hay signos de alarma (disnea, SatO₂ &lt; 94 %).</tspan></text><text x="58.0" y="820.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, manejo clínico de la COVID-19 (2025); MINSA Perú, RM 448-2020 (2020) y lineamientos posteriores.</tspan></text></svg>