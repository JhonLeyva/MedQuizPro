<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="906" viewBox="0 0 1000 906" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La asistencia técnica y los proyectos con otros actores se ubican en la promoción de comunidades saludables"><title>La asistencia técnica y los proyectos con otros actores se ubican en la promoción de comunidades saludables</title><rect x="0.75" y="0.75" width="998.5" height="904.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Gestión · MAIS-BFC y Plan de Salud Local</tspan></text><rect x="448.8" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="513.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="513.1" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">MAIS-BFC (2011)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Organiza el primer nivel alrededor de persona, familia y comunidad.</tspan><tspan x="58.0" dy="17">El Plan de Salud Local reúne las actividades en tres paquetes.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Plan de Salud Local del C. S. Ama Kella</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Requiere asistencia técnica, recursos y ejecución de</tspan><tspan x="640.0" dy="16">proyectos.</tspan><tspan x="640.0" dy="16">¿En qué paquete se ubica?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LOS TRES PAQUETES DEL PLAN DE SALUD LOCAL</tspan></text><rect x="40.0" y="285.0" width="293.3" height="200.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><rect x="40.0" y="285.0" width="293.3" height="8.0" rx="4" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="60.0" y="319.0" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="253"><tspan x="60.0" dy="0">Promoción de comunidades</tspan><tspan x="60.0" dy="19">saludables</tspan></text><rect x="56.0" y="359.0" width="261.3" height="26.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="68.0" y="376.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Actores</tspan></text><text x="305.3" y="376.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="end" data-max="133"><tspan x="305.3" dy="0">✓ Gobiernos locales</tspan></text><rect x="56.0" y="389.0" width="261.3" height="26.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="68.0" y="406.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Incluye</tspan></text><text x="305.3" y="406.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="end" data-max="133"><tspan x="305.3" dy="0">✓ Asistencia técnica</tspan></text><rect x="56.0" y="419.0" width="261.3" height="26.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="68.0" y="436.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Enfoque</tspan></text><text x="305.3" y="436.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="end" data-max="133"><tspan x="305.3" dy="0">✓ Territorio</tspan></text><text x="60.0" y="465.0" font-size="11.5" font-weight="600" font-style="normal" fill="#0f766e" text-anchor="start" data-max="253"><tspan x="60.0" dy="0">Este caso.</tspan></text><rect x="215.9" y="278.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="261.3" y="293.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="261.3" dy="0">◆ ESTE CASO</tspan></text><rect x="353.3" y="285.0" width="293.3" height="200.0" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="353.3" y="285.0" width="293.3" height="8.0" rx="4" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="373.3" y="319.0" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="253"><tspan x="373.3" dy="0">Producción de servicios</tspan></text><rect x="369.3" y="340.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="381.3" y="357.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="381.3" dy="0">Actores</tspan></text><text x="618.7" y="357.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="618.7" dy="0">Equipo de salud</tspan></text><rect x="369.3" y="370.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="381.3" y="387.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="381.3" dy="0">Incluye</tspan></text><text x="618.7" y="387.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="618.7" dy="0">Etapas de vida</tspan></text><rect x="369.3" y="400.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="381.3" y="417.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="381.3" dy="0">Enfoque</tspan></text><text x="618.7" y="417.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="618.7" dy="0">Persona y familia</tspan></text><text x="373.3" y="446.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="253"><tspan x="373.3" dy="0">Prestaciones directas.</tspan></text><rect x="666.7" y="285.0" width="293.3" height="200.0" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="666.7" y="285.0" width="293.3" height="8.0" rx="4" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="686.7" y="319.0" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="253"><tspan x="686.7" dy="0">Desarrollo institucional</tspan></text><rect x="682.7" y="340.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="694.7" y="357.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="694.7" dy="0">Actores</tspan></text><text x="932.0" y="357.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="932.0" dy="0">Gestión interna</tspan></text><rect x="682.7" y="370.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="694.7" y="387.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="694.7" dy="0">Incluye</tspan></text><text x="932.0" y="387.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="932.0" dy="0">Capacitación y calidad</tspan></text><rect x="682.7" y="400.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="694.7" y="417.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="694.7" dy="0">Enfoque</tspan></text><text x="932.0" y="417.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="932.0" dy="0">Fortalecimiento interno</tspan></text><text x="686.7" y="446.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="253"><tspan x="686.7" dy="0">Hacia dentro del servicio.</tspan></text><text x="40.0" y="507.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="400"><tspan x="40.0" dy="0">✓ = dato que coincide con el caso</tspan></text><text x="40.0" y="553.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="563.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="602.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="566.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="585.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Promoción de</tspan><tspan x="285.0" dy="17">comunidades</tspan><tspan x="285.0" dy="17">saludables</tspan></text><text x="435.0" y="594.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Producción de</tspan><tspan x="435.0" dy="17">servicios</tspan></text><text x="585.0" y="594.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Metas de desarrollo</tspan><tspan x="585.0" dy="17">sanitario local</tspan></text><text x="735.0" y="594.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Desarrollo</tspan><tspan x="735.0" dy="17">institucional</tspan></text><text x="885.0" y="594.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Apoyo técnico de</tspan><tspan x="885.0" dy="17">los servicios</tspan></text><rect x="40.0" y="634.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="634.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="663.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Paquete de la</tspan><tspan x="54.0" dy="16">asistencia técnica?</tspan></text><text x="285.0" y="663.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: acción con actores</tspan><tspan x="285.0" dy="16">del territorio</tspan></text><text x="435.0" y="663.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es atención directa</tspan><tspan x="435.0" dy="16">individual y familiar</tspan></text><text x="585.0" y="663.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no es un paquete</tspan><tspan x="585.0" dy="16">del plan</tspan></text><text x="735.0" y="655.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es el</tspan><tspan x="735.0" dy="16">fortalecimiento interno</tspan><tspan x="735.0" dy="16">del establecimiento</tspan></text><text x="885.0" y="663.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no es un paquete</tspan><tspan x="885.0" dy="16">del plan</tspan></text><rect x="40.0" y="563.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="724.0" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="752.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="774.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Paquetes del plan: producción de servicios, promoción de comunidades saludables y desarrollo institucional (MAIS-BFC, RM 464-2011).</tspan><tspan x="58.0" dy="18">• La asistencia técnica y los proyectos con gobiernos locales, agentes comunitarios y escuelas son promoción de comunidades saludables.</tspan><tspan x="58.0" dy="18">• Producción de servicios = atención individual y familiar por etapas de vida. Desarrollo institucional = gestión, capacitación y calidad internas.</tspan><tspan x="58.0" dy="18">• Alerta: «metas de desarrollo sanitario local» y «apoyo técnico de los servicios» no son paquetes del plan. Clave del libro; el enunciado es ambiguo.</tspan></text><text x="58.0" y="850.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA, Modelo de Atención Integral de Salud basado en Familia y Comunidad (MAIS-BFC), RM 464-2011/MINSA; Piédrola Gil, Medicina Preventiva y Salud Pública,</tspan><tspan x="58.0" dy="15">12.ª ed. (2015).</tspan></text></svg>