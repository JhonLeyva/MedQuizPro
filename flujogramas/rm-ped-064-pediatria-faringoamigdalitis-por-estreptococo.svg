<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1008" viewBox="0 0 1000 1008" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Escolar con fiebre, exudado amigdalar y vómitos: faringoamigdalitis estreptocócica; se indica antibiótico"><title>Escolar con fiebre, exudado amigdalar y vómitos: faringoamigdalitis estreptocócica; se indica antibiótico</title><rect x="0.75" y="0.75" width="998.5" height="1006.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · faringoamigdalitis por estreptococo</tspan></text><rect x="474.8" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="523.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="523.8" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Faringoamigdalitis por S. pyogenes</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Inicio súbito, fiebre, dolor de garganta o abdominal con vómitos y exudado en niños de 5 a</tspan><tspan x="58.0" dy="17">15 años.</tspan><tspan x="58.0" dy="17">El antibiótico previene la fiebre reumática.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Escolar de 6 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Fiebre, dolor abdominal y vómitos de dos días.</tspan><tspan x="640.0" dy="16">Faringe congestiva y amígdalas hipertróficas con</tspan><tspan x="640.0" dy="16">exudado amarillento.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PUNTAJE DE CENTOR MODIFICADO (MCISAAC): QUÉ CUMPLE ESTE ESCOLAR</tspan></text><rect x="40.0" y="285.0" width="540.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="56.0" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="start" data-max="430"><tspan x="56.0" dy="0">CRITERIO</tspan></text><text x="562.0" y="307.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">PUNTOS</tspan></text><rect x="40.0" y="319.0" width="540.0" height="34.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="326.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="341.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="340.5" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="420"><tspan x="86.0" dy="0">Fiebre mayor de 38 °C</tspan></text><text x="562.0" y="341.0" font-size="13" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">1</tspan></text><rect x="40.0" y="353.0" width="540.0" height="34.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="360.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="375.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="374.5" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="420"><tspan x="86.0" dy="0">Exudado o hipertrofia amigdalar</tspan></text><text x="562.0" y="375.0" font-size="13" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">1</tspan></text><rect x="40.0" y="387.0" width="540.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="394.0" width="20.0" height="20.0" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="86.0" y="408.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="420"><tspan x="86.0" dy="0">Adenopatía cervical anterior dolorosa</tspan></text><text x="562.0" y="409.0" font-size="13" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">1</tspan></text><rect x="40.0" y="421.0" width="540.0" height="34.0" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="428.0" width="20.0" height="20.0" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="86.0" y="442.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="420"><tspan x="86.0" dy="0">Ausencia de tos</tspan></text><text x="562.0" y="443.0" font-size="13" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">1</tspan></text><rect x="40.0" y="455.0" width="540.0" height="34.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="462.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="477.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="476.5" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="420"><tspan x="86.0" dy="0">Edad de 3 a 14 años</tspan></text><text x="562.0" y="477.0" font-size="13" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">1</tspan></text><rect x="40.0" y="489.0" width="540.0" height="40.0" rx="0" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="56.0" y="514.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="430"><tspan x="56.0" dy="0">Puntos del caso (mínimo)</tspan></text><text x="562.0" y="515.0" font-size="16" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">3</tspan></text><rect x="40.0" y="285.0" width="540.0" height="244.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="664.0" cy="335.0" r="46" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/><text x="664.0" y="335.0" font-size="26" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="0"><tspan x="664.0" dy="0">3</tspan></text><text x="664.0" y="355.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="664.0" dy="0">de 5</tspan></text><text x="724.0" y="321.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="230"><tspan x="724.0" dy="0">INTERPRETACIÓN</tspan></text><text x="724.0" y="341.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="230"><tspan x="724.0" dy="0">3 o más: confirmar y tratar si es</tspan><tspan x="724.0" dy="17">positivo</tspan></text><rect x="634.0" y="397.0" width="326.0" height="52.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="634.0" y="397.0" width="10.0" height="52.0" rx="4" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="656.0" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#10b981" text-anchor="start" data-max="100"><tspan x="656.0" dy="0">0-1</tspan></text><text x="760.0" y="419.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Riesgo bajo</tspan></text><text x="760.0" y="437.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">No estudiar ni tratar.</tspan></text><rect x="634.0" y="457.0" width="326.0" height="64.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><rect x="634.0" y="457.0" width="10.0" height="64.0" rx="4" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="656.0" y="479.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="100"><tspan x="656.0" dy="0">2-3</tspan></text><text x="760.0" y="479.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Riesgo intermedio</tspan></text><text x="760.0" y="497.0" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Test rápido o cultivo; antibiótico si es</tspan><tspan x="760.0" dy="15">positivo.</tspan></text><polygon points="614.0,480.0 614.0,498.0 630.0,489.0" fill="#f59e0b"/><rect x="852.6" y="446.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="898.0" y="461.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="898.0" dy="0">◆ ESTE CASO</tspan></text><rect x="634.0" y="529.0" width="326.0" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="634.0" y="529.0" width="10.0" height="64.0" rx="4" fill="#f97316" stroke="none" stroke-width="1.5"/><text x="656.0" y="551.0" font-size="12" font-weight="800" font-style="normal" fill="#f97316" text-anchor="start" data-max="100"><tspan x="656.0" dy="0">4-5</tspan></text><text x="760.0" y="551.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Riesgo alto</tspan></text><text x="760.0" y="569.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Confirmar con test; penicilina o</tspan><tspan x="760.0" dy="15">amoxicilina si es positivo.</tspan></text><text x="40.0" y="633.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="643.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="674.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="674.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Antiespasmódicos</tspan></text><text x="435.0" y="674.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Antiinflamatorios</tspan></text><rect x="513.0" y="646.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="674.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Antibioticoterapia</tspan></text><text x="735.0" y="665.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hidratación</tspan><tspan x="735.0" dy="17">parenteral</tspan></text><text x="885.0" y="674.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Antieméticos</tspan></text><rect x="40.0" y="697.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="697.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="734.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tratamiento indicado?</tspan></text><text x="285.0" y="718.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: solo alivia el</tspan><tspan x="285.0" dy="16">síntoma, no trata la</tspan><tspan x="285.0" dy="16">causa</tspan></text><text x="435.0" y="718.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: solo alivia el</tspan><tspan x="435.0" dy="16">síntoma, no trata la</tspan><tspan x="435.0" dy="16">causa</tspan></text><text x="585.0" y="718.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: erradica el germen</tspan><tspan x="585.0" dy="16">y previene la fiebre</tspan><tspan x="585.0" dy="16">reumática</tspan></text><text x="735.0" y="718.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es una medida</tspan><tspan x="735.0" dy="16">sintomática sin efecto</tspan><tspan x="735.0" dy="16">sobre la causa</tspan></text><text x="885.0" y="718.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es una medida</tspan><tspan x="885.0" dy="16">sintomática sin efecto</tspan><tspan x="885.0" dy="16">sobre la causa</tspan></text><rect x="40.0" y="643.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="787.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="815.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="837.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Puntaje de Centor modificado por McIsaac: fiebre mayor de 38 °C, exudado o hipertrofia amigdalar, adenopatía cervical anterior dolorosa, ausencia de</tspan><tspan x="58.0" dy="18">   tos y edad de 3 a 14 años (1 punto cada uno).</tspan><tspan x="58.0" dy="18">• Con 3 puntos o más se confirma con test rápido o cultivo y se trata si es positivo. Con 4 o más la probabilidad es cercana a 50 %.</tspan><tspan x="58.0" dy="18">• Tratamiento: penicilina benzatínica IM única (600 000 UI si pesa menos de 27 kg; 1 200 000 UI si pesa más) o amoxicilina por 10 días, para erradicar el</tspan><tspan x="58.0" dy="18">   germen y prevenir fiebre reumática.</tspan><tspan x="58.0" dy="18">• Antiespasmódicos, antieméticos, antiinflamatorios e hidratación parenteral son sintomáticos. En menores de 3 años no se busca el estreptococo de</tspan><tspan x="58.0" dy="18">   rutina.</tspan></text><text x="58.0" y="967.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: IDSA, 2025 Clinical Practice Guideline Update on Group A Streptococcal Pharyngitis (Clin Infect Dis 2026;82:i97-104); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>