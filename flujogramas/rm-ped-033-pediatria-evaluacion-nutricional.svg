<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1063" viewBox="0 0 1000 1063" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La desnutrición crónica se identifica por el déficit de talla para la edad"><title>La desnutrición crónica se identifica por el déficit de talla para la edad</title><rect x="0.75" y="0.75" width="998.5" height="1061.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · evaluación nutricional</tspan></text><rect x="394.8" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="443.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="443.9" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Malnutrición crónica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Retraso del crecimiento lineal por carencia nutricional sostenida, infecciones frecuentes y</tspan><tspan x="58.0" dy="17">pobreza.</tspan><tspan x="58.0" dy="17">Cada indicador mide algo distinto.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de indicadores</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cómo se identifica especialmente la malnutrición</tspan><tspan x="640.0" dy="16">crónica?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TALLA PARA LA EDAD (PUNTUACIÓN Z) Y TIPO DE DESNUTRICIÓN</tspan></text><rect x="40.0" y="269.0" width="920.0" height="225.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="295.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Puntuación Z de talla para la edad (patrones OMS 2006)</tspan></text><text x="60.0" y="314.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Un Z menor de -2 define la desnutrición crónica; menor de -3 es grave.</tspan></text><rect x="70.0" y="378.0" width="143.3" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="141.7" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="133"><tspan x="141.7" dy="0">Crónica grave</tspan></text><rect x="213.3" y="378.0" width="143.3" height="40.0" rx="6" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/><text x="285.0" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#c2410c" text-anchor="middle" data-max="133"><tspan x="285.0" dy="0">Crónica</tspan></text><rect x="356.7" y="378.0" width="573.3" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="643.3" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="563"><tspan x="643.3" dy="0">Talla normal</tspan></text><line x1="70.0" y1="418.0" x2="70.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="70.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="70.0" dy="0">-4</tspan></text><line x1="213.3" y1="418.0" x2="213.3" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="213.3" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="213.3" dy="0">-3</tspan></text><line x1="356.7" y1="418.0" x2="356.7" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="356.7" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="356.7" dy="0">-2</tspan></text><line x1="500.0" y1="418.0" x2="500.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="500.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="500.0" dy="0">-1</tspan></text><line x1="643.3" y1="418.0" x2="643.3" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="643.3" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="643.3" dy="0">0</tspan></text><line x1="786.7" y1="418.0" x2="786.7" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="786.7" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="786.7" dy="0">1</tspan></text><line x1="930.0" y1="418.0" x2="930.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">2</tspan></text><polygon points="276.0,364.0 294.0,364.0 285.0,376.0" fill="#ea580c"/><rect x="198.7" y="338.0" width="172.6" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="285.0" y="353.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="161"><tspan x="285.0" dy="0">◆ DESNUTRICIÓN CRÓNICA</tspan></text><rect x="60.0" y="452.0" width="880.0" height="30.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="472.0" font-size="11.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Peso para la talla = aguda · peso para la edad = global</tspan></text><text x="40.0" y="528.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">INDICADORES ANTROPOMÉTRICOS Y TIPO DE DESNUTRICIÓN</tspan></text><rect x="40.0" y="540.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="559.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="324"><tspan x="50.0" dy="0">Indicador</tspan></text><text x="390.0" y="559.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="274"><tspan x="390.0" dy="0">Tipo de desnutrición</tspan></text><text x="680.0" y="559.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="274"><tspan x="680.0" dy="0">Qué refleja</tspan></text><rect x="40.0" y="569.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="588.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="324"><tspan x="50.0" dy="0">Talla para la edad (Z menor de -2)</tspan></text><text x="390.0" y="588.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="274"><tspan x="390.0" dy="0">Crónica</tspan></text><text x="680.0" y="588.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="274"><tspan x="680.0" dy="0">Carencia sostenida durante meses o años</tspan></text><rect x="280.6" y="572.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="326.0" y="587.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="326.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="598.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="617.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="324"><tspan x="50.0" dy="0">Peso para la talla (o perímetro braquial)</tspan></text><text x="390.0" y="617.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="274"><tspan x="390.0" dy="0">Aguda</tspan></text><text x="680.0" y="617.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="274"><tspan x="680.0" dy="0">Pérdida reciente de peso</tspan></text><rect x="40.0" y="627.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="646.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="324"><tspan x="50.0" dy="0">Peso para la edad</tspan></text><text x="390.0" y="646.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="274"><tspan x="390.0" dy="0">Global</tspan></text><text x="680.0" y="646.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="274"><tspan x="680.0" dy="0">Mezcla ambos tipos; no distingue bajo de delgado</tspan></text><rect x="40.0" y="656.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="675.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="324"><tspan x="50.0" dy="0">Pliegue bicipital</tspan></text><text x="390.0" y="675.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="274"><tspan x="390.0" dy="0">No es indicador de tipo</tspan></text><text x="680.0" y="675.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="274"><tspan x="680.0" dy="0">Reserva de grasa</tspan></text><text x="40.0" y="725.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="735.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="766.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="738.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="757.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Déficit de talla para</tspan><tspan x="285.0" dy="17">la edad</tspan></text><text x="435.0" y="757.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Déficit de peso para</tspan><tspan x="435.0" dy="17">la talla</tspan></text><text x="585.0" y="757.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Déficit de peso para</tspan><tspan x="585.0" dy="17">la edad</tspan></text><text x="735.0" y="757.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Disminución del</tspan><tspan x="735.0" dy="17">pliegue bicipital</tspan></text><text x="885.0" y="757.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Peso por debajo del</tspan><tspan x="885.0" dy="17">percentil 25</tspan></text><rect x="40.0" y="789.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="789.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="810.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Indicador de</tspan><tspan x="54.0" dy="16">malnutrición crónica?</tspan></text><text x="285.0" y="810.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: Z de talla menor de</tspan><tspan x="285.0" dy="16">-2 DE</tspan></text><text x="435.0" y="810.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es la desnutrición</tspan><tspan x="435.0" dy="16">aguda</tspan></text><text x="585.0" y="810.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es la desnutrición</tspan><tspan x="585.0" dy="16">global</tspan></text><text x="735.0" y="810.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: refleja la reserva</tspan><tspan x="735.0" dy="16">de grasa</tspan></text><text x="885.0" y="810.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no es un punto de</tspan><tspan x="885.0" dy="16">corte de desnutrición</tspan></text><rect x="40.0" y="735.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="863.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="891.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="913.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Talla para la edad con Z menor de -2 DE (patrones OMS 2006) define desnutrición crónica o retraso de talla; menor de -3 es grave.</tspan><tspan x="58.0" dy="18">• Peso para la talla (o perímetro braquial) mide la desnutrición aguda; peso para la edad es la desnutrición global y mezcla ambos tipos.</tspan><tspan x="58.0" dy="18">• El pliegue bicipital refleja la reserva de grasa; el percentil 25 no es punto de corte de desnutrición.</tspan><tspan x="58.0" dy="18">• Los primeros 1000 días son decisivos: el retraso de talla causa menor desarrollo cognitivo y mayor riesgo cardiometabólico. En el Perú se previene con</tspan><tspan x="58.0" dy="18">   CRED, hierro, lactancia y alimentación complementaria.</tspan></text><text x="58.0" y="1007.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, Patrones de crecimiento infantil (2006); UNICEF/OMS/Banco Mundial, Estimaciones conjuntas de malnutrición infantil (2023); MINSA, NTS</tspan><tspan x="58.0" dy="15">137-MINSA/2017/DGIESP; Nelson 22.ª ed. (2024).</tspan></text></svg>