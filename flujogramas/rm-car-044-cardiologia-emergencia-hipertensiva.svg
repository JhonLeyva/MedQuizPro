<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1083" viewBox="0 0 1000 1083" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="PA 180/120 con cefalea y náuseas: emergencia hipertensiva; entre las opciones, nitroprusiato endovenoso"><title>PA 180/120 con cefalea y náuseas: emergencia hipertensiva; entre las opciones, nitroprusiato endovenoso</title><rect x="0.75" y="0.75" width="998.5" height="1081.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Cardiología · emergencia hipertensiva</tspan></text><rect x="424.9" y="32.0" width="117.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="483.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="101"><tspan x="483.6" dy="0">CARDIOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Emergencia hipertensiva</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Presión muy elevada con daño agudo de órgano blanco.</tspan><tspan x="58.0" dy="17">Se trata con fármaco intravenoso titulable en cuidados intensivos.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 55 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Cefalea y náuseas.</tspan><tspan x="640.0" dy="16">PA 180/120 mmHg y pulso de 100 por minuto.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CON O SIN DAÑO DE ÓRGANO BLANCO, QUÉ VÍA Y QUÉ FÁRMACO</tspan></text><text x="202.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="758"><tspan x="202.0" dy="0">→ SITUACIÓN</tspan></text><rect x="202.0" y="291.0" width="373.0" height="35.0" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="388.5" y="313.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="353"><tspan x="388.5" dy="0">Fármaco endovenoso titulable</tspan></text><rect x="587.0" y="291.0" width="373.0" height="35.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="773.5" y="313.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="353"><tspan x="773.5" dy="0">Fármaco oral</tspan></text><text x="40.0" y="305.0" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="146"><tspan x="40.0" dy="0">↓ DAÑO DE ÓRGANO</tspan><tspan x="40.0" dy="15">BLANCO</tspan></text><rect x="40.0" y="338.0" width="150.0" height="76.0" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="115.0" y="372.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Con daño agudo</tspan><tspan x="115.0" dy="17">(emergencia)</tspan></text><rect x="202.0" y="338.0" width="373.0" height="76.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="388.5" y="367.6" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Nitroprusiato (este caso)</tspan></text><text x="388.5" y="390.6" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Nicardipino, clevidipino y labetalol son de primera línea</tspan></text><rect x="343.1" y="403.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="388.5" y="418.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="388.5" dy="0">◆ ESTE CASO</tspan></text><rect x="587.0" y="338.0" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="588.0" y="339.0" width="6.0" height="74.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="773.5" y="367.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">No es adecuado</tspan></text><text x="773.5" y="390.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Propranolol, metildopa y minoxidil: efecto lento</tspan></text><rect x="40.0" y="426.0" width="150.0" height="76.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="115.0" y="451.5" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Sin daño agudo</tspan><tspan x="115.0" dy="17">(urgencia o</tspan><tspan x="115.0" dy="17">asintomática)</tspan></text><rect x="202.0" y="426.0" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="427.0" width="6.0" height="74.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="388.5" y="455.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">No suele requerirse</tspan></text><text x="388.5" y="478.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Salvo indicación específica</tspan></text><rect x="587.0" y="426.0" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="588.0" y="427.0" width="6.0" height="74.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="773.5" y="455.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Reducción gradual</tspan></text><text x="773.5" y="478.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">En 24 a 48 horas, con control ambulatorio</tspan></text><text x="40.0" y="546.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EMERGENCIA HIPERTENSIVA: METAS DE DESCENSO DE LA PRESIÓN</tspan></text><rect x="40.0" y="558.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="577.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Tiempo</tspan></text><text x="250.0" y="577.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Meta</tspan></text><text x="610.0" y="577.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Nota</tspan></text><rect x="40.0" y="587.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="606.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Primera hora</tspan></text><text x="250.0" y="606.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Bajar la PA media no más de 25 %</tspan></text><text x="610.0" y="606.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">El descenso brusco puede causar isquemia cerebral o</tspan><tspan x="610.0" dy="15">coronaria</tspan></text><rect x="140.6" y="598.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="186.0" y="613.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="186.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="631.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="650.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">2 a 6 horas</tspan></text><text x="250.0" y="650.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Llegar a 160/100 mmHg</tspan></text><text x="610.0" y="650.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Si el paciente está estable</tspan></text><rect x="40.0" y="660.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="679.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">24 a 48 horas</tspan></text><text x="250.0" y="679.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Presión normal</tspan></text><text x="610.0" y="679.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Transición a fármacos orales</tspan></text><text x="40.0" y="729.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="739.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="770.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="770.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Propranolol</tspan></text><text x="435.0" y="770.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hidralazina</tspan></text><rect x="513.0" y="742.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="761.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Nitroprusiato de</tspan><tspan x="585.0" dy="17">sodio</tspan></text><text x="735.0" y="770.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Metildopa</tspan></text><text x="885.0" y="770.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Minoxidil</tspan></text><rect x="40.0" y="793.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="793.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="830.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tratamiento indicado?</tspan></text><text x="285.0" y="822.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: oral y no titulable</tspan><tspan x="285.0" dy="16">en la emergencia</tspan></text><text x="435.0" y="814.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: efecto errático, se</tspan><tspan x="435.0" dy="16">prefiere en</tspan><tspan x="435.0" dy="16">preeclampsia</tspan></text><text x="585.0" y="822.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: única opción</tspan><tspan x="585.0" dy="16">parenteral y titulable</tspan></text><text x="735.0" y="822.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: oral y de efecto</tspan><tspan x="735.0" dy="16">lento</tspan></text><text x="885.0" y="822.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: oral y de efecto</tspan><tspan x="885.0" dy="16">impredecible</tspan></text><rect x="40.0" y="739.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="883.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="911.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="933.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Cefalea y náuseas sugieren daño neurológico, probable encefalopatía hipertensiva: no es una elevación asintomática.</tspan><tspan x="58.0" dy="18">• Meta: bajar la PA media no más de 25 % en la primera hora, luego a 160/100 en 2 a 6 horas y a la normalidad en 24 a 48 horas.</tspan><tspan x="58.0" dy="18">• Primera línea en las guías: nicardipino, clevidipino y labetalol. El nitroprusiato es alternativa de acción inmediata, con riesgo de cianuro y tiocianato y</tspan><tspan x="58.0" dy="18">   cautela con la presión intracraneal.</tspan><tspan x="58.0" dy="18">• Propranolol, metildopa y minoxidil son orales y lentos; la hidralazina es errática y se reserva para la preeclampsia.</tspan></text><text x="58.0" y="1027.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Jones DW et al., 2025 AHA/ACC Guideline for the prevention, detection, evaluation and management of high blood pressure in adults, Hypertension y Circulation 2025;</tspan><tspan x="58.0" dy="15">Harrison Principios de Medicina Interna, 21.ª ed. (2022)</tspan></text></svg>