<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="769" viewBox="0 0 1000 769" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Comparar un colegio que recibe más micronutrientes con otro colegio de control, sin asignación al azar, es un diseño cuasiexperimental"><title>Comparar un colegio que recibe más micronutrientes con otro colegio de control, sin asignación al azar, es un diseño cuasiexperimental</title><rect x="0.75" y="0.75" width="998.5" height="767.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Investigación · diseños de estudio</tspan></text><rect x="403.0" y="32.0" width="143.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="474.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="127"><tspan x="474.7" dy="0">SALUD PÚBLICA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Experimental frente a cuasiexperimental</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">En ambos el investigador aplica la intervención y compara con un control.</tspan><tspan x="58.0" dy="17">Experimental: asignación aleatoria de los participantes. Cuasiexperimental: grupos ya</tspan><tspan x="58.0" dy="17">formados (colegios), sin aleatorización.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Investigación planteada</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Más micronutrientes en los almuerzos de un colegio.</tspan><tspan x="640.0" dy="16">Otro colegio sirve de control.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿QUÉ DISEÑO ES?</tspan></text><rect x="40.0" y="269.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="160"><tspan x="54.0" dy="0">¿INTERVIENE?</tspan></text><text x="405.0" y="291.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="350"><tspan x="405.0" dy="0">Asignación al azar</tspan></text><text x="775.0" y="291.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="350"><tspan x="775.0" dy="0">Sin azar (grupos ya formados)</tspan></text><rect x="40.0" y="309.0" width="174.0" height="57.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="335.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="152"><tspan x="54.0" dy="0">Sí interviene</tspan></text><text x="54.0" y="352.0" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="152"><tspan x="54.0" dy="0">Aplica la exposición</tspan></text><rect x="223.0" y="309.0" width="364.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="235.0" y="341.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="346"><tspan x="235.0" dy="0">Experimental (ensayo)</tspan></text><rect x="593.0" y="309.0" width="364.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="605.0" y="334.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="346"><tspan x="605.0" dy="0">CUASIEXPERIMENTAL</tspan></text><text x="605.0" y="350.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="346"><tspan x="605.0" dy="0">Dos colegios</tspan></text><rect x="856.2" y="298.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="901.6" y="313.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="901.6" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="372.0" width="174.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="398.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="152"><tspan x="54.0" dy="0">No interviene</tspan></text><text x="54.0" y="415.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="152"><tspan x="54.0" dy="0">Solo observa</tspan></text><rect x="223.0" y="372.0" width="364.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="235.0" y="404.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="346"><tspan x="235.0" dy="0">—</tspan></text><rect x="593.0" y="372.0" width="364.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="605.0" y="397.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="346"><tspan x="605.0" dy="0">Observacional</tspan></text><text x="605.0" y="413.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="346"><tspan x="605.0" dy="0">Cohorte, casos y controles</tspan></text><text x="44.0" y="451.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Los colegios ya existen: no se asigna a los alumnos al azar.</tspan></text><text x="40.0" y="499.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="509.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="531.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="512.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="531.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Cuasi-experimental</tspan></text><text x="435.0" y="531.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Experimental</tspan></text><text x="585.0" y="531.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Histórico</tspan></text><text x="735.0" y="531.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ecológico</tspan></text><text x="885.0" y="531.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Transversal</tspan></text><rect x="40.0" y="546.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="546.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="575.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diseño?</tspan></text><text x="285.0" y="575.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: interviene sin azar</tspan></text><text x="435.0" y="567.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no hay asignación</tspan><tspan x="435.0" dy="16">aleatoria</tspan></text><text x="585.0" y="567.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no revisa el</tspan><tspan x="585.0" dy="16">pasado</tspan></text><text x="735.0" y="567.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no mide</tspan><tspan x="735.0" dy="16">poblaciones agregadas</tspan></text><text x="885.0" y="567.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: hay intervención y</tspan><tspan x="885.0" dy="16">seguimiento</tspan></text><rect x="40.0" y="509.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="620.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="648.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="670.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Al no aleatorizar, los grupos pueden diferir desde antes: medir la línea de base en ambos.</tspan><tspan x="58.0" dy="18">• Útil cuando no es posible o ético aleatorizar.</tspan><tspan x="58.0" dy="18">• Observacionales (cohorte, casos y controles, transversal, ecológico): el investigador no interviene.</tspan></text><text x="58.0" y="728.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Hernández-Sampieri, Metodología de la investigación 7.ª ed.; Gordis, Epidemiología 6.ª ed.</tspan></text></svg>