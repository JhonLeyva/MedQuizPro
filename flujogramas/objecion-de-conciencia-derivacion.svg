<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="845" viewBox="0 0 1000 845" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Médico que se opone por religión a colocar un DIU que la paciente pide: derivarla a otro colega"><title>Médico que se opone por religión a colocar un DIU que la paciente pide: derivarla a otro colega</title><rect x="0.75" y="0.75" width="998.5" height="844.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ética médica · objeción de conciencia</tspan></text><rect x="423.5" y="32.0" width="143.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="495.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="127"><tspan x="495.3" dy="0">SALUD PÚBLICA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Objeción de conciencia</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El médico puede negarse a un acto que choca con su conciencia.</tspan><tspan x="58.0" dy="17">Pero no puede impedir que la paciente reciba el servicio: debe derivarla a tiempo.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer que pide un DIU</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">El médico se opone por convicciones religiosas.</tspan></text><line x1="640.0" y1="189.0" x2="670.0" y2="189.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="209.0" x2="320.0" y2="239.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="239.0" x2="500.0" y2="239.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="239.0" x2="500.0" y2="268.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,267.0 505.0,267.0 500.0,275.0" fill="#94a3b8"/><line x1="500.0" y1="345.0" x2="500.0" y2="375.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="375.0" x2="733.5" y2="375.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="375.0" x2="266.5" y2="404.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,403.0 271.5,403.0 266.5,411.0" fill="#94a3b8"/><line x1="733.5" y1="375.0" x2="733.5" y2="404.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,403.0 738.5,403.0 733.5,411.0" fill="#94a3b8"/><line x1="320.0" y1="209.0" x2="320.0" y2="239.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="239.0" x2="500.0" y2="239.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="239.0" x2="500.0" y2="268.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,267.0 505.0,267.0 500.0,275.0" fill="#0f766e"/><line x1="500.0" y1="345.0" x2="500.0" y2="375.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="375.0" x2="500.0" y2="375.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="375.0" x2="266.5" y2="404.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,403.0 271.5,403.0 266.5,411.0" fill="#0f766e"/><rect x="225.0" y="384.0" width="83.0" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="396.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Sí (este caso)</tspan></text><rect x="719.4" y="384.0" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="396.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">No</tspan></text><polygon points="240.0,310.0 266.0,275.0 734.0,275.0 760.0,310.0 734.0,345.0 266.0,345.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="310.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="315.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="306.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Paciente pide un servicio legal: ¿el médico tiene objeción de</tspan><tspan x="519.0" dy="17">conciencia?</tspan></text><rect x="40.0" y="411.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="439.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">DERIVAR A OTRO COLEGA</tspan></text><text x="266.5" y="462.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Sin demora ni juicios</tspan><tspan x="266.5" dy="17">No en emergencias</tspan></text><rect x="507.0" y="411.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="447.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Atender</tspan></text><text x="733.5" y="470.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Consejería y colocación del DIU</tspan></text><text x="40.0" y="541.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="551.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="591.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="591.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Atender su pedido</tspan></text><text x="435.0" y="591.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Negarse a atenderla</tspan></text><text x="585.0" y="582.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Convencerla de</tspan><tspan x="585.0" dy="17">usar otro método</tspan></text><rect x="663.0" y="554.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="574.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Derivar a la</tspan><tspan x="735.0" dy="17">paciente a otro</tspan><tspan x="735.0" dy="17">colega</tspan></text><text x="885.0" y="582.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Pedirle autorización</tspan><tspan x="885.0" dy="17">al esposo</tspan></text><rect x="40.0" y="622.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="622.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="651.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Debería?</tspan></text><text x="285.0" y="643.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Si no objeta; aquí sí</tspan><tspan x="285.0" dy="16">objeta</tspan></text><text x="435.0" y="651.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: la deja sin atención</tspan></text><text x="585.0" y="643.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: vulnera su</tspan><tspan x="585.0" dy="16">autonomía</tspan></text><text x="735.0" y="643.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: respeta ambos</tspan><tspan x="735.0" dy="16">derechos</tspan></text><text x="885.0" y="651.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: decide ella</tspan></text><rect x="40.0" y="551.5" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="696.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="724.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="746.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Derivar sin demora a otro profesional y sin juzgar a la paciente; en emergencia no cabe la objeción.</tspan><tspan x="58.0" dy="18">• Convencerla de otro método o pedir permiso al esposo vulnera su autonomía (decide ella).</tspan><tspan x="58.0" dy="18">• La anticoncepción es un derecho (Ley 28243 y NTS de planificación familiar).</tspan></text><text x="58.0" y="804.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Código de Ética y Deontología del CMP (2023); MINSA Perú, NTS de planificación familiar (2017); Ley 29635 de libertad religiosa.</tspan></text></svg>