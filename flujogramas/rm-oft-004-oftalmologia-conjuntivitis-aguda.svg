<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1071" viewBox="0 0 1000 1071" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Ojo rojo que pasa al otro lado, lagrimeo y párpados pegados: conjuntivitis por adenovirus"><title>Ojo rojo que pasa al otro lado, lagrimeo y párpados pegados: conjuntivitis por adenovirus</title><rect x="0.75" y="0.75" width="998.5" height="1069.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Oftalmología · conjuntivitis aguda</tspan></text><rect x="400.2" y="32.0" width="162.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="481.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="146"><tspan x="481.4" dy="0">OFTALMOLOGÍA Y ORL RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Conjuntivitis viral</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Folículos, lagrimeo y secreción acuosa o escasa; comienza en un ojo y pasa al otro en</tspan><tspan x="58.0" dy="17">días.</tspan><tspan x="58.0" dy="17">Muy contagiosa; dura 1 a 3 semanas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 7 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Ojo izquierdo rojo hace 2 días; al día siguiente, el</tspan><tspan x="640.0" dy="16">derecho.</tspan><tspan x="640.0" dy="16">Lagrimeo que aumenta al levantarse, párpados</tspan><tspan x="640.0" dy="16">pegados, conjuntivas congestivas.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ VIRUS CAUSA CADA FORMA DE CONJUNTIVITIS</tspan></text><rect x="40.0" y="301.0" width="450.0" height="181.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><rect x="40.0" y="301.0" width="450.0" height="8.0" rx="4" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="60.0" y="335.0" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="410"><tspan x="60.0" dy="0">Adenovirus (este caso)</tspan></text><rect x="56.0" y="356.0" width="418.0" height="26.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="68.0" y="373.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Frecuencia</tspan></text><text x="462.0" y="373.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">✓ 65-90 % de las virales</tspan></text><rect x="56.0" y="386.0" width="418.0" height="26.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="68.0" y="403.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Cuadro</tspan></text><text x="462.0" y="403.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">✓ Acuosa, folículos, bilateral</tspan></text><rect x="56.0" y="416.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="68.0" y="433.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Duración</tspan></text><text x="462.0" y="433.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">1 a 3 semanas</tspan></text><text x="60.0" y="462.0" font-size="11.5" font-weight="600" font-style="normal" fill="#0f766e" text-anchor="start" data-max="410"><tspan x="60.0" dy="0">Muy contagiosa; manejo de soporte.</tspan></text><rect x="372.6" y="294.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="418.0" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="418.0" dy="0">◆ ESTE CASO</tspan></text><rect x="510.0" y="301.0" width="450.0" height="181.0" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="510.0" y="301.0" width="450.0" height="8.0" rx="4" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="530.0" y="335.0" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="410"><tspan x="530.0" dy="0">Enterovirus y coxsackie</tspan></text><rect x="526.0" y="356.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="373.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Cuadro</tspan></text><text x="932.0" y="373.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">Conjuntivitis hemorrágica aguda</tspan></text><rect x="526.0" y="386.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="403.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Hallazgo</tspan></text><text x="932.0" y="403.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">Hemorragias subconjuntivales</tspan></text><rect x="526.0" y="416.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="433.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Frecuencia</tspan></text><text x="932.0" y="433.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">Menos frecuente</tspan></text><text x="530.0" y="462.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="530.0" dy="0">No es la causa más común.</tspan></text><rect x="40.0" y="502.0" width="450.0" height="181.0" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="502.0" width="450.0" height="8.0" rx="4" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="60.0" y="536.0" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="410"><tspan x="60.0" dy="0">Herpes virus</tspan></text><rect x="56.0" y="557.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="68.0" y="574.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Lateralidad</tspan></text><text x="462.0" y="574.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">Unilateral</tspan></text><rect x="56.0" y="587.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="68.0" y="604.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Piel</tspan></text><text x="462.0" y="604.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">Vesículas palpebrales</tspan></text><rect x="56.0" y="617.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="68.0" y="634.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Córnea</tspan></text><text x="462.0" y="634.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="462.0" dy="0">Lesión dendrítica</tspan></text><text x="60.0" y="663.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="60.0" dy="0">Requiere antiviral y control corneal.</tspan></text><rect x="510.0" y="502.0" width="450.0" height="181.0" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="510.0" y="502.0" width="450.0" height="8.0" rx="4" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="530.0" y="536.0" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="410"><tspan x="530.0" dy="0">Qué no se indica</tspan></text><rect x="526.0" y="557.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="574.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Antibióticos tópicos</tspan></text><text x="932.0" y="574.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">No</tspan></text><rect x="526.0" y="587.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="604.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Corticoides</tspan></text><text x="932.0" y="604.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">Solo con infiltrados</tspan></text><rect x="526.0" y="617.0" width="418.0" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="538.0" y="634.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="538.0" dy="0">Contacto escolar</tspan></text><text x="932.0" y="634.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="290"><tspan x="932.0" dy="0">Evitarlo</tspan></text><text x="530.0" y="663.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="530.0" dy="0">Compresas frías y lágrimas artificiales.</tspan></text><text x="40.0" y="705.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="400"><tspan x="40.0" dy="0">✓ = dato que coincide con el caso</tspan></text><text x="40.0" y="751.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="761.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="783.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="783.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Coronavirus</tspan></text><text x="435.0" y="783.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Virus coxsackie</tspan></text><text x="585.0" y="783.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Herpes virus</tspan></text><rect x="663.0" y="764.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="783.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Adenovirus</tspan></text><text x="885.0" y="783.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Enterovirus</tspan></text><rect x="40.0" y="798.0" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="798.0" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="843.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Agente etiológico?</tspan></text><text x="285.0" y="835.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no causa</tspan><tspan x="285.0" dy="16">conjuntivitis típica</tspan></text><text x="435.0" y="819.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: causa la</tspan><tspan x="435.0" dy="16">conjuntivitis</tspan><tspan x="435.0" dy="16">hemorrágica, menos</tspan><tspan x="435.0" dy="16">frecuente</tspan></text><text x="585.0" y="827.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: unilateral con</tspan><tspan x="585.0" dy="16">vesículas y úlcera</tspan><tspan x="585.0" dy="16">dendrítica</tspan></text><text x="735.0" y="835.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: causa 65-90 % de</tspan><tspan x="735.0" dy="16">las virales</tspan></text><text x="885.0" y="827.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: causa la</tspan><tspan x="885.0" dy="16">conjuntivitis</tspan><tspan x="885.0" dy="16">hemorrágica aguda</tspan></text><rect x="40.0" y="761.0" width="920.0" height="119.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="904.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="932.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="954.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Los adenovirus causan 65-90 % de las conjuntivitis virales; se contagian por manos, toallas e instrumentos.</tspan><tspan x="58.0" dy="18">• Queratoconjuntivitis epidémica (serotipos 8, 19 y 37): infiltrados subepiteliales y baja de agudeza visual.</tspan><tspan x="58.0" dy="18">• Tratamiento de soporte: lágrimas artificiales, compresas frías, lavado de manos y evitar el contacto escolar.</tspan><tspan x="58.0" dy="18">• No se indican antibióticos tópicos; los corticoides solo con infiltrados que afectan la visión.</tspan></text><text x="58.0" y="1030.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAO, Preferred Practice Pattern: Conjunctivitis (Varu, Ophthalmology 2019 [PPP 2018]); Kanski Oftalmología Clínica 9.ª ed.</tspan></text></svg>