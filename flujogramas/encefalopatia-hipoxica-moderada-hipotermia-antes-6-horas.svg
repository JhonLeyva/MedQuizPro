e="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="845.0" dy="0">Neurodesarrollo</tspan></text><text x="845.0" y="576.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="845.0" dy="0">RM al final</tspan></text><text x="40.0" y="644.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">VENTANA · MARCADA LA CORRECTA</tspan></text><rect x="40.0" y="656.0" width="73.8" height="30.0" rx="15" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="76.9" y="675.5" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="76.9" dy="0">✓ 6 horas</tspan></text><rect x="121.8" y="656.0" width="77.9" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="160.7" y="675.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="160.7" dy="0">12 horas</tspan></text><rect x="207.6" y="656.0" width="77.9" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="246.6" y="675.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="246.6" dy="0">18 horas</tspan></text><rect x="293.5" y="656.0" width="77.9" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="332.5" y="675.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="332.5" dy="0">24 horas</tspan></text><rect x="40.0" y="710.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="738.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="760.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Durante el traslado: apagar la fuente de calor (enfriamiento pasivo) con control de temperatura.</tspan><tspan x="58.0" dy="18">• Criterios: ≥ 36 semanas, acidosis o Apgar bajo y encefalopatía moderada-grave.</tspan><tspan x="58.0" dy="18">• Evitar la hipertermia: empeora el daño.</tspan></text><text x="58.0" y="818.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAP – Hypothermia and neonatal encephalopathy (Pediatrics 2014) · ILCOR (2025)</tspan></text></svg>