<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1121" viewBox="0 0 1000 1121" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Hemotórax masivo con 1500 mL de drenaje inicial e inestabilidad: toracotomía de emergencia"><title>Hemotórax masivo con 1500 mL de drenaje inicial e inestabilidad: toracotomía de emergencia</title><rect x="0.75" y="0.75" width="998.5" height="1119.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Trauma torácico · hemotórax masivo</tspan></text><rect x="416.7" y="32.0" width="135.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="484.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="119"><tspan x="484.4" dy="0">TRAUMATOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hemotórax masivo</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Más de 1500 mL de sangre en la pleura o drenaje inicial de esa magnitud, con shock y</tspan><tspan x="58.0" dy="17">murmullo abolido.</tspan><tspan x="58.0" dy="17">El tubo torácico es diagnóstico y terapéutico.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 18 años con herida de bala</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Inestable, murmullo vesicular abolido en el hemitórax</tspan><tspan x="640.0" dy="16">derecho.</tspan><tspan x="640.0" dy="16">El drenaje torácico obtiene 1500 cc de sangre.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DRENAJE TORÁCICO INICIAL Y CONDUCTA</tspan></text><rect x="40.0" y="285.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="311.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Sangre drenada al colocar el tubo (mL)</tspan></text><text x="60.0" y="330.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Con 1500 mL o más y el paciente inestable se opera sin esperar.</tspan></text><rect x="70.0" y="394.0" width="215.0" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="177.5" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="205"><tspan x="177.5" dy="0">Menos de 500: observar</tspan></text><rect x="285.0" y="394.0" width="430.0" height="40.0" rx="6" fill="#fef9c3" stroke="#ffffff" stroke-width="2"/><text x="500.0" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#a16207" text-anchor="middle" data-max="420"><tspan x="500.0" dy="0">500 a 1500: vigilar el débito</tspan></text><rect x="715.0" y="394.0" width="215.0" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="822.5" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="205"><tspan x="822.5" dy="0">1500 o más: toracotomía</tspan></text><line x1="70.0" y1="434.0" x2="70.0" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="70.0" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="70.0" dy="0">0</tspan></text><line x1="285.0" y1="434.0" x2="285.0" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="285.0" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="285.0" dy="0">500</tspan></text><line x1="500.0" y1="434.0" x2="500.0" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="500.0" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="500.0" dy="0">1000</tspan></text><line x1="715.0" y1="434.0" x2="715.0" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="715.0" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="715.0" dy="0">1500</tspan></text><line x1="930.0" y1="434.0" x2="930.0" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">2000</tspan></text><polygon points="706.0,380.0 724.0,380.0 715.0,392.0" fill="#ea580c"/><rect x="582.6" y="354.0" width="264.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="715.0" y="369.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="253"><tspan x="715.0" dy="0">◆ 1500 CC: TORACOTOMÍA DE EMERGENCIA</tspan></text><text x="40.0" y="502.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LOS TRES CRITERIOS DE TORACOTOMÍA</tspan></text><rect x="40.0" y="512.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="513.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="536.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Drenaje inicial</tspan></text><text x="58.0" y="557.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">1500 mL o más: el paciente lo cumple</tspan></text><rect x="351.3" y="512.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="513.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="536.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Débito persistente</tspan></text><text x="369.3" y="557.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">200 mL/h o más durante 2 a 4 horas</tspan></text><rect x="662.7" y="512.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="513.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="536.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Inestabilidad</tspan></text><text x="680.7" y="557.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Persiste pese a reanimar con hemoderivados</tspan></text><text x="40.0" y="615.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CRITERIOS DE TORACOTOMÍA EN EL HEMOTÓRAX (ATLS)</tspan></text><rect x="40.0" y="627.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="646.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Criterio</tspan></text><text x="270.0" y="646.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Umbral</tspan></text><text x="620.0" y="646.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Nota</tspan></text><rect x="40.0" y="656.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="675.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Drenaje inicial</tspan></text><text x="270.0" y="675.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">1500 mL o más</tspan></text><text x="620.0" y="675.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Hemotórax masivo; este paciente</tspan></text><rect x="160.6" y="659.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="206.0" y="674.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="206.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="685.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="704.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Débito sostenido</tspan></text><text x="270.0" y="704.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Más de 200 mL por hora durante 2 a 4 horas</tspan></text><text x="620.0" y="704.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Reevaluar cada hora</tspan></text><rect x="40.0" y="714.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="733.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Estado hemodinámico</tspan></text><text x="270.0" y="733.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Inestable pese a la reanimación</tspan></text><text x="620.0" y="733.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Indica control quirúrgico inmediato</tspan></text><text x="40.0" y="783.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="793.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="824.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="796.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="815.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Toracotomía de</tspan><tspan x="285.0" dy="17">emergencia</tspan></text><text x="435.0" y="815.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Observación en</tspan><tspan x="435.0" dy="17">emergencia</tspan></text><text x="585.0" y="815.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Solo transfusión de</tspan><tspan x="585.0" dy="17">sangre</tspan></text><text x="735.0" y="815.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Toracotomía</tspan><tspan x="735.0" dy="17">diferida</tspan></text><text x="885.0" y="815.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Control periódico</tspan><tspan x="885.0" dy="17">del drenaje</tspan></text><rect x="40.0" y="847.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="847.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="876.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Conducta?</tspan></text><text x="285.0" y="868.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: drenaje de 1500 mL</tspan><tspan x="285.0" dy="16">e inestabilidad</tspan></text><text x="435.0" y="868.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: seguiría sangrando</tspan><tspan x="435.0" dy="16">sin control</tspan></text><text x="585.0" y="868.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: la transfusión es</tspan><tspan x="585.0" dy="16">solo un puente</tspan></text><text x="735.0" y="868.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: el retraso aumenta</tspan><tspan x="735.0" dy="16">la mortalidad</tspan></text><text x="885.0" y="868.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: ya cumple criterio</tspan><tspan x="885.0" dy="16">quirúrgico</tspan></text><rect x="40.0" y="793.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="921.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="949.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="971.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Indicaciones de toracotomía (ATLS): drenaje inicial de 1500 mL o más, débito de 200 mL/h o más durante 2 a 4 horas, o inestabilidad pese a la</tspan><tspan x="58.0" dy="18">   reanimación.</tspan><tspan x="58.0" dy="18">• Manejo inicial: dos vías gruesas, hemoderivados, tubo de toracostomía grueso y valorar autotransfusión de la sangre drenada.</tspan><tspan x="58.0" dy="18">• La transfusión es un puente, no sustituye el control quirúrgico. Nunca pinzar a ciegas los vasos dentro del tórax.</tspan><tspan x="58.0" dy="18">• Alerta: fuentes habituales en trauma penetrante son grandes vasos, vasos intercostales, mamaria interna e hilio pulmonar.</tspan></text><text x="58.0" y="1065.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ATLS, 11.ª ed. (American College of Surgeons, 2025); Mowery NT et al., EAST, Practice management guidelines for hemothorax and occult pneumothorax, J Trauma</tspan><tspan x="58.0" dy="15">2011;70:510-8; Sabiston Tratado de Cirugía, 21.ª ed. (2021)</tspan></text></svg>