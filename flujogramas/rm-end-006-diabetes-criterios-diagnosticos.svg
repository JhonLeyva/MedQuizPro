<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1223" viewBox="0 0 1000 1223" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La diabetes se diagnostica con glucemia en ayunas de 126 mg/dL o más, confirmada en dos ocasiones"><title>La diabetes se diagnostica con glucemia en ayunas de 126 mg/dL o más, confirmada en dos ocasiones</title><rect x="0.75" y="0.75" width="998.5" height="1221.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Diabetes · criterios diagnósticos</tspan></text><rect x="392.1" y="32.0" width="140.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="462.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="124"><tspan x="462.3" dy="0">ENDOCRINOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Criterios diagnósticos</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cuatro pruebas válidas: glucemia en ayunas, glucemia a las 2 horas, HbA1c y glucemia</tspan><tspan x="58.0" dy="17">aleatoria con síntomas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de umbral</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Desde qué glucemia en ayunas (mg/dL) se</tspan><tspan x="640.0" dy="16">diagnostica diabetes si se repite dos veces?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DÓNDE CAE CADA VALOR EN LAS TRES PRUEBAS</tspan></text><rect x="40.0" y="269.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="295.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Glucemia en ayunas (mg/dL)</tspan></text><text x="60.0" y="314.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Ayuno de al menos 8 horas.</tspan></text><rect x="70.0" y="378.0" width="245.7" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="192.9" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="236"><tspan x="192.9" dy="0">Normal</tspan></text><rect x="315.7" y="378.0" width="159.7" height="40.0" rx="6" fill="#fef9c3" stroke="#ffffff" stroke-width="2"/><text x="395.6" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#a16207" text-anchor="middle" data-max="150"><tspan x="395.6" dy="0">Prediabetes</tspan></text><rect x="475.4" y="378.0" width="454.6" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="702.7" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="445"><tspan x="702.7" dy="0">Diabetes</tspan></text><line x1="131.4" y1="418.0" x2="131.4" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="131.4" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="131.4" dy="0">70</tspan></text><line x1="315.7" y1="418.0" x2="315.7" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="315.7" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="315.7" dy="0">100</tspan></text><line x1="475.4" y1="418.0" x2="475.4" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="475.4" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="475.4" dy="0">126</tspan></text><line x1="684.3" y1="418.0" x2="684.3" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="684.3" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="684.3" dy="0">160</tspan></text><line x1="930.0" y1="418.0" x2="930.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">200</tspan></text><polygon points="466.4,364.0 484.4,364.0 475.4,376.0" fill="#ea580c"/><rect x="422.5" y="338.0" width="105.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="475.4" y="353.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="94"><tspan x="475.4" dy="0">◆ 126: UMBRAL</tspan></text><rect x="40.0" y="468.0" width="920.0" height="151.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="494.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Glucemia a las 2 h de 75 g (mg/dL)</tspan></text><text x="60.0" y="513.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Prueba de tolerancia oral a la glucosa.</tspan></text><rect x="70.0" y="543.0" width="234.5" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="187.3" y="568.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="225"><tspan x="187.3" dy="0">Normal</tspan></text><rect x="304.5" y="543.0" width="234.5" height="40.0" rx="6" fill="#fef9c3" stroke="#ffffff" stroke-width="2"/><text x="421.8" y="568.0" font-size="12" font-weight="800" font-style="normal" fill="#a16207" text-anchor="middle" data-max="225"><tspan x="421.8" dy="0">Prediabetes</tspan></text><rect x="539.1" y="543.0" width="390.9" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="734.5" y="568.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="381"><tspan x="734.5" dy="0">Diabetes</tspan></text><line x1="148.2" y1="583.0" x2="148.2" y2="591.0" stroke="#64748b" stroke-width="1.5"/><text x="148.2" y="605.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="148.2" dy="0">100</tspan></text><line x1="304.5" y1="583.0" x2="304.5" y2="591.0" stroke="#64748b" stroke-width="1.5"/><text x="304.5" y="605.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="304.5" dy="0">140</tspan></text><line x1="539.1" y1="583.0" x2="539.1" y2="591.0" stroke="#64748b" stroke-width="1.5"/><text x="539.1" y="605.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="539.1" dy="0">200</tspan></text><line x1="734.5" y1="583.0" x2="734.5" y2="591.0" stroke="#64748b" stroke-width="1.5"/><text x="734.5" y="605.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="734.5" dy="0">250</tspan></text><line x1="930.0" y1="583.0" x2="930.0" y2="591.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="605.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">300</tspan></text><rect x="40.0" y="633.0" width="920.0" height="151.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="659.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Hemoglobina glicosilada (%)</tspan></text><text x="60.0" y="678.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Refleja los últimos 2-3 meses.</tspan></text><rect x="70.0" y="708.0" width="243.7" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="191.8" y="733.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="234"><tspan x="191.8" dy="0">Normal</tspan></text><rect x="313.7" y="708.0" width="114.7" height="40.0" rx="6" fill="#fef9c3" stroke="#ffffff" stroke-width="2"/><text x="371.0" y="733.0" font-size="12" font-weight="800" font-style="normal" fill="#a16207" text-anchor="middle" data-max="105"><tspan x="371.0" dy="0">Prediabetes</tspan></text><rect x="428.3" y="708.0" width="501.7" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="679.2" y="733.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="492"><tspan x="679.2" dy="0">Diabetes</tspan></text><line x1="70.0" y1="748.0" x2="70.0" y2="756.0" stroke="#64748b" stroke-width="1.5"/><text x="70.0" y="770.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="70.0" dy="0">4 %</tspan></text><line x1="313.7" y1="748.0" x2="313.7" y2="756.0" stroke="#64748b" stroke-width="1.5"/><text x="313.7" y="770.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="313.7" dy="0">5,7 %</tspan></text><line x1="428.3" y1="748.0" x2="428.3" y2="756.0" stroke="#64748b" stroke-width="1.5"/><text x="428.3" y="770.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="428.3" dy="0">6,5 %</tspan></text><line x1="643.3" y1="748.0" x2="643.3" y2="756.0" stroke="#64748b" stroke-width="1.5"/><text x="643.3" y="770.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="643.3" dy="0">8 %</tspan></text><line x1="930.0" y1="748.0" x2="930.0" y2="756.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="770.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">10 %</tspan></text><text x="40.0" y="816.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LEER LAS OTRAS OPCIONES</tspan></text><rect x="40.0" y="826.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="827.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="850.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">120 y 114</tspan></text><text x="58.0" y="871.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Caen en prediabetes (100-125)</tspan></text><rect x="351.3" y="826.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="352.3" y="827.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="369.3" y="850.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">126</tspan></text><text x="369.3" y="871.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Umbral diagnóstico en ayunas</tspan></text><rect x="662.7" y="826.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="827.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="850.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">140 y 160</tspan></text><text x="680.7" y="871.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">140 es corte de la carga de 2 h; 160 no es umbral</tspan></text><text x="40.0" y="935.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="945.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="967.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="967.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">120</tspan></text><text x="435.0" y="967.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">114</tspan></text><text x="585.0" y="967.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">140</tspan></text><rect x="663.0" y="948.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="967.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">126</tspan></text><text x="885.0" y="967.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">160</tspan></text><rect x="40.0" y="982.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="982.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1011.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Umbral en ayunas?</tspan></text><text x="285.0" y="1011.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: prediabetes</tspan></text><text x="435.0" y="1011.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: prediabetes</tspan></text><text x="585.0" y="1003.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: corte de la carga</tspan><tspan x="585.0" dy="16">de 2 horas</tspan></text><text x="735.0" y="1003.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: umbral oficial en</tspan><tspan x="735.0" dy="16">ayunas</tspan></text><text x="885.0" y="1003.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: muy por encima</tspan><tspan x="885.0" dy="16">del umbral</tspan></text><rect x="40.0" y="945.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1056.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1084.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1106.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• ADA 2026: glucemia en ayunas ≥ 126 mg/dL (ayuno ≥ 8 h), HbA1c ≥ 6,5 %, glucemia a las 2 h de 75 g ≥ 200, o aleatoria ≥ 200 con síntomas clásicos.</tspan><tspan x="58.0" dy="18">• Se confirma con una segunda prueba, salvo síntomas clásicos con glucemia aleatoria ≥ 200 mg/dL.</tspan><tspan x="58.0" dy="18">• Prediabetes (ADA): ayunas 100-125, 2 h 140-199 o HbA1c 5,7-6,4 %; la OMS fija la glucosa alterada en 110-125. Por eso 120 y 114 son prediabetes.</tspan><tspan x="58.0" dy="18">• El 140 es el corte de la carga de 2 h, no de ayunas. En gestantes se tamiza con carga oral entre las semanas 24 y 28.</tspan></text><text x="58.0" y="1182.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ADA, Standards of Care in Diabetes-2026, sección 2; OMS/IDF, definición y diagnóstico de diabetes (2006, vigente)</tspan></text></svg>