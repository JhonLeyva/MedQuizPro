<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1152" viewBox="0 0 1000 1152" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Cuadro de dos meses con anhedonia, insomnio y pérdida de peso: depresión; el PHQ-9 gradúa la gravedad"><title>Cuadro de dos meses con anhedonia, insomnio y pérdida de peso: depresión; el PHQ-9 gradúa la gravedad</title><rect x="0.75" y="0.75" width="998.5" height="1150.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Psiquiatría · depresión y PHQ-9</tspan></text><rect x="385.9" y="32.0" width="109.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="440.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="93"><tspan x="440.6" dy="0">PSIQUIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Depresión mayor (DSM-5-TR)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Más de cinco síntomas durante más de 2 semanas, con deterioro funcional.</tspan><tspan x="58.0" dy="17">El estrés laboral y económico precipita, pero no cambia el diagnóstico.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 45 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dos meses con hiporexia, pérdida de peso, fatiga y</tspan><tspan x="640.0" dy="16">falta de concentración.</tspan><tspan x="640.0" dy="16">Pérdida de interés, irritabilidad, insomnio y molestias</tspan><tspan x="640.0" dy="16">digestivas tras perder el empleo.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE GRADÚA LA DEPRESIÓN CON EL PHQ-9</tspan></text><rect x="40.0" y="301.0" width="920.0" height="151.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="327.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Puntaje del PHQ-9</tspan></text><text x="60.0" y="346.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El puntaje orienta la gravedad; el diagnóstico lo confirman los criterios DSM-5-TR.</tspan></text><rect x="70.0" y="376.0" width="318.5" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="229.3" y="401.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="309"><tspan x="229.3" dy="0">Menos de 10: sin tamizaje positivo</tspan></text><rect x="388.5" y="376.0" width="318.5" height="40.0" rx="6" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/><text x="547.8" y="401.0" font-size="12" font-weight="800" font-style="normal" fill="#c2410c" text-anchor="middle" data-max="309"><tspan x="547.8" dy="0">10 a 19: depresión probable</tspan></text><rect x="707.0" y="376.0" width="223.0" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="818.5" y="401.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="213"><tspan x="818.5" dy="0">20 o más: depresión grave</tspan></text><line x1="70.0" y1="416.0" x2="70.0" y2="424.0" stroke="#64748b" stroke-width="1.5"/><text x="70.0" y="438.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="70.0" dy="0">0</tspan></text><line x1="229.3" y1="416.0" x2="229.3" y2="424.0" stroke="#64748b" stroke-width="1.5"/><text x="229.3" y="438.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="229.3" dy="0">5</tspan></text><line x1="388.5" y1="416.0" x2="388.5" y2="424.0" stroke="#64748b" stroke-width="1.5"/><text x="388.5" y="438.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="388.5" dy="0">10</tspan></text><line x1="547.8" y1="416.0" x2="547.8" y2="424.0" stroke="#64748b" stroke-width="1.5"/><text x="547.8" y="438.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="547.8" dy="0">15</tspan></text><line x1="707.0" y1="416.0" x2="707.0" y2="424.0" stroke="#64748b" stroke-width="1.5"/><text x="707.0" y="438.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="707.0" dy="0">20</tspan></text><line x1="930.0" y1="416.0" x2="930.0" y2="424.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="438.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">27</tspan></text><text x="40.0" y="484.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ HACE EL DIAGNÓSTICO</tspan></text><rect x="40.0" y="494.0" width="297.3" height="86.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="495.0" width="6.0" height="84.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="518.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Más de cinco síntomas por más de 2</tspan><tspan x="58.0" dy="17">semanas</tspan></text><text x="58.0" y="556.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Episodio depresivo mayor: opción correcta</tspan></text><rect x="351.3" y="494.0" width="297.3" height="86.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="495.0" width="6.0" height="84.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="518.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Psicosis o paranoia</tspan></text><text x="369.3" y="539.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Sin delirios ni alucinaciones en el caso</tspan></text><rect x="662.7" y="494.0" width="297.3" height="86.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="495.0" width="6.0" height="84.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="518.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Demencia vascular o ansiedad aislada</tspan></text><text x="680.7" y="539.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">No explican la anhedonia ni la pérdida de peso</tspan></text><text x="40.0" y="614.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TAMIZAJE Y TRATAMIENTO DE LA DEPRESIÓN</tspan></text><rect x="40.0" y="626.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="645.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Paso</tspan></text><text x="300.0" y="645.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Qué se hace</tspan></text><text x="635.0" y="645.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Nota</tspan></text><rect x="40.0" y="655.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="674.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Tamizar</tspan></text><text x="300.0" y="674.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">PHQ-9: 10 puntos o más</tspan></text><text x="635.0" y="674.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">20 o más indica depresión grave</tspan></text><rect x="40.0" y="684.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="703.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Confirmar</tspan></text><text x="300.0" y="703.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Criterios DSM-5-TR: más de cinco síntomas por más de 2</tspan><tspan x="300.0" dy="15">semanas</tspan></text><text x="635.0" y="703.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Descartar hipotiroidismo, anemia y trastorno bipolar</tspan></text><rect x="190.6" y="695.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="236.0" y="710.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="236.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="728.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="747.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Tratar</tspan></text><text x="300.0" y="747.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">ISRS más psicoterapia en la forma moderada</tspan></text><text x="635.0" y="747.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Mejoría en 2-4 semanas; mantener 6-12 meses tras la</tspan><tspan x="635.0" dy="15">remisión</tspan></text><text x="40.0" y="812.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="822.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="844.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="844.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Ansiedad</tspan></text><text x="435.0" y="844.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Demencia vascular</tspan></text><text x="585.0" y="844.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Psicosis</tspan></text><rect x="663.0" y="825.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="844.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Depresión</tspan></text><text x="885.0" y="844.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Paranoia</tspan></text><rect x="40.0" y="859.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="859.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="888.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico más</tspan><tspan x="54.0" dy="16">probable?</tspan></text><text x="285.0" y="880.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no explica la</tspan><tspan x="285.0" dy="16">anhedonia ni la pérdida</tspan><tspan x="285.0" dy="16">de peso</tspan></text><text x="435.0" y="880.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: tiene deterioro</tspan><tspan x="435.0" dy="16">escalonado y factores</tspan><tspan x="435.0" dy="16">vasculares</tspan></text><text x="585.0" y="888.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: exige delirios o</tspan><tspan x="585.0" dy="16">alucinaciones</tspan></text><text x="735.0" y="880.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: cumple más de</tspan><tspan x="735.0" dy="16">cinco criterios por dos</tspan><tspan x="735.0" dy="16">meses</tspan></text><text x="885.0" y="880.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: exige ideas</tspan><tspan x="885.0" dy="16">delirantes de</tspan><tspan x="885.0" dy="16">persecución</tspan></text><rect x="40.0" y="822.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="949.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="977.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="999.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Se cumplen más de cinco de los nueve criterios del episodio depresivo mayor, por más de 2 semanas y con deterioro funcional.</tspan><tspan x="58.0" dy="18">• Tamizaje con PHQ-9: 10 puntos o más tiene buena sensibilidad; 20 o más indica depresión grave. Siempre se evalúa el riesgo suicida.</tspan><tspan x="58.0" dy="18">• Psicosis y paranoia exigen delirios o alucinaciones; la demencia vascular tiene deterioro escalonado; la ansiedad aislada no explica anhedonia ni pérdida</tspan><tspan x="58.0" dy="18">   de peso.</tspan><tspan x="58.0" dy="18">• Tratamiento moderado: ISRS más psicoterapia; mejoría en 2-4 semanas y mantenimiento de 6-12 meses. Antes, descartar hipotiroidismo, anemia y</tspan><tspan x="58.0" dy="18">   bipolar.</tspan></text><text x="58.0" y="1111.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA, GPC de depresión en mayores de 18 años en el primer nivel (2023); APA, DSM-5-TR (2022); Kaplan y Sadock, Sinopsis de Psiquiatría 12.ª ed. (2021).</tspan></text></svg>