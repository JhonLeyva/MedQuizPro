<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="851" viewBox="0 0 1000 851" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Paciente que deja de respirar, no responde y no tiene pulso: lo primero es iniciar compresiones torácicas"><title>Paciente que deja de respirar, no responde y no tiene pulso: lo primero es iniciar compresiones torácicas</title><rect x="0.75" y="0.75" width="998.5" height="849.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Reanimación cardiopulmonar</tspan></text><rect x="375.0" y="32.0" width="132.2" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="441.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="116"><tspan x="441.1" dy="0">CARDIOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Secuencia C-A-B</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">En el adulto en paro, primero las compresiones (C), luego vía aérea (A) y ventilación (B): la</tspan><tspan x="58.0" dy="17">sangre oxigenada que queda solo circula si se comprime.</tspan><tspan x="58.0" dy="17">Comprobar pulso no más de 10 segundos.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 40 años en trauma shock</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dificultad respiratoria progresiva.</tspan><tspan x="640.0" dy="16">Deja de respirar, no responde y no hay pulso carotídeo.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LOS PRIMEROS SEGUNDOS DEL PARO</tspan></text><line x1="155.0" y1="295.0" x2="293.0" y2="295.0" stroke="#99f6e4" stroke-width="6"/><line x1="339.0" y1="295.0" x2="477.0" y2="295.0" stroke="#99f6e4" stroke-width="6"/><line x1="523.0" y1="295.0" x2="661.0" y2="295.0" stroke="#99f6e4" stroke-width="6"/><line x1="707.0" y1="295.0" x2="845.0" y2="295.0" stroke="#99f6e4" stroke-width="6"/><circle cx="132.0" cy="295.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="132.0" y="299.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="132.0" dy="0">&lt; 10 s</tspan></text><rect x="45.0" y="329.0" width="174.0" height="75.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="132.0" y="349.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">Reconocer el paro</tspan></text><text x="132.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">No responde, no respira, sin</tspan><tspan x="132.0" dy="16">pulso</tspan></text><circle cx="316.0" cy="295.0" r="22" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><text x="316.0" y="299.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="38"><tspan x="316.0" dy="0">Ya</tspan></text><rect x="229.0" y="329.0" width="174.0" height="75.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="316.0" y="349.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">Compresiones</tspan></text><text x="316.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">100-120/min, 5-6 cm</tspan></text><rect x="276.5" y="393.0" width="78.9" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="316.0" y="408.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="316.0" dy="0">◆ PRIMERO</tspan></text><circle cx="500.0" cy="295.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="299.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="500.0" dy="0">30:2</tspan></text><rect x="413.0" y="329.0" width="174.0" height="75.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="349.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">Ventilación</tspan></text><text x="500.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">Bolsa-máscara tras 30</tspan><tspan x="500.0" dy="16">compresiones</tspan></text><circle cx="684.0" cy="295.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="684.0" y="299.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="684.0" dy="0">&lt; 3 min</tspan></text><rect x="597.0" y="329.0" width="174.0" height="75.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="684.0" y="349.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">Monitor desfibrilador</tspan></text><text x="684.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">Descarga si es FV/TV</tspan></text><circle cx="868.0" cy="295.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="868.0" y="299.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="868.0" dy="0">2 min</tspan></text><rect x="781.0" y="329.0" width="174.0" height="75.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="868.0" y="349.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">Ciclos</tspan></text><text x="868.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">Cambiar a quien comprime</tspan></text><rect x="40.0" y="436.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="462.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Compresiones de inmediato</tspan></text><text x="60.0" y="481.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Todo lo demás se hace sin detenerlas.</tspan></text><text x="40.0" y="548.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="558.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="589.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="580.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Interconsulta a</tspan><tspan x="285.0" dy="17">cardiología</tspan></text><text x="435.0" y="580.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Desfibrilación</tspan><tspan x="435.0" dy="17">inmediata</tspan></text><text x="585.0" y="580.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Intubación</tspan><tspan x="585.0" dy="17">orotraqueal</tspan></text><rect x="663.0" y="561.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="580.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Compresión</tspan><tspan x="735.0" dy="17">cardiaca</tspan></text><text x="885.0" y="580.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Ventilar con bolsa</tspan><tspan x="885.0" dy="17">antes de comprimir</tspan></text><rect x="40.0" y="612.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="612.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="649.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Primer paso?</tspan></text><text x="285.0" y="649.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: retrasa</tspan></text><text x="435.0" y="633.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: primero comprimir</tspan><tspan x="435.0" dy="16">mientras llega el</tspan><tspan x="435.0" dy="16">monitor</tspan></text><text x="585.0" y="641.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no retrasar las</tspan><tspan x="585.0" dy="16">compresiones</tspan></text><text x="735.0" y="649.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: C primero</tspan></text><text x="885.0" y="633.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: la ventilación va</tspan><tspan x="885.0" dy="16">después de 30</tspan><tspan x="885.0" dy="16">compresiones</tspan></text><rect x="40.0" y="558.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="702.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="730.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="752.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Compresiones 100-120/min, 5-6 cm, dejar que el tórax vuelva, mínimas pausas; 30:2 sin vía avanzada.</tspan><tspan x="58.0" dy="18">• Conectar el monitor desfibrilador apenas llegue; descarga si es FV/TV sin pulso.</tspan><tspan x="58.0" dy="18">• Con causa respiratoria: asegurar la vía aérea sin interrumpir las compresiones.</tspan></text><text x="58.0" y="810.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AHA/ILCOR, guías de reanimación 2025; ERC (2025).</tspan></text></svg>