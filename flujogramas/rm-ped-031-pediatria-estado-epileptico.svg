<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1146" viewBox="0 0 1000 1146" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Diez crisis en una hora en un lactante, sin recuperación entre ellas: estado epiléptico"><title>Diez crisis en una hora en un lactante, sin recuperación entre ellas: estado epiléptico</title><rect x="0.75" y="0.75" width="998.5" height="1144.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · estado epiléptico</tspan></text><rect x="365.4" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="414.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="414.5" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Estado epiléptico (ILAE 2015)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">t1 a los 5 minutos: falla la terminación de la crisis y se debe tratar.</tspan><tspan x="58.0" dy="17">t2 a los 30 minutos: riesgo de daño neuronal y secuelas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 8 meses</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Presenta crisis convulsivas 10 veces en una hora.</tspan><tspan x="640.0" dy="16">¿A qué corresponde?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TIEMPOS DEL ESTADO EPILÉPTICO Y QUÉ HACER</tspan></text><line x1="155.0" y1="295.0" x2="293.0" y2="295.0" stroke="#99f6e4" stroke-width="6"/><line x1="339.0" y1="295.0" x2="477.0" y2="295.0" stroke="#99f6e4" stroke-width="6"/><line x1="523.0" y1="295.0" x2="661.0" y2="295.0" stroke="#99f6e4" stroke-width="6"/><line x1="707.0" y1="295.0" x2="845.0" y2="295.0" stroke="#99f6e4" stroke-width="6"/><circle cx="132.0" cy="295.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="132.0" y="299.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="132.0" dy="0">0 min</tspan></text><rect x="45.0" y="329.0" width="174.0" height="92.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="132.0" y="349.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">Crisis o crisis repetidas</tspan></text><text x="132.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">Estabilizar vía aérea, oxígeno</tspan><tspan x="132.0" dy="16">y glucosa.</tspan></text><circle cx="316.0" cy="295.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="316.0" y="299.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="316.0" dy="0">5 min</tspan></text><rect x="229.0" y="329.0" width="174.0" height="92.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="316.0" y="349.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">t1: se debe tratar</tspan></text><text x="316.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">Benzodiazepina: midazolam</tspan><tspan x="316.0" dy="16">IM, lorazepam o diazepam.</tspan></text><circle cx="500.0" cy="295.0" r="22" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><text x="500.0" y="299.5" font-size="9.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="38"><tspan x="500.0" dy="0">10 crisis</tspan></text><rect x="413.0" y="329.0" width="174.0" height="92.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="500.0" y="349.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">Sin recuperación entre</tspan><tspan x="500.0" dy="17">ellas</tspan></text><text x="500.0" y="383.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">Equivale a estado epiléptico:</tspan><tspan x="500.0" dy="16">este caso.</tspan></text><rect x="454.6" y="410.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="500.0" y="425.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">◆ ESTE CASO</tspan></text><circle cx="684.0" cy="295.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="684.0" y="299.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="684.0" dy="0">20 min</tspan></text><rect x="597.0" y="329.0" width="174.0" height="92.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="684.0" y="349.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">Segunda línea</tspan></text><text x="684.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">Levetiracetam, fenitoína o</tspan><tspan x="684.0" dy="16">valproato.</tspan></text><circle cx="868.0" cy="295.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="868.0" y="299.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="868.0" dy="0">30 min</tspan></text><rect x="781.0" y="329.0" width="174.0" height="92.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="868.0" y="349.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">t2: daño neuronal</tspan></text><text x="868.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">Si persiste: tercera línea con</tspan><tspan x="868.0" dy="16">anestesia.</tspan></text><rect x="40.0" y="453.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="479.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Crisis repetidas sin recuperación = estado epiléptico</tspan></text><text x="60.0" y="498.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Epilepsia, convulsión febril y síndrome de West no explican un cuadro agudo continuo.</tspan></text><text x="40.0" y="559.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DIAGNÓSTICO DIFERENCIAL DE LAS CRISIS CONVULSIVAS EN EL LACTANTE</tspan></text><rect x="40.0" y="571.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="590.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Entidad</tspan></text><text x="290.0" y="590.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Definición</tspan></text><text x="630.0" y="590.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">Diferencia con el caso</tspan></text><rect x="40.0" y="600.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="619.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Estado epiléptico</tspan></text><text x="290.0" y="619.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Crisis desde 5 min o repetidas sin recuperación (ILAE</tspan><tspan x="290.0" dy="15">2015)</tspan></text><text x="630.0" y="619.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">Es el caso: 10 crisis en una hora</tspan></text><rect x="180.6" y="611.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="226.0" y="626.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="226.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="644.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="663.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Epilepsia</tspan></text><text x="290.0" y="663.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Crisis recurrentes no provocadas</tspan></text><text x="630.0" y="663.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">Diagnóstico crónico, no un cuadro agudo</tspan></text><rect x="40.0" y="673.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="692.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Convulsión febril</tspan></text><text x="290.0" y="692.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Con fiebre, menos de 15 min, entre 6 meses y 5 años</tspan></text><text x="630.0" y="692.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">No hay fiebre ni crisis repetidas</tspan></text><rect x="40.0" y="702.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="721.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Síndrome de West</tspan></text><text x="290.0" y="721.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Espasmos en salvas, hipsarritmia y retraso del desarrollo</tspan></text><text x="630.0" y="721.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">No son crisis generalizadas repetidas</tspan></text><text x="40.0" y="771.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="781.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="812.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="784.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="812.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Estado epiléptico</tspan></text><text x="435.0" y="812.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Epilepsia</tspan></text><text x="585.0" y="812.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Convulsión febril</tspan></text><text x="735.0" y="803.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Trastorno</tspan><tspan x="735.0" dy="17">metabólico</tspan></text><text x="885.0" y="812.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Síndrome de West</tspan></text><rect x="40.0" y="835.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="835.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="872.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿A qué corresponde?</tspan></text><text x="285.0" y="856.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: crisis repetidas sin</tspan><tspan x="285.0" dy="16">recuperación entre</tspan><tspan x="285.0" dy="16">ellas</tspan></text><text x="435.0" y="856.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es un diagnóstico</tspan><tspan x="435.0" dy="16">de crisis recurrentes no</tspan><tspan x="435.0" dy="16">provocadas</tspan></text><text x="585.0" y="864.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: exige fiebre y dura</tspan><tspan x="585.0" dy="16">menos de 15 minutos</tspan></text><text x="735.0" y="864.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no explica por sí</tspan><tspan x="735.0" dy="16">solo el cuadro agudo</tspan></text><text x="885.0" y="864.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: son espasmos en</tspan><tspan x="885.0" dy="16">salvas con hipsarritmia</tspan></text><rect x="40.0" y="781.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="925.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="953.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="975.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Definición ILAE 2015: crisis continua desde 5 minutos (t1) con riesgo de daño desde 30 minutos (t2); incluye crisis repetidas sin recuperar la conciencia</tspan><tspan x="58.0" dy="18">   entre ellas.</tspan><tspan x="58.0" dy="18">• Manejo: vía aérea, oxígeno y glucosa; benzodiazepina (midazolam IM, lorazepam o diazepam); segunda línea con levetiracetam, fenitoína o valproato</tspan><tspan x="58.0" dy="18">   (eficacia similar en ESETT); tercera línea con anestesia.</tspan><tspan x="58.0" dy="18">• Diferenciales: epilepsia (crisis recurrentes no provocadas), convulsión febril (con fiebre, menos de 15 minutos), síndrome de West (espasmos en salvas e</tspan><tspan x="58.0" dy="18">   hipsarritmia).</tspan><tspan x="58.0" dy="18">• Buscar causa: infección del sistema nervioso, trastorno metabólico o tóxico. Tratar antes de los 5 minutos mejora el pronóstico.</tspan></text><text x="58.0" y="1105.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Trinka E et al., ILAE, Epilepsia 2015;56:1515-1523; Glauser T et al., AES, Epilepsy Curr 2016;16:48-61; Nelson 22.ª ed. (2024).</tspan></text></svg>