<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1199" viewBox="0 0 1000 1199" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Vómitos repetidos con pH 7,53, bicarbonato 42 y pCO2 53: alcalosis metabólica sensible al cloro"><title>Vómitos repetidos con pH 7,53, bicarbonato 42 y pCO2 53: alcalosis metabólica sensible al cloro</title><rect x="0.75" y="0.75" width="998.5" height="1197.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Nefrología · equilibrio ácido-base</tspan></text><rect x="396.8" y="32.0" width="182.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="488.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="167"><tspan x="488.1" dy="0">NEFROLOGÍA Y UROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Alcalosis metabólica por vómitos</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La pérdida de HCl deja ganancia neta de bicarbonato.</tspan><tspan x="58.0" dy="17">La hipovolemia activa el eje renina-angiotensina-aldosterona.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 52 años con úlcera pilórica</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Vómitos una semana; deshidratada, PA 100/58 mmHg.</tspan><tspan x="640.0" dy="16">pH 7,53, HCO3 42, pCO2 53, K 2,8, Cl 86; Na urinario</tspan><tspan x="640.0" dy="16">2 y Cl urinario 21.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LEER LA GASOMETRÍA Y LOS ELECTROLITOS DE LA PACIENTE</tspan></text><rect x="40.0" y="285.0" width="920.0" height="32.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="306.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="180"><tspan x="54.0" dy="0">EXAMEN</tspan></text><text x="250.0" y="306.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="130"><tspan x="250.0" dy="0">VALOR DEL CASO</tspan></text><text x="400.0" y="306.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="130"><tspan x="400.0" dy="0">NORMAL</tspan></text><text x="550.0" y="306.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="400"><tspan x="550.0" dy="0">QUÉ SIGNIFICA</tspan></text><rect x="40.0" y="323.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="347.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">pH</tspan></text><text x="250.0" y="348.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">7,53  ↑</tspan></text><text x="400.0" y="347.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">7,35 a 7,45</tspan></text><text x="550.0" y="347.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Alcalemia: descarta acidosis.</tspan></text><rect x="40.0" y="367.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="391.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Bicarbonato</tspan></text><text x="250.0" y="392.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">42 mmol/L  ↑</tspan></text><text x="400.0" y="391.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">22 a 26</tspan></text><text x="550.0" y="391.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Trastorno primario metabólico.</tspan></text><rect x="40.0" y="411.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="435.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">pCO2</tspan></text><text x="250.0" y="436.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">53 mmHg  ↑</tspan></text><text x="400.0" y="435.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">35 a 45</tspan></text><text x="550.0" y="435.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Igual a la esperada (≈ 53): compensación adecuada.</tspan></text><rect x="40.0" y="455.0" width="920.0" height="40.0" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="479.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Potasio</tspan></text><text x="250.0" y="480.0" font-size="13" font-weight="800" font-style="normal" fill="#2563eb" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">2,8 mmol/L  ↓</tspan></text><text x="400.0" y="479.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">3,5 a 5</tspan></text><text x="550.0" y="479.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Pérdida renal por aldosterona.</tspan></text><rect x="40.0" y="499.0" width="920.0" height="40.0" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="523.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Sodio urinario</tspan></text><text x="250.0" y="524.0" font-size="13" font-weight="800" font-style="normal" fill="#2563eb" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">2 mmol/L  ↓</tspan></text><text x="400.0" y="523.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Bajo en hipovolemia</tspan></text><text x="550.0" y="523.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Confirma depleción de volumen.</tspan></text><rect x="40.0" y="557.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="583.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">pH 7,53 + HCO3 42 + pCO2 compensada = alcalosis metabólica</tspan></text><text x="60.0" y="602.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Sin pCO2 fuera de lo esperado no hay trastorno mixto; las acidosis no cuadran con un pH alcalino.</tspan></text><text x="40.0" y="663.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ALCALOSIS METABÓLICA SEGÚN EL CLORO URINARIO</tspan></text><rect x="40.0" y="675.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="694.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Tipo</tspan></text><text x="300.0" y="694.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="207"><tspan x="300.0" dy="0">Cloro urinario</tspan></text><text x="523.3" y="694.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="207"><tspan x="523.3" dy="0">Causas</tspan></text><text x="746.7" y="694.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="207"><tspan x="746.7" dy="0">Tratamiento</tspan></text><rect x="40.0" y="704.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="723.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Sensible al cloro</tspan></text><text x="300.0" y="723.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="207"><tspan x="300.0" dy="0">Bajo (menos de 20 mmol/L)</tspan></text><text x="523.3" y="723.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="207"><tspan x="523.3" dy="0">Vómitos, aspiración gástrica</tspan></text><text x="746.7" y="723.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="207"><tspan x="746.7" dy="0">Solución salina isotónica y potasio</tspan></text><rect x="190.6" y="707.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="236.0" y="722.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="236.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="733.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="752.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Resistente al cloro</tspan></text><text x="300.0" y="752.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="207"><tspan x="300.0" dy="0">Alto</tspan></text><text x="523.3" y="752.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="207"><tspan x="523.3" dy="0">Exceso de mineralocorticoides</tspan></text><text x="746.7" y="752.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="207"><tspan x="746.7" dy="0">Tratar la causa de fondo</tspan></text><text x="40.0" y="778.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">El Cl urinario de 21 mmol/L del caso está en el límite; el Na urinario de 2 mmol/L confirma la hipovolemia.</tspan></text><text x="40.0" y="825.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="835.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="874.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="838.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="866.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Alcalosis</tspan><tspan x="285.0" dy="17">metabólica</tspan></text><text x="435.0" y="866.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Acidosis</tspan><tspan x="435.0" dy="17">hipoclorémica</tspan></text><text x="585.0" y="874.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Alcalosis mixta</tspan></text><text x="735.0" y="857.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Acidosis metabólica</tspan><tspan x="735.0" dy="17">con anión gap</tspan><tspan x="735.0" dy="17">normal</tspan></text><text x="885.0" y="866.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Bicarbonaturia</tspan><tspan x="885.0" dy="17">paradójica</tspan></text><rect x="40.0" y="906.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="906.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="935.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico más</tspan><tspan x="54.0" dy="16">probable?</tspan></text><text x="285.0" y="927.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: pH alcalino, HCO3</tspan><tspan x="285.0" dy="16">alto y pCO2</tspan><tspan x="285.0" dy="16">compensada</tspan></text><text x="435.0" y="943.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: el pH es alcalino</tspan></text><text x="585.0" y="927.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: la pCO2 es la</tspan><tspan x="585.0" dy="16">esperada para la</tspan><tspan x="585.0" dy="16">compensación</tspan></text><text x="735.0" y="943.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: el pH es alcalino</tspan></text><text x="885.0" y="935.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: el término correcto</tspan><tspan x="885.0" dy="16">es aciduria paradójica</tspan></text><rect x="40.0" y="835.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="996.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1024.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1046.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• pH alto con bicarbonato alto = alcalosis metabólica. Compensación esperada: la pCO2 sube unos 0,7 mmHg por cada mmol/L de bicarbonato sobre 24, o</tspan><tspan x="58.0" dy="18">   sea 40 + 0,7 x 18 ≈ 53 mmHg.</tspan><tspan x="58.0" dy="18">• La pCO2 medida (53) coincide con la esperada: no hay trastorno respiratorio asociado, por lo tanto no es una alcalosis mixta.</tspan><tspan x="58.0" dy="18">• Hipopotasemia por hiperaldosteronismo secundario; Na urinario de 2 mmol/L confirma depleción de volumen. Cloro urinario bajo orienta a vómitos; alto, a</tspan><tspan x="58.0" dy="18">   exceso de mineralocorticoides.</tspan><tspan x="58.0" dy="18">• Tratamiento: solución salina isotónica y reposición de potasio. La «bicarbonaturia paradójica» no existe; lo descrito es la aciduria paradójica.</tspan></text><text x="58.0" y="1158.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Harrison, Principios de Medicina Interna, 21.ª ed. (2022); KDIGO, lesión renal aguda (2012).</tspan></text></svg>