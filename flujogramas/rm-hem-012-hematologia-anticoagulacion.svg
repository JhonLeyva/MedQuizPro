<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1362" viewBox="0 0 1000 1362" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La heparina no fraccionada se monitoriza con el tiempo de tromboplastina parcial activado (TTPa)"><title>La heparina no fraccionada se monitoriza con el tiempo de tromboplastina parcial activado (TTPa)</title><rect x="0.75" y="0.75" width="998.5" height="1360.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Hematología · anticoagulación</tspan></text><rect x="380.4" y="32.0" width="120.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="440.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="104"><tspan x="440.7" dy="0">HEMATOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Heparina no fraccionada</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Potencia la antitrombina, que inactiva la trombina y el factor Xa.</tspan><tspan x="58.0" dy="17">Su efecto es variable, por eso exige monitoreo.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Trombosis venosa profunda recurrente</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Se decide usar heparina no fraccionada.</tspan><tspan x="640.0" dy="16">¿Qué examen la monitoriza?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SE MIDE Y QUÉ SE VIGILA CON CADA ANTICOAGULANTE</tspan></text><rect x="40.0" y="269.0" width="920.0" height="144.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="269.0" width="108.0" height="144.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="337.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Heparina no</tspan><tspan x="94.0" dy="14">fraccionada</tspan><tspan x="94.0" dy="14">(este caso)</tspan></text><rect x="40.0" y="413.0" width="920.0" height="144.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="413.0" width="108.0" height="144.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="489.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Warfarina</tspan></text><rect x="40.0" y="557.0" width="920.0" height="144.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="557.0" width="108.0" height="144.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="629.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Seguridad y</tspan><tspan x="94.0" dy="14">antídotos</tspan></text><line x1="307.2" y1="332.5" x2="314.2" y2="332.5" stroke="#0f766e" stroke-width="2.2"/><line x1="314.2" y1="332.5" x2="314.2" y2="332.5" stroke="#0f766e" stroke-width="2.2"/><line x1="314.2" y1="332.5" x2="312.2" y2="332.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="312.2,337.5 312.2,327.5 321.2,332.5" fill="#0f766e"/><line x1="470.4" y1="332.5" x2="477.4" y2="332.5" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="332.5" x2="477.4" y2="477.0" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="477.0" x2="475.4" y2="477.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="475.4,482.0 475.4,472.0 484.4,477.0" fill="#0f766e"/><line x1="633.6" y1="477.0" x2="640.6" y2="477.0" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="477.0" x2="640.6" y2="629.0" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="629.0" x2="638.6" y2="629.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="638.6,634.0 638.6,624.0 647.6,629.0" fill="#0f766e"/><line x1="796.8" y1="629.0" x2="803.8" y2="629.0" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="629.0" x2="803.8" y2="613.0" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="613.0" x2="801.8" y2="613.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="801.8,618.0 801.8,608.0 810.8,613.0" fill="#0f766e"/><rect x="158.0" y="282.0" width="149.2" height="101.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="168.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">TTPa</tspan></text><text x="168.0" y="315.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Objetivo de 1,5 a 2,5</tspan><tspan x="168.0" dy="14.5">veces el control; a las 6</tspan><tspan x="168.0" dy="14.5">horas del inicio y de cada</tspan><tspan x="168.0" dy="14.5">cambio de dosis</tspan></text><circle cx="158.0" cy="282.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="321.2" y="282.0" width="149.2" height="101.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="331.2" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Actividad anti-Xa</tspan></text><text x="331.2" y="315.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">0,3 a 0,7 UI/mL si el</tspan><tspan x="331.2" dy="14.5">TTPa basal está alterado</tspan><tspan x="331.2" dy="14.5">o hay resistencia a la</tspan><tspan x="331.2" dy="14.5">heparina</tspan></text><circle cx="321.2" cy="282.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="321.2" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="321.2" dy="0">2</tspan></text><rect x="484.4" y="426.0" width="149.2" height="102.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="494.4" y="442.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">INR y tiempo de</tspan><tspan x="494.4" dy="16">protrombina</tspan></text><text x="494.4" y="475.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Vía extrínseca; INR de 2</tspan><tspan x="494.4" dy="14.5">a 3 en la trombosis</tspan><tspan x="494.4" dy="14.5">venosa</tspan></text><circle cx="484.4" cy="426.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="484.4" y="430.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="484.4" dy="0">3</tspan></text><rect x="647.6" y="570.0" width="149.2" height="118.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="657.6" y="586.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Plaquetas cada 2-3</tspan><tspan x="657.6" dy="16">días</tspan></text><text x="657.6" y="619.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Días 4 a 14; caída mayor</tspan><tspan x="657.6" dy="14.5">de 50 %: suspender</tspan><tspan x="657.6" dy="14.5">(trombocitopenia por</tspan><tspan x="657.6" dy="14.5">heparina)</tspan></text><circle cx="647.6" cy="570.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="647.6" y="574.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="647.6" dy="0">4</tspan></text><rect x="810.8" y="570.0" width="149.2" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="820.8" y="586.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Protamina y vitamina</tspan><tspan x="820.8" dy="16">K</tspan></text><text x="820.8" y="619.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Antídotos de la heparina</tspan><tspan x="820.8" dy="14.5">y de la warfarina</tspan></text><circle cx="810.8" cy="570.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="810.8" y="574.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="810.8" dy="0">5</tspan></text><rect x="40.0" y="719.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="745.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Heparina no fraccionada = TTPa</tspan></text><text x="60.0" y="764.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">INR y tiempo de protrombina controlan la warfarina; las plaquetas vigilan la seguridad.</tspan></text><text x="40.0" y="825.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">MONITOREO SEGÚN EL ANTICOAGULANTE</tspan></text><rect x="40.0" y="837.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="856.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Anticoagulante</tspan></text><text x="320.0" y="856.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Monitoreo</tspan></text><text x="645.0" y="856.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">Antídoto</tspan></text><rect x="40.0" y="866.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="885.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Heparina no fraccionada</tspan></text><text x="320.0" y="885.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">TTPa (anti-Xa si hay resistencia)</tspan></text><text x="645.0" y="885.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">Protamina</tspan></text><rect x="210.6" y="869.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="256.0" y="884.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="256.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="895.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="914.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Heparina de bajo peso molecular</tspan></text><text x="320.0" y="914.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">No de rutina; anti-Xa en obesidad extrema, embarazo o</tspan><tspan x="320.0" dy="15">insuficiencia renal</tspan></text><text x="645.0" y="914.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">Protamina (parcial)</tspan></text><rect x="40.0" y="939.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="958.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Warfarina</tspan></text><text x="320.0" y="958.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">INR (tiempo de protrombina)</tspan></text><text x="645.0" y="958.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">Vitamina K</tspan></text><text x="40.0" y="1008.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1018.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1049.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="1021.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="1049.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">TTPa</tspan></text><text x="435.0" y="1049.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">INR</tspan></text><text x="585.0" y="1040.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Tiempo de</tspan><tspan x="585.0" dy="17">protrombina</tspan></text><text x="735.0" y="1040.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Recuento de</tspan><tspan x="735.0" dy="17">plaquetas</tspan></text><text x="885.0" y="1040.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Dosaje de vitamina</tspan><tspan x="885.0" dy="17">K</tspan></text><rect x="40.0" y="1072.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1072.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1109.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Examen de monitoreo?</tspan></text><text x="285.0" y="1101.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: explora la vía</tspan><tspan x="285.0" dy="16">intrínseca y común</tspan></text><text x="435.0" y="1101.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: sirve para la</tspan><tspan x="435.0" dy="16">warfarina</tspan></text><text x="585.0" y="1093.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: evalúa la vía</tspan><tspan x="585.0" dy="16">extrínseca, para la</tspan><tspan x="585.0" dy="16">warfarina</tspan></text><text x="735.0" y="1101.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no mide el efecto,</tspan><tspan x="735.0" dy="16">vigila trombocitopenia</tspan></text><text x="885.0" y="1093.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no se dosa; es</tspan><tspan x="885.0" dy="16">antídoto de la</tspan><tspan x="885.0" dy="16">warfarina</tspan></text><rect x="40.0" y="1018.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1162.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1190.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1212.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• TTPa: explora las vías intrínseca y común; objetivo de 1,5 a 2,5 veces el control; se mide a las 6 horas del inicio y de cada cambio de dosis.</tspan><tspan x="58.0" dy="18">• Si el TTPa basal está alterado (antifosfolípido) o hay resistencia, se usa la actividad anti-Xa de 0,3 a 0,7 UI/mL.</tspan><tspan x="58.0" dy="18">• INR y tiempo de protrombina (vía extrínseca) son para la warfarina, con INR de 2 a 3 en la trombosis venosa; su antídoto es la vitamina K.</tspan><tspan x="58.0" dy="18">• Alerta: plaquetas cada 2-3 días entre los días 4 y 14; si caen más de 50 %, sospechar trombocitopenia inducida por heparina y suspenderla. Antídoto:</tspan><tspan x="58.0" dy="18">   protamina.</tspan></text><text x="58.0" y="1306.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Garcia et al., Parenteral anticoagulants, CHEST 9.ª ed. (Chest 2012;141:e24S); Stevens et al., CHEST 2021;160:e545; Ortel et al., ASH 2020 guidelines for VTE (Blood</tspan><tspan x="58.0" dy="15">Adv 2020;4:4693).</tspan></text></svg>