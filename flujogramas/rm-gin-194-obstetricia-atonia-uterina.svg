<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1237" viewBox="0 0 1000 1237" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El fármaco inicial en la atonía uterina es la oxitocina: inicio rápido y pocos efectos adversos"><title>El fármaco inicial en la atonía uterina es la oxitocina: inicio rápido y pocos efectos adversos</title><rect x="0.75" y="0.75" width="998.5" height="1235.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · atonía uterina</tspan></text><rect x="357.9" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="437.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="437.6" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Atonía uterina</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Causa cerca de 70 % de las hemorragias posparto: el miometrio no se contrae y no</tspan><tspan x="58.0" dy="17">comprime los vasos.</tspan><tspan x="58.0" dy="17">El manejo es escalonado y simultáneo.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Hemorragia posparto</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Útero blando tras el alumbramiento.</tspan><tspan x="640.0" dy="16">¿Cuál es el medicamento inicial?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SE USA EN CADA ESCALÓN DE LA ATONÍA</tspan></text><rect x="40.0" y="269.0" width="920.0" height="161.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="269.0" width="108.0" height="161.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="353.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Primera línea</tspan></text><rect x="40.0" y="430.0" width="920.0" height="161.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="430.0" width="108.0" height="161.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="510.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Segunda línea</tspan><tspan x="94.0" dy="14">si no responde</tspan></text><rect x="40.0" y="591.0" width="920.0" height="161.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="591.0" width="108.0" height="161.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="671.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Complemento o</tspan><tspan x="94.0" dy="14">rescate</tspan></text><line x1="268.0" y1="349.5" x2="275.0" y2="349.5" stroke="#ea580c" stroke-width="2.2"/><line x1="275.0" y1="349.5" x2="275.0" y2="324.5" stroke="#ea580c" stroke-width="2.2"/><line x1="275.0" y1="324.5" x2="273.0" y2="324.5" stroke="#ea580c" stroke-width="2.2"/><polygon points="273.0,329.5 273.0,319.5 282.0,324.5" fill="#ea580c"/><line x1="392.0" y1="324.5" x2="399.0" y2="324.5" stroke="#0f766e" stroke-width="2.2"/><line x1="399.0" y1="324.5" x2="399.0" y2="485.5" stroke="#0f766e" stroke-width="2.2"/><line x1="399.0" y1="485.5" x2="397.0" y2="485.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="397.0,490.5 397.0,480.5 406.0,485.5" fill="#0f766e"/><line x1="516.0" y1="485.5" x2="523.0" y2="485.5" stroke="#0f766e" stroke-width="2.2"/><line x1="523.0" y1="485.5" x2="523.0" y2="493.5" stroke="#0f766e" stroke-width="2.2"/><line x1="523.0" y1="493.5" x2="521.0" y2="493.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="521.0,498.5 521.0,488.5 530.0,493.5" fill="#0f766e"/><line x1="640.0" y1="493.5" x2="647.0" y2="493.5" stroke="#0f766e" stroke-width="2.2"/><line x1="647.0" y1="493.5" x2="647.0" y2="477.5" stroke="#0f766e" stroke-width="2.2"/><line x1="647.0" y1="477.5" x2="645.0" y2="477.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="645.0,482.5 645.0,472.5 654.0,477.5" fill="#0f766e"/><line x1="764.0" y1="477.5" x2="771.0" y2="477.5" stroke="#0f766e" stroke-width="2.2"/><line x1="771.0" y1="477.5" x2="771.0" y2="655.0" stroke="#0f766e" stroke-width="2.2"/><line x1="771.0" y1="655.0" x2="769.0" y2="655.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="769.0,660.0 769.0,650.0 778.0,655.0" fill="#0f766e"/><line x1="888.0" y1="655.0" x2="895.0" y2="655.0" stroke="#0f766e" stroke-width="2.2"/><line x1="895.0" y1="655.0" x2="895.0" y2="655.5" stroke="#0f766e" stroke-width="2.2"/><line x1="895.0" y1="655.5" x2="893.0" y2="655.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="893.0,660.5 893.0,650.5 902.0,655.5" fill="#0f766e"/><rect x="158.0" y="282.0" width="110.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="90"><tspan x="168.0" dy="0">Masaje</tspan><tspan x="168.0" dy="16">bimanual y</tspan><tspan x="168.0" dy="16">vaciar la vejiga</tspan></text><text x="168.0" y="347.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="90"><tspan x="168.0" dy="0">Vía venosa y</tspan><tspan x="168.0" dy="14.5">reanimación con</tspan><tspan x="168.0" dy="14.5">cristaloides y</tspan><tspan x="168.0" dy="14.5">hemoderivados</tspan></text><circle cx="158.0" cy="282.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="282.0" y="282.0" width="110.0" height="85.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="292.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="90"><tspan x="292.0" dy="0">Oxitocina</tspan></text><text x="292.0" y="315.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="90"><tspan x="292.0" dy="0">Infusión IV; IM si</tspan><tspan x="292.0" dy="14.5">no hay acceso</tspan><tspan x="292.0" dy="14.5">venoso</tspan></text><circle cx="282.0" cy="282.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="282.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="282.0" dy="0">2</tspan></text><rect x="406.0" y="443.0" width="110.0" height="85.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="416.0" y="459.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="90"><tspan x="416.0" dy="0">Ergometrina</tspan></text><text x="416.0" y="476.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="90"><tspan x="416.0" dy="0">Contraindicada</tspan><tspan x="416.0" dy="14.5">en hipertensión y</tspan><tspan x="416.0" dy="14.5">preeclampsia</tspan></text><circle cx="406.0" cy="443.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="406.0" y="447.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="406.0" dy="0">3</tspan></text><rect x="530.0" y="443.0" width="110.0" height="101.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="540.0" y="459.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="90"><tspan x="540.0" dy="0">Carboprost</tspan></text><text x="540.0" y="476.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="90"><tspan x="540.0" dy="0">Prostaglandina</tspan><tspan x="540.0" dy="14.5">F2α;</tspan><tspan x="540.0" dy="14.5">contraindicado en</tspan><tspan x="540.0" dy="14.5">asma</tspan></text><circle cx="530.0" cy="443.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="530.0" y="447.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="530.0" dy="0">4</tspan></text><rect x="654.0" y="443.0" width="110.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="664.0" y="459.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="90"><tspan x="664.0" dy="0">Misoprostol</tspan></text><text x="664.0" y="476.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="90"><tspan x="664.0" dy="0">Prostaglandina</tspan><tspan x="664.0" dy="14.5">E1</tspan></text><circle cx="654.0" cy="443.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="654.0" y="447.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="654.0" dy="0">5</tspan></text><rect x="778.0" y="604.0" width="110.0" height="102.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="788.0" y="620.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="90"><tspan x="788.0" dy="0">Ácido</tspan><tspan x="788.0" dy="16">tranexámico</tspan></text><text x="788.0" y="653.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="90"><tspan x="788.0" dy="0">Antifibrinolítico</tspan><tspan x="788.0" dy="14.5">complementario,</tspan><tspan x="788.0" dy="14.5">no uterotónico</tspan></text><circle cx="778.0" cy="604.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="778.0" y="608.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="778.0" dy="0">6</tspan></text><rect x="902.0" y="604.0" width="110.0" height="103.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="912.0" y="620.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="90"><tspan x="912.0" dy="0">Balón, suturas,</tspan><tspan x="912.0" dy="16">embolización o</tspan><tspan x="912.0" dy="16">histerectomía</tspan></text><text x="912.0" y="669.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="90"><tspan x="912.0" dy="0">Cuando fallan los</tspan><tspan x="912.0" dy="14.5">fármacos</tspan></text><circle cx="902.0" cy="604.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="902.0" y="608.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="902.0" dy="0">7</tspan></text><rect x="40.0" y="770.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="796.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Atonía uterina = oxitocina primero</tspan></text><text x="60.0" y="815.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La carbetocina es de acción larga y se usa más en profilaxis; el ácido tranexámico no contrae el útero.</tspan></text><text x="40.0" y="882.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="892.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="914.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="895.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="914.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Oxitocina</tspan></text><text x="435.0" y="914.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Ergometrina</tspan></text><text x="585.0" y="914.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Misoprostol</tspan></text><text x="735.0" y="914.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ácido tranexámico</tspan></text><text x="885.0" y="914.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Carbetocina</tspan></text><rect x="40.0" y="929.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="929.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="966.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Fármaco inicial?</tspan></text><text x="285.0" y="966.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: inicio rápido</tspan></text><text x="435.0" y="950.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: segunda línea;</tspan><tspan x="435.0" dy="16">contraindicada en</tspan><tspan x="435.0" dy="16">hipertensión</tspan></text><text x="585.0" y="958.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: segunda línea</tspan><tspan x="585.0" dy="16">junto con carboprost</tspan></text><text x="735.0" y="958.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: antifibrinolítico, no</tspan><tspan x="735.0" dy="16">es uterotónico</tspan></text><text x="885.0" y="958.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: se usa sobre todo</tspan><tspan x="885.0" dy="16">en profilaxis</tspan></text><rect x="40.0" y="892.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1019.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1047.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1069.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Factores de riesgo: sobredistensión (gemelar, macrosomía, polihidramnios), multiparidad, trabajo de parto prolongado, corioamnionitis y oxitocina</tspan><tspan x="58.0" dy="18">   prolongada.</tspan><tspan x="58.0" dy="18">• Primero: masaje bimanual, vaciar la vejiga, vía venosa y reanimación con cristaloides y hemoderivados; oxitocina en infusión IV, o IM si no hay acceso.</tspan><tspan x="58.0" dy="18">• Segunda línea: metilergometrina (no en hipertensión ni preeclampsia), carboprost (no en asma) y misoprostol. El ácido tranexámico es antifibrinolítico, no</tspan><tspan x="58.0" dy="18">   uterotónico.</tspan><tspan x="58.0" dy="18">• Si falla: balón de Bakri, suturas compresivas, embolización o histerectomía. La carbetocina se usa sobre todo en profilaxis en cesáreas.</tspan></text><text x="58.0" y="1181.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, Practice Bulletin 183 (2017); ACOG, Clinical Practice Update sobre dispositivos no quirúrgicos en hemorragia posparto (Obstet Gynecol 2025); Williams</tspan><tspan x="58.0" dy="15">Obstetricia, 26.ª ed. (2022).</tspan></text></svg>