<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1131" viewBox="0 0 1000 1131" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El ácido fólico periconcepcional reduce el riesgo de defectos del tubo neural"><title>El ácido fólico periconcepcional reduce el riesgo de defectos del tubo neural</title><rect x="0.75" y="0.75" width="998.5" height="1129.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · ácido fólico y tubo neural</tspan></text><rect x="426.2" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="506.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="506.0" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tubo neural</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se cierra entre los días 21 y 28 posconcepción.</tspan><tspan x="58.0" dy="17">Su falla produce anencefalia, espina bífida y encefalocele.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué defectos reduce la ingesta periconcepcional de</tspan><tspan x="640.0" dy="16">ácido fólico?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CUÁNDO SE TOMA EL ÁCIDO FÓLICO Y CUÁNDO SE CIERRA EL TUBO NEURAL</tspan></text><rect x="40.0" y="269.0" width="920.0" height="34.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="52.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="174"><tspan x="52.0" dy="0">EVENTO</tspan></text><text x="282.2" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="100"><tspan x="282.2" dy="0">1 mes antes</tspan></text><text x="386.8" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="100"><tspan x="386.8" dy="0">Concepción</tspan></text><text x="491.2" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="100"><tspan x="491.2" dy="0">Día 21-28</tspan></text><text x="595.8" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="100"><tspan x="595.8" dy="0">Semana 12</tspan></text><text x="664.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="290"><tspan x="664.0" dy="0">QUÉ SIGNIFICA</tspan></text><rect x="40.0" y="309.0" width="182.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="331.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="50.0" dy="0">Ácido fólico 0,4-0,8 mg al</tspan><tspan x="50.0" dy="16">día</tspan></text><line x1="238.0" y1="335.0" x2="640.0" y2="335.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="282.2" cy="330.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="282.2" y="357.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="100"><tspan x="282.2" dy="0">Inicia</tspan></text><circle cx="386.8" cy="330.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="386.8" y="357.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="100"><tspan x="386.8" dy="0">Continúa</tspan></text><circle cx="491.2" cy="330.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="491.2" y="357.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="100"><tspan x="491.2" dy="0">Continúa</tspan></text><circle cx="595.8" cy="330.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="595.8" y="334.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="595.8" dy="0">✓</tspan></text><text x="595.8" y="357.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="100"><tspan x="595.8" dy="0">Hasta aquí</tspan></text><rect x="660.0" y="309.0" width="300.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="670.0" y="331.5" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="280"><tspan x="670.0" dy="0">Toda mujer que planea o puede embarazarse</tspan><tspan x="670.0" dy="15">(USPSTF 2023).</tspan></text><rect x="40.0" y="367.0" width="182.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="397.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="50.0" dy="0">Cierre del tubo neural</tspan></text><line x1="238.0" y1="393.0" x2="640.0" y2="393.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="491.2" cy="388.0" r="13" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="491.2" y="392.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="491.2" dy="0">!</tspan></text><text x="491.2" y="415.0" font-size="9.5" font-weight="700" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="100"><tspan x="491.2" dy="0">Se cierra</tspan></text><rect x="660.0" y="367.0" width="300.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="670.0" y="397.0" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="280"><tspan x="670.0" dy="0">Ocurre a menudo antes de saber del embarazo.</tspan></text><rect x="40.0" y="425.0" width="182.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="455.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="50.0" dy="0">Ácido fólico 4 mg al día</tspan></text><line x1="238.0" y1="451.0" x2="640.0" y2="451.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="282.2" cy="446.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="282.2" y="473.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="100"><tspan x="282.2" dy="0">Si hay riesgo</tspan></text><circle cx="386.8" cy="446.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="386.8" y="473.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="100"><tspan x="386.8" dy="0">Continúa</tspan></text><circle cx="491.2" cy="446.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="491.2" y="473.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="100"><tspan x="491.2" dy="0">Continúa</tspan></text><circle cx="595.8" cy="446.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="595.8" y="450.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="595.8" dy="0">✓</tspan></text><text x="595.8" y="473.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="100"><tspan x="595.8" dy="0">Hasta aquí</tspan></text><rect x="660.0" y="425.0" width="300.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="670.0" y="455.0" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="280"><tspan x="670.0" dy="0">Hijo previo con defecto o antiepilépticos.</tspan></text><text x="44.0" y="497.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="44.0" dy="0">! = momento del cierre del tubo neural · ✓ = fin de la suplementación</tspan></text><rect x="40.0" y="521.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="547.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Ácido fólico periconcepcional = menos defectos del tubo neural</tspan></text><text x="60.0" y="566.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">No previene defectos cardiacos, digestivos ni óseos.</tspan></text><text x="40.0" y="627.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DOSIS DIARIA DE ÁCIDO FÓLICO ANTES DE LA CONCEPCIÓN</tspan></text><rect x="40.0" y="639.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="658.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Situación</tspan></text><text x="340.0" y="658.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="299"><tspan x="340.0" dy="0">Dosis diaria</tspan></text><text x="655.0" y="658.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="299"><tspan x="655.0" dy="0">Duración</tspan></text><rect x="40.0" y="668.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="687.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Mujer que planea embarazo</tspan></text><text x="340.0" y="687.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="340.0" dy="0">0,4 a 0,8 mg</tspan></text><text x="655.0" y="687.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="655.0" dy="0">Desde al menos 1 mes antes hasta la semana 12</tspan></text><rect x="230.6" y="671.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="276.0" y="686.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="276.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="697.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="716.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Hijo previo con defecto del tubo neural</tspan></text><text x="340.0" y="716.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="340.0" dy="0">4 mg</tspan></text><text x="655.0" y="716.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="655.0" dy="0">Antes de la concepción y en el primer trimestre</tspan></text><rect x="40.0" y="726.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="745.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="274"><tspan x="50.0" dy="0">Antiepilépticos (valproato, carbamazepina)</tspan></text><text x="340.0" y="745.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="340.0" dy="0">4 mg</tspan></text><text x="655.0" y="745.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="299"><tspan x="655.0" dy="0">Antes de la concepción y en el primer trimestre</tspan></text><text x="40.0" y="795.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="805.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="836.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="836.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Cardiacos</tspan></text><text x="435.0" y="836.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Del tubo digestivo</tspan></text><rect x="513.0" y="808.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="836.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Del tubo neural</tspan></text><text x="735.0" y="836.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Óseos</tspan></text><text x="885.0" y="827.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Migración de</tspan><tspan x="885.0" dy="17">células germinales</tspan></text><rect x="40.0" y="859.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="859.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="896.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué defectos reduce?</tspan></text><text x="285.0" y="888.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no es el efecto</tspan><tspan x="285.0" dy="16">demostrado</tspan></text><text x="435.0" y="888.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no es el efecto</tspan><tspan x="435.0" dy="16">demostrado</tspan></text><text x="585.0" y="880.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: previene</tspan><tspan x="585.0" dy="16">anencefalia, espina</tspan><tspan x="585.0" dy="16">bífida y encefalocele</tspan></text><text x="735.0" y="888.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no es el efecto</tspan><tspan x="735.0" dy="16">demostrado</tspan></text><text x="885.0" y="888.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no es el efecto</tspan><tspan x="885.0" dy="16">demostrado</tspan></text><rect x="40.0" y="805.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="949.0" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="977.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="999.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El cierre ocurre a menudo antes de saber del embarazo: por eso el ácido fólico debe empezar antes de la concepción.</tspan><tspan x="58.0" dy="18">• USPSTF 2023: toda mujer que planea o puede embarazarse toma 0,4 a 0,8 mg diarios desde al menos 1 mes antes y durante las primeras 12 semanas.</tspan><tspan x="58.0" dy="18">• Con un hijo previo con defecto del tubo neural, o con antiepilépticos como valproato o carbamazepina, la dosis es de 4 mg diarios.</tspan><tspan x="58.0" dy="18">• MRC 1991: 4 mg diarios redujeron 72 % la recurrencia; el folato interviene en la síntesis de nucleótidos.</tspan></text><text x="58.0" y="1075.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: USPSTF, Suplementación con ácido fólico para prevenir defectos del tubo neural (JAMA 2023); MRC Vitamin Study Research Group (Lancet 1991); Williams Obstetricia,</tspan><tspan x="58.0" dy="15">26.ª ed. (2022).</tspan></text></svg>