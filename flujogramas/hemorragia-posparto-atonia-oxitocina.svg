<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="968" viewBox="0 0 1000 968" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Hemorragia posparto con útero blando por encima del ombligo y placenta completa: oxitocina endovenosa"><title>Hemorragia posparto con útero blando por encima del ombligo y placenta completa: oxitocina endovenosa</title><rect x="0.75" y="0.75" width="998.5" height="966.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Hemorragia posparto · atonía uterina</tspan></text><rect x="418.0" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="505.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="505.2" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Atonía uterina</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El útero no se contrae tras el alumbramiento: los vasos del lecho placentario siguen</tspan><tspan x="58.0" dy="17">abiertos.</tspan><tspan x="58.0" dy="17">Útero blando y por encima del ombligo; causa del 70 % de las hemorragias posparto.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Puérpera de 28 años, cuarto parto</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Sangrado abundante 20 minutos después del</tspan><tspan x="640.0" dy="16">alumbramiento.</tspan><tspan x="640.0" dy="16">Útero blando, por encima del ombligo; placenta</tspan><tspan x="640.0" dy="16">completa.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ESCALERA DE LA ATONÍA UTERINA</tspan></text><rect x="70.0" y="311.0" width="34.0" height="330.0" rx="17" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="75.0" y="562.5" width="24.0" height="74.5" rx="8" fill="#10b981" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="599.8" x2="130.0" y2="599.8" stroke="#0f766e" stroke-width="3"/><rect x="130.0" y="563.5" width="330.0" height="72.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="144.0" y="585.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Oxitocina</tspan></text><text x="240.0" y="585.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">+ masaje</tspan></text><text x="144.0" y="606.5" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Y ácido tranexámico</tspan></text><rect x="354.6" y="552.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="400.0" y="567.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="400.0" dy="0">◆ ESTE CASO</tspan></text><rect x="75.0" y="480.0" width="24.0" height="74.5" rx="8" fill="#f59e0b" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="517.2" x2="130.0" y2="517.2" stroke="#f59e0b" stroke-width="2"/><rect x="130.0" y="481.0" width="330.0" height="72.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="503.0" font-size="12" font-weight="800" font-style="normal" fill="#f59e0b" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">2.º uterotónico</tspan></text><text x="240.0" y="503.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Ergometrina</tspan></text><text x="144.0" y="524.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Misoprostol, carbetocina</tspan></text><rect x="75.0" y="397.5" width="24.0" height="74.5" rx="8" fill="#f97316" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="434.8" x2="130.0" y2="434.8" stroke="#f97316" stroke-width="2"/><rect x="130.0" y="398.5" width="330.0" height="72.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="420.5" font-size="12" font-weight="800" font-style="normal" fill="#f97316" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Balón</tspan></text><text x="240.0" y="420.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Intrauterino</tspan></text><text x="144.0" y="441.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Taponamiento</tspan></text><rect x="75.0" y="315.0" width="24.0" height="74.5" rx="8" fill="#e11d48" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="352.2" x2="130.0" y2="352.2" stroke="#e11d48" stroke-width="2"/><rect x="130.0" y="316.0" width="330.0" height="72.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="338.0" font-size="12" font-weight="800" font-style="normal" fill="#e11d48" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Cirugía</tspan></text><text x="240.0" y="338.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Suturas, ligadura</tspan></text><text x="144.0" y="359.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Histerectomía</tspan></text><text x="470.0" y="315.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="490"><tspan x="470.0" dy="0">AHORA</tspan></text><rect x="470.0" y="329.0" width="490.0" height="84.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><circle cx="498.0" cy="371.0" r="17" fill="#ffffff" stroke="none" stroke-width="0"/><text x="498.0" y="376.0" font-size="15" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">1</tspan></text><text x="528.0" y="364.0" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Masaje + oxitocina EV</tspan></text><text x="528.0" y="387.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Primera medida</tspan></text><rect x="844.6" y="318.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="333.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><line x1="498.0" y1="415.0" x2="498.0" y2="428.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,427.0 503.0,427.0 498.0,435.0" fill="#0f766e"/><rect x="470.0" y="437.0" width="490.0" height="84.0" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="479.0" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="484.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">2</tspan></text><text x="528.0" y="472.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Ácido tranexámico</tspan></text><text x="528.0" y="495.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">1 g EV en &lt; 3 h</tspan></text><line x1="498.0" y1="523.0" x2="498.0" y2="536.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,535.0 503.0,535.0 498.0,543.0" fill="#0f766e"/><rect x="470.0" y="545.0" width="490.0" height="84.0" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="587.0" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="592.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">3</tspan></text><text x="528.0" y="580.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Si no cede</tspan></text><text x="528.0" y="603.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Segundo uterotónico</tspan></text><text x="40.0" y="681.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="691.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="722.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="694.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="713.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Oxitocina</tspan><tspan x="285.0" dy="17">endovenosa</tspan></text><text x="435.0" y="722.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Misoprostol solo</tspan></text><text x="585.0" y="713.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Ácido tranexámico</tspan><tspan x="585.0" dy="17">solo</tspan></text><text x="735.0" y="713.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Sulfato de</tspan><tspan x="735.0" dy="17">magnesio</tspan></text><text x="885.0" y="722.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Nifedipino oral</tspan></text><rect x="40.0" y="745.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="745.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="774.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Primera medida?</tspan></text><text x="285.0" y="766.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: uterotónico de</tspan><tspan x="285.0" dy="16">elección</tspan></text><text x="435.0" y="774.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Segunda línea</tspan></text><text x="585.0" y="766.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Complementa, no</tspan><tspan x="585.0" dy="16">reemplaza</tspan></text><text x="735.0" y="774.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: relaja el útero</tspan></text><text x="885.0" y="774.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: tocolítico</tspan></text><rect x="40.0" y="691.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="819.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="847.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="869.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Primero: masaje uterino + oxitocina EV (10-40 UI en infusión) y ácido tranexámico 1 g en las primeras 3 horas.</tspan><tspan x="58.0" dy="18">• Si no responde: ergometrina (si no es hipertensa), misoprostol o carbetocina; luego balón intrauterino.</tspan><tspan x="58.0" dy="18">• Si persiste: suturas compresivas, ligaduras o histerectomía.</tspan></text><text x="58.0" y="927.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, recomendaciones de hemorragia posparto (2023); FIGO (2022); MINSA Perú, código rojo.</tspan></text></svg>