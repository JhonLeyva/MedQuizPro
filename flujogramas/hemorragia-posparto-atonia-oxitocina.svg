<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="652" viewBox="0 0 1000 652" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Hemorragia posparto por atonía uterina"><title>Hemorragia posparto por atonía uterina</title><rect x="0.75" y="0.75" width="998.5" height="650.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16" y="16" width="968" height="68" rx="10" fill="#0f766e"/><text x="36" y="57.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170" y1="40.0" x2="170" y2="60.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="46.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">GINECOLOGÍA Y OBSTETRICIA ENAM: HEMORRAGIA POSPARTO POR</tspan><tspan x="184.0" dy="16">ATONÍA UTERINA</tspan></text><rect x="745.5" y="38.0" width="218.5" height="24" rx="12" fill="#134e4a"/><text x="854.8" y="54.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="202"><tspan x="854.8" dy="0">GINECOLOGÍA Y OBSTETRICIA</tspan></text><rect x="190.0" y="102.0" width="620" height="86.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="500.0" y="130.5" font-size="14.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Puérpera de 28 años, cuarto parto, sangrado abundante a los</tspan><tspan x="500.0" dy="19.0">20 min</tspan></text><text x="500.0" y="172.0" font-size="12" font-weight="400" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Útero blando por encima del ombligo · placenta completa</tspan></text><line x1="500.0" y1="188.0" x2="500.0" y2="207.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,206.0 505.0,206.0 500.0,214.0" fill="#0f766e"/><rect x="40.0" y="214.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="62.0" cy="238.0" r="13" fill="#0f766e"/><text x="62.0" y="243.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><rect x="74.0" y="214.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="88.0" y="241.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="88.0" dy="0">Alerta</tspan></text><text x="88.0" y="264.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="88.0" dy="0">Activar la clave roja y pedir</tspan><tspan x="88.0" dy="17">ayuda</tspan></text><line x1="335.0" y1="255.5" x2="345.0" y2="255.5" stroke="#0f766e" stroke-width="2"/><polygon points="344.0,250.5 344.0,260.5 352.0,255.5" fill="#0f766e"/><rect x="354.0" y="214.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="376.0" cy="238.0" r="13" fill="#0f766e"/><text x="376.0" y="243.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="376.0" dy="0">2</tspan></text><rect x="388.0" y="214.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="402.0" y="241.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="402.0" dy="0">Masaje</tspan></text><text x="402.0" y="264.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="402.0" dy="0">Masaje uterino bimanual y</tspan><tspan x="402.0" dy="17">vaciar la vejiga</tspan></text><line x1="649.0" y1="255.5" x2="659.0" y2="255.5" stroke="#0f766e" stroke-width="2"/><polygon points="658.0,250.5 658.0,260.5 666.0,255.5" fill="#0f766e"/><rect x="668.0" y="214.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="690.0" cy="238.0" r="13" fill="#0f766e"/><text x="690.0" y="243.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="690.0" dy="0">3</tspan></text><rect x="702.0" y="214.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="716.0" y="241.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="716.0" dy="0">Oxitocina</tspan></text><text x="716.0" y="264.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="716.0" dy="0">Oxitocina EV: uterotónico de</tspan><tspan x="716.0" dy="17">primera línea</tspan></text><line x1="500.0" y1="297.0" x2="500.0" y2="316.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#0f766e"/><rect x="40.0" y="323.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="62.0" cy="347.0" r="13" fill="#0f766e"/><text x="62.0" y="352.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">4</tspan></text><rect x="74.0" y="323.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="88.0" y="350.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="88.0" dy="0">Tranexámico</tspan></text><text x="88.0" y="373.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="88.0" dy="0">1 g EV dentro de las 3 horas</tspan><tspan x="88.0" dy="17">del parto</tspan></text><line x1="335.0" y1="364.5" x2="345.0" y2="364.5" stroke="#0f766e" stroke-width="2"/><polygon points="344.0,359.5 344.0,369.5 352.0,364.5" fill="#0f766e"/><rect x="354.0" y="323.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="376.0" cy="347.0" r="13" fill="#0f766e"/><text x="376.0" y="352.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="376.0" dy="0">5</tspan></text><rect x="388.0" y="323.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="402.0" y="350.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="402.0" dy="0">2.ª línea</tspan></text><text x="402.0" y="373.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="402.0" dy="0">Ergometrina (no en hipertensas)</tspan><tspan x="402.0" dy="17">o misoprostol</tspan></text><line x1="649.0" y1="364.5" x2="659.0" y2="364.5" stroke="#0f766e" stroke-width="2"/><polygon points="658.0,359.5 658.0,369.5 666.0,364.5" fill="#0f766e"/><rect x="668.0" y="323.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="690.0" cy="347.0" r="13" fill="#0f766e"/><text x="690.0" y="352.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="690.0" dy="0">6</tspan></text><rect x="702.0" y="323.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="716.0" y="350.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="716.0" dy="0">Refractaria</tspan></text><text x="716.0" y="373.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="716.0" dy="0">Balón intrauterino, traje</tspan><tspan x="716.0" dy="17">antichoque, cirugía</tspan></text><line x1="500.0" y1="406.0" x2="500.0" y2="425.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,424.0 505.0,424.0 500.0,432.0" fill="#0f766e"/><rect x="90.0" y="432.0" width="820" height="67.5" rx="10" fill="#134e4a" stroke="#134e4a" stroke-width="1.5"/><text x="500.0" y="458.0" font-size="12" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="792"><tspan x="500.0" dy="0">PRIMERA MEDIDA FARMACOLÓGICA</tspan></text><text x="500.0" y="483.5" font-size="15" font-weight="400" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="792"><tspan x="500.0" dy="0">Oxitocina endovenosa</tspan></text><rect x="40" y="525.5" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="553.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="575.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Las 4 T: tono (atonía, la más frecuente), trauma, tejido y trombina.</tspan><tspan x="58.0" dy="18">• Sulfato de magnesio y nifedipino relajan el útero: empeoran la atonía.</tspan></text><text x="58.0" y="615.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA – Guía técnica de emergencias obstétricas (clave roja) · OMS 2023 Hemorragia posparto</tspan></text></svg>
