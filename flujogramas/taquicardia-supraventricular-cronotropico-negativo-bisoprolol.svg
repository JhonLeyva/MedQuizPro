00"><tspan x="40.0" dy="0">✓ = dato que coincide con el caso</tspan></text><rect x="40.0" y="760.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="788.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="810.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Verapamilo y diltiazem también bajan la frecuencia.</tspan><tspan x="58.0" dy="18">• La furosemida no tiene efecto cronotrópico.</tspan><tspan x="58.0" dy="18">• Crisis de TSV: maniobras vagales y adenosina.</tspan></text><text x="58.0" y="868.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ESC – Guidelines for supraventricular tachycardia (2019) · Goodman &amp; Gilman 14.ª ed. (2023)</tspan></text></svg>