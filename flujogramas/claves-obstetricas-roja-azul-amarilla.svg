172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">VÍAS</tspan></text><text x="190.0" y="426.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Dos vías gruesas, cristaloides</tspan></text><rect x="40.0" y="469.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="470.0" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="190.0" y="502.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">SANGRE</tspan></text><text x="190.0" y="526.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Pedir y transfundir</tspan></text><rect x="660.0" y="319.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="320.0" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="352.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">ÚTERO</tspan></text><text x="810.0" y="376.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Masaje + oxitocina</tspan></text><rect x="660.0" y="419.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="420.0" width="6.0" height="82.0" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="452.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">CAUSA</tspan></text><text x="810.0" y="476.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Tono, trauma, tejido, trombina</tspan></text><text x="40.0" y="589.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="601.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="625.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Activar la clave</tspan></text><line x1="248.5" y1="621.5" x2="267.5" y2="621.5" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,616.5 266.5,626.5 274.5,621.5" fill="#0f766e"/><rect x="278.5" y="601.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="625.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Asignar roles</tspan></text><line x1="487.0" y1="621.5" x2="506.0" y2="621.5" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,616.5 505.0,626.5 513.0,621.5" fill="#0f766e"/><rect x="517.0" y="601.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="625.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Reponer volumen</tspan></text><line x1="725.5" y1="621.5" x2="744.5" y2="621.5" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,616.5 743.5,626.5 751.5,621.5" fill="#0f766e"/><rect x="755.5" y="601.0" width="204.5" height="41.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="625.5" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Tratar la causa</tspan></text><text x="40.0" y="682.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CAUSAS CON NOMBRE PROPIO</tspan></text><rect x="40.0" y="694.0" width="920.0" height="179.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><line x1="62.0" y1="736.0" x2="938.0" y2="736.0" stroke="#0f766e" stroke-width="2"/><line x1="62.0" y1="736.0" x2="62.0" y2="744.0" stroke="#0f766e" stroke-width="2"/><line x1="938.0" y1="736.0" x2="938.0" y2="744.0" stroke="#0f766e" stroke-width="2"/><rect x="377.0" y="724.0" width="246.1" height="24.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/><text x="500.0" y="740.0" font-size="10.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="232"><tspan x="500.0" dy="0">LAS 4 T DE LA HEMORRAGIA POSPARTO</tspan></text><rect x="56.0" y="756.0" width="213.0" height="70.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="76.0" cy="779.0" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="76.0" y="783.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="76.0" dy="0">1</tspan></text><text x="94.0" y="784.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="167"><tspan x="94.0" dy="0">Tono</tspan></text><text x="68.0" y="810.0" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="189"><tspan x="68.0" dy="0">Atonía uterina (70 %)</tspan></text><rect x="281.0" y="756.0" width="213.0" height="70.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="301.0" cy="779.0" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="301.0" y="783.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="301.0" dy="0">2</tspan></text><text x="319.0" y="784.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="167"><tspan x="319.0" dy="0">Trauma</tspan></text><text x="293.0" y="810.0" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="189"><tspan x="293.0" dy="0">Desgarros, rotura</tspan></text><rect x="506.0" y="756.0" width="213.0" height="70.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="526.0" cy="779.0" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="526.0" y="783.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="526.0" dy="0">3</tspan></text><text x="544.0" y="784.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="167"><tspan x="544.0" dy="0">Tejido</tspan></text><text x="518.0" y="810.0" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="189"><tspan x="518.0" dy="0">Restos placentarios</tspan></text><rect x="731.0" y="756.0" width="213.0" height="70.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="751.0" cy="779.0" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="751.0" y="783.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="751.0" dy="0">4</tspan></text><text x="769.0" y="784.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="167"><tspan x="769.0" dy="0">Trombina</tspan></text><text x="743.0" y="810.0" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="189"><tspan x="743.0" dy="0">Coagulopatía</tspan></text><text x="56.0" y="853.0" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">Buscar las 4 T mientras se repone volumen.</tspan></text><text x="40.0" y="913.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="923.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="962.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="962.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Infecciones</tspan></text><text x="435.0" y="945.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Enfermedad</tspan><tspan x="435.0" dy="17">hipertensiva del</tspan><tspan x="435.0" dy="17">embarazo</tspan></text><rect x="513.0" y="926.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="962.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Hemorragias</tspan></text><text x="735.0" y="954.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ruptura prematura</tspan><tspan x="735.0" dy="17">de membranas</tspan></text><text x="885.0" y="954.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Trabajo de parto</tspan><tspan x="885.0" dy="17">prolongado</tspan></text><rect x="40.0" y="994.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="994.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1023.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Clave roja?</tspan></text><text x="285.0" y="1023.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es la amarilla</tspan></text><text x="435.0" y="1023.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es la azul</tspan></text><text x="585.0" y="1015.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: hemorragia</tspan><tspan x="585.0" dy="16">obstétrica</tspan></text><text x="735.0" y="1023.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No tiene clave propia</tspan></text><text x="885.0" y="1023.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No tiene clave propia</tspan></text><rect x="40.0" y="923.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1068.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1096.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1118.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Roja: activar, dos vías gruesas, cristaloides, sangre, oxitocina y buscar la causa (4 T).</tspan><tspan x="58.0" dy="18">• Ácido tranexámico 1 g EV en las primeras 3 horas de la hemorragia posparto.</tspan><tspan x="58.0" dy="18">• Azul: sulfato de magnesio y control de la PA; amarilla: antibiótico y líquidos en la primera hora.</tspan></text><text x="58.0" y="1176.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA Perú, guía de manejo de emergencias obstétricas (claves); OMS, hemorragia posparto (2023).</tspan></text></svg>