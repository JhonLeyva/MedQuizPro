<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="865" viewBox="0 0 1000 865" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Lactante de 5 meses con lactancia exclusiva y Hb 11,5 (sin anemia): suplementación preventiva con hierro a 2 mg/kg/día"><title>Lactante de 5 meses con lactancia exclusiva y Hb 11,5 (sin anemia): suplementación preventiva con hierro a 2 mg/kg/día</title><rect x="0.75" y="0.75" width="998.5" height="863.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Prevención de la anemia infantil</tspan></text><rect x="389.4" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="445.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="445.8" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hierro preventivo (MINSA)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Nacidos a término con peso adecuado: desde los 4 meses, 2 mg/kg/día de hierro elemental</tspan><tspan x="58.0" dy="17">en gotas (sulfato ferroso o complejo polimaltosado).</tspan><tspan x="58.0" dy="17">Con anemia la dosis es de tratamiento (3 mg/kg/día); los prematuros empiezan al mes.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 5 meses</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactancia materna exclusiva; asintomático.</tspan><tspan x="640.0" dy="16">Hb 11,5 g/dL (sin anemia).</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CALCULA LA DOSIS DE HIERRO</tspan></text><rect x="40.0" y="269.0" width="170.0" height="93.0" rx="16" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="125.0" y="295.0" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="150"><tspan x="125.0" dy="0">PESO DEL CASO</tspan></text><text x="125.0" y="331.0" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">~7 kg</tspan></text><text x="125.0" y="353.0" font-size="11" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="146"><tspan x="125.0" dy="0">Lactante de 5 meses</tspan></text><line x1="214.0" y1="315.5" x2="229.0" y2="315.5" stroke="#0f766e" stroke-width="2"/><polygon points="228.0,310.5 228.0,320.5 236.0,315.5" fill="#0f766e"/><rect x="240.0" y="269.0" width="213.3" height="93.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="346.7" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="197"><tspan x="346.7" dy="0">DOSIS PREVENTIVA</tspan></text><text x="346.7" y="325.0" font-size="22" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="197"><tspan x="346.7" dy="0">2 mg/kg/día</tspan></text><text x="346.7" y="347.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="193"><tspan x="346.7" dy="0">Sin anemia</tspan></text><text x="473.3" y="326.5" font-size="30" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="40"><tspan x="473.3" dy="0">×</tspan></text><rect x="493.3" y="269.0" width="213.3" height="93.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="600.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="197"><tspan x="600.0" dy="0">PESO</tspan></text><text x="600.0" y="325.0" font-size="22" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="197"><tspan x="600.0" dy="0">~7 kg</tspan></text><text x="600.0" y="347.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="193"><tspan x="600.0" dy="0">Estimado</tspan></text><text x="726.7" y="326.5" font-size="30" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="40"><tspan x="726.7" dy="0">=</tspan></text><rect x="746.7" y="269.0" width="213.3" height="93.0" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="853.3" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="197"><tspan x="853.3" dy="0">TOTAL</tspan></text><text x="853.3" y="325.0" font-size="22" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="197"><tspan x="853.3" dy="0">≈ 14 mg/día</tspan></text><text x="853.3" y="347.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="193"><tspan x="853.3" dy="0">Hierro elemental</tspan></text><rect x="793.2" y="351.0" width="120.4" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="853.3" y="366.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="853.3" dy="0">◆ DOSIS DEL CASO</tspan></text><text x="44.0" y="398.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="44.0" dy="0">CADA ALTERNATIVA CONTRA EL CÁLCULO</tspan></text><rect x="40.0" y="408.0" width="222.5" height="73.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="151.2" y="426.0" font-size="9.5" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="206"><tspan x="151.2" dy="0">✓ COINCIDE</tspan></text><text x="151.2" y="444.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="202"><tspan x="151.2" dy="0">2 mg/kg/día</tspan></text><text x="151.2" y="461.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="202"><tspan x="151.2" dy="0">Preventiva</tspan></text><rect x="272.5" y="408.0" width="222.5" height="73.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="383.8" y="426.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="206"><tspan x="383.8" dy="0">✗ NO</tspan></text><text x="383.8" y="444.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="202"><tspan x="383.8" dy="0">3 mg/kg/día</tspan></text><text x="383.8" y="461.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="202"><tspan x="383.8" dy="0">Si hubiera anemia</tspan></text><rect x="505.0" y="408.0" width="222.5" height="73.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="616.2" y="426.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="206"><tspan x="616.2" dy="0">✗ NO</tspan></text><text x="616.2" y="444.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="202"><tspan x="616.2" dy="0">4-6 mg/kg/día</tspan></text><text x="616.2" y="461.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="202"><tspan x="616.2" dy="0">Muy alta</tspan></text><rect x="737.5" y="408.0" width="222.5" height="73.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="848.8" y="426.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="206"><tspan x="848.8" dy="0">✗ NO</tspan></text><text x="848.8" y="444.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="202"><tspan x="848.8" dy="0">1 mg/kg/día</tspan></text><text x="848.8" y="461.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="202"><tspan x="848.8" dy="0">Insuficiente</tspan></text><rect x="40.0" y="499.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="525.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">2 mg/kg/día</tspan></text><text x="60.0" y="544.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Es prevención: Hb 11,5 no es anemia.</tspan></text><text x="40.0" y="611.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="621.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="643.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="643.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">6</tspan></text><text x="435.0" y="643.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">4</tspan></text><rect x="513.0" y="624.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="643.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">2</tspan></text><text x="735.0" y="643.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">1</tspan></text><text x="885.0" y="643.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">10</tspan></text><rect x="40.0" y="658.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="658.0" width="144.0" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="679.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Dosis?</tspan></text><text x="285.0" y="679.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: muy alta</tspan></text><text x="435.0" y="679.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: alta</tspan></text><text x="585.0" y="679.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: preventiva</tspan></text><text x="735.0" y="679.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: insuficiente</tspan></text><text x="885.0" y="679.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: tóxica</tspan></text><rect x="40.0" y="621.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="716.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="744.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="766.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• 2 mg/kg/día hasta los 6 meses; luego micronutrientes o hierro hasta los 12-35 meses según la norma.</tspan><tspan x="58.0" dy="18">• Darlo lejos de la leche si es posible; las heces pueden ponerse oscuras.</tspan><tspan x="58.0" dy="18">• Control de Hb a los 6 meses.</tspan></text><text x="58.0" y="824.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA Perú, NTS de prevención y control de la anemia (RM 251-2024-MINSA).</tspan></text></svg>