<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1115" viewBox="0 0 1000 1115" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Lactante con fiebre sin foco, vómitos y mal crecimiento: se sospecha infección urinaria"><title>Lactante con fiebre sin foco, vómitos y mal crecimiento: se sospecha infección urinaria</title><rect x="0.75" y="0.75" width="998.5" height="1113.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · infección urinaria</tspan></text><rect x="367.5" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="416.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="416.5" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección del tracto urinario</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección bacteriana grave más frecuente del lactante febril.</tspan><tspan x="58.0" dy="17">E. coli desde el periné contaminado por heces; más común en niñas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante mujer de 18 meses</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Diarreas a repetición, hiporexia y poca ganancia de</tspan><tspan x="640.0" dy="16">peso.</tspan><tspan x="640.0" dy="16">Fiebre alta y vómitos; reacción inflamatoria fecal</tspan><tspan x="640.0" dy="16">negativa.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE LLEGA A LA INFECCIÓN URINARIA</tspan></text><text x="614.0" y="313.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,325.0 580.0,325.0 543.8,401.0 76.2,401.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="341.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="373.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="424"><tspan x="310.0" dy="0">Lactante febril sin foco, con vómitos y mal crecimiento</tspan></text><line x1="565.9" y1="363.0" x2="606.0" y2="363.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="334.0" width="145.7" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="686.8" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="686.8" dy="0">Intolerancia a la lactosa</tspan></text><rect x="765.7" y="334.0" width="145.0" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="838.1" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="838.1" dy="0">Intoxicación alimentaria</tspan></text><rect x="614.0" y="366.0" width="65.2" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="646.6" y="383.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="646.6" dy="0">Gastritis</tspan></text><rect x="685.2" y="366.0" width="118.8" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="744.6" y="383.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="744.6" dy="0">Diarrea bacteriana</tspan></text><rect x="810.0" y="366.0" width="111.6" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="865.8" y="383.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="865.8" dy="0">Infección urinaria</tspan></text><polygon points="76.2,405.0 543.8,405.0 507.5,465.0 112.5,465.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="138.5" cy="435.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="138.5" y="439.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="138.5" dy="0">1</tspan></text><text x="320.0" y="431.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="331"><tspan x="320.0" dy="0">¿Hay fiebre alta? La intolerancia a la lactosa no la</tspan><tspan x="320.0" dy="17">produce</tspan></text><line x1="529.6" y1="435.0" x2="606.0" y2="435.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="422.0" width="157.7" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="692.9" y="439.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="692.9" dy="0">✕ Intolerancia a la lactosa</tspan></text><line x1="636.0" y1="435.5" x2="761.7" y2="435.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="112.5,469.0 507.5,469.0 471.2,529.0 148.8,529.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="174.8" cy="499.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="174.8" y="503.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="174.8" dy="0">2</tspan></text><text x="320.0" y="495.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="258"><tspan x="320.0" dy="0">¿Es agudo y breve, con comida</tspan><tspan x="320.0" dy="17">sospechosa?</tspan></text><line x1="493.4" y1="499.0" x2="606.0" y2="499.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="486.0" width="157.1" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="692.5" y="503.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="692.5" dy="0">✕ Intoxicación alimentaria</tspan></text><line x1="636.0" y1="499.5" x2="761.1" y2="499.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="148.8,533.0 471.2,533.0 435.0,610.0 185.0,610.0" fill="#5eead4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="571.5" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="575.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">3</tspan></text><text x="320.0" y="559.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">¿Hay deposiciones agudas o</tspan><tspan x="320.0" dy="17">reacción inflamatoria fecal</tspan><tspan x="320.0" dy="17">positiva?</tspan></text><line x1="457.1" y1="571.5" x2="606.0" y2="571.5" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="558.5" width="77.3" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="652.6" y="576.0" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="652.6" dy="0">✕ Gastritis</tspan></text><line x1="636.0" y1="572.0" x2="681.3" y2="572.0" stroke="#94a3b8" stroke-width="1.2"/><rect x="697.3" y="558.5" width="130.9" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="762.7" y="576.0" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="762.7" dy="0">✕ Diarrea bacteriana</tspan></text><line x1="719.3" y1="572.0" x2="818.2" y2="572.0" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="614.0" x2="310.0" y2="633.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,632.0 315.0,632.0 310.0,640.0" fill="#0f766e"/><rect x="140.0" y="644.0" width="340.0" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="673.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">INFECCIÓN URINARIA</tspan></text><text x="310.0" y="697.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Uroanálisis y urocultivo por sondaje</tspan><tspan x="310.0" dy="17">Antibiótico 7 a 14 días</tspan></text><rect x="370.6" y="633.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="648.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="651.9" width="346.0" height="76.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="671.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="689.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">Confirmación: 50 000 UFC/mL o más de un uropatógeno</tspan><tspan x="628.0" dy="16">en muestra por sondaje o punción suprapúbica.</tspan></text><text x="40.0" y="775.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="785.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="816.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="808.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Intolerancia a la</tspan><tspan x="285.0" dy="17">lactosa</tspan></text><text x="435.0" y="808.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Intoxicación</tspan><tspan x="435.0" dy="17">alimentaria</tspan></text><text x="585.0" y="816.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Gastritis</tspan></text><rect x="663.0" y="788.9" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="816.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Infección urinaria</tspan></text><text x="885.0" y="816.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Diarrea bacteriana</tspan></text><rect x="40.0" y="839.9" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="839.9" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="876.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Sospecha?</tspan></text><text x="285.0" y="876.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no produce fiebre</tspan></text><text x="435.0" y="868.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: cuadro agudo y</tspan><tspan x="435.0" dy="16">breve</tspan></text><text x="585.0" y="876.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: rara a esta edad</tspan></text><text x="735.0" y="868.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: fiebre sin foco en</tspan><tspan x="735.0" dy="16">lactante mujer</tspan></text><text x="885.0" y="860.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: la reacción</tspan><tspan x="885.0" dy="16">inflamatoria fecal es</tspan><tspan x="885.0" dy="16">negativa</tspan></text><rect x="40.0" y="785.9" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="929.9" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="957.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="979.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Sospecha en toda niña menor de 2 años con fiebre sin foco, con vómitos, irritabilidad o estancamiento ponderal.</tspan><tspan x="58.0" dy="18">• Diagnóstico (AAP 2011, 2 a 24 meses): uroanálisis con piuria o nitritos más urocultivo por sondaje o punción suprapúbica con 50 000 UFC/mL o más de</tspan><tspan x="58.0" dy="18">   un uropatógeno.</tspan><tspan x="58.0" dy="18">• Tratamiento antibiótico de 7 a 14 días, oral si tolera; luego ecografía renal.</tspan><tspan x="58.0" dy="18">• Alerta: el urocultivo por bolsa colectora no confirma el diagnóstico por su alta contaminación.</tspan></text><text x="58.0" y="1073.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAP, Subcomité de Infección Urinaria, Guía para lactantes febriles de 2 a 24 meses (Pediatrics 2011;128:595-610); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>