<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1158" viewBox="0 0 1000 1158" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Dolor pélvico, flujo mucopurulento y dolor a la movilización cervical: enfermedad inflamatoria pélvica"><title>Dolor pélvico, flujo mucopurulento y dolor a la movilización cervical: enfermedad inflamatoria pélvica</title><rect x="0.75" y="0.75" width="998.5" height="1156.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ginecología · enfermedad inflamatoria pélvica</tspan></text><rect x="471.4" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="551.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="551.2" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Enfermedad inflamatoria pélvica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección ascendente del tracto genital superior: endometritis, salpingitis o absceso</tspan><tspan x="58.0" dy="17">tuboovárico.</tspan><tspan x="58.0" dy="17">Agentes: Chlamydia, gonococo y flora polimicrobiana.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 30 años, casada</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Flujo mucopurulento y dolor en hipogastrio y fosas</tspan><tspan x="640.0" dy="16">ilíacas, sin retraso menstrual.</tspan><tspan x="640.0" dy="16">Dolor intenso uterino y a la movilización del cérvix; sin</tspan><tspan x="640.0" dy="16">masas.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CRITERIOS MÍNIMOS PARA TRATAR LA ENFERMEDAD INFLAMATORIA PÉLVICA</tspan></text><rect x="40.0" y="301.0" width="602.0" height="34.0" rx="10" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.2"/><text x="56.0" y="323.0" font-size="11.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="452"><tspan x="56.0" dy="0">CRITERIOS DEL CDC 2021</tspan></text><text x="626.0" y="323.0" font-size="10.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="end" data-max="100"><tspan x="626.0" dy="0">EN EL CASO</tspan></text><rect x="40.0" y="341.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,356.5 74.0,376.5 50.0,376.5" fill="#dc2626"/><text x="62.0" y="373.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="364.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Mujer sexualmente activa con dolor pélvico o abdominal bajo</tspan></text><text x="84.0" y="381.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Sin otra causa que lo explique</tspan></text><text x="626.0" y="371.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="400.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,415.5 74.0,435.5 50.0,435.5" fill="#dc2626"/><text x="62.0" y="432.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="423.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Dolor a la movilización del cuello uterino</tspan></text><text x="84.0" y="440.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Signo mínimo: basta uno de los tres</tspan></text><text x="626.0" y="430.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="459.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,474.5 74.0,494.5 50.0,494.5" fill="#dc2626"/><text x="62.0" y="491.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="482.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Dolor a la palpación del útero</tspan></text><text x="84.0" y="499.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Signo mínimo</tspan></text><text x="626.0" y="489.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="518.0" width="602.0" height="53.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><polygon points="62.0,533.5 74.0,553.5 50.0,553.5" fill="#cbd5e1"/><text x="62.0" y="550.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="541.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Dolor anexial o masa</tspan></text><text x="84.0" y="558.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Sin masas en el caso; la masa sugiere absceso</tspan></text><text x="626.0" y="548.5" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">No</tspan></text><rect x="40.0" y="577.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,592.5 74.0,612.5 50.0,612.5" fill="#dc2626"/><text x="62.0" y="609.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="600.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Flujo mucopurulento o leucocitos en el fresco</tspan></text><text x="84.0" y="617.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Refuerza el diagnóstico</tspan></text><text x="626.0" y="607.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="636.0" width="602.0" height="53.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><polygon points="62.0,651.5 74.0,671.5 50.0,671.5" fill="#cbd5e1"/><text x="62.0" y="668.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="659.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Fiebre, VSG o PCR elevadas</tspan></text><text x="84.0" y="676.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Refuerzan, pero no son necesarias</tspan></text><text x="626.0" y="666.5" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sin dato</tspan></text><rect x="660.0" y="301.0" width="300.0" height="388.0" rx="12" fill="#dc2626" stroke="none" stroke-width="1.5"/><text x="676.0" y="325.0" font-size="10.5" font-weight="800" font-style="normal" fill="#fecaca" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">CON UN SIGNO MÍNIMO</tspan></text><text x="676.0" y="454.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">Tratar de inmediato, sin esperar</tspan><tspan x="676.0" dy="17">cultivos</tspan></text><text x="676.0" y="488.0" font-size="12" font-weight="500" font-style="normal" fill="#fee2e2" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">Ceftriaxona 500 mg IM única + doxiciclina 100</tspan><tspan x="676.0" dy="16">mg c/12 h + metronidazol 500 mg c/12 h por</tspan><tspan x="676.0" dy="16">14 días. Hospitalizar si hay absceso</tspan><tspan x="676.0" dy="16">tuboovárico, gestación, vómitos, fiebre alta o</tspan><tspan x="676.0" dy="16">falta de mejoría en 72 h. Tratar también a la</tspan><tspan x="676.0" dy="16">pareja y estudiar sífilis y VIH.</tspan></text><rect x="40.0" y="707.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="733.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Dolor pélvico + dolor a la movilización cervical = enfermedad inflamatoria pélvica</tspan></text><text x="60.0" y="752.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Las vaginitis no producen dolor pélvico ni dolor cervical.</tspan></text><text x="40.0" y="819.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="829.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="860.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="832.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="851.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Enfermedad</tspan><tspan x="285.0" dy="17">inflamatoria pélvica</tspan></text><text x="435.0" y="851.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Trichomoniasis</tspan><tspan x="435.0" dy="17">vaginal</tspan></text><text x="585.0" y="860.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Vaginitis herpética</tspan></text><text x="735.0" y="851.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Vaginosis</tspan><tspan x="735.0" dy="17">bacteriana</tspan></text><text x="885.0" y="851.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Vulvovaginitis</tspan><tspan x="885.0" dy="17">candidiásica</tspan></text><rect x="40.0" y="883.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="883.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="912.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico más</tspan><tspan x="54.0" dy="16">probable?</tspan></text><text x="285.0" y="904.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: dolor pélvico con</tspan><tspan x="285.0" dy="16">dolor a la movilización</tspan><tspan x="285.0" dy="16">cervical</tspan></text><text x="435.0" y="912.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: flujo espumoso, sin</tspan><tspan x="435.0" dy="16">dolor pélvico</tspan></text><text x="585.0" y="912.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: vesículas y úlceras</tspan><tspan x="585.0" dy="16">dolorosas</tspan></text><text x="735.0" y="912.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: flujo con olor, sin</tspan><tspan x="735.0" dy="16">dolor pélvico</tspan></text><text x="885.0" y="912.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: prurito y flujo</tspan><tspan x="885.0" dy="16">grumoso</tspan></text><rect x="40.0" y="829.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="973.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1001.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1023.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Por su baja especificidad clínica, se trata a toda mujer sexualmente activa con dolor pélvico sin otra causa y con dolor a la movilización cervical, uterino o</tspan><tspan x="58.0" dy="18">   anexial.</tspan><tspan x="58.0" dy="18">• Descartar siempre embarazo ectópico con β-hCG; el flujo mucopurulento, la fiebre mayor de 38,3 °C, la VSG o la PCR elevadas refuerzan el diagnóstico.</tspan><tspan x="58.0" dy="18">• Esquema ambulatorio (CDC 2021): ceftriaxona 500 mg IM única, doxiciclina 100 mg c/12 h y metronidazol 500 mg c/12 h por 14 días; tratar a la pareja.</tspan><tspan x="58.0" dy="18">• Hospitalizar si hay absceso tuboovárico, gestación, vómitos o fiebre alta, o falta de mejoría en 72 h. Secuelas: infertilidad, ectópico y dolor crónico.</tspan></text><text x="58.0" y="1117.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, STI Treatment Guidelines (MMWR 2021;70[4]); Williams Obstetricia 26.ª ed. (2022); Harrison 21.ª ed. (2022)</tspan></text></svg>