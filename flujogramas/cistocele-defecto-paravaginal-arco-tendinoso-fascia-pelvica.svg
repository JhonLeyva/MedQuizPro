<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1087" viewBox="0 0 1000 1087" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Defecto paravaginal: se desinserta el arco tendinoso de la fascia pélvica"><title>Defecto paravaginal: se desinserta el arco tendinoso de la fascia pélvica</title><rect x="0.75" y="0.75" width="998.5" height="1085.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Piso pélvico · soporte de la pared vaginal anterior</tspan></text><rect x="493.3" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="580.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="580.5" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Soporte de la pared vaginal anterior</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La fascia pubocervical sostiene la vejiga.</tspan><tspan x="58.0" dy="17">A los lados se fija en el arco tendinoso de la fascia pélvica (línea blanca).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 62 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pérdida de orina y sensación de bulto.</tspan><tspan x="640.0" dy="16">Cistocele grado II por desinserción lateral de la fascia</tspan><tspan x="640.0" dy="16">pubocervical.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ESTRUCTURAS DEL SOPORTE PÉLVICO</tspan></text><rect x="40.0" y="285.0" width="440.0" height="400.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="295.0" width="211.6" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">PISO PÉLVICO VISTO DESDE ARRIBA</tspan></text><g transform="translate(64.0,319.0) scale(1.2)"><path d="M165 18 C100 20 50 60 34 120 C28 170 60 214 110 226 L220 226 C270 214 302 170 296 120 C280 60 230 20 165 18 Z" fill="#f5f5f4" stroke="#a8a29e" stroke-width="3" stroke-linejoin="round" /><path d="M130 24 L200 24 L196 40 L134 40 Z" fill="#e7e5e4" stroke="#a8a29e" stroke-width="2" stroke-linejoin="round" /><text x="165" y="36" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">pubis</text><circle cx="62" cy="170" r="7" fill="#e7e5e4" stroke="#a8a29e" stroke-width="2" /><circle cx="268" cy="170" r="7" fill="#e7e5e4" stroke="#a8a29e" stroke-width="2" /><text x="58" y="194" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">espina</text><text x="272" y="194" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">ciática</text><path d="M136 40 L62 170" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" /><path d="M136 40 L62 170" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round" /><path d="M194 40 L268 170" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" /><path d="M194 40 L268 170" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linejoin="round" /><path d="M140 70 C150 66 180 66 190 70 L196 160 C180 170 150 170 134 160 Z" fill="#fce7f3" stroke="#be185d" stroke-width="2" stroke-linejoin="round" /><text x="165" y="120" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">vagina y</text><text x="165" y="120" font-size="10" font-weight="800" fill="#be185d" text-anchor="middle" data-max="0">vagina y</text><text x="165" y="134" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">fascia</text><text x="165" y="134" font-size="10" font-weight="800" fill="#be185d" text-anchor="middle" data-max="0">fascia</text><path d="M190 90 L230 92 M192 130 L246 134" fill="none" stroke="#be185d" stroke-width="2" stroke-linejoin="round" /><path d="M140 90 L118 92 M138 130 L108 134" fill="none" stroke="#ea580c" stroke-width="2" stroke-linejoin="round" stroke-dasharray="4 3"/><text x="18" y="60" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">ATFP (línea blanca)</text><text x="18" y="60" font-size="10.5" font-weight="800" fill="#134e4a" text-anchor="start" data-max="0">ATFP (línea blanca)</text><line x1="80" y1="64" x2="96" y2="100" stroke="#0f766e" stroke-width="1.3"/><circle cx="96" cy="100" r="2.6" fill="#0f766e"/><text x="10" y="130" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">desinsertada:</text><text x="10" y="130" font-size="10.5" font-weight="800" fill="#ea580c" text-anchor="start" data-max="0">desinsertada:</text><text x="10" y="144" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">defecto paravaginal</text><text x="10" y="144" font-size="10.5" font-weight="800" fill="#ea580c" text-anchor="start" data-max="0">defecto paravaginal</text></g><rect x="48.0" y="652.0" width="424.0" height="27.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0"/><text x="260.0" y="673.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="410"><tspan x="260.0" dy="0">Verde: ATFP de cada lado. Naranja: el lado donde la fascia se despegó.</tspan></text><rect x="500.0" y="285.0" width="460.0" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="501.0" y="286.0" width="6.0" height="67.0" rx="3" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="518.0" y="309.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">1. Arco tendinoso de la fascia pélvica</tspan></text><text x="518.0" y="330.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Soporte lateral de la pared vaginal anterior: el de este caso.</tspan></text><rect x="860.2" y="274.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="905.6" y="289.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="905.6" dy="0">◆ ESTE CASO</tspan></text><rect x="500.0" y="364.0" width="460.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="501.0" y="365.0" width="6.0" height="67.0" rx="3" fill="#94a3b8" stroke="none" stroke-width="1.5"/><text x="518.0" y="388.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">2. Ligamento ancho</tspan></text><text x="518.0" y="409.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Pliegue de peritoneo sobre trompas y anexos; no sostiene la vagina.</tspan></text><rect x="500.0" y="443.0" width="460.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="501.0" y="444.0" width="6.0" height="67.0" rx="3" fill="#94a3b8" stroke="none" stroke-width="1.5"/><text x="518.0" y="467.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">3. Ligamento redondo</tspan></text><text x="518.0" y="488.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Mantiene la anteversión del útero; no sostiene la vagina.</tspan></text><rect x="500.0" y="522.0" width="460.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="501.0" y="523.0" width="6.0" height="67.0" rx="3" fill="#94a3b8" stroke="none" stroke-width="1.5"/><text x="518.0" y="546.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">4. Fascia rectovaginal</tspan></text><text x="518.0" y="567.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Soporte de la pared posterior: su defecto da rectocele.</tspan></text><rect x="40.0" y="699.0" width="920.0" height="78.0" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="60.0" y="725.0" font-size="13" font-weight="800" font-style="normal" fill="#92400e" text-anchor="start" data-max="700"><tspan x="60.0" dy="0">Cómo se reconoce en el examen</tspan></text><text x="60.0" y="745.0" font-size="11.5" font-weight="500" font-style="normal" fill="#78350f" text-anchor="start" data-max="700"><tspan x="60.0" dy="0">Cistocele con los surcos laterales de la vagina borrados; al elevar con una pinza los surcos, el bulto desaparece.</tspan><tspan x="60.0" dy="16">Se repara reinsertando la fascia al ATFP (reparación paravaginal).</tspan></text><text x="40.0" y="817.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="827.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="849.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Ligamento ancho</tspan></text><text x="491.2" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Ligamento redondo</tspan></text><rect x="588.0" y="830.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="678.8" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Arco tendinoso</tspan></text><text x="866.2" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Fascia rectovaginal</tspan></text><rect x="40.0" y="864.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="588.0" y="864.0" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="885.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Sostiene la pared</tspan><tspan x="54.0" dy="16">anterior?</tspan></text><text x="303.8" y="893.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No</tspan></text><text x="491.2" y="893.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No</tspan></text><text x="678.8" y="893.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Sí, lateralmente</tspan></text><text x="866.2" y="893.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No: es la posterior</tspan></text><rect x="40.0" y="827.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="938.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="966.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="988.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Defecto paravaginal (lateral) = la fascia pubocervical se despegó del arco tendinoso (ATFP).</tspan><tspan x="58.0" dy="18">• Defecto central = la fascia se rompe en la línea media (se corrige con colporrafia anterior).</tspan><tspan x="58.0" dy="18">• El ATFP va de la cara posterior del pubis a la espina ciática.</tspan></text><text x="58.0" y="1046.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: DeLancey JO, niveles de soporte vaginal; Te Linde Ginecología Quirúrgica 12.ª ed.</tspan></text></svg>