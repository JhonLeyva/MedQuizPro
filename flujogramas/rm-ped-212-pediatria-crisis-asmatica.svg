<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1006" viewBox="0 0 1000 1006" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El sulfato de magnesio IV se reserva para la crisis asmática severa que no mejora en la primera hora"><title>El sulfato de magnesio IV se reserva para la crisis asmática severa que no mejora en la primera hora</title><rect x="0.75" y="0.75" width="998.5" height="1004.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · crisis asmática</tspan></text><rect x="353.2" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="402.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="402.2" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Exacerbación de asma</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se trata de forma escalonada según la gravedad.</tspan><tspan x="58.0" dy="17">Base: salbutamol con espaciador, oxígeno y corticoide sistémico precoz.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Escolar en crisis asmática</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuándo se usa el sulfato de magnesio?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SE AÑADE SEGÚN LA GRAVEDAD DE LA CRISIS</tspan></text><rect x="40.0" y="253.0" width="920.0" height="95.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="253.0" width="108.0" height="95.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="304.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Leve</tspan></text><rect x="40.0" y="348.0" width="920.0" height="95.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="348.0" width="108.0" height="95.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="399.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Moderada</tspan></text><rect x="40.0" y="443.0" width="920.0" height="95.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="443.0" width="108.0" height="95.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="494.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Severa</tspan></text><line x1="348.0" y1="300.5" x2="355.0" y2="300.5" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="300.5" x2="355.0" y2="387.5" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="387.5" x2="353.0" y2="387.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="353.0,392.5 353.0,382.5 362.0,387.5" fill="#0f766e"/><line x1="552.0" y1="387.5" x2="559.0" y2="387.5" stroke="#0f766e" stroke-width="2.2"/><line x1="559.0" y1="387.5" x2="559.0" y2="490.5" stroke="#0f766e" stroke-width="2.2"/><line x1="559.0" y1="490.5" x2="557.0" y2="490.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="557.0,495.5 557.0,485.5 566.0,490.5" fill="#0f766e"/><line x1="756.0" y1="490.5" x2="763.0" y2="490.5" stroke="#ea580c" stroke-width="2.2"/><line x1="763.0" y1="490.5" x2="763.0" y2="490.5" stroke="#ea580c" stroke-width="2.2"/><line x1="763.0" y1="490.5" x2="761.0" y2="490.5" stroke="#ea580c" stroke-width="2.2"/><polygon points="761.0,495.5 761.0,485.5 770.0,490.5" fill="#ea580c"/><rect x="158.0" y="266.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="282.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Salbutamol y corticoide</tspan></text><text x="168.0" y="299.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Con cámara espaciadora;</tspan><tspan x="168.0" dy="14.5">prednisolona oral</tspan></text><circle cx="158.0" cy="266.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="270.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="362.0" y="361.0" width="190.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="372.0" y="377.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Ipratropio y oxígeno</tspan></text><text x="372.0" y="394.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Se suman al salbutamol repetido</tspan></text><circle cx="362.0" cy="361.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="362.0" y="365.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="362.0" dy="0">2</tspan></text><rect x="566.0" y="456.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="576.0" y="472.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Terapia intensiva</tspan></text><text x="576.0" y="489.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Todo lo anterior, saturación de 94</tspan><tspan x="576.0" dy="14.5">a 98 %</tspan></text><circle cx="566.0" cy="456.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="566.0" y="460.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="566.0" dy="0">3</tspan></text><rect x="770.0" y="456.0" width="190.0" height="69.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="780.0" y="472.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Sulfato de magnesio IV</tspan></text><text x="780.0" y="489.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">40 a 50 mg/kg en 20 min si no</tspan><tspan x="780.0" dy="14.5">mejora en la primera hora</tspan></text><circle cx="770.0" cy="456.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="770.0" y="460.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="770.0" dy="0">4</tspan></text><rect x="40.0" y="556.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="582.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Crisis severa sin mejoría = sulfato de magnesio IV</tspan></text><text x="60.0" y="601.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">En crisis leve o moderada no aporta beneficio y no se da desde el inicio.</tspan></text><text x="40.0" y="668.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="678.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="709.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="681.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="700.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Crisis asmática</tspan><tspan x="285.0" dy="17">severa</tspan></text><text x="435.0" y="700.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Desde el inicio de la</tspan><tspan x="435.0" dy="17">crisis</tspan></text><text x="585.0" y="700.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Crisis asmática</tspan><tspan x="585.0" dy="17">moderada</tspan></text><text x="735.0" y="709.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">En ningún momento</tspan></text><text x="885.0" y="709.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Crisis asmática leve</tspan></text><rect x="40.0" y="732.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="732.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="753.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Cuándo se usa el</tspan><tspan x="54.0" dy="16">magnesio?</tspan></text><text x="285.0" y="753.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: severa, sin mejoría</tspan><tspan x="285.0" dy="16">en la primera hora</tspan></text><text x="435.0" y="753.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no se indica desde</tspan><tspan x="435.0" dy="16">el inicio</tspan></text><text x="585.0" y="753.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sin beneficio</tspan><tspan x="585.0" dy="16">adicional</tspan></text><text x="735.0" y="753.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: sí tiene lugar en la</tspan><tspan x="735.0" dy="16">severa</tspan></text><text x="885.0" y="753.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: sin beneficio</tspan><tspan x="885.0" dy="16">adicional</tspan></text><rect x="40.0" y="678.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="806.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="834.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="856.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Terapia inicial: salbutamol repetido con cámara, oxígeno para saturación de 94 a 98 % y prednisolona o prednisona oral de 1 a 2 mg/kg.</tspan><tspan x="58.0" dy="18">• Moderada a grave: se añade bromuro de ipratropio. El magnesio IV (40 a 50 mg/kg, máximo 2 g, en 20 minutos) es para la severa sin mejoría en la</tspan><tspan x="58.0" dy="18">   primera hora.</tspan><tspan x="58.0" dy="18">• En la leve o moderada no aporta beneficio. El magnesio nebulizado no se recomienda de rutina; vigilar presión arterial y reflejos durante la infusión.</tspan><tspan x="58.0" dy="18">• Alerta: silencio auscultatorio, cianosis o alteración de la conciencia indican paro inminente: cuidados intensivos.</tspan></text><text x="58.0" y="950.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: GINA 2025; Cochrane, escalada del tratamiento en exacerbaciones del asma en niños (Cochrane Database Syst Rev 2020); Nelson Tratado de Pediatría, 22.ª ed.</tspan><tspan x="58.0" dy="15">(2024).</tspan></text></svg>