<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1182" viewBox="0 0 1000 1182" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Convulsión generalizada de 10 minutos, única, con fiebre a los 8 meses: convulsión febril simple"><title>Convulsión generalizada de 10 minutos, única, con fiebre a los 8 meses: convulsión febril simple</title><rect x="0.75" y="0.75" width="998.5" height="1180.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neurología pediátrica · convulsión febril simple</tspan></text><rect x="479.6" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="528.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="528.6" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Convulsión febril</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Crisis con fiebre en un niño de 6 meses a 5 años, sin infección del SNC.</tspan><tspan x="58.0" dy="17">Afecta al 2 a 5 % de los niños.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 8 meses</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Fiebre y convulsión tónico-clónica generalizada de 10</tspan><tspan x="640.0" dy="16">minutos, hace 24 horas.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE LLEGA AL DIAGNÓSTICO</tspan></text><text x="614.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,293.0 580.0,293.0 531.7,369.0 88.3,369.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="309.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="332.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="399"><tspan x="310.0" dy="0">Lactante de 8 meses con fiebre y convulsión tónico-clónica</tspan><tspan x="310.0" dy="17">generalizada de 10 minutos</tspan></text><line x1="559.8" y1="331.0" x2="606.0" y2="331.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="302.0" width="159.4" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="693.7" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="693.7" dy="0">Convulsión febril compleja</tspan></text><rect x="779.4" y="302.0" width="155.4" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="857.1" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="857.1" dy="0">Convulsión parcial simple</tspan></text><rect x="614.0" y="334.0" width="108.4" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="668.2" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="668.2" dy="0">Espasmo infantil</tspan></text><rect x="728.4" y="334.0" width="176.4" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="816.6" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="816.6" dy="0">Síndrome de Lennox-Gastaut</tspan></text><polygon points="88.3,373.0 531.7,373.0 483.3,433.0 136.7,433.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="162.7" cy="403.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="162.7" y="407.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="162.7" dy="0">1</tspan></text><text x="320.0" y="399.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="283"><tspan x="320.0" dy="0">¿Fue focal, mayor de 15 minutos o se</tspan><tspan x="320.0" dy="17">repitió en 24 horas?</tspan></text><line x1="511.5" y1="403.0" x2="606.0" y2="403.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="390.0" width="171.5" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="699.7" y="407.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="699.7" dy="0">✕ Convulsión febril compleja</tspan></text><line x1="636.0" y1="403.5" x2="775.5" y2="403.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="791.5" y="390.0" width="167.5" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="875.2" y="407.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="875.2" dy="0">✕ Convulsión parcial simple</tspan></text><line x1="813.5" y1="403.5" x2="949.0" y2="403.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="136.7,437.0 483.3,437.0 435.0,514.0 185.0,514.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="475.5" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="479.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">2</tspan></text><text x="320.0" y="463.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">¿Hay espasmos sin fiebre o</tspan><tspan x="320.0" dy="17">crisis múltiples con retraso</tspan><tspan x="320.0" dy="17">cognitivo?</tspan></text><line x1="463.2" y1="475.5" x2="606.0" y2="475.5" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="462.5" width="120.4" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="674.2" y="480.0" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="674.2" dy="0">✕ Espasmo infantil</tspan></text><line x1="636.0" y1="476.0" x2="724.4" y2="476.0" stroke="#94a3b8" stroke-width="1.2"/><rect x="740.4" y="462.5" width="188.5" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="834.7" y="480.0" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="834.7" dy="0">✕ Síndrome de Lennox-Gastaut</tspan></text><line x1="762.4" y1="476.0" x2="918.9" y2="476.0" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="518.0" x2="310.0" y2="537.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,536.0 315.0,536.0 310.0,544.0" fill="#0f766e"/><rect x="140.0" y="548.0" width="340.0" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="577.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">CONVULSIÓN FEBRIL SIMPLE</tspan></text><text x="310.0" y="601.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Sin imagen ni EEG de rutina</tspan><tspan x="310.0" dy="17">No necesita anticonvulsivante de profilaxis</tspan></text><rect x="370.6" y="537.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="552.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="555.9" width="346.0" height="76.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="575.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="593.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">Punción lumbar solo si hay signos meníngeos o menor de</tspan><tspan x="628.0" dy="16">12 meses con vacunación incompleta.</tspan></text><text x="40.0" y="673.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CONVULSIÓN FEBRIL SIMPLE FRENTE A COMPLEJA (AAP 2011)</tspan></text><rect x="40.0" y="685.9" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="704.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Tipo</tspan></text><text x="270.0" y="704.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Características</tspan></text><text x="620.0" y="704.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Conducta</tspan></text><rect x="40.0" y="714.9" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="733.9" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Simple</tspan></text><text x="270.0" y="733.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Generalizada, menor de 15 minutos, una sola en 24 horas</tspan></text><text x="620.0" y="733.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Sin imagen ni EEG de rutina; sin profilaxis</tspan></text><rect x="160.6" y="718.4" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="206.0" y="733.4" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="206.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="743.9" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="762.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Compleja</tspan></text><text x="270.0" y="762.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Focal, mayor de 15 minutos o recurrente en 24 horas</tspan></text><text x="620.0" y="762.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Evaluación más amplia; punción lumbar, imagen o EEG</tspan><tspan x="620.0" dy="15">según el caso</tspan></text><text x="40.0" y="827.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="837.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="868.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="840.9" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="860.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Convulsión febril</tspan><tspan x="285.0" dy="17">simple</tspan></text><text x="435.0" y="860.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Convulsión febril</tspan><tspan x="435.0" dy="17">compleja</tspan></text><text x="585.0" y="860.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Convulsión parcial</tspan><tspan x="585.0" dy="17">simple</tspan></text><text x="735.0" y="868.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Espasmo infantil</tspan></text><text x="885.0" y="860.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Síndrome de</tspan><tspan x="885.0" dy="17">Lennox-Gastaut</tspan></text><rect x="40.0" y="891.9" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="891.9" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="928.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tipo de convulsión?</tspan></text><text x="285.0" y="912.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: generalizada,</tspan><tspan x="285.0" dy="16">menor de 15 minutos y</tspan><tspan x="285.0" dy="16">única</tspan></text><text x="435.0" y="912.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: exigiría crisis focal,</tspan><tspan x="435.0" dy="16">prolongada o</tspan><tspan x="435.0" dy="16">recurrente</tspan></text><text x="585.0" y="920.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es focal y sin</tspan><tspan x="585.0" dy="16">pérdida de conciencia</tspan></text><text x="735.0" y="920.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: síndrome de West,</tspan><tspan x="735.0" dy="16">sin fiebre</tspan></text><text x="885.0" y="920.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: niños mayores con</tspan><tspan x="885.0" dy="16">varios tipos de crisis</tspan></text><rect x="40.0" y="837.9" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="981.9" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1009.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1031.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Simple: generalizada, menor de 15 minutos y sin repetirse en 24 horas. Compleja: focal, prolongada o recurrente.</tspan><tspan x="58.0" dy="18">• Este caso cumple todos los criterios de simple. Descartan otras opciones: la crisis parcial es focal, el espasmo infantil no tiene fiebre y Lennox-Gastaut es</tspan><tspan x="58.0" dy="18">   de niños mayores.</tspan><tspan x="58.0" dy="18">• Recurrencia cerca de 30 %; riesgo de epilepsia apenas mayor que en la población. No se indica imagen ni EEG de rutina.</tspan><tspan x="58.0" dy="18">• Punción lumbar si hay signos meníngeos o antes de los 12 meses con vacunación incompleta. No requiere profilaxis anticonvulsivante.</tspan></text><text x="58.0" y="1125.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAP, Seguimiento de la primera convulsión febril simple (Pediatrics 2011); AAP, Neurodiagnóstico en la primera convulsión febril simple (Pediatrics 2011); Nelson Tratado</tspan><tspan x="58.0" dy="15">de Pediatría 22.ª ed. (2024).</tspan></text></svg>