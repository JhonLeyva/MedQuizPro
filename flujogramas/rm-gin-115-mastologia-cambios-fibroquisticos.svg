stroke-width="1.5"/><text x="201.0" y="887.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="201.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="898.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="917.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="199"><tspan x="50.0" dy="0">Masa sólida o dominante</tspan></text><text x="265.0" y="917.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="265.0" dy="0">Ecografía y biopsia con aguja gruesa</tspan></text><text x="617.5" y="917.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="617.5" dy="0">Según la histología</tspan></text><text x="40.0" y="967.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="977.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1008.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1008.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Eliminar el café</tspan></text><rect x="363.0" y="980.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="999.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Vitamina E 400 mg</tspan><tspan x="435.0" dy="17">diarios por 6 meses</tspan></text><text x="585.0" y="999.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Vitamina B6 100 mg</tspan><tspan x="585.0" dy="17">al día</tspan></text><text x="735.0" y="1008.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Evitar el chocolate</tspan></text><text x="885.0" y="999.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Ácido fólico 8 mg</tspan><tspan x="885.0" dy="17">por 3 meses</tspan></text><rect x="40.0" y="1031.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="1031.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1068.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tratamiento indicado?</tspan></text><text x="285.0" y="1068.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: sin respaldo sólido</tspan></text><text x="435.0" y="1052.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: suplemento</tspan><tspan x="435.0" dy="16">tradicional aceptado</tspan><tspan x="435.0" dy="16">por el examen</tspan></text><text x="585.0" y="1068.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sin respaldo sólido</tspan></text><text x="735.0" y="1068.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: sin respaldo sólido</tspan></text><text x="885.0" y="1060.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: la dosis de 8 mg</tspan><tspan x="885.0" dy="16">no tiene respaldo</tspan></text><rect x="40.0" y="977.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1121.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1149.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1171.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Menor de 30-35 años: la ecografía es el estudio inicial; un quiste simple sintomático se aspira. El nódulo blando y móvil es sobre todo quiste o</tspan><tspan x="58.0" dy="18">   fibroadenoma.</tspan><tspan x="58.0" dy="18">• Tratamiento de apoyo: sostén adecuado, analgésicos o AINE y tranquilizar. Vitamina E es la opción que el examen da por correcta, con evidencia débil.</tspan><tspan x="58.0" dy="18">• Sin respaldo sólido: reducir café o chocolate, vitamina B6 y ácido fólico a dosis altas. Tamoxifeno o danazol solo en dolor intenso y refractario.</tspan><tspan x="58.0" dy="18">• Alerta: masa dominante, sólida o que reaparece tras la aspiración exige imagen y biopsia con aguja gruesa.</tspan></text><text x="58.0" y="1265.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Berek &amp; Novak Ginecología, 16.ª ed. (2020); Williams Ginecología, 4.ª ed. (2020).</tspan></text></svg>