<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1185" viewBox="0 0 1000 1185" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Recién nacido deprimido con meconio, apneico y bradicárdico: se libera la vía aérea (intubación y aspiración) antes de ventilar"><title>Recién nacido deprimido con meconio, apneico y bradicárdico: se libera la vía aérea (intubación y aspiración) antes de ventilar</title><rect x="0.75" y="0.75" width="998.5" height="1184.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neonatología · meconio y reanimación</tspan></text><rect x="427.6" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="476.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="476.7" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Líquido teñido de meconio</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El sufrimiento fetal y el post-término producen jadeo intrauterino y aspiración de meconio.</tspan><tspan x="58.0" dy="17">Obstruye la vía aérea, inactiva el surfactante y causa hipertensión pulmonar.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Recién nacido post-término</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Cesárea por sufrimiento fetal con meconio.</tspan><tspan x="640.0" dy="16">Deprimido, sin esfuerzo respiratorio, bradicárdico y</tspan><tspan x="640.0" dy="16">cianótico.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="395.0" x2="811.3" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="395.0" x2="188.7" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,423.0 193.7,423.0 188.7,431.0" fill="#94a3b8"/><line x1="500.0" y1="395.0" x2="500.0" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,423.0 505.0,423.0 500.0,431.0" fill="#94a3b8"/><line x1="811.3" y1="395.0" x2="811.3" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,423.0 816.3,423.0 811.3,431.0" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#0f766e"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="395.0" x2="811.3" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="811.3" y1="395.0" x2="811.3" y2="424.0" stroke="#0f766e" stroke-width="3"/><polygon points="806.3,423.0 816.3,423.0 811.3,431.0" fill="#0f766e"/><rect x="69.4" y="404.0" width="238.5" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="188.7" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">Vigoroso: llora, buen tono, FC mayor de 100</tspan></text><rect x="384.2" y="404.0" width="231.6" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="500.0" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">Respira con dificultad leve, sin bradicardia</tspan></text><rect x="675.3" y="404.0" width="272.0" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="811.3" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">No vigoroso: apnea, FC baja y cianosis (este caso)</tspan></text><polygon points="240.0,336.0 266.0,307.0 734.0,307.0 760.0,336.0 734.0,365.0 266.0,365.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="336.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="341.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="340.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Recién nacido con líquido teñido de meconio: ¿vigoroso?</tspan></text><rect x="40.0" y="431.0" width="297.3" height="107.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="188.7" y="467.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">CUIDADO DE RUTINA</tspan></text><text x="188.7" y="490.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Calor, secar y estimular</tspan><tspan x="188.7" dy="17">Sin aspiración traqueal</tspan></text><rect x="351.3" y="431.0" width="297.3" height="107.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="467.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">SOPORTE NO INVASIVO</tspan></text><text x="500.0" y="490.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Vía aérea abierta y oxígeno si hace falta</tspan><tspan x="500.0" dy="17">Vigilar la saturación</tspan></text><rect x="662.7" y="431.0" width="297.3" height="107.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="811.3" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">INTUBACIÓN Y ASPIRACIÓN</tspan></text><text x="811.3" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Libera la vía aérea antes de ventilar</tspan><tspan x="811.3" dy="17">Guías 2020: ventilar pronto; intubar si hay</tspan><tspan x="811.3" dy="17">obstrucción</tspan></text><text x="40.0" y="572.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">MECONIO: QUÉ SE HACE SEGÚN EL ESTADO DEL RECIÉN NACIDO</tspan></text><rect x="40.0" y="584.5" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="603.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Estado</tspan></text><text x="280.0" y="603.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Conducta</tspan></text><text x="625.0" y="603.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Nota</tspan></text><rect x="40.0" y="613.5" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="632.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Vigoroso</tspan></text><text x="280.0" y="632.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Cuidado de rutina</tspan></text><text x="625.0" y="632.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">No se aspira la tráquea</tspan></text><rect x="40.0" y="642.5" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="661.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Respira, levemente deprimido</tspan></text><text x="280.0" y="661.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Soporte no invasivo y oxígeno si hace falta</tspan></text><text x="625.0" y="661.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Secar y estimular son pasos iniciales</tspan></text><rect x="40.0" y="671.5" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="690.5" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">No vigoroso</tspan></text><text x="280.0" y="690.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Intubación y aspiración (clave); guías 2020: ventilación en el</tspan><tspan x="280.0" dy="15">primer minuto</tspan></text><text x="625.0" y="690.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">No retrasar la ventilación por aspirar</tspan></text><rect x="170.6" y="682.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="216.0" y="697.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="216.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="731.5" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Clave D del libro; las guías AHA/AAP 2020 ya no piden aspirar de rutina, pero entre las opciones D es la mejor.</tspan></text><text x="40.0" y="778.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="788.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="828.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="828.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Secado enérgico</tspan></text><text x="435.0" y="819.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Oxígeno en cánula</tspan><tspan x="435.0" dy="17">binasal</tspan></text><text x="585.0" y="828.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Estimulación táctil</tspan></text><rect x="663.0" y="791.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="811.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Intubación</tspan><tspan x="735.0" dy="17">endotraqueal y</tspan><tspan x="735.0" dy="17">aspiración</tspan></text><text x="885.0" y="819.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Óxido nítrico</tspan><tspan x="885.0" dy="17">inhalado</tspan></text><rect x="40.0" y="859.5" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="859.5" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="896.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Conducta a seguir?</tspan></text><text x="285.0" y="888.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es un paso para el</tspan><tspan x="285.0" dy="16">neonato que respira</tspan></text><text x="435.0" y="880.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no da presión</tspan><tspan x="435.0" dy="16">positiva a un neonato</tspan><tspan x="435.0" dy="16">apneico</tspan></text><text x="585.0" y="888.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no resuelve la</tspan><tspan x="585.0" dy="16">apnea con bradicardia</tspan></text><text x="735.0" y="888.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: libera la vía aérea</tspan><tspan x="735.0" dy="16">antes de ventilar</tspan></text><text x="885.0" y="880.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: trata la</tspan><tspan x="885.0" dy="16">hipertensión pulmonar</tspan><tspan x="885.0" dy="16">posterior</tspan></text><rect x="40.0" y="788.5" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="949.5" width="920.0" height="218.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="977.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="999.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Apnea con bradicardia y cianosis es un recién nacido no vigoroso: necesita reanimación inmediata; secar, estimular o dar oxígeno por cánula no</tspan><tspan x="58.0" dy="18">   resuelven la apnea.</tspan><tspan x="58.0" dy="18">• De las opciones, la única que actúa sobre la vía aérea antes de ventilar es la intubación con aspiración traqueal, para no empujar el meconio a los</tspan><tspan x="58.0" dy="18">   alvéolos.</tspan><tspan x="58.0" dy="18">• Guías vigentes (AHA/AAP 2020): ya no se aspira la tráquea de rutina; se inicia la ventilación con presión positiva en el primer minuto y se intuba si hay</tspan><tspan x="58.0" dy="18">   obstrucción.</tspan><tspan x="58.0" dy="18">• El óxido nítrico inhalado trata la hipertensión pulmonar posterior; no es maniobra de reanimación. Perla: no retrasar la ventilación por aspirar.</tspan></text><text x="58.0" y="1129.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AHA/AAP, Guías 2020 de reanimación neonatal (Circulation 2020;142:S524-S550); NTS 214-2024 MINSA, Atención integral de la persona recién nacida; Nelson Tratado</tspan><tspan x="58.0" dy="15">de Pediatría 22.ª ed. (2024).</tspan></text></svg>