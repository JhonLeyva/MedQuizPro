<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="931" viewBox="0 0 1000 931" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Preescolar con diarrea, deshidratación moderada y sodio de 160: deshidratación hipernatrémica, calcular el déficit y reponerlo lentamente (≥ 48 h)"><title>Preescolar con diarrea, deshidratación moderada y sodio de 160: deshidratación hipernatrémica, calcular el déficit y reponerlo lentamente (≥ 48 h)</title><rect x="0.75" y="0.75" width="998.5" height="929.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Trastornos del sodio · deshidratación hipernatrémica</tspan></text><rect x="513.1" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="569.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="569.6" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Deshidratación hipernatrémica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se pierde más agua que sodio (Na &gt; 150): las neuronas se adaptan acumulando osmoles.</tspan><tspan x="58.0" dy="17">Si el sodio baja rápido, entra agua a las neuronas: edema cerebral y convulsiones. Bajar ≤</tspan><tspan x="58.0" dy="17">10-12 mEq/L por día.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Preescolar de 2 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">3 días de diarrea severa; irritable, deshidratación</tspan><tspan x="640.0" dy="16">moderada.</tspan><tspan x="640.0" dy="16">Na 160, K 5; hemograma normal.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CALCULA EL DÉFICIT DE AGUA LIBRE (APROX.)</tspan></text><rect x="40.0" y="285.0" width="170.0" height="93.0" rx="16" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="125.0" y="311.0" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="150"><tspan x="125.0" dy="0">PESO ESTIMADO</tspan></text><text x="125.0" y="347.0" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">12 kg</tspan></text><text x="125.0" y="369.0" font-size="11" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="146"><tspan x="125.0" dy="0">Niño de 2 años</tspan></text><line x1="214.0" y1="331.5" x2="229.0" y2="331.5" stroke="#0f766e" stroke-width="2"/><polygon points="228.0,326.5 228.0,336.5 236.0,331.5" fill="#0f766e"/><rect x="240.0" y="285.0" width="213.3" height="93.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="346.7" y="307.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="197"><tspan x="346.7" dy="0">AGUA CORPORAL</tspan></text><text x="346.7" y="341.0" font-size="22" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="197"><tspan x="346.7" dy="0">0,6 × 12 = 7,2 L</tspan></text><text x="346.7" y="363.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="193"><tspan x="346.7" dy="0">60 % del peso</tspan></text><text x="473.3" y="342.5" font-size="30" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="40"><tspan x="473.3" dy="0">×</tspan></text><rect x="493.3" y="285.0" width="213.3" height="93.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="600.0" y="307.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="197"><tspan x="600.0" dy="0">EXCESO DE NA</tspan></text><text x="600.0" y="341.0" font-size="22" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="197"><tspan x="600.0" dy="0">160/145 − 1 = 0,10</tspan></text><text x="600.0" y="363.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="193"><tspan x="600.0" dy="0">Cuánto sobra</tspan></text><text x="726.7" y="342.5" font-size="30" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="40"><tspan x="726.7" dy="0">=</tspan></text><rect x="746.7" y="285.0" width="213.3" height="93.0" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="853.3" y="307.0" font-size="10.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="197"><tspan x="853.3" dy="0">DÉFICIT DE AGUA</tspan></text><text x="853.3" y="341.0" font-size="22" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="197"><tspan x="853.3" dy="0">≈ 0,75 L</tspan></text><text x="853.3" y="363.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="193"><tspan x="853.3" dy="0">7,2 × 0,10, en ≥ 48 h</tspan></text><rect x="792.9" y="367.0" width="121.0" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="853.3" y="382.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="853.3" dy="0">◆ REPONER LENTO</tspan></text><text x="44.0" y="414.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="44.0" dy="0">POR QUÉ NO LAS OTRAS</tspan></text><rect x="40.0" y="424.0" width="222.5" height="73.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="151.2" y="442.0" font-size="9.5" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="206"><tspan x="151.2" dy="0">✓ COINCIDE</tspan></text><text x="151.2" y="460.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="202"><tspan x="151.2" dy="0">Calcular y reponer lento</tspan></text><text x="151.2" y="477.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="202"><tspan x="151.2" dy="0">≤ 10-12 mEq/L/día</tspan></text><rect x="272.5" y="424.0" width="222.5" height="73.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="383.8" y="442.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="206"><tspan x="383.8" dy="0">✗ NO</tspan></text><text x="383.8" y="460.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="202"><tspan x="383.8" dy="0">Corregir en &lt; 6 h</tspan></text><text x="383.8" y="477.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="202"><tspan x="383.8" dy="0">Edema cerebral</tspan></text><rect x="505.0" y="424.0" width="222.5" height="73.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="616.2" y="442.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="206"><tspan x="616.2" dy="0">✗ NO</tspan></text><text x="616.2" y="460.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="202"><tspan x="616.2" dy="0">Diuréticos</tspan></text><text x="616.2" y="477.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="202"><tspan x="616.2" dy="0">Más deshidratación</tspan></text><rect x="737.5" y="424.0" width="222.5" height="73.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="848.8" y="442.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="206"><tspan x="848.8" dy="0">✗ NO</tspan></text><text x="848.8" y="460.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="202"><tspan x="848.8" dy="0">No reponer electrolitos</tspan></text><text x="848.8" y="477.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="202"><tspan x="848.8" dy="0">Empeora</tspan></text><rect x="40.0" y="515.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="541.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Calcular el déficit y reponer en 48-72 h</tspan></text><text x="60.0" y="560.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Sodio que baje no más de 10-12 mEq/L por día.</tspan></text><text x="40.0" y="627.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="637.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="676.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="659.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Evitar reponer</tspan><tspan x="285.0" dy="17">pérdidas de</tspan><tspan x="285.0" dy="17">electrolitos</tspan></text><rect x="363.0" y="640.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="668.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Calcular el déficit</tspan><tspan x="435.0" dy="17">para reponerlo</tspan></text><text x="585.0" y="659.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Administrar</tspan><tspan x="585.0" dy="17">antibióticos de</tspan><tspan x="585.0" dy="17">amplio espectro</tspan></text><text x="735.0" y="668.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Diuréticos para</tspan><tspan x="735.0" dy="17">eliminar sodio</tspan></text><text x="885.0" y="668.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Corregir el sodio en</tspan><tspan x="885.0" dy="17">menos de 6 horas</tspan></text><rect x="40.0" y="708.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="708.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="737.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Prioridad?</tspan></text><text x="285.0" y="737.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: hay que reponer</tspan></text><text x="435.0" y="729.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: calcular y reponer</tspan><tspan x="435.0" dy="16">lento</tspan></text><text x="585.0" y="729.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no hay infección</tspan><tspan x="585.0" dy="16">bacteriana</tspan></text><text x="735.0" y="737.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: perdería más agua</tspan></text><text x="885.0" y="729.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: causa edema</tspan><tspan x="885.0" dy="16">cerebral</tspan></text><rect x="40.0" y="637.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="782.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="810.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="832.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Si tolera: SRO de baja osmolaridad (es la vía más segura).</tspan><tspan x="58.0" dy="18">• EV: calcular déficit de agua + mantenimiento y reponer en 48-72 h con solución salina; controlar el sodio cada 4-6 h.</tspan><tspan x="58.0" dy="18">• Si convulsiona durante la corrección: detener y dar solución hipertónica (edema cerebral).</tspan></text><text x="58.0" y="890.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS; Nelson Tratado de Pediatría 22.ª ed. (2024); MINSA Perú.</tspan></text></svg>