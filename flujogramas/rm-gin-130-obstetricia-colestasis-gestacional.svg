<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1243" viewBox="0 0 1000 1243" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Prurito palmoplantar nocturno sin lesiones en el tercer trimestre: colestasis intrahepática del embarazo"><title>Prurito palmoplantar nocturno sin lesiones en el tercer trimestre: colestasis intrahepática del embarazo</title><rect x="0.75" y="0.75" width="998.5" height="1241.8" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · colestasis gestacional</tspan></text><rect x="407.8" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="487.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="487.6" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Colestasis intrahepática del embarazo</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Colestasis reversible del tercer trimestre por el efecto de estrógenos y progesterona sobre</tspan><tspan x="58.0" dy="17">un transporte biliar susceptible.</tspan><tspan x="58.0" dy="17">El riesgo es fetal.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante de 35 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Prurito intenso palmoplantar y nocturno de 3 días.</tspan><tspan x="640.0" dy="16">Sin lesiones dérmicas.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ÁCIDOS BILIARES SÉRICOS TOTALES Y CONDUCTA</tspan></text><rect x="70.0" y="279.0" width="34.0" height="330.0" rx="17" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="75.0" y="503.0" width="24.0" height="102.0" rx="8" fill="#10b981" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="554.0" x2="130.0" y2="554.0" stroke="#10b981" stroke-width="2"/><rect x="130.0" y="504.0" width="330.0" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="526.0" font-size="12" font-weight="800" font-style="normal" fill="#10b981" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">&lt; 10 µmol/L</tspan></text><text x="240.0" y="526.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">No confirma colestasis</tspan></text><text x="144.0" y="547.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Buscar otra causa del prurito</tspan></text><rect x="75.0" y="393.0" width="24.0" height="102.0" rx="8" fill="#f59e0b" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="444.0" x2="130.0" y2="444.0" stroke="#0f766e" stroke-width="3"/><rect x="130.0" y="394.0" width="330.0" height="100.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="144.0" y="416.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">10 a 99 µmol/L</tspan></text><text x="240.0" y="416.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Colestasis confirmada</tspan></text><text x="144.0" y="437.0" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Ácido ursodesoxicólico; finalizar entre las 36 y 39</tspan><tspan x="144.0" dy="15">semanas</tspan></text><rect x="354.6" y="383.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="400.0" y="398.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="400.0" dy="0">◆ ESTE CASO</tspan></text><rect x="75.0" y="283.0" width="24.0" height="102.0" rx="8" fill="#f97316" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="334.0" x2="130.0" y2="334.0" stroke="#f97316" stroke-width="2"/><rect x="130.0" y="284.0" width="330.0" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="306.0" font-size="12" font-weight="800" font-style="normal" fill="#f97316" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">≥ 100 µmol/L</tspan></text><text x="240.0" y="306.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Mayor riesgo de muerte fetal</tspan></text><text x="144.0" y="327.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Vigilancia estrecha y parto temprano, hacia las 36</tspan><tspan x="144.0" dy="15">semanas</tspan></text><text x="470.0" y="283.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="490"><tspan x="470.0" dy="0">QUÉ SE HACE ANTE EL PRURITO PALMOPLANTAR</tspan></text><rect x="470.0" y="297.0" width="490.0" height="84.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><circle cx="498.0" cy="339.0" r="17" fill="#ffffff" stroke="none" stroke-width="0"/><text x="498.0" y="344.0" font-size="15" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">1</tspan></text><text x="528.0" y="332.0" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Sospechar</tspan></text><text x="528.0" y="355.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Prurito palmoplantar nocturno sin lesiones en el tercer trimestre</tspan></text><rect x="868.1" y="286.0" width="43.9" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="301.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ DX</tspan></text><line x1="498.0" y1="383.0" x2="498.0" y2="396.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,395.0 503.0,395.0 498.0,403.0" fill="#0f766e"/><rect x="470.0" y="405.0" width="490.0" height="91.2" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="450.6" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="455.6" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">2</tspan></text><text x="528.0" y="443.6" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Confirmar</tspan></text><text x="528.0" y="466.6" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Ácidos biliares séricos totales de 10 µmol/L o más; pedir transaminasas</tspan></text><line x1="498.0" y1="498.2" x2="498.0" y2="511.2" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,510.2 503.0,510.2 498.0,518.2" fill="#0f766e"/><rect x="470.0" y="520.2" width="490.0" height="91.2" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="565.8" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="570.8" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">3</tspan></text><text x="528.0" y="550.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Tratar y programar el parto</tspan></text><text x="528.0" y="573.3" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Ácido ursodesoxicólico 10-15 mg/kg/día; finalizar entre las 36 y 39</tspan><tspan x="528.0" dy="17">semanas</tspan></text><text x="40.0" y="645.3" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PRURITO EN LA GESTANTE: DIAGNÓSTICO DIFERENCIAL</tspan></text><rect x="40.0" y="657.3" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="676.3" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="249"><tspan x="50.0" dy="0">Diagnóstico</tspan></text><text x="315.0" y="676.3" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="639"><tspan x="315.0" dy="0">Datos clave</tspan></text><rect x="40.0" y="686.3" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="705.3" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="249"><tspan x="50.0" dy="0">Escabiosis</tspan></text><text x="315.0" y="705.3" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="639"><tspan x="315.0" dy="0">Surcos en la piel; afecta a la familia</tspan></text><rect x="40.0" y="715.3" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="734.3" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="249"><tspan x="50.0" dy="0">Colestasis gestacional</tspan></text><text x="315.0" y="734.3" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="639"><tspan x="315.0" dy="0">Prurito palmoplantar nocturno sin lesiones; ácidos biliares altos</tspan></text><rect x="205.6" y="718.8" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="251.0" y="733.8" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="251.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="744.3" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="763.3" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="249"><tspan x="50.0" dy="0">Hígado graso agudo</tspan></text><text x="315.0" y="763.3" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="639"><tspan x="315.0" dy="0">Ictericia, hipoglucemia, coagulopatía y falla hepática</tspan></text><rect x="40.0" y="773.3" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="792.3" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="249"><tspan x="50.0" dy="0">Dermatitis atópica</tspan></text><text x="315.0" y="792.3" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="639"><tspan x="315.0" dy="0">Lesiones eccematosas</tspan></text><rect x="40.0" y="802.3" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="821.3" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="249"><tspan x="50.0" dy="0">Cirrosis hepática</tspan></text><text x="315.0" y="821.3" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="639"><tspan x="315.0" dy="0">Estigmas de hepatopatía crónica</tspan></text><text x="40.0" y="871.3" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="881.3" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="912.3" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="912.3" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Escabiosis</tspan></text><rect x="363.0" y="884.3" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="903.8" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Colestasis</tspan><tspan x="435.0" dy="17">gestacional</tspan></text><text x="585.0" y="912.3" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Hígado graso</tspan></text><text x="735.0" y="912.3" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Dermatitis atópica</tspan></text><text x="885.0" y="912.3" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Cirrosis hepática</tspan></text><rect x="40.0" y="935.3" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="935.3" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="964.3" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico más</tspan><tspan x="54.0" dy="16">probable?</tspan></text><text x="285.0" y="964.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: produce surcos y</tspan><tspan x="285.0" dy="16">afecta a la familia</tspan></text><text x="435.0" y="972.3" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: prurito sin lesiones</tspan></text><text x="585.0" y="956.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: cursa con ictericia,</tspan><tspan x="585.0" dy="16">hipoglucemia y</tspan><tspan x="585.0" dy="16">coagulopatía</tspan></text><text x="735.0" y="964.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: cursa con lesiones</tspan><tspan x="735.0" dy="16">eccematosas</tspan></text><text x="885.0" y="964.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: tiene estigmas de</tspan><tspan x="885.0" dy="16">hepatopatía crónica</tspan></text><rect x="40.0" y="881.3" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1025.3" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1053.3" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1075.3" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Diagnóstico: ácidos biliares séricos totales de 10 µmol/L o más; las transaminasas suelen estar altas y la ictericia es rara.</tspan><tspan x="58.0" dy="18">• Riesgo fetal: parto prematuro, sufrimiento fetal y muerte intrauterina súbita, mayor con ácidos biliares de 100 µmol/L o más.</tspan><tspan x="58.0" dy="18">• Tratamiento: ácido ursodesoxicólico 10-15 mg/kg/día (alivia el prurito; PITCHES no mostró mejoría perinatal) y finalizar entre las 36 y 39 semanas según</tspan><tspan x="58.0" dy="18">   el nivel de ácidos biliares.</tspan><tspan x="58.0" dy="18">• Diferenciales: escabiosis (surcos y familia), dermatitis atópica (eccema), hígado graso agudo (ictericia, hipoglucemia, coagulopatía) y cirrosis (estigmas</tspan><tspan x="58.0" dy="18">   crónicos).</tspan></text><text x="58.0" y="1187.3" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: SMFM, Consult Series N.º 53 (Am J Obstet Gynecol 2021); EASL, enfermedades hepáticas en el embarazo (J Hepatol 2023); Chappell LC et al., PITCHES (Lancet</tspan><tspan x="58.0" dy="15">2019).</tspan></text></svg>