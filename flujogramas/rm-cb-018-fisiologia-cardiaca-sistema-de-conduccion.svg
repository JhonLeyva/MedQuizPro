<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="872" viewBox="0 0 1000 872" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Las fibras de Purkinje son las más gruesas y rápidas del sistema de conducción"><title>Las fibras de Purkinje son las más gruesas y rápidas del sistema de conducción</title><rect x="0.75" y="0.75" width="998.5" height="870.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Fisiología cardiaca · sistema de conducción</tspan></text><rect x="459.8" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="531.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="531.7" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Sistema de conducción</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Nodo sinusal → aurícula → nodo AV → haz de His → ramas → red de Purkinje.</tspan><tspan x="58.0" dy="17">El nodo AV retrasa el impulso; Purkinje lo reparte casi de inmediato.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué estructuras salen del haz hacia los ventrículos y</tspan><tspan x="640.0" dy="16">conducen más rápido?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL NODO SINUSAL A LOS VENTRÍCULOS</tspan></text><rect x="40.0" y="269.0" width="163.2" height="76.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="121.6" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="143"><tspan x="121.6" dy="0">Nodo sinusal</tspan></text><text x="121.6" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="143"><tspan x="121.6" dy="0">Marcapasos</tspan></text><line x1="206.2" y1="307.0" x2="219.2" y2="307.0" stroke="#0f766e" stroke-width="2"/><polygon points="218.2,302.0 218.2,312.0 226.2,307.0" fill="#0f766e"/><line x1="121.6" y1="347.0" x2="121.6" y2="361.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="40.0" y="363.0" width="163.2" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="121.6" y="377.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="143"><tspan x="121.6" dy="0">✂ CORTA</tspan></text><text x="121.6" y="394.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="143"><tspan x="121.6" dy="0">60-100 lpm</tspan></text><rect x="229.2" y="269.0" width="163.2" height="76.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="310.8" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="143"><tspan x="310.8" dy="0">Nodo AV</tspan></text><text x="310.8" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="143"><tspan x="310.8" dy="0">Retraso</tspan></text><line x1="395.4" y1="307.0" x2="408.4" y2="307.0" stroke="#0f766e" stroke-width="2"/><polygon points="407.4,302.0 407.4,312.0 415.4,307.0" fill="#0f766e"/><line x1="310.8" y1="347.0" x2="310.8" y2="361.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="229.2" y="363.0" width="163.2" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="310.8" y="377.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="143"><tspan x="310.8" dy="0">✂ CORTA</tspan></text><text x="310.8" y="394.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="143"><tspan x="310.8" dy="0">0,1 s: deja llenarse al</tspan><tspan x="310.8" dy="16">ventrículo</tspan></text><rect x="418.4" y="269.0" width="163.2" height="76.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="500.0" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="143"><tspan x="500.0" dy="0">Haz de His</tspan></text><text x="500.0" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="143"><tspan x="500.0" dy="0">Tronco</tspan></text><line x1="584.6" y1="307.0" x2="597.6" y2="307.0" stroke="#0f766e" stroke-width="2"/><polygon points="596.6,302.0 596.6,312.0 604.6,307.0" fill="#0f766e"/><line x1="500.0" y1="347.0" x2="500.0" y2="361.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="418.4" y="363.0" width="163.2" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="377.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="143"><tspan x="500.0" dy="0">✂ CORTA</tspan></text><text x="500.0" y="394.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="143"><tspan x="500.0" dy="0">Se divide en dos ramas</tspan></text><rect x="607.6" y="269.0" width="163.2" height="76.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="689.2" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="143"><tspan x="689.2" dy="0">Ramas derecha e</tspan><tspan x="689.2" dy="17">izquierda</tspan></text><text x="689.2" y="323.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="143"><tspan x="689.2" dy="0">Ramas</tspan></text><line x1="773.8" y1="307.0" x2="786.8" y2="307.0" stroke="#0f766e" stroke-width="2"/><polygon points="785.8,302.0 785.8,312.0 793.8,307.0" fill="#0f766e"/><line x1="689.2" y1="347.0" x2="689.2" y2="361.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="607.6" y="363.0" width="163.2" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="689.2" y="377.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="143"><tspan x="689.2" dy="0">✂ CORTA</tspan></text><text x="689.2" y="394.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="143"><tspan x="689.2" dy="0">Bajan por el tabique</tspan></text><rect x="796.8" y="269.0" width="163.2" height="76.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="878.4" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="143"><tspan x="878.4" dy="0">Red de Purkinje</tspan></text><text x="878.4" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="143"><tspan x="878.4" dy="0">Final</tspan></text><line x1="878.4" y1="347.0" x2="878.4" y2="361.0" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="796.8" y="363.0" width="163.2" height="64.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="878.4" y="377.0" font-size="9.5" font-weight="800" font-style="normal" fill="#ffedd5" text-anchor="middle" data-max="143"><tspan x="878.4" dy="0">✂ CORTA</tspan></text><text x="878.4" y="394.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="143"><tspan x="878.4" dy="0">La más rápida: 1,5-4 m/s</tspan></text><rect x="833.0" y="416.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="878.4" y="431.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="878.4" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="457.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="483.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Purkinje = conducción más rápida</tspan></text><text x="60.0" y="502.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Por eso el QRS es estrecho si las ramas están sanas.</tspan></text><text x="40.0" y="569.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="579.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="610.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="610.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Nervios simpáticos</tspan></text><text x="435.0" y="610.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Haz AV derecho</tspan></text><rect x="513.0" y="582.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="610.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Fibras de Purkinje</tspan></text><text x="735.0" y="601.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Fibras del nódulo</tspan><tspan x="735.0" dy="17">AV</tspan></text><text x="885.0" y="601.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Fibras musculares</tspan><tspan x="885.0" dy="17">lisas</tspan></text><rect x="40.0" y="633.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="633.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="670.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Más rápidas?</tspan></text><text x="285.0" y="654.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: modulan la</tspan><tspan x="285.0" dy="16">frecuencia, no</tspan><tspan x="285.0" dy="16">conducen</tspan></text><text x="435.0" y="662.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es una de las</tspan><tspan x="435.0" dy="16">ramas del haz</tspan></text><text x="585.0" y="662.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: la red más rápida</tspan><tspan x="585.0" dy="16">del corazón</tspan></text><text x="735.0" y="662.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: son lentas (retraso</tspan><tspan x="735.0" dy="16">fisiológico)</tspan></text><text x="885.0" y="662.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no son del sistema</tspan><tspan x="885.0" dy="16">de conducción</tspan></text><rect x="40.0" y="579.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="723.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="751.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="773.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Velocidad: Purkinje 1,5-4 m/s, unas seis veces más que el miocardio contráctil; nodo AV 0,05 m/s.</tspan><tspan x="58.0" dy="18">• Activa el endocardio de ambos ventrículos casi a la vez: QRS estrecho.</tspan><tspan x="58.0" dy="18">• En un bloqueo de rama el impulso viaja por el miocardio, más lento: QRS &gt; 120 ms.</tspan></text><text x="58.0" y="831.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Guyton y Hall Tratado de Fisiología Médica 14.ª ed.; Boron y Boulpaep Fisiología Médica 3.ª ed.</tspan></text></svg>