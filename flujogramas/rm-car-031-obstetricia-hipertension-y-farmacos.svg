<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1007" viewBox="0 0 1000 1007" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Los IECA están contraindicados en la gestante hipertensa"><title>Los IECA están contraindicados en la gestante hipertensa</title><rect x="0.75" y="0.75" width="998.5" height="1005.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · hipertensión y fármacos</tspan></text><rect x="419.4" y="32.0" width="117.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="478.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="101"><tspan x="478.1" dy="0">CARDIOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Antihipertensivos y embarazo</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Los fármacos del SRAA (IECA, ARA II, aliskiren) producen fetopatía.</tspan><tspan x="58.0" dy="17">Seguros: metildopa, labetalol, nifedipino de acción prolongada e hidralazina.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué fármaco está contraindicado?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ANTIHIPERTENSIVOS EN EL EMBARAZO</tspan></text><rect x="493.0" y="303.0" width="14" height="190" rx="5" fill="#64748b"/><path d="M440.0 508.0 H560.0 L540.0 488.0 H460.0 Z" fill="#475569"/><circle cx="500.0" cy="303.0" r="15" fill="#f59e0b" stroke="#92400e" stroke-width="2"/><line x1="385.4" y1="284.9" x2="614.6" y2="321.1" stroke="#334155" stroke-width="7" stroke-linecap="round"/><line x1="385.4" y1="284.9" x2="357.4" y2="346.9" stroke="#64748b" stroke-width="2"/><line x1="385.4" y1="284.9" x2="413.4" y2="346.9" stroke="#64748b" stroke-width="2"/><path d="M347.4 346.9 H423.4 Q385.4 390.9 347.4 346.9 Z" fill="#64748b"/><text x="385.4" y="361.9" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="385.4" dy="0">NO</tspan></text><line x1="614.6" y1="321.1" x2="586.6" y2="383.1" stroke="#64748b" stroke-width="2"/><line x1="614.6" y1="321.1" x2="642.6" y2="383.1" stroke="#64748b" stroke-width="2"/><path d="M576.6 383.1 H652.6 Q614.6 427.1 576.6 383.1 Z" fill="#ea580c"/><text x="614.6" y="398.1" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="614.6" dy="0">SÍ</tspan></text><text x="500.0" y="535.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="300"><tspan x="500.0" dy="0">¿Cuáles se pueden usar?</tspan></text><rect x="40.0" y="273.0" width="290.0" height="158.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58.0" y="301.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="58.0" dy="0">Contraindicados</tspan></text><circle cx="62.0" cy="326.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="330.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">IECA (enalapril)</tspan></text><circle cx="62.0" cy="352.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="356.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">ARA II (valsartán, losartán)</tspan></text><circle cx="62.0" cy="378.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="382.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Aliskiren</tspan></text><circle cx="62.0" cy="404.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="408.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Fetopatía y malformaciones</tspan></text><rect x="670.0" y="273.0" width="290.0" height="158.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><text x="688.0" y="301.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="254"><tspan x="688.0" dy="0">Seguros</tspan></text><circle cx="692.0" cy="326.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="330.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Metildopa</tspan></text><circle cx="692.0" cy="352.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="356.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Labetalol</tspan></text><circle cx="692.0" cy="378.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="382.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Nifedipino de acción prolongada</tspan></text><circle cx="692.0" cy="404.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="408.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Hidralazina (en crisis)</tspan></text><rect x="844.6" y="262.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="277.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="569.0" width="920.0" height="93.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="597.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">IECA: contraindicados</tspan></text><text x="500.0" y="618.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Producen oligohidramnios, hipoplasia pulmonar y displasia renal.</tspan><tspan x="500.0" dy="17">Cambiarlos antes de planificar el embarazo.</tspan></text><text x="40.0" y="702.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="712.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="743.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="715.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="743.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">IECA / ARA II</tspan></text><text x="435.0" y="734.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Simpaticolíticos</tspan><tspan x="435.0" dy="17">centrales</tspan></text><text x="585.0" y="734.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Antagonistas alfa</tspan><tspan x="585.0" dy="17">selectivos</tspan></text><text x="735.0" y="734.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Vasodilatadores</tspan><tspan x="735.0" dy="17">directos</tspan></text><text x="885.0" y="734.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Antagonistas del</tspan><tspan x="885.0" dy="17">calcio</tspan></text><rect x="40.0" y="766.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="766.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="795.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Contraindicado?</tspan></text><text x="285.0" y="795.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: fetopatía</tspan></text><text x="435.0" y="787.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: metildopa es</tspan><tspan x="435.0" dy="16">segura</tspan></text><text x="585.0" y="787.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no está</tspan><tspan x="585.0" dy="16">contraindicada</tspan></text><text x="735.0" y="787.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: hidralazina es</tspan><tspan x="735.0" dy="16">segura</tspan></text><text x="885.0" y="787.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: nifedipino es</tspan><tspan x="885.0" dy="16">seguro</tspan></text><rect x="40.0" y="712.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="840.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="868.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="890.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Fetopatía: oligohidramnios, hipoplasia pulmonar, displasia renal, anuria neonatal, hipocalvaria y muerte fetal; en el primer trimestre, malformaciones</tspan><tspan x="58.0" dy="18">   cardiacas y del SNC.</tspan><tspan x="58.0" dy="18">• Urgencia hipertensiva (≥ 160/110): labetalol IV, nifedipino oral o hidralazina IV.</tspan><tspan x="58.0" dy="18">• En mujeres en edad fértil con IECA/ARA II: anticoncepción o cambio de fármaco al planificar embarazo.</tspan></text><text x="58.0" y="966.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, Practice Bulletin N.º 222 (2020); ISSHP (2021); MINSA/INS, GPC N.º 03-2025 de trastorno hipertensivo del embarazo (primer nivel)</tspan></text></svg>