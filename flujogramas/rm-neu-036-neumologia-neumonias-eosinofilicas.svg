<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1079" viewBox="0 0 1000 1079" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Infiltrados alveolares migratorios con pocos síntomas y eosinofilia: síndrome de Löffler"><title>Infiltrados alveolares migratorios con pocos síntomas y eosinofilia: síndrome de Löffler</title><rect x="0.75" y="0.75" width="998.5" height="1077.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neumología · neumonías eosinofílicas</tspan></text><rect x="426.2" y="32.0" width="114.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="483.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="99"><tspan x="483.7" dy="0">NEUMOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Síndrome de Löffler</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Neumonía eosinofílica simple: infiltrados fugaces y migratorios con eosinofilia periférica.</tspan><tspan x="58.0" dy="17">Autolimitada: se resuelve en 1 a 4 semanas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de reconocimiento</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Neumonía eosinofílica con infiltrados alveolares</tspan><tspan x="640.0" dy="16">migratorios y mínimas manifestaciones clínicas.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO DISTINGUIR LAS ENTIDADES CON EOSINÓFILOS O HEMORRAGIA PULMONAR</tspan></text><rect x="40.0" y="269.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="180"><tspan x="54.0" dy="0">ENTIDAD</tspan></text><text x="420.0" y="291.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="340"><tspan x="420.0" dy="0">Cuadro clínico</tspan></text><text x="780.0" y="291.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="340"><tspan x="780.0" dy="0">Dato clave</tspan></text><rect x="40.0" y="309.0" width="194.0" height="57.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="335.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Síndrome de Löffler</tspan></text><text x="54.0" y="352.0" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Neumonía eosinofílica simple</tspan></text><rect x="243.0" y="309.0" width="354.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="255.0" y="334.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">Pocos síntomas, tos seca leve</tspan></text><text x="255.0" y="350.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">Autolimitado en 1 a 4 semanas</tspan></text><rect x="603.0" y="309.0" width="354.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="615.0" y="334.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">Infiltrados migratorios</tspan></text><text x="615.0" y="350.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">Larvas de helmintos o fármacos</tspan></text><rect x="856.2" y="298.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="901.6" y="313.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="901.6" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="372.0" width="194.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="398.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Churg-Strauss</tspan></text><text x="54.0" y="415.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Vasculitis con asma</tspan></text><rect x="243.0" y="372.0" width="354.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="255.0" y="397.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">Asma de inicio tardío, sinusitis</tspan></text><text x="255.0" y="413.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">Neuropatía periférica</tspan></text><rect x="603.0" y="372.0" width="354.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="615.0" y="397.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">Vasculitis con ANCA</tspan></text><text x="615.0" y="413.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">No es el cuadro leve</tspan></text><rect x="40.0" y="435.0" width="194.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="461.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Micosis alérgica</tspan></text><text x="54.0" y="478.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Aspergillus en asmáticos</tspan></text><rect x="243.0" y="435.0" width="354.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="255.0" y="460.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">Asma con bronquiectasias centrales</tspan></text><text x="255.0" y="476.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">Sibilancias y tapones mucosos</tspan></text><rect x="603.0" y="435.0" width="354.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="615.0" y="460.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">Aspergillus</tspan></text><text x="615.0" y="476.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">Reacción alérgica</tspan></text><rect x="40.0" y="498.0" width="194.0" height="74.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="524.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Neumonía eosinofílica</tspan><tspan x="54.0" dy="17">aguda</tspan></text><text x="54.0" y="558.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Menos de 7 días</tspan></text><rect x="243.0" y="498.0" width="354.0" height="74.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="255.0" y="531.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">Fiebre e insuficiencia respiratoria</tspan></text><text x="255.0" y="547.5" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">A veces tras iniciar el tabaco</tspan></text><rect x="603.0" y="498.0" width="354.0" height="74.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="615.0" y="531.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">Más de 25 % de eosinófilos</tspan></text><text x="615.0" y="547.5" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">En el lavado broncoalveolar</tspan></text><rect x="40.0" y="578.0" width="194.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="604.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Goodpasture</tspan></text><text x="54.0" y="621.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Anticuerpos antimembrana basal</tspan></text><rect x="243.0" y="578.0" width="354.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="255.0" y="603.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">Hemoptisis y hematuria</tspan></text><text x="255.0" y="619.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">Hemorragia alveolar</tspan></text><rect x="603.0" y="578.0" width="354.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="615.0" y="603.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">Glomerulonefritis</tspan></text><text x="615.0" y="619.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">Sin eosinofilia</tspan></text><text x="44.0" y="657.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Infiltrados migratorios con eosinofilia en geohelmintiasis: Löffler hasta demostrar lo contrario.</tspan></text><text x="40.0" y="705.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="715.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="754.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="718.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="754.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Síndrome de Löffler</tspan></text><text x="435.0" y="737.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Granulomatosis</tspan><tspan x="435.0" dy="17">alérgica de</tspan><tspan x="435.0" dy="17">Churg-Strauss</tspan></text><text x="585.0" y="746.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Micosis pulmonar</tspan><tspan x="585.0" dy="17">alérgica</tspan></text><text x="735.0" y="746.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Neumonía</tspan><tspan x="735.0" dy="17">eosinofílica aguda</tspan></text><text x="885.0" y="746.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Síndrome de</tspan><tspan x="885.0" dy="17">Goodpasture</tspan></text><rect x="40.0" y="786.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="786.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="815.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Cuál es la neumonía</tspan><tspan x="54.0" dy="16">eosinofílica descrita?</tspan></text><text x="285.0" y="807.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: infiltrados</tspan><tspan x="285.0" dy="16">migratorios y pocos</tspan><tspan x="285.0" dy="16">síntomas</tspan></text><text x="435.0" y="815.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: asma tardía,</tspan><tspan x="435.0" dy="16">sinusitis y vasculitis</tspan></text><text x="585.0" y="807.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: ocurre en</tspan><tspan x="585.0" dy="16">asmáticos con</tspan><tspan x="585.0" dy="16">Aspergillus</tspan></text><text x="735.0" y="807.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: insuficiencia</tspan><tspan x="735.0" dy="16">respiratoria febril</tspan><tspan x="735.0" dy="16">aguda</tspan></text><text x="885.0" y="807.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: hemorragia</tspan><tspan x="885.0" dy="16">alveolar con</tspan><tspan x="885.0" dy="16">glomerulonefritis</tspan></text><rect x="40.0" y="715.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="876.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="904.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="926.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Causa más frecuente en nuestro medio: paso pulmonar de larvas de Ascaris, Strongyloides y uncinarias; también fármacos (nitrofurantoína, AINE,</tspan><tspan x="58.0" dy="18">   sulfonamidas).</tspan><tspan x="58.0" dy="18">• Tratamiento: retirar el agente o tratar el parásito. Ante sospecha de estrongiloidiasis tratar antes de dar corticoides por el riesgo de hiperinfección.</tspan><tspan x="58.0" dy="18">• Churg-Strauss: asma tardía, sinusitis, neuropatía y ANCA. Micosis alérgica: asmáticos con Aspergillus. Neumonía eosinofílica aguda: insuficiencia</tspan><tspan x="58.0" dy="18">   respiratoria febril, más de 25 % de eosinófilos en el lavado.</tspan><tspan x="58.0" dy="18">• Goodpasture: hemorragia alveolar con glomerulonefritis y anticuerpos antimembrana basal, sin eosinofilia.</tspan></text><text x="58.0" y="1038.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Harrison, 21.ª ed. (2022); Robbins y Cotran, 10.ª ed. (2021).</tspan></text></svg>