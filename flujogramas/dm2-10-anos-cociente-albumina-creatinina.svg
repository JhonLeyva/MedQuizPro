<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1097" viewBox="0 0 1000 1097" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Diabética tipo 2 de 10 años con creatinina normal: para detectar daño renal precoz se pide la relación albúmina/creatinina en orina aislada"><title>Diabética tipo 2 de 10 años con creatinina normal: para detectar daño renal precoz se pide la relación albúmina/creatinina en orina aislada</title><rect x="0.75" y="0.75" width="998.5" height="1095.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Diabetes · enfermedad renal</tspan></text><rect x="366.8" y="32.0" width="155.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="444.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="139"><tspan x="444.5" dy="0">ENDOCRINOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Enfermedad renal diabética</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El primer signo es la albúmina en la orina, años antes de que suba la creatinina.</tspan><tspan x="58.0" dy="17">Se mide con la relación albúmina/creatinina (RAC) en una muestra aislada y se confirma en</tspan><tspan x="58.0" dy="17">2 de 3 muestras.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 55 años, DM2 hace 10 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">HbA1c 7 %.</tspan><tspan x="640.0" dy="16">Urea y creatinina normales.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ALBUMINURIA (KDIGO): DÓNDE CAE EL RESULTADO</tspan></text><rect x="40.0" y="269.0" width="920.0" height="191.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="295.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Relación albúmina/creatinina en orina (mg/g)</tspan></text><text x="60.0" y="314.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Categorías A1-A3; se confirma en 2 de 3 muestras en 3-6 meses.</tspan></text><rect x="70.0" y="344.0" width="64.5" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="102.2" y="369.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="54"><tspan x="102.2" dy="0">A1</tspan></text><rect x="134.5" y="344.0" width="580.5" height="40.0" rx="6" fill="#fef9c3" stroke="#ffffff" stroke-width="2"/><text x="424.8" y="369.0" font-size="12" font-weight="800" font-style="normal" fill="#a16207" text-anchor="middle" data-max="570"><tspan x="424.8" dy="0">A2 moderada (30-300)</tspan></text><rect x="715.0" y="344.0" width="215.0" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="822.5" y="369.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="205"><tspan x="822.5" dy="0">A3 grave</tspan></text><line x1="70.0" y1="384.0" x2="70.0" y2="392.0" stroke="#64748b" stroke-width="1.5"/><text x="70.0" y="406.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="70.0" dy="0">0</tspan></text><line x1="134.5" y1="384.0" x2="134.5" y2="392.0" stroke="#64748b" stroke-width="1.5"/><text x="134.5" y="406.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="134.5" dy="0">30</tspan></text><line x1="715.0" y1="384.0" x2="715.0" y2="392.0" stroke="#64748b" stroke-width="1.5"/><text x="715.0" y="406.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="715.0" dy="0">300</tspan></text><rect x="60.0" y="418.0" width="880.0" height="30.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/><text x="500.0" y="438.0" font-size="11.5" font-weight="700" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Este caso: pedir RAC ahora y cada año</tspan></text><rect x="40.0" y="474.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="500.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Filtrado glomerular estimado (mL/min/1,73 m²)</tspan></text><text x="60.0" y="519.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Categorías G1-G5 con la creatinina (CKD-EPI 2021).</tspan></text><rect x="70.0" y="583.0" width="107.5" height="40.0" rx="6" fill="#fecdd3" stroke="#ffffff" stroke-width="2"/><text x="123.8" y="608.0" font-size="12" font-weight="800" font-style="normal" fill="#9f1239" text-anchor="middle" data-max="98"><tspan x="123.8" dy="0">G5</tspan></text><rect x="177.5" y="583.0" width="107.5" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="231.2" y="608.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="98"><tspan x="231.2" dy="0">G4</tspan></text><rect x="285.0" y="583.0" width="215.0" height="40.0" rx="6" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/><text x="392.5" y="608.0" font-size="12" font-weight="800" font-style="normal" fill="#c2410c" text-anchor="middle" data-max="205"><tspan x="392.5" dy="0">G3</tspan></text><rect x="500.0" y="583.0" width="215.0" height="40.0" rx="6" fill="#fef9c3" stroke="#ffffff" stroke-width="2"/><text x="607.5" y="608.0" font-size="12" font-weight="800" font-style="normal" fill="#a16207" text-anchor="middle" data-max="205"><tspan x="607.5" dy="0">G2</tspan></text><rect x="715.0" y="583.0" width="215.0" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="822.5" y="608.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="205"><tspan x="822.5" dy="0">G1</tspan></text><line x1="177.5" y1="623.0" x2="177.5" y2="631.0" stroke="#64748b" stroke-width="1.5"/><text x="177.5" y="645.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="177.5" dy="0">15</tspan></text><line x1="285.0" y1="623.0" x2="285.0" y2="631.0" stroke="#64748b" stroke-width="1.5"/><text x="285.0" y="645.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="285.0" dy="0">30</tspan></text><line x1="392.5" y1="623.0" x2="392.5" y2="631.0" stroke="#64748b" stroke-width="1.5"/><text x="392.5" y="645.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="392.5" dy="0">45</tspan></text><line x1="500.0" y1="623.0" x2="500.0" y2="631.0" stroke="#64748b" stroke-width="1.5"/><text x="500.0" y="645.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="500.0" dy="0">60</tspan></text><line x1="715.0" y1="623.0" x2="715.0" y2="631.0" stroke="#64748b" stroke-width="1.5"/><text x="715.0" y="645.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="715.0" dy="0">90</tspan></text><polygon points="777.7,569.0 795.7,569.0 786.7,581.0" fill="#ea580c"/><rect x="702.8" y="543.0" width="167.6" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="786.7" y="558.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="156"><tspan x="786.7" dy="0">◆ Creatinina normal: G1-G2</tspan></text><text x="40.0" y="691.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SI LA RAC SALE ALTA</tspan></text><rect x="40.0" y="701.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="702.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="725.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">IECA o ARA II</tspan></text><text x="58.0" y="746.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Bajan la albuminuria</tspan></text><rect x="351.3" y="701.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="352.3" y="702.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="369.3" y="725.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">iSGLT2</tspan></text><text x="369.3" y="746.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Protegen riñón y corazón</tspan></text><rect x="662.7" y="701.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="702.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="725.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">PA &lt; 130/80 y HbA1c ~7 %</tspan></text><text x="680.7" y="746.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Frenan la progresión</tspan></text><text x="40.0" y="810.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="820.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="851.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="842.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Sedimento urinario</tspan><tspan x="285.0" dy="17">en orina de 24 h</tspan></text><rect x="363.0" y="823.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="842.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Albúmina/creatinina</tspan><tspan x="435.0" dy="17">en orina aislada</tspan></text><text x="585.0" y="851.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Ecografía renal</tspan></text><text x="735.0" y="842.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Sodio en orina de</tspan><tspan x="735.0" dy="17">24 horas</tspan></text><text x="885.0" y="851.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Creatinina sérica</tspan></text><rect x="40.0" y="874.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="874.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="903.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Examen?</tspan></text><text x="285.0" y="895.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: engorroso y no</tspan><tspan x="285.0" dy="16">mide albúmina</tspan></text><text x="435.0" y="895.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: detecta albuminuria</tspan><tspan x="435.0" dy="16">precoz</tspan></text><text x="585.0" y="895.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: la estructura</tspan><tspan x="585.0" dy="16">cambia tarde</tspan></text><text x="735.0" y="895.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no evalúa daño</tspan><tspan x="735.0" dy="16">glomerular</tspan></text><text x="885.0" y="903.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: sube tarde</tspan></text><rect x="40.0" y="820.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="948.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="976.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="998.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Tamizaje anual en DM2 desde el diagnóstico (DM1 desde los 5 años): RAC + creatinina con TFG estimada.</tspan><tspan x="58.0" dy="18">• RAC ≥ 30 mg/g: IECA o ARA II + iSGLT2; añadir finerenona si persiste.</tspan><tspan x="58.0" dy="18">• Control de PA &lt; 130/80 y de la glucosa; evitar AINE.</tspan></text><text x="58.0" y="1056.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ADA Standards of Care in Diabetes 2026; KDIGO, diabetes en la ERC (2022) y ERC (2024).</tspan></text></svg>