<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="859" viewBox="0 0 1000 859" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La seudoobstrucción aguda del colon (Ogilvie) se asocia al uso de opioides"><title>La seudoobstrucción aguda del colon (Ogilvie) se asocia al uso de opioides</title><rect x="0.75" y="0.75" width="998.5" height="857.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Cirugía · seudoobstrucción del colon</tspan></text><rect x="419.4" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="462.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="462.6" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Síndrome de Ogilvie</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Dilatación masiva del colon sin obstrucción mecánica.</tspan><tspan x="58.0" dy="17">En pacientes graves, tras cirugía o trauma.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Con qué fármacos se relaciona?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CUÁNDO ACTUAR SEGÚN EL DIÁMETRO DEL CIEGO</tspan></text><rect x="40.0" y="253.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="279.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Diámetro del ciego en la radiografía (cm)</tspan></text><text x="60.0" y="298.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">&lt; 10 cm: vigilar. 10-12 cm: neostigmina. &gt; 12 cm o 6 días: riesgo de perforación.</tspan></text><rect x="70.0" y="362.0" width="537.5" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="338.8" y="387.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="528"><tspan x="338.8" dy="0">Vigilar</tspan></text><rect x="607.5" y="362.0" width="107.5" height="40.0" rx="6" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/><text x="661.2" y="387.0" font-size="12" font-weight="800" font-style="normal" fill="#c2410c" text-anchor="middle" data-max="98"><tspan x="661.2" dy="0">Neostigmina</tspan></text><rect x="715.0" y="362.0" width="215.0" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="822.5" y="387.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="205"><tspan x="822.5" dy="0">Descomprimir</tspan></text><line x1="392.5" y1="402.0" x2="392.5" y2="410.0" stroke="#64748b" stroke-width="1.5"/><text x="392.5" y="424.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="392.5" dy="0">6</tspan></text><line x1="607.5" y1="402.0" x2="607.5" y2="410.0" stroke="#64748b" stroke-width="1.5"/><text x="607.5" y="424.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="607.5" dy="0">10</tspan></text><line x1="715.0" y1="402.0" x2="715.0" y2="410.0" stroke="#64748b" stroke-width="1.5"/><text x="715.0" y="424.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="715.0" dy="0">12</tspan></text><line x1="930.0" y1="402.0" x2="930.0" y2="410.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="424.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">16</tspan></text><polygon points="652.2,348.0 670.2,348.0 661.2,360.0" fill="#ea580c"/><rect x="604.6" y="322.0" width="113.3" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="661.2" y="337.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="101"><tspan x="661.2" dy="0">◆ Ejemplo: 11 cm</tspan></text><text x="40.0" y="470.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">MANEJO DEL SÍNDROME DE OGILVIE</tspan></text><rect x="40.0" y="480.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="481.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="504.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Soporte</tspan></text><text x="58.0" y="525.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Ayuno, sondas, electrolitos</tspan></text><rect x="351.3" y="480.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="481.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="504.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Neostigmina IV</tspan></text><text x="369.3" y="525.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">2 mg con monitor y atropina</tspan></text><rect x="662.7" y="480.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="481.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="504.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Descompresión</tspan></text><text x="680.7" y="525.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Colonoscópica o quirúrgica</tspan></text><text x="40.0" y="589.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="599.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="621.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="602.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="621.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Narcóticos</tspan></text><text x="435.0" y="621.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Antipiréticos</tspan></text><text x="585.0" y="621.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Diuréticos</tspan></text><text x="735.0" y="621.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hipoglicemiantes</tspan></text><text x="885.0" y="621.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hipotensores</tspan></text><rect x="40.0" y="636.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="636.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="665.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Fármaco?</tspan></text><text x="285.0" y="657.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: reducen la</tspan><tspan x="285.0" dy="16">motilidad</tspan></text><text x="435.0" y="665.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no relacionados</tspan></text><text x="585.0" y="665.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no relacionados</tspan></text><text x="735.0" y="665.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no relacionados</tspan></text><text x="885.0" y="665.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no relacionados</tspan></text><rect x="40.0" y="599.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="710.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="738.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="760.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Opioides, anticolinérgicos, tricíclicos, antipsicóticos y bloqueantes de calcio; también sepsis y alteraciones electrolíticas.</tspan><tspan x="58.0" dy="18">• Inicio: ayuno, sonda nasogástrica y rectal, corregir electrolitos y suspender los fármacos causantes.</tspan><tspan x="58.0" dy="18">• Neostigmina IV 2 mg con monitorización (contraindicada en obstrucción mecánica y asma grave) o descompresión colonoscópica.</tspan></text><text x="58.0" y="818.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Sabiston Tratado de Cirugía 21.ª ed.; Schwartz Principios de Cirugía 11.ª ed.</tspan></text></svg>