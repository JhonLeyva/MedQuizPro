400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Tamizaje en zonas de riesgo</tspan></text><line x1="498.0" y1="367.0" x2="498.0" y2="380.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,379.0 503.0,379.0 498.0,387.0" fill="#0f766e"/><rect x="470.0" y="389.0" width="490.0" height="84.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><circle cx="498.0" cy="431.0" r="17" fill="#ffffff" stroke="none" stroke-width="0"/><text x="498.0" y="436.0" font-size="15" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">2</tspan></text><text x="528.0" y="424.0" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Resección endoscópica</tspan></text><text x="528.0" y="447.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Mucoso y diferenciado</tspan></text><rect x="860.7" y="378.0" width="58.5" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="393.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ PASO</tspan></text><line x1="498.0" y1="475.0" x2="498.0" y2="488.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,487.0 503.0,487.0 498.0,495.0" fill="#0f766e"/><rect x="470.0" y="497.0" width="490.0" height="84.0" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="539.0" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="544.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">3</tspan></text><text x="528.0" y="532.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Sobrevida &gt; 90 %</tspan></text><text x="528.0" y="555.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">A 5 años</tspan></text><rect x="40.0" y="617.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="645.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="667.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Clasificación japonesa I, II, III.</tspan><tspan x="58.0" dy="18">• Tipo IIc: deprimido.</tspan><tspan x="58.0" dy="18">• Japón y Corea: tamizaje endoscópico.</tspan></text><text x="58.0" y="725.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Japanese Gastric Cancer Treatment Guidelines (2021)</tspan></text></svg>