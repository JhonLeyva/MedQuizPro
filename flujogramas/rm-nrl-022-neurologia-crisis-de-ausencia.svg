<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1292" viewBox="0 0 1000 1292" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En las crisis de ausencia la etosuximida bloquea los canales de calcio tipo T del tálamo"><title>En las crisis de ausencia la etosuximida bloquea los canales de calcio tipo T del tálamo</title><rect x="0.75" y="0.75" width="998.5" height="1290.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neurología · crisis de ausencia</tspan></text><rect x="383.2" y="32.0" width="113.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="440.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="98"><tspan x="440.1" dy="0">NEUROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Crisis de ausencia típicas</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Crisis generalizadas no motoras de la infancia (4-10 años).</tspan><tspan x="58.0" dy="17">Pérdida breve de conciencia con mirada fija de 5-15 s, sin aura ni confusión posterior.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de tratamiento</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es el anticonvulsivante más efectivo en el</tspan><tspan x="640.0" dy="16">tratamiento de las crisis de ausencia?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DE LOS CANALES DEL TÁLAMO A LA CRISIS Y AL TRATAMIENTO</tspan></text><rect x="40.0" y="269.0" width="920.0" height="83.0" rx="0" fill="#e0f2fe" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="269.0" width="112.0" height="83.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="314.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Tálamo</tspan></text><rect x="40.0" y="352.0" width="920.0" height="83.0" rx="0" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="352.0" width="112.0" height="83.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="393.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Neurona</tspan><tspan x="96.0" dy="14">talámica</tspan></text><rect x="40.0" y="435.0" width="920.0" height="83.0" rx="0" fill="#fef3c7" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="435.0" width="112.0" height="83.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="480.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Corteza y EEG</tspan></text><rect x="40.0" y="518.0" width="920.0" height="83.0" rx="0" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="518.0" width="112.0" height="83.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="563.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Clínica</tspan></text><line x1="322.0" y1="337.0" x2="322.0" y2="356.0" stroke="#ea580c" stroke-width="2.2"/><polygon points="317.0,356.0 327.0,356.0 322.0,365.0" fill="#ea580c"/><line x1="322.0" y1="420.0" x2="322.0" y2="439.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="317.0,439.0 327.0,439.0 322.0,448.0" fill="#0f766e"/><line x1="322.0" y1="503.0" x2="322.0" y2="522.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="317.0,522.0 327.0,522.0 322.0,531.0" fill="#0f766e"/><rect x="172.0" y="284.0" width="300.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="300.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Oscilaciones talamocorticales</tspan></text><text x="182.0" y="317.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Dependen de los canales de calcio tipo T</tspan></text><circle cx="172.0" cy="284.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="288.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">1</tspan></text><rect x="172.0" y="367.0" width="300.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="182.0" y="383.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">La etosuximida bloquea los canales T</tspan></text><text x="182.0" y="400.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Fármaco de elección si solo hay ausencias</tspan></text><circle cx="172.0" cy="367.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="371.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">2</tspan></text><rect x="172.0" y="450.0" width="300.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="466.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Punta-onda a 3 Hz</tspan></text><text x="182.0" y="483.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Se reproduce con la hiperventilación</tspan></text><circle cx="172.0" cy="450.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="454.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">3</tspan></text><rect x="172.0" y="533.0" width="300.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="549.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Ausencia: mirada fija de 5-15 s</tspan></text><text x="182.0" y="566.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Sin aura ni confusión posterior</tspan></text><circle cx="172.0" cy="533.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="537.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">4</tspan></text><rect x="40.0" y="619.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="645.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Ausencias típicas = etosuximida</tspan></text><text x="60.0" y="664.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Valproato es equivalente, pero se reserva si coexisten crisis tonicoclónicas o mioclonías.</tspan></text><text x="40.0" y="725.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">FÁRMACOS EN LAS CRISIS DE AUSENCIA</tspan></text><rect x="40.0" y="737.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="756.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Fármaco</tspan></text><text x="220.0" y="756.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Mecanismo</tspan></text><text x="595.0" y="756.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Lugar en las ausencias</tspan></text><rect x="40.0" y="766.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="785.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Etosuximida</tspan></text><text x="220.0" y="785.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Bloquea canales de calcio tipo T</tspan></text><text x="595.0" y="785.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Elección si solo hay ausencias</tspan></text><rect x="110.6" y="769.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="156.0" y="784.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="156.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="795.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="814.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Valproato</tspan></text><text x="220.0" y="814.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Eficacia similar a la etosuximida</tspan></text><text x="595.0" y="814.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Si coexisten crisis tonicoclónicas o mioclonías; riesgo</tspan><tspan x="595.0" dy="15">teratogénico y hepático</tspan></text><rect x="40.0" y="839.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="858.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Fenitoína, carbamazepina</tspan></text><text x="220.0" y="858.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Bloquean canales de sodio</tspan></text><text x="595.0" y="858.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Pueden empeorarlas: contraindicadas</tspan></text><rect x="40.0" y="868.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="887.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Gabapentina, pregabalina</tspan></text><text x="220.0" y="887.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Subunidad α2δ de canales de calcio</tspan></text><text x="595.0" y="887.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Sin eficacia</tspan></text><text x="40.0" y="937.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="947.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="969.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="950.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="969.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Etosuximida</tspan></text><text x="435.0" y="969.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Fenitoína</tspan></text><text x="585.0" y="969.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Carbamazepina</tspan></text><text x="735.0" y="969.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Gabapentina</tspan></text><text x="885.0" y="969.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Pregabalina</tspan></text><rect x="40.0" y="984.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="984.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1013.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Anticonvulsivante más</tspan><tspan x="54.0" dy="16">efectivo?</tspan></text><text x="285.0" y="1005.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: bloquea los canales</tspan><tspan x="285.0" dy="16">de calcio tipo T del</tspan><tspan x="285.0" dy="16">tálamo</tspan></text><text x="435.0" y="1005.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: bloquea sodio y</tspan><tspan x="435.0" dy="16">puede empeorar las</tspan><tspan x="435.0" dy="16">ausencias</tspan></text><text x="585.0" y="1005.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: bloquea sodio y</tspan><tspan x="585.0" dy="16">puede empeorar las</tspan><tspan x="585.0" dy="16">ausencias</tspan></text><text x="735.0" y="1013.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: sin eficacia en las</tspan><tspan x="735.0" dy="16">ausencias</tspan></text><text x="885.0" y="1013.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: sin eficacia en las</tspan><tspan x="885.0" dy="16">ausencias</tspan></text><rect x="40.0" y="947.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1074.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1102.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1124.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• EEG: descargas de punta-onda a 3 Hz, desencadenadas por hiperventilación (3 minutos en la consulta). Dependen de oscilaciones talamocorticales y</tspan><tspan x="58.0" dy="18">   canales T.</tspan><tspan x="58.0" dy="18">• Glauser (NEJM 2010): libres de fallo a las 16 semanas, 53 % con etosuximida, 58 % con valproato y 29 % con lamotrigina; la etosuximida afecta menos</tspan><tspan x="58.0" dy="18">   la atención.</tspan><tspan x="58.0" dy="18">• Valproato si coexisten crisis tonicoclónicas o mioclonías (teratogénico y hepático). Fenitoína y carbamazepina pueden empeorar las ausencias.</tspan><tspan x="58.0" dy="18">• Gabapentina y pregabalina (subunidad α2δ) no tienen eficacia en ausencias. Etosuximida: náuseas, somnolencia y cefalea.</tspan></text><text x="58.0" y="1236.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Glauser TA et al., Ethosuximide, valproic acid, and lamotrigine in childhood absence epilepsy, N Engl J Med 2010;362:790-799; Harrison Principios de Medicina Interna,</tspan><tspan x="58.0" dy="15">21.ª ed. (2022); Goodman y Gilman, Las bases farmacológicas de la terapéutica, 14.ª ed. (2023)</tspan></text></svg>