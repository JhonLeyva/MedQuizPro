<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="912" viewBox="0 0 1000 912" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Rechazar la hipótesis nula cuando en realidad es verdadera (decir que hay efecto cuando no lo hay) es el error tipo I o alfa"><title>Rechazar la hipótesis nula cuando en realidad es verdadera (decir que hay efecto cuando no lo hay) es el error tipo I o alfa</title><rect x="0.75" y="0.75" width="998.5" height="910.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Bioestadística · pruebas de hipótesis</tspan></text><rect x="419.4" y="32.0" width="143.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="491.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="127"><tspan x="491.2" dy="0">SALUD PÚBLICA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Errores en las pruebas de hipótesis</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tipo I (α): rechazar la H₀ verdadera = falso positivo; se fija en 5 % (p &lt; 0,05).</tspan><tspan x="58.0" dy="17">Tipo II (β): no rechazar una H₀ falsa = falso negativo; la potencia es 1 − β.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Se asume erróneamente que la hipótesis nula es falsa.</tspan><tspan x="640.0" dy="16">¿Qué error se comete?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LA DECISIÓN FRENTE A LA REALIDAD</tspan></text><rect x="160.0" y="269.0" width="393.0" height="30.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="356.5" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="377"><tspan x="356.5" dy="0">En realidad H₀ es verdadera (no hay efecto)</tspan></text><rect x="567.0" y="269.0" width="393.0" height="30.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="763.5" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="377"><tspan x="763.5" dy="0">En realidad H₀ es falsa (hay efecto)</tspan></text><rect x="40.0" y="307.0" width="112.0" height="79.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="96.0" y="350.5" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="100"><tspan x="96.0" dy="0">Se rechaza H₀</tspan></text><rect x="160.0" y="307.0" width="393.0" height="79.0" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2.4"/><text x="174.0" y="334.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="365"><tspan x="174.0" dy="0">ERROR TIPO I (α)</tspan></text><text x="174.0" y="351.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="365"><tspan x="174.0" dy="0">Falso positivo</tspan><tspan x="174.0" dy="16">Probabilidad = nivel de significancia (5 %)</tspan></text><rect x="451.2" y="296.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="496.6" y="311.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="496.6" dy="0">◆ ESTE CASO</tspan></text><rect x="567.0" y="307.0" width="393.0" height="79.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="581.0" y="334.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="365"><tspan x="581.0" dy="0">Acierto: potencia (1 − β)</tspan></text><text x="581.0" y="351.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="365"><tspan x="581.0" dy="0">Detecta el efecto real</tspan></text><rect x="40.0" y="400.0" width="112.0" height="79.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="96.0" y="436.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="100"><tspan x="96.0" dy="0">No se rechaza</tspan><tspan x="96.0" dy="15">H₀</tspan></text><rect x="160.0" y="400.0" width="393.0" height="79.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="174.0" y="427.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="365"><tspan x="174.0" dy="0">Acierto (1 − α)</tspan></text><text x="174.0" y="444.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="365"><tspan x="174.0" dy="0">No hay efecto y no se encuentra</tspan></text><rect x="567.0" y="400.0" width="393.0" height="79.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="581.0" y="427.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="365"><tspan x="581.0" dy="0">ERROR TIPO II (β)</tspan></text><text x="581.0" y="444.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="365"><tspan x="581.0" dy="0">Falso negativo</tspan><tspan x="581.0" dy="16">Muestra pequeña</tspan></text><rect x="40.0" y="497.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="523.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Rechazar una hipótesis nula verdadera = error tipo I (alfa)</tspan></text><text x="60.0" y="542.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Es un falso positivo: «encontré efecto» y no lo había.</tspan></text><text x="40.0" y="609.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="619.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="650.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="650.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Error tipo II (beta)</tspan></text><text x="435.0" y="641.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Error de diseño</tspan><tspan x="435.0" dy="17">metodológico</tspan></text><rect x="513.0" y="622.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="650.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Error tipo I (alfa)</tspan></text><text x="735.0" y="641.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Error de</tspan><tspan x="735.0" dy="17">aleatorización</tspan></text><text x="885.0" y="650.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Error de medición</tspan></text><rect x="40.0" y="673.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="673.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="710.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Error?</tspan></text><text x="285.0" y="702.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es no rechazar una</tspan><tspan x="285.0" dy="16">H₀ falsa</tspan></text><text x="435.0" y="694.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es un problema del</tspan><tspan x="435.0" dy="16">diseño, no de la</tspan><tspan x="435.0" dy="16">decisión</tspan></text><text x="585.0" y="702.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: rechazar una H₀</tspan><tspan x="585.0" dy="16">verdadera</tspan></text><text x="735.0" y="710.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es de la asignación</tspan></text><text x="885.0" y="710.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es del instrumento</tspan></text><rect x="40.0" y="619.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="763.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="791.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="813.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• α baja (0,01) = menos falsos positivos pero más falsos negativos (si no se aumenta la muestra).</tspan><tspan x="58.0" dy="18">• Aumentar el tamaño de muestra reduce β y sube la potencia (≥ 80 %).</tspan><tspan x="58.0" dy="18">• Muchas comparaciones aumentan el error tipo I: corregir (Bonferroni).</tspan></text><text x="58.0" y="871.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Dawson y Trapp, Bioestadística médica; OPS, MOPECE.</tspan></text></svg>