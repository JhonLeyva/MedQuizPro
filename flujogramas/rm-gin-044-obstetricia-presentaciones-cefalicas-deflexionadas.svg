<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="957" viewBox="0 0 1000 957" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Pirámide nasal centrada al tacto en el trabajo de parto: presentación de frente"><title>Pirámide nasal centrada al tacto en el trabajo de parto: presentación de frente</title><rect x="0.75" y="0.75" width="998.5" height="955.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · presentaciones cefálicas deflexionadas</tspan></text><rect x="508.4" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="588.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="588.1" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Presentaciones cefálicas</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se clasifican por el grado de deflexión de la cabeza.</tspan><tspan x="58.0" dy="17">La palpación de la fontanela, la nariz o el mentón identifica cuál es.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante en trabajo de parto</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Tacto vaginal: se palpa la pirámide nasal centrada del</tspan><tspan x="640.0" dy="16">feto.</tspan><tspan x="640.0" dy="16">¿Cuál es la presentación fetal?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SE PALPA EN CADA PRESENTACIÓN CEFÁLICA</tspan></text><rect x="40.0" y="297.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="323.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Pirámide nasal centrada = presentación de frente</tspan></text><text x="60.0" y="342.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Si persiste de frente no se puede dar a luz por vía vaginal: se indica cesárea.</tspan></text><text x="40.0" y="403.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PRESENTACIONES CEFÁLICAS SEGÚN LA DEFLEXIÓN DE LA CABEZA (WILLIAMS)</tspan></text><rect x="40.0" y="415.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="434.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Presentación</tspan></text><text x="200.0" y="434.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="241"><tspan x="200.0" dy="0">Deflexión</tspan></text><text x="456.7" y="434.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="241"><tspan x="456.7" dy="0">Qué palpa el dedo</tspan></text><text x="713.3" y="434.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="241"><tspan x="713.3" dy="0">Conducta habitual</tspan></text><rect x="40.0" y="444.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="463.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Vértex</tspan></text><text x="200.0" y="463.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="200.0" dy="0">Flexión completa</tspan></text><text x="456.7" y="463.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="456.7" dy="0">Fontanela posterior (lambda)</tspan></text><text x="713.3" y="463.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="713.3" dy="0">Parto vaginal</tspan></text><rect x="40.0" y="473.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="492.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Bregma (sincipucio)</tspan></text><text x="200.0" y="492.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="200.0" dy="0">Primer grado</tspan></text><text x="456.7" y="492.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="456.7" dy="0">Fontanela anterior</tspan></text><text x="713.3" y="492.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="713.3" dy="0">Parto vaginal; suele flexionarse</tspan></text><rect x="40.0" y="502.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="521.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Frente</tspan></text><text x="200.0" y="521.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="200.0" dy="0">Segundo grado</tspan></text><text x="456.7" y="521.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="456.7" dy="0">Raíz y pirámide nasal, rebordes orbitarios;</tspan><tspan x="456.7" dy="15">ni boca ni mentón</tspan></text><text x="713.3" y="521.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="713.3" dy="0">Si persiste, cesárea</tspan></text><rect x="90.6" y="513.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="136.0" y="528.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="136.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="546.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="565.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Cara</tspan></text><text x="200.0" y="565.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="200.0" dy="0">Tercer grado</tspan></text><text x="456.7" y="565.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="456.7" dy="0">Boca, pómulos y mentón (punto de</tspan><tspan x="456.7" dy="15">referencia)</tspan></text><text x="713.3" y="565.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="241"><tspan x="713.3" dy="0">Vaginal si el mentón queda anterior;</tspan><tspan x="713.3" dy="15">cesárea si es posterior</tspan></text><text x="40.0" y="606.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">La frente es la presentación menos frecuente y la más desfavorable: el diámetro que debe pasar la pelvis es el mayor de la cabeza.</tspan></text><text x="40.0" y="653.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="663.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="685.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="666.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="685.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Frente</tspan></text><text x="435.0" y="685.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Cara</tspan></text><text x="585.0" y="685.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Mentón</tspan></text><text x="735.0" y="685.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Cefálica</tspan></text><text x="885.0" y="685.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Vértex</tspan></text><rect x="40.0" y="700.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="700.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="737.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Presentación?</tspan></text><text x="285.0" y="729.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: pirámide nasal</tspan><tspan x="285.0" dy="16">centrada</tspan></text><text x="435.0" y="721.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: la cara deja palpar</tspan><tspan x="435.0" dy="16">boca, pómulos y</tspan><tspan x="435.0" dy="16">mentón</tspan></text><text x="585.0" y="729.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es el punto de</tspan><tspan x="585.0" dy="16">referencia de la cara</tspan></text><text x="735.0" y="729.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es un término</tspan><tspan x="735.0" dy="16">general</tspan></text><text x="885.0" y="729.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: se palpa la</tspan><tspan x="885.0" dy="16">fontanela posterior</tspan></text><rect x="40.0" y="663.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="790.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="818.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="840.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Vértex: cabeza flexionada, se palpa la fontanela posterior. Bregma: deflexión de primer grado, se palpa la fontanela anterior.</tspan><tspan x="58.0" dy="18">• Frente: deflexión de segundo grado; el dedo toca la raíz y la pirámide nasal con los rebordes orbitarios, sin llegar a la boca ni al mentón.</tspan><tspan x="58.0" dy="18">• Cara: deflexión de tercer grado; se palpan boca, pómulos y mentón, que es el punto de referencia.</tspan><tspan x="58.0" dy="18">• Mentón es el punto de referencia de la cara, no una presentación; «cefálica» es el término general.</tspan></text><text x="58.0" y="916.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Williams Obstetricia 26.ª ed. (2022); Berek y Novak Ginecología 16.ª ed. (2020).</tspan></text></svg>