<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1264" viewBox="0 0 1000 1264" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Neumonía con fiebre persistente al tercer día, matidez y murmullo abolido en la base: derrame paraneumónico"><title>Neumonía con fiebre persistente al tercer día, matidez y murmullo abolido en la base: derrame paraneumónico</title><rect x="0.75" y="0.75" width="998.5" height="1262.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · derrame paraneumónico</tspan></text><rect x="408.5" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="457.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="457.6" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Derrame paraneumónico</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Complicación más frecuente de la neumonía bacteriana.</tspan><tspan x="58.0" dy="17">Evoluciona de fase exudativa a fibrinopurulenta y a empiema organizado.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 10 meses</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Neumonía hospitalizada hace 3 días; sigue febril,</tspan><tspan x="640.0" dy="16">taquipneico y con oxígeno.</tspan><tspan x="640.0" dy="16">Murmullo abolido y matidez en el tercio inferior del</tspan><tspan x="640.0" dy="16">hemitórax derecho.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EVOLUCIÓN DE LA NEUMONÍA HOSPITALIZADA (DÍAS, ORIENTATIVOS)</tspan></text><line x1="290.0" y1="323.0" x2="290.0" y2="517.0" stroke="#e2e8f0" stroke-width="1"/><text x="290.0" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="290.0" dy="0">0</tspan></text><line x1="382.9" y1="323.0" x2="382.9" y2="517.0" stroke="#e2e8f0" stroke-width="1"/><text x="382.9" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="382.9" dy="0">1</tspan></text><line x1="475.7" y1="323.0" x2="475.7" y2="517.0" stroke="#e2e8f0" stroke-width="1"/><text x="475.7" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="475.7" dy="0">2</tspan></text><line x1="568.6" y1="323.0" x2="568.6" y2="517.0" stroke="#e2e8f0" stroke-width="1"/><text x="568.6" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="568.6" dy="0">3</tspan></text><line x1="661.4" y1="323.0" x2="661.4" y2="517.0" stroke="#e2e8f0" stroke-width="1"/><text x="661.4" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="661.4" dy="0">4</tspan></text><line x1="754.3" y1="323.0" x2="754.3" y2="517.0" stroke="#e2e8f0" stroke-width="1"/><text x="754.3" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="754.3" dy="0">5</tspan></text><line x1="847.1" y1="323.0" x2="847.1" y2="517.0" stroke="#e2e8f0" stroke-width="1"/><text x="847.1" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="847.1" dy="0">6</tspan></text><line x1="940.0" y1="323.0" x2="940.0" y2="517.0" stroke="#e2e8f0" stroke-width="1"/><text x="940.0" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="940.0" dy="0">7</tspan></text><text x="940.0" y="305.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="end" data-max="60"><tspan x="940.0" dy="0">días</tspan></text><rect x="40.0" y="327.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="343.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Neumonía con antibiótico</tspan></text><text x="48.0" y="358.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Mejoría esperada en 48-72 h</tspan></text><rect x="290.0" y="335.0" width="278.6" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="381.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Fiebre persistente</tspan></text><text x="48.0" y="396.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Sigue febril tras 48-72 h</tspan></text><rect x="568.6" y="373.0" width="371.4" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><rect x="40.0" y="403.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="419.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Derrame paraneumónico</tspan></text><text x="48.0" y="434.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Matidez y abolición del murmullo</tspan></text><rect x="568.6" y="411.0" width="371.4" height="22.0" rx="6" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="48.0" y="457.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Ecografía de tórax</tspan></text><text x="48.0" y="472.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Volumen, septos y guía</tspan></text><rect x="568.6" y="449.0" width="185.7" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><rect x="40.0" y="479.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="495.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Drenaje si es moderado</tspan></text><text x="48.0" y="510.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Toracocentesis o tubo</tspan></text><rect x="661.4" y="487.0" width="278.6" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><line x1="568.6" y1="325.0" x2="568.6" y2="523.0" stroke="#b91c1c" stroke-width="2.6"/><rect x="529.2" y="523.0" width="78.8" height="22.0" rx="11" fill="#b91c1c" stroke="none" stroke-width="1.5"/><text x="568.6" y="538.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="568.6" dy="0">Caso: día 3</tspan></text><rect x="40.0" y="569.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="595.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Fiebre al tercer día + matidez = derrame paraneumónico</tspan></text><text x="60.0" y="614.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Bronquiolitis, insuficiencia cardiaca, tuberculosis y síndrome obstructivo no explican la matidez.</tspan></text><text x="40.0" y="675.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DERRAME PARANEUMÓNICO: TAMAÑO Y CONDUCTA (IDSA/PIDS 2011)</tspan></text><rect x="40.0" y="687.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="706.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="434"><tspan x="50.0" dy="0">Derrame</tspan></text><text x="500.0" y="706.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="454"><tspan x="500.0" dy="0">Conducta</tspan></text><rect x="40.0" y="716.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="735.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="434"><tspan x="50.0" dy="0">Pequeño (menos de 10 mm en decúbito lateral)</tspan></text><text x="500.0" y="735.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="454"><tspan x="500.0" dy="0">Antibióticos, sin drenaje</tspan></text><rect x="40.0" y="745.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="764.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="434"><tspan x="50.0" dy="0">Moderado a grande con compromiso respiratorio</tspan></text><text x="500.0" y="764.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="454"><tspan x="500.0" dy="0">Drenaje por toracocentesis o tubo (este caso: matidez y oxígeno)</tspan></text><rect x="390.6" y="748.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="436.0" y="763.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="436.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="774.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="793.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="434"><tspan x="50.0" dy="0">Loculado</tspan></text><text x="500.0" y="793.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="454"><tspan x="500.0" dy="0">Fibrinolíticos o videotoracoscopía</tspan></text><rect x="40.0" y="803.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="822.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="434"><tspan x="50.0" dy="0">Líquido con pH menor de 7,2, glucosa baja, LDH alta o pus</tspan></text><text x="500.0" y="822.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="454"><tspan x="500.0" dy="0">Empiema</tspan></text><text x="40.0" y="872.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="882.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="921.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="885.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="913.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Derrame</tspan><tspan x="285.0" dy="17">paraneumónico</tspan></text><text x="435.0" y="921.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Bronquiolitis</tspan></text><text x="585.0" y="913.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Insuficiencia</tspan><tspan x="585.0" dy="17">cardíaca congestiva</tspan></text><text x="735.0" y="913.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Tuberculosis</tspan><tspan x="735.0" dy="17">pulmonar</tspan></text><text x="885.0" y="904.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Síndrome</tspan><tspan x="885.0" dy="17">obstructivo</tspan><tspan x="885.0" dy="17">bronquial</tspan></text><rect x="40.0" y="953.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="953.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="982.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico más</tspan><tspan x="54.0" dy="16">probable?</tspan></text><text x="285.0" y="974.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: fiebre persistente,</tspan><tspan x="285.0" dy="16">matidez y murmullo</tspan><tspan x="285.0" dy="16">abolido</tspan></text><text x="435.0" y="982.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: sin matidez, en</tspan><tspan x="435.0" dy="16">menores de 2 años</tspan></text><text x="585.0" y="982.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no explica la fiebre</tspan><tspan x="585.0" dy="16">persistente</tspan></text><text x="735.0" y="974.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no explica el</tspan><tspan x="735.0" dy="16">cuadro agudo con</tspan><tspan x="735.0" dy="16">matidez</tspan></text><text x="885.0" y="982.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: da sibilancias, no</tspan><tspan x="885.0" dy="16">matidez</tspan></text><rect x="40.0" y="882.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1043.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1071.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1093.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Neumonía con fiebre después de 48-72 horas de antibiótico, matidez y abolición del murmullo: derrame hasta demostrar lo contrario; pensar en derrame</tspan><tspan x="58.0" dy="18">   antes que cambiar de antibiótico.</tspan><tspan x="58.0" dy="18">• Radiografía: borramiento del ángulo costofrénico y opacidad homogénea con menisco; la ecografía torácica es el estudio de elección (volumen, septos,</tspan><tspan x="58.0" dy="18">   guía de punción).</tspan><tspan x="58.0" dy="18">• IDSA/PIDS 2011: derrame pequeño (menos de 10 mm en decúbito lateral) con antibióticos; moderado a grande con compromiso respiratorio, drenaje;</tspan><tspan x="58.0" dy="18">   loculado, fibrinolíticos o videotoracoscopía.</tspan><tspan x="58.0" dy="18">• Alerta: pH menor de 7,2, glucosa baja, LDH alta o pus definen empiema.</tspan></text><text x="58.0" y="1223.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Bradley JS et al., IDSA/PIDS, Clin Infect Dis 2011;53:e25; Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>