dy="0">Buscar daño de órgano blanco: HVI (choque de punta amplio y</tspan><tspan x="108" dy="22">desplazado), ECG, ecocardiograma, fondo de ojo y función</tspan><tspan x="108" dy="22">renal</tspan></text><line x1="410.0" y1="374" x2="410.0" y2="394" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,392 417.0,392 410.0,402" fill="#94a3b8"/><rect x="90" y="404" width="640" height="104" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><circle cx="120" cy="456.0" r="12" fill="#d97706"/><text x="120" y="461.0" font-size="15" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="120" dy="0">?</tspan></text><text x="142" y="432" font-size="11" font-weight="700" font-style="normal" fill="#b45309" text-anchor="start" data-max="570"><tspan x="142" dy="0">DECISIÓN</tspan></text><text x="142" y="456" font-size="16" font-weight="600" font-style="normal" fill="#78350f" text-anchor="start" data-max="570"><tspan x="142" dy="0">¿HTA grado 2 o daño de órgano blanco?</tspan></text><text x="142" y="484" font-size="14" font-weight="500" font-style="italic" fill="#92400e" text-anchor="start" data-max="570"><tspan x="142" dy="0">↳ Ambos presentes en este caso: no esperar a un nuevo control</tspan></text><line x1="410.0" y1="510" x2="410.0" y2="530" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,528 417.0,528 410.0,538" fill="#94a3b8"/><rect x="90" y="540" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="568" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="592" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Iniciar antihipertensivo (combinación: IECA o ARA II +</tspan><tspan x="108" dy="22">calcioantagonista o tiazida)</tspan></text><line x1="410.0" y1="640" x2="410.0" y2="660" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,658 417.0,658 410.0,668" fill="#94a3b8"/><rect x="90" y="670" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="698" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="722" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Cambios de estilo de vida: dieta hiposódica, ejercicio</tspan><tspan x="108" dy="22">aeróbico y control de peso</tspan></text><line x1="410.0" y1="770" x2="410.0" y2="790" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,788 417.0,788 410.0,798" fill="#94a3b8"/><rect x="90" y="800" width="640" height="76" rx="12" fill="#134e4a" stroke="#134e4a" stroke-width="2"/><text x="108" y="828" font-size="11" font-weight="700" font-style="normal" fill="#5eead4" text-anchor="start" data-max="604"><tspan x="108" dy="0">CONDUCTA FINAL</tspan></text><text x="108" y="852" font-size="16" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Derivar a cardiología para estudio y seguimiento</tspan></text><rect x="40" y="906" width="740" height="98" rx="10" fill="#f0fdfa" stroke="#99f6e4"/><rect x="40" y="906" width="6" height="98" rx="3" fill="#14b8a6"/><text x="62" y="932" font-size="14" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="704"><tspan x="62" dy="0">Perla clínica</tspan></text><text x="62" y="956" font-size="15" font-weight="400" font-style="normal" fill="#134e4a" text-anchor="start" data-max="704"><tspan x="62" dy="0">Con daño de órgano blanco el tratamiento farmacológico empieza de</tspan><tspan x="62" dy="21">inmediato; la dieta sola no basta.</tspan></text><text x="410.0" y="1032" font-size="11" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="740"><tspan x="410.0" dy="0">MedQuizPlus · Material de estudio: contrasta siempre con las guías clínicas vigentes.</tspan></text></svg>
