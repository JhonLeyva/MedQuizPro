<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="971" viewBox="0 0 1000 971" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Diabetes sintomática con pérdida de peso y HbA1c de 9,5 %: se inicia insulina NPH"><title>Diabetes sintomática con pérdida de peso y HbA1c de 9,5 %: se inicia insulina NPH</title><rect x="0.75" y="0.75" width="998.5" height="969.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Diabetes tipo 2 · cuándo iniciar insulina</tspan></text><rect x="433.8" y="32.0" width="140.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="504.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="124"><tspan x="504.0" dy="0">ENDOCRINOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Insulina desde el inicio</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cuando hay catabolismo, el déficit de insulina es relativo o franco.</tspan><tspan x="58.0" dy="17">La insulina basal corrige la glucotoxicidad y luego se reevalúa.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 45 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Polidipsia, poliuria y pérdida de peso marcada; IMC 22.</tspan><tspan x="640.0" dy="16">Glucosa 210 mg/dL y HbA1c 9,5 %.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ TRATAMIENTO CORRESPONDE SEGÚN LA GRAVEDAD</tspan></text><rect x="70.0" y="279.0" width="34.0" height="330.0" rx="17" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="75.0" y="530.5" width="24.0" height="74.5" rx="8" fill="#10b981" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="567.8" x2="130.0" y2="567.8" stroke="#10b981" stroke-width="2"/><rect x="130.0" y="531.5" width="330.0" height="72.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="553.5" font-size="12" font-weight="800" font-style="normal" fill="#10b981" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Meta</tspan></text><text x="240.0" y="553.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">HbA1c &lt; 7 % sin síntomas</tspan></text><text x="144.0" y="574.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Estilo de vida, metformina</tspan></text><rect x="75.0" y="448.0" width="24.0" height="74.5" rx="8" fill="#f59e0b" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="485.2" x2="130.0" y2="485.2" stroke="#f59e0b" stroke-width="2"/><rect x="130.0" y="449.0" width="330.0" height="72.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="471.0" font-size="12" font-weight="800" font-style="normal" fill="#f59e0b" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Sin síntomas</tspan></text><text x="240.0" y="471.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">HbA1c &lt; 10 % y sin catabolismo</tspan></text><text x="144.0" y="492.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Metformina ± segundo fármaco</tspan></text><rect x="75.0" y="365.5" width="24.0" height="74.5" rx="8" fill="#f97316" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="402.8" x2="130.0" y2="402.8" stroke="#0f766e" stroke-width="3"/><rect x="130.0" y="366.5" width="330.0" height="72.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="144.0" y="388.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Catabolismo</tspan></text><text x="240.0" y="388.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Pérdida de peso y síntomas</tspan></text><text x="144.0" y="409.5" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Insulina basal (NPH)</tspan></text><rect x="354.6" y="355.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="400.0" y="370.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="400.0" dy="0">◆ ESTE CASO</tspan></text><rect x="75.0" y="283.0" width="24.0" height="74.5" rx="8" fill="#e11d48" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="320.2" x2="130.0" y2="320.2" stroke="#e11d48" stroke-width="2"/><rect x="130.0" y="284.0" width="330.0" height="72.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="306.0" font-size="12" font-weight="800" font-style="normal" fill="#e11d48" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Muy alta</tspan></text><text x="240.0" y="306.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">HbA1c &gt; 10 % o glucemia ≥ 300</tspan></text><text x="144.0" y="327.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Insulina; descartar cetoacidosis</tspan></text><text x="470.0" y="283.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="490"><tspan x="470.0" dy="0">QUÉ SE HACE EN ESTE CASO</tspan></text><rect x="470.0" y="297.0" width="490.0" height="84.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><circle cx="498.0" cy="339.0" r="17" fill="#ffffff" stroke="none" stroke-width="0"/><text x="498.0" y="344.0" font-size="15" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">1</tspan></text><text x="528.0" y="332.0" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Iniciar insulina NPH basal</tspan></text><text x="528.0" y="355.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Corrige el catabolismo</tspan></text><rect x="844.6" y="286.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="301.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><line x1="498.0" y1="383.0" x2="498.0" y2="396.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,395.0 503.0,395.0 498.0,403.0" fill="#0f766e"/><rect x="470.0" y="405.0" width="490.0" height="84.0" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="447.0" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="452.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">2</tspan></text><text x="528.0" y="440.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Descartar cetonas y autoinmunidad</tspan></text><text x="528.0" y="463.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Cetonas, anticuerpos y péptido C</tspan></text><line x1="498.0" y1="491.0" x2="498.0" y2="504.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,503.0 503.0,503.0 498.0,511.0" fill="#0f766e"/><rect x="470.0" y="513.0" width="490.0" height="84.0" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="555.0" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="560.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">3</tspan></text><text x="528.0" y="548.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Reevaluar y añadir metformina</tspan></text><text x="528.0" y="571.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Reducir o retirar la insulina</tspan></text><text x="40.0" y="649.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="659.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="681.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="681.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Pioglitazona</tspan></text><text x="435.0" y="681.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Dieta hipoglúcida</tspan></text><text x="585.0" y="681.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Metformina</tspan></text><text x="735.0" y="681.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Glimepirida</tspan></text><rect x="813.0" y="662.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="681.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Insulina NPH</tspan></text><rect x="40.0" y="696.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="696.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="733.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tratamiento?</tspan></text><text x="285.0" y="725.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no corrige el</tspan><tspan x="285.0" dy="16">catabolismo</tspan></text><text x="435.0" y="717.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: insuficiente con</tspan><tspan x="435.0" dy="16">síntomas y HbA1c de</tspan><tspan x="435.0" dy="16">9,5 %</tspan></text><text x="585.0" y="717.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: primera línea, pero</tspan><tspan x="585.0" dy="16">no corrige el</tspan><tspan x="585.0" dy="16">catabolismo</tspan></text><text x="735.0" y="717.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no corrige el</tspan><tspan x="735.0" dy="16">catabolismo y causa</tspan><tspan x="735.0" dy="16">hipoglucemia</tspan></text><text x="885.0" y="717.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: corrige el</tspan><tspan x="885.0" dy="16">catabolismo y la</tspan><tspan x="885.0" dy="16">glucotoxicidad</tspan></text><rect x="40.0" y="659.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="786.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="814.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="836.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• ADA 2025: considerar insulina desde el inicio si hay catabolismo (pérdida de peso, cetosis), síntomas de hiperglucemia, HbA1c &gt; 10 % o glucemia ≥ 300</tspan><tspan x="58.0" dy="18">   mg/dL.</tspan><tspan x="58.0" dy="18">• Pérdida de peso con IMC normal sugiere déficit de insulina: descartar cetonas y pedir anticuerpos y péptido C (diabetes autoinmune del adulto).</tspan><tspan x="58.0" dy="18">• Metformina es la primera línea sin catabolismo, pero no corrige la pérdida de peso; la dieta sola es insuficiente con HbA1c tan alta.</tspan><tspan x="58.0" dy="18">• Pasada la glucotoxicidad se reevalúa: se añade metformina y se reduce o retira la insulina. Meta de presión &lt; 130/80 (la paciente tiene 150/80).</tspan></text><text x="58.0" y="930.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ADA, Standards of Care in Diabetes, tratamiento farmacológico (2025); MINSA, GPC de DM2 en el primer nivel de atención</tspan></text></svg>