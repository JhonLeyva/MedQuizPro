<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1142" viewBox="0 0 1000 1142" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Paro con actividad eléctrica organizada pero sin pulso en un neumotórax a tensión: disociación electromecánica (AESP)"><title>Paro con actividad eléctrica organizada pero sin pulso en un neumotórax a tensión: disociación electromecánica (AESP)</title><rect x="0.75" y="0.75" width="998.5" height="1141.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Reanimación · ritmos de paro</tspan></text><rect x="375.0" y="32.0" width="101.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="425.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="85"><tspan x="425.6" dy="0">CIRUGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Actividad eléctrica sin pulso (AESP)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El monitor muestra un ritmo organizado, pero el corazón no bombea: no hay pulso.</tspan><tspan x="58.0" dy="17">Antes se llamaba disociación electromecánica; casi siempre tiene una causa reversible.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Anciano atropellado</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Disnea severa; neumotórax a tensión.</tspan><tspan x="640.0" dy="16">Paro: ritmo organizado en el monitor, sin pulso ni</tspan><tspan x="640.0" dy="16">presión.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="395.0" x2="733.5" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="395.0" x2="266.5" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,423.0 271.5,423.0 266.5,431.0" fill="#94a3b8"/><line x1="733.5" y1="395.0" x2="733.5" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,423.0 738.5,423.0 733.5,431.0" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#0f766e"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="395.0" x2="733.5" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="733.5" y1="395.0" x2="733.5" y2="424.0" stroke="#0f766e" stroke-width="3"/><polygon points="728.5,423.0 738.5,423.0 733.5,431.0" fill="#0f766e"/><rect x="214.6" y="404.0" width="103.8" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="266.5" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">FV o TV sin pulso</tspan></text><rect x="642.7" y="404.0" width="181.7" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="733.5" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Organizado sin pulso (este caso)</tspan></text><polygon points="240.0,336.0 266.0,307.0 734.0,307.0 760.0,336.0 734.0,365.0 266.0,365.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="336.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="341.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="340.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Paro: ¿qué ritmo hay en el monitor?</tspan></text><rect x="40.0" y="431.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="266.5" y="467.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Descarga</tspan></text><text x="266.5" y="490.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Desfibrilable</tspan></text><rect x="507.0" y="431.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="733.5" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">AESP</tspan></text><text x="733.5" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">RCP + adrenalina</tspan><tspan x="733.5" dy="17">Descomprimir el tórax</tspan></text><text x="40.0" y="561.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CAUSAS CON NOMBRE PROPIO</tspan></text><rect x="40.0" y="573.5" width="920.0" height="225.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><line x1="62.0" y1="615.5" x2="938.0" y2="615.5" stroke="#64748b" stroke-width="2"/><line x1="62.0" y1="615.5" x2="62.0" y2="623.5" stroke="#64748b" stroke-width="2"/><line x1="938.0" y1="615.5" x2="938.0" y2="623.5" stroke="#64748b" stroke-width="2"/><rect x="348.2" y="603.5" width="303.6" height="24.0" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/><text x="500.0" y="619.5" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="290"><tspan x="500.0" dy="0">LAS 5 T (CAUSAS REVERSIBLES) · 1 de 5 en el caso</tspan></text><rect x="56.0" y="635.5" width="168.0" height="116.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="76.0" cy="658.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="76.0" y="662.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="76.0" dy="0">1</tspan></text><text x="94.0" y="663.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="122"><tspan x="94.0" dy="0">Tensión:</tspan><tspan x="94.0" dy="17">neumotórax</tspan></text><text x="68.0" y="701.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="144"><tspan x="68.0" dy="0">Sí</tspan></text><rect x="68.0" y="717.5" width="144.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="140.0" y="732.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="132"><tspan x="140.0" dy="0">✓ EN EL CASO</tspan></text><rect x="236.0" y="635.5" width="168.0" height="116.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="256.0" cy="658.5" r="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="256.0" y="662.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="256.0" dy="0">2</tspan></text><text x="274.0" y="663.5" font-size="12.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="start" data-max="122"><tspan x="274.0" dy="0">Taponamiento</tspan><tspan x="274.0" dy="17">cardiaco</tspan></text><text x="248.0" y="701.5" font-size="11.5" font-weight="400" font-style="normal" fill="#64748b" text-anchor="start" data-max="144"><tspan x="248.0" dy="0">No se informa</tspan></text><rect x="248.0" y="717.5" width="144.0" height="22.0" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/><text x="320.0" y="732.5" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="132"><tspan x="320.0" dy="0">— NO DESCRITO</tspan></text><rect x="416.0" y="635.5" width="168.0" height="116.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="436.0" cy="658.5" r="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="436.0" y="662.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="436.0" dy="0">3</tspan></text><text x="454.0" y="663.5" font-size="12.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="start" data-max="122"><tspan x="454.0" dy="0">Tóxicos</tspan></text><text x="428.0" y="689.5" font-size="11.5" font-weight="400" font-style="normal" fill="#64748b" text-anchor="start" data-max="144"><tspan x="428.0" dy="0">No</tspan></text><rect x="428.0" y="717.5" width="144.0" height="22.0" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/><text x="500.0" y="732.5" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="132"><tspan x="500.0" dy="0">— NO DESCRITO</tspan></text><rect x="596.0" y="635.5" width="168.0" height="116.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="616.0" cy="658.5" r="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="616.0" y="662.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="616.0" dy="0">4</tspan></text><text x="634.0" y="663.5" font-size="12.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="start" data-max="122"><tspan x="634.0" dy="0">Trombosis</tspan><tspan x="634.0" dy="17">pulmonar</tspan></text><text x="608.0" y="701.5" font-size="11.5" font-weight="400" font-style="normal" fill="#64748b" text-anchor="start" data-max="144"><tspan x="608.0" dy="0">No se informa</tspan></text><rect x="608.0" y="717.5" width="144.0" height="22.0" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/><text x="680.0" y="732.5" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="132"><tspan x="680.0" dy="0">— NO DESCRITO</tspan></text><rect x="776.0" y="635.5" width="168.0" height="116.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="796.0" cy="658.5" r="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="796.0" y="662.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="796.0" dy="0">5</tspan></text><text x="814.0" y="663.5" font-size="12.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="start" data-max="122"><tspan x="814.0" dy="0">Trombosis</tspan><tspan x="814.0" dy="17">coronaria</tspan></text><text x="788.0" y="701.5" font-size="11.5" font-weight="400" font-style="normal" fill="#64748b" text-anchor="start" data-max="144"><tspan x="788.0" dy="0">No se informa</tspan></text><rect x="788.0" y="717.5" width="144.0" height="22.0" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/><text x="860.0" y="732.5" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="132"><tspan x="860.0" dy="0">— NO DESCRITO</tspan></text><text x="56.0" y="778.5" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">El neumotórax a tensión es la causa: descomprimir ya.</tspan></text><text x="40.0" y="838.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="848.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="888.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="879.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Fibrilación</tspan><tspan x="285.0" dy="17">ventricular</tspan></text><text x="435.0" y="888.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Asistolia</tspan></text><rect x="513.0" y="851.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="879.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Disociación</tspan><tspan x="585.0" dy="17">electromecánica</tspan></text><text x="735.0" y="871.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Taquicardia</tspan><tspan x="735.0" dy="17">ventricular sin</tspan><tspan x="735.0" dy="17">pulso</tspan></text><text x="885.0" y="888.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Bradicardia sinusal</tspan></text><rect x="40.0" y="919.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="919.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="948.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Cómo se denomina?</tspan></text><text x="285.0" y="940.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: ritmo caótico,</tspan><tspan x="285.0" dy="16">desfibrilable</tspan></text><text x="435.0" y="948.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: línea plana</tspan></text><text x="585.0" y="940.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: ritmo organizado</tspan><tspan x="585.0" dy="16">sin pulso</tspan></text><text x="735.0" y="940.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: QRS ancho rápido,</tspan><tspan x="735.0" dy="16">desfibrilable</tspan></text><text x="885.0" y="948.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: tendría pulso</tspan></text><rect x="40.0" y="848.5" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="993.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1021.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1043.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Ritmo no desfibrilable: RCP de calidad + adrenalina 1 mg cada 3-5 min.</tspan><tspan x="58.0" dy="18">• Buscar y tratar las 5 H y 5 T; aquí, descompresión inmediata del neumotórax.</tspan><tspan x="58.0" dy="18">• En el paro traumático, tratar la causa (descomprimir, controlar sangrado) pesa más que la adrenalina.</tspan></text><text x="58.0" y="1101.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AHA/ILCOR, guías de reanimación 2025; ATLS 11.ª ed. (2025).</tspan></text></svg>