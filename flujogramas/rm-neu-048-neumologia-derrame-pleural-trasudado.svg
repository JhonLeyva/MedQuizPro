<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1208" viewBox="0 0 1000 1208" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El mixedema del hipotiroidismo grave es una causa de derrame pleural tipo trasudado"><title>El mixedema del hipotiroidismo grave es una causa de derrame pleural tipo trasudado</title><rect x="0.75" y="0.75" width="998.5" height="1206.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neumología · derrame pleural trasudado</tspan></text><rect x="438.6" y="32.0" width="114.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="496.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="99"><tspan x="496.0" dy="0">NEUMOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Trasudado y exudado</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El trasudado nace de un desequilibrio de las fuerzas de Starling con pleura sana.</tspan><tspan x="58.0" dy="17">El exudado nace de inflamación o infiltración de la pleura.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿En cuál de estas enfermedades hay derrame pleural</tspan><tspan x="640.0" dy="16">tipo trasudado?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ LADO DE LA BALANZA OCUPA CADA CAUSA</tspan></text><rect x="493.0" y="319.0" width="14" height="190" rx="5" fill="#64748b"/><path d="M440.0 524.0 H560.0 L540.0 504.0 H460.0 Z" fill="#475569"/><circle cx="500.0" cy="319.0" r="15" fill="#f59e0b" stroke="#92400e" stroke-width="2"/><line x1="385.4" y1="337.1" x2="614.6" y2="300.9" stroke="#334155" stroke-width="7" stroke-linecap="round"/><line x1="385.4" y1="337.1" x2="357.4" y2="399.1" stroke="#64748b" stroke-width="2"/><line x1="385.4" y1="337.1" x2="413.4" y2="399.1" stroke="#64748b" stroke-width="2"/><path d="M347.4 399.1 H423.4 Q385.4 443.1 347.4 399.1 Z" fill="#ea580c"/><text x="385.4" y="414.1" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="385.4" dy="0">SANA</tspan></text><line x1="614.6" y1="300.9" x2="586.6" y2="362.9" stroke="#64748b" stroke-width="2"/><line x1="614.6" y1="300.9" x2="642.6" y2="362.9" stroke="#64748b" stroke-width="2"/><path d="M576.6 362.9 H652.6 Q614.6 406.9 576.6 362.9 Z" fill="#64748b"/><text x="614.6" y="377.9" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="614.6" dy="0">DAÑO</tspan></text><text x="500.0" y="551.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="300"><tspan x="500.0" dy="0">¿Cuál de las opciones produce trasudado?</tspan></text><rect x="40.0" y="289.0" width="290.0" height="158.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><text x="58.0" y="317.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="254"><tspan x="58.0" dy="0">Trasudado</tspan></text><circle cx="62.0" cy="342.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="346.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Insuficiencia cardíaca, cirrosis, nefrótico</tspan></text><circle cx="62.0" cy="368.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="372.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Hipoalbuminemia</tspan></text><circle cx="62.0" cy="394.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="398.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Mixedema (este caso)</tspan></text><circle cx="62.0" cy="420.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="424.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Sarcoidosis, urinotórax, diálisis peritoneal</tspan></text><rect x="214.6" y="278.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="260.0" y="293.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="260.0" dy="0">◆ ESTE CASO</tspan></text><rect x="670.0" y="289.0" width="290.0" height="158.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="688.0" y="317.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="688.0" dy="0">Exudado</tspan></text><circle cx="692.0" cy="342.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="346.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Mesotelioma</tspan></text><circle cx="692.0" cy="368.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="372.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Granulomatosis de Wegener</tspan></text><circle cx="692.0" cy="394.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="398.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Lupus eritematoso sistémico</tspan></text><circle cx="692.0" cy="420.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="424.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Neumonía, tuberculosis y cáncer</tspan></text><rect x="40.0" y="585.0" width="920.0" height="93.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="613.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Mixedema = trasudado</tspan></text><text x="500.0" y="634.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Mesotelioma, Wegener y lupus inflaman o infiltran la pleura.</tspan><tspan x="500.0" dy="17">La hernia diafragmática no es causa clásica de trasudado.</tspan></text><text x="40.0" y="712.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CRITERIOS DE LIGHT: EL LÍQUIDO ES EXUDADO SI CUMPLE UNO</tspan></text><rect x="40.0" y="724.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="743.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Criterio</tspan></text><text x="270.0" y="743.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="684"><tspan x="270.0" dy="0">Punto de corte</tspan></text><rect x="40.0" y="753.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="772.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Proteínas pleura/suero</tspan></text><text x="270.0" y="772.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="684"><tspan x="270.0" dy="0">Mayor de 0,5</tspan></text><rect x="40.0" y="782.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="801.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">LDH pleura/suero</tspan></text><text x="270.0" y="801.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="684"><tspan x="270.0" dy="0">Mayor de 0,6</tspan></text><rect x="40.0" y="811.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="830.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">LDH pleural</tspan></text><text x="270.0" y="830.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="684"><tspan x="270.0" dy="0">Más de dos tercios del límite superior normal sérico</tspan></text><text x="40.0" y="856.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Si no cumple ninguno es trasudado: tratar la enfermedad de fondo y evitar la toracocentesis repetida.</tspan></text><text x="40.0" y="903.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="913.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="944.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="944.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Mesotelioma</tspan></text><rect x="363.0" y="916.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="944.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Mixedema</tspan></text><text x="585.0" y="935.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Hernia</tspan><tspan x="585.0" dy="17">diafragmática</tspan></text><text x="735.0" y="935.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Granulomatosis de</tspan><tspan x="735.0" dy="17">Wegener</tspan></text><text x="885.0" y="935.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Lupus eritematoso</tspan><tspan x="885.0" dy="17">sistémico</tspan></text><rect x="40.0" y="967.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="967.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="996.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Trasudado?</tspan></text><text x="285.0" y="988.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: infiltración pleural,</tspan><tspan x="285.0" dy="16">exudado</tspan></text><text x="435.0" y="988.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: causa infrecuente</tspan><tspan x="435.0" dy="16">de trasudado</tspan></text><text x="585.0" y="988.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no es causa</tspan><tspan x="585.0" dy="16">clásica de trasudado</tspan></text><text x="735.0" y="988.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: vasculitis con</tspan><tspan x="735.0" dy="16">exudado</tspan></text><text x="885.0" y="988.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: inflamación</tspan><tspan x="885.0" dy="16">pleural, exudado</tspan></text><rect x="40.0" y="913.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1041.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1069.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1091.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Criterios de Light (1972): exudado si proteínas pleura/suero &gt; 0,5, LDH pleura/suero &gt; 0,6 o LDH pleural &gt; 2/3 del límite sérico.</tspan><tspan x="58.0" dy="18">• Trasudado: insuficiencia cardíaca, cirrosis, síndrome nefrótico e hipoalbuminemia; infrecuentes, mixedema, sarcoidosis, urinotórax y diálisis peritoneal.</tspan><tspan x="58.0" dy="18">• Mesotelioma, granulomatosis de Wegener y lupus cursan con exudado; se trata la causa y se evita la toracocentesis repetida.</tspan><tspan x="58.0" dy="18">• Alerta: con diuréticos un trasudado puede parecer exudado; el gradiente de albúmina sérica menos pleural &gt; 1,2 g/dL lo reclasifica.</tspan></text><text x="58.0" y="1167.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Light RW et al., Ann Intern Med 1972 (criterios de Light); Harrison, 21.ª ed. (2022).</tspan></text></svg>