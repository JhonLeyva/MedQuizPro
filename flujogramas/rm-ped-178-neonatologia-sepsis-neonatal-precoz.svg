<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1115" viewBox="0 0 1000 1115" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la sepsis neonatal precoz de las opciones el agente más frecuente es Escherichia coli"><title>En la sepsis neonatal precoz de las opciones el agente más frecuente es Escherichia coli</title><rect x="0.75" y="0.75" width="998.5" height="1113.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neonatología · sepsis neonatal precoz</tspan></text><rect x="426.3" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="475.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="475.3" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Sepsis neonatal precoz</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Aparece en las primeras 72 horas (hasta 7 días en algunas definiciones).</tspan><tspan x="58.0" dy="17">Se adquiere por transmisión vertical, ascendente o transplacentaria.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de etiología</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es el agente infeccioso más frecuente en la</tspan><tspan x="640.0" dy="16">sepsis neonatal precoz?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ GÉRMENES CORRESPONDEN A CADA MOMENTO DE LA SEPSIS NEONATAL</tspan></text><line x1="290.0" y1="291.0" x2="290.0" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="290.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="290.0" dy="0">0</tspan></text><line x1="382.9" y1="291.0" x2="382.9" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="382.9" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="382.9" dy="0">4</tspan></text><line x1="475.7" y1="291.0" x2="475.7" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="475.7" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="475.7" dy="0">8</tspan></text><line x1="568.6" y1="291.0" x2="568.6" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="568.6" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="568.6" dy="0">12</tspan></text><line x1="661.4" y1="291.0" x2="661.4" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="661.4" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="661.4" dy="0">16</tspan></text><line x1="754.3" y1="291.0" x2="754.3" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="754.3" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="754.3" dy="0">20</tspan></text><line x1="847.1" y1="291.0" x2="847.1" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="847.1" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="847.1" dy="0">24</tspan></text><line x1="940.0" y1="291.0" x2="940.0" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="940.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="940.0" dy="0">28</tspan></text><text x="940.0" y="273.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="end" data-max="60"><tspan x="940.0" dy="0">días</tspan></text><rect x="40.0" y="295.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="311.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Sepsis precoz</tspan></text><text x="48.0" y="326.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">E. coli, estreptococo del grupo B y Listeria</tspan></text><rect x="290.0" y="303.0" width="69.6" height="22.0" rx="6" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="48.0" y="349.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Sepsis tardía u hospitalaria</tspan></text><text x="48.0" y="364.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">S. aureus, Enterococcus, Pseudomonas</tspan></text><rect x="359.6" y="341.0" width="580.4" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><rect x="40.0" y="371.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="387.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Neumonía por Chlamydia</tspan></text><text x="48.0" y="402.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Afebril; no es sepsis precoz</tspan></text><rect x="615.0" y="379.0" width="325.0" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><line x1="359.6" y1="293.0" x2="359.6" y2="415.0" stroke="#b91c1c" stroke-width="2.6"/><rect x="327.4" y="415.0" width="64.4" height="22.0" rx="11" fill="#b91c1c" stroke="none" stroke-width="1.5"/><text x="359.6" y="430.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="359.6" dy="0">72 horas</tspan></text><rect x="40.0" y="461.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="487.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Sepsis precoz = E. coli entre las opciones</tspan></text><text x="60.0" y="506.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">S. aureus, Enterococcus y Pseudomonas son de la sepsis tardía; el estreptococo del grupo B no figura en las opciones.</tspan></text><text x="40.0" y="567.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">GÉRMENES DE LA SEPSIS NEONATAL SEGÚN EL MOMENTO</tspan></text><rect x="40.0" y="579.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="598.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Tipo</tspan></text><text x="280.0" y="598.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Gérmenes</tspan></text><text x="625.0" y="598.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Nota</tspan></text><rect x="40.0" y="608.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="627.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Precoz (72 horas)</tspan></text><text x="280.0" y="627.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Estreptococo del grupo B, E. coli, Listeria</tspan></text><text x="625.0" y="627.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Transmisión vertical; E. coli: clave de las opciones</tspan></text><rect x="170.6" y="611.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="216.0" y="626.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="216.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="637.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="656.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Tardía u hospitalaria</tspan></text><text x="280.0" y="656.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">S. aureus, Enterococcus, Pseudomonas</tspan></text><text x="625.0" y="656.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Catéteres y estancia hospitalaria</tspan></text><rect x="40.0" y="666.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="685.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Afebril del lactante</tspan></text><text x="280.0" y="685.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Chlamydia trachomatis</tspan></text><text x="625.0" y="685.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Conjuntivitis y neumonía, no sepsis</tspan></text><text x="40.0" y="711.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Clave B del libro: el estreptococo del grupo B es el más frecuente en el término, pero no figura entre las opciones.</tspan></text><text x="40.0" y="758.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="768.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="799.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="790.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Staphylococcus</tspan><tspan x="285.0" dy="17">aureus</tspan></text><rect x="363.0" y="771.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="799.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Escherichia coli</tspan></text><text x="585.0" y="790.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Enterococcus</tspan><tspan x="585.0" dy="17">faecalis</tspan></text><text x="735.0" y="790.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Chlamydia</tspan><tspan x="735.0" dy="17">trachomatis</tspan></text><text x="885.0" y="799.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Pseudomonas sp</tspan></text><rect x="40.0" y="822.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="822.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="859.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Agente más frecuente?</tspan></text><text x="285.0" y="851.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es de la sepsis</tspan><tspan x="285.0" dy="16">tardía o con catéter</tspan></text><text x="435.0" y="843.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: el primer</tspan><tspan x="435.0" dy="16">aislamiento entre las</tspan><tspan x="435.0" dy="16">opciones</tspan></text><text x="585.0" y="851.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es de la sepsis</tspan><tspan x="585.0" dy="16">tardía</tspan></text><text x="735.0" y="851.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: causa conjuntivitis</tspan><tspan x="735.0" dy="16">y neumonía afebril</tspan></text><text x="885.0" y="851.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es de la sepsis</tspan><tspan x="885.0" dy="16">tardía, hospitalaria</tspan></text><rect x="40.0" y="768.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="912.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="940.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="962.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Factores de riesgo: rotura de membranas de más de 18 horas, corioamnionitis, colonización materna por estreptococo del grupo B sin profilaxis,</tspan><tspan x="58.0" dy="18">   prematuridad y fiebre intraparto.</tspan><tspan x="58.0" dy="18">• Con tamizaje y profilaxis, el estreptococo del grupo B es el primero en el término y E. coli en el prematuro; con tamizaje irregular, E. coli suele ser el</tspan><tspan x="58.0" dy="18">   primer aislamiento.</tspan><tspan x="58.0" dy="18">• S. aureus, Pseudomonas y Enterococcus son de la sepsis tardía hospitalaria; Chlamydia causa conjuntivitis y neumonía afebril, no sepsis precoz.</tspan><tspan x="58.0" dy="18">• Empírico: ampicilina con gentamicina, o cefotaxima si hay meningitis; con signos de sepsis se trata de inmediato, sin esperar cultivos.</tspan></text><text x="58.0" y="1074.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Puopolo KM y cols., Pediatrics 2018;142:e20182894; NTS 214-2024 MINSA, Atención integral de la persona recién nacida; Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>