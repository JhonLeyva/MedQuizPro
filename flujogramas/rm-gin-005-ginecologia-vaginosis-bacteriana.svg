<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="879" viewBox="0 0 1000 879" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Vaginosis bacteriana: 3 de 4 criterios de Amsel, entre ellos pH mayor de 4,5, aminas y células guía"><title>Vaginosis bacteriana: 3 de 4 criterios de Amsel, entre ellos pH mayor de 4,5, aminas y células guía</title><rect x="0.75" y="0.75" width="998.5" height="877.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ginecología · vaginosis bacteriana</tspan></text><rect x="405.1" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="484.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="484.8" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Vaginosis bacteriana</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Desequilibrio de la flora: Gardnerella y anaerobios desplazan a los lactobacilos.</tspan><tspan x="58.0" dy="17">No es inflamatoria: los leucocitos están ausentes.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué criterios sirven para el diagnóstico de la</tspan><tspan x="640.0" dy="16">vaginosis bacteriana?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CRITERIOS DE AMSEL: SE NECESITAN 3 DE 4</tspan></text><rect x="40.0" y="269.0" width="540.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="56.0" y="291.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="start" data-max="430"><tspan x="56.0" dy="0">CRITERIO DE AMSEL</tspan></text><text x="562.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">PUNTOS</tspan></text><rect x="40.0" y="303.0" width="540.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="310.0" width="20.0" height="20.0" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="86.0" y="324.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="420"><tspan x="86.0" dy="0">Secreción homogénea blanquecina adherente a la pared</tspan></text><text x="562.0" y="325.0" font-size="13" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">1</tspan></text><rect x="40.0" y="337.0" width="540.0" height="34.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="344.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="359.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="358.5" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="420"><tspan x="86.0" dy="0">pH vaginal mayor de 4,5</tspan></text><text x="562.0" y="359.0" font-size="13" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">1</tspan></text><rect x="40.0" y="371.0" width="540.0" height="34.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="378.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="393.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="392.5" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="420"><tspan x="86.0" dy="0">Test de aminas positivo (olor a pescado con KOH)</tspan></text><text x="562.0" y="393.0" font-size="13" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">1</tspan></text><rect x="40.0" y="405.0" width="540.0" height="34.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="412.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="427.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="426.5" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="420"><tspan x="86.0" dy="0">Células guía en el examen en fresco</tspan></text><text x="562.0" y="427.0" font-size="13" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">1</tspan></text><rect x="40.0" y="439.0" width="540.0" height="40.0" rx="0" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="56.0" y="464.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="430"><tspan x="56.0" dy="0">Criterios de la opción D</tspan></text><text x="562.0" y="465.0" font-size="16" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">3</tspan></text><rect x="40.0" y="269.0" width="540.0" height="210.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="664.0" cy="319.0" r="46" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/><text x="664.0" y="319.0" font-size="26" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="0"><tspan x="664.0" dy="0">3</tspan></text><text x="664.0" y="339.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="664.0" dy="0">de 4</tspan></text><text x="724.0" y="305.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="230"><tspan x="724.0" dy="0">INTERPRETACIÓN</tspan></text><text x="724.0" y="325.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="230"><tspan x="724.0" dy="0">3 de 4: vaginosis bacteriana</tspan></text><rect x="634.0" y="381.0" width="326.0" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="634.0" y="381.0" width="10.0" height="64.0" rx="4" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="656.0" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#10b981" text-anchor="start" data-max="100"><tspan x="656.0" dy="0">0-2</tspan></text><text x="760.0" y="403.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">No cumple Amsel</tspan></text><text x="760.0" y="421.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Buscar otra causa: Candida,</tspan><tspan x="760.0" dy="15">Trichomonas o cervicitis.</tspan></text><rect x="634.0" y="453.0" width="326.0" height="64.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><rect x="634.0" y="453.0" width="10.0" height="64.0" rx="4" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="656.0" y="475.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="100"><tspan x="656.0" dy="0">3-4</tspan></text><text x="760.0" y="475.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Vaginosis bacteriana</tspan></text><text x="760.0" y="493.0" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Metronidazol 500 mg cada 12 h por</tspan><tspan x="760.0" dy="15">7 días.</tspan></text><polygon points="614.0,476.0 614.0,494.0 630.0,485.0" fill="#f59e0b"/><rect x="852.6" y="442.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="898.0" y="457.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="898.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="557.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="567.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="606.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="598.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Menos leucocitos,</tspan><tspan x="285.0" dy="17">pH &lt; 4,5, aminas +</tspan></text><text x="435.0" y="589.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Secreción</tspan><tspan x="435.0" dy="17">adherente, pH &lt; 4,5,</tspan><tspan x="435.0" dy="17">células guía</tspan></text><text x="585.0" y="598.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">pH &lt; 4,5, aminas + e</tspan><tspan x="585.0" dy="17">hifas</tspan></text><rect x="663.0" y="570.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="598.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Aminas +, células</tspan><tspan x="735.0" dy="17">guía y pH &gt; 4,5</tspan></text><text x="885.0" y="589.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Más leucocitos,</tspan><tspan x="885.0" dy="17">células guía, pH &lt;</tspan><tspan x="885.0" dy="17">4,5</tspan></text><rect x="40.0" y="638.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="638.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="659.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Criterios de la</tspan><tspan x="54.0" dy="16">vaginosis?</tspan></text><text x="285.0" y="659.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: el pH normal es</tspan><tspan x="285.0" dy="16">menor de 4,5</tspan></text><text x="435.0" y="659.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: pH menor de 4,5,</tspan><tspan x="435.0" dy="16">normal</tspan></text><text x="585.0" y="659.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: las hifas son de</tspan><tspan x="585.0" dy="16">Candida</tspan></text><text x="735.0" y="659.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: cumple tres</tspan><tspan x="735.0" dy="16">criterios de Amsel</tspan></text><text x="885.0" y="659.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: los leucocitos</tspan><tspan x="885.0" dy="16">están ausentes</tspan></text><rect x="40.0" y="567.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="712.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="740.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="762.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Criterios de Amsel (3 de 4): secreción homogénea blanquecina adherente, pH vaginal mayor de 4,5, test de aminas positivo y células guía.</tspan><tspan x="58.0" dy="18">• Estándar de laboratorio: puntuación de Nugent en la tinción de Gram.</tspan><tspan x="58.0" dy="18">• Trampas: pH menor de 4,5 es normal o de candidiasis; hifas indican Candida; más leucocitos orientan a tricomoniasis o cervicitis.</tspan><tspan x="58.0" dy="18">• Tratamiento: metronidazol 500 mg cada 12 horas por 7 días (CDC 2021).</tspan></text><text x="58.0" y="838.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, Practice Bulletin N.º 215, vaginitis en no gestantes (Obstet Gynecol 2020); CDC, guía de tratamiento de ITS (MMWR 2021;70(4)).</tspan></text></svg>