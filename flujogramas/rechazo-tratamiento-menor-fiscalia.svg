<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="877" viewBox="0 0 1000 877" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Padres de un adolescente de 15 años rechazan un procedimiento diagnóstico necesario: comunicar a la fiscalía"><title>Padres de un adolescente de 15 años rechazan un procedimiento diagnóstico necesario: comunicar a la fiscalía</title><rect x="0.75" y="0.75" width="998.5" height="876.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Aspectos legales · consentimiento en menores de edad</tspan></text><rect x="526.8" y="32.0" width="143.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="598.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="127"><tspan x="598.5" dy="0">SALUD PÚBLICA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Consentimiento en menores de edad</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Los padres deciden por el menor, pero siempre a favor del interés superior del niño.</tspan><tspan x="58.0" dy="17">Si su negativa pone en riesgo la salud del menor, interviene el Ministerio Público.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Adolescente de 15 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Él y sus padres no autorizan un procedimiento</tspan><tspan x="640.0" dy="16">necesario para el diagnóstico.</tspan><tspan x="640.0" dy="16">La negativa se registra en la historia y la firma el padre.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="377.0" x2="500.0" y2="407.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="407.0" x2="733.5" y2="407.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="407.0" x2="266.5" y2="436.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,435.0 271.5,435.0 266.5,443.0" fill="#94a3b8"/><line x1="733.5" y1="407.0" x2="733.5" y2="436.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,435.0 738.5,435.0 733.5,443.0" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#0f766e"/><line x1="500.0" y1="377.0" x2="500.0" y2="407.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="407.0" x2="733.5" y2="407.0" stroke="#0f766e" stroke-width="3"/><line x1="733.5" y1="407.0" x2="733.5" y2="436.0" stroke="#0f766e" stroke-width="3"/><polygon points="728.5,435.0 738.5,435.0 733.5,443.0" fill="#0f766e"/><rect x="254.4" y="416.0" width="24.1" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="266.5" y="428.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Sí</tspan></text><rect x="616.5" y="416.0" width="234.0" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="733.5" y="428.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">No: es diagnóstico programado (este caso)</tspan></text><polygon points="240.0,342.0 266.0,307.0 734.0,307.0 760.0,342.0 734.0,377.0 266.0,377.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="342.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="347.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="338.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Padres rechazan un procedimiento necesario: ¿hay riesgo</tspan><tspan x="519.0" dy="17">inmediato de muerte?</tspan></text><rect x="40.0" y="443.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="266.5" y="479.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Actuar (emergencia)</tspan></text><text x="266.5" y="502.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Registrar en la historia</tspan></text><rect x="507.0" y="443.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="733.5" y="471.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">COMUNICAR A LA FISCALÍA</tspan></text><text x="733.5" y="494.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Fiscalía de Familia</tspan><tspan x="733.5" dy="17">Interés superior del niño</tspan></text><text x="40.0" y="573.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="583.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="623.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="586.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="623.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Llama a la fiscalía</tspan></text><text x="435.0" y="614.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Lo refiere a otro</tspan><tspan x="435.0" dy="17">hospital</tspan></text><text x="585.0" y="614.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">No realiza</tspan><tspan x="585.0" dy="17">procedimiento</tspan></text><text x="735.0" y="614.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Realiza el</tspan><tspan x="735.0" dy="17">procedimiento</tspan></text><text x="885.0" y="606.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Procedimiento con</tspan><tspan x="885.0" dy="17">firma del</tspan><tspan x="885.0" dy="17">adolescente</tspan></text><rect x="40.0" y="654.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="654.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="683.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Correcto?</tspan></text><text x="285.0" y="675.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: protege el interés</tspan><tspan x="285.0" dy="16">del menor</tspan></text><text x="435.0" y="675.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: traslada el</tspan><tspan x="435.0" dy="16">problema</tspan></text><text x="585.0" y="683.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: lo deja en riesgo</tspan></text><text x="735.0" y="675.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: sin autorización ni</tspan><tspan x="735.0" dy="16">emergencia</tspan></text><text x="885.0" y="675.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: a los 15 años no</tspan><tspan x="885.0" dy="16">basta su firma</tspan></text><rect x="40.0" y="583.5" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="728.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="756.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="778.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Informar de nuevo, con calma, riesgos y beneficios; registrar todo en la historia clínica.</tspan><tspan x="58.0" dy="18">• Si persiste la negativa y hay riesgo para el menor: comunicar a la Fiscalía de Familia para que autorice.</tspan><tspan x="58.0" dy="18">• En emergencia con riesgo de muerte se actúa sin esperar (Ley General de Salud, art. 4 y 40).</tspan></text><text x="58.0" y="836.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Ley General de Salud n.º 26842, art. 4; Código de los Niños y Adolescentes (Ley 27337); Ley 29414 de derechos de los usuarios.</tspan></text></svg>