<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1293" viewBox="0 0 1000 1293" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la EPOC el abandono del tabaquismo es la única intervención que retrasa la caída del VEF₁"><title>En la EPOC el abandono del tabaquismo es la única intervención que retrasa la caída del VEF₁</title><rect x="0.75" y="0.75" width="998.5" height="1291.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neumología · EPOC e historia natural</tspan></text><rect x="420.8" y="32.0" width="114.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="478.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="99"><tspan x="478.2" dy="0">NEUMOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">EPOC</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Limitación persistente del flujo aéreo: VEF₁/CVF posbroncodilatador &lt; 0,7.</tspan><tspan x="58.0" dy="17">El tabaquismo es la principal causa y acelera la caída anual del VEF₁.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 50 años, fumador</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">EPOC con descompensaciones frecuentes pese al</tspan><tspan x="640.0" dy="16">tratamiento múltiple.</tspan><tspan x="640.0" dy="16">¿Qué único tratamiento retrasa la evolución?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">INTERVENCIONES EN LA EPOC SEGÚN SU EFECTO SOBRE LA EVOLUCIÓN</tspan></text><polygon points="200.0,285.0 300.0,285.0 332.0,341.0 168.0,341.0" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="318.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="88"><tspan x="250.0" dy="0">1</tspan></text><rect x="486.0" y="285.0" width="474.0" height="56.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="501.0" y="309.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Abandono del tabaquismo</tspan></text><text x="501.0" y="326.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Único que retrasa la caída del VEF₁: la intervención del caso</tspan></text><rect x="858.2" y="274.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="903.6" y="289.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="903.6" dy="0">◆ ESTE CASO</tspan></text><polygon points="168.0,347.0 332.0,347.0 364.0,403.0 136.0,403.0" fill="#99f6e4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="380.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="152"><tspan x="250.0" dy="0">2</tspan></text><rect x="486.0" y="347.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="371.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Oxigenoterapia crónica y reducción de volumen</tspan></text><text x="501.0" y="388.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Reducen la mortalidad en casos seleccionados</tspan></text><polygon points="136.0,409.0 364.0,409.0 396.0,465.0 104.0,465.0" fill="#5eead4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="442.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="216"><tspan x="250.0" dy="0">3</tspan></text><rect x="486.0" y="409.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="433.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Corticoide inhalado</tspan></text><text x="501.0" y="450.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Para eosinofilia ≥ 300/µL o exacerbaciones frecuentes</tspan></text><polygon points="104.0,471.0 396.0,471.0 428.0,527.0 72.0,527.0" fill="#2dd4bf" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="504.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="280"><tspan x="250.0" dy="0">4</tspan></text><rect x="486.0" y="471.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="495.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Broncodilatadores de acción corta e ipratropio</tspan></text><text x="501.0" y="512.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Mejoran síntomas y función, sin cambiar el declive</tspan></text><polygon points="72.0,533.0 428.0,533.0 460.0,589.0 40.0,589.0" fill="#14b8a6" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="566.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="344"><tspan x="250.0" dy="0">5</tspan></text><rect x="486.0" y="533.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="557.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Trasplante de pulmón</tspan></text><text x="501.0" y="574.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Enfermedad terminal seleccionada, sin beneficio sólido de supervivencia</tspan></text><text x="250.0" y="607.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="420"><tspan x="250.0" dy="0">▲ modifica la historia natural · ▼ solo alivia síntomas</tspan></text><rect x="40.0" y="629.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="655.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Fumador con EPOC = dejar de fumar</tspan></text><text x="60.0" y="674.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Los fármacos mejoran síntomas y exacerbaciones, pero no cambian la caída del VEF₁.</tspan></text><text x="40.0" y="735.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PÉRDIDA ANUAL DE VEF₁ SEGÚN EL TABAQUISMO</tspan></text><rect x="40.0" y="747.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="766.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Condición</tspan></text><text x="310.0" y="766.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Pérdida anual de VEF₁</tspan></text><text x="640.0" y="766.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Comentario</tspan></text><rect x="40.0" y="776.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="795.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">No fumador</tspan></text><text x="310.0" y="795.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">25 a 30 mL</tspan></text><text x="640.0" y="795.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Envejecimiento normal</tspan></text><rect x="40.0" y="805.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="824.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Fumador susceptible</tspan></text><text x="310.0" y="824.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">50 a 60 mL</tspan></text><text x="640.0" y="824.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">El tabaco acelera la caída</tspan></text><rect x="40.0" y="834.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="853.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Abandono sostenido</tspan></text><text x="310.0" y="853.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Se enlentece de forma significativa</tspan></text><text x="640.0" y="853.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Lung Health Study, 1994</tspan></text><rect x="200.6" y="837.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="246.0" y="852.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="246.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="903.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="913.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="944.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="935.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Broncodilatadores</tspan><tspan x="285.0" dy="17">de acción corta</tspan></text><text x="435.0" y="944.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Corticoide inhalado</tspan></text><rect x="513.0" y="916.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="935.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Abandono del</tspan><tspan x="585.0" dy="17">tabaquismo</tspan></text><text x="735.0" y="935.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Trasplante de</tspan><tspan x="735.0" dy="17">pulmón</tspan></text><text x="885.0" y="935.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Bromuro de</tspan><tspan x="885.0" dy="17">ipratropio inhalado</tspan></text><rect x="40.0" y="967.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="967.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1004.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Retrasa la evolución?</tspan></text><text x="285.0" y="996.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: mejora síntomas,</tspan><tspan x="285.0" dy="16">no cambia el declive</tspan></text><text x="435.0" y="988.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: para eosinofilia ≥</tspan><tspan x="435.0" dy="16">300 o exacerbaciones</tspan><tspan x="435.0" dy="16">frecuentes</tspan></text><text x="585.0" y="996.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: enlentece la</tspan><tspan x="585.0" dy="16">pérdida de VEF₁</tspan></text><text x="735.0" y="988.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: solo en</tspan><tspan x="735.0" dy="16">enfermedad terminal</tspan><tspan x="735.0" dy="16">seleccionada</tspan></text><text x="885.0" y="996.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: mejora síntomas,</tspan><tspan x="885.0" dy="16">no cambia el declive</tspan></text><rect x="40.0" y="913.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1057.0" width="920.0" height="218.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1085.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1107.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El Lung Health Study (JAMA 1994) mostró que el abandono sostenido del tabaco enlentece la pérdida de función: es la intervención de mayor efecto</tspan><tspan x="58.0" dy="18">   sobre la historia natural.</tspan><tspan x="58.0" dy="18">• Broncodilatadores de acción corta, ipratropio y corticoides inhalados mejoran síntomas y exacerbaciones, pero no modifican la tasa de declive del VEF₁.</tspan><tspan x="58.0" dy="18">• Reducen mortalidad: oxigenoterapia crónica (PaO₂ ≤ 55 mm Hg) y cirugía de reducción de volumen en casos seleccionados. El trasplante se reserva</tspan><tspan x="58.0" dy="18">   para enfermedad terminal.</tspan><tspan x="58.0" dy="18">• Corticoide inhalado: eosinofilia ≥ 300 células/µL o exacerbaciones frecuentes. Consejería breve más farmacoterapia (vareniclina, bupropión, reemplazo</tspan><tspan x="58.0" dy="18">   de nicotina) duplica la abstinencia.</tspan></text><text x="58.0" y="1237.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: GOLD, Global Strategy for COPD (informe 2025); Anthonisen et al., Lung Health Study, JAMA 1994;272:1497-1505; Harrison Principios de Medicina Interna, 21.ª ed.</tspan><tspan x="58.0" dy="15">(2022).</tspan></text></svg>