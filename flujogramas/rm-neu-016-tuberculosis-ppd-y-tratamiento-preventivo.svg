<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1012" viewBox="0 0 1000 1012" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Contacto con VIH y PPD mayor de 5 mm: alto riesgo de tuberculosis y tratamiento preventivo"><title>Contacto con VIH y PPD mayor de 5 mm: alto riesgo de tuberculosis y tratamiento preventivo</title><rect x="0.75" y="0.75" width="998.5" height="1010.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Tuberculosis · PPD y tratamiento preventivo</tspan></text><rect x="460.2" y="32.0" width="114.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="517.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="99"><tspan x="517.7" dy="0">NEUMOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tratamiento preventivo de la TB</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Dirigido a la infección latente con alto riesgo de progresar a enfermedad.</tspan><tspan x="58.0" dy="17">Antes se descarta TB activa (síntomas y radiografía).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de grupos de riesgo</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué población es de alto riesgo para TB y debe</tspan><tspan x="640.0" dy="16">recibir tratamiento preventivo?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ TAMAÑO DE PPD ES POSITIVO SEGÚN EL RIESGO DE LA PERSONA</tspan></text><rect x="40.0" y="269.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="295.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Induración del PPD (mm)</tspan></text><text x="60.0" y="314.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Cuanto mayor el riesgo de la persona, menor el punto de corte.</tspan></text><rect x="70.0" y="378.0" width="215.0" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="177.5" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="205"><tspan x="177.5" dy="0">Negativo</tspan></text><rect x="285.0" y="378.0" width="215.0" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="392.5" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="205"><tspan x="392.5" dy="0">≥ 5: VIH, contacto</tspan></text><rect x="500.0" y="378.0" width="215.0" height="40.0" rx="6" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/><text x="607.5" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#c2410c" text-anchor="middle" data-max="205"><tspan x="607.5" dy="0">≥ 10: salud, drogas, diabetes</tspan></text><rect x="715.0" y="378.0" width="215.0" height="40.0" rx="6" fill="#fef9c3" stroke="#ffffff" stroke-width="2"/><text x="822.5" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#a16207" text-anchor="middle" data-max="205"><tspan x="822.5" dy="0">≥ 15: bajo riesgo</tspan></text><line x1="70.0" y1="418.0" x2="70.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="70.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="70.0" dy="0">0 mm</tspan></text><line x1="285.0" y1="418.0" x2="285.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="285.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="285.0" dy="0">5 mm</tspan></text><line x1="500.0" y1="418.0" x2="500.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="500.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="500.0" dy="0">10 mm</tspan></text><line x1="715.0" y1="418.0" x2="715.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="715.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="715.0" dy="0">15 mm</tspan></text><line x1="930.0" y1="418.0" x2="930.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">20 mm</tspan></text><polygon points="362.0,364.0 380.0,364.0 371.0,376.0" fill="#ea580c"/><rect x="262.9" y="338.0" width="216.2" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="371.0" y="353.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="204"><tspan x="371.0" dy="0">◆ CONTACTO CON VIH: PPD &gt; 5 mm</tspan></text><text x="40.0" y="486.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUIÉN RECIBE EL TRATAMIENTO PREVENTIVO</tspan></text><rect x="40.0" y="496.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="497.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="520.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Contacto con VIH</tspan></text><text x="58.0" y="541.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">PPD ≥ 5 mm; con VIH se trata aun sin PPD (OMS)</tspan></text><rect x="351.3" y="496.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="497.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="520.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Convertidor y personal de salud</tspan></text><text x="369.3" y="541.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Punto de corte de 10 mm</tspan></text><rect x="662.7" y="496.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="497.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="520.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Fibrosis o fumador</tspan></text><text x="680.7" y="541.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">No son indicación por sí solos</tspan></text><text x="40.0" y="605.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="615.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="654.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="618.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="637.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Contactos VIH (+)</tspan><tspan x="285.0" dy="17">con PPD mayor de 5</tspan><tspan x="285.0" dy="17">mm</tspan></text><text x="435.0" y="637.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Fumadores</tspan><tspan x="435.0" dy="17">crónicos con</tspan><tspan x="435.0" dy="17">fibrosis pulmonar</tspan></text><text x="585.0" y="646.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Usuarios de drogas</tspan><tspan x="585.0" dy="17">por vía oral</tspan></text><text x="735.0" y="637.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Convertidores</tspan><tspan x="735.0" dy="17">recientes con PPD</tspan><tspan x="735.0" dy="17">mayor de 5 mm</tspan></text><text x="885.0" y="637.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Personal de salud</tspan><tspan x="885.0" dy="17">con PPD mayor de 5</tspan><tspan x="885.0" dy="17">mm</tspan></text><rect x="40.0" y="686.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="686.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="723.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Alto riesgo?</tspan></text><text x="285.0" y="715.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: VIH con contacto y</tspan><tspan x="285.0" dy="16">PPD ≥ 5 mm</tspan></text><text x="435.0" y="715.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no es indicación</tspan><tspan x="435.0" dy="16">por sí sola</tspan></text><text x="585.0" y="715.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: el consumo oral no</tspan><tspan x="585.0" dy="16">es indicación</tspan></text><text x="735.0" y="715.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: el corte del</tspan><tspan x="735.0" dy="16">convertidor es 10 mm</tspan></text><text x="885.0" y="707.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: en personal de</tspan><tspan x="885.0" dy="16">salud el corte es 10</tspan><tspan x="885.0" dy="16">mm</tspan></text><rect x="40.0" y="615.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="776.0" width="920.0" height="218.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="804.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="826.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Prioridad de tratamiento preventivo: personas con VIH, contactos (sobre todo menores de 5 años) e inmunosuprimidos; con VIH el riesgo de TB activa es</tspan><tspan x="58.0" dy="18">   unas 20 veces mayor.</tspan><tspan x="58.0" dy="18">• Puntos de corte del PPD (CDC/ATS): ≥ 5 mm en VIH, contacto reciente e inmunosupresión; ≥ 10 mm en personal de salud, drogas inyectables, diabetes;</tspan><tspan x="58.0" dy="18">   ≥ 15 mm en bajo riesgo.</tspan><tspan x="58.0" dy="18">• Esquemas (OMS 2024): isoniacida 6 meses, rifapentina con isoniacida semanal por 3 meses (3HP) o rifampicina 4 meses.</tspan><tspan x="58.0" dy="18">• Alerta: en VIH la OMS recomienda tratar con independencia del resultado de la tuberculina; fibrosis o consumo oral de drogas no son indicación por sí</tspan><tspan x="58.0" dy="18">   solos.</tspan></text><text x="58.0" y="956.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, Consolidated Guidelines on Tuberculosis, Module 1: Prevention (2024); NTS 221-MINSA/DGIESP-2024; CDC/ATS, Targeted tuberculin testing and treatment of</tspan><tspan x="58.0" dy="15">LTBI (MMWR 2000;49 RR-6); Harrison, 21.ª ed. (2022).</tspan></text></svg>