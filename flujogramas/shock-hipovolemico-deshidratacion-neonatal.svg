<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="994" viewBox="0 0 1000 994" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Recién nacido de 3 días con vómitos, deshidratación severa, hipotensión y llenado lento sin signos de infección: choque hipovolémico"><title>Recién nacido de 3 días con vómitos, deshidratación severa, hipotensión y llenado lento sin signos de infección: choque hipovolémico</title><rect x="0.75" y="0.75" width="998.5" height="992.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Choque en pediatría · choque hipovolémico</tspan></text><rect x="457.7" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="514.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="514.2" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Choque hipovolémico</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Pérdida de volumen (vómitos, diarrea, sangrado) que baja el gasto cardiaco.</tspan><tspan x="58.0" dy="17">Taquicardia, llenado capilar &gt; 2-3 s, pulsos débiles; la hipotensión es tardía.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Recién nacido de 3 días, 2800 g</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Vómitos lácteos e hipoactividad.</tspan><tspan x="640.0" dy="16">Hipotenso, deshidratación severa, palidez, taquicardia,</tspan><tspan x="640.0" dy="16">llenado &gt; 3 s; hemograma normal.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">NEONATO CON VÓMITOS Y MALA PERFUSIÓN</tspan></text><text x="614.0" y="297.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,309.0 580.0,309.0 531.7,417.0 88.3,417.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="325.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="373.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="399"><tspan x="310.0" dy="0">RN de 3 días: vómitos, hipotensión, llenado &gt; 3 s</tspan></text><line x1="559.8" y1="363.0" x2="606.0" y2="363.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="318.0" width="119.5" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="673.7" y="335.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="673.7" dy="0">Meningoencefalitis</tspan></text><rect x="739.5" y="318.0" width="105.8" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="792.4" y="335.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="792.4" dy="0">Sepsis neonatal</tspan></text><rect x="614.0" y="350.0" width="134.5" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="681.3" y="367.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="681.3" dy="0">Enfermedad diarreica</tspan></text><rect x="754.5" y="350.0" width="143.7" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="826.4" y="367.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="826.4" dy="0">Hiperplasia suprarrenal</tspan></text><rect x="614.0" y="382.0" width="135.2" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="681.6" y="399.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="681.6" dy="0">Choque hipovolémico</tspan></text><polygon points="88.3,421.0 531.7,421.0 483.3,477.0 136.7,477.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="162.7" cy="449.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="162.7" y="453.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="162.7" dy="0">1</tspan></text><text x="320.0" y="453.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="283"><tspan x="320.0" dy="0">¿Fiebre, foco o hemograma alterado?</tspan></text><line x1="511.5" y1="449.0" x2="606.0" y2="449.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="436.0" width="131.6" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="679.8" y="453.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="679.8" dy="0">✕ Meningoencefalitis</tspan></text><line x1="636.0" y1="449.5" x2="735.6" y2="449.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="751.6" y="436.0" width="117.9" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="810.5" y="453.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="810.5" dy="0">✕ Sepsis neonatal</tspan></text><line x1="773.6" y1="449.5" x2="859.4" y2="449.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="136.7,481.0 483.3,481.0 435.0,541.0 185.0,541.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="511.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="515.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">2</tspan></text><text x="320.0" y="507.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">¿Diarrea o edad de 1-3</tspan><tspan x="320.0" dy="17">semanas con sal perdida?</tspan></text><line x1="463.2" y1="511.0" x2="606.0" y2="511.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="498.0" width="146.6" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="687.3" y="515.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="687.3" dy="0">✕ Enfermedad diarreica</tspan></text><line x1="636.0" y1="511.5" x2="750.6" y2="511.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="766.6" y="498.0" width="155.8" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="844.5" y="515.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="844.5" dy="0">✕ Hiperplasia suprarrenal</tspan></text><line x1="788.6" y1="511.5" x2="912.4" y2="511.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="545.0" x2="310.0" y2="564.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,563.0 315.0,563.0 310.0,571.0" fill="#0f766e"/><rect x="140.0" y="575.0" width="340.0" height="74.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="604.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">CHOQUE HIPOVOLÉMICO</tspan></text><text x="310.0" y="628.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Pérdidas por vómitos</tspan></text><rect x="370.6" y="564.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="579.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="582.4" width="346.0" height="60.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="602.4" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="620.4" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">Bolos de 10 mL/kg y reevaluar.</tspan></text><text x="40.0" y="689.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="699.9" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="739.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="739.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Meningoencefalitis</tspan></text><text x="435.0" y="739.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Sepsis neonatal</tspan></text><text x="585.0" y="730.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Enfermedad</tspan><tspan x="585.0" dy="17">diarreica aguda</tspan></text><rect x="663.0" y="702.9" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="730.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Shock</tspan><tspan x="735.0" dy="17">hipovolémico</tspan></text><text x="885.0" y="722.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hiperplasia</tspan><tspan x="885.0" dy="17">suprarrenal</tspan><tspan x="885.0" dy="17">congénita</tspan></text><rect x="40.0" y="770.9" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="770.9" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="799.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Encaja?</tspan></text><text x="285.0" y="791.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: sin fiebre ni signos</tspan><tspan x="285.0" dy="16">neurológicos</tspan></text><text x="435.0" y="791.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: hemograma</tspan><tspan x="435.0" dy="16">normal, sin factores</tspan></text><text x="585.0" y="799.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no hay diarrea</tspan></text><text x="735.0" y="791.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: pérdidas +</tspan><tspan x="735.0" dy="16">perfusión mala</tspan></text><text x="885.0" y="791.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Posible, pero suele ser</tspan><tspan x="885.0" dy="16">a las 1-3 semanas</tspan></text><rect x="40.0" y="699.9" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="844.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="872.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="894.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Bolos de suero fisiológico 10-20 mL/kg en 5-20 min, reevaluando tras cada bolo (en el RN, 10 mL/kg).</tspan><tspan x="58.0" dy="18">• Corregir glucosa y electrolitos; buscar la causa de los vómitos (obstrucción, hiperplasia suprarrenal, metabólica).</tspan><tspan x="58.0" dy="18">• Si no responde a 40-60 mL/kg: inotrópicos y pensar en sepsis o causa cardiaca.</tspan></text><text x="58.0" y="952.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Surviving Sepsis Campaign pediátrica (2020); AAP, PALS (2020, act. 2025); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>