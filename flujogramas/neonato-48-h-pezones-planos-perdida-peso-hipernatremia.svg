<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="952" viewBox="0 0 1000 952" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Recién nacido de 48 horas, madre primeriza con pezones planos, ictericia, irritable o letárgico, poca orina y pérdida de peso &gt; 10 %: deshidratación hipernatrémica"><title>Recién nacido de 48 horas, madre primeriza con pezones planos, ictericia, irritable o letárgico, poca orina y pérdida de peso &gt; 10 %: deshidratación hipernatrémica</title><rect x="0.75" y="0.75" width="998.5" height="950.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neonatología · lactancia insuficiente</tspan></text><rect x="415.3" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="471.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="471.8" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Deshidratación hipernatrémica neonatal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Toma poca leche: pierde agua más que sodio y el sodio sube.</tspan><tspan x="58.0" dy="17">Irritable que alterna con letargia, ictericia, poca orina y heces escasas; puede convulsionar.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Neonato a término de 48 horas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Madre primigesta con pezones planos.</tspan><tspan x="640.0" dy="16">Ictericia, llanto que alterna con letargia, poca orina,</tspan><tspan x="640.0" dy="16">pérdida &gt; 10 %.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PÉRDIDA DE PESO DEL RECIÉN NACIDO</tspan></text><rect x="70.0" y="295.0" width="34.0" height="330.0" rx="17" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="75.0" y="546.5" width="24.0" height="74.5" rx="8" fill="#10b981" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="583.8" x2="130.0" y2="583.8" stroke="#10b981" stroke-width="2"/><rect x="130.0" y="547.5" width="330.0" height="72.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="569.5" font-size="12" font-weight="800" font-style="normal" fill="#10b981" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Normal</tspan></text><text x="240.0" y="569.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">&lt; 7 %</tspan></text><text x="144.0" y="590.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Recupera a los 10-14 días</tspan></text><rect x="75.0" y="464.0" width="24.0" height="74.5" rx="8" fill="#f59e0b" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="501.2" x2="130.0" y2="501.2" stroke="#f59e0b" stroke-width="2"/><rect x="130.0" y="465.0" width="330.0" height="72.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="487.0" font-size="12" font-weight="800" font-style="normal" fill="#f59e0b" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Vigilar</tspan></text><text x="240.0" y="487.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">7-10 %</tspan></text><text x="144.0" y="508.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Revisar la lactancia</tspan></text><rect x="75.0" y="381.5" width="24.0" height="74.5" rx="8" fill="#f97316" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="418.8" x2="130.0" y2="418.8" stroke="#0f766e" stroke-width="3"/><rect x="130.0" y="382.5" width="330.0" height="72.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="144.0" y="404.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Deshidratación</tspan></text><text x="240.0" y="404.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">&gt; 10 %</tspan></text><text x="144.0" y="425.5" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Medir sodio</tspan></text><rect x="354.6" y="371.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="400.0" y="386.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="400.0" dy="0">◆ ESTE CASO</tspan></text><rect x="75.0" y="299.0" width="24.0" height="74.5" rx="8" fill="#e11d48" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="336.2" x2="130.0" y2="336.2" stroke="#e11d48" stroke-width="2"/><rect x="130.0" y="300.0" width="330.0" height="72.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="322.0" font-size="12" font-weight="800" font-style="normal" fill="#e11d48" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Grave</tspan></text><text x="240.0" y="322.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">&gt; 12 % o Na &gt; 160</tspan></text><text x="144.0" y="343.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Hospitalizar</tspan></text><text x="470.0" y="299.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="490"><tspan x="470.0" dy="0">QUÉ HACER</tspan></text><rect x="470.0" y="313.0" width="490.0" height="84.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><circle cx="498.0" cy="355.0" r="17" fill="#ffffff" stroke="none" stroke-width="0"/><text x="498.0" y="360.0" font-size="15" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">1</tspan></text><text x="528.0" y="348.0" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Medir sodio y glucosa</tspan></text><text x="528.0" y="371.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Ya</tspan></text><rect x="844.6" y="302.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="317.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><line x1="498.0" y1="399.0" x2="498.0" y2="412.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,411.0 503.0,411.0 498.0,419.0" fill="#0f766e"/><rect x="470.0" y="421.0" width="490.0" height="84.0" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="463.0" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="468.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">2</tspan></text><text x="528.0" y="456.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Rehidratar despacio</tspan></text><text x="528.0" y="479.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Na ≤ 10-12/día</tspan></text><line x1="498.0" y1="507.0" x2="498.0" y2="520.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,519.0 503.0,519.0 498.0,527.0" fill="#0f766e"/><rect x="470.0" y="529.0" width="490.0" height="84.0" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="571.0" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="576.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">3</tspan></text><text x="528.0" y="564.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Corregir la lactancia</tspan></text><text x="528.0" y="587.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Agarre</tspan></text><text x="40.0" y="665.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="675.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="706.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="697.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hiperaldosterismo</tspan><tspan x="285.0" dy="17">primario</tspan></text><rect x="363.0" y="678.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="697.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Deshidratación</tspan><tspan x="435.0" dy="17">hipernatrémica</tspan></text><text x="585.0" y="697.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Síndrome de</tspan><tspan x="585.0" dy="17">Cushing</tspan></text><text x="735.0" y="706.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Diabetes insípida</tspan></text><text x="885.0" y="697.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hipoglicemia</tspan><tspan x="885.0" dy="17">neonatal</tspan></text><rect x="40.0" y="729.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="729.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="758.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="758.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: raro en neonatos</tspan></text><text x="435.0" y="750.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: lactancia pobre +</tspan><tspan x="435.0" dy="16">pérdida &gt; 10 %</tspan></text><text x="585.0" y="758.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no en neonatos</tspan></text><text x="735.0" y="750.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Rara; orina mucho, no</tspan><tspan x="735.0" dy="16">poco</tspan></text><text x="885.0" y="750.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Puede acompañar, no</tspan><tspan x="885.0" dy="16">lo explica todo</tspan></text><rect x="40.0" y="675.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="803.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="831.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="853.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Medir sodio, glucosa, bilirrubina y función renal.</tspan><tspan x="58.0" dy="18">• Rehidratar despacio: bajar el sodio ≤ 10-12 mEq/L al día (evita edema cerebral).</tspan><tspan x="58.0" dy="18">• Apoyar la lactancia: agarre, extracción y suplemento si hace falta.</tspan></text><text x="58.0" y="911.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ABM, protocolo de suplementación (2017, act. 2024); AAP; Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>