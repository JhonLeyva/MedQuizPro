<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="968" viewBox="0 0 1000 968" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La vía respiratoria es la de diseminación infecciosa más importante y más difícil de controlar"><title>La vía respiratoria es la de diseminación infecciosa más importante y más difícil de controlar</title><rect x="0.75" y="0.75" width="998.5" height="966.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Epidemiología · vías de transmisión</tspan></text><rect x="411.9" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="476.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="476.2" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cadena de transmisión</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La puerta de salida y la vía determinan qué tan fácil es cortar la cadena.</tspan><tspan x="58.0" dy="17">Respirar no se puede evitar.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de control</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es la vía de diseminación infecciosa más</tspan><tspan x="640.0" dy="16">importante y difícil de controlar?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">VÍAS DE DISEMINACIÓN, DE LA MÁS A LA MENOS DIFÍCIL DE CONTROLAR</tspan></text><polygon points="180.0,269.0 280.0,269.0 315.0,325.0 145.0,325.0" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="230.0" y="302.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="88"><tspan x="230.0" dy="0">1</tspan></text><rect x="446.0" y="269.0" width="514.0" height="56.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="461.0" y="293.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="484"><tspan x="461.0" dy="0">Tracto respiratorio</tspan></text><text x="461.0" y="310.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="484"><tspan x="461.0" dy="0">Gotículas y aerosoles: afectan a muchos y no se evitan.</tspan></text><rect x="836.6" y="258.0" width="134.0" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="903.6" y="273.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="903.6" dy="0">◆ OPCIÓN CORRECTA</tspan></text><polygon points="145.0,331.0 315.0,331.0 350.0,387.0 110.0,387.0" fill="#99f6e4" stroke="#ffffff" stroke-width="2"/><text x="230.0" y="364.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="158"><tspan x="230.0" dy="0">2</tspan></text><rect x="446.0" y="331.0" width="514.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="461.0" y="355.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="484"><tspan x="461.0" dy="0">Tracto digestivo</tspan></text><text x="461.0" y="372.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="484"><tspan x="461.0" dy="0">Agua y alimentos: se controla con saneamiento e higiene.</tspan></text><polygon points="110.0,393.0 350.0,393.0 385.0,449.0 75.0,449.0" fill="#5eead4" stroke="#ffffff" stroke-width="2"/><text x="230.0" y="426.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="228"><tspan x="230.0" dy="0">3</tspan></text><rect x="446.0" y="393.0" width="514.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="461.0" y="417.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="484"><tspan x="461.0" dy="0">Piel y tracto urinario</tspan></text><text x="461.0" y="434.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="484"><tspan x="461.0" dy="0">Contacto directo: alcance poblacional limitado.</tspan></text><polygon points="75.0,455.0 385.0,455.0 420.0,511.0 40.0,511.0" fill="#2dd4bf" stroke="#ffffff" stroke-width="2"/><text x="230.0" y="488.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="298"><tspan x="230.0" dy="0">4</tspan></text><rect x="446.0" y="455.0" width="514.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="461.0" y="479.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="484"><tspan x="461.0" dy="0">Placenta</tspan></text><text x="461.0" y="496.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="484"><tspan x="461.0" dy="0">Un solo binomio madre-hijo: se previene con tamizaje.</tspan></text><text x="230.0" y="529.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="380"><tspan x="230.0" dy="0">▲ más difícil de controlar · ▼ más fácil</tspan></text><rect x="40.0" y="551.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="577.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Vía aérea = difícil de controlar y la más importante</tspan></text><text x="60.0" y="596.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La placenta y la piel afectan a pocas personas; el tracto digestivo se corta con saneamiento.</tspan></text><text x="40.0" y="663.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="673.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="704.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="704.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">El tracto urinario</tspan></text><text x="435.0" y="704.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">El tracto digestivo</tspan></text><rect x="513.0" y="676.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="695.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">El tracto</tspan><tspan x="585.0" dy="17">respiratorio</tspan></text><text x="735.0" y="704.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">La piel</tspan></text><text x="885.0" y="704.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">La placenta</tspan></text><rect x="40.0" y="727.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="727.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="748.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Vía más difícil de</tspan><tspan x="54.0" dy="16">controlar?</tspan></text><text x="285.0" y="748.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: ruta de poco</tspan><tspan x="285.0" dy="16">alcance poblacional</tspan></text><text x="435.0" y="748.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: se corta con</tspan><tspan x="435.0" dy="16">saneamiento e higiene</tspan></text><text x="585.0" y="748.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: aerosoles que no</tspan><tspan x="585.0" dy="16">se pueden evitar</tspan></text><text x="735.0" y="748.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: ruta de poco</tspan><tspan x="735.0" dy="16">alcance poblacional</tspan></text><text x="885.0" y="748.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: afecta a un</tspan><tspan x="885.0" dy="16">binomio madre-hijo</tspan></text><rect x="40.0" y="673.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="801.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="829.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="851.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Respiratoria: al toser, estornudar o hablar salen gotículas y aerosoles que alcanzan a muchas personas en espacios cerrados; causa epidemias rápidas.</tspan><tspan x="58.0" dy="18">• Digestiva (cólera, hepatitis A, tifoidea): se controla con lavado de manos, saneamiento, cloración del agua e higiene de alimentos.</tspan><tspan x="58.0" dy="18">• Piel y tracto urinario: rutas de poco alcance poblacional. Placenta: afecta a un binomio madre-hijo y se previene con tamizaje, como en sífilis o VIH.</tspan><tspan x="58.0" dy="18">• Medidas en vía aérea: vacunación, ventilación, mascarilla y aislamiento respiratorio.</tspan></text><text x="58.0" y="927.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Gordis, Epidemiología 6.ª ed. (2019); Last, A Dictionary of Epidemiology 6.ª ed. (2014).</tspan></text></svg>