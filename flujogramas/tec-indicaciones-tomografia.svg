<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1166" viewBox="0 0 1000 1166" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="TEC: la TC cerebral se pide si el Glasgow es menor de 14 (o hay otro criterio de riesgo)"><title>TEC: la TC cerebral se pide si el Glasgow es menor de 14 (o hay otro criterio de riesgo)</title><rect x="0.75" y="0.75" width="998.5" height="1165.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Traumatismo craneoencefálico · indicación de TC</tspan></text><rect x="491.9" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="556.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="556.2" dy="0">NEUROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">TC en el traumatismo craneoencefálico</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Las reglas clínicas (canadiense, NICE) dicen a quién hacer TC sin irradiar a todos.</tspan><tspan x="58.0" dy="17">Un Glasgow bajo es el criterio más fuerte.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de concepto</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Paciente con traumatismo craneoencefálico.</tspan><tspan x="640.0" dy="16">¿Cuándo pedir TC cerebral?</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#94a3b8"/><line x1="500.0" y1="349.0" x2="500.0" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="379.0" x2="733.5" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="379.0" x2="266.5" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,407.0 271.5,407.0 266.5,415.0" fill="#94a3b8"/><line x1="733.5" y1="379.0" x2="733.5" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,407.0 738.5,407.0 733.5,415.0" fill="#94a3b8"/><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#0f766e"/><line x1="500.0" y1="349.0" x2="500.0" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="379.0" x2="500.0" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="379.0" x2="266.5" y2="408.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,407.0 271.5,407.0 266.5,415.0" fill="#0f766e"/><rect x="151.0" y="388.0" width="230.9" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Glasgow bajo, fractura, vómitos, ≥ 65 años</tspan></text><rect x="704.8" y="388.0" width="57.4" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Ninguno</tspan></text><polygon points="240.0,320.0 266.0,291.0 734.0,291.0 760.0,320.0 734.0,349.0 266.0,349.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="320.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="325.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="324.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">TEC: ¿algún criterio de riesgo?</tspan></text><rect x="40.0" y="415.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">TC CEREBRAL</tspan></text><text x="266.5" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Este caso: Glasgow &lt; 14</tspan><tspan x="266.5" dy="17">En la primera hora</tspan></text><rect x="507.0" y="415.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="451.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Observación</tspan></text><text x="733.5" y="474.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Alta con signos de alarma</tspan></text><text x="40.0" y="545.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">REGLA CANADIENSE DE TC DE CRÁNEO</tspan></text><rect x="40.0" y="557.5" width="920.0" height="265.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><line x1="704.9" y1="639.5" x2="938.0" y2="639.5" stroke="#0f766e" stroke-width="2"/><line x1="704.9" y1="639.5" x2="704.9" y2="647.5" stroke="#0f766e" stroke-width="2"/><line x1="938.0" y1="639.5" x2="938.0" y2="647.5" stroke="#0f766e" stroke-width="2"/><rect x="768.6" y="627.5" width="105.6" height="24.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/><text x="821.4" y="643.5" font-size="10.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="92"><tspan x="821.4" dy="0">RIESGO MEDIO</tspan></text><line x1="62.0" y1="599.5" x2="680.9" y2="599.5" stroke="#0f766e" stroke-width="2"/><line x1="62.0" y1="599.5" x2="62.0" y2="607.5" stroke="#0f766e" stroke-width="2"/><line x1="680.9" y1="599.5" x2="680.9" y2="607.5" stroke="#0f766e" stroke-width="2"/><rect x="263.9" y="587.5" width="215.1" height="24.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/><text x="371.4" y="603.5" font-size="10.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="201"><tspan x="371.4" dy="0">ALTO RIESGO NEUROQUIRÚRGICO</tspan></text><rect x="56.0" y="659.5" width="116.6" height="116.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="76.0" cy="682.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="76.0" y="686.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="76.0" dy="0">1</tspan></text><text x="94.0" y="687.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="71"><tspan x="94.0" dy="0">Glasgow &lt;</tspan><tspan x="94.0" dy="17">15 a las 2</tspan><tspan x="94.0" dy="17">horas</tspan></text><text x="68.0" y="742.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="93"><tspan x="68.0" dy="0">Alto riesgo</tspan></text><rect x="184.6" y="659.5" width="116.6" height="116.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="204.6" cy="682.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="204.6" y="686.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="204.6" dy="0">2</tspan></text><text x="222.6" y="687.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="71"><tspan x="222.6" dy="0">Sospecha</tspan><tspan x="222.6" dy="17">de fractura</tspan><tspan x="222.6" dy="17">abierta o</tspan><tspan x="222.6" dy="17">hundida</tspan></text><text x="196.6" y="759.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="93"><tspan x="196.6" dy="0">Alto riesgo</tspan></text><rect x="313.1" y="659.5" width="116.6" height="116.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="333.1" cy="682.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="333.1" y="686.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="333.1" dy="0">3</tspan></text><text x="351.1" y="687.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="71"><tspan x="351.1" dy="0">Signos de</tspan><tspan x="351.1" dy="17">fractura de</tspan><tspan x="351.1" dy="17">base</tspan></text><text x="325.1" y="742.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="93"><tspan x="325.1" dy="0">Alto riesgo</tspan></text><rect x="441.7" y="659.5" width="116.6" height="116.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="461.7" cy="682.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="461.7" y="686.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="461.7" dy="0">4</tspan></text><text x="479.7" y="687.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="71"><tspan x="479.7" dy="0">2 o más</tspan><tspan x="479.7" dy="17">vómitos</tspan></text><text x="453.7" y="725.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="93"><tspan x="453.7" dy="0">Alto riesgo</tspan></text><rect x="570.3" y="659.5" width="116.6" height="116.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="590.3" cy="682.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="590.3" y="686.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="590.3" dy="0">5</tspan></text><text x="608.3" y="687.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="71"><tspan x="608.3" dy="0">Edad ≥ 65</tspan><tspan x="608.3" dy="17">años</tspan></text><text x="582.3" y="725.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="93"><tspan x="582.3" dy="0">Alto riesgo</tspan></text><rect x="698.9" y="659.5" width="116.6" height="116.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="718.9" cy="682.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="718.9" y="686.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="718.9" dy="0">6</tspan></text><text x="736.9" y="687.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="71"><tspan x="736.9" dy="0">Amnesia ≥</tspan><tspan x="736.9" dy="17">30</tspan><tspan x="736.9" dy="17">minutos</tspan></text><text x="710.9" y="742.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="93"><tspan x="710.9" dy="0">Riesgo medio</tspan></text><rect x="827.4" y="659.5" width="116.6" height="116.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="847.4" cy="682.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="847.4" y="686.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="847.4" dy="0">7</tspan></text><text x="865.4" y="687.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="71"><tspan x="865.4" dy="0">Mecanismo</tspan><tspan x="865.4" dy="17">peligroso</tspan></text><text x="839.4" y="725.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="93"><tspan x="839.4" dy="0">Riesgo medio</tspan></text><text x="56.0" y="802.5" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">Basta un criterio para pedir TC.</tspan></text><text x="40.0" y="862.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="872.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="912.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="903.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hipotensión arterial</tspan><tspan x="285.0" dy="17">persistente</tspan></text><text x="435.0" y="895.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Herida de cuero</tspan><tspan x="435.0" dy="17">cabelludo</tspan><tspan x="435.0" dy="17">sangrante</tspan></text><rect x="513.0" y="875.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="903.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Escala de Glasgow</tspan><tspan x="585.0" dy="17">menor de 14</tspan></text><text x="735.0" y="903.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Radiografía de</tspan><tspan x="735.0" dy="17">cráneo normal</tspan></text><text x="885.0" y="903.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Edad menor de 40</tspan><tspan x="885.0" dy="17">años</tspan></text><rect x="40.0" y="943.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="943.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="972.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Indica TC?</tspan></text><text x="285.0" y="964.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Busca sangrado fuera</tspan><tspan x="285.0" dy="16">del cráneo primero</tspan></text><text x="435.0" y="972.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No por sí sola</tspan></text><text x="585.0" y="964.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: es criterio de alto</tspan><tspan x="585.0" dy="16">riesgo</tspan></text><text x="735.0" y="972.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no descarta lesión</tspan></text><text x="885.0" y="964.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: el riesgo es ≥ 65</tspan><tspan x="885.0" dy="16">años</tspan></text><rect x="40.0" y="872.5" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1017.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1045.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1067.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• NICE 2023: TC en 1 hora si Glasgow &lt; 13 al llegar o &lt; 15 a las 2 horas, fractura sospechada, convulsión, déficit focal o más de 1 vómito.</tspan><tspan x="58.0" dy="18">• La Rx de cráneo ya no se usa: una Rx normal no descarta sangrado.</tspan><tspan x="58.0" dy="18">• Hipotensión en un TEC: buscar sangrado en otro lugar (el TEC aislado no la explica).</tspan></text><text x="58.0" y="1125.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: NICE NG232, traumatismo craneoencefálico (2023); Stiell et al., regla canadiense de TC de cráneo (Lancet, 2001); ATLS 11.ª ed. (2025).</tspan></text></svg>