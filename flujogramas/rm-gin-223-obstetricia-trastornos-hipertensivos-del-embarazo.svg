<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1219" viewBox="0 0 1000 1219" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="PA de 140/90 mmHg elevada antes de las 20 semanas: hipertensión arterial crónica"><title>PA de 140/90 mmHg elevada antes de las 20 semanas: hipertensión arterial crónica</title><rect x="0.75" y="0.75" width="998.5" height="1217.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · trastornos hipertensivos del embarazo</tspan></text><rect x="503.5" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="583.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="583.3" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hipertensión crónica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">PA de 140/90 mmHg o más antes del embarazo, detectada antes de las 20 semanas o</tspan><tspan x="58.0" dy="17">persistente más de 12 semanas tras el parto.</tspan><tspan x="58.0" dy="17">Se clasifica por el momento de aparición.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante de 18 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Cefalea y malestar; PA elevada en el control previo.</tspan><tspan x="640.0" dy="16">PA 140/90 mmHg; LCF 144; AU 16 cm.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TRASTORNOS HIPERTENSIVOS SEGÚN LAS SEMANAS DE GESTACIÓN</tspan></text><line x1="290.0" y1="291.0" x2="290.0" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="290.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="290.0" dy="0">0</tspan></text><line x1="355.0" y1="291.0" x2="355.0" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="355.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="355.0" dy="0">4</tspan></text><line x1="420.0" y1="291.0" x2="420.0" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="420.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="420.0" dy="0">8</tspan></text><line x1="485.0" y1="291.0" x2="485.0" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="485.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="485.0" dy="0">12</tspan></text><line x1="550.0" y1="291.0" x2="550.0" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="550.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="550.0" dy="0">16</tspan></text><line x1="615.0" y1="291.0" x2="615.0" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="615.0" dy="0">20</tspan></text><line x1="680.0" y1="291.0" x2="680.0" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="680.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="680.0" dy="0">24</tspan></text><line x1="745.0" y1="291.0" x2="745.0" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="745.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="745.0" dy="0">28</tspan></text><line x1="810.0" y1="291.0" x2="810.0" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="810.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="810.0" dy="0">32</tspan></text><line x1="875.0" y1="291.0" x2="875.0" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="875.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="875.0" dy="0">36</tspan></text><line x1="940.0" y1="291.0" x2="940.0" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="940.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="940.0" dy="0">40</tspan></text><text x="940.0" y="273.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="end" data-max="60"><tspan x="940.0" dy="0">semanas</tspan></text><rect x="40.0" y="295.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="311.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Hipertensión crónica (este caso)</tspan></text><text x="48.0" y="326.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">PA de 140/90 mmHg antes de las 20 s</tspan></text><rect x="290.0" y="303.0" width="325.0" height="22.0" rx="6" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="48.0" y="349.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Hipertensión gestacional</tspan></text><text x="48.0" y="364.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Sin proteinuria ni disfunción de órganos</tspan></text><rect x="615.0" y="341.0" width="325.0" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><rect x="40.0" y="371.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="387.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Preeclampsia</tspan></text><text x="48.0" y="402.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Proteinuria o daño de órgano blanco</tspan></text><rect x="615.0" y="379.0" width="325.0" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="425.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Aspirina 81 mg diaria</tspan></text><text x="48.0" y="440.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Desde las 12 a 16 semanas</tspan></text><rect x="485.0" y="417.0" width="455.0" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><line x1="582.5" y1="293.0" x2="582.5" y2="453.0" stroke="#b91c1c" stroke-width="2.6"/><rect x="541.1" y="453.0" width="82.7" height="22.0" rx="11" fill="#b91c1c" stroke="none" stroke-width="1.5"/><text x="582.5" y="468.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="582.5" dy="0">18 semanas</tspan></text><rect x="40.0" y="499.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="525.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">PA elevada antes de las 20 semanas = hipertensión crónica</tspan></text><text x="60.0" y="544.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Gestacional y preeclampsia aparecen después de las 20 semanas; la eclampsia exige convulsiones.</tspan></text><text x="40.0" y="605.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TRASTORNOS HIPERTENSIVOS DEL EMBARAZO</tspan></text><rect x="40.0" y="617.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="636.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Trastorno</tspan></text><text x="280.0" y="636.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="674"><tspan x="280.0" dy="0">Definición</tspan></text><rect x="40.0" y="646.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="665.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Hipertensión crónica</tspan></text><text x="280.0" y="665.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="674"><tspan x="280.0" dy="0">140/90 mmHg o más antes del embarazo o antes de las 20 semanas</tspan></text><rect x="170.6" y="649.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="216.0" y="664.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="216.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="675.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="694.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Hipertensión gestacional</tspan></text><text x="280.0" y="694.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="674"><tspan x="280.0" dy="0">Después de las 20 semanas, sin proteinuria ni disfunción de órganos</tspan></text><rect x="40.0" y="704.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="723.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Preeclampsia</tspan></text><text x="280.0" y="723.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="674"><tspan x="280.0" dy="0">Hipertensión de inicio tardío con proteinuria o daño de órgano blanco</tspan></text><rect x="40.0" y="733.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="752.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Preeclampsia superpuesta</tspan></text><text x="280.0" y="752.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="674"><tspan x="280.0" dy="0">Hipertensa crónica con aumento brusco, proteinuria nueva o severidad</tspan></text><rect x="40.0" y="762.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="781.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Eclampsia</tspan></text><text x="280.0" y="781.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="674"><tspan x="280.0" dy="0">Convulsiones en una gestante con preeclampsia</tspan></text><text x="40.0" y="831.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="841.0" width="920.0" height="88.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="889.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="863.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Preeclampsia</tspan><tspan x="285.0" dy="17">superpuesta a</tspan><tspan x="285.0" dy="17">hipertensión</tspan><tspan x="285.0" dy="17">crónica</tspan></text><text x="435.0" y="889.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Eclampsia</tspan></text><text x="585.0" y="880.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Síndrome de</tspan><tspan x="585.0" dy="17">preeclampsia</tspan></text><text x="735.0" y="880.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hipertensión</tspan><tspan x="735.0" dy="17">gestacional</tspan></text><rect x="813.0" y="844.0" width="144.0" height="82.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="880.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hipertensión</tspan><tspan x="885.0" dy="17">arterial crónica</tspan></text><rect x="40.0" y="929.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="929.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="966.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="950.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: faltan proteinuria</tspan><tspan x="285.0" dy="16">nueva o criterios de</tspan><tspan x="285.0" dy="16">severidad</tspan></text><text x="435.0" y="958.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: requiere</tspan><tspan x="435.0" dy="16">convulsiones</tspan></text><text x="585.0" y="950.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: requiere inicio</tspan><tspan x="585.0" dy="16">después de las 20</tspan><tspan x="585.0" dy="16">semanas</tspan></text><text x="735.0" y="958.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: aparece después</tspan><tspan x="735.0" dy="16">de las 20 semanas</tspan></text><text x="885.0" y="958.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: elevada antes de</tspan><tspan x="885.0" dy="16">las 20 semanas</tspan></text><rect x="40.0" y="841.0" width="920.0" height="154.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1019.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1047.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1069.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Hipertensión gestacional: después de las 20 semanas, sin proteinuria ni disfunción de órganos. Preeclampsia: hipertensión de inicio tardío con proteinuria</tspan><tspan x="58.0" dy="18">   o daño de órgano blanco.</tspan><tspan x="58.0" dy="18">• Superpuesta: hipertensa crónica con aumento brusco de la PA, proteinuria nueva o criterios de severidad. Eclampsia: convulsiones.</tspan><tspan x="58.0" dy="18">• Con 18 semanas y cifras previas elevadas es crónica; la cefalea obliga a descartar severidad con laboratorio, pero no establece la superposición.</tspan><tspan x="58.0" dy="18">• Tratar desde 140/90 mmHg con labetalol o nifedipino (ensayo CHAP 2022); evitar IECA y ARA-II; aspirina 81 mg diaria desde las 12 a 16 semanas.</tspan></text><text x="58.0" y="1163.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, Practice Bulletin 203 (Obstet Gynecol 2019); Tita y cols., CHAP (N Engl J Med 2022;386:1781); GPC 03-2025 INS/MINSA, Trastornos hipertensivos del</tspan><tspan x="58.0" dy="15">embarazo.</tspan></text></svg>