<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="964" viewBox="0 0 1000 964" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Correlacionar consumo de carnes rojas e incidencia de cáncer en 13 países es un estudio ecológico"><title>Correlacionar consumo de carnes rojas e incidencia de cáncer en 13 países es un estudio ecológico</title><rect x="0.75" y="0.75" width="998.5" height="962.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Epidemiología · estudio ecológico</tspan></text><rect x="401.6" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="465.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="465.9" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Estudio ecológico</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La unidad de análisis es un grupo o población, no el individuo.</tspan><tspan x="58.0" dy="17">Compara indicadores agregados.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Correlación entre países</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Consumo per cápita de carnes rojas (kg/año) frente a</tspan><tspan x="640.0" dy="16">incidencia de cáncer ginecológico por 100 000 mujeres.</tspan><tspan x="640.0" dy="16">13 países.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ CARACTERIZA AL ESTUDIO ECOLÓGICO</tspan></text><line x1="410.9" y1="420.9" x2="340.0" y2="444.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="444.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.1" y1="361.1" x2="660.0" y2="337.4" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="337.4" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.1" y1="420.9" x2="660.0" y2="444.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="444.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="410.3" y1="363.0" x2="340.0" y2="341.0" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="341.0" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="391.0" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="391.0" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="396.0" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">ECOLÓGICO</tspan></text><text x="500.0" y="415.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">la unidad es el grupo</tspan></text><rect x="40.0" y="295.4" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="324.2" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">DATOS AGREGADOS</tspan></text><text x="190.0" y="347.9" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Consumo promedio y tasa de enfermedad por</tspan><tspan x="190.0" dy="17">país</tspan></text><rect x="144.6" y="376.6" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="391.6" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="402.6" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="403.6" width="6.0" height="82.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="436.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">USOS</tspan></text><text x="190.0" y="460.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Rápido y barato: genera hipótesis</tspan></text><rect x="660.0" y="291.8" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="292.8" width="6.0" height="89.2" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="810.0" y="320.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">LIMITACIÓN</tspan></text><text x="810.0" y="344.3" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Falacia ecológica: no se sabe quién comió ni</tspan><tspan x="810.0" dy="17">quién enfermó</tspan></text><rect x="660.0" y="399.0" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="400.0" width="6.0" height="89.2" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="427.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">CONFUSIÓN</tspan></text><text x="810.0" y="451.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Dieta total, tamizaje y edad difieren entre</tspan><tspan x="810.0" dy="17">países</tspan></text><text x="40.0" y="533.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="545.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="578.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">País con consumo y tasa</tspan></text><line x1="248.5" y1="574.0" x2="267.5" y2="574.0" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,569.0 266.5,579.0 274.5,574.0" fill="#0f766e"/><rect x="278.5" y="545.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="578.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">13 pares de valores</tspan></text><line x1="487.0" y1="574.0" x2="506.0" y2="574.0" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,569.0 505.0,579.0 513.0,574.0" fill="#0f766e"/><rect x="517.0" y="545.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="578.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Se calcula la correlación</tspan></text><line x1="725.5" y1="574.0" x2="744.5" y2="574.0" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,569.0 743.5,579.0 751.5,574.0" fill="#0f766e"/><rect x="755.5" y="545.0" width="204.5" height="58.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="569.5" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Hipótesis a comprobar en</tspan><tspan x="857.8" dy="17">individuos</tspan></text><text x="40.0" y="643.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="653.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="684.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="675.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Cohortes no</tspan><tspan x="285.0" dy="17">concurrente</tspan></text><text x="435.0" y="684.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Longitudinal</tspan></text><text x="585.0" y="675.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Analítico</tspan><tspan x="585.0" dy="17">transversal</tspan></text><rect x="663.0" y="656.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="684.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ecológico</tspan></text><text x="885.0" y="684.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Casos y controles</tspan></text><rect x="40.0" y="707.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="707.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="736.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Unidad de análisis: el</tspan><tspan x="54.0" dy="16">país?</tspan></text><text x="285.0" y="728.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: requiere datos</tspan><tspan x="285.0" dy="16">individuales de</tspan><tspan x="285.0" dy="16">exposición</tspan></text><text x="435.0" y="736.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: solo indica que hay</tspan><tspan x="435.0" dy="16">seguimiento</tspan></text><text x="585.0" y="736.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: mide individuos en</tspan><tspan x="585.0" dy="16">un momento</tspan></text><text x="735.0" y="728.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: compara</tspan><tspan x="735.0" dy="16">indicadores agregados</tspan><tspan x="735.0" dy="16">de grupos</tspan></text><text x="885.0" y="736.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: requiere datos</tspan><tspan x="885.0" dy="16">individuales</tspan></text><rect x="40.0" y="653.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="797.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="825.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="847.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Cada punto de datos es un país; se calcula una correlación entre 13 pares de valores. No se sabe qué mujeres comieron carne ni cuáles enfermaron.</tspan><tspan x="58.0" dy="18">• Ventajas: rápido, barato y con datos disponibles; sirve para generar hipótesis.</tspan><tspan x="58.0" dy="18">• Limita: falacia ecológica (lo visto en grupos puede no cumplirse en individuos) y confusión por dieta total, tamizaje o edad.</tspan><tspan x="58.0" dy="18">• Cohortes y casos y controles exigen datos individuales; el siguiente paso es comprobar la hipótesis con un diseño de nivel individual.</tspan></text><text x="58.0" y="923.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Celentano y Szklo, Gordis Epidemiología, 6.ª ed. (2019); Lash et al., Modern Epidemiology, 4.ª ed. (2021); Porta, A Dictionary of Epidemiology, 6.ª ed. (2014).</tspan></text></svg>