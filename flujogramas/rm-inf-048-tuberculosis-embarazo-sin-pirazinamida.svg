<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="990" viewBox="0 0 1000 990" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Gestante con tuberculosis sin pirazinamida: 2 meses de H, R y E y 7 meses de H y R"><title>Gestante con tuberculosis sin pirazinamida: 2 meses de H, R y E y 7 meses de H y R</title><rect x="0.75" y="0.75" width="998.5" height="988.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Tuberculosis · embarazo sin pirazinamida</tspan></text><rect x="445.9" y="32.0" width="121.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="506.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="106"><tspan x="506.8" dy="0">INFECTOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tuberculosis en la gestante</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tratar es más seguro que no tratar: la enfermedad sin tratamiento daña a la madre y al feto.</tspan><tspan x="58.0" dy="17">El esquema estándar es 2HRZE/4HR.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante de 30 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Tuberculosis pulmonar.</tspan><tspan x="640.0" dy="16">No se usará pirazinamida: ¿cuál es el esquema?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DOS FASES DEL ESQUEMA SIN PIRAZINAMIDA (9 MESES)</tspan></text><rect x="42.0" y="279.0" width="456.0" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="270.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="440"><tspan x="270.0" dy="0">MESES 0 A 2</tspan></text><text x="270.0" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="440"><tspan x="270.0" dy="0">Fase intensiva</tspan></text><rect x="502.0" y="279.0" width="456.0" height="56.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="730.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="440"><tspan x="730.0" dy="0">MESES 2 A 9</tspan></text><text x="730.0" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="440"><tspan x="730.0" dy="0">Fase de continuación</tspan></text><rect x="684.6" y="268.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="730.0" y="283.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="730.0" dy="0">◆ ESTE CASO</tspan></text><rect x="48.0" y="349.0" width="444.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="270.0" y="377.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="416"><tspan x="270.0" dy="0">ISONIAZIDA + RIFAMPICINA + ETAMBUTOL</tspan></text><text x="270.0" y="401.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="416"><tspan x="270.0" dy="0">Tres fármacos activos</tspan><tspan x="270.0" dy="17">Más piridoxina diaria</tspan></text><rect x="508.0" y="349.0" width="444.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="730.0" y="377.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="416"><tspan x="730.0" dy="0">ISONIAZIDA + RIFAMPICINA (7 MESES)</tspan></text><text x="730.0" y="401.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="416"><tspan x="730.0" dy="0">Se alarga porque falta el efecto esterilizante de la pirazinamida</tspan><tspan x="730.0" dy="17">Total: 9 meses</tspan></text><text x="40.0" y="474.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ESQUEMAS DE TUBERCULOSIS SENSIBLE EN LA GESTANTE</tspan></text><rect x="40.0" y="486.2" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="505.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Situación</tspan></text><text x="250.0" y="505.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Esquema</tspan></text><text x="610.0" y="505.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Duración</tspan></text><rect x="40.0" y="515.2" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="534.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Estándar (OMS,</tspan><tspan x="50.0" dy="15">ATS/CDC/IDSA)</tspan></text><text x="250.0" y="534.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">2 meses HRZE y 4 meses HR</tspan></text><text x="610.0" y="534.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">6 meses</tspan></text><rect x="40.0" y="559.2" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="578.2" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Sin Z</tspan></text><text x="250.0" y="578.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">2 meses HRE y 7 meses HR</tspan></text><text x="610.0" y="578.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">9 meses</tspan></text><rect x="140.6" y="562.7" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="186.0" y="577.7" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="186.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="604.2" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">H: isoniazida; R: rifampicina; Z: pirazinamida; E: etambutol. Se añade piridoxina; sin pirazinamida el esquema se alarga a 9 meses.</tspan></text><text x="40.0" y="651.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="661.2" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="692.2" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="683.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">2 meses H y E, 7</tspan><tspan x="285.0" dy="17">meses R</tspan></text><rect x="363.0" y="664.2" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="683.7" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">2 meses H, R y E; 7</tspan><tspan x="435.0" dy="17">meses H y R</tspan></text><text x="585.0" y="683.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">2 meses H; 7 meses</tspan><tspan x="585.0" dy="17">H y R</tspan></text><text x="735.0" y="683.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">2 meses H y R; 7</tspan><tspan x="735.0" dy="17">meses H</tspan></text><text x="885.0" y="683.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">2 meses H, R y E; 7</tspan><tspan x="885.0" dy="17">meses H</tspan></text><rect x="40.0" y="715.2" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="715.2" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="744.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Esquema sin</tspan><tspan x="54.0" dy="16">pirazinamida?</tspan></text><text x="285.0" y="736.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: sin isoniazida ni</tspan><tspan x="285.0" dy="16">etambutol en la fase</tspan><tspan x="285.0" dy="16">intensiva</tspan></text><text x="435.0" y="744.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: 2HRE y luego 7HR,</tspan><tspan x="435.0" dy="16">9 meses</tspan></text><text x="585.0" y="744.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: la fase intensiva</tspan><tspan x="585.0" dy="16">solo tiene isoniazida</tspan></text><text x="735.0" y="744.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: falta rifampicina en</tspan><tspan x="735.0" dy="16">la fase intensiva</tspan></text><text x="885.0" y="744.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: un solo fármaco en</tspan><tspan x="885.0" dy="16">la fase de continuación</tspan></text><rect x="40.0" y="661.2" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="805.2" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="833.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="855.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La OMS considera segura la pirazinamida en el embarazo, pero si no se usa se mantiene tres fármacos activos en la fase intensiva y se alarga la de</tspan><tspan x="58.0" dy="18">   continuación.</tspan><tspan x="58.0" dy="18">• Sin pirazinamida: 2 meses de isoniazida, rifampicina y etambutol (2HRE) y 7 meses de isoniazida y rifampicina (7HR): 9 meses en total.</tspan><tspan x="58.0" dy="18">• Las otras opciones omiten la rifampicina o el etambutol en la fase intensiva, o dejan un solo fármaco en la continuación: favorecen la resistencia.</tspan><tspan x="58.0" dy="18">• Perla: piridoxina a toda gestante que recibe isoniazida; la lactancia materna no se suspende; la estreptomicina está contraindicada (sordera fetal).</tspan></text><text x="58.0" y="949.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA, NTS 221-MINSA/DGIESP-2024; OMS, TB Module 4: Treatment (2022); Nahid P et al., ATS/CDC/ERS/IDSA (Clin Infect Dis 2016;63:e147).</tspan></text></svg>