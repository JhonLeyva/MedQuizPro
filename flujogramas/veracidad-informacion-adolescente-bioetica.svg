<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="578" viewBox="0 0 1000 578" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Veracidad en la relación médico-paciente"><title>Veracidad en la relación médico-paciente</title><rect x="0.75" y="0.75" width="998.5" height="576.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16" y="16" width="968" height="56" rx="10" fill="#0f766e"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170" y1="34.0" x2="170" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="634"><tspan x="184.0" dy="0">SALUD PÚBLICA ENAM: VERACIDAD EN LA RELACIÓN MÉDICO-PACIENTE</tspan></text><rect x="837.9" y="32.0" width="126.1" height="24" rx="12" fill="#134e4a"/><text x="901.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="110"><tspan x="901.0" dy="0">SALUD PÚBLICA</tspan></text><rect x="190.0" y="90.0" width="620" height="67.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="500.0" y="118.5" font-size="14.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Adolescente posoperada por embarazo ectópico complicado</tspan></text><text x="500.0" y="141.0" font-size="12" font-weight="400" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Los padres, que niegan su vida sexual, preguntan el diagnóstico</tspan></text><line x1="500.0" y1="157.0" x2="500.0" y2="178.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,177.0 505.0,177.0 500.0,185.0" fill="#0f766e"/><rect x="210.0" y="185.0" width="580" height="100.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="212.5" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="552"><tspan x="500.0" dy="0">INFORMAR VERAZMENTE</tspan></text><text x="500.0" y="235.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="552"><tspan x="500.0" dy="0">• Diagnóstico y pronóstico reales</tspan><tspan x="500.0" dy="17">• a los padres o tutores (menor de edad)</tspan><tspan x="500.0" dy="17">• con tacto y en privado</tspan></text><line x1="500.0" y1="285.0" x2="500.0" y2="303.0" stroke="#0f766e" stroke-width="2"/><line x1="270.0" y1="303.0" x2="730.0" y2="303.0" stroke="#0f766e" stroke-width="2"/><line x1="270.0" y1="303.0" x2="270.0" y2="318.0" stroke="#0f766e" stroke-width="2"/><polygon points="265.0,317.0 275.0,317.0 270.0,325.0" fill="#0f766e"/><line x1="730.0" y1="303.0" x2="730.0" y2="318.0" stroke="#0f766e" stroke-width="2"/><polygon points="725.0,317.0 735.0,317.0 730.0,325.0" fill="#0f766e"/><rect x="70.0" y="325.0" width="400" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="270.0" y="352.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="372"><tspan x="270.0" dy="0">Principios</tspan></text><text x="270.0" y="375.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="372"><tspan x="270.0" dy="0">Veracidad y no maleficencia</tspan><tspan x="270.0" dy="17">Beneficencia: priorizar</tspan><tspan x="270.0" dy="17">el bienestar de la paciente</tspan></text><rect x="530.0" y="325.0" width="400" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="730.0" y="352.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="372"><tspan x="730.0" dy="0">Lo que no se hace</tspan></text><text x="730.0" y="375.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="372"><tspan x="730.0" dy="0">Cambiar o falsear</tspan><tspan x="730.0" dy="17">el diagnóstico</tspan><tspan x="730.0" dy="17">Negar la información</tspan></text><rect x="40" y="451.0" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="479.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="501.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Falsear un diagnóstico vulnera la ética médica y la ley.</tspan><tspan x="58.0" dy="18">• Hablar primero con la adolescente y ofrecer apoyo psicosocial.</tspan></text><text x="58.0" y="541.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Ley General de Salud N.° 26842 · Código de Ética y Deontología del Colegio Médico del Perú</tspan></text></svg>
