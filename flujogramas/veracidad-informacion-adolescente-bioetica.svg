<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="899" viewBox="0 0 1000 899" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Adolescente operada por embarazo ectópico cuyos padres preguntan el diagnóstico: informar con veracidad"><title>Adolescente operada por embarazo ectópico cuyos padres preguntan el diagnóstico: informar con veracidad</title><rect x="0.75" y="0.75" width="998.5" height="898.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Bioética médica · información en menores de edad</tspan></text><rect x="499.4" y="32.0" width="143.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="571.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="127"><tspan x="571.2" dy="0">SALUD PÚBLICA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="152.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Derecho a la información veraz</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El médico no miente ni cambia el diagnóstico.</tspan><tspan x="58.0" dy="17">En menores de edad, los padres son responsables legales y deben conocer el diagnóstico</tspan><tspan x="58.0" dy="17">y el pronóstico.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="152.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="150.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Adolescente posoperada por ectópico</tspan><tspan x="640.0" dy="17">complicado</tspan></text><text x="640.0" y="176.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Los padres aseguran que no tiene vida sexual.</tspan><tspan x="640.0" dy="16">Preguntan por el diagnóstico.</tspan></text><line x1="640.0" y1="222.0" x2="670.0" y2="222.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="226.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="242.0" x2="320.0" y2="272.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="272.0" x2="500.0" y2="272.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="272.0" x2="500.0" y2="301.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,300.0 505.0,300.0 500.0,308.0" fill="#94a3b8"/><line x1="500.0" y1="366.0" x2="500.0" y2="396.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="396.0" x2="733.5" y2="396.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="396.0" x2="266.5" y2="425.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,424.0 271.5,424.0 266.5,432.0" fill="#94a3b8"/><line x1="733.5" y1="396.0" x2="733.5" y2="425.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,424.0 738.5,424.0 733.5,432.0" fill="#94a3b8"/><line x1="320.0" y1="242.0" x2="320.0" y2="272.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="272.0" x2="500.0" y2="272.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="272.0" x2="500.0" y2="301.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,300.0 505.0,300.0 500.0,308.0" fill="#0f766e"/><line x1="500.0" y1="366.0" x2="500.0" y2="396.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="396.0" x2="500.0" y2="396.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="396.0" x2="266.5" y2="425.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,424.0 271.5,424.0 266.5,432.0" fill="#0f766e"/><rect x="170.9" y="405.0" width="191.2" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="417.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Informar con veracidad (este caso)</tspan></text><rect x="705.7" y="405.0" width="55.6" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="417.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Además</tspan></text><polygon points="240.0,337.0 266.0,308.0 734.0,308.0 760.0,337.0 734.0,366.0 266.0,366.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="337.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="342.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="341.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Padres de una menor preguntan el diagnóstico</tspan></text><rect x="40.0" y="432.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="460.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">DIAGNÓSTICO Y PRONÓSTICO REALES</tspan></text><text x="266.5" y="483.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Con tacto y privacidad</tspan><tspan x="266.5" dy="17">Hablar antes con la adolescente</tspan></text><rect x="507.0" y="432.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="468.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Descartar violencia sexual</tspan></text><text x="733.5" y="491.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Activar protección si corresponde</tspan></text><text x="40.0" y="562.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="572.5" width="920.0" height="88.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="620.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="603.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Cambiar el</tspan><tspan x="285.0" dy="17">diagnóstico para</tspan><tspan x="285.0" dy="17">evitar conflicto</tspan></text><text x="435.0" y="612.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Negarse a brindar</tspan><tspan x="435.0" dy="17">información</tspan></text><text x="585.0" y="612.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Derivar al área</tspan><tspan x="585.0" dy="17">social</tspan></text><rect x="663.0" y="575.5" width="144.0" height="82.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="595.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Informar</tspan><tspan x="735.0" dy="17">verazmente el</tspan><tspan x="735.0" dy="17">diagnóstico y</tspan><tspan x="735.0" dy="17">pronóstico</tspan></text><text x="885.0" y="612.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Ocultarlo a los</tspan><tspan x="885.0" dy="17">padres siempre</tspan></text><rect x="40.0" y="660.5" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="660.5" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="697.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Adecuada?</tspan></text><text x="285.0" y="697.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es mentir</tspan></text><text x="435.0" y="689.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: los padres son</tspan><tspan x="435.0" dy="16">responsables legales</tspan></text><text x="585.0" y="681.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Puede apoyar, no</tspan><tspan x="585.0" dy="16">reemplaza la</tspan><tspan x="585.0" dy="16">información</tspan></text><text x="735.0" y="697.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: información veraz</tspan></text><text x="885.0" y="689.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: en una menor, los</tspan><tspan x="885.0" dy="16">padres deben saberlo</tspan></text><rect x="40.0" y="572.5" width="920.0" height="154.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="750.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="778.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="800.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Informar con veracidad, con tacto y privacidad, idealmente hablando antes con la adolescente.</tspan><tspan x="58.0" dy="18">• Mentir o negarse a informar vulnera la ética y la ley (Ley 29414 de derechos de los usuarios).</tspan><tspan x="58.0" dy="18">• Evaluar si hubo violencia sexual (menor de edad) y activar la protección correspondiente.</tspan></text><text x="58.0" y="858.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Ley General de Salud n.º 26842; Ley 29414; Código de Ética del Colegio Médico del Perú (2023).</tspan></text></svg>