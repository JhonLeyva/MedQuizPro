<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1016" viewBox="0 0 1000 1016" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Diabética con poliuria, dolor abdominal y deterioro del sensorio: cetoacidosis diabética"><title>Diabética con poliuria, dolor abdominal y deterioro del sensorio: cetoacidosis diabética</title><rect x="0.75" y="0.75" width="998.5" height="1014.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Diabetes · cetoacidosis diabética</tspan></text><rect x="395.5" y="32.0" width="140.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="465.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="124"><tspan x="465.8" dy="0">ENDOCRINOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cetoacidosis diabética</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Déficit de insulina con hiperglucemia, cetonas y acidosis metabólica.</tspan><tspan x="58.0" dy="17">Puede ocurrir en diabetes tipo 2 con infección, omisión de tratamiento o estrés.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 46 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Obesa, diabética con tratamiento irregular. Ocho días</tspan><tspan x="640.0" dy="16">de polidipsia, poliuria, cefalea, dolor abdominal difuso y</tspan><tspan x="640.0" dy="16">deterioro del sensorio, sin déficit motor.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">GASOMETRÍA TÍPICA DE LA CETOACIDOSIS (VALORES DE EJEMPLO)</tspan></text><rect x="40.0" y="285.0" width="222.5" height="78.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="151.2" y="305.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="210"><tspan x="151.2" dy="0">pH</tspan></text><text x="151.2" y="333.0" font-size="20" font-weight="800" font-style="normal" fill="#2563eb" text-anchor="middle" data-max="210"><tspan x="151.2" dy="0">7,10 ↓</tspan></text><text x="151.2" y="353.0" font-size="9.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="151.2" dy="0">normal 7,35-7,45</tspan></text><rect x="272.5" y="285.0" width="222.5" height="78.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="383.8" y="305.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="210"><tspan x="383.8" dy="0">HCO₃⁻</tspan></text><text x="383.8" y="333.0" font-size="20" font-weight="800" font-style="normal" fill="#2563eb" text-anchor="middle" data-max="210"><tspan x="383.8" dy="0">10 ↓</tspan></text><text x="383.8" y="353.0" font-size="9.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="383.8" dy="0">normal 22-26</tspan></text><rect x="505.0" y="285.0" width="222.5" height="78.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="616.2" y="305.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="210"><tspan x="616.2" dy="0">Glucemia</tspan></text><text x="616.2" y="333.0" font-size="20" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="210"><tspan x="616.2" dy="0">450 ↑</tspan></text><text x="616.2" y="353.0" font-size="9.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="616.2" dy="0">normal 70-100</tspan></text><rect x="737.5" y="285.0" width="222.5" height="78.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="848.8" y="305.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="210"><tspan x="848.8" dy="0">β-OH-butirato</tspan></text><text x="848.8" y="333.0" font-size="20" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="210"><tspan x="848.8" dy="0">&gt; 3 ↑</tspan></text><text x="848.8" y="353.0" font-size="9.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="848.8" dy="0">normal &lt; 0,6</tspan></text><rect x="40.0" y="377.0" width="250.0" height="41.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="60.0" cy="397.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="60.0" y="402.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">1</tspan></text><text x="80.0" y="401.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="80.0" dy="0">¿Acidemia o alcalemia?</tspan></text><line x1="293.0" y1="397.5" x2="300.0" y2="397.5" stroke="#0f766e" stroke-width="2"/><polygon points="299.0,392.5 299.0,402.5 307.0,397.5" fill="#0f766e"/><rect x="310.0" y="377.0" width="230.0" height="41.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="322.0" y="401.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="206"><tspan x="322.0" dy="0">pH &lt; 7,30</tspan></text><line x1="543.0" y1="397.5" x2="550.0" y2="397.5" stroke="#0f766e" stroke-width="2"/><polygon points="549.0,392.5 549.0,402.5 557.0,397.5" fill="#0f766e"/><rect x="560.0" y="377.0" width="400.0" height="41.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.2"/><text x="572.0" y="401.5" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="376"><tspan x="572.0" dy="0">Acidemia</tspan></text><rect x="40.0" y="426.0" width="250.0" height="41.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="60.0" cy="446.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="60.0" y="451.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">2</tspan></text><text x="80.0" y="450.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="80.0" dy="0">¿Metabólica o respiratoria?</tspan></text><line x1="293.0" y1="446.5" x2="300.0" y2="446.5" stroke="#0f766e" stroke-width="2"/><polygon points="299.0,441.5 299.0,451.5 307.0,446.5" fill="#0f766e"/><rect x="310.0" y="426.0" width="230.0" height="41.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="322.0" y="450.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="206"><tspan x="322.0" dy="0">HCO₃⁻ &lt; 18</tspan></text><line x1="543.0" y1="446.5" x2="550.0" y2="446.5" stroke="#0f766e" stroke-width="2"/><polygon points="549.0,441.5 549.0,451.5 557.0,446.5" fill="#0f766e"/><rect x="560.0" y="426.0" width="400.0" height="41.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.2"/><text x="572.0" y="450.5" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="376"><tspan x="572.0" dy="0">Acidosis metabólica</tspan></text><rect x="40.0" y="475.0" width="250.0" height="41.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="60.0" cy="495.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="60.0" y="500.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">3</tspan></text><text x="80.0" y="499.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="80.0" dy="0">¿Hay cetonas?</tspan></text><line x1="293.0" y1="495.5" x2="300.0" y2="495.5" stroke="#0f766e" stroke-width="2"/><polygon points="299.0,490.5 299.0,500.5 307.0,495.5" fill="#0f766e"/><rect x="310.0" y="475.0" width="230.0" height="41.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="322.0" y="499.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="206"><tspan x="322.0" dy="0">β-hidroxibutirato ≥ 3</tspan></text><line x1="543.0" y1="495.5" x2="550.0" y2="495.5" stroke="#0f766e" stroke-width="2"/><polygon points="549.0,490.5 549.0,500.5 557.0,495.5" fill="#0f766e"/><rect x="560.0" y="475.0" width="400.0" height="41.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.2"/><text x="572.0" y="499.5" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="376"><tspan x="572.0" dy="0">Cetoacidosis</tspan></text><rect x="40.0" y="524.0" width="250.0" height="41.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="60.0" cy="544.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="60.0" y="549.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">4</tspan></text><text x="80.0" y="548.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="80.0" dy="0">¿Qué hago primero?</tspan></text><line x1="293.0" y1="544.5" x2="300.0" y2="544.5" stroke="#0f766e" stroke-width="2"/><polygon points="299.0,539.5 299.0,549.5 307.0,544.5" fill="#0f766e"/><rect x="310.0" y="524.0" width="230.0" height="41.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="322.0" y="548.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="206"><tspan x="322.0" dy="0">Hipovolemia y déficit de insulina</tspan></text><line x1="543.0" y1="544.5" x2="550.0" y2="544.5" stroke="#0f766e" stroke-width="2"/><polygon points="549.0,539.5 549.0,549.5 557.0,544.5" fill="#0f766e"/><rect x="560.0" y="524.0" width="400.0" height="41.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="572.0" y="548.5" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="376"><tspan x="572.0" dy="0">LÍQUIDOS + INSULINA + POTASIO</tspan></text><rect x="40.0" y="583.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="609.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Diabética descompensada con acidosis = cetoacidosis</tspan></text><text x="60.0" y="628.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Se confirma con glucemia, cetonas, gases arteriales y electrolitos.</tspan></text><text x="40.0" y="695.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="705.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="736.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="708.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="727.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Cetoacidosis</tspan><tspan x="285.0" dy="17">diabética</tspan></text><text x="435.0" y="736.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Meningoencefalitis</tspan></text><text x="585.0" y="736.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Peritonitis</tspan></text><text x="735.0" y="736.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Pancreatitis</tspan></text><text x="885.0" y="727.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Accidente</tspan><tspan x="885.0" dy="17">cerebrovascular</tspan></text><rect x="40.0" y="759.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="759.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="796.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="780.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: diabetes</tspan><tspan x="285.0" dy="16">descompensada con</tspan><tspan x="285.0" dy="16">acidosis</tspan></text><text x="435.0" y="788.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: faltan fiebre y</tspan><tspan x="435.0" dy="16">signos meníngeos</tspan></text><text x="585.0" y="788.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: el dolor no es</tspan><tspan x="585.0" dy="16">localizado</tspan></text><text x="735.0" y="788.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: el dolor no es</tspan><tspan x="735.0" dy="16">localizado</tspan></text><text x="885.0" y="788.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no hay déficit</tspan><tspan x="885.0" dy="16">motor</tspan></text><rect x="40.0" y="705.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="849.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="877.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="899.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Consenso 2024 de crisis hiperglucémicas: glucemia ≥ 200 mg/dL (o antecedente), β-hidroxibutirato ≥ 3 mmol/L y pH &lt; 7,30 o HCO₃⁻ &lt; 18 mmol/L.</tspan><tspan x="58.0" dy="18">• El dolor abdominal se debe a la acidosis y a la gastroparesia; el deterioro del sensorio, a la osmolaridad alta y al pH bajo.</tspan><tspan x="58.0" dy="18">• Tratamiento: líquidos, insulina endovenosa y potasio (no iniciar insulina si K &lt; 3,5 mEq/L). Buscar el desencadenante: infección o infarto.</tspan><tspan x="58.0" dy="18">• Meningoencefalitis exige fiebre y signos meníngeos; peritonitis y pancreatitis dan dolor localizado; el ACV causa déficit focal.</tspan></text><text x="58.0" y="975.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Umpierrez et al., consenso de crisis hiperglucémicas, Diabetes Care (2024); ADA, Standards of Care in Diabetes-2026</tspan></text></svg>