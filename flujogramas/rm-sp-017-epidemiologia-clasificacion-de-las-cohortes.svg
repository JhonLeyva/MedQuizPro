<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1127" viewBox="0 0 1000 1127" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Los estudios de cohorte se clasifican en prospectivos, retrospectivos y ambispectivos"><title>Los estudios de cohorte se clasifican en prospectivos, retrospectivos y ambispectivos</title><rect x="0.75" y="0.75" width="998.5" height="1125.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Epidemiología · clasificación de las cohortes</tspan></text><rect x="464.6" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="528.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="528.9" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cohortes según el tiempo</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se clasifican por la relación temporal entre el inicio del estudio y el desenlace.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de clasificación</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Los estudios de cohorte pueden ser clasificados</tspan><tspan x="640.0" dy="16">como...</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TIPOS DE COHORTE SEGÚN EL MOMENTO DEL ESTUDIO</tspan></text><line x1="410.3" y1="403.0" x2="340.0" y2="425.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="425.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="347.0" x2="660.0" y2="325.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="325.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="403.0" x2="660.0" y2="425.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="425.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="410.3" y1="347.0" x2="340.0" y2="325.0" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="325.0" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="375.0" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="375.0" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="380.0" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">COHORTE</tspan></text><text x="500.0" y="399.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">relación con el tiempo</tspan></text><rect x="40.0" y="283.0" width="300.0" height="84.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="316.7" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">PROSPECTIVA</tspan></text><text x="190.0" y="340.4" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Se sigue hacia el futuro</tspan></text><rect x="144.6" y="357.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="372.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="383.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="384.0" width="6.0" height="82.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="416.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">RETROSPECTIVA</tspan></text><text x="190.0" y="440.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Todo ocurrió antes: registros</tspan></text><rect x="660.0" y="283.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="284.0" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="810.0" y="316.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">AMBISPECTIVA</tspan></text><text x="810.0" y="340.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Pasado reconstruido y seguimiento</tspan></text><rect x="660.0" y="383.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="384.0" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="416.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">CERRADA O ABIERTA</tspan></text><text x="810.0" y="440.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Entrada fija o dinámica de sujetos</tspan></text><text x="40.0" y="517.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="529.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="553.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Definir expuestos y no</tspan><tspan x="142.2" dy="17">expuestos</tspan></text><line x1="248.5" y1="558.0" x2="267.5" y2="558.0" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,553.0 266.5,563.0 274.5,558.0" fill="#0f766e"/><rect x="278.5" y="529.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="562.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Medir exposición</tspan></text><line x1="487.0" y1="558.0" x2="506.0" y2="558.0" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,553.0 505.0,563.0 513.0,558.0" fill="#0f766e"/><rect x="517.0" y="529.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="562.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Seguir hasta el evento</tspan></text><line x1="725.5" y1="558.0" x2="744.5" y2="558.0" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,553.0 743.5,563.0 751.5,558.0" fill="#0f766e"/><rect x="755.5" y="529.0" width="204.5" height="58.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="562.0" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Comparar incidencias</tspan></text><text x="40.0" y="621.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TIPOS DE COHORTE SEGÚN EL TIEMPO</tspan></text><rect x="40.0" y="633.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="652.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="124"><tspan x="50.0" dy="0">Tipo</tspan></text><text x="190.0" y="652.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="244"><tspan x="190.0" dy="0">Exposición y desenlace</tspan></text><text x="450.0" y="652.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="244"><tspan x="450.0" dy="0">Ventaja</tspan></text><text x="710.0" y="652.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="244"><tspan x="710.0" dy="0">Limitación</tspan></text><rect x="40.0" y="662.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="681.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="124"><tspan x="50.0" dy="0">Prospectiva</tspan></text><text x="190.0" y="681.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="244"><tspan x="190.0" dy="0">Se miden hacia el futuro</tspan></text><text x="450.0" y="681.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="244"><tspan x="450.0" dy="0">Mejor medición de la exposición</tspan></text><text x="710.0" y="681.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="244"><tspan x="710.0" dy="0">Más tiempo y costo</tspan></text><rect x="40.0" y="691.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="710.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="124"><tspan x="50.0" dy="0">Retrospectiva</tspan></text><text x="190.0" y="710.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="244"><tspan x="190.0" dy="0">Ya ocurrieron; registros</tspan></text><text x="450.0" y="710.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="244"><tspan x="450.0" dy="0">Rápida y barata</tspan></text><text x="710.0" y="710.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="244"><tspan x="710.0" dy="0">Depende de la calidad del registro</tspan></text><rect x="40.0" y="720.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="739.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="124"><tspan x="50.0" dy="0">Ambispectiva</tspan></text><text x="190.0" y="739.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="244"><tspan x="190.0" dy="0">Pasado y futuro</tspan></text><text x="450.0" y="739.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="244"><tspan x="450.0" dy="0">Combina ambas</tspan></text><text x="710.0" y="739.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="244"><tspan x="710.0" dy="0">Más compleja de planificar</tspan></text><text x="40.0" y="789.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="799.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="838.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="821.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Ensayo, serie de</tspan><tspan x="285.0" dy="17">casos y</tspan><tspan x="285.0" dy="17">ambispectiva</tspan></text><text x="435.0" y="821.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Prevalencia,</tspan><tspan x="435.0" dy="17">transversal y</tspan><tspan x="435.0" dy="17">concordancia</tspan></text><rect x="513.0" y="802.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="821.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Prospectivos,</tspan><tspan x="585.0" dy="17">retrospectivos y</tspan><tspan x="585.0" dy="17">ambispectiva</tspan></text><text x="735.0" y="821.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Prospectivas, de</tspan><tspan x="735.0" dy="17">expuestos y de</tspan><tspan x="735.0" dy="17">tendencias</tspan></text><text x="885.0" y="821.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Analítico,</tspan><tspan x="885.0" dy="17">prospectiva y</tspan><tspan x="885.0" dy="17">asociación cruzada</tspan></text><rect x="40.0" y="870.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="870.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="907.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Clasificación?</tspan></text><text x="285.0" y="899.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: mezcla ensayo y</tspan><tspan x="285.0" dy="16">serie de casos</tspan></text><text x="435.0" y="899.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: son estudios sin</tspan><tspan x="435.0" dy="16">seguimiento</tspan></text><text x="585.0" y="891.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: según el tiempo de</tspan><tspan x="585.0" dy="16">la exposición y el</tspan><tspan x="585.0" dy="16">evento</tspan></text><text x="735.0" y="899.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: mezcla conceptos</tspan><tspan x="735.0" dy="16">de otros diseños</tspan></text><text x="885.0" y="899.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: mezcla conceptos</tspan><tspan x="885.0" dy="16">de otros diseños</tspan></text><rect x="40.0" y="799.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="960.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="988.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1010.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Prospectiva: se mide la exposición hoy y se sigue al futuro hasta el evento. Mejor calidad de la medición, pero más tiempo y costo.</tspan><tspan x="58.0" dy="18">• Retrospectiva (histórica): exposición y desenlace ya ocurrieron; se usan registros e historias clínicas. Ahorra tiempo y dinero.</tspan><tspan x="58.0" dy="18">• Ambispectiva: reconstruye la exposición pasada y sigue hacia adelante.</tspan><tspan x="58.0" dy="18">• También hay cohortes cerradas (fijas) y abiertas (dinámicas), con densidad de incidencia por persona-tiempo.</tspan></text><text x="58.0" y="1086.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Gordis, Epidemiología 6.ª ed. (2019); Szklo y Nieto, Epidemiology: Beyond the Basics 4.ª ed. (2019); Rothman, Modern Epidemiology 4.ª ed. (2021).</tspan></text></svg>