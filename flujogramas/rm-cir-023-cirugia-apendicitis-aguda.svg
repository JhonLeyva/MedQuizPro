 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="142.0" cy="426.0" rx="15.0" ry="7.0" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="110" cy="36" r="3" fill="#334155" stroke="none" stroke-width="0" /><circle cx="130" cy="36" r="3" fill="#334155" stroke="none" stroke-width="0" /><path d="M112 52 Q120 57 128 52" fill="none" stroke="#9a6b52" stroke-width="1.6"/><text x="4" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">D</text><text x="236" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">I</text></g><text x="195.0" y="753.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="280"><tspan x="195.0" dy="0">Dolor en el punto de McBurney.</tspan></text><rect x="368.0" y="285.0" width="592.0" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="388.0" cy="307.0" r="12" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="311.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">1</tspan></text><text x="408.0" y="311.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Blumberg</tspan></text><text x="408.0" y="332.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Dolor al descomprimir el abdomen.</tspan></text><rect x="368.0" y="359.0" width="592.0" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="388.0" cy="381.0" r="12" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="385.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">2</tspan></text><text x="408.0" y="385.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Signo de Horn</tspan></text><text x="408.0" y="406.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Dolor al traccionar el testículo derecho.</tspan></text><rect x="368.0" y="433.0" width="592.0" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="388.0" cy="455.0" r="12" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="459.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">3</tspan></text><text x="408.0" y="459.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Rovsing</tspan></text><text x="408.0" y="480.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Dolor en fosa ilíaca derecha al palpar la izquierda.</tspan></text><rect x="368.0" y="507.0" width="592.0" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="388.0" cy="529.0" r="12" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="533.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">4</tspan></text><text x="408.0" y="533.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Psoas y obturador</tspan></text><text x="408.0" y="554.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Dolor al extender la cadera o rotarla.</tspan></text><rect x="368.0" y="581.0" width="592.0" height="64.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><circle cx="388.0" cy="603.0" r="12" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="607.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">5</tspan></text><text x="408.0" y="607.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Apendicitis aguda</tspan></text><text x="408.0" y="628.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Sin leucocitosis no se descarta.</tspan></text><rect x="813.8" y="570.0" width="152.4" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="585.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ FOSA ILÍACA DERECHA</tspan></text><text x="40.0" y="809.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="819.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="841.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="822.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="841.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Apendicitis aguda</tspan></text><text x="435.0" y="841.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Litiasis renal</tspan></text><text x="585.0" y="841.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Infección urinaria</tspan></text><text x="735.0" y="841.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Torsión testicular</tspan></text><text x="885.0" y="841.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Orquiepididimitis</tspan></text><rect x="40.0" y="856.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="856.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="885.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="877.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: Blumberg y Horn en</tspan><tspan x="285.0" dy="16">fosa ilíaca derecha</tspan></text><text x="435.0" y="877.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: cólico lumbar con</tspan><tspan x="435.0" dy="16">hematuria</tspan></text><text x="585.0" y="877.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sin síntomas</tspan><tspan x="585.0" dy="16">urinarios</tspan></text><text x="735.0" y="877.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: dolor y testículo</tspan><tspan x="735.0" dy="16">elevados</tspan></text><text x="885.0" y="885.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: testículo normal</tspan></text><rect x="40.0" y="819.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="930.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="958.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="980.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Signo de Horn: dolor al traccionar suavemente el cordón o testículo derecho. Rovsing, psoas y obturador completan los signos.</tspan><tspan x="58.0" dy="18">• Los testículos son normales: en la torsión el dolor es escrotal e intenso, con testículo elevado.</tspan><tspan x="58.0" dy="18">• Alvarado ≥ 7 apoya; eco en niños y TC en adultos. Tratamiento: apendicectomía laparoscópica (antibióticos en casos no complicados, ensayo CODA</tspan><tspan x="58.0" dy="18">   2020).</tspan></text><text x="58.0" y="1056.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: WSES, apendicitis aguda (2020); Sabiston Tratado de Cirugía 21.ª ed.</tspan></text></svg>