<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1144" viewBox="0 0 1000 1144" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Para confirmar la diabetes se usa la HbA1c de 6,5 % o más; la mayor de 7 % ya la supera"><title>Para confirmar la diabetes se usa la HbA1c de 6,5 % o más; la mayor de 7 % ya la supera</title><rect x="0.75" y="0.75" width="998.5" height="1142.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Diabetes · criterios diagnósticos ADA 2026</tspan></text><rect x="452.0" y="32.0" width="140.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="522.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="124"><tspan x="522.3" dy="0">ENDOCRINOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Criterios diagnósticos de diabetes</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cuatro criterios de la ADA: HbA1c, glucemia en ayunas, glucemia a las 2 h de la carga y</tspan><tspan x="58.0" dy="17">glucemia aleatoria.</tspan><tspan x="58.0" dy="17">Sin síntomas se requieren dos resultados anormales.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué prueba se utiliza para confirmar el diagnóstico de</tspan><tspan x="640.0" dy="16">diabetes mellitus tipo 2?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LOS UMBRALES DE LA ADA, DE NORMAL A DIABETES</tspan></text><rect x="40.0" y="269.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="295.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Hemoglobina glicosilada (%)</tspan></text><text x="60.0" y="314.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Normal &lt; 5,7 · prediabetes 5,7-6,4 · diabetes ≥ 6,5.</tspan></text><rect x="70.0" y="378.0" width="243.7" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="191.8" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="234"><tspan x="191.8" dy="0">Normal</tspan></text><rect x="313.7" y="378.0" width="114.7" height="40.0" rx="6" fill="#fef9c3" stroke="#ffffff" stroke-width="2"/><text x="371.0" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#a16207" text-anchor="middle" data-max="105"><tspan x="371.0" dy="0">Prediabetes</tspan></text><rect x="428.3" y="378.0" width="501.7" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="679.2" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="492"><tspan x="679.2" dy="0">Diabetes</tspan></text><line x1="213.3" y1="418.0" x2="213.3" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="213.3" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="213.3" dy="0">5</tspan></text><line x1="313.7" y1="418.0" x2="313.7" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="313.7" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="313.7" dy="0">5,7</tspan></text><line x1="428.3" y1="418.0" x2="428.3" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="428.3" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="428.3" dy="0">6,5</tspan></text><line x1="500.0" y1="418.0" x2="500.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="500.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="500.0" dy="0">7</tspan></text><line x1="643.3" y1="418.0" x2="643.3" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="643.3" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="643.3" dy="0">8</tspan></text><line x1="930.0" y1="418.0" x2="930.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">10</tspan></text><polygon points="491.0,364.0 509.0,364.0 500.0,376.0" fill="#ea580c"/><rect x="413.4" y="338.0" width="173.3" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="500.0" y="353.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="161"><tspan x="500.0" dy="0">◆ HbA1c 7 %: ya es diabetes</tspan></text><rect x="40.0" y="468.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="494.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Glucemia a las 2 h de la carga de 75 g (mg/dL)</tspan></text><text x="60.0" y="513.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Normal &lt; 140 · prediabetes 140-199 · diabetes ≥ 200.</tspan></text><rect x="70.0" y="577.0" width="234.5" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="187.3" y="602.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="225"><tspan x="187.3" dy="0">Normal</tspan></text><rect x="304.5" y="577.0" width="234.5" height="40.0" rx="6" fill="#fef9c3" stroke="#ffffff" stroke-width="2"/><text x="421.8" y="602.0" font-size="12" font-weight="800" font-style="normal" fill="#a16207" text-anchor="middle" data-max="225"><tspan x="421.8" dy="0">Prediabetes</tspan></text><rect x="539.1" y="577.0" width="390.9" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="734.5" y="602.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="381"><tspan x="734.5" dy="0">Diabetes</tspan></text><line x1="148.2" y1="617.0" x2="148.2" y2="625.0" stroke="#64748b" stroke-width="1.5"/><text x="148.2" y="639.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="148.2" dy="0">100</tspan></text><line x1="304.5" y1="617.0" x2="304.5" y2="625.0" stroke="#64748b" stroke-width="1.5"/><text x="304.5" y="639.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="304.5" dy="0">140</tspan></text><line x1="539.1" y1="617.0" x2="539.1" y2="625.0" stroke="#64748b" stroke-width="1.5"/><text x="539.1" y="639.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="539.1" dy="0">200</tspan></text><line x1="734.5" y1="617.0" x2="734.5" y2="625.0" stroke="#64748b" stroke-width="1.5"/><text x="734.5" y="639.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="734.5" dy="0">250</tspan></text><line x1="930.0" y1="617.0" x2="930.0" y2="625.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="639.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">300</tspan></text><polygon points="295.5,563.0 313.5,563.0 304.5,575.0" fill="#ea580c"/><rect x="229.1" y="537.0" width="150.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="304.5" y="552.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="139"><tspan x="304.5" dy="0">◆ 140: tolerancia normal</tspan></text><text x="40.0" y="685.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OTROS CRITERIOS Y CUÁNDO BASTAN</tspan></text><rect x="40.0" y="695.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="696.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="719.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Ayunas ≥ 126 mg/dL</tspan></text><text x="58.0" y="740.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Ayuno mínimo de 8 horas</tspan></text><rect x="351.3" y="695.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="696.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="719.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Aleatoria ≥ 200 mg/dL</tspan></text><text x="369.3" y="740.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Solo con síntomas clásicos</tspan></text><rect x="662.7" y="695.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="663.7" y="696.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="680.7" y="719.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Sin síntomas</tspan></text><text x="680.7" y="740.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Dos resultados anormales</tspan></text><text x="40.0" y="804.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="814.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="853.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="817.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="845.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hemoglobina</tspan><tspan x="285.0" dy="17">glicosilada &gt; 7 %</tspan></text><text x="435.0" y="836.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Glucosa &gt; 140</tspan><tspan x="435.0" dy="17">mg/dL a las 2 h de</tspan><tspan x="435.0" dy="17">la carga</tspan></text><text x="585.0" y="845.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Glucosa aleatoria &gt;</tspan><tspan x="585.0" dy="17">140 mg/dL</tspan></text><text x="735.0" y="836.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Glucosa aleatoria &gt;</tspan><tspan x="735.0" dy="17">126 mg/dL sin</tspan><tspan x="735.0" dy="17">síntomas</tspan></text><text x="885.0" y="836.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Glucosa</tspan><tspan x="885.0" dy="17">posprandial &gt; 180</tspan><tspan x="885.0" dy="17">mg/dL</tspan></text><rect x="40.0" y="885.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="885.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="914.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Prueba confirmatoria?</tspan></text><text x="285.0" y="906.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: supera el umbral de</tspan><tspan x="285.0" dy="16">6,5 %</tspan></text><text x="435.0" y="906.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: 140 es tolerancia</tspan><tspan x="435.0" dy="16">normal a las 2 h</tspan></text><text x="585.0" y="906.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: la aleatoria exige</tspan><tspan x="585.0" dy="16">200 con síntomas</tspan></text><text x="735.0" y="906.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: sin síntomas y con</tspan><tspan x="735.0" dy="16">valor menor de 200</tspan></text><text x="885.0" y="906.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: la posprandial de</tspan><tspan x="885.0" dy="16">180 no es criterio</tspan></text><rect x="40.0" y="814.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="959.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="987.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1009.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Criterios ADA (2026): HbA1c ≥ 6,5 %; glucemia en ayunas ≥ 126 mg/dL; glucemia a las 2 h de 75 g de glucosa ≥ 200 mg/dL; aleatoria ≥ 200 con síntomas</tspan><tspan x="58.0" dy="18">   clásicos.</tspan><tspan x="58.0" dy="18">• Sin síntomas, se necesitan dos resultados anormales (de la misma muestra o de muestras distintas); con síntomas clásicos basta uno.</tspan><tspan x="58.0" dy="18">• Prediabetes: HbA1c 5,7-6,4 %, ayunas 100-125 mg/dL o a las 2 h 140-199 mg/dL; 140 mg/dL a las 2 h es tolerancia normal, no diabetes.</tspan><tspan x="58.0" dy="18">• Alerta: HbA1c poco confiable si hay anemia, hemoglobinopatía o transfusión reciente; entonces se usa la glucemia.</tspan></text><text x="58.0" y="1103.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ADA, Standards of Care in Diabetes-2026, sección 2 (Diabetes Care 2026;49 Suppl 1); IDF Diabetes Atlas 11.ª ed. (2025).</tspan></text></svg>