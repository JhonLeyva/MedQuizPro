<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1231" viewBox="0 0 1000 1231" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Mujer joven con debilidad flácida recurrente y súbita: parálisis periódica hipopotasémica, el electrolito es el potasio"><title>Mujer joven con debilidad flácida recurrente y súbita: parálisis periódica hipopotasémica, el electrolito es el potasio</title><rect x="0.75" y="0.75" width="998.5" height="1229.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Nefrología · parálisis periódica</tspan></text><rect x="381.8" y="32.0" width="182.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="473.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="167"><tspan x="473.1" dy="0">NEFROLOGÍA Y UROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Parálisis periódica hipopotasémica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Canalopatía del músculo esquelético, familiar o adquirida.</tspan><tspan x="58.0" dy="17">El potasio sérico cae por desplazamiento al interior de la célula.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 27 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Paresia súbita de miembros inferiores que dificulta la</tspan><tspan x="640.0" dy="16">marcha.</tspan><tspan x="640.0" dy="16">Episodios similares desde hace 3 meses que remiten</tspan><tspan x="640.0" dy="16">tras tratamiento.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">POTASIO SÉRICO Y LO QUE SE ESPERA EN EL PACIENTE</tspan></text><rect x="70.0" y="311.0" width="34.0" height="330.0" rx="17" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="75.0" y="535.0" width="24.0" height="102.0" rx="8" fill="#10b981" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="586.0" x2="130.0" y2="586.0" stroke="#10b981" stroke-width="2"/><rect x="130.0" y="536.0" width="330.0" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="558.0" font-size="12" font-weight="800" font-style="normal" fill="#10b981" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">3,5 a 5</tspan></text><text x="240.0" y="558.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Potasio normal</tspan></text><text x="144.0" y="579.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Sin parálisis por alteración del potasio</tspan></text><rect x="75.0" y="425.0" width="24.0" height="102.0" rx="8" fill="#f59e0b" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="476.0" x2="130.0" y2="476.0" stroke="#0f766e" stroke-width="3"/><rect x="130.0" y="426.0" width="330.0" height="100.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="144.0" y="448.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">&lt; 3,5</tspan></text><text x="240.0" y="448.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Hipopotasemia</tspan></text><text x="144.0" y="469.0" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Debilidad flácida recurrente: parálisis periódica</tspan></text><rect x="354.6" y="415.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="400.0" y="430.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="400.0" dy="0">◆ ESTE CASO</tspan></text><rect x="75.0" y="315.0" width="24.0" height="102.0" rx="8" fill="#f97316" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="366.0" x2="130.0" y2="366.0" stroke="#f97316" stroke-width="2"/><rect x="130.0" y="316.0" width="330.0" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="338.0" font-size="12" font-weight="800" font-style="normal" fill="#f97316" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">&lt; 2,5</tspan></text><text x="240.0" y="338.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">Hipopotasemia grave</tspan></text><text x="144.0" y="359.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Cambios del ECG y riesgo de arritmia</tspan></text><text x="470.0" y="315.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="490"><tspan x="470.0" dy="0">QUÉ SE HACE EN EL ATAQUE</tspan></text><rect x="470.0" y="329.0" width="490.0" height="84.0" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="371.0" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="376.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">1</tspan></text><text x="528.0" y="364.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Confirmar potasio bajo y descartar causas</tspan></text><text x="528.0" y="387.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Tirotoxicosis, acidosis tubular, hiperaldosteronismo, diuréticos</tspan></text><line x1="498.0" y1="415.0" x2="498.0" y2="428.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,427.0 503.0,427.0 498.0,435.0" fill="#0f766e"/><rect x="470.0" y="437.0" width="490.0" height="84.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><circle cx="498.0" cy="479.0" r="17" fill="#ffffff" stroke="none" stroke-width="0"/><text x="498.0" y="484.0" font-size="15" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">2</tspan></text><text x="528.0" y="472.0" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Reponer potasio oral con monitoreo</tspan></text><text x="528.0" y="495.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Evitar suero glucosado y el rebote hiperpotasémico</tspan></text><rect x="857.8" y="426.0" width="64.5" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="441.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ CLAVE</tspan></text><line x1="498.0" y1="523.0" x2="498.0" y2="536.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,535.0 503.0,535.0 498.0,543.0" fill="#0f766e"/><rect x="470.0" y="545.0" width="490.0" height="84.0" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="587.0" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="592.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">2</tspan></text><text x="528.0" y="580.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Prevenir recaídas</tspan></text><text x="528.0" y="603.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Acetazolamida o diclorfenamida y dieta baja en hidratos</tspan></text><text x="40.0" y="675.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">POTASIO EN LA PARÁLISIS PERIÓDICA SEGÚN EL TIPO</tspan></text><rect x="40.0" y="687.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="706.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Tipo</tspan></text><text x="310.0" y="706.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Potasio durante el ataque</tspan></text><text x="640.0" y="706.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Dato clave</tspan></text><rect x="40.0" y="716.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="735.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Hipopotasémica (este caso)</tspan></text><text x="310.0" y="735.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Bajo</tspan></text><text x="640.0" y="735.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">La más frecuente; carbohidratos o reposo tras ejercicio</tspan><tspan x="640.0" dy="15">precipitan</tspan></text><rect x="200.6" y="727.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="246.0" y="742.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="246.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="760.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="779.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Tirotóxica</tspan></text><text x="310.0" y="779.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Bajo</tspan></text><text x="640.0" y="779.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Más frecuente en varones asiáticos; buscar</tspan><tspan x="640.0" dy="15">hipertiroidismo</tspan></text><rect x="40.0" y="804.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="823.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Hiperpotasémica</tspan></text><text x="310.0" y="823.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Alto o normal</tspan></text><text x="640.0" y="823.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Ataques breves; relacionada con potasio</tspan></text><text x="40.0" y="873.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="883.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="905.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="886.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="905.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Potasio</tspan></text><text x="435.0" y="905.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Magnesio</tspan></text><text x="585.0" y="905.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Sodio</tspan></text><text x="735.0" y="905.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Cloro</tspan></text><text x="885.0" y="905.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Fósforo</tspan></text><rect x="40.0" y="920.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="920.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="957.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Electrolito asociado?</tspan></text><text x="285.0" y="941.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: baja el potasio</tspan><tspan x="285.0" dy="16">sérico durante el</tspan><tspan x="285.0" dy="16">ataque</tspan></text><text x="435.0" y="949.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no produce</tspan><tspan x="435.0" dy="16">parálisis recurrente</tspan></text><text x="585.0" y="949.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no produce este</tspan><tspan x="585.0" dy="16">cuadro</tspan></text><text x="735.0" y="949.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no produce este</tspan><tspan x="735.0" dy="16">cuadro</tspan></text><text x="885.0" y="949.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no produce este</tspan><tspan x="885.0" dy="16">cuadro</tspan></text><rect x="40.0" y="883.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1010.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1038.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1060.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Debilidad flácida proximal, súbita y recurrente, con conciencia y sensibilidad normales: sospechar parálisis periódica; el potasio sérico baja durante el</tspan><tspan x="58.0" dy="18">   ataque.</tspan><tspan x="58.0" dy="18">• Se precipita con comidas ricas en carbohidratos, reposo tras ejercicio, estrés o insulina. Descartar tirotoxicosis, acidosis tubular renal,</tspan><tspan x="58.0" dy="18">   hiperaldosteronismo, diuréticos y laxantes.</tspan><tspan x="58.0" dy="18">• Tratamiento: potasio oral con cuidado (riesgo de rebote hiperpotasémico) y evitar suero glucosado; prevención con acetazolamida o diclorfenamida y</tspan><tspan x="58.0" dy="18">   dieta baja en hidratos.</tspan><tspan x="58.0" dy="18">• Alerta: la hipopotasemia grave produce onda U, aplanamiento de T e infradesnivel de ST; monitorizar el ritmo durante la reposición.</tspan></text><text x="58.0" y="1190.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Statland JM et al., Review of the diagnosis and treatment of periodic paralysis, Muscle Nerve 2018;57:522-530; Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>