<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1229" viewBox="0 0 1000 1229" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Marfan con dolor torácico desgarrante, PA distinta entre brazos y mediastino ensanchado: disección aórtica, betabloqueador"><title>Marfan con dolor torácico desgarrante, PA distinta entre brazos y mediastino ensanchado: disección aórtica, betabloqueador</title><rect x="0.75" y="0.75" width="998.5" height="1228.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Enfermedades de la aorta · disección aórtica</tspan></text><rect x="463.2" y="32.0" width="132.2" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="529.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="116"><tspan x="529.3" dy="0">CARDIOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Disección aórtica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La sangre entra a la pared de la aorta y la separa; dolor desgarrante que migra.</tspan><tspan x="58.0" dy="17">Factores: hipertensión, Marfan, válvula bicúspide.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 32 años con Marfan</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dolor torácico súbito y desgarrante; PA muy distinta en</tspan><tspan x="640.0" dy="16">ambos brazos; FC 120.</tspan><tspan x="640.0" dy="16">Rx: mediastino ensanchado.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="395.0" x2="733.5" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="395.0" x2="266.5" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,423.0 271.5,423.0 266.5,431.0" fill="#94a3b8"/><line x1="733.5" y1="395.0" x2="733.5" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,423.0 738.5,423.0 733.5,431.0" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#0f766e"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="395.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="395.0" x2="266.5" y2="424.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,423.0 271.5,423.0 266.5,431.0" fill="#0f766e"/><rect x="170.9" y="404.0" width="191.2" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Sospecha de disección (este caso)</tspan></text><rect x="674.5" y="404.0" width="118.0" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Luego, según el tipo</tspan></text><polygon points="240.0,336.0 266.0,307.0 734.0,307.0 760.0,336.0 734.0,365.0 266.0,365.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="336.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="341.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="340.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Dolor desgarrante + diferencia de PA entre brazos</tspan></text><rect x="40.0" y="431.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">BETABLOQUEADOR EV</tspan></text><text x="266.5" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">FC &lt; 60, PAS 100-120</tspan><tspan x="266.5" dy="17">AngioTC urgente</tspan></text><rect x="507.0" y="431.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="467.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">A: cirugía · B: médico</tspan></text><text x="733.5" y="490.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Endoprótesis si se complica</tspan></text><text x="40.0" y="561.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="573.5" width="920.0" height="346.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="587.5" width="242.2" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="177.1" y="607.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="177.1" dy="0">CLASIFICACIÓN DE STANFORD</tspan></text><text x="314.2" y="607.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="628"><tspan x="314.2" dy="0">Depende de si la disección toca la aorta ascendente.</tspan></text><rect x="56.0" y="647.5" width="438.0" height="121.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="648.1" width="436.8" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="275.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="422"><tspan x="275.0" dy="0">TIPO A</tspan></text><text x="275.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="414"><tspan x="275.0" dy="0">Aorta ascendente</tspan></text><circle cx="72.0" cy="720.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="724.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="400"><tspan x="82.0" dy="0">DeBakey I y II</tspan></text><circle cx="72.0" cy="743.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="747.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="400"><tspan x="82.0" dy="0">Cirugía urgente</tspan></text><rect x="506.0" y="647.5" width="438.0" height="121.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="506.6" y="648.1" width="436.8" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="725.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="422"><tspan x="725.0" dy="0">TIPO B</tspan></text><text x="725.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="414"><tspan x="725.0" dy="0">Solo descendente</tspan></text><circle cx="522.0" cy="720.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="532.0" y="724.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="400"><tspan x="532.0" dy="0">DeBakey III</tspan></text><circle cx="522.0" cy="743.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="532.0" y="747.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="400"><tspan x="532.0" dy="0">Médico; endoprótesis si se complica</tspan></text><text x="56.0" y="798.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">PARA UBICAR ESTE CASO</tspan></text><rect x="56.0" y="807.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="822.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="822.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Diferencia de PA entre brazos: compromete ramas del arco, sugiere tipo A</tspan></text><rect x="56.0" y="829.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="844.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="844.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Solo la angioTC define el tipo</tspan></text><rect x="56.0" y="866.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="889.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Betabloqueador EV y angioTC; si es tipo A, cirugía urgente.</tspan></text><text x="40.0" y="959.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="969.5" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="992.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="992.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Anticoagulantes</tspan></text><text x="435.0" y="992.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Digitálicos</tspan></text><rect x="513.0" y="972.5" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="992.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Betabloqueadores</tspan></text><text x="735.0" y="992.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Antiagregantes</tspan></text><text x="885.0" y="992.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hidralazina</tspan></text><rect x="40.0" y="1006.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="1006.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1035.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Medicación?</tspan></text><text x="285.0" y="1035.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: agrava el sangrado</tspan></text><text x="435.0" y="1035.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: sin indicación</tspan></text><text x="585.0" y="1027.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: baja FC y presión</tspan><tspan x="585.0" dy="16">sobre la pared</tspan></text><text x="735.0" y="1035.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: agrava el sangrado</tspan></text><text x="885.0" y="1027.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No sola: taquicardia</tspan><tspan x="885.0" dy="16">refleja</tspan></text><rect x="40.0" y="969.5" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1080.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1108.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1130.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Primero betabloqueador EV (esmolol o labetalol): FC &lt; 60 y PA sistólica 100-120; opioides para el dolor.</tspan><tspan x="58.0" dy="18">• AngioTC para definir el tipo: A (ascendente) va a cirugía urgente; B se trata médicamente o con endoprótesis.</tspan><tspan x="58.0" dy="18">• Nunca anticoagular ni antiagregar; un vasodilatador sin betabloqueador aumenta la taquicardia.</tspan></text><text x="58.0" y="1188.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ESC, enfermedades arteriales periféricas y aórticas (2024); ACC/AHA, enfermedad aórtica (2022).</tspan></text></svg>