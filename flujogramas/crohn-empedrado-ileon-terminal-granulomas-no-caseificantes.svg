<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1194" viewBox="0 0 1000 1194" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Enfermedad de Crohn: salteada, transmural y con granulomas"><title>Enfermedad de Crohn: salteada, transmural y con granulomas</title><rect x="0.75" y="0.75" width="998.5" height="1192.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Enfermedad inflamatoria intestinal · Crohn vs colitis ulcerativa</tspan></text><rect x="567.8" y="32.0" width="180.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="658.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="164"><tspan x="658.0" dy="0">GASTROENTEROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Enfermedad inflamatoria intestinal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Crohn: cualquier tramo de boca a ano, salteado y transmural.</tspan><tspan x="58.0" dy="17">Colitis ulcerativa: solo colon, continua desde el recto, solo mucosa.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 40 años con diarrea crónica de 2 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Colonoscopía: empedrado, úlceras lineales, íleon</tspan><tspan x="640.0" dy="16">terminal y válvula afectados.</tspan><tspan x="640.0" dy="16">Zonas sanas entre lesiones; biopsia: transmural con</tspan><tspan x="640.0" dy="16">granulomas no caseificantes.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DÓNDE Y CÓMO AFECTA CADA UNA</tspan></text><rect x="40.0" y="311.0" width="438.0" height="448.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="52.0" y="321.0" width="153.5" height="20.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="335.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">ENFERMEDAD DE CROHN</tspan></text><rect x="362.6" y="300.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="408.0" y="315.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">◆ ESTE CASO</tspan></text><g transform="translate(94.0,349.0) scale(1.48)"><path d="M40 196 C60 200 70 194 84 190" fill="none" stroke="#dc2626" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="36" cy="190" rx="13" ry="12" fill="#dc2626" stroke="#9a3412" stroke-width="1.4" /><path d="M34 176 L30 70" fill="none" stroke="#fed7aa" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/><path d="M40 54 L180 54" fill="none" stroke="#dc2626" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/><path d="M190 66 L190 160" fill="none" stroke="#fed7aa" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/><path d="M190 160 C190 190 160 196 140 192" fill="none" stroke="#fed7aa" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/><path d="M136 196 L130 222" fill="none" stroke="#fed7aa" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 70 Q30 54 44 54 M180 54 Q190 54 190 66" fill="none" stroke="#fed7aa" stroke-width="16" stroke-linejoin="round" /><text x="110" y="100" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Lesiones salteadas,</text><text x="110" y="100" font-size="10.5" font-weight="800" fill="#7f1d1d" text-anchor="middle" data-max="0">Lesiones salteadas,</text><text x="110" y="114" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">íleon terminal y colon</text><text x="110" y="114" font-size="10.5" font-weight="800" fill="#7f1d1d" text-anchor="middle" data-max="0">íleon terminal y colon</text><rect x="72" y="130" width="76" height="46" rx="6" fill="#fecaca" stroke="#b91c1c"/><rect x="76" y="134" width="12" height="11" rx="4" fill="#fca5a5" stroke="#b91c1c" stroke-width="0.8"/><rect x="90" y="134" width="12" height="11" rx="4" fill="#fca5a5" stroke="#b91c1c" stroke-width="0.8"/><rect x="104" y="134" width="12" height="11" rx="4" fill="#fca5a5" stroke="#b91c1c" stroke-width="0.8"/><rect x="118" y="134" width="12" height="11" rx="4" fill="#fca5a5" stroke="#b91c1c" stroke-width="0.8"/><rect x="132" y="134" width="12" height="11" rx="4" fill="#fca5a5" stroke="#b91c1c" stroke-width="0.8"/><rect x="76" y="148" width="12" height="11" rx="4" fill="#fca5a5" stroke="#b91c1c" stroke-width="0.8"/><rect x="90" y="148" width="12" height="11" rx="4" fill="#fca5a5" stroke="#b91c1c" stroke-width="0.8"/><rect x="104" y="148" width="12" height="11" rx="4" fill="#fca5a5" stroke="#b91c1c" stroke-width="0.8"/><rect x="118" y="148" width="12" height="11" rx="4" fill="#fca5a5" stroke="#b91c1c" stroke-width="0.8"/><rect x="132" y="148" width="12" height="11" rx="4" fill="#fca5a5" stroke="#b91c1c" stroke-width="0.8"/><rect x="76" y="162" width="12" height="11" rx="4" fill="#fca5a5" stroke="#b91c1c" stroke-width="0.8"/><rect x="90" y="162" width="12" height="11" rx="4" fill="#fca5a5" stroke="#b91c1c" stroke-width="0.8"/><rect x="104" y="162" width="12" height="11" rx="4" fill="#fca5a5" stroke="#b91c1c" stroke-width="0.8"/><rect x="118" y="162" width="12" height="11" rx="4" fill="#fca5a5" stroke="#b91c1c" stroke-width="0.8"/><rect x="132" y="162" width="12" height="11" rx="4" fill="#fca5a5" stroke="#b91c1c" stroke-width="0.8"/><text x="110" y="188" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">«empedrado»</text><text x="110" y="188" font-size="10" font-weight="800" fill="#7f1d1d" text-anchor="middle" data-max="0">«empedrado»</text></g><text x="54.0" y="707.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="54.0" dy="0">Rojo: íleon terminal, ciego y un tramo del transverso, con colon sano entre</tspan><tspan x="54.0" dy="16">ellos (salteado).</tspan></text><rect x="522.0" y="311.0" width="438.0" height="448.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="534.0" y="321.0" width="130.5" height="20.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1"/><text x="543.0" y="335.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="543.0" dy="0">COLITIS ULCERATIVA</tspan></text><g transform="translate(576.0,349.0) scale(1.48)"><path d="M40 196 C60 200 70 194 84 190" fill="none" stroke="#fed7aa" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="36" cy="190" rx="13" ry="12" fill="#fed7aa" stroke="#9a3412" stroke-width="1.4" /><path d="M34 176 L30 70" fill="none" stroke="#fed7aa" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/><path d="M40 54 L180 54" fill="none" stroke="#fed7aa" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/><path d="M190 66 L190 160" fill="none" stroke="#dc2626" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/><path d="M190 160 C190 190 160 196 140 192" fill="none" stroke="#dc2626" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/><path d="M136 196 L130 222" fill="none" stroke="#dc2626" stroke-width="16" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 70 Q30 54 44 54 M180 54 Q190 54 190 66" fill="none" stroke="#fed7aa" stroke-width="16" stroke-linejoin="round" /><text x="110" y="110" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Continua desde el recto,</text><text x="110" y="110" font-size="10.5" font-weight="800" fill="#7f1d1d" text-anchor="middle" data-max="0">Continua desde el recto,</text><text x="110" y="124" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">solo mucosa, sin íleon</text><text x="110" y="124" font-size="10.5" font-weight="800" fill="#7f1d1d" text-anchor="middle" data-max="0">solo mucosa, sin íleon</text></g><text x="536.0" y="707.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="536.0" dy="0">Rojo continuo desde el recto hacia arriba; el íleon está sano.</tspan></text><circle cx="500.0" cy="519.0" r="17" fill="#ea580c" stroke="none" stroke-width="0"/><polygon points="494.0,511.0 494.0,527.0 508.0,519.0" fill="#ffffff"/><text x="40.0" y="789.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DATOS DEL CASO</tspan></text><rect x="40.0" y="799.0" width="297.3" height="85.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="800.0" width="6.0" height="83.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="823.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Endoscopía</tspan></text><text x="58.0" y="844.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Empedrado, úlceras lineales, íleon y válvula</tspan><tspan x="58.0" dy="16">ileocecal afectados.</tspan></text><rect x="237.5" y="788.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="282.9" y="803.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="282.9" dy="0">◆ ESTE CASO</tspan></text><rect x="351.3" y="799.0" width="297.3" height="85.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="352.3" y="800.0" width="6.0" height="83.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="369.3" y="823.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Patrón</tspan></text><text x="369.3" y="844.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Segmentario: mucosa sana entre lesiones.</tspan></text><rect x="548.8" y="788.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="594.3" y="803.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="594.3" dy="0">◆ ESTE CASO</tspan></text><rect x="662.7" y="799.0" width="297.3" height="85.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="663.7" y="800.0" width="6.0" height="83.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="680.7" y="823.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Biopsia</tspan></text><text x="680.7" y="844.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Inflamación transmural con granulomas no</tspan><tspan x="680.7" dy="16">caseificantes.</tspan></text><rect x="860.2" y="788.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="905.6" y="803.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="905.6" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="924.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="934.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="956.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="937.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="303.8" y="956.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Crohn</tspan></text><text x="491.2" y="956.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Intestino irritable</tspan></text><text x="678.8" y="956.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Colitis ulcerativa</tspan></text><text x="866.2" y="956.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">C. difficile</tspan></text><rect x="40.0" y="971.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="971.0" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1000.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Encaja?</tspan></text><text x="303.8" y="1000.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Sí</tspan></text><text x="491.2" y="1000.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No: no hay lesiones</tspan></text><text x="678.8" y="992.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No: continua, sin íleon ni</tspan><tspan x="678.8" dy="16">granulomas</tspan></text><text x="866.2" y="992.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No: seudomembranas,</tspan><tspan x="866.2" dy="16">antibiótico previo</tspan></text><rect x="40.0" y="934.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1045.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1073.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1095.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Íleon terminal + lesiones salteadas + empedrado + transmural + granulomas no caseificantes = Crohn.</tspan><tspan x="58.0" dy="18">• Complicaciones propias: fístulas, estenosis y abscesos (por ser transmural).</tspan><tspan x="58.0" dy="18">• La colitis ulcerativa no afecta el íleon (salvo ileítis por reflujo) ni da granulomas.</tspan></text><text x="58.0" y="1153.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ECCO, guía de enfermedad de Crohn (2024); Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>