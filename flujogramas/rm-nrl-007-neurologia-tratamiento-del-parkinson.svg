<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1278" viewBox="0 0 1000 1278" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La levodopa con un inhibidor de la dopa descarboxilasa es el tratamiento más eficaz del Parkinson"><title>La levodopa con un inhibidor de la dopa descarboxilasa es el tratamiento más eficaz del Parkinson</title><rect x="0.75" y="0.75" width="998.5" height="1276.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neurología · tratamiento del Parkinson</tspan></text><rect x="428.3" y="32.0" width="113.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="485.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="98"><tspan x="485.2" dy="0">NEUROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tratamiento del Parkinson</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La levodopa repone la dopamina que falta.</tspan><tspan x="58.0" dy="17">Se combina con carbidopa o benserazida para que actúe en el cerebro.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es el tratamiento más eficaz de la enfermedad</tspan><tspan x="640.0" dy="16">de Parkinson?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EFICACIA DE LOS FÁRMACOS ANTIPARKINSONIANOS, DEL MÁS AL MENOS EFICAZ</tspan></text><polygon points="200.0,269.0 300.0,269.0 340.0,340.0 160.0,340.0" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="309.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="88"><tspan x="250.0" dy="0">1</tspan></text><rect x="486.0" y="269.0" width="474.0" height="71.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="501.0" y="301.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Levodopa con carbidopa o benserazida</tspan></text><text x="501.0" y="318.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">El más eficaz sobre bradicinesia y rigidez</tspan></text><rect x="858.2" y="258.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="903.6" y="273.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="903.6" dy="0">◆ ESTE CASO</tspan></text><polygon points="160.0,346.0 340.0,346.0 380.0,417.0 120.0,417.0" fill="#99f6e4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="386.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="168"><tspan x="250.0" dy="0">2</tspan></text><rect x="486.0" y="346.0" width="474.0" height="71.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="378.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Agonistas dopaminérgicos</tspan></text><text x="501.0" y="395.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Pramipexol, ropinirol, rotigotina; retrasan las complicaciones en jóvenes</tspan></text><polygon points="120.0,423.0 380.0,423.0 420.0,494.0 80.0,494.0" fill="#5eead4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="463.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="248"><tspan x="250.0" dy="0">3</tspan></text><rect x="486.0" y="423.0" width="474.0" height="71.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="447.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Inhibidores de la MAO-B y de la COMT</tspan></text><text x="501.0" y="464.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Selegilina, rasagilina, entacapona y opicapona; menos potentes o prolongan la</tspan><tspan x="501.0" dy="16">levodopa</tspan></text><polygon points="80.0,500.0 420.0,500.0 460.0,571.0 40.0,571.0" fill="#2dd4bf" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="540.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="328"><tspan x="250.0" dy="0">4</tspan></text><rect x="486.0" y="500.0" width="474.0" height="71.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="532.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Amantadina y ergóticos</tspan></text><text x="501.0" y="549.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Amantadina para discinesias; bromocriptina y cabergolina en desuso</tspan></text><text x="250.0" y="589.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="420"><tspan x="250.0" dy="0">▲ más eficaz · ▼ menos eficaz</tspan></text><rect x="40.0" y="611.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="637.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Parkinson = levodopa</tspan></text><text x="60.0" y="656.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Es la más eficaz, aunque con los años produce fluctuaciones y discinesias.</tspan></text><text x="40.0" y="717.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">FÁRMACOS ANTIPARKINSONIANOS</tspan></text><rect x="40.0" y="729.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="748.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Fármaco</tspan></text><text x="260.0" y="748.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Grupo</tspan></text><text x="615.0" y="748.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Comentario</tspan></text><rect x="40.0" y="758.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="777.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Levodopa</tspan></text><text x="260.0" y="777.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Precursor de dopamina</tspan></text><text x="615.0" y="777.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">El más eficaz; con carbidopa; produce on-off y discinesias</tspan></text><rect x="150.6" y="761.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="196.0" y="776.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="196.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="787.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="806.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Pramipexol, ropinirol, rotigotina</tspan></text><text x="260.0" y="806.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Agonistas dopaminérgicos</tspan></text><text x="615.0" y="806.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Retrasan complicaciones motoras en jóvenes</tspan></text><rect x="40.0" y="816.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="835.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Bromocriptina y cabergolina</tspan></text><text x="260.0" y="835.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Agonistas ergóticos</tspan></text><text x="615.0" y="835.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">En desuso: fibrosis valvular</tspan></text><rect x="40.0" y="845.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="864.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Selegilina y rasagilina</tspan></text><text x="260.0" y="864.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Inhibidores de la MAO-B</tspan></text><text x="615.0" y="864.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Menos potentes</tspan></text><rect x="40.0" y="874.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="893.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Entacapona y opicapona</tspan></text><text x="260.0" y="893.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Inhibidores de la COMT</tspan></text><text x="615.0" y="893.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Prolongan el efecto de la levodopa</tspan></text><rect x="40.0" y="903.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="922.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Amantadina</tspan></text><text x="260.0" y="922.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Antiglutamatérgico</tspan></text><text x="615.0" y="922.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Ayuda en las discinesias y el temblor</tspan></text><text x="40.0" y="972.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="982.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1004.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1004.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Selegilina</tspan></text><text x="435.0" y="1004.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Bromocriptina</tspan></text><text x="585.0" y="1004.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Cabergolina</tspan></text><rect x="663.0" y="985.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="1004.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Levodopa</tspan></text><text x="885.0" y="1004.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Amantadina</tspan></text><rect x="40.0" y="1019.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="1019.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1048.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Más eficaz?</tspan></text><text x="285.0" y="1040.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: inhibe la MAO-B;</tspan><tspan x="285.0" dy="16">menos potente</tspan></text><text x="435.0" y="1040.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: ergótico en desuso</tspan><tspan x="435.0" dy="16">por fibrosis valvular</tspan></text><text x="585.0" y="1040.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: ergótico en desuso</tspan><tspan x="585.0" dy="16">por fibrosis valvular</tspan></text><text x="735.0" y="1040.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: el más eficaz sobre</tspan><tspan x="735.0" dy="16">los síntomas motores</tspan></text><text x="885.0" y="1040.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: ayuda en</tspan><tspan x="885.0" dy="16">discinesias y temblor</tspan></text><rect x="40.0" y="982.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1093.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1121.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1143.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Levodopa: precursor de la dopamina que cruza la barrera hematoencefálica; la más eficaz sobre bradicinesia y rigidez, con carbidopa para evitar</tspan><tspan x="58.0" dy="18">   náuseas e hipotensión.</tspan><tspan x="58.0" dy="18">• Complicaciones con los años: fluctuaciones de fin de dosis, fenómeno on-off y discinesias por estimulación pulsátil.</tspan><tspan x="58.0" dy="18">• Agonistas (pramipexol, ropinirol, rotigotina) retrasan las complicaciones en jóvenes; bromocriptina y cabergolina cayeron en desuso por fibrosis valvular.</tspan><tspan x="58.0" dy="18">• Alerta: sin mejoría franca a la levodopa se duda del Parkinson idiopático; en fases avanzadas, estimulación cerebral profunda o gel intestinal.</tspan></text><text x="58.0" y="1237.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Armstrong MJ, Okun MS, JAMA 2020; Goodman y Gilman, 14.ª ed. (2023); Harrison, 21.ª ed. (2022).</tspan></text></svg>