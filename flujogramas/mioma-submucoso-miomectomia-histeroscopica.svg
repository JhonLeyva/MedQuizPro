<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="606" viewBox="0 0 1000 606" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Miomatosis uterina submucosa"><title>Miomatosis uterina submucosa</title><rect x="0.75" y="0.75" width="998.5" height="604.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16" y="16" width="968" height="68" rx="10" fill="#0f766e"/><text x="36" y="57.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170" y1="40.0" x2="170" y2="60.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="46.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">GINECOLOGÍA Y OBSTETRICIA ENAM: MIOMATOSIS UTERINA</tspan><tspan x="184.0" dy="16">SUBMUCOSA</tspan></text><rect x="745.5" y="38.0" width="218.5" height="24" rx="12" fill="#134e4a"/><text x="854.8" y="54.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="202"><tspan x="854.8" dy="0">GINECOLOGÍA Y OBSTETRICIA</tspan></text><rect x="190.0" y="102.0" width="620" height="67.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="500.0" y="130.5" font-size="14.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Mujer de 38 años con hipermenorrea y Hb 8 g/dL</tspan></text><text x="500.0" y="153.0" font-size="12" font-weight="400" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Mioma submucoso de 38 mm, desea preservar la fertilidad</tspan></text><line x1="500.0" y1="169.0" x2="500.0" y2="268.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,267.0 505.0,267.0 500.0,275.0" fill="#0f766e"/><rect x="330.0" y="275.0" width="340" height="100.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="302.5" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="500.0" dy="0">MIOMECTOMÍA HISTEROSCÓPICA</tspan></text><text x="500.0" y="325.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="500.0" dy="0">De elección en miomas submucosos</tspan><tspan x="500.0" dy="17">sintomáticos (≤ 4–5 cm)</tspan><tspan x="500.0" dy="17">Conserva el útero y la fertilidad</tspan></text><line x1="310.0" y1="255.5" x2="330.0" y2="255.5" stroke="#0ea5e9" stroke-width="2"/><circle cx="330.0" cy="255.5" r="4" fill="#0ea5e9"/><rect x="40.0" y="197.0" width="270" height="117.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="198.0" width="6" height="115.0" rx="3" fill="#0ea5e9"/><text x="184.0" y="224.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="224"><tspan x="184.0" dy="0">Clasificación FIGO</tspan></text><text x="184.0" y="247.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="224"><tspan x="184.0" dy="0">Tipos 0, 1 y 2:</tspan><tspan x="184.0" dy="17">submucosos, abordables</tspan><tspan x="184.0" dy="17">por histeroscopia</tspan></text><line x1="690.0" y1="255.5" x2="670.0" y2="255.5" stroke="#8b5cf6" stroke-width="2"/><circle cx="670.0" cy="255.5" r="4" fill="#8b5cf6"/><rect x="690.0" y="197.0" width="270" height="117.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="691.0" y="198.0" width="6" height="115.0" rx="3" fill="#8b5cf6"/><text x="834.0" y="224.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="224"><tspan x="834.0" dy="0">Antes de operar</tspan></text><text x="834.0" y="247.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="224"><tspan x="834.0" dy="0">Corregir la anemia:</tspan><tspan x="834.0" dy="17">hierro EV u oral</tspan><tspan x="834.0" dy="17">± análogo de GnRH</tspan></text><line x1="310.0" y1="394.5" x2="330.0" y2="394.5" stroke="#f59e0b" stroke-width="2"/><circle cx="330.0" cy="394.5" r="4" fill="#f59e0b"/><rect x="40.0" y="336.0" width="270" height="117.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="337.0" width="6" height="115.0" rx="3" fill="#f59e0b"/><text x="184.0" y="363.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="224"><tspan x="184.0" dy="0">Otras vías</tspan></text><text x="184.0" y="386.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="224"><tspan x="184.0" dy="0">Laparoscopia: intramurales</tspan><tspan x="184.0" dy="17">o subserosos</tspan><tspan x="184.0" dy="17">Histerectomía: sin deseo</tspan><tspan x="184.0" dy="17">gestacional</tspan></text><line x1="690.0" y1="394.5" x2="670.0" y2="394.5" stroke="#10b981" stroke-width="2"/><circle cx="670.0" cy="394.5" r="4" fill="#10b981"/><rect x="690.0" y="336.0" width="270" height="117.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="691.0" y="337.0" width="6" height="115.0" rx="3" fill="#10b981"/><text x="834.0" y="363.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="224"><tspan x="834.0" dy="0">Síntomas</tspan></text><text x="834.0" y="386.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="224"><tspan x="834.0" dy="0">Sangrado uterino</tspan><tspan x="834.0" dy="17">abundante, anemia,</tspan><tspan x="834.0" dy="17">infertilidad</tspan></text><rect x="40" y="479.0" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="507.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="529.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Los miomas submucosos son los que más sangrado e infertilidad causan.</tspan><tspan x="58.0" dy="18">• La histerectomía no es de elección si la paciente desea tener hijos.</tspan></text><text x="58.0" y="569.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: FIGO 2022 · ACOG Practice Bulletin 228 · Berek &amp; Novak Ginecología 16.ª ed.</tspan></text></svg>
