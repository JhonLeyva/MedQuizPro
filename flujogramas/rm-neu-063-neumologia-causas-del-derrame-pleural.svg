<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1227" viewBox="0 0 1000 1227" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La insuficiencia ventricular izquierda es la causa más común de derrame pleural, por lo general un trasudado bilateral"><title>La insuficiencia ventricular izquierda es la causa más común de derrame pleural, por lo general un trasudado bilateral</title><rect x="0.75" y="0.75" width="998.5" height="1225.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neumología · causas del derrame pleural</tspan></text><rect x="442.0" y="32.0" width="114.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="499.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="99"><tspan x="499.5" dy="0">NEUMOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Derrame pleural</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Acumulación de líquido en el espacio pleural, que normalmente contiene unos 0,3 mL/kg.</tspan><tspan x="58.0" dy="17">Aumento de presión hidrostática, de la permeabilidad o bloqueo linfático.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de frecuencia</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es la causa más común del derrame pleural?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CAUSAS DEL DERRAME PLEURAL, DE LA MÁS A LA MENOS FRECUENTE</tspan></text><polygon points="200.0,253.0 300.0,253.0 332.0,309.0 168.0,309.0" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="286.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="88"><tspan x="250.0" dy="0">1</tspan></text><rect x="486.0" y="253.0" width="474.0" height="56.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="501.0" y="277.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Insuficiencia cardiaca izquierda</tspan></text><text x="501.0" y="294.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Trasudado, a menudo bilateral: causa más frecuente en el mundo</tspan></text><rect x="858.2" y="242.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="903.6" y="257.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="903.6" dy="0">◆ ESTE CASO</tspan></text><polygon points="168.0,315.0 332.0,315.0 364.0,371.0 136.0,371.0" fill="#99f6e4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="348.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="152"><tspan x="250.0" dy="0">2</tspan></text><rect x="486.0" y="315.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="339.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Neumonía</tspan></text><text x="501.0" y="356.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Derrame paraneumónico: exudado</tspan></text><polygon points="136.0,377.0 364.0,377.0 396.0,433.0 104.0,433.0" fill="#5eead4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="410.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="216"><tspan x="250.0" dy="0">3</tspan></text><rect x="486.0" y="377.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="401.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Cáncer de pulmón, mama y linfoma</tspan></text><text x="501.0" y="418.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Derrame neoplásico por bloqueo linfático o invasión</tspan></text><polygon points="104.0,439.0 396.0,439.0 428.0,495.0 72.0,495.0" fill="#2dd4bf" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="472.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="280"><tspan x="250.0" dy="0">4</tspan></text><rect x="486.0" y="439.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="463.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Embolia pulmonar y cirrosis</tspan></text><text x="501.0" y="480.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Embolia: exudado; cirrosis: hidrotórax trasudado</tspan></text><polygon points="72.0,501.0 428.0,501.0 460.0,557.0 40.0,557.0" fill="#14b8a6" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="534.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="344"><tspan x="250.0" dy="0">5</tspan></text><rect x="486.0" y="501.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="525.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Mesotelioma</tspan></text><text x="501.0" y="542.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Rara; exposición al asbesto</tspan></text><text x="250.0" y="575.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="420"><tspan x="250.0" dy="0">▲ más frecuente · ▼ menos frecuente</tspan></text><rect x="40.0" y="597.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="623.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Derrame pleural más común = insuficiencia cardiaca</tspan></text><text x="60.0" y="642.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El mesotelioma es raro; cirrosis, neumonía y mama son menos frecuentes.</tspan></text><text x="40.0" y="703.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DERRAME PLEURAL: CUÁNDO PUNCIONAR (BTS 2023)</tspan></text><rect x="40.0" y="715.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="734.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="384"><tspan x="50.0" dy="0">Situación</tspan></text><text x="450.0" y="734.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="504"><tspan x="450.0" dy="0">Conducta</tspan></text><rect x="40.0" y="744.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="763.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="384"><tspan x="50.0" dy="0">Bilateral con clínica de insuficiencia cardiaca</tspan></text><text x="450.0" y="763.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="504"><tspan x="450.0" dy="0">Tratar con diuréticos sin puncionar</tspan></text><rect x="340.6" y="747.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="386.0" y="762.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="386.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="773.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="792.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="384"><tspan x="50.0" dy="0">Derrame asimétrico, febril o que no mejora con diurético</tspan></text><text x="450.0" y="792.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="504"><tspan x="450.0" dy="0">Toracocentesis diagnóstica</tspan></text><rect x="40.0" y="802.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="821.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="384"><tspan x="50.0" dy="0">Derrame unilateral de etiología incierta</tspan></text><text x="450.0" y="821.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="504"><tspan x="450.0" dy="0">Toracocentesis con pH, glucosa, proteínas, LDH, recuento celular y citología</tspan></text><text x="40.0" y="871.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="881.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="920.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="920.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Mesotelioma</tspan></text><rect x="363.0" y="884.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="903.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Insuficiencia</tspan><tspan x="435.0" dy="17">ventricular</tspan><tspan x="435.0" dy="17">izquierda</tspan></text><text x="585.0" y="920.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Cirrosis hepática</tspan></text><text x="735.0" y="912.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Neumonía</tspan><tspan x="735.0" dy="17">bacteriana</tspan></text><text x="885.0" y="912.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Carcinoma de</tspan><tspan x="885.0" dy="17">mama</tspan></text><rect x="40.0" y="952.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="952.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="989.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Causa más común?</tspan></text><text x="285.0" y="981.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: causa rara, ligada</tspan><tspan x="285.0" dy="16">al asbesto</tspan></text><text x="435.0" y="981.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: es la causa más</tspan><tspan x="435.0" dy="16">frecuente en el mundo</tspan></text><text x="585.0" y="973.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: causa frecuente,</tspan><tspan x="585.0" dy="16">pero menos que la</tspan><tspan x="585.0" dy="16">insuficiencia cardiaca</tspan></text><text x="735.0" y="973.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: menos frecuente</tspan><tspan x="735.0" dy="16">que la insuficiencia</tspan><tspan x="735.0" dy="16">cardiaca</tspan></text><text x="885.0" y="981.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: causa neoplásica,</tspan><tspan x="885.0" dy="16">menos frecuente</tspan></text><rect x="40.0" y="881.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1042.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1070.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1092.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La insuficiencia cardiaca es la causa más frecuente: trasudado bilateral, a veces mayor a la derecha. Siguen la neumonía, el cáncer, la embolia y la</tspan><tspan x="58.0" dy="18">   cirrosis.</tspan><tspan x="58.0" dy="18">• El mesotelioma es raro y se vincula con la exposición al asbesto; el cáncer de mama y el de pulmón causan derrame neoplásico.</tspan><tspan x="58.0" dy="18">• BTS 2023: no puncionar el derrame bilateral con clínica de insuficiencia cardiaca, salvo que sea asimétrico, febril o no responda a diuréticos.</tspan><tspan x="58.0" dy="18">• Alerta: el derrame unilateral de causa incierta se punciona y se estudia con pH, glucosa, proteínas, LDH, recuento celular y citología.</tspan></text><text x="58.0" y="1186.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: British Thoracic Society Guideline for pleural disease (Thorax 2023); Harrison, 21.ª ed. (2022).</tspan></text></svg>