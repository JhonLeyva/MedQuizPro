<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="792" viewBox="0 0 1000 792" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Gases tóxicos"><title>Gases tóxicos</title><rect x="0.75" y="0.75" width="998.5" height="790.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">CIENCIAS BÁSICAS ENAM: GASES TÓXICOS</tspan></text><rect x="468.6" y="32.0" width="124.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="530.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="108"><tspan x="530.8" dy="0">CIENCIAS BÁSICAS</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ácido sulfhídrico (H2S)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Descomposición de materia orgánica</tspan><tspan x="58.0" dy="17">Olor a huevo podrido que luego no se percibe</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 25 años en un pozo séptico</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Irritación de mucosas, cianosis, disnea</tspan><tspan x="640.0" dy="16">Pierde la conciencia</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EMBUDO DIAGNÓSTICO</tspan></text><text x="614.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,293.0 580.0,293.0 531.7,369.0 88.3,369.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="309.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="341.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="399"><tspan x="310.0" dy="0">Gas en un espacio cerrado</tspan></text><line x1="559.8" y1="331.0" x2="606.0" y2="331.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="302.0" width="108.4" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="668.2" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="668.2" dy="0">Ácido sulfhídrico</tspan></text><rect x="728.4" y="302.0" width="135.2" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="795.9" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="795.9" dy="0">Monóxido de carbono</tspan></text><rect x="869.5" y="302.0" width="63.2" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="901.1" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="901.1" dy="0">Cianuro</tspan></text><rect x="614.0" y="334.0" width="109.4" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="668.7" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="668.7" dy="0">Vapores nitrosos</tspan></text><polygon points="88.3,373.0 531.7,373.0 483.3,429.0 136.7,429.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="162.7" cy="401.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="162.7" y="405.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="162.7" dy="0">1</tspan></text><text x="320.0" y="405.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="283"><tspan x="320.0" dy="0">Irrita mucosas</tspan></text><line x1="511.5" y1="401.0" x2="606.0" y2="401.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="388.0" width="147.3" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="687.6" y="405.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="687.6" dy="0">✕ Monóxido de carbono</tspan></text><line x1="636.0" y1="401.5" x2="751.3" y2="401.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="767.3" y="388.0" width="75.3" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="804.9" y="405.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="804.9" dy="0">✕ Cianuro</tspan></text><line x1="789.3" y1="401.5" x2="832.6" y2="401.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="136.7,433.0 483.3,433.0 435.0,493.0 185.0,493.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="463.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="467.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">2</tspan></text><text x="320.0" y="459.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">Pozo séptico: materia</tspan><tspan x="320.0" dy="17">orgánica</tspan></text><line x1="463.2" y1="463.0" x2="606.0" y2="463.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="450.0" width="121.5" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="674.8" y="467.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="674.8" dy="0">✕ Vapores nitrosos</tspan></text><line x1="636.0" y1="463.5" x2="725.5" y2="463.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="497.0" x2="310.0" y2="516.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,515.0 315.0,515.0 310.0,523.0" fill="#0f766e"/><rect x="140.0" y="527.0" width="340.0" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="556.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">ÁCIDO SULFHÍDRICO</tspan></text><text x="310.0" y="580.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Bloquea la citocromo oxidasa</tspan><tspan x="310.0" dy="17">Oxígeno al 100 % y soporte</tspan></text><rect x="370.6" y="516.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="531.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="542.9" width="346.0" height="60.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="562.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="580.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">Rescatistas sin equipo también caen.</tspan></text><rect x="40.0" y="642.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="670.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="692.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Paraliza el olfato a concentraciones altas.</tspan><tspan x="58.0" dy="18">• Puede causar edema pulmonar.</tspan><tspan x="58.0" dy="18">• Monóxido: no irrita, piel rojo cereza.</tspan></text><text x="58.0" y="750.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Goldfrank's Toxicologic Emergencies 11.ª ed. (2019)</tspan></text></svg>