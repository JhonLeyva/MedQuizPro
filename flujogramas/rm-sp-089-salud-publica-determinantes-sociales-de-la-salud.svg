<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Las desigualdades sanitarias se deben a determinantes sociales: factores estructurales y circunstancias de vida"><title>Las desigualdades sanitarias se deben a determinantes sociales: factores estructurales y circunstancias de vida</title><rect x="0.75" y="0.75" width="998.5" height="1008.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Salud pública · determinantes sociales de la salud</tspan></text><rect x="496.0" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="560.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="560.3" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Determinantes sociales de la salud</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Comisión de la OMS (2008): circunstancias en que las personas nacen, crecen, viven,</tspan><tspan x="58.0" dy="17">trabajan y envejecen.</tspan><tspan x="58.0" dy="17">Resultan de la distribución del poder, el dinero y los recursos.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de concepto</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Causa de la mayor parte de las desigualdades</tspan><tspan x="640.0" dy="16">sanitarias entre y dentro de los países.</tspan><tspan x="640.0" dy="16">¿A qué corresponden?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">NIVELES DEL MARCO DE DETERMINANTES SOCIALES</tspan></text><rect x="40.0" y="309.0" width="300.0" height="54.0" rx="0" fill="#fbd5c4" stroke="#ffffff" stroke-width="2"/><rect x="40" y="309.0" width="300" height="54.0" fill="#b91c1c" opacity="0.22"/><text x="54.0" y="334.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Contexto socioeconómico</tspan></text><text x="54.0" y="350.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Base</tspan></text><rect x="376.0" y="311.0" width="584.0" height="50.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="388.0" y="329.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Poder, dinero y recursos</tspan></text><text x="388.0" y="345.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Políticas, gobernanza y valores sociales.</tspan></text><rect x="40.0" y="363.0" width="300.0" height="54.0" rx="0" fill="#f5b8a2" stroke="#ffffff" stroke-width="2"/><rect x="40" y="363.0" width="300" height="54.0" fill="#b91c1c" opacity="0.22"/><text x="54.0" y="388.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Determinantes estructurales</tspan></text><text x="54.0" y="404.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Causa de las desigualdades</tspan></text><text x="328.0" y="394.0" font-size="11" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="end" data-max="96"><tspan x="328.0" dy="0">◄ llega aquí</tspan></text><rect x="376.0" y="365.0" width="584.0" height="50.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="388.0" y="383.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Ingresos, educación, ocupación, género y etnia</tspan></text><text x="388.0" y="399.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Definen la posición social: es la opción correcta.</tspan></text><rect x="40.0" y="417.0" width="300.0" height="54.0" rx="0" fill="#fbe38e" stroke="#ffffff" stroke-width="2"/><text x="54.0" y="442.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Determinantes intermedios</tspan></text><text x="54.0" y="458.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Circunstancias de vida</tspan></text><rect x="376.0" y="419.0" width="584.0" height="50.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="388.0" y="437.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Vivienda, trabajo, conducta y cohesión social</tspan></text><text x="388.0" y="453.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Estilo de vida y hábitos están aquí.</tspan></text><rect x="40.0" y="471.0" width="300.0" height="54.0" rx="0" fill="#fde9a8" stroke="#ffffff" stroke-width="2"/><text x="54.0" y="496.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Sistema de salud</tspan></text><text x="54.0" y="512.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Reacción social</tspan></text><rect x="376.0" y="473.0" width="584.0" height="50.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="388.0" y="491.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Accesibilidad y proceso de atención</tspan></text><text x="388.0" y="507.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Modula las consecuencias de la enfermedad.</tspan></text><line x1="346.0" y1="315.0" x2="346.0" y2="519.0" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="4 4"/><line x1="346.0" y1="515.0" x2="346.0" y2="510.0" stroke="#b91c1c" stroke-width="2.2"/><polygon points="341.0,510.0 351.0,510.0 346.0,519.0" fill="#b91c1c"/><text x="376.0" y="303.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="584"><tspan x="376.0" dy="0">QUÉ CONTIENE CADA NIVEL</tspan></text><text x="40.0" y="303.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="300"><tspan x="40.0" dy="0">CAPAS (DE SUPERFICIAL A PROFUNDA)</tspan></text><rect x="872.3" y="354.0" width="55.4" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="900.0" y="369.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="900.0" dy="0">◆ AQUÍ</tspan></text><rect x="40.0" y="543.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="569.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Desigualdades sanitarias = determinantes estructurales y circunstancias de vida</tspan></text><text x="60.0" y="588.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Estilo de vida, cultura y acceso son niveles intermedios o parte de ellos.</tspan></text><text x="40.0" y="655.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="665.0" width="920.0" height="88.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="713.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="668.0" width="144.0" height="82.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="687.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Factores</tspan><tspan x="285.0" dy="17">estructurales y</tspan><tspan x="285.0" dy="17">circunstancias de</tspan><tspan x="285.0" dy="17">vida</tspan></text><text x="435.0" y="696.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Accesibilidad y</tspan><tspan x="435.0" dy="17">demanda</tspan><tspan x="435.0" dy="17">poblacional</tspan></text><text x="585.0" y="704.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Cultura y nivel</tspan><tspan x="585.0" dy="17">socioeconómico</tspan></text><text x="735.0" y="696.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Estilo de vida y</tspan><tspan x="735.0" dy="17">hábitos de</tspan><tspan x="735.0" dy="17">consumo</tspan></text><text x="885.0" y="696.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Proceso de</tspan><tspan x="885.0" dy="17">atención y demanda</tspan><tspan x="885.0" dy="17">poblacional</tspan></text><rect x="40.0" y="753.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="753.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="782.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿A qué corresponden</tspan><tspan x="54.0" dy="16">los determinantes?</tspan></text><text x="285.0" y="782.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: estructurales y</tspan><tspan x="285.0" dy="16">circunstancias de vida</tspan></text><text x="435.0" y="774.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: parte del sistema</tspan><tspan x="435.0" dy="16">de salud, no la causa</tspan><tspan x="435.0" dy="16">de fondo</tspan></text><text x="585.0" y="774.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: son parte de lo</tspan><tspan x="585.0" dy="16">cultural y económico,</tspan><tspan x="585.0" dy="16">no el marco completo</tspan></text><text x="735.0" y="782.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es nivel intermedio</tspan><tspan x="735.0" dy="16">y conductual</tspan></text><text x="885.0" y="782.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es parte del</tspan><tspan x="885.0" dy="16">sistema de salud</tspan></text><rect x="40.0" y="665.0" width="920.0" height="154.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="843.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="871.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="893.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Marco conceptual: contexto socioeconómico y político, determinantes estructurales (ingresos, educación, ocupación, género, etnia) e intermedios.</tspan><tspan x="58.0" dy="18">• Determinantes intermedios: circunstancias materiales, factores conductuales y biológicos, cohesión social y el propio sistema de salud.</tspan><tspan x="58.0" dy="18">• Las desigualdades son injustas y evitables; el estilo de vida y la cultura son solo parte del nivel intermedio.</tspan><tspan x="58.0" dy="18">• Alerta: la Comisión propuso cerrar la brecha en una generación actuando sobre las causas estructurales.</tspan></text><text x="58.0" y="969.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, Comisión sobre Determinantes Sociales, Subsanar las desigualdades en una generación (2008); OPS, Equidad en salud (2019); OMS, Marco conceptual (2010).</tspan></text></svg>