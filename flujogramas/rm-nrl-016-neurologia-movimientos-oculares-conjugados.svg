<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="872" viewBox="0 0 1000 872" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La mirada conjugada horizontal depende del campo ocular frontal (área 8), por delante de la corteza premotora"><title>La mirada conjugada horizontal depende del campo ocular frontal (área 8), por delante de la corteza premotora</title><rect x="0.75" y="0.75" width="998.5" height="870.8" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neurología · movimientos oculares conjugados</tspan></text><rect x="479.6" y="32.0" width="113.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="536.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="98"><tspan x="536.4" dy="0">NEUROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Campo ocular frontal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Área 8 de Brodmann, en la parte posterior de la circunvolución frontal media, por delante de</tspan><tspan x="58.0" dy="17">la corteza premotora.</tspan><tspan x="58.0" dy="17">Controla los movimientos voluntarios conjugados.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de neuroanatomía</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué estructura controla los movimientos conjugados</tspan><tspan x="640.0" dy="16">horizontales de los ojos?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">RECORRIDO DE LA ORDEN DE MIRAR HACIA UN LADO</tspan></text><rect x="42.0" y="279.0" width="226.0" height="56.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="155.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="210"><tspan x="155.0" dy="0">1. CORTEZA</tspan></text><text x="155.0" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="155.0" dy="0">Campo ocular frontal</tspan></text><rect x="272.0" y="279.0" width="226.0" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="385.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="385.0" dy="0">2. DESCENSO</tspan></text><text x="385.0" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="385.0" dy="0">Cápsula interna</tspan></text><rect x="502.0" y="279.0" width="226.0" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="615.0" dy="0">3. TRONCO</tspan></text><text x="615.0" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="615.0" dy="0">Protuberancia</tspan></text><rect x="732.0" y="279.0" width="226.0" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="845.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="845.0" dy="0">4. CLÍNICA</tspan></text><text x="845.0" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="845.0" dy="0">Si se lesiona</tspan></text><rect x="109.6" y="268.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="155.0" y="283.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="155.0" dy="0">◆ ESTE CASO</tspan></text><rect x="48.0" y="349.0" width="214.0" height="144.3" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="155.0" y="387.4" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="186"><tspan x="155.0" dy="0">ÁREA 8 DE BRODMANN</tspan></text><text x="155.0" y="411.1" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="186"><tspan x="155.0" dy="0">Circunvolución frontal media,</tspan><tspan x="155.0" dy="17">por delante de la corteza</tspan><tspan x="155.0" dy="17">premotora</tspan><tspan x="155.0" dy="17">Envía la orden voluntaria</tspan></text><rect x="278.0" y="349.0" width="214.0" height="144.3" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="385.0" y="395.9" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="385.0" dy="0">RODILLA Y CRUCE</tspan></text><text x="385.0" y="419.6" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="385.0" dy="0">Las fibras bajan por la rodilla de</tspan><tspan x="385.0" dy="17">la cápsula interna</tspan><tspan x="385.0" dy="17">Cruzan en el mesencéfalo</tspan></text><rect x="508.0" y="349.0" width="214.0" height="144.3" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="615.0" y="378.9" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="615.0" dy="0">CENTRO DE LA MIRADA</tspan></text><text x="615.0" y="402.6" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="615.0" dy="0">La formación reticular pontina</tspan><tspan x="615.0" dy="17">activa el abducens ipsilateral</tspan><tspan x="615.0" dy="17">El fascículo longitudinal medial</tspan><tspan x="615.0" dy="17">activa el recto medial</tspan><tspan x="615.0" dy="17">contralateral</tspan></text><rect x="738.0" y="349.0" width="214.0" height="144.3" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="845.0" y="377.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="845.0" dy="0">LOS OJOS MIRAN LA</tspan><tspan x="845.0" dy="19.2">LESIÓN</tspan></text><text x="845.0" y="420.7" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="845.0" dy="0">Lesión frontal: desviación hacia</tspan><tspan x="845.0" dy="17">el lado de la lesión</tspan><tspan x="845.0" dy="17">Lesión pontina: hacia el lado de</tspan><tspan x="845.0" dy="17">la hemiparesia</tspan></text><text x="40.0" y="533.3" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="543.3" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="574.3" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="565.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Área motora</tspan><tspan x="285.0" dy="17">suplementaria</tspan></text><text x="435.0" y="574.3" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Cuerpo estriado</tspan></text><rect x="513.0" y="546.3" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="574.3" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Área premotora</tspan></text><text x="735.0" y="565.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Área motora</tspan><tspan x="735.0" dy="17">primaria</tspan></text><text x="885.0" y="565.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Núcleo de</tspan><tspan x="885.0" dy="17">Edinger-Westphal</tspan></text><rect x="40.0" y="597.3" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="597.3" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="626.3" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Quién controla la</tspan><tspan x="54.0" dy="16">mirada conjugada?</tspan></text><text x="285.0" y="626.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: planifica</tspan><tspan x="285.0" dy="16">secuencias motoras</tspan></text><text x="435.0" y="618.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: participa en el</tspan><tspan x="435.0" dy="16">inicio del movimiento,</tspan><tspan x="435.0" dy="16">no dirige la mirada</tspan></text><text x="585.0" y="618.3" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: la opción más</tspan><tspan x="585.0" dy="16">cercana al campo</tspan><tspan x="585.0" dy="16">ocular frontal (área 8)</tspan></text><text x="735.0" y="618.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: controla la fuerza</tspan><tspan x="735.0" dy="16">de la musculatura del</tspan><tspan x="735.0" dy="16">cuerpo</tspan></text><text x="885.0" y="626.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es parasimpático:</tspan><tspan x="885.0" dy="16">pupila y acomodación</tspan></text><rect x="40.0" y="543.3" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="687.3" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="715.3" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="737.3" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Vía: campo ocular frontal, rodilla de la cápsula interna, cruce en el mesencéfalo y formación reticular pontina paramediana (centro de la mirada</tspan><tspan x="58.0" dy="18">   horizontal).</tspan><tspan x="58.0" dy="18">• El centro pontino activa el abducens ipsilateral y, por el fascículo longitudinal medial, el recto medial contralateral.</tspan><tspan x="58.0" dy="18">• Lesión frontal (infarto de la cerebral media): los ojos miran hacia la lesión. Lesión pontina: miran hacia el lado de la hemiparesia.</tspan><tspan x="58.0" dy="18">• Descartes: área 4 (fuerza), estriado (inicio del movimiento), Edinger-Westphal (pupila y acomodación) y área motora suplementaria (secuencias motoras).</tspan></text><text x="58.0" y="831.3" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Kandel, Principles of Neural Science, 6.ª ed. (2021); Gray's Anatomy, 42.ª ed. (2021); Harrison Principios de Medicina Interna, 21.ª ed. (2022)</tspan></text></svg>