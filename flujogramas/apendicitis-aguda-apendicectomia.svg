<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Apendicitis aguda"><title>Apendicitis aguda</title><rect x="0.75" y="0.75" width="998.5" height="638.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16" y="16" width="968" height="56" rx="10" fill="#0f766e"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170" y1="34.0" x2="170" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="680"><tspan x="184.0" dy="0">CIRUGÍA ENAM: APENDICITIS AGUDA</tspan></text><rect x="884.1" y="32.0" width="79.9" height="24" rx="12" fill="#134e4a"/><text x="924.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="64"><tspan x="924.0" dy="0">CIRUGÍA</tspan></text><rect x="190.0" y="90.0" width="620" height="86.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="500.0" y="118.5" font-size="14.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Varón de 22 años con dolor epigástrico que migró a fosa</tspan><tspan x="500.0" dy="19.0">ilíaca derecha</tspan></text><text x="500.0" y="160.0" font-size="12" font-weight="400" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Fiebre 38.1 °C, rebote en McBurney, leucocitosis 14 500 con desviación izquierda</tspan></text><line x1="500.0" y1="176.0" x2="500.0" y2="195.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,194.0 505.0,194.0 500.0,202.0" fill="#0f766e"/><rect x="40.0" y="202.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="62.0" cy="226.0" r="13" fill="#0f766e"/><text x="62.0" y="231.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><rect x="74.0" y="202.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="88.0" y="229.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="88.0" dy="0">Sospechar</tspan></text><text x="88.0" y="252.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="88.0" dy="0">Dolor migratorio, anorexia y</tspan><tspan x="88.0" dy="17">náuseas</tspan></text><line x1="335.0" y1="243.5" x2="345.0" y2="243.5" stroke="#0f766e" stroke-width="2"/><polygon points="344.0,238.5 344.0,248.5 352.0,243.5" fill="#0f766e"/><rect x="354.0" y="202.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="376.0" cy="226.0" r="13" fill="#0f766e"/><text x="376.0" y="231.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="376.0" dy="0">2</tspan></text><rect x="388.0" y="202.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="402.0" y="229.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="402.0" dy="0">Alvarado</tspan></text><text x="402.0" y="252.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="402.0" dy="0">Puntaje ≥ 7: alta probabilidad</tspan><tspan x="402.0" dy="17">de apendicitis</tspan></text><line x1="649.0" y1="243.5" x2="659.0" y2="243.5" stroke="#0f766e" stroke-width="2"/><polygon points="658.0,238.5 658.0,248.5 666.0,243.5" fill="#0f766e"/><rect x="668.0" y="202.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="690.0" cy="226.0" r="13" fill="#0f766e"/><text x="690.0" y="231.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="690.0" dy="0">3</tspan></text><rect x="702.0" y="202.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="716.0" y="229.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="716.0" dy="0">Laboratorio</tspan></text><text x="716.0" y="252.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="716.0" dy="0">Leucocitosis con desviación</tspan><tspan x="716.0" dy="17">izquierda, PCR</tspan></text><line x1="500.0" y1="285.0" x2="500.0" y2="304.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,303.0 505.0,303.0 500.0,311.0" fill="#0f766e"/><rect x="197.0" y="311.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="219.0" cy="335.0" r="13" fill="#0f766e"/><text x="219.0" y="340.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="219.0" dy="0">4</tspan></text><rect x="231.0" y="311.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="245.0" y="338.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="245.0" dy="0">Imagen si hay duda</tspan></text><text x="245.0" y="361.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="245.0" dy="0">Ecografía (niños, gestantes) o</tspan><tspan x="245.0" dy="17">TAC</tspan></text><line x1="492.0" y1="352.5" x2="502.0" y2="352.5" stroke="#0f766e" stroke-width="2"/><polygon points="501.0,347.5 501.0,357.5 509.0,352.5" fill="#0f766e"/><rect x="511.0" y="311.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="533.0" cy="335.0" r="13" fill="#0f766e"/><text x="533.0" y="340.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="533.0" dy="0">5</tspan></text><rect x="545.0" y="311.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="559.0" y="338.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="559.0" dy="0">Antibiótico</tspan></text><text x="559.0" y="361.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="559.0" dy="0">Profilaxis preoperatoria</tspan><tspan x="559.0" dy="17">(cefalosporina + metronidazol)</tspan></text><line x1="500.0" y1="394.0" x2="500.0" y2="413.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,412.0 505.0,412.0 500.0,420.0" fill="#0f766e"/><rect x="90.0" y="420.0" width="820" height="67.5" rx="10" fill="#134e4a" stroke="#134e4a" stroke-width="1.5"/><text x="500.0" y="446.0" font-size="12" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="792"><tspan x="500.0" dy="0">CONDUCTA</tspan></text><text x="500.0" y="471.5" font-size="15" font-weight="400" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="792"><tspan x="500.0" dy="0">Apendicectomía (de preferencia laparoscópica)</tspan></text><rect x="40" y="513.5" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="541.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="563.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Con clínica típica el diagnóstico es clínico: no retrasar la cirugía por estudios.</tspan><tspan x="58.0" dy="18">• La colonoscopia está contraindicada en el abdomen agudo.</tspan></text><text x="58.0" y="603.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: WSES Jerusalem Guidelines 2020 · Sabiston Tratado de Cirugía 21.ª ed.</tspan></text></svg>
