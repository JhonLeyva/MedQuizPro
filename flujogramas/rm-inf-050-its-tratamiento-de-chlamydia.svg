<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1261" viewBox="0 0 1000 1261" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Infección por Chlamydia en adolescentes: azitromicina 1 g por vía oral en dosis única"><title>Infección por Chlamydia en adolescentes: azitromicina 1 g por vía oral en dosis única</title><rect x="0.75" y="0.75" width="998.5" height="1259.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">ITS · tratamiento de Chlamydia</tspan></text><rect x="382.5" y="32.0" width="121.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="443.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="106"><tspan x="443.4" dy="0">INFECTOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Chlamydia trachomatis</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Bacteria intracelular obligada: los betalactámicos no la erradican de forma fiable.</tspan><tspan x="58.0" dy="17">Se trata con macrólido o tetraciclina.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Adolescente con ITS</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Infección por Chlamydia trachomatis.</tspan><tspan x="640.0" dy="16">¿Cuál es el tratamiento recomendado entre las</tspan><tspan x="640.0" dy="16">opciones?</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ GRUPO DE ANTIBIÓTICOS ACTÚA SOBRE CHLAMYDIA</tspan></text><line x1="421.9" y1="385.4" x2="340.0" y2="330.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="330.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="406.0" y1="437.8" x2="340.0" y2="437.8" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="437.8" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="421.9" y1="490.1" x2="340.0" y2="544.9" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="544.9" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.1" y1="467.6" x2="660.0" y2="491.3" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="491.3" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.1" y1="407.9" x2="660.0" y2="384.2" stroke="#0f766e" stroke-width="3"/><circle cx="660.0" cy="384.2" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="437.8" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="437.8" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="433.3" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">CHLAMYDIA</tspan><tspan x="500.0" dy="19">TRACHOMATIS</tspan></text><text x="500.0" y="471.3" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">Bacteria intracelular</tspan></text><rect x="40.0" y="285.0" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="286.0" width="6.0" height="89.2" rx="3" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="190.0" y="313.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">AMOXICILINA</tspan></text><text x="190.0" y="337.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Betalactámico</tspan><tspan x="190.0" dy="17">No erradica de forma fiable</tspan></text><rect x="40.0" y="392.2" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="393.2" width="6.0" height="89.2" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="421.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">CEFALEXINA</tspan></text><text x="190.0" y="444.7" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Cefalosporina</tspan><tspan x="190.0" dy="17">No erradica de forma fiable</tspan></text><rect x="40.0" y="499.3" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="500.3" width="6.0" height="89.2" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="190.0" y="528.2" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">PENICILINA CLEMIZOL</tspan></text><text x="190.0" y="551.8" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Betalactámico</tspan><tspan x="190.0" dy="17">Sin eficacia</tspan></text><rect x="660.0" y="338.6" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="810.0" y="367.4" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">AZITROMICINA 1 G</tspan></text><text x="810.0" y="391.1" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Macrólido, dosis única</tspan><tspan x="810.0" dy="17">Opción correcta; alternativa en CDC 2021</tspan></text><rect x="764.6" y="419.8" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="810.0" y="434.8" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="810.0" dy="0">◆ ESTE CASO</tspan></text><rect x="660.0" y="445.8" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="446.8" width="6.0" height="89.2" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="474.6" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">DICLOXACILINA</tspan></text><text x="810.0" y="498.2" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Penicilina antiestafilocócica</tspan><tspan x="810.0" dy="17">Sin eficacia</tspan></text><text x="40.0" y="626.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="638.5" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="663.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Sospecha de ITS</tspan></text><line x1="248.5" y1="659.0" x2="267.5" y2="659.0" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,654.0 266.5,664.0 274.5,659.0" fill="#0f766e"/><rect x="278.5" y="638.5" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="663.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">NAAT</tspan></text><line x1="487.0" y1="659.0" x2="506.0" y2="659.0" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,654.0 505.0,664.0 513.0,659.0" fill="#0f766e"/><rect x="517.0" y="638.5" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="663.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Macrólido o tetraciclina</tspan></text><line x1="725.5" y1="659.0" x2="744.5" y2="659.0" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,654.0 743.5,664.0 751.5,659.0" fill="#0f766e"/><rect x="755.5" y="638.5" width="204.5" height="41.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="663.0" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Tratar a la pareja</tspan></text><text x="40.0" y="713.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">INFECCIÓN GENITAL POR CHLAMYDIA: ESQUEMAS (CDC 2021)</tspan></text><rect x="40.0" y="725.5" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="744.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Situación</tspan></text><text x="290.0" y="744.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Esquema</tspan></text><text x="630.0" y="744.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">Comentario</tspan></text><rect x="40.0" y="754.5" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="773.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Preferido en no gestantes</tspan></text><text x="290.0" y="773.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Doxiciclina 100 mg VO c/12 h por 7 días</tspan></text><text x="630.0" y="773.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">Mayor eficacia en la infección rectal</tspan></text><rect x="40.0" y="783.5" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="802.5" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Azitromicina (opción)</tspan></text><text x="290.0" y="802.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Azitromicina 1 g VO, dosis única</tspan></text><text x="630.0" y="802.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">Mejor adherencia</tspan></text><rect x="180.6" y="787.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="226.0" y="802.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="226.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="812.5" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="831.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Embarazo</tspan></text><text x="290.0" y="831.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Azitromicina 1 g VO, dosis única</tspan></text><text x="630.0" y="831.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">La doxiciclina se evita en el embarazo</tspan></text><text x="40.0" y="857.5" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Control de curación en el embarazo; repetir la prueba a los 3 meses en todos.</tspan></text><text x="40.0" y="904.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="914.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="954.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="945.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Amoxicilina 500 mg</tspan><tspan x="285.0" dy="17">c/6 h por 7 días</tspan></text><text x="435.0" y="945.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Cefalexina 500 mg</tspan><tspan x="435.0" dy="17">c/6 h por 7 días</tspan></text><text x="585.0" y="937.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Penicilina clemizol</tspan><tspan x="585.0" dy="17">1 millón U por 3</tspan><tspan x="585.0" dy="17">días</tspan></text><rect x="663.0" y="917.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="945.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Azitromicina 1 g VO</tspan><tspan x="735.0" dy="17">dosis única</tspan></text><text x="885.0" y="945.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Dicloxacilina 500</tspan><tspan x="885.0" dy="17">mg c/6 h por 7 días</tspan></text><rect x="40.0" y="985.5" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="985.5" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1014.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tratamiento</tspan><tspan x="54.0" dy="16">recomendado?</tspan></text><text x="285.0" y="1006.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: betalactámico que</tspan><tspan x="285.0" dy="16">no erradica la bacteria</tspan><tspan x="285.0" dy="16">intracelular</tspan></text><text x="435.0" y="1006.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: betalactámico que</tspan><tspan x="435.0" dy="16">no erradica la bacteria</tspan><tspan x="435.0" dy="16">intracelular</tspan></text><text x="585.0" y="1006.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: la penicilina no es</tspan><tspan x="585.0" dy="16">eficaz contra</tspan><tspan x="585.0" dy="16">Chlamydia</tspan></text><text x="735.0" y="1014.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: macrólido de dosis</tspan><tspan x="735.0" dy="16">única</tspan></text><text x="885.0" y="1006.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: betalactámico que</tspan><tspan x="885.0" dy="16">no erradica la bacteria</tspan><tspan x="885.0" dy="16">intracelular</tspan></text><rect x="40.0" y="914.5" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1075.5" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1103.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1125.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Las opciones betalactámicas (amoxicilina, cefalexina, dicloxacilina, penicilina) no sirven; la azitromicina 1 g VO en dosis única es la que figura como</tspan><tspan x="58.0" dy="18">   correcta.</tspan><tspan x="58.0" dy="18">• CDC 2021: la doxiciclina 100 mg c/12 h por 7 días es hoy el esquema preferido; la azitromicina queda como alternativa y como elección en el embarazo.</tspan><tspan x="58.0" dy="18">• Alerta: suele ser asintomática en la mujer; se tamiza cada año a las menores de 25 años sexualmente activas y se trata a la pareja.</tspan><tspan x="58.0" dy="18">• Complicaciones: enfermedad inflamatoria pélvica, infertilidad y embarazo ectópico.</tspan></text><text x="58.0" y="1219.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, STI Treatment Guidelines (MMWR 2021;70[4]); OMS (2024); NTS 240-MINSA/DGIESP-2026; Nelson 22.ª ed. (2024).</tspan></text></svg>