<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1097" viewBox="0 0 1000 1097" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Niño con hematuria, edema y PA elevada 7 días después de una faringoamigdalitis: glomerulonefritis postestreptocócica"><title>Niño con hematuria, edema y PA elevada 7 días después de una faringoamigdalitis: glomerulonefritis postestreptocócica</title><rect x="0.75" y="0.75" width="998.5" height="1096.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Enfermedades glomerulares · síndrome nefrítico</tspan></text><rect x="485.8" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="542.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="542.2" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Glomerulonefritis postestreptocócica (GNPE)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Complejos inmunes tras una faringitis (1-3 semanas) o piodermitis (3-6 semanas).</tspan><tspan x="58.0" dy="17">Síndrome nefrítico: hematuria, edema, hipertensión, oliguria.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 7 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Faringoamigdalitis bacteriana hace 7 días.</tspan><tspan x="640.0" dy="16">Edema, cefalea, PA en el percentil 90, hematuria.</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#94a3b8"/><line x1="500.0" y1="349.0" x2="500.0" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="379.0" x2="733.5" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="379.0" x2="266.5" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,407.0 271.5,407.0 266.5,415.0" fill="#94a3b8"/><line x1="733.5" y1="379.0" x2="733.5" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,407.0 738.5,407.0 733.5,415.0" fill="#94a3b8"/><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#0f766e"/><line x1="500.0" y1="349.0" x2="500.0" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="379.0" x2="500.0" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="379.0" x2="266.5" y2="408.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,407.0 271.5,407.0 266.5,415.0" fill="#0f766e"/><rect x="174.8" y="388.0" width="183.5" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">1-3 semanas después (este caso)</tspan></text><rect x="683.4" y="388.0" width="100.2" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">1-2 días después</tspan></text><polygon points="240.0,320.0 266.0,291.0 734.0,291.0 760.0,320.0 734.0,349.0 266.0,349.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="320.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="325.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="324.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Síndrome nefrítico tras faringitis: ¿cuándo empezó?</tspan></text><rect x="40.0" y="415.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">GN POSESTREPTOCÓCICA</tspan></text><text x="266.5" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">C3 bajo, ASO alta</tspan><tspan x="266.5" dy="17">Sal, furosemida</tspan></text><rect x="507.0" y="415.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="451.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Nefropatía por IgA</tspan></text><text x="733.5" y="474.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">C3 normal</tspan></text><text x="40.0" y="545.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SÍNDROME CON NOMBRE PROPIO</tspan></text><rect x="40.0" y="557.5" width="920.0" height="213.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><line x1="62.0" y1="599.5" x2="938.0" y2="599.5" stroke="#64748b" stroke-width="2"/><line x1="62.0" y1="599.5" x2="62.0" y2="607.5" stroke="#64748b" stroke-width="2"/><line x1="938.0" y1="599.5" x2="938.0" y2="607.5" stroke="#64748b" stroke-width="2"/><rect x="377.3" y="587.5" width="245.5" height="24.0" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/><text x="500.0" y="603.5" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="231"><tspan x="500.0" dy="0">SÍNDROME NEFRÍTICO · 3 de 4 en el caso</tspan></text><rect x="56.0" y="619.5" width="213.0" height="104.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="76.0" cy="642.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="76.0" y="646.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="76.0" dy="0">1</tspan></text><text x="94.0" y="647.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="167"><tspan x="94.0" dy="0">Hematuria</tspan></text><text x="68.0" y="673.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="189"><tspan x="68.0" dy="0">Sí</tspan></text><rect x="68.0" y="689.5" width="189.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="162.5" y="704.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="177"><tspan x="162.5" dy="0">✓ EN EL CASO</tspan></text><rect x="281.0" y="619.5" width="213.0" height="104.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="301.0" cy="642.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="301.0" y="646.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="301.0" dy="0">2</tspan></text><text x="319.0" y="647.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="167"><tspan x="319.0" dy="0">Edema</tspan></text><text x="293.0" y="673.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="189"><tspan x="293.0" dy="0">Sí</tspan></text><rect x="293.0" y="689.5" width="189.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="387.5" y="704.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="177"><tspan x="387.5" dy="0">✓ EN EL CASO</tspan></text><rect x="506.0" y="619.5" width="213.0" height="104.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="526.0" cy="642.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="526.0" y="646.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="526.0" dy="0">3</tspan></text><text x="544.0" y="647.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="167"><tspan x="544.0" dy="0">Hipertensión</tspan></text><text x="518.0" y="673.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="189"><tspan x="518.0" dy="0">PA en p90, cefalea</tspan></text><rect x="518.0" y="689.5" width="189.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="612.5" y="704.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="177"><tspan x="612.5" dy="0">✓ EN EL CASO</tspan></text><rect x="731.0" y="619.5" width="213.0" height="104.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="751.0" cy="642.5" r="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="751.0" y="646.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="751.0" dy="0">4</tspan></text><text x="769.0" y="647.5" font-size="12.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="start" data-max="167"><tspan x="769.0" dy="0">Oliguria</tspan></text><text x="743.0" y="673.5" font-size="11.5" font-weight="400" font-style="normal" fill="#64748b" text-anchor="start" data-max="189"><tspan x="743.0" dy="0">No se informa</tspan></text><rect x="743.0" y="689.5" width="189.0" height="22.0" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/><text x="837.5" y="704.5" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="177"><tspan x="837.5" dy="0">— NO DESCRITO</tspan></text><text x="56.0" y="750.5" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">Hematuria + edema + hipertensión tras faringitis: síndrome nefrítico por GNPE.</tspan></text><text x="40.0" y="810.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="820.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="851.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="823.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="843.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Glomerulonefritis</tspan><tspan x="285.0" dy="17">postestreptocócica</tspan></text><text x="435.0" y="851.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Nefritis lúpica</tspan></text><text x="585.0" y="843.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Vasculitis por</tspan><tspan x="585.0" dy="17">hipersensibilidad</tspan></text><text x="735.0" y="843.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Síndrome de</tspan><tspan x="735.0" dy="17">Goodpasture</tspan></text><text x="885.0" y="843.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Síndrome nefrótico</tspan><tspan x="885.0" dy="17">idiopático</tspan></text><rect x="40.0" y="874.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="874.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="903.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="895.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: nefrítico tras</tspan><tspan x="285.0" dy="16">faringitis</tspan></text><text x="435.0" y="895.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: sin lupus ni otros</tspan><tspan x="435.0" dy="16">órganos</tspan></text><text x="585.0" y="895.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: púrpura y dolor</tspan><tspan x="585.0" dy="16">abdominal</tspan></text><text x="735.0" y="895.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: hemoptisis +</tspan><tspan x="735.0" dy="16">anti-MBG</tspan></text><text x="885.0" y="895.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: proteinuria masiva,</tspan><tspan x="885.0" dy="16">sin hematuria ni HTA</tspan></text><rect x="40.0" y="820.5" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="948.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="976.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="998.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Laboratorio: C3 bajo (se normaliza en 6-8 semanas), ASO o anti-DNasa B altos.</tspan><tspan x="58.0" dy="18">• Tratamiento: restringir sal y líquidos, furosemida para el edema y la hipertensión.</tspan><tspan x="58.0" dy="18">• C3 bajo más de 8 semanas o hematuria persistente: biopsia (pensar en otra glomerulopatía).</tspan></text><text x="58.0" y="1056.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: KDIGO, enfermedades glomerulares (2021); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>