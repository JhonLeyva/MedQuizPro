<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1263" viewBox="0 0 1000 1263" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Epistaxis traumática que no cede con vasoconstrictor tópico: taponamiento nasal anterior"><title>Epistaxis traumática que no cede con vasoconstrictor tópico: taponamiento nasal anterior</title><rect x="0.75" y="0.75" width="998.5" height="1261.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">ORL pediátrica · epistaxis traumática</tspan></text><rect x="418.5" y="32.0" width="162.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="499.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="146"><tspan x="499.7" dy="0">OFTALMOLOGÍA Y ORL RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Epistaxis infantil</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Casi siempre anterior: plexo de Kiesselbach, en el septum anterior.</tspan><tspan x="58.0" dy="17">Tras un golpe sangra más y puede haber fractura nasal o hematoma septal.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 6 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Traumatismo nasal contuso con epistaxis.</tspan><tspan x="640.0" dy="16">Los algodones con vasoconstrictor no controlaron el</tspan><tspan x="640.0" dy="16">sangrado.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ESCALONES DEL MANEJO DE LA EPISTAXIS ANTERIOR</tspan></text><rect x="40.0" y="285.0" width="920.0" height="95.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="285.0" width="108.0" height="95.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="332.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Primeros</tspan><tspan x="94.0" dy="14">auxilios</tspan></text><rect x="40.0" y="380.0" width="920.0" height="95.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="380.0" width="108.0" height="95.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="431.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Tópico</tspan></text><rect x="40.0" y="475.0" width="920.0" height="95.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="475.0" width="108.0" height="95.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="526.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Procedimiento</tspan></text><line x1="348.0" y1="332.5" x2="355.0" y2="332.5" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="332.5" x2="355.0" y2="427.5" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="427.5" x2="353.0" y2="427.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="353.0,432.5 353.0,422.5 362.0,427.5" fill="#0f766e"/><line x1="552.0" y1="427.5" x2="559.0" y2="427.5" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="427.5" x2="559.0" y2="522.5" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="522.5" x2="557.0" y2="522.5" stroke="#ea580c" stroke-width="2.2"/><polygon points="557.0,527.5 557.0,517.5 566.0,522.5" fill="#ea580c"/><line x1="756.0" y1="522.5" x2="763.0" y2="522.5" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="522.5" x2="763.0" y2="522.5" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="522.5" x2="761.0" y2="522.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="761.0,527.5 761.0,517.5 770.0,522.5" fill="#0f766e"/><rect x="158.0" y="298.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="314.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Sentado e inclinado</tspan></text><text x="168.0" y="331.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Compresión continua de las alas</tspan><tspan x="168.0" dy="14.5">nasales varios minutos</tspan></text><circle cx="158.0" cy="298.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="302.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="362.0" y="393.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="372.0" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Oximetazolina</tspan></text><text x="372.0" y="426.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Vasoconstrictor tópico: no</tspan><tspan x="372.0" dy="14.5">controló el sangrado</tspan></text><circle cx="362.0" cy="393.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="362.0" y="397.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="362.0" dy="0">2</tspan></text><rect x="566.0" y="488.0" width="190.0" height="69.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="576.0" y="504.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Taponamiento anterior</tspan></text><text x="576.0" y="521.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Material reabsorbible o esponja:</tspan><tspan x="576.0" dy="14.5">presión directa</tspan></text><circle cx="566.0" cy="488.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="566.0" y="492.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="566.0" dy="0">3</tspan></text><rect x="770.0" y="488.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="780.0" y="504.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Derivar a ORL</tspan></text><text x="780.0" y="521.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Si falla: sospechar sangrado</tspan><tspan x="780.0" dy="14.5">posterior</tspan></text><circle cx="770.0" cy="488.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="770.0" y="492.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="770.0" dy="0">4</tspan></text><rect x="40.0" y="588.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="614.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Falla del vasoconstrictor = taponamiento anterior</tspan></text><text x="60.0" y="633.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La cauterización requiere un punto único y visible; no se hace con sangrado activo.</tspan></text><text x="40.0" y="694.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE TRATAMIENTO EN LA EPISTAXIS ANTERIOR INFANTIL</tspan></text><rect x="40.0" y="706.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="725.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Medida</tspan></text><text x="310.0" y="725.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Cuándo se usa</tspan></text><text x="640.0" y="725.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">En este caso</tspan></text><rect x="40.0" y="735.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="754.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Compresión digital continua</tspan></text><text x="310.0" y="754.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Primer paso, con el niño sentado e inclinado</tspan></text><text x="640.0" y="754.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Ya aplicada sin éxito</tspan></text><rect x="40.0" y="764.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="783.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Vasoconstrictor tópico (oximetazolina)</tspan></text><text x="310.0" y="783.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Si la compresión no basta</tspan></text><text x="640.0" y="783.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Ya aplicado: no cedió</tspan></text><rect x="40.0" y="793.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="812.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Taponamiento anterior</tspan></text><text x="310.0" y="812.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Persistencia del sangrado o punto no visible</tspan></text><text x="640.0" y="812.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Elección</tspan></text><rect x="200.6" y="796.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="246.0" y="811.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="246.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="822.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="841.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Cauterización (nitrato de plata o</tspan><tspan x="50.0" dy="15">eléctrica)</tspan></text><text x="310.0" y="841.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Punto sangrante único, visible y sin sangrado activo</tspan></text><text x="640.0" y="841.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">No es posible con sangrado activo</tspan></text><text x="40.0" y="906.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="916.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="947.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="919.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="938.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Taponamiento nasal</tspan><tspan x="285.0" dy="17">anterior</tspan></text><text x="435.0" y="938.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Corticoides con</tspan><tspan x="435.0" dy="17">crema</tspan></text><text x="585.0" y="938.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Nitrato de plata al</tspan><tspan x="585.0" dy="17">75 %</tspan></text><text x="735.0" y="938.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Pegamento de</tspan><tspan x="735.0" dy="17">fibrina</tspan></text><text x="885.0" y="947.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Cauterización</tspan></text><rect x="40.0" y="970.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="970.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="999.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tratamiento de</tspan><tspan x="54.0" dy="16">elección?</tspan></text><text x="285.0" y="991.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: presión directa</tspan><tspan x="285.0" dy="16">sobre el punto</tspan><tspan x="285.0" dy="16">sangrante</tspan></text><text x="435.0" y="999.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no es terapia</tspan><tspan x="435.0" dy="16">estándar</tspan></text><text x="585.0" y="999.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: exige ver un punto</tspan><tspan x="585.0" dy="16">sangrante limpio</tspan></text><text x="735.0" y="999.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no es terapia</tspan><tspan x="735.0" dy="16">estándar</tspan></text><text x="885.0" y="999.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no se ve el punto</tspan><tspan x="885.0" dy="16">con sangrado activo</tspan></text><rect x="40.0" y="916.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1060.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1088.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1110.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Orden escalonado: sentado e inclinado hacia adelante, compresión continua de las alas nasales, oximetazolina tópica y, si persiste, taponamiento</tspan><tspan x="58.0" dy="18">   anterior.</tspan><tspan x="58.0" dy="18">• El taponamiento (reabsorbible o con esponja) ejerce presión directa; la cauterización exige un punto sangrante único y limpio, difícil con sangrado activo.</tspan><tspan x="58.0" dy="18">• Los corticoides en crema y el pegamento de fibrina no son terapias estándar.</tspan><tspan x="58.0" dy="18">• Alerta: buscar siempre hematoma septal, urgencia que si no se drena causa necrosis del cartílago y nariz en silla de montar; si falla el taponamiento,</tspan><tspan x="58.0" dy="18">   sospechar sangrado posterior y derivar a ORL.</tspan></text><text x="58.0" y="1222.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAO-HNSF, Clinical Practice Guideline: Nosebleed (Epistaxis), Otolaryngol Head Neck Surg 2020; Cummings Otolaryngology 7.ª ed. (2021).</tspan></text></svg>