<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1180" viewBox="0 0 1000 1180" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La ruptura de membranas mayor de 24 horas es factor de riesgo de fiebre puerperal por endometritis ascendente"><title>La ruptura de membranas mayor de 24 horas es factor de riesgo de fiebre puerperal por endometritis ascendente</title><rect x="0.75" y="0.75" width="998.5" height="1178.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · fiebre puerperal</tspan></text><rect x="370.2" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="450.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="450.0" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Fiebre puerperal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Temperatura de 38 °C o más en dos tomas separadas, pasadas las primeras 24 horas y</tspan><tspan x="58.0" dy="17">dentro de los 10 días del posparto.</tspan><tspan x="58.0" dy="17">La causa más frecuente es la endometritis.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de factores de riesgo</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál de estos eventos aumenta el riesgo de fiebre</tspan><tspan x="640.0" dy="16">puerperal?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO UNA RUPTURA PROLONGADA LLEGA A LA FIEBRE PUERPERAL</tspan></text><rect x="40.0" y="269.0" width="210.5" height="92.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="145.2" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Ruptura de membranas mayor</tspan><tspan x="145.2" dy="17">de 24 horas</tspan></text><text x="145.2" y="323.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Se pierde la barrera entre la vagina</tspan><tspan x="145.2" dy="16">y la cavidad uterina</tspan></text><line x1="253.5" y1="315.0" x2="266.5" y2="315.0" stroke="#0f766e" stroke-width="2"/><polygon points="265.5,310.0 265.5,320.0 273.5,315.0" fill="#0f766e"/><line x1="145.2" y1="363.0" x2="145.2" y2="377.0" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="40.0" y="379.0" width="210.5" height="64.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="145.2" y="393.0" font-size="9.5" font-weight="800" font-style="normal" fill="#ffedd5" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">✂ CORTA</tspan></text><text x="145.2" y="410.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Evitar tactos y monitoreo</tspan><tspan x="145.2" dy="16">interno innecesarios</tspan></text><rect x="93.4" y="432.0" width="103.7" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="145.2" y="447.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="145.2" dy="0">◆ ESTE FACTOR</tspan></text><rect x="276.5" y="269.0" width="210.5" height="92.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="381.8" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Ascenso de flora vaginal y</tspan><tspan x="381.8" dy="17">cervical</tspan></text><text x="381.8" y="323.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Anaerobios, estreptococos y bacilos</tspan><tspan x="381.8" dy="16">gramnegativos</tspan></text><line x1="490.0" y1="315.0" x2="503.0" y2="315.0" stroke="#0f766e" stroke-width="2"/><polygon points="502.0,310.0 502.0,320.0 510.0,315.0" fill="#0f766e"/><line x1="381.8" y1="363.0" x2="381.8" y2="377.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="276.5" y="379.0" width="210.5" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="381.8" y="393.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">✂ CORTA</tspan></text><text x="381.8" y="410.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Antibiótico profiláctico según el</tspan><tspan x="381.8" dy="16">caso</tspan></text><rect x="513.0" y="269.0" width="210.5" height="92.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="618.2" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Corioamnionitis o endometritis</tspan></text><text x="618.2" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Infección polimicrobiana del</tspan><tspan x="618.2" dy="16">endometrio</tspan></text><line x1="726.5" y1="315.0" x2="739.5" y2="315.0" stroke="#0f766e" stroke-width="2"/><polygon points="738.5,310.0 738.5,320.0 746.5,315.0" fill="#0f766e"/><line x1="618.2" y1="363.0" x2="618.2" y2="377.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="513.0" y="379.0" width="210.5" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="618.2" y="393.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">✂ CORTA</tspan></text><text x="618.2" y="410.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Clindamicina más gentamicina</tspan><tspan x="618.2" dy="16">IV</tspan></text><rect x="749.5" y="269.0" width="210.5" height="92.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="854.8" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Fiebre de 38 °C o más después</tspan><tspan x="854.8" dy="17">de 24 horas</tspan></text><text x="854.8" y="323.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Dos tomas dentro de los 10 días del</tspan><tspan x="854.8" dy="16">posparto</tspan></text><line x1="854.8" y1="363.0" x2="854.8" y2="377.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="749.5" y="379.0" width="210.5" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="854.8" y="393.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">✂ CORTA</tspan></text><text x="854.8" y="410.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Sin mejoría en 48-72 h: buscar</tspan><tspan x="854.8" dy="16">absceso pélvico</tspan></text><rect x="40.0" y="473.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="499.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Ruptura mayor de 24 horas = factor de riesgo</tspan></text><text x="60.0" y="518.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Peso normal, sangrado menor de 500 mL y buen control prenatal no dan riesgo.</tspan></text><text x="40.0" y="579.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">FACTORES DE RIESGO DE ENDOMETRITIS PUERPERAL</tspan></text><rect x="40.0" y="591.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="610.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Vía del parto</tspan></text><text x="260.0" y="610.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Factores de riesgo</tspan></text><text x="615.0" y="610.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Peso</tspan></text><rect x="40.0" y="620.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="639.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Cesárea</tspan></text><text x="260.0" y="639.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Sobre todo la de urgencia tras trabajo de parto prolongado</tspan></text><text x="615.0" y="639.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">El factor más importante</tspan></text><rect x="40.0" y="649.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="668.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Parto vaginal</tspan></text><text x="260.0" y="668.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Ruptura de membranas mayor de 18-24 h (este caso),</tspan><tspan x="260.0" dy="15">corioamnionitis, tactos múltiples</tspan></text><text x="615.0" y="668.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Facilitan la infección ascendente</tspan></text><rect x="150.6" y="660.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="196.0" y="675.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="196.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="693.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="712.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Parto vaginal</tspan></text><text x="260.0" y="712.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Monitoreo interno, parto instrumentado, alumbramiento</tspan><tspan x="260.0" dy="15">manual, colonización por estreptococo B</tspan></text><text x="615.0" y="712.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Aumentan la contaminación</tspan></text><rect x="40.0" y="737.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="756.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Protectores</tspan></text><text x="260.0" y="756.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Control prenatal adecuado</tspan></text><text x="615.0" y="756.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">No confieren riesgo</tspan></text><text x="40.0" y="806.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="816.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="855.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="838.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Aumento de peso</tspan><tspan x="285.0" dy="17">materno en</tspan><tspan x="285.0" dy="17">percentil 30</tspan></text><rect x="363.0" y="819.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="838.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Ruptura de</tspan><tspan x="435.0" dy="17">membranas mayor</tspan><tspan x="435.0" dy="17">de 24 horas</tspan></text><text x="585.0" y="847.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Ganancia de peso</tspan><tspan x="585.0" dy="17">fetal en percentil 20</tspan></text><text x="735.0" y="847.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Pérdida sanguínea</tspan><tspan x="735.0" dy="17">menor de 500 mL</tspan></text><text x="885.0" y="847.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Control prenatal</tspan><tspan x="885.0" dy="17">adecuado</tspan></text><rect x="40.0" y="887.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="887.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="916.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Factor de riesgo de</tspan><tspan x="54.0" dy="16">fiebre puerperal?</tspan></text><text x="285.0" y="916.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: aumento de peso</tspan><tspan x="285.0" dy="16">en percentil normal</tspan></text><text x="435.0" y="908.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: la rotura</tspan><tspan x="435.0" dy="16">prolongada deja pasar</tspan><tspan x="435.0" dy="16">gérmenes al útero</tspan></text><text x="585.0" y="916.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: crecimiento fetal</tspan><tspan x="585.0" dy="16">normal</tspan></text><text x="735.0" y="916.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: sangrado dentro</tspan><tspan x="735.0" dy="16">de lo normal</tspan></text><text x="885.0" y="916.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: el control prenatal</tspan><tspan x="885.0" dy="16">es protector</tspan></text><rect x="40.0" y="816.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="977.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1005.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1027.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Endometritis: infección polimicrobiana ascendente por flora vaginal y cervical (anaerobios, estreptococos, gramnegativos).</tspan><tspan x="58.0" dy="18">• Mayor riesgo: cesárea (sobre todo de urgencia tras trabajo de parto prolongado). En parto vaginal: ruptura mayor de 18-24 h, corioamnionitis, tactos</tspan><tspan x="58.0" dy="18">   múltiples, monitoreo interno, parto instrumentado y alumbramiento manual.</tspan><tspan x="58.0" dy="18">• Manejo: clindamicina más gentamicina IV hasta 24-48 h sin fiebre. Profilaxis: cefazolina antes de la incisión en toda cesárea, con azitromicina si hay</tspan><tspan x="58.0" dy="18">   trabajo de parto o ruptura.</tspan><tspan x="58.0" dy="18">• Alerta: fiebre que persiste a las 48-72 h de tratamiento obliga a buscar absceso pélvico, hematoma infectado o tromboflebitis pélvica séptica.</tspan></text><text x="58.0" y="1139.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, Practice Bulletin N.º 199, antibióticos profilácticos en el parto (2018); Tita ATN et al., N Engl J Med (2016); Williams Obstetricia, 26.ª ed. (2022).</tspan></text></svg>