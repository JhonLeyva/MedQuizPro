<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="954" viewBox="0 0 1000 954" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La vacuna dTpa se aplica en cada embarazo, preferentemente entre las semanas 27 y 36"><title>La vacuna dTpa se aplica en cada embarazo, preferentemente entre las semanas 27 y 36</title><rect x="0.75" y="0.75" width="998.5" height="952.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · vacunación en el embarazo</tspan></text><rect x="437.2" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="517.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="517.0" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Inmunización materna</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La IgG cruza la placenta y protege al lactante contra la tos ferina.</tspan><tspan x="58.0" dy="17">Eficacia cercana a 90 % contra la enfermedad grave.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué vacuna debe recibir la mujer en cada embarazo?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ VACUNA SE APLICA EN CADA MOMENTO DEL EMBARAZO</tspan></text><rect x="40.0" y="253.0" width="920.0" height="34.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="52.0" y="275.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="134"><tspan x="52.0" dy="0">VACUNA</tspan></text><text x="256.0" y="275.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="128"><tspan x="256.0" dy="0">Antes de 27 sem</tspan></text><text x="388.0" y="275.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="128"><tspan x="388.0" dy="0">27 a 36 sem</tspan></text><text x="520.0" y="275.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="128"><tspan x="520.0" dy="0">Después de 36 sem</tspan></text><text x="652.0" y="275.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="128"><tspan x="652.0" dy="0">Posparto</tspan></text><text x="734.0" y="275.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="220"><tspan x="734.0" dy="0">REGLA</tspan></text><rect x="324.0" y="289.0" width="128.0" height="176.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/><rect x="40.0" y="293.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="315.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">dTpa (una dosis por</tspan><tspan x="50.0" dy="16">embarazo)</tspan></text><line x1="198.0" y1="319.0" x2="710.0" y2="319.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="388.0" cy="314.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="388.0" y="318.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">✓</tspan></text><text x="388.0" y="341.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="388.0" dy="0">Sí</tspan></text><rect x="730.0" y="293.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="315.5" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">Preferible al inicio del lapso; sin</tspan><tspan x="740.0" dy="15">importar el antecedente.</tspan></text><rect x="40.0" y="351.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="381.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Influenza inactivada</tspan></text><line x1="198.0" y1="377.0" x2="710.0" y2="377.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="256.0" cy="372.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="256.0" y="376.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="256.0" dy="0">✓</tspan></text><text x="256.0" y="399.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="256.0" dy="0">Sí</tspan></text><circle cx="388.0" cy="372.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="388.0" y="376.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">✓</tspan></text><text x="388.0" y="399.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="388.0" dy="0">Sí</tspan></text><circle cx="520.0" cy="372.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="520.0" y="376.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="520.0" dy="0">✓</tspan></text><text x="520.0" y="399.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="520.0" dy="0">Sí</tspan></text><rect x="730.0" y="351.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="373.5" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">En cualquier trimestre durante la</tspan><tspan x="740.0" dy="15">temporada.</tspan></text><rect x="40.0" y="409.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="431.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Triple viral y varicela</tspan><tspan x="50.0" dy="16">(vivas)</tspan></text><line x1="198.0" y1="435.0" x2="710.0" y2="435.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="652.0" cy="430.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="652.0" y="434.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="652.0" dy="0">✓</tspan></text><text x="652.0" y="457.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="652.0" dy="0">Sí</tspan></text><rect x="730.0" y="409.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="431.5" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">Contraindicadas en el embarazo; se</tspan><tspan x="740.0" dy="15">dan tras el parto.</tspan></text><rect x="326.9" y="278.0" width="122.2" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="388.0" y="293.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">◆ 27 A 36 SEMANAS</tspan></text><text x="44.0" y="481.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="44.0" dy="0">✓ se aplica · sin marca: no se aplica en ese momento</tspan></text><rect x="40.0" y="505.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="531.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">dTpa entre las semanas 27 y 36 de cada embarazo</tspan></text><text x="60.0" y="550.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El tétanos solo no protege contra la tos ferina del lactante.</tspan></text><text x="40.0" y="617.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="627.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="649.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="630.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="649.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">dTpa</tspan></text><text x="435.0" y="649.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Tétanos</tspan></text><text x="585.0" y="649.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Triple vírica</tspan></text><text x="735.0" y="649.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Varicela</tspan></text><text x="885.0" y="649.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hepatitis B</tspan></text><rect x="40.0" y="664.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="664.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="693.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué vacuna en cada</tspan><tspan x="54.0" dy="16">embarazo?</tspan></text><text x="285.0" y="693.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: una dosis entre las</tspan><tspan x="285.0" dy="16">semanas 27 y 36</tspan></text><text x="435.0" y="685.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: la dTpa ya incluye</tspan><tspan x="435.0" dy="16">el toxoide y añade tos</tspan><tspan x="435.0" dy="16">ferina</tspan></text><text x="585.0" y="693.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es de virus vivos,</tspan><tspan x="585.0" dy="16">contraindicada</tspan></text><text x="735.0" y="693.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es de virus vivos,</tspan><tspan x="735.0" dy="16">contraindicada</tspan></text><text x="885.0" y="693.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: solo si hay riesgo o</tspan><tspan x="885.0" dy="16">falta de inmunidad</tspan></text><rect x="40.0" y="627.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="754.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="782.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="804.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• dTpa (difteria, tétanos y tos ferina acelular): una dosis en cada embarazo, entre las semanas 27 y 36, de preferencia al inicio de ese lapso y sin importar</tspan><tspan x="58.0" dy="18">   el antecedente de vacunación.</tspan><tspan x="58.0" dy="18">• Razón: el lactante menor de 3 meses puede tener apnea, neumonía, convulsiones o muerte y no puede vacunarse hasta los 2 meses.</tspan><tspan x="58.0" dy="18">• Las vacunas de virus vivos (triple viral, varicela) están contraindicadas en el embarazo y se aplican después del parto si no hay inmunidad.</tspan><tspan x="58.0" dy="18">• La influenza inactivada se aplica en cualquier trimestre durante la temporada; la hepatitis B se da si hay riesgo o falta de inmunidad.</tspan></text><text x="58.0" y="898.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG Committee Opinion N.º 741, Inmunización materna (Obstet Gynecol 2018); CDC ACIP, Tdap en el embarazo (MMWR 2020;69(3)); Williams Obstetricia 26.ª ed.</tspan><tspan x="58.0" dy="15">(2022).</tspan></text></svg>