<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1069" viewBox="0 0 1000 1069" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Las vacunas contra el VPH, entre ellas la bivalente, previenen la infección persistente y el cáncer de cuello uterino"><title>Las vacunas contra el VPH, entre ellas la bivalente, previenen la infección persistente y el cáncer de cuello uterino</title><rect x="0.75" y="0.75" width="998.5" height="1067.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Prevención · vacuna contra el VPH</tspan></text><rect x="405.1" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="484.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="484.8" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Vacunas contra el VPH</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hechas con partículas similares al virus (proteína L1), sin ADN viral.</tspan><tspan x="58.0" dy="17">Existen la bivalente, la tetravalente y la nonavalente.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de afirmaciones</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Respecto a la vacuna contra el VPH, ¿qué se puede</tspan><tspan x="640.0" dy="16">afirmar?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LAS TRES VACUNAS Y QUÉ CUBREN</tspan></text><rect x="40.0" y="269.0" width="293.3" height="181.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><rect x="40.0" y="269.0" width="293.3" height="8.0" rx="4" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="60.0" y="303.0" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="253"><tspan x="60.0" dy="0">Bivalente</tspan></text><rect x="56.0" y="324.0" width="261.3" height="26.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="68.0" y="341.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Tipos</tspan></text><text x="305.3" y="341.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="end" data-max="133"><tspan x="305.3" dy="0">✓ 16 y 18</tspan></text><rect x="56.0" y="354.0" width="261.3" height="26.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="68.0" y="371.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Previene</tspan></text><text x="305.3" y="371.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="end" data-max="133"><tspan x="305.3" dy="0">✓ Cáncer cervical</tspan></text><rect x="56.0" y="384.0" width="261.3" height="26.0" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/><text x="68.0" y="401.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="68.0" dy="0">Eficacia</tspan></text><text x="305.3" y="401.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="end" data-max="133"><tspan x="305.3" dy="0">✓ Más de 90 %</tspan></text><text x="60.0" y="430.0" font-size="11.5" font-weight="600" font-style="normal" fill="#0f766e" text-anchor="start" data-max="253"><tspan x="60.0" dy="0">Opción D: correcta.</tspan></text><rect x="215.9" y="262.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="261.3" y="277.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="261.3" dy="0">◆ ESTE CASO</tspan></text><rect x="353.3" y="269.0" width="293.3" height="181.0" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="353.3" y="269.0" width="293.3" height="8.0" rx="4" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="373.3" y="303.0" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="253"><tspan x="373.3" dy="0">Tetravalente</tspan></text><rect x="369.3" y="324.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="381.3" y="341.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="381.3" dy="0">Tipos</tspan></text><text x="618.7" y="341.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="618.7" dy="0">16, 18, 6 y 11</tspan></text><rect x="369.3" y="354.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="381.3" y="371.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="381.3" dy="0">Previene</tspan></text><text x="618.7" y="371.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="618.7" dy="0">Cáncer cervical</tspan></text><rect x="369.3" y="384.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="381.3" y="401.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="381.3" dy="0">Añade</tspan></text><text x="618.7" y="401.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="618.7" dy="0">Verrugas genitales</tspan></text><text x="373.3" y="430.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="253"><tspan x="373.3" dy="0">Sin refuerzo al año.</tspan></text><rect x="666.7" y="269.0" width="293.3" height="181.0" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="666.7" y="269.0" width="293.3" height="8.0" rx="4" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="686.7" y="303.0" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="253"><tspan x="686.7" dy="0">Nonavalente</tspan></text><rect x="682.7" y="324.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="694.7" y="341.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="694.7" dy="0">Tipos</tspan></text><text x="932.0" y="341.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="932.0" dy="0">Más 31, 33, 45, 52, 58</tspan></text><rect x="682.7" y="354.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="694.7" y="371.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="694.7" dy="0">Previene</tspan></text><text x="932.0" y="371.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="932.0" dy="0">Cáncer cervical</tspan></text><rect x="682.7" y="384.0" width="261.3" height="26.0" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="694.7" y="401.5" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="120"><tspan x="694.7" dy="0">Añade</tspan></text><text x="932.0" y="401.5" font-size="11.5" font-weight="600" font-style="normal" fill="#334155" text-anchor="end" data-max="133"><tspan x="932.0" dy="0">Más tipos oncogénicos</tspan></text><text x="686.7" y="430.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="253"><tspan x="686.7" dy="0">Mayor cobertura.</tspan></text><text x="40.0" y="472.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="400"><tspan x="40.0" dy="0">✓ = dato que coincide con el caso</tspan></text><text x="40.0" y="512.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ESQUEMA DE DOSIS RECOMENDADO (OMS 2022)</tspan></text><rect x="40.0" y="524.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="543.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Grupo</tspan></text><text x="260.0" y="543.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Dosis</tspan></text><text x="615.0" y="543.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Esquema</tspan></text><rect x="40.0" y="553.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="572.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Menores de 15 años</tspan></text><text x="260.0" y="572.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Una o dos</tspan></text><text x="615.0" y="572.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Dos dosis a los 0 y 6 meses</tspan></text><rect x="40.0" y="582.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="601.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Inmunodeprimidas</tspan></text><text x="260.0" y="601.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Tres</tspan></text><text x="615.0" y="601.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Tres dosis</tspan></text><rect x="40.0" y="611.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="630.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Cualquier grupo</tspan></text><text x="260.0" y="630.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">No hay cuatro dosis ni refuerzo al año</tspan></text><text x="615.0" y="630.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Opciones A y C: falsas</tspan></text><rect x="150.6" y="614.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="196.0" y="629.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="196.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="680.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="690.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="729.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="712.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Se requieren 4</tspan><tspan x="285.0" dy="17">dosis de la</tspan><tspan x="285.0" dy="17">bivalente</tspan></text><text x="435.0" y="712.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Eficacia de 85 %</tspan><tspan x="435.0" dy="17">contra la infección</tspan><tspan x="435.0" dy="17">persistente</tspan></text><text x="585.0" y="712.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">La tetravalente</tspan><tspan x="585.0" dy="17">requiere refuerzo al</tspan><tspan x="585.0" dy="17">año</tspan></text><rect x="663.0" y="693.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="712.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">La bivalente</tspan><tspan x="735.0" dy="17">protege del cáncer</tspan><tspan x="735.0" dy="17">cervical</tspan></text><text x="885.0" y="712.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">No previene la</tspan><tspan x="885.0" dy="17">persistencia de la</tspan><tspan x="885.0" dy="17">infección</tspan></text><rect x="40.0" y="761.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="761.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="798.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué se puede afirmar?</tspan></text><text x="285.0" y="790.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no existe esquema</tspan><tspan x="285.0" dy="16">de cuatro dosis</tspan></text><text x="435.0" y="782.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: subestima la</tspan><tspan x="435.0" dy="16">eficacia, mayor de 90</tspan><tspan x="435.0" dy="16">%</tspan></text><text x="585.0" y="790.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no hay refuerzo al</tspan><tspan x="585.0" dy="16">año</tspan></text><text x="735.0" y="790.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: evita la infección</tspan><tspan x="735.0" dy="16">persistente por 16 y 18</tspan></text><text x="885.0" y="782.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: previene la</tspan><tspan x="885.0" dy="16">persistencia de la</tspan><tspan x="885.0" dy="16">infección</tspan></text><rect x="40.0" y="690.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="851.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="879.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="901.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Los tipos 16 y 18 causan cerca de 70 % de los cánceres de cuello uterino; la infección persistente es el paso necesario hacia la neoplasia intraepitelial.</tspan><tspan x="58.0" dy="18">• Bivalente (16 y 18), tetravalente (16, 18, 6 y 11; añade verrugas genitales) y nonavalente (añade 31, 33, 45, 52 y 58): todas previenen el cáncer de cuello</tspan><tspan x="58.0" dy="18">   uterino, con eficacia mayor de 90 % en mujeres no expuestas.</tspan><tspan x="58.0" dy="18">• No hay esquemas de cuatro dosis ni refuerzo al año: la OMS recomienda una o dos dosis (0 y 6 meses) en menores de 15 años y tres en</tspan><tspan x="58.0" dy="18">   inmunodeprimidas. En el Perú rige la NTS 196-MINSA/DGIESP-2022.</tspan><tspan x="58.0" dy="18">• Alerta: la vacuna es profiláctica, no trata lesiones existentes y no sustituye al tamizaje con prueba de VPH o Papanicolaou.</tspan></text><text x="58.0" y="1013.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, HPV vaccines: position paper, Wkly Epidemiol Rec 2022;97:645-672; MINSA, NTS 196-MINSA/DGIESP-2022 (RM 884-2022/MINSA); Williams Obstetricia, 26.ª</tspan><tspan x="58.0" dy="15">ed. (2022).</tspan></text></svg>