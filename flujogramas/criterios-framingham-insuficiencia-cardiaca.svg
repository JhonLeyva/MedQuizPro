iaca: ¿mayor o menor?</tspan></text><rect x="40.0" y="415.0" width="453.0" height="73.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">CRITERIO MAYOR</tspan></text><text x="266.5" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Con otro mayor: diagnóstico</tspan></text><rect x="507.0" y="415.0" width="453.0" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Criterios menores</tspan></text><text x="733.5" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Se necesitan 2 + 1 mayor</tspan></text><text x="40.0" y="528.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CRITERIOS CON NOMBRE PROPIO</tspan></text><rect x="40.0" y="540.5" width="920.0" height="248.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><line x1="662.0" y1="622.5" x2="938.0" y2="622.5" stroke="#0f766e" stroke-width="2"/><line x1="662.0" y1="622.5" x2="662.0" y2="630.5" stroke="#0f766e" stroke-width="2"/><line x1="938.0" y1="622.5" x2="938.0" y2="630.5" stroke="#0f766e" stroke-width="2"/><rect x="760.6" y="610.5" width="78.8" height="24.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/><text x="800.0" y="626.5" font-size="10.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="65"><tspan x="800.0" dy="0">MENORES</tspan></text><line x1="62.0" y1="582.5" x2="638.0" y2="582.5" stroke="#0f766e" stroke-width="2"/><line x1="62.0" y1="582.5" x2="62.0" 