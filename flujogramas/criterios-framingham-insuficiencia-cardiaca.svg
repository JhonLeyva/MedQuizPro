></text><text x="668.0" y="708.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="114"><tspan x="668.0" dy="0">Menor</tspan></text><rect x="806.0" y="642.5" width="138.0" height="99.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="826.0" cy="665.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="826.0" y="669.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="826.0" dy="0">6</tspan></text><text x="844.0" y="670.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="92"><tspan x="844.0" dy="0">Taquicardia &gt;</tspan><tspan x="844.0" dy="17">120</tspan></text><text x="818.0" y="708.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="114"><tspan x="818.0" dy="0">Menor</tspan></text><text x="56.0" y="768.5" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">Diagnóstico: 2 mayores, o 1 mayor + 2 menores.</tspan></text><text x="40.0" y="828.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="838.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="869.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="861.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Taquicardia (&gt;120</tspan><tspan x="285.0" dy="17">x’)</tspan></text><text x="435.0" y="869.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Edema maleolar</tspan></text><text x="585.0" y="869.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Hepatomegalia</tspan></text><rect x="663.0" y="841.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="861.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Disnea paroxística</tspan><tspan x="735.0" dy="17">nocturna</tspan></text><text x="885.0" y="869.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Tos nocturna</tspan></text><rect x="40.0" y="892.5" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="892.5" width="144.0" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="913.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Criterio mayor?</tspan></text><text x="285.0" y="913.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Es menor</tspan></text><text x="435.0" y="913.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Es menor</tspan></text><text x="585.0" y="913.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Es menor</tspan></text><text x="735.0" y="913.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: es mayor</tspan></text><text x="885.0" y="913.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Es menor</tspan></text><rect x="40.0" y="838.5" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="950.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="978.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1000.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Mayores: disnea paroxística nocturna, ingurgitación yugular, crepitantes, cardiomegalia, edema agudo de pulmón, S3, reflujo hepatoyugular.</tspan><tspan x="58.0" dy="18">• Menores: edema maleolar, tos nocturna, disnea de esfuerzo, hepatomegalia, derrame pleural, taquicardia &gt; 120.</tspan><tspan x="58.0" dy="18">• NT-proBNP normal casi descarta la insuficiencia cardiaca.</tspan></text><text x="58.0" y="1058.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: McKee et al., NEJM (1971); ESC, insuficiencia cardiaca (2021, act. 2023).</tspan></text></svg>