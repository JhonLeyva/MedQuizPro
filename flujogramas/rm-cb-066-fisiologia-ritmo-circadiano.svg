<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1084" viewBox="0 0 1000 1084" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El núcleo supraquiasmático del hipotálamo es el marcapasos del ritmo circadiano"><title>El núcleo supraquiasmático del hipotálamo es el marcapasos del ritmo circadiano</title><rect x="0.75" y="0.75" width="998.5" height="1082.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Fisiología · ritmo circadiano</tspan></text><rect x="366.1" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="438.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="438.0" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ritmo circadiano</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Oscilación endógena de unas 24 horas, sincronizada por el ciclo luz-oscuridad.</tspan><tspan x="58.0" dy="17">Su marcapasos central está en el hipotálamo anterior.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué núcleo hipotalámico controla el ritmo circadiano?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL CICLO LUZ-OSCURIDAD AL RELOJ DEL CUERPO</tspan></text><text x="44.0" y="267.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">La luz entra por la retina y el núcleo supraquiasmático sincroniza todo el organismo.</tspan></text><line x1="178.0" y1="306.0" x2="362.0" y2="306.0" stroke="#99f6e4" stroke-width="6"/><line x1="408.0" y1="306.0" x2="592.0" y2="306.0" stroke="#99f6e4" stroke-width="6"/><line x1="638.0" y1="306.0" x2="822.0" y2="306.0" stroke="#99f6e4" stroke-width="6"/><circle cx="155.0" cy="306.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="155.0" y="310.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="155.0" dy="0">1</tspan></text><rect x="45.0" y="340.0" width="220.0" height="76.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="155.0" y="360.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="155.0" dy="0">Luz en la retina</tspan></text><text x="155.0" y="377.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="155.0" dy="0">Células ganglionares con melanopsina</tspan></text><circle cx="385.0" cy="306.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="385.0" y="310.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="385.0" dy="0">2</tspan></text><rect x="275.0" y="340.0" width="220.0" height="76.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="385.0" y="360.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="385.0" dy="0">Tracto retinohipotalámico</tspan></text><text x="385.0" y="377.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="385.0" dy="0">Lleva la señal al hipotálamo anterior</tspan></text><circle cx="615.0" cy="306.0" r="22" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><text x="615.0" y="310.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="38"><tspan x="615.0" dy="0">3</tspan></text><rect x="505.0" y="340.0" width="220.0" height="76.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="615.0" y="360.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="208"><tspan x="615.0" dy="0">Núcleo supraquiasmático</tspan></text><text x="615.0" y="377.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="615.0" dy="0">Marcapasos central: genes CLOCK,</tspan><tspan x="615.0" dy="16">BMAL1, PER y CRY</tspan></text><rect x="562.3" y="405.0" width="105.5" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="615.0" y="420.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="615.0" dy="0">◆ MARCAPASOS</tspan></text><circle cx="845.0" cy="306.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="845.0" y="310.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="845.0" dy="0">4</tspan></text><rect x="735.0" y="340.0" width="220.0" height="76.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="845.0" y="360.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="845.0" dy="0">Melatonina, cortisol y</tspan><tspan x="845.0" dy="17">temperatura</tspan></text><text x="845.0" y="394.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="845.0" dy="0">Sincronizan los relojes periféricos</tspan></text><rect x="40.0" y="448.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="474.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Ritmo circadiano = núcleo supraquiasmático</tspan></text><text x="60.0" y="493.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El supraóptico y el paraventricular son neurosecretores; el ventromedial regula la saciedad.</tspan></text><text x="40.0" y="554.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">NÚCLEOS HIPOTALÁMICOS Y SU FUNCIÓN</tspan></text><rect x="40.0" y="566.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="585.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Núcleo</tspan></text><text x="260.0" y="585.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="694"><tspan x="260.0" dy="0">Función principal</tspan></text><rect x="40.0" y="595.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="614.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Supraquiasmático</tspan></text><text x="260.0" y="614.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="694"><tspan x="260.0" dy="0">Ritmo circadiano: marcapasos sincronizado por la luz</tspan></text><rect x="150.6" y="598.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="196.0" y="613.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="196.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="624.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="643.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Supraóptico</tspan></text><text x="260.0" y="643.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="694"><tspan x="260.0" dy="0">Síntesis de vasopresina y oxitocina</tspan></text><rect x="40.0" y="653.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="672.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Paraventricular</tspan></text><text x="260.0" y="672.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="694"><tspan x="260.0" dy="0">Oxitocina, vasopresina, CRH y TRH</tspan></text><rect x="40.0" y="682.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="701.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Ventromedial</tspan></text><text x="260.0" y="701.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="694"><tspan x="260.0" dy="0">Centro de la saciedad (su lesión causa obesidad)</tspan></text><rect x="40.0" y="711.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="730.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Lateral</tspan></text><text x="260.0" y="730.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="694"><tspan x="260.0" dy="0">Centro del hambre</tspan></text><text x="40.0" y="780.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="790.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="812.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="793.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="812.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Supraquiasmático</tspan></text><text x="435.0" y="812.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Supraóptico</tspan></text><text x="585.0" y="812.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Paraventricular</tspan></text><text x="735.0" y="812.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Dorsolateral</tspan></text><text x="885.0" y="812.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Ventromedial</tspan></text><rect x="40.0" y="827.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="827.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="856.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Controla el ritmo</tspan><tspan x="54.0" dy="16">circadiano?</tspan></text><text x="285.0" y="848.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: marcapasos que</tspan><tspan x="285.0" dy="16">recibe la luz de la</tspan><tspan x="285.0" dy="16">retina</tspan></text><text x="435.0" y="856.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: sintetiza</tspan><tspan x="435.0" dy="16">vasopresina y oxitocina</tspan></text><text x="585.0" y="856.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sintetiza hormonas</tspan><tspan x="585.0" dy="16">liberadoras y oxitocina</tspan></text><text x="735.0" y="848.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no es un núcleo</tspan><tspan x="735.0" dy="16">clásico del ritmo</tspan><tspan x="735.0" dy="16">circadiano</tspan></text><text x="885.0" y="856.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: centro de la</tspan><tspan x="885.0" dy="16">saciedad</tspan></text><rect x="40.0" y="790.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="917.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="945.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="967.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Núcleo supraquiasmático: encima del quiasma óptico; recibe luz por el tracto retinohipotalámico (células ganglionares con melanopsina).</tspan><tspan x="58.0" dy="18">• Sincroniza los relojes periféricos con melatonina pineal, cortisol y temperatura; a nivel molecular usa los genes CLOCK, BMAL1, PER y CRY.</tspan><tspan x="58.0" dy="18">• Supraóptico y paraventricular: vasopresina y oxitocina (el paraventricular también CRH y TRH); ventromedial: saciedad; lateral: hambre.</tspan><tspan x="58.0" dy="18">• Alerta: la luz matutina adelanta la fase y la nocturna la retrasa; la alteración causa jet lag y síndrome de fase retrasada.</tspan></text><text x="58.0" y="1043.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Guyton y Hall, 14.ª ed. (2021); Kandel, Principios de Neurociencia, 6.ª ed. (2021); Harrison, 21.ª ed. (2022).</tspan></text></svg>