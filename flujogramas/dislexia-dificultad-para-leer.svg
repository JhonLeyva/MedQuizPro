<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="989" viewBox="0 0 1000 989" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La dislexia es un trastorno del neurodesarrollo que afecta el aprendizaje de la lectura"><title>La dislexia es un trastorno del neurodesarrollo que afecta el aprendizaje de la lectura</title><rect x="0.75" y="0.75" width="998.5" height="987.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Trastornos específicos del aprendizaje</tspan></text><rect x="428.3" y="32.0" width="124.2" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="490.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="108"><tspan x="490.5" dy="0">PSIQUIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="131.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Trastorno específico del aprendizaje</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Dificultad persistente en una habilidad académica pese a inteligencia normal y buena</tspan><tspan x="58.0" dy="17">enseñanza.</tspan><tspan x="58.0" dy="17">Dislexia (lectura), disgrafía/disortografía (escritura) y discalculia (matemáticas).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="131.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="129.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">La dislexia afecta la capacidad para…</tspan></text><line x1="640.0" y1="201.0" x2="670.0" y2="201.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="205.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="253.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CADA TRASTORNO, SU HABILIDAD</tspan></text><line x1="406.0" y1="412.7" x2="340.0" y2="414.2" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="414.2" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="421.1" y1="461.7" x2="340.0" y2="514.2" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="514.2" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="382.5" x2="660.0" y2="360.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="360.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="438.6" x2="660.0" y2="460.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="460.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="420.3" y1="360.8" x2="340.0" y2="310.6" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="310.6" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="410.6" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="410.6" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="415.6" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">APRENDIZAJE</tspan></text><text x="500.0" y="434.6" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">inteligencia normal</tspan></text><rect x="40.0" y="265.0" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="293.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">DISLEXIA</tspan></text><text x="190.0" y="317.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">LEER</tspan><tspan x="190.0" dy="17">Esta pregunta</tspan></text><rect x="144.6" y="346.2" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="361.2" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="372.2" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="373.2" width="6.0" height="82.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="405.9" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">DISGRAFÍA</tspan></text><text x="190.0" y="429.6" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Escribir (trazo)</tspan></text><rect x="40.0" y="472.2" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="473.2" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="190.0" y="505.9" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">DISORTOGRAFÍA</tspan></text><text x="190.0" y="529.6" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Escribir sin faltas</tspan></text><rect x="660.0" y="318.6" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="319.6" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="352.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">DISCALCULIA</tspan></text><text x="810.0" y="376.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Calcular</tspan></text><rect x="660.0" y="418.6" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="419.6" width="6.0" height="82.0" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="452.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">TARTAMUDEZ</tspan></text><text x="810.0" y="476.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Fluidez del habla (no es del aprendizaje)</tspan></text><text x="40.0" y="592.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="604.2" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="628.7" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Bajo rendimiento</tspan></text><line x1="248.5" y1="624.7" x2="267.5" y2="624.7" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,619.7 266.5,629.7 274.5,624.7" fill="#0f766e"/><rect x="278.5" y="604.2" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="628.7" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Descartar visión y audición</tspan></text><line x1="487.0" y1="624.7" x2="506.0" y2="624.7" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,619.7 505.0,629.7 513.0,624.7" fill="#0f766e"/><rect x="517.0" y="604.2" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="628.7" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Evaluación psicopedagógica</tspan></text><line x1="725.5" y1="624.7" x2="744.5" y2="624.7" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,619.7 743.5,629.7 751.5,624.7" fill="#0f766e"/><rect x="755.5" y="604.2" width="204.5" height="41.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="628.7" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Intervención temprana</tspan></text><text x="40.0" y="685.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="695.2" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="734.7" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="717.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Realizar</tspan><tspan x="285.0" dy="17">operaciones</tspan><tspan x="285.0" dy="17">matemáticas</tspan></text><text x="435.0" y="734.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Enhebrar frases</tspan></text><text x="585.0" y="734.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Escribir</tspan></text><rect x="663.0" y="698.2" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="734.7" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Leer</tspan></text><text x="885.0" y="734.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hablar con fluidez</tspan></text><rect x="40.0" y="766.2" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="766.2" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="795.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué afecta?</tspan></text><text x="285.0" y="795.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es la discalculia</tspan></text><text x="435.0" y="795.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: lenguaje expresivo</tspan></text><text x="585.0" y="795.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es la disgrafía</tspan></text><text x="735.0" y="795.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: lectura</tspan></text><text x="885.0" y="787.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es la tartamudez</tspan><tspan x="885.0" dy="16">(disfemia)</tspan></text><rect x="40.0" y="695.2" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="840.2" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="868.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="890.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Dislexia: lectura lenta, con errores al decodificar palabras y mala comprensión; base fonológica.</tspan><tspan x="58.0" dy="18">• Descartar problemas de visión y audición.</tspan><tspan x="58.0" dy="18">• Tratamiento: intervención psicopedagógica temprana y adaptaciones escolares.</tspan></text><text x="58.0" y="948.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: APA, DSM-5-TR (2022); AAP.</tspan></text></svg>