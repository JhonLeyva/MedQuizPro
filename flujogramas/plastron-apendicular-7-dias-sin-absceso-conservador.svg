fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Operar un plastrón formado lesiona asas.</tspan><tspan x="58.0" dy="18">• Si empeora o hay peritonitis: cirugía.</tspan><tspan x="58.0" dy="18">• Mayores de 40 años: colonoscopía para descartar cáncer.</tspan></text><text x="58.0" y="801.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: WSES – Jerusalem guidelines for acute appendicitis (2020)</tspan></text></svg>