 x="285.0" dy="0">Útil después, no decide</tspan></text><text x="435.0" y="959.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: CURB-65 de 3</tspan></text><text x="585.0" y="959.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: neumonía grave</tspan></text><text x="735.0" y="959.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No decide la conducta</tspan></text><text x="885.0" y="959.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: CURB-65 de 3</tspan></text><rect x="40.0" y="884.0" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="996.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1024.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1046.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Hospitalizar; si hay choque o ≥ 3 criterios menores (ATS/IDSA): UCI.</tspan><tspan x="58.0" dy="18">• Ceftriaxona + azitromicina (o levofloxacino); hemocultivos, Rx de tórax, gases.</tspan><tspan x="58.0" dy="18">• Líquidos y vasopresor si persiste la hipotensión (sepsis).</tspan></text><text x="58.0" y="1104.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ATS, neumonía adquirida en la comunidad (2025); ATS/IDSA (2019); BTS (2009; act.).</tspan></text></svg>