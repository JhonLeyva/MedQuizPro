<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="860" viewBox="0 0 1000 860" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La planificación estratégica y la prospectiva sirven para reducir la incertidumbre, no para adivinar el futuro"><title>La planificación estratégica y la prospectiva sirven para reducir la incertidumbre, no para adivinar el futuro</title><rect x="0.75" y="0.75" width="998.5" height="858.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Gestión · planificación estratégica</tspan></text><rect x="402.3" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="466.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="466.6" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Planificación estratégica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Analiza el entorno y la organización; define visión, objetivos y estrategias.</tspan><tspan x="58.0" dy="17">Parte de un diagnóstico, p. ej. FODA.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de propósito</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">No consisten en adivinar el futuro: ¿para qué sirven?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ HACE CADA HERRAMIENTA FRENTE AL FUTURO</tspan></text><rect x="40.0" y="253.0" width="453.0" height="79.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="54.0" y="280.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Planificación estratégica</tspan></text><text x="54.0" y="297.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Diagnóstico, visión, objetivos y estrategias</tspan><tspan x="54.0" dy="16">Orienta decisiones en un entorno cambiante</tspan></text><rect x="507.0" y="253.0" width="453.0" height="79.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="521.0" y="280.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Prospectiva</tspan></text><text x="521.0" y="297.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Escenarios posibles y probables</tspan><tspan x="521.0" dy="16">Anticipa tendencias, riesgos y oportunidades</tspan></text><rect x="40.0" y="346.0" width="453.0" height="79.0" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2.4"/><text x="54.0" y="373.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Propósito común (este caso)</tspan></text><text x="54.0" y="390.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Reducir la incertidumbre</tspan><tspan x="54.0" dy="16">Base racional para decidir; no se adivina</tspan></text><rect x="391.2" y="335.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="436.6" y="350.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="436.6" dy="0">◆ ESTE CASO</tspan></text><rect x="507.0" y="346.0" width="453.0" height="79.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="521.0" y="373.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Qué no hacen</tspan></text><text x="521.0" y="390.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">No predicen el futuro</tspan><tspan x="521.0" dy="16">No sustituyen el diagnóstico del presente</tspan></text><rect x="40.0" y="443.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="469.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Planificación y prospectiva = reducir la incertidumbre</tspan></text><text x="60.0" y="488.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Conocer el presente y programarlo son tareas de diagnóstico y de programación.</tspan></text><text x="40.0" y="555.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="565.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="596.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="568.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="587.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Reducir la</tspan><tspan x="285.0" dy="17">incertidumbre</tspan></text><text x="435.0" y="596.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Saber lo que pasa</tspan></text><text x="585.0" y="587.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Conocer lo que</tspan><tspan x="585.0" dy="17">pasa</tspan></text><text x="735.0" y="596.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Decidir el presente</tspan></text><text x="885.0" y="587.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Programar el</tspan><tspan x="885.0" dy="17">presente</tspan></text><rect x="40.0" y="619.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="619.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="648.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Para qué sirven?</tspan></text><text x="285.0" y="640.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: dan base racional</tspan><tspan x="285.0" dy="16">ante lo incierto</tspan></text><text x="435.0" y="640.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: describe el</tspan><tspan x="435.0" dy="16">presente</tspan></text><text x="585.0" y="640.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: describe el</tspan><tspan x="585.0" dy="16">presente</tspan></text><text x="735.0" y="640.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es consecuencia,</tspan><tspan x="735.0" dy="16">no propósito</tspan></text><text x="885.0" y="640.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es consecuencia,</tspan><tspan x="885.0" dy="16">no propósito</tspan></text><rect x="40.0" y="565.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="693.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="721.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="743.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Planificación estratégica: proceso sistemático de análisis del entorno y de la organización para definir visión, objetivos de largo plazo y estrategias.</tspan><tspan x="58.0" dy="18">• Prospectiva: construye escenarios posibles y probables del futuro para anticipar tendencias, riesgos y oportunidades.</tspan><tspan x="58.0" dy="18">• Ninguna predice: dan a quien decide una base racional para actuar y reducen la incertidumbre; el riesgo se acepta y se gestiona.</tspan><tspan x="58.0" dy="18">• Saber o conocer lo que pasa describe el diagnóstico actual; decidir o programar el presente es una consecuencia, no el propósito.</tspan></text><text x="58.0" y="819.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Chiavenato I. Introducción a la Teoría General de la Administración, 9.ª ed. (2014); Godet M. De la anticipación a la acción (1993).</tspan></text></svg>