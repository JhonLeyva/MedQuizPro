<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="972" viewBox="0 0 1000 972" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En diarrea, neumonía, desnutrición y parasitosis la protección de la salud es agua potable, vivienda y nutrición"><title>En diarrea, neumonía, desnutrición y parasitosis la protección de la salud es agua potable, vivienda y nutrición</title><rect x="0.75" y="0.75" width="998.5" height="970.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Salud pública · niveles de prevención</tspan></text><rect x="421.5" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="485.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="485.8" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Niveles de prevención (Leavell y Clark)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Primaria: promoción de la salud y protección específica, antes de la enfermedad.</tspan><tspan x="58.0" dy="17">Secundaria: diagnóstico y tratamiento oportunos. Terciaria: rehabilitación.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Prácticas en un establecimiento</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Muchos casos de diarrea acuosa, neumonía,</tspan><tspan x="640.0" dy="16">desnutrición infantil y parasitosis.</tspan><tspan x="640.0" dy="16">¿Qué acciones de protección de la salud recomienda?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">NIVELES DE PREVENCIÓN Y EJEMPLOS DE CADA UNO</tspan></text><rect x="40.0" y="309.0" width="300.0" height="54.0" rx="0" fill="#fbd5c4" stroke="#ffffff" stroke-width="2"/><rect x="40" y="309.0" width="300" height="54.0" fill="#b91c1c" opacity="0.22"/><text x="54.0" y="334.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Prevención primaria</tspan></text><text x="54.0" y="350.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Antes de la enfermedad</tspan></text><text x="328.0" y="340.0" font-size="11" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="end" data-max="96"><tspan x="328.0" dy="0">◄ llega aquí</tspan></text><rect x="376.0" y="311.0" width="584.0" height="50.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="388.0" y="329.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Promoción y protección específica</tspan></text><text x="388.0" y="345.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Agua potable, vivienda, nutrición, vacunas, saneamiento y control de vectores.</tspan></text><rect x="40.0" y="363.0" width="300.0" height="54.0" rx="0" fill="#f5b8a2" stroke="#ffffff" stroke-width="2"/><text x="54.0" y="388.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Prevención secundaria</tspan></text><text x="54.0" y="404.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Enfermedad temprana</tspan></text><rect x="376.0" y="365.0" width="584.0" height="50.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="388.0" y="383.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Diagnóstico y tratamiento oportunos</tspan></text><text x="388.0" y="399.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Más médicos, medicamentos y emergencia mejoran la atención.</tspan></text><rect x="40.0" y="417.0" width="300.0" height="54.0" rx="0" fill="#e89c84" stroke="#ffffff" stroke-width="2"/><text x="54.0" y="442.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Prevención terciaria</tspan></text><text x="54.0" y="458.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Enfermedad establecida</tspan></text><rect x="376.0" y="419.0" width="584.0" height="50.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="388.0" y="437.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Rehabilitación</tspan></text><text x="388.0" y="453.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Ampliar camas atiende, no evita nuevos casos.</tspan></text><line x1="346.0" y1="315.0" x2="346.0" y2="465.0" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="4 4"/><line x1="346.0" y1="461.0" x2="346.0" y2="456.0" stroke="#b91c1c" stroke-width="2.2"/><polygon points="341.0,456.0 351.0,456.0 346.0,465.0" fill="#b91c1c"/><text x="376.0" y="303.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="584"><tspan x="376.0" dy="0">QUÉ INCLUYE CADA NIVEL</tspan></text><text x="40.0" y="303.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="300"><tspan x="40.0" dy="0">CAPAS (DE SUPERFICIAL A PROFUNDA)</tspan></text><rect x="872.3" y="300.0" width="55.4" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="900.0" y="315.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="900.0" dy="0">◆ AQUÍ</tspan></text><rect x="40.0" y="489.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="515.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Protección de la salud = prevención primaria sobre los determinantes</tspan></text><text x="60.0" y="534.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Si no se cambia la causa, el establecimiento seguirá saturado de casos nuevos.</tspan></text><text x="40.0" y="601.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="611.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="650.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="614.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="642.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Agua potable,</tspan><tspan x="285.0" dy="17">vivienda y nutrición</tspan></text><text x="435.0" y="633.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Contratar más</tspan><tspan x="435.0" dy="17">médicos y</tspan><tspan x="435.0" dy="17">enfermeras</tspan></text><text x="585.0" y="642.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Comprar más</tspan><tspan x="585.0" dy="17">medicamentos</tspan></text><text x="735.0" y="642.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Mejorar la</tspan><tspan x="735.0" dy="17">emergencia</tspan></text><text x="885.0" y="642.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Ampliar el número</tspan><tspan x="885.0" dy="17">de camas</tspan></text><rect x="40.0" y="682.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="682.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="719.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Protección de la salud?</tspan></text><text x="285.0" y="703.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: actúa sobre los</tspan><tspan x="285.0" dy="16">determinantes antes</tspan><tspan x="285.0" dy="16">de enfermar</tspan></text><text x="435.0" y="711.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: aumenta personal,</tspan><tspan x="435.0" dy="16">no cambia la causa</tspan></text><text x="585.0" y="711.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es atención de la</tspan><tspan x="585.0" dy="16">enfermedad instalada</tspan></text><text x="735.0" y="703.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: capacidad de</tspan><tspan x="735.0" dy="16">atención, no</tspan><tspan x="735.0" dy="16">prevención</tspan></text><text x="885.0" y="703.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: capacidad de</tspan><tspan x="885.0" dy="16">atención, no</tspan><tspan x="885.0" dy="16">prevención</tspan></text><rect x="40.0" y="611.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="772.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="800.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="822.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Este patrón se liga a pobreza, agua no segura, saneamiento deficiente, hacinamiento y mala alimentación: actuar sobre los determinantes sociales.</tspan><tspan x="58.0" dy="18">• Prevención primaria: promoción (educación, estilos de vida, nutrición, vivienda) y protección específica (vacunas, agua potable, saneamiento, control de</tspan><tspan x="58.0" dy="18">   vectores).</tspan><tspan x="58.0" dy="18">• Más médicos, medicamentos, emergencia o camas aumentan la capacidad de atender la enfermedad instalada: prevención secundaria y terciaria.</tspan><tspan x="58.0" dy="18">• Perla: lactancia exclusiva, lavado de manos y vacunación previenen a la vez diarrea y neumonía infantil (Alma-Ata 1978; Carta de Ottawa 1986).</tspan></text><text x="58.0" y="916.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Leavell y Clark, Preventive Medicine for the Doctor in His Community (1965); OMS, Carta de Ottawa para la Promoción de la Salud (1986); OMS/UNICEF, Declaración</tspan><tspan x="58.0" dy="15">de Alma-Ata (1978).</tspan></text></svg>