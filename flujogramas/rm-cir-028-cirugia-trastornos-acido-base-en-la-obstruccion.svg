<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="999" viewBox="0 0 1000 999" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Obstrucción intestinal proximal: hipopotasemia y alcalosis metabólica"><title>Obstrucción intestinal proximal: hipopotasemia y alcalosis metabólica</title><rect x="0.75" y="0.75" width="998.5" height="997.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Cirugía · trastornos ácido-base en la obstrucción</tspan></text><rect x="489.2" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="532.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="532.3" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Pérdida de jugo gástrico</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Los vómitos eliminan ácido clorhídrico y potasio.</tspan><tspan x="58.0" dy="17">Alcalosis metabólica hipoclorémica con hipopotasemia.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué trastorno es más frecuente en la obstrucción</tspan><tspan x="640.0" dy="16">proximal?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LA GASOMETRÍA DEL PACIENTE QUE VOMITA (VALORES TÍPICOS)</tspan></text><rect x="40.0" y="269.0" width="222.5" height="78.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="151.2" y="289.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="210"><tspan x="151.2" dy="0">pH</tspan></text><text x="151.2" y="317.0" font-size="20" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="210"><tspan x="151.2" dy="0">7,52 ↑</tspan></text><text x="151.2" y="337.0" font-size="9.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="151.2" dy="0">normal 7,35-7,45</tspan></text><rect x="272.5" y="269.0" width="222.5" height="78.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="383.8" y="289.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="210"><tspan x="383.8" dy="0">HCO₃⁻</tspan></text><text x="383.8" y="317.0" font-size="20" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="210"><tspan x="383.8" dy="0">34 ↑</tspan></text><text x="383.8" y="337.0" font-size="9.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="383.8" dy="0">normal 22-26</tspan></text><rect x="505.0" y="269.0" width="222.5" height="78.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="616.2" y="289.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="210"><tspan x="616.2" dy="0">K⁺</tspan></text><text x="616.2" y="317.0" font-size="20" font-weight="800" font-style="normal" fill="#2563eb" text-anchor="middle" data-max="210"><tspan x="616.2" dy="0">2,9 ↓</tspan></text><text x="616.2" y="337.0" font-size="9.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="616.2" dy="0">normal 3,5-5</tspan></text><rect x="737.5" y="269.0" width="222.5" height="78.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="848.8" y="289.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="210"><tspan x="848.8" dy="0">Cl⁻</tspan></text><text x="848.8" y="317.0" font-size="20" font-weight="800" font-style="normal" fill="#2563eb" text-anchor="middle" data-max="210"><tspan x="848.8" dy="0">88 ↓</tspan></text><text x="848.8" y="337.0" font-size="9.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="848.8" dy="0">normal 98-106</tspan></text><rect x="40.0" y="361.0" width="250.0" height="41.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="60.0" cy="381.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="60.0" y="386.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">1</tspan></text><text x="80.0" y="385.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="80.0" dy="0">¿Acidemia o alcalemia?</tspan></text><line x1="293.0" y1="381.5" x2="300.0" y2="381.5" stroke="#0f766e" stroke-width="2"/><polygon points="299.0,376.5 299.0,386.5 307.0,381.5" fill="#0f766e"/><rect x="310.0" y="361.0" width="230.0" height="41.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="322.0" y="385.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="206"><tspan x="322.0" dy="0">pH 7,52</tspan></text><line x1="543.0" y1="381.5" x2="550.0" y2="381.5" stroke="#0f766e" stroke-width="2"/><polygon points="549.0,376.5 549.0,386.5 557.0,381.5" fill="#0f766e"/><rect x="560.0" y="361.0" width="400.0" height="41.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.2"/><text x="572.0" y="385.5" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="376"><tspan x="572.0" dy="0">Alcalemia</tspan></text><rect x="40.0" y="410.0" width="250.0" height="41.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="60.0" cy="430.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="60.0" y="435.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">2</tspan></text><text x="80.0" y="434.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="80.0" dy="0">¿Metabólica o respiratoria?</tspan></text><line x1="293.0" y1="430.5" x2="300.0" y2="430.5" stroke="#0f766e" stroke-width="2"/><polygon points="299.0,425.5 299.0,435.5 307.0,430.5" fill="#0f766e"/><rect x="310.0" y="410.0" width="230.0" height="41.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="322.0" y="434.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="206"><tspan x="322.0" dy="0">HCO₃⁻ alto</tspan></text><line x1="543.0" y1="430.5" x2="550.0" y2="430.5" stroke="#0f766e" stroke-width="2"/><polygon points="549.0,425.5 549.0,435.5 557.0,430.5" fill="#0f766e"/><rect x="560.0" y="410.0" width="400.0" height="41.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.2"/><text x="572.0" y="434.5" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="376"><tspan x="572.0" dy="0">Alcalosis metabólica</tspan></text><rect x="40.0" y="459.0" width="250.0" height="41.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="60.0" cy="479.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="60.0" y="484.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">3</tspan></text><text x="80.0" y="483.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="80.0" dy="0">¿Qué electrolitos?</tspan></text><line x1="293.0" y1="479.5" x2="300.0" y2="479.5" stroke="#0f766e" stroke-width="2"/><polygon points="299.0,474.5 299.0,484.5 307.0,479.5" fill="#0f766e"/><rect x="310.0" y="459.0" width="230.0" height="41.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="322.0" y="483.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="206"><tspan x="322.0" dy="0">K⁺ y Cl⁻ bajos</tspan></text><line x1="543.0" y1="479.5" x2="550.0" y2="479.5" stroke="#0f766e" stroke-width="2"/><polygon points="549.0,474.5 549.0,484.5 557.0,479.5" fill="#0f766e"/><rect x="560.0" y="459.0" width="400.0" height="41.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.2"/><text x="572.0" y="483.5" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="376"><tspan x="572.0" dy="0">Hipopotasemia e hipocloremia</tspan></text><rect x="40.0" y="508.0" width="250.0" height="41.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="60.0" cy="528.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="60.0" y="533.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">4</tspan></text><text x="80.0" y="532.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="80.0" dy="0">¿Qué hago primero?</tspan></text><line x1="293.0" y1="528.5" x2="300.0" y2="528.5" stroke="#0f766e" stroke-width="2"/><polygon points="299.0,523.5 299.0,533.5 307.0,528.5" fill="#0f766e"/><rect x="310.0" y="508.0" width="230.0" height="41.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="322.0" y="532.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="206"><tspan x="322.0" dy="0">Hipovolemia</tspan></text><line x1="543.0" y1="528.5" x2="550.0" y2="528.5" stroke="#0f766e" stroke-width="2"/><polygon points="549.0,523.5 549.0,533.5 557.0,528.5" fill="#0f766e"/><rect x="560.0" y="508.0" width="400.0" height="41.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="572.0" y="532.5" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="376"><tspan x="572.0" dy="0">SALINA ISOTÓNICA + POTASIO</tspan></text><rect x="40.0" y="567.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="593.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Alcalosis metabólica con hipopotasemia</tspan></text><text x="60.0" y="612.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Se corrige con solución salina y potasio, y descomprimiendo con sonda.</tspan></text><text x="40.0" y="679.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="689.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="728.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="692.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="711.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hipopotasemia y</tspan><tspan x="285.0" dy="17">alcalosis</tspan><tspan x="285.0" dy="17">metabólica</tspan></text><text x="435.0" y="711.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hiponatremia y</tspan><tspan x="435.0" dy="17">alcalosis</tspan><tspan x="435.0" dy="17">metabólica</tspan></text><text x="585.0" y="720.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Hipopotasemia y</tspan><tspan x="585.0" dy="17">acidosis metabólica</tspan></text><text x="735.0" y="711.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hipernatremia y</tspan><tspan x="735.0" dy="17">alcalosis</tspan><tspan x="735.0" dy="17">respiratoria</tspan></text><text x="885.0" y="720.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hipocalcemia y</tspan><tspan x="885.0" dy="17">acidosis metabólica</tspan></text><rect x="40.0" y="760.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="760.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="797.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Trastorno?</tspan></text><text x="285.0" y="781.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: vómitos con</tspan><tspan x="285.0" dy="16">pérdida de H⁺, Cl⁻ y</tspan><tspan x="285.0" dy="16">K⁺</tspan></text><text x="435.0" y="789.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: la hiponatremia no</tspan><tspan x="435.0" dy="16">es lo característico</tspan></text><text x="585.0" y="781.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sería en</tspan><tspan x="585.0" dy="16">obstrucción distal</tspan><tspan x="585.0" dy="16">isquémica</tspan></text><text x="735.0" y="789.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: la respiración no</tspan><tspan x="735.0" dy="16">se altera así</tspan></text><text x="885.0" y="789.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no es el trastorno</tspan><tspan x="885.0" dy="16">característico</tspan></text><rect x="40.0" y="689.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="850.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="878.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="900.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La hipovolemia activa la aldosterona: retiene sodio y elimina potasio y protones (aciduria paradójica).</tspan><tspan x="58.0" dy="18">• Obstrucción distal con isquemia: acidosis metabólica con lactato.</tspan><tspan x="58.0" dy="18">• Tratamiento: solución salina isotónica con potasio y sonda nasogástrica.</tspan></text><text x="58.0" y="958.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Sabiston Tratado de Cirugía 21.ª ed.; Harrison Principios de Medicina Interna 22.ª ed. (2025)</tspan></text></svg>