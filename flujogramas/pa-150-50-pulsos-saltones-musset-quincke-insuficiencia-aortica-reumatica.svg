<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1099" viewBox="0 0 1000 1099" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="PA 150/50, pulsos saltones, Musset y Quincke con soplo diastólico: insuficiencia aórtica crónica"><title>PA 150/50, pulsos saltones, Musset y Quincke con soplo diastólico: insuficiencia aórtica crónica</title><rect x="0.75" y="0.75" width="998.5" height="1097.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Valvulopatías · insuficiencia aórtica</tspan></text><rect x="409.9" y="32.0" width="132.2" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="476.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="116"><tspan x="476.0" dy="0">CARDIOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Insuficiencia aórtica crónica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La válvula aórtica no cierra: en cada diástole la sangre vuelve al VI.</tspan><tspan x="58.0" dy="17">El VI se dilata y bombea más volumen: pulsos amplios y presión diferencial grande.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Agricultor de 52 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Fiebre reumática en la adolescencia; disnea de</tspan><tspan x="640.0" dy="16">esfuerzo y ortopnea.</tspan><tspan x="640.0" dy="16">PA 150/50, pulsos amplios, balanceo de la cabeza,</tspan><tspan x="640.0" dy="16">pulso capilar; soplo diastólico en decrescendo.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LOS SIGNOS DEL PACIENTE</tspan></text><rect x="40.0" y="301.0" width="310.0" height="500.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="311.0" width="145.8" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="325.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">EL PACIENTE DEL CASO</tspan></text><g transform="translate(87.0,343.0) scale(0.9)"><circle cx="120" cy="40" r="28" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M110 66 H130 V80 H110 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 80 H170 L176 170 H64 Z" fill="#fde2e2" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M64 170 H176 L170 240 H70 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 240 H170 L164 268 H76 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 84 L50 92 L36 170 L54 174 L66 120 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M36 170 L54 174 L46 238 L28 236 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="37" cy="250" rx="10" ry="15" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M76 268 H118 L114 360 H84 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M84 360 H114 L108 418 H90 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="98" cy="426" rx="15" ry="7" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M170.0 84 L190.0 92 L204.0 170 L186.0 174 L174.0 120 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M204.0 170 L186.0 174 L194.0 238 L212.0 236 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="203.0" cy="250.0" rx="10.0" ry="15.0" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M164.0 268 H122.0 L126.0 360 H156.0 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M156.0 360 H126.0 L132.0 418 H150.0 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="142.0" cy="426.0" rx="15.0" ry="7.0" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="110" cy="36" r="3" fill="#334155" stroke="none" stroke-width="0" /><circle cx="130" cy="36" r="3" fill="#334155" stroke="none" stroke-width="0" /><path d="M112 52 Q120 57 128 52" fill="none" stroke="#9a6b52" stroke-width="1.6"/><circle cx="150" cy="22" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="150" y="26" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">1</text><circle cx="136" cy="74" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="136" y="78" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">2</text><circle cx="37" cy="252" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="37" y="256" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">3</text><circle cx="134" cy="112" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="134" y="116" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">4</text><circle cx="62" cy="140" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="62" y="144" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">5</text><text x="4" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">D</text><text x="236" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">I</text></g><text x="195.0" y="774.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="280"><tspan x="195.0" dy="0">1 cabeza que se balancea, 2 pulso carotídeo saltón,</tspan><tspan x="195.0" dy="15">3 uñas, 4 foco del soplo, 5 PA 150/50.</tspan></text><rect x="368.0" y="301.0" width="592.0" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="388.0" cy="323.0" r="12" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="327.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">1</tspan></text><text x="408.0" y="327.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Signo de Musset</tspan></text><text x="408.0" y="348.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">La cabeza se balancea con cada latido.</tspan></text><rect x="368.0" y="375.0" width="592.0" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="388.0" cy="397.0" r="12" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="401.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">2</tspan></text><text x="408.0" y="401.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Pulso de Corrigan</tspan></text><text x="408.0" y="422.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Pulso amplio que sube y cae rápido.</tspan></text><rect x="368.0" y="449.0" width="592.0" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="388.0" cy="471.0" r="12" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="475.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">3</tspan></text><text x="408.0" y="475.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Signo de Quincke</tspan></text><text x="408.0" y="496.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Pulso capilar visible en el lecho de la uña.</tspan></text><rect x="368.0" y="523.0" width="592.0" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="388.0" cy="545.0" r="12" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="549.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">4</tspan></text><text x="408.0" y="549.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Soplo diastólico en decrescendo</tspan></text><text x="408.0" y="570.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Borde esternal izquierdo, inclinado hacia adelante.</tspan></text><rect x="368.0" y="597.0" width="592.0" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="388.0" cy="619.0" r="12" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="623.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">5</tspan></text><text x="408.0" y="623.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Presión diferencial amplia</tspan></text><text x="408.0" y="644.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">150/50: diferencia de 100 mmHg.</tspan></text><rect x="368.0" y="671.0" width="592.0" height="64.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><circle cx="388.0" cy="693.0" r="12" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="697.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">6</tspan></text><text x="408.0" y="697.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Causa: insuficiencia aórtica reumática</tspan></text><text x="408.0" y="718.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Antecedente de fiebre reumática.</tspan></text><rect x="844.6" y="660.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="675.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="845.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="855.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="877.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="877.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Miocardiopatía dilatada</tspan></text><text x="491.2" y="877.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Estenosis aórtica</tspan></text><rect x="588.0" y="858.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="678.8" y="877.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Insuficiencia aórtica</tspan></text><text x="866.2" y="877.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Insuficiencia mitral</tspan></text><rect x="40.0" y="892.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="588.0" y="892.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="913.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Clave</tspan></text><text x="303.8" y="913.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Sin soplo diastólico</tspan></text><text x="491.2" y="913.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Soplo sistólico, pulso débil</tspan></text><text x="678.8" y="913.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Diastólico + pulsos saltones</tspan></text><text x="866.2" y="913.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Soplo sistólico en ápex</tspan></text><rect x="40.0" y="855.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="950.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="978.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1000.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Presión diferencial amplia + signos periféricos (Corrigan, Musset, Quincke) + soplo diastólico aspirativo = insuficiencia aórtica.</tspan><tspan x="58.0" dy="18">• Se oye mejor en el borde esternal izquierdo con el paciente inclinado hacia adelante y en espiración.</tspan><tspan x="58.0" dy="18">• Con síntomas o VI dilatado: reemplazo valvular.</tspan></text><text x="58.0" y="1058.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AHA/ACC, valvulopatías (2020); Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>