<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="940" viewBox="0 0 1000 940" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Primigesta a término con feto podálico: cesárea programada a las 39 semanas"><title>Primigesta a término con feto podálico: cesárea programada a las 39 semanas</title><rect x="0.75" y="0.75" width="998.5" height="938.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · presentación podálica</tspan></text><rect x="407.1" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="486.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="486.9" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Presentación podálica a término</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ocurre en 3 a 4 % de los embarazos.</tspan><tspan x="58.0" dy="17">Se ofrece versión cefálica externa y, si no hay cabeza abajo, cesárea.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Primigesta a término</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Feto en podálica confirmada.</tspan><tspan x="640.0" dy="16">¿Cuál es la conducta?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SE OFRECE SEGÚN LAS SEMANAS DE GESTACIÓN</tspan></text><rect x="40.0" y="269.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="295.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Semanas de gestación</tspan></text><text x="60.0" y="314.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La conducta cambia a medida que el feto llega a término.</tspan></text><rect x="70.0" y="378.0" width="430.0" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="285.0" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="420"><tspan x="285.0" dy="0">Antes de 36: vigilar, aún puede voltear</tspan></text><rect x="500.0" y="378.0" width="215.0" height="40.0" rx="6" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/><text x="607.5" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#c2410c" text-anchor="middle" data-max="205"><tspan x="607.5" dy="0">36 a 38: versión cefálica</tspan></text><rect x="715.0" y="378.0" width="215.0" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="822.5" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="205"><tspan x="822.5" dy="0">39 o más: cesárea programada</tspan></text><line x1="70.0" y1="418.0" x2="70.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="70.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="70.0" dy="0">30 s</tspan></text><line x1="356.7" y1="418.0" x2="356.7" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="356.7" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="356.7" dy="0">34 s</tspan></text><line x1="500.0" y1="418.0" x2="500.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="500.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="500.0" dy="0">36 s</tspan></text><line x1="643.3" y1="418.0" x2="643.3" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="643.3" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="643.3" dy="0">38 s</tspan></text><line x1="715.0" y1="418.0" x2="715.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="715.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="715.0" dy="0">39 s</tspan></text><line x1="786.7" y1="418.0" x2="786.7" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="786.7" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="786.7" dy="0">40 s</tspan></text><line x1="930.0" y1="418.0" x2="930.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">42 s</tspan></text><polygon points="706.0,364.0 724.0,364.0 715.0,376.0" fill="#ea580c"/><rect x="546.1" y="338.0" width="337.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="715.0" y="353.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="326"><tspan x="715.0" dy="0">◆ PRIMIGESTA A TÉRMINO: CESÁREA A LAS 39 SEMANAS</tspan></text><text x="40.0" y="486.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ DECIDE LA CONDUCTA</tspan></text><rect x="40.0" y="496.0" width="297.3" height="85.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="497.0" width="6.0" height="83.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="520.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Presentación podálica a término</tspan></text><text x="58.0" y="541.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Cesárea programada de elección</tspan></text><rect x="351.3" y="496.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="497.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="520.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Parto vaginal planificado</tspan></text><text x="369.3" y="541.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Solo en centros con protocolo y equipo con</tspan><tspan x="369.3" dy="16">experiencia</tspan></text><rect x="662.7" y="496.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="497.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="520.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Inducción, oxitocina o espera</tspan></text><text x="680.7" y="541.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">No corrigen la presentación y exponen a prolapso</tspan><tspan x="680.7" dy="16">de cordón</tspan></text><text x="40.0" y="621.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="631.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="653.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="634.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="653.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Cesárea</tspan></text><text x="435.0" y="653.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Parto vaginal</tspan></text><text x="585.0" y="653.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Expectante</tspan></text><text x="735.0" y="653.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Inducción</tspan></text><text x="885.0" y="653.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Acentuación</tspan></text><rect x="40.0" y="668.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="668.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="705.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Conducta?</tspan></text><text x="285.0" y="689.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: menor</tspan><tspan x="285.0" dy="16">morbimortalidad</tspan><tspan x="285.0" dy="16">perinatal</tspan></text><text x="435.0" y="689.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: la pelvis no está</tspan><tspan x="435.0" dy="16">probada en la</tspan><tspan x="435.0" dy="16">primigesta</tspan></text><text x="585.0" y="689.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: expone a trabajo</tspan><tspan x="585.0" dy="16">de parto con riesgo de</tspan><tspan x="585.0" dy="16">prolapso</tspan></text><text x="735.0" y="697.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no corrige la</tspan><tspan x="735.0" dy="16">presentación</tspan></text><text x="885.0" y="697.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: la oxitocina no</tspan><tspan x="885.0" dy="16">voltea al feto</tspan></text><rect x="40.0" y="631.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="758.0" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="786.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="808.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Term Breech Trial (2000): la cesárea programada redujo la mortalidad perinatal y la morbilidad neonatal grave (1,6 % frente a 5,0 %).</tspan><tspan x="58.0" dy="18">• Antes de programar la cesárea se ofrece la versión cefálica externa si no hay contraindicaciones; la cesárea programada se hace a las 39 semanas.</tspan><tspan x="58.0" dy="18">• ACOG 2018 admite el parto vaginal solo en centros con protocolos estrictos, equipo con experiencia y criterios de selección.</tspan><tspan x="58.0" dy="18">• Alerta: el trabajo de parto con feto podálico expone a prolapso de cordón y a cabeza última atrapada; la oxitocina no corrige la presentación.</tspan></text><text x="58.0" y="884.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, Committee Opinion 745 (2018); Impey L et al., RCOG Green-top Guideline 20b, BJOG 2017;124:e151-e177; Hannah ME et al., Term Breech Trial, Lancet</tspan><tspan x="58.0" dy="15">2000;356:1375-83.</tspan></text></svg>