<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1054" viewBox="0 0 820 1054" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Enfermedad por reflujo gastroesofágico (ERGE)"><title>Enfermedad por reflujo gastroesofágico (ERGE)</title><rect width="820" height="1054" fill="#ffffff"/><rect x="0" y="0" width="820" height="112" fill="#0f766e"/><text x="40" y="34" font-size="13" font-weight="600" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="740"><tspan x="40" dy="0">MedQuizPlus · Flujograma</tspan></text><text x="40" y="70" font-size="24" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="740"><tspan x="40" dy="0">Enfermedad por reflujo gastroesofágico (ERGE)</tspan></text><text x="40" y="96" font-size="13" font-weight="400" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="740"><tspan x="40" dy="0">ENAM 2020 · GAS-004 · Gastroenterología</tspan></text><rect x="90" y="144" width="640" height="76" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="108" y="172" font-size="11" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="604"><tspan x="108" dy="0">INICIO</tspan></text><text x="108" y="196" font-size="16" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Pirosis y regurgitación ácida (síntomas típicos de reflujo)</tspan></text><line x1="410.0" y1="222" x2="410.0" y2="242" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,240 417.0,240 410.0,250" fill="#94a3b8"/><rect x="90" y="252" width="640" height="126" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><circle cx="120" cy="315.0" r="12" fill="#d97706"/><text x="120" y="320.0" font-size="15" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="120" dy="0">?</tspan></text><text x="142" y="280" font-size="11" font-weight="700" font-style="normal" fill="#b45309" text-anchor="start" data-max="570"><tspan x="142" dy="0">DECISIÓN</tspan></text><text x="142" y="304" font-size="16" font-weight="600" font-style="normal" fill="#78350f" text-anchor="start" data-max="570"><tspan x="142" dy="0">¿Signos de alarma? Disfagia, odinofagia, baja de peso,</tspan><tspan x="142" dy="22">sangrado, anemia o vómitos</tspan></text><text x="142" y="354" font-size="14" font-weight="500" font-style="italic" fill="#92400e" text-anchor="start" data-max="570"><tspan x="142" dy="0">↳ Sí → endoscopia digestiva alta</tspan></text><line x1="410.0" y1="380" x2="410.0" y2="400" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,398 417.0,398 410.0,408" fill="#94a3b8"/><rect x="90" y="410" width="640" height="76" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="438" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="462" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Sin signos de alarma: diagnóstico clínico de ERGE</tspan></text><line x1="410.0" y1="488" x2="410.0" y2="508" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,506 417.0,506 410.0,516" fill="#94a3b8"/><rect x="90" y="518" width="640" height="120" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="546" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="570" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Medidas higiénico-dietéticas: bajar de peso, evitar café,</tspan><tspan x="108" dy="22">alcohol y comidas copiosas, no acostarse tras comer, elevar</tspan><tspan x="108" dy="22">la cabecera</tspan></text><line x1="410.0" y1="640" x2="410.0" y2="660" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,658 417.0,658 410.0,668" fill="#94a3b8"/><rect x="90" y="670" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="698" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="722" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Prueba terapéutica con inhibidor de bomba de protones</tspan><tspan x="108" dy="22">(omeprazol) por 4 a 8 semanas</tspan></text><line x1="410.0" y1="770" x2="410.0" y2="790" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,788 417.0,788 410.0,798" fill="#94a3b8"/><rect x="90" y="800" width="640" height="76" rx="12" fill="#134e4a" stroke="#134e4a" stroke-width="2"/><text x="108" y="828" font-size="11" font-weight="700" font-style="normal" fill="#5eead4" text-anchor="start" data-max="604"><tspan x="108" dy="0">CONDUCTA FINAL</tspan></text><text x="108" y="852" font-size="16" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Sin respuesta: endoscopia y pH-metría</tspan></text><rect x="40" y="906" width="740" height="98" rx="10" fill="#f0fdfa" stroke="#99f6e4"/><rect x="40" y="906" width="6" height="98" rx="3" fill="#14b8a6"/><text x="62" y="932" font-size="14" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="704"><tspan x="62" dy="0">Perla clínica</tspan></text><text x="62" y="956" font-size="15" font-weight="400" font-style="normal" fill="#134e4a" text-anchor="start" data-max="704"><tspan x="62" dy="0">Obesidad y café favorecen el reflujo: aumentan la presión abdominal y</tspan><tspan x="62" dy="21">relajan el esfínter esofágico inferior.</tspan></text><text x="410.0" y="1032" font-size="11" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="740"><tspan x="410.0" dy="0">MedQuizPlus · Material de estudio: contrasta siempre con las guías clínicas vigentes.</tspan></text></svg>
