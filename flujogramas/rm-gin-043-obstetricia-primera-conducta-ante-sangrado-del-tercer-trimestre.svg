<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1199" viewBox="0 0 1000 1199" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Sangrado indoloro a las 35 semanas: hospitalizar y pedir ecografía antes de cualquier tacto"><title>Sangrado indoloro a las 35 semanas: hospitalizar y pedir ecografía antes de cualquier tacto</title><rect x="0.75" y="0.75" width="998.5" height="1197.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · primera conducta ante sangrado del tercer trimestre</tspan></text><rect x="582.9" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="662.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="662.6" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Sangrado indoloro del tercer trimestre</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Es placenta previa hasta demostrar lo contrario.</tspan><tspan x="58.0" dy="17">El tacto vaginal o rectal puede desencadenar una hemorragia masiva.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Multípara de 35 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Control prenatal normal; despierta por la noche con</tspan><tspan x="640.0" dy="16">pérdida sanguínea mínima.</tspan><tspan x="640.0" dy="16">Sin dolor ni contracciones.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SE HACE Y QUIÉN LO HACE AL INGRESO</tspan></text><rect x="40.0" y="285.0" width="920.0" height="112.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="285.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="345.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Ingreso</tspan></text><rect x="40.0" y="397.0" width="920.0" height="112.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="397.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="457.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Laboratorio</tspan></text><rect x="40.0" y="509.0" width="920.0" height="112.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="509.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="565.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Imagen y</tspan><tspan x="94.0" dy="14">monitoreo</tspan></text><rect x="40.0" y="621.0" width="920.0" height="112.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="621.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="677.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Lo que no se</tspan><tspan x="94.0" dy="14">hace</tspan></text><line x1="348.0" y1="341.0" x2="355.0" y2="341.0" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="341.0" x2="355.0" y2="453.0" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="453.0" x2="353.0" y2="453.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="353.0,458.0 353.0,448.0 362.0,453.0" fill="#0f766e"/><line x1="552.0" y1="453.0" x2="559.0" y2="453.0" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="453.0" x2="559.0" y2="565.0" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="565.0" x2="557.0" y2="565.0" stroke="#ea580c" stroke-width="2.2"/><polygon points="557.0,570.0 557.0,560.0 566.0,565.0" fill="#ea580c"/><line x1="756.0" y1="565.0" x2="763.0" y2="565.0" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="565.0" x2="763.0" y2="677.0" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="677.0" x2="761.0" y2="677.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="761.0,682.0 761.0,672.0 770.0,677.0" fill="#0f766e"/><rect x="158.0" y="298.0" width="190.0" height="86.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="168.0" y="314.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Hospitalizar y canalizar una</tspan><tspan x="168.0" dy="16">vía</tspan></text><text x="168.0" y="347.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Sangrado indoloro: previa hasta</tspan><tspan x="168.0" dy="14.5">demostrar lo contrario</tspan></text><circle cx="158.0" cy="298.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="302.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="362.0" y="410.0" width="190.0" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="372.0" y="426.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Hemograma, grupo y Rh,</tspan><tspan x="372.0" dy="16">pruebas cruzadas</tspan></text><text x="372.0" y="459.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Anticipar transfusión; anti-D si es</tspan><tspan x="372.0" dy="14.5">Rh negativa</tspan></text><circle cx="362.0" cy="410.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="362.0" y="414.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="362.0" dy="0">2</tspan></text><rect x="566.0" y="522.0" width="190.0" height="86.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="576.0" y="538.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Ecografía transvaginal y</tspan><tspan x="576.0" dy="16">cardiotocografía</tspan></text><text x="576.0" y="571.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Localiza la placenta y mide el</tspan><tspan x="576.0" dy="14.5">bienestar fetal</tspan></text><circle cx="566.0" cy="522.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="566.0" y="526.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="566.0" dy="0">3</tspan></text><rect x="770.0" y="634.0" width="190.0" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="780.0" y="650.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Tacto vaginal o rectal,</tspan><tspan x="780.0" dy="16">taponamiento, alta a casa</tspan></text><text x="780.0" y="683.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Riesgo de hemorragia masiva o</tspan><tspan x="780.0" dy="14.5">de nuevo sangrado sin atención</tspan></text><circle cx="770.0" cy="634.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="770.0" y="638.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="770.0" dy="0">4</tspan></text><rect x="40.0" y="751.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="777.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Hospitalizar y localizar la placenta con ecografía</tspan></text><text x="60.0" y="796.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El tacto vaginal o rectal se prohíbe hasta descartar la previa.</tspan></text><text x="40.0" y="863.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="873.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="904.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="876.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="895.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hospitalización y</tspan><tspan x="285.0" dy="17">ecografía</tspan></text><text x="435.0" y="895.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Examen pélvico</tspan><tspan x="435.0" dy="17">vaginal estéril</tspan></text><text x="585.0" y="895.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Examen pélvico</tspan><tspan x="585.0" dy="17">rectal</tspan></text><text x="735.0" y="895.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Taponamiento</tspan><tspan x="735.0" dy="17">vaginal</tspan></text><text x="885.0" y="895.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Observación en</tspan><tspan x="885.0" dy="17">domicilio</tspan></text><rect x="40.0" y="927.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="927.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="964.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Primera conducta?</tspan></text><text x="285.0" y="964.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: ingreso y ecografía</tspan></text><text x="435.0" y="948.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: el tacto puede</tspan><tspan x="435.0" dy="16">causar hemorragia</tspan><tspan x="435.0" dy="16">masiva</tspan></text><text x="585.0" y="956.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: el tacto rectal tiene</tspan><tspan x="585.0" dy="16">el mismo riesgo</tspan></text><text x="735.0" y="948.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no controla la</tspan><tspan x="735.0" dy="16">hemorragia ni evita</tspan><tspan x="735.0" dy="16">infección</tspan></text><text x="885.0" y="948.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: el siguiente</tspan><tspan x="885.0" dy="16">sangrado puede ser</tspan><tspan x="885.0" dy="16">masivo</tspan></text><rect x="40.0" y="873.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1017.0" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1045.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1067.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Primero: hospitalizar, canalizar una vía, tomar hemograma, grupo y Rh con pruebas cruzadas y monitorizar a la madre y al feto.</tspan><tspan x="58.0" dy="18">• Confirmar la placenta con ecografía, de preferencia transvaginal, que es segura.</tspan><tspan x="58.0" dy="18">• Prohibido el tacto vaginal o rectal antes de descartar la previa; la especuloscopia suave se hace solo después de la ecografía.</tspan><tspan x="58.0" dy="18">• No se tapona la vagina ni se observa en casa: el siguiente episodio puede ser masivo. Anti-D si es Rh negativa.</tspan></text><text x="58.0" y="1143.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Williams Obstetricia 26.ª ed. (2022); RCOG Green-top Guideline N.º 27a: Placenta Praevia and Placenta Accreta Spectrum. BJOG 2026;133:e93-e128; MINSA, GPC de</tspan><tspan x="58.0" dy="15">emergencias obstétricas, RM 695-2006/MINSA.</tspan></text></svg>