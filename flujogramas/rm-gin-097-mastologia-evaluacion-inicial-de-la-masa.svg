<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1236" viewBox="0 0 1000 1236" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Masa mamaria fija con ganglios axilares: hace falta tejido; la aspiración con aguja fina es la opción de la lista"><title>Masa mamaria fija con ganglios axilares: hace falta tejido; la aspiración con aguja fina es la opción de la lista</title><rect x="0.75" y="0.75" width="998.5" height="1234.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Mastología · evaluación inicial de la masa</tspan></text><rect x="445.4" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="525.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="525.2" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cáncer de mama localmente avanzado</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Masa dura, fija a la pared torácica y adenopatías axilares en una mujer posmenopáusica.</tspan><tspan x="58.0" dy="17">Es cT4 por fijación a la pared, hasta demostrar lo contrario.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 65 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Masa tumoral en la mama izquierda, fija a la pared</tspan><tspan x="640.0" dy="16">torácica.</tspan><tspan x="640.0" dy="16">Ganglios axilares ipsilaterales palpables.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="126.4" y1="395.0" x2="873.6" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="126.4" y1="395.0" x2="126.4" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="121.4,423.0 131.4,423.0 126.4,431.0" fill="#94a3b8"/><line x1="313.2" y1="395.0" x2="313.2" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="308.2,423.0 318.2,423.0 313.2,431.0" fill="#94a3b8"/><line x1="500.0" y1="395.0" x2="500.0" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,423.0 505.0,423.0 500.0,431.0" fill="#94a3b8"/><line x1="686.8" y1="395.0" x2="686.8" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="681.8,423.0 691.8,423.0 686.8,431.0" fill="#94a3b8"/><line x1="873.6" y1="395.0" x2="873.6" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="868.6,423.0 878.6,423.0 873.6,431.0" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#0f766e"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="313.2" y1="395.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="313.2" y1="395.0" x2="313.2" y2="424.0" stroke="#0f766e" stroke-width="3"/><polygon points="308.2,423.0 318.2,423.0 313.2,431.0" fill="#0f766e"/><rect x="59.6" y="404.0" width="133.5" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="126.4" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="126.4" dy="0">Mamografía y ecografía</tspan></text><rect x="250.9" y="404.0" width="124.6" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="313.2" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="313.2" dy="0">Aguja fina (este caso)</tspan></text><rect x="440.4" y="404.0" width="119.2" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="500.0" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">Aguja gruesa guiada</tspan></text><rect x="641.4" y="404.0" width="90.7" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="686.8" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="686.8" dy="0">Biopsia abierta</tspan></text><rect x="837.9" y="404.0" width="71.5" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="873.6" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="873.6" dy="0">Tomografía</tspan></text><polygon points="240.0,336.0 266.0,307.0 734.0,307.0 760.0,336.0 734.0,365.0 266.0,365.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="336.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="341.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="340.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Mujer de 65 años con masa mamaria fija y ganglios axilares</tspan></text><rect x="40.0" y="431.0" width="172.8" height="142.9" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="126.4" y="485.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="145"><tspan x="126.4" dy="0">ORIENTAN</tspan></text><text x="126.4" y="508.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="145"><tspan x="126.4" dy="0">No confirman malignidad</tspan><tspan x="126.4" dy="17">Guían la toma de tejido</tspan></text><rect x="226.8" y="431.0" width="172.8" height="142.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="313.2" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="145"><tspan x="313.2" dy="0">DIAGNÓSTICO</tspan><tspan x="313.2" dy="18.5">CELULAR</tspan></text><text x="313.2" y="500.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="145"><tspan x="313.2" dy="0">Citología mínimamente</tspan><tspan x="313.2" dy="17">invasiva</tspan><tspan x="313.2" dy="17">Útil también en el ganglio</tspan><tspan x="313.2" dy="17">axilar sospechoso</tspan></text><rect x="413.6" y="431.0" width="172.8" height="142.9" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="468.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="145"><tspan x="500.0" dy="0">PREFERIDA HOY</tspan></text><text x="500.0" y="491.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="145"><tspan x="500.0" dy="0">Tipo, grado, receptores y</tspan><tspan x="500.0" dy="17">HER2</tspan><tspan x="500.0" dy="17">Necesaria para el</tspan><tspan x="500.0" dy="17">tratamiento neoadyuvante</tspan></text><rect x="600.4" y="431.0" width="172.8" height="142.9" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="686.8" y="468.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="145"><tspan x="686.8" dy="0">NO DE INICIO</tspan></text><text x="686.8" y="491.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="145"><tspan x="686.8" dy="0">Altera la anatomía y el</tspan><tspan x="686.8" dy="17">ganglio centinela</tspan><tspan x="686.8" dy="17">Puede diseminar la</tspan><tspan x="686.8" dy="17">enfermedad</tspan></text><rect x="787.2" y="431.0" width="172.8" height="142.9" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="873.6" y="485.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="145"><tspan x="873.6" dy="0">DESPUÉS</tspan></text><text x="873.6" y="508.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="145"><tspan x="873.6" dy="0">Estadificación a distancia</tspan><tspan x="873.6" dy="17">En tumores avanzados</tspan></text><text x="40.0" y="607.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">MÉTODOS DE LA PREGUNTA EN LA MASA MAMARIA SOSPECHOSA</tspan></text><rect x="40.0" y="619.9" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="638.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Método</tspan></text><text x="350.0" y="638.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="294"><tspan x="350.0" dy="0">Qué da</tspan></text><text x="660.0" y="638.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="294"><tspan x="660.0" dy="0">Papel</tspan></text><rect x="40.0" y="648.9" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="667.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Ultrasonido</tspan></text><text x="350.0" y="667.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="350.0" dy="0">Imagen; no confirma malignidad</tspan></text><text x="660.0" y="667.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="660.0" dy="0">Parte de la evaluación triple</tspan></text><rect x="40.0" y="677.9" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="696.9" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Aspiración aguja fina</tspan></text><text x="350.0" y="696.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="350.0" dy="0">Citología: confirma malignidad, sin receptores</tspan></text><text x="660.0" y="696.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="660.0" dy="0">Diagnóstico celular mínimamente invasivo; útil en el</tspan><tspan x="660.0" dy="15">ganglio axilar</tspan></text><rect x="240.6" y="688.9" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="286.0" y="703.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="721.9" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="740.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Biopsia excisional o incisional</tspan></text><text x="350.0" y="740.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="350.0" dy="0">Tejido, pero abierta</tspan></text><text x="660.0" y="740.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="660.0" dy="0">No se hace de inicio</tspan></text><rect x="40.0" y="750.9" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="769.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Tomografía axial computarizada</tspan></text><text x="350.0" y="769.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="350.0" dy="0">Estadificación a distancia</tspan></text><text x="660.0" y="769.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="660.0" dy="0">Después del diagnóstico, en tumores avanzados</tspan></text><text x="40.0" y="795.9" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">La guía vigente prefiere la biopsia con aguja gruesa tras la imagen; la clave del banco es la aspiración.</tspan></text><text x="40.0" y="842.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="852.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="883.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="883.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Ultrasonido</tspan></text><rect x="363.0" y="855.9" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="875.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Aspiración con</tspan><tspan x="435.0" dy="17">aguja fina</tspan></text><text x="585.0" y="883.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Biopsia excisional</tspan></text><text x="735.0" y="883.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Biopsia incisional</tspan></text><text x="885.0" y="875.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Tomografía axial</tspan><tspan x="885.0" dy="17">computarizada</tspan></text><rect x="40.0" y="906.9" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="906.9" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="943.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Evaluación inicial?</tspan></text><text x="285.0" y="935.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: orienta, pero no</tspan><tspan x="285.0" dy="16">confirma malignidad</tspan></text><text x="435.0" y="927.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: da diagnóstico</tspan><tspan x="435.0" dy="16">celular mínimamente</tspan><tspan x="435.0" dy="16">invasivo</tspan></text><text x="585.0" y="935.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: altera la anatomía,</tspan><tspan x="585.0" dy="16">no se hace de inicio</tspan></text><text x="735.0" y="935.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: igual, no se hace</tspan><tspan x="735.0" dy="16">de inicio</tspan></text><text x="885.0" y="935.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: se usa después,</tspan><tspan x="885.0" dy="16">para estadificar</tspan></text><rect x="40.0" y="852.9" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="996.9" width="920.0" height="221.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1024.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1046.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Se aplica la evaluación triple: examen clínico, imagen (mamografía diagnóstica y ecografía) y toma de tejido. Nunca se opera sin diagnóstico histológico</tspan><tspan x="58.0" dy="18">   previo.</tspan><tspan x="58.0" dy="18">• La biopsia con aguja gruesa guiada da tipo histológico, grado, receptores hormonales y HER2, necesarios para la terapia neoadyuvante; hoy es la</tspan><tspan x="58.0" dy="18">   preferida.</tspan><tspan x="58.0" dy="18">• La aspiración con aguja fina da citología y confirma malignidad, pero no distingue in situ de invasor ni da receptores; sigue siendo útil en el ganglio axilar</tspan><tspan x="58.0" dy="18">   sospechoso (clave del banco).</tspan><tspan x="58.0" dy="18">• La biopsia excisional o incisional abierta no se hace de inicio: altera la anatomía, dificulta la cirugía y el ganglio centinela. La tomografía se usa después</tspan><tspan x="58.0" dy="18">   para estadificar.</tspan></text><text x="58.0" y="1194.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACR Appropriateness Criteria: Palpable breast masses, 2022 update (J Am Coll Radiol 2023;20:S146-S163).</tspan></text></svg>