xt x="128.0" y="494.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="128.0" dy="0">No resulta de usar 4 mL</tspan></text><rect x="226.0" y="441.0" width="176.0" height="73.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="314.0" y="459.0" font-size="9.5" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="160"><tspan x="314.0" dy="0">✓ COINCIDE</tspan></text><text x="314.0" y="477.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="314.0" dy="0">5600 mL</tspan></text><text x="314.0" y="494.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="314.0" dy="0">Mitad de 11 200 mL</tspan></text><rect x="412.0" y="441.0" width="176.0" height="73.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="459.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="160"><tspan x="500.0" dy="0">✗ NO</tspan></text><text x="500.0" y="477.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="500.0" dy="0">4500 mL</tspan></text><text x="500.0" y="494.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="500.0" dy="0">No resulta de usar 4 mL</tspan></text><rect x="598.0" y="441.0" width="176.0" height="73.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="686.0" y="459.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="160"><tspan x="686.0" dy="0">✗ NO</tspan></text><text x="686.0" y="477.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="686.0" dy="0">3600 mL</tspan></text><text x="686.0" y="494.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="686.0" dy="0">Usa menos superficie o 3 mL</tspan></text><rect x="784.0" y="441.0" width="176.0" height="73.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="872.0" y="459.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="160"><tspan x="872.0" dy="0">✗ NO</tspan></text><text x="872.0" y="477.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="156"><tspan x="872.0" dy="0">5000 mL</tspan></text><text x="872.0" y="494.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="156"><tspan x="872.0" dy="0">No resulta de la fórmula</tspan></text><rect x="40.0" y="532.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="558.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Parkland en 8 horas = 5600 mL</tspan></text><text x="60.0" y="577.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Mitad del total de 24 horas, ajustada luego por diuresis.</tspan></text><text x="40.0" y="638.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">REANIMACIÓN DEL GRAN QUEMADO CON LA FÓRMULA DE PARKLAND</tspan></text><rect x="40.0" y="650.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="669.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Periodo</tspan></text><text x="260.0" y="669.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Volumen</tspan></text><text x="615.0" y="669.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Comentario</tspan></text><rect x="40.0" y="679.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="698.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Primeras 8 horas</tspan></text><text x="260.0" y="698.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">5600 mL</tspan></text><text x="615.0" y="698.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Mitad del total, desde el momento de la quemadura (este</tspan><tspan x="615.0" dy="15">caso)</tspan></text><rect x="150.6" y="690.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="196.0" y="705.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="196.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="723.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="742.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Siguientes 16 horas</tspan></text><text x="260.0" y="742.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">5600 mL</tspan></text><text x="615.0" y="742.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Otra mitad, ajustada cada hora</tspan></text><rect x="40.0" y="752.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="771.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Total en 24 horas</tspan></text><text x="260.0" y="771.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">11 200 mL</tspan></text><text x="615.0" y="771.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">4 mL x 70 kg x 40 %</tspan></text><text x="40.0" y="797.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">El enunciado dice 40 % y el cálculo del libro usa 39 %: ambos dan cerca de 5600 mL.</tspan></text><text x="40.0" y="844.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="854.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="876.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="876.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">4800 mL</tspan></text><rect x="363.0" y="857.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="876.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">5600 mL</tspan></text><text x="585.0" y="876.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">4500 mL</tspan></text><text x="735.0" y="876.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">3600 mL</tspan></text><text x="885.0" y="876.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">5000 mL</tspan></text><rect x="40.0" y="891.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="891.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="912.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Volumen en las</tspan><tspan x="54.0" dy="16">primeras 8 h?</tspan></text><text x="285.0" y="912.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: error de cálculo o</tspan><tspan x="285.0" dy="16">menor superficie</tspan></text><text x="435.0" y="912.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: 11 200 mL en 24 h,</tspan><tspan x="435.0" dy="16">la mitad en 8 h</tspan></text><text x="585.0" y="920.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: error de cálculo</tspan></text><text x="735.0" y="920.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: error de cálculo</tspan></text><text x="885.0" y="920.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: error de cálculo</tspan></text><rect x="40.0" y="854.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="965.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="993.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1015.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Volumen de 24 horas: 4 x 70 x 40 = 11 200 mL; en las primeras 8 horas 5600 mL (opción B) y 5600 mL en las 16 siguientes.</tspan><tspan x="58.0" dy="18">• Regla de los nueves: miembros superiores 18 %, un miembro inferior 18 % y un tercio de cara y cuello cerca de 3 %: 39 %, que el enunciado redondea a</tspan><tspan x="58.0" dy="18">   40 %.</tspan><tspan x="58.0" dy="18">• Es un punto de partida: se ajusta cada hora para una diuresis de 0,5 mL/kg/h; las guías actuales (ATLS) suelen iniciar con 2 mL/kg/% para evitar</tspan><tspan x="58.0" dy="18">   sobrerreanimación.</tspan><tspan x="58.0" dy="18">• Gran quemado: superficie mayor de 20 %. Exceso de líquido causa edema pulmonar y síndrome compartimental.</tspan></text><text x="58.0" y="1127.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ISBI Practice Guidelines for Burn Care, Burns 2016;42:953-1021; Sabiston Tratado de Cirugía 21.ª ed.</tspan></text></svg>