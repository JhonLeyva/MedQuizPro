<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1456" viewBox="0 0 1000 1456" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Mujer con ACV isquémico agudo (afasia y hemiparesia) y PA 208/108: lo primero es bajar la PA a &lt; 185/110 para poder trombolizar"><title>Mujer con ACV isquémico agudo (afasia y hemiparesia) y PA 208/108: lo primero es bajar la PA a &lt; 185/110 para poder trombolizar</title><rect x="0.75" y="0.75" width="998.5" height="1454.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ataque cerebrovascular isquémico agudo</tspan></text><rect x="446.8" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="511.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="511.1" dy="0">NEUROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="148.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Trombólisis y presión arterial</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La alteplasa o tenecteplasa solo se da con PA &lt; 185/110 (y se mantiene &lt; 180/105 por 24</tspan><tspan x="58.0" dy="17">h).</tspan><tspan x="58.0" dy="17">Con INR ≤ 1,7 la anticoagulación con warfarina no impide trombolizar; con anticoagulantes</tspan><tspan x="58.0" dy="17">directos recientes, sí.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="148.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="146.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 75 años, HTA y FA anticoagulada</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Trastorno de conciencia, afasia y hemiparesia derecha.</tspan><tspan x="640.0" dy="16">PA 208/108, FC 108; INR 1,6.</tspan></text><rect x="640.0" y="209.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="222.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="222.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="270.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DOS NÚMEROS QUE DECIDEN LA TROMBÓLISIS</tspan></text><rect x="40.0" y="282.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="308.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">PA sistólica (mmHg)</tspan></text><text x="60.0" y="327.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Debe ser &lt; 185 (y diastólica &lt; 110) antes de trombolizar.</tspan></text><rect x="70.0" y="391.0" width="508.2" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="324.1" y="416.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="498"><tspan x="324.1" dy="0">Se puede trombolizar</tspan></text><rect x="578.2" y="391.0" width="351.8" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="754.1" y="416.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="342"><tspan x="754.1" dy="0">Bajar primero</tspan></text><line x1="578.2" y1="431.0" x2="578.2" y2="439.0" stroke="#64748b" stroke-width="1.5"/><text x="578.2" y="453.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="578.2" dy="0">185</tspan></text><polygon points="749.0,377.0 767.0,377.0 758.0,389.0" fill="#ea580c"/><rect x="697.0" y="351.0" width="122.1" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="758.0" y="366.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="110"><tspan x="758.0" dy="0">◆ ESTE CASO: 208</tspan></text><rect x="40.0" y="481.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="507.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">INR (con warfarina)</tspan></text><text x="60.0" y="526.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">≤ 1,7 permite trombolizar.</tspan></text><rect x="70.0" y="590.0" width="301.0" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="220.5" y="615.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="291"><tspan x="220.5" dy="0">Permite</tspan></text><rect x="371.0" y="590.0" width="559.0" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="650.5" y="615.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="549"><tspan x="650.5" dy="0">Contraindica</tspan></text><line x1="371.0" y1="630.0" x2="371.0" y2="638.0" stroke="#64748b" stroke-width="1.5"/><text x="371.0" y="652.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="371.0" dy="0">1,7</tspan></text><polygon points="319.0,576.0 337.0,576.0 328.0,588.0" fill="#ea580c"/><rect x="293.2" y="550.0" width="69.6" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="328.0" y="565.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="58"><tspan x="328.0" dy="0">◆ INR 1,6</tspan></text><text x="40.0" y="698.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ORDEN DE ACCIÓN</tspan></text><rect x="40.0" y="708.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="709.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="732.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">1. TC sin contraste</tspan></text><text x="58.0" y="753.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Descartar hemorragia</tspan></text><rect x="351.3" y="708.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="352.3" y="709.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="369.3" y="732.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">2. Bajar la PA &lt; 185/110</tspan></text><text x="369.3" y="753.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Labetalol o nicardipino</tspan></text><rect x="662.7" y="708.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="709.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="732.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">3. Trombólisis ± trombectomía</tspan></text><text x="680.7" y="753.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Si está en ventana</tspan></text><text x="40.0" y="817.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="829.0" width="920.0" height="300.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="843.0" width="228.4" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="170.2" y="863.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="170.2" dy="0">GRAVEDAD DEL ACV (NIHSS)</tspan></text><text x="300.4" y="863.0" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="642"><tspan x="300.4" dy="0">0 a 42 puntos: conciencia, mirada, campos, cara, brazos, piernas, lenguaje, sensibilidad.</tspan></text><rect x="56.0" y="903.0" width="168.0" height="75.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="903.6" width="166.8" height="63.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="140.0" y="931.0" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="152"><tspan x="140.0" dy="0">0</tspan></text><text x="140.0" y="951.0" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="144"><tspan x="140.0" dy="0">Sin déficit</tspan></text><rect x="236.0" y="903.0" width="168.0" height="75.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="236.6" y="903.6" width="166.8" height="63.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="320.0" y="931.0" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="152"><tspan x="320.0" dy="0">1-4</tspan></text><text x="320.0" y="951.0" font-size="14" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="144"><tspan x="320.0" dy="0">Menor</tspan></text><rect x="416.0" y="903.0" width="168.0" height="75.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="416.6" y="903.6" width="166.8" height="63.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="500.0" y="931.0" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">5-15</tspan></text><text x="500.0" y="951.0" font-size="14" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="144"><tspan x="500.0" dy="0">Moderado</tspan></text><rect x="596.0" y="903.0" width="168.0" height="75.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="596.6" y="903.6" width="166.8" height="63.0" rx="9" fill="#fee2e2" stroke="none" stroke-width="0"/><text x="680.0" y="931.0" font-size="11" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="152"><tspan x="680.0" dy="0">16-20</tspan></text><text x="680.0" y="951.0" font-size="14" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="144"><tspan x="680.0" dy="0">Moderado a grave</tspan></text><rect x="776.0" y="903.0" width="168.0" height="75.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="776.6" y="903.6" width="166.8" height="63.0" rx="9" fill="#fecaca" stroke="none" stroke-width="0"/><text x="860.0" y="931.0" font-size="11" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="middle" data-max="152"><tspan x="860.0" dy="0">21-42</tspan></text><text x="860.0" y="951.0" font-size="14" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="middle" data-max="144"><tspan x="860.0" dy="0">Grave</tspan></text><text x="56.0" y="1008.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="1017.0" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="1032.0" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="1032.0" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Afasia + hemiparesia + conciencia alterada: suele ser ≥ 5</tspan></text><rect x="56.0" y="1039.0" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="1054.0" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="1054.0" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">El puntaje no cambia la regla de la PA</tspan></text><rect x="56.0" y="1076.0" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="1099.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Bajar la PA a &lt; 185/110 con labetalol o nicardipino y trombolizar si está en ventana.</tspan></text><text x="40.0" y="1169.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1179.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1210.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="1182.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="1201.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Bajar la PA sistólica</tspan><tspan x="285.0" dy="17">a &lt; 185 mmHg</tspan></text><text x="435.0" y="1201.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Trombólisis para</tspan><tspan x="435.0" dy="17">revascularizar</tspan></text><text x="585.0" y="1201.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Optimizar</tspan><tspan x="585.0" dy="17">anticoagulación</tspan></text><text x="735.0" y="1201.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Administrar</tspan><tspan x="735.0" dy="17">vitamina K</tspan></text><text x="885.0" y="1210.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Iniciar heparina</tspan></text><rect x="40.0" y="1233.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1233.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1262.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Primera acción?</tspan></text><text x="285.0" y="1254.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: requisito para</tspan><tspan x="285.0" dy="16">trombolizar</tspan></text><text x="435.0" y="1262.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: primero bajar la PA</tspan></text><text x="585.0" y="1254.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no en la fase</tspan><tspan x="585.0" dy="16">aguda</tspan></text><text x="735.0" y="1262.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: INR 1,6 no lo exige</tspan></text><text x="885.0" y="1254.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no en la fase</tspan><tspan x="885.0" dy="16">aguda</tspan></text><rect x="40.0" y="1179.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1307.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1335.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1357.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• TC sin contraste urgente (descartar hemorragia) y glucemia.</tspan><tspan x="58.0" dy="18">• Labetalol 10-20 mg EV o nicardipino en infusión hasta PA &lt; 185/110.</tspan><tspan x="58.0" dy="18">• Luego trombólisis si está dentro de la ventana (≤ 4,5 h) y trombectomía si hay oclusión de gran vaso.</tspan></text><text x="58.0" y="1415.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AHA/ASA, ACV isquémico agudo (2019; act. 2026); ESO, trombólisis (2021) y trombectomía (2023).</tspan></text></svg>