<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="993" viewBox="0 0 1000 993" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la atención familiar el estudio de la red social es imprescindible; el genograma no es prescindible"><title>En la atención familiar el estudio de la red social es imprescindible; el genograma no es prescindible</title><rect x="0.75" y="0.75" width="998.5" height="991.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Salud familiar · instrumentos de atención familiar</tspan></text><rect x="490.5" y="32.0" width="109.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="545.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="93"><tspan x="545.2" dy="0">PSIQUIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Instrumentos de la atención familiar</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Genograma, APGAR familiar, ecomapa y red social.</tspan><tspan x="58.0" dy="17">Estudian estructura, función y entorno de la familia.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">En relación con la salud familiar, ¿qué afirmación es</tspan><tspan x="640.0" dy="16">cierta?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><rect x="40.0" y="245.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="271.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Red social = imprescindible en la atención familiar</tspan></text><text x="60.0" y="290.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Genograma y ciclo vital sí sirven; el APGAR mide función y los problemas psicosociales sí afectan.</tspan></text><text x="40.0" y="351.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">INSTRUMENTOS DE LA ATENCIÓN FAMILIAR</tspan></text><rect x="40.0" y="363.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Instrumento</tspan></text><text x="300.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Qué muestra</tspan></text><text x="635.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Afirmación del banco</tspan></text><rect x="40.0" y="392.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="411.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Genograma</tspan></text><text x="300.0" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Estructura, relaciones y antecedentes en tres</tspan><tspan x="300.0" dy="15">generaciones</tspan></text><text x="635.0" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">No es prescindible</tspan></text><rect x="40.0" y="436.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="455.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">APGAR familiar</tspan></text><text x="300.0" y="455.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Función: cinco ítems; normal, disfunción leve, moderada o</tspan><tspan x="300.0" dy="15">grave</tspan></text><text x="635.0" y="455.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">No describe a la familia</tspan></text><rect x="40.0" y="480.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="499.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Red social y ecomapa</tspan></text><text x="300.0" y="499.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Apoyos disponibles y entorno de la familia</tspan></text><text x="635.0" y="499.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Imprescindible: la opción correcta</tspan></text><rect x="190.6" y="483.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="236.0" y="498.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="236.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="509.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="528.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Ciclo vital familiar</tspan></text><text x="300.0" y="528.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Formación, extensión, contracción y disolución</tspan></text><text x="635.0" y="528.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Predecible: permite prevenir</tspan></text><text x="40.0" y="554.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">La clave del banco es C; B es discutible, pero el APGAR evalúa la función y no hace una descripción.</tspan></text><text x="40.0" y="601.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="611.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="650.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="642.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">El genograma es</tspan><tspan x="285.0" dy="17">prescindible</tspan></text><text x="435.0" y="642.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">El APGAR describe</tspan><tspan x="435.0" dy="17">a la familia</tspan></text><rect x="513.0" y="614.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="633.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">El estudio de la red</tspan><tspan x="585.0" dy="17">social es</tspan><tspan x="585.0" dy="17">imprescindible</tspan></text><text x="735.0" y="642.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Las etapas del ciclo</tspan><tspan x="735.0" dy="17">vital son al azar</tspan></text><text x="885.0" y="633.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Los problemas</tspan><tspan x="885.0" dy="17">psicosociales no</tspan><tspan x="885.0" dy="17">intervienen</tspan></text><rect x="40.0" y="682.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="682.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="719.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Afirmación cierta?</tspan></text><text x="285.0" y="711.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: el genograma no</tspan><tspan x="285.0" dy="16">es prescindible</tspan></text><text x="435.0" y="703.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: el APGAR mide</tspan><tspan x="435.0" dy="16">función, no describe la</tspan><tspan x="435.0" dy="16">familia</tspan></text><text x="585.0" y="703.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: complementa al</tspan><tspan x="585.0" dy="16">ecomapa y completa la</tspan><tspan x="585.0" dy="16">evaluación</tspan></text><text x="735.0" y="703.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: el ciclo vital es</tspan><tspan x="735.0" dy="16">predecible y permite</tspan><tspan x="735.0" dy="16">prevenir</tspan></text><text x="885.0" y="703.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: los problemas</tspan><tspan x="885.0" dy="16">psicosociales</tspan><tspan x="885.0" dy="16">desencadenan crisis</tspan></text><rect x="40.0" y="611.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="772.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="800.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="822.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Genograma: representación gráfica de al menos tres generaciones con estructura, relaciones y antecedentes patológicos; es fundamental, no</tspan><tspan x="58.0" dy="18">   prescindible.</tspan><tspan x="58.0" dy="18">• APGAR familiar (Smilkstein, 1978): cinco ítems (adaptación, participación, gradiente de crecimiento, afecto y resolución) que miden la función familiar, no</tspan><tspan x="58.0" dy="18">   describen a la familia.</tspan><tspan x="58.0" dy="18">• Ciclo vital: secuencia predecible (formación, extensión, contracción, disolución) con crisis normativas; conocerlo permite prevenir.</tspan><tspan x="58.0" dy="18">• Los problemas psicosociales (pérdida de empleo, violencia, enfermedad) desencadenan crisis y disfunción; el análisis de la red social y el ecomapa</tspan><tspan x="58.0" dy="18">   completan la evaluación.</tspan></text><text x="58.0" y="952.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Smilkstein G. The family APGAR. J Fam Pract 1978;6:1231-9; Rakel Textbook of Family Medicine, 10.ª ed. (2021).</tspan></text></svg>