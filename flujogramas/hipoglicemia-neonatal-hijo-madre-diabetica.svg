<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Hijo de madre diabética"><title>Hijo de madre diabética</title><rect x="0.75" y="0.75" width="998.5" height="558.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16" y="16" width="968" height="56" rx="10" fill="#0f766e"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170" y1="34.0" x2="170" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="665"><tspan x="184.0" dy="0">PEDIATRÍA ENAM: HIJO DE MADRE DIABÉTICA</tspan></text><rect x="868.7" y="32.0" width="95.3" height="24" rx="12" fill="#134e4a"/><text x="916.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="79"><tspan x="916.4" dy="0">PEDIATRÍA</tspan></text><rect x="190.0" y="90.0" width="620" height="67.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="500.0" y="118.5" font-size="14.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Recién nacido macrosómico a término de 24 horas</tspan></text><text x="500.0" y="141.0" font-size="12" font-weight="400" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Hipoactividad sin signos de sepsis</tspan></text><line x1="500.0" y1="157.0" x2="500.0" y2="239.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,238.0 505.0,238.0 500.0,246.0" fill="#0f766e"/><rect x="330.0" y="246.0" width="340" height="100.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="273.5" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="500.0" dy="0">HIPOGLICEMIA NEONATAL</tspan></text><text x="500.0" y="296.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="500.0" dy="0">Hiperinsulinismo fetal que persiste</tspan><tspan x="500.0" dy="17">al cortarse la glucosa materna</tspan><tspan x="500.0" dy="17">Glucemia &lt; 45–47 mg/dL</tspan></text><line x1="310.0" y1="235.0" x2="330.0" y2="235.0" stroke="#0ea5e9" stroke-width="2"/><circle cx="330.0" cy="235.0" r="4" fill="#0ea5e9"/><rect x="40.0" y="185.0" width="270" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="186.0" width="6" height="98.0" rx="3" fill="#0ea5e9"/><text x="184.0" y="212.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="224"><tspan x="184.0" dy="0">Clínica</tspan></text><text x="184.0" y="235.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="224"><tspan x="184.0" dy="0">Hipoactividad, temblores,</tspan><tspan x="184.0" dy="17">apneas, convulsiones</tspan><tspan x="184.0" dy="17">(o asintomática)</tspan></text><line x1="690.0" y1="235.0" x2="670.0" y2="235.0" stroke="#8b5cf6" stroke-width="2"/><circle cx="670.0" cy="235.0" r="4" fill="#8b5cf6"/><rect x="690.0" y="185.0" width="270" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="691.0" y="186.0" width="6" height="98.0" rx="3" fill="#8b5cf6"/><text x="834.0" y="212.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="224"><tspan x="834.0" dy="0">Tratamiento</tspan></text><text x="834.0" y="235.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="224"><tspan x="834.0" dy="0">Alimentación precoz</tspan><tspan x="834.0" dy="17">Sintomático: dextrosa 10 %</tspan><tspan x="834.0" dy="17">2 mL/kg EV + infusión</tspan></text><line x1="310.0" y1="357.0" x2="330.0" y2="357.0" stroke="#f59e0b" stroke-width="2"/><circle cx="330.0" cy="357.0" r="4" fill="#f59e0b"/><rect x="40.0" y="307.0" width="270" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="308.0" width="6" height="98.0" rx="3" fill="#f59e0b"/><text x="184.0" y="334.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="224"><tspan x="184.0" dy="0">Otras alteraciones</tspan></text><text x="184.0" y="357.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="224"><tspan x="184.0" dy="0">Hipocalcemia</tspan><tspan x="184.0" dy="17">Policitemia</tspan><tspan x="184.0" dy="17">Hiperbilirrubinemia</tspan></text><line x1="690.0" y1="357.0" x2="670.0" y2="357.0" stroke="#10b981" stroke-width="2"/><circle cx="670.0" cy="357.0" r="4" fill="#10b981"/><rect x="690.0" y="307.0" width="270" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="691.0" y="308.0" width="6" height="98.0" rx="3" fill="#10b981"/><text x="834.0" y="334.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="224"><tspan x="834.0" dy="0">Riesgos</tspan></text><text x="834.0" y="357.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="224"><tspan x="834.0" dy="0">Distrés respiratorio</tspan><tspan x="834.0" dy="17">Cardiomiopatía</tspan><tspan x="834.0" dy="17">Trauma obstétrico</tspan></text><rect x="40" y="433.0" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="461.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="483.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La hipoglicemia del HMD aparece en las primeras horas de vida.</tspan><tspan x="58.0" dy="18">• Controlar la glucemia de forma seriada en todo recién nacido macrosómico.</tspan></text><text x="58.0" y="523.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: INMP – Guías de Práctica Clínica en Neonatología · AAP · Nelson 22.ª ed.</tspan></text></svg>
