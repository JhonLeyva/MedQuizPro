<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="908" viewBox="0 0 1000 908" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Prematuro de 34 semanas con 48 horas, hipoactivo, con temblores y glucosa de 40 mg/dL: hipoglucemia sintomática, bolo de glucosa EV 200 mg/kg"><title>Prematuro de 34 semanas con 48 horas, hipoactivo, con temblores y glucosa de 40 mg/dL: hipoglucemia sintomática, bolo de glucosa EV 200 mg/kg</title><rect x="0.75" y="0.75" width="998.5" height="906.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neonatología · hipoglucemia</tspan></text><rect x="370.2" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="426.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="426.6" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hipoglucemia neonatal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Prematuros, hijos de madre diabética, pequeños o grandes para la edad: más riesgo.</tspan><tspan x="58.0" dy="17">Con síntomas (temblores, hipotonía, apneas, convulsiones) se corrige por vena aunque la</tspan><tspan x="58.0" dy="17">cifra no sea muy baja.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">RN de 34 semanas, 48 horas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Taquipnea, vómitos tras lactar, hipoactivo y con</tspan><tspan x="640.0" dy="16">temblores.</tspan><tspan x="640.0" dy="16">Glucosa 40 mg/dL; hemograma normal.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">GLUCOSA DEL RECIÉN NACIDO</tspan></text><rect x="40.0" y="285.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="311.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Glucemia (mg/dL) en el recién nacido</tspan></text><text x="60.0" y="330.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Cualquier síntoma con glucosa baja = tratamiento EV.</tspan></text><rect x="70.0" y="394.0" width="215.0" height="40.0" rx="6" fill="#fecdd3" stroke="#ffffff" stroke-width="2"/><text x="177.5" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#9f1239" text-anchor="middle" data-max="205"><tspan x="177.5" dy="0">&lt; 25: EV ya</tspan></text><rect x="285.0" y="394.0" width="172.0" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="371.0" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="162"><tspan x="371.0" dy="0">Baja</tspan></text><rect x="457.0" y="394.0" width="129.0" height="40.0" rx="6" fill="#fef9c3" stroke="#ffffff" stroke-width="2"/><text x="521.5" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#a16207" text-anchor="middle" data-max="119"><tspan x="521.5" dy="0">Límite</tspan></text><rect x="586.0" y="394.0" width="344.0" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="758.0" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="334"><tspan x="758.0" dy="0">Normal (&gt; 48 h)</tspan></text><line x1="285.0" y1="434.0" x2="285.0" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="285.0" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="285.0" dy="0">25</tspan></text><line x1="457.0" y1="434.0" x2="457.0" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="457.0" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="457.0" dy="0">45</tspan></text><line x1="586.0" y1="434.0" x2="586.0" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="586.0" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="586.0" dy="0">60</tspan></text><polygon points="405.0,380.0 423.0,380.0 414.0,392.0" fill="#ea580c"/><rect x="325.0" y="354.0" width="178.0" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="414.0" y="369.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="166"><tspan x="414.0" dy="0">◆ ESTE CASO: 40 + síntomas</tspan></text><text x="40.0" y="502.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ HACER</tspan></text><rect x="40.0" y="512.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="513.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="536.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Bolo EV</tspan></text><text x="58.0" y="557.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Dextrosa 10 %: 2 mL/kg</tspan></text><rect x="351.3" y="512.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="352.3" y="513.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="369.3" y="536.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Infusión</tspan></text><text x="369.3" y="557.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">6-8 mg/kg/min</tspan></text><rect x="662.7" y="512.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="513.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="536.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Controlar</tspan></text><text x="680.7" y="557.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">30-60 min después</tspan></text><text x="40.0" y="621.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="631.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="662.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="653.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Aportar leche</tspan><tspan x="285.0" dy="17">materna</tspan></text><rect x="363.0" y="634.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="653.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">200 mg/kg de</tspan><tspan x="435.0" dy="17">glucosa EV</tspan></text><text x="585.0" y="653.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Dar leche</tspan><tspan x="585.0" dy="17">maternizada</tspan></text><text x="735.0" y="653.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Solución glucosada</tspan><tspan x="735.0" dy="17">al 5% VO</tspan></text><text x="885.0" y="662.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Fototerapia</tspan></text><rect x="40.0" y="685.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="685.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="714.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tratamiento?</tspan></text><text x="285.0" y="706.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: con síntomas no</tspan><tspan x="285.0" dy="16">basta la vía oral</tspan></text><text x="435.0" y="714.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: sintomático = EV</tspan></text><text x="585.0" y="714.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no basta</tspan></text><text x="735.0" y="714.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: con síntomas, EV</tspan></text><text x="885.0" y="714.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es para ictericia</tspan></text><rect x="40.0" y="631.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="759.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="787.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="809.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Bolo de dextrosa al 10 % 2 mL/kg (200 mg/kg) EV en 5-10 min.</tspan><tspan x="58.0" dy="18">• Seguir con infusión de 6-8 mg/kg/min y controlar a los 30-60 min.</tspan><tspan x="58.0" dy="18">• Meta: &gt; 45-50 mg/dL en las primeras 48 h y &gt; 60 mg/dL después (PES).</tspan></text><text x="58.0" y="867.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAP, hipoglucemia neonatal (2011); Pediatric Endocrine Society (2015); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>