<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1308" viewBox="0 0 1000 1308" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Niño con respiración bucal y facies adenoidea: la radiografía lateral del cavum confirma la sospecha"><title>Niño con respiración bucal y facies adenoidea: la radiografía lateral del cavum confirma la sospecha</title><rect x="0.75" y="0.75" width="998.5" height="1306.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">ORL pediátrica · hipertrofia adenoidea</tspan></text><rect x="425.3" y="32.0" width="162.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="506.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="146"><tspan x="506.5" dy="0">OFTALMOLOGÍA Y ORL RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hipertrofia adenoidea</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Causa más común de obstrucción nasal crónica en preescolares y escolares; pico de 3 a 7</tspan><tspan x="58.0" dy="17">años.</tspan><tspan x="58.0" dy="17">Produce respiración bucal, ronquido, voz hiponasal y otitis con efusión.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño con respiración bucal</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Facies adenoidea: boca abierta, labio superior corto,</tspan><tspan x="640.0" dy="16">paladar ojival y ojeras.</tspan><tspan x="640.0" dy="16">¿Qué examen radiológico confirma la sospecha?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SE PIENSA EN ESTE ORDEN</tspan></text><rect x="40.0" y="285.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="330.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="358.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">1</tspan></text><rect x="124.0" y="285.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="313.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Qué tiene el niño?</tspan></text><rect x="136.0" y="327.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="347.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Hipertrofia adenoidea con facies adenoidea</tspan></text><text x="152.0" y="366.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Respiración bucal, ronquido, voz hiponasal y sueño inquieto.</tspan></text><line x1="77.0" y1="388.0" x2="77.0" y2="407.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,406.0 82.0,406.0 77.0,414.0" fill="#0f766e"/><text x="134.0" y="406.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="416.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="461.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="489.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">2</tspan></text><rect x="124.0" y="416.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="444.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Qué examen radiológico lo confirma?</tspan></text><rect x="136.0" y="458.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="478.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Radiografía lateral del cavum</tspan></text><text x="152.0" y="497.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Relación entre el tejido adenoideo y el espacio nasofaríngeo; sin sedación.</tspan></text><line x1="77.0" y1="519.0" x2="77.0" y2="538.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,537.0 82.0,537.0 77.0,545.0" fill="#0f766e"/><text x="134.0" y="537.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="547.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="592.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="620.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">3</tspan></text><rect x="124.0" y="547.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="575.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Y si hay dudas?</tspan></text><rect x="136.0" y="589.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="609.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Nasofibroscopía flexible</tspan></text><text x="152.0" y="628.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Estándar de oro: ve las coanas obstruidas; más invasiva.</tspan></text><rect x="40.0" y="668.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="694.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Facies adenoidea = radiografía de cavum</tspan></text><text x="60.0" y="713.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Senos paranasales, mastoides, tabique y panorámica estudian otras regiones.</tspan></text><text x="40.0" y="774.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ ESTUDIA CADA RADIOGRAFÍA DE LA REGIÓN</tspan></text><rect x="40.0" y="786.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="805.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Examen</tspan></text><text x="350.0" y="805.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="294"><tspan x="350.0" dy="0">Qué evalúa</tspan></text><text x="660.0" y="805.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="294"><tspan x="660.0" dy="0">En este caso</tspan></text><rect x="40.0" y="815.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="834.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Radiografía lateral del cavum</tspan></text><text x="350.0" y="834.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="350.0" dy="0">Tejido adenoideo y columna aérea nasofaríngea</tspan></text><text x="660.0" y="834.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="660.0" dy="0">Confirma la hipertrofia adenoidea</tspan></text><rect x="240.6" y="818.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="286.0" y="833.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="844.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="863.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Senos paranasales</tspan></text><text x="350.0" y="863.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="350.0" dy="0">Sospecha de sinusitis</tspan></text><text x="660.0" y="863.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="660.0" dy="0">No corresponde</tspan></text><rect x="40.0" y="873.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="892.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Mastoides</tspan></text><text x="350.0" y="892.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="350.0" dy="0">Patología ótica</tspan></text><text x="660.0" y="892.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="660.0" dy="0">No corresponde</tspan></text><rect x="40.0" y="902.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="921.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Panorámica dental</tspan></text><text x="350.0" y="921.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="350.0" dy="0">Dientes</tspan></text><text x="660.0" y="921.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="294"><tspan x="660.0" dy="0">No corresponde</tspan></text><text x="40.0" y="971.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="981.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1003.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1003.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Senos paranasales</tspan></text><text x="435.0" y="1003.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Tabique nasal</tspan></text><text x="585.0" y="1003.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Mastoides</tspan></text><rect x="663.0" y="984.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="1003.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Cavum</tspan></text><text x="885.0" y="1003.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Panorámica</tspan></text><rect x="40.0" y="1018.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="1018.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1055.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Examen que confirma?</tspan></text><text x="285.0" y="1047.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: sirve en sospecha</tspan><tspan x="285.0" dy="16">de sinusitis</tspan></text><text x="435.0" y="1047.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no es un estudio</tspan><tspan x="435.0" dy="16">de rutina</tspan></text><text x="585.0" y="1047.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sirve en patología</tspan><tspan x="585.0" dy="16">ótica</tspan></text><text x="735.0" y="1039.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: muestra el tejido</tspan><tspan x="735.0" dy="16">adenoideo y la</tspan><tspan x="735.0" dy="16">columna aérea</tspan></text><text x="885.0" y="1055.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: evalúa los dientes</tspan></text><rect x="40.0" y="981.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1108.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1136.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1158.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Radiografía lateral del cavum: mide el espesor del tejido adenoideo frente al espacio óseo nasofaríngeo y muestra la columna aérea posterior reducida;</tspan><tspan x="58.0" dy="18">   es barata y rápida.</tspan><tspan x="58.0" dy="18">• La nasofibroscopía flexible es el estándar de oro porque visualiza la obstrucción de las coanas, pero es más invasiva; se reserva para casos dudosos.</tspan><tspan x="58.0" dy="18">• Tratamiento: corticoide nasal en cuadros leves; adenoidectomía si hay obstrucción importante, infecciones recurrentes u otitis con efusión persistente.</tspan><tspan x="58.0" dy="18">• Alerta: masa nasofaríngea con epistaxis en un adolescente varón obliga a descartar angiofibroma juvenil.</tspan></text><text x="58.0" y="1252.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAO-HNSF, Clinical Practice Guideline: Tonsillectomy in Children (Update), Otolaryngol Head Neck Surg 2019; Cummings Otolaryngology 7.ª ed. (2021); Nelson Tratado</tspan><tspan x="58.0" dy="15">de Pediatría 22.ª ed. (2024).</tspan></text></svg>