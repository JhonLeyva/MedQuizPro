<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1025" viewBox="0 0 1000 1025" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Con 0,20 g/100 mL (200 mg/dL) el efecto habitual es la incoordinación motriz"><title>Con 0,20 g/100 mL (200 mg/dL) el efecto habitual es la incoordinación motriz</title><rect x="0.75" y="0.75" width="998.5" height="1023.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Psiquiatría · alcoholemia y clínica</tspan></text><rect x="398.9" y="32.0" width="109.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="453.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="93"><tspan x="453.6" dy="0">PSIQUIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Alcoholemia y clínica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La relación cifra y efecto es orientativa.</tspan><tspan x="58.0" dy="17">Se oxida unos 15 a 20 mg/dL por hora, más rápido en bebedores crónicos.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 38 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Tomó licor todo el día; se instauran medidas generales.</tspan><tspan x="640.0" dy="16">Dosaje de alcohol de 0,20 g/100 mL.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SE ESPERA SEGÚN LA ALCOHOLEMIA</tspan></text><line x1="290.0" y1="291.0" x2="290.0" y2="485.0" stroke="#e2e8f0" stroke-width="1"/><text x="290.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="290.0" dy="0">0</tspan></text><line x1="371.2" y1="291.0" x2="371.2" y2="485.0" stroke="#e2e8f0" stroke-width="1"/><text x="371.2" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="371.2" dy="0">50</tspan></text><line x1="452.5" y1="291.0" x2="452.5" y2="485.0" stroke="#e2e8f0" stroke-width="1"/><text x="452.5" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="452.5" dy="0">100</tspan></text><line x1="533.8" y1="291.0" x2="533.8" y2="485.0" stroke="#e2e8f0" stroke-width="1"/><text x="533.8" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="533.8" dy="0">150</tspan></text><line x1="615.0" y1="291.0" x2="615.0" y2="485.0" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="615.0" dy="0">200</tspan></text><line x1="696.2" y1="291.0" x2="696.2" y2="485.0" stroke="#e2e8f0" stroke-width="1"/><text x="696.2" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="696.2" dy="0">250</tspan></text><line x1="777.5" y1="291.0" x2="777.5" y2="485.0" stroke="#e2e8f0" stroke-width="1"/><text x="777.5" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="777.5" dy="0">300</tspan></text><line x1="858.8" y1="291.0" x2="858.8" y2="485.0" stroke="#e2e8f0" stroke-width="1"/><text x="858.8" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="858.8" dy="0">350</tspan></text><line x1="940.0" y1="291.0" x2="940.0" y2="485.0" stroke="#e2e8f0" stroke-width="1"/><text x="940.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="940.0" dy="0">400</tspan></text><text x="940.0" y="273.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="end" data-max="60"><tspan x="940.0" dy="0">mg/dL</tspan></text><rect x="40.0" y="295.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="311.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Desinhibición leve</tspan></text><text x="48.0" y="326.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Locuacidad y euforia</tspan></text><rect x="322.5" y="303.0" width="65.0" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="349.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Juicio y coordinación fina alterados</tspan></text><text x="48.0" y="364.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Inhibiciones reducidas</tspan></text><rect x="387.5" y="341.0" width="65.0" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><rect x="40.0" y="371.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="387.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Ataxia y atención alterada</tspan></text><text x="48.0" y="402.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Marcha inestable</tspan></text><rect x="452.5" y="379.0" width="162.5" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="425.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Incoordinación motriz (este caso)</tspan></text><text x="48.0" y="440.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Confusión, náuseas y vómitos</tspan></text><rect x="615.0" y="417.0" width="162.5" height="22.0" rx="6" fill="#ea580c" stroke="none" stroke-width="1.5"/><rect x="40.0" y="447.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="463.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Coma</tspan></text><text x="48.0" y="478.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Pérdida de conciencia</tspan></text><rect x="777.5" y="455.0" width="162.5" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><line x1="615.0" y1="293.0" x2="615.0" y2="491.0" stroke="#b91c1c" stroke-width="2.6"/><rect x="568.4" y="491.0" width="93.2" height="22.0" rx="11" fill="#b91c1c" stroke="none" stroke-width="1.5"/><text x="615.0" y="506.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="615.0" dy="0">0,20 g/100 mL</tspan></text><rect x="40.0" y="537.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="563.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">0,20 g/100 mL = incoordinación motriz</tspan></text><text x="60.0" y="582.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Inhibiciones reducidas es de cifras menores; coma leve y depresión de signos vitales, de mayores.</tspan></text><text x="40.0" y="649.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="659.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="698.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="681.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Disminución de</tspan><tspan x="285.0" dy="17">funciones</tspan><tspan x="285.0" dy="17">cognitivas</tspan></text><rect x="363.0" y="662.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="690.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Incoordinación</tspan><tspan x="435.0" dy="17">motriz</tspan></text><text x="585.0" y="690.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Depresión de</tspan><tspan x="585.0" dy="17">signos vitales</tspan></text><text x="735.0" y="690.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Inhibiciones</tspan><tspan x="735.0" dy="17">reducidas</tspan></text><text x="885.0" y="698.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Coma leve</tspan></text><rect x="40.0" y="730.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="730.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="751.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Efecto habitual con</tspan><tspan x="54.0" dy="16">0,20?</tspan></text><text x="285.0" y="751.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: aparece con cifras</tspan><tspan x="285.0" dy="16">menores</tspan></text><text x="435.0" y="751.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: ataxia, lenguaje</tspan><tspan x="435.0" dy="16">farfullante y nistagmo</tspan></text><text x="585.0" y="751.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: ocurre con cifras</tspan><tspan x="585.0" dy="16">mucho mayores</tspan></text><text x="735.0" y="751.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: corresponde a</tspan><tspan x="735.0" dy="16">cifras menores</tspan></text><text x="885.0" y="751.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: corresponde a</tspan><tspan x="885.0" dy="16">0,30 a 0,40</tspan></text><rect x="40.0" y="659.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="804.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="832.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="854.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• 0,02 a 0,05 desinhibición leve; 0,06 a 0,10 deterioro del juicio y la coordinación fina; 0,10 a 0,20 ataxia y atención alterada; 0,20 a 0,30 confusión, vómitos</tspan><tspan x="58.0" dy="18">   y estupor.</tspan><tspan x="58.0" dy="18">• Con 0,20 g/100 mL predomina la incoordinación motriz: marcha atáxica, lenguaje farfullante, nistagmo y reflejos lentos. Las inhibiciones reducidas</tspan><tspan x="58.0" dy="18">   corresponden a cifras menores.</tspan><tspan x="58.0" dy="18">• Coma de 0,30 a 0,40 y depresión respiratoria o paro con más de 0,40; depresión de signos vitales y coma leve son de cifras mucho mayores.</tspan><tspan x="58.0" dy="18">• Medidas generales: vía aérea, posición lateral si vomita, glucemia capilar, tiamina antes de la glucosa y corrección de electrolitos; descartar trauma</tspan><tspan x="58.0" dy="18">   craneal.</tspan></text><text x="58.0" y="984.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Goldfrank Toxicologic Emergencies 11.ª ed. (2019); Harrison Principios de Medicina Interna 22.ª ed. (2025); Kaplan y Sadock Sinopsis de Psiquiatría 12.ª ed. (2021).</tspan></text></svg>