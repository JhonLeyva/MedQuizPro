ll="#f87171" text-anchor="end" data-max="106"><tspan x="480.0" dy="0">cmH₂O ▲</tspan></text><rect x="58.0" y="603.0" width="211.0" height="82.0" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="1.5"/><text x="70.0" y="625.0" font-size="11.5" font-weight="800" font-style="normal" fill="#f87171" text-anchor="start" data-max="187"><tspan x="70.0" dy="0">YUGULARES</tspan></text><text x="163.5" y="661.0" font-size="26" font-weight="800" font-style="normal" fill="#f87171" text-anchor="middle" data-max="187"><tspan x="163.5" dy="0">ingurgitadas</tspan></text><text x="257.0" y="625.0" font-size="10.5" font-weight="700" font-style="normal" fill="#f87171" text-anchor="end" data-max="106"><tspan x="257.0" dy="0"> ▲</tspan></text><rect x="281.0" y="603.0" width="211.0" height="82.0" rx="10" fill="#0c1e3d" stroke="#60a5fa" stroke-width="1.5"/><text x="293.0" y="625.0" font-size="11.5" font-weight="800" font-style="normal" fill="#60a5fa" text-anchor="start" data-max="187"><tspan x="293.0" dy="0">RUIDOS</tspan></text><text x="386.5" y="661.0" font-size="26" font-weight="800" font-style="normal" fill="#60a5fa" text-anchor="middle" data-max="187"><tspan x="386.5" dy="0">apagados</tspan></text><text x="480.0" y="625.0" font-size="10.5" font-weight="700" font-style="normal" fill="#60a5fa" text-anchor="end" data-max="106"><tspan x="480.0" dy="0"> ▼</tspan></text><rect x="528.0" y="368.0" width="432.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="543.0" y="393.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Hipotensión + yugulares + ruidos apagados</tspan></text><text x="543.0" y="410.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Tríada de Beck.</tspan></text><rect x="528.0" y="433.0" width="432.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="543.0" y="458.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">PVC 15 cmH₂O</tspan></text><text x="543.0" y="475.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Presión venosa alta: el corazón no se llena.</tspan></text><rect x="528.0" y="498.0" width="432.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="543.0" y="523.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Ecografía FAST</tspan></text><text x="543.0" y="540.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Hemopericardio en segundos.</tspan></text><rect x="528.0" y="563.0" width="432.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="543.0" y="588.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Conducta</tspan></text><text x="543.0" y="605.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Toracotomía o esternotomía; volumen mientras tanto.</tspan></text><rect x="40.0" y="721.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="747.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Herida precordial + Beck = taponamiento</tspan></text><text x="60.0" y="766.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Drenar y reparar el corazón.</tspan></text><text x="40.0" y="833.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="843.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="874.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="846.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="865.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Taponamiento</tspan><tspan x="285.0" dy="17">cardiaco</tspan></text><text x="435.0" y="865.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Neumotórax a</tspan><tspan x="435.0" dy="17">tensión</tspan></text><text x="585.0" y="865.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Infarto agudo de</tspan><tspan x="585.0" dy="17">miocardio</tspan></text><text x="735.0" y="874.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ruptura ventricular</tspan></text><text x="885.0" y="874.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Embolia pulmonar</tspan></text><rect x="40.0" y="897.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="897.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="926.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="926.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: tríada de Beck</tspan></text><text x="435.0" y="918.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: tráquea desviada,</tspan><tspan x="435.0" dy="16">hiperresonancia</tspan></text><text x="585.0" y="918.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sin los hallazgos</tspan><tspan x="585.0" dy="16">del ECG</tspan></text><text x="735.0" y="926.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: poco frecuente</tspan></text><text x="885.0" y="918.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: sin factores de</tspan><tspan x="885.0" dy="16">riesgo</tspan></text><rect x="40.0" y="843.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="971.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="999.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1021.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Tríada de Beck: hipotensión, ingurgitación yugular y ruidos apagados. FAST con ventana pericárdica confirma el hemopericardio.</tspan><tspan x="58.0" dy="18">• Inestable: toracotomía o esternotomía de urgencia; pericardiocentesis solo como puente. Volumen IV mientras tanto.</tspan><tspan x="58.0" dy="18">• En el neumotórax a tensión la tráquea se desvía y el hemitórax es hiperresonante.</tspan></text><text x="58.0" y="1079.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ATLS 11.ª ed. (2025); Schwartz Principios de Cirugía 11.ª ed.</tspan></text></svg>