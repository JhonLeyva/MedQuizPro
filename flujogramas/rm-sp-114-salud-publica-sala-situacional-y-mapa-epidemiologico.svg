<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1051" viewBox="0 0 1000 1051" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Un mapa de casos de EDA cruzado con el tipo de agua de los hogares es información de la sala situacional"><title>Un mapa de casos de EDA cruzado con el tipo de agua de los hogares es información de la sala situacional</title><rect x="0.75" y="0.75" width="998.5" height="1049.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Salud pública · sala situacional y mapa epidemiológico</tspan></text><rect x="524.0" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="588.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="588.3" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Sala situacional</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Espacio físico o virtual que reúne y analiza datos del territorio para decidir.</tspan><tspan x="58.0" dy="17">Mapas, tendencias, tablas y alertas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Centro de salud con mapa de EDA</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Casos mensuales ubicados en el mapa.</tspan><tspan x="640.0" dy="16">Se observa relación con hogares de agua inadecuada.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL DATO AL PLAN LOCAL DE CONTROL DE LA EDA</tspan></text><text x="40.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="430"><tspan x="40.0" dy="0">QUÉ SE HACE</tspan></text><text x="516.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="444"><tspan x="516.0" dy="0">INSTRUMENTO</tspan></text><rect x="40.0" y="291.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="320.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="325.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><text x="84.0" y="317.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Ubicar los casos de EDA cada mes</tspan></text><text x="84.0" y="334.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Mapa epidemiológico del territorio</tspan></text><line x1="476.0" y1="320.5" x2="503.0" y2="320.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,315.5 502.0,325.5 510.0,320.5" fill="#ea580c"/><rect x="516.0" y="293.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="317.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Mapa de casos</tspan></text><text x="530.0" y="334.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0"></tspan></text><line x1="255.0" y1="352.0" x2="255.0" y2="365.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,364.0 260.0,364.0 255.0,372.0" fill="#0f766e"/><rect x="40.0" y="374.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="403.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="408.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">2</tspan></text><text x="84.0" y="400.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Cruzar con el tipo de agua de cada hogar</tspan></text><text x="84.0" y="417.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Relación entre daño y determinante</tspan></text><line x1="476.0" y1="403.5" x2="503.0" y2="403.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,398.5 502.0,408.5 510.0,403.5" fill="#ea580c"/><rect x="516.0" y="376.0" width="444.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="530.0" y="400.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Sala situacional</tspan></text><text x="530.0" y="417.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Caso del enunciado</tspan></text><line x1="255.0" y1="435.0" x2="255.0" y2="448.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,447.0 260.0,447.0 255.0,455.0" fill="#0f766e"/><rect x="40.0" y="457.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="486.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="491.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">3</tspan></text><text x="84.0" y="483.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Decidir la intervención local</tspan></text><text x="84.0" y="500.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Cloración, calidad del agua y educación sanitaria</tspan></text><line x1="476.0" y1="486.5" x2="503.0" y2="486.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,481.5 502.0,491.5 510.0,486.5" fill="#ea580c"/><rect x="516.0" y="459.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="483.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Plan local de control</tspan></text><text x="530.0" y="500.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0"></tspan></text><line x1="255.0" y1="518.0" x2="255.0" y2="531.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,530.0 260.0,530.0 255.0,538.0" fill="#0f766e"/><rect x="40.0" y="540.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="569.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="574.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">4</tspan></text><text x="84.0" y="566.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Seguir los indicadores frente a las metas</tspan></text><text x="84.0" y="583.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Vigilancia mensual de la tendencia</tspan></text><line x1="476.0" y1="569.5" x2="503.0" y2="569.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,564.5 502.0,574.5 510.0,569.5" fill="#ea580c"/><rect x="516.0" y="542.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="566.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Estadísticas y metas</tspan></text><text x="530.0" y="583.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">No cruzan factores</tspan></text><rect x="40.0" y="617.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="643.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Mapa con casos y determinantes = sala situacional</tspan></text><text x="60.0" y="662.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Estadísticas de gestión y avance de metas solo miden producción y cumplimiento.</tspan></text><text x="40.0" y="729.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="739.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="778.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="742.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="778.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">La sala situacional</tspan></text><text x="435.0" y="770.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Estadísticas de</tspan><tspan x="435.0" dy="17">gestión sanitaria</tspan></text><text x="585.0" y="770.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">El avance de metas</tspan><tspan x="585.0" dy="17">sanitarias</tspan></text><text x="735.0" y="770.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">El monitoreo</tspan><tspan x="735.0" dy="17">situacional</tspan></text><text x="885.0" y="761.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">El monitoreo</tspan><tspan x="885.0" dy="17">epidemiológico</tspan><tspan x="885.0" dy="17">integral</tspan></text><rect x="40.0" y="810.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="810.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="831.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Dónde está esa</tspan><tspan x="54.0" dy="16">información?</tspan></text><text x="285.0" y="831.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: mapa con casos y</tspan><tspan x="285.0" dy="16">determinantes</tspan></text><text x="435.0" y="831.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: miden producción,</tspan><tspan x="435.0" dy="16">no relacionan riesgos</tspan></text><text x="585.0" y="831.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: miden</tspan><tspan x="585.0" dy="16">cumplimiento de metas</tspan></text><text x="735.0" y="831.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no es</tspan><tspan x="735.0" dy="16">denominación de uso</tspan></text><text x="885.0" y="831.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no es</tspan><tspan x="885.0" dy="16">denominación de uso</tspan></text><rect x="40.0" y="739.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="884.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="912.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="934.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La sala situacional superpone daños y determinantes (agua, saneamiento, pobreza, cobertura) y sigue los indicadores mes a mes frente a las metas.</tspan><tspan x="58.0" dy="18">• Aquí el cruce casos de EDA y abastecimiento de agua orienta cloración, vigilancia de la calidad del agua y educación sanitaria.</tspan><tspan x="58.0" dy="18">• Las estadísticas de gestión y el avance de metas miden producción y cumplimiento, sin relacionar factores de riesgo con casos.</tspan><tspan x="58.0" dy="18">• Perla: mapa de riesgo con casos y determinantes superpuestos = sala situacional. «Monitoreo situacional» no es denominación de uso.</tspan></text><text x="58.0" y="1010.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OPS/OMS, Sala de situación de salud, conceptos y uso para la toma de decisiones; Piédrola Gil, Medicina Preventiva y Salud Pública, 12.ª ed. (2015).</tspan></text></svg>