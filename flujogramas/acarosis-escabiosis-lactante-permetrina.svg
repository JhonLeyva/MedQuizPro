<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1004" viewBox="0 0 820 1004" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Acarosis (escabiosis) en el lactante: permetrina"><title>Acarosis (escabiosis) en el lactante: permetrina</title><rect width="820" height="1004" fill="#ffffff"/><rect x="0" y="0" width="820" height="112" fill="#0f766e"/><text x="40" y="34" font-size="13" font-weight="600" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="740"><tspan x="40" dy="0">MedQuizPlus · Flujograma</tspan></text><text x="40" y="70" font-size="24" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="740"><tspan x="40" dy="0">Acarosis (escabiosis) en el lactante: permetrina</tspan></text><text x="40" y="96" font-size="13" font-weight="400" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="740"><tspan x="40" dy="0">ENAM 2020 · REU-005 · Reumatología y Dermatología</tspan></text><rect x="90" y="144" width="640" height="76" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="108" y="172" font-size="11" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="604"><tspan x="108" dy="0">INICIO</tspan></text><text x="108" y="196" font-size="16" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Prurito de predominio nocturno</tspan></text><line x1="410.0" y1="222" x2="410.0" y2="242" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,240 417.0,240 410.0,250" fill="#94a3b8"/><rect x="90" y="252" width="640" height="76" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><circle cx="120" cy="290.0" r="12" fill="#d97706"/><text x="120" y="295.0" font-size="15" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="120" dy="0">?</tspan></text><text x="142" y="280" font-size="11" font-weight="700" font-style="normal" fill="#b45309" text-anchor="start" data-max="570"><tspan x="142" dy="0">DECISIÓN</tspan></text><text x="142" y="304" font-size="16" font-weight="600" font-style="normal" fill="#78350f" text-anchor="start" data-max="570"><tspan x="142" dy="0">¿Convivientes con lesiones o prurito similar?</tspan></text><line x1="410.0" y1="330" x2="410.0" y2="350" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,348 417.0,348 410.0,358" fill="#94a3b8"/><rect x="90" y="360" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="388" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="412" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Pápulas, vesículas y surcos; en lactantes también palmas,</tspan><tspan x="108" dy="22">plantas y cara</tspan></text><line x1="410.0" y1="460" x2="410.0" y2="480" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,478 417.0,478 410.0,488" fill="#94a3b8"/><rect x="90" y="490" width="640" height="76" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="518" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="542" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Diagnóstico clínico (raspado para ver el ácaro si hay duda)</tspan></text><line x1="410.0" y1="568" x2="410.0" y2="588" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,586 417.0,586 410.0,596" fill="#94a3b8"/><rect x="90" y="598" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="626" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="650" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Permetrina al 5 % en todo el cuerpo, incluyendo cara y cuero</tspan><tspan x="108" dy="22">cabelludo en lactantes; repetir a los 7 días</tspan></text><line x1="410.0" y1="698" x2="410.0" y2="718" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,716 417.0,716 410.0,726" fill="#94a3b8"/><rect x="90" y="728" width="640" height="98" rx="12" fill="#134e4a" stroke="#134e4a" stroke-width="2"/><text x="108" y="756" font-size="11" font-weight="700" font-style="normal" fill="#5eead4" text-anchor="start" data-max="604"><tspan x="108" dy="0">CONDUCTA FINAL</tspan></text><text x="108" y="780" font-size="16" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Tratar a todos los contactos a la vez y lavar ropa y sábanas</tspan><tspan x="108" dy="22">con agua caliente</tspan></text><rect x="40" y="856" width="740" height="98" rx="10" fill="#f0fdfa" stroke="#99f6e4"/><rect x="40" y="856" width="6" height="98" rx="3" fill="#14b8a6"/><text x="62" y="882" font-size="14" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="704"><tspan x="62" dy="0">Perla clínica</tspan></text><text x="62" y="906" font-size="15" font-weight="400" font-style="normal" fill="#134e4a" text-anchor="start" data-max="704"><tspan x="62" dy="0">Si no se trata a toda la familia al mismo tiempo, la reinfestación es la</tspan><tspan x="62" dy="21">regla.</tspan></text><text x="410.0" y="982" font-size="11" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="740"><tspan x="410.0" dy="0">MedQuizPlus · Material de estudio: contrasta siempre con las guías clínicas vigentes.</tspan></text></svg>
