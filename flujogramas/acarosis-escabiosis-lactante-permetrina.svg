<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="572" viewBox="0 0 1000 572" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Escabiosis en el lactante"><title>Escabiosis en el lactante</title><rect x="0.75" y="0.75" width="998.5" height="570.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16" y="16" width="968" height="68" rx="10" fill="#0f766e"/><text x="36" y="57.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170" y1="40.0" x2="170" y2="60.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="46.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="526"><tspan x="184.0" dy="0">REUMATOLOGÍA Y DERMATOLOGÍA ENAM: ESCABIOSIS EN EL</tspan><tspan x="184.0" dy="16">LACTANTE</tspan></text><rect x="730.1" y="38.0" width="233.9" height="24" rx="12" fill="#134e4a"/><text x="847.0" y="54.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="218"><tspan x="847.0" dy="0">REUMATOLOGÍA Y DERMATOLOGÍA</tspan></text><rect x="190.0" y="102.0" width="620" height="67.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="500.0" y="130.5" font-size="14.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Lactante de 8 meses con prurito nocturno</tspan></text><text x="500.0" y="153.0" font-size="12" font-weight="400" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Pápulas, vesículas y pústulas en cara, palmas y plantas · madre igual</tspan></text><line x1="500.0" y1="169.0" x2="500.0" y2="251.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,250.0 505.0,250.0 500.0,258.0" fill="#0f766e"/><rect x="330.0" y="258.0" width="340" height="100.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="285.5" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="500.0" dy="0">ACAROSIS (ESCABIOSIS)</tspan></text><text x="500.0" y="308.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="500.0" dy="0">Sarcoptes scabiei</tspan><tspan x="500.0" dy="17">Prurito NOCTURNO + contagio familiar</tspan><tspan x="500.0" dy="17">Diagnóstico clínico</tspan></text><line x1="310.0" y1="247.0" x2="330.0" y2="247.0" stroke="#0ea5e9" stroke-width="2"/><circle cx="330.0" cy="247.0" r="4" fill="#0ea5e9"/><rect x="40.0" y="197.0" width="270" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="198.0" width="6" height="98.0" rx="3" fill="#0ea5e9"/><text x="184.0" y="224.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="224"><tspan x="184.0" dy="0">En lactantes</tspan></text><text x="184.0" y="247.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="224"><tspan x="184.0" dy="0">Afecta palmas, plantas,</tspan><tspan x="184.0" dy="17">cara y cuero</tspan><tspan x="184.0" dy="17">cabelludo</tspan></text><line x1="690.0" y1="247.0" x2="670.0" y2="247.0" stroke="#8b5cf6" stroke-width="2"/><circle cx="670.0" cy="247.0" r="4" fill="#8b5cf6"/><rect x="690.0" y="197.0" width="270" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="691.0" y="198.0" width="6" height="98.0" rx="3" fill="#8b5cf6"/><text x="834.0" y="224.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="224"><tspan x="834.0" dy="0">Tratamiento</tspan></text><text x="834.0" y="247.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="224"><tspan x="834.0" dy="0">Permetrina 5 %</tspan><tspan x="834.0" dy="17">todo el cuerpo</tspan><tspan x="834.0" dy="17">Repetir a los 7 días</tspan></text><line x1="310.0" y1="369.0" x2="330.0" y2="369.0" stroke="#f59e0b" stroke-width="2"/><circle cx="330.0" cy="369.0" r="4" fill="#f59e0b"/><rect x="40.0" y="319.0" width="270" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="320.0" width="6" height="98.0" rx="3" fill="#f59e0b"/><text x="184.0" y="346.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="224"><tspan x="184.0" dy="0">Contactos</tspan></text><text x="184.0" y="369.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="224"><tspan x="184.0" dy="0">Tratar a toda la</tspan><tspan x="184.0" dy="17">familia al mismo</tspan><tspan x="184.0" dy="17">tiempo</tspan></text><line x1="690.0" y1="369.0" x2="670.0" y2="369.0" stroke="#10b981" stroke-width="2"/><circle cx="670.0" cy="369.0" r="4" fill="#10b981"/><rect x="690.0" y="319.0" width="270" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="691.0" y="320.0" width="6" height="98.0" rx="3" fill="#10b981"/><text x="834.0" y="346.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="224"><tspan x="834.0" dy="0">Ambiente</tspan></text><text x="834.0" y="369.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="224"><tspan x="834.0" dy="0">Lavar ropa y sábanas</tspan><tspan x="834.0" dy="17">con agua caliente</tspan><tspan x="834.0" dy="17">o aislarlas 72 h</tspan></text><rect x="40" y="445.0" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="473.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="495.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Si no se trata a toda la familia a la vez, la reinfestación es la regla.</tspan><tspan x="58.0" dy="18">• El surco acarino es la lesión patognomónica.</tspan></text><text x="58.0" y="535.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: IUSTI/European Guideline Scabies 2017 · Red Book (AAP) 2024</tspan></text></svg>
