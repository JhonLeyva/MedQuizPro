<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1215" viewBox="0 0 1000 1215" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Dos crisis en 35 minutos sin recuperar la conciencia en un niño febril: estado epiléptico (convulsivo)"><title>Dos crisis en 35 minutos sin recuperar la conciencia en un niño febril: estado epiléptico (convulsivo)</title><rect x="0.75" y="0.75" width="998.5" height="1213.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · estado epiléptico febril</tspan></text><rect x="398.9" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="448.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="448.0" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Estado epiléptico</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">ILAE 2015: crisis que no se autolimita (t1 de 5 minutos en las tónico-clónicas) o que se</tspan><tspan x="58.0" dy="17">prolonga y puede dañar neuronas (t2 de 30 minutos).</tspan><tspan x="58.0" dy="17">También se acepta 2 o más crisis sin recuperar la conciencia entre ellas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 5 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Febril; en 35 minutos presentó 2 crisis tónico-clónicas</tspan><tspan x="640.0" dy="16">generalizadas.</tspan><tspan x="640.0" dy="16">No recuperó la conciencia entre ellas.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DURACIÓN DE LA CRISIS Y CONDUCTA</tspan></text><rect x="40.0" y="285.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="311.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Minutos desde el inicio de la crisis</tspan></text><text x="60.0" y="330.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El caso lleva 35 minutos con 2 crisis sin recuperar la conciencia.</tspan></text><rect x="70.0" y="394.0" width="107.5" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="123.8" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="98"><tspan x="123.8" dy="0">&lt; 5: estabilizar</tspan></text><rect x="177.5" y="394.0" width="537.5" height="40.0" rx="6" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/><text x="446.2" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#c2410c" text-anchor="middle" data-max="528"><tspan x="446.2" dy="0">5 a 30: tratar como estado epiléptico</tspan></text><rect x="715.0" y="394.0" width="215.0" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="822.5" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="205"><tspan x="822.5" dy="0">30 o más: riesgo de daño neuronal</tspan></text><line x1="70.0" y1="434.0" x2="70.0" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="70.0" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="70.0" dy="0">0 min</tspan></text><line x1="177.5" y1="434.0" x2="177.5" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="177.5" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="177.5" dy="0">5 min</tspan></text><line x1="500.0" y1="434.0" x2="500.0" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="500.0" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="500.0" dy="0">20 min</tspan></text><line x1="715.0" y1="434.0" x2="715.0" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="715.0" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="715.0" dy="0">30 min</tspan></text><line x1="930.0" y1="434.0" x2="930.0" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">40 min</tspan></text><polygon points="813.5,380.0 831.5,380.0 822.5,392.0" fill="#ea580c"/><rect x="753.5" y="354.0" width="138.1" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="822.5" y="369.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="126"><tspan x="822.5" dy="0">◆ CASO: 35 MINUTOS</tspan></text><text x="40.0" y="502.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ DIAGNÓSTICO CORRESPONDE</tspan></text><rect x="40.0" y="512.0" width="297.3" height="85.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="513.0" width="6.0" height="83.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="536.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Estado epiléptico (convulsivo)</tspan></text><text x="58.0" y="557.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">2 crisis sin recuperar la conciencia o más de 5 a</tspan><tspan x="58.0" dy="16">30 minutos</tspan></text><rect x="351.3" y="512.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="513.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="536.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Convulsión febril simple</tspan></text><text x="369.3" y="557.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Menos de 15 minutos, generalizada y única en 24</tspan><tspan x="369.3" dy="16">horas</tspan></text><rect x="662.7" y="512.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="513.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="536.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Epilepsia, West o crisis simple</tspan></text><text x="680.7" y="557.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Crisis no provocadas recurrentes, espasmos en</tspan><tspan x="680.7" dy="16">flexión o crisis breve</tspan></text><text x="40.0" y="631.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">MANEJO DEL ESTADO EPILÉPTICO CONVULSIVO (AES 2016)</tspan></text><rect x="40.0" y="643.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="662.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Tiempo</tspan></text><text x="270.0" y="662.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="684"><tspan x="270.0" dy="0">Conducta</tspan></text><rect x="40.0" y="672.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="691.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Desde el inicio</tspan></text><text x="270.0" y="691.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="684"><tspan x="270.0" dy="0">Vía aérea, oxígeno y glucemia capilar</tspan></text><rect x="40.0" y="701.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="720.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">5 minutos o más</tspan></text><text x="270.0" y="720.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="684"><tspan x="270.0" dy="0">Benzodiacepina: midazolam IM, lorazepam o diazepam IV o rectal; repetible una vez</tspan></text><rect x="160.6" y="704.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="206.0" y="719.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="206.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="730.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="749.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">20 minutos o más</tspan></text><text x="270.0" y="749.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="684"><tspan x="270.0" dy="0">Segunda línea: levetiracetam, fosfenitoína o valproato</tspan></text><rect x="40.0" y="759.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="778.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Refractario</tspan></text><text x="270.0" y="778.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="684"><tspan x="270.0" dy="0">Anestesia en cuidados intensivos</tspan></text><text x="40.0" y="828.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="838.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="877.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="877.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Epilepsia</tspan></text><rect x="363.0" y="841.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="877.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Estado convulsivo</tspan></text><text x="585.0" y="877.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Convulsión febril</tspan></text><text x="735.0" y="877.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Síndrome de West</tspan></text><text x="885.0" y="860.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Convulsión</tspan><tspan x="885.0" dy="17">tónico-clónica</tspan><tspan x="885.0" dy="17">simple</tspan></text><rect x="40.0" y="909.0" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="909.0" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="946.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico más</tspan><tspan x="54.0" dy="16">probable?</tspan></text><text x="285.0" y="938.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: exige crisis no</tspan><tspan x="285.0" dy="16">provocadas</tspan><tspan x="285.0" dy="16">recurrentes</tspan></text><text x="435.0" y="930.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: crisis sin</tspan><tspan x="435.0" dy="16">recuperación de la</tspan><tspan x="435.0" dy="16">conciencia por más de</tspan><tspan x="435.0" dy="16">30 minutos</tspan></text><text x="585.0" y="946.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: dura menos de 15</tspan><tspan x="585.0" dy="16">minutos y es única</tspan></text><text x="735.0" y="938.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es de lactantes,</tspan><tspan x="735.0" dy="16">con espasmos en</tspan><tspan x="735.0" dy="16">flexión</tspan></text><text x="885.0" y="946.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: cede en pocos</tspan><tspan x="885.0" dy="16">minutos</tspan></text><rect x="40.0" y="838.0" width="920.0" height="153.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1015.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1043.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1065.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La fiebre no cambia el diagnóstico: la convulsión febril simple dura menos de 15 minutos, es generalizada y única en 24 horas; este niño no cumple eso.</tspan><tspan x="58.0" dy="18">• Manejo (AES 2016): vía aérea, oxígeno y glucemia; benzodiacepina de primera línea (midazolam IM, lorazepam o diazepam IV o rectal), repetible una</tspan><tspan x="58.0" dy="18">   vez.</tspan><tspan x="58.0" dy="18">• Si persiste a los 20 minutos: levetiracetam, fosfenitoína o valproato; anestesia en el refractario.</tspan><tspan x="58.0" dy="18">• Alerta: niño febril con estado epiléptico, descartar meningitis o encefalitis; punción lumbar una vez estabilizado.</tspan></text><text x="58.0" y="1159.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Trinka E et al., ILAE, A definition and classification of status epilepticus, Epilepsia 2015;56:1515; Glauser T et al., AES, Epilepsy Curr 2016;16:48; Nelson Tratado de</tspan><tspan x="58.0" dy="15">Pediatría 22.ª ed. (2024).</tspan></text></svg>