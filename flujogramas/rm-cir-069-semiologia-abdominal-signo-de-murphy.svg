<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="999" viewBox="0 0 1000 999" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El signo de Murphy es característico de la colecistitis aguda: sensibilidad 65 %, especificidad 87 %"><title>El signo de Murphy es característico de la colecistitis aguda: sensibilidad 65 %, especificidad 87 %</title><rect x="0.75" y="0.75" width="998.5" height="997.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Semiología abdominal · signo de Murphy</tspan></text><rect x="441.9" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="485.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="485.1" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Signo de Murphy</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Apnea por dolor al inspirar mientras se palpa el borde costal derecho en la línea</tspan><tspan x="58.0" dy="17">medioclavicular.</tspan><tspan x="58.0" dy="17">El fondo vesicular inflamado desciende y golpea la mano.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de semiología</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿De qué enfermedad es característico el signo de</tspan><tspan x="640.0" dy="16">Murphy?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EJEMPLO ILUSTRATIVO: 1000 PACIENTES CON SOSPECHA DE COLECISTITIS</tspan></text><text x="280.0" y="283.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="300"><tspan x="280.0" dy="0">COLECISTITIS AGUDA</tspan></text><text x="205.0" y="309.0" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="150"><tspan x="205.0" dy="0">Enfermos</tspan></text><text x="355.0" y="309.0" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="150"><tspan x="355.0" dy="0">Sanos</tspan></text><text x="80.0" y="385.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="80"><tspan x="80.0" dy="0">Murphy</tspan></text><text x="80.0" y="432.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="80"><tspan x="80.0" dy="0">Prueba</tspan><tspan x="80.0" dy="13">negativa</tspan></text><text x="80.0" y="340.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="80"><tspan x="80.0" dy="0">Prueba</tspan><tspan x="80.0" dy="13">positiva</tspan></text><rect x="130.0" y="321.0" width="150.0" height="70.0" rx="0" fill="#dcfce7" stroke="#ffffff" stroke-width="3"/><text x="205.0" y="351.0" font-size="24" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="130"><tspan x="205.0" dy="0">195</tspan></text><text x="205.0" y="373.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="130"><tspan x="205.0" dy="0">verdadero +</tspan></text><rect x="280.0" y="321.0" width="150.0" height="70.0" rx="0" fill="#fee2e2" stroke="#ffffff" stroke-width="3"/><text x="355.0" y="351.0" font-size="24" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="130"><tspan x="355.0" dy="0">91</tspan></text><text x="355.0" y="373.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="130"><tspan x="355.0" dy="0">falso +</tspan></text><rect x="130.0" y="391.0" width="150.0" height="70.0" rx="0" fill="#fee2e2" stroke="#ffffff" stroke-width="3"/><text x="205.0" y="421.0" font-size="24" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="130"><tspan x="205.0" dy="0">105</tspan></text><text x="205.0" y="443.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="130"><tspan x="205.0" dy="0">falso −</tspan></text><rect x="280.0" y="391.0" width="150.0" height="70.0" rx="0" fill="#dcfce7" stroke="#ffffff" stroke-width="3"/><text x="355.0" y="421.0" font-size="24" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="130"><tspan x="355.0" dy="0">609</tspan></text><text x="355.0" y="443.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="130"><tspan x="355.0" dy="0">verdadero −</tspan></text><rect x="40.0" y="479.0" width="91.5" height="102.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.4"/><text x="85.8" y="497.0" font-size="10.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="82"><tspan x="85.8" dy="0">Sensibilidad</tspan></text><text x="85.8" y="539.0" font-size="21" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="82"><tspan x="85.8" dy="0">65 %</tspan></text><text x="85.8" y="557.0" font-size="9.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="84"><tspan x="85.8" dy="0">VP / (VP + FN)</tspan></text><text x="85.8" y="571.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="84"><tspan x="85.8" dy="0">195/300</tspan></text><rect x="139.5" y="479.0" width="91.5" height="102.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="185.2" y="497.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="82"><tspan x="185.2" dy="0">Especificidad</tspan></text><text x="185.2" y="539.0" font-size="21" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="82"><tspan x="185.2" dy="0">87 %</tspan></text><text x="185.2" y="557.0" font-size="9.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="84"><tspan x="185.2" dy="0">VN / (VN + FP)</tspan></text><text x="185.2" y="571.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="84"><tspan x="185.2" dy="0">609/700</tspan></text><rect x="239.0" y="479.0" width="91.5" height="102.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="284.8" y="497.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="82"><tspan x="284.8" dy="0">Valor</tspan><tspan x="284.8" dy="14.9">predictivo +</tspan></text><text x="284.8" y="539.0" font-size="21" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="82"><tspan x="284.8" dy="0">68 %</tspan></text><text x="284.8" y="557.0" font-size="9.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="84"><tspan x="284.8" dy="0">VP / (VP + FP)</tspan></text><text x="284.8" y="571.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="84"><tspan x="284.8" dy="0">195/286</tspan></text><rect x="338.5" y="479.0" width="91.5" height="102.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="384.2" y="497.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="82"><tspan x="384.2" dy="0">Valor</tspan><tspan x="384.2" dy="14.9">predictivo −</tspan></text><text x="384.2" y="539.0" font-size="21" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="82"><tspan x="384.2" dy="0">85 %</tspan></text><text x="384.2" y="557.0" font-size="9.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="84"><tspan x="384.2" dy="0">VN / (VN + FN)</tspan></text><text x="384.2" y="571.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="84"><tspan x="384.2" dy="0">609/714</tspan></text><rect x="470.0" y="269.0" width="490.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="480.0" y="285.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="470"><tspan x="480.0" dy="0">Sensibilidad ≈ 65 %</tspan></text><text x="480.0" y="302.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="470"><tspan x="480.0" dy="0">Falla en 1 de cada 3 enfermos: no sirve para descartar.</tspan></text><rect x="470.0" y="332.0" width="490.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="480.0" y="348.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="470"><tspan x="480.0" dy="0">Especificidad ≈ 87 %</tspan></text><text x="480.0" y="365.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="470"><tspan x="480.0" dy="0">Pocos falsos positivos: su presencia orienta bien.</tspan></text><rect x="470.0" y="395.0" width="490.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="480.0" y="411.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="470"><tspan x="480.0" dy="0">Murphy ecográfico</tspan></text><text x="480.0" y="428.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="470"><tspan x="480.0" dy="0">Dolor al comprimir la vesícula con el transductor: más rendimiento.</tspan></text><rect x="40.0" y="599.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="625.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Murphy positivo = pensar en colecistitis</tspan></text><text x="60.0" y="644.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Se confirma con ecografía y se estadifica con los criterios de Tokio.</tspan></text><text x="40.0" y="711.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="721.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="743.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="724.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="743.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Colecistitis aguda</tspan></text><text x="435.0" y="743.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Apendicitis aguda</tspan></text><text x="585.0" y="743.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Pancreatitis aguda</tspan></text><text x="735.0" y="743.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Úlcera perforada</tspan></text><text x="885.0" y="743.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Diverticulitis</tspan></text><rect x="40.0" y="758.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="758.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="787.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Característico de?</tspan></text><text x="285.0" y="779.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: dolor al palpar la</tspan><tspan x="285.0" dy="16">vesícula inspirando</tspan></text><text x="435.0" y="779.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: se asocia a</tspan><tspan x="435.0" dy="16">Blumberg y McBurney</tspan></text><text x="585.0" y="779.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: dolor en barra con</tspan><tspan x="585.0" dy="16">lipasa elevada</tspan></text><text x="735.0" y="779.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: abdomen en tabla</tspan><tspan x="735.0" dy="16">con aire libre</tspan></text><text x="885.0" y="779.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: dolor en fosa ilíaca</tspan><tspan x="885.0" dy="16">izquierda</tspan></text><rect x="40.0" y="721.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="832.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="860.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="882.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Murphy clínico: sensibilidad ≈ 65 % y especificidad ≈ 87 % para colecistitis; el Murphy ecográfico mejora el rendimiento.</tspan><tspan x="58.0" dy="18">• Puede faltar en ancianos y diabéticos: una prueba negativa no descarta.</tspan><tspan x="58.0" dy="18">• Otros signos: Boas (dolor subescapular derecho); Courvoisier-Terrier (vesícula palpable e indolora con ictericia: neoplasia de la cabeza del páncreas).</tspan><tspan x="58.0" dy="18">• Apendicitis: Blumberg y McBurney; pancreatitis: dolor en barra con vómitos y lipasa elevada.</tspan></text><text x="58.0" y="958.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Guías de Tokio 2018 (TG18); Sabiston Tratado de Cirugía 21.ª ed.</tspan></text></svg>