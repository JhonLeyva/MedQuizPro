<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1202" viewBox="0 0 1000 1202" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La tracción controlada con contratracción durante el alumbramiento evita la inversión uterina"><title>La tracción controlada con contratracción durante el alumbramiento evita la inversión uterina</title><rect x="0.75" y="0.75" width="998.5" height="1200.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · alumbramiento activo</tspan></text><rect x="404.4" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="484.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="484.1" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Manejo activo del tercer período</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Uterotónico en el primer minuto, pinzamiento del cordón y tracción controlada con</tspan><tspan x="58.0" dy="17">contratracción.</tspan><tspan x="58.0" dy="17">Se hace solo con el útero contraído y signos de desprendimiento.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de mecanismo</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">La maniobra de tracción y contratracción se hace para</tspan><tspan x="640.0" dy="16">disminuir la posibilidad de...</tspan><tspan x="640.0" dy="16">¿Qué complicación previene?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PASOS DEL MANEJO ACTIVO DEL ALUMBRAMIENTO</tspan></text><text x="44.0" y="299.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">La maniobra de tracción con contratracción es el paso 3; se hace solo con el útero firme.</tspan></text><line x1="178.0" y1="338.0" x2="362.0" y2="338.0" stroke="#99f6e4" stroke-width="6"/><line x1="408.0" y1="338.0" x2="592.0" y2="338.0" stroke="#99f6e4" stroke-width="6"/><line x1="638.0" y1="338.0" x2="822.0" y2="338.0" stroke="#99f6e4" stroke-width="6"/><circle cx="155.0" cy="338.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="155.0" y="342.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="155.0" dy="0">1</tspan></text><rect x="45.0" y="372.0" width="220.0" height="108.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="155.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="155.0" dy="0">Oxitocina 10 UI intramuscular</tspan></text><text x="155.0" y="409.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="155.0" dy="0">En el primer minuto tras el nacimiento</tspan></text><circle cx="385.0" cy="338.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="385.0" y="342.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="385.0" dy="0">2</tspan></text><rect x="275.0" y="372.0" width="220.0" height="108.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="385.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="385.0" dy="0">Pinzar el cordón</tspan></text><text x="385.0" y="409.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="385.0" dy="0">Cuando deja de latir o hasta 1 a 3</tspan><tspan x="385.0" dy="16">minutos después</tspan></text><circle cx="615.0" cy="338.0" r="22" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><text x="615.0" y="342.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="38"><tspan x="615.0" dy="0">3</tspan></text><rect x="505.0" y="372.0" width="220.0" height="108.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="615.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="208"><tspan x="615.0" dy="0">Tracción controlada y</tspan><tspan x="615.0" dy="17">contratracción</tspan></text><text x="615.0" y="426.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="615.0" dy="0">Una mano tensa el cordón; la otra</tspan><tspan x="615.0" dy="16">empuja el útero hacia arriba y atrás</tspan><tspan x="615.0" dy="16">sobre el pubis</tspan></text><rect x="534.1" y="469.0" width="161.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="615.0" y="484.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="615.0" dy="0">◆ PREVIENE LA INVERSIÓN</tspan></text><circle cx="845.0" cy="338.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="845.0" y="342.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="845.0" dy="0">4</tspan></text><rect x="735.0" y="372.0" width="220.0" height="108.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="845.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="845.0" dy="0">Masaje uterino</tspan></text><text x="845.0" y="409.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="845.0" dy="0">Tras la salida de la placenta, para</tspan><tspan x="845.0" dy="16">mantener el tono</tspan></text><rect x="40.0" y="512.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="538.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Tracción con contratracción = prevenir la inversión uterina</tspan></text><text x="60.0" y="557.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La atonía se previene con oxitocina y masaje; la ruptura depende de cicatrices o distocia.</tspan></text><text x="40.0" y="618.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">COMPLICACIONES DEL ALUMBRAMIENTO Y CÓMO SE PREVIENEN</tspan></text><rect x="40.0" y="630.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="649.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Complicación</tspan></text><text x="300.0" y="649.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Cómo se previene</tspan></text><text x="635.0" y="649.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Cómo se maneja</tspan></text><rect x="40.0" y="659.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="678.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Inversión uterina</tspan></text><text x="300.0" y="678.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Contratracción; no traccionar con útero atónico</tspan></text><text x="635.0" y="678.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Reposición inmediata; Johnson o relajantes; laparotomía</tspan><tspan x="635.0" dy="15">si falla</tspan></text><rect x="190.6" y="670.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="236.0" y="685.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="236.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="703.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="722.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Atonía uterina</tspan></text><text x="300.0" y="722.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Oxitocina y masaje uterino</tspan></text><text x="635.0" y="722.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Uterotónicos, ácido tranexámico, balón</tspan></text><rect x="40.0" y="732.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="751.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Retención placentaria</tspan></text><text x="300.0" y="751.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">No se previene con la tracción</tspan></text><text x="635.0" y="751.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Extracción manual</tspan></text><rect x="40.0" y="761.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="780.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Ruptura uterina</tspan></text><text x="300.0" y="780.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Depende de cicatrices o distocia</tspan></text><text x="635.0" y="780.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Laparotomía</tspan></text><text x="40.0" y="830.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="840.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="871.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="862.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Disociación de</tspan><tspan x="285.0" dy="17">membranas</tspan></text><rect x="363.0" y="843.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="871.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Inversión uterina</tspan></text><text x="585.0" y="871.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Ruptura uterina</tspan></text><text x="735.0" y="862.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Retención</tspan><tspan x="735.0" dy="17">placentaria</tspan></text><text x="885.0" y="871.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Atonía uterina</tspan></text><rect x="40.0" y="894.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="894.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="923.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué previene la</tspan><tspan x="54.0" dy="16">contratracción?</tspan></text><text x="285.0" y="915.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: esa disociación no</tspan><tspan x="285.0" dy="16">existe como</tspan><tspan x="285.0" dy="16">complicación</tspan></text><text x="435.0" y="923.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: mantiene el fondo</tspan><tspan x="435.0" dy="16">uterino en su sitio</tspan></text><text x="585.0" y="923.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: depende de</tspan><tspan x="585.0" dy="16">cicatrices o distocia</tspan></text><text x="735.0" y="923.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: la tracción no la</tspan><tspan x="735.0" dy="16">evita</tspan></text><text x="885.0" y="923.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: se previene con</tspan><tspan x="885.0" dy="16">oxitocina y masaje</tspan></text><rect x="40.0" y="840.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="984.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1012.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1034.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Oxitocina 10 UI intramuscular en el primer minuto; luego pinzar el cordón y traccionarlo con suavidad mientras la otra mano, sobre el pubis, empuja el</tspan><tspan x="58.0" dy="18">   útero hacia arriba y atrás.</tspan><tspan x="58.0" dy="18">• Si se tracciona con un útero atónico, la placenta adherida puede arrastrar el fondo y volverlo del revés: inversión uterina, con shock neurógeno y</tspan><tspan x="58.0" dy="18">   hemorragia.</tspan><tspan x="58.0" dy="18">• La atonía se previene con oxitocina y masaje; la ruptura uterina depende de cicatrices o distocia; la retención placentaria no se evita con la tracción.</tspan><tspan x="58.0" dy="18">• Alerta: ante una inversión, reponer el útero (Johnson o relajantes uterinos, laparotomía si fracasa) antes de retirar la placenta.</tspan></text><text x="58.0" y="1146.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, Recomendaciones para la prevención y el tratamiento de la hemorragia posparto, actualización 2023; ACOG, Practice Bulletin 183, Hemorragia posparto (Obstet</tspan><tspan x="58.0" dy="15">Gynecol 2017); Williams Obstetricia, 26.ª ed. (2022).</tspan></text></svg>