<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="888" viewBox="0 0 1000 888" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Trabajador ganadero con 8 meses de poliartralgias, fiebre ondulante y sudoración, con Rosa de Bengala positivo: brucelosis, doxiciclina + rifampicina por 6 semanas"><title>Trabajador ganadero con 8 meses de poliartralgias, fiebre ondulante y sudoración, con Rosa de Bengala positivo: brucelosis, doxiciclina + rifampicina por 6 semanas</title><rect x="0.75" y="0.75" width="998.5" height="886.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Zoonosis · brucelosis</tspan></text><rect x="329.2" y="32.0" width="136.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="397.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="121"><tspan x="397.5" dy="0">INFECTOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Brucelosis</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Zoonosis por Brucella (cabras, vacas): leche y quesos frescos sin pasteurizar o contacto</tspan><tspan x="58.0" dy="17">con animales.</tspan><tspan x="58.0" dy="17">Fiebre ondulante, sudoración profusa (olor a paja), artralgias y sacroileítis,</tspan><tspan x="58.0" dy="17">hepatoesplenomegalia; Rosa de Bengala es el tamizaje.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 40 años, zona ganadera</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">8 meses de poliartralgias; 4 meses de fiebre ondulante</tspan><tspan x="640.0" dy="16">y sudoración.</tspan><tspan x="640.0" dy="16">ANA y FR negativos; VSG 60; Rosa de Bengala</tspan><tspan x="640.0" dy="16">positivo.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA LA BRUCELOSIS Y DÓNDE SE CORTA</tspan></text><rect x="40.0" y="301.0" width="163.2" height="76.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="121.6" y="321.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="143"><tspan x="121.6" dy="0">Brucella</tspan></text><text x="121.6" y="338.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="143"><tspan x="121.6" dy="0">Bacteria</tspan></text><line x1="206.2" y1="339.0" x2="219.2" y2="339.0" stroke="#0f766e" stroke-width="2"/><polygon points="218.2,334.0 218.2,344.0 226.2,339.0" fill="#0f766e"/><line x1="121.6" y1="379.0" x2="121.6" y2="393.0" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="40.0" y="395.0" width="163.2" height="64.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="121.6" y="409.0" font-size="9.5" font-weight="800" font-style="normal" fill="#ffedd5" text-anchor="middle" data-max="143"><tspan x="121.6" dy="0">✂ CORTA</tspan></text><text x="121.6" y="426.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="143"><tspan x="121.6" dy="0">Doxiciclina +</tspan><tspan x="121.6" dy="16">rifampicina 6 sem</tspan></text><rect x="85.9" y="448.0" width="71.4" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="121.6" y="463.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="121.6" dy="0">◆ TRATAR</tspan></text><rect x="229.2" y="301.0" width="163.2" height="76.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="310.8" y="321.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="143"><tspan x="310.8" dy="0">Cabras y vacas</tspan></text><text x="310.8" y="338.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="143"><tspan x="310.8" dy="0">Reservorio</tspan></text><line x1="395.4" y1="339.0" x2="408.4" y2="339.0" stroke="#0f766e" stroke-width="2"/><polygon points="407.4,334.0 407.4,344.0 415.4,339.0" fill="#0f766e"/><line x1="310.8" y1="379.0" x2="310.8" y2="393.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="229.2" y="395.0" width="163.2" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="310.8" y="409.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="143"><tspan x="310.8" dy="0">✂ CORTA</tspan></text><text x="310.8" y="426.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="143"><tspan x="310.8" dy="0">Vacunar y sacrificar</tspan><tspan x="310.8" dy="16">ganado</tspan></text><rect x="418.4" y="301.0" width="163.2" height="76.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="500.0" y="321.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="143"><tspan x="500.0" dy="0">Leche y queso fresco</tspan></text><text x="500.0" y="338.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="143"><tspan x="500.0" dy="0">Vehículo</tspan></text><line x1="584.6" y1="339.0" x2="597.6" y2="339.0" stroke="#0f766e" stroke-width="2"/><polygon points="596.6,334.0 596.6,344.0 604.6,339.0" fill="#0f766e"/><line x1="500.0" y1="379.0" x2="500.0" y2="393.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="418.4" y="395.0" width="163.2" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="409.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="143"><tspan x="500.0" dy="0">✂ CORTA</tspan></text><text x="500.0" y="426.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="143"><tspan x="500.0" dy="0">Pasteurizar</tspan></text><rect x="607.6" y="301.0" width="163.2" height="76.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="689.2" y="321.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="143"><tspan x="689.2" dy="0">Contacto con fetos y</tspan><tspan x="689.2" dy="17">placentas</tspan></text><text x="689.2" y="355.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="143"><tspan x="689.2" dy="0">Vía</tspan></text><line x1="773.8" y1="339.0" x2="786.8" y2="339.0" stroke="#0f766e" stroke-width="2"/><polygon points="785.8,334.0 785.8,344.0 793.8,339.0" fill="#0f766e"/><line x1="689.2" y1="379.0" x2="689.2" y2="393.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="607.6" y="395.0" width="163.2" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="689.2" y="409.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="143"><tspan x="689.2" dy="0">✂ CORTA</tspan></text><text x="689.2" y="426.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="143"><tspan x="689.2" dy="0">Guantes</tspan></text><rect x="796.8" y="301.0" width="163.2" height="76.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="878.4" y="321.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="143"><tspan x="878.4" dy="0">Ganadero</tspan></text><text x="878.4" y="338.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="143"><tspan x="878.4" dy="0">Huésped</tspan></text><line x1="878.4" y1="379.0" x2="878.4" y2="393.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="796.8" y="395.0" width="163.2" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="878.4" y="409.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="143"><tspan x="878.4" dy="0">✂ CORTA</tspan></text><text x="878.4" y="426.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="143"><tspan x="878.4" dy="0">Educación</tspan></text><rect x="40.0" y="489.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="515.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Ganadero + fiebre ondulante + Rosa de Bengala = brucelosis</tspan></text><text x="60.0" y="534.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Doxiciclina + rifampicina por 6 semanas.</tspan></text><text x="40.0" y="601.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="611.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="642.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="633.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Ciprofloxacino +</tspan><tspan x="285.0" dy="17">doxiciclina</tspan></text><text x="435.0" y="633.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Cotrimoxazol +</tspan><tspan x="435.0" dy="17">rifampicina</tspan></text><rect x="513.0" y="614.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="633.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Rifampicina +</tspan><tspan x="585.0" dy="17">doxiciclina</tspan></text><text x="735.0" y="633.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ciprofloxacino +</tspan><tspan x="735.0" dy="17">rifampicina</tspan></text><text x="885.0" y="633.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Penicilina</tspan><tspan x="885.0" dy="17">benzatínica</tspan></text><rect x="40.0" y="665.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="665.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="694.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tratamiento?</tspan></text><text x="285.0" y="686.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No es el esquema de</tspan><tspan x="285.0" dy="16">elección</tspan></text><text x="435.0" y="694.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Para niños o gestantes</tspan></text><text x="585.0" y="686.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: esquema de</tspan><tspan x="585.0" dy="16">elección</tspan></text><text x="735.0" y="694.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No es de elección</tspan></text><text x="885.0" y="694.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No sirve</tspan></text><rect x="40.0" y="611.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="739.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="767.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="789.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Doxiciclina 100 mg c/12 h + rifampicina 600-900 mg/día por 6 semanas (o doxiciclina + estreptomicina/gentamicina).</tspan><tspan x="58.0" dy="18">• Confirmar con aglutinación (SAT) o hemocultivo; espondilitis: 3 meses o más.</tspan><tspan x="58.0" dy="18">• Notificar; consumir lácteos pasteurizados; control del ganado.</tspan></text><text x="58.0" y="847.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, brucelosis; MINSA Perú, NTS de brucelosis; Consenso de Ioannina (2007).</tspan></text></svg>