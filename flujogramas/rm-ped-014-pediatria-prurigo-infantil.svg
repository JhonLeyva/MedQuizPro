<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="998" viewBox="0 0 1000 998" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El prúrigo infantil se caracteriza por pápulas pruriginosas, sobre todo en los miembros inferiores"><title>El prúrigo infantil se caracteriza por pápulas pruriginosas, sobre todo en los miembros inferiores</title><rect x="0.75" y="0.75" width="998.5" height="996.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · prúrigo infantil</tspan></text><rect x="351.7" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="400.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="400.8" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Prúrigo infantil (estrófulo)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hipersensibilidad a picaduras de pulgas, mosquitos y chinches.</tspan><tspan x="58.0" dy="17">Frecuente de los 2 a los 7 años en zonas cálidas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de lesión elemental</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué lesión caracteriza al prúrigo infantil?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><rect x="40.0" y="229.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="255.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Prúrigo infantil = pápulas pruriginosas en miembros inferiores</tspan></text><text x="60.0" y="274.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Control del prurito, de la sobreinfección y de las pulgas en casa y en las mascotas.</tspan></text><text x="40.0" y="335.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LESIÓN ELEMENTAL Y TOPOGRAFÍA: PRÚRIGO INFANTIL FRENTE A OTROS CUADROS</tspan></text><rect x="40.0" y="347.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="366.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Cuadro</tspan></text><text x="260.0" y="366.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Lesión elemental</tspan></text><text x="615.0" y="366.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Topografía</tspan></text><rect x="40.0" y="376.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="395.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Prúrigo infantil</tspan></text><text x="260.0" y="395.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Pápula edematosa pruriginosa, a veces con vesícula en el</tspan><tspan x="260.0" dy="15">vértice</tspan></text><text x="615.0" y="395.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Miembros inferiores; también superiores y nalgas</tspan></text><rect x="150.6" y="387.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="196.0" y="402.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="196.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="420.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="439.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Varicela</tspan></text><text x="260.0" y="439.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Exantema vesicular con lesiones en distintos estadios</tspan></text><text x="615.0" y="439.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Polimorfismo regional</tspan></text><rect x="40.0" y="449.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="468.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Escabiosis (sarna)</tspan></text><text x="260.0" y="468.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Pápulas con prurito nocturno; convivientes afectados</tspan></text><text x="615.0" y="468.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Pliegues y espacios interdigitales</tspan></text><rect x="40.0" y="478.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="497.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Eccema de manos</tspan></text><text x="260.0" y="497.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Máculas eritematosas</tspan></text><text x="615.0" y="497.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Manos</tspan></text><rect x="40.0" y="507.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="526.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Trastorno hemorrágico o</tspan><tspan x="50.0" dy="15">maltrato</tspan></text><text x="260.0" y="526.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Equimosis diseminadas</tspan></text><text x="615.0" y="526.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Ambos miembros</tspan></text><text x="40.0" y="591.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="601.0" width="920.0" height="88.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="649.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="604.0" width="144.0" height="82.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="632.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Pápulas</tspan><tspan x="285.0" dy="17">pruriginosas en</tspan><tspan x="285.0" dy="17">miembros inferiores</tspan></text><text x="435.0" y="623.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Vesículas</tspan><tspan x="435.0" dy="17">principalmente en</tspan><tspan x="435.0" dy="17">miembros</tspan><tspan x="435.0" dy="17">superiores</tspan></text><text x="585.0" y="632.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Máculas</tspan><tspan x="585.0" dy="17">eritematosas en las</tspan><tspan x="585.0" dy="17">manos</tspan></text><text x="735.0" y="632.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Equimosis</tspan><tspan x="735.0" dy="17">diseminadas en</tspan><tspan x="735.0" dy="17">ambos miembros</tspan></text><text x="885.0" y="632.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Exantema vesicular</tspan><tspan x="885.0" dy="17">con polimorfismo</tspan><tspan x="885.0" dy="17">regional</tspan></text><rect x="40.0" y="689.0" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="689.0" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="734.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Lesión del prúrigo?</tspan></text><text x="285.0" y="710.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: pápulas</tspan><tspan x="285.0" dy="16">pruriginosas, sobre</tspan><tspan x="285.0" dy="16">todo en miembros</tspan><tspan x="285.0" dy="16">inferiores</tspan></text><text x="435.0" y="726.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: las vesículas son</tspan><tspan x="435.0" dy="16">secundarias</tspan></text><text x="585.0" y="726.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sugiere eccema o</tspan><tspan x="585.0" dy="16">sarna</tspan></text><text x="735.0" y="718.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: orienta a</tspan><tspan x="735.0" dy="16">coagulopatía o</tspan><tspan x="735.0" dy="16">maltrato</tspan></text><text x="885.0" y="726.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es el exantema de</tspan><tspan x="885.0" dy="16">la varicela</tspan></text><rect x="40.0" y="601.0" width="920.0" height="170.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="795.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="823.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="845.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Lesión elemental: pápula edematosa, a veces con una vesícula en el vértice, intensamente pruriginosa, en brotes sobre miembros inferiores, superiores y</tspan><tspan x="58.0" dy="18">   nalgas.</tspan><tspan x="58.0" dy="18">• El rascado produce excoriaciones, costras, impetiginización secundaria y manchas residuales; las vesículas son secundarias.</tspan><tspan x="58.0" dy="18">• Tratamiento: antihistamínicos orales, corticoide tópico de baja potencia por pocos días, antibiótico si hay sobreinfección y control de pulgas y del</tspan><tspan x="58.0" dy="18">   ambiente.</tspan><tspan x="58.0" dy="18">• Alerta: prurito nocturno en convivientes sugiere sarna; equimosis diseminadas orientan a trastornos hemorrágicos o maltrato.</tspan></text><text x="58.0" y="957.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Nelson Tratado de Pediatría 22.ª ed. (2024); Fitzpatrick Dermatología en Medicina General 9.ª ed. (2019).</tspan></text></svg>