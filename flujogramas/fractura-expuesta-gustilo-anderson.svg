style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Fractura expuesta: ¿qué va primero?</tspan></text><rect x="40.0" y="431.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="266.5" y="467.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">En la primera hora</tspan></text><text x="266.5" y="490.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Cefazolina ± gentamicina</tspan></text><rect x="507.0" y="431.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="733.5" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">LAVADO Y DESBRIDAMIENTO</tspan></text><text x="733.5" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">En quirófano, urgente</tspan><tspan x="733.5" dy="17">Luego fijación externa</tspan></text><text x="40.0" y="561.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="573.5" width="920.0" height="387.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="587.5" width="312.1" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="212.0" y="607.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="212.0" dy="0">CLASIFICACIÓN DE GUSTILO-ANDERSON</tspan></text><text x="384.1" y="607.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="558"><tspan x="384.1" dy="0">Por el tamaño de la herida, la contaminación y el daño de partes blandas.</tspan></text><rect x="56.0" y="647.5" width="168.0" height="140.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="648.1" width="166.8" height="82.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="140.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="152"><tspan x="140.0" dy="0">I</tspan></text><text x="140.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="144"><tspan x="140.0" dy="0">Herida &lt; 1 cm</tspan></text><circle cx="72.0" cy="739.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="743.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="82.0" dy="0">Limpia</tspan></text><circle cx="72.0" cy="762.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="766.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="82.0" dy="0">Baja energía</tspan></text><rect x="236.0" y="647.5" width="168.0" height="140.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="236.6" y="648.1" width="166.8" height="82.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="320.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="152"><tspan x="320.0" dy="0">II</tspan></text><text x="320.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="144"><tspan x="320.0" dy="0">Herida 1-10 cm</tspan></text><circle cx="252.0" cy="739.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="262.0" y="743.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="262.0" dy="0">Daño moderado de</tspan><tspan x="262.0" dy="16">partes blandas</tspan></text><rect x="416.0" y="647.5" width="168.0" height="140.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="416.6" y="648.1" width="166.8" height="82.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="500.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">IIIA</tspan></text><text x="500.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="144"><tspan x="500.0" dy="0">Herida &gt; 10 cm</tspan></text><circle cx="432.0" cy="739.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="442.0" y="743.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="442.0" dy="0">Hueso cubierto con</tspan><tspan x="442.0" dy="16">partes blandas</tspan></text><rect x="596.0" y="647.5" width="168.0" height="140.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="597.2" y="648.7" width="165.6" height="82.0" rx="9" fill="#fee2e2" stroke="none" stroke-width="0"/><text x="680.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="152"><tspan x="680.0" dy="0">IIIB</tspan></text><text x="680.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="144"><tspan x="680.0" dy="0">Periostio</tspan><tspan x="680.0" dy="19">despegado</tspan></text><circle cx="612.0" cy="739.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="622.0" y="743.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="622.0" dy="0">Hueso expuesto</tspan></text><circle cx="612.0" cy="762.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="622.0" y="766.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="622.0" dy="0">Necesita colgajo</tspan></text><rect x="634.6" y="636.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="680.0" y="651.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="680.0" dy="0">◆ ESTE CASO</tspan></text><rect x="776.0" y="647.5" width="168.0" height="140.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="776.6" y="648.1" width="166.8" height="82.0" rx="9" fill="#fecaca" stroke="none" stroke-width="0"/><text x="860.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="middle" data-max="152"><tspan x="860.0" dy="0">IIIC</tspan></text><text x="860.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="middle" data-max="144"><tspan x="860.0" dy="0">Lesión arterial</tspan></text><circle cx="792.0" cy="739.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="802.0" y="743.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="802.0" dy="0">Requiere reparar la</tspan><tspan x="802.0" dy="16">arteria</tspan></text><text x="56.0" y="817.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="826.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="841.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="841.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Herida de 12 cm con hueso expuesto y periostio despegado</tspan></text><rect x="56.0" y="848.5" width="20.0" height="20.0" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="66.0" y="863.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✕</tspan></text><text x="88.0" y="863.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Pulsos normales: no es IIIC</tspan></text><rect x="56.0" y="870.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="885.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="885.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">El grado final se define en el quirófano tras desbridar</tspan></text><rect x="56.0" y="907.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="930.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Antibiótico en la primera hora, lavado y desbridamiento urgente, fijación externa y cobertura con colgajo.</tspan></text><text x="40.0" y="1000.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1010.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1050.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="1013.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="1041.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Lavado y</tspan><tspan x="285.0" dy="17">desbridamiento</tspan></text><text x="435.0" y="1041.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Lavado y fijación</tspan><tspan x="435.0" dy="17">externa</tspan></text><text x="585.0" y="1041.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Antibióticos y</tspan><tspan x="585.0" dy="17">lavado</tspan></text><text x="735.0" y="1041.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Irrigación y</tspan><tspan x="735.0" dy="17">osteosíntesis</tspan></text><text x="885.0" y="1033.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Cierre primario</tspan><tspan x="885.0" dy="17">inmediato de la</tspan><tspan x="885.0" dy="17">herida</tspan></text><rect x="40.0" y="1081.5" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1081.5" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1118.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿De elección?</tspan></text><text x="285.0" y="1110.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: primero limpiar y</tspan><tspan x="285.0" dy="16">retirar tejido muerto</tspan></text><text x="435.0" y="1110.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">La fijación va después</tspan><tspan x="435.0" dy="16">del desbridamiento</tspan></text><text x="585.0" y="1110.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Antibiótico sí, pero no</tspan><tspan x="585.0" dy="16">basta sin cirugía</tspan></text><text x="735.0" y="1110.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: material interno en</tspan><tspan x="735.0" dy="16">herida sucia</tspan></text><text x="885.0" y="1102.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: herida</tspan><tspan x="885.0" dy="16">contaminada no se</tspan><tspan x="885.0" dy="16">cierra</tspan></text><rect x="40.0" y="1010.5" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1171.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1199.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1221.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Antibiótico EV en la primera hora (cefazolina; en Gustilo III agregar cobertura de gramnegativos) y antitetánica.</tspan><tspan x="58.0" dy="18">• Lavado y desbridamiento quirúrgico urgente; luego fijación externa temporal.</tspan><tspan x="58.0" dy="18">• No cerrar de inmediato una herida contaminada; cobertura de partes blandas en los primeros 7 días.</tspan></text><text x="58.0" y="1279.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: BOA/BAPRAS, BOAST fracturas expuestas (2017); NICE NG37 (2016, act. 2022); ATLS 11.ª ed. (2025).</tspan></text></svg>