<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1346" viewBox="0 0 1000 1346" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Las múltiples parejas sexuales aumentan el riesgo de cáncer de cuello uterino por la infección por VPH"><title>Las múltiples parejas sexuales aumentan el riesgo de cáncer de cuello uterino por la infección por VPH</title><rect x="0.75" y="0.75" width="998.5" height="1344.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ginecología oncológica · factores de riesgo</tspan></text><rect x="457.7" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="537.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="537.5" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="131.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cáncer de cuello uterino</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Causa necesaria: infección persistente por VPH oncogénico, sobre todo 16 y 18 (cerca de</tspan><tspan x="58.0" dy="17">70 % de los casos).</tspan><tspan x="58.0" dy="17">La mayoría de las infecciones se resuelve: los cofactores deciden la persistencia.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="131.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="129.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de riesgo</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es un factor de riesgo para cáncer de cérvix?</tspan></text><rect x="640.0" y="192.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="205.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="205.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="253.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ AUMENTA EL RIESGO Y QUÉ NO</tspan></text><rect x="493.0" y="315.0" width="14" height="190" rx="5" fill="#64748b"/><path d="M440.0 520.0 H560.0 L540.0 500.0 H460.0 Z" fill="#475569"/><circle cx="500.0" cy="315.0" r="15" fill="#f59e0b" stroke="#92400e" stroke-width="2"/><line x1="385.4" y1="333.1" x2="614.6" y2="296.9" stroke="#334155" stroke-width="7" stroke-linecap="round"/><line x1="385.4" y1="333.1" x2="357.4" y2="395.1" stroke="#64748b" stroke-width="2"/><line x1="385.4" y1="333.1" x2="413.4" y2="395.1" stroke="#64748b" stroke-width="2"/><path d="M347.4 395.1 H423.4 Q385.4 439.1 347.4 395.1 Z" fill="#ea580c"/><text x="385.4" y="410.1" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="385.4" dy="0">RIESGO</tspan></text><line x1="614.6" y1="296.9" x2="586.6" y2="358.9" stroke="#64748b" stroke-width="2"/><line x1="614.6" y1="296.9" x2="642.6" y2="358.9" stroke="#64748b" stroke-width="2"/><path d="M576.6 358.9 H652.6 Q614.6 402.9 576.6 358.9 Z" fill="#64748b"/><text x="614.6" y="373.9" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="614.6" dy="0">NO</tspan></text><text x="500.0" y="547.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="300"><tspan x="500.0" dy="0">¿Cuál es factor de riesgo?</tspan></text><rect x="40.0" y="285.0" width="290.0" height="158.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><text x="58.0" y="313.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="254"><tspan x="58.0" dy="0">Aumentan el riesgo (este caso)</tspan></text><circle cx="62.0" cy="338.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="342.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Múltiples parejas sexuales: este caso</tspan></text><circle cx="62.0" cy="364.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="368.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Inicio precoz de la vida sexual</tspan></text><circle cx="62.0" cy="390.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="394.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Alta paridad</tspan></text><circle cx="62.0" cy="416.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="420.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Tabaquismo e inmunosupresión</tspan></text><rect x="214.6" y="274.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="260.0" y="289.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="260.0" dy="0">◆ ESTE CASO</tspan></text><rect x="670.0" y="285.0" width="290.0" height="174.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="688.0" y="313.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="688.0" dy="0">No lo aumentan</tspan></text><circle cx="692.0" cy="338.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="342.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Pareja sexual única</tspan></text><circle cx="692.0" cy="364.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="368.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Inicio tardío de relaciones sexuales</tspan></text><circle cx="692.0" cy="390.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="394.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Baja paridad</tspan></text><circle cx="692.0" cy="416.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="420.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Alto nivel socioeconómico con acceso al</tspan><tspan x="704.0" dy="16">tamizaje</tspan></text><rect x="40.0" y="581.0" width="920.0" height="93.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="609.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Múltiples parejas = factor de riesgo de cáncer de cérvix</tspan></text><text x="500.0" y="630.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Cuantas más parejas, mayor probabilidad de infección persistente por VPH.</tspan><tspan x="500.0" dy="17">Las otras opciones describen lo contrario.</tspan></text><text x="40.0" y="708.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">COFACTORES DE LA PERSISTENCIA DEL VPH Y SU RELACIÓN CON EL CÁNCER DE CUELLO</tspan></text><rect x="40.0" y="720.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="739.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Factor</tspan></text><text x="260.0" y="739.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="694"><tspan x="260.0" dy="0">Efecto</tspan></text><rect x="40.0" y="749.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="768.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Múltiples parejas</tspan></text><text x="260.0" y="768.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="694"><tspan x="260.0" dy="0">Aumenta</tspan></text><rect x="150.6" y="752.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="196.0" y="767.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="196.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="778.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="797.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Inicio precoz de relaciones</tspan></text><text x="260.0" y="797.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="694"><tspan x="260.0" dy="0">Aumenta</tspan></text><rect x="40.0" y="807.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="826.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Alta paridad</tspan></text><text x="260.0" y="826.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="694"><tspan x="260.0" dy="0">Aumenta</tspan></text><rect x="40.0" y="836.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="855.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Bajo nivel socioeconómico</tspan></text><text x="260.0" y="855.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="694"><tspan x="260.0" dy="0">Aumenta</tspan></text><rect x="40.0" y="865.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="884.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Tabaquismo y anticonceptivos</tspan></text><text x="260.0" y="884.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="694"><tspan x="260.0" dy="0">Aumenta</tspan></text><rect x="40.0" y="894.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="913.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Inmunosupresión</tspan></text><text x="260.0" y="913.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="694"><tspan x="260.0" dy="0">Aumenta</tspan></text><rect x="40.0" y="923.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="942.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Vacuna y tamizaje</tspan></text><text x="260.0" y="942.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="694"><tspan x="260.0" dy="0">Disminuye</tspan></text><text x="40.0" y="992.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1002.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1033.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="1005.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="1024.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Promiscuidad</tspan><tspan x="285.0" dy="17">sexual</tspan></text><text x="435.0" y="1033.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Baja paridad</tspan></text><text x="585.0" y="1024.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Alto nivel</tspan><tspan x="585.0" dy="17">socioeconómico</tspan></text><text x="735.0" y="1024.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Compañero sexual</tspan><tspan x="735.0" dy="17">único</tspan></text><text x="885.0" y="1024.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Inicio tardío de</tspan><tspan x="885.0" dy="17">relaciones sexuales</tspan></text><rect x="40.0" y="1056.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1056.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1093.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Factor de riesgo?</tspan></text><text x="285.0" y="1085.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: múltiples parejas,</tspan><tspan x="285.0" dy="16">más exposición al VPH</tspan></text><text x="435.0" y="1085.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: la alta paridad sí</tspan><tspan x="435.0" dy="16">es factor de riesgo</tspan></text><text x="585.0" y="1077.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: el bajo nivel</tspan><tspan x="585.0" dy="16">socioeconómico sí lo</tspan><tspan x="585.0" dy="16">es</tspan></text><text x="735.0" y="1085.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es lo contrario de</tspan><tspan x="735.0" dy="16">un factor de riesgo</tspan></text><text x="885.0" y="1085.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: el inicio precoz sí</tspan><tspan x="885.0" dy="16">lo es</tspan></text><rect x="40.0" y="1002.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1146.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1174.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1196.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Cofactores: inicio precoz de la vida sexual, múltiples parejas (o pareja con varias), alta paridad, bajo nivel socioeconómico, tabaquismo y anticonceptivos</tspan><tspan x="58.0" dy="18">   orales prolongados.</tspan><tspan x="58.0" dy="18">• Inmunosupresión (VIH, trasplante, corticoides) y coinfección con Chlamydia o herpes también aumentan el riesgo.</tspan><tspan x="58.0" dy="18">• Las opciones B, C, D y E son lo contrario de esos factores. La vacuna nonavalente y el tamizaje con prueba de VPH o citología previenen el cáncer.</tspan><tspan x="58.0" dy="18">• Alerta: el sangrado poscoital con varias parejas obliga a examinar el cuello y tomar citología o prueba de VPH.</tspan></text><text x="58.0" y="1290.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, guía de tamizaje y tratamiento de lesiones precancerosas del cuello uterino (2021); Directiva 165-2025 (MINSA), cáncer de cuello uterino; Williams Obstetricia,</tspan><tspan x="58.0" dy="15">26.ª ed. (2022).</tspan></text></svg>