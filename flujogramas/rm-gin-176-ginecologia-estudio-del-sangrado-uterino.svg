<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1090" viewBox="0 0 1000 1090" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Sangrado abundante con útero de tamaño normal: la ecografía transvaginal es el estudio inicial"><title>Sangrado abundante con útero de tamaño normal: la ecografía transvaginal es el estudio inicial</title><rect x="0.75" y="0.75" width="998.5" height="1088.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ginecología · estudio del sangrado uterino</tspan></text><rect x="452.2" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="532.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="532.0" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Sangrado uterino anormal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se descarta el embarazo y se distingue lo estructural de lo no estructural (PALM-COEIN).</tspan><tspan x="58.0" dy="17">La imagen inicial es la ecografía transvaginal.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 30 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Sangrado abundante de 3 días.</tspan><tspan x="640.0" dy="16">Píldora de emergencia hace 6 días; ritmo 3/28; útero</tspan><tspan x="640.0" dy="16">de 7 x 4 x 3 cm.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ ESTUDIO SE PIDE EN CADA MOMENTO</tspan></text><rect x="40.0" y="285.0" width="920.0" height="112.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="285.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="345.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Primero</tspan></text><rect x="40.0" y="397.0" width="920.0" height="112.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="397.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="453.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Si hay lesión</tspan><tspan x="94.0" dy="14">intracavitaria</tspan></text><rect x="40.0" y="509.0" width="920.0" height="112.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="509.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="565.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">No define la</tspan><tspan x="94.0" dy="14">causa</tspan></text><line x1="280.0" y1="341.0" x2="287.0" y2="341.0" stroke="#ea580c" stroke-width="2.2"/><line x1="287.0" y1="341.0" x2="287.0" y2="341.0" stroke="#ea580c" stroke-width="2.2"/><line x1="287.0" y1="341.0" x2="285.0" y2="341.0" stroke="#ea580c" stroke-width="2.2"/><polygon points="285.0,346.0 285.0,336.0 294.0,341.0" fill="#ea580c"/><line x1="416.0" y1="341.0" x2="423.0" y2="341.0" stroke="#0f766e" stroke-width="2.2"/><line x1="423.0" y1="341.0" x2="423.0" y2="452.5" stroke="#0f766e" stroke-width="2.2"/><line x1="423.0" y1="452.5" x2="421.0" y2="452.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="421.0,457.5 421.0,447.5 430.0,452.5" fill="#0f766e"/><line x1="552.0" y1="452.5" x2="559.0" y2="452.5" stroke="#0f766e" stroke-width="2.2"/><line x1="559.0" y1="452.5" x2="559.0" y2="565.0" stroke="#0f766e" stroke-width="2.2"/><line x1="559.0" y1="565.0" x2="557.0" y2="565.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="557.0,570.0 557.0,560.0 566.0,565.0" fill="#0f766e"/><line x1="688.0" y1="565.0" x2="695.0" y2="565.0" stroke="#0f766e" stroke-width="2.2"/><line x1="695.0" y1="565.0" x2="695.0" y2="565.0" stroke="#0f766e" stroke-width="2.2"/><line x1="695.0" y1="565.0" x2="693.0" y2="565.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="693.0,570.0 693.0,560.0 702.0,565.0" fill="#0f766e"/><line x1="824.0" y1="565.0" x2="831.0" y2="565.0" stroke="#0f766e" stroke-width="2.2"/><line x1="831.0" y1="565.0" x2="831.0" y2="564.5" stroke="#0f766e" stroke-width="2.2"/><line x1="831.0" y1="564.5" x2="829.0" y2="564.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="829.0,569.5 829.0,559.5 838.0,564.5" fill="#0f766e"/><rect x="158.0" y="298.0" width="122.0" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="314.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="168.0" dy="0">Prueba de</tspan><tspan x="168.0" dy="16">embarazo (hCG)</tspan></text><text x="168.0" y="347.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="168.0" dy="0">Siempre antes de</tspan><tspan x="168.0" dy="14.5">las imágenes</tspan></text><circle cx="158.0" cy="298.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="302.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="294.0" y="298.0" width="122.0" height="86.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="304.0" y="314.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="102"><tspan x="304.0" dy="0">Ecografía</tspan><tspan x="304.0" dy="16">transvaginal</tspan></text><text x="304.0" y="347.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="304.0" dy="0">Mide endometrio,</tspan><tspan x="304.0" dy="14.5">útero y anexos</tspan></text><circle cx="294.0" cy="298.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="294.0" y="302.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="294.0" dy="0">2</tspan></text><rect x="430.0" y="410.0" width="122.0" height="85.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="440.0" y="426.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="440.0" dy="0">Eco con salino</tspan></text><text x="440.0" y="443.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="440.0" dy="0">Histerosonografía:</tspan><tspan x="440.0" dy="14.5">distingue pólipo de</tspan><tspan x="440.0" dy="14.5">mioma submucoso</tspan></text><circle cx="430.0" cy="410.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="430.0" y="414.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="430.0" dy="0">3</tspan></text><rect x="566.0" y="522.0" width="122.0" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="576.0" y="538.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="576.0" dy="0">Ecografía</tspan><tspan x="576.0" dy="16">abdominal</tspan></text><text x="576.0" y="571.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="576.0" dy="0">Menor resolución en</tspan><tspan x="576.0" dy="14.5">la pelvis</tspan></text><circle cx="566.0" cy="522.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="566.0" y="526.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="566.0" dy="0">4</tspan></text><rect x="702.0" y="522.0" width="122.0" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="712.0" y="538.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="712.0" dy="0">Dosaje de</tspan><tspan x="712.0" dy="16">progesterona</tspan></text><text x="712.0" y="571.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="712.0" dy="0">No señala una</tspan><tspan x="712.0" dy="14.5">causa estructural</tspan></text><circle cx="702.0" cy="522.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="702.0" y="526.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="702.0" dy="0">5</tspan></text><rect x="838.0" y="522.0" width="122.0" height="85.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="848.0" y="538.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="848.0" dy="0">Histerografía</tspan></text><text x="848.0" y="555.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="848.0" dy="0">Evalúa la</tspan><tspan x="848.0" dy="14.5">permeabilidad de</tspan><tspan x="848.0" dy="14.5">las trompas</tspan></text><circle cx="838.0" cy="522.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="838.0" y="526.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="838.0" dy="0">6</tspan></text><rect x="40.0" y="639.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="665.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Sangrado uterino anormal = ecografía transvaginal</tspan></text><text x="60.0" y="684.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La histerosonografía y la histeroscopía se reservan para la lesión intracavitaria.</tspan></text><text x="40.0" y="751.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="761.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="792.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="792.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Histerosonografía</tspan></text><text x="435.0" y="783.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Ecografía</tspan><tspan x="435.0" dy="17">abdominal</tspan></text><text x="585.0" y="783.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Dosaje de</tspan><tspan x="585.0" dy="17">progesterona</tspan></text><text x="735.0" y="792.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Histerosalpingografía</tspan></text><rect x="813.0" y="764.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="783.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Ecografía</tspan><tspan x="885.0" dy="17">transvaginal</tspan></text><rect x="40.0" y="815.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="815.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="852.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Examen a solicitar?</tspan></text><text x="285.0" y="836.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: se pide si la</tspan><tspan x="285.0" dy="16">ecografía sugiere</tspan><tspan x="285.0" dy="16">lesión intracavitaria</tspan></text><text x="435.0" y="836.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: tiene menor</tspan><tspan x="435.0" dy="16">resolución que la</tspan><tspan x="435.0" dy="16">transvaginal</tspan></text><text x="585.0" y="844.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no define la causa</tspan><tspan x="585.0" dy="16">estructural</tspan></text><text x="735.0" y="836.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: evalúa las</tspan><tspan x="735.0" dy="16">trompas, no el</tspan><tspan x="735.0" dy="16">sangrado</tspan></text><text x="885.0" y="844.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: imagen inicial de</tspan><tspan x="885.0" dy="16">elección</tspan></text><rect x="40.0" y="761.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="905.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="933.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="955.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El levonorgestrel puede causar un sangrado por disrupción, autolimitado; un sangrado abundante de 3 días exige medir el endometrio y ver los anexos.</tspan><tspan x="58.0" dy="18">• La ecografía transvaginal tiene mejor resolución pélvica que la abdominal y es la imagen inicial de elección.</tspan><tspan x="58.0" dy="18">• La histerosonografía o la histeroscopía se piden después, si la ecografía sugiere una lesión intracavitaria (pólipo o mioma submucoso).</tspan><tspan x="58.0" dy="18">• Alerta: descartar siempre embarazo (hCG) y valorar la hemoglobina; la progesterona no define la causa y la histerosalpingografía evalúa la permeabilidad</tspan><tspan x="58.0" dy="18">   tubaria.</tspan></text><text x="58.0" y="1049.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Munro MG et al., FIGO, Int J Gynaecol Obstet 2018;143:393-408; Williams Obstetricia, 26.ª ed. (2022).</tspan></text></svg>