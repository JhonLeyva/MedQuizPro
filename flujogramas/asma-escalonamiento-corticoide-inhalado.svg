<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="621" viewBox="0 0 1000 621" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Asma: escalonamiento del tratamiento"><title>Asma: escalonamiento del tratamiento</title><rect x="0.75" y="0.75" width="998.5" height="619.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16" y="16" width="968" height="56" rx="10" fill="#0f766e"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170" y1="34.0" x2="170" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="657"><tspan x="184.0" dy="0">NEUMOLOGÍA ENAM: ASMA: ESCALONAMIENTO DEL TRATAMIENTO</tspan></text><rect x="861.0" y="32.0" width="103.0" height="24" rx="12" fill="#134e4a"/><text x="912.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="87"><tspan x="912.5" dy="0">NEUMOLOGÍA</tspan></text><rect x="190.0" y="90.0" width="620" height="67.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="500.0" y="118.5" font-size="14.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Varón de 20 años con asma y exacerbaciones frecuentes</tspan></text><text x="500.0" y="141.0" font-size="12" font-weight="400" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Solo usa salbutamol a demanda · hoy asintomático</tspan></text><line x1="500.0" y1="157.0" x2="500.0" y2="176.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,175.0 505.0,175.0 500.0,183.0" fill="#0f766e"/><rect x="40.0" y="183.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="62.0" cy="207.0" r="13" fill="#0f766e"/><text x="62.0" y="212.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><rect x="74.0" y="183.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="88.0" y="210.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="88.0" dy="0">Evaluar control</tspan></text><text x="88.0" y="233.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="88.0" dy="0">Síntomas, uso de rescate y</tspan><tspan x="88.0" dy="17">exacerbaciones</tspan></text><line x1="335.0" y1="224.5" x2="345.0" y2="224.5" stroke="#0f766e" stroke-width="2"/><polygon points="344.0,219.5 344.0,229.5 352.0,224.5" fill="#0f766e"/><rect x="354.0" y="183.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="376.0" cy="207.0" r="13" fill="#0f766e"/><text x="376.0" y="212.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="376.0" dy="0">2</tspan></text><rect x="388.0" y="183.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="402.0" y="210.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="402.0" dy="0">Técnica</tspan></text><text x="402.0" y="233.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="402.0" dy="0">Revisar adherencia y técnica</tspan><tspan x="402.0" dy="17">del inhalador</tspan></text><line x1="649.0" y1="224.5" x2="659.0" y2="224.5" stroke="#0f766e" stroke-width="2"/><polygon points="658.0,219.5 658.0,229.5 666.0,224.5" fill="#0f766e"/><rect x="668.0" y="183.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="690.0" cy="207.0" r="13" fill="#0f766e"/><text x="690.0" y="212.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="690.0" dy="0">3</tspan></text><rect x="702.0" y="183.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="716.0" y="210.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="716.0" dy="0">Antiinflamatorio</tspan></text><text x="716.0" y="233.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="716.0" dy="0">Agregar CORTICOIDE INHALADO</tspan><tspan x="716.0" dy="17">(budesonida)</tspan></text><line x1="500.0" y1="266.0" x2="500.0" y2="285.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,284.0 505.0,284.0 500.0,292.0" fill="#0f766e"/><rect x="197.0" y="292.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="219.0" cy="316.0" r="13" fill="#0f766e"/><text x="219.0" y="321.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="219.0" dy="0">4</tspan></text><rect x="231.0" y="292.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="245.0" y="319.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="245.0" dy="0">GINA 2025</tspan></text><text x="245.0" y="342.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="245.0" dy="0">Preferir budesonida-formoterol</tspan><tspan x="245.0" dy="17">a demanda y de mantenimiento</tspan></text><line x1="492.0" y1="333.5" x2="502.0" y2="333.5" stroke="#0f766e" stroke-width="2"/><polygon points="501.0,328.5 501.0,338.5 509.0,333.5" fill="#0f766e"/><rect x="511.0" y="292.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="533.0" cy="316.0" r="13" fill="#0f766e"/><text x="533.0" y="321.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="533.0" dy="0">5</tspan></text><rect x="545.0" y="292.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="559.0" y="319.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="559.0" dy="0">Reevaluar</tspan></text><text x="559.0" y="342.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="559.0" dy="0">En 2–3 meses: subir o bajar de</tspan><tspan x="559.0" dy="17">paso</tspan></text><line x1="500.0" y1="375.0" x2="500.0" y2="394.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,393.0 505.0,393.0 500.0,401.0" fill="#0f766e"/><rect x="90.0" y="401.0" width="820" height="67.5" rx="10" fill="#134e4a" stroke="#134e4a" stroke-width="1.5"/><text x="500.0" y="427.0" font-size="12" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="792"><tspan x="500.0" dy="0">DEBE AGREGARSE</tspan></text><text x="500.0" y="452.5" font-size="15" font-weight="400" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="792"><tspan x="500.0" dy="0">Corticoide inhalado</tspan></text><rect x="40" y="494.5" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="522.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="544.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• No se recomienda tratar el asma solo con salbutamol a demanda.</tspan><tspan x="58.0" dy="18">• Anti-IgE u otros biológicos: asma grave no controlada, no como segundo paso.</tspan></text><text x="58.0" y="584.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: GINA 2025 · MINSA/INSN San Borja – GPC Asma 2023 · IETSI EsSalud</tspan></text></svg>
