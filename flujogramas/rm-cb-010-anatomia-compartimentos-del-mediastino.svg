<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="816" viewBox="0 0 1000 816" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En el adulto sano, la aorta descendente se localiza en el mediastino posterior"><title>En el adulto sano, la aorta descendente se localiza en el mediastino posterior</title><rect x="0.75" y="0.75" width="998.5" height="815.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Anatomía · compartimentos del mediastino</tspan></text><rect x="454.3" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="526.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="526.2" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Mediastino</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Espacio entre ambas pleuras: superior e inferior (anterior, medio, posterior).</tspan><tspan x="58.0" dy="17">Cada estructura y cada tumor tiene su compartimento.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué estructura va en el mediastino posterior?</tspan></text><line x1="640.0" y1="189.0" x2="670.0" y2="189.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="209.0" x2="320.0" y2="239.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="239.0" x2="500.0" y2="239.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="239.0" x2="500.0" y2="268.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,267.0 505.0,267.0 500.0,275.0" fill="#94a3b8"/><line x1="500.0" y1="333.0" x2="500.0" y2="363.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="363.0" x2="811.3" y2="363.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="363.0" x2="188.7" y2="392.0" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,391.0 193.7,391.0 188.7,399.0" fill="#94a3b8"/><line x1="500.0" y1="363.0" x2="500.0" y2="392.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,391.0 505.0,391.0 500.0,399.0" fill="#94a3b8"/><line x1="811.3" y1="363.0" x2="811.3" y2="392.0" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,391.0 816.3,391.0 811.3,399.0" fill="#94a3b8"/><line x1="320.0" y1="209.0" x2="320.0" y2="239.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="239.0" x2="500.0" y2="239.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="239.0" x2="500.0" y2="268.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,267.0 505.0,267.0 500.0,275.0" fill="#0f766e"/><line x1="500.0" y1="333.0" x2="500.0" y2="363.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="363.0" x2="811.3" y2="363.0" stroke="#0f766e" stroke-width="3"/><line x1="811.3" y1="363.0" x2="811.3" y2="392.0" stroke="#0f766e" stroke-width="3"/><polygon points="806.3,391.0 816.3,391.0 811.3,399.0" fill="#0f766e"/><rect x="100.2" y="372.0" width="176.9" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="188.7" y="384.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">Entre el esternón y el pericardio</tspan></text><rect x="442.2" y="372.0" width="115.7" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="500.0" y="384.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">Contiene el corazón</tspan></text><rect x="718.4" y="372.0" width="185.8" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="811.3" y="384.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">Delante de la columna (este caso)</tspan></text><polygon points="240.0,304.0 266.0,275.0 734.0,275.0 760.0,304.0 734.0,333.0 266.0,333.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="304.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="309.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="308.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">¿Dónde está la estructura?</tspan></text><rect x="40.0" y="399.0" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="188.7" y="427.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">ANTERIOR</tspan></text><text x="188.7" y="450.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Timo</tspan><tspan x="188.7" dy="17">Ganglios y arteria mamaria interna</tspan></text><rect x="351.3" y="399.0" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="427.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">MEDIO</tspan></text><text x="500.0" y="450.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Pericardio y frénicos</tspan><tspan x="500.0" dy="17">Tráquea y bronquios</tspan></text><rect x="662.7" y="399.0" width="297.3" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="811.3" y="427.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">POSTERIOR</tspan></text><text x="811.3" y="450.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Aorta descendente</tspan><tspan x="811.3" dy="17">Esófago, conducto torácico, ácigos</tspan></text><text x="40.0" y="529.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="539.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="570.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="542.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="570.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Aorta descendente</tspan></text><text x="435.0" y="570.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Glándula timo</tspan></text><text x="585.0" y="562.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Arteria mamaria</tspan><tspan x="585.0" dy="17">interna</tspan></text><text x="735.0" y="570.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Nervio frénico</tspan></text><text x="885.0" y="570.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Tráquea</tspan></text><rect x="40.0" y="593.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="593.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="622.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Mediastino posterior?</tspan></text><text x="285.0" y="614.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: está pegada a la</tspan><tspan x="285.0" dy="16">columna</tspan></text><text x="435.0" y="622.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: el timo es anterior</tspan></text><text x="585.0" y="614.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: la mamaria interna</tspan><tspan x="585.0" dy="16">es anterior</tspan></text><text x="735.0" y="614.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: el frénico va en el</tspan><tspan x="735.0" dy="16">mediastino medio</tspan></text><text x="885.0" y="614.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: la tráquea está en</tspan><tspan x="885.0" dy="16">el mediastino medio</tspan></text><rect x="40.0" y="539.5" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="667.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="695.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="717.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Posterior: aorta descendente, esófago, conducto torácico, ácigos y hemiácigos, vagos y cadena simpática.</tspan><tspan x="58.0" dy="18">• Anterior: timo, ganglios mamarios internos, grasa. Medio: corazón, pericardio, frénicos, tráquea y bronquios principales.</tspan><tspan x="58.0" dy="18">• Tumor posterior típico: neurogénico (schwannoma). Anterior: timoma, teratoma, linfoma y bocio endotorácico.</tspan></text><text x="58.0" y="775.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Moore Anatomía con orientación clínica 8.ª ed.; Netter Atlas de Anatomía Humana 8.ª ed.; Shields Thoracic Surgery 8.ª ed.</tspan></text></svg>