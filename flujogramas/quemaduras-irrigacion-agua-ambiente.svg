<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1082" viewBox="0 0 820 1082" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Quemaduras: irrigación con agua a temperatura ambiente"><title>Quemaduras: irrigación con agua a temperatura ambiente</title><rect width="820" height="1082" fill="#ffffff"/><rect x="0" y="0" width="820" height="142" fill="#0f766e"/><text x="40" y="34" font-size="13" font-weight="600" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="740"><tspan x="40" dy="0">MedQuizPlus · Flujograma</tspan></text><text x="40" y="70" font-size="24" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="740"><tspan x="40" dy="0">Quemaduras: irrigación con agua a temperatura</tspan><tspan x="40" dy="30">ambiente</tspan></text><text x="40" y="126" font-size="13" font-weight="400" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="740"><tspan x="40" dy="0">ENAM 2020 · CIR-005 · Cirugía General y Digestiva</tspan></text><rect x="90" y="174" width="640" height="76" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="108" y="202" font-size="11" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="604"><tspan x="108" dy="0">INICIO</tspan></text><text x="108" y="226" font-size="16" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Quemadura térmica reciente</tspan></text><line x1="410.0" y1="252" x2="410.0" y2="272" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,270 417.0,270 410.0,280" fill="#94a3b8"/><rect x="90" y="282" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="310" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="334" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Detener el proceso: retirar la fuente de calor, la ropa y</tspan><tspan x="108" dy="22">los objetos (anillos, pulseras)</tspan></text><line x1="410.0" y1="382" x2="410.0" y2="402" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,400 417.0,400 410.0,410" fill="#94a3b8"/><rect x="90" y="412" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="440" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="464" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Irrigar con agua a temperatura ambiente durante 10 a 20</tspan><tspan x="108" dy="22">minutos</tspan></text><line x1="410.0" y1="512" x2="410.0" y2="532" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,530 417.0,530 410.0,540" fill="#94a3b8"/><rect x="90" y="542" width="640" height="124" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><circle cx="120" cy="604.0" r="12" fill="#d97706"/><text x="120" y="609.0" font-size="15" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="120" dy="0">?</tspan></text><text x="142" y="570" font-size="11" font-weight="700" font-style="normal" fill="#b45309" text-anchor="start" data-max="570"><tspan x="142" dy="0">DECISIÓN</tspan></text><text x="142" y="594" font-size="16" font-weight="600" font-style="normal" fill="#78350f" text-anchor="start" data-max="570"><tspan x="142" dy="0">¿Se está usando hielo o agua helada?</tspan></text><text x="142" y="622" font-size="14" font-weight="500" font-style="italic" fill="#92400e" text-anchor="start" data-max="570"><tspan x="142" dy="0">↳ Evitarlo: produce vasoconstricción, profundiza la lesión y</tspan><tspan x="142" dy="20">causa hipotermia</tspan></text><line x1="410.0" y1="668" x2="410.0" y2="688" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,686 417.0,686 410.0,696" fill="#94a3b8"/><rect x="90" y="698" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="726" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="750" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Cubrir con apósito o paño limpio y evaluar extensión y</tspan><tspan x="108" dy="22">profundidad</tspan></text><line x1="410.0" y1="798" x2="410.0" y2="818" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,816 417.0,816 410.0,826" fill="#94a3b8"/><rect x="90" y="828" width="640" height="76" rx="12" fill="#134e4a" stroke="#134e4a" stroke-width="2"/><text x="108" y="856" font-size="11" font-weight="700" font-style="normal" fill="#5eead4" text-anchor="start" data-max="604"><tspan x="108" dy="0">CONDUCTA FINAL</tspan></text><text x="108" y="880" font-size="16" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Analgesia y referencia si cumple criterios de gran quemado</tspan></text><rect x="40" y="934" width="740" height="98" rx="10" fill="#f0fdfa" stroke="#99f6e4"/><rect x="40" y="934" width="6" height="98" rx="3" fill="#14b8a6"/><text x="62" y="960" font-size="14" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="704"><tspan x="62" dy="0">Perla clínica</tspan></text><text x="62" y="984" font-size="15" font-weight="400" font-style="normal" fill="#134e4a" text-anchor="start" data-max="704"><tspan x="62" dy="0">El enfriamiento precoz con agua limita la progresión del daño en la zona de</tspan><tspan x="62" dy="21">estasis de la quemadura.</tspan></text><text x="410.0" y="1060" font-size="11" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="740"><tspan x="410.0" dy="0">MedQuizPlus · Material de estudio: contrasta siempre con las guías clínicas vigentes.</tspan></text></svg>
