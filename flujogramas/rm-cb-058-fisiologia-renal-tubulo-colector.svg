data-max="524"><tspan x="58.0" dy="0">Dos tipos celulares con funciones distintas.</tspan><tspan x="58.0" dy="17">Principales: sodio, potasio y agua. Intercaladas: equilibrio ácido-base.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿En dónde se ubican las células intercaladas o</tspan><tspan x="640.0" dy="16">intercalares renales?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">RECORRIDO POR EL NEFRÓN HASTA EL TÚBULO COLECTOR</tspan></text><rect x="40.0" y="269.0" width="920.0" height="111.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="269.0" width="108.0" height="111.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="328.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Glomérulo</tspan></text><rect x="40.0" y="380.0" width="920.0" height="111.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="380.0" width="108.0" height="111.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="435.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Túbulo</tspan><tspan x="94.0" dy="14">proximal</tspan></text><rect x="40.0" y="491.0" width="920.0" height="111.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="491.0" width="108.0" height="111.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="550.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Asa de Henle</tspan></text><rect x="40.0" y="602.0" width="920.0" height="111.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="602.0" width="108.0" height="111.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="661.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Túbulo distal</tspan></text><rect x="40.0" y="713.0" width="920.0" height="111.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="713.0" width="108.0" height="111.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="772.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Túbulo colector</tspan></text><line x1="307.2" y1="316.5" x2="314.2" y2="316.5" stroke="#0f766e" stroke-width="2.2"/><line x1="314.2" y1="316.5" x2="314.2" y2="435.5" stroke="#0f766e" stroke-width="2.2"/><line x1="314.2" y1="435.5" x2="312.2" y2="435.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="312.2,440.5 312.2,430.5 321.2,435.5" fill="#0f766e"/><line x1="470.4" y1="435.5" x2="477.4" y2="435.5" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="435.5" x2="477.4" y2="538.5" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="538.5" x2="475.4" y2="538.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="475.4,543.5 475.4,533.5 484.4,538.5" fill="#0f766e"/><line x1="633.6" y1="538.5" x2="640.6" y2="538.5" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="538.5" x2="640.6" y2="657.5" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="657.5" x2="638.6" y2="657.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="638.6,662.5 638.6,652.5 647.6,657.5" fill="#0f766e"/><line x1="796.8" y1="657.5" x2="803.8" y2="657.5" stroke="#ea580c" stroke-width="2.2"/><line x1="803.8" y1="657.5" x2="803.8" y2="760.5" stroke="#ea580c" stroke-width="2.2"/><line x1="803.8" y1="760.5" x2="801.8" y2="760.5" stroke="#ea580c" stroke-width="2.2"/><polygon points="801.8,765.5 801.8,755.5 810.8,760.5" fill="#ea580c"/><rect x="158.0" y="282.0" width="149.2" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Cápsula de Bowman</tspan></text><text x="168.0" y="315.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Filtración; es parte del</tspan><tspan x="168.0" dy="14.5">glomérulo</tspan></text><circle cx="158.0" cy="282.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="321.2" y="393.0" width="149.2" height="85.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="331.2" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Túbulo proximal</tspan></text><text x="331.2" y="426.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Reabsorbe la mayor</tspan><tspan x="331.2" dy="14.5">parte del sodio, agua y</tspan><tspan x="331.2" dy="14.5">bicarbonato</tspan></text><circle cx="321.2" cy="393.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="321.2" y="397.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="321.2" dy="0">2</tspan></text><rect x="484.4" y="504.0" width="149.2" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="494.4" y="520.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Asa de Henle</tspan></text><text x="494.4" y="537.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Concentra la orina por el</tspan><tspan x="494.4" dy="14.5">gradiente medular</tspan></text><circle cx="484.4" cy="504.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="484.4" y="508.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="484.4" dy="0">3</tspan></text><rect x="647.6" y="615.0" width="149.2" height="85.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="657.6" y="631.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Túbulo distal</tspan></text><text x="657.6" y="648.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Ajuste fino de sodio; el</tspan><tspan x="657.6" dy="14.5">conector también las</tspan><tspan x="657.6" dy="14.5">tiene</tspan></text><circle cx="647.6" cy="615.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="647.6" y="619.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="647.6" dy="0">4</tspan></text><rect x="810.8" y="726.0" width="149.2" height="69.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="820.8" y="742.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Túbulo colector</tspan></text><text x="820.8" y="759.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Células principales e</tspan><tspan x="820.8" dy="14.5">intercaladas</tspan></text><circle cx="810.8" cy="726.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="810.8" y="730.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="810.8" dy="0">5</tspan></text><rect x="40.0" y="842.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="868.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Células intercaladas = túbulo colector</tspan></text><text x="60.0" y="887.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Regulan el equilibrio ácido-base; el asa y el túbulo proximal tienen otros tipos celulares.</tspan></text><text x="40.0" y="948.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÉLULAS DEL TÚBULO COLECTOR</tspan></text><rect x="40.0" y="960.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="979.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Célula</tspan></text><text x="270.0" y="979.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Función</tspan></text><text x="620.0" y="979.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Fármaco o enfermedad relacionada</tspan></text><rect x="40.0" y="989.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="1008.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Principal</tspan></text><text x="270.0" y="1008.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Sodio por ENaC, potasio por ROMK, agua por acuaporina 2</tspan></text><text x="620.0" y="1008.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Espironolactona y amilorida; ADH y aldosterona</tspan></text><rect x="40.0" y="1018.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="1037.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Intercalada A</tspan></text><text x="270.0" y="1037.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Secreta H⁺ y reabsorbe bicarbonato: acidifica la orina</tspan></text><text x="620.0" y="1037.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Acidosis tubular distal tipo 1; acetazolamida actúa sobre la</tspan><tspan x="620.0" dy="15">anhidrasa carbónica</tspan></text><rect x="160.6" y="1029.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="206.0" y="1044.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="206.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="1062.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="1081.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Intercalada B</tspan></text><text x="270.0" y="1081.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Secreta bicarbonato en la alcalosis</tspan></text><text x="620.0" y="1081.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Reacción a la alcalosis metabólica</tspan></text><text x="40.0" y="1131.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1141.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1172.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1163.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Cápsula de</tspan><tspan x="285.0" dy="17">Bowman</tspan></text><rect x="363.0" y="1144.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="1172.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Túbulo colector</tspan></text><text x="585.0" y="1172.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Asa de Henle</tspan></text><text x="735.0" y="1172.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Túbulo proximal</tspan></text><text x="885.0" y="1172.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Túbulo distal</tspan></text><rect x="40.0" y="1195.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="1195.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1224.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Dónde se ubican?</tspan></text><text x="285.0" y="1216.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: pertenece al</tspan><tspan x="285.0" dy="16">glomérulo, no al túbulo</tspan></text><text x="435.0" y="1216.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: junto a las células</tspan><tspan x="435.0" dy="16">principales</tspan></text><text x="585.0" y="1216.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: otros tipos</tspan><tspan x="585.0" dy="16">celulares</tspan></text><text x="735.0" y="1216.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: otros tipos</tspan><tspan x="735.0" dy="16">celulares</tspan></text><text x="885.0" y="1216.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: la ubicación</tspan><tspan x="885.0" dy="16">clásica es el colector</tspan></text><rect x="40.0" y="1141.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1269.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1297.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1319.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Células principales (mayoría): reabsorben sodio por ENaC con aldosterona, secretan potasio por ROMK y reabsorben agua por acuaporina 2 con ADH.</tspan><tspan x="58.0" dy="18">• Intercaladas tipo A: secretan H⁺ (H⁺-ATPasa y H⁺/K⁺-ATPasa) y reabsorben bicarbonato: acidifican la orina. Tipo B: secretan bicarbonato en la</tspan><tspan x="58.0" dy="18">   alcalosis.</tspan><tspan x="58.0" dy="18">• Su disfunción causa acidosis tubular distal (tipo 1): pH urinario alto, hipopotasemia y nefrocalcinosis.</tspan><tspan x="58.0" dy="18">• En rigor el segmento conector también las contiene, pero la ubicación clásica es el colector. Espironolactona y amilorida actúan sobre las principales:</tspan><tspan x="58.0" dy="18">   hiperpotasemia.</tspan></text><text x="58.0" y="1431.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Guyton y Hall Tratado de Fisiología Médica, 14.ª ed. (2021); Brenner y Rector, El Riñón, 11.ª ed. (2020).</tspan></text></svg>