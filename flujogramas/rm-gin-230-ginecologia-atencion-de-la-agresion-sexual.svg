<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="898" viewBox="0 0 1000 898" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Tras una agresión sexual se inicia la anticoncepción de emergencia con levonorgestrel 1,5 mg"><title>Tras una agresión sexual se inicia la anticoncepción de emergencia con levonorgestrel 1,5 mg</title><rect x="0.75" y="0.75" width="998.5" height="896.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ginecología · atención de la agresión sexual</tspan></text><rect x="461.8" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="541.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="541.6" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Violencia sexual</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Urgencia médica y legal: contención, examen con cadena de custodia y tratamiento.</tspan><tspan x="58.0" dy="17">Prevención de embarazo y de infecciones, con seguimiento psicológico.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Paciente que consulta tras una agresión</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué tratamiento se inicia?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SE HACE Y EN QUÉ PLAZO</tspan></text><text x="44.0" y="267.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Todo en la primera consulta, con la anticoncepción de emergencia lo antes posible.</tspan></text><line x1="178.0" y1="306.0" x2="362.0" y2="306.0" stroke="#99f6e4" stroke-width="6"/><line x1="408.0" y1="306.0" x2="592.0" y2="306.0" stroke="#99f6e4" stroke-width="6"/><line x1="638.0" y1="306.0" x2="822.0" y2="306.0" stroke="#99f6e4" stroke-width="6"/><circle cx="155.0" cy="306.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="155.0" y="310.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="155.0" dy="0">hoy</tspan></text><rect x="45.0" y="340.0" width="220.0" height="75.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="155.0" y="360.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="155.0" dy="0">Contención y examen</tspan></text><text x="155.0" y="377.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="155.0" dy="0">Evidencias con cadena de custodia y</tspan><tspan x="155.0" dy="16">tratamiento de lesiones</tspan></text><circle cx="385.0" cy="306.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="385.0" y="310.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="385.0" dy="0">hoy</tspan></text><rect x="275.0" y="340.0" width="220.0" height="75.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="385.0" y="360.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="385.0" dy="0">Profilaxis de ITS</tspan></text><text x="385.0" y="377.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="385.0" dy="0">Ceftriaxona, doxiciclina y metronidazol;</tspan><tspan x="385.0" dy="16">vacuna contra hepatitis B</tspan></text><circle cx="615.0" cy="306.0" r="22" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><text x="615.0" y="310.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="38"><tspan x="615.0" dy="0">72 h</tspan></text><rect x="505.0" y="340.0" width="220.0" height="75.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="615.0" y="360.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="208"><tspan x="615.0" dy="0">Levonorgestrel 1,5 mg</tspan></text><text x="615.0" y="377.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="615.0" dy="0">Dosis única para prevenir el embarazo</tspan></text><rect x="514.6" y="404.0" width="200.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="615.0" y="419.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="615.0" dy="0">◆ ESTE CASO: LEVONORGESTREL</tspan></text><circle cx="845.0" cy="306.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="845.0" y="310.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="845.0" dy="0">120 h</tspan></text><rect x="735.0" y="340.0" width="220.0" height="75.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="845.0" y="360.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="845.0" dy="0">Alternativas tardías</tspan></text><text x="845.0" y="377.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="845.0" dy="0">Ulipristal o DIU de cobre; el</tspan><tspan x="845.0" dy="16">levonorgestrel rinde menos</tspan></text><rect x="40.0" y="447.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="473.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Anticoncepción de emergencia con levonorgestrel 1,5 mg</tspan></text><text x="60.0" y="492.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Las otras opciones son antivirales, antifúngicos o antibióticos mal dosificados.</tspan></text><text x="40.0" y="559.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="569.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="600.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="591.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Aciclovir 800 mg vía</tspan><tspan x="285.0" dy="17">oral</tspan></text><text x="435.0" y="591.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Fluconazol 150 mg</tspan><tspan x="435.0" dy="17">vía oral</tspan></text><text x="585.0" y="591.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Cefazolina 2 g</tspan><tspan x="585.0" dy="17">endovenoso</tspan></text><text x="735.0" y="591.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Doxiciclina 2 g vía</tspan><tspan x="735.0" dy="17">oral</tspan></text><rect x="813.0" y="572.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="591.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Levonorgestrel 1,5</tspan><tspan x="885.0" dy="17">mg vía oral</tspan></text><rect x="40.0" y="623.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="623.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="660.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué se inicia?</tspan></text><text x="285.0" y="652.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no es profilaxis de</tspan><tspan x="285.0" dy="16">rutina</tspan></text><text x="435.0" y="652.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: trata candidiasis,</tspan><tspan x="435.0" dy="16">no es profilaxis</tspan></text><text x="585.0" y="652.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no cubre gonococo</tspan><tspan x="585.0" dy="16">ni clamidia</tspan></text><text x="735.0" y="644.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: la dosis es de 100</tspan><tspan x="735.0" dy="16">mg cada 12 horas, no</tspan><tspan x="735.0" dy="16">2 g</tspan></text><text x="885.0" y="644.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: anticoncepción de</tspan><tspan x="885.0" dy="16">emergencia hasta 72</tspan><tspan x="885.0" dy="16">horas</tspan></text><rect x="40.0" y="569.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="713.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="741.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="763.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Anticoncepción de emergencia: levonorgestrel 1,5 mg en dosis única, lo antes posible y hasta 72 horas (menor eficacia hasta 120 horas); también</tspan><tspan x="58.0" dy="18">   ulipristal o DIU de cobre.</tspan><tspan x="58.0" dy="18">• Profilaxis de ITS (CDC 2021): ceftriaxona 500 mg IM, doxiciclina 100 mg cada 12 horas por 7 días y metronidazol 500 mg cada 12 horas por 7 días.</tspan><tspan x="58.0" dy="18">• Se vacuna contra hepatitis B si no hubo inmunización y se evalúa la profilaxis de VIH antes de las 72 horas según el riesgo.</tspan><tspan x="58.0" dy="18">• Alerta: aciclovir y fluconazol no son profilaxis de rutina; la doxiciclina se da a 100 mg, no 2 g.</tspan></text><text x="58.0" y="857.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, Guías de tratamiento de las ITS 2021 (MMWR Recomm Rep 2021;70(4)); OMS, Atención clínica de la violencia sexual (2019); Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>