ke="#0f766e" stroke-width="2"/><rect x="634.0" y="474.0" width="10.0" height="64.0" rx="4" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="656.0" y="496.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="100"><tspan x="656.0" dy="0">≥ 2</tspan></text><text x="760.0" y="496.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Sospecha alta</tspan></text><text x="760.0" y="514.0" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Cloro en sudor ≥ 60 mmol/L</tspan><tspan x="760.0" dy="15">confirma</tspan></text><polygon points="614.0,497.0 614.0,515.0 630.0,506.0" fill="#f59e0b"/><rect x="852.6" y="463.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="898.0" y="478.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="898.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="570.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="598.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="620.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Tamizaje neonatal: tripsinógeno inmunorreactivo.</tspan><tspan x="58.0" dy="18">• Tratamiento: enzimas pancreáticas, fisioterapia, antibióticos.</tspan><tspan x="58.0" dy="18">• Pseudomonas y S. aureus colonizan el pulmón.</tspan></text><text x="58.0" y="678.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CFF – Diagnosis of cystic fibrosis: consensus guidelines (2017) · Nelson Tratado de Pediatría 22.ª ed. (2024)</tspan></text></svg>