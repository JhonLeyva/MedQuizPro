<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="896" viewBox="0 0 1000 896" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Gestante a término con cesárea previa de incisión corporal (clásica) que inicia trabajo de parto con sangrado: cesárea de emergencia"><title>Gestante a término con cesárea previa de incisión corporal (clásica) que inicia trabajo de parto con sangrado: cesárea de emergencia</title><rect x="0.75" y="0.75" width="998.5" height="894.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Parto después de una cesárea</tspan></text><rect x="379.1" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="466.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="466.3" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cicatriz uterina corporal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La incisión vertical en el cuerpo del útero (clásica) se rompe en el 4-9 % si hay trabajo de</tspan><tspan x="58.0" dy="17">parto.</tspan><tspan x="58.0" dy="17">Por eso está prohibido el parto vaginal: cesárea programada a las 36-37 semanas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante de 42 años, a término</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Cesárea anterior con incisión corporal.</tspan><tspan x="640.0" dy="16">Inicio de trabajo de parto con sangrado vaginal</tspan><tspan x="640.0" dy="16">moderado.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿PUEDE INTENTAR PARTO VAGINAL? DEPENDE DE LA CICATRIZ</tspan></text><rect x="40.0" y="285.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="307.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="190"><tspan x="54.0" dy="0">CICATRIZ PREVIA</tspan></text><text x="427.5" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="335"><tspan x="427.5" dy="0">Sin trabajo de parto</tspan></text><text x="782.5" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="335"><tspan x="782.5" dy="0">En trabajo de parto</tspan></text><rect x="40.0" y="325.0" width="204.0" height="71.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="351.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="182"><tspan x="54.0" dy="0">Segmentaria transversa</tspan></text><text x="54.0" y="368.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="182"><tspan x="54.0" dy="0">Una sola, sin otras</tspan><tspan x="54.0" dy="14">contraindicaciones</tspan></text><rect x="253.0" y="325.0" width="349.0" height="71.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="265.0" y="357.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="331"><tspan x="265.0" dy="0">Puede intentar parto</tspan></text><text x="265.0" y="373.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="331"><tspan x="265.0" dy="0">Prueba de trabajo de parto</tspan></text><rect x="608.0" y="325.0" width="349.0" height="71.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="620.0" y="357.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="331"><tspan x="620.0" dy="0">Vigilar de cerca</tspan></text><text x="620.0" y="373.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="331"><tspan x="620.0" dy="0">Monitoreo continuo</tspan></text><rect x="40.0" y="402.0" width="204.0" height="57.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="428.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="182"><tspan x="54.0" dy="0">Corporal (clásica) o en T</tspan></text><text x="54.0" y="445.0" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="182"><tspan x="54.0" dy="0">Vertical en el cuerpo del útero</tspan></text><rect x="253.0" y="402.0" width="349.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="265.0" y="427.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="331"><tspan x="265.0" dy="0">Cesárea programada</tspan></text><text x="265.0" y="443.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="331"><tspan x="265.0" dy="0">36-37 semanas</tspan></text><rect x="608.0" y="402.0" width="349.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="620.0" y="427.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="331"><tspan x="620.0" dy="0">Cesárea de emergencia</tspan></text><text x="620.0" y="443.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="331"><tspan x="620.0" dy="0">Riesgo de rotura 4-9 %</tspan></text><rect x="856.2" y="391.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="901.6" y="406.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="901.6" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="465.0" width="204.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="498.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="182"><tspan x="54.0" dy="0">Rotura uterina previa</tspan></text><rect x="253.0" y="465.0" width="349.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="265.0" y="490.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="331"><tspan x="265.0" dy="0">Cesárea programada</tspan></text><text x="265.0" y="506.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="331"><tspan x="265.0" dy="0">Antes del trabajo de parto</tspan></text><rect x="608.0" y="465.0" width="349.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="620.0" y="497.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="331"><tspan x="620.0" dy="0">Cesárea de emergencia</tspan></text><text x="44.0" y="544.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Sangrado + contracciones con cicatriz corporal: no esperar ni inducir.</tspan></text><text x="40.0" y="592.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="602.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="641.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="605.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="633.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Cesárea de</tspan><tspan x="285.0" dy="17">emergencia</tspan></text><text x="435.0" y="624.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Controlar el</tspan><tspan x="435.0" dy="17">sangrado y pedir</tspan><tspan x="435.0" dy="17">grupo y Rh</tspan></text><text x="585.0" y="633.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Monitoreo</tspan><tspan x="585.0" dy="17">electrónico</tspan></text><text x="735.0" y="633.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Inducción de parto</tspan><tspan x="735.0" dy="17">vaginal</tspan></text><text x="885.0" y="624.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Esperar parto</tspan><tspan x="885.0" dy="17">vaginal con</tspan><tspan x="885.0" dy="17">monitoreo</tspan></text><rect x="40.0" y="673.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="673.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="702.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Conducta?</tspan></text><text x="285.0" y="694.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: puede romperse el</tspan><tspan x="285.0" dy="16">útero</tspan></text><text x="435.0" y="694.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Hay que hacerlo, pero</tspan><tspan x="435.0" dy="16">sin retrasar la cesárea</tspan></text><text x="585.0" y="694.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No reemplaza a la</tspan><tspan x="585.0" dy="16">cesárea</tspan></text><text x="735.0" y="694.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: contraindicada con</tspan><tspan x="735.0" dy="16">cicatriz corporal</tspan></text><text x="885.0" y="702.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: contraindicado</tspan></text><rect x="40.0" y="602.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="747.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="775.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="797.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Cesárea de emergencia: el sangrado puede ser el inicio de una rotura uterina.</tspan><tspan x="58.0" dy="18">• Signos de rotura: dolor intenso, pérdida de la presentación, bradicardia fetal, choque.</tspan><tspan x="58.0" dy="18">• Cicatriz segmentaria transversa única: se puede intentar parto vaginal (éxito 60-80 %).</tspan></text><text x="58.0" y="855.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, parto vaginal tras cesárea (2019); RCOG; Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>