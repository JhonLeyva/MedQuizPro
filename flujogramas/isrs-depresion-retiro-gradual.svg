<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Al indicar un ISRS para la depresión hay que explicar que su retiro debe ser gradual y supervisado (síndrome de discontinuación)"><title>Al indicar un ISRS para la depresión hay que explicar que su retiro debe ser gradual y supervisado (síndrome de discontinuación)</title><rect x="0.75" y="0.75" width="998.5" height="798.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Psicofarmacología · antidepresivos</tspan></text><rect x="409.2" y="32.0" width="124.2" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="471.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="108"><tspan x="471.3" dy="0">PSIQUIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Inhibidores selectivos de la recaptación de serotonina</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Primera línea en depresión y en los trastornos de ansiedad (sertralina, fluoxetina,</tspan><tspan x="58.0" dy="17">escitalopram).</tspan><tspan x="58.0" dy="17">Tardan 2-4 semanas en hacer efecto; no crean tolerancia ni adicción.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Paciente con depresión</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Llanto fácil, minusvalía y bradipsiquia.</tspan><tspan x="640.0" dy="16">Se decide iniciar un ISRS.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LAS FASES DEL TRATAMIENTO CON UN ISRS</tspan></text><rect x="42.0" y="279.0" width="302.7" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="193.3" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">INICIO</tspan></text><text x="193.3" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">Semanas 1-4</tspan></text><rect x="348.7" y="279.0" width="302.7" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="500.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">MANTENIMIENTO</tspan></text><text x="500.0" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">6-12 meses</tspan></text><rect x="655.3" y="279.0" width="302.7" height="56.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="806.7" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">RETIRO</tspan></text><text x="806.7" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">Semanas</tspan></text><rect x="761.3" y="268.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="806.7" y="283.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="806.7" dy="0">◆ ESTE CASO</tspan></text><rect x="48.0" y="349.0" width="290.7" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="193.3" y="377.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">DOSIS BAJA Y SUBIR</tspan></text><text x="193.3" y="401.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">Efecto en 2-4 semanas</tspan><tspan x="193.3" dy="17">Náusea, ansiedad inicial</tspan></text><rect x="354.7" y="349.0" width="290.7" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="386.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">SEGUIR AUNQUE ESTÉ BIEN</tspan></text><text x="500.0" y="410.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">Evita la recaída</tspan></text><rect x="661.3" y="349.0" width="290.7" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="806.7" y="377.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">BAJAR DE A POCO</tspan></text><text x="806.7" y="401.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">Mareo, parestesias, irritabilidad si es brusco</tspan><tspan x="806.7" dy="17">Este caso</tspan></text><text x="40.0" y="480.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="490.2" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="529.7" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="493.2" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="521.2" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Retiro gradual y</tspan><tspan x="285.0" dy="17">supervisado</tspan></text><text x="435.0" y="512.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Puede causar</tspan><tspan x="435.0" dy="17">tolerancia</tspan><tspan x="435.0" dy="17">rápidamente</tspan></text><text x="585.0" y="521.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Iniciar alto y bajar</tspan><tspan x="585.0" dy="17">para impregnar</tspan></text><text x="735.0" y="512.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">No es de elección</tspan><tspan x="735.0" dy="17">primaria en caso de</tspan><tspan x="735.0" dy="17">ansiedad</tspan></text><text x="885.0" y="512.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Se pueden</tspan><tspan x="885.0" dy="17">combinar con IMAO</tspan><tspan x="885.0" dy="17">sin riesgo</tspan></text><rect x="40.0" y="561.2" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="561.2" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="598.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Condición?</tspan></text><text x="285.0" y="582.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: suspenderlo de</tspan><tspan x="285.0" dy="16">golpe da</tspan><tspan x="285.0" dy="16">discontinuación</tspan></text><text x="435.0" y="590.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no producen</tspan><tspan x="435.0" dy="16">tolerancia</tspan></text><text x="585.0" y="590.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: se inicia bajo y se</tspan><tspan x="585.0" dy="16">sube</tspan></text><text x="735.0" y="590.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: también son de</tspan><tspan x="735.0" dy="16">elección en ansiedad</tspan></text><text x="885.0" y="590.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: síndrome</tspan><tspan x="885.0" dy="16">serotoninérgico grave</tspan></text><rect x="40.0" y="490.2" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="651.2" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="679.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="701.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Empezar con dosis baja y subir; el efecto llega en 2-4 semanas (avisarlo).</tspan><tspan x="58.0" dy="18">• Mantener 6-12 meses después de la remisión; retirar en semanas (síndrome de discontinuación).</tspan><tspan x="58.0" dy="18">• Nunca con IMAO (síndrome serotoninérgico): esperar 2 semanas (5 con fluoxetina).</tspan></text><text x="58.0" y="759.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: APA, guía de trastorno depresivo mayor (2019); NICE, depresión en adultos (2022); CANMAT (2023).</tspan></text></svg>