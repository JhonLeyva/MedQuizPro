<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="978" viewBox="0 0 1000 978" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Agitación, alucinaciones, taquicardia, hipertermia, diaforesis y midriasis: toxídrome simpaticomimético por cocaína"><title>Agitación, alucinaciones, taquicardia, hipertermia, diaforesis y midriasis: toxídrome simpaticomimético por cocaína</title><rect x="0.75" y="0.75" width="998.5" height="976.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Toxicología · toxídromes</tspan></text><rect x="346.7" y="32.0" width="121.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="407.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="106"><tspan x="407.6" dy="0">INFECTOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Toxídromes</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cada tóxico produce un conjunto de signos vitales, pupilas y piel.</tspan><tspan x="58.0" dy="17">El adolescente tiene un cuadro simpaticomimético.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Adolescente de 15 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Agitación, alucinaciones visuales, FC 120, T 38,5 °C y</tspan><tspan x="640.0" dy="16">PA 160/100.</tspan><tspan x="640.0" dy="16">Piel sudorosa y pupilas dilatadas.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><rect x="40.0" y="261.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="287.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Midriasis + sudor + hipertensión + hipertermia = cocaína</tspan></text><text x="60.0" y="306.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Sedantes, colinérgicos, alcohol y opioides tienen otros toxídromes.</tspan></text><text x="40.0" y="367.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TOXÍDROMES: SIGNOS VITALES, PUPILAS Y PIEL</tspan></text><rect x="40.0" y="379.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="398.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Toxídrome</tspan></text><text x="320.0" y="398.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="201"><tspan x="320.0" dy="0">Signos vitales</tspan></text><text x="536.7" y="398.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="201"><tspan x="536.7" dy="0">Pupilas</tspan></text><text x="753.3" y="398.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="201"><tspan x="753.3" dy="0">Piel</tspan></text><rect x="40.0" y="408.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="427.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Simpaticomimético</tspan></text><text x="320.0" y="427.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="201"><tspan x="320.0" dy="0">Taquicardia, hipertensión,</tspan><tspan x="320.0" dy="15">hipertermia, agitación</tspan></text><text x="536.7" y="427.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="201"><tspan x="536.7" dy="0">Midriasis</tspan></text><text x="753.3" y="427.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="201"><tspan x="753.3" dy="0">Sudorosa</tspan></text><rect x="210.6" y="419.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="256.0" y="434.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="256.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="452.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="471.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Anticolinérgico</tspan></text><text x="320.0" y="471.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="201"><tspan x="320.0" dy="0">Taquicardia, hipertermia, delirio</tspan></text><text x="536.7" y="471.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="201"><tspan x="536.7" dy="0">Midriasis</tspan></text><text x="753.3" y="471.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="201"><tspan x="753.3" dy="0">Seca</tspan></text><rect x="40.0" y="481.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="500.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Colinérgico (organofosforados)</tspan></text><text x="320.0" y="500.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="201"><tspan x="320.0" dy="0">Bradicardia, broncorrea,</tspan><tspan x="320.0" dy="15">fasciculaciones</tspan></text><text x="536.7" y="500.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="201"><tspan x="536.7" dy="0">Miosis</tspan></text><text x="753.3" y="500.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="201"><tspan x="753.3" dy="0">Sudorosa</tspan></text><rect x="40.0" y="525.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="544.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Opioide (heroína)</tspan></text><text x="320.0" y="544.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="201"><tspan x="320.0" dy="0">Bradipnea, hipotensión, coma</tspan></text><text x="536.7" y="544.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="201"><tspan x="536.7" dy="0">Miosis</tspan></text><text x="753.3" y="544.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="201"><tspan x="753.3" dy="0">Fría</tspan></text><rect x="40.0" y="554.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="573.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Sedante (benzodiacepinas)</tspan></text><text x="320.0" y="573.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="201"><tspan x="320.0" dy="0">Somnolencia, hipotonía, depresión</tspan><tspan x="320.0" dy="15">respiratoria</tspan></text><text x="536.7" y="573.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="201"><tspan x="536.7" dy="0">Normales</tspan></text><text x="753.3" y="573.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="201"><tspan x="753.3" dy="0">Normal</tspan></text><text x="40.0" y="638.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="648.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="670.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="670.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Benzodiacepina</tspan></text><text x="435.0" y="670.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Organofosforado</tspan></text><text x="585.0" y="670.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Alcohol</tspan></text><rect x="663.0" y="651.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="670.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Cocaína</tspan></text><text x="885.0" y="670.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Heroína</tspan></text><rect x="40.0" y="685.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="685.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="722.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tóxico causal?</tspan></text><text x="285.0" y="714.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: sedante, con</tspan><tspan x="285.0" dy="16">pupilas normales</tspan></text><text x="435.0" y="714.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: miosis, bradicardia</tspan><tspan x="435.0" dy="16">y broncorrea</tspan></text><text x="585.0" y="706.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: depresión del</tspan><tspan x="585.0" dy="16">sensorio, sin este</tspan><tspan x="585.0" dy="16">cuadro</tspan></text><text x="735.0" y="706.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: simpaticomimético</tspan><tspan x="735.0" dy="16">con midriasis y</tspan><tspan x="735.0" dy="16">sudoración</tspan></text><text x="885.0" y="714.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: miosis y depresión</tspan><tspan x="885.0" dy="16">respiratoria</tspan></text><rect x="40.0" y="648.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="775.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="803.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="825.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Simpaticomimético: agitación, taquicardia, hipertensión, hipertermia, diaforesis y midriasis; la cocaína bloquea la recaptación de catecolaminas.</tspan><tspan x="58.0" dy="18">• Colinérgico (organofosforados): miosis, bradicardia, broncorrea y salivación. Opioide (heroína): miosis, depresión respiratoria y coma. Sedante</tspan><tspan x="58.0" dy="18">   (benzodiacepinas): somnolencia con pupilas normales.</tspan><tspan x="58.0" dy="18">• Anticolinérgico: midriasis con piel seca; simpaticomimético: midriasis con piel sudorosa. También entran anfetaminas, síndrome serotoninérgico y golpe</tspan><tspan x="58.0" dy="18">   de calor.</tspan><tspan x="58.0" dy="18">• Tratamiento de soporte: benzodiacepinas, enfriamiento activo si hay hipertermia y control de la hipertensión.</tspan></text><text x="58.0" y="937.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Can J Cardiol, toxicidad cardiovascular aguda de la cocaína (2022); AHA, cocaína (Circulation 2008); Harrison, 21.ª ed. (2022).</tspan></text></svg>