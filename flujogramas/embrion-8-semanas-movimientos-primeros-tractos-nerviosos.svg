<tspan x="193.3" dy="0">Neurulación</tspan></text><rect x="348.7" y="269.0" width="302.7" height="216.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="500.0" y="287.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">8 SEM</tspan></text><text x="500.0" y="477.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">Movimientos</tspan></text><rect x="655.3" y="269.0" width="302.7" height="216.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="806.7" y="287.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">&gt; 20 SEM</tspan></text><text x="806.7" y="477.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">Maduración</tspan></text><path d="M 60.0,453.9 L 206.7,438.6 L 353.3,418.2 L 500.0,402.9 L 646.7,387.6 L 793.3,372.3 L 940.0,362.1" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="58.0" y1="309.0" x2="80.0" y2="309.0" stroke="#0ea5e9" stroke-width="3"/><text x="86.0" y="313.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0ea5e9" text-anchor="start" data-max="200"><tspan x="86.0" dy="0">Conexiones nerviosas</tspan></text><line x1="500.0" y1="271.0" x2="500.0" y2="461.0" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/><rect x="454.6" y="444.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="500.0" y="459.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">◆ ESTE CASO</tspan></text><rect x="48.0" y="499.0" width="290.7" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="193.3" y="536.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">Tubo neural</tspan></text><text x="193.3" y="560.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">Se cierra</tspan></text><rect x="354.7" y="499.0" width="290.7" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="527.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">PRIMEROS TRACTOS</tspan></text><text x="500.0" y="551.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">Arcos reflejos</tspan><tspan x="500.0" dy="17">Espontáneos</tspan></text><rect x="661.3" y="499.0" width="290.7" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="806.7" y="536.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">Mielinización</tspan></text><text x="806.7" y="560.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">Continúa tras nacer</tspan></text><text x="40.0" y="628.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">RELACIÓN · MARCADA LA CORRECTA</tspan></text><rect x="40.0" y="640.2" width="127.8" height="30.0" rx="15" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="103.9" y="659.7" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="103.9" dy="0">✓ Primeros tractos</tspan></text><rect x="175.8" y="640.2" width="118.4" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="235.0" y="659.7" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="235.0" dy="0">Tractos motores</tspan></text><rect x="302.2" y="640.2" width="100.4" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="352.4" y="659.7" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="352.4" dy="0">Mielinización</tspan></text><rect x="410.7" y="640.2" width="108.0" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="464.6" y="659.7" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="464.6" dy="0">Corticoespinal</tspan></text><rect x="40.0" y="694.2" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="722.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="744.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La mielinización empieza en el segundo trimestre.</tspan><tspan x="58.0" dy="18">• Los tractos corticoespinales maduran después.</tspan><tspan x="58.0" dy="18">• Déficit de folato: defectos del tubo neural.</tspan></text><text x="58.0" y="802.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Langman. Embriología médica 15.ª ed. (2023) · Moore. Embriología clínica 11.ª ed.</tspan></text></svg>