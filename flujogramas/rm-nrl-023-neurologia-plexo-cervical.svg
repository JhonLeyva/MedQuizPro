<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="953" viewBox="0 0 1000 953" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El plexo cervical (C1-C4) se forma con las ramas anteriores de los nervios raquídeos"><title>El plexo cervical (C1-C4) se forma con las ramas anteriores de los nervios raquídeos</title><rect x="0.75" y="0.75" width="998.5" height="951.8" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neurología · plexo cervical</tspan></text><rect x="358.6" y="32.0" width="113.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="415.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="98"><tspan x="415.5" dy="0">NEUROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Nervio raquídeo</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se divide al salir del agujero intervertebral en una rama posterior y una anterior.</tspan><tspan x="58.0" dy="17">Los plexos se forman siempre con las ramas anteriores (ventrales).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de anatomía</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Las ramas de los nervios raquídeos que forman el</tspan><tspan x="640.0" dy="16">plexo cervical son…</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EL PLEXO CERVICAL Y SUS RAMAS</tspan></text><line x1="410.9" y1="406.5" x2="340.0" y2="430.3" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="430.3" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.1" y1="346.8" x2="660.0" y2="323.1" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="323.1" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="587.6" y1="410.7" x2="660.0" y2="438.8" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="438.8" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="410.9" y1="346.8" x2="340.0" y2="323.1" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="323.1" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="376.7" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="376.7" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="381.7" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">PLEXO CERVICAL</tspan></text><text x="500.0" y="400.7" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">ramas anteriores C1-C4</tspan></text><rect x="40.0" y="277.5" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="306.3" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Ramas anteriores C1-C4</tspan></text><text x="190.0" y="330.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Forman el plexo; profundo al</tspan><tspan x="190.0" dy="17">esternocleidomastoideo</tspan></text><rect x="144.6" y="358.7" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="373.7" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="384.7" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="385.7" width="6.0" height="89.2" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="413.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Ramas posteriores</tspan></text><text x="190.0" y="437.2" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Músculos y piel paravertebrales; no forman</tspan><tspan x="190.0" dy="17">plexos</tspan></text><rect x="660.0" y="269.0" width="300.0" height="108.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="270.0" width="6.0" height="106.2" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="810.0" y="297.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Ramas sensitivas superficiales</tspan></text><text x="810.0" y="321.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Occipital menor, auricular mayor, cervical</tspan><tspan x="810.0" dy="17">transverso y supraclaviculares, por el punto de</tspan><tspan x="810.0" dy="17">Erb</tspan></text><rect x="660.0" y="393.2" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="394.2" width="6.0" height="89.2" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="422.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Ramas motoras</tspan></text><text x="810.0" y="445.7" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Músculos prevertebrales y nervio frénico</tspan><tspan x="810.0" dy="17">(C3-C5): diafragma</tspan></text><text x="40.0" y="520.3" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="532.3" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="556.8" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Nervio raquídeo</tspan></text><line x1="248.5" y1="552.8" x2="267.5" y2="552.8" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,547.8 266.5,557.8 274.5,552.8" fill="#0f766e"/><rect x="278.5" y="532.3" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="556.8" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Sale del agujero intervertebral</tspan></text><line x1="487.0" y1="552.8" x2="506.0" y2="552.8" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,547.8 505.0,557.8 513.0,552.8" fill="#0f766e"/><rect x="517.0" y="532.3" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="556.8" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Rama anterior (ventral)</tspan></text><line x1="725.5" y1="552.8" x2="744.5" y2="552.8" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,547.8 743.5,557.8 751.5,552.8" fill="#0f766e"/><rect x="755.5" y="532.3" width="204.5" height="41.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="556.8" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Plexo cervical C1-C4</tspan></text><text x="40.0" y="613.3" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="623.3" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="645.8" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="645.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Anterolaterales</tspan></text><text x="435.0" y="645.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Posteriores</tspan></text><text x="585.0" y="645.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Anteroposteriores</tspan></text><text x="735.0" y="645.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Laterales</tspan></text><rect x="813.0" y="626.3" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="645.8" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Anteriores</tspan></text><rect x="40.0" y="660.3" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="660.3" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="697.3" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Ramas que lo forman?</tspan></text><text x="285.0" y="681.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no es</tspan><tspan x="285.0" dy="16">denominación</tspan><tspan x="285.0" dy="16">anatómica</tspan></text><text x="435.0" y="681.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: son</tspan><tspan x="435.0" dy="16">paravertebrales y no</tspan><tspan x="435.0" dy="16">forman plexos</tspan></text><text x="585.0" y="681.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no es</tspan><tspan x="585.0" dy="16">denominación</tspan><tspan x="585.0" dy="16">anatómica</tspan></text><text x="735.0" y="681.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no es</tspan><tspan x="735.0" dy="16">denominación</tspan><tspan x="735.0" dy="16">anatómica</tspan></text><text x="885.0" y="689.3" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: los plexos nacen de</tspan><tspan x="885.0" dy="16">las ramas anteriores</tspan></text><rect x="40.0" y="623.3" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="750.3" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="778.3" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="800.3" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Plexo cervical: ramas anteriores de C1 a C4, profundo al esternocleidomastoideo. Plexo braquial: C5-T1. Plexo lumbosacro: L1-S4.</tspan><tspan x="58.0" dy="18">• Sensitivas superficiales (occipital menor, auricular mayor, cervical transverso, supraclaviculares) emergen por el punto de Erb y dan sensibilidad al cuello,</tspan><tspan x="58.0" dy="18">   oreja y hombro.</tspan><tspan x="58.0" dy="18">• Motoras: músculos prevertebrales y nervio frénico (C3-C5): «C3, C4, C5 mantienen vivo el diafragma».</tspan><tspan x="58.0" dy="18">• Las ramas posteriores inervan músculos y piel paravertebrales y no forman plexos. Perla: el bloqueo del plexo cervical superficial sirve en la</tspan><tspan x="58.0" dy="18">   endarterectomía carotídea.</tspan></text><text x="58.0" y="912.3" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Gray's Anatomy, 42.ª ed. (2021); Moore, Anatomía con orientación clínica, 9.ª ed. (2022); Netter, Atlas de Anatomía Humana, 8.ª ed. (2023)</tspan></text></svg>