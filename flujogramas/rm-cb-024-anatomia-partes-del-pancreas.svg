<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1035" viewBox="0 0 1000 1035" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La cabeza del páncreas ocupa la concavidad en C del duodeno"><title>La cabeza del páncreas ocupa la concavidad en C del duodeno</title><rect x="0.75" y="0.75" width="998.5" height="1033.8" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Anatomía · partes del páncreas</tspan></text><rect x="384.6" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="456.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="456.5" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Páncreas</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Órgano retroperitoneal con cabeza, cuello, cuerpo y cola.</tspan><tspan x="58.0" dy="17">Cruza la columna a la altura de L1-L2.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué porción del páncreas está en la concavidad del</tspan><tspan x="640.0" dy="16">duodeno?</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CINCO PARTES DEL PÁNCREAS DE DERECHA A IZQUIERDA</tspan></text><line x1="406.3" y1="433.7" x2="340.0" y2="438.8" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="438.8" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="423.8" y1="481.7" x2="340.0" y2="542.3" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="542.3" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.1" y1="396.8" x2="660.0" y2="373.1" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="373.1" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="454.7" x2="660.0" y2="476.7" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="476.7" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="421.1" y1="375.6" x2="340.0" y2="323.1" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="323.1" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="426.7" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="426.7" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="431.7" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">PÁNCREAS</tspan></text><text x="500.0" y="450.7" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">retroperitoneal, L1-L2</tspan></text><rect x="40.0" y="269.0" width="300.0" height="108.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="297.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">CABEZA</tspan></text><text x="190.0" y="321.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Dentro del duodeno en C</tspan><tspan x="190.0" dy="17">Contiene el colédoco distal</tspan><tspan x="190.0" dy="17">Su tumor causa ictericia</tspan></text><rect x="144.6" y="367.2" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="382.2" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="393.2" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="394.2" width="6.0" height="89.2" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="422.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">PROCESO UNCIFORME</tspan></text><text x="190.0" y="445.7" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Detrás de la vena mesentérica superior</tspan><tspan x="190.0" dy="17">Sale de la cabeza hacia la izquierda</tspan></text><rect x="40.0" y="500.3" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="501.3" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="190.0" y="534.1" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">CUELLO</tspan></text><text x="190.0" y="557.8" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Delante de la confluencia mesentérico-portal</tspan></text><rect x="660.0" y="331.1" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="332.1" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="364.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">CUERPO</tspan></text><text x="810.0" y="388.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Cruza la aorta y la arteria mesentérica superior</tspan></text><rect x="660.0" y="431.1" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="432.1" width="6.0" height="89.2" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="459.9" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">COLA</tspan></text><text x="810.0" y="483.6" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Llega al hilio esplénico</tspan><tspan x="810.0" dy="17">Se lesiona con el bazo</tspan></text><text x="40.0" y="620.3" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="632.3" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="656.8" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Duodeno en forma de C</tspan></text><line x1="248.5" y1="652.8" x2="267.5" y2="652.8" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,647.8 266.5,657.8 274.5,652.8" fill="#0f766e"/><rect x="278.5" y="632.3" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="656.8" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Abraza la cabeza del páncreas</tspan></text><line x1="487.0" y1="652.8" x2="506.0" y2="652.8" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,647.8 505.0,657.8 513.0,652.8" fill="#0f766e"/><rect x="517.0" y="632.3" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="656.8" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Colédoco pasa por detrás</tspan></text><line x1="725.5" y1="652.8" x2="744.5" y2="652.8" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,647.8 743.5,657.8 751.5,652.8" fill="#0f766e"/><rect x="755.5" y="632.3" width="204.5" height="41.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="656.8" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Tumor: ictericia sin dolor</tspan></text><text x="40.0" y="713.3" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="723.3" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="745.8" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="726.3" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="745.8" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Cabeza</tspan></text><text x="435.0" y="745.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Cuerpo</tspan></text><text x="585.0" y="745.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Cuello</tspan></text><text x="735.0" y="745.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Cola</tspan></text><text x="885.0" y="745.8" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Proceso unciforme</tspan></text><rect x="40.0" y="760.3" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="760.3" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="797.3" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿En la C del duodeno?</tspan></text><text x="285.0" y="789.3" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: ocupa el marco</tspan><tspan x="285.0" dy="16">duodenal</tspan></text><text x="435.0" y="789.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: cruza la aorta y la</tspan><tspan x="435.0" dy="16">mesentérica superior</tspan></text><text x="585.0" y="789.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: está delante de la</tspan><tspan x="585.0" dy="16">confluencia portal</tspan></text><text x="735.0" y="789.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: llega al hilio del</tspan><tspan x="735.0" dy="16">bazo</tspan></text><text x="885.0" y="781.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es parte de la</tspan><tspan x="885.0" dy="16">cabeza, detrás de la</tspan><tspan x="885.0" dy="16">VMS</tspan></text><rect x="40.0" y="723.3" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="850.3" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="878.3" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="900.3" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Cabeza: dentro del marco duodenal, a la derecha de la línea media, a la altura de L2; contiene la parte final del colédoco.</tspan><tspan x="58.0" dy="18">• Proceso unciforme: prolongación de la cabeza hacia la izquierda, por detrás de la vena mesentérica superior. Cuello: delante de la confluencia</tspan><tspan x="58.0" dy="18">   mesentérico-portal.</tspan><tspan x="58.0" dy="18">• Cuerpo: cruza aorta y arteria mesentérica superior. Cola: llega al hilio esplénico, por eso el trauma esplénico puede lesionarla.</tspan><tspan x="58.0" dy="18">• Clínica: el tumor de la cabeza da ictericia obstructiva indolora con vesícula palpable (signo de Courvoisier-Terrier).</tspan></text><text x="58.0" y="994.3" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Moore Anatomía con orientación clínica 9.ª ed.; Netter Atlas de Anatomía Humana 8.ª ed.; Schwartz Principios de Cirugía 11.ª ed.</tspan></text></svg>