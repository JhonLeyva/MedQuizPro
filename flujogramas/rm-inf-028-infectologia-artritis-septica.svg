<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1028" viewBox="0 0 1000 1028" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Staphylococcus aureus es el germen más frecuente de la artritis séptica"><title>Staphylococcus aureus es el germen más frecuente de la artritis séptica</title><rect x="0.75" y="0.75" width="998.5" height="1026.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Infectología · artritis séptica</tspan></text><rect x="366.1" y="32.0" width="121.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="427.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="106"><tspan x="427.0" dy="0">INFECTOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Artritis séptica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Emergencia ortopédica: destruye el cartílago con rapidez.</tspan><tspan x="58.0" dy="17">Monoartritis aguda, fiebre e impotencia funcional.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es el microorganismo más frecuente causante</tspan><tspan x="640.0" dy="16">de la artritis séptica?</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">GERMEN SEGÚN EL TIPO DE PACIENTE</tspan></text><line x1="421.1" y1="363.5" x2="340.0" y2="311.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="311.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="421.1" y1="465.7" x2="340.0" y2="518.2" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="518.2" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="386.5" x2="660.0" y2="364.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="364.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.1" y1="444.4" x2="660.0" y2="468.2" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="468.2" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="406.0" y1="414.6" x2="340.0" y2="414.6" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="414.6" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="414.6" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="414.6" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="419.6" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">ARTRITIS SÉPTICA</tspan></text><text x="500.0" y="438.6" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">Monoartritis aguda</tspan></text><rect x="40.0" y="269.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="270.0" width="6.0" height="82.0" rx="3" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="190.0" y="302.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">ESCHERICHIA COLI</tspan></text><text x="190.0" y="326.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Ancianos e inmunodeprimidos</tspan></text><rect x="40.0" y="369.0" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="397.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">STAPHYLOCOCCUS AUREUS</tspan></text><text x="190.0" y="421.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Adultos y niños mayores</tspan><tspan x="190.0" dy="17">El más frecuente</tspan></text><rect x="144.6" y="450.2" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="465.2" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="476.2" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="477.2" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="190.0" y="509.9" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">HAEMOPHILUS INFLUENZAE</tspan></text><text x="190.0" y="533.6" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Casi desapareció con la vacuna conjugada</tspan></text><rect x="660.0" y="319.0" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="320.0" width="6.0" height="89.2" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="347.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">NEISSERIA GONORRHOEAE</tspan></text><text x="810.0" y="371.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Adulto joven sexualmente activo</tspan><tspan x="810.0" dy="17">Tenosinovitis y lesiones cutáneas</tspan></text><rect x="660.0" y="426.2" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="427.2" width="6.0" height="82.0" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="459.9" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">PSEUDOMONAS AERUGINOSA</tspan></text><text x="810.0" y="483.6" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Usuarios de drogas endovenosas</tspan></text><text x="40.0" y="596.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="608.2" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="632.7" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Artrocentesis</tspan></text><line x1="248.5" y1="628.7" x2="267.5" y2="628.7" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,623.7 266.5,633.7 274.5,628.7" fill="#0f766e"/><rect x="278.5" y="608.2" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="632.7" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Gram y cultivo</tspan></text><line x1="487.0" y1="628.7" x2="506.0" y2="628.7" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,623.7 505.0,633.7 513.0,628.7" fill="#0f766e"/><rect x="517.0" y="608.2" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="632.7" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Antibiótico empírico</tspan></text><line x1="725.5" y1="628.7" x2="744.5" y2="628.7" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,623.7 743.5,633.7 751.5,628.7" fill="#0f766e"/><rect x="755.5" y="608.2" width="204.5" height="41.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="632.7" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Drenaje articular</tspan></text><text x="40.0" y="689.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="699.2" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="730.2" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="730.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Escherichia coli</tspan></text><rect x="363.0" y="702.2" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="721.7" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Staphylococcus</tspan><tspan x="435.0" dy="17">aureus</tspan></text><text x="585.0" y="721.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Haemophilus</tspan><tspan x="585.0" dy="17">influenzae</tspan></text><text x="735.0" y="721.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Neisseria</tspan><tspan x="735.0" dy="17">gonorrhoeae</tspan></text><text x="885.0" y="721.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Pseudomonas</tspan><tspan x="885.0" dy="17">aeruginosa</tspan></text><rect x="40.0" y="753.2" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="753.2" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="782.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Germen más</tspan><tspan x="54.0" dy="16">frecuente?</tspan></text><text x="285.0" y="782.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: ancianos e</tspan><tspan x="285.0" dy="16">inmunodeprimidos</tspan></text><text x="435.0" y="774.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: el más frecuente en</tspan><tspan x="435.0" dy="16">adultos y niños</tspan><tspan x="435.0" dy="16">mayores</tspan></text><text x="585.0" y="782.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: casi desapareció</tspan><tspan x="585.0" dy="16">con la vacuna</tspan></text><text x="735.0" y="782.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: frecuente solo en</tspan><tspan x="735.0" dy="16">adultos jóvenes activos</tspan></text><text x="885.0" y="782.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: usuarios de drogas</tspan><tspan x="885.0" dy="16">endovenosas</tspan></text><rect x="40.0" y="699.2" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="843.2" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="871.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="893.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Se confirma con artrocentesis: más de 50 000 leucocitos/mm³ con predominio de polimorfonucleares, Gram y cultivo.</tspan><tspan x="58.0" dy="18">• S. aureus, incluido el resistente a meticilina, es el más frecuente en adultos y niños mayores, seguido de los estreptococos.</tspan><tspan x="58.0" dy="18">• N. gonorrhoeae predomina en adultos jóvenes sexualmente activos; gramnegativos en ancianos e inmunodeprimidos; P. aeruginosa en usuarios de</tspan><tspan x="58.0" dy="18">   drogas endovenosas.</tspan><tspan x="58.0" dy="18">• Tratamiento: antibiótico con cobertura estafilocócica más drenaje articular. Rodilla caliente con prótesis: séptica hasta probar lo contrario.</tspan></text><text x="58.0" y="987.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Mathews CJ et al., artritis séptica bacteriana en adultos, Lancet 2010;375:846-55; Mandell, Douglas y Bennett, Enfermedades infecciosas, 9.ª ed. (2020).</tspan></text></svg>