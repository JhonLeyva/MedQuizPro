<svg xmlns="http://www.w3.org/2000/svg" width="820" height="918" viewBox="0 0 820 918" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Conflicto de intereses en bioética"><title>Conflicto de intereses en bioética</title><rect width="820" height="918" fill="#ffffff"/><rect x="0" y="0" width="820" height="112" fill="#0f766e"/><text x="40" y="34" font-size="13" font-weight="600" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="740"><tspan x="40" dy="0">MedQuizPlus · Flujograma</tspan></text><text x="40" y="70" font-size="24" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="740"><tspan x="40" dy="0">Conflicto de intereses en bioética</tspan></text><text x="40" y="96" font-size="13" font-weight="400" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="740"><tspan x="40" dy="0">ENAM 2020 · SP-006 · Salud Pública, Gestión y Epidemiología</tspan></text><rect x="90" y="144" width="640" height="98" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="108" y="172" font-size="11" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="604"><tspan x="108" dy="0">INICIO</tspan></text><text x="108" y="196" font-size="16" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Un experto emite una recomendación pública o una guía</tspan><tspan x="108" dy="22">clínica</tspan></text><line x1="410.0" y1="244" x2="410.0" y2="264" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,262 417.0,262 410.0,272" fill="#94a3b8"/><rect x="90" y="274" width="640" height="98" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><circle cx="120" cy="323.0" r="12" fill="#d97706"/><text x="120" y="328.0" font-size="15" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="120" dy="0">?</tspan></text><text x="142" y="302" font-size="11" font-weight="700" font-style="normal" fill="#b45309" text-anchor="start" data-max="570"><tspan x="142" dy="0">DECISIÓN</tspan></text><text x="142" y="326" font-size="16" font-weight="600" font-style="normal" fill="#78350f" text-anchor="start" data-max="570"><tspan x="142" dy="0">¿Tiene un vínculo financiero con la empresa del producto</tspan><tspan x="142" dy="22">que recomienda?</tspan></text><line x1="410.0" y1="374" x2="410.0" y2="394" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,392 417.0,392 410.0,402" fill="#94a3b8"/><rect x="90" y="404" width="640" height="76" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="432" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="456" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Sí: existe conflicto de intereses</tspan></text><line x1="410.0" y1="482" x2="410.0" y2="502" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,500 417.0,500 410.0,510" fill="#94a3b8"/><rect x="90" y="512" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="540" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="564" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Debe declararlo públicamente y, según el caso, abstenerse de</tspan><tspan x="108" dy="22">decidir</tspan></text><line x1="410.0" y1="612" x2="410.0" y2="632" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,630 417.0,630 410.0,640" fill="#94a3b8"/><rect x="90" y="642" width="640" height="98" rx="12" fill="#134e4a" stroke="#134e4a" stroke-width="2"/><text x="108" y="670" font-size="11" font-weight="700" font-style="normal" fill="#5eead4" text-anchor="start" data-max="604"><tspan x="108" dy="0">CONDUCTA FINAL</tspan></text><text x="108" y="694" font-size="16" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Ocultarlo es una falta ética que compromete la integridad</tspan><tspan x="108" dy="22">científica</tspan></text><rect x="40" y="770" width="740" height="98" rx="10" fill="#f0fdfa" stroke="#99f6e4"/><rect x="40" y="770" width="6" height="98" rx="3" fill="#14b8a6"/><text x="62" y="796" font-size="14" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="704"><tspan x="62" dy="0">Perla clínica</tspan></text><text x="62" y="820" font-size="15" font-weight="400" font-style="normal" fill="#134e4a" text-anchor="start" data-max="704"><tspan x="62" dy="0">El conflicto de intereses existe aunque la recomendación sea correcta; lo</tspan><tspan x="62" dy="21">reprochable es ocultarlo.</tspan></text><text x="410.0" y="896" font-size="11" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="740"><tspan x="410.0" dy="0">MedQuizPlus · Material de estudio: contrasta siempre con las guías clínicas vigentes.</tspan></text></svg>
