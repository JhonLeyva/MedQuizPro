<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1048" viewBox="0 0 1000 1048" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La profilaxis ocular del recién nacido se dirige sobre todo a Neisseria gonorrhoeae, que puede perforar la córnea"><title>La profilaxis ocular del recién nacido se dirige sobre todo a Neisseria gonorrhoeae, que puede perforar la córnea</title><rect x="0.75" y="0.75" width="998.5" height="1046.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neonatología · profilaxis de la conjuntivitis neonatal</tspan></text><rect x="506.9" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="555.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="555.9" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Oftalmía neonatal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Conjuntivitis del primer mes, adquirida en el canal del parto.</tspan><tspan x="58.0" dy="17">Neisseria gonorrhoeae es la causa más temida; Chlamydia, la más frecuente en algunos</tspan><tspan x="58.0" dy="17">países.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Recién nacido</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Debe recibir profilaxis en las primeras horas de vida.</tspan><tspan x="640.0" dy="16">¿Contra qué infección se dirige especialmente?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CUÁNDO ACTÚA LA PROFILAXIS Y CUÁNDO APARECE CADA INFECCIÓN</tspan></text><rect x="40.0" y="269.0" width="920.0" height="34.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="52.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="134"><tspan x="52.0" dy="0">EVENTO</tspan></text><text x="256.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="128"><tspan x="256.0" dy="0">1.ª hora</tspan></text><text x="388.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="128"><tspan x="388.0" dy="0">2 a 5 días</tspan></text><text x="520.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="128"><tspan x="520.0" dy="0">5 a 14 días</tspan></text><text x="652.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="128"><tspan x="652.0" dy="0">4 a 12 semanas</tspan></text><text x="734.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="220"><tspan x="734.0" dy="0">REGLA</tspan></text><rect x="192.0" y="305.0" width="128.0" height="234.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/><rect x="40.0" y="309.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="339.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Profilaxis ocular</tspan></text><line x1="198.0" y1="335.0" x2="710.0" y2="335.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="256.0" cy="330.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="256.0" y="334.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="256.0" dy="0">✓</tspan></text><text x="256.0" y="357.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="256.0" dy="0">Sí</tspan></text><rect x="730.0" y="309.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="331.5" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">Eritromicina, tetraciclina o povidona en</tspan><tspan x="740.0" dy="15">la atención inmediata.</tspan></text><rect x="40.0" y="367.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="389.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Conjuntivitis</tspan><tspan x="50.0" dy="16">gonocócica</tspan></text><line x1="198.0" y1="393.0" x2="710.0" y2="393.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="388.0" cy="388.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="388.0" y="392.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">✓</tspan></text><text x="388.0" y="415.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="388.0" dy="0">Sí</tspan></text><rect x="730.0" y="367.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="389.5" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">Hiperaguda y purulenta; riesgo de</tspan><tspan x="740.0" dy="15">perforación corneal.</tspan></text><rect x="40.0" y="425.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="447.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Conjuntivitis por</tspan><tspan x="50.0" dy="16">Chlamydia</tspan></text><line x1="198.0" y1="451.0" x2="710.0" y2="451.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="520.0" cy="446.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="520.0" y="450.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="520.0" dy="0">✓</tspan></text><text x="520.0" y="473.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="520.0" dy="0">Sí</tspan></text><rect x="730.0" y="425.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="447.5" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">Menos grave; el ungüento es menos</tspan><tspan x="740.0" dy="15">eficaz.</tspan></text><rect x="40.0" y="483.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="505.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Neumonía por</tspan><tspan x="50.0" dy="16">Chlamydia</tspan></text><line x1="198.0" y1="509.0" x2="710.0" y2="509.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="652.0" cy="504.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="652.0" y="508.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="652.0" dy="0">✓</tspan></text><text x="652.0" y="531.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="652.0" dy="0">Sí</tspan></text><rect x="730.0" y="483.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="505.5" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">Complicación posterior de la infección</tspan><tspan x="740.0" dy="15">materna.</tspan></text><rect x="199.8" y="294.0" width="112.4" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="256.0" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="256.0" dy="0">◆ PRIMERA HORA</tspan></text><text x="44.0" y="555.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="44.0" dy="0">✓ momento en que ocurre o se aplica</tspan></text><rect x="40.0" y="579.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="605.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Profilaxis neonatal = gonococo</tspan></text><text x="60.0" y="624.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Klebsiella, E. coli, S. aureus y Streptococcus causan conjuntivitis tardía, no son el objetivo.</tspan></text><text x="40.0" y="691.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="701.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="732.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="732.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Klebsiella sp</tspan></text><rect x="363.0" y="704.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="723.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Neisseria</tspan><tspan x="435.0" dy="17">gonorrhoeae</tspan></text><text x="585.0" y="732.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Escherichia coli</tspan></text><text x="735.0" y="723.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Staphylococcus</tspan><tspan x="735.0" dy="17">aureus</tspan></text><text x="885.0" y="732.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Streptococcus sp</tspan></text><rect x="40.0" y="755.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="755.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="784.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Infección que se</tspan><tspan x="54.0" dy="16">previene?</tspan></text><text x="285.0" y="776.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: puede causar</tspan><tspan x="285.0" dy="16">conjuntivitis tardía, no</tspan><tspan x="285.0" dy="16">es el objetivo</tspan></text><text x="435.0" y="776.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: conjuntivitis</tspan><tspan x="435.0" dy="16">hiperaguda con riesgo</tspan><tspan x="435.0" dy="16">de ceguera</tspan></text><text x="585.0" y="776.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: puede causar</tspan><tspan x="585.0" dy="16">conjuntivitis tardía, no</tspan><tspan x="585.0" dy="16">es el objetivo</tspan></text><text x="735.0" y="776.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: puede causar</tspan><tspan x="735.0" dy="16">conjuntivitis tardía, no</tspan><tspan x="735.0" dy="16">es el objetivo</tspan></text><text x="885.0" y="776.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: puede causar</tspan><tspan x="885.0" dy="16">conjuntivitis tardía, no</tspan><tspan x="885.0" dy="16">es el objetivo</tspan></text><rect x="40.0" y="701.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="845.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="873.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="895.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Gonococo: conjuntivitis hiperaguda purulenta a los 2 a 5 días, con edema palpebral y quemosis; puede perforar la córnea y causar ceguera.</tspan><tspan x="58.0" dy="18">• Profilaxis en la primera hora: ungüento oftálmico de eritromicina al 0,5 %, tetraciclina al 1 % o povidona yodada; está en la atención inmediata (NTS</tspan><tspan x="58.0" dy="18">   214-2024).</tspan><tspan x="58.0" dy="18">• Chlamydia aparece entre los 5 y 14 días y puede dar neumonía a las 4 a 12 semanas; el ungüento es menos eficaz contra ella.</tspan><tspan x="58.0" dy="18">• Diagnóstico: Gram y cultivo. Gonocócica: ceftriaxona IM en dosis única y hospitalización (urgencia oftalmológica). Mejor prevención: tamizar y tratar a la</tspan><tspan x="58.0" dy="18">   gestante.</tspan></text><text x="58.0" y="1007.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA, NTS 214-2024, Atención integral del recién nacido; AAP, Red Book 2024-2027, 33.ª ed.; Nelson Tratado de Pediatría, 22.ª ed. (2024).</tspan></text></svg>