<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1275" viewBox="0 0 1000 1275" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Víctima de incendio intubada con PaO₂ 400, saturación del gasómetro 99 % pero lactato 6 e hipotensión: hiperoxemia con hipoxia tisular (monóxido de carbono)"><title>Víctima de incendio intubada con PaO₂ 400, saturación del gasómetro 99 % pero lactato 6 e hipotensión: hiperoxemia con hipoxia tisular (monóxido de carbono)</title><rect x="0.75" y="0.75" width="998.5" height="1274.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Toxicología · monóxido de carbono</tspan></text><rect x="408.9" y="32.0" width="158.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="488.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="143"><tspan x="488.3" dy="0">CIENCIAS BÁSICAS ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Intoxicación por monóxido de carbono</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El CO se une a la hemoglobina 200 veces más que el O₂: forma carboxihemoglobina, que</tspan><tspan x="58.0" dy="17">no lleva oxígeno.</tspan><tspan x="58.0" dy="17">La PaO₂ (oxígeno disuelto) puede ser normal o alta, pero los tejidos no reciben O₂: lactato</tspan><tspan x="58.0" dy="17">alto.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Joven de 20 años rescatado de un sótano</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Hollín en la vía aérea; intubado con O₂ 100 %.</tspan><tspan x="640.0" dy="16">PA 80/50; pH 7,50, PaCO₂ 30, PaO₂ 400; lactato 6</tspan><tspan x="640.0" dy="16">mmol/L.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="377.0" x2="500.0" y2="407.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="407.0" x2="733.5" y2="407.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="407.0" x2="266.5" y2="436.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,435.0 271.5,435.0 266.5,443.0" fill="#94a3b8"/><line x1="733.5" y1="407.0" x2="733.5" y2="436.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,435.0 738.5,435.0 733.5,443.0" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#0f766e"/><line x1="500.0" y1="377.0" x2="500.0" y2="407.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="407.0" x2="500.0" y2="407.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="407.0" x2="266.5" y2="436.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,435.0 271.5,435.0 266.5,443.0" fill="#0f766e"/><rect x="187.6" y="416.0" width="157.9" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="428.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Sospecha de CO (este caso)</tspan></text><rect x="665.3" y="416.0" width="136.5" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="428.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Lactato muy alto sin CO</tspan></text><polygon points="240.0,342.0 266.0,307.0 734.0,307.0 760.0,342.0 734.0,377.0 266.0,377.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="342.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="347.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="338.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">PaO₂ alta pero lactato alto y choque tras un incendio:</tspan><tspan x="519.0" dy="17">¿carboxihemoglobina alta?</tspan></text><rect x="40.0" y="443.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="471.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">HIPEROXEMIA + HIPOXIA TISULAR</tspan></text><text x="266.5" y="494.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Cooximetría</tspan><tspan x="266.5" dy="17">O₂ 100 %, valorar hiperbárica</tspan></text><rect x="507.0" y="443.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="479.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Pensar en cianuro</tspan></text><text x="733.5" y="502.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Hidroxocobalamina</tspan></text><text x="40.0" y="573.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="585.5" width="920.0" height="346.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="599.5" width="353.8" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="232.9" y="619.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="232.9" dy="0">OXÍGENO EN SANGRE: QUÉ MIDE CADA VALOR</tspan></text><text x="425.8" y="619.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="516"><tspan x="425.8" dy="0">En la intoxicación por CO cada número cuenta algo distinto.</tspan></text><rect x="56.0" y="659.5" width="213.0" height="121.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="660.1" width="211.8" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="162.5" y="687.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="197"><tspan x="162.5" dy="0">PAO₂</tspan></text><text x="162.5" y="707.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="189"><tspan x="162.5" dy="0">O₂ disuelto</tspan></text><circle cx="72.0" cy="732.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="736.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="82.0" dy="0">Aquí 400: alto por el O₂ 100 %</tspan></text><circle cx="72.0" cy="755.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="759.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="82.0" dy="0">Normal en el CO</tspan></text><rect x="281.0" y="659.5" width="213.0" height="121.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="281.6" y="660.1" width="211.8" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="387.5" y="687.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="197"><tspan x="387.5" dy="0">SATO₂ DEL GASÓMETRO</tspan></text><text x="387.5" y="707.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="189"><tspan x="387.5" dy="0">Calculada</tspan></text><circle cx="297.0" cy="732.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="307.0" y="736.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="307.0" dy="0">Aquí 99 %: engaña</tspan></text><rect x="506.0" y="659.5" width="213.0" height="121.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="506.6" y="660.1" width="211.8" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="612.5" y="687.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="197"><tspan x="612.5" dy="0">CARBOXIHEMOGLOBINA</tspan></text><text x="612.5" y="707.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="189"><tspan x="612.5" dy="0">Cooximetría</tspan></text><circle cx="522.0" cy="732.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="532.0" y="736.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="532.0" dy="0">La real: confirma el CO</tspan></text><rect x="731.0" y="659.5" width="213.0" height="121.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="732.2" y="660.7" width="210.6" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="837.5" y="687.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="197"><tspan x="837.5" dy="0">LACTATO</tspan></text><text x="837.5" y="707.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="189"><tspan x="837.5" dy="0">Hipoxia tisular</tspan></text><circle cx="747.0" cy="732.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="757.0" y="736.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="175"><tspan x="757.0" dy="0">Aquí 6: los tejidos sin O₂</tspan></text><rect x="792.1" y="648.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="837.5" y="663.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="837.5" dy="0">◆ ESTE CASO</tspan></text><text x="56.0" y="810.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="819.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="834.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="834.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Lactato 6 con choque: hipoxia de los tejidos</tspan></text><rect x="56.0" y="841.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="856.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="856.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">PaO₂ 400: no hay hipoxemia</tspan></text><rect x="56.0" y="878.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="901.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Cooximetría, O₂ al 100 % y valorar cámara hiperbárica.</tspan></text><text x="40.0" y="971.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="981.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1021.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1004.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hipoxemia severa</tspan><tspan x="285.0" dy="17">sin hipoxia por</tspan><tspan x="285.0" dy="17">O₂Hb</tspan></text><text x="435.0" y="1004.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hipoxemia leve con</tspan><tspan x="435.0" dy="17">hipoxia por</tspan><tspan x="435.0" dy="17">disociación O2Hb</tspan></text><rect x="513.0" y="984.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="1012.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Hiperoxemia con</tspan><tspan x="585.0" dy="17">hipoxia tisular</tspan></text><text x="735.0" y="1004.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hipoxemia</tspan><tspan x="735.0" dy="17">moderada con</tspan><tspan x="735.0" dy="17">hipoxia</tspan></text><text x="885.0" y="1012.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Normoxemia sin</tspan><tspan x="885.0" dy="17">hipoxia tisular</tspan></text><rect x="40.0" y="1052.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="1052.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1081.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Interpretación?</tspan></text><text x="285.0" y="1081.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: la PaO₂ es 400</tspan></text><text x="435.0" y="1081.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no hay hipoxemia</tspan></text><text x="585.0" y="1073.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: PaO₂ alta y tejidos</tspan><tspan x="585.0" dy="16">sin O₂</tspan></text><text x="735.0" y="1081.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no hay hipoxemia</tspan></text><text x="885.0" y="1073.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: el lactato muestra</tspan><tspan x="885.0" dy="16">hipoxia tisular</tspan></text><rect x="40.0" y="981.5" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1126.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1154.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1176.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El pulsioxímetro y la saturación calculada engañan: pedir cooximetría (carboxihemoglobina).</tspan><tspan x="58.0" dy="18">• Oxígeno al 100 % (baja la vida media del CO de 5 h a ~1 h); cámara hiperbárica si es grave o embarazada.</tspan><tspan x="58.0" dy="18">• En incendios pensar también en cianuro (lactato muy alto): hidroxocobalamina.</tspan></text><text x="58.0" y="1234.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Undersea and Hyperbaric Medical Society (2024); Goldfrank's 11.ª ed.</tspan></text></svg>