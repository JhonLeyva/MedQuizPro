<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="912" viewBox="0 0 1000 912" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El modelo comunitario fomenta el autocuidado y la participación responsable de los usuarios en todos los niveles"><title>El modelo comunitario fomenta el autocuidado y la participación responsable de los usuarios en todos los niveles</title><rect x="0.75" y="0.75" width="998.5" height="910.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Salud pública · modelos de educación sanitaria</tspan></text><rect x="479.6" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="543.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="543.9" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Modelos de educación sanitaria</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Han evolucionado desde el profesional como experto hasta el usuario como protagonista.</tspan><tspan x="58.0" dy="17">Cada uno cambia el papel del usuario.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de modelo</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Fomenta el autocuidado y la participación activa y</tspan><tspan x="640.0" dy="16">responsable en las decisiones.</tspan><tspan x="640.0" dy="16">¿Qué modelo es?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><rect x="40.0" y="261.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="287.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Autocuidado y participación en todos los niveles = modelo comunitario</tspan></text><text x="60.0" y="306.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El crítico busca transformar condiciones sociales; biomédico, asistencial y preventivo dejan al usuario pasivo.</tspan></text><text x="40.0" y="367.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">MODELOS DE EDUCACIÓN SANITARIA</tspan></text><rect x="40.0" y="379.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="398.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Modelo</tspan></text><text x="270.0" y="398.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Enfoque</tspan></text><text x="620.0" y="398.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Papel del usuario</tspan></text><rect x="40.0" y="408.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="427.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Biomédico</tspan></text><text x="270.0" y="427.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Enfermedad; profesional experto</tspan></text><text x="620.0" y="427.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Pasivo</tspan></text><rect x="40.0" y="437.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="456.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Asistencial</tspan></text><text x="270.0" y="456.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Atención curativa en el establecimiento</tspan></text><text x="620.0" y="456.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Receptor de atención</tspan></text><rect x="40.0" y="466.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="485.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Preventivo</tspan></text><text x="270.0" y="485.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Evitar enfermedades con consejos y campañas</tspan></text><text x="620.0" y="485.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Receptor de mensajes</tspan></text><rect x="40.0" y="495.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="514.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Crítico</tspan></text><text x="270.0" y="514.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Causas sociales y políticas; diálogo</tspan></text><text x="620.0" y="514.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Analiza y transforma su realidad</tspan></text><rect x="40.0" y="524.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="543.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Comunitario</tspan></text><text x="270.0" y="543.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Prevención, promoción y autocuidado</tspan></text><text x="620.0" y="543.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Participa en todos los niveles de decisión</tspan></text><rect x="160.6" y="527.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="206.0" y="542.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="206.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="593.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="603.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="625.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="625.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Biomédico</tspan></text><text x="435.0" y="625.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Asistencial</tspan></text><text x="585.0" y="625.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Preventivo</tspan></text><text x="735.0" y="625.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Crítico</tspan></text><rect x="813.0" y="606.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="625.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Comunitario</tspan></text><rect x="40.0" y="640.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="640.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="669.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Modelo que promueve</tspan><tspan x="54.0" dy="16">el autocuidado?</tspan></text><text x="285.0" y="669.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: el usuario es</tspan><tspan x="285.0" dy="16">pasivo</tspan></text><text x="435.0" y="669.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: se limita a la</tspan><tspan x="435.0" dy="16">atención curativa</tspan></text><text x="585.0" y="669.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: mensaje vertical</tspan><tspan x="585.0" dy="16">sobre riesgos</tspan></text><text x="735.0" y="661.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: analiza causas</tspan><tspan x="735.0" dy="16">sociales y busca</tspan><tspan x="735.0" dy="16">transformarlas</tspan></text><text x="885.0" y="661.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: autocuidado y</tspan><tspan x="885.0" dy="16">participación en las</tspan><tspan x="885.0" dy="16">decisiones</tspan></text><rect x="40.0" y="603.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="730.0" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="758.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="780.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Biomédico o informativo: centrado en la enfermedad y en el profesional experto; usuario pasivo. Asistencial: solo atención curativa en el establecimiento.</tspan><tspan x="58.0" dy="18">• Preventivo: evita enfermedades y riesgos con consejos y campañas; el mensaje es vertical.</tspan><tspan x="58.0" dy="18">• Crítico (Paulo Freire): analiza causas sociales y políticas y busca transformar las condiciones de vida mediante el diálogo.</tspan><tspan x="58.0" dy="18">• Comunitario: integra prevención y promoción, autocuidado y participación de los usuarios en todos los niveles de decisión.</tspan></text><text x="58.0" y="856.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Serrano González M.I., La educación para la salud del siglo XXI, 2.ª ed.; OPS/OMS, La renovación de la Atención Primaria de Salud en las Américas (documento de</tspan><tspan x="58.0" dy="15">posición, 2007); OMS, Declaración de Shanghái (2016).</tspan></text></svg>