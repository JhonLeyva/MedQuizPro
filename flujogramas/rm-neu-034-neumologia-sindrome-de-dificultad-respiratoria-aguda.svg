<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1180" viewBox="0 0 1000 1180" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La sepsis es el trastorno extrapulmonar más frecuente asociado al SDRA; se busca siempre el foco infeccioso"><title>La sepsis es el trastorno extrapulmonar más frecuente asociado al SDRA; se busca siempre el foco infeccioso</title><rect x="0.75" y="0.75" width="998.5" height="1178.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neumología · síndrome de dificultad respiratoria aguda</tspan></text><rect x="525.4" y="32.0" width="114.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="582.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="99"><tspan x="582.8" dy="0">NEUMOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">SDRA</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Lesión inflamatoria difusa de la membrana alveolocapilar con edema rico en proteínas y</tspan><tspan x="58.0" dy="17">shunt.</tspan><tspan x="58.0" dy="17">Hipoxemia refractaria con opacidades bilaterales no cardiogénicas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de causas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es el trastorno más frecuente asociado al</tspan><tspan x="640.0" dy="16">SDRA?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">FACTORES DESENCADENANTES DEL SDRA</tspan></text><text x="202.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="758"><tspan x="202.0" dy="0">→ FRECUENCIA</tspan></text><rect x="202.0" y="291.0" width="373.0" height="35.0" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="388.5" y="313.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="353"><tspan x="388.5" dy="0">Más frecuentes</tspan></text><rect x="587.0" y="291.0" width="373.0" height="35.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="773.5" y="313.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="353"><tspan x="773.5" dy="0">Menos frecuentes</tspan></text><text x="40.0" y="312.5" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="146"><tspan x="40.0" dy="0">↓ ORIGEN DE LA LESIÓN</tspan></text><rect x="40.0" y="338.0" width="150.0" height="90.5" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="115.0" y="387.7" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Pulmonar (directa)</tspan></text><rect x="202.0" y="338.0" width="373.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="339.0" width="6.0" height="88.5" rx="3" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="388.5" y="366.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Neumonía y aspiración</tspan></text><text x="388.5" y="389.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Daño directo del epitelio alveolar</tspan><tspan x="388.5" dy="17">Contusión, inhalación y casi ahogamiento</tspan></text><rect x="587.0" y="338.0" width="373.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="588.0" y="339.0" width="6.0" height="88.5" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="773.5" y="366.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Contusión pulmonar e inhalación de tóxicos</tspan></text><text x="773.5" y="389.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Menos frecuentes</tspan><tspan x="773.5" dy="17">Trauma torácico</tspan></text><rect x="40.0" y="440.5" width="150.0" height="90.5" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="115.0" y="481.7" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Extrapulmonar</tspan><tspan x="115.0" dy="17">(indirecta)</tspan></text><rect x="202.0" y="440.5" width="373.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="388.5" y="468.8" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Sepsis (este caso)</tspan></text><text x="388.5" y="491.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Lesión por mediadores inflamatorios</tspan><tspan x="388.5" dy="17">Siempre buscar el foco infeccioso</tspan></text><rect x="343.1" y="519.9" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="388.5" y="534.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="388.5" dy="0">◆ ESTE CASO</tspan></text><rect x="587.0" y="440.5" width="373.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="588.0" y="441.5" width="6.0" height="88.5" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="773.5" y="468.8" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Pancreatitis, embolia grasa y transfusiones</tspan></text><text x="773.5" y="491.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Trauma y edema neurogénico</tspan><tspan x="773.5" dy="17">Tuberculosis miliar: causa rara</tspan></text><text x="40.0" y="574.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEFINICIÓN DE BERLÍN DEL SDRA SEGÚN LA OXIGENACIÓN (PAO2/FIO2 CON PEEP DE AL MENOS 5 CMH2O)</tspan></text><rect x="40.0" y="586.9" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="605.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Gravedad</tspan></text><text x="250.0" y="605.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="224"><tspan x="250.0" dy="0">PaO2/FiO2</tspan></text><text x="490.0" y="605.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="224"><tspan x="490.0" dy="0">Mortalidad en el estudio</tspan></text><text x="730.0" y="605.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="224"><tspan x="730.0" dy="0">Conducta</tspan></text><rect x="40.0" y="615.9" width="920.0" height="59.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="634.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Leve</tspan></text><text x="250.0" y="634.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="250.0" dy="0">200 a 300</tspan></text><text x="490.0" y="634.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="490.0" dy="0">27 %</tspan></text><text x="730.0" y="634.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="730.0" dy="0">Ventilación protectora (6 mL/kg de peso</tspan><tspan x="730.0" dy="15">ideal, presión meseta menor de 30</tspan><tspan x="730.0" dy="15">cmH2O) y tratar la causa</tspan></text><rect x="40.0" y="674.9" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="693.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Moderada</tspan></text><text x="250.0" y="693.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="250.0" dy="0">100 a 200</tspan></text><text x="490.0" y="693.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="490.0" dy="0">32 %</tspan></text><text x="730.0" y="693.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="730.0" dy="0">Lo anterior con PEEP titulada; valorar</tspan><tspan x="730.0" dy="15">bloqueo neuromuscular</tspan></text><rect x="40.0" y="718.9" width="920.0" height="59.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="737.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Grave</tspan></text><text x="250.0" y="737.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="250.0" dy="0">Menos de 100</tspan></text><text x="490.0" y="737.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="490.0" dy="0">45 %</tspan></text><text x="730.0" y="737.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="730.0" dy="0">Lo anterior más posición prona más de</tspan><tspan x="730.0" dy="15">12 h al día; ECMO en casos</tspan><tspan x="730.0" dy="15">seleccionados</tspan></text><text x="40.0" y="793.9" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Criterios comunes: inicio en menos de 1 semana, opacidades bilaterales, origen no cardiogénico. La definición global 2023 admite SpO2/FiO2 y ecografía.</tspan></text><text x="40.0" y="840.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="850.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="881.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="853.9" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="881.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Sepsis</tspan></text><text x="435.0" y="881.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Pancreatitis</tspan></text><text x="585.0" y="881.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Embolia grasa</tspan></text><text x="735.0" y="881.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Tuberculosis miliar</tspan></text><text x="885.0" y="873.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Edema pulmonar</tspan><tspan x="885.0" dy="17">neurogénico</tspan></text><rect x="40.0" y="904.9" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="904.9" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="933.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Trastorno más</tspan><tspan x="54.0" dy="16">frecuente?</tspan></text><text x="285.0" y="925.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: principal causa</tspan><tspan x="285.0" dy="16">extrapulmonar; buscar</tspan><tspan x="285.0" dy="16">el foco</tspan></text><text x="435.0" y="933.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: causa reconocida,</tspan><tspan x="435.0" dy="16">menos común</tspan></text><text x="585.0" y="933.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: causa reconocida,</tspan><tspan x="585.0" dy="16">menos común</tspan></text><text x="735.0" y="941.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: causa rara</tspan></text><text x="885.0" y="933.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: causa reconocida,</tspan><tspan x="885.0" dy="16">menos común</tspan></text><rect x="40.0" y="850.9" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="994.9" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1022.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1044.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Berlín 2012: inicio en menos de 1 semana de una agresión, opacidades bilaterales, origen no cardiogénico y PaO2/FiO2 menor de 300 con PEEP de 5 o</tspan><tspan x="58.0" dy="18">   más.</tspan><tspan x="58.0" dy="18">• Causas pulmonares más frecuentes: neumonía y aspiración. Extrapulmonar más importante: la sepsis (opción A).</tspan><tspan x="58.0" dy="18">• Pancreatitis, embolia grasa, trauma, transfusiones y edema neurogénico son menos comunes; la tuberculosis miliar es rara.</tspan><tspan x="58.0" dy="18">• Manejo: tratar la causa, volumen corriente de 6 mL/kg de peso ideal, presión meseta menor de 30 cmH2O, PEEP y posición prona en casos graves.</tspan></text><text x="58.0" y="1138.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ARDS Definition Task Force, JAMA 2012;307:2526-2533; Matthay MA et al., Am J Respir Crit Care Med 2024;209:37-47; Harrison, 21.ª ed. (2022).</tspan></text></svg>