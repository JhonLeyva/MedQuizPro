<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1534" viewBox="0 0 1000 1534" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Residente de Cerro de Pasco con cefalea, mareos, acúfenos, cianosis, Hb 22, Hto 66 % y SatO₂ 88 %: mal de montaña crónico (enfermedad de Monge)"><title>Residente de Cerro de Pasco con cefalea, mareos, acúfenos, cianosis, Hb 22, Hto 66 % y SatO₂ 88 %: mal de montaña crónico (enfermedad de Monge)</title><rect x="0.75" y="0.75" width="998.5" height="1532.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Medicina de altura · eritrocitosis excesiva</tspan></text><rect x="445.4" y="32.0" width="135.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="513.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="119"><tspan x="513.1" dy="0">HEMATOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Mal de montaña crónico (Monge)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Pérdida de la adaptación a la altura: hipoxemia y eritrocitosis excesiva (Hb ≥ 21 g/dL en</tspan><tspan x="58.0" dy="17">varones, ≥ 19 en mujeres).</tspan><tspan x="58.0" dy="17">Síntomas: cefalea, mareos, tinnitus, insomnio, parestesias, cianosis, venas dilatadas</tspan><tspan x="58.0" dy="17">(Consenso de Qinghai).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 60 años, Cerro de Pasco (~4300 m)</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">2 años de cefalea, mareos y acúfenos, peor el último</tspan><tspan x="640.0" dy="16">mes.</tspan><tspan x="640.0" dy="16">Hiperemia conjuntival, cianosis; Hb 22, Hto 66 %,</tspan><tspan x="640.0" dy="16">SatO₂ 88 %.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LOS NÚMEROS DEL CASO EN LA ALTURA</tspan></text><rect x="40.0" y="301.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="327.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Hemoglobina en varón de altura (g/dL)</tspan></text><text x="60.0" y="346.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">≥ 21 g/dL = eritrocitosis excesiva (Monge).</tspan></text><rect x="70.0" y="410.0" width="602.0" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="371.0" y="435.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="592"><tspan x="371.0" dy="0">Adaptado a la altura</tspan></text><rect x="672.0" y="410.0" width="258.0" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="801.0" y="435.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="248"><tspan x="801.0" dy="0">Excesiva</tspan></text><line x1="672.0" y1="450.0" x2="672.0" y2="458.0" stroke="#64748b" stroke-width="1.5"/><text x="672.0" y="472.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="672.0" dy="0">21</tspan></text><polygon points="749.0,396.0 767.0,396.0 758.0,408.0" fill="#ea580c"/><rect x="700.1" y="370.0" width="115.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="758.0" y="385.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="104"><tspan x="758.0" dy="0">◆ ESTE CASO: 22</tspan></text><rect x="40.0" y="500.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="526.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">SatO₂ en reposo (%)</tspan></text><text x="60.0" y="545.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">En la altura es normal ~90 %; más baja indica mala ventilación.</tspan></text><rect x="70.0" y="609.0" width="430.0" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="285.0" y="634.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="420"><tspan x="285.0" dy="0">Baja</tspan></text><rect x="500.0" y="609.0" width="430.0" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="715.0" y="634.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="420"><tspan x="715.0" dy="0">Esperable en altura</tspan></text><line x1="500.0" y1="649.0" x2="500.0" y2="657.0" stroke="#64748b" stroke-width="1.5"/><text x="500.0" y="671.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="500.0" dy="0">90</tspan></text><polygon points="405.0,595.0 423.0,595.0 414.0,607.0" fill="#ea580c"/><rect x="385.4" y="569.0" width="57.2" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="414.0" y="584.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="45"><tspan x="414.0" dy="0">◆ 88 %</tspan></text><text x="40.0" y="717.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ HACER</tspan></text><rect x="40.0" y="727.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="728.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="751.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Bajar de altura</tspan></text><text x="58.0" y="772.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Lo que cura</tspan></text><rect x="351.3" y="727.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="728.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="751.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Flebotomía o acetazolamida</tspan></text><text x="369.3" y="772.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Si no puede bajar</tspan></text><rect x="662.7" y="727.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="728.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="751.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Descartar policitemia vera</tspan></text><text x="680.7" y="772.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">JAK2 si la SatO₂ fuera normal</tspan></text><text x="40.0" y="836.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="848.0" width="920.0" height="326.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="862.0" width="411.8" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="261.9" y="882.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="261.9" dy="0">PUNTAJE DE QINGHAI DEL MAL DE MONTAÑA CRÓNICO</tspan></text><text x="483.8" y="873.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="458"><tspan x="483.8" dy="0">Síntomas (0-3 cada uno: disnea, sueño, cianosis, venas dilatadas,</tspan><tspan x="483.8" dy="17">parestesias, cefalea, acúfenos) + Hb ≥ 21 en varón (3 puntos).</tspan></text><rect x="56.0" y="926.0" width="213.0" height="75.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="926.6" width="211.8" height="63.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="162.5" y="954.0" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="197"><tspan x="162.5" dy="0">0-5</tspan></text><text x="162.5" y="974.0" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="189"><tspan x="162.5" dy="0">Ausente</tspan></text><rect x="281.0" y="926.0" width="213.0" height="75.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="281.6" y="926.6" width="211.8" height="63.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="387.5" y="954.0" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="197"><tspan x="387.5" dy="0">6-10</tspan></text><text x="387.5" y="974.0" font-size="14" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="189"><tspan x="387.5" dy="0">Leve</tspan></text><rect x="506.0" y="926.0" width="213.0" height="75.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="506.6" y="926.6" width="211.8" height="63.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="612.5" y="954.0" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="197"><tspan x="612.5" dy="0">11-14</tspan></text><text x="612.5" y="974.0" font-size="14" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="189"><tspan x="612.5" dy="0">Moderado</tspan></text><rect x="731.0" y="926.0" width="213.0" height="75.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="731.6" y="926.6" width="211.8" height="63.0" rx="9" fill="#fee2e2" stroke="none" stroke-width="0"/><text x="837.5" y="954.0" font-size="11" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="197"><tspan x="837.5" dy="0">≥ 15</tspan></text><text x="837.5" y="974.0" font-size="14" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="189"><tspan x="837.5" dy="0">Grave</tspan></text><text x="56.0" y="1031.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="1040.0" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="1055.0" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="1055.0" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Hb 22 en varón: 3 puntos</tspan></text><rect x="56.0" y="1062.0" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="1077.0" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="1077.0" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Cefalea, acúfenos y cianosis suman más</tspan></text><rect x="56.0" y="1084.0" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="1099.0" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="1099.0" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Intensidad de cada síntoma no informada</tspan></text><rect x="56.0" y="1121.0" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="1144.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Bajar a menor altura; flebotomía si el Hto es muy alto; acetazolamida.</tspan></text><text x="40.0" y="1214.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1224.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1263.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1263.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Policitemia vera</tspan></text><rect x="363.0" y="1227.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="1255.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Mal de montaña</tspan><tspan x="435.0" dy="17">crónico</tspan></text><text x="585.0" y="1255.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Hipoxemia</tspan><tspan x="585.0" dy="17">refractaria</tspan></text><text x="735.0" y="1246.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Policitemia</tspan><tspan x="735.0" dy="17">fisiológica</tspan><tspan x="735.0" dy="17">secundaria</tspan></text><text x="885.0" y="1255.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Leucemia mieloide</tspan><tspan x="885.0" dy="17">crónica</tspan></text><rect x="40.0" y="1295.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="1295.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1332.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="1324.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: SatO₂ baja (es</tspan><tspan x="285.0" dy="16">secundaria); JAK2</tspan></text><text x="435.0" y="1324.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: altura + eritrocitosis</tspan><tspan x="435.0" dy="16">excesiva + síntomas</tspan></text><text x="585.0" y="1316.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no es un</tspan><tspan x="585.0" dy="16">diagnóstico de</tspan><tspan x="585.0" dy="16">enfermedad</tspan></text><text x="735.0" y="1316.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: excesiva y con</tspan><tspan x="735.0" dy="16">síntomas =</tspan><tspan x="735.0" dy="16">enfermedad</tspan></text><text x="885.0" y="1324.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: leucocitos y bazo,</tspan><tspan x="885.0" dy="16">no Hb</tspan></text><rect x="40.0" y="1224.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1385.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1413.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1435.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Lo curativo: bajar a nivel del mar (mejora en semanas).</tspan><tspan x="58.0" dy="18">• Flebotomías si el Hto es muy alto; acetazolamida mejora la ventilación y baja el Hto.</tspan><tspan x="58.0" dy="18">• Descartar policitemia vera (JAK2), EPOC y apnea del sueño.</tspan></text><text x="58.0" y="1493.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Consenso internacional de Qinghai (2004); León-Velarde et al.; Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>