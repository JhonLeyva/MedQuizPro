<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1206" viewBox="0 0 1000 1206" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Diabético con HTA, filtración de 45 mL/min y albuminuria de 1 g/día: el fármaco para bajar la proteinuria es un IECA (o ARA II)"><title>Diabético con HTA, filtración de 45 mL/min y albuminuria de 1 g/día: el fármaco para bajar la proteinuria es un IECA (o ARA II)</title><rect x="0.75" y="0.75" width="998.5" height="1205.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Enfermedad renal diabética · tratamiento</tspan></text><rect x="440.6" y="32.0" width="127.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="504.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="111"><tspan x="504.3" dy="0">NEFROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Nefroprotección en la diabetes</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">IECA o ARA II bajan la presión dentro del glomérulo y la proteinuria.</tspan><tspan x="58.0" dy="17">Hoy se suman iSGLT2 y, según el caso, finerenona o agonistas GLP-1.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 58 años con diabetes</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">PA 140/90, edema de piernas.</tspan><tspan x="640.0" dy="16">Depuración 45 mL/min, albúmina en orina 1 g/24 h, K</tspan><tspan x="640.0" dy="16">4,5.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="395.0" x2="733.5" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="395.0" x2="266.5" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,423.0 271.5,423.0 266.5,431.0" fill="#94a3b8"/><line x1="733.5" y1="395.0" x2="733.5" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,423.0 738.5,423.0 733.5,431.0" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#0f766e"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="395.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="395.0" x2="266.5" y2="424.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,423.0 271.5,423.0 266.5,431.0" fill="#0f766e"/><rect x="209.0" y="404.0" width="115.1" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Sí: K 4,5 (este caso)</tspan></text><rect x="711.6" y="404.0" width="43.7" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">K alto</tspan></text><polygon points="240.0,336.0 266.0,307.0 734.0,307.0 760.0,336.0 734.0,365.0 266.0,365.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="336.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="341.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="340.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Diabetes con albuminuria: ¿K &lt; 5,5 y FG estable?</tspan></text><rect x="40.0" y="431.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">IECA O ARA II</tspan></text><text x="266.5" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">+ iSGLT2</tspan><tspan x="266.5" dy="17">PA &lt; 130/80</tspan></text><rect x="507.0" y="431.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="467.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Corregir antes</tspan></text><text x="733.5" y="490.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Dieta, quelantes</tspan></text><text x="40.0" y="561.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="573.5" width="920.0" height="323.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="587.5" width="413.3" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="262.6" y="607.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="262.6" dy="0">CLASIFICACIÓN KDIGO DE LA ERC (FG Y ALBUMINURIA)</tspan></text><text x="485.3" y="607.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="457"><tspan x="485.3" dy="0">Se combinan la filtración (G) y la albuminuria (A) para el riesgo.</tspan></text><rect x="56.0" y="647.5" width="168.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="648.1" width="166.8" height="63.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="140.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="152"><tspan x="140.0" dy="0">G1-G2</tspan></text><text x="140.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="144"><tspan x="140.0" dy="0">FG ≥ 60</tspan></text><circle cx="72.0" cy="720.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="724.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="82.0" dy="0">Normal o leve</tspan></text><rect x="236.0" y="647.5" width="168.0" height="98.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="237.2" y="648.7" width="165.6" height="63.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="320.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="152"><tspan x="320.0" dy="0">G3A</tspan></text><text x="320.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="144"><tspan x="320.0" dy="0">FG 45-59</tspan></text><circle cx="252.0" cy="720.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="262.0" y="724.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="262.0" dy="0">Leve-moderada</tspan></text><rect x="274.6" y="636.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="320.0" y="651.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="320.0" dy="0">◆ ESTE CASO</tspan></text><rect x="416.0" y="647.5" width="168.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="416.6" y="648.1" width="166.8" height="63.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="500.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">G3B</tspan></text><text x="500.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="144"><tspan x="500.0" dy="0">FG 30-44</tspan></text><circle cx="432.0" cy="720.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="442.0" y="724.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="442.0" dy="0">Moderada-grave</tspan></text><rect x="596.0" y="647.5" width="168.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="596.6" y="648.1" width="166.8" height="63.0" rx="9" fill="#fee2e2" stroke="none" stroke-width="0"/><text x="680.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="152"><tspan x="680.0" dy="0">G4</tspan></text><text x="680.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="144"><tspan x="680.0" dy="0">FG 15-29</tspan></text><circle cx="612.0" cy="720.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="622.0" y="724.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="622.0" dy="0">Grave</tspan></text><rect x="776.0" y="647.5" width="168.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="776.6" y="648.1" width="166.8" height="63.0" rx="9" fill="#fecaca" stroke="none" stroke-width="0"/><text x="860.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="middle" data-max="152"><tspan x="860.0" dy="0">G5</tspan></text><text x="860.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="middle" data-max="144"><tspan x="860.0" dy="0">FG &lt; 15</tspan></text><circle cx="792.0" cy="720.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="802.0" y="724.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="802.0" dy="0">Falla renal</tspan></text><text x="56.0" y="775.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="784.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="799.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="799.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">FG 45 mL/min: límite G3a</tspan></text><rect x="56.0" y="806.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="821.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="821.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Albuminuria 1 g/día: A3</tspan></text><rect x="56.0" y="843.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="866.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">IECA o ARA II + iSGLT2; control cada 3-6 meses.</tspan></text><text x="40.0" y="936.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="946.5" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="969.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="969.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Atorvastatina</tspan></text><rect x="363.0" y="949.5" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="969.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">IECA</tspan></text><text x="585.0" y="969.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Insulina</tspan></text><text x="735.0" y="969.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Sulfonilurea</tspan></text><text x="885.0" y="969.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hidroclorotiazida</tspan></text><rect x="40.0" y="983.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="983.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1012.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Medicamento?</tspan></text><text x="285.0" y="1004.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Protege el corazón, no</tspan><tspan x="285.0" dy="16">baja la proteinuria</tspan></text><text x="435.0" y="1012.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: baja la proteinuria</tspan></text><text x="585.0" y="1004.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Controla la glucosa, no</tspan><tspan x="585.0" dy="16">la proteinuria</tspan></text><text x="735.0" y="1004.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: hipoglucemia en la</tspan><tspan x="735.0" dy="16">ERC</tspan></text><text x="885.0" y="1004.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Baja la PA, no protege</tspan><tspan x="885.0" dy="16">el riñón igual</tspan></text><rect x="40.0" y="946.5" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1057.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1085.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1107.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• IECA o ARA II a dosis máxima tolerada; control de K y creatinina a las 2-4 semanas.</tspan><tspan x="58.0" dy="18">• iSGLT2 (dapagliflozina, empagliflozina) si la FG ≥ 20; meta PA &lt; 130/80.</tspan><tspan x="58.0" dy="18">• No combinar IECA + ARA II (más hiperpotasemia y falla renal).</tspan></text><text x="58.0" y="1165.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: KDIGO, diabetes en la ERC (2022); ADA Standards of Care in Diabetes 2026, cap. 11.</tspan></text></svg>