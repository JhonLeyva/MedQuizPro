.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Recreación y participación comunitaria</tspan></text><circle cx="62.0" cy="426.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="430.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Regulación de la venta a menores</tspan></text><rect x="214.6" y="310.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="260.0" y="325.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="260.0" dy="0">◆ ESTE CASO</tspan></text><rect x="670.0" y="321.0" width="290.0" height="132.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="688.0" y="349.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="688.0" dy="0">Una sola acción</tspan></text><circle cx="692.0" cy="374.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="378.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Charlas o folletos solos</tspan></text><circle cx="692.0" cy="400.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="404.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Multas sin otra medida</tspan></text><circle cx="692.0" cy="426.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="430.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">No cambian los determinantes</tspan></text><rect x="40.0" y="617.0" width="920.0" height="76.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="645.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Enfoque integral educativo, comunitario y regulatorio</tspan></text><text x="500.0" y="666.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Actúa sobre todos los factores identificados.</tspan></text><text x="40.0" y="733.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="745.0" width="351.0" height="282.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="755.0" width="183.9" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="769.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="309"><tspan x="61.0" dy="0">ÁREAS DE ACCIÓN DE OTTAWA</tspan></text><g data-box="54.0 783.0 323.0 220.0"><g transform="translate(54.0,783.0) scale(0.95)"><circle cx="170" cy="112" r="36" fill="#0f766e" stroke="none" stroke-width="0" /><text x="170" y="108" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">Promoción</text><text x="170" y="122" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">de la salud</text><path d="M170 74 L170 44" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linejoin="round" /><rect x="108" y="8" width="124" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="170.0" y="24.0" font-size="9.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Políticas</text><text x="170.0" y="24.0" font-size="9.5" font-weight="800" fill="#0f172a" text-anchor="middle" data-max="0">Políticas</text><text x="170.0" y="37.0" font-size="9.5" fon