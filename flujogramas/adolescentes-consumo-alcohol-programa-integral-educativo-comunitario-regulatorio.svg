<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1321" viewBox="0 0 1000 1321" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Consumo de alcohol en adolescentes con varios determinantes: programa integral educativo, comunitario y regulatorio"><title>Consumo de alcohol en adolescentes con varios determinantes: programa integral educativo, comunitario y regulatorio</title><rect x="0.75" y="0.75" width="998.5" height="1319.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Promoción de la salud · intervenciones</tspan></text><rect x="431.0" y="32.0" width="143.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="502.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="127"><tspan x="502.8" dy="0">SALUD PÚBLICA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Promoción de la salud (Carta de Ottawa)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Los problemas con muchos determinantes necesitan acciones en varios frentes.</tspan><tspan x="58.0" dy="17">Educación, comunidad, entornos y regulación a la vez.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Comunidad urbana de Lima</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">40 % de adolescentes de 15-19 años toma alcohol</tspan><tspan x="640.0" dy="16">cada semana.</tspan><tspan x="640.0" dy="16">Faltan actividades recreativas y es fácil comprar</tspan><tspan x="640.0" dy="16">alcohol cerca de los colegios.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿QUÉ ESTRATEGIA PESA MÁS?</tspan></text><rect x="493.0" y="351.0" width="14" height="190" r