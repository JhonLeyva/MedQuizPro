<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1171" viewBox="0 0 1000 1171" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La educación a los padres sobre higiene es una intervención de la atención integral del recién nacido"><title>La educación a los padres sobre higiene es una intervención de la atención integral del recién nacido</title><rect x="0.75" y="0.75" width="998.5" height="1169.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Salud pública · atención neonatal</tspan></text><rect x="397.5" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="461.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="461.8" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Atención integral del recién nacido</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cuidado inmediato, control posterior y seguimiento hasta los 28 días.</tspan><tspan x="58.0" dy="17">Incluye consejería a los padres.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de actividades</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué alternativa corresponde a la atención integral de</tspan><tspan x="640.0" dy="16">salud del recién nacido?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ ACTIVIDADES SON UNIVERSALES Y CUÁLES DEPENDEN DEL RIESGO</tspan></text><rect x="40.0" y="269.0" width="920.0" height="145.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="269.0" width="108.0" height="145.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="337.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Universal para</tspan><tspan x="94.0" dy="14">todo recién</tspan><tspan x="94.0" dy="14">nacido</tspan></text><rect x="40.0" y="414.0" width="920.0" height="145.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="414.0" width="108.0" height="145.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="490.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Según el riesgo</tspan></text><rect x="40.0" y="559.0" width="920.0" height="145.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="559.0" width="108.0" height="145.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="635.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Del niño mayor</tspan></text><line x1="280.0" y1="341.0" x2="287.0" y2="341.0" stroke="#ea580c" stroke-width="2.2"/><line x1="287.0" y1="341.0" x2="287.0" y2="341.5" stroke="#ea580c" stroke-width="2.2"/><line x1="287.0" y1="341.5" x2="285.0" y2="341.5" stroke="#ea580c" stroke-width="2.2"/><polygon points="285.0,346.5 285.0,336.5 294.0,341.5" fill="#ea580c"/><line x1="416.0" y1="341.5" x2="423.0" y2="341.5" stroke="#0f766e" stroke-width="2.2"/><line x1="423.0" y1="341.5" x2="423.0" y2="333.0" stroke="#0f766e" stroke-width="2.2"/><line x1="423.0" y1="333.0" x2="421.0" y2="333.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="421.0,338.0 421.0,328.0 430.0,333.0" fill="#0f766e"/><line x1="552.0" y1="333.0" x2="559.0" y2="333.0" stroke="#0f766e" stroke-width="2.2"/><line x1="559.0" y1="333.0" x2="559.0" y2="478.0" stroke="#0f766e" stroke-width="2.2"/><line x1="559.0" y1="478.0" x2="557.0" y2="478.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="557.0,483.0 557.0,473.0 566.0,478.0" fill="#0f766e"/><line x1="688.0" y1="478.0" x2="695.0" y2="478.0" stroke="#0f766e" stroke-width="2.2"/><line x1="695.0" y1="478.0" x2="695.0" y2="615.0" stroke="#0f766e" stroke-width="2.2"/><line x1="695.0" y1="615.0" x2="693.0" y2="615.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="693.0,620.0 693.0,610.0 702.0,615.0" fill="#0f766e"/><line x1="824.0" y1="615.0" x2="831.0" y2="615.0" stroke="#0f766e" stroke-width="2.2"/><line x1="831.0" y1="615.0" x2="831.0" y2="623.5" stroke="#0f766e" stroke-width="2.2"/><line x1="831.0" y1="623.5" x2="829.0" y2="623.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="829.0,628.5 829.0,618.5 838.0,623.5" fill="#0f766e"/><rect x="158.0" y="282.0" width="122.0" height="118.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="168.0" dy="0">Atención</tspan><tspan x="168.0" dy="16">inmediata</tspan></text><text x="168.0" y="331.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="168.0" dy="0">Secado, piel con</tspan><tspan x="168.0" dy="14.5">piel, clampaje</tspan><tspan x="168.0" dy="14.5">oportuno y lactancia</tspan><tspan x="168.0" dy="14.5">en la primera hora</tspan></text><circle cx="158.0" cy="282.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="294.0" y="282.0" width="122.0" height="119.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="304.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="102"><tspan x="304.0" dy="0">Educación a los</tspan><tspan x="304.0" dy="16">padres sobre</tspan><tspan x="304.0" dy="16">higiene</tspan></text><text x="304.0" y="347.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="304.0" dy="0">Lactancia, cordón,</tspan><tspan x="304.0" dy="14.5">abrigo y signos de</tspan><tspan x="304.0" dy="14.5">alarma</tspan></text><circle cx="294.0" cy="282.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="294.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="294.0" dy="0">2</tspan></text><rect x="430.0" y="282.0" width="122.0" height="102.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="440.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="440.0" dy="0">Tamizaje y</tspan><tspan x="440.0" dy="16">vacunas</tspan></text><text x="440.0" y="331.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="440.0" dy="0">BCG, hepatitis B y</tspan><tspan x="440.0" dy="14.5">control en las 48</tspan><tspan x="440.0" dy="14.5">horas del alta</tspan></text><circle cx="430.0" cy="282.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="430.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="430.0" dy="0">3</tspan></text><rect x="566.0" y="427.0" width="122.0" height="102.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="576.0" y="443.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="576.0" dy="0">Visita familiar</tspan><tspan x="576.0" dy="16">integral</tspan></text><text x="576.0" y="476.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="576.0" dy="0">Bajo peso, factores</tspan><tspan x="576.0" dy="14.5">de riesgo o</tspan><tspan x="576.0" dy="14.5">domicilio lejano</tspan></text><circle cx="566.0" cy="427.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="566.0" y="431.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="566.0" dy="0">4</tspan></text><rect x="702.0" y="572.0" width="122.0" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="712.0" y="588.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="712.0" dy="0">Prioridades</tspan><tspan x="712.0" dy="16">sanitarias de IRA</tspan></text><text x="712.0" y="621.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="712.0" dy="0">Actividad del niño</tspan><tspan x="712.0" dy="14.5">mayor</tspan></text><circle cx="702.0" cy="572.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="702.0" y="576.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="702.0" dy="0">5</tspan></text><rect x="838.0" y="572.0" width="122.0" height="103.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="848.0" y="588.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="848.0" dy="0">Prevención de</tspan><tspan x="848.0" dy="16">enfermedades</tspan><tspan x="848.0" dy="16">prevalentes</tspan></text><text x="848.0" y="637.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="848.0" dy="0">Actividad del niño</tspan><tspan x="848.0" dy="14.5">mayor</tspan></text><circle cx="838.0" cy="572.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="838.0" y="576.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="838.0" dy="0">6</tspan></text><rect x="40.0" y="722.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="748.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Educar a los padres sobre higiene = atención integral del recién nacido</tspan></text><text x="60.0" y="767.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La visita familiar se reserva para situaciones de riesgo.</tspan></text><text x="40.0" y="834.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="844.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="883.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="875.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Visita familiar a bajo</tspan><tspan x="285.0" dy="17">peso</tspan></text><text x="435.0" y="875.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Prioridades</tspan><tspan x="435.0" dy="17">sanitarias IRA</tspan></text><text x="585.0" y="875.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Evaluación</tspan><tspan x="585.0" dy="17">musculoesquelética</tspan></text><text x="735.0" y="866.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Prevención de</tspan><tspan x="735.0" dy="17">enfermedades</tspan><tspan x="735.0" dy="17">prevalentes</tspan></text><rect x="813.0" y="847.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="866.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Educación a los</tspan><tspan x="885.0" dy="17">padres sobre</tspan><tspan x="885.0" dy="17">higiene</tspan></text><rect x="40.0" y="915.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="915.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="936.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué corresponde a la</tspan><tspan x="54.0" dy="16">atención integral?</tspan></text><text x="285.0" y="936.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: solo en riesgo,</tspan><tspan x="285.0" dy="16">como el bajo peso</tspan></text><text x="435.0" y="936.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: actividad del niño</tspan><tspan x="435.0" dy="16">mayor</tspan></text><text x="585.0" y="936.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: parte de un</tspan><tspan x="585.0" dy="16">examen físico</tspan></text><text x="735.0" y="936.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: actividad del niño</tspan><tspan x="735.0" dy="16">mayor</tspan></text><text x="885.0" y="936.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: consejería universal</tspan><tspan x="885.0" dy="16">a los padres</tspan></text><rect x="40.0" y="844.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="989.0" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1017.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1039.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Atención inmediata: secado, piel con piel, clampaje oportuno del cordón, lactancia en la primera hora, vitamina K y profilaxis oftálmica.</tspan><tspan x="58.0" dy="18">• Tamizaje neonatal, vacunas (BCG y hepatitis B), evaluación completa y controles de crecimiento y desarrollo; primer control en las 48 horas del alta.</tspan><tspan x="58.0" dy="18">• Consejería a los padres: lactancia exclusiva, higiene, cuidado del cordón, abrigo y signos de alarma.</tspan><tspan x="58.0" dy="18">• Alerta: la visita domiciliaria es válida en bajo peso o riesgo, pero no es la actividad universal; el libro elige la educación a los padres.</tspan></text><text x="58.0" y="1115.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA, NTS 214-2024, Atención integral de salud neonatal; MINSA, NTS 137-MINSA/2017/DGIESP, Control del crecimiento y desarrollo de la niña y el niño menor de</tspan><tspan x="58.0" dy="15">cinco años (RM 537-2017/MINSA).</tspan></text></svg>