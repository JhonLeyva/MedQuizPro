<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1145" viewBox="0 0 1000 1145" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El segundo refuerzo de DPT se aplica a los 4 años; el primero, a los 18 meses"><title>El segundo refuerzo de DPT se aplica a los 4 años; el primero, a los 18 meses</title><rect x="0.75" y="0.75" width="998.5" height="1143.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Inmunizaciones · esquema DPT</tspan></text><rect x="386.6" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="435.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="435.6" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Esquema peruano contra difteria, tos ferina y tétanos</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Pentavalente a los 2, 4 y 6 meses.</tspan><tspan x="58.0" dy="17">DPT como refuerzo a los 18 meses y a los 4 años.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de esquema</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿A qué edad en años se administra el segundo</tspan><tspan x="640.0" dy="16">refuerzo de DPT?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CUÁNDO SE APLICAN LAS DOSIS CONTRA DIFTERIA, TOS FERINA Y TÉTANOS</tspan></text><rect x="40.0" y="269.0" width="920.0" height="34.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="52.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="174"><tspan x="52.0" dy="0">VACUNA</tspan></text><text x="275.8" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="88"><tspan x="275.8" dy="0">2 meses</tspan></text><text x="367.4" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="88"><tspan x="367.4" dy="0">4 meses</tspan></text><text x="459.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="88"><tspan x="459.0" dy="0">6 meses</tspan></text><text x="550.6" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="88"><tspan x="550.6" dy="0">18 meses</tspan></text><text x="642.2" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="88"><tspan x="642.2" dy="0">4 años</tspan></text><text x="704.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="250"><tspan x="704.0" dy="0">QUÉ CONTIENE</tspan></text><rect x="598.4" y="305.0" width="87.6" height="176.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/><rect x="40.0" y="309.0" width="182.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="339.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="50.0" dy="0">Pentavalente</tspan></text><line x1="238.0" y1="335.0" x2="680.0" y2="335.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="275.8" cy="330.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="275.8" y="357.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="88"><tspan x="275.8" dy="0">1.ª</tspan></text><circle cx="367.4" cy="330.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="367.4" y="357.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="88"><tspan x="367.4" dy="0">2.ª</tspan></text><circle cx="459.0" cy="330.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="459.0" y="357.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="88"><tspan x="459.0" dy="0">3.ª</tspan></text><rect x="700.0" y="309.0" width="260.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="710.0" y="331.5" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="240"><tspan x="710.0" dy="0">DPT, hepatitis B y Haemophilus influenzae</tspan><tspan x="710.0" dy="15">tipo b.</tspan></text><rect x="40.0" y="367.0" width="182.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="397.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="50.0" dy="0">DPT, primer refuerzo</tspan></text><line x1="238.0" y1="393.0" x2="680.0" y2="393.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="550.6" cy="388.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="550.6" y="415.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="88"><tspan x="550.6" dy="0">Refuerzo 1</tspan></text><rect x="700.0" y="367.0" width="260.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="710.0" y="397.0" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="240"><tspan x="710.0" dy="0">Difteria, tos ferina y tétanos solamente.</tspan></text><rect x="40.0" y="425.0" width="182.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="455.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="50.0" dy="0">DPT, segundo refuerzo</tspan></text><line x1="238.0" y1="451.0" x2="680.0" y2="451.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="642.2" cy="446.0" r="13" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="642.2" y="450.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="642.2" dy="0">!</tspan></text><text x="642.2" y="473.0" font-size="9.5" font-weight="700" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="88"><tspan x="642.2" dy="0">Refuerzo 2</tspan></text><rect x="700.0" y="425.0" width="260.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="710.0" y="455.0" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="240"><tspan x="710.0" dy="0">Opción correcta: 4 años.</tspan></text><rect x="596.8" y="294.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="642.2" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="642.2" dy="0">◆ ESTE CASO</tspan></text><text x="44.0" y="497.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="44.0" dy="0">Círculo vacío = dosis programada · ! = dosis pedida por la pregunta</tspan></text><rect x="40.0" y="521.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="547.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Segundo refuerzo de DPT = 4 años</tspan></text><text x="60.0" y="566.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Los 18 meses son el primer refuerzo; 10 años corresponde al Td del adulto.</tspan></text><text x="40.0" y="627.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ESQUEMA DE DPT Y PENTAVALENTE EN EL PERÚ</tspan></text><rect x="40.0" y="639.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="658.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Edad</tspan></text><text x="250.0" y="658.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Vacuna</tspan></text><text x="610.0" y="658.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Dosis</tspan></text><rect x="40.0" y="668.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="687.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">2, 4 y 6 meses</tspan></text><text x="250.0" y="687.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Pentavalente</tspan></text><text x="610.0" y="687.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Serie primaria</tspan></text><rect x="40.0" y="697.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="716.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">18 meses</tspan></text><text x="250.0" y="716.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">DPT</tspan></text><text x="610.0" y="716.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Primer refuerzo</tspan></text><rect x="40.0" y="726.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="745.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">4 años</tspan></text><text x="250.0" y="745.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">DPT</tspan></text><text x="610.0" y="745.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Segundo refuerzo</tspan></text><rect x="140.6" y="729.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="186.0" y="744.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="186.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="755.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="774.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Gestante, semanas 27 a 36</tspan></text><text x="250.0" y="774.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Tdap</tspan></text><text x="610.0" y="774.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Una dosis en cada embarazo</tspan></text><text x="40.0" y="824.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="834.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="856.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="856.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">10 años</tspan></text><rect x="363.0" y="837.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="856.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">4 años</tspan></text><text x="585.0" y="856.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">6 años</tspan></text><text x="735.0" y="856.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">5 años</tspan></text><text x="885.0" y="856.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">3 años</tspan></text><rect x="40.0" y="871.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="871.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="892.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Edad del segundo</tspan><tspan x="54.0" dy="16">refuerzo?</tspan></text><text x="285.0" y="892.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: el Td del adulto se</tspan><tspan x="285.0" dy="16">repite cada 10 años</tspan></text><text x="435.0" y="892.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: segundo refuerzo</tspan><tspan x="435.0" dy="16">del esquema</tspan></text><text x="585.0" y="892.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no corresponde al</tspan><tspan x="585.0" dy="16">esquema</tspan></text><text x="735.0" y="892.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no corresponde al</tspan><tspan x="735.0" dy="16">esquema</tspan></text><text x="885.0" y="892.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es anterior al</tspan><tspan x="885.0" dy="16">segundo refuerzo</tspan></text><rect x="40.0" y="834.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="945.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="973.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="995.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Pentavalente (DPT, hepatitis B y Hib) a los 2, 4 y 6 meses; DPT sola como primer refuerzo a los 18 meses y segundo a los 4 años.</tspan><tspan x="58.0" dy="18">• La protección frente a toxoides y Bordetella pertussis decae con los años; por eso se refuerza.</tspan><tspan x="58.0" dy="18">• Tdap en la gestante entre las semanas 27 y 36 de cada embarazo para proteger al lactante, que tiene la mayor mortalidad por tos ferina. Td del adulto</tspan><tspan x="58.0" dy="18">   cada 10 años.</tspan><tspan x="58.0" dy="18">• Vía intramuscular: muslo anterolateral en el lactante y deltoides en el niño mayor. Herida sucia con 3 dosis o más: refuerzo si pasaron más de 5 años.</tspan></text><text x="58.0" y="1089.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: NTS 196-MINSA/DGIESP-2022, Esquema Nacional de Vacunación; CDC, ACIP, Calendario de inmunización pediátrica (MMWR 2025); Nelson Tratado de Pediatría 22.ª</tspan><tspan x="58.0" dy="15">ed. (2024).</tspan></text></svg>