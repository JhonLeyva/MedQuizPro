<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1123" viewBox="0 0 1000 1123" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El derrame del hidrotórax hepático es trasudado: proteínas pleura/suero menor de 0,5 y LDH menor de 0,6"><title>El derrame del hidrotórax hepático es trasudado: proteínas pleura/suero menor de 0,5 y LDH menor de 0,6</title><rect x="0.75" y="0.75" width="998.5" height="1121.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neumología · derrame pleural y criterios de Light</tspan></text><rect x="489.2" y="32.0" width="114.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="546.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="99"><tspan x="546.6" dy="0">NEUMOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hidrotórax hepático</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Trasudado: el líquido ascítico pasa a la pleura por defectos del diafragma, sobre todo</tspan><tspan x="58.0" dy="17">derechos.</tspan><tspan x="58.0" dy="17">Se forma por presión hidrostática y oncótica, no por inflamación.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Paciente con cirrosis</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Derrame pleural.</tspan><tspan x="640.0" dy="16">¿Qué relaciones pleura/suero confirman que se debe a</tspan><tspan x="640.0" dy="16">la cirrosis?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LEER EL LÍQUIDO PLEURAL DE LA CIRROSIS (TRASUDADO)</tspan></text><rect x="40.0" y="285.0" width="920.0" height="32.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="306.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="180"><tspan x="54.0" dy="0">EXAMEN</tspan></text><text x="250.0" y="306.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="130"><tspan x="250.0" dy="0">VALOR DEL CASO</tspan></text><text x="400.0" y="306.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="130"><tspan x="400.0" dy="0">NORMAL</tspan></text><text x="550.0" y="306.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="400"><tspan x="550.0" dy="0">QUÉ SIGNIFICA</tspan></text><rect x="40.0" y="323.0" width="920.0" height="40.0" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="347.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Proteínas pleura/suero</tspan></text><text x="250.0" y="348.0" font-size="13" font-weight="800" font-style="normal" fill="#2563eb" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Menor de 0,5  ↓</tspan></text><text x="400.0" y="347.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Exudado si mayor de 0,5</tspan></text><text x="550.0" y="347.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">No cumple el criterio.</tspan></text><rect x="40.0" y="367.0" width="920.0" height="40.0" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="391.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">LDH pleura/suero</tspan></text><text x="250.0" y="392.0" font-size="13" font-weight="800" font-style="normal" fill="#2563eb" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Menor de 0,6  ↓</tspan></text><text x="400.0" y="391.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Exudado si mayor de 0,6</tspan></text><text x="550.0" y="391.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">No cumple el criterio.</tspan></text><rect x="40.0" y="411.0" width="920.0" height="40.0" rx="8" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="435.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">LDH pleural</tspan></text><text x="250.0" y="436.0" font-size="13" font-weight="800" font-style="normal" fill="#2563eb" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Menor de 2/3 LSN  ↓</tspan></text><text x="400.0" y="435.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Exudado si mayor</tspan></text><text x="550.0" y="435.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">No cumple el criterio.</tspan></text><rect x="40.0" y="455.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="479.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Albúmina suero - pleura</tspan></text><text x="250.0" y="480.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Mayor de 1,2 g/dL  ↑</tspan></text><text x="400.0" y="479.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Favorece trasudado</tspan></text><text x="550.0" y="479.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Útil si hubo diuréticos.</tspan></text><rect x="40.0" y="513.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="539.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Ninguno de los 3 criterios = trasudado</tspan></text><text x="60.0" y="558.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Cumplir uno solo de los 3 criterios de Light basta para llamarlo exudado.</tspan></text><text x="40.0" y="619.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CRITERIOS DE LIGHT PARA SEPARAR EXUDADO DE TRASUDADO</tspan></text><rect x="40.0" y="631.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="650.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Criterio</tspan></text><text x="280.0" y="650.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="214"><tspan x="280.0" dy="0">Exudado si</tspan></text><text x="510.0" y="650.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="214"><tspan x="510.0" dy="0">Trasudado (cirrosis)</tspan></text><text x="740.0" y="650.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="214"><tspan x="740.0" dy="0">Ejemplos</tspan></text><rect x="40.0" y="660.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="679.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Proteínas pleura/suero</tspan></text><text x="280.0" y="679.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="214"><tspan x="280.0" dy="0">Mayor de 0,5</tspan></text><text x="510.0" y="679.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="214"><tspan x="510.0" dy="0">Menor de 0,5</tspan></text><text x="740.0" y="679.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="214"><tspan x="740.0" dy="0">Cirrosis, insuficiencia cardiaca,</tspan><tspan x="740.0" dy="15">síndrome nefrótico</tspan></text><rect x="40.0" y="704.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="723.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">LDH pleura/suero</tspan></text><text x="280.0" y="723.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="214"><tspan x="280.0" dy="0">Mayor de 0,6</tspan></text><text x="510.0" y="723.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="214"><tspan x="510.0" dy="0">Menor de 0,6</tspan></text><text x="740.0" y="723.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="214"><tspan x="740.0" dy="0">Neumonía, tuberculosis, neoplasia,</tspan><tspan x="740.0" dy="15">embolia pulmonar</tspan></text><rect x="170.6" y="715.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="216.0" y="730.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="216.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="748.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="767.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">LDH pleural</tspan></text><text x="280.0" y="767.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="214"><tspan x="280.0" dy="0">Mayor de 2/3 del límite superior sérico</tspan></text><text x="510.0" y="767.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="214"><tspan x="510.0" dy="0">Menor de 2/3</tspan></text><text x="740.0" y="767.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="214"><tspan x="740.0" dy="0">Un solo criterio positivo = exudado</tspan></text><text x="40.0" y="817.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="827.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="849.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">&gt; 0,6; &gt; 0,5</tspan></text><rect x="363.0" y="830.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">&lt; 0,5; &lt; 0,6</tspan></text><text x="585.0" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">&lt; 0,6; &lt; 0,5</tspan></text><text x="735.0" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">&gt; 0,5; &gt; 0,6</tspan></text><text x="885.0" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">&gt; 0,5; &lt; 0,6</tspan></text><rect x="40.0" y="864.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="864.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="885.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Relaciones que</tspan><tspan x="54.0" dy="16">confirman trasudado?</tspan></text><text x="285.0" y="885.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: son umbrales de</tspan><tspan x="285.0" dy="16">exudado</tspan></text><text x="435.0" y="885.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: ambas bajo los</tspan><tspan x="435.0" dy="16">umbrales de Light</tspan></text><text x="585.0" y="885.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: invierte los</tspan><tspan x="585.0" dy="16">umbrales</tspan></text><text x="735.0" y="885.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: mezcla umbrales</tspan><tspan x="735.0" dy="16">de exudado</tspan></text><text x="885.0" y="885.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: la LDH alta indica</tspan><tspan x="885.0" dy="16">exudado</tspan></text><rect x="40.0" y="827.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="938.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="966.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="988.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Criterios de Light (1972): es exudado si cumple 1 de 3: proteínas pleura/suero mayor de 0,5; LDH pleura/suero mayor de 0,6; LDH pleural mayor de 2/3</tspan><tspan x="58.0" dy="18">   del límite superior sérico.</tspan><tspan x="58.0" dy="18">• El trasudado no cumple ninguno: proteínas menor de 0,5 y LDH menor de 0,6 (opción B). Las demás combinaciones mezclan o invierten umbrales.</tspan><tspan x="58.0" dy="18">• Con diuréticos los criterios sobreestiman exudados: usar el gradiente de albúmina suero menos pleura mayor de 1,2 g/dL, que favorece trasudado.</tspan><tspan x="58.0" dy="18">• Alerta: hidrotórax con fiebre y dolor pleurítico, descartar empiema bacteriano espontáneo: neutrófilos mayor de 250/mm3 y cultivo.</tspan></text><text x="58.0" y="1082.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Light RW et al., Ann Intern Med 1972;77:507-513; Clin Chest Med 2021 (PMID 34774168); Harrison, 21.ª ed. (2022).</tspan></text></svg>