<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="944" viewBox="0 0 820 944" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Accidente isquémico transitorio (AIT)"><title>Accidente isquémico transitorio (AIT)</title><rect width="820" height="944" fill="#ffffff"/><rect x="0" y="0" width="820" height="112" fill="#0f766e"/><text x="40" y="34" font-size="13" font-weight="600" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="740"><tspan x="40" dy="0">MedQuizPlus · Flujograma</tspan></text><text x="40" y="70" font-size="24" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="740"><tspan x="40" dy="0">Accidente isquémico transitorio (AIT)</tspan></text><text x="40" y="96" font-size="13" font-weight="400" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="740"><tspan x="40" dy="0">ENAM 2020 · NRL-005 · Neurología</tspan></text><rect x="90" y="144" width="640" height="98" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="108" y="172" font-size="11" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="604"><tspan x="108" dy="0">INICIO</tspan></text><text x="108" y="196" font-size="16" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Déficit neurológico focal súbito (disartria, ataxia o</tspan><tspan x="108" dy="22">paresia)</tspan></text><line x1="410.0" y1="244" x2="410.0" y2="264" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,262 417.0,262 410.0,272" fill="#94a3b8"/><rect x="90" y="274" width="640" height="146" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><circle cx="120" cy="347.0" r="12" fill="#d97706"/><text x="120" y="352.0" font-size="15" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="120" dy="0">?</tspan></text><text x="142" y="302" font-size="11" font-weight="700" font-style="normal" fill="#b45309" text-anchor="start" data-max="570"><tspan x="142" dy="0">DECISIÓN</tspan></text><text x="142" y="326" font-size="16" font-weight="600" font-style="normal" fill="#78350f" text-anchor="start" data-max="570"><tspan x="142" dy="0">¿Se resolvió por completo, habitualmente en menos de una</tspan><tspan x="142" dy="22">hora?</tspan></text><text x="142" y="376" font-size="14" font-weight="500" font-style="italic" fill="#92400e" text-anchor="start" data-max="570"><tspan x="142" dy="0">↳ No → tratar como ACV en curso: TAC sin contraste y evaluar</tspan><tspan x="142" dy="20">trombólisis</tspan></text><line x1="410.0" y1="422" x2="410.0" y2="442" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,440 417.0,440 410.0,450" fill="#94a3b8"/><rect x="90" y="452" width="640" height="76" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="480" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="504" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Sí → ataque isquémico transitorio</tspan></text><line x1="410.0" y1="530" x2="410.0" y2="550" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,548 417.0,548 410.0,558" fill="#94a3b8"/><rect x="90" y="560" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="588" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="612" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Neuroimagen (de preferencia RMN), Doppler carotídeo, ECG y</tspan><tspan x="108" dy="22">riesgo con escala ABCD²</tspan></text><line x1="410.0" y1="660" x2="410.0" y2="680" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,678 417.0,678 410.0,688" fill="#94a3b8"/><rect x="90" y="690" width="640" height="76" rx="12" fill="#134e4a" stroke="#134e4a" stroke-width="2"/><text x="108" y="718" font-size="11" font-weight="700" font-style="normal" fill="#5eead4" text-anchor="start" data-max="604"><tspan x="108" dy="0">CONDUCTA FINAL</tspan></text><text x="108" y="742" font-size="16" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Antiagregación y control de factores de riesgo</tspan></text><rect x="40" y="796" width="740" height="98" rx="10" fill="#f0fdfa" stroke="#99f6e4"/><rect x="40" y="796" width="6" height="98" rx="3" fill="#14b8a6"/><text x="62" y="822" font-size="14" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="704"><tspan x="62" dy="0">Perla clínica</tspan></text><text x="62" y="846" font-size="15" font-weight="400" font-style="normal" fill="#134e4a" text-anchor="start" data-max="704"><tspan x="62" dy="0">Un AIT es una advertencia: el riesgo de ACV es máximo en las primeras 48</tspan><tspan x="62" dy="21">horas.</tspan></text><text x="410.0" y="922" font-size="11" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="740"><tspan x="410.0" dy="0">MedQuizPlus · Material de estudio: contrasta siempre con las guías clínicas vigentes.</tspan></text></svg>
