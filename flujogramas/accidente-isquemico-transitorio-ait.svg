<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="568" viewBox="0 0 1000 568" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Ataque isquémico transitorio"><title>Ataque isquémico transitorio</title><rect x="0.75" y="0.75" width="998.5" height="566.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16" y="16" width="968" height="56" rx="10" fill="#0f766e"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170" y1="34.0" x2="170" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="657"><tspan x="184.0" dy="0">NEUROLOGÍA ENAM: ATAQUE ISQUÉMICO TRANSITORIO</tspan></text><rect x="861.0" y="32.0" width="103.0" height="24" rx="12" fill="#134e4a"/><text x="912.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="87"><tspan x="912.5" dy="0">NEUROLOGÍA</tspan></text><rect x="190.0" y="90.0" width="620" height="67.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="500.0" y="118.5" font-size="14.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Varón de 56 años con disartria y ataxia súbitas</tspan></text><text x="500.0" y="141.0" font-size="12" font-weight="400" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">A los 30 minutos el examen neurológico es normal</tspan></text><line x1="500.0" y1="157.0" x2="500.0" y2="176.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,175.0 505.0,175.0 500.0,183.0" fill="#0f766e"/><polygon points="180.0,218.0 220.0,183.0 780.0,183.0 820.0,218.0 780.0,253.0 220.0,253.0" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><circle cx="242.0" cy="218.0" r="13" fill="#f59e0b"/><text x="242.0" y="223.5" font-size="16" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="242.0" dy="0">?</tspan></text><text x="514.0" y="214.0" font-size="13.5" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="470"><tspan x="514.0" dy="0">¿El déficit se resolvió por completo (habitualmente</tspan><tspan x="514.0" dy="18">&lt; 1 hora)?</tspan></text><line x1="500.0" y1="253.0" x2="500.0" y2="275.0" stroke="#0f766e" stroke-width="2"/><line x1="270.0" y1="275.0" x2="730.0" y2="275.0" stroke="#0f766e" stroke-width="2"/><line x1="270.0" y1="275.0" x2="270.0" y2="308.0" stroke="#0f766e" stroke-width="2"/><polygon points="265.0,307.0 275.0,307.0 270.0,315.0" fill="#0f766e"/><rect x="254.0" y="283.0" width="32.0" height="20" rx="10" fill="#059669"/><text x="270.0" y="297.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="270.0" dy="0">SÍ</tspan></text><line x1="730.0" y1="275.0" x2="730.0" y2="308.0" stroke="#0f766e" stroke-width="2"/><polygon points="725.0,307.0 735.0,307.0 730.0,315.0" fill="#0f766e"/><rect x="714.0" y="283.0" width="32.0" height="20" rx="10" fill="#e11d48"/><text x="730.0" y="297.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="730.0" dy="0">NO</tspan></text><rect x="70.0" y="315.0" width="400" height="100.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="270.0" y="342.5" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="372"><tspan x="270.0" dy="0">ATAQUE ISQUÉMICO TRANSITORIO</tspan></text><text x="270.0" y="365.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="372"><tspan x="270.0" dy="0">RMN, Doppler carotídeo, ECG</tspan><tspan x="270.0" dy="17">Riesgo con escala ABCD²</tspan><tspan x="270.0" dy="17">Antiagregación + estatina</tspan></text><rect x="377.8" y="305.0" width="84.2" height="20" rx="10" fill="#f59e0b"/><text x="419.9" y="319.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="419.9" dy="0">✓ RESPUESTA</tspan></text><rect x="530.0" y="315.0" width="400" height="100.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="730.0" y="342.5" font-size="13.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="372"><tspan x="730.0" dy="0">ACV en curso</tspan></text><text x="730.0" y="365.0" font-size="12" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="372"><tspan x="730.0" dy="0">TAC sin contraste urgente</tspan><tspan x="730.0" dy="17">Evaluar trombólisis</tspan><tspan x="730.0" dy="17">(ventana de 4.5 h)</tspan></text><rect x="40" y="441.0" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="469.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="491.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El riesgo de ACV después de un AIT es máximo en las primeras 48 horas.</tspan><tspan x="58.0" dy="18">• AIT: déficit transitorio SIN infarto en la neuroimagen.</tspan></text><text x="58.0" y="531.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AHA/ASA 2021 Secondary Stroke Prevention · ESO 2021 TIA Guidelines</tspan></text></svg>
