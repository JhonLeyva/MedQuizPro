<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1065" viewBox="0 0 1000 1065" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la rotura del tendón de Aquiles el tratamiento no quirúrgico con aparato de yeso o bota en equino es opción de primera línea"><title>En la rotura del tendón de Aquiles el tratamiento no quirúrgico con aparato de yeso o bota en equino es opción de primera línea</title><rect x="0.75" y="0.75" width="998.5" height="1063.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Traumatología · tratamiento de la rotura de Aquiles</tspan></text><rect x="499.6" y="32.0" width="135.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="567.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="119"><tspan x="567.3" dy="0">TRAUMATOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Rotura del tendón de Aquiles</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Dos tratamientos reconocidos: operatorio (sutura abierta o percutánea) y no operatorio con</tspan><tspan x="58.0" dy="17">inmovilización en equino y rehabilitación.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de tratamiento</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es el tratamiento más frecuente en la rotura del</tspan><tspan x="640.0" dy="16">tendón de Aquiles?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL DIAGNÓSTICO AL TRATAMIENTO, EN ORDEN</tspan></text><text x="40.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="430"><tspan x="40.0" dy="0">QUÉ SE HACE</tspan></text><text x="516.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="444"><tspan x="516.0" dy="0">PARA QUÉ</tspan></text><rect x="40.0" y="291.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="320.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="325.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><text x="84.0" y="317.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Sospechar la rotura</tspan></text><text x="84.0" y="334.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Chasquido, defecto palpable y prueba de Thompson positiva</tspan></text><line x1="476.0" y1="320.5" x2="503.0" y2="320.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,315.5 502.0,325.5 510.0,320.5" fill="#ea580c"/><rect x="516.0" y="293.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="317.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Se confirma el diagnóstico clínico</tspan></text><text x="530.0" y="334.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0"></tspan></text><line x1="255.0" y1="352.0" x2="255.0" y2="365.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,364.0 260.0,364.0 255.0,372.0" fill="#0f766e"/><rect x="40.0" y="374.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="403.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="408.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">2</tspan></text><text x="84.0" y="400.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Inmovilizar en equino (este caso)</tspan></text><text x="84.0" y="417.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Aparato de yeso o bota ortopédica</tspan></text><line x1="476.0" y1="403.5" x2="503.0" y2="403.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,398.5 502.0,408.5 510.0,403.5" fill="#ea580c"/><rect x="516.0" y="376.0" width="444.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="530.0" y="400.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Acerca los cabos del tendón</tspan></text><text x="530.0" y="417.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Tratamiento no quirúrgico</tspan></text><line x1="255.0" y1="435.0" x2="255.0" y2="448.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,447.0 260.0,447.0 255.0,455.0" fill="#0f766e"/><rect x="40.0" y="457.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="486.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="491.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">3</tspan></text><text x="84.0" y="483.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Rehabilitación acelerada</tspan></text><text x="84.0" y="500.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Apoyo precoz y movilización temprana</tspan></text><line x1="476.0" y1="486.5" x2="503.0" y2="486.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,481.5 502.0,491.5 510.0,486.5" fill="#ea580c"/><rect x="516.0" y="459.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="483.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Nueva rotura similar a la cirugía</tspan></text><text x="530.0" y="500.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0"></tspan></text><line x1="255.0" y1="518.0" x2="255.0" y2="531.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,530.0 260.0,530.0 255.0,538.0" fill="#0f766e"/><rect x="40.0" y="540.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="569.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="574.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">4</tspan></text><text x="84.0" y="566.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Cirugía</tspan></text><text x="84.0" y="583.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Sutura abierta o percutánea</tspan></text><line x1="476.0" y1="569.5" x2="503.0" y2="569.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,564.5 502.0,574.5 510.0,569.5" fill="#ea580c"/><rect x="516.0" y="542.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="566.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Menos riesgo de nueva rotura, más complicaciones de herida</tspan></text><text x="530.0" y="583.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0"></tspan></text><rect x="40.0" y="617.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="643.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Yeso o bota en equino con rehabilitación precoz</tspan></text><text x="60.0" y="662.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Las técnicas de fijación ósea no corresponden a la rotura de un tendón.</tspan></text><text x="40.0" y="729.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="739.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="770.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="770.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Fijación externa</tspan></text><text x="435.0" y="770.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Placa y tornillo</tspan></text><rect x="513.0" y="742.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="770.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Aparato de yeso</tspan></text><text x="735.0" y="761.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Reconstrucción</tspan><tspan x="735.0" dy="17">abierta</tspan></text><text x="885.0" y="770.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Fijación interna</tspan></text><rect x="40.0" y="793.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="793.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="822.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tratamiento más</tspan><tspan x="54.0" dy="16">frecuente?</tspan></text><text x="285.0" y="822.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es una técnica</tspan><tspan x="285.0" dy="16">para fracturas óseas</tspan></text><text x="435.0" y="822.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es una técnica</tspan><tspan x="435.0" dy="16">para fracturas óseas</tspan></text><text x="585.0" y="814.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: opción no</tspan><tspan x="585.0" dy="16">quirúrgica de primera</tspan><tspan x="585.0" dy="16">línea</tspan></text><text x="735.0" y="822.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: se reserva a casos</tspan><tspan x="735.0" dy="16">seleccionados</tspan></text><text x="885.0" y="822.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es una técnica</tspan><tspan x="885.0" dy="16">para fracturas óseas</tspan></text><rect x="40.0" y="739.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="883.0" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="911.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="933.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Metaanálisis del BMJ (2019) y ensayo de Willits (2010): con rehabilitación acelerada la tasa de nueva rotura es similar.</tspan><tspan x="58.0" dy="18">• La cirugía reduce algo el riesgo de nueva rotura a cambio de más complicaciones de la herida e infección.</tspan><tspan x="58.0" dy="18">• Por ello el aparato de yeso o la bota ortopédica en equino con apoyo precoz es hoy opción de primera línea.</tspan><tspan x="58.0" dy="18">• La fijación externa, la placa con tornillos y la fijación interna son técnicas para fracturas óseas, no para tendones.</tspan></text><text x="58.0" y="1009.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Ochen Y et al., BMJ 2019 (PMID 30617123); Willits K et al., J Bone Joint Surg Am 2010 (PMID 21037028); AAOS, guía de rotura aguda del Aquiles (2010; PMID</tspan><tspan x="58.0" dy="15">20675644).</tspan></text></svg>