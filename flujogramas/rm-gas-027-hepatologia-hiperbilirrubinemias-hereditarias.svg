<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1335" viewBox="0 0 1000 1335" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La hiperbilirrubinemia conjugada hereditaria benigna más típica es el síndrome de Dubin-Johnson"><title>La hiperbilirrubinemia conjugada hereditaria benigna más típica es el síndrome de Dubin-Johnson</title><rect x="0.75" y="0.75" width="998.5" height="1333.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Hepatología · hiperbilirrubinemias hereditarias</tspan></text><rect x="474.8" y="32.0" width="165.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="557.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="149"><tspan x="557.5" dy="0">GASTROENTEROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hiperbilirrubinemia conjugada</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se debe a falla de la excreción hepatocelular o a colestasis.</tspan><tspan x="58.0" dy="17">Las formas hereditarias benignas cursan con pruebas hepáticas normales.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es una de las causas más frecuentes de</tspan><tspan x="640.0" dy="16">hiperbilirrubinemia conjugada?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SE PIENSA EN ESTE ORDEN</tspan></text><rect x="40.0" y="269.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="314.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="342.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">1</tspan></text><rect x="124.0" y="269.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="297.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿La bilirrubina elevada es directa o indirecta?</tspan></text><rect x="136.0" y="311.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="331.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Directa (conjugada)</tspan></text><text x="152.0" y="350.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Gilbert, Crigler-Najjar y la hemólisis elevan la indirecta: no son una opción válida.</tspan></text><line x1="77.0" y1="372.0" x2="77.0" y2="391.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,390.0 82.0,390.0 77.0,398.0" fill="#0f766e"/><text x="134.0" y="390.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="400.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="445.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="473.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">2</tspan></text><rect x="124.0" y="400.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="428.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿El defecto es de excreción o de captación?</tspan></text><rect x="136.0" y="442.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="462.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Excreción canalicular: MRP2</tspan></text><text x="152.0" y="481.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">En el Dubin-Johnson falla el transportador MRP2; en el Rotor falla la captación.</tspan></text><line x1="77.0" y1="503.0" x2="77.0" y2="522.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,521.0 82.0,521.0 77.0,529.0" fill="#0f766e"/><text x="134.0" y="521.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="531.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="576.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="604.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">3</tspan></text><rect x="124.0" y="531.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="559.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Cómo se reconoce y qué se hace?</tspan></text><rect x="136.0" y="573.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="593.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Hígado negro, pruebas hepáticas normales</tspan></text><text x="152.0" y="612.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Es benigno y no requiere tratamiento; el Rotor no tiene pigmento hepático.</tspan></text><rect x="40.0" y="652.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="678.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Directa + enzimas normales + hígado negro = Dubin-Johnson</tspan></text><text x="60.0" y="697.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Benigno: no se opera ni se trata, solo se explica.</tspan></text><text x="40.0" y="758.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">HIPERBILIRRUBINEMIAS HEREDITARIAS: DEFECTO Y TIPO DE BILIRRUBINA</tspan></text><rect x="40.0" y="770.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="789.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="174"><tspan x="50.0" dy="0">Síndrome</tspan></text><text x="240.0" y="789.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="227"><tspan x="240.0" dy="0">Defecto</tspan></text><text x="483.3" y="789.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="227"><tspan x="483.3" dy="0">Bilirrubina elevada</tspan></text><text x="726.7" y="789.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="227"><tspan x="726.7" dy="0">Dato clave</tspan></text><rect x="40.0" y="799.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="818.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="174"><tspan x="50.0" dy="0">Gilbert</tspan></text><text x="240.0" y="818.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="227"><tspan x="240.0" dy="0">UGT1A1 reducida (déficit leve)</tspan></text><text x="483.3" y="818.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="227"><tspan x="483.3" dy="0">Indirecta</tspan></text><text x="726.7" y="818.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="227"><tspan x="726.7" dy="0">Ictericia leve con ayuno, estrés o</tspan><tspan x="726.7" dy="15">infección; sin tratamiento</tspan></text><rect x="40.0" y="843.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="862.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="174"><tspan x="50.0" dy="0">Crigler-Najjar I</tspan></text><text x="240.0" y="862.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="227"><tspan x="240.0" dy="0">Ausencia de UGT1A1</tspan></text><text x="483.3" y="862.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="227"><tspan x="483.3" dy="0">Indirecta</tspan></text><text x="726.7" y="862.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="227"><tspan x="726.7" dy="0">Kernicterus neonatal</tspan></text><rect x="40.0" y="872.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="891.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="174"><tspan x="50.0" dy="0">Dubin-Johnson</tspan></text><text x="240.0" y="891.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="227"><tspan x="240.0" dy="0">Transportador MRP2 (excreción</tspan><tspan x="240.0" dy="15">canalicular)</tspan></text><text x="483.3" y="891.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="227"><tspan x="483.3" dy="0">Directa</tspan></text><text x="726.7" y="891.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="227"><tspan x="726.7" dy="0">Hígado negro; pruebas hepáticas y</tspan><tspan x="726.7" dy="15">ecografía normales</tspan></text><rect x="130.6" y="883.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="176.0" y="898.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="176.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="916.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="935.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="174"><tspan x="50.0" dy="0">Rotor</tspan></text><text x="240.0" y="935.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="227"><tspan x="240.0" dy="0">Captación hepática (OATP1B1/1B3)</tspan></text><text x="483.3" y="935.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="227"><tspan x="483.3" dy="0">Directa</tspan></text><text x="726.7" y="935.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="227"><tspan x="726.7" dy="0">Sin pigmento hepático; benigno</tspan></text><rect x="40.0" y="945.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="964.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="174"><tspan x="50.0" dy="0">Anemia hemolítica</tspan></text><text x="240.0" y="964.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="227"><tspan x="240.0" dy="0">Exceso de producción de bilirrubina</tspan></text><text x="483.3" y="964.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="227"><tspan x="483.3" dy="0">Indirecta</tspan></text><text x="726.7" y="964.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="227"><tspan x="726.7" dy="0">Reticulocitos y LDH altos</tspan></text><text x="40.0" y="1014.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1024.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1055.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="1027.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="1046.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Síndrome de</tspan><tspan x="285.0" dy="17">Dubin-Johnson</tspan></text><text x="435.0" y="1055.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Síndrome de Gilbert</tspan></text><text x="585.0" y="1055.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Síndrome de Rotor</tspan></text><text x="735.0" y="1055.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Anemia hemolítica</tspan></text><text x="885.0" y="1046.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Síndrome de</tspan><tspan x="885.0" dy="17">Crigler-Najjar I</tspan></text><rect x="40.0" y="1078.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1078.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1107.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Hiperbilirrubinemia</tspan><tspan x="54.0" dy="16">conjugada?</tspan></text><text x="285.0" y="1107.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: falla de excreción</tspan><tspan x="285.0" dy="16">por MRP2</tspan></text><text x="435.0" y="1107.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: eleva la bilirrubina</tspan><tspan x="435.0" dy="16">indirecta</tspan></text><text x="585.0" y="1099.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es otra causa</tspan><tspan x="585.0" dy="16">conjugada, menos</tspan><tspan x="585.0" dy="16">típica</tspan></text><text x="735.0" y="1107.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: la hemólisis eleva</tspan><tspan x="735.0" dy="16">la indirecta</tspan></text><text x="885.0" y="1107.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: sin enzima, eleva</tspan><tspan x="885.0" dy="16">la indirecta</tspan></text><rect x="40.0" y="1024.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1168.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1196.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1218.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Dubin-Johnson: mutación del transportador MRP2 del canalículo; bilirrubina directa elevada, ecografía normal e hígado negro por pigmento.</tspan><tspan x="58.0" dy="18">• Rotor: déficit de captación hepática (OATP1B1/1B3), también conjugada y benigna; sin pigmento hepático.</tspan><tspan x="58.0" dy="18">• Gilbert (déficit leve de UDP-glucuronil transferasa), Crigler-Najjar I (ausencia de la enzima, con kernicterus) y la hemólisis elevan la bilirrubina indirecta.</tspan><tspan x="58.0" dy="18">• Gilbert: ictericia leve con ayuno, estrés o infección; no requiere tratamiento.</tspan></text><text x="58.0" y="1294.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Harrison 21.ª ed. (2022); Robbins y Cotran Patología estructural y funcional, 10.ª ed. (2021); Erlinger S et al., Gastroenterology 2014;146:1625-1638.</tspan></text></svg>