ill="#4ade80" text-anchor="end" data-max="106"><tspan x="257.0" dy="0">mmHg</tspan></text><rect x="281.0" y="403.0" width="211.0" height="82.0" rx="10" fill="#0c1e3d" stroke="#60a5fa" stroke-width="1.5"/><text x="293.0" y="425.0" font-size="11.5" font-weight="800" font-style="normal" fill="#60a5fa" text-anchor="start" data-max="187"><tspan x="293.0" dy="0">FC</tspan></text><text x="386.5" y="461.0" font-size="26" font-weight="800" font-style="normal" fill="#60a5fa" text-anchor="middle" data-max="187"><tspan x="386.5" dy="0">60</tspan></text><text x="480.0" y="425.0" font-size="10.5" font-weight="700" font-style="normal" fill="#60a5fa" text-anchor="end" data-max="106"><tspan x="480.0" dy="0">lpm ▼</tspan></text><rect x="58.0" y="495.0" width="211.0" height="82.0" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="1.5"/><text x="70.0" y="517.0" font-size="11.5" font-weight="800" font-style="normal" fill="#f87171" text-anchor="start" data-max="187"><tspan x="70.0" dy="0">FR</tspan></text><text x="163.5" y="553.0" font-size="26" font-weight="800" font-style="normal" fill="#f87171" text-anchor="middle" data-max="187"><tspan x="163.5" dy="0">24</tspan></text><text x="257.0" y="517.0" font-size="10.5" font-weight="700" font-style="normal" fill="#f87171" text-anchor="end" data-max="106"><tspan x="257.0" dy="0">rpm ▲</tspan></text><rect x="281.0" y="495.0" width="211.0" height="82.0" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="1.5"/><text x="293.0" y="517.0" font-size="11.5" font-weight="800" font-style="normal" fill="#f87171" text-anchor="start" data-max="187"><tspan x="293.0" dy="0">ST</tspan></text><text x="386.5" y="553.0" font-size="26" font-weight="800" font-style="normal" fill="#f87171" text-anchor="middle" data-max="187"><tspan x="386.5" dy="0">II, III, aVF</tspan></text><text x="480.0" y="517.0" font-size="10.5" font-weight="700" font-style="normal" fill="#f87171" text-anchor="end" data-max="106"><tspan x="480.0" dy="0">elevado ▲</tspan></text><rect x="58.0" y="587.0" width="211.0" height="82.0" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="1.5"/><text x="70.0" y="609.0" font-size="11.5" font-weight="800" font-style="normal" fill="#f87171" text-anchor="start" data-max="187"><tspan x="70.0" dy="0">T</tspan></text><text x="163.5" y="645.0" font-size="26" font-weight="800" font-style="normal" fill="#f87171" text-anchor="middle" data-max="187"><tspan x="163.5" dy="0">negativas</tspan></text><text x="257.0" y="609.0" font-size="10.5" font-weight="700" font-style="normal" fill="#f87171" text-anchor="end" data-max="106"><tspan x="257.0" dy="0">simétricas ▲</tspan></text><rect x="281.0" y="587.0" width="211.0" height="82.0" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="1.5"/><text x="293.0" y="609.0" font-size="11.5" font-weight="800" font-style="normal" fill="#f87171" text-anchor="start" data-max="187"><tspan x="293.0" dy="0">RITMO</tspan></text><text x="386.5" y="645.0" font-size="26" font-weight="800" font-style="normal" fill="#f87171" text-anchor="middle" data-max="187"><tspan x="386.5" dy="0">irregular</tspan></text><text x="480.0" y="609.0" font-size="10.5" font-weight="700" font-style="normal" fill="#f87171" text-anchor="end" data-max="106"><tspan x="480.0" dy="0"> ▲</tspan></text><rect x="528.0" y="352.0" width="432.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="543.0" y="377.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">ST ↑ y T negativas en II, III, aVF</tspan></text><text x="543.0" y="394.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Cara inferior: coronaria derecha en el 80 %.</tspan></text><rect x="528.0" y="417.0" width="432.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="543.0" y="442.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">FC 60 con ritmo irregular</tspan></text><text x="543.0" y="459.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Isquemia del nodo: vigilar bloqueo AV.</tspan></text><rect x="528.0" y="482.0" width="432.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="543.0" y="507.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Siguiente paso</tspan></text><text x="543.0" y="524.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">V3R-V4R para descartar infarto del ventrículo derecho.</tspan></text><rect x="528.0" y="547.0" width="432.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="543.0" y="572.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Conducta</tspan></text><text x="543.0" y="589.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Angioplastia primaria en menos de 120 minutos.</tspan></text><rect x="40.0" y="705.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="731.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">DII, DIII, aVF = infarto inferior</tspan></text><text x="60.0" y="750.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Reperfusión urgente y derivaciones derechas.</tspan></text><text x="40.0" y="817.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="827.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="849.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="830.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Inferior</tspan></text><text x="435.0" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Anterior</tspan></text><text x="585.0" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Lateral</tspan></text><text x="735.0" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Septal</tspan></text><text x="885.0" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Posterior</tspan></text><rect x="40.0" y="864.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="864.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="893.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Cara?</tspan></text><text x="285.0" y="893.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: II, III y aVF</tspan></text><text x="435.0" y="893.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: sería V3-V4</tspan></text><text x="585.0" y="885.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sería DI, aVL,</tspan><tspan x="585.0" dy="16">V5-V6</tspan></text><text x="735.0" y="893.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: sería V1-V2</tspan></text><text x="885.0" y="885.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: depresión de</tspan><tspan x="885.0" dy="16">V1-V3</tspan></text><rect x="40.0" y="827.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="938.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="966.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="988.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Registrar V3R-V4R: ST ≥ 1 mm en V4R = infarto del VD (volumen, sin nitratos).</tspan><tspan x="58.0" dy="18">• Reperfusión: angioplastia primaria en &lt; 120 min.</tspan><tspan x="58.0" dy="18">• Aspirina, segundo antiagregante y anticoagulante; atropina si la bradicardia es sintomática.</tspan></text><text x="58.0" y="1046.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ESC, síndromes coronarios agudos (2023); Braunwald Tratado de Cardiología 12.ª ed.</tspan></text></svg>