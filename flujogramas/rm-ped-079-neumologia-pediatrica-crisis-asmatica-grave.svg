<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1334" viewBox="0 0 1000 1334" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la crisis asmática grave la complicación más frecuente es la atelectasia por tapones de moco"><title>En la crisis asmática grave la complicación más frecuente es la atelectasia por tapones de moco</title><rect x="0.75" y="0.75" width="998.5" height="1332.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neumología pediátrica · crisis asmática grave</tspan></text><rect x="469.4" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="518.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="518.4" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Crisis asmática grave</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Broncoconstricción, edema de mucosa e hipersecreción de moco espeso que forma</tspan><tspan x="58.0" dy="17">tapones.</tspan><tspan x="58.0" dy="17">Falla del tratamiento de rescate.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Escolar de 7 años asmático</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Rinorrea y tos hace 2 días, dificultad respiratoria.</tspan><tspan x="640.0" dy="16">FR 40, FC 87, SatO₂ 94 %, tiraje, sibilancias; sin</tspan><tspan x="640.0" dy="16">mejoría con el rescate.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LOS DATOS DE LA CRISIS Y SU LECTURA</tspan></text><rect x="40.0" y="285.0" width="470.0" height="334.0" rx="16" fill="#0b1220" stroke="#334155" stroke-width="3"/><rect x="52.0" y="297.0" width="150.0" height="24.0" rx="6" fill="#1e293b" stroke="none" stroke-width="1.5"/><text x="62.0" y="314.0" font-size="10.5" font-weight="800" font-style="normal" fill="#5eead4" text-anchor="start" data-max="132"><tspan x="62.0" dy="0">MONITOR · ASMA</tspan></text><rect x="58.0" y="335.0" width="211.0" height="82.0" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="1.5"/><text x="70.0" y="357.0" font-size="11.5" font-weight="800" font-style="normal" fill="#f87171" text-anchor="start" data-max="187"><tspan x="70.0" dy="0">FR</tspan></text><text x="163.5" y="393.0" font-size="26" font-weight="800" font-style="normal" fill="#f87171" text-anchor="middle" data-max="187"><tspan x="163.5" dy="0">40</tspan></text><text x="257.0" y="357.0" font-size="10.5" font-weight="700" font-style="normal" fill="#f87171" text-anchor="end" data-max="106"><tspan x="257.0" dy="0">rpm ▲</tspan></text><rect x="281.0" y="335.0" width="211.0" height="82.0" rx="10" fill="#052e16" stroke="#4ade80" stroke-width="1.5"/><text x="293.0" y="357.0" font-size="11.5" font-weight="800" font-style="normal" fill="#4ade80" text-anchor="start" data-max="187"><tspan x="293.0" dy="0">FC</tspan></text><text x="386.5" y="393.0" font-size="26" font-weight="800" font-style="normal" fill="#4ade80" text-anchor="middle" data-max="187"><tspan x="386.5" dy="0">87</tspan></text><text x="480.0" y="357.0" font-size="10.5" font-weight="700" font-style="normal" fill="#4ade80" text-anchor="end" data-max="106"><tspan x="480.0" dy="0">lpm</tspan></text><rect x="58.0" y="427.0" width="211.0" height="82.0" rx="10" fill="#0c1e3d" stroke="#60a5fa" stroke-width="1.5"/><text x="70.0" y="449.0" font-size="11.5" font-weight="800" font-style="normal" fill="#60a5fa" text-anchor="start" data-max="187"><tspan x="70.0" dy="0">SatO₂</tspan></text><text x="163.5" y="485.0" font-size="26" font-weight="800" font-style="normal" fill="#60a5fa" text-anchor="middle" data-max="187"><tspan x="163.5" dy="0">94</tspan></text><text x="257.0" y="449.0" font-size="10.5" font-weight="700" font-style="normal" fill="#60a5fa" text-anchor="end" data-max="106"><tspan x="257.0" dy="0">% ▼</tspan></text><rect x="281.0" y="427.0" width="211.0" height="82.0" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="1.5"/><text x="293.0" y="449.0" font-size="11.5" font-weight="800" font-style="normal" fill="#f87171" text-anchor="start" data-max="187"><tspan x="293.0" dy="0">TIRAJE</tspan></text><text x="386.5" y="485.0" font-size="26" font-weight="800" font-style="normal" fill="#f87171" text-anchor="middle" data-max="187"><tspan x="386.5" dy="0">intercostal</tspan></text><text x="480.0" y="449.0" font-size="10.5" font-weight="700" font-style="normal" fill="#f87171" text-anchor="end" data-max="106"><tspan x="480.0" dy="0"> ▲</tspan></text><rect x="58.0" y="519.0" width="211.0" height="82.0" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="1.5"/><text x="70.0" y="541.0" font-size="11.5" font-weight="800" font-style="normal" fill="#f87171" text-anchor="start" data-max="187"><tspan x="70.0" dy="0">AUSCULTACIÓN</tspan></text><text x="163.5" y="577.0" font-size="26" font-weight="800" font-style="normal" fill="#f87171" text-anchor="middle" data-max="187"><tspan x="163.5" dy="0">sibilancias</tspan></text><text x="257.0" y="541.0" font-size="10.5" font-weight="700" font-style="normal" fill="#f87171" text-anchor="end" data-max="106"><tspan x="257.0" dy="0"> ▲</tspan></text><rect x="281.0" y="519.0" width="211.0" height="82.0" rx="10" fill="#450a0a" stroke="#f87171" stroke-width="1.5"/><text x="293.0" y="541.0" font-size="11.5" font-weight="800" font-style="normal" fill="#f87171" text-anchor="start" data-max="187"><tspan x="293.0" dy="0">RESCATE</tspan></text><text x="386.5" y="577.0" font-size="26" font-weight="800" font-style="normal" fill="#f87171" text-anchor="middle" data-max="187"><tspan x="386.5" dy="0">sin mejoría</tspan></text><text x="480.0" y="541.0" font-size="10.5" font-weight="700" font-style="normal" fill="#f87171" text-anchor="end" data-max="106"><tspan x="480.0" dy="0"> ▲</tspan></text><rect x="528.0" y="302.0" width="432.0" height="73.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="543.0" y="327.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Asma + sin mejoría con el rescate</tspan></text><text x="543.0" y="344.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Crisis grave: oxígeno, salbutamol, ipratropio, corticoide sistémico y</tspan><tspan x="543.0" dy="16">magnesio si persiste.</tspan></text><rect x="528.0" y="383.0" width="432.0" height="73.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="543.0" y="408.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Tapones de moco en bronquios</tspan></text><text x="543.0" y="425.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Atelectasia: complicación más frecuente; se ve como pérdida de volumen</tspan><tspan x="543.0" dy="16">en la radiografía.</tspan></text><rect x="528.0" y="464.0" width="432.0" height="73.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="543.0" y="489.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Fugas de aire</tspan></text><text x="543.0" y="506.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Neumotórax, neumomediastino y enfisema subcutáneo: raros pero</tspan><tspan x="543.0" dy="16">graves, con dolor torácico súbito.</tspan></text><rect x="528.0" y="545.0" width="432.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="543.0" y="570.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">FC normal en crisis grave</tspan></text><text x="543.0" y="587.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="402"><tspan x="543.0" dy="0">Signo de alerta: no tranquiliza.</tspan></text><rect x="40.0" y="637.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="663.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Crisis asmática grave = atelectasia como complicación más frecuente</tspan></text><text x="60.0" y="682.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Infección sobreagregada y enfisema son poco habituales en la crisis aguda.</tspan></text><text x="40.0" y="743.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">COMPLICACIONES DE LA CRISIS ASMÁTICA GRAVE</tspan></text><rect x="40.0" y="755.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="774.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Complicación</tspan></text><text x="290.0" y="774.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Frecuencia</tspan></text><text x="630.0" y="774.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">Cómo se sospecha</tspan></text><rect x="40.0" y="784.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="803.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Atelectasia</tspan></text><text x="290.0" y="803.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">La más frecuente</tspan></text><text x="630.0" y="803.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">Pérdida de volumen en la radiografía (lóbulo medio o</tspan><tspan x="630.0" dy="15">língula)</tspan></text><rect x="180.6" y="795.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="226.0" y="810.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="226.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="828.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="847.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Neumotórax, neumomediastino,</tspan><tspan x="50.0" dy="15">enfisema subcutáneo</tspan></text><text x="290.0" y="847.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Menos frecuentes, más graves</tspan></text><text x="630.0" y="847.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">Dolor torácico súbito, crepitación o deterioro brusco</tspan></text><rect x="40.0" y="872.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="891.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Infección sobreagregada</tspan></text><text x="290.0" y="891.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Poco habitual</tspan></text><text x="630.0" y="891.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">Fiebre persistente; casi todas las crisis son virales</tspan></text><text x="40.0" y="941.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="951.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="982.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="982.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Neumotórax</tspan></text><text x="435.0" y="973.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Infección</tspan><tspan x="435.0" dy="17">sobreagregada</tspan></text><text x="585.0" y="982.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Enfisema</tspan></text><rect x="663.0" y="954.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="982.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Atelectasia</tspan></text><text x="885.0" y="982.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Neumomediastino</tspan></text><rect x="40.0" y="1005.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="1005.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1034.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Complicación más</tspan><tspan x="54.0" dy="16">frecuente?</tspan></text><text x="285.0" y="1034.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: menos frecuente,</tspan><tspan x="285.0" dy="16">pero más grave</tspan></text><text x="435.0" y="1034.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: la mayoría de las</tspan><tspan x="435.0" dy="16">crisis son virales</tspan></text><text x="585.0" y="1026.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no es una</tspan><tspan x="585.0" dy="16">complicación aguda</tspan><tspan x="585.0" dy="16">del asma</tspan></text><text x="735.0" y="1034.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: tapones de moco</tspan><tspan x="735.0" dy="16">obstruyen bronquios</tspan></text><text x="885.0" y="1034.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: menos frecuente,</tspan><tspan x="885.0" dy="16">pero más grave</tspan></text><rect x="40.0" y="951.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1095.0" width="920.0" height="221.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1123.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1145.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Los tapones mucosos obstruyen bronquios segmentarios o lobares: atelectasia, a menudo del lóbulo medio o la língula, que puede confundirse con</tspan><tspan x="58.0" dy="18">   neumonía.</tspan><tspan x="58.0" dy="18">• Las fugas de aire (neumotórax, neumomediastino, enfisema subcutáneo) son menos frecuentes pero más graves: dolor súbito, crepitación o deterioro</tspan><tspan x="58.0" dy="18">   brusco.</tspan><tspan x="58.0" dy="18">• Manejo (GINA 2025): oxígeno, salbutamol repetido con espaciador, bromuro de ipratropio, corticoide sistémico precoz y sulfato de magnesio IV si no</tspan><tspan x="58.0" dy="18">   mejora.</tspan><tspan x="58.0" dy="18">• Alerta: una frecuencia cardiaca normal en plena crisis grave debe preocupar y el silencio auscultatorio indica gravedad extrema. La infección</tspan><tspan x="58.0" dy="18">   sobreagregada es poco habitual.</tspan></text><text x="58.0" y="1293.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: GINA, Global Strategy for Asthma Management and Prevention (2025); Nelson Tratado de Pediatría 22.ª ed. (2024)</tspan></text></svg>