le="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Exceso de hormona tiroidea: todo se acelera.</tspan><tspan x="58.0" dy="17">Baja de peso con apetito aumentado, calor, sudoración, temblor, taquicardia, PA diferencial</tspan><tspan x="58.0" dy="17">amplia.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 34 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Baja de 6 kg en un mes con más apetito y sed;</tspan><tspan x="640.0" dy="16">intolerancia al calor, sudoración.</tspan><tspan x="640.0" dy="16">PA 120/50, FC 120, 37,5 °C, piel húmeda y caliente.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">BAJA DE PESO CON TAQUICARDIA: ¿CUÁL?</tspan></text><rect x="40.0" y="285.0" width="450.0" height="181.0" rx="14" f