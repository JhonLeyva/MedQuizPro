<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1329" viewBox="0 0 1000 1329" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Rinorrea, fiebre, vómitos y diarrea líquida sin sangre en un lactante de 6 meses: rotavirus"><title>Rinorrea, fiebre, vómitos y diarrea líquida sin sangre en un lactante de 6 meses: rotavirus</title><rect x="0.75" y="0.75" width="998.5" height="1327.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · diarrea aguda</tspan></text><rect x="345.6" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="394.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="394.6" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Rotavirus</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Primera causa de gastroenteritis grave en menores de 5 años; pico de 6 a 24 meses.</tspan><tspan x="58.0" dy="17">Destruye los enterocitos maduros de la vellosidad.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 6 meses</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Rinorrea acuosa y fiebre, luego vómitos.</tspan><tspan x="640.0" dy="16">Deposiciones líquidas con moco y sin sangre por 2</tspan><tspan x="640.0" dy="16">días.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ROTAVIRUS FRENTE A LAS OTRAS CAUSAS DE DIARREA</tspan></text><rect x="493.0" y="335.0" width="14" height="190" rx="5" fill="#64748b"/><path d="M440.0 540.0 H560.0 L540.0 520.0 H460.0 Z" fill="#475569"/><circle cx="500.0" cy="335.0" r="15" fill="#f59e0b" stroke="#92400e" stroke-width="2"/><line x1="385.4" y1="353.1" x2="614.6" y2="316.9" stroke="#334155" stroke-width="7" stroke-linecap="round"/><line x1="385.4" y1="353.1" x2="357.4" y2="415.1" stroke="#64748b" stroke-width="2"/><line x1="385.4" y1="353.1" x2="413.4" y2="415.1" stroke="#64748b" stroke-width="2"/><path d="M347.4 415.1 H423.4 Q385.4 459.1 347.4 415.1 Z" fill="#ea580c"/><text x="385.4" y="430.1" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="385.4" dy="0">ESTE CASO</tspan></text><line x1="614.6" y1="316.9" x2="586.6" y2="378.9" stroke="#64748b" stroke-width="2"/><line x1="614.6" y1="316.9" x2="642.6" y2="378.9" stroke="#64748b" stroke-width="2"/><path d="M576.6 378.9 H652.6 Q614.6 422.9 576.6 378.9 Z" fill="#64748b"/><text x="614.6" y="393.9" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="614.6" dy="0">OTROS</tspan></text><text x="500.0" y="567.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="300"><tspan x="500.0" dy="0">¿Qué agente explica el cuadro?</tspan></text><rect x="40.0" y="305.0" width="290.0" height="158.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><text x="58.0" y="333.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="254"><tspan x="58.0" dy="0">Rotavirus (este caso)</tspan></text><circle cx="62.0" cy="358.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="362.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Pródromo respiratorio leve y fiebre</tspan></text><circle cx="62.0" cy="384.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="388.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Vómitos que preceden a la diarrea</tspan></text><circle cx="62.0" cy="410.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="414.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Deposiciones líquidas con moco, sin sangre</tspan></text><circle cx="62.0" cy="436.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="440.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Pico entre los 6 y los 24 meses</tspan></text><rect x="214.6" y="294.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="260.0" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="260.0" dy="0">◆ ESTE CASO</tspan></text><rect x="670.0" y="305.0" width="290.0" height="190.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="688.0" y="333.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="688.0" dy="0">Otros agentes</tspan></text><circle cx="692.0" cy="358.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="362.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Salmonella: fiebre con sangre o</tspan><tspan x="704.0" dy="16">moco-sangre</tspan></text><circle cx="692.0" cy="400.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="404.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Estafilococo: vómitos a las pocas horas, sin</tspan><tspan x="704.0" dy="16">fiebre</tspan></text><circle cx="692.0" cy="442.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="446.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">E. coli enterotoxigénico: acuosa, sin fiebre</tspan></text><circle cx="692.0" cy="468.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="472.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Giardia: diarrea crónica con malabsorción</tspan></text><rect x="40.0" y="601.0" width="920.0" height="93.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="629.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Vómitos, fiebre y diarrea líquida sin sangre = rotavirus</tspan></text><text x="500.0" y="650.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Los demás agentes tienen otra evolución o contienen sangre.</tspan><tspan x="500.0" dy="17">Tratamiento: rehidratación oral, lactancia y zinc; sin antibióticos.</tspan></text><text x="40.0" y="728.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CAUSAS DE DIARREA AGUDA EN EL LACTANTE</tspan></text><rect x="40.0" y="740.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="759.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Agente</tspan></text><text x="220.0" y="759.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Cuadro típico</tspan></text><text x="595.0" y="759.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Diferencia con el caso</tspan></text><rect x="40.0" y="769.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="788.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Rotavirus</tspan></text><text x="220.0" y="788.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Fiebre, vómitos y diarrea líquida sin sangre</tspan></text><text x="595.0" y="788.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Coincide</tspan></text><rect x="110.6" y="772.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="156.0" y="787.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="156.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="798.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="817.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Estafilococo</tspan></text><text x="220.0" y="817.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Intoxicación alimentaria de inicio rápido, sin fiebre</tspan></text><text x="595.0" y="817.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">No hay ingesta ni inicio a las horas</tspan></text><rect x="40.0" y="827.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="846.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Salmonella</tspan></text><text x="220.0" y="846.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Fiebre con sangre o moco-sangre</tspan></text><text x="595.0" y="846.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">No hay sangre</tspan></text><rect x="40.0" y="856.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="875.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">E. coli enterotoxigénico</tspan></text><text x="220.0" y="875.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Diarrea acuosa sin fiebre del viajero</tspan></text><text x="595.0" y="875.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Hay fiebre y vómitos</tspan></text><rect x="40.0" y="885.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="904.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Giardia</tspan></text><text x="220.0" y="904.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Diarrea crónica con distensión</tspan></text><text x="595.0" y="904.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Evolución de solo 2 días</tspan></text><text x="40.0" y="954.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="964.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="995.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="967.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="995.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Rotavirus</tspan></text><text x="435.0" y="995.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Estafilococo</tspan></text><text x="585.0" y="995.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Salmonella</tspan></text><text x="735.0" y="986.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">E. coli</tspan><tspan x="735.0" dy="17">enterotoxigénico</tspan></text><text x="885.0" y="995.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Giardia lamblia</tspan></text><rect x="40.0" y="1018.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1018.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1047.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico etiológico</tspan><tspan x="54.0" dy="16">más probable?</tspan></text><text x="285.0" y="1039.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: vómitos, fiebre y</tspan><tspan x="285.0" dy="16">diarrea líquida sin</tspan><tspan x="285.0" dy="16">sangre</tspan></text><text x="435.0" y="1039.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: intoxicación con</tspan><tspan x="435.0" dy="16">vómitos a las pocas</tspan><tspan x="435.0" dy="16">horas, sin fiebre</tspan></text><text x="585.0" y="1047.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: da fiebre con</tspan><tspan x="585.0" dy="16">sangre o moco-sangre</tspan></text><text x="735.0" y="1047.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: diarrea acuosa sin</tspan><tspan x="735.0" dy="16">fiebre del viajero</tspan></text><text x="885.0" y="1047.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: diarrea crónica con</tspan><tspan x="885.0" dy="16">malabsorción</tspan></text><rect x="40.0" y="964.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1108.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1136.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1158.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Cuadro típico: síntomas respiratorios leves, fiebre, vómitos que preceden a la diarrea y deposiciones líquidas abundantes, sin sangre; riesgo de</tspan><tspan x="58.0" dy="18">   deshidratación.</tspan><tspan x="58.0" dy="18">• Salmonella y E. coli invasiva dan fiebre con sangre o moco-sangre; estafilococo, intoxicación con vómitos a las pocas horas y sin fiebre; E. coli</tspan><tspan x="58.0" dy="18">   enterotoxigénica, diarrea del viajero; Giardia, diarrea crónica.</tspan><tspan x="58.0" dy="18">• Tratamiento: rehidratación oral con sales de baja osmolaridad, continuar la lactancia y zinc; no se dan antibióticos. Ondansetrón en dosis única facilita la</tspan><tspan x="58.0" dy="18">   rehidratación.</tspan><tspan x="58.0" dy="18">• Prevención: vacuna oral contra rotavirus del esquema peruano.</tspan></text><text x="58.0" y="1288.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Guarino A et al., Guías ESPGHAN/ESPID para la gastroenteritis aguda en niños, J Pediatr Gastroenterol Nutr 2014; Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>