<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1308" viewBox="0 0 1000 1308" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La coledocolitiasis se trata con papiloesfinterotomía endoscópica y extracción del cálculo"><title>La coledocolitiasis se trata con papiloesfinterotomía endoscópica y extracción del cálculo</title><rect x="0.75" y="0.75" width="998.5" height="1306.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Vía biliar · coledocolitiasis (ASGE 2019)</tspan></text><rect x="433.8" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="477.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="477.0" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Coledocolitiasis</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cálculos en el colédoco: cólico, ictericia, colangitis o pancreatitis biliar.</tspan><tspan x="58.0" dy="17">La CPRE trata en el mismo acto lo que diagnostica.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de tratamiento</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es el tratamiento de elección en una</tspan><tspan x="640.0" dy="16">coledocolitiasis?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">RUTA DEL PACIENTE CON SOSPECHA DE COLEDOCOLITIASIS</tspan></text><rect x="40.0" y="269.0" width="920.0" height="95.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="269.0" width="108.0" height="95.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="320.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Clínica</tspan></text><rect x="40.0" y="364.0" width="920.0" height="95.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="364.0" width="108.0" height="95.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="415.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Imagen</tspan></text><rect x="40.0" y="459.0" width="920.0" height="95.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="459.0" width="108.0" height="95.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="510.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Endoscopia</tspan></text><rect x="40.0" y="554.0" width="920.0" height="95.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="554.0" width="108.0" height="95.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="605.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Cirugía</tspan></text><line x1="348.0" y1="308.5" x2="355.0" y2="308.5" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="308.5" x2="355.0" y2="411.5" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="411.5" x2="353.0" y2="411.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="353.0,416.5 353.0,406.5 362.0,411.5" fill="#0f766e"/><line x1="552.0" y1="411.5" x2="559.0" y2="411.5" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="411.5" x2="559.0" y2="498.5" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="498.5" x2="557.0" y2="498.5" stroke="#ea580c" stroke-width="2.2"/><polygon points="557.0,503.5 557.0,493.5 566.0,498.5" fill="#ea580c"/><line x1="756.0" y1="498.5" x2="763.0" y2="498.5" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="498.5" x2="763.0" y2="601.5" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="601.5" x2="761.0" y2="601.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="761.0,606.5 761.0,596.5 770.0,601.5" fill="#0f766e"/><rect x="158.0" y="282.0" width="190.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Cólico + ictericia</tspan></text><text x="168.0" y="315.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Sospecha de cálculo en colédoco</tspan></text><circle cx="158.0" cy="282.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="362.0" y="377.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="372.0" y="393.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Estratificar riesgo</tspan></text><text x="372.0" y="410.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Alta: cálculo, colangitis o BT &gt; 4</tspan><tspan x="372.0" dy="14.5">con dilatación</tspan></text><circle cx="362.0" cy="377.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="362.0" y="381.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="362.0" dy="0">2</tspan></text><rect x="566.0" y="472.0" width="190.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="576.0" y="488.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">CPRE con esfinterotomía</tspan></text><text x="576.0" y="505.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Extrae el cálculo; éxito 90-95 %</tspan></text><circle cx="566.0" cy="472.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="566.0" y="476.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="566.0" dy="0">3</tspan></text><rect x="770.0" y="567.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="780.0" y="583.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Si falla la CPRE</tspan></text><text x="780.0" y="600.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Kehr o coledocoscopía +</tspan><tspan x="780.0" dy="14.5">colecistectomía</tspan></text><circle cx="770.0" cy="567.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="770.0" y="571.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="770.0" dy="0">4</tspan></text><rect x="40.0" y="667.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="693.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Papiloesfinterotomía endoscópica = tratamiento de elección</tspan></text><text x="60.0" y="712.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Con probabilidad intermedia se confirma antes con colangiorresonancia o ecoendoscopia.</tspan></text><text x="40.0" y="773.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PROBABILIDAD DE COLEDOCOLITIASIS SEGÚN ASGE 2019</tspan></text><rect x="40.0" y="785.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="804.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">Riesgo</tspan></text><text x="160.0" y="804.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="389"><tspan x="160.0" dy="0">Criterios</tspan></text><text x="565.0" y="804.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="389"><tspan x="565.0" dy="0">Conducta</tspan></text><rect x="40.0" y="814.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="833.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">Alto</tspan></text><text x="160.0" y="833.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="160.0" dy="0">Cálculo en imagen, colangitis ascendente, o bilirrubina total &gt; 4 mg/dL</tspan><tspan x="160.0" dy="15">con colédoco dilatado</tspan></text><text x="565.0" y="833.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="565.0" dy="0">CPRE directa con esfinterotomía</tspan></text><rect x="40.0" y="858.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="877.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">Intermedio</tspan></text><text x="160.0" y="877.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="160.0" dy="0">Hepatograma alterado, edad &gt; 55 años o colédoco dilatado en imagen</tspan></text><text x="565.0" y="877.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="565.0" dy="0">Colangiorresonancia, ecoendoscopia o colangiografía/ecografía</tspan><tspan x="565.0" dy="15">intraoperatoria</tspan></text><rect x="40.0" y="902.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="921.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="94"><tspan x="50.0" dy="0">Bajo</tspan></text><text x="160.0" y="921.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="160.0" dy="0">Ningún criterio</tspan></text><text x="565.0" y="921.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="389"><tspan x="565.0" dy="0">Colecistectomía sin más estudios de la vía biliar</tspan></text><text x="40.0" y="971.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="981.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1012.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1003.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Colangiografía</tspan><tspan x="285.0" dy="17">transparietohepática</tspan></text><text x="435.0" y="1003.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Coledocotomía más</tspan><tspan x="435.0" dy="17">dren de Kehr</tspan></text><text x="585.0" y="1003.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Esfinteroplastía</tspan><tspan x="585.0" dy="17">transduodenal</tspan></text><text x="735.0" y="1003.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Coledocotomía</tspan><tspan x="735.0" dy="17">convencional</tspan></text><rect x="813.0" y="984.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="1003.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Papiloesfinterotomía</tspan><tspan x="885.0" dy="17">endoscópica</tspan></text><rect x="40.0" y="1035.0" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="1035.0" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1072.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tratamiento de</tspan><tspan x="54.0" dy="16">elección?</tspan></text><text x="285.0" y="1056.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es una vía</tspan><tspan x="285.0" dy="16">diagnóstica o de</tspan><tspan x="285.0" dy="16">drenaje, no extrae el</tspan><tspan x="285.0" dy="16">cálculo</tspan></text><text x="435.0" y="1064.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es quirúrgico y</tspan><tspan x="435.0" dy="16">reservado a falla</tspan><tspan x="435.0" dy="16">endoscópica</tspan></text><text x="585.0" y="1072.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: quedó para casos</tspan><tspan x="585.0" dy="16">seleccionados</tspan></text><text x="735.0" y="1072.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es invasivo y se</tspan><tspan x="735.0" dy="16">usa si falla la CPRE</tspan></text><text x="885.0" y="1072.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: endoscópica, con</tspan><tspan x="885.0" dy="16">extracción del cálculo</tspan></text><rect x="40.0" y="981.0" width="920.0" height="136.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1141.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1169.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1191.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• ASGE 2019 estratifica el riesgo de coledocolitiasis en alto, intermedio y bajo (ver cuadro); la CPRE directa se reserva para el riesgo alto.</tspan><tspan x="58.0" dy="18">• Riesgo intermedio: confirmar con colangiorresonancia, ecoendoscopia o ecografía intraoperatoria antes de la CPRE.</tspan><tspan x="58.0" dy="18">• CPRE con esfinterotomía y extracción con balón o canastilla: éxito del 90-95 %. Si falla: exploración de la vía biliar (Kehr o coledocoscopía).</tspan><tspan x="58.0" dy="18">• EsSalud-IETSI GPC N.º 11 (2018): colelitiasis, colecistitis aguda y coledocolitiasis.</tspan></text><text x="58.0" y="1267.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ASGE, coledocolitiasis (2019); ESGE, cálculos de la vía biliar (2019); EsSalud-IETSI, GPC N.º 11 (2018)</tspan></text></svg>