<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="927" viewBox="0 0 1000 927" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La tenosinovitis de De Quervain compromete el primer compartimento: abductor largo y extensor corto del pulgar"><title>La tenosinovitis de De Quervain compromete el primer compartimento: abductor largo y extensor corto del pulgar</title><rect x="0.75" y="0.75" width="998.5" height="925.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Traumatología · tenosinovitis de De Quervain</tspan></text><rect x="466.6" y="32.0" width="135.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="534.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="119"><tspan x="534.3" dy="0">TRAUMATOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tenosinovitis de De Quervain</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Inflamación y engrosamiento del primer compartimento dorsal de la muñeca, a nivel de la</tspan><tspan x="58.0" dy="17">apófisis estiloides radial.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Tendón afectado</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Además del extensor corto del pulgar.</tspan><tspan x="640.0" dy="16">¿Qué otro tendón forma la vaina?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><rect x="40.0" y="245.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="271.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Primer compartimento = abductor largo y extensor corto del pulgar</tspan></text><text x="60.0" y="290.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Los extensores radiales, de los dedos y cubital pertenecen a otros compartimentos.</tspan></text><text x="40.0" y="351.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">COMPARTIMENTOS EXTENSORES DEL DORSO DE LA MUÑECA</tspan></text><rect x="40.0" y="363.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Compartimento</tspan></text><text x="250.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Tendones</tspan></text><text x="610.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Patología asociada</tspan></text><rect x="40.0" y="392.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="411.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Primero</tspan></text><text x="250.0" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Abductor largo y extensor corto del pulgar</tspan></text><text x="610.0" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Tenosinovitis de De Quervain (caso)</tspan></text><rect x="140.6" y="395.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="186.0" y="410.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="186.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="421.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="440.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Segundo</tspan></text><text x="250.0" y="440.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Extensor radial largo y corto del carpo</tspan></text><text x="610.0" y="440.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Síndrome de intersección</tspan></text><rect x="40.0" y="450.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="469.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Tercero</tspan></text><text x="250.0" y="469.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Extensor largo del pulgar</tspan></text><text x="610.0" y="469.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Rotura tras fractura de radio distal</tspan></text><rect x="40.0" y="479.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="498.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Cuarto</tspan></text><text x="250.0" y="498.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Extensor de los dedos y del índice</tspan></text><text x="610.0" y="498.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Tenosinovitis dorsal</tspan></text><rect x="40.0" y="508.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="527.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Quinto</tspan></text><text x="250.0" y="527.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Extensor del meñique</tspan></text><text x="610.0" y="527.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Rara</tspan></text><rect x="40.0" y="537.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="556.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Sexto</tspan></text><text x="250.0" y="556.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Extensor cubital del carpo</tspan></text><text x="610.0" y="556.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Tendinitis cubital</tspan></text><text x="40.0" y="606.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="616.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="647.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="619.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="638.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Abductor largo del</tspan><tspan x="285.0" dy="17">pulgar</tspan></text><text x="435.0" y="638.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Extensor de los</tspan><tspan x="435.0" dy="17">dedos</tspan></text><text x="585.0" y="638.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Extensor cubital del</tspan><tspan x="585.0" dy="17">carpo</tspan></text><text x="735.0" y="638.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Extensor radial</tspan><tspan x="735.0" dy="17">corto del carpo</tspan></text><text x="885.0" y="638.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Extensor radial</tspan><tspan x="885.0" dy="17">largo del carpo</tspan></text><rect x="40.0" y="670.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="670.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="699.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Otro tendón de la</tspan><tspan x="54.0" dy="16">vaina?</tspan></text><text x="285.0" y="691.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: comparte el primer</tspan><tspan x="285.0" dy="16">compartimento con el</tspan><tspan x="285.0" dy="16">extensor corto</tspan></text><text x="435.0" y="699.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: pertenece al cuarto</tspan><tspan x="435.0" dy="16">compartimento</tspan></text><text x="585.0" y="699.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: pertenece al sexto</tspan><tspan x="585.0" dy="16">compartimento</tspan></text><text x="735.0" y="699.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: ocupa el segundo</tspan><tspan x="735.0" dy="16">compartimento</tspan></text><text x="885.0" y="699.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: ocupa el segundo</tspan><tspan x="885.0" dy="16">compartimento</tspan></text><rect x="40.0" y="616.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="760.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="788.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="810.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Frecuente en mujeres de 30 a 50 años, en el puerperio y con agarres repetidos del pulgar, como cargar un bebé.</tspan><tspan x="58.0" dy="18">• Cuadro: dolor en el borde radial de la muñeca, edema local y dolor al abducir el pulgar.</tspan><tspan x="58.0" dy="18">• Prueba de Finkelstein: pulgar flexionado dentro del puño y desviación cubital de la muñeca reproduce el dolor.</tspan><tspan x="58.0" dy="18">• Tratamiento inicial conservador: férula espica del pulgar, antiinflamatorios e inyección de corticoide; cirugía si fracasa.</tspan></text><text x="58.0" y="886.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: J Am Acad Orthop Surg 2007 (PMID 18063716); Cureus 2023 (PMID 37252462); Campbell's Operative Orthopaedics, 14.ª ed. (2021).</tspan></text></svg>