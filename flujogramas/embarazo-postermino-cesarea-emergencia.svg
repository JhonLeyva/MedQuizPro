<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="831" viewBox="0 0 1000 831" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="42 semanas con menos movimientos, oligoamnios severo y desaceleraciones repetidas: cesárea inmediata"><title>42 semanas con menos movimientos, oligoamnios severo y desaceleraciones repetidas: cesárea inmediata</title><rect x="0.75" y="0.75" width="998.5" height="830.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Embarazo prolongado · postérmino</tspan></text><rect x="409.8" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="497.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="497.0" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Embarazo postérmino</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">42 semanas o más: la placenta envejece y el líquido disminuye.</tspan><tspan x="58.0" dy="17">Riesgos: oligoamnios, meconio, hipoxia fetal, macrosomía y muerte fetal.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante de 42 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Disminución de movimientos fetales.</tspan><tspan x="640.0" dy="16">Oligoamnios severo, placenta madura,</tspan><tspan x="640.0" dy="16">desaceleraciones repetidas.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="395.0" x2="733.5" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="395.0" x2="266.5" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,423.0 271.5,423.0 266.5,431.0" fill="#94a3b8"/><line x1="733.5" y1="395.0" x2="733.5" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,423.0 738.5,423.0 733.5,431.0" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#0f766e"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="395.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="395.0" x2="266.5" y2="424.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,423.0 271.5,423.0 266.5,431.0" fill="#0f766e"/><rect x="139.5" y="404.0" width="253.9" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Sí: desaceleraciones + oligoamnios (este caso)</tspan></text><rect x="719.4" y="404.0" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">No</tspan></text><polygon points="240.0,336.0 266.0,307.0 734.0,307.0 760.0,336.0 734.0,365.0 266.0,365.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="336.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="341.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="340.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">≥ 42 semanas: ¿el feto está comprometido?</tspan></text><rect x="40.0" y="431.0" width="453.0" height="73.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">CESÁREA INMEDIATA</tspan></text><text x="266.5" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">No tolera el trabajo de parto</tspan></text><rect x="507.0" y="431.0" width="453.0" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Inducción</tspan></text><text x="733.5" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Madurar el cuello si Bishop ≤ 6</tspan></text><text x="40.0" y="544.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="554.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="585.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="585.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Observación</tspan></text><text x="435.0" y="577.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Solicitar test</tspan><tspan x="435.0" dy="17">stressante</tspan></text><text x="585.0" y="577.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Inducción de parto</tspan><tspan x="585.0" dy="17">vaginal</tspan></text><rect x="663.0" y="557.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="585.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Cesárea inmediata</tspan></text><text x="885.0" y="585.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Amnioinfusión</tspan></text><rect x="40.0" y="608.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="608.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="637.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Adecuada?</tspan></text><text x="285.0" y="629.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: riesgo de muerte</tspan><tspan x="285.0" dy="16">fetal</tspan></text><text x="435.0" y="637.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: ya hay sufrimiento</tspan></text><text x="585.0" y="629.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: el feto no tolera el</tspan><tspan x="585.0" dy="16">trabajo de parto</tspan></text><text x="735.0" y="637.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: feto comprometido</tspan></text><text x="885.0" y="637.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no corrige la causa</tspan></text><rect x="40.0" y="554.5" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="682.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="710.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="732.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Feto comprometido (desaceleraciones repetidas + oligoamnios severo): cesárea inmediata.</tspan><tspan x="58.0" dy="18">• Con feto bien y cuello favorable: inducción; desde las 41 semanas ya se ofrece inducir.</tspan><tspan x="58.0" dy="18">• La amnioinfusión no corrige la causa ni reemplaza la extracción.</tspan></text><text x="58.0" y="790.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, Late-term and postterm pregnancy (2014, reafirmado) y Clinical Practice Update (2024); Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>