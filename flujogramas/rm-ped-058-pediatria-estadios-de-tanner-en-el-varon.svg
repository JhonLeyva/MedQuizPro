<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="970" viewBox="0 0 1000 970" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En el estadio III de Tanner del varón el pene crece en longitud y se engrosa"><title>En el estadio III de Tanner del varón el pene crece en longitud y se engrosa</title><rect x="0.75" y="0.75" width="998.5" height="968.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · estadios de Tanner en el varón</tspan></text><rect x="444.5" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="493.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="493.6" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Escala de Marshall y Tanner</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Describe la maduración puberal por el desarrollo genital y el vello pubiano.</tspan><tspan x="58.0" dy="17">El estadio II (11-12 años) es el inicio de la pubertad.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Según Tanner en el varón, ¿qué se presenta en el</tspan><tspan x="640.0" dy="16">estadio III?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><rect x="40.0" y="245.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="271.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Tanner III: engrosamiento y alargamiento del pene</tspan></text><text x="60.0" y="290.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El vello solo en la base es el estadio II; el botón mamario es de la niña.</tspan></text><text x="40.0" y="351.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ESTADIOS DE TANNER EN EL VARÓN (GENITALES Y VELLO PUBIANO)</tspan></text><rect x="40.0" y="363.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">Estadio</tspan></text><text x="175.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Genitales</tspan></text><text x="572.5" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Vello pubiano</tspan></text><rect x="40.0" y="392.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="411.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">I</tspan></text><text x="175.0" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Prepuberal: testículo menor de 2,5 cm</tspan></text><text x="572.5" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Ausente</tspan></text><rect x="40.0" y="421.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="440.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">II</tspan></text><text x="175.0" y="440.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Testículo de 4 mL o más; escroto enrojecido y delgado</tspan></text><text x="572.5" y="440.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Escaso, en la base del pene</tspan></text><rect x="40.0" y="450.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="469.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">III</tspan></text><text x="175.0" y="469.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Pene más largo y grueso; mayor crecimiento de testículo y escroto</tspan></text><text x="572.5" y="469.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Más oscuro, rizado, llega al pubis</tspan></text><rect x="65.6" y="453.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="111.0" y="468.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="111.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="479.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="498.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">IV</tspan></text><text x="175.0" y="498.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Glande ensanchado; escroto pigmentado</tspan></text><text x="572.5" y="498.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Tipo adulto, sin llegar a los muslos</tspan></text><rect x="40.0" y="508.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="527.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">V</tspan></text><text x="175.0" y="527.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Genitales adultos</tspan></text><text x="572.5" y="527.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Adulto, hasta los muslos</tspan></text><text x="40.0" y="553.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Edad media: estadio II a los 11-12 años y estadio III a los 13 años.</tspan></text><text x="40.0" y="600.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="610.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="641.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="613.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="632.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Engrosamiento</tspan><tspan x="285.0" dy="17">peneano</tspan></text><text x="435.0" y="632.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Vellosidad en base</tspan><tspan x="435.0" dy="17">del pene</tspan></text><text x="585.0" y="641.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Escroto laxo</tspan></text><text x="735.0" y="632.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Testículo de 1 a 2</tspan><tspan x="735.0" dy="17">cm</tspan></text><text x="885.0" y="641.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Botón mamario</tspan></text><rect x="40.0" y="664.0" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="664.0" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="701.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué se presenta en el</tspan><tspan x="54.0" dy="16">estadio III?</tspan></text><text x="285.0" y="685.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: crecimiento en</tspan><tspan x="285.0" dy="16">longitud y</tspan><tspan x="285.0" dy="16">engrosamiento del</tspan><tspan x="285.0" dy="16">pene</tspan></text><text x="435.0" y="693.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: vello solo en la</tspan><tspan x="435.0" dy="16">base del pene es el</tspan><tspan x="435.0" dy="16">estadio II</tspan></text><text x="585.0" y="693.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: el escroto laxo no</tspan><tspan x="585.0" dy="16">es un criterio de</tspan><tspan x="585.0" dy="16">estadio</tspan></text><text x="735.0" y="701.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: un testículo de 1-2</tspan><tspan x="735.0" dy="16">cm es prepuberal</tspan></text><text x="885.0" y="701.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es el primer signo</tspan><tspan x="885.0" dy="16">puberal de la niña</tspan></text><rect x="40.0" y="610.0" width="920.0" height="136.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="770.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="798.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="820.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Estadio II: testículo de 4 mL o más (más de 2,5 cm), escroto enrojecido y vello escaso en la base del pene. Estadio III: pene más largo y grueso, más</tspan><tspan x="58.0" dy="18">   testículo y escroto, vello oscuro y rizado hasta el pubis.</tspan><tspan x="58.0" dy="18">• Estadio IV: glande ensanchado, escroto pigmentado y vello adulto sin llegar a los muslos. Estadio V: genitales y vello adultos.</tspan><tspan x="58.0" dy="18">• El estirón del varón ocurre en el estadio III-IV, más tarde que en la mujer. El botón mamario es el primer signo puberal de la niña, no del varón.</tspan><tspan x="58.0" dy="18">• Alerta: inicio puberal antes de los 9 años en el varón es pubertad precoz y se estudia.</tspan></text><text x="58.0" y="914.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Marshall WA, Tanner JM, Arch Dis Child 1970 (según se describe en Nelson); Sociedad de Endocrinología Pediátrica, consensos de pubertad precoz (revisión 2024);</tspan><tspan x="58.0" dy="15">Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>