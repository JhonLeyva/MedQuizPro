ize="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><rect x="74.0" y="183.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="88.0" y="210.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="88.0" dy="0">Volumen</tspan></text><text x="88.0" y="233.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="88.0" dy="0">SSN 0.9 % 1–1.5 L en la primera</tspan><tspan x="88.0" dy="17">hora</tspan></text><line x1="335.0" y1="224.5" x2="345.0" y2="224.5" stroke="#0f766e" stroke-width="2"/><polygon points="344.0,219.5 344.0,229.5 352.0,224.5" fill="#0f766e"/><rect x="354.0" y="183.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="376.0" cy="207.0" r="13" fill="#0f766e"/><text x="376.0" y="212.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="376.0" dy="0">2</tspan></text><rect x="388.0" y="183.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="402.0" y="210.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="402.0" dy="0">Potasio</tspan></text><text x="402.0" y="233.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="402.0" dy="0">Si K &lt; 3.3 mEq/L: reponer antes</tspan><tspan x="402.0" dy="17">de la insulina</tspan></text><line x1="649.0" y1="224.5" x2="659.0" y2="224.5" stroke="#0f766e" stroke-width="2"/><polygon points="658.0,219.5 658.0,229.5 666.0,224.5" fill="#0f766e"/><rect x="668.0" y="183.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="690.0" cy="207.0" r="13" fill="#0f766e"/><text x="690.0" y="212.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="690.0" dy="0">3</tspan></text><rect x="702.0" y="183.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="716.0" y="210.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="716.0" dy="0">Insulina</tspan></text><text x="716.0" y="233.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="716.0" dy="0">Infusión EV 0.1 U/kg/h con K ≥</tspan><tspan x="716.0" dy="17">3.3</tspan></text><line x1="500.0" y1="266.0" x2="500.0" y2="285.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,284.0 505.0,284.0 500.0,292.0" fill="#0f766e"/><rect x="40.0" y="292.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="62.0" cy="316.0" r="13" fill="#0f766e"/><text x="62.0" y="321.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">4</tspan></text><rect x="74.0" y="292.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="88.0" y="319.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="88.0" dy="0">Dextrosa</tspan></text><text x="88.0" y="342.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="88.0" dy="0">Agregar cuando la glucosa baje</tspan><tspan x="88.0" dy="17">a 200–250 mg/dL</tspan></text><line x1="335.0" y1="333.5" x2="345.0" y2="333.5" stroke="#0f766e" stroke-width="2"/><polygon points="344.0,328.5 344.0,338.5 352.0,333.5" fill="#0f766e"/><rect x="354.0" y="292.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="376.0" cy="316.0" r="13" fill="#0f766e"/><text x="376.0" y="321.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="376.0" dy="0">5</tspan></text><rect x="388.0" y="292.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="402.0" y="319.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="402.0" dy="0">Bicarbonato</tspan></text><text x="402.0" y="342.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="402.0" dy="0">Solo si pH &lt; 7.0</tspan></text><line x1="649.0" y1="333.5" x2="659.0" y2="333.5" stroke="#0f766e" stroke-width="2"/><polygon points="658.0,328.5 658.0,338.5 666.0,333.5" fill="#0f766e"/><rect x="668.0" y="292.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="690.0" cy="316.0" r="13" fill="#0f766e"/><text x="690.0" y="321.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="690.0" dy="0">6</tspan></text><rect x="702.0" y="292.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="716.0" y="319.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="716.0" dy="0">Resolución</tspan></text><text x="716.0" y="342.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="716.0" dy="0">pH &gt; 7.3, HCO₃ ≥ 18 y anión gap</tspan><tspan x="716.0" dy="17">normal → insulina SC</tspan></text><line x1="500.0" y1="375.0" x2="500.0" y2="394.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,393.0 505.0,393.0 500.0,401.0" fill="#0f766e"/><rect x="90.0" y="401.0" width="820" height="67.5" rx="10" fill="#134e4a" stroke="#134e4a" stroke-width="1.5"/><text x="500.0" y="427.0" font-size="12" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="792"><tspan x="500.0" dy="0">PRIMERA MEDIDA</tspan></text><text x="500.0" y="452.5" font-size="15" font-weight="400" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="792"><tspan x="500.0" dy="0">Solución salina al 0.9 % endovenosa</tspan></text><rect x="40" y="494.5" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="522.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="544.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La insulina baja el potasio: nunca iniciarla con K &lt; 3.3 mEq/L.</tspan><tspan x="58.0" dy="18">• Tríada: hiperglucemia, cetosis y acidosis metabólica con anión gap elevado.</tspan></text><text x="58.0" y="584.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ADA/EASD/JBDS/AACE/DTS 2024 Consensus on Hyperglycemic Crises · Harrison 21.ª ed.</tspan></text></svg>
