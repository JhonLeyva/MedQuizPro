<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="803" viewBox="0 0 1000 803" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Gestante de 33 semanas con PPD positivo sin tuberculosis activa: infección latente, la terapia preventiva puede iniciarse a los 3 meses posparto (salvo alto riesgo)"><title>Gestante de 33 semanas con PPD positivo sin tuberculosis activa: infección latente, la terapia preventiva puede iniciarse a los 3 meses posparto (salvo alto riesgo)</title><rect x="0.75" y="0.75" width="998.5" height="801.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Tuberculosis latente · embarazo</tspan></text><rect x="389.1" y="32.0" width="129.8" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="454.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="114"><tspan x="454.0" dy="0">NEUMOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Terapia preventiva en el embarazo</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Sin factores de alto riesgo (VIH, contacto reciente con TB activa), se puede diferir hasta 2-3</tspan><tspan x="58.0" dy="17">meses después del parto (el posparto aumenta la hepatotoxicidad de la isoniazida).</tspan><tspan x="58.0" dy="17">Con VIH o contacto reciente: empezar ya durante el embarazo.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante de 33 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">PPD positivo.</tspan><tspan x="640.0" dy="16">Sin enfermedad activa.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">GESTANTE CON PPD POSITIVO: ¿CUÁNDO TRATAR?</tspan></text><rect x="40.0" y="269.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="180"><tspan x="54.0" dy="0">SITUACIÓN</tspan></text><text x="420.0" y="291.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="340"><tspan x="420.0" dy="0">Sin TB activa</tspan></text><text x="780.0" y="291.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="340"><tspan x="780.0" dy="0">Con TB activa</tspan></text><rect x="40.0" y="309.0" width="194.0" height="57.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="335.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Sin riesgo alto</tspan></text><text x="54.0" y="352.0" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">Este caso</tspan></text><rect x="243.0" y="309.0" width="354.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="255.0" y="341.5" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">ISONIAZIDA 2-3 MESES POSPARTO</tspan></text><rect x="496.2" y="298.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="541.6" y="313.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="541.6" dy="0">◆ ESTE CASO</tspan></text><rect x="603.0" y="309.0" width="354.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="615.0" y="334.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">HRZE ya</tspan></text><text x="615.0" y="350.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">No se difiere</tspan></text><rect x="40.0" y="372.0" width="194.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="405.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="172"><tspan x="54.0" dy="0">VIH o contacto reciente</tspan></text><rect x="243.0" y="372.0" width="354.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="255.0" y="397.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">Isoniazida ya</tspan></text><text x="255.0" y="413.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="336"><tspan x="255.0" dy="0">Durante el embarazo</tspan></text><rect x="603.0" y="372.0" width="354.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="615.0" y="404.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="336"><tspan x="615.0" dy="0">HRZE ya</tspan></text><text x="44.0" y="451.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">La infección latente no contagia: no se aísla.</tspan></text><text x="40.0" y="499.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="509.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="548.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="531.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Isoniazida +</tspan><tspan x="285.0" dy="17">pirazinamida +</tspan><tspan x="285.0" dy="17">etambutol</tspan></text><text x="435.0" y="531.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Iniciar tratamiento</tspan><tspan x="435.0" dy="17">con isoniacida y</tspan><tspan x="435.0" dy="17">etambutol</tspan></text><rect x="513.0" y="512.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="540.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Iniciar a los 3</tspan><tspan x="585.0" dy="17">meses posparto</tspan></text><text x="735.0" y="531.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Aislar a la paciente</tspan><tspan x="735.0" dy="17">para que no</tspan><tspan x="735.0" dy="17">contagie</tspan></text><text x="885.0" y="540.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Cuatro fármacos de</tspan><tspan x="885.0" dy="17">inmediato</tspan></text><rect x="40.0" y="580.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="580.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="609.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Manejo?</tspan></text><text x="285.0" y="609.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no hay TB activa</tspan></text><text x="435.0" y="601.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: esquema</tspan><tspan x="435.0" dy="16">incorrecto</tspan></text><text x="585.0" y="601.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: sin factores de alto</tspan><tspan x="585.0" dy="16">riesgo</tspan></text><text x="735.0" y="601.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: la ITBL no</tspan><tspan x="735.0" dy="16">contagia</tspan></text><text x="885.0" y="609.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no hay TB activa</tspan></text><rect x="40.0" y="509.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="654.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="682.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="704.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Descartar TB activa: síntomas y Rx de tórax con protección.</tspan><tspan x="58.0" dy="18">• Isoniazida 6 meses + piridoxina a los 3 meses posparto (o rifapentina-isoniazida fuera del embarazo).</tspan><tspan x="58.0" dy="18">• Lactancia compatible.</tspan></text><text x="58.0" y="762.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, ITBL (2020; act.); MINSA Perú, NTS de tuberculosis (2023).</tspan></text></svg>