<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1076" viewBox="0 0 1000 1076" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="ERC estadio 4 con anemia normocítica y hierro normal: falta de eritropoyetina"><title>ERC estadio 4 con anemia normocítica y hierro normal: falta de eritropoyetina</title><rect x="0.75" y="0.75" width="998.5" height="1074.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Enfermedad renal crónica · anemia</tspan></text><rect x="406.5" y="32.0" width="127.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="470.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="111"><tspan x="470.2" dy="0">NEFROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Anemia de la enfermedad renal crónica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El riñón produce eritropoyetina (EPO), que ordena a la médula fabricar glóbulos rojos.</tspan><tspan x="58.0" dy="17">Con pocas nefronas hay poca EPO: anemia normocítica.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 45 años, HTA y ERC estadio 4</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Cansancio progresivo.</tspan><tspan x="640.0" dy="16">Hb 9, VCM 90; ferritina, saturación, albúmina y TSH</tspan><tspan x="640.0" dy="16">normales.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">RIÑÓN SANO FRENTE A RIÑÓN CON ERC</tspan></text><rect x="40.0" y="295.0" width="438.0" height="378.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="305.0" width="86.4" height="20.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="319.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">RIÑÓN SANO</tspan></text><g transform="translate(109.0,333.0) scale(0.95)"><path d="M50 40 C20 50 20 130 50 140 C70 146 84 120 76 90 C84 60 70 34 50 40 Z" fill="#fca5a5" stroke="#9f1239" stroke-width="2" stroke-linejoin="round" /><path d="M250 40 C280 50 280 130 250 140 C230 146 216 120 224 90 C216 60 230 34 250 40 Z" fill="#fca5a5" stroke="#9f1239" stroke-width="2" stroke-linejoin="round" /><path d="M76 96 C90 150 118 200 136 232" fill="none" stroke="#fde68a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M224 96 C210 150 182 200 164 232" fill="none" stroke="#fde68a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="150" cy="244" rx="44" ry="30" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" /><text x="150" y="250" font-size="10" font-weight="800" fill="#a16207" text-anchor="middle" data-max="0">vejiga</text><text x="10" y="16" font-size="11" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">D</text><text x="290" y="16" font-size="11" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">I</text></g><text x="54.0" y="621.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="54.0" dy="0">Muchas nefronas: produce eritropoyetina suficiente.</tspan></text><rect x="522.0" y="295.0" width="438.0" height="378.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="534.0" y="305.0" width="99.3" height="20.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1"/><text x="543.0" y="319.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="543.0" dy="0">ERC ESTADIO 4</tspan></text><rect x="844.6" y="284.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="299.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><g transform="translate(591.0,333.0) scale(0.95)"><path d="M50 57.5 C30.5 64 30.5 116 50 122.5 C63 126.4 72.1 109.5 66.9 90 C72.1 70.5 63 53.6 50 57.5 Z" fill="#fca5a5" stroke="#9f1239" stroke-width="2" stroke-linejoin="round" /><path d="M250 57.5 C269.5 64 269.5 116 250 122.5 C237 126.4 227.9 109.5 233.1 90 C227.9 70.5 237 53.6 250 57.5 Z" fill="#fca5a5" stroke="#9f1239" stroke-width="2" stroke-linejoin="round" /><path d="M67 96 C90 150 118 200 136 232" fill="none" stroke="#fde68a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M233 96 C210 150 182 200 164 232" fill="none" stroke="#fde68a" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="150" cy="244" rx="44" ry="30" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" /><text x="150" y="250" font-size="10" font-weight="800" fill="#a16207" text-anchor="middle" data-max="0">vejiga</text><text x="10" y="16" font-size="11" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">D</text><text x="290" y="16" font-size="11" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">I</text></g><text x="536.0" y="621.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="536.0" dy="0">Riñones pequeños: poca eritropoyetina, la médula fabrica menos glóbulos</tspan><tspan x="536.0" dy="16">rojos.</tspan></text><circle cx="500.0" cy="468.0" r="17" fill="#ea580c" stroke="none" stroke-width="0"/><polygon points="494.0,460.0 494.0,476.0 508.0,468.0" fill="#ffffff"/><text x="40.0" y="703.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE LLEGA</tspan></text><rect x="40.0" y="713.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="714.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="737.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Normocítica (VCM 90)</tspan></text><text x="58.0" y="758.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">No es ferropénica ni por B12.</tspan></text><rect x="351.3" y="713.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="714.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="737.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Hierro y TSH normales</tspan></text><text x="369.3" y="758.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Se descartan otras causas.</tspan></text><rect x="662.7" y="713.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="663.7" y="714.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="680.7" y="737.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Falta EPO</tspan></text><text x="680.7" y="758.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Mecanismo propio del riñón enfermo.</tspan></text><rect x="860.2" y="702.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="905.6" y="717.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="905.6" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="822.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="832.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="854.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="854.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Pérdida de proteínas</tspan></text><text x="491.2" y="854.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Hemólisis aguda</tspan></text><rect x="588.0" y="835.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="678.8" y="854.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Menos eritropoyetina</tspan></text><text x="866.2" y="854.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Hiperfosfatemia</tspan></text><rect x="40.0" y="869.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="588.0" y="869.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="890.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Explica la anemia?</tspan></text><text x="303.8" y="890.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No: albúmina normal</tspan></text><text x="491.2" y="890.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No hay datos</tspan></text><text x="678.8" y="890.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Sí</tspan></text><text x="866.2" y="890.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No</tspan></text><rect x="40.0" y="832.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="927.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="955.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="977.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Anemia normocítica + ERC avanzada + hierro normal = déficit de eritropoyetina.</tspan><tspan x="58.0" dy="18">• Tratamiento: agentes estimulantes de la eritropoyesis, con hierro si hace falta; meta Hb 10-11,5.</tspan><tspan x="58.0" dy="18">• No hay hemólisis aguda; el fósforo alto no da anemia ni hipercalcemia.</tspan></text><text x="58.0" y="1035.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: KDIGO, anemia en ERC (2012, actualización 2025).</tspan></text></svg>