<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="993" viewBox="0 0 1000 993" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Gestante de 37 semanas con 2 días de rotura de membranas, fiebre de 39 °C, taquicardia fetal, útero doloroso y líquido purulento: corioamnionitis, antibiótico y traslado al hospital"><title>Gestante de 37 semanas con 2 días de rotura de membranas, fiebre de 39 °C, taquicardia fetal, útero doloroso y líquido purulento: corioamnionitis, antibiótico y traslado al hospital</title><rect x="0.75" y="0.75" width="998.5" height="991.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Infección intraamniótica (corioamnionitis)</tspan></text><rect x="446.7" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="533.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="533.9" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="168.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Corioamnionitis</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección del líquido y las membranas, sobre todo tras RPM prolongada.</tspan><tspan x="58.0" dy="17">Fiebre materna ≥ 38 °C + uno más: taquicardia fetal &gt; 160, leucocitosis, líquido purulento o</tspan><tspan x="58.0" dy="17">fétido, útero doloroso.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="168.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="166.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Primigesta de 37 semanas, centro materno</tspan><tspan x="640.0" dy="17">infantil</tspan></text><text x="640.0" y="176.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pérdida de líquido hace 2 días.</tspan><tspan x="640.0" dy="16">T 39 °C, FC 104; LCF 190; útero doloroso; líquido</tspan><tspan x="640.0" dy="16">purulento y fétido; 0 cm.</tspan></text><rect x="640.0" y="229.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="242.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="242.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="290.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CRITERIOS DE CORIOAMNIONITIS</tspan></text><rect x="40.0" y="302.0" width="672.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="56.0" y="324.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="start" data-max="542"><tspan x="56.0" dy="0">LO QUE TIENE ELLA</tspan></text><text x="696.0" y="324.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="100"><tspan x="696.0" dy="0">EN EL CASO</tspan></text><rect x="40.0" y="336.0" width="672.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="346.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="361.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="360.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="522"><tspan x="86.0" dy="0">Fiebre materna ≥ 38 °C</tspan></text><text x="86.0" y="376.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="522"><tspan x="86.0" dy="0">39 °C</tspan></text><text x="696.0" y="360.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="696.0" dy="0">Sí</tspan></text><rect x="40.0" y="382.0" width="672.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="392.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="407.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="406.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="522"><tspan x="86.0" dy="0">Taquicardia fetal &gt; 160</tspan></text><text x="86.0" y="422.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="522"><tspan x="86.0" dy="0">LCF 190</tspan></text><text x="696.0" y="406.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="696.0" dy="0">Sí</tspan></text><rect x="40.0" y="428.0" width="672.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="438.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="453.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="452.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="522"><tspan x="86.0" dy="0">Líquido purulento o fétido</tspan></text><text x="86.0" y="468.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="522"><tspan x="86.0" dy="0">Purulento, mal olor</tspan></text><text x="696.0" y="452.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="696.0" dy="0">Sí</tspan></text><rect x="40.0" y="474.0" width="672.0" height="46.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="484.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="499.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="498.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="522"><tspan x="86.0" dy="0">Útero doloroso</tspan></text><text x="86.0" y="514.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="522"><tspan x="86.0" dy="0">Dolor a la palpación</tspan></text><text x="696.0" y="498.0" font-size="12" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="696.0" dy="0">Sí</tspan></text><rect x="40.0" y="520.0" width="672.0" height="46.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="530.0" width="20.0" height="20.0" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="64.0" y="545.0" font-size="12" font-weight="800" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">?</tspan></text><text x="86.0" y="544.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="522"><tspan x="86.0" dy="0">Leucocitosis materna</tspan></text><text x="86.0" y="560.0" font-size="10.5" font-weight="500" font-style="normal" fill="#64748b" text-anchor="start" data-max="522"><tspan x="86.0" dy="0">Por pedir</tspan></text><text x="696.0" y="544.0" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="696.0" dy="0">Sin dato</tspan></text><rect x="40.0" y="566.0" width="672.0" height="57.0" rx="0" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="56.0" y="588.0" font-size="11" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="640"><tspan x="56.0" dy="0">4 de 5 · Fiebre + 1 criterio = corioamnionitis</tspan></text><text x="56.0" y="608.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="640"><tspan x="56.0" dy="0">Corioamnionitis: ampicilina + gentamicina y traslado para terminar la gestación.</tspan></text><rect x="40.0" y="302.0" width="672.0" height="321.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="732.0" y="302.0" width="228.0" height="347.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="744.0" y="312.0" width="117.1" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="753.0" y="326.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="753.0" dy="0">GESTANTE FEBRIL</tspan></text><g data-box="746.0 340.0 200.0 270.0"><g transform="translate(756.0,340.0) scale(0.55)"><circle cx="120" cy="40" r="28" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M110 66 H130 V80 H110 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 80 H170 L176 170 H64 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M64 170 H176 L170 240 H70 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 240 H170 L164 268 H76 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 84 L50 92 L36 170 L54 174 L66 120 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M36 170 L54 174 L46 238 L28 236 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="37" cy="250" rx="10" ry="15" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M76 268 H118 L114 360 H84 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M84 360 H114 L108 418 H90 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="98" cy="426" rx="15" ry="7" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M170.0 84 L190.0 92 L204.0 170 L186.0 174 L174.0 120 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M204.0 170 L186.0 174 L194.0 238 L212.0 236 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="203.0" cy="250.0" rx="10.0" ry="15.0" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M164.0 268 H122.0 L126.0 360 H156.0 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M156.0 360 H126.0 L132.0 418 H150.0 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="142.0" cy="426.0" rx="15.0" ry="7.0" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="110" cy="36" r="3" fill="#334155" stroke="none" stroke-width="0" /><circle cx="130" cy="36" r="3" fill="#334155" stroke="none" stroke-width="0" /><path d="M112 52 Q120 57 128 52" fill="none" stroke="#9a6b52" stroke-width="1.6"/><ellipse cx="120" cy="208" rx="64" ry="54" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="120" cy="214" r="2.5" fill="#9a6b52" stroke="none" stroke-width="0" /><text x="4" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">D</text><text x="236" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">I</text></g></g><text x="746.0" y="626.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="200"><tspan x="746.0" dy="0">RPM de 2 días.</tspan></text><text x="40.0" y="689.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="699.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="738.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="730.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hospitalización y</tspan><tspan x="285.0" dy="17">uso de oxitocina</tspan></text><rect x="363.0" y="702.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="721.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Cobertura</tspan><tspan x="435.0" dy="17">antibiótica y</tspan><tspan x="435.0" dy="17">traslado a hospital</tspan></text><text x="585.0" y="721.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Corticoides y</tspan><tspan x="585.0" dy="17">esperar inicio de</tspan><tspan x="585.0" dy="17">labor de parto</tspan></text><text x="735.0" y="721.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Uso de tocolíticos y</tspan><tspan x="735.0" dy="17">maduración</tspan><tspan x="735.0" dy="17">pulmonar</tspan></text><text x="885.0" y="730.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Alta con antibiótico</tspan><tspan x="885.0" dy="17">oral</tspan></text><rect x="40.0" y="770.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="770.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="799.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Manejo?</tspan></text><text x="285.0" y="791.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Falta el antibiótico y no</tspan><tspan x="285.0" dy="16">es el nivel adecuado</tspan></text><text x="435.0" y="791.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: antibiótico +</tspan><tspan x="435.0" dy="16">referencia</tspan></text><text x="585.0" y="799.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: hay infección</tspan></text><text x="735.0" y="791.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: contraindicado con</tspan><tspan x="735.0" dy="16">infección</tspan></text><text x="885.0" y="799.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es grave</tspan></text><rect x="40.0" y="699.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="844.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="872.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="894.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Ampicilina 2 g EV c/6 h + gentamicina 5 mg/kg/día EV; antipirético.</tspan><tspan x="58.0" dy="18">• Referir al hospital para terminar la gestación (la vía la decide la obstetricia; la infección no indica cesárea por sí sola).</tspan><tspan x="58.0" dy="18">• Neonatología lista: riesgo de sepsis neonatal.</tspan></text><text x="58.0" y="952.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG n.º 712 (2017); MINSA Perú.</tspan></text></svg>