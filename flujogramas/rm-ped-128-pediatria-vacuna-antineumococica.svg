<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1152" viewBox="0 0 1000 1152" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La primera dosis de la vacuna antineumocócica se aplica a los 2 meses de edad"><title>La primera dosis de la vacuna antineumocócica se aplica a los 2 meses de edad</title><rect x="0.75" y="0.75" width="998.5" height="1150.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · vacuna antineumocócica</tspan></text><rect x="411.2" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="460.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="460.3" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="148.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Vacuna neumocócica conjugada</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Genera memoria inmunitaria T-dependiente y reduce la enfermedad invasiva y la</tspan><tspan x="58.0" dy="17">colonización.</tspan><tspan x="58.0" dy="17">Mayor carga del neumococo en menores de 2 años: neumonía, otitis, meningitis y</tspan><tspan x="58.0" dy="17">bacteriemia.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="148.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="146.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿A los cuántos meses se aplica la primera dosis de la</tspan><tspan x="640.0" dy="16">vacuna antineumocócica?</tspan></text><rect x="640.0" y="209.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="222.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="222.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="270.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DOSIS DE LA VACUNA ANTINEUMOCÓCICA SEGÚN LA EDAD</tspan></text><rect x="40.0" y="282.0" width="920.0" height="34.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="52.0" y="304.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="134"><tspan x="52.0" dy="0">DOSIS</tspan></text><text x="242.8" y="304.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="102"><tspan x="242.8" dy="0">2 meses</tspan></text><text x="348.4" y="304.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="102"><tspan x="348.4" dy="0">4 meses</tspan></text><text x="454.0" y="304.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="102"><tspan x="454.0" dy="0">6 meses</tspan></text><text x="559.6" y="304.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="102"><tspan x="559.6" dy="0">8 meses</tspan></text><text x="665.2" y="304.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="102"><tspan x="665.2" dy="0">12 meses</tspan></text><text x="734.0" y="304.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="220"><tspan x="734.0" dy="0">REGLA</tspan></text><rect x="192.0" y="318.0" width="101.6" height="176.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.6"/><rect x="40.0" y="322.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="352.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Primera dosis</tspan></text><line x1="198.0" y1="348.0" x2="710.0" y2="348.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="242.8" cy="343.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="242.8" y="347.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="242.8" dy="0">✓</tspan></text><text x="242.8" y="370.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="242.8" dy="0">Sí</tspan></text><rect x="730.0" y="322.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="344.5" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">A los 2 meses, cuando se pierde la</tspan><tspan x="740.0" dy="15">protección materna.</tspan></text><rect x="40.0" y="380.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="410.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Segunda dosis</tspan></text><line x1="198.0" y1="406.0" x2="710.0" y2="406.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="348.4" cy="401.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="348.4" y="405.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="348.4" dy="0">✓</tspan></text><text x="348.4" y="428.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="348.4" dy="0">Sí</tspan></text><rect x="730.0" y="380.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="410.0" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">A los 4 meses.</tspan></text><rect x="40.0" y="438.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="468.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Refuerzo</tspan></text><line x1="198.0" y1="464.0" x2="710.0" y2="464.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="665.2" cy="459.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="665.2" y="463.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="665.2" dy="0">✓</tspan></text><text x="665.2" y="486.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="665.2" dy="0">Sí</tspan></text><rect x="730.0" y="438.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="468.0" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">A los 12 meses.</tspan></text><rect x="205.1" y="307.0" width="75.4" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="242.8" y="322.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="242.8" dy="0">◆ 2 MESES</tspan></text><text x="44.0" y="510.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="44.0" dy="0">✓ se aplica en esa edad</tspan></text><rect x="40.0" y="534.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="560.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Primera dosis a los 2 meses</tspan></text><text x="60.0" y="579.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Esperar a los 4, 5, 6 u 8 meses deja una ventana de vulnerabilidad.</tspan></text><text x="40.0" y="640.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ESQUEMA DE LA VACUNA ANTINEUMOCÓCICA EN EL PERÚ (SEGÚN EL BANCO; NORMA MODIFICADA VARIAS VECES)</tspan></text><rect x="40.0" y="652.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="671.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Dosis</tspan></text><text x="200.0" y="671.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="369"><tspan x="200.0" dy="0">Edad</tspan></text><text x="585.0" y="671.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="369"><tspan x="585.0" dy="0">Detalle</tspan></text><rect x="40.0" y="681.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="700.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Primera</tspan></text><text x="200.0" y="700.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="200.0" dy="0">2 meses</tspan></text><text x="585.0" y="700.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="585.0" dy="0">Intramuscular, muslo, 0,5 mL</tspan></text><rect x="90.6" y="684.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="136.0" y="699.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="136.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="710.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="729.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Segunda</tspan></text><text x="200.0" y="729.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="200.0" dy="0">4 meses</tspan></text><text x="585.0" y="729.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="585.0" dy="0">Mismo sitio y volumen</tspan></text><rect x="40.0" y="739.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="758.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Refuerzo</tspan></text><text x="200.0" y="758.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="200.0" dy="0">12 meses</tspan></text><text x="585.0" y="758.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="585.0" dy="0">Niños de 12 a 23 meses sin vacunar: 2 dosis, intervalo mínimo de</tspan><tspan x="585.0" dy="15">un mes</tspan></text><text x="40.0" y="799.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Revisar el texto vigente de la NTS 196-2022 y sus modificatorias.</tspan></text><text x="40.0" y="846.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="856.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="878.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="859.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="878.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">2 meses</tspan></text><text x="435.0" y="878.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">4 meses</tspan></text><text x="585.0" y="878.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">6 meses</tspan></text><text x="735.0" y="878.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">8 meses</tspan></text><text x="885.0" y="878.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">5 meses</tspan></text><rect x="40.0" y="893.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="893.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="914.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Mes de la primera</tspan><tspan x="54.0" dy="16">dosis?</tspan></text><text x="285.0" y="914.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: primera dosis del</tspan><tspan x="285.0" dy="16">esquema</tspan></text><text x="435.0" y="914.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es la segunda</tspan><tspan x="435.0" dy="16">dosis</tspan></text><text x="585.0" y="914.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: demora la</tspan><tspan x="585.0" dy="16">primovacunación</tspan></text><text x="735.0" y="914.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: demora la</tspan><tspan x="735.0" dy="16">primovacunación</tspan></text><text x="885.0" y="914.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: demora la</tspan><tspan x="885.0" dy="16">primovacunación</tspan></text><rect x="40.0" y="856.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="967.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="995.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1017.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Esquema nacional: 2 meses, 4 meses y refuerzo a los 12 meses, por vía intramuscular en la cara anterolateral externa del muslo, 0,5 mL.</tspan><tspan x="58.0" dy="18">• Niños de 12 a 23 meses sin vacunar reciben 2 dosis con intervalo mínimo de un mes.</tspan><tspan x="58.0" dy="18">• Empezar a los 4, 5, 6 u 8 meses deja una ventana de vulnerabilidad cuando ya se pierden los anticuerpos maternos.</tspan><tspan x="58.0" dy="18">• Contraindicación: reacción alérgica grave a una dosis previa o a un componente. Dolor local, fiebre baja e irritabilidad no justifican suspender las dosis</tspan><tspan x="58.0" dy="18">   siguientes.</tspan></text><text x="58.0" y="1111.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA, NTS 196-MINSA/DGIESP-2022 (esquema nacional de vacunación, RM 884-2022/MINSA y modificatorias); AAP Red Book 2024-2027 (33.ª ed., 2024).</tspan></text></svg>