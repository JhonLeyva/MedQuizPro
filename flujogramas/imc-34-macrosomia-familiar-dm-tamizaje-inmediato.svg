ight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Primer control prenatal: ¿factores de riesgo de diabetes?</tspan></text><rect x="40.0" y="415.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">GLUCOSA AHORA</tspan></text><text x="266.5" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Ayunas o HbA1c</tspan><tspan x="266.5" dy="17">Normal: TTOG a las 24-28 sem</tspan></text><rect x="507.0" y="415.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="451.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">TTOG a las 24-28 sem</tspan></text><text x="733.5" y="474.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">75 g, 3 valores</tspan></text><text x="40.0" y="545.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SIGNOS CON NOMBRE PROPIO</tspan></text><rect x="40.0" y="557.5" width="920.0" height="225.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><line x1="62.0" y1="599.5" x2="938.0" y2="599.5" stroke="#64748b" stroke-width="2"/><line x1="62.0" y1="599.5" x2="62.0" y2="607.5" stroke="#64748b" stroke-width="2"/><line x1="938.0" y1="599.5" x2="938.0" y2="607.5" stroke="#64748b" stroke-width="2"/><rect x="358.6" y="587.5" width="282.7" height="24.0" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/><text x="500.0" y="603.5" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">FACTORES DE RIESGO (ADA) · 3 de 5 en el caso</tspan></text><rect x="56.0" y="619.5" width="168.0" height="116.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="76.0" cy="642.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="76.0" y="646.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="76.0" dy="0">1</tspan></text><text x="94.0" y="647.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="122"><tspan x="94.0" dy="0">IMC ≥ 30</tspan></text><text x="68.0" y="673.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="144"><tspan x="68.0" dy="0">34</tspan></text><rect x="68.0" y="701.5" width="144.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="140.0" y="716.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="132"><tspan x="140.0" dy="0">✓ EN EL CASO</tspan></text><rect x="236.0" y="619.5" width="168.0" height="116.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="256.0" cy="642.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="256.0" y="646.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="256.0" dy="0">2</tspan></text><text x="274.0" y="647.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="122"><tspan x="274.0" dy="0">Macrosomía previa</tspan></text><text x="248.0" y="673.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="144"><tspan x="248.0" dy="0">4700 g</tspan></text><rect x="248.0" y="701.5" width="144.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="320.0" y="716.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="132"><tspan x="320.0" dy="0">✓ EN EL CASO</tspan></text><rect x="416.0" y="619.5" width="168.0" height="116.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="436.0" cy="642.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="436.0" y="646.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="436.0" dy="0">3</tspan></text><text x="454.0" y="647.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="122"><tspan x="454.0" dy="0">Familiar de 1.er</tspan><tspan x="454.0" dy="17">grado</tspan></text><text x="428.0" y="685.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="144"><tspan x="428.0" dy="0">Hermana</tspan></text><rect x="428.0" y="701.5" width="144.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="500.0" y="716.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="132"><tspan x="500.0" dy="0">✓ EN EL CASO</tspan></text><rect x="596.0" y="619.5" width="168.0" height="116.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="616.0" cy="642.5" r="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="616.0" y="646.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="616.0" dy="0">4</tspan></text><text x="634.0" y="647.5" font-size="12.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="start" data-max="122"><tspan x="634.0" dy="0">Diabetes</tspan><tspan x="634.0" dy="17">gestacional previa</tspan></text><text x="608.0" y="685.5" font-size="11.5" font-weight="400" font-style="normal" fill="#64748b" text-anchor="start" data-max="144"><tspan x="608.0" dy="0">No se describe</tspan></text><rect x="608.0" y="701.5" width="144.0" height="22.0" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/><text x="680.0" y="716.5" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="132"><tspan x="680.0" dy="0">— NO DESCRITO</tspan></text><rect x="776.0" y="619.5" width="168.0" height="116.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="796.0" cy="642.5" r="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="796.0" y="646.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="796.0" dy="0">5</tspan></text><text x="814.0" y="647.5" font-size="12.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="start" data-max="122"><tspan x="814.0" dy="0">Ovario poliquístico</tspan></text><text x="788.0" y="673.5" font-size="11.5" font-weight="400" font-style="normal" fill="#64748b" text-anchor="start" data-max="144"><tspan x="788.0" dy="0">No se describe</tspan></text><rect x="788.0" y="701.5" width="144.0" height="22.0" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/><text x="860.0" y="716.5" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="132"><tspan x="860.0" dy="0">— NO DESCRITO</tspan></text><text x="56.0" y="762.5" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">Con uno solo ya se adelanta el tamizaje; ella tiene tres.</tspan></text><text x="40.0" y="822.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="832.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="863.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="863.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">A la semana 24</tspan></text><text x="435.0" y="855.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Durante el</tspan><tspan x="435.0" dy="17">puerperio</tspan></text><text x="585.0" y="863.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">A la semana 18</tspan></text><rect x="663.0" y="835.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="863.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Inmediatamente</tspan></text><text x="885.0" y="863.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">A la semana 32</tspan></text><rect x="40.0" y="886.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="886.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="915.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Cuándo?</tspan></text><text x="285.0" y="907.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Tarde para esta</tspan><tspan x="285.0" dy="16">paciente</tspan></text><text x="435.0" y="907.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: después del parto</tspan><tspan x="435.0" dy="16">es otro control</tspan></text><text x="585.0" y="907.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No es el momento</tspan><tspan x="585.0" dy="16">recomendado</tspan></text><text x="735.0" y="907.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: tiene factores de</tspan><tspan x="735.0" dy="16">riesgo</tspan></text><text x="885.0" y="915.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Muy tarde</tspan></text><rect x="40.0" y="832.5" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="960.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="988.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1010.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Glucosa en ayunas o HbA1c en el primer control: ≥ 126 mg/dL o HbA1c ≥ 6,5 % = diabetes previa.</tspan><tspan x="58.0" dy="18">• Ayunas 92-125 en el 1.er trimestre: manejar como diabetes gestacional (según criterio local).</tspan><tspan x="58.0" dy="18">• Normal: TTOG de 75 g a las 24-28 semanas; aspirina 150 mg si hay otros riesgos de preeclampsia.</tspan></text><text x="58.0" y="1068.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ADA Standards of Care in Diabetes 2026, sección 15; ACOG, diabetes gestacional (2018, act. 2024).</tspan></text></svg>