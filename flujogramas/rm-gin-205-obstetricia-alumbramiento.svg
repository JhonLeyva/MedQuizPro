<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="935" viewBox="0 0 1000 935" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En el alumbramiento activo el uterotónico de elección es la oxitocina"><title>En el alumbramiento activo el uterotónico de elección es la oxitocina</title><rect x="0.75" y="0.75" width="998.5" height="933.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · alumbramiento</tspan></text><rect x="365.4" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="445.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="445.2" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Alumbramiento</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tercer período del parto: desde la salida del feto hasta la expulsión de la placenta y las</tspan><tspan x="58.0" dy="17">membranas.</tspan><tspan x="58.0" dy="17">Puede ser espontáneo o activo.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de fármacos</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál de los fármacos puede usarse como uterotónico</tspan><tspan x="640.0" dy="16">en el alumbramiento?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ORDEN DEL MANEJO ACTIVO DEL ALUMBRAMIENTO</tspan></text><text x="44.0" y="283.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Cada paso se hace en secuencia, desde la salida del recién nacido.</tspan></text><line x1="155.0" y1="322.0" x2="293.0" y2="322.0" stroke="#99f6e4" stroke-width="6"/><line x1="339.0" y1="322.0" x2="477.0" y2="322.0" stroke="#99f6e4" stroke-width="6"/><line x1="523.0" y1="322.0" x2="661.0" y2="322.0" stroke="#99f6e4" stroke-width="6"/><line x1="707.0" y1="322.0" x2="845.0" y2="322.0" stroke="#99f6e4" stroke-width="6"/><circle cx="132.0" cy="322.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="132.0" y="326.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="132.0" dy="0">1</tspan></text><rect x="45.0" y="356.0" width="174.0" height="93.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="132.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">Salida del hombro</tspan><tspan x="132.0" dy="17">anterior o del recién</tspan><tspan x="132.0" dy="17">nacido</tspan></text><text x="132.0" y="427.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">Momento de dar el uterotónico</tspan></text><circle cx="316.0" cy="322.0" r="22" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><text x="316.0" y="326.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="38"><tspan x="316.0" dy="0">2</tspan></text><rect x="229.0" y="356.0" width="174.0" height="93.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="316.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">Oxitocina 10 UI IM o IV</tspan></text><text x="316.0" y="393.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">Fármaco de elección;</tspan><tspan x="316.0" dy="16">alternativas: carbetocina,</tspan><tspan x="316.0" dy="16">ergometrina o misoprostol</tspan></text><rect x="271.9" y="438.0" width="88.2" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="316.0" y="453.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="316.0" dy="0">◆ OXITOCINA</tspan></text><circle cx="500.0" cy="322.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="326.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="500.0" dy="0">3</tspan></text><rect x="413.0" y="356.0" width="174.0" height="93.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">Pinzamiento del cordón a</tspan><tspan x="500.0" dy="17">los 30 a 60 segundos</tspan></text><text x="500.0" y="410.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">Si el recién nacido está</tspan><tspan x="500.0" dy="16">vigoroso</tspan></text><circle cx="684.0" cy="322.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="684.0" y="326.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="684.0" dy="0">4</tspan></text><rect x="597.0" y="356.0" width="174.0" height="93.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="684.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">Tracción controlada del</tspan><tspan x="684.0" dy="17">cordón y masaje uterino</tspan></text><text x="684.0" y="410.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">Acorta el período y reduce el</tspan><tspan x="684.0" dy="16">sangrado</tspan></text><circle cx="868.0" cy="322.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="868.0" y="326.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="868.0" dy="0">5</tspan></text><rect x="781.0" y="356.0" width="174.0" height="93.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="868.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">Placenta retenida más de</tspan><tspan x="868.0" dy="17">30 minutos</tspan></text><text x="868.0" y="410.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">Extracción manual</tspan></text><rect x="40.0" y="481.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="507.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Uterotónico del alumbramiento = oxitocina</tspan></text><text x="60.0" y="526.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Terbutalina y atosibán relajan el útero; progesterona y levonorgestrel no contraen.</tspan></text><text x="40.0" y="593.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="603.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="625.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="625.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Terbutalina</tspan></text><text x="435.0" y="625.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Atosibán</tspan></text><text x="585.0" y="625.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Progesterona</tspan></text><rect x="663.0" y="606.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="625.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Oxitocina</tspan></text><text x="885.0" y="625.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Levonorgestrel</tspan></text><rect x="40.0" y="640.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="640.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="669.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Uterotónico?</tspan></text><text x="285.0" y="661.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: tocolítico que</tspan><tspan x="285.0" dy="16">relaja el útero</tspan></text><text x="435.0" y="661.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: tocolítico que</tspan><tspan x="435.0" dy="16">relaja el útero</tspan></text><text x="585.0" y="661.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: mantiene la</tspan><tspan x="585.0" dy="16">quiescencia uterina</tspan></text><text x="735.0" y="661.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: uterotónico de</tspan><tspan x="735.0" dy="16">elección</tspan></text><text x="885.0" y="661.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es anticonceptivo,</tspan><tspan x="885.0" dy="16">sin efecto uterotónico</tspan></text><rect x="40.0" y="603.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="714.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="742.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="764.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El manejo activo (fármaco más tracción controlada del cordón) acorta el período y reduce la hemorragia posparto cerca de 40 %; se recomienda en todos</tspan><tspan x="58.0" dy="18">   los partos.</tspan><tspan x="58.0" dy="18">• Elección: oxitocina 10 UI IM o IV en infusión, al salir el hombro anterior o el recién nacido. Alternativas: ergometrina (no en hipertensas), carbetocina y</tspan><tspan x="58.0" dy="18">   misoprostol.</tspan><tspan x="58.0" dy="18">• Terbutalina y atosibán son tocolíticos que relajan el útero; progesterona y levonorgestrel no tienen efecto uterotónico.</tspan><tspan x="58.0" dy="18">• Pinzar el cordón a los 30 a 60 segundos si el recién nacido está vigoroso. Alerta: placenta retenida más de 30 minutos tras el manejo activo, extracción</tspan><tspan x="58.0" dy="18">   manual.</tspan></text><text x="58.0" y="894.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, Recomendaciones para la prevención y el tratamiento de la hemorragia posparto (2012); ACOG, Practice Bulletin 183 (2017); Williams Obstetricia, 26.ª ed. (2022).</tspan></text></svg>