<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1269" viewBox="0 0 1000 1269" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Anciano con dolor hipogástrico, globo vesical, creatinina 2,8 y potasio 6: retención urinaria con falla renal posrenal, sondaje vesical inmediato"><title>Anciano con dolor hipogástrico, globo vesical, creatinina 2,8 y potasio 6: retención urinaria con falla renal posrenal, sondaje vesical inmediato</title><rect x="0.75" y="0.75" width="998.5" height="1268.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Uropatía obstructiva · retención urinaria</tspan></text><rect x="436.5" y="32.0" width="127.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="111"><tspan x="500.2" dy="0">NEFROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Retención urinaria con falla renal posrenal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La vejiga no se vacía (casi siempre por próstata) y la presión sube hasta los riñones.</tspan><tspan x="58.0" dy="17">Globo vesical palpable; creatinina y potasio suben; se corrige al drenar.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 78 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dolor en hipogastrio que aumenta en los últimos días.</tspan><tspan x="640.0" dy="16">Masa redondeada y tensa bajo el ombligo; creatinina</tspan><tspan x="640.0" dy="16">2,8, K 6.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="395.0" x2="733.5" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="395.0" x2="266.5" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,423.0 271.5,423.0 266.5,431.0" fill="#94a3b8"/><line x1="733.5" y1="395.0" x2="733.5" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,423.0 738.5,423.0 733.5,431.0" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#0f766e"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="395.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="395.0" x2="266.5" y2="424.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,423.0 271.5,423.0 266.5,431.0" fill="#0f766e"/><rect x="225.0" y="404.0" width="83.0" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Sí (este caso)</tspan></text><rect x="702.1" y="404.0" width="62.7" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Sin globo</tspan></text><polygon points="240.0,336.0 266.0,307.0 734.0,307.0 760.0,336.0 734.0,365.0 266.0,365.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="336.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="341.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="340.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Falla renal con globo vesical: ¿obstrucción baja?</tspan></text><rect x="40.0" y="431.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">SONDA VESICAL</tspan></text><text x="266.5" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Vaciar</tspan><tspan x="266.5" dy="17">Vigilar poliuria</tspan></text><rect x="507.0" y="431.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="467.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Eco renal</tspan></text><text x="733.5" y="490.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Hidronefrosis alta</tspan></text><text x="40.0" y="561.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="573.5" width="920.0" height="369.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="587.5" width="281.7" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="196.8" y="607.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="196.8" dy="0">GRAVEDAD DE LA HIPERPOTASEMIA</tspan></text><text x="353.7" y="607.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="588"><tspan x="353.7" dy="0">UK Kidney Association 2023: por el nivel de K⁺ y por los cambios en el ECG.</tspan></text><rect x="56.0" y="647.5" width="288.0" height="144.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="648.1" width="286.8" height="63.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="200.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="272"><tspan x="200.0" dy="0">K⁺ 5,5-5,9</tspan></text><text x="200.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="264"><tspan x="200.0" dy="0">Leve</tspan></text><circle cx="72.0" cy="720.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="724.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="82.0" dy="0">Sin cambios en el ECG</tspan></text><circle cx="72.0" cy="743.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="747.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="82.0" dy="0">Corregir la causa</tspan></text><rect x="356.0" y="647.5" width="288.0" height="144.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="357.2" y="648.7" width="285.6" height="63.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="500.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="272"><tspan x="500.0" dy="0">K⁺ 6,0-6,4</tspan></text><text x="500.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="264"><tspan x="500.0" dy="0">Moderada</tspan></text><circle cx="372.0" cy="720.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="382.0" y="724.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="250"><tspan x="382.0" dy="0">Insulina + glucosa</tspan></text><circle cx="372.0" cy="743.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="382.0" y="747.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="250"><tspan x="382.0" dy="0">Monitoreo cardiaco</tspan></text><rect x="454.6" y="636.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="500.0" y="651.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">◆ ESTE CASO</tspan></text><rect x="656.0" y="647.5" width="288.0" height="144.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="656.6" y="648.1" width="286.8" height="63.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="800.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="272"><tspan x="800.0" dy="0">K⁺ ≥ 6,5 O ECG ALTERADO</tspan></text><text x="800.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="264"><tspan x="800.0" dy="0">Grave</tspan></text><circle cx="672.0" cy="720.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="682.0" y="724.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="682.0" dy="0">Gluconato de calcio EV ya</tspan></text><circle cx="672.0" cy="743.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="682.0" y="747.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="682.0" dy="0">Insulina + glucosa, salbutamol</tspan></text><circle cx="672.0" cy="766.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="682.0" y="770.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="682.0" dy="0">Valorar diálisis</tspan></text><text x="56.0" y="821.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="830.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="845.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="845.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">K⁺ 6 mEq/L</tspan></text><rect x="56.0" y="852.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="867.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="867.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Falta el ECG</tspan></text><rect x="56.0" y="889.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="912.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Sonda vesical, ECG y monitoreo; insulina + glucosa si sigue alto.</tspan></text><text x="40.0" y="982.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="992.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1023.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="995.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="1015.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Cateterización</tspan><tspan x="285.0" dy="17">vesical</tspan></text><text x="435.0" y="1023.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">TC abdominal</tspan></text><text x="585.0" y="1023.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Cistoscopia</tspan></text><text x="735.0" y="1023.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hemodiálisis</tspan></text><text x="885.0" y="1015.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Furosemida</tspan><tspan x="885.0" dy="17">endovenosa</tspan></text><rect x="40.0" y="1046.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1046.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1075.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Conducta inmediata?</tspan></text><text x="285.0" y="1067.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: drena y corrige la</tspan><tspan x="285.0" dy="16">falla</tspan></text><text x="435.0" y="1067.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: primero</tspan><tspan x="435.0" dy="16">descomprimir</tspan></text><text x="585.0" y="1067.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Después, para la</tspan><tspan x="585.0" dy="16">causa</tspan></text><text x="735.0" y="1067.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: se corrige al</tspan><tspan x="735.0" dy="16">drenar</tspan></text><text x="885.0" y="1067.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: la vejiga está</tspan><tspan x="885.0" dy="16">obstruida</tspan></text><rect x="40.0" y="992.5" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1120.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1148.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1170.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Sonda vesical (Foley) de inmediato; si no pasa, cistostomía suprapúbica.</tspan><tspan x="58.0" dy="18">• Vigilar la poliuria posobstructiva (reponer líquidos) y el potasio.</tspan><tspan x="58.0" dy="18">• Luego: alfabloqueador y estudio de la próstata.</tspan></text><text x="58.0" y="1228.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: EAU, síntomas urinarios bajos en el varón (2024); KDIGO, lesión renal aguda.</tspan></text></svg>