<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1111" viewBox="0 0 1000 1111" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Preescolar del campo con sialorrea, vómitos, bradicardia, miosis, confusión y fasciculaciones: atropina"><title>Preescolar del campo con sialorrea, vómitos, bradicardia, miosis, confusión y fasciculaciones: atropina</title><rect x="0.75" y="0.75" width="998.5" height="1109.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Intoxicaciones en pediatría · organofosforados</tspan></text><rect x="476.2" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="532.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="532.6" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Intoxicación por organofosforados</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Exceso de acetilcolina: secreciones, bradicardia, miosis, fasciculaciones y confusión.</tspan><tspan x="58.0" dy="17">Mata por falla respiratoria (broncorrea, broncoespasmo y debilidad muscular).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Preescolar de 3 años del campo</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Compromiso de conciencia, sialorrea y vómitos.</tspan><tspan x="640.0" dy="16">FC 60, FR 15, miosis, fasciculaciones, confusión e</tspan><tspan x="640.0" dy="16">irritabilidad.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="395.0" x2="500.0" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,423.0 505.0,423.0 500.0,431.0" fill="#94a3b8"/><line x1="500.0" y1="521.5" x2="500.0" y2="551.5" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="551.5" x2="500.0" y2="580.5" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,579.5 505.0,579.5 500.0,587.5" fill="#94a3b8"/><line x1="500.0" y1="645.5" x2="500.0" y2="675.5" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="675.5" x2="733.5" y2="675.5" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="675.5" x2="266.5" y2="704.5" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,703.5 271.5,703.5 266.5,711.5" fill="#94a3b8"/><line x1="733.5" y1="675.5" x2="733.5" y2="704.5" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,703.5 738.5,703.5 733.5,711.5" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#0f766e"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="395.0" x2="500.0" y2="424.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,423.0 505.0,423.0 500.0,431.0" fill="#0f766e"/><rect x="434.1" y="404.0" width="131.7" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="500.0" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">Colinérgico (este caso)</tspan></text><rect x="254.4" y="684.5" width="24.1" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="266.5" y="697.0" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Sí</tspan></text><rect x="719.4" y="684.5" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="697.0" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">No</tspan></text><polygon points="240.0,336.0 266.0,307.0 734.0,307.0 760.0,336.0 734.0,365.0 266.0,365.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="336.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="341.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="340.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Niño con secreciones, bradicardia, miosis y fasciculaciones</tspan></text><rect x="240.0" y="431.0" width="520.0" height="90.5" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><text x="500.0" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="492"><tspan x="500.0" dy="0">ATROPINA EV</tspan></text><text x="500.0" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="492"><tspan x="500.0" dy="0">Duplicar cada 5 min</tspan><tspan x="500.0" dy="17">+ pralidoxima</tspan></text><rect x="240.0" y="431.0" width="520.0" height="90.5" rx="10" fill="none" stroke="#0f766e" stroke-width="2.2"/><polygon points="240.0,616.5 266.0,587.5 734.0,587.5 760.0,616.5 734.0,645.5 266.0,645.5" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><circle cx="286.0" cy="616.5" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="621.5" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="621.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">¿Atropinizado: bronquios secos, FC &gt; 80?</tspan></text><rect x="40.0" y="711.5" width="453.0" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="266.5" y="739.8" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Infusión de mantenimiento</tspan></text><text x="266.5" y="762.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Vigilar 24-48 h</tspan></text><rect x="507.0" y="711.5" width="453.0" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="739.8" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Seguir duplicando la dosis</tspan></text><text x="733.5" y="762.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Oxígeno, aspirar</tspan></text><text x="40.0" y="824.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="834.9" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="857.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="837.9" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="857.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Atropina</tspan></text><text x="435.0" y="857.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Adrenalina</tspan></text><text x="585.0" y="857.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Dexametasona</tspan></text><text x="735.0" y="857.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Lidocaína</tspan></text><text x="885.0" y="857.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Naloxona</tspan></text><rect x="40.0" y="871.9" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="871.9" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="908.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Indicado?</tspan></text><text x="285.0" y="892.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: bloquea la</tspan><tspan x="285.0" dy="16">acetilcolina</tspan><tspan x="285.0" dy="16">muscarínica</tspan></text><text x="435.0" y="908.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es para anafilaxia</tspan></text><text x="585.0" y="908.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sin papel</tspan></text><text x="735.0" y="908.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es antiarrítmico</tspan></text><text x="885.0" y="908.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es para opioides</tspan></text><rect x="40.0" y="834.9" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="961.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="989.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1011.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Atropina EV 0,02-0,05 mg/kg, duplicar cada 5 min hasta la atropinización (bronquios secos, FC &gt; 80, PA normal).</tspan><tspan x="58.0" dy="18">• Pralidoxima por las fasciculaciones; oxígeno, aspirar secreciones, intubar si hace falta.</tspan><tspan x="58.0" dy="18">• Descontaminar la piel y la ropa; el personal se protege.</tspan></text><text x="58.0" y="1069.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, manejo de intoxicaciones por plaguicidas; Goldfrank's Toxicologic Emergencies 11.ª ed. (2019); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>