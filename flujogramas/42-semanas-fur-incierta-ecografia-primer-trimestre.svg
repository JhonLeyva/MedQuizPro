<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1028" viewBox="0 0 1000 1028" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Gestante «de 42 semanas» que no recuerda bien su FUR: la edad gestacional se confirma con la ecografía del primer trimestre"><title>Gestante «de 42 semanas» que no recuerda bien su FUR: la edad gestacional se confirma con la ecografía del primer trimestre</title><rect x="0.75" y="0.75" width="998.5" height="1026.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Datación del embarazo · embarazo prolongado</tspan></text><rect x="475.5" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="562.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="562.7" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cómo se fecha un embarazo</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La ecografía del primer trimestre (longitud cráneo-caudal) es el método más exacto (± 5-7</tspan><tspan x="58.0" dy="17">días).</tspan><tspan x="58.0" dy="17">Las ecografías tardías tienen más error (± 2-3 semanas al final) y no sirven para corregir la</tspan><tspan x="58.0" dy="17">fecha.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante referida «de 42 semanas»</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">No recuerda bien su FUR.</tspan><tspan x="640.0" dy="16">¿Qué debe evaluar el especialista antes de</tspan><tspan x="640.0" dy="16">hospitalizarla?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">MÉTODOS PARA SABER LA EDAD GESTACIONAL (DEL MÁS EXACTO AL MENOS)</tspan></text><polygon points="190.0,285.0 290.0,285.0 320.0,341.0 160.0,341.0" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="240.0" y="318.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="88"><tspan x="240.0" dy="0">1</tspan></text><rect x="466.0" y="285.0" width="494.0" height="56.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="481.0" y="309.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">Eco del 1.er trimestre</tspan></text><text x="481.0" y="326.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">Longitud cráneo-caudal: ± 5-7 días.</tspan></text><rect x="858.2" y="274.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="903.6" y="289.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="903.6" dy="0">◆ ESTE CASO</tspan></text><polygon points="160.0,347.0 320.0,347.0 350.0,403.0 130.0,403.0" fill="#99f6e4" stroke="#ffffff" stroke-width="2"/><text x="240.0" y="380.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="148"><tspan x="240.0" dy="0">2</tspan></text><rect x="466.0" y="347.0" width="494.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="481.0" y="371.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">FUR segura y ciclos regulares</tspan></text><text x="481.0" y="388.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">Útil si coincide con la eco.</tspan></text><polygon points="130.0,409.0 350.0,409.0 380.0,465.0 100.0,465.0" fill="#5eead4" stroke="#ffffff" stroke-width="2"/><text x="240.0" y="442.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="208"><tspan x="240.0" dy="0">3</tspan></text><rect x="466.0" y="409.0" width="494.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="481.0" y="433.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">Eco del 2.º trimestre</tspan></text><text x="481.0" y="450.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">± 10-14 días.</tspan></text><polygon points="100.0,471.0 380.0,471.0 410.0,527.0 70.0,527.0" fill="#2dd4bf" stroke="#ffffff" stroke-width="2"/><text x="240.0" y="504.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="268"><tspan x="240.0" dy="0">4</tspan></text><rect x="466.0" y="471.0" width="494.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="481.0" y="495.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">Eco del 3.er trimestre</tspan></text><text x="481.0" y="512.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">± 2-3 semanas: no sirve para fechar.</tspan></text><polygon points="70.0,533.0 410.0,533.0 440.0,589.0 40.0,589.0" fill="#14b8a6" stroke="#ffffff" stroke-width="2"/><text x="240.0" y="566.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="328"><tspan x="240.0" dy="0">5</tspan></text><rect x="466.0" y="533.0" width="494.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="481.0" y="557.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">Altura uterina</tspan></text><text x="481.0" y="574.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">Orienta, no fecha.</tspan></text><text x="240.0" y="607.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="400"><tspan x="240.0" dy="0">Arriba el más exacto</tspan></text><rect x="40.0" y="629.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="655.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">FUR incierta: manda la eco del primer trimestre</tspan></text><text x="60.0" y="674.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Con ella se confirma si de verdad tiene 42 semanas.</tspan></text><text x="40.0" y="741.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="751.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="782.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="782.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">El perfil biofísico</tspan></text><text x="435.0" y="773.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Una ecografía</tspan><tspan x="435.0" dy="17">actualizada</tspan></text><text x="585.0" y="773.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Un test no</tspan><tspan x="585.0" dy="17">estresante</tspan></text><rect x="663.0" y="754.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="773.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">La ecografía del</tspan><tspan x="735.0" dy="17">primer trimestre</tspan></text><text x="885.0" y="773.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">La altura uterina</tspan><tspan x="885.0" dy="17">actual</tspan></text><rect x="40.0" y="805.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="805.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="834.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué evaluar?</tspan></text><text x="285.0" y="826.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: bienestar, no la</tspan><tspan x="285.0" dy="16">edad</tspan></text><text x="435.0" y="826.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: tardía, error de</tspan><tspan x="435.0" dy="16">semanas</tspan></text><text x="585.0" y="826.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: bienestar, no la</tspan><tspan x="585.0" dy="16">edad</tspan></text><text x="735.0" y="834.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: la más exacta</tspan></text><text x="885.0" y="834.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: muy inexacta</tspan></text><rect x="40.0" y="751.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="879.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="907.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="929.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Si la FUR y la eco del 1.er trimestre difieren &gt; 7 días, manda la eco.</tspan><tspan x="58.0" dy="18">• Embarazo prolongado confirmado (≥ 42 sem): terminar la gestación; desde las 41 sem se ofrece inducción.</tspan><tspan x="58.0" dy="18">• Sin eco temprana, la edad es incierta: vigilar bienestar fetal y decidir con el especialista.</tspan></text><text x="58.0" y="987.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG n.º 700 (2017; datación); ISUOG (2013).</tspan></text></svg>