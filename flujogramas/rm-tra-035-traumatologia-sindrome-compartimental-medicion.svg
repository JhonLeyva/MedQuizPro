<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1055" viewBox="0 0 1000 1055" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La presión intracompartimental se mide con el dispositivo portátil de Stryker; el pulso presente no excluye el síndrome"><title>La presión intracompartimental se mide con el dispositivo portátil de Stryker; el pulso presente no excluye el síndrome</title><rect x="0.75" y="0.75" width="998.5" height="1053.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Traumatología · síndrome compartimental, medición</tspan></text><rect x="508.3" y="32.0" width="135.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="576.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="119"><tspan x="576.0" dy="0">TRAUMATOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Medición de la presión</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se mide cuando el examen no es fiable (paciente inconsciente, sedado o con bloqueo</tspan><tspan x="58.0" dy="17">regional) o la clínica es dudosa.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Duda en el antebrazo</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Sospecha de síndrome compartimental en el miembro</tspan><tspan x="640.0" dy="16">superior.</tspan><tspan x="640.0" dy="16">¿Qué método se usa más?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SIRVE PARA MEDIR LA PRESIÓN DEL COMPARTIMENTO</tspan></text><rect x="493.0" y="335.0" width="14" height="190" rx="5" fill="#64748b"/><path d="M440.0 540.0 H560.0 L540.0 520.0 H460.0 Z" fill="#475569"/><circle cx="500.0" cy="335.0" r="15" fill="#f59e0b" stroke="#92400e" stroke-width="2"/><line x1="385.4" y1="353.1" x2="614.6" y2="316.9" stroke="#334155" stroke-width="7" stroke-linecap="round"/><line x1="385.4" y1="353.1" x2="357.4" y2="415.1" stroke="#64748b" stroke-width="2"/><line x1="385.4" y1="353.1" x2="413.4" y2="415.1" stroke="#64748b" stroke-width="2"/><path d="M347.4 415.1 H423.4 Q385.4 459.1 347.4 415.1 Z" fill="#ea580c"/><text x="385.4" y="430.1" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="385.4" dy="0">MIDE</tspan></text><line x1="614.6" y1="316.9" x2="586.6" y2="378.9" stroke="#64748b" stroke-width="2"/><line x1="614.6" y1="316.9" x2="642.6" y2="378.9" stroke="#64748b" stroke-width="2"/><path d="M576.6 378.9 H652.6 Q614.6 422.9 576.6 378.9 Z" fill="#64748b"/><text x="614.6" y="393.9" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="614.6" dy="0">NO MIDE</tspan></text><text x="500.0" y="567.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="300"><tspan x="500.0" dy="0">¿Qué método mide la presión?</tspan></text><rect x="40.0" y="305.0" width="290.0" height="174.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><text x="58.0" y="333.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="254"><tspan x="58.0" dy="0">Medición directa</tspan></text><circle cx="62.0" cy="358.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="362.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Dispositivo portátil de Stryker (el más usado)</tspan></text><circle cx="62.0" cy="384.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="388.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Catéter con mecha o de hendidura</tspan></text><circle cx="62.0" cy="410.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="414.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Presión de 30 mmHg o más es diagnóstica</tspan></text><circle cx="62.0" cy="436.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="440.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Presión diferencial de 30 mmHg o menos</tspan><tspan x="74.0" dy="16">también</tspan></text><rect x="214.6" y="294.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="260.0" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="260.0" dy="0">◆ ESTE CASO</tspan></text><rect x="670.0" y="305.0" width="290.0" height="158.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="688.0" y="333.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="688.0" dy="0">Indirectos o no diagnósticos</tspan></text><circle cx="692.0" cy="358.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="362.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Pulsos arteriales distales: se conservan</tspan></text><circle cx="692.0" cy="384.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="388.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Ecodoppler seriado: valora flujo arterial</tspan></text><circle cx="692.0" cy="410.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="414.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Espectroscopía: oxigenación del tejido</tspan></text><circle cx="692.0" cy="436.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="440.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Ninguno mide la presión del compartimento</tspan></text><rect x="40.0" y="601.0" width="920.0" height="93.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="629.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Stryker = método directo más usado</tspan></text><text x="500.0" y="650.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Los pulsos distales casi nunca desaparecen porque la presión compartimental rara vez supera la arterial.</tspan><tspan x="500.0" dy="17">El ecodoppler y la espectroscopía no sustituyen la medición directa.</tspan></text><text x="40.0" y="734.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="744.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="775.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="766.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Monitoreo de</tspan><tspan x="285.0" dy="17">pulsos distales</tspan></text><rect x="363.0" y="747.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="775.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Método de Stryker</tspan></text><text x="585.0" y="775.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Ecodoppler seriado</tspan></text><text x="735.0" y="766.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Catéter con mecha</tspan><tspan x="735.0" dy="17">o de hendidura</tspan></text><text x="885.0" y="775.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Espectroscopía</tspan></text><rect x="40.0" y="798.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="798.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="835.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Método más utilizado?</tspan></text><text x="285.0" y="827.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: los pulsos suelen</tspan><tspan x="285.0" dy="16">estar conservados</tspan></text><text x="435.0" y="827.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: método directo</tspan><tspan x="435.0" dy="16">portátil más difundido</tspan></text><text x="585.0" y="827.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no mide la presión</tspan><tspan x="585.0" dy="16">del compartimento</tspan></text><text x="735.0" y="827.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: técnica directa,</tspan><tspan x="735.0" dy="16">menos usada</tspan></text><text x="885.0" y="819.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no es una</tspan><tspan x="885.0" dy="16">medición directa de la</tspan><tspan x="885.0" dy="16">presión</tspan></text><rect x="40.0" y="744.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="888.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="916.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="938.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El diagnóstico es clínico: dolor desproporcionado, dolor con el estiramiento pasivo y tensión del compartimento.</tspan><tspan x="58.0" dy="18">• Presión directa con el dispositivo de Stryker (aguja con cámara y manómetro); el catéter con mecha o de hendidura es otra técnica directa, menos usada.</tspan><tspan x="58.0" dy="18">• Es diagnóstico una presión absoluta de 30 mmHg o más, o una presión diferencial (diastólica menos compartimental) de 30 mmHg o menos.</tspan><tspan x="58.0" dy="18">• Alerta: los pulsos distales suelen conservarse; su presencia no descarta el cuadro.</tspan></text><text x="58.0" y="1014.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: JBJS Essent Surg Tech 2015 (PMID 30473914); Schmidt AH, J Am Acad Orthop Surg 2020 (PMID 31977609); Rockwood and Green's Fractures in Adults, 9.ª ed. (2019).</tspan></text></svg>