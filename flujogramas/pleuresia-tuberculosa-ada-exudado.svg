<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1286" viewBox="0 0 1000 1286" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Exudado pleural linfocítico con ADA de 55 U/L en un joven con tos de 2 meses: tuberculosis pleural"><title>Exudado pleural linfocítico con ADA de 55 U/L en un joven con tos de 2 meses: tuberculosis pleural</title><rect x="0.75" y="0.75" width="998.5" height="1284.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Tuberculosis extrapulmonar · derrame pleural</tspan></text><rect x="469.8" y="32.0" width="129.8" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="534.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="114"><tspan x="534.7" dy="0">NEUMOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tuberculosis pleural</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Reacción de hipersensibilidad a pocos bacilos en la pleura: exudado con linfocitos.</tspan><tspan x="58.0" dy="17">En el Perú es la primera causa de derrame pleural en jóvenes.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 23 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">2 meses de tos seca; Rx con borramiento del seno</tspan><tspan x="640.0" dy="16">costofrénico derecho.</tspan><tspan x="640.0" dy="16">Líquido: LDH pleural/sérica &gt; 0,6, proteínas</tspan><tspan x="640.0" dy="16">pleural/sérica &gt; 0,5, linfocitos, ADA 55 U/L.</tspan></text><line x1="640.0" y1="237.0" x2="670.0" y2="237.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="287.0" x2="577.8" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="577.8" y1="287.0" x2="577.8" y2="316.0" stroke="#94a3b8" stroke-width="2"/><polygon points="572.8,315.0 582.8,315.0 577.8,323.0" fill="#94a3b8"/><line x1="577.8" y1="381.0" x2="577.8" y2="411.0" stroke="#94a3b8" stroke-width="2"/><line x1="344.3" y1="411.0" x2="811.3" y2="411.0" stroke="#94a3b8" stroke-width="2"/><line x1="344.3" y1="411.0" x2="344.3" y2="440.0" stroke="#94a3b8" stroke-width="2"/><polygon points="339.3,439.0 349.3,439.0 344.3,447.0" fill="#94a3b8"/><line x1="811.3" y1="411.0" x2="811.3" y2="440.0" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,439.0 816.3,439.0 811.3,447.0" fill="#94a3b8"/><line x1="344.3" y1="505.0" x2="344.3" y2="550.5" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="550.5" x2="500.0" y2="550.5" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="550.5" x2="188.7" y2="579.5" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,578.5 193.7,578.5 188.7,586.5" fill="#94a3b8"/><line x1="500.0" y1="550.5" x2="500.0" y2="579.5" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,578.5 505.0,578.5 500.0,586.5" fill="#94a3b8"/><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="287.0" x2="577.8" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="577.8" y1="287.0" x2="577.8" y2="316.0" stroke="#0f766e" stroke-width="3"/><polygon points="572.8,315.0 582.8,315.0 577.8,323.0" fill="#0f766e"/><line x1="577.8" y1="381.0" x2="577.8" y2="411.0" stroke="#0f766e" stroke-width="3"/><line x1="344.3" y1="411.0" x2="577.8" y2="411.0" stroke="#0f766e" stroke-width="3"/><line x1="344.3" y1="411.0" x2="344.3" y2="440.0" stroke="#0f766e" stroke-width="3"/><polygon points="339.3,439.0 349.3,439.0 344.3,447.0" fill="#0f766e"/><line x1="344.3" y1="505.0" x2="344.3" y2="550.5" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="550.5" x2="344.3" y2="550.5" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="550.5" x2="188.7" y2="579.5" stroke="#0f766e" stroke-width="3"/><polygon points="183.7,578.5 193.7,578.5 188.7,586.5" fill="#0f766e"/><rect x="307.0" y="420.0" width="74.6" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="344.3" y="432.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="344.3" dy="0">Sí: exudado</tspan></text><rect x="797.2" y="420.0" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="811.3" y="432.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">No</tspan></text><rect x="125.3" y="559.5" width="126.8" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="188.7" y="572.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">Sí: ADA 55 (este caso)</tspan></text><rect x="464.8" y="559.5" width="70.5" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="500.0" y="572.0" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">Neutrófilos</tspan></text><polygon points="317.8,352.0 343.8,323.0 811.8,323.0 837.8,352.0 811.8,381.0 343.8,381.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="363.8" cy="352.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="363.8" y="357.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="363.8" dy="0">?</tspan></text><text x="596.8" y="356.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="596.8" dy="0">Derrame pleural: ¿cumple algún criterio de Light?</tspan></text><polygon points="84.3,476.0 110.3,447.0 578.3,447.0 604.3,476.0 578.3,505.0 110.3,505.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="130.3" cy="476.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="130.3" y="481.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="130.3" dy="0">?</tspan></text><text x="363.3" y="480.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="363.3" dy="0">¿Predominan los linfocitos y el ADA es &gt; 40 U/L?</tspan></text><rect x="40.0" y="586.5" width="297.3" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="188.7" y="614.8" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">TUBERCULOSIS PLEURAL</tspan></text><text x="188.7" y="637.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">2HRZE/4HR</tspan><tspan x="188.7" dy="17">Biopsia si hay duda</tspan></text><rect x="351.3" y="586.5" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="623.3" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Paraneumónico</tspan></text><text x="500.0" y="646.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">pH y glucosa: ¿drenar?</tspan></text><rect x="662.7" y="447.0" width="297.3" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="475.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Trasudado</tspan></text><text x="811.3" y="498.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Falla cardiaca, cirrosis, nefrótico</tspan></text><text x="40.0" y="716.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CRITERIOS CON NOMBRE PROPIO</tspan></text><rect x="40.0" y="728.9" width="920.0" height="213.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><line x1="62.0" y1="770.9" x2="938.0" y2="770.9" stroke="#64748b" stroke-width="2"/><line x1="62.0" y1="770.9" x2="62.0" y2="778.9" stroke="#64748b" stroke-width="2"/><line x1="938.0" y1="770.9" x2="938.0" y2="778.9" stroke="#64748b" stroke-width="2"/><rect x="317.8" y="758.9" width="364.4" height="24.0" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/><text x="500.0" y="774.9" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="350"><tspan x="500.0" dy="0">CRITERIOS DE LIGHT (BASTA 1 = EXUDADO) · 2 de 3 en el caso</tspan></text><rect x="56.0" y="790.9" width="288.0" height="104.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="76.0" cy="813.9" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="76.0" y="817.9" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="76.0" dy="0">1</tspan></text><text x="94.0" y="818.9" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="242"><tspan x="94.0" dy="0">Proteína pleural/sérica &gt; 0,5</tspan></text><text x="68.0" y="844.9" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="264"><tspan x="68.0" dy="0">Cumple</tspan></text><rect x="68.0" y="860.9" width="264.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="200.0" y="875.9" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="252"><tspan x="200.0" dy="0">✓ EN EL CASO</tspan></text><rect x="356.0" y="790.9" width="288.0" height="104.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="376.0" cy="813.9" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="376.0" y="817.9" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="376.0" dy="0">2</tspan></text><text x="394.0" y="818.9" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="242"><tspan x="394.0" dy="0">LDH pleural/sérica &gt; 0,6</tspan></text><text x="368.0" y="844.9" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="264"><tspan x="368.0" dy="0">Cumple</tspan></text><rect x="368.0" y="860.9" width="264.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="500.0" y="875.9" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="252"><tspan x="500.0" dy="0">✓ EN EL CASO</tspan></text><rect x="656.0" y="790.9" width="288.0" height="104.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="676.0" cy="813.9" r="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="676.0" y="817.9" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="676.0" dy="0">3</tspan></text><text x="694.0" y="818.9" font-size="12.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="start" data-max="242"><tspan x="694.0" dy="0">LDH pleural &gt; 2/3 del límite normal</tspan></text><text x="668.0" y="844.9" font-size="11.5" font-weight="400" font-style="normal" fill="#64748b" text-anchor="start" data-max="264"><tspan x="668.0" dy="0">No se informa</tspan></text><rect x="668.0" y="860.9" width="264.0" height="22.0" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/><text x="800.0" y="875.9" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="252"><tspan x="800.0" dy="0">— NO DESCRITO</tspan></text><text x="56.0" y="921.9" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">Cumple dos de tres: es un exudado. Con linfocitos y ADA alta, tuberculosis.</tspan></text><text x="40.0" y="981.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="991.9" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1031.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1031.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Asbestosis</tspan></text><rect x="363.0" y="994.9" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="1031.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Tuberculosis pleural</tspan></text><text x="585.0" y="1031.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Linfoma</tspan></text><text x="735.0" y="1022.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Derrame</tspan><tspan x="735.0" dy="17">paraneumónico</tspan></text><text x="885.0" y="1014.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Derrame por</tspan><tspan x="885.0" dy="17">insuficiencia</tspan><tspan x="885.0" dy="17">cardiaca</tspan></text><rect x="40.0" y="1062.9" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="1062.9" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1091.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Encaja?</tspan></text><text x="285.0" y="1083.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: placas pleurales,</tspan><tspan x="285.0" dy="16">exposición laboral</tspan></text><text x="435.0" y="1083.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: exudado linfocítico</tspan><tspan x="435.0" dy="16">+ ADA alta</tspan></text><text x="585.0" y="1083.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Posible ADA alta, pero</tspan><tspan x="585.0" dy="16">menos frecuente</tspan></text><text x="735.0" y="1083.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: neutrófilos y</tspan><tspan x="735.0" dy="16">neumonía</tspan></text><text x="885.0" y="1091.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es trasudado</tspan></text><rect x="40.0" y="991.9" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1136.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1164.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1186.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Exudado linfocítico + ADA &gt; 40 U/L en zona de alta prevalencia = TB pleural; iniciar tratamiento.</tspan><tspan x="58.0" dy="18">• El Xpert y el cultivo del líquido suelen salir negativos; la biopsia pleural confirma (granulomas).</tspan><tspan x="58.0" dy="18">• Esquema antituberculoso de 6 meses (2HRZE/4HR).</tspan></text><text x="58.0" y="1244.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, consolidated guidelines on tuberculosis (2024); MINSA Perú, NTS de tuberculosis (2023); BTS, pleural disease (2023).</tspan></text></svg>