normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="356.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Sospecha de endocarditis: hemocultivos y ecocardiograma</tspan></text><rect x="40.0" y="447.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="475.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">ECO TRANSESOFÁGICO</tspan></text><text x="266.5" y="498.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Vegetaciones, abscesos</tspan><tspan x="266.5" dy="17">Más sensible</tspan></text><rect x="507.0" y="447.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="483.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Basta el transtorácico</tspan></text><text x="733.5" y="506.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Repetir si la sospecha sigue</tspan></text><text x="40.0" y="577.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CRITERIOS DE DUKE (ISCVID 2023)</tspan></text><rect x="40.0" y="589.5" width="920.0" height="269.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><line x1="62.0" y1="671.5" x2="338.0" y2="671.5" stroke="#64748b" stroke-width="2"/><line x1="62.0" y1="671.5" x2="62.0" y2="679.5" stroke="#64748b" stroke-width="2"/><line x1="338.0" y1="671.5" x2="338.0" y2="679.5" stroke="#64748b" stroke-width="2"/><rect x="111.5" y="659.5" width="177.1" height="24.0" rx="12" fill="#f1f