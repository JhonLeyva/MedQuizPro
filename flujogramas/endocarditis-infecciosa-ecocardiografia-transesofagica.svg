/text><rect x="506.0" y="691.5" width="138.0" height="120.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="526.0" cy="714.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="526.0" y="718.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="526.0" dy="0">4</tspan></text><text x="544.0" y="719.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="92"><tspan x="544.0" dy="0">Fiebre ≥ 38 °C</tspan></text><text x="518.0" y="745.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="114"><tspan x="518.0" dy="0">6 semanas</tspan></text><rect x="518.0" y="777.5" width="114.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="575.0" y="792.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="102"><tspan x="575.0" dy="0">✓ EN EL CASO</tspan></text><rect x="656.0" y="691.5" width="138.0" height="120.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="676.0" cy="714.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="676.0" y="718.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="676.0" dy="0">5</tspan></text><text x="694.0" y="719.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="92"><tspan x="694.0" dy="0">Fenómeno</tspan><tspan x="694.0" dy="17">vascular</tspan></text><text x="668.0" y="757.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="114"><tspan x="668.0" dy="0">Embolia cerebral</tspan></text><rect x="668.0" y="777.5" width="114.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="725.0" y="792.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="102"><tspan x="725.0" dy="0">✓ EN EL CASO</tspan></text><rect x="806.0" y="691.5" width="138.0" height="120.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="826.0" cy="714.5" r="10" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="826.0" y="718.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="826.0" dy="0">6</tspan></text><text x="844.0" y="719.5" font-size="12.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="start" data-max="92"><tspan x="844.0" dy="0">Fenómeno</tspan><tspan x="844.0" dy="17">inmunológico</tspan></text><text x="818.0" y="757.5" font-size="11.5" font-weight="400" font-style="normal" fill="#64748b" text-anchor="start" data-max="114"><tspan x="818.0" dy="0">No descrito</tspan></text><rect x="818.0" y="777.5" width="114.0" height="22.0" rx="11" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/><text x="875.0" y="792.5" font-size="10.5" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="875.0" dy="0">— NO DESCRITO</tspan></text><text x="56.0" y="838.5" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">Tres criterios menores: endocarditis posible (el 5.º menor, microbiológico, sale de los hemocultivos). Una vegetación en el eco (mayor) la vuelve definitiva.</tspan></text><text x="40.0" y="898.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="908.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="939.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="911.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="931.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Ecocardiografía</tspan><tspan x="285.0" dy="17">transesofágica</tspan></text><text x="435.0" y="939.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Electrocardiograma</tspan></text><text x="585.0" y="939.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">RMN encéfalo</tspan></text><text x="735.0" y="939.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">TEM cerebral</tspan></text><text x="885.0" y="931.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Ecocardiograma</tspan><tspan x="885.0" dy="17">transtorácico</tspan></text><rect x="40.0" y="962.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="962.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="991.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Define el diagnóstico?</tspan></text><text x="285.0" y="983.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: ve vegetaciones y</tspan><tspan x="285.0" dy="16">abscesos</tspan></text><text x="435.0" y="983.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no ve</tspan><tspan x="435.0" dy="16">vegetaciones</tspan></text><text x="585.0" y="983.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Ve la embolia, no la</tspan><tspan x="585.0" dy="16">causa</tspan></text><text x="735.0" y="983.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Ve la embolia, no la</tspan><tspan x="735.0" dy="16">causa</tspan></text><text x="885.0" y="983.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Útil primero, menos</tspan><tspan x="885.0" dy="16">sensible</tspan></text><rect x="40.0" y="908.5" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1036.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1064.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1086.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Tres hemocultivos antes del antibiótico; ecocardiograma transtorácico primero y transesofágico si hay válvula previa o complicación.</tspan><tspan x="58.0" dy="18">• El eco transesofágico ve vegetaciones pequeñas y abscesos que el transtorácico no ve.</tspan><tspan x="58.0" dy="18">• Embolia cerebral con vegetación grande: valorar cirugía temprana.</tspan></text><text x="58.0" y="1144.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ESC, guía de endocarditis (2023); criterios de Duke-ISCVID (2023); Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>