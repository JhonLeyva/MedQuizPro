<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1313" viewBox="0 0 1000 1313" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Convulsión de 20 minutos con hemiparesia posictal y fiebre: convulsión febril compleja"><title>Convulsión de 20 minutos con hemiparesia posictal y fiebre: convulsión febril compleja</title><rect x="0.75" y="0.75" width="998.5" height="1311.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · convulsión febril compleja</tspan></text><rect x="420.1" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="469.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="469.2" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Convulsión febril</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Niño de 6 meses a 5 años con fiebre de 38 °C o más, sin infección del sistema nervioso</tspan><tspan x="58.0" dy="17">central.</tspan><tspan x="58.0" dy="17">Se clasifica en simple o compleja.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Paciente de 2 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Convulsión tónico-clónica generalizada de 20 minutos.</tspan><tspan x="640.0" dy="16">Temperatura 38,9 °C, obstrucción nasal y hemiparesia</tspan><tspan x="640.0" dy="16">derecha.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CONVULSIÓN FEBRIL SIMPLE FRENTE A COMPLEJA</tspan></text><rect x="493.0" y="335.0" width="14" height="190" rx="5" fill="#64748b"/><path d="M440.0 540.0 H560.0 L540.0 520.0 H460.0 Z" fill="#475569"/><circle cx="500.0" cy="335.0" r="15" fill="#f59e0b" stroke="#92400e" stroke-width="2"/><line x1="385.4" y1="316.9" x2="614.6" y2="353.1" stroke="#334155" stroke-width="7" stroke-linecap="round"/><line x1="385.4" y1="316.9" x2="357.4" y2="378.9" stroke="#64748b" stroke-width="2"/><line x1="385.4" y1="316.9" x2="413.4" y2="378.9" stroke="#64748b" stroke-width="2"/><path d="M347.4 378.9 H423.4 Q385.4 422.9 347.4 378.9 Z" fill="#64748b"/><text x="385.4" y="393.9" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="385.4" dy="0">LEVE</tspan></text><line x1="614.6" y1="353.1" x2="586.6" y2="415.1" stroke="#64748b" stroke-width="2"/><line x1="614.6" y1="353.1" x2="642.6" y2="415.1" stroke="#64748b" stroke-width="2"/><path d="M576.6 415.1 H652.6 Q614.6 459.1 576.6 415.1 Z" fill="#ea580c"/><text x="614.6" y="430.1" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="614.6" dy="0">ESTUDIO</tspan></text><text x="500.0" y="567.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="300"><tspan x="500.0" dy="0">¿Cuál corresponde al caso?</tspan></text><rect x="40.0" y="305.0" width="290.0" height="158.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="58.0" y="333.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="58.0" dy="0">Simple</tspan></text><circle cx="62.0" cy="358.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="362.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Generalizada</tspan></text><circle cx="62.0" cy="384.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="388.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Menos de 15 minutos</tspan></text><circle cx="62.0" cy="410.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="414.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">No recurre en 24 horas</tspan></text><circle cx="62.0" cy="436.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="74.0" y="440.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Sin déficit posictal</tspan></text><rect x="670.0" y="305.0" width="290.0" height="158.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><text x="688.0" y="333.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="254"><tspan x="688.0" dy="0">Compleja (este caso)</tspan></text><circle cx="692.0" cy="358.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="362.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Duración de 20 minutos (más de 15)</tspan></text><circle cx="692.0" cy="384.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="388.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Hemiparesia posictal: signo focal</tspan></text><circle cx="692.0" cy="410.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="414.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Descartar meningitis y encefalitis</tspan></text><circle cx="692.0" cy="436.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="704.0" y="440.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Neuroimagen y EEG si persiste el déficit</tspan></text><rect x="844.6" y="294.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="601.0" width="920.0" height="93.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="629.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Más de 15 minutos + déficit focal = convulsión febril compleja</tspan></text><text x="500.0" y="650.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Espasmo infantil, epilepsia y síncope febril no encajan.</tspan><tspan x="500.0" dy="17">La simple es breve, generalizada y sin déficit.</tspan></text><text x="40.0" y="728.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CONVULSIÓN FEBRIL SIMPLE FRENTE A COMPLEJA</tspan></text><rect x="40.0" y="740.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="759.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Rasgo</tspan></text><text x="250.0" y="759.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Simple</tspan></text><text x="610.0" y="759.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Compleja</tspan></text><rect x="40.0" y="769.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="788.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Inicio</tspan></text><text x="250.0" y="788.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Generalizada</tspan></text><text x="610.0" y="788.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Focal</tspan></text><rect x="40.0" y="798.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="817.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Duración</tspan></text><text x="250.0" y="817.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Menos de 15 minutos</tspan></text><text x="610.0" y="817.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Más de 15 minutos</tspan></text><rect x="40.0" y="827.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="846.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Recurrencia</tspan></text><text x="250.0" y="846.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">No se repite en 24 horas</tspan></text><text x="610.0" y="846.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Recurre en el mismo episodio o en 24 horas</tspan></text><rect x="40.0" y="856.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="875.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Riesgo de epilepsia</tspan></text><text x="250.0" y="875.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Cercano a 1 %</tspan></text><text x="610.0" y="875.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">De 4 a 6 %</tspan></text><text x="40.0" y="925.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="935.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="966.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="966.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Espasmo infantil</tspan></text><text x="435.0" y="957.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Convulsión febril</tspan><tspan x="435.0" dy="17">simple</tspan></text><text x="585.0" y="966.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Epilepsia</tspan></text><rect x="663.0" y="938.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="957.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Convulsión febril</tspan><tspan x="735.0" dy="17">compleja</tspan></text><text x="885.0" y="966.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Síncope febril</tspan></text><rect x="40.0" y="989.0" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="989.0" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1034.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="1018.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: ocurre en el</tspan><tspan x="285.0" dy="16">síndrome de West, sin</tspan><tspan x="285.0" dy="16">fiebre</tspan></text><text x="435.0" y="1018.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: dura menos de 15</tspan><tspan x="435.0" dy="16">minutos y no deja</tspan><tspan x="435.0" dy="16">déficit</tspan></text><text x="585.0" y="1026.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: exige crisis</tspan><tspan x="585.0" dy="16">recurrentes sin fiebre</tspan></text><text x="735.0" y="1018.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: dura más de 15</tspan><tspan x="735.0" dy="16">minutos y deja déficit</tspan><tspan x="735.0" dy="16">focal</tspan></text><text x="885.0" y="1010.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no tiene</tspan><tspan x="885.0" dy="16">movimientos</tspan><tspan x="885.0" dy="16">tónico-clónicos</tspan><tspan x="885.0" dy="16">sostenidos</tspan></text><rect x="40.0" y="935.0" width="920.0" height="136.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1095.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1123.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1145.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Simple: generalizada, menos de 15 minutos y sin recurrencia en 24 horas. Compleja: focal, mayor de 15 minutos o recurrente en el mismo episodio o en</tspan><tspan x="58.0" dy="18">   24 horas.</tspan><tspan x="58.0" dy="18">• El caso cumple dos criterios: duración de 20 minutos y déficit motor posictal (parálisis de Todd o lesión focal).</tspan><tspan x="58.0" dy="18">• Se descarta meningitis y encefalitis (punción lumbar sobre todo en menores de 12 meses o con signos meníngeos, AAP 2011) y se evalúa con</tspan><tspan x="58.0" dy="18">   neuroimagen y EEG si persiste el déficit.</tspan><tspan x="58.0" dy="18">• Crisis de más de 5 minutos: benzodiacepina (midazolam IM o diazepam rectal). Riesgo de epilepsia posterior: de 1 % a 4-6 % tras una compleja.</tspan></text><text x="58.0" y="1257.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAP, Subcomité de convulsiones febriles, Monografía: Convulsiones febriles, evaluación neurodiagnóstica (Pediatrics 2011); Nelson Tratado de Pediatría, 22.ª ed.</tspan><tspan x="58.0" dy="15">(2024).</tspan></text></svg>