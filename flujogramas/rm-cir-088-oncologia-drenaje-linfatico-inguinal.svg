<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1062" viewBox="0 0 1000 1062" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El carcinoma escamoso en un ganglio inguinal orienta a un primario del canal anal"><title>El carcinoma escamoso en un ganglio inguinal orienta a un primario del canal anal</title><rect x="0.75" y="0.75" width="998.5" height="1061.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Oncología · drenaje linfático inguinal</tspan></text><rect x="418.0" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="461.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="461.2" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ganglios inguinales</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Drenan piel de miembros inferiores y periné, pene, vulva, escroto y canal anal bajo la línea</tspan><tspan x="58.0" dy="17">dentada.</tspan><tspan x="58.0" dy="17">Una metástasis escamosa inguinal apunta a esos sitios.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 63 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pérdida de peso y astenia.</tspan><tspan x="640.0" dy="16">Tumor inguinal izquierdo de 1,5 cm, duro y poco móvil;</tspan><tspan x="640.0" dy="16">biopsia: carcinoma escamoso.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ PRIMARIO DA METÁSTASIS EN LA INGLE</tspan></text><text x="202.0" y="297.0" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="758"><tspan x="202.0" dy="0">→ DATOS DEL TUMOR</tspan></text><rect x="202.0" y="307.0" width="373.0" height="35.0" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="388.5" y="329.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="353"><tspan x="388.5" dy="0">Drena a</tspan></text><rect x="587.0" y="307.0" width="373.0" height="35.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="773.5" y="329.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="353"><tspan x="773.5" dy="0">Tumor típico</tspan></text><text x="40.0" y="328.5" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="146"><tspan x="40.0" dy="0">↓ ORIGEN</tspan></text><rect x="40.0" y="354.0" width="150.0" height="90.5" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="115.0" y="403.7" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Canal anal</tspan></text><rect x="202.0" y="354.0" width="373.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="388.5" y="382.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Ganglios inguinales</tspan></text><text x="388.5" y="405.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Bajo la línea dentada</tspan><tspan x="388.5" dy="17">Este caso</tspan></text><rect x="343.1" y="433.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="388.5" y="448.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="388.5" dy="0">◆ ESTE CASO</tspan></text><rect x="587.0" y="354.0" width="373.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="588.0" y="355.0" width="6.0" height="88.5" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="773.5" y="390.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Carcinoma escamoso</tspan></text><text x="773.5" y="413.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Asociado a VPH 16</tspan></text><rect x="40.0" y="456.5" width="150.0" height="76.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="115.0" y="499.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Recto y sigmoides</tspan></text><rect x="202.0" y="456.5" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="457.5" width="6.0" height="74.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="388.5" y="486.1" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Mesentéricos e ilíacos internos</tspan></text><text x="388.5" y="509.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Sin paso por la ingle</tspan></text><rect x="587.0" y="456.5" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="588.0" y="457.5" width="6.0" height="74.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="773.5" y="486.1" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Adenocarcinoma</tspan></text><text x="773.5" y="509.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Cirugía y quimioterapia</tspan></text><rect x="40.0" y="544.5" width="150.0" height="76.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="115.0" y="587.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Próstata</tspan></text><rect x="202.0" y="544.5" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="545.5" width="6.0" height="74.0" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="388.5" y="574.1" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Obturadores e ilíacos</tspan></text><text x="388.5" y="597.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Sin paso por la ingle</tspan></text><rect x="587.0" y="544.5" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="588.0" y="545.5" width="6.0" height="74.0" rx="3" fill="#6366f1" stroke="none" stroke-width="1.5"/><text x="773.5" y="574.1" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Adenocarcinoma</tspan></text><text x="773.5" y="597.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Hormonoterapia y radioterapia</tspan></text><rect x="40.0" y="632.5" width="150.0" height="76.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="115.0" y="675.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Testículo</tspan></text><rect x="202.0" y="632.5" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="633.5" width="6.0" height="74.0" rx="3" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="388.5" y="662.1" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Paraaórticos</tspan></text><text x="388.5" y="685.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Retroperitoneo</tspan></text><rect x="587.0" y="632.5" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="588.0" y="633.5" width="6.0" height="74.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="773.5" y="662.1" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Tumor de células germinales</tspan></text><text x="773.5" y="685.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Marcadores: AFP y HCG</tspan></text><text x="40.0" y="758.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="768.5" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="791.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="771.5" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="791.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Ano</tspan></text><text x="435.0" y="791.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Recto</tspan></text><text x="585.0" y="791.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Próstata</tspan></text><text x="735.0" y="791.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Sigmoides</tspan></text><text x="885.0" y="791.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Testículo</tspan></text><rect x="40.0" y="805.5" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="805.5" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="842.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Primario?</tspan></text><text x="285.0" y="834.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: escamoso, bajo la</tspan><tspan x="285.0" dy="16">línea dentada</tspan></text><text x="435.0" y="826.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: adenocarcinoma,</tspan><tspan x="435.0" dy="16">drena a ganglios</tspan><tspan x="435.0" dy="16">mesentéricos</tspan></text><text x="585.0" y="826.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: adenocarcinoma,</tspan><tspan x="585.0" dy="16">drena a ganglios</tspan><tspan x="585.0" dy="16">ilíacos</tspan></text><text x="735.0" y="826.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: adenocarcinoma,</tspan><tspan x="735.0" dy="16">drena a ganglios</tspan><tspan x="735.0" dy="16">mesentéricos</tspan></text><text x="885.0" y="834.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: drena a ganglios</tspan><tspan x="885.0" dy="16">paraaórticos</tspan></text><rect x="40.0" y="768.5" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="895.5" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="923.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="945.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Canal anal bajo la línea dentada: escamoso, drena a ganglios inguinales. Recto, sigmoides y próstata: adenocarcinomas con drenaje a ganglios</tspan><tspan x="58.0" dy="18">   mesentéricos e ilíacos.</tspan><tspan x="58.0" dy="18">• El testículo drena a ganglios paraaórticos y sus tumores son germinales. En esta ingle buscar piel, pene, vulva y ano.</tspan><tspan x="58.0" dy="18">• Carcinoma anal (VPH 16): quimiorradioterapia con mitomicina y 5-fluorouracilo (Nigro), no cirugía; guía ESMO 2021.</tspan></text><text x="58.0" y="1021.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ESMO, cáncer anal (Rao et al., Ann Oncol 2021); NCCN, cáncer anal (2025); Sabiston Tratado de Cirugía 21.ª ed.</tspan></text></svg>