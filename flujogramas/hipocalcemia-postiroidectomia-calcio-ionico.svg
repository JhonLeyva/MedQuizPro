616.0" cy="710.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="616.0" y="714.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="616.0" dy="0">4</tspan></text><text x="634.0" y="715.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="122"><tspan x="634.0" dy="0">Laringoespasmo</tspan></text><text x="608.0" y="741.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="144"><tspan x="608.0" dy="0">Dificultad respiratoria</tspan></text><rect x="608.0" y="769.5" width="144.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="680.0" y="784.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="132"><tspan x="680.0" dy="0">✓ EN EL CASO</tspan></text><rect x="776.0" y="687.5" width="168.0" height="116.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><circle cx="796.0" cy="710.5" r="10" fill="#ea580c" stroke="none" stroke-width="0"/><text x="796.0" y="714.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="796.0" dy="0">5</tspan></text><text x="814.0" y="715.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="122"><tspan x="814.0" dy="0">Convulsiones</tspan></text><text x="788.0" y="741.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="144"><tspan x="788.0" dy="0">Sí</tspan></text><rect x="788.0" y="769.5" width="144.0" height="22.0" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/><text x="860.0" y="784.5" font-size="10.5" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="132"><tspan x="860.0" dy="0">✓ EN EL CASO</tspan></text><text x="56.0" y="830.5" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">Laringoespasmo y convulsiones: hipocalcemia grave, calcio EV ya.</tspan></text><text x="40.0" y="890.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="900.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="931.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="903.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="931.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Calcio iónico</tspan></text><text x="435.0" y="931.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">T4 libre</tspan></text><text x="585.0" y="931.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">TSH</tspan></text><text x="735.0" y="931.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">CPK total</tspan></text><text x="885.0" y="923.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Magnesio sérico</tspan><tspan x="885.0" dy="17">aislado</tspan></text><rect x="40.0" y="954.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="954.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="983.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Dosaje?</tspan></text><text x="285.0" y="975.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: confirma la</tspan><tspan x="285.0" dy="16">hipocalcemia</tspan></text><text x="435.0" y="975.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No explica los</tspan><tspan x="435.0" dy="16">síntomas</tspan></text><text x="585.0" y="975.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No explica los</tspan><tspan x="585.0" dy="16">síntomas</tspan></text><text x="735.0" y="983.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No es lo urgente</tspan></text><text x="885.0" y="975.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Se mide también, pero</tspan><tspan x="885.0" dy="16">no aislado</tspan></text><rect x="40.0" y="900.5" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1028.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1056.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1078.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Medir calcio iónico (y magnesio) y tratar sin demora: gluconato de calcio al 10 % 10-20 mL EV en 10 min, luego infusión.</tspan><tspan x="58.0" dy="18">• Corregir el magnesio si está bajo (sin él no sube el calcio).</tspan><tspan x="58.0" dy="18">• Luego calcio oral y calcitriol; medir PTH tras la cirugía para prever el riesgo.</tspan></text><text x="58.0" y="1136.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Society for Endocrinology, hipocalcemia aguda (2016); ATA, tiroidectomía (2020).</tspan></text></svg>