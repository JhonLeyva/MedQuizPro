<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1177" viewBox="0 0 1000 1177" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Lactante con vómitos, fiebre y diarrea acuosa sin moco ni sangre: gastroenteritis viral (rotavirus)"><title>Lactante con vómitos, fiebre y diarrea acuosa sin moco ni sangre: gastroenteritis viral (rotavirus)</title><rect x="0.75" y="0.75" width="998.5" height="1175.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · diarrea aguda del lactante</tspan></text><rect x="416.7" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="465.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="465.8" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Gastroenteritis aguda viral</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Rotavirus, norovirus, adenovirus entérico y astrovirus: inicio brusco con vómitos y fiebre</tspan><tspan x="58.0" dy="17">moderada.</tspan><tspan x="58.0" dy="17">Diarrea acuosa por daño del enterocito maduro.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 7 meses</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Vómitos lácteos, fiebre de 38,5 °C y deposiciones</tspan><tspan x="640.0" dy="16">líquidas abundantes sin moco ni sangre.</tspan><tspan x="640.0" dy="16">Irritable, sediento y con ojos hundidos.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CADENA DE TRANSMISIÓN DEL ROTAVIRUS Y DÓNDE SE CORTA</tspan></text><rect x="40.0" y="285.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="145.2" y="305.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Agente</tspan></text><text x="145.2" y="322.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Rotavirus, norovirus, adenovirus</tspan><tspan x="145.2" dy="16">entérico</tspan></text><line x1="253.5" y1="322.5" x2="266.5" y2="322.5" stroke="#0f766e" stroke-width="2"/><polygon points="265.5,317.5 265.5,327.5 273.5,322.5" fill="#0f766e"/><line x1="145.2" y1="362.0" x2="145.2" y2="376.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="40.0" y="378.0" width="210.5" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="145.2" y="392.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">✂ CORTA</tspan></text><text x="145.2" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Vacuna contra rotavirus a los 2</tspan><tspan x="145.2" dy="16">y 4 meses</tspan></text><rect x="276.5" y="285.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="381.8" y="305.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Salida y vía</tspan></text><text x="381.8" y="322.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Heces; vía fecal-oral y manos</tspan><tspan x="381.8" dy="16">contaminadas</tspan></text><line x1="490.0" y1="322.5" x2="503.0" y2="322.5" stroke="#0f766e" stroke-width="2"/><polygon points="502.0,317.5 502.0,327.5 510.0,322.5" fill="#0f766e"/><line x1="381.8" y1="362.0" x2="381.8" y2="376.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="276.5" y="378.0" width="210.5" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="381.8" y="392.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">✂ CORTA</tspan></text><text x="381.8" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Lavado de manos y manejo de</tspan><tspan x="381.8" dy="16">pañales</tspan></text><rect x="513.0" y="285.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="618.2" y="305.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Entorno</tspan></text><text x="618.2" y="322.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Superficies, juguetes y agua</tspan></text><line x1="726.5" y1="322.5" x2="739.5" y2="322.5" stroke="#0f766e" stroke-width="2"/><polygon points="738.5,317.5 738.5,327.5 746.5,322.5" fill="#0f766e"/><line x1="618.2" y1="362.0" x2="618.2" y2="376.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="513.0" y="378.0" width="210.5" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="618.2" y="392.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">✂ CORTA</tspan></text><text x="618.2" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Agua segura y limpieza del</tspan><tspan x="618.2" dy="16">entorno</tspan></text><rect x="749.5" y="285.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="854.8" y="305.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Huésped</tspan></text><text x="854.8" y="322.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Lactante de 7 meses con</tspan><tspan x="854.8" dy="16">deshidratación leve a moderada</tspan></text><line x1="854.8" y1="362.0" x2="854.8" y2="376.0" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="749.5" y="378.0" width="210.5" height="64.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="854.8" y="392.0" font-size="9.5" font-weight="800" font-style="normal" fill="#ffedd5" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">✂ CORTA</tspan></text><text x="854.8" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Sales de rehidratación oral,</tspan><tspan x="854.8" dy="16">lactancia y zinc</tspan></text><rect x="809.3" y="431.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="854.8" y="446.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="854.8" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="472.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="498.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Vómitos + fiebre + diarrea acuosa sin sangre = gastroenteritis viral</tspan></text><text x="60.0" y="517.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Se trata con rehidratación oral; los antibióticos y el estudio de heces no son de rutina.</tspan></text><text x="40.0" y="578.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DIARREA AGUDA DEL LACTANTE SEGÚN EL AGENTE</tspan></text><rect x="40.0" y="590.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="609.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Agente</tspan></text><text x="290.0" y="609.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Cuadro típico</tspan></text><text x="630.0" y="609.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">Heces</tspan></text><rect x="40.0" y="619.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="638.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Virus (rotavirus)</tspan></text><text x="290.0" y="638.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Vómitos y fiebre moderada, de inicio brusco</tspan></text><text x="630.0" y="638.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">Acuosas, sin moco ni sangre</tspan></text><rect x="180.6" y="622.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="226.0" y="637.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="226.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="648.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="667.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Shigella</tspan></text><text x="290.0" y="667.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Fiebre alta y dolor abdominal (disentería)</tspan></text><text x="630.0" y="667.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">Moco y sangre</tspan></text><rect x="40.0" y="677.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="696.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Salmonella</tspan></text><text x="290.0" y="696.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Fiebre y dolor abdominal</tspan></text><text x="630.0" y="696.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">Moco, a veces sangre</tspan></text><rect x="40.0" y="706.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="725.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Vibrio cholerae</tspan></text><text x="290.0" y="725.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Brotes epidémicos, sin fiebre</tspan></text><text x="630.0" y="725.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">Agua de arroz</tspan></text><rect x="40.0" y="735.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="754.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Giardia</tspan></text><text x="290.0" y="754.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Subaguda, distensión y flatulencia</tspan></text><text x="630.0" y="754.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">Esteatorrea; sin vómitos ni fiebre alta</tspan></text><text x="40.0" y="804.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="814.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="836.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="836.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Giardiasis</tspan></text><rect x="363.0" y="817.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="836.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Gastroenteritis viral</tspan></text><text x="585.0" y="836.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Shigelosis</tspan></text><text x="735.0" y="836.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Salmonelosis</tspan></text><text x="885.0" y="836.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Cólera</tspan></text><rect x="40.0" y="851.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="851.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="880.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico más</tspan><tspan x="54.0" dy="16">probable?</tspan></text><text x="285.0" y="872.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es subaguda, con</tspan><tspan x="285.0" dy="16">esteatorrea y sin fiebre</tspan><tspan x="285.0" dy="16">alta</tspan></text><text x="435.0" y="872.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: vómitos, fiebre y</tspan><tspan x="435.0" dy="16">diarrea acuosa sin</tspan><tspan x="435.0" dy="16">sangre</tspan></text><text x="585.0" y="880.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: daría moco,</tspan><tspan x="585.0" dy="16">sangre y fiebre alta</tspan></text><text x="735.0" y="880.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: daría diarrea con</tspan><tspan x="735.0" dy="16">sangre y dolor</tspan></text><text x="885.0" y="872.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: heces en agua de</tspan><tspan x="885.0" dy="16">arroz sin fiebre, en</tspan><tspan x="885.0" dy="16">brotes</tspan></text><rect x="40.0" y="814.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="941.0" width="920.0" height="218.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="969.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="991.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Cuadro típico viral: vómitos y fiebre moderada, luego diarrea acuosa abundante sin moco ni sangre. Irritabilidad, sed y ojos hundidos indican</tspan><tspan x="58.0" dy="18">   deshidratación leve a moderada (plan B).</tspan><tspan x="58.0" dy="18">• Shigelosis y salmonelosis dan moco, sangre y fiebre alta; cólera da heces en agua de arroz sin fiebre; giardiasis es subaguda con distensión y</tspan><tspan x="58.0" dy="18">   esteatorrea.</tspan><tspan x="58.0" dy="18">• Tratamiento: sales de rehidratación oral hipoosmolar, continuar lactancia y alimentación habitual, y zinc. No se necesitan coprocultivo ni antibióticos de</tspan><tspan x="58.0" dy="18">   rutina.</tspan><tspan x="58.0" dy="18">• Prevención: vacuna contra rotavirus a los 2 y 4 meses en el esquema peruano, lavado de manos y agua segura.</tspan></text><text x="58.0" y="1121.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ESPGHAN/ESPID, gastroenteritis aguda en niños (2014); OMS, tratamiento de la diarrea (2005, reimpresión 2022); MINSA, NTS 196-MINSA/DGIESP-2022; Nelson 22.ª</tspan><tspan x="58.0" dy="15">ed. (2024).</tspan></text></svg>