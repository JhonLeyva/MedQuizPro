<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1252" viewBox="0 0 1000 1252" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Anciana con fibrilación auricular y pie frío, cianótico, necrosado, sin pulsos ni movilidad: amputación primaria"><title>Anciana con fibrilación auricular y pie frío, cianótico, necrosado, sin pulsos ni movilidad: amputación primaria</title><rect x="0.75" y="0.75" width="998.5" height="1251.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Isquemia arterial aguda</tspan></text><rect x="339.4" y="32.0" width="101.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="390.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="85"><tspan x="390.1" dy="0">CIRUGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Isquemia arterial aguda de miembro</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Un émbolo (casi siempre de fibrilación auricular) tapa una arteria: las 6 P.</tspan><tspan x="58.0" dy="17">Si el músculo ya murió, revascularizar libera potasio y mioglobina (síndrome de</tspan><tspan x="58.0" dy="17">reperfusión).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 90 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Hipertensa con fibrilación auricular mal tratada.</tspan><tspan x="640.0" dy="16">Pie izquierdo frío, cianótico y necrosado; sin pulsos; no</tspan><tspan x="640.0" dy="16">mueve dedos ni tobillo.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="395.0" x2="733.5" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="395.0" x2="266.5" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,423.0 271.5,423.0 266.5,431.0" fill="#94a3b8"/><line x1="733.5" y1="395.0" x2="733.5" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,423.0 738.5,423.0 733.5,431.0" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#0f766e"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="395.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="395.0" x2="266.5" y2="424.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,423.0 271.5,423.0 266.5,431.0" fill="#0f766e"/><rect x="170.0" y="404.0" width="193.0" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">No: necrosis y parálisis (este caso)</tspan></text><rect x="689.3" y="404.0" width="88.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Sí, amenazado</tspan></text><polygon points="240.0,336.0 266.0,307.0 734.0,307.0 760.0,336.0 734.0,365.0 266.0,365.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="336.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="341.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="340.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Isquemia aguda: ¿el miembro es viable?</tspan></text><rect x="40.0" y="431.0" width="453.0" height="73.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">AMPUTACIÓN PRIMARIA</tspan></text><text x="266.5" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Rutherford III</tspan></text><rect x="507.0" y="431.0" width="453.0" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Revascularizar</tspan></text><text x="733.5" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Trombectomía o fibrinólisis + heparina</tspan></text><text x="40.0" y="544.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="556.5" width="920.0" height="369.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="570.5" width="399.1" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="255.6" y="590.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="255.6" dy="0">CLASIFICACIÓN DE RUTHERFORD (ISQUEMIA AGUDA)</tspan></text><text x="471.1" y="590.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="471"><tspan x="471.1" dy="0">Sociedad de Cirugía Vascular: define si se salva el miembro.</tspan></text><rect x="56.0" y="630.5" width="213.0" height="144.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="631.1" width="211.8" height="63.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="162.5" y="658.5" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="197"><tspan x="162.5" dy="0">I</tspan></text><text x="162.5" y="678.5" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="189"><tspan x="162.5" dy="0">Viable</tspan></text><circle cx="72.0" cy="703.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="707.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="82.0" dy="0">Sin pérdida sensitiva ni motora</tspan></text><circle cx="72.0" cy="726.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="730.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="82.0" dy="0">Doppler arterial audible</tspan></text><rect x="281.0" y="630.5" width="213.0" height="144.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="281.6" y="631.1" width="211.8" height="63.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="387.5" y="658.5" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="197"><tspan x="387.5" dy="0">IIA</tspan></text><text x="387.5" y="678.5" font-size="14" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="189"><tspan x="387.5" dy="0">Amenaza marginal</tspan></text><circle cx="297.0" cy="703.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="307.0" y="707.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="307.0" dy="0">Pérdida sensitiva en los dedos</tspan></text><circle cx="297.0" cy="726.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="307.0" y="730.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="307.0" dy="0">Revascularizar pronto</tspan></text><rect x="506.0" y="630.5" width="213.0" height="144.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="506.6" y="631.1" width="211.8" height="63.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="612.5" y="658.5" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="197"><tspan x="612.5" dy="0">IIB</tspan></text><text x="612.5" y="678.5" font-size="14" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="189"><tspan x="612.5" dy="0">Amenaza inmediata</tspan></text><circle cx="522.0" cy="703.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="532.0" y="707.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="532.0" dy="0">Dolor en reposo, debilidad</tspan></text><circle cx="522.0" cy="726.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="532.0" y="730.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="532.0" dy="0">Revascularizar ya</tspan></text><rect x="731.0" y="630.5" width="213.0" height="144.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="732.2" y="631.7" width="210.6" height="63.0" rx="9" fill="#fee2e2" stroke="none" stroke-width="0"/><text x="837.5" y="658.5" font-size="11" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="197"><tspan x="837.5" dy="0">III</tspan></text><text x="837.5" y="678.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="189"><tspan x="837.5" dy="0">Irreversible</tspan></text><circle cx="747.0" cy="703.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="757.0" y="707.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="175"><tspan x="757.0" dy="0">Anestesia y parálisis</tspan></text><circle cx="747.0" cy="726.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="757.0" y="730.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="175"><tspan x="757.0" dy="0">Rigidez, necrosis</tspan></text><circle cx="747.0" cy="749.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="757.0" y="753.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="175"><tspan x="757.0" dy="0">Amputar</tspan></text><rect x="792.1" y="619.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="837.5" y="634.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="837.5" dy="0">◆ ESTE CASO</tspan></text><text x="56.0" y="804.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="813.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="828.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="828.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Necrosis del pie y parálisis de dedos y tobillo</tspan></text><rect x="56.0" y="835.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="850.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="850.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Sin pulsos ni posibilidad de recuperar</tspan></text><rect x="56.0" y="872.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="895.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Amputación primaria, heparina y control de la fibrilación auricular.</tspan></text><text x="40.0" y="965.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="975.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1006.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="978.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="998.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Amputación</tspan><tspan x="285.0" dy="17">primaria</tspan></text><text x="435.0" y="1006.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Bypass distal</tspan></text><text x="585.0" y="998.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Trombectomía</tspan><tspan x="585.0" dy="17">urgente</tspan></text><text x="735.0" y="998.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Heparina en</tspan><tspan x="735.0" dy="17">infusión</tspan></text><text x="885.0" y="998.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Fibrinólisis</tspan><tspan x="885.0" dy="17">intraarterial</tspan></text><rect x="40.0" y="1029.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1029.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1058.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿De elección?</tspan></text><text x="285.0" y="1058.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: miembro no viable</tspan></text><text x="435.0" y="1058.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: ya no es viable</tspan></text><text x="585.0" y="1058.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: ya no es viable</tspan></text><text x="735.0" y="1050.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Complementa, no</tspan><tspan x="735.0" dy="16">resuelve</tspan></text><text x="885.0" y="1058.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: ya no es viable</tspan></text><rect x="40.0" y="975.5" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1103.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1131.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1153.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Clasificar con Rutherford: I y IIa (viable) se revascularizan; IIb urgente; III (irreversible) se amputa.</tspan><tspan x="58.0" dy="18">• Necrosis + parálisis + anestesia = categoría III: amputación primaria.</tspan><tspan x="58.0" dy="18">• Anticoagular con heparina desde el inicio y tratar la fibrilación auricular.</tspan></text><text x="58.0" y="1211.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ESVS, guía de isquemia aguda de miembros (2020); SVS (2022).</tspan></text></svg>