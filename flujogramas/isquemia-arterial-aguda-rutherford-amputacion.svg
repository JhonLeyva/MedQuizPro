<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="599" viewBox="0 0 1000 599" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Isquemia arterial aguda: clasificación de Rutherford"><title>Isquemia arterial aguda: clasificación de Rutherford</title><rect x="0.75" y="0.75" width="998.5" height="597.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16" y="16" width="968" height="56" rx="10" fill="#0f766e"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170" y1="34.0" x2="170" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="680"><tspan x="184.0" dy="0">CIRUGÍA ENAM: ISQUEMIA ARTERIAL AGUDA: CLASIFICACIÓN DE RUTHERFORD</tspan></text><rect x="884.1" y="32.0" width="79.9" height="24" rx="12" fill="#134e4a"/><text x="924.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="64"><tspan x="924.0" dy="0">CIRUGÍA</tspan></text><rect x="190.0" y="90.0" width="620" height="86.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="500.0" y="118.5" font-size="14.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Mujer de 90 años con FA sin anticoagular: pie frío, cianótico</tspan><tspan x="500.0" dy="19.0">y necrótico</tspan></text><text x="500.0" y="160.0" font-size="12" font-weight="400" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Sin pulsos, pérdida motora de dedos y tobillo</tspan></text><line x1="500.0" y1="176.0" x2="500.0" y2="196.0" stroke="#0f766e" stroke-width="2"/><line x1="186.0" y1="196.0" x2="814.0" y2="196.0" stroke="#0f766e" stroke-width="2"/><line x1="186.0" y1="196.0" x2="186.0" y2="215.0" stroke="#0f766e" stroke-width="2"/><polygon points="181.0,214.0 191.0,214.0 186.0,222.0" fill="#0f766e"/><line x1="500.0" y1="196.0" x2="500.0" y2="215.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,214.0 505.0,214.0 500.0,222.0" fill="#0f766e"/><line x1="814.0" y1="196.0" x2="814.0" y2="215.0" stroke="#0f766e" stroke-width="2"/><polygon points="809.0,214.0 819.0,214.0 814.0,222.0" fill="#0f766e"/><rect x="40.0" y="222.0" width="292" height="131.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><path d="M40.0,232.0 a10,10 0 0 1 10,-10 h272 a10,10 0 0 1 10,10 v22.0 h-292 z" fill="#e2e8f0"/><text x="186.0" y="246.5" font-size="13.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="264"><tspan x="186.0" dy="0">I · Viable</tspan></text><text x="186.0" y="278.0" font-size="12" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="264"><tspan x="186.0" dy="0">Sin déficit sensitivo</tspan><tspan x="186.0" dy="17">ni motor</tspan><tspan x="186.0" dy="17">Doppler arterial audible</tspan><tspan x="186.0" dy="17">→ revascularizar</tspan></text><rect x="354.0" y="222.0" width="292" height="131.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><path d="M354.0,232.0 a10,10 0 0 1 10,-10 h272 a10,10 0 0 1 10,10 v22.0 h-292 z" fill="#e2e8f0"/><text x="500.0" y="246.5" font-size="13.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="264"><tspan x="500.0" dy="0">II · Amenazada</tspan></text><text x="500.0" y="278.0" font-size="12" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="264"><tspan x="500.0" dy="0">Pérdida sensitiva</tspan><tspan x="500.0" dy="17">± debilidad leve</tspan><tspan x="500.0" dy="17">→ revascularización</tspan><tspan x="500.0" dy="17">urgente (embolectomía)</tspan></text><rect x="668.0" y="222.0" width="292" height="131.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><path d="M668.0,232.0 a10,10 0 0 1 10,-10 h272 a10,10 0 0 1 10,10 v22.0 h-292 z" fill="#0f766e"/><text x="814.0" y="246.5" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="264"><tspan x="814.0" dy="0">III · Irreversible</tspan></text><text x="814.0" y="278.0" font-size="12" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="264"><tspan x="814.0" dy="0">Parálisis y anestesia</tspan><tspan x="814.0" dy="17">profundas, necrosis</tspan><tspan x="814.0" dy="17">Doppler inaudible</tspan><tspan x="814.0" dy="17">→ AMPUTACIÓN PRIMARIA</tspan></text><rect x="867.8" y="212.0" width="84.2" height="20" rx="10" fill="#f59e0b"/><text x="909.9" y="226.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="909.9" dy="0">✓ RESPUESTA</tspan></text><line x1="814.0" y1="353.0" x2="814.0" y2="374.0" stroke="#0f766e" stroke-width="2"/><polygon points="809.0,373.0 819.0,373.0 814.0,381.0" fill="#0f766e"/><rect x="100.0" y="381.0" width="800" height="65.0" rx="10" fill="#134e4a" stroke="#134e4a" stroke-width="1.5"/><text x="500.0" y="407.0" font-size="12" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="772"><tspan x="500.0" dy="0">POR QUÉ NO REVASCULARIZAR EN LA CLASE III</tspan></text><text x="500.0" y="430.0" font-size="12.5" font-weight="400" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="772"><tspan x="500.0" dy="0">Riesgo de síndrome de reperfusión: hiperkalemia, acidosis, mioglobinuria y muerte</tspan></text><rect x="40" y="472.0" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="500.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="522.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Las 6 P: dolor, palidez, ausencia de pulso, parestesias, parálisis y poiquilotermia.</tspan><tspan x="58.0" dy="18">• La FA sin anticoagular es la principal fuente de embolia arterial periférica.</tspan></text><text x="58.0" y="562.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ESVS 2020 Acute Limb Ischaemia Guidelines · Sabiston 21.ª ed.</tspan></text></svg>
