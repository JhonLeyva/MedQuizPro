<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1013" viewBox="0 0 1000 1013" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La rápida apertura de los canales de sodio dependientes de voltaje determina el potencial de acción neuronal"><title>La rápida apertura de los canales de sodio dependientes de voltaje determina el potencial de acción neuronal</title><rect x="0.75" y="0.75" width="998.5" height="1011.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Fisiología · potencial de acción</tspan></text><rect x="384.5" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="456.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="456.5" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Potencial de acción neuronal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Reposo de unos -70 mV, mantenido por la bomba sodio-potasio y canales de fuga de</tspan><tspan x="58.0" dy="17">potasio.</tspan><tspan x="58.0" dy="17">Umbral cerca de -55 mV.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿La rápida apertura de qué canales voltaje</tspan><tspan x="640.0" dy="16">dependientes determina el potencial de acción</tspan><tspan x="640.0" dy="16">neuronal?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ CANAL DOMINA CADA FASE DEL POTENCIAL DE ACCIÓN</tspan></text><rect x="40.0" y="309.0" width="300.0" height="54.0" rx="0" fill="#e0f2fe" stroke="#ffffff" stroke-width="2"/><rect x="40" y="309.0" width="300" height="54.0" fill="#b91c1c" opacity="0.22"/><text x="54.0" y="334.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Reposo: unos -70 mV</tspan></text><text x="54.0" y="350.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Bomba sodio-potasio</tspan></text><rect x="376.0" y="311.0" width="584.0" height="50.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="388.0" y="329.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Canales de fuga de potasio</tspan></text><text x="388.0" y="345.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Mantienen el potencial de membrana en reposo.</tspan></text><rect x="40.0" y="363.0" width="300.0" height="54.0" rx="0" fill="#fbd5c4" stroke="#ffffff" stroke-width="2"/><rect x="40" y="363.0" width="300" height="54.0" fill="#b91c1c" opacity="0.22"/><text x="54.0" y="388.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Despolarización rápida</tspan></text><text x="54.0" y="404.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Canales de sodio voltaje dependientes</tspan></text><text x="328.0" y="394.0" font-size="11" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="end" data-max="96"><tspan x="328.0" dy="0">◄ llega aquí</tspan></text><rect x="376.0" y="365.0" width="584.0" height="50.0" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="388.0" y="383.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Apertura explosiva hasta cerca de +30 mV</tspan></text><text x="388.0" y="399.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Define el potencial de acción; todo o nada tras el umbral de -55 mV.</tspan></text><rect x="40.0" y="417.0" width="300.0" height="54.0" rx="0" fill="#fbe38e" stroke="#ffffff" stroke-width="2"/><text x="54.0" y="442.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Repolarización</tspan></text><text x="54.0" y="458.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Canales de potasio</tspan></text><rect x="376.0" y="419.0" width="584.0" height="50.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="388.0" y="437.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Se abren más lento; los de sodio se inactivan</tspan></text><text x="388.0" y="453.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Hiperpolarización posterior y período refractario absoluto.</tspan></text><rect x="40.0" y="471.0" width="300.0" height="54.0" rx="0" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="54.0" y="496.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Presinapsis</tspan></text><text x="54.0" y="512.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="200"><tspan x="54.0" dy="0">Canales de calcio</tspan></text><rect x="376.0" y="473.0" width="584.0" height="50.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="388.0" y="491.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">Liberación del neurotransmisor</tspan></text><text x="388.0" y="507.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="388.0" dy="0">No intervienen en el disparo del potencial.</tspan></text><line x1="346.0" y1="315.0" x2="346.0" y2="519.0" stroke="#b91c1c" stroke-width="2.5" stroke-dasharray="4 4"/><line x1="346.0" y1="515.0" x2="346.0" y2="510.0" stroke="#b91c1c" stroke-width="2.2"/><polygon points="341.0,510.0 351.0,510.0 346.0,519.0" fill="#b91c1c"/><text x="376.0" y="303.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="584"><tspan x="376.0" dy="0">FASE Y CANAL</tspan></text><text x="40.0" y="303.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="300"><tspan x="40.0" dy="0">CAPAS (DE SUPERFICIAL A PROFUNDA)</tspan></text><rect x="868.3" y="354.0" width="63.5" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="900.0" y="369.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="900.0" dy="0">◆ SODIO</tspan></text><rect x="40.0" y="543.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="569.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Disparo del potencial de acción = canales de sodio</tspan></text><text x="60.0" y="588.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Calcio libera el transmisor; cloro estabiliza o inhibe; magnesio bloquea el receptor NMDA.</tspan></text><text x="40.0" y="655.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="665.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="687.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="687.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Magnesio</tspan></text><rect x="363.0" y="668.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="687.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Sodio</tspan></text><text x="585.0" y="687.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Calcio</tspan></text><text x="735.0" y="687.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Potasio</tspan></text><text x="885.0" y="687.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Cloro</tspan></text><rect x="40.0" y="702.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="702.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="731.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Canal que dispara el</tspan><tspan x="54.0" dy="16">potencial?</tspan></text><text x="285.0" y="723.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: bloquea el receptor</tspan><tspan x="285.0" dy="16">NMDA, no dispara el</tspan><tspan x="285.0" dy="16">potencial</tspan></text><text x="435.0" y="723.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: despolarización</tspan><tspan x="435.0" dy="16">rápida hasta cerca de</tspan><tspan x="435.0" dy="16">+30 mV</tspan></text><text x="585.0" y="731.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: libera el transmisor</tspan><tspan x="585.0" dy="16">en la presinapsis</tspan></text><text x="735.0" y="731.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: repolariza, más</tspan><tspan x="735.0" dy="16">lento</tspan></text><text x="885.0" y="739.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: estabiliza o inhibe</tspan></text><rect x="40.0" y="665.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="792.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="820.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="842.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Al llegar al umbral los canales de sodio se abren de forma explosiva: el sodio entra a favor de su gradiente y el potencial sube hasta unos +30 mV; la</tspan><tspan x="58.0" dy="18">   retroalimentación positiva explica la ley del todo o nada.</tspan><tspan x="58.0" dy="18">• Luego los canales de sodio se inactivan y los de potasio, más lentos, repolarizan e hiperpolarizan. El período refractario absoluto asegura la propagación</tspan><tspan x="58.0" dy="18">   unidireccional.</tspan><tspan x="58.0" dy="18">• En axones mielinizados la conducción es saltatoria, con canales de sodio concentrados en los nodos de Ranvier.</tspan><tspan x="58.0" dy="18">• Clínica: fenitoína, carbamazepina, lamotrigina y anestésicos locales bloquean estos canales. Los canales de calcio liberan el transmisor en la</tspan><tspan x="58.0" dy="18">   presinapsis.</tspan></text><text x="58.0" y="972.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Guyton y Hall, 14.ª ed. (2021); Katzung, 16.ª ed. (2024).</tspan></text></svg>