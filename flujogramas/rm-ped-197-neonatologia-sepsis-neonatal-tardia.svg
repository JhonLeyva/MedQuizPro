<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1164" viewBox="0 0 1000 1164" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Prematuro de 8 días con hipotermia, letargo, leucopenia y acidosis: sepsis neonatal tardía"><title>Prematuro de 8 días con hipotermia, letargo, leucopenia y acidosis: sepsis neonatal tardía</title><rect x="0.75" y="0.75" width="998.5" height="1162.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neonatología · sepsis neonatal tardía</tspan></text><rect x="420.1" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="469.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="469.1" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Sepsis neonatal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Reacción sistémica a una infección bacteriana en el primer mes de vida.</tspan><tspan x="58.0" dy="17">Se clasifica por el momento de inicio: temprana o tardía.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Prematuro de bajo peso, 8 días</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dificultad respiratoria, irritabilidad e hipotermia de 35,4</tspan><tspan x="640.0" dy="16">°C.</tspan><tspan x="640.0" dy="16">Letargo, llenado capilar lento, leucopenia con</tspan><tspan x="640.0" dy="16">desviación izquierda y acidosis metabólica.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EN QUÉ MOMENTO DE LA VIDA DEL RECIÉN NACIDO SE UBICA EL CASO</tspan></text><line x1="290.0" y1="323.0" x2="290.0" y2="441.0" stroke="#e2e8f0" stroke-width="1"/><text x="290.0" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="290.0" dy="0">0</tspan></text><line x1="398.3" y1="323.0" x2="398.3" y2="441.0" stroke="#e2e8f0" stroke-width="1"/><text x="398.3" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="398.3" dy="0">5</tspan></text><line x1="506.7" y1="323.0" x2="506.7" y2="441.0" stroke="#e2e8f0" stroke-width="1"/><text x="506.7" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="506.7" dy="0">10</tspan></text><line x1="615.0" y1="323.0" x2="615.0" y2="441.0" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="615.0" dy="0">15</tspan></text><line x1="723.3" y1="323.0" x2="723.3" y2="441.0" stroke="#e2e8f0" stroke-width="1"/><text x="723.3" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="723.3" dy="0">20</tspan></text><line x1="831.7" y1="323.0" x2="831.7" y2="441.0" stroke="#e2e8f0" stroke-width="1"/><text x="831.7" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="831.7" dy="0">25</tspan></text><line x1="940.0" y1="323.0" x2="940.0" y2="441.0" stroke="#e2e8f0" stroke-width="1"/><text x="940.0" y="319.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="940.0" dy="0">30</tspan></text><text x="940.0" y="305.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="end" data-max="60"><tspan x="940.0" dy="0">días</tspan></text><rect x="40.0" y="327.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="343.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Sepsis temprana</tspan></text><text x="48.0" y="358.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Primeras 72 horas, vertical</tspan></text><rect x="290.0" y="335.0" width="65.0" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="381.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Sepsis tardía</tspan></text><text x="48.0" y="396.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Nosocomial o comunitaria</tspan></text><rect x="355.0" y="373.0" width="585.0" height="22.0" rx="6" fill="#ea580c" stroke="none" stroke-width="1.5"/><rect x="40.0" y="403.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="419.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Displasia broncopulmonar</tspan></text><text x="48.0" y="434.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Oxígeno a los 28 días</tspan></text><rect x="896.7" y="411.0" width="43.3" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><line x1="463.3" y1="325.0" x2="463.3" y2="447.0" stroke="#b91c1c" stroke-width="2.6"/><rect x="420.7" y="447.0" width="85.3" height="22.0" rx="11" fill="#b91c1c" stroke="none" stroke-width="1.5"/><text x="463.3" y="462.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="463.3" dy="0">Caso: 8 días</tspan></text><rect x="40.0" y="493.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="519.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Prematuro de 8 días con sepsis = sepsis tardía</tspan></text><text x="60.0" y="538.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La temprana aparece en las primeras 72 horas; la displasia exige oxígeno prolongado.</tspan></text><text x="40.0" y="599.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SEPSIS NEONATAL TEMPRANA Y TARDÍA</tspan></text><rect x="40.0" y="611.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="630.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Tipo</tspan></text><text x="250.0" y="630.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="224"><tspan x="250.0" dy="0">Inicio</tspan></text><text x="490.0" y="630.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="224"><tspan x="490.0" dy="0">Origen</tspan></text><text x="730.0" y="630.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="224"><tspan x="730.0" dy="0">Gérmenes principales</tspan></text><rect x="40.0" y="640.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="659.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Temprana</tspan></text><text x="250.0" y="659.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="250.0" dy="0">Primeras 72 horas</tspan></text><text x="490.0" y="659.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="490.0" dy="0">Transmisión vertical</tspan></text><text x="730.0" y="659.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="730.0" dy="0">Estreptococo del grupo B y E. coli</tspan></text><rect x="40.0" y="669.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="688.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Tardía</tspan></text><text x="250.0" y="688.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="250.0" dy="0">Después de las 72 horas</tspan></text><text x="490.0" y="688.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="490.0" dy="0">Nosocomial o comunitaria</tspan></text><text x="730.0" y="688.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="224"><tspan x="730.0" dy="0">Coagulasa negativos, S. aureus,</tspan><tspan x="730.0" dy="15">gramnegativos y Candida</tspan></text><rect x="140.6" y="680.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="186.0" y="695.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="186.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="729.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Algunas normas fijan el límite en la primera semana: a los 8 días el caso es tardío con ambas definiciones.</tspan></text><text x="40.0" y="776.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="786.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="817.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="808.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Displasia</tspan><tspan x="285.0" dy="17">broncopulmonar</tspan></text><text x="435.0" y="817.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Neumonía connatal</tspan></text><text x="585.0" y="808.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Neumonía</tspan><tspan x="585.0" dy="17">aspirativa</tspan></text><rect x="663.0" y="789.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="808.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Sepsis neonatal</tspan><tspan x="735.0" dy="17">tardía</tspan></text><text x="885.0" y="808.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Sepsis neonatal</tspan><tspan x="885.0" dy="17">temprana</tspan></text><rect x="40.0" y="840.0" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="840.0" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="885.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico probable?</tspan></text><text x="285.0" y="869.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: requiere oxígeno</tspan><tspan x="285.0" dy="16">prolongado, no cursa</tspan><tspan x="285.0" dy="16">con leucopenia</tspan></text><text x="435.0" y="861.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: exige factor de</tspan><tspan x="435.0" dy="16">riesgo materno y</tspan><tspan x="435.0" dy="16">cuadro en las primeras</tspan><tspan x="435.0" dy="16">horas</tspan></text><text x="585.0" y="869.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: hay antecedente</tspan><tspan x="585.0" dy="16">de atragantamiento o</tspan><tspan x="585.0" dy="16">meconio</tspan></text><text x="735.0" y="869.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: prematuro de 8</tspan><tspan x="735.0" dy="16">días con signos</tspan><tspan x="735.0" dy="16">sistémicos</tspan></text><text x="885.0" y="877.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: se presenta en las</tspan><tspan x="885.0" dy="16">primeras 72 horas</tspan></text><rect x="40.0" y="786.0" width="920.0" height="136.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="946.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="974.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="996.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Temprana: primeras 72 horas (algunas normas, primera semana), por transmisión vertical, con estreptococo del grupo B y E. coli.</tspan><tspan x="58.0" dy="18">• Tardía: después de ese lapso, nosocomial o comunitaria, con estafilococos coagulasa negativos, S. aureus, gramnegativos y Candida, sobre todo con</tspan><tspan x="58.0" dy="18">   catéteres, ventilación y nutrición parenteral.</tspan><tspan x="58.0" dy="18">• A los 8 días hay sepsis tardía con cualquiera de las dos definiciones. El cuadro es inespecífico: inestabilidad térmica, dificultad respiratoria, letargo, mala</tspan><tspan x="58.0" dy="18">   perfusión y acidosis.</tspan><tspan x="58.0" dy="18">• Alerta: hemocultivo antes del antibiótico, punción lumbar si es posible y tratamiento empírico precoz; la hipotermia y el letargo son signos de gravedad.</tspan></text><text x="58.0" y="1108.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Puopolo KM et al. Management of neonates with suspected or proven early-onset bacterial sepsis. Pediatrics 2018;142:e20182894; MINSA, NTS 214-2024 (atención</tspan><tspan x="58.0" dy="15">integral del recién nacido); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>