<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="898" viewBox="0 0 1000 898" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Para estimular un trabajo de parto con dinámica inadecuada se diluyen 10 UI de oxitocina en 1 litro de solución salina (10 mUI/mL)"><title>Para estimular un trabajo de parto con dinámica inadecuada se diluyen 10 UI de oxitocina en 1 litro de solución salina (10 mUI/mL)</title><rect x="0.75" y="0.75" width="998.5" height="896.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Conducción del trabajo de parto · oxitocina</tspan></text><rect x="455.6" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="542.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="542.8" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Oxitocina en infusión</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La dilución estándar permite dosificar en miliunidades por minuto: 10 UI en 1000 mL = 10</tspan><tspan x="58.0" dy="17">mUI/mL.</tspan><tspan x="58.0" dy="17">Se empieza bajo y se sube de a poco hasta 3-5 contracciones en 10 minutos.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Centro de salud rural</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Trabajo de parto con dinámica uterina inadecuada.</tspan><tspan x="640.0" dy="16">¿Cuántas UI se diluyen en 1 litro?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL FRASCO A LA GOTA</tspan></text><rect x="40.0" y="269.0" width="170.0" height="110.0" rx="16" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="125.0" y="295.0" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="150"><tspan x="125.0" dy="0">DILUCIÓN</tspan></text><text x="125.0" y="331.0" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">10 UI</tspan></text><text x="125.0" y="353.0" font-size="11" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="146"><tspan x="125.0" dy="0">en 1000 mL de solución</tspan><tspan x="125.0" dy="15">salina</tspan></text><line x1="214.0" y1="324.0" x2="229.0" y2="324.0" stroke="#0f766e" stroke-width="2"/><polygon points="228.0,319.0 228.0,329.0 236.0,324.0" fill="#0f766e"/><rect x="240.0" y="269.0" width="213.3" height="110.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="346.7" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="197"><tspan x="346.7" dy="0">CONCENTRACIÓN</tspan></text><text x="346.7" y="325.0" font-size="22" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="197"><tspan x="346.7" dy="0">10 mUI/mL</tspan></text><text x="346.7" y="347.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="193"><tspan x="346.7" dy="0">10 000 mUI ÷ 1000 mL</tspan></text><text x="473.3" y="335.0" font-size="30" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="40"><tspan x="473.3" dy="0">→</tspan></text><rect x="493.3" y="269.0" width="213.3" height="110.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="600.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="197"><tspan x="600.0" dy="0">INICIO</tspan></text><text x="600.0" y="325.0" font-size="22" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="197"><tspan x="600.0" dy="0">2 mUI/min</tspan></text><text x="600.0" y="347.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="193"><tspan x="600.0" dy="0">= 12 mL/h ≈ 4 gotas/min</tspan></text><text x="726.7" y="335.0" font-size="30" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="40"><tspan x="726.7" dy="0">→</tspan></text><rect x="746.7" y="269.0" width="213.3" height="110.0" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="853.3" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="197"><tspan x="853.3" dy="0">SUBIR</tspan></text><text x="853.3" y="325.0" font-size="22" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="197"><tspan x="853.3" dy="0">+2 mUI/min</tspan></text><text x="853.3" y="347.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="193"><tspan x="853.3" dy="0">Cada 30-40 min hasta 3-5</tspan><tspan x="853.3" dy="15">contracciones/10 min</tspan></text><rect x="811.8" y="368.0" width="83.1" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="853.3" y="383.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="853.3" dy="0">◆ ESQUEMA</tspan></text><text x="44.0" y="415.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="44.0" dy="0">LAS ALTERNATIVAS</tspan></text><rect x="40.0" y="425.0" width="222.5" height="73.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="151.2" y="443.0" font-size="9.5" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="206"><tspan x="151.2" dy="0">✓ COINCIDE</tspan></text><text x="151.2" y="461.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="202"><tspan x="151.2" dy="0">10 UI</tspan></text><text x="151.2" y="478.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="202"><tspan x="151.2" dy="0">10 mUI/mL</tspan></text><rect x="272.5" y="425.0" width="222.5" height="73.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="383.8" y="443.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="206"><tspan x="383.8" dy="0">✗ NO</tspan></text><text x="383.8" y="461.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="202"><tspan x="383.8" dy="0">5 UI</tspan></text><text x="383.8" y="478.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="202"><tspan x="383.8" dy="0">La mitad</tspan></text><rect x="505.0" y="425.0" width="222.5" height="73.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="616.2" y="443.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="206"><tspan x="616.2" dy="0">✗ NO</tspan></text><text x="616.2" y="461.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="202"><tspan x="616.2" dy="0">20 UI</tspan></text><text x="616.2" y="478.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="202"><tspan x="616.2" dy="0">El doble</tspan></text><rect x="737.5" y="425.0" width="222.5" height="73.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="848.8" y="443.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="206"><tspan x="848.8" dy="0">✗ NO</tspan></text><text x="848.8" y="461.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="202"><tspan x="848.8" dy="0">30-40 UI</tspan></text><text x="848.8" y="478.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="202"><tspan x="848.8" dy="0">Muy concentrada</tspan></text><rect x="40.0" y="516.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="542.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">10 UI en 1 litro</tspan></text><text x="60.0" y="561.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Así 1 mL tiene 10 miliunidades: fácil de calcular en mUI/min.</tspan></text><text x="40.0" y="628.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="638.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="660.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="660.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">20</tspan></text><rect x="363.0" y="641.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="660.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">10</tspan></text><text x="585.0" y="660.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">30</tspan></text><text x="735.0" y="660.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">40</tspan></text><text x="885.0" y="660.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">5</tspan></text><rect x="40.0" y="675.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="675.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="704.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿UI en 1 L?</tspan></text><text x="285.0" y="696.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: el doble (20</tspan><tspan x="285.0" dy="16">mUI/mL)</tspan></text><text x="435.0" y="696.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: 10 mUI/mL,</tspan><tspan x="435.0" dy="16">estándar</tspan></text><text x="585.0" y="704.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: muy concentrada</tspan></text><text x="735.0" y="704.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: muy concentrada</tspan></text><text x="885.0" y="696.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: la mitad (5</tspan><tspan x="885.0" dy="16">mUI/mL)</tspan></text><rect x="40.0" y="638.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="749.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="777.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="799.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Inicio 1-2 mUI/min (6-12 mL/h ≈ 2-4 gotas/min con macrogotero) y subir 1-2 mUI/min cada 30-40 min; máximo ~20-40 mUI/min.</tspan><tspan x="58.0" dy="18">• Antes: descartar desproporción, presentación anómala y sufrimiento fetal; monitorear la FCF.</tspan><tspan x="58.0" dy="18">• Suspender si hay taquisistolia (&gt; 5 contracciones en 10 min) o alteración de la FCF.</tspan></text><text x="58.0" y="857.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, conducción del trabajo de parto (2014; act.); MINSA Perú, guía de atención del parto.</tspan></text></svg>