<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="913" viewBox="0 0 1000 913" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Taquicardia supraventricular con QRS estrecho que no cede con maniobras vagales: adenosina"><title>Taquicardia supraventricular con QRS estrecho que no cede con maniobras vagales: adenosina</title><rect x="0.75" y="0.75" width="998.5" height="911.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Arritmias · taquicardia por reentrada</tspan></text><rect x="415.3" y="32.0" width="117.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="474.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="101"><tspan x="474.0" dy="0">CARDIOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">TSV por reentrada intranodal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">QRS estrecho, regular y onda P retrógrada tras el QRS.</tspan><tspan x="58.0" dy="17">La más frecuente en mujeres jóvenes.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 30 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Palpitaciones, dolor precordial y ansiedad.</tspan><tspan x="640.0" dy="16">FC 210, QRS estrecho regular, sin mejoría tras las</tspan><tspan x="640.0" dy="16">maniobras vagales.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE ADMINISTRA LA ADENOSINA</tspan></text><rect x="40.0" y="285.0" width="170.0" height="93.0" rx="16" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="125.0" y="311.0" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="150"><tspan x="125.0" dy="0">PESO DEL CASO</tspan></text><text x="125.0" y="347.0" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Dosis fija</tspan></text><text x="125.0" y="369.0" font-size="11" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="146"><tspan x="125.0" dy="0">No depende del peso</tspan></text><line x1="214.0" y1="331.5" x2="229.0" y2="331.5" stroke="#0f766e" stroke-width="2"/><polygon points="228.0,326.5 228.0,336.5 236.0,331.5" fill="#0f766e"/><rect x="240.0" y="285.0" width="213.3" height="93.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="346.7" y="307.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="197"><tspan x="346.7" dy="0">1.ª DOSIS</tspan></text><text x="346.7" y="341.0" font-size="22" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="197"><tspan x="346.7" dy="0">6 mg</tspan></text><text x="346.7" y="363.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="193"><tspan x="346.7" dy="0">Bolo rápido IV</tspan></text><text x="473.3" y="342.5" font-size="30" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="40"><tspan x="473.3" dy="0">×</tspan></text><rect x="493.3" y="285.0" width="213.3" height="93.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="600.0" y="307.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="197"><tspan x="600.0" dy="0">LAVADO</tspan></text><text x="600.0" y="341.0" font-size="22" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="197"><tspan x="600.0" dy="0">20 mL</tspan></text><text x="600.0" y="363.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="193"><tspan x="600.0" dy="0">Solución salina inmediata</tspan></text><text x="726.7" y="342.5" font-size="30" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="40"><tspan x="726.7" dy="0">=</tspan></text><rect x="746.7" y="285.0" width="213.3" height="93.0" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="853.3" y="307.0" font-size="10.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="197"><tspan x="853.3" dy="0">2.ª DOSIS</tspan></text><text x="853.3" y="341.0" font-size="22" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="197"><tspan x="853.3" dy="0">12 mg</tspan></text><text x="853.3" y="363.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="193"><tspan x="853.3" dy="0">Si no cede en 1-2 min</tspan></text><rect x="793.2" y="367.0" width="120.4" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="853.3" y="382.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="853.3" dy="0">◆ DOSIS DEL CASO</tspan></text><text x="44.0" y="414.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="44.0" dy="0">CADA ALTERNATIVA CONTRA EL CÁLCULO</tspan></text><rect x="40.0" y="424.0" width="222.5" height="73.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="151.2" y="442.0" font-size="9.5" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="206"><tspan x="151.2" dy="0">✓ COINCIDE</tspan></text><text x="151.2" y="460.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="202"><tspan x="151.2" dy="0">Adenosina 6 mg y luego 12 mg</tspan></text><text x="151.2" y="477.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="202"><tspan x="151.2" dy="0">Elección</tspan></text><rect x="272.5" y="424.0" width="222.5" height="73.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="383.8" y="442.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="206"><tspan x="383.8" dy="0">✗ NO</tspan></text><text x="383.8" y="460.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="202"><tspan x="383.8" dy="0">Metoprolol IV</tspan></text><text x="383.8" y="477.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="202"><tspan x="383.8" dy="0">Segunda línea</tspan></text><rect x="505.0" y="424.0" width="222.5" height="73.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="616.2" y="442.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="206"><tspan x="616.2" dy="0">✗ NO</tspan></text><text x="616.2" y="460.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="202"><tspan x="616.2" dy="0">Amiodarona</tspan></text><text x="616.2" y="477.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="202"><tspan x="616.2" dy="0">Último recurso</tspan></text><rect x="737.5" y="424.0" width="222.5" height="73.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="848.8" y="442.0" font-size="9.5" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="206"><tspan x="848.8" dy="0">✗ NO</tspan></text><text x="848.8" y="460.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="202"><tspan x="848.8" dy="0">Digoxina</tspan></text><text x="848.8" y="477.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="202"><tspan x="848.8" dy="0">Inicio lento</tspan></text><rect x="40.0" y="515.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="541.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Adenosina en bolo rápido</tspan></text><text x="60.0" y="560.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Efectos breves: rubor, opresión torácica y pausa.</tspan></text><text x="40.0" y="627.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="637.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="659.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="659.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Metoprolol</tspan></text><text x="435.0" y="659.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Lanatósido</tspan></text><rect x="513.0" y="640.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="659.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Adenosina</tspan></text><text x="735.0" y="659.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Amiodarona</tspan></text><text x="885.0" y="659.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Verapamilo</tspan></text><rect x="40.0" y="674.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="674.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="711.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Fármaco?</tspan></text><text x="285.0" y="695.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es un</tspan><tspan x="285.0" dy="16">betabloqueante de</tspan><tspan x="285.0" dy="16">segunda línea</tspan></text><text x="435.0" y="703.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: digital, no de</tspan><tspan x="435.0" dy="16">elección</tspan></text><text x="585.0" y="703.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: bloquea el nodo AV</tspan><tspan x="585.0" dy="16">un instante</tspan></text><text x="735.0" y="711.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: último recurso</tspan></text><text x="885.0" y="703.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: calcioantagonista</tspan><tspan x="885.0" dy="16">de segunda línea</tspan></text><rect x="40.0" y="637.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="764.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="792.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="814.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Adenosina: bolo rápido de 6 mg y, si no cede, 12 mg, seguidos de lavado salino; revierte &gt; 90 %.</tspan><tspan x="58.0" dy="18">• Si falla: verapamilo, diltiazem o betabloqueante. Inestable: cardioversión sincronizada.</tspan><tspan x="58.0" dy="18">• Contraindicada en asma grave y en fibrilación auricular preexcitada. Ablación con catéter: curativa en &gt; 95 %.</tspan></text><text x="58.0" y="872.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AHA/ACC/HRS, taquicardia supraventricular (2015); ESC, taquicardia supraventricular (2019); AHA, SVCA (actualización 2025)</tspan></text></svg>