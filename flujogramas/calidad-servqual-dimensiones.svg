dle" data-max="272"><tspan x="810.0" dy="0">EMPATÍA</tspan></text><text x="810.0" y="492.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Atención individual</tspan></text><text x="40.0" y="605.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="617.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="641.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Encuesta SERVQUAL</tspan></text><line x1="248.5" y1="637.5" x2="267.5" y2="637.5" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,632.5 266.5,642.5 274.5,637.5" fill="#0f766e"/><rect x="278.5" y="617.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="641.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Expectativa vs percepción</tspan></text><line x1="487.0" y1="637.5" x2="506.0" y2="637.5" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,632.5 505.0,642.5 513.0,637.5" fill="#0f766e"/><rect x="517.0" y="617.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="641.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Brecha por dimensión</tspan></text><line x1="725.5" y1="637.5" x2="744.5" y2="637.5" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,632.5 743.5,642.5 751.5,637.5" fill="#0f766e"/><rect x="755.5" y="617.0" width="204.5" height="41.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="641.5" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Plan de mejora</tspan></text><text x="40.0" y="698.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="708.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="739.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="730.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Rapidez en la</tspan><tspan x="285.0" dy="17">atención</tspan></text><text x="435.0" y="739.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Confiabilidad</tspan></text><rect x="513.0" y="711.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="739.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Aspectos tangibles</tspan></text><text x="735.0" y="739.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Seguridad</tspan></text><text x="885.0" y="739.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Empatía</tspan></text><rect x="40.0" y="762.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="762.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="791.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Dimensión?</tspan></text><text x="285.0" y="783.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es atender a</tspan><tspan x="285.0" dy="16">tiempo</tspan></text><text x="435.0" y="783.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es cumplir lo</tspan><tspan x="435.0" dy="16">prometido</tspan></text><text x="585.0" y="783.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: lo que se ve y se</tspan><tspan x="585.0" dy="16">usa</tspan></text><text x="735.0" y="783.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: confianza y</tspan><tspan x="735.0" dy="16">competencia</tspan></text><text x="885.0" y="783.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: atención</tspan><tspan x="885.0" dy="16">personalizada</tspan></text><rect x="40.0" y="708.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="836.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="864.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="886.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Tangibles: lo que se ve (limpieza, equipos, señalización, apariencia del personal).</tspan><tspan x="58.0" dy="18">• Fiabilidad: cumplir lo prometido; seguridad: confianza y competencia; empatía: atención personalizada.</tspan><tspan x="58.0" dy="18">• La quinta dimensión es la prontitud de la atención.</tspan></text><text x="58.0" y="944.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA Perú, guía técnica de evaluación de la satisfacción del usuario externo (RM 527-2011); Parasuraman, Zeithaml y Berry (1988).</tspan></text></svg>