<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1171" viewBox="0 0 1000 1171" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Cerca de dos tercios del hierro del organismo están en la hemoglobina"><title>Cerca de dos tercios del hierro del organismo están en la hemoglobina</title><rect x="0.75" y="0.75" width="998.5" height="1169.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Hematología · metabolismo del hierro</tspan></text><rect x="422.1" y="32.0" width="120.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="482.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="104"><tspan x="482.4" dy="0">HEMATOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hierro corporal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El adulto tiene 3 a 4 g de hierro.</tspan><tspan x="58.0" dy="17">Casi todo se recicla; se pierden solo 1-2 mg al día.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de distribución</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿En qué forma se encuentra la mayor parte del hierro</tspan><tspan x="640.0" dy="16">del organismo?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">COMPARTIMENTOS DEL HIERRO, DEL MAYOR AL MENOR</tspan></text><polygon points="200.0,269.0 300.0,269.0 340.0,325.0 160.0,325.0" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="302.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="88"><tspan x="250.0" dy="0">1</tspan></text><rect x="486.0" y="269.0" width="474.0" height="56.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="501.0" y="293.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Hemoglobina</tspan></text><text x="501.0" y="310.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Dos tercios a tres cuartos del hierro; compartimento funcional del eritrocito</tspan></text><rect x="858.2" y="258.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="903.6" y="273.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="903.6" dy="0">◆ ESTE CASO</tspan></text><polygon points="160.0,331.0 340.0,331.0 380.0,387.0 120.0,387.0" fill="#99f6e4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="364.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="168"><tspan x="250.0" dy="0">2</tspan></text><rect x="486.0" y="331.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="355.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Depósitos: ferritina y hemosiderina</tspan></text><text x="501.0" y="372.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">15-30 %; hígado, bazo y médula ósea</tspan></text><polygon points="120.0,393.0 380.0,393.0 420.0,449.0 80.0,449.0" fill="#5eead4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="426.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="248"><tspan x="250.0" dy="0">3</tspan></text><rect x="486.0" y="393.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="417.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Mioglobina</tspan></text><text x="501.0" y="434.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Cerca de 5 %; músculo</tspan></text><polygon points="80.0,455.0 420.0,455.0 460.0,511.0 40.0,511.0" fill="#2dd4bf" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="488.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="328"><tspan x="250.0" dy="0">4</tspan></text><rect x="486.0" y="455.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="479.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Enzimas y transferrina</tspan></text><text x="501.0" y="496.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Citocromos, catalasa; transferrina con solo 3-4 mg</tspan></text><text x="250.0" y="529.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="420"><tspan x="250.0" dy="0">▲ más hierro · ▼ menos hierro</tspan></text><rect x="40.0" y="551.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="577.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Mayor parte del hierro = hemoglobina</tspan></text><text x="60.0" y="596.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Ferritina y hemosiderina son depósitos; la apoferritina no contiene hierro.</tspan></text><text x="40.0" y="657.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">FORMAS DE HIERRO Y SU PAPEL</tspan></text><rect x="40.0" y="669.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="688.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Forma</tspan></text><text x="260.0" y="688.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Función</tspan></text><text x="615.0" y="688.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Dónde está</tspan></text><rect x="40.0" y="698.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="717.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Hemoglobina</tspan></text><text x="260.0" y="717.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Funcional: transporta oxígeno</tspan></text><text x="615.0" y="717.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Eritrocitos; dos tercios a tres cuartos</tspan></text><rect x="150.6" y="701.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="196.0" y="716.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="196.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="727.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="746.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Ferritina</tspan></text><text x="260.0" y="746.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Depósito soluble</tspan></text><text x="615.0" y="746.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Hígado, bazo y médula</tspan></text><rect x="40.0" y="756.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="775.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Hemosiderina</tspan></text><text x="260.0" y="775.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Depósito insoluble</tspan></text><text x="615.0" y="775.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Lisosomas; se ve con tinción de Perls</tspan></text><rect x="40.0" y="785.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="804.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Mioglobina</tspan></text><text x="260.0" y="804.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Funcional muscular</tspan></text><text x="615.0" y="804.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Músculo; cerca de 5 %</tspan></text><rect x="40.0" y="814.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="833.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Apoferritina</tspan></text><text x="260.0" y="833.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">No es una forma de hierro</tspan></text><text x="615.0" y="833.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Ferritina sin hierro</tspan></text><text x="40.0" y="883.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="893.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="915.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="915.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hemosiderina</tspan></text><text x="435.0" y="915.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Mioglobina</tspan></text><text x="585.0" y="915.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Ferritina</tspan></text><rect x="663.0" y="896.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="915.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hemoglobina</tspan></text><text x="885.0" y="915.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Apoferritina</tspan></text><rect x="40.0" y="930.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="930.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="951.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Dónde está la mayor</tspan><tspan x="54.0" dy="16">parte del hierro?</tspan></text><text x="285.0" y="951.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: depósito insoluble,</tspan><tspan x="285.0" dy="16">15-30 % con la ferritina</tspan></text><text x="435.0" y="959.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: cerca de 5 %</tspan></text><text x="585.0" y="951.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: depósito soluble,</tspan><tspan x="585.0" dy="16">15-30 %</tspan></text><text x="735.0" y="951.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: dos tercios a tres</tspan><tspan x="735.0" dy="16">cuartos del hierro</tspan></text><text x="885.0" y="951.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es ferritina sin</tspan><tspan x="885.0" dy="16">hierro</tspan></text><rect x="40.0" y="893.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1004.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1032.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1054.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Hemoglobina: dos tercios a tres cuartos del hierro (cerca de 1 mg por mL de eritrocitos); los macrófagos reciclan los eritrocitos viejos.</tspan><tspan x="58.0" dy="18">• Depósitos de ferritina y hemosiderina (hígado, bazo, médula): 15-30 %; mioglobina: cerca de 5 %; transferrina: 3-4 mg.</tspan><tspan x="58.0" dy="18">• La ferritina es el depósito soluble; la hemosiderina, su forma insoluble visible con tinción de Perls. La apoferritina no tiene hierro.</tspan><tspan x="58.0" dy="18">• No hay excreción activa: el hierro se regula por la absorción duodenal, controlada por la hepcidina. Hemólisis o transfusión repetida causan sobrecarga.</tspan></text><text x="58.0" y="1130.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Camaschella, Iron-deficiency anemia (N Engl J Med 2015;372:1832); Harrison, Principios de Medicina Interna, 21.ª ed. (2022); Guyton y Hall, 14.ª ed. (2021).</tspan></text></svg>