<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1057" viewBox="0 0 1000 1057" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Fiebre, útero doloroso y loquios fétidos al tercer día tras cesárea: endometritis puerperal"><title>Fiebre, útero doloroso y loquios fétidos al tercer día tras cesárea: endometritis puerperal</title><rect x="0.75" y="0.75" width="998.5" height="1055.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Puerperio · endometritis</tspan></text><rect x="344.2" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="424.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="424.0" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Endometritis puerperal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección del endometrio y del miometrio tras el parto; causa más frecuente de fiebre</tspan><tspan x="58.0" dy="17">puerperal.</tspan><tspan x="58.0" dy="17">Polimicrobiana: anaerobios, gramnegativos, estreptococos y enterococos.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 20 años, cesárea por inducción fallida</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Tercer día de puerperio: malestar y fiebre de 39 °C.</tspan><tspan x="640.0" dy="16">Útero subinvolucionado y doloroso, con loquios fétidos.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CUÁNDO APARECE, CÓMO SE CONFIRMA Y CÓMO SE TRATA</tspan></text><rect x="42.0" y="279.0" width="302.7" height="56.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="193.3" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">DÍA 2 A 5</tspan></text><text x="193.3" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">Aparición del cuadro</tspan></text><rect x="348.7" y="279.0" width="302.7" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="500.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">AL DIAGNÓSTICO</tspan></text><text x="500.0" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">Es clínico</tspan></text><rect x="655.3" y="279.0" width="302.7" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="806.7" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">MÁS DE 72 HORAS CON FIEBRE</tspan></text><text x="806.7" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">Mala evolución</tspan></text><rect x="147.9" y="268.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="193.3" y="283.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="193.3" dy="0">◆ ESTE CASO</tspan></text><rect x="48.0" y="349.0" width="290.7" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="193.3" y="377.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">CLÍNICA</tspan></text><text x="193.3" y="401.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">Fiebre, malestar y dolor uterino</tspan><tspan x="193.3" dy="17">Subinvolución, loquios fétidos</tspan></text><rect x="354.7" y="349.0" width="290.7" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="377.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">TRATAMIENTO</tspan></text><text x="500.0" y="401.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">Clindamicina más gentamicina IV</tspan><tspan x="500.0" dy="17">Hasta 24-48 horas sin fiebre</tspan></text><rect x="661.3" y="349.0" width="290.7" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="806.7" y="377.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">BUSCAR</tspan></text><text x="806.7" y="401.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">Agregar ampicilina por el enterococo</tspan><tspan x="806.7" dy="17">Absceso, hematoma o tromboflebitis séptica</tspan></text><text x="40.0" y="474.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CAUSAS DE FIEBRE O LOQUIOS ANORMALES EN EL PUERPERIO</tspan></text><rect x="40.0" y="486.2" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="505.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Causa</tspan></text><text x="280.0" y="505.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="674"><tspan x="280.0" dy="0">Datos que la distinguen</tspan></text><rect x="40.0" y="515.2" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="534.2" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Endometritis puerperal</tspan></text><text x="280.0" y="534.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="674"><tspan x="280.0" dy="0">Segundo a quinto día: fiebre, útero doloroso y subinvolucionado, loquios fétidos</tspan></text><rect x="170.6" y="518.7" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="216.0" y="533.7" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="216.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="544.2" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="563.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Absceso de pared abdominal</tspan></text><text x="280.0" y="563.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="674"><tspan x="280.0" dy="0">Eritema y secreción en la herida quirúrgica</tspan></text><rect x="40.0" y="573.2" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="592.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Retención de restos placentarios</tspan></text><text x="280.0" y="592.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="674"><tspan x="280.0" dy="0">Sangrado y loquios persistentes</tspan></text><rect x="40.0" y="602.2" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="621.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Dehiscencia de la histerorrafia</tspan></text><text x="280.0" y="621.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="674"><tspan x="280.0" dy="0">Poco frecuente: dolor y sepsis</tspan></text><rect x="40.0" y="631.2" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="650.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Degeneración de un mioma</tspan></text><text x="280.0" y="650.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="674"><tspan x="280.0" dy="0">Dolor sin loquios fétidos</tspan></text><text x="40.0" y="700.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="710.2" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="741.2" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="732.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Dehiscencia de la</tspan><tspan x="285.0" dy="17">histerorrafia</tspan></text><rect x="363.0" y="713.2" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="732.7" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Endometritis</tspan><tspan x="435.0" dy="17">puerperal</tspan></text><text x="585.0" y="732.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Absceso de pared</tspan><tspan x="585.0" dy="17">abdominal</tspan></text><text x="735.0" y="732.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Retención de restos</tspan><tspan x="735.0" dy="17">placentarios</tspan></text><text x="885.0" y="732.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Necrosis isquémica</tspan><tspan x="885.0" dy="17">de mioma uterino</tspan></text><rect x="40.0" y="764.2" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="764.2" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="801.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="793.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es rara y cursa con</tspan><tspan x="285.0" dy="16">dolor y sepsis</tspan></text><text x="435.0" y="785.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: fiebre, útero</tspan><tspan x="435.0" dy="16">doloroso y loquios</tspan><tspan x="435.0" dy="16">fétidos</tspan></text><text x="585.0" y="793.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: da eritema y</tspan><tspan x="585.0" dy="16">secreción en la herida</tspan></text><text x="735.0" y="793.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: causa sangrado y</tspan><tspan x="735.0" dy="16">loquios persistentes</tspan></text><text x="885.0" y="793.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no da loquios</tspan><tspan x="885.0" dy="16">fétidos</tspan></text><rect x="40.0" y="710.2" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="854.2" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="882.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="904.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Factor de riesgo principal: la cesárea; también rotura prolongada de membranas, trabajo de parto largo, múltiples tactos y colonización por estreptococo</tspan><tspan x="58.0" dy="18">   del grupo B.</tspan><tspan x="58.0" dy="18">• Cuadro típico entre el segundo y el quinto día: fiebre, malestar, dolor uterino, loquios fétidos y subinvolución. Diagnóstico clínico.</tspan><tspan x="58.0" dy="18">• Tratamiento: clindamicina 900 mg más gentamicina por vía IV cada 8 horas hasta 24-48 horas sin fiebre; si no mejora, agregar ampicilina para el</tspan><tspan x="58.0" dy="18">   enterococo.</tspan><tspan x="58.0" dy="18">• Alerta: fiebre más de 72 horas con tratamiento obliga a buscar absceso pelviano, hematoma o tromboflebitis pélvica séptica.</tspan></text><text x="58.0" y="1016.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, Practice Bulletin 199 (Obstet Gynecol 2018); Williams Obstetricia, 26.ª ed. (2022)</tspan></text></svg>