<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1156" viewBox="0 0 1000 1156" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Glasgow de 8 o menos: el lactante con ojos al dolor, llanto agitado y extensión anormal requiere intubación y PIC"><title>Glasgow de 8 o menos: el lactante con ojos al dolor, llanto agitado y extensión anormal requiere intubación y PIC</title><rect x="0.75" y="0.75" width="998.5" height="1154.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · Glasgow pediátrico</tspan></text><rect x="378.4" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="427.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="427.4" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Escala de Glasgow pediátrica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Suma ojos (1-4), verbal (1-5) y motor (1-6); va de 3 a 15.</tspan><tspan x="58.0" dy="17">En el menor de un año se adapta la parte verbal y motora.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Cuatro niños con alteración de conciencia</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Quién tiene Glasgow de 8 o menos?</tspan><tspan x="640.0" dy="16">Ese niño no protege la vía aérea.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PUNTAJE DE GLASGOW DEL LACTANTE DE LA OPCIÓN A</tspan></text><rect x="40.0" y="269.0" width="540.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="56.0" y="291.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="start" data-max="430"><tspan x="56.0" dy="0">DOMINIO DEL GLASGOW</tspan></text><text x="562.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">PUNTOS</tspan></text><rect x="40.0" y="303.0" width="540.0" height="34.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="310.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="325.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="324.5" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="420"><tspan x="86.0" dy="0">Apertura ocular: al dolor</tspan></text><text x="562.0" y="325.0" font-size="13" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">2</tspan></text><rect x="40.0" y="337.0" width="540.0" height="34.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="344.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="359.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="358.5" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="420"><tspan x="86.0" dy="0">Verbal: llanto agitado (2 a 3)</tspan></text><text x="562.0" y="359.0" font-size="13" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">2</tspan></text><rect x="40.0" y="371.0" width="540.0" height="34.0" rx="0" fill="#f0fdfa" stroke="#e2e8f0" stroke-width="1"/><rect x="54.0" y="378.0" width="20.0" height="20.0" rx="5" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="64.0" y="393.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="64.0" dy="0">✓</tspan></text><text x="86.0" y="392.5" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="420"><tspan x="86.0" dy="0">Motor: extensión anormal</tspan></text><text x="562.0" y="393.0" font-size="13" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">2</tspan></text><rect x="40.0" y="405.0" width="540.0" height="40.0" rx="0" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="56.0" y="430.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="430"><tspan x="56.0" dy="0">Puntaje aproximado</tspan></text><text x="562.0" y="431.0" font-size="16" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="end" data-max="90"><tspan x="562.0" dy="0">6</tspan></text><rect x="40.0" y="269.0" width="540.0" height="176.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="664.0" cy="319.0" r="46" fill="#f0fdfa" stroke="#0f766e" stroke-width="3"/><text x="664.0" y="319.0" font-size="26" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="0"><tspan x="664.0" dy="0">6</tspan></text><text x="664.0" y="339.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="664.0" dy="0">de 15</tspan></text><text x="724.0" y="305.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="230"><tspan x="724.0" dy="0">INTERPRETACIÓN</tspan></text><text x="724.0" y="325.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="230"><tspan x="724.0" dy="0">8 o menos: intubación, ventilación</tspan><tspan x="724.0" dy="17">y monitoreo de la PIC</tspan></text><rect x="634.0" y="381.0" width="326.0" height="64.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><rect x="634.0" y="381.0" width="10.0" height="64.0" rx="4" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="656.0" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="100"><tspan x="656.0" dy="0">3-8</tspan></text><text x="760.0" y="403.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Grave</tspan></text><text x="760.0" y="421.0" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">No protege la vía aérea: intubar,</tspan><tspan x="760.0" dy="15">ventilar y monitorizar la PIC.</tspan></text><polygon points="614.0,404.0 614.0,422.0 630.0,413.0" fill="#f59e0b"/><rect x="852.6" y="370.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="898.0" y="385.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="898.0" dy="0">◆ ESTE CASO</tspan></text><rect x="634.0" y="453.0" width="326.0" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="634.0" y="453.0" width="10.0" height="64.0" rx="4" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="656.0" y="475.0" font-size="12" font-weight="800" font-style="normal" fill="#f59e0b" text-anchor="start" data-max="100"><tspan x="656.0" dy="0">9-12</tspan></text><text x="760.0" y="475.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Moderado</tspan></text><text x="760.0" y="493.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Observación estrecha y tomografía;</tspan><tspan x="760.0" dy="15">repetir si el puntaje baja.</tspan></text><rect x="634.0" y="525.0" width="326.0" height="52.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="634.0" y="525.0" width="10.0" height="52.0" rx="4" fill="#f97316" stroke="none" stroke-width="1.5"/><text x="656.0" y="547.0" font-size="12" font-weight="800" font-style="normal" fill="#f97316" text-anchor="start" data-max="100"><tspan x="656.0" dy="0">13-15</tspan></text><text x="760.0" y="547.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Leve</tspan></text><text x="760.0" y="565.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="190"><tspan x="760.0" dy="0">Vigilancia y reevaluación seriada.</tspan></text><text x="40.0" y="611.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">GRAVEDAD DEL TRAUMA CRANEOENCEFÁLICO SEGÚN EL GLASGOW</tspan></text><rect x="40.0" y="623.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="642.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="174"><tspan x="50.0" dy="0">Glasgow</tspan></text><text x="240.0" y="642.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="349"><tspan x="240.0" dy="0">Gravedad</tspan></text><text x="605.0" y="642.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="349"><tspan x="605.0" dy="0">Conducta</tspan></text><rect x="40.0" y="652.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="671.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="174"><tspan x="50.0" dy="0">13 a 15</tspan></text><text x="240.0" y="671.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="349"><tspan x="240.0" dy="0">Leve</tspan></text><text x="605.0" y="671.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="349"><tspan x="605.0" dy="0">Observación y reevaluación</tspan></text><rect x="40.0" y="681.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="700.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="174"><tspan x="50.0" dy="0">9 a 12</tspan></text><text x="240.0" y="700.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="349"><tspan x="240.0" dy="0">Moderado</tspan></text><text x="605.0" y="700.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="349"><tspan x="605.0" dy="0">Tomografía y vigilancia estrecha</tspan></text><rect x="40.0" y="710.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="729.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="174"><tspan x="50.0" dy="0">8 o menos</tspan></text><text x="240.0" y="729.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="349"><tspan x="240.0" dy="0">Grave</tspan></text><text x="605.0" y="729.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="349"><tspan x="605.0" dy="0">Intubación, ventilación mecánica y monitoreo de la presión</tspan><tspan x="605.0" dy="15">intracraneal</tspan></text><rect x="130.6" y="721.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="176.0" y="736.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="176.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="770.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Clave del banco: opción A; el puntaje depende de cómo se puntúe «agitado».</tspan></text><text x="40.0" y="817.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="827.0" width="920.0" height="88.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="875.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="830.0" width="144.0" height="82.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="858.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Lactante de 10</tspan><tspan x="285.0" dy="17">meses: ojos al</tspan><tspan x="285.0" dy="17">dolor, extensión</tspan></text><text x="435.0" y="858.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Niña de 6 años: voz,</tspan><tspan x="435.0" dy="17">incomprensible,</tspan><tspan x="435.0" dy="17">retira</tspan></text><text x="585.0" y="858.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Niño de 13 años:</tspan><tspan x="585.0" dy="17">dolor, palabras,</tspan><tspan x="585.0" dy="17">localiza</tspan></text><text x="735.0" y="849.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Lactante de 8</tspan><tspan x="735.0" dy="17">meses: voz,</tspan><tspan x="735.0" dy="17">inconsolable,</tspan><tspan x="735.0" dy="17">flexión</tspan></text><text x="885.0" y="866.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Niña de 4 años: voz,</tspan><tspan x="885.0" dy="17">palabras, flexión</tspan></text><rect x="40.0" y="915.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="915.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="936.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Requiere ventilación y</tspan><tspan x="54.0" dy="16">monitoreo de PIC?</tspan></text><text x="285.0" y="936.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: suma cerca de 6,</tspan><tspan x="285.0" dy="16">es grave</tspan></text><text x="435.0" y="936.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: suma 9 o 10,</tspan><tspan x="435.0" dy="16">moderado</tspan></text><text x="585.0" y="936.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: suma 9 o 10,</tspan><tspan x="585.0" dy="16">moderado</tspan></text><text x="735.0" y="936.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: suma 9 o 10,</tspan><tspan x="735.0" dy="16">moderado</tspan></text><text x="885.0" y="936.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: suma 9 o 10,</tspan><tspan x="885.0" dy="16">moderado</tspan></text><rect x="40.0" y="827.0" width="920.0" height="138.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="989.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1017.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1039.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Gravedad: 13 a 15 leve, 9 a 12 moderado y 8 o menos grave. Con 8 o menos se intuba, se ventila y se monitoriza la presión intracraneal.</tspan><tspan x="58.0" dy="18">• Lactante de la opción A: ojos al dolor (2) + llanto agitado (2 a 3) + extensión anormal (2) = cerca de 6; los demás suman 9 o 10.</tspan><tspan x="58.0" dy="18">• Lactante: balbucea (5), llanto consolable (4), persistente (3), gruñe (2). La extensión anormal (descerebración) sugiere herniación o lesión del tronco.</tspan><tspan x="58.0" dy="18">• Alerta: un descenso de 2 o más puntos en el Glasgow motor obliga a repetir la tomografía y a asegurar la vía aérea.</tspan></text><text x="58.0" y="1115.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ATLS, 10.ª ed. (American College of Surgeons, 2018); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>