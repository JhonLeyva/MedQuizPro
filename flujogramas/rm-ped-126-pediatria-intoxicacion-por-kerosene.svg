<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1057" viewBox="0 0 1000 1057" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La complicación más frecuente de la intoxicación por kerosene es la neumonitis química"><title>La complicación más frecuente de la intoxicación por kerosene es la neumonitis química</title><rect x="0.75" y="0.75" width="998.5" height="1055.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · intoxicación por kerosene</tspan></text><rect x="417.4" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="466.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="466.4" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hidrocarburos alifáticos</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Baja viscosidad y alta volatilidad: ingeridos por preescolares cuando se guardan en botellas</tspan><tspan x="58.0" dy="17">de bebidas.</tspan><tspan x="58.0" dy="17">Se absorben poco por el tubo digestivo.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">En un niño con intoxicación por kerosene, ¿cuál es la</tspan><tspan x="640.0" dy="16">complicación más frecuente?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EVOLUCIÓN DEL NIÑO QUE INGIERE KEROSENE</tspan></text><rect x="42.0" y="279.0" width="302.7" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="193.3" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">PRIMEROS MINUTOS</tspan></text><text x="193.3" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">Aspiración</tspan></text><rect x="348.7" y="279.0" width="302.7" height="56.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="500.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">PRIMERAS 6 A 12 HORAS</tspan></text><text x="500.0" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">Neumonitis química</tspan></text><rect x="655.3" y="279.0" width="302.7" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="806.7" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">OBSERVACIÓN DE 6 HORAS</tspan></text><text x="806.7" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">Decisión</tspan></text><rect x="454.6" y="268.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="500.0" y="283.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">◆ ESTE CASO</tspan></text><rect x="48.0" y="349.0" width="290.7" height="108.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="193.3" y="386.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">BAJA TENSIÓN SUPERFICIAL</tspan></text><text x="193.3" y="410.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">Pasa a la vía aérea al deglutir o vomitar</tspan><tspan x="193.3" dy="17">Inactiva el surfactante</tspan></text><rect x="354.7" y="349.0" width="290.7" height="108.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="386.3" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">COMPLICACIÓN MÁS FRECUENTE</tspan></text><text x="500.0" y="410.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">Tos, taquipnea, sibilancias y fiebre</tspan><tspan x="500.0" dy="17">Infiltrados basales en la radiografía</tspan></text><rect x="661.3" y="349.0" width="290.7" height="108.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="806.7" y="377.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">SOPORTE Y VIGILANCIA</tspan></text><text x="806.7" y="401.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">Sin vómito inducido, lavado, corticoides ni</tspan><tspan x="806.7" dy="17">antibióticos profilácticos</tspan><tspan x="806.7" dy="17">Asintomático y radiografía normal: alta</tspan></text><text x="40.0" y="491.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">COMPLICACIONES DE LA INTOXICACIÓN POR KEROSENE</tspan></text><rect x="40.0" y="503.2" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="522.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="264"><tspan x="50.0" dy="0">Complicación</tspan></text><text x="330.0" y="522.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="304"><tspan x="330.0" dy="0">Frecuencia y mecanismo</tspan></text><text x="650.0" y="522.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="304"><tspan x="650.0" dy="0">Nota</tspan></text><rect x="40.0" y="532.2" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="551.2" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="264"><tspan x="50.0" dy="0">Neumonitis química</tspan></text><text x="330.0" y="551.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="330.0" dy="0">La más frecuente: aspiración y pérdida de surfactante</tspan></text><text x="650.0" y="551.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="650.0" dy="0">Principal causa de morbilidad</tspan></text><rect x="220.6" y="535.7" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="266.0" y="550.7" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="266.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="561.2" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="580.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="264"><tspan x="50.0" dy="0">Neumonía bacteriana</tspan></text><text x="330.0" y="580.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="330.0" dy="0">Sobreinfección tardía</tspan></text><text x="650.0" y="580.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="650.0" dy="0">Menos frecuente</tspan></text><rect x="40.0" y="590.2" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="609.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="264"><tspan x="50.0" dy="0">Neumatocele</tspan></text><text x="330.0" y="609.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="330.0" dy="0">Secuela ocasional</tspan></text><text x="650.0" y="609.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="650.0" dy="0">Menos frecuente</tspan></text><rect x="40.0" y="619.2" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="638.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="264"><tspan x="50.0" dy="0">Arritmia</tspan></text><text x="330.0" y="638.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="330.0" dy="0">Sensibilización a catecolaminas</tspan></text><text x="650.0" y="638.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="650.0" dy="0">Sobre todo con hidrocarburos halogenados</tspan></text><rect x="40.0" y="648.2" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="667.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="264"><tspan x="50.0" dy="0">Metahemoglobinemia</tspan></text><text x="330.0" y="667.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="330.0" dy="0">Nitritos, anilinas y benzocaína</tspan></text><text x="650.0" y="667.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="650.0" dy="0">No es propia del kerosene</tspan></text><text x="40.0" y="717.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="727.2" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="749.7" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="749.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Arritmia</tspan></text><text x="435.0" y="749.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Neumonía</tspan></text><text x="585.0" y="749.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Metahemoglobinemia</tspan></text><text x="735.0" y="749.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Neumatocele</tspan></text><rect x="813.0" y="730.2" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="749.7" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Neumonitis</tspan></text><rect x="40.0" y="764.2" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="764.2" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="793.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Complicación más</tspan><tspan x="54.0" dy="16">frecuente?</tspan></text><text x="285.0" y="785.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: sensibiliza el</tspan><tspan x="285.0" dy="16">miocardio sobre todo</tspan><tspan x="285.0" dy="16">con halogenados</tspan></text><text x="435.0" y="793.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es una</tspan><tspan x="435.0" dy="16">sobreinfección tardía</tspan></text><text x="585.0" y="793.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: se vincula a nitritos</tspan><tspan x="585.0" dy="16">y anilinas</tspan></text><text x="735.0" y="793.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es una secuela</tspan><tspan x="735.0" dy="16">ocasional</tspan></text><text x="885.0" y="793.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: inflamación química</tspan><tspan x="885.0" dy="16">por aspiración</tspan></text><rect x="40.0" y="727.2" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="854.2" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="882.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="904.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Su baja tensión superficial lo extiende por la vía aérea con la mínima aspiración: inactiva el surfactante y causa inflamación química del parénquima.</tspan><tspan x="58.0" dy="18">• Neumonitis química: tos, ahogo, taquipnea, sibilancias y fiebre desde las primeras horas; infiltrados basales hasta 6-12 horas después.</tspan><tspan x="58.0" dy="18">• Menos frecuentes: neumonía bacteriana (sobreinfección tardía), neumatocele (secuela), arritmia (hidrocarburos halogenados) y metahemoglobinemia</tspan><tspan x="58.0" dy="18">   (nitritos, anilinas).</tspan><tspan x="58.0" dy="18">• Manejo de soporte y observación de 6 horas: no inducir el vómito, no lavado gástrico, sin corticoides ni antibióticos profilácticos; asintomático con</tspan><tspan x="58.0" dy="18">   radiografía normal tras 6 horas, alta.</tspan></text><text x="58.0" y="1016.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Goldfrank, Emergencias toxicológicas 11.ª ed. (2019); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>