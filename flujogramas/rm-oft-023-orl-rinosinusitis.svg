<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="967" viewBox="0 0 1000 967" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El seno maxilar es el más afectado por la sinusitis del adulto"><title>El seno maxilar es el más afectado por la sinusitis del adulto</title><rect x="0.75" y="0.75" width="998.5" height="965.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">ORL · rinosinusitis</tspan></text><rect x="311.8" y="32.0" width="162.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="393.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="146"><tspan x="393.0" dy="0">OFTALMOLOGÍA Y ORL RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Rinosinusitis del adulto</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El maxilar drena por un ostium alto y estrecho, contra la gravedad.</tspan><tspan x="58.0" dy="17">Sus raíces dentarias lo ponen en contacto con focos odontogénicos.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué seno paranasal es el más afectado por la</tspan><tspan x="640.0" dy="16">sinusitis del adulto?</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">POR QUÉ EL SENO MAXILAR SE AFECTA MÁS</tspan></text><line x1="410.9" y1="404.9" x2="340.0" y2="428.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="428.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.1" y1="345.1" x2="660.0" y2="321.4" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="321.4" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="403.0" x2="660.0" y2="425.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="425.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="410.9" y1="345.1" x2="340.0" y2="321.4" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="321.4" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="375.0" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="375.0" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="380.0" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">SENO MAXILAR</tspan></text><text x="500.0" y="399.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">el más afectado en el adulto</tspan></text><rect x="40.0" y="275.8" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="304.7" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">OSTIUM ALTO</tspan></text><text x="190.0" y="328.3" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Se abre en la parte alta de la pared medial: el</tspan><tspan x="190.0" dy="17">moco drena contra la gravedad</tspan></text><rect x="144.6" y="357.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="372.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="383.0" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="384.0" width="6.0" height="89.2" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="411.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">INFUNDÍBULO ESTRECHO</tspan></text><text x="190.0" y="435.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Desemboca en el meato medio y se obstruye</tspan><tspan x="190.0" dy="17">con el edema de la mucosa</tspan></text><rect x="660.0" y="279.4" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="280.4" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="810.0" y="313.2" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">RAÍCES DENTARIAS</tspan></text><text x="810.0" y="336.8" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Contacto con focos odontogénicos</tspan></text><rect x="660.0" y="379.4" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="380.4" width="6.0" height="89.2" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="408.2" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">OTROS SENOS</tspan></text><text x="810.0" y="431.9" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Etmoides: niños. Esfenoides y frontal: pocos,</tspan><tspan x="810.0" dy="17">pero con complicaciones graves</tspan></text><text x="40.0" y="517.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="529.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="553.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Edema de la mucosa</tspan></text><line x1="248.5" y1="549.5" x2="267.5" y2="549.5" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,544.5 266.5,554.5 274.5,549.5" fill="#0f766e"/><rect x="278.5" y="529.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="553.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Obstrucción del ostium</tspan></text><line x1="487.0" y1="549.5" x2="506.0" y2="549.5" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,544.5 505.0,554.5 513.0,549.5" fill="#0f766e"/><rect x="517.0" y="529.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="553.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Retención de moco</tspan></text><line x1="725.5" y1="549.5" x2="744.5" y2="549.5" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,544.5 743.5,554.5 751.5,549.5" fill="#0f766e"/><rect x="755.5" y="529.0" width="204.5" height="41.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="553.5" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Sobreinfección bacteriana</tspan></text><text x="40.0" y="610.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="620.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="651.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="623.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="651.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Maxilar</tspan></text><text x="435.0" y="642.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Celda etmoidal</tspan><tspan x="435.0" dy="17">posterior</tspan></text><text x="585.0" y="651.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Esfenoidal</tspan></text><text x="735.0" y="651.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Frontal</tspan></text><text x="885.0" y="642.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Celda etmoidal</tspan><tspan x="885.0" dy="17">anterior</tspan></text><rect x="40.0" y="674.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="674.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="711.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Seno más afectado?</tspan></text><text x="285.0" y="695.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: drena contra la</tspan><tspan x="285.0" dy="16">gravedad y por un</tspan><tspan x="285.0" dy="16">ostium estrecho</tspan></text><text x="435.0" y="703.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: más frecuente en</tspan><tspan x="435.0" dy="16">niños, no en adultos</tspan></text><text x="585.0" y="703.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: poco frecuente,</tspan><tspan x="585.0" dy="16">complicaciones graves</tspan></text><text x="735.0" y="703.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: poco frecuente,</tspan><tspan x="735.0" dy="16">complicaciones graves</tspan></text><text x="885.0" y="703.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: más frecuente en</tspan><tspan x="885.0" dy="16">niños, no en adultos</tspan></text><rect x="40.0" y="620.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="764.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="792.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="814.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Sospechar la bacteriana aguda: síntomas más de 10 días sin mejoría, empeoramiento tras mejoría inicial («doble empeoramiento») o fiebre alta con</tspan><tspan x="58.0" dy="18">   secreción purulenta 3 a 4 días.</tspan><tspan x="58.0" dy="18">• La mayoría son virales: lavados salinos, analgésicos y esteroides nasales. Si se indica antibiótico, la primera línea es amoxicilina con o sin ácido</tspan><tspan x="58.0" dy="18">   clavulánico.</tspan><tspan x="58.0" dy="18">• El etmoides es el más afectado en niños; esfenoides y frontal son menos frecuentes, pero con complicaciones intracraneales u orbitarias más graves.</tspan><tspan x="58.0" dy="18">• Alerta: edema periorbitario con proptosis, oftalmoplejía o baja visual sugiere celulitis orbitaria: TC urgente.</tspan></text><text x="58.0" y="926.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAO-HNSF, Clinical Practice Guideline: Adult Sinusitis Update (Otolaryngol Head Neck Surg 2025); Cummings Otolaringología 7.ª ed. (2021)</tspan></text></svg>