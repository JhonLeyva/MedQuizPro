<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1028" viewBox="0 0 1000 1028" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La búsqueda activa y captación de sintomáticos respiratorios para detectar tuberculosis es prevención secundaria (diagnóstico precoz)"><title>La búsqueda activa y captación de sintomáticos respiratorios para detectar tuberculosis es prevención secundaria (diagnóstico precoz)</title><rect x="0.75" y="0.75" width="998.5" height="1026.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Niveles de prevención · tuberculosis</tspan></text><rect x="416.0" y="32.0" width="143.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="487.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="127"><tspan x="487.8" dy="0">SALUD PÚBLICA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Niveles de prevención (Leavell y Clark)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Primaria: evita que aparezca la enfermedad (vacuna, terapia preventiva). Secundaria: la</tspan><tspan x="58.0" dy="17">detecta pronto y trata (tamizaje, búsqueda de casos).</tspan><tspan x="58.0" dy="17">Terciaria: limita secuelas y rehabilita. Cuaternaria: evita el daño por exceso de intervención</tspan><tspan x="58.0" dy="17">médica.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Distrito con pobreza y hacinamiento</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Aumentó la incidencia de TB pulmonar.</tspan><tspan x="640.0" dy="16">Se programa búsqueda activa de sintomáticos</tspan><tspan x="640.0" dy="16">respiratorios (tos ≥ 15 días).</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LOS NIVELES DE PREVENCIÓN</tspan></text><polygon points="190.0,285.0 290.0,285.0 320.0,341.0 160.0,341.0" fill="#ccfbf1" stroke="#ffffff" stroke-width="2"/><text x="240.0" y="318.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="88"><tspan x="240.0" dy="0">Promoción</tspan></text><rect x="466.0" y="285.0" width="494.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="481.0" y="309.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">Determinantes</tspan></text><text x="481.0" y="326.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">Vivienda, nutrición, educación.</tspan></text><polygon points="160.0,347.0 320.0,347.0 350.0,403.0 130.0,403.0" fill="#99f6e4" stroke="#ffffff" stroke-width="2"/><text x="240.0" y="380.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="148"><tspan x="240.0" dy="0">Primaria</tspan></text><rect x="466.0" y="347.0" width="494.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="481.0" y="371.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">Evitar la enfermedad</tspan></text><text x="481.0" y="388.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">BCG, terapia preventiva.</tspan></text><polygon points="130.0,409.0 350.0,409.0 380.0,465.0 100.0,465.0" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="240.0" y="442.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="208"><tspan x="240.0" dy="0">Secundaria</tspan></text><rect x="466.0" y="409.0" width="494.0" height="56.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="481.0" y="433.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">Detectar y tratar pronto</tspan></text><text x="481.0" y="450.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">Búsqueda de sintomáticos respiratorios.</tspan></text><rect x="858.2" y="398.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="903.6" y="413.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="903.6" dy="0">◆ ESTE CASO</tspan></text><polygon points="100.0,471.0 380.0,471.0 410.0,527.0 70.0,527.0" fill="#2dd4bf" stroke="#ffffff" stroke-width="2"/><text x="240.0" y="504.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="268"><tspan x="240.0" dy="0">Terciaria</tspan></text><rect x="466.0" y="471.0" width="494.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="481.0" y="495.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">Limitar secuelas</tspan></text><text x="481.0" y="512.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">Rehabilitación respiratoria.</tspan></text><polygon points="70.0,533.0 410.0,533.0 440.0,589.0 40.0,589.0" fill="#14b8a6" stroke="#ffffff" stroke-width="2"/><text x="240.0" y="566.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="328"><tspan x="240.0" dy="0">Cuaternaria</tspan></text><rect x="466.0" y="533.0" width="494.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="481.0" y="557.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">Evitar el exceso médico</tspan></text><text x="481.0" y="574.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">No sobretratar.</tspan></text><text x="240.0" y="607.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="400"><tspan x="240.0" dy="0">De la salud a la secuela</tspan></text><rect x="40.0" y="629.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="655.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Búsqueda activa de casos = prevención secundaria</tspan></text><text x="60.0" y="674.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Diagnóstico precoz y tratamiento oportuno.</tspan></text><text x="40.0" y="741.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="751.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="782.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="782.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Cuaternaria</tspan></text><text x="435.0" y="782.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Primaria</tspan></text><text x="585.0" y="782.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Terciaria</tspan></text><rect x="663.0" y="754.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="782.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Secundaria</tspan></text><text x="885.0" y="773.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Promoción de la</tspan><tspan x="885.0" dy="17">salud</tspan></text><rect x="40.0" y="805.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="805.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="834.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Nivel?</tspan></text><text x="285.0" y="826.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: evita el</tspan><tspan x="285.0" dy="16">sobretratamiento</tspan></text><text x="435.0" y="834.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: evita que aparezca</tspan></text><text x="585.0" y="834.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: limita secuelas</tspan></text><text x="735.0" y="834.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: detección precoz</tspan></text><text x="885.0" y="826.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: actúa en</tspan><tspan x="885.0" dy="16">determinantes</tspan></text><rect x="40.0" y="751.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="879.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="907.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="929.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Sintomático respiratorio: tos y flema ≥ 15 días → baciloscopía y Xpert.</tspan><tspan x="58.0" dy="18">• Detectar y tratar pronto corta la transmisión.</tspan><tspan x="58.0" dy="18">• Primaria en TB: BCG, terapia preventiva a contactos, ventilación.</tspan></text><text x="58.0" y="987.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA Perú, NTS de tuberculosis (2023); Leavell y Clark.</tspan></text></svg>