<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1252" viewBox="0 0 1000 1252" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Feto de 29 semanas con peso en percentil 8 y Doppler umbilical alterado: restricción del crecimiento temprana"><title>Feto de 29 semanas con peso en percentil 8 y Doppler umbilical alterado: restricción del crecimiento temprana</title><rect x="0.75" y="0.75" width="998.5" height="1251.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Restricción del crecimiento fetal</tspan></text><rect x="391.4" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="478.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="478.6" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Restricción del crecimiento temprana</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Antes de las 32 semanas; casi siempre por mala placentación (con preeclampsia).</tspan><tspan x="58.0" dy="17">Se define por peso muy bajo o por peso bajo con Doppler alterado.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante de 29 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Asintomática; PA 130/90; AU 24 cm.</tspan><tspan x="640.0" dy="16">Peso fetal p8, líquido normal, Doppler umbilical</tspan><tspan x="640.0" dy="16">alterado.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="377.0" x2="500.0" y2="407.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="407.0" x2="733.5" y2="407.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="407.0" x2="266.5" y2="436.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,435.0 271.5,435.0 266.5,443.0" fill="#94a3b8"/><line x1="733.5" y1="407.0" x2="733.5" y2="436.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,435.0 738.5,435.0 733.5,443.0" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#0f766e"/><line x1="500.0" y1="377.0" x2="500.0" y2="407.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="407.0" x2="500.0" y2="407.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="407.0" x2="266.5" y2="436.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,435.0 271.5,435.0 266.5,443.0" fill="#0f766e"/><rect x="171.2" y="416.0" width="190.6" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="428.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Sí: 29 sem, p8, Doppler (este caso)</tspan></text><rect x="666.8" y="416.0" width="133.5" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="428.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Doppler normal, p3-p10</tspan></text><polygon points="240.0,342.0 266.0,307.0 734.0,307.0 760.0,342.0 734.0,377.0 266.0,377.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="342.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="347.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="338.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Peso fetal bajo: ¿antes de las 32 semanas con Doppler</tspan><tspan x="519.0" dy="17">alterado?</tspan></text><rect x="40.0" y="443.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="471.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">RCIU TEMPRANO</tspan></text><text x="266.5" y="494.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Doppler seriado</tspan><tspan x="266.5" dy="17">Corticoides si &lt; 34</tspan></text><rect x="507.0" y="443.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="479.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Pequeño para la edad</tspan></text><text x="733.5" y="502.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Control</tspan></text><text x="40.0" y="573.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="585.5" width="920.0" height="323.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="599.5" width="478.7" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="295.4" y="619.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="295.4" dy="0">RESTRICCIÓN DEL CRECIMIENTO: TEMPRANA O TARDÍA (DELPHI)</tspan></text><text x="550.7" y="619.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="391"><tspan x="550.7" dy="0">Se separa por la semana del diagnóstico.</tspan></text><rect x="56.0" y="659.5" width="438.0" height="98.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="57.2" y="660.7" width="435.6" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="275.0" y="687.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="422"><tspan x="275.0" dy="0">TEMPRANA (&lt; 32 SEM)</tspan></text><text x="275.0" y="707.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="414"><tspan x="275.0" dy="0">Peso &lt; p3</tspan></text><circle cx="72.0" cy="732.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="82.0" y="736.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="400"><tspan x="82.0" dy="0">o &lt; p10 con Doppler umbilical alterado</tspan></text><rect x="229.6" y="648.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="275.0" y="663.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="275.0" dy="0">◆ ESTE CASO</tspan></text><rect x="506.0" y="659.5" width="438.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="506.6" y="660.1" width="436.8" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="725.0" y="687.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="422"><tspan x="725.0" dy="0">TARDÍA (≥ 32 SEM)</tspan></text><text x="725.0" y="707.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="414"><tspan x="725.0" dy="0">Peso &lt; p3</tspan></text><circle cx="522.0" cy="732.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="532.0" y="736.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="400"><tspan x="532.0" dy="0">o &lt; p10 con Doppler cerebral o cociente alterado</tspan></text><text x="56.0" y="787.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="796.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="811.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="811.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">29 semanas</tspan></text><rect x="56.0" y="818.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="833.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="833.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Peso p8 con Doppler umbilical alterado</tspan></text><rect x="56.0" y="855.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="878.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Doppler seriado y corticoides.</tspan></text><text x="40.0" y="948.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="958.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="998.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="998.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hidrops fetal</tspan></text><rect x="363.0" y="961.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="998.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">RCIU temprano</tspan></text><text x="585.0" y="989.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Pequeño para la</tspan><tspan x="585.0" dy="17">edad gestacional</tspan></text><text x="735.0" y="998.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">RCIU tardío</tspan></text><text x="885.0" y="981.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Feto</tspan><tspan x="885.0" dy="17">constitucionalmente</tspan><tspan x="885.0" dy="17">pequeño</tspan></text><rect x="40.0" y="1029.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="1029.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1058.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="1050.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: edema fetal,</tspan><tspan x="285.0" dy="16">derrames</tspan></text><text x="435.0" y="1050.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: &lt; 32 sem + p &lt; 10</tspan><tspan x="435.0" dy="16">+ Doppler</tspan></text><text x="585.0" y="1058.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: Doppler normal</tspan></text><text x="735.0" y="1050.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: después de las 32</tspan><tspan x="735.0" dy="16">semanas</tspan></text><text x="885.0" y="1050.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: Doppler normal,</tspan><tspan x="885.0" dy="16">crece bien</tspan></text><rect x="40.0" y="958.5" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1103.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1131.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1153.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Seguimiento con Doppler (umbilical, cerebral media, ductus venoso) y monitoreo.</tspan><tspan x="58.0" dy="18">• Corticoides si se prevé parto antes de las 34 semanas; sulfato de Mg si &lt; 32.</tspan><tspan x="58.0" dy="18">• Vigilar preeclampsia (PA 130/90); aspirina no sirve ya para tratarla.</tspan></text><text x="58.0" y="1211.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Consenso Delphi de RCF (Gordijn 2016); ISUOG (2020).</tspan></text></svg>