<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1016" viewBox="0 0 1000 1016" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Vómitos autoinducidos: alcalosis metabólica hipoclorémica con hipopotasemia"><title>Vómitos autoinducidos: alcalosis metabólica hipoclorémica con hipopotasemia</title><rect x="0.75" y="0.75" width="998.5" height="1014.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Trastornos alimentarios · medio interno en la purga</tspan></text><rect x="502.8" y="32.0" width="109.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="557.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="93"><tspan x="557.5" dy="0">PSIQUIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Vómitos autoinducidos</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se pierde ácido clorhídrico gástrico (H⁺ y Cl⁻).</tspan><tspan x="58.0" dy="17">La contracción de volumen mantiene la alcalosis y se pierde potasio.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Adolescente de 13 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">IMC de 15, deshidratación y desnutrición; su madre</tspan><tspan x="640.0" dy="16">refiere que se provoca vómitos.</tspan><tspan x="640.0" dy="16">¿Cuál es el trastorno del medio interno?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LA GASOMETRÍA DE QUIEN VOMITA (VALORES TÍPICOS)</tspan></text><rect x="40.0" y="285.0" width="222.5" height="78.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="151.2" y="305.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="210"><tspan x="151.2" dy="0">pH</tspan></text><text x="151.2" y="333.0" font-size="20" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="210"><tspan x="151.2" dy="0">7,52 ↑</tspan></text><text x="151.2" y="353.0" font-size="9.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="151.2" dy="0">normal 7,35-7,45</tspan></text><rect x="272.5" y="285.0" width="222.5" height="78.0" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="383.8" y="305.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="210"><tspan x="383.8" dy="0">HCO₃⁻</tspan></text><text x="383.8" y="333.0" font-size="20" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="210"><tspan x="383.8" dy="0">34 ↑</tspan></text><text x="383.8" y="353.0" font-size="9.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="383.8" dy="0">normal 22-26</tspan></text><rect x="505.0" y="285.0" width="222.5" height="78.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="616.2" y="305.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="210"><tspan x="616.2" dy="0">K⁺</tspan></text><text x="616.2" y="333.0" font-size="20" font-weight="800" font-style="normal" fill="#2563eb" text-anchor="middle" data-max="210"><tspan x="616.2" dy="0">2,9 ↓</tspan></text><text x="616.2" y="353.0" font-size="9.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="616.2" dy="0">normal 3,5-5</tspan></text><rect x="737.5" y="285.0" width="222.5" height="78.0" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="848.8" y="305.0" font-size="11" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="210"><tspan x="848.8" dy="0">Cl⁻</tspan></text><text x="848.8" y="333.0" font-size="20" font-weight="800" font-style="normal" fill="#2563eb" text-anchor="middle" data-max="210"><tspan x="848.8" dy="0">88 ↓</tspan></text><text x="848.8" y="353.0" font-size="9.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="848.8" dy="0">normal 98-106</tspan></text><rect x="40.0" y="377.0" width="250.0" height="41.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="60.0" cy="397.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="60.0" y="402.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">1</tspan></text><text x="80.0" y="401.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="80.0" dy="0">¿Acidemia o alcalemia?</tspan></text><line x1="293.0" y1="397.5" x2="300.0" y2="397.5" stroke="#0f766e" stroke-width="2"/><polygon points="299.0,392.5 299.0,402.5 307.0,397.5" fill="#0f766e"/><rect x="310.0" y="377.0" width="230.0" height="41.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="322.0" y="401.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="206"><tspan x="322.0" dy="0">pH 7,52</tspan></text><line x1="543.0" y1="397.5" x2="550.0" y2="397.5" stroke="#0f766e" stroke-width="2"/><polygon points="549.0,392.5 549.0,402.5 557.0,397.5" fill="#0f766e"/><rect x="560.0" y="377.0" width="400.0" height="41.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.2"/><text x="572.0" y="401.5" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="376"><tspan x="572.0" dy="0">Alcalemia</tspan></text><rect x="40.0" y="426.0" width="250.0" height="41.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="60.0" cy="446.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="60.0" y="451.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">2</tspan></text><text x="80.0" y="450.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="80.0" dy="0">¿Metabólica o respiratoria?</tspan></text><line x1="293.0" y1="446.5" x2="300.0" y2="446.5" stroke="#0f766e" stroke-width="2"/><polygon points="299.0,441.5 299.0,451.5 307.0,446.5" fill="#0f766e"/><rect x="310.0" y="426.0" width="230.0" height="41.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="322.0" y="450.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="206"><tspan x="322.0" dy="0">HCO₃⁻ alto</tspan></text><line x1="543.0" y1="446.5" x2="550.0" y2="446.5" stroke="#0f766e" stroke-width="2"/><polygon points="549.0,441.5 549.0,451.5 557.0,446.5" fill="#0f766e"/><rect x="560.0" y="426.0" width="400.0" height="41.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.2"/><text x="572.0" y="450.5" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="376"><tspan x="572.0" dy="0">Alcalosis metabólica</tspan></text><rect x="40.0" y="475.0" width="250.0" height="41.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="60.0" cy="495.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="60.0" y="500.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">3</tspan></text><text x="80.0" y="499.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="80.0" dy="0">¿Qué electrolitos?</tspan></text><line x1="293.0" y1="495.5" x2="300.0" y2="495.5" stroke="#0f766e" stroke-width="2"/><polygon points="299.0,490.5 299.0,500.5 307.0,495.5" fill="#0f766e"/><rect x="310.0" y="475.0" width="230.0" height="41.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="322.0" y="499.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="206"><tspan x="322.0" dy="0">K⁺ y Cl⁻ bajos</tspan></text><line x1="543.0" y1="495.5" x2="550.0" y2="495.5" stroke="#0f766e" stroke-width="2"/><polygon points="549.0,490.5 549.0,500.5 557.0,495.5" fill="#0f766e"/><rect x="560.0" y="475.0" width="400.0" height="41.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.2"/><text x="572.0" y="499.5" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="376"><tspan x="572.0" dy="0">Hipopotasemia e hipocloremia</tspan></text><rect x="40.0" y="524.0" width="250.0" height="41.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="60.0" cy="544.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="60.0" y="549.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">4</tspan></text><text x="80.0" y="548.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="200"><tspan x="80.0" dy="0">¿Qué se hace?</tspan></text><line x1="293.0" y1="544.5" x2="300.0" y2="544.5" stroke="#0f766e" stroke-width="2"/><polygon points="299.0,539.5 299.0,549.5 307.0,544.5" fill="#0f766e"/><rect x="310.0" y="524.0" width="230.0" height="41.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="322.0" y="548.5" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="206"><tspan x="322.0" dy="0">Hipovolemia</tspan></text><line x1="543.0" y1="544.5" x2="550.0" y2="544.5" stroke="#0f766e" stroke-width="2"/><polygon points="549.0,539.5 549.0,549.5 557.0,544.5" fill="#0f766e"/><rect x="560.0" y="524.0" width="400.0" height="41.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="572.0" y="548.5" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="376"><tspan x="572.0" dy="0">SALINA ISOTÓNICA + POTASIO</tspan></text><rect x="40.0" y="583.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="609.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Vómitos = alcalosis metabólica hipoclorémica</tspan></text><text x="60.0" y="628.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Se corrige con solución salina y potasio, y se trata el trastorno alimentario.</tspan></text><text x="40.0" y="695.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="705.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="736.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="708.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="727.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Alcalosis</tspan><tspan x="285.0" dy="17">hipoclorémica</tspan></text><text x="435.0" y="727.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Acidosis</tspan><tspan x="435.0" dy="17">hiperpotasémica</tspan></text><text x="585.0" y="736.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Acidosis metabólica</tspan></text><text x="735.0" y="727.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Acidosis</tspan><tspan x="735.0" dy="17">hipoclorémica</tspan></text><text x="885.0" y="727.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Alcalosis</tspan><tspan x="885.0" dy="17">hiperclorémica</tspan></text><rect x="40.0" y="759.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="759.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="796.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Trastorno?</tspan></text><text x="285.0" y="788.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: pierde H⁺ y Cl⁻</tspan><tspan x="285.0" dy="16">con vómitos</tspan></text><text x="435.0" y="788.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no corresponde a</tspan><tspan x="435.0" dy="16">este cuadro</tspan></text><text x="585.0" y="788.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es de la pérdida de</tspan><tspan x="585.0" dy="16">bicarbonato (laxantes)</tspan></text><text x="735.0" y="780.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: el cloro está bajo,</tspan><tspan x="735.0" dy="16">pero la alcalosis es</tspan><tspan x="735.0" dy="16">metabólica</tspan></text><text x="885.0" y="788.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: el cloro no sube</tspan><tspan x="885.0" dy="16">con los vómitos</tspan></text><rect x="40.0" y="705.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="849.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="877.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="899.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Alcalosis metabólica hipoclorémica e hipopotasémica; el cloro urinario es bajo (&lt; 20 mEq/L) y responde a cloruro.</tspan><tspan x="58.0" dy="18">• La depleción de volumen activa la aldosterona: reabsorbe sodio y bicarbonato y elimina potasio.</tspan><tspan x="58.0" dy="18">• Con laxantes la pérdida es de bicarbonato y la acidosis es metabólica; en la purga también hay hipomagnesemia e hipofosfatemia.</tspan><tspan x="58.0" dy="18">• Alerta: síndrome de realimentación al iniciar la nutrición; vigilar fósforo, potasio, magnesio y el ECG (APA 2023; AAP 2021).</tspan></text><text x="58.0" y="975.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: APA, trastornos de la conducta alimentaria (2023); Hornberger et al., AAP (Pediatrics 2021).</tspan></text></svg>