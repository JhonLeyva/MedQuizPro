<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1306" viewBox="0 0 1000 1306" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Adenopatías cervicales pequeñas, bilaterales, blandas y móviles en un preescolar: causa viral, el adenovirus"><title>Adenopatías cervicales pequeñas, bilaterales, blandas y móviles en un preescolar: causa viral, el adenovirus</title><rect x="0.75" y="0.75" width="998.5" height="1304.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · adenopatía cervical</tspan></text><rect x="379.1" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="428.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="428.2" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Adenopatía cervical reactiva</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Muy frecuente en el preescolar y casi siempre benigna.</tspan><tspan x="58.0" dy="17">Virus respiratorios, VEB, CMV y enterovirus producen hiperplasia ganglionar.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Preescolar sin antecedentes</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Tumoraciones cervicales bilaterales a lo largo del</tspan><tspan x="640.0" dy="16">esternocleidomastoideo.</tspan><tspan x="640.0" dy="16">Ganglios pequeños, móviles, blandos y no dolorosos.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SIGNOS DE ALARMA FRENTE A SIGNOS TRANQUILIZADORES</tspan></text><rect x="40.0" y="285.0" width="602.0" height="34.0" rx="10" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.2"/><text x="56.0" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="452"><tspan x="56.0" dy="0">QUÉ HACER SEGÚN LOS HALLAZGOS</tspan></text><text x="626.0" y="307.0" font-size="10.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="end" data-max="100"><tspan x="626.0" dy="0">EN EL CASO</tspan></text><rect x="40.0" y="325.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,340.5 74.0,360.5 50.0,360.5" fill="#dc2626"/><text x="62.0" y="357.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="348.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Ganglios mayores de 2 cm, persistentes, duros o fijos</tspan></text><text x="84.0" y="365.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Descartar linfoma o tuberculosis</tspan></text><text x="626.0" y="355.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="384.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,399.5 74.0,419.5 50.0,419.5" fill="#dc2626"/><text x="62.0" y="416.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="407.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Localización supraclavicular</tspan></text><text x="84.0" y="424.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Alta sospecha de enfermedad grave</tspan></text><text x="626.0" y="414.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="443.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,458.5 74.0,478.5 50.0,478.5" fill="#dc2626"/><text x="62.0" y="475.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="466.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Pérdida de peso, sudores nocturnos, hepatoesplenomegalia</tspan></text><text x="84.0" y="483.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Ampliar el estudio</tspan></text><text x="626.0" y="473.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="502.0" width="602.0" height="53.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><polygon points="62.0,517.5 74.0,537.5 50.0,537.5" fill="#cbd5e1"/><text x="62.0" y="534.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="525.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Bilaterales, menores de 2 cm, blandos, móviles y sin dolor</tspan></text><text x="84.0" y="542.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Patrón viral: caso actual</tspan></text><text x="626.0" y="532.5" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">No</tspan></text><rect x="40.0" y="561.0" width="602.0" height="53.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><polygon points="62.0,576.5 74.0,596.5 50.0,596.5" fill="#cbd5e1"/><text x="62.0" y="593.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="584.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Sin calor, eritema ni fiebre</tspan></text><text x="84.0" y="601.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Descarta linfadenitis bacteriana</tspan></text><text x="626.0" y="591.5" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">No</tspan></text><rect x="660.0" y="285.0" width="300.0" height="329.0" rx="12" fill="#dc2626" stroke="none" stroke-width="1.5"/><text x="676.0" y="309.0" font-size="10.5" font-weight="800" font-style="normal" fill="#fecaca" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">CON PATRÓN VIRAL</tspan></text><text x="676.0" y="409.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">Conducta expectante 2 a 4 semanas</tspan></text><text x="676.0" y="426.0" font-size="12" font-weight="500" font-style="normal" fill="#fee2e2" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">Observar sin corticoides ni antibióticos y</tspan><tspan x="676.0" dy="16">reevaluar a las 2 a 4 semanas. Ampliar el</tspan><tspan x="676.0" dy="16">estudio si los ganglios crecen, duelen, se fijan</tspan><tspan x="676.0" dy="16">o persisten, o si aparecen pérdida de peso,</tspan><tspan x="676.0" dy="16">sudores nocturnos o hepatoesplenomegalia.</tspan><tspan x="676.0" dy="16">Los corticoides pueden enmascarar una</tspan><tspan x="676.0" dy="16">leucemia o un linfoma.</tspan></text><rect x="40.0" y="632.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="658.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Ganglios blandos, bilaterales y pequeños = viral (adenovirus)</tspan></text><text x="60.0" y="677.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El estreptococo A y el S. aureus dan adenitis unilateral, dolorosa y caliente.</tspan></text><text x="40.0" y="738.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ADENOPATÍA CERVICAL DEL NIÑO SEGÚN SU CAUSA</tspan></text><rect x="40.0" y="750.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="769.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Causa</tspan></text><text x="300.0" y="769.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="207"><tspan x="300.0" dy="0">Lateralidad y tamaño</tspan></text><text x="523.3" y="769.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="207"><tspan x="523.3" dy="0">Consistencia</tspan></text><text x="746.7" y="769.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="207"><tspan x="746.7" dy="0">Signos locales</tspan></text><rect x="40.0" y="779.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="798.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Viral reactiva (caso)</tspan></text><text x="300.0" y="798.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="207"><tspan x="300.0" dy="0">Bilateral, menor de 2 cm</tspan></text><text x="523.3" y="798.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="207"><tspan x="523.3" dy="0">Blanda y móvil</tspan></text><text x="746.7" y="798.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="207"><tspan x="746.7" dy="0">Sin dolor, calor ni eritema</tspan></text><rect x="190.6" y="782.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="236.0" y="797.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="236.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="808.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="827.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Bacteriana: estreptococo A, S. aureus</tspan></text><text x="300.0" y="827.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="207"><tspan x="300.0" dy="0">Unilateral</tspan></text><text x="523.3" y="827.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="207"><tspan x="523.3" dy="0">Firme</tspan></text><text x="746.7" y="827.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="207"><tspan x="746.7" dy="0">Dolor, calor, fiebre y posible</tspan><tspan x="746.7" dy="15">supuración</tspan></text><rect x="40.0" y="852.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="871.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Linfoma o tuberculosis</tspan></text><text x="300.0" y="871.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="207"><tspan x="300.0" dy="0">Mayor de 2 cm, persistente</tspan></text><text x="523.3" y="871.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="207"><tspan x="523.3" dy="0">Dura o fija</tspan></text><text x="746.7" y="871.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="207"><tspan x="746.7" dy="0">Supraclavicular, pérdida de peso y</tspan><tspan x="746.7" dy="15">sudores nocturnos</tspan></text><text x="40.0" y="936.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="946.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="977.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="949.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="977.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Adenovirus</tspan></text><text x="435.0" y="977.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Virus de la gripe</tspan></text><text x="585.0" y="968.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Estreptococo grupo</tspan><tspan x="585.0" dy="17">A</tspan></text><text x="735.0" y="977.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Parvovirus</tspan></text><text x="885.0" y="968.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Staphylococcus</tspan><tspan x="885.0" dy="17">aureus</tspan></text><rect x="40.0" y="1000.0" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1000.0" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1045.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Etiología probable?</tspan></text><text x="285.0" y="1037.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: adenopatía viral</tspan><tspan x="285.0" dy="16">reactiva</tspan></text><text x="435.0" y="1021.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: produce síntomas</tspan><tspan x="435.0" dy="16">sistémicos,</tspan><tspan x="435.0" dy="16">adenopatías poco</tspan><tspan x="435.0" dy="16">notorias</tspan></text><text x="585.0" y="1029.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: linfadenitis</tspan><tspan x="585.0" dy="16">unilateral, dolorosa y</tspan><tspan x="585.0" dy="16">caliente</tspan></text><text x="735.0" y="1037.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: eritema infeccioso,</tspan><tspan x="735.0" dy="16">casi sin ganglios</tspan></text><text x="885.0" y="1029.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: linfadenitis</tspan><tspan x="885.0" dy="16">unilateral con</tspan><tspan x="885.0" dy="16">tendencia a supurar</tspan></text><rect x="40.0" y="946.0" width="920.0" height="136.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1106.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1134.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1156.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• A favor de origen viral: bilateral, menor de 2 cm, blanda, móvil y sin dolor, calor ni eritema. Se vigila 2 a 4 semanas.</tspan><tspan x="58.0" dy="18">• Bacteriana (estreptococo A, S. aureus): unilateral, dolorosa, caliente, firme, con fiebre, leucocitosis y tendencia a supurar.</tspan><tspan x="58.0" dy="18">• Banderas rojas: ganglios mayores de 2 cm persistentes, duros o fijos, supraclaviculares, pérdida de peso, sudores nocturnos o hepatoesplenomegalia</tspan><tspan x="58.0" dy="18">   (linfoma, tuberculosis).</tspan><tspan x="58.0" dy="18">• Gripe y parvovirus casi no cursan con adenopatía notoria; no dar corticoides antes de descartar leucemia o linfoma.</tspan></text><text x="58.0" y="1250.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Leung AK, Davies HD. Cervical lymphadenitis. Curr Infect Dis Rep 2009;11:183-9; Lynch JP 3rd, Kajon AE. Semin Respir Crit Care Med 2016;37:586-602; Nelson</tspan><tspan x="58.0" dy="15">Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>