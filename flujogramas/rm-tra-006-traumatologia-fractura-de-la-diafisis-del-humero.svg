<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="948" viewBox="0 0 1000 948" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El nervio radial es el más lesionado en la fractura desplazada de la diáfisis humeral"><title>El nervio radial es el más lesionado en la fractura desplazada de la diáfisis humeral</title><rect x="0.75" y="0.75" width="998.5" height="946.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Traumatología · fractura de la diáfisis del húmero</tspan></text><rect x="489.9" y="32.0" width="135.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="557.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="119"><tspan x="557.5" dy="0">TRAUMATOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Nervio radial y húmero</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Desciende por el surco de torsión y cruza el tabique intermuscular lateral en la unión de los</tspan><tspan x="58.0" dy="17">tercios medio y distal.</tspan><tspan x="58.0" dy="17">Queda fijo y pegado al hueso.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de complicación</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Fractura desplazada de la diáfisis del húmero.</tspan><tspan x="640.0" dy="16">¿Qué nervio se lesiona con más frecuencia?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EVOLUCIÓN DE LA PARÁLISIS RADIAL TRAS LA FRACTURA (MESES, ORIENTATIVO)</tspan></text><line x1="290.0" y1="291.0" x2="290.0" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="290.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="290.0" dy="0">0</tspan></text><line x1="398.3" y1="291.0" x2="398.3" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="398.3" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="398.3" dy="0">1</tspan></text><line x1="506.7" y1="291.0" x2="506.7" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="506.7" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="506.7" dy="0">2</tspan></text><line x1="615.0" y1="291.0" x2="615.0" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="615.0" dy="0">3</tspan></text><line x1="723.3" y1="291.0" x2="723.3" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="723.3" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="723.3" dy="0">4</tspan></text><line x1="831.7" y1="291.0" x2="831.7" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="831.7" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="831.7" dy="0">5</tspan></text><line x1="940.0" y1="291.0" x2="940.0" y2="447.0" stroke="#e2e8f0" stroke-width="1"/><text x="940.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="940.0" dy="0">6</tspan></text><text x="940.0" y="273.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="end" data-max="60"><tspan x="940.0" dy="0">meses</tspan></text><rect x="40.0" y="295.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="311.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Observación con férula de muñeca</tspan></text><text x="48.0" y="326.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Neuropraxia: mejora sola en 70-90 %</tspan></text><rect x="290.0" y="303.0" width="325.0" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="349.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">EMG de control</tspan></text><text x="48.0" y="364.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">A las 3-6 semanas</tspan></text><rect x="371.2" y="341.0" width="81.2" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><rect x="40.0" y="371.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="387.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Recuperación esperada</tspan></text><text x="48.0" y="402.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Casi todas en 3-4 meses</tspan></text><rect x="615.0" y="379.0" width="108.3" height="22.0" rx="6" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="48.0" y="425.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Explorar si no mejora</tspan></text><text x="48.0" y="440.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">A los 3-6 meses sin recuperación</tspan></text><rect x="615.0" y="417.0" width="325.0" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><line x1="615.0" y1="293.0" x2="615.0" y2="453.0" stroke="#b91c1c" stroke-width="2.6"/><rect x="514.4" y="453.0" width="201.1" height="22.0" rx="11" fill="#b91c1c" stroke="none" stroke-width="1.5"/><text x="615.0" y="468.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="615.0" dy="0">3 meses: se espera recuperación</tspan></text><rect x="40.0" y="499.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="525.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Radial = nervio más lesionado en la fractura de húmero</tspan></text><text x="60.0" y="544.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Explorar de entrada si es abierta o la parálisis aparece tras la reducción.</tspan></text><text x="40.0" y="611.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="621.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="643.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="624.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="643.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Radial</tspan></text><text x="435.0" y="643.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Mediano</tspan></text><text x="585.0" y="643.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Axilar</tspan></text><text x="735.0" y="643.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Cubital</tspan></text><text x="885.0" y="643.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Musculocutáneo</tspan></text><rect x="40.0" y="658.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="658.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="695.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Nervio más lesionado?</tspan></text><text x="285.0" y="687.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: pegado al hueso en</tspan><tspan x="285.0" dy="16">el surco de torsión</tspan></text><text x="435.0" y="687.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: se lesiona en el</tspan><tspan x="435.0" dy="16">codo</tspan></text><text x="585.0" y="679.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: se lesiona en la</tspan><tspan x="585.0" dy="16">luxación o el cuello</tspan><tspan x="585.0" dy="16">quirúrgico</tspan></text><text x="735.0" y="687.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: se lesiona en el</tspan><tspan x="735.0" dy="16">codo</tspan></text><text x="885.0" y="695.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: se lesiona rara vez</tspan></text><rect x="40.0" y="621.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="748.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="776.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="798.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Incidencia cercana a 11 %, sobre todo en el tercio medio y distal (fractura de Holstein-Lewis: espiral del tercio distal). Casi todas son neuropraxias.</tspan><tspan x="58.0" dy="18">• Clínica: caída de la muñeca y los dedos; la extensión del codo se conserva (la rama del tríceps sale antes); anestesia en la primera comisura dorsal.</tspan><tspan x="58.0" dy="18">• Manejo inicial expectante con férula de muñeca; EMG a las 3-6 semanas; explorar si no hay recuperación a los 3-6 meses. Explorar de entrada si es</tspan><tspan x="58.0" dy="18">   fractura abierta o aparece tras la reducción.</tspan><tspan x="58.0" dy="18">• El axilar se lesiona en la luxación de hombro y el cuello quirúrgico; el mediano y el cubital, en el codo; el musculocutáneo, rara vez.</tspan></text><text x="58.0" y="892.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Shao YC et al., J Bone Joint Surg Br 2005;87:1647-52; Iatrogenic radial nerve palsy in humerus shaft fracture surgery, J Orthop Sci 2023; Rockwood and Green's</tspan><tspan x="58.0" dy="15">Fractures in Adults 9.ª ed. (2019).</tspan></text></svg>