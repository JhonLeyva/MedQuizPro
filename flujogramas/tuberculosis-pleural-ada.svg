<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="597" viewBox="0 0 1000 597" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Tuberculosis pleural"><title>Tuberculosis pleural</title><rect x="0.75" y="0.75" width="998.5" height="595.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16" y="16" width="968" height="56" rx="10" fill="#0f766e"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170" y1="34.0" x2="170" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="657"><tspan x="184.0" dy="0">NEUMOLOGÍA ENAM: TUBERCULOSIS PLEURAL</tspan></text><rect x="861.0" y="32.0" width="103.0" height="24" rx="12" fill="#134e4a"/><text x="912.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="87"><tspan x="912.5" dy="0">NEUMOLOGÍA</tspan></text><rect x="190.0" y="90.0" width="620" height="86.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="500.0" y="118.5" font-size="14.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Varón de 28 años de Lima con fiebre vespertina, tos seca y</tspan><tspan x="500.0" dy="19.0">dolor pleurítico</tspan></text><text x="500.0" y="160.0" font-size="12" font-weight="400" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Exudado: proteínas 5.1 g/dL · 85 % linfocitos · ADA 78 U/L · baciloscopía negativa</tspan></text><line x1="500.0" y1="176.0" x2="500.0" y2="197.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,196.0 505.0,196.0 500.0,204.0" fill="#0f766e"/><rect x="210.0" y="204.0" width="580" height="100.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="231.5" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="552"><tspan x="500.0" dy="0">TUBERCULOSIS PLEURAL</tspan></text><text x="500.0" y="254.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="552"><tspan x="500.0" dy="0">• Exudado linfocitario con ADA &gt; 40 U/L</tspan><tspan x="500.0" dy="17">• en adulto joven de zona de alta prevalencia</tspan><tspan x="500.0" dy="17">• Baciloscopía negativa NO la descarta</tspan></text><line x1="500.0" y1="304.0" x2="500.0" y2="322.0" stroke="#0f766e" stroke-width="2"/><line x1="270.0" y1="322.0" x2="730.0" y2="322.0" stroke="#0f766e" stroke-width="2"/><line x1="270.0" y1="322.0" x2="270.0" y2="337.0" stroke="#0f766e" stroke-width="2"/><polygon points="265.0,336.0 275.0,336.0 270.0,344.0" fill="#0f766e"/><line x1="730.0" y1="322.0" x2="730.0" y2="337.0" stroke="#0f766e" stroke-width="2"/><polygon points="725.0,336.0 735.0,336.0 730.0,344.0" fill="#0f766e"/><rect x="70.0" y="344.0" width="400" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="270.0" y="371.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="372"><tspan x="270.0" dy="0">Confirmar</tspan></text><text x="270.0" y="394.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="372"><tspan x="270.0" dy="0">Biopsia pleural (granulomas)</tspan><tspan x="270.0" dy="17">Cultivo y prueba molecular</tspan><tspan x="270.0" dy="17">Buscar TB pulmonar</tspan></text><rect x="530.0" y="344.0" width="400" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="730.0" y="371.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="372"><tspan x="730.0" dy="0">Tratar</tspan></text><text x="730.0" y="394.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="372"><tspan x="730.0" dy="0">Esquema para TB sensible</tspan><tspan x="730.0" dy="17">según la NTS vigente</tspan><tspan x="730.0" dy="17">Estudio de contactos</tspan></text><rect x="40" y="470.0" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="498.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="520.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La baciloscopía del líquido pleural es positiva en menos del 10 % de los casos.</tspan><tspan x="58.0" dy="18">• Derrame paraneumónico: neutrófilos · insuficiencia cardiaca: trasudado.</tspan></text><text x="58.0" y="560.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA – NTS N.° 200-MINSA/DGIESP-2023 (Tuberculosis) · Light RW, Pleural Diseases</tspan></text></svg>
