<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1214" viewBox="0 0 1000 1214" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Coge el sonajero, sostiene la cabeza, sin reflejo de prensión y sonríe fuerte: 4 meses"><title>Coge el sonajero, sostiene la cabeza, sin reflejo de prensión y sonríe fuerte: 4 meses</title><rect x="0.75" y="0.75" width="998.5" height="1212.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · hitos del desarrollo</tspan></text><rect x="378.4" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="427.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="427.4" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hitos del desarrollo del lactante</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cada hito se logra en una edad conocida.</tspan><tspan x="58.0" dy="17">El reflejo de prensión palmar desaparece entre los 3 y los 4 meses.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante en control de crecimiento y desarrollo</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Coge el sonajero y mantiene firme la cabeza.</tspan><tspan x="640.0" dy="16">No sostiene el tronco, no tiene prensión palmar y</tspan><tspan x="640.0" dy="16">sonríe fuerte.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EN QUÉ MESES APARECE CADA HITO</tspan></text><line x1="290.0" y1="307.0" x2="290.0" y2="501.0" stroke="#e2e8f0" stroke-width="1"/><text x="290.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="290.0" dy="0">0</tspan></text><line x1="362.2" y1="307.0" x2="362.2" y2="501.0" stroke="#e2e8f0" stroke-width="1"/><text x="362.2" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="362.2" dy="0">1</tspan></text><line x1="434.4" y1="307.0" x2="434.4" y2="501.0" stroke="#e2e8f0" stroke-width="1"/><text x="434.4" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="434.4" dy="0">2</tspan></text><line x1="506.7" y1="307.0" x2="506.7" y2="501.0" stroke="#e2e8f0" stroke-width="1"/><text x="506.7" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="506.7" dy="0">3</tspan></text><line x1="578.9" y1="307.0" x2="578.9" y2="501.0" stroke="#e2e8f0" stroke-width="1"/><text x="578.9" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="578.9" dy="0">4</tspan></text><line x1="651.1" y1="307.0" x2="651.1" y2="501.0" stroke="#e2e8f0" stroke-width="1"/><text x="651.1" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="651.1" dy="0">5</tspan></text><line x1="723.3" y1="307.0" x2="723.3" y2="501.0" stroke="#e2e8f0" stroke-width="1"/><text x="723.3" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="723.3" dy="0">6</tspan></text><line x1="795.6" y1="307.0" x2="795.6" y2="501.0" stroke="#e2e8f0" stroke-width="1"/><text x="795.6" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="795.6" dy="0">7</tspan></text><line x1="867.8" y1="307.0" x2="867.8" y2="501.0" stroke="#e2e8f0" stroke-width="1"/><text x="867.8" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="867.8" dy="0">8</tspan></text><line x1="940.0" y1="307.0" x2="940.0" y2="501.0" stroke="#e2e8f0" stroke-width="1"/><text x="940.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="940.0" dy="0">9</tspan></text><text x="940.0" y="289.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="end" data-max="60"><tspan x="940.0" dy="0">meses</tspan></text><rect x="40.0" y="311.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="327.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Reflejo de prensión palmar</tspan></text><text x="48.0" y="342.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Desaparece a los 3 a 4 meses</tspan></text><rect x="290.0" y="319.0" width="288.9" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="365.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Sonrisa social</tspan></text><text x="48.0" y="380.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Hacia los 2 meses</tspan></text><rect x="434.4" y="357.0" width="72.2" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><rect x="40.0" y="387.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="403.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Sostén cefálico y manos en la línea</tspan></text><text x="48.0" y="418.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Alcanza y coge objetos con intención</tspan></text><rect x="506.7" y="395.0" width="72.2" height="22.0" rx="6" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="48.0" y="441.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Sedestación con apoyo</tspan></text><text x="48.0" y="456.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Sostiene el tronco; voltea de prono a supino</tspan></text><rect x="651.1" y="433.0" width="72.2" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><rect x="40.0" y="463.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="479.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Sedestación sin apoyo</tspan></text><text x="48.0" y="494.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Se sienta solo y transfiere objetos</tspan></text><rect x="795.6" y="471.0" width="72.2" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><line x1="578.9" y1="309.0" x2="578.9" y2="507.0" stroke="#b91c1c" stroke-width="2.6"/><rect x="547.7" y="507.0" width="62.5" height="22.0" rx="11" fill="#b91c1c" stroke="none" stroke-width="1.5"/><text x="578.9" y="522.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="578.9" dy="0">4 meses</tspan></text><rect x="40.0" y="553.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="579.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Sostén cefálico + prensión voluntaria, sin tronco firme = 4 meses</tspan></text><text x="60.0" y="598.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">A los 2 aún hay reflejo; a los 6 a 8 meses ya sostiene el tronco o se sienta solo.</tspan></text><text x="40.0" y="659.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">HITOS DEL LACTANTE Y EDAD DE APARICIÓN</tspan></text><rect x="40.0" y="671.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="690.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="164"><tspan x="50.0" dy="0">Edad</tspan></text><text x="230.0" y="690.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="724"><tspan x="230.0" dy="0">Hito</tspan></text><rect x="40.0" y="700.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="719.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="164"><tspan x="50.0" dy="0">2 meses</tspan></text><text x="230.0" y="719.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="724"><tspan x="230.0" dy="0">Sonrisa social; eleva la cabeza en prono; persiste el reflejo de prensión</tspan></text><rect x="40.0" y="729.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="748.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="164"><tspan x="50.0" dy="0">3 a 4 meses</tspan></text><text x="230.0" y="748.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="724"><tspan x="230.0" dy="0">Sostén cefálico firme, manos en la línea media, alcanza y coge objetos; desaparece la prensión palmar</tspan></text><rect x="120.6" y="732.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="166.0" y="747.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="166.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="758.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="777.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="164"><tspan x="50.0" dy="0">5 a 6 meses</tspan></text><text x="230.0" y="777.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="724"><tspan x="230.0" dy="0">Sedestación con apoyo; voltea de prono a supino</tspan></text><rect x="40.0" y="787.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="806.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="164"><tspan x="50.0" dy="0">7 a 8 meses</tspan></text><text x="230.0" y="806.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="724"><tspan x="230.0" dy="0">Se sienta solo y transfiere objetos</tspan></text><text x="40.0" y="856.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="866.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="888.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="869.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="888.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">4 meses</tspan></text><text x="435.0" y="888.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">2 meses</tspan></text><text x="585.0" y="888.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">6 meses</tspan></text><text x="735.0" y="888.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">7 meses</tspan></text><text x="885.0" y="888.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">8 meses</tspan></text><rect x="40.0" y="903.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="903.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="940.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Edad aproximada?</tspan></text><text x="285.0" y="924.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: sostén cefálico y</tspan><tspan x="285.0" dy="16">prensión voluntaria sin</tspan><tspan x="285.0" dy="16">sostén del tronco</tspan></text><text x="435.0" y="932.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: a los 2 meses aún</tspan><tspan x="435.0" dy="16">persiste el reflejo</tspan></text><text x="585.0" y="932.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: a los 6 meses ya</tspan><tspan x="585.0" dy="16">se sienta con apoyo</tspan></text><text x="735.0" y="932.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: a los 7 meses se</tspan><tspan x="735.0" dy="16">sienta solo</tspan></text><text x="885.0" y="932.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: a los 8 meses</tspan><tspan x="885.0" dy="16">transfiere objetos</tspan></text><rect x="40.0" y="866.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="993.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1021.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1043.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• A los 2 meses sonríe de manera social y eleva la cabeza en prono; a los 3 a 4 meses sostiene firme la cabeza, lleva las manos a la línea media y alcanza</tspan><tspan x="58.0" dy="18">   objetos con intención.</tspan><tspan x="58.0" dy="18">• Sin reflejo de prensión y con agarre voluntario del sonajero, el reflejo primitivo ya fue reemplazado: 4 meses.</tspan><tspan x="58.0" dy="18">• Sostener el tronco (sedestación con apoyo) llega a los 5 a 6 meses; sentarse solo y transferir objetos, a los 7 a 8 meses. Con 2 meses aún persiste el</tspan><tspan x="58.0" dy="18">   reflejo.</tspan><tspan x="58.0" dy="18">• Alerta: reflejo de prensión persistente o falta de sostén cefálico a los 4 a 5 meses obligan a descartar hipotonía o daño neurológico y a derivar a</tspan><tspan x="58.0" dy="18">   estimulación temprana.</tspan></text><text x="58.0" y="1173.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Zubler JM et al., Hitos del desarrollo para herramientas de vigilancia, Pediatrics 2022; Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>