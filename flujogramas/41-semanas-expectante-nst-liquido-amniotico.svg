<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="862" viewBox="0 0 1000 862" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Vigilancia fetal a las 41 semanas"><title>Vigilancia fetal a las 41 semanas</title><rect x="0.75" y="0.75" width="998.5" height="860.8" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">OBSTETRICIA ENAM: EMBARAZO EN VÍAS DE PROLONGACIÓN</tspan></text><rect x="581.6" y="32.0" width="94.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="628.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="79"><tspan x="628.9" dy="0">OBSTETRICIA</tspan></text><rect x="40.0" y="90.0" width="560.0" height="152.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Monitoreo en el embarazo prolongado</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Desde las 41 semanas, si se espera: NST + líquido amniótico</tspan><tspan x="58.0" dy="17">Es el perfil biofísico modificado, dos veces por semana</tspan></text><rect x="620.0" y="90.0" width="340.0" height="152.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="150.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante de 41 semanas por eco del 1.er</tspan><tspan x="640.0" dy="17">trimestre</tspan></text><text x="640.0" y="176.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Sin complicaciones</tspan><tspan x="640.0" dy="16">Conducta expectante acordada, hospitalizada</tspan></text><rect x="640.0" y="213.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="226.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="226.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="274.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PLAN DESDE LAS 41 SEMANAS</tspan></text><rect x="42.0" y="286.0" width="226.0" height="216.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="155.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="155.0" dy="0">41 SEM</tspan></text><text x="155.0" y="494.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="155.0" dy="0">Decidir</tspan></text><rect x="272.0" y="286.0" width="226.0" height="216.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="385.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="210"><tspan x="385.0" dy="0">SI ESPERA</tspan></text><text x="385.0" y="494.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="385.0" dy="0">2 veces/semana</tspan></text><rect x="502.0" y="286.0" width="226.0" height="216.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="615.0" dy="0">ALTERADO</tspan></text><text x="615.0" y="494.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="615.0" dy="0">Oligohidramnios o NST no reactivo</tspan></text><rect x="732.0" y="286.0" width="226.0" height="216.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="845.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="845.0" dy="0">42 SEM</tspan></text><text x="845.0" y="494.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="845.0" dy="0">Límite</tspan></text><path d="M 60.0,465.8 L 206.7,460.7 L 353.3,450.5 L 500.0,435.2 L 646.7,414.8 L 793.3,394.4 L 940.0,379.1" fill="none" stroke="#e11d48" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="58.0" y1="326.0" x2="80.0" y2="326.0" stroke="#e11d48" stroke-width="3"/><text x="86.0" y="330.0" font-size="10.5" font-weight="700" font-style="normal" fill="#e11d48" text-anchor="start" data-max="200"><tspan x="86.0" dy="0">Riesgo fetal</tspan></text><line x1="385.0" y1="288.0" x2="385.0" y2="478.0" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/><rect x="339.6" y="461.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="385.0" y="476.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="385.0" dy="0">◆ ESTE CASO</tspan></text><rect x="48.0" y="516.0" width="214.0" height="93.3" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="155.0" y="554.4" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="155.0" dy="0">Inducir o esperar</tspan></text><text x="155.0" y="578.1" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="155.0" dy="0">Acuerdo con la paciente</tspan></text><rect x="278.0" y="516.0" width="214.0" height="93.3" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="385.0" y="544.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="186"><tspan x="385.0" dy="0">NST + LÍQUIDO</tspan><tspan x="385.0" dy="19.2">AMNIÓTICO</tspan></text><text x="385.0" y="587.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="186"><tspan x="385.0" dy="0">Perfil biofísico modificado</tspan></text><rect x="508.0" y="516.0" width="214.0" height="93.3" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="615.0" y="554.4" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="615.0" dy="0">Terminar</tspan></text><text x="615.0" y="578.1" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="615.0" dy="0">Inducción o cesárea</tspan></text><rect x="738.0" y="516.0" width="214.0" height="93.3" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="845.0" y="554.4" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="845.0" dy="0">Terminar la gestación</tspan></text><text x="845.0" y="578.1" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="845.0" dy="0">Más riesgo de muerte fetal</tspan></text><text x="40.0" y="647.3" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PRUEBA DE MONITOREO · MARCADA LA CORRECTA</tspan></text><rect x="40.0" y="659.3" width="170.5" height="30.0" rx="15" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="125.2" y="678.8" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="125.2" dy="0">✓ NST + líquido amniótico</tspan></text><rect x="218.5" y="659.3" width="124.4" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="280.7" y="678.8" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="280.7" dy="0">Doppler umbilical</tspan></text><rect x="350.9" y="659.3" width="157.9" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="429.8" y="678.8" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="429.8" dy="0">Doppler cerebral media</tspan></text><rect x="516.7" y="659.3" width="119.6" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="576.5" y="678.8" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="576.5" dy="0">Arterias uterinas</tspan></text><rect x="40.0" y="713.3" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="741.3" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="763.3" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El Doppler es para fetos con restricción del crecimiento, no para el postérmino normal.</tspan><tspan x="58.0" dy="18">• Oligohidramnios: bolsillo mayor &lt; 2 cm.</tspan><tspan x="58.0" dy="18">• Ofrecer inducción a partir de las 41 semanas.</tspan></text><text x="58.0" y="821.3" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG – Practice Bulletin 146 (2014) · ACOG – Antepartum fetal surveillance (2021)</tspan></text></svg>