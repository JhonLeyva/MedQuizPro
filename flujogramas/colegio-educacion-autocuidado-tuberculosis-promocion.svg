text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Dar a las personas conocimientos y capacidades para cuidar su salud y la de su</tspan><tspan x="58.0" dy="17">comunidad.</tspan><tspan x="58.0" dy="17">Educación, entornos saludables (escuelas), políticas públicas; se hace en población sana.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Centro de salud y colegio</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Coordinación con el director.</tspan><tspan x="640.0" dy="16">Educación sobre autocuidado, síntomas de TB y</tspan><tspan x="640.0" dy="16">transmisión.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TIPOS DE INTERVENCIÓN SANITARIA</tspan></text><rect x="42.0" y="295.0" width="226.0" height="56.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="155.0" y="320.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="210"><tspan x="155.0" dy="0">POBLACIÓN SANA</tspan></text><text x="155.0" y="339.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="155.0" dy="0">Educar y empoderar</tspan></text><rect x="272.0" y="295.0" width="226.0" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="385.0" y="320.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="385.0" dy="0">RIESGO DE ENFERMAR</tspan></text><text x="385.0" y="339.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="385.0" dy="0">Acción específica</tspan></text><rect x="502.0" y="295.0" width="226.0" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="320.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="615.0" dy="0">ENFERMO</tspan></text><text x="615.0" y="339.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="615.0" dy="0">Diagnóstico y cura</tspan></text><rect x="732.0" y="295.0" width="226.0" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="845.0" y="320.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="845.0" dy="0">CON SECUELAS</tspan></text><text x="845.0" y="339.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="845.0" dy="0">Función</tspan></text><rect x="109.6" y="284.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="155.0" y="299.0" font-size="10" font-weight="800" font-style="n