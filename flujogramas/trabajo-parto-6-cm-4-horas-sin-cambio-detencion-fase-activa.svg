<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1265" viewBox="0 0 1000 1265" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="6 cm durante 4 horas con buenas contracciones: detención de la fase activa"><title>6 cm durante 4 horas con buenas contracciones: detención de la fase activa</title><rect x="0.75" y="0.75" width="998.5" height="1263.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Trabajo de parto · alteraciones del progreso</tspan></text><rect x="458.4" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="545.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="545.6" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Fases del trabajo de parto</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Latente: hasta los 6 cm. Activa: desde los 6 cm hasta la dilatación completa.</tspan><tspan x="58.0" dy="17">En fase activa se espera avance; si no avanza con buena dinámica, hay detención.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Primigesta de 39 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">6 cm, AP -2, contracciones moderadas cada 3 minutos.</tspan><tspan x="640.0" dy="16">4 horas después: sigue en 6 cm y AP -2; LCF</tspan><tspan x="640.0" dy="16">normales.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">FASE Y PROGRESO</tspan></text><text x="202.0" y="297.0" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="758"><tspan x="202.0" dy="0">→ PROGRESO</tspan></text><rect x="202.0" y="307.0" width="373.0" height="35.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="388.5" y="329.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="353"><tspan x="388.5" dy="0">Progresa</tspan></text><rect x="587.0" y="307.0" width="373.0" height="35.0" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="773.5" y="329.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="353"><tspan x="773.5" dy="0">No progresa</tspan></text><text x="40.0" y="328.5" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="146"><tspan x="40.0" dy="0">↓ FASE</tspan></text><rect x="40.0" y="354.0" width="150.0" height="76.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="115.0" y="396.5" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Latente (&lt; 6 cm)</tspan></text><rect x="202.0" y="354.0" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="355.0" width="6.0" height="74.0" rx="3" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="388.5" y="383.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Normal</tspan></text><text x="388.5" y="406.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Puede durar muchas horas</tspan></text><rect x="587.0" y="354.0" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="588.0" y="355.0" width="6.0" height="74.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="773.5" y="383.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Fase latente prolongada</tspan></text><text x="773.5" y="406.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">&gt; 20 h en nulíparas</tspan></text><rect x="40.0" y="442.0" width="150.0" height="76.0" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="115.0" y="484.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Activa (≥ 6 cm)</tspan></text><rect x="202.0" y="442.0" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="443.0" width="6.0" height="74.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="388.5" y="471.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Normal</tspan></text><text x="388.5" y="494.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">≥ 1 cm/h aprox.</tspan></text><rect x="587.0" y="442.0" width="373.0" height="76.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="773.5" y="471.6" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Detención de la fase activa</tspan></text><text x="773.5" y="494.6" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">≥ 4 h sin cambio con buena dinámica</tspan></text><rect x="728.1" y="507.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="773.5" y="522.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="773.5" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="530.0" width="150.0" height="76.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="115.0" y="572.5" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Expulsivo</tspan></text><rect x="202.0" y="530.0" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="531.0" width="6.0" height="74.0" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="388.5" y="559.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Normal</tspan></text><text x="388.5" y="582.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">El feto desciende</tspan></text><rect x="587.0" y="530.0" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="588.0" y="531.0" width="6.0" height="74.0" rx="3" fill="#6366f1" stroke="none" stroke-width="1.5"/><text x="773.5" y="559.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Expulsivo prolongado</tspan></text><text x="773.5" y="582.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">&gt; 3 h en nulíparas (con epidural, más)</tspan></text><text x="40.0" y="656.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="668.0" width="442.0" height="287.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="678.0" width="152.5" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="692.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="400"><tspan x="61.0" dy="0">PARTOGRAMA DEL CASO</tspan></text><g data-box="54.0 706.0 414.0 225.0"><g transform="translate(54.0,706.0) scale(0.9)"><rect x="50" y="16" width="390" height="190" fill="#f8fafc" stroke="#cbd5e1"/><line x1="50" y1="206.0" x2="440" y2="206.0" stroke="#e2e8f0"/><text x="44" y="210.0" font-size="10" font-weight="600" fill="#64748b" text-anchor="end" data-max="0">4</text><line x1="50" y1="174.3" x2="440" y2="174.3" stroke="#e2e8f0"/><text x="44" y="178.33333333333334" font-size="10" font-weight="600" fill="#64748b" text-anchor="end" data-max="0">5</text><line x1="50" y1="142.7" x2="440" y2="142.7" stroke="#e2e8f0"/><text x="44" y="146.66666666666666" font-size="10" font-weight="600" fill="#64748b" text-anchor="end" data-max="0">6</text><line x1="50" y1="111.0" x2="440" y2="111.0" stroke="#e2e8f0"/><text x="44" y="115.0" font-size="10" font-weight="600" fill="#64748b" text-anchor="end" data-max="0">7</text><line x1="50" y1="79.3" x2="440" y2="79.3" stroke="#e2e8f0"/><text x="44" y="83.33333333333333" font-size="10" font-weight="600" fill="#64748b" text-anchor="end" data-max="0">8</text><line x1="50" y1="47.7" x2="440" y2="47.7" stroke="#e2e8f0"/><text x="44" y="51.666666666666664" font-size="10" font-weight="600" fill="#64748b" text-anchor="end" data-max="0">9</text><line x1="50" y1="16.0" x2="440" y2="16.0" stroke="#e2e8f0"/><text x="44" y="20.0" font-size="10" font-weight="600" fill="#64748b" text-anchor="end" data-max="0">10</text><text x="50.0" y="222" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">0 h</text><text x="128.0" y="222" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">2 h</text><text x="206.0" y="222" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">4 h</text><text x="284.0" y="222" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">6 h</text><text x="362.0" y="222" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">8 h</text><text x="440.0" y="222" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">10 h</text><line x1="50.0" y1="142.7" x2="206.0" y2="16.0" stroke="#16a34a" stroke-width="2.5"/><text x="212.0" y="30.0" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">progreso esperado (≥ 1 cm/h)</text><text x="212.0" y="30.0" font-size="10" font-weight="800" fill="#16a34a" text-anchor="start" data-max="0">progreso esperado (≥ 1 cm/h)</text><path d="M50.0 142.7 L206.0 142.7" fill="none" stroke="#ea580c" stroke-width="3" stroke-linejoin="round" /><circle cx="50.0" cy="142.66666666666666" r="7" fill="#ea580c" stroke="#7c2d12" stroke-width="2" /><circle cx="206.0" cy="142.66666666666666" r="7" fill="#ea580c" stroke="#7c2d12" stroke-width="2" /><text x="128.0" y="166.66666666666666" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">4 h sin cambio con buenas contracciones</text><text x="128.0" y="166.66666666666666" font-size="10.5" font-weight="800" fill="#9a3412" text-anchor="middle" data-max="0">4 h sin cambio con buenas contracciones</text><text x="12" y="111.0" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">cm</text></g></g><rect x="504.0" y="668.0" width="456.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="522.0" cy="683.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="522.0" y="687.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="522.0" dy="0">1</tspan></text><text x="540.0" y="688.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="412"><tspan x="540.0" dy="0">A las 0 h: 6 cm, AP -2.</tspan></text><rect x="504.0" y="706.0" width="456.0" height="31.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="522.0" cy="721.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="522.0" y="725.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="522.0" dy="0">2</tspan></text><text x="540.0" y="726.0" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="412"><tspan x="540.0" dy="0">A las 4 h: 6 cm, AP -2, con 1 contracción cada 3 min.</tspan></text><rect x="504.0" y="744.0" width="456.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="522.0" cy="759.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="522.0" y="763.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="522.0" dy="0">3</tspan></text><text x="540.0" y="764.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="412"><tspan x="540.0" dy="0">La línea verde muestra el avance esperado: no lo hay.</tspan></text><text x="40.0" y="995.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1005.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1027.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="1027.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Falso trabajo de parto</tspan></text><rect x="400.5" y="1008.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="1027.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Detención de fase activa</tspan></text><text x="678.8" y="1027.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Latente prolongada</tspan></text><text x="866.2" y="1027.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Expulsivo prolongado</tspan></text><rect x="40.0" y="1042.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="1042.0" width="181.5" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1071.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Por qué</tspan></text><text x="303.8" y="1063.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Ya tiene 6 cm y contracciones</tspan><tspan x="303.8" dy="16">regulares</tspan></text><text x="491.2" y="1071.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">6 cm, 4 h sin cambio</tspan></text><text x="678.8" y="1071.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Ya pasó los 6 cm</tspan></text><text x="866.2" y="1071.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No está en expulsivo</tspan></text><rect x="40.0" y="1005.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1116.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1144.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1166.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• ≥ 6 cm sin cambio por ≥ 4 h con contracciones adecuadas (o ≥ 6 h si son inadecuadas) = detención de la fase activa.</tspan><tspan x="58.0" dy="18">• Con membranas íntegras suele intentarse amniotomía y oxitocina antes de indicar cesárea.</tspan><tspan x="58.0" dy="18">• Fase latente prolongada: &gt; 20 h en nulíparas antes de los 6 cm.</tspan></text><text x="58.0" y="1224.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG/SMFM, prevención de la primera cesárea (2014); Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>