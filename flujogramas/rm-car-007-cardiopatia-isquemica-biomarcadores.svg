<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1042" viewBox="0 0 1000 1042" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La troponina I es el mejor marcador cardiaco para confirmar un infarto de miocardio"><title>La troponina I es el mejor marcador cardiaco para confirmar un infarto de miocardio</title><rect x="0.75" y="0.75" width="998.5" height="1040.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Cardiopatía isquémica · biomarcadores</tspan></text><rect x="432.4" y="32.0" width="117.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="491.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="101"><tspan x="491.1" dy="0">CARDIOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Biomarcadores del infarto</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Las troponinas son específicas del cardiomiocito: suben a las 2-4 h y duran 7-14 días.</tspan><tspan x="58.0" dy="17">La CK-MB sirve para reinfarto; la mioglobina es precoz pero inespecífica.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 62 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dolor torácico, diaforesis y supradesnivel del ST con T</tspan><tspan x="640.0" dy="16">negativas de V1 a V4.</tspan><tspan x="640.0" dy="16">¿Qué marcador confirma el infarto?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CUÁNDO SUBE CADA MARCADOR</tspan></text><rect x="40.0" y="285.0" width="540.0" height="340.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><line x1="98.0" y1="577.0" x2="562.0" y2="577.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="581.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">0</tspan></text><line x1="98.0" y1="509.0" x2="562.0" y2="509.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="513.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">5</tspan></text><line x1="98.0" y1="441.0" x2="562.0" y2="441.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="445.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">10</tspan></text><line x1="98.0" y1="305.0" x2="562.0" y2="305.0" stroke="#e2e8f0" stroke-width="1"/><text x="90.0" y="309.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="end" data-max="50"><tspan x="90.0" dy="0">20</tspan></text><line x1="98.0" y1="577.0" x2="98.0" y2="582.0" stroke="#94a3b8" stroke-width="1.5"/><text x="98.0" y="596.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="98.0" dy="0">0</tspan></text><line x1="175.3" y1="577.0" x2="175.3" y2="582.0" stroke="#94a3b8" stroke-width="1.5"/><text x="175.3" y="596.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="175.3" dy="0">12</tspan></text><line x1="252.7" y1="577.0" x2="252.7" y2="582.0" stroke="#94a3b8" stroke-width="1.5"/><text x="252.7" y="596.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="252.7" dy="0">24</tspan></text><line x1="407.3" y1="577.0" x2="407.3" y2="582.0" stroke="#94a3b8" stroke-width="1.5"/><text x="407.3" y="596.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="407.3" dy="0">48</tspan></text><line x1="562.0" y1="577.0" x2="562.0" y2="582.0" stroke="#94a3b8" stroke-width="1.5"/><text x="562.0" y="596.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="70"><tspan x="562.0" dy="0">72 h</tspan></text><line x1="98.0" y1="577.0" x2="562.0" y2="577.0" stroke="#94a3b8" stroke-width="1.5"/><line x1="98.0" y1="305.0" x2="98.0" y2="577.0" stroke="#94a3b8" stroke-width="1.5"/><text x="330.0" y="615.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="464"><tspan x="330.0" dy="0">Horas desde el inicio del dolor</tspan></text><text x="56.0" y="441.0" transform="rotate(-90 56.0 441.0)" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Veces el límite normal</text><polyline points="98.0,577.0 123.8,536.2 252.7,332.2 407.3,413.8 562.0,468.2" fill="none" stroke="#0f766e" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="412.0" y1="339.0" x2="434.0" y2="339.0" stroke="#0f766e" stroke-width="3"/><text x="440.0" y="343.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="120"><tspan x="440.0" dy="0">Troponina</tspan></text><polyline points="98.0,577.0 123.8,549.8 214.0,454.6 407.3,563.4 562.0,570.2" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="412.0" y1="357.0" x2="434.0" y2="357.0" stroke="#f59e0b" stroke-width="3"/><text x="440.0" y="361.0" font-size="10.5" font-weight="700" font-style="normal" fill="#f59e0b" text-anchor="start" data-max="120"><tspan x="440.0" dy="0">CK-MB</tspan></text><polyline points="98.0,577.0 110.9,509.0 149.6,549.8 252.7,570.2" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="412.0" y1="375.0" x2="434.0" y2="375.0" stroke="#94a3b8" stroke-width="3"/><text x="440.0" y="379.0" font-size="10.5" font-weight="700" font-style="normal" fill="#94a3b8" text-anchor="start" data-max="120"><tspan x="440.0" dy="0">Mioglobina</tspan></text><line x1="252.7" y1="332.2" x2="252.7" y2="577.0" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4"/><circle cx="252.7" cy="332.2" r="9" fill="#ea580c" stroke="#ffffff" stroke-width="3"/><rect x="193.0" y="307.2" width="119.4" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="252.7" y="322.2" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="252.7" dy="0">◆ Pico de troponina</tspan></text><rect x="602.0" y="364.5" width="358.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="617.0" y="388.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Troponina: sube a las 2-4 h</tspan></text><text x="617.0" y="405.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Dura 7-14 días: la más específica.</tspan></text><rect x="602.0" y="427.5" width="358.0" height="55.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="617.0" y="451.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">CK-MB: 3-6 h</tspan></text><text x="617.0" y="468.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Normal a las 48-72 h: sirve para reinfarto.</tspan></text><rect x="602.0" y="490.5" width="358.0" height="55.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="617.0" y="514.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Mioglobina: 1-2 h</tspan></text><text x="617.0" y="531.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="328"><tspan x="617.0" dy="0">Precoz pero inespecífica.</tspan></text><rect x="40.0" y="643.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="669.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Troponina I = mejor marcador del infarto</tspan></text><text x="60.0" y="688.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Se mide en serie con ensayos de alta sensibilidad.</tspan></text><text x="40.0" y="755.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="765.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="796.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="768.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="796.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Troponina I</tspan></text><text x="435.0" y="796.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">LDH</tspan></text><text x="585.0" y="796.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Mioglobina</tspan></text><text x="735.0" y="796.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">CPK-MB</tspan></text><text x="885.0" y="787.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Péptido natriurético</tspan><tspan x="885.0" dy="17">atrial</tspan></text><rect x="40.0" y="819.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="819.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="848.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Mejor marcador?</tspan></text><text x="285.0" y="840.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: específica del</tspan><tspan x="285.0" dy="16">cardiomiocito</tspan></text><text x="435.0" y="840.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: obsoleta e</tspan><tspan x="435.0" dy="16">inespecífica</tspan></text><text x="585.0" y="840.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: precoz pero</tspan><tspan x="585.0" dy="16">inespecífica</tspan></text><text x="735.0" y="840.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: útil para reinfarto,</tspan><tspan x="735.0" dy="16">menos específica</tspan></text><text x="885.0" y="840.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: mide insuficiencia</tspan><tspan x="885.0" dy="16">cardiaca</tspan></text><rect x="40.0" y="765.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="893.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="921.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="943.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Troponina de alta sensibilidad en serie (0/1 h o 0/2 h): confirma o descarta el infarto.</tspan><tspan x="58.0" dy="18">• En el STEMI no se espera la troponina para reperfundir.</tspan><tspan x="58.0" dy="18">• Cuarta definición universal (2018): elevación o caída de troponina con isquemia clínica, ECG o imagen.</tspan></text><text x="58.0" y="1001.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ESC, síndromes coronarios agudos (2023); Cuarta Definición Universal del Infarto (2018); AHA/ACC, dolor torácico (2021)</tspan></text></svg>