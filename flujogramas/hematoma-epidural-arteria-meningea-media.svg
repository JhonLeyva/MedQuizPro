<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1230" viewBox="0 0 1000 1230" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Accidente de tránsito hace 6 horas con Glasgow 10 y TC cerebral: hematoma epidural"><title>Accidente de tránsito hace 6 horas con Glasgow 10 y TC cerebral: hematoma epidural</title><rect x="0.75" y="0.75" width="998.5" height="1229.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Traumatismo craneoencefálico · hematomas intracraneales</tspan></text><rect x="548.7" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="613.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="613.0" dy="0">NEUROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hematoma epidural</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Sangre arterial (meníngea media) entre el hueso y la duramadre, casi siempre con fractura</tspan><tspan x="58.0" dy="17">temporal.</tspan><tspan x="58.0" dy="17">En la TC: lente biconvexa que no cruza las suturas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 60 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Accidente de tránsito hace 6 horas.</tspan><tspan x="640.0" dy="16">Glasgow 10; tiene TC cerebral.</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#94a3b8"/><line x1="500.0" y1="349.0" x2="500.0" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="379.0" x2="811.3" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="379.0" x2="188.7" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,407.0 193.7,407.0 188.7,415.0" fill="#94a3b8"/><line x1="500.0" y1="379.0" x2="500.0" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,407.0 505.0,407.0 500.0,415.0" fill="#94a3b8"/><line x1="811.3" y1="379.0" x2="811.3" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,407.0 816.3,407.0 811.3,415.0" fill="#94a3b8"/><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#0f766e"/><line x1="500.0" y1="349.0" x2="500.0" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="379.0" x2="500.0" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="379.0" x2="188.7" y2="408.0" stroke="#0f766e" stroke-width="3"/><polygon points="183.7,407.0 193.7,407.0 188.7,415.0" fill="#0f766e"/><rect x="107.6" y="388.0" width="162.0" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="188.7" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">Lente biconvexa (lo descrito)</tspan></text><rect x="469.2" y="388.0" width="61.6" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="500.0" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">Semiluna</tspan></text><rect x="756.8" y="388.0" width="109.1" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="811.3" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">Dentro del cerebro</tspan></text><polygon points="240.0,320.0 266.0,291.0 734.0,291.0 760.0,320.0 734.0,349.0 266.0,349.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="320.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="325.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="324.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">TEC con TC: ¿forma de la colección?</tspan></text><rect x="40.0" y="415.0" width="297.3" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="188.7" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">HEMATOMA EPIDURAL</tspan></text><text x="188.7" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">No cruza suturas</tspan><tspan x="188.7" dy="17">Cirugía si &gt; 30 cm³</tspan></text><rect x="351.3" y="415.0" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="451.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Hematoma subdural</tspan></text><text x="500.0" y="474.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Cruza suturas; ancianos, venas puente</tspan></text><rect x="662.7" y="415.0" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="451.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Contusión o hematoma intracerebral</tspan></text><text x="811.3" y="474.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Lóbulos frontal y temporal</tspan></text><text x="40.0" y="545.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="557.5" width="920.0" height="346.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="571.5" width="283.0" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="197.5" y="591.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="197.5" dy="0">GRAVEDAD DEL TEC POR GLASGOW</tspan></text><text x="355.0" y="591.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="587"><tspan x="355.0" dy="0">Se usa el mejor Glasgow tras reanimar (sin sedación).</tspan></text><rect x="56.0" y="631.5" width="288.0" height="121.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="632.1" width="286.8" height="63.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="200.0" y="659.5" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="272"><tspan x="200.0" dy="0">GLASGOW 13-15</tspan></text><text x="200.0" y="679.5" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="264"><tspan x="200.0" dy="0">Leve</tspan></text><circle cx="72.0" cy="704.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="708.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="82.0" dy="0">TC si hay factores de riesgo</tspan></text><circle cx="72.0" cy="727.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="731.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="82.0" dy="0">Observación</tspan></text><rect x="356.0" y="631.5" width="288.0" height="121.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="357.2" y="632.7" width="285.6" height="63.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="500.0" y="659.5" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="272"><tspan x="500.0" dy="0">GLASGOW 9-12</tspan></text><text x="500.0" y="679.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="264"><tspan x="500.0" dy="0">Moderado</tspan></text><circle cx="372.0" cy="704.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="382.0" y="708.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="250"><tspan x="382.0" dy="0">TC siempre</tspan></text><circle cx="372.0" cy="727.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="382.0" y="731.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="250"><tspan x="382.0" dy="0">Hospitalizar, neurocirugía</tspan></text><rect x="454.6" y="620.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="500.0" y="635.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">◆ ESTE CASO</tspan></text><rect x="656.0" y="631.5" width="288.0" height="121.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="656.6" y="632.1" width="286.8" height="63.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="800.0" y="659.5" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="272"><tspan x="800.0" dy="0">GLASGOW ≤ 8</tspan></text><text x="800.0" y="679.5" font-size="14" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="264"><tspan x="800.0" dy="0">Grave</tspan></text><circle cx="672.0" cy="704.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="682.0" y="708.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="682.0" dy="0">Intubar</tspan></text><circle cx="672.0" cy="727.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="682.0" y="731.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="682.0" dy="0">TC y neurocirugía urgente</tspan></text><text x="56.0" y="782.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="791.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="806.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="806.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Glasgow 10 al llegar</tspan></text><rect x="56.0" y="813.5" width="20.0" height="20.0" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="66.0" y="828.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✕</tspan></text><text x="88.0" y="828.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Por encima de 8: aún no exige intubación por el Glasgow</tspan></text><rect x="56.0" y="850.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="873.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">TEC moderado: TC, hospitalización y neurocirugía; operar si el hematoma cumple criterios.</tspan></text><text x="40.0" y="943.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="953.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="984.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="976.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Fractura de base de</tspan><tspan x="285.0" dy="17">cráneo</tspan></text><rect x="363.0" y="956.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="984.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hematoma epidural</tspan></text><text x="585.0" y="976.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Hematoma</tspan><tspan x="585.0" dy="17">intracerebral</tspan></text><text x="735.0" y="984.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hematoma subdural</tspan></text><text x="885.0" y="984.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Contusión cerebral</tspan></text><rect x="40.0" y="1007.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="1007.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1036.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Encaja con la TC?</tspan></text><text x="285.0" y="1028.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Puede coexistir; no es</tspan><tspan x="285.0" dy="16">una colección</tspan></text><text x="435.0" y="1036.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: lente biconvexa</tspan></text><text x="585.0" y="1036.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: dentro del cerebro</tspan></text><text x="735.0" y="1028.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: semiluna que</tspan><tspan x="735.0" dy="16">cruza suturas</tspan></text><text x="885.0" y="1028.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: lesión del</tspan><tspan x="885.0" dy="16">parénquima</tspan></text><rect x="40.0" y="953.5" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1081.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1109.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1131.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Epidural: lente biconvexa que no cruza suturas; subdural: semiluna que cruza suturas y sigue el hemisferio.</tspan><tspan x="58.0" dy="18">• Cirugía si el volumen es &gt; 30 cm³, el grosor &gt; 15 mm, el desplazamiento &gt; 5 mm o hay anisocoria con Glasgow &lt; 9.</tspan><tspan x="58.0" dy="18">• Glasgow 9-12 = TEC moderado: hospitalizar con TC y evaluación por neurocirugía.</tspan></text><text x="58.0" y="1189.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Brain Trauma Foundation, guías de TEC grave (4.ª ed.) y manejo quirúrgico; ATLS 11.ª ed. (2025).</tspan></text></svg>