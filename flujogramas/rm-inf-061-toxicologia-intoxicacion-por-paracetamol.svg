<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la intoxicación por paracetamol el antídoto es la N-acetilcisteína, mejor si se da en las primeras 8 a 10 horas"><title>En la intoxicación por paracetamol el antídoto es la N-acetilcisteína, mejor si se da en las primeras 8 a 10 horas</title><rect x="0.75" y="0.75" width="998.5" height="1008.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Toxicología · intoxicación por paracetamol</tspan></text><rect x="451.3" y="32.0" width="121.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="512.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="106"><tspan x="512.2" dy="0">INFECTOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Paracetamol</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Una fracción pequeña se oxida en CYP2E1 a NAPQI, que el glutatión detoxifica.</tspan><tspan x="58.0" dy="17">En sobredosis se agota el glutatión y hay necrosis centrolobulillar.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Intoxicación por paracetamol en urgencias.</tspan><tspan x="640.0" dy="16">¿Cuál es el tratamiento específico?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EVOLUCIÓN DE LA INTOXICACIÓN Y MOMENTO DEL ANTÍDOTO</tspan></text><rect x="42.0" y="279.0" width="226.0" height="56.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="155.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="210"><tspan x="155.0" dy="0">FASE 1</tspan></text><text x="155.0" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="155.0" dy="0">0 a 24 horas</tspan></text><rect x="272.0" y="279.0" width="226.0" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="385.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="385.0" dy="0">FASE 2</tspan></text><text x="385.0" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="385.0" dy="0">24 a 72 horas</tspan></text><rect x="502.0" y="279.0" width="226.0" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="615.0" dy="0">FASE 3</tspan></text><text x="615.0" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="615.0" dy="0">72 a 96 horas</tspan></text><rect x="732.0" y="279.0" width="226.0" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="845.0" y="304.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="845.0" dy="0">FASE 4</tspan></text><text x="845.0" y="323.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="845.0" dy="0">Después de 4 días</tspan></text><rect x="109.6" y="268.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="155.0" y="283.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="155.0" dy="0">◆ ESTE CASO</tspan></text><rect x="48.0" y="349.0" width="214.0" height="108.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="155.0" y="377.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="186"><tspan x="155.0" dy="0">ANTÍDOTO AQUÍ</tspan></text><text x="155.0" y="401.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="186"><tspan x="155.0" dy="0">Náuseas o asintomático</tspan><tspan x="155.0" dy="17">N-acetilcisteína mejor en 8 a 10</tspan><tspan x="155.0" dy="17">h</tspan></text><rect x="278.0" y="349.0" width="214.0" height="108.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="385.0" y="386.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="385.0" dy="0">LESIÓN HEPÁTICA</tspan></text><text x="385.0" y="410.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="385.0" dy="0">Transaminasas en ascenso</tspan><tspan x="385.0" dy="17">Dolor en hipocondrio derecho</tspan></text><rect x="508.0" y="349.0" width="214.0" height="108.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="615.0" y="377.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="615.0" dy="0">FALLO HEPÁTICO</tspan></text><text x="615.0" y="401.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="615.0" dy="0">Ictericia, coagulopatía,</tspan><tspan x="615.0" dy="17">encefalopatía</tspan><tspan x="615.0" dy="17">Criterios del King's College</tspan></text><rect x="738.0" y="349.0" width="214.0" height="108.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="845.0" y="386.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="845.0" dy="0">RECUPERACIÓN</tspan></text><text x="845.0" y="410.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="845.0" dy="0">Mejora si sobrevive</tspan><tspan x="845.0" dy="17">O trasplante hepático</tspan></text><text x="40.0" y="491.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">INTOXICACIÓN POR PARACETAMOL: DECISIÓN DE TRATAR</tspan></text><rect x="40.0" y="503.2" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="522.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Elemento</tspan></text><text x="250.0" y="522.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Dato</tspan></text><text x="610.0" y="522.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Conducta</tspan></text><rect x="40.0" y="532.2" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="551.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Dosis tóxica</tspan></text><text x="250.0" y="551.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Más de 150 mg/kg o 7,5 a 10 g en el adulto</tspan></text><text x="610.0" y="551.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Medir nivel sérico a partir de las 4 horas</tspan></text><rect x="40.0" y="561.2" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="580.2" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Nomograma de</tspan><tspan x="50.0" dy="15">Rumack-Matthew</tspan></text><text x="250.0" y="580.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Nivel por encima de la línea de tratamiento</tspan></text><text x="610.0" y="580.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Iniciar N-acetilcisteína</tspan></text><rect x="140.6" y="572.2" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="186.0" y="587.2" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="186.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="605.2" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="624.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Presentación tardía o sin</tspan><tspan x="50.0" dy="15">horario claro</tspan></text><text x="250.0" y="624.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Transaminasas elevadas o ingesta incierta</tspan></text><text x="610.0" y="624.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Dar N-acetilcisteína igual, aun tardía</tspan></text><text x="40.0" y="689.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="699.2" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="721.7" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="721.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Naloxona</tspan></text><text x="435.0" y="721.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Pralidoxima</tspan></text><text x="585.0" y="721.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Fomepizol</tspan></text><rect x="663.0" y="702.2" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="721.7" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">N-acetilcisteína</tspan></text><text x="885.0" y="721.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Disulfiram</tspan></text><rect x="40.0" y="736.2" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="736.2" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="757.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tratamiento</tspan><tspan x="54.0" dy="16">específico?</tspan></text><text x="285.0" y="765.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: revierte opioides</tspan></text><text x="435.0" y="757.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: trata</tspan><tspan x="435.0" dy="16">organofosforados</tspan></text><text x="585.0" y="757.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: trata alcoholes</tspan><tspan x="585.0" dy="16">tóxicos</tspan></text><text x="735.0" y="765.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: repone glutatión</tspan></text><text x="885.0" y="757.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: fármaco aversivo</tspan><tspan x="885.0" dy="16">del alcohol</tspan></text><rect x="40.0" y="699.2" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="810.2" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="838.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="860.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Dosis tóxica: más de 150 mg/kg o 7,5 a 10 g en el adulto. Fase inicial asintomática, transaminasas altas a las 24 a 72 horas y posible fallo hepático.</tspan><tspan x="58.0" dy="18">• N-acetilcisteína repone glutatión y se une al NAPQI; mejor en las primeras 8 a 10 horas, pero se da siempre, incluso tarde (IV en 21 horas u oral en 72</tspan><tspan x="58.0" dy="18">   horas).</tspan><tspan x="58.0" dy="18">• Indicación según el nomograma de Rumack-Matthew con nivel sérico medido desde las 4 horas.</tspan><tspan x="58.0" dy="18">• Alerta: en insuficiencia hepática aguda grave, los criterios del King's College orientan la derivación a trasplante.</tspan></text><text x="58.0" y="954.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Chiew AL et al., Updated guidelines for the management of paracetamol poisoning in Australia and New Zealand, Med J Aust 2020;212:175-83; Harrison Principios de</tspan><tspan x="58.0" dy="15">Medicina Interna, 21.ª ed. (2022)</tspan></text></svg>