<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1223" viewBox="0 0 1000 1223" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Niño de 12 años con giba en la prueba de Adams y curva lateral en la Rx: escoliosis estructural"><title>Niño de 12 años con giba en la prueba de Adams y curva lateral en la Rx: escoliosis estructural</title><rect x="0.75" y="0.75" width="998.5" height="1222.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ortopedia · deformidades de la columna</tspan></text><rect x="437.2" y="32.0" width="150.2" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="512.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="134"><tspan x="512.3" dy="0">TRAUMATOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Escoliosis</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Curva lateral de la columna ≥ 10° (ángulo de Cobb) con rotación de las vértebras.</tspan><tspan x="58.0" dy="17">La más frecuente es la idiopática del adolescente, en niñas en el estirón puberal.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 12 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pie plano y dolor de espalda.</tspan><tspan x="640.0" dy="16">Prueba de Adams con giba; Rx con escoliosis dorsal.</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#94a3b8"/><line x1="500.0" y1="349.0" x2="500.0" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="379.0" x2="733.5" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="379.0" x2="266.5" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,407.0 271.5,407.0 266.5,415.0" fill="#94a3b8"/><line x1="733.5" y1="379.0" x2="733.5" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,407.0 738.5,407.0 733.5,415.0" fill="#94a3b8"/><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#0f766e"/><line x1="500.0" y1="349.0" x2="500.0" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="379.0" x2="500.0" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="379.0" x2="266.5" y2="408.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,407.0 271.5,407.0 266.5,415.0" fill="#0f766e"/><rect x="225.0" y="388.0" width="83.0" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Sí (este caso)</tspan></text><rect x="690.5" y="388.0" width="85.9" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">No: se corrige</tspan></text><polygon points="240.0,320.0 266.0,291.0 734.0,291.0 760.0,320.0 734.0,349.0 266.0,349.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="320.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="325.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="324.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Prueba de Adams: ¿giba al flexionar el tronco?</tspan></text><rect x="40.0" y="415.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">ESCOLIOSIS ESTRUCTURAL</tspan></text><text x="266.5" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Rx de pie: ángulo de Cobb</tspan><tspan x="266.5" dy="17">Control según la curva</tspan></text><rect x="507.0" y="415.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Escoliosis funcional</tspan></text><text x="733.5" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Diferencia de longitud de piernas</tspan><tspan x="733.5" dy="17">Postura</tspan></text><text x="40.0" y="545.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="557.5" width="920.0" height="339.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="571.5" width="158.3" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="135.1" y="591.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="135.1" dy="0">ÁNGULO DE COBB</tspan></text><text x="230.3" y="591.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="712"><tspan x="230.3" dy="0">Gravedad de la escoliosis medida en la Rx; la conducta depende también del crecimiento.</tspan></text><rect x="56.0" y="631.5" width="213.0" height="114.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="632.1" width="211.8" height="63.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="162.5" y="659.5" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="197"><tspan x="162.5" dy="0">&lt; 10°</tspan></text><text x="162.5" y="679.5" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="189"><tspan x="162.5" dy="0">Asimetría postural</tspan></text><circle cx="72.0" cy="704.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="708.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="82.0" dy="0">No es escoliosis</tspan></text><rect x="281.0" y="631.5" width="213.0" height="114.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="281.6" y="632.1" width="211.8" height="63.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="387.5" y="659.5" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="197"><tspan x="387.5" dy="0">10-25°</tspan></text><text x="387.5" y="679.5" font-size="14" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="189"><tspan x="387.5" dy="0">Leve</tspan></text><circle cx="297.0" cy="704.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="307.0" y="708.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="307.0" dy="0">Observación y Rx cada 4-6</tspan><tspan x="307.0" dy="16">meses</tspan></text><rect x="506.0" y="631.5" width="213.0" height="114.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="506.6" y="632.1" width="211.8" height="63.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="612.5" y="659.5" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="197"><tspan x="612.5" dy="0">25-45°</tspan></text><text x="612.5" y="679.5" font-size="14" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="189"><tspan x="612.5" dy="0">Moderada</tspan></text><circle cx="522.0" cy="704.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="532.0" y="708.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="532.0" dy="0">Corsé si sigue creciendo</tspan></text><rect x="731.0" y="631.5" width="213.0" height="114.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="731.6" y="632.1" width="211.8" height="63.0" rx="9" fill="#fee2e2" stroke="none" stroke-width="0"/><text x="837.5" y="659.5" font-size="11" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="197"><tspan x="837.5" dy="0">&gt; 45-50°</tspan></text><text x="837.5" y="679.5" font-size="14" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="189"><tspan x="837.5" dy="0">Grave</tspan></text><circle cx="747.0" cy="704.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="757.0" y="708.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="757.0" dy="0">Cirugía (artrodesis)</tspan></text><text x="56.0" y="775.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">PARA UBICAR ESTE CASO</tspan></text><rect x="56.0" y="784.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="799.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="799.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">La Rx confirma escoliosis: el ángulo es ≥ 10°</tspan></text><rect x="56.0" y="806.5" width="20.0" height="20.0" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/><text x="66.0" y="821.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✕</tspan></text><text x="88.0" y="821.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Falta medir el ángulo de Cobb para graduarla</tspan></text><rect x="56.0" y="843.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="866.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Medir el ángulo de Cobb y el grado de madurez ósea (Risser) para decidir observación, corsé o cirugía.</tspan></text><text x="40.0" y="936.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="946.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="977.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="969.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Lordosis</tspan><tspan x="285.0" dy="17">compensatoria</tspan></text><text x="435.0" y="977.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Cifosis estructural</tspan></text><rect x="513.0" y="949.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="969.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Escoliosis</tspan><tspan x="585.0" dy="17">estructural</tspan></text><text x="735.0" y="977.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Fusión del sacro</tspan></text><text x="885.0" y="977.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Espondilolistesis</tspan></text><rect x="40.0" y="1000.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="1000.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1029.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Encaja?</tspan></text><text x="285.0" y="1021.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: curva en el plano</tspan><tspan x="285.0" dy="16">sagital</tspan></text><text x="435.0" y="1021.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: curva hacia atrás</tspan><tspan x="435.0" dy="16">(giba anterior)</tspan></text><text x="585.0" y="1021.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: Adams + curva</tspan><tspan x="585.0" dy="16">lateral</tspan></text><text x="735.0" y="1021.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: congénita</tspan><tspan x="735.0" dy="16">lumbosacra</tspan></text><text x="885.0" y="1021.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: desliza una</tspan><tspan x="885.0" dy="16">vértebra</tspan></text><rect x="40.0" y="946.5" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1074.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1102.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1124.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Estructural = rotación vertebral fija (giba en Adams que no se corrige); funcional = por diferencia de longitud de piernas o postura.</tspan><tspan x="58.0" dy="18">• Medir el ángulo de Cobb en Rx de pie; escoliómetro ≥ 7° en Adams indica Rx.</tspan><tspan x="58.0" dy="18">• Dolor intenso, curva hacia la izquierda o signos neurológicos: buscar causa secundaria (RM).</tspan></text><text x="58.0" y="1182.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: SRS, escoliosis idiopática del adolescente (2024); SOSORT (2016, act.); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>