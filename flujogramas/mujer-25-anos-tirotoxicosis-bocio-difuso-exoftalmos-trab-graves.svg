<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1322" viewBox="0 0 1000 1322" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Tirotoxicosis con bocio difuso y exoftalmos: los TRAb confirman la enfermedad de Graves"><title>Tirotoxicosis con bocio difuso y exoftalmos: los TRAb confirman la enfermedad de Graves</title><rect x="0.75" y="0.75" width="998.5" height="1320.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Tiroides · hipertiroidismo</tspan></text><rect x="350.1" y="32.0" width="155.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="427.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="139"><tspan x="427.8" dy="0">ENDOCRINOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Enfermedad de Graves</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Anticuerpos que estimulan el receptor de TSH (TRAb): la tiroides trabaja sin freno.</tspan><tspan x="58.0" dy="17">Bocio difuso y oftalmopatía la distinguen de otras causas de hipertiroidismo.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 25 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">3 meses de baja de peso, palpitaciones, intolerancia al</tspan><tspan x="640.0" dy="16">calor y nerviosismo.</tspan><tspan x="640.0" dy="16">FC 110, temblor fino, bocio difuso blando y exoftalmos</tspan><tspan x="640.0" dy="16">bilateral.</tspan></text><line x1="640.0" y1="237.0" x2="670.0" y2="237.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LAS CUATRO OPCIONES FRENTE AL CASO</tspan></text><line x1="410.3" y1="435.0" x2="340.0" y2="457.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="457.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="379.0" x2="660.0" y2="357.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="357.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="435.0" x2="660.0" y2="457.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="457.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="410.3" y1="379.0" x2="340.0" y2="357.0" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="357.0" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="407.0" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="407.0" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="402.5" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">¿Qué confirma que</tspan><tspan x="500.0" dy="19">es Graves?</tspan></text><rect x="40.0" y="315.0" width="300.0" height="84.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="348.7" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Anticuerpos TRAb</tspan></text><text x="190.0" y="372.4" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Específicos: confirman la causa</tspan></text><rect x="144.6" y="389.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="404.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="415.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="416.0" width="6.0" height="82.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="448.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">TSH y T4 libre</tspan></text><text x="190.0" y="472.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Confirman hipertiroidismo, no la causa</tspan></text><rect x="660.0" y="315.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="316.0" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="810.0" y="348.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Gammagrafía con yodo</tspan></text><text x="810.0" y="372.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Si la causa no es clara</tspan></text><rect x="660.0" y="415.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="416.0" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="448.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Eco Doppler</tspan></text><text x="810.0" y="472.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Apoya, pero no es específica</tspan></text><text x="40.0" y="549.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="561.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="585.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Síntomas de tirotoxicosis</tspan></text><line x1="248.5" y1="581.5" x2="267.5" y2="581.5" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,576.5 266.5,586.5 274.5,581.5" fill="#0f766e"/><rect x="278.5" y="561.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="585.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">TSH baja, T4L alta</tspan></text><line x1="487.0" y1="581.5" x2="506.0" y2="581.5" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,576.5 505.0,586.5 513.0,581.5" fill="#0f766e"/><rect x="517.0" y="561.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="585.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Bocio difuso + exoftalmos</tspan></text><line x1="725.5" y1="581.5" x2="744.5" y2="581.5" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,576.5 743.5,586.5 751.5,581.5" fill="#0f766e"/><rect x="755.5" y="561.0" width="204.5" height="41.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="585.5" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">TRAb positivos: Graves</tspan></text><text x="40.0" y="642.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="654.0" width="278.0" height="374.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="664.0" width="88.1" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="678.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="236"><tspan x="61.0" dy="0">LA PACIENTE</tspan></text><g data-box="54.0 692.0 250.0 312.0"><g transform="translate(94.0,692.0) scale(0.7)"><circle cx="120" cy="40" r="28" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M110 66 H130 V80 H110 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 80 H170 L176 170 H64 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M64 170 H176 L170 240 H70 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 240 H170 L164 268 H76 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 84 L50 92 L36 170 L54 174 L66 120 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M36 170 L54 174 L46 238 L28 236 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="37" cy="250" rx="10" ry="15" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M76 268 H118 L114 360 H84 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M84 360 H114 L108 418 H90 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="98" cy="426" rx="15" ry="7" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M170.0 84 L190.0 92 L204.0 170 L186.0 174 L174.0 120 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M204.0 170 L186.0 174 L194.0 238 L212.0 236 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="203.0" cy="250.0" rx="10.0" ry="15.0" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><path d="M164.0 268 H122.0 L126.0 360 H156.0 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M156.0 360 H126.0 L132.0 418 H150.0 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><ellipse cx="142.0" cy="426.0" rx="15.0" ry="7.0" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" /><circle cx="110" cy="36" r="3" fill="#334155" stroke="none" stroke-width="0" /><circle cx="130" cy="36" r="3" fill="#334155" stroke="none" stroke-width="0" /><path d="M112 52 Q120 57 128 52" fill="none" stroke="#9a6b52" stroke-width="1.6"/><ellipse cx="120" cy="72" rx="20" ry="8" fill="#fda4af" stroke="#be123c" stroke-width="2" /><circle cx="136" cy="30" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="136" y="34" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">1</text><circle cx="146" cy="74" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="146" y="78" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">2</text><circle cx="37" cy="250" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="37" y="254" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">3</text><text x="4" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">D</text><text x="236" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">I</text></g></g><rect x="340.0" y="654.0" width="620.0" height="31.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="358.0" cy="669.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="358.0" y="673.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="358.0" dy="0">1</tspan></text><text x="376.0" y="674.0" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="576"><tspan x="376.0" dy="0">Exoftalmos: propio de Graves.</tspan></text><rect x="340.0" y="692.0" width="620.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="358.0" cy="707.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="358.0" y="711.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="358.0" dy="0">2</tspan></text><text x="376.0" y="712.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="576"><tspan x="376.0" dy="0">Bocio difuso blando (todo el tiroides crece).</tspan></text><rect x="340.0" y="730.0" width="620.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="358.0" cy="745.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="358.0" y="749.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="358.0" dy="0">3</tspan></text><text x="376.0" y="750.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="576"><tspan x="376.0" dy="0">Temblor fino distal.</tspan></text><text x="40.0" y="1068.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1078.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1100.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="1081.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="303.8" y="1100.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">TRAb</tspan></text><text x="491.2" y="1100.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">TSH y T4 libre</tspan></text><text x="678.8" y="1100.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Gammagrafía</tspan></text><text x="866.2" y="1100.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Eco Doppler</tspan></text><rect x="40.0" y="1115.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1115.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1136.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Confirma Graves?</tspan></text><text x="303.8" y="1136.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Sí</tspan></text><text x="491.2" y="1136.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Solo el hipertiroidismo</tspan></text><text x="678.8" y="1136.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Si hay dudas</tspan></text><text x="866.2" y="1136.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No específica</tspan></text><rect x="40.0" y="1078.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1173.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1201.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1223.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• TSH y T4 libre confirman el hipertiroidismo; los TRAb confirman que la causa es Graves.</tspan><tspan x="58.0" dy="18">• La gammagrafía queda para cuando la causa no está clara o no hay TRAb disponibles.</tspan><tspan x="58.0" dy="18">• La eco Doppler muestra mucho flujo, pero no es específica.</tspan></text><text x="58.0" y="1281.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ATA, hipertiroidismo (2016); ETA (2018).</tspan></text></svg>