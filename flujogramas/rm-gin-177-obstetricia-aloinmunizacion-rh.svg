<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1169" viewBox="0 0 1000 1169" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la aloinmunización anti-D la anemia fetal se detecta con la velocidad pico sistólica de la arteria cerebral media"><title>En la aloinmunización anti-D la anemia fetal se detecta con la velocidad pico sistólica de la arteria cerebral media</title><rect x="0.75" y="0.75" width="998.5" height="1167.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · aloinmunización Rh</tspan></text><rect x="393.4" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="473.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="473.2" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Aloinmunización por antígeno D</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Los anticuerpos IgG maternos atraviesan la placenta y hemolizan al feto.</tspan><tspan x="58.0" dy="17">Riesgo de anemia, hidropesía y muerte fetal.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante de 33 años, 34 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Grupo O negativo, Coombs indirecto positivo.</tspan><tspan x="640.0" dy="16">Nunca recibió inmunoglobulina anti-D.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">VELOCIDAD PICO SISTÓLICA DE LA ARTERIA CEREBRAL MEDIA EN MÚLTIPLOS DE LA MEDIANA</tspan></text><rect x="40.0" y="269.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="295.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Velocidad pico sistólica (MoM)</tspan></text><text x="60.0" y="314.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Se compara con la mediana para la edad gestacional.</tspan></text><rect x="70.0" y="378.0" width="573.3" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="356.7" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="563"><tspan x="356.7" dy="0">Menos de 1,5: sin anemia moderada o grave</tspan></text><rect x="643.3" y="378.0" width="286.7" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="786.7" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="277"><tspan x="786.7" dy="0">Más de 1,5: anemia fetal moderada o grave</tspan></text><line x1="70.0" y1="418.0" x2="70.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="70.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="70.0" dy="0">0,5</tspan></text><line x1="356.7" y1="418.0" x2="356.7" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="356.7" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="356.7" dy="0">1,0</tspan></text><line x1="643.3" y1="418.0" x2="643.3" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="643.3" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="643.3" dy="0">1,5</tspan></text><line x1="930.0" y1="418.0" x2="930.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">2,0</tspan></text><polygon points="634.3,364.0 652.3,364.0 643.3,376.0" fill="#ea580c"/><rect x="495.3" y="338.0" width="296.0" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="643.3" y="353.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="284"><tspan x="643.3" dy="0">◆ MÁS DE 1,5 MoM: SOSPECHA DE ANEMIA FETAL</tspan></text><text x="40.0" y="486.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ MIDE CADA VASO</tspan></text><rect x="40.0" y="496.0" width="297.3" height="85.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="497.0" width="6.0" height="83.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="520.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Arteria cerebral media</tspan></text><text x="58.0" y="541.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Velocidad pico sistólica: anemia fetal</tspan></text><rect x="351.3" y="496.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="497.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="520.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Arteria umbilical y uterinas</tspan></text><text x="369.3" y="541.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Resistencia placentaria; restricción del crecimiento</tspan><tspan x="369.3" dy="16">y preeclampsia</tspan></text><rect x="662.7" y="496.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="497.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="520.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Ductus venoso</tspan></text><text x="680.7" y="541.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Función cardiaca y acidemia fetal</tspan></text><text x="40.0" y="615.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CONDUCTA ANTE LA ALOINMUNIZACIÓN RH</tspan></text><rect x="40.0" y="627.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="646.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Hallazgo</tspan></text><text x="350.0" y="646.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="350.0" dy="0">Conducta</tspan></text><rect x="40.0" y="656.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="675.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Rh negativo con Coombs indirecto negativo</tspan></text><text x="350.0" y="675.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="604"><tspan x="350.0" dy="0">Inmunoglobulina anti-D a las 28 semanas y tras el parto</tspan></text><rect x="40.0" y="685.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="704.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Coombs indirecto positivo</tspan></text><text x="350.0" y="704.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="604"><tspan x="350.0" dy="0">Medir el título; si es menor al crítico, repetirlo cada 4 semanas</tspan></text><rect x="240.6" y="688.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="286.0" y="703.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="714.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="733.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Título crítico (1:16 o más)</tspan></text><text x="350.0" y="733.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="604"><tspan x="350.0" dy="0">Doppler de la arteria cerebral media en serie</tspan></text><rect x="40.0" y="743.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="762.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="284"><tspan x="50.0" dy="0">Velocidad mayor de 1,5 MoM</tspan></text><text x="350.0" y="762.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="604"><tspan x="350.0" dy="0">Cordocentesis y transfusión intrauterina</tspan></text><text x="40.0" y="812.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="822.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="853.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="825.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="844.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Arteria cerebral</tspan><tspan x="285.0" dy="17">media</tspan></text><text x="435.0" y="853.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Arteria umbilical</tspan></text><text x="585.0" y="853.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Arterias uterinas</tspan></text><text x="735.0" y="853.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ductus venoso</tspan></text><text x="885.0" y="844.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Arterias</tspan><tspan x="885.0" dy="17">mesentéricas</tspan></text><rect x="40.0" y="876.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="876.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="905.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Velocidad de qué</tspan><tspan x="54.0" dy="16">vaso?</tspan></text><text x="285.0" y="897.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: su velocidad pico</tspan><tspan x="285.0" dy="16">sistólica sube con la</tspan><tspan x="285.0" dy="16">anemia</tspan></text><text x="435.0" y="905.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: valora la</tspan><tspan x="435.0" dy="16">resistencia placentaria</tspan></text><text x="585.0" y="905.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: se usan en la</tspan><tspan x="585.0" dy="16">preeclampsia</tspan></text><text x="735.0" y="905.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: valora la función</tspan><tspan x="735.0" dy="16">cardiaca</tspan></text><text x="885.0" y="905.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no se usan para</tspan><tspan x="885.0" dy="16">anemia fetal</tspan></text><rect x="40.0" y="822.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="966.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="994.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1016.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La anemia baja la viscosidad y sube el gasto cardiaco: aumenta la velocidad del flujo en la arteria cerebral media, que se explora por Doppler con ángulo</tspan><tspan x="58.0" dy="18">   casi cero.</tspan><tspan x="58.0" dy="18">• Mari (NEJM 2000): una velocidad pico sistólica mayor de 1,5 múltiplos de la mediana para la edad gestacional detecta anemia fetal moderada o grave.</tspan><tspan x="58.0" dy="18">• Con título crítico (1:16 o más) se vigila por Doppler en serie, sin amniocentesis; si la velocidad es alta, se confirma con cordocentesis y se transfunde.</tspan><tspan x="58.0" dy="18">• Alerta: la inmunoglobulina anti-D no sirve si la gestante ya está sensibilizada. Umbilical y uterinas valoran flujo placentario; el ductus venoso, el</tspan><tspan x="58.0" dy="18">   compromiso cardiaco.</tspan></text><text x="58.0" y="1128.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, Practice Bulletin 192 (2018); Mari G et al., N Engl J Med 2000;342:9-14; Williams Obstetricia, 26.ª ed. (2022).</tspan></text></svg>