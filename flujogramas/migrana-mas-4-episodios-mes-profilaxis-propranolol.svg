<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1057" viewBox="0 0 1000 1057" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Mujer joven con más de 4 crisis de migraña al mes: necesita profilaxis, y el propranolol es de primera línea"><title>Mujer joven con más de 4 crisis de migraña al mes: necesita profilaxis, y el propranolol es de primera línea</title><rect x="0.75" y="0.75" width="998.5" height="1055.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Migraña · tratamiento preventivo</tspan></text><rect x="392.8" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="457.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="457.1" dy="0">NEUROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="148.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Profilaxis de la migraña</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Indicada si hay ≥ 4 días de migraña al mes, crisis muy incapacitantes o abuso de</tspan><tspan x="58.0" dy="17">analgésicos.</tspan><tspan x="58.0" dy="17">Primera línea: betabloqueador (propranolol, metoprolol), topiramato o amitriptilina; luego</tspan><tspan x="58.0" dy="17">anti-CGRP.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="148.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="146.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 25 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Más de 4 episodios de migraña al mes.</tspan><tspan x="640.0" dy="16">¿Qué evita las recurrencias?</tspan></text><rect x="640.0" y="209.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="222.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="222.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="270.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ESCALONES DE LA PROFILAXIS DE LA MIGRAÑA</tspan></text><polygon points="190.0,282.0 290.0,282.0 327.5,338.0 152.5,338.0" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="240.0" y="315.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="88"><tspan x="240.0" dy="0">1.ª</tspan></text><rect x="466.0" y="282.0" width="494.0" height="56.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="481.0" y="306.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">Propranolol, topiramato o amitriptilina</tspan></text><text x="481.0" y="323.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">Ensayar 2-3 meses.</tspan></text><rect x="858.2" y="271.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="903.6" y="286.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="903.6" dy="0">◆ ESTE CASO</tspan></text><polygon points="152.5,344.0 327.5,344.0 365.0,400.0 115.0,400.0" fill="#99f6e4" stroke="#ffffff" stroke-width="2"/><text x="240.0" y="377.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="163"><tspan x="240.0" dy="0">2.ª</tspan></text><rect x="466.0" y="344.0" width="494.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="481.0" y="368.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">Flunarizina, candesartán, valproato</tspan></text><text x="481.0" y="385.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">Según la paciente.</tspan></text><polygon points="115.0,406.0 365.0,406.0 402.5,462.0 77.5,462.0" fill="#5eead4" stroke="#ffffff" stroke-width="2"/><text x="240.0" y="439.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="238"><tspan x="240.0" dy="0">3.ª</tspan></text><rect x="466.0" y="406.0" width="494.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="481.0" y="430.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">Anti-CGRP (erenumab, galcanezumab)</tspan></text><text x="481.0" y="447.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">Si fallan dos preventivos.</tspan></text><polygon points="77.5,468.0 402.5,468.0 440.0,524.0 40.0,524.0" fill="#2dd4bf" stroke="#ffffff" stroke-width="2"/><text x="240.0" y="501.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="313"><tspan x="240.0" dy="0">Crónica</tspan></text><rect x="466.0" y="468.0" width="494.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="481.0" y="492.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">Toxina botulínica</tspan></text><text x="481.0" y="509.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="464"><tspan x="481.0" dy="0">≥ 15 días de cefalea al mes.</tspan></text><text x="240.0" y="542.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="400"><tspan x="240.0" dy="0">Empezar por arriba</tspan></text><rect x="40.0" y="564.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="590.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">≥ 4 crisis al mes: profilaxis con propranolol</tspan></text><text x="60.0" y="609.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Y tratar las crisis con AINE o triptanes, sin abusar.</tspan></text><text x="40.0" y="668.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PARA LA CRISIS (NO PREVIENEN)</tspan></text><rect x="40.0" y="678.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="679.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="702.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">AINE</tspan></text><text x="58.0" y="723.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Ibuprofeno, naproxeno</tspan></text><rect x="351.3" y="678.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="679.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="702.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Triptanes</tspan></text><text x="369.3" y="723.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Sumatriptán</tspan></text><rect x="662.7" y="678.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="679.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="702.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Evitar opioides y ergotamina</tspan></text><text x="680.7" y="723.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Abuso y cefalea</tspan></text><text x="40.0" y="787.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="797.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="819.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="819.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Tramadol</tspan></text><text x="435.0" y="819.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Sumatriptan</tspan></text><rect x="513.0" y="800.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="819.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Propanolol</tspan></text><text x="735.0" y="819.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ibuprofeno</tspan></text><text x="885.0" y="819.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Ergotamina diaria</tspan></text><rect x="40.0" y="834.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="834.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="863.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Para prevenir?</tspan></text><text x="285.0" y="855.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: opioide, abuso y</tspan><tspan x="285.0" dy="16">cefalea</tspan></text><text x="435.0" y="855.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: trata la crisis, no</tspan><tspan x="435.0" dy="16">previene</tspan></text><text x="585.0" y="855.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: profilaxis de</tspan><tspan x="585.0" dy="16">primera línea</tspan></text><text x="735.0" y="863.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: trata la crisis</tspan></text><text x="885.0" y="863.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: ergotismo y abuso</tspan></text><rect x="40.0" y="797.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="908.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="936.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="958.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Propranolol 40-160 mg/día; evaluar a los 2-3 meses.</tspan><tspan x="58.0" dy="18">• Topiramato (evitar en embarazo), amitriptilina (si hay insomnio), flunarizina.</tspan><tspan x="58.0" dy="18">• Las crisis se tratan con AINE o triptanes, sin pasar de 10 días al mes (cefalea por abuso de medicación).</tspan></text><text x="58.0" y="1016.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: IHS, recomendaciones globales del tratamiento preventivo de la migraña (2024); AHS (2021; act. 2024); EHF (2022).</tspan></text></svg>