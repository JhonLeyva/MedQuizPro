<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1164" viewBox="0 0 1000 1164" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El infliximab es un anticuerpo monoclonal quimérico que bloquea el TNF-alfa"><title>El infliximab es un anticuerpo monoclonal quimérico que bloquea el TNF-alfa</title><rect x="0.75" y="0.75" width="998.5" height="1162.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Reumatología · FARME biológicos anti-TNF</tspan></text><rect x="455.6" y="32.0" width="227.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="569.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="211"><tspan x="569.3" dy="0">REUMATOLOGÍA Y DERMATOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="148.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">FARME biológicos anti-TNF</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infliximab, adalimumab, golimumab y certolizumab pegol; etanercept es proteína de fusión</tspan><tspan x="58.0" dy="17">con el receptor soluble.</tspan><tspan x="58.0" dy="17">Se usan en artritis reumatoide, espondiloartritis, psoriásica y enfermedad inflamatoria</tspan><tspan x="58.0" dy="17">intestinal.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="148.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="146.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de mecanismo</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál de los fármacos antirreumáticos modificadores</tspan><tspan x="640.0" dy="16">de enfermedad actúa como antagonista del TNF-alfa?</tspan></text><rect x="640.0" y="209.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="222.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="222.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="270.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL FÁRMACO A SU BLANCO MOLECULAR</tspan></text><rect x="40.0" y="282.0" width="920.0" height="99.0" rx="0" fill="#fef3c7" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="282.0" width="112.0" height="99.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="327.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Célula</tspan><tspan x="96.0" dy="14">presentadora y</tspan><tspan x="96.0" dy="14">macrófago</tspan></text><rect x="40.0" y="381.0" width="920.0" height="99.0" rx="0" fill="#e0f2fe" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="381.0" width="112.0" height="99.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="430.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Espacio</tspan><tspan x="96.0" dy="14">extracelular</tspan></text><rect x="40.0" y="480.0" width="920.0" height="99.0" rx="0" fill="#ede9fe" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="480.0" width="112.0" height="99.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="533.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Linfocito</tspan></text><rect x="40.0" y="579.0" width="920.0" height="83.0" rx="0" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="579.0" width="112.0" height="83.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="624.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Efecto</tspan></text><line x1="322.0" y1="366.0" x2="322.0" y2="385.0" stroke="#ea580c" stroke-width="2.2"/><polygon points="317.0,385.0 327.0,385.0 322.0,394.0" fill="#ea580c"/><line x1="322.0" y1="465.0" x2="322.0" y2="484.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="317.0,484.0 327.0,484.0 322.0,493.0" fill="#0f766e"/><line x1="322.0" y1="564.0" x2="322.0" y2="583.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="317.0,583.0 327.0,583.0 322.0,592.0" fill="#0f766e"/><rect x="172.0" y="297.0" width="300.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="313.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Se libera TNF-alfa</tspan></text><text x="182.0" y="330.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Citocina central de la inflamación en la artritis</tspan><tspan x="182.0" dy="14.5">reumatoide</tspan></text><circle cx="172.0" cy="297.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="301.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">1</tspan></text><rect x="172.0" y="396.0" width="300.0" height="69.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="182.0" y="412.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Infliximab se une al TNF-alfa</tspan></text><text x="182.0" y="429.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Anticuerpo quimérico; adalimumab, golimumab y</tspan><tspan x="182.0" dy="14.5">certolizumab hacen lo mismo</tspan></text><circle cx="172.0" cy="396.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="400.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">2</tspan></text><rect x="172.0" y="495.0" width="300.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="511.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Otros FARME actúan en otro blanco</tspan></text><text x="182.0" y="528.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Rituximab: CD20 del linfocito B. Abatacept:</tspan><tspan x="182.0" dy="14.5">coestimulación del linfocito T</tspan></text><circle cx="172.0" cy="495.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="499.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">3</tspan></text><rect x="172.0" y="594.0" width="300.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="610.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Menos inflamación sinovial</tspan></text><text x="182.0" y="627.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Antes: descartar tuberculosis latente y hepatitis B</tspan></text><circle cx="172.0" cy="594.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="598.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">4</tspan></text><rect x="40.0" y="680.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="706.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Infliximab = antagonista del TNF-alfa</tspan></text><text x="60.0" y="725.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Micofenolato y leflunomida son sintéticos; rituximab y abatacept no actúan sobre el TNF.</tspan></text><text x="40.0" y="792.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="802.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="833.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="805.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="833.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Infliximab</tspan></text><text x="435.0" y="824.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Micofenolato</tspan><tspan x="435.0" dy="17">mofetilo</tspan></text><text x="585.0" y="833.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Leflunomida</tspan></text><text x="735.0" y="833.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Rituximab</tspan></text><text x="885.0" y="833.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Abatacept</tspan></text><rect x="40.0" y="856.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="856.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="885.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Antagonista del</tspan><tspan x="54.0" dy="16">TNF-alfa?</tspan></text><text x="285.0" y="877.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: anticuerpo</tspan><tspan x="285.0" dy="16">monoclonal quimérico</tspan><tspan x="285.0" dy="16">anti-TNF</tspan></text><text x="435.0" y="877.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: inhibe la inosina</tspan><tspan x="435.0" dy="16">monofosfato</tspan><tspan x="435.0" dy="16">deshidrogenasa</tspan></text><text x="585.0" y="877.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: inhibe la</tspan><tspan x="585.0" dy="16">dihidroorotato</tspan><tspan x="585.0" dy="16">deshidrogenasa</tspan></text><text x="735.0" y="885.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es anti-CD20,</tspan><tspan x="735.0" dy="16">depleta linfocitos B</tspan></text><text x="885.0" y="877.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: bloquea la</tspan><tspan x="885.0" dy="16">coestimulación</tspan><tspan x="885.0" dy="16">CD80/CD86 con CD28</tspan></text><rect x="40.0" y="802.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="946.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="974.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="996.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Infliximab: anticuerpo quimérico anti-TNF. Micofenolato: inhibe la inosina monofosfato deshidrogenasa. Leflunomida: inhibe la dihidroorotato</tspan><tspan x="58.0" dy="18">   deshidrogenasa (sintético).</tspan><tspan x="58.0" dy="18">• Rituximab: anti-CD20, depleta linfocitos B. Abatacept: CTLA4-Ig, bloquea la coestimulación CD80/CD86 con CD28.</tspan><tspan x="58.0" dy="18">• ACR 2021: metotrexato como tratamiento inicial; se agrega un biológico o un inhibidor de JAK si no se alcanza la meta.</tspan><tspan x="58.0" dy="18">• Antes del anti-TNF se descartan tuberculosis latente (NTS 221-MINSA/DGIESP-2024), hepatitis B y C e infecciones activas. Contraindicados en</tspan><tspan x="58.0" dy="18">   insuficiencia cardiaca grave, esclerosis múltiple y neoplasia reciente.</tspan></text><text x="58.0" y="1108.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACR, tratamiento de la artritis reumatoide (Arthritis Care Res 2021); Harrison, Principios de Medicina Interna, 21.ª ed. (2022); MINSA, NTS 221-MINSA/DGIESP-2024</tspan><tspan x="58.0" dy="15">(prevención y control de la tuberculosis).</tspan></text></svg>