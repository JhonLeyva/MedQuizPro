<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1103" viewBox="0 0 1000 1103" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La vigilancia que usa eventos trazadores o unidades seleccionadas para monitorizar un problema es la centinela"><title>La vigilancia que usa eventos trazadores o unidades seleccionadas para monitorizar un problema es la centinela</title><rect x="0.75" y="0.75" width="998.5" height="1101.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Salud pública · vigilancia epidemiológica</tspan></text><rect x="442.0" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="506.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="506.3" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Vigilancia en salud pública</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Recolección sistemática, continua y oportuna de datos, con análisis y difusión para decidir</tspan><tspan x="58.0" dy="17">acciones.</tspan><tspan x="58.0" dy="17">Se clasifica por la forma de obtener los datos.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de definición</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Vigilancia activa sobre eventos trazadores o factores</tspan><tspan x="640.0" dy="16">de riesgo asociados.</tspan><tspan x="640.0" dy="16">¿Cómo se denomina?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TIPOS DE VIGILANCIA SEGÚN CÓMO SE OBTIENEN LOS DATOS</tspan></text><rect x="40.0" y="285.0" width="920.0" height="111.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="285.0" width="108.0" height="111.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="340.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Por quién</tspan><tspan x="94.0" dy="14">notifica</tspan></text><rect x="40.0" y="396.0" width="920.0" height="111.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="396.0" width="108.0" height="111.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="447.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Por la</tspan><tspan x="94.0" dy="14">búsqueda de</tspan><tspan x="94.0" dy="14">casos</tspan></text><rect x="40.0" y="507.0" width="920.0" height="111.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="507.0" width="108.0" height="111.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="562.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Por unidades</tspan><tspan x="94.0" dy="14">seleccionadas</tspan></text><line x1="348.0" y1="332.5" x2="355.0" y2="332.5" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="332.5" x2="355.0" y2="443.5" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="443.5" x2="353.0" y2="443.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="353.0,448.5 353.0,438.5 362.0,443.5" fill="#0f766e"/><line x1="552.0" y1="443.5" x2="559.0" y2="443.5" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="443.5" x2="559.0" y2="562.5" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="562.5" x2="557.0" y2="562.5" stroke="#ea580c" stroke-width="2.2"/><polygon points="557.0,567.5 557.0,557.5 566.0,562.5" fill="#ea580c"/><line x1="756.0" y1="562.5" x2="763.0" y2="562.5" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="562.5" x2="763.0" y2="554.5" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="554.5" x2="761.0" y2="554.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="761.0,559.5 761.0,549.5 770.0,554.5" fill="#0f766e"/><rect x="158.0" y="298.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="314.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Pasiva</tspan></text><text x="168.0" y="331.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Los establecimientos notifican de</tspan><tspan x="168.0" dy="14.5">manera rutinaria</tspan></text><circle cx="158.0" cy="298.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="302.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="362.0" y="409.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="372.0" y="425.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">Activa</tspan></text><text x="372.0" y="442.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">El personal busca casos de</tspan><tspan x="372.0" dy="14.5">manera intencional</tspan></text><circle cx="362.0" cy="409.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="362.0" y="413.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="362.0" dy="0">2</tspan></text><rect x="566.0" y="520.0" width="190.0" height="85.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="576.0" y="536.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Centinela</tspan></text><text x="576.0" y="553.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Unidades o eventos trazadores:</tspan><tspan x="576.0" dy="14.5">más calidad de datos y menor</tspan><tspan x="576.0" dy="14.5">costo</tspan></text><circle cx="566.0" cy="520.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="566.0" y="524.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="566.0" dy="0">3</tspan></text><rect x="770.0" y="520.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="780.0" y="536.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Ejemplos de uso</tspan></text><text x="780.0" y="553.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Influenza, VIH y resistencia</tspan><tspan x="780.0" dy="14.5">antimicrobiana</tspan></text><circle cx="770.0" cy="520.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="770.0" y="524.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="770.0" dy="0">4</tspan></text><rect x="40.0" y="636.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="662.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Eventos trazadores y factores asociados = vigilancia centinela</tspan></text><text x="60.0" y="681.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Local indica el lugar; activa y pasiva describen la captación; especializada no es estándar.</tspan></text><text x="40.0" y="748.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="758.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="780.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="761.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="780.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Centinela</tspan></text><text x="435.0" y="780.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Local</tspan></text><text x="585.0" y="780.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Activa</tspan></text><text x="735.0" y="780.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Pasiva</tspan></text><text x="885.0" y="780.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Especializada</tspan></text><rect x="40.0" y="795.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="795.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="824.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Vigilancia con eventos</tspan><tspan x="54.0" dy="16">trazadores?</tspan></text><text x="285.0" y="816.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: unidades o eventos</tspan><tspan x="285.0" dy="16">trazadores</tspan><tspan x="285.0" dy="16">seleccionados</tspan></text><text x="435.0" y="824.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: solo indica el</tspan><tspan x="435.0" dy="16">ámbito geográfico</tspan></text><text x="585.0" y="816.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: describe la</tspan><tspan x="585.0" dy="16">búsqueda intencional</tspan><tspan x="585.0" dy="16">de casos</tspan></text><text x="735.0" y="824.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: describe la</tspan><tspan x="735.0" dy="16">notificación de rutina</tspan></text><text x="885.0" y="824.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no es una</tspan><tspan x="885.0" dy="16">categoría estándar</tspan></text><rect x="40.0" y="758.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="885.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="913.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="935.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Pasiva: los establecimientos notifican de rutina. Activa: el personal busca casos de manera intencional. Centinela: unidades o eventos trazadores</tspan><tspan x="58.0" dy="18">   seleccionados.</tspan><tspan x="58.0" dy="18">• La centinela da datos de mayor calidad y menor costo que la cobertura total; se usa en influenza, VIH y resistencia antimicrobiana.</tspan><tspan x="58.0" dy="18">• Local solo indica el ámbito geográfico; «especializada» no es una categoría estándar de vigilancia.</tspan><tspan x="58.0" dy="18">• Alerta: el sistema centinela monitoriza tendencias, no mide la incidencia poblacional. No confundir con evento centinela (falla evitable, como una muerte</tspan><tspan x="58.0" dy="18">   materna).</tspan></text><text x="58.0" y="1047.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, Principles of Epidemiology in Public Health Practice, 3.ª ed. (2012); OMS, Guías de vigilancia epidemiológica y notificación (RSI, 3.ª ed., 2016); Gordis,</tspan><tspan x="58.0" dy="15">Epidemiología, 6.ª ed. (2019).</tspan></text></svg>