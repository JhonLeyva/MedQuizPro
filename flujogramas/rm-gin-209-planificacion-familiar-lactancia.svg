<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="960" viewBox="0 0 1000 960" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Los anticonceptivos orales combinados están contraindicados en la lactancia: el estrógeno reduce la leche"><title>Los anticonceptivos orales combinados están contraindicados en la lactancia: el estrógeno reduce la leche</title><rect x="0.75" y="0.75" width="998.5" height="958.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Planificación familiar · lactancia</tspan></text><rect x="388.7" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="468.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="468.4" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Criterios médicos de elegibilidad (OMS)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cada método se clasifica de 1 (sin restricción) a 4 (riesgo inaceptable).</tspan><tspan x="58.0" dy="17">El estrógeno reduce el volumen de leche y el posparto es un periodo de riesgo trombótico.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer que amamanta</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Desea un método anticonceptivo.</tspan><tspan x="640.0" dy="16">¿Cuál está contraindicado durante la lactancia?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><rect x="40.0" y="245.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="271.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Lactancia + estrógeno = método combinado contraindicado</tspan></text><text x="60.0" y="290.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">DIU, barrera y progestágenos solos no alteran la producción de leche.</tspan></text><text x="40.0" y="351.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">MÉTODOS ANTICONCEPTIVOS DURANTE LA LACTANCIA (OMS 2015)</tspan></text><rect x="40.0" y="363.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="189"><tspan x="50.0" dy="0">Método</tspan></text><text x="255.0" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="342"><tspan x="255.0" dy="0">Lactancia</tspan></text><text x="612.5" y="382.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="342"><tspan x="612.5" dy="0">Comentario</tspan></text><rect x="40.0" y="392.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="411.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="189"><tspan x="50.0" dy="0">Combinados</tspan></text><text x="255.0" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="342"><tspan x="255.0" dy="0">Categoría 4 (&lt; 6 semanas); 3 (6 semanas a 6 meses); 2 (&gt; 6</tspan><tspan x="255.0" dy="15">meses)</tspan></text><text x="612.5" y="411.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="342"><tspan x="612.5" dy="0">El estrógeno reduce el volumen de leche</tspan></text><rect x="145.6" y="403.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="191.0" y="418.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="191.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="436.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="455.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="189"><tspan x="50.0" dy="0">Píldora de solo progestágeno</tspan></text><text x="255.0" y="455.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="342"><tspan x="255.0" dy="0">Compatible</tspan></text><text x="612.5" y="455.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="342"><tspan x="612.5" dy="0">No altera la leche</tspan></text><rect x="40.0" y="465.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="484.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="189"><tspan x="50.0" dy="0">Progestágeno inyectable o</tspan><tspan x="50.0" dy="15">implante</tspan></text><text x="255.0" y="484.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="342"><tspan x="255.0" dy="0">Compatible</tspan></text><text x="612.5" y="484.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="342"><tspan x="612.5" dy="0">Inicio según el momento posparto</tspan></text><rect x="40.0" y="509.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="528.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="189"><tspan x="50.0" dy="0">DIU de cobre o de</tspan><tspan x="50.0" dy="15">levonorgestrel</tspan></text><text x="255.0" y="528.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="342"><tspan x="255.0" dy="0">Compatible</tspan></text><text x="612.5" y="528.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="342"><tspan x="612.5" dy="0">Sin efecto en la leche ni en el lactante</tspan></text><rect x="40.0" y="553.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="572.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="189"><tspan x="50.0" dy="0">Métodos de barrera</tspan></text><text x="255.0" y="572.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="342"><tspan x="255.0" dy="0">Compatible</tspan></text><text x="612.5" y="572.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="342"><tspan x="612.5" dy="0">Sin restricción</tspan></text><text x="40.0" y="622.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="632.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="663.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="654.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Dispositivo</tspan><tspan x="285.0" dy="17">intrauterino</tspan></text><text x="435.0" y="663.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Método de barrera</tspan></text><text x="585.0" y="654.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Progestágenos</tspan><tspan x="585.0" dy="17">inyectables</tspan></text><text x="735.0" y="654.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Píldoras de solo</tspan><tspan x="735.0" dy="17">progestágenos</tspan></text><rect x="813.0" y="635.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="654.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Anticonceptivos</tspan><tspan x="885.0" dy="17">orales combinados</tspan></text><rect x="40.0" y="686.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="686.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="707.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Contraindicado en la</tspan><tspan x="54.0" dy="16">lactancia?</tspan></text><text x="285.0" y="707.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: compatible con la</tspan><tspan x="285.0" dy="16">lactancia</tspan></text><text x="435.0" y="707.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: compatible con la</tspan><tspan x="435.0" dy="16">lactancia</tspan></text><text x="585.0" y="707.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: compatible con la</tspan><tspan x="585.0" dy="16">lactancia</tspan></text><text x="735.0" y="707.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: compatible con la</tspan><tspan x="735.0" dy="16">lactancia</tspan></text><text x="885.0" y="707.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: el estrógeno reduce</tspan><tspan x="885.0" dy="16">la leche</tspan></text><rect x="40.0" y="632.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="760.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="788.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="810.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Anticonceptivos combinados (con estrógeno): categoría 4 antes de 6 semanas, 3 entre 6 semanas y 6 meses y 2 después de 6 meses (OMS 2015); se</tspan><tspan x="58.0" dy="18">   evitan mientras la lactancia sea el alimento principal.</tspan><tspan x="58.0" dy="18">• Solo progestágeno (píldora, inyectable, implante), DIU de cobre o de levonorgestrel y barrera no alteran la leche ni la salud del lactante: son compatibles.</tspan><tspan x="58.0" dy="18">• El método de amenorrea de la lactancia es eficaz 6 meses si la lactancia es exclusiva y la madre sigue amenorreica.</tspan><tspan x="58.0" dy="18">• Alerta: el implante o el DIU colocados antes del alta reducen los embarazos con intervalo corto y la mortalidad materna y neonatal asociada.</tspan></text><text x="58.0" y="904.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, Criterios médicos de elegibilidad para el uso de anticonceptivos, 5.ª ed. (2015); CDC, US MEC (MMWR Recomm Rep 2024;73); Williams Obstetricia, 26.ª ed.</tspan><tspan x="58.0" dy="15">(2022).</tspan></text></svg>