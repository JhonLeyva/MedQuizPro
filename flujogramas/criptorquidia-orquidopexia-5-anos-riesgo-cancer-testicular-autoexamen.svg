<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1243" viewBox="0 0 1000 1243" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Criptorquidia operada en la infancia: el riesgo de cáncer testicular sigue siendo mayor"><title>Criptorquidia operada en la infancia: el riesgo de cáncer testicular sigue siendo mayor</title><rect x="0.75" y="0.75" width="998.5" height="1241.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Urología · cáncer testicular</tspan></text><rect x="360.6" y="32.0" width="127.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="424.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="111"><tspan x="424.3" dy="0">NEFROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Criptorquidia y cáncer testicular</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Es el principal factor de riesgo de tumor germinal del testículo.</tspan><tspan x="58.0" dy="17">La orquidopexia permite examinarlo y reduce algo el riesgo, pero no lo elimina.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 22 años, control preventivo</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Testículo izquierdo no descendido; orquidopexia a los 5</tspan><tspan x="640.0" dy="16">años.</tspan><tspan x="640.0" dy="16">Sin síntomas ni antecedentes familiares.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LAS CUATRO OPCIONES FRENTE AL CASO</tspan></text><line x1="410.3" y1="419.0" x2="340.0" y2="441.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="441.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="363.0" x2="660.0" y2="341.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="341.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="419.0" x2="660.0" y2="441.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="441.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="410.3" y1="363.0" x2="340.0" y2="341.0" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="341.0" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="391.0" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="391.0" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="377.0" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">Criptorquidia</tspan><tspan x="500.0" dy="19">operada: ¿qué</tspan><tspan x="500.0" dy="19">decirle?</tspan></text><rect x="40.0" y="299.0" width="300.0" height="84.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="332.7" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Explicar que el riesgo aumenta</tspan></text><text x="190.0" y="356.4" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Y enseñar el autoexamen mensual</tspan></text><rect x="144.6" y="373.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="388.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="399.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="400.0" width="6.0" height="82.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="432.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">La orquidopexia elimina el riesgo</tspan></text><text x="190.0" y="456.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Falso: solo lo reduce algo</tspan></text><rect x="660.0" y="299.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="300.0" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="810.0" y="332.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Ecografía cada 6 meses</tspan></text><text x="810.0" y="356.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Sin beneficio en un varón asintomático</tspan></text><rect x="660.0" y="399.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="400.0" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="432.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Marcadores cada 6 meses</tspan></text><text x="810.0" y="456.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">No sirven para tamizar</tspan></text><text x="40.0" y="533.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="545.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="569.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Criptorquidia al nacer</tspan></text><line x1="248.5" y1="565.5" x2="267.5" y2="565.5" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,560.5 266.5,570.5 274.5,565.5" fill="#0f766e"/><rect x="278.5" y="545.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="569.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Orquidopexia a los 5 años</tspan></text><line x1="487.0" y1="565.5" x2="506.0" y2="565.5" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,560.5 505.0,570.5 513.0,565.5" fill="#0f766e"/><rect x="517.0" y="545.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="569.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Riesgo sigue mayor</tspan></text><line x1="725.5" y1="565.5" x2="744.5" y2="565.5" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,560.5 743.5,570.5 751.5,565.5" fill="#0f766e"/><rect x="755.5" y="545.0" width="204.5" height="41.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="569.5" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Autoexamen mensual</tspan></text><text x="40.0" y="626.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="638.0" width="298.0" height="294.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="648.0" width="230.4" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="662.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="256"><tspan x="61.0" dy="0">TESTÍCULOS DEL PACIENTE (ESQUEMA)</tspan></text><g data-box="54.0 676.0 270.0 232.0"><g transform="translate(64.0,676.0) scale(1.0)"><path d="M40 70 C30 150 70 210 130 212 C190 210 230 150 220 70 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M130 76 L130 206" fill="none" stroke="#e9b48f" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M70 10 L86 74 M190 10 L174 74" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="48" y="14" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">conducto inguinal</text><text x="8" y="226" font-size="11" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">D</text><text x="252" y="226" font-size="11" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">I</text><ellipse cx="88" cy="140" rx="30" ry="40" fill="#fde7f3" stroke="#9d174d" stroke-width="2" /><ellipse cx="172" cy="146" rx="24" ry="32" fill="#fde7f3" stroke="#9d174d" stroke-width="2" /><ellipse cx="172" cy="146" rx="34" ry="42" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="5 4"/><path d="M186 30 C190 70 182 96 174 108" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="6 4"/><line x1="176.0" y1="92.0" x2="174.9" y2="102.0" stroke="#ea580c" stroke-width="2.5"/><polygon points="174.0,110.0 170.7,100.6 179.3,101.5" fill="#ea580c"/><text x="258" y="40" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="end" data-max="0">bajado con</text><text x="258" y="40" font-size="10" font-weight="800" fill="#ea580c" text-anchor="end" data-max="0">bajado con</text><text x="258" y="52" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="end" data-max="0">orquidopexia</text><text x="258" y="52" font-size="10" font-weight="800" fill="#ea580c" text-anchor="end" data-max="0">orquidopexia</text><text x="172" y="204" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">riesgo mayor</text><text x="172" y="204" font-size="10.5" font-weight="800" fill="#ea580c" text-anchor="middle" data-max="0">riesgo mayor</text></g></g><rect x="360.0" y="638.0" width="600.0" height="31.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="378.0" cy="653.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="378.0" y="657.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="378.0" dy="0">1</tspan></text><text x="396.0" y="658.0" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="556"><tspan x="396.0" dy="0">El testículo izquierdo bajó con cirugía a los 5 años.</tspan></text><rect x="360.0" y="676.0" width="600.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="378.0" cy="691.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="378.0" y="695.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="378.0" dy="0">2</tspan></text><text x="396.0" y="696.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="556"><tspan x="396.0" dy="0">Ese testículo (y algo el otro) tiene más riesgo de tumor.</tspan></text><rect x="360.0" y="714.0" width="600.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="378.0" cy="729.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="378.0" y="733.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="378.0" dy="0">3</tspan></text><text x="396.0" y="734.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="556"><tspan x="396.0" dy="0">Autoexamen: buscar una masa dura e indolora.</tspan></text><text x="40.0" y="972.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="982.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1013.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="1013.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Eco cada 6 meses</tspan></text><text x="491.2" y="1004.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">La cirugía elimina el</tspan><tspan x="491.2" dy="17">riesgo</tspan></text><text x="678.8" y="1013.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Marcadores cada 6 meses</tspan></text><rect x="775.5" y="985.0" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="1004.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Explicar que el riesgo</tspan><tspan x="866.2" dy="17">aumenta</tspan></text><rect x="40.0" y="1036.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="1036.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1057.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="1057.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Sin beneficio</tspan></text><text x="491.2" y="1057.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Falso</tspan></text><text x="678.8" y="1057.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No tamizan</tspan></text><text x="866.2" y="1057.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Ninguno</tspan></text><rect x="40.0" y="982.0" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1094.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1122.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1144.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Explicar que su riesgo de cáncer testicular es mayor (varias veces el de la población).</tspan><tspan x="58.0" dy="18">• Enseñar el autoexamen testicular mensual y consultar ante cualquier masa.</tspan><tspan x="58.0" dy="18">• No se recomiendan ecografías ni marcadores periódicos en un varón sin síntomas.</tspan></text><text x="58.0" y="1202.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: EAU, guías de urología (2024); AUA, criptorquidia (2014, reafirmada).</tspan></text></svg>