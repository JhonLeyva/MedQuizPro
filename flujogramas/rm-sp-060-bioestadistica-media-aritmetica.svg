<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1243" viewBox="0 0 1000 1243" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La media de 4, 5, 6, 5 y 7 días de estancia es 27 entre 5: 5,4 días"><title>La media de 4, 5, 6, 5 y 7 días de estancia es 27 entre 5: 5,4 días</title><rect x="0.75" y="0.75" width="998.5" height="1241.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Bioestadística · media aritmética</tspan></text><rect x="393.5" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="457.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="457.8" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Media aritmética</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Suma de los valores dividida entre el número de observaciones.</tspan><tspan x="58.0" dy="17">Usa todos los datos y es sensible a valores extremos.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Estancia de 5 pacientes</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">4, 5, 6, 5 y 7 días.</tspan><tspan x="640.0" dy="16">¿Cuál es la media?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SE CALCULA EN TRES PASOS</tspan></text><rect x="40.0" y="269.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="314.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="342.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">1</tspan></text><rect x="124.0" y="269.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="297.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Cuánto suman los días?</tspan></text><rect x="136.0" y="311.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="331.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">4 + 5 + 6 + 5 + 7 = 27</tspan></text><text x="152.0" y="350.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Se suman todos los valores, sin omitir ninguno.</tspan></text><line x1="77.0" y1="372.0" x2="77.0" y2="391.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,390.0 82.0,390.0 77.0,398.0" fill="#0f766e"/><text x="134.0" y="390.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="400.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="445.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="473.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">2</tspan></text><rect x="124.0" y="400.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="428.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Entre cuántos pacientes?</tspan></text><rect x="136.0" y="442.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="462.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">27 entre 5 = 5,4 días</tspan></text><text x="152.0" y="481.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Se divide entre el número de observaciones.</tspan></text><line x1="77.0" y1="503.0" x2="77.0" y2="522.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,521.0 82.0,521.0 77.0,529.0" fill="#0f766e"/><text x="134.0" y="521.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="531.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="576.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="604.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">3</tspan></text><rect x="124.0" y="531.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="559.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Y las otras medidas?</tspan></text><rect x="136.0" y="573.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="593.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Mediana 5 y moda 5</tspan></text><text x="152.0" y="612.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">La media se aleja de ellas por el valor extremo de 7.</tspan></text><rect x="40.0" y="652.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="678.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Media = suma entre n = 5,4 días</tspan></text><text x="60.0" y="697.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Las otras opciones provienen de sumar mal u omitir un dato.</tspan></text><text x="40.0" y="758.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">MEDIDAS DE RESUMEN DE 4, 5, 6, 5 Y 7 DÍAS</tspan></text><rect x="40.0" y="770.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="789.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Medida</tspan></text><text x="290.0" y="789.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Cómo se obtiene</tspan></text><text x="630.0" y="789.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">Valor</tspan></text><rect x="40.0" y="799.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="818.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Media (este caso)</tspan></text><text x="290.0" y="818.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Suma 27 entre 5 pacientes</tspan></text><text x="630.0" y="818.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">5,4 días</tspan></text><rect x="180.6" y="802.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="226.0" y="817.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="226.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="828.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="847.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Mediana</tspan></text><text x="290.0" y="847.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Valor central de 4, 5, 5, 6, 7</tspan></text><text x="630.0" y="847.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">5 días</tspan></text><rect x="40.0" y="857.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="876.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Moda</tspan></text><text x="290.0" y="876.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Valor más frecuente</tspan></text><text x="630.0" y="876.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">5 días</tspan></text><rect x="40.0" y="886.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="905.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Desviación estándar muestral</tspan></text><text x="290.0" y="905.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="290.0" dy="0">Raíz de 5,2 entre 4</tspan></text><text x="630.0" y="905.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="324"><tspan x="630.0" dy="0">1,14 días</tspan></text><text x="40.0" y="955.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="965.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="987.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="968.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="987.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">5,4 días</tspan></text><text x="435.0" y="987.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">5,6 días</tspan></text><text x="585.0" y="987.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">6,1 días</tspan></text><text x="735.0" y="987.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">4,9 días</tspan></text><text x="885.0" y="987.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">6,4 días</tspan></text><rect x="40.0" y="1002.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1002.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1031.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Media?</tspan></text><text x="285.0" y="1031.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: 27 entre 5</tspan></text><text x="435.0" y="1023.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: exigiría una suma</tspan><tspan x="435.0" dy="16">de 28</tspan></text><text x="585.0" y="1031.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: suma de más</tspan></text><text x="735.0" y="1031.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: omite un valor</tspan></text><text x="885.0" y="1031.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: suma de más</tspan></text><rect x="40.0" y="965.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1076.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1104.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1126.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Suma: 4 + 5 + 6 + 5 + 7 = 27; 27 entre 5 pacientes = 5,4 días. Es el promedio de estancia, indicador de gestión hospitalaria.</tspan><tspan x="58.0" dy="18">• Mediana (datos ordenados 4, 5, 5, 6, 7): 5. Moda: 5. Desviación estándar muestral: cerca de 1,14 días.</tspan><tspan x="58.0" dy="18">• Las otras opciones son errores de cálculo: 5,6 exige una suma de 28; 6,1 y 6,4 suman de más; 4,9 omite algún valor.</tspan><tspan x="58.0" dy="18">• Alerta: en distribuciones asimétricas se prefiere la mediana con el rango intercuartílico; verifique cálculos y unidades.</tspan></text><text x="58.0" y="1202.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Daniel WW y Cross CL, Biostatistics: A Foundation for Analysis in the Health Sciences, 11.ª ed. (Wiley, 2018).</tspan></text></svg>