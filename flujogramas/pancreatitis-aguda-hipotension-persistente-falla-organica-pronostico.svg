<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1310" viewBox="0 0 1000 1310" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Pancreatitis aguda: la hipotensión que no responde a líquidos marca el mal pronóstico"><title>Pancreatitis aguda: la hipotensión que no responde a líquidos marca el mal pronóstico</title><rect x="0.75" y="0.75" width="998.5" height="1308.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pancreatitis aguda · gravedad (Atlanta revisada)</tspan></text><rect x="483.7" y="32.0" width="180.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="573.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="164"><tspan x="573.9" dy="0">GASTROENTEROLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Gravedad de la pancreatitis aguda</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Lo que define la gravedad es la falla de órganos y si persiste más de 48 h.</tspan><tspan x="58.0" dy="17">El dolor y el nivel de enzimas no predicen la evolución.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 40 años, alcohol crónico</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">12 h de dolor epigástrico en cinturón, vómitos.</tspan><tspan x="640.0" dy="16">Taquicárdico, hipotensión leve; amilasa y lipasa &gt; 3</tspan><tspan x="640.0" dy="16">veces lo normal.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿QUÉ DATO PESA EN EL PRONÓSTICO?</tspan></text><text x="614.0" y="297.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,309.0 580.0,309.0 543.8,385.0 76.2,385.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="325.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="357.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="424"><tspan x="310.0" dy="0">Pancreatitis aguda: ¿qué predice peor evolución?</tspan></text><line x1="565.9" y1="347.0" x2="606.0" y2="347.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="318.0" width="111.0" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="669.5" y="335.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="669.5" dy="0">Dolor persistente</tspan></text><rect x="731.0" y="318.0" width="120.8" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="791.3" y="335.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="791.3" dy="0">Enzimas más altas</tspan></text><rect x="614.0" y="350.0" width="145.0" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="686.5" y="367.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="686.5" dy="0">Hipotensión persistente</tspan></text><rect x="765.0" y="350.0" width="108.3" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="819.2" y="367.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="819.2" dy="0">Fiebre temprana</tspan></text><polygon points="76.2,389.0 543.8,389.0 507.5,445.0 112.5,445.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="138.5" cy="417.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="138.5" y="421.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="138.5" dy="0">1</tspan></text><text x="320.0" y="421.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="331"><tspan x="320.0" dy="0">¿El dolor intenso predice gravedad?</tspan></text><line x1="529.6" y1="417.0" x2="606.0" y2="417.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="404.0" width="123.1" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="675.5" y="421.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="675.5" dy="0">✕ Dolor persistente</tspan></text><line x1="636.0" y1="417.5" x2="727.1" y2="417.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="112.5,449.0 507.5,449.0 471.2,509.0 148.8,509.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="174.8" cy="479.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="174.8" y="483.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="174.8" dy="0">2</tspan></text><text x="320.0" y="475.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="258"><tspan x="320.0" dy="0">¿La cifra de enzimas refleja la</tspan><tspan x="320.0" dy="17">gravedad?</tspan></text><line x1="493.4" y1="479.0" x2="606.0" y2="479.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="466.0" width="132.9" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="680.4" y="483.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="680.4" dy="0">✕ Enzimas más altas</tspan></text><line x1="636.0" y1="479.5" x2="736.9" y2="479.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="148.8,513.0 471.2,513.0 435.0,573.0 185.0,573.0" fill="#5eead4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="543.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="547.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">3</tspan></text><text x="320.0" y="539.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">¿La fiebre del primer día es</tspan><tspan x="320.0" dy="17">falla de órgano?</tspan></text><line x1="457.1" y1="543.0" x2="606.0" y2="543.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="530.0" width="120.4" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="674.2" y="547.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="674.2" dy="0">✕ Fiebre temprana</tspan></text><line x1="636.0" y1="543.5" x2="724.4" y2="543.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="577.0" x2="310.0" y2="596.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,595.0 315.0,595.0 310.0,603.0" fill="#0f766e"/><rect x="140.0" y="607.0" width="340.0" height="74.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="636.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Hipotensión que no responde a líquidos</tspan></text><text x="310.0" y="660.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Falla cardiovascular persistente: pancreatitis grave</tspan></text><rect x="370.6" y="596.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="611.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="606.4" width="346.0" height="76.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="626.4" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="644.4" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">La gravedad se define por falla de órganos (Marshall ≥ 2)</tspan><tspan x="628.0" dy="16">y su duración, no por el dolor ni las enzimas.</tspan></text><text x="40.0" y="721.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="733.9" width="348.0" height="282.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="743.9" width="145.2" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="757.9" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="306"><tspan x="61.0" dy="0">PÁNCREAS INFLAMADO</tspan></text><g data-box="54.0 771.9 320.0 220.0"><g transform="translate(54.0,771.9) scale(1.0)"><path d="M10 30 Q160 -10 310 30 L310 200 Q160 230 10 200 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M70 40 C120 20 220 20 262 46 C280 70 262 92 220 92 C170 92 120 96 86 86 C62 78 56 54 70 40 Z" fill="#fbcfe8" stroke="#9a6b52" stroke-width="1.8" stroke-linejoin="round" /><text x="166" y="64" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Estómago</text><text x="166" y="64" font-size="10.5" font-weight="800" fill="#9d174d" text-anchor="middle" data-max="0">Estómago</text><ellipse cx="160" cy="196" rx="16" ry="12" fill="#e2e8f0" stroke="#64748b" stroke-width="1.8" /><text x="160" y="200" font-size="9" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">col.</text><path d="M40 150 C80 130 150 130 200 132 C240 134 272 128 290 118 C300 132 292 148 272 152 C230 160 150 162 90 170 C60 174 36 166 40 150 Z" fill="#fdba74" stroke="#ea580c" stroke-width="2" stroke-linejoin="round" /><text x="100" y="168" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Páncreas</text><text x="100" y="168" font-size="10.5" font-weight="800" fill="#92400e" text-anchor="middle" data-max="0">Páncreas</text></g></g><rect x="410.0" y="733.9" width="550.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="428.0" cy="749.4" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="428.0" y="753.4" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="428.0" dy="0">1</tspan></text><text x="446.0" y="753.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="506"><tspan x="446.0" dy="0">Páncreas edematoso detrás del estómago.</tspan></text><rect x="410.0" y="771.9" width="550.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="428.0" cy="787.4" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="428.0" y="791.4" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="428.0" dy="0">2</tspan></text><text x="446.0" y="791.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="506"><tspan x="446.0" dy="0">La inflamación libera mediadores: vasodilatación y fuga capilar (hipotensión).</tspan></text><rect x="410.0" y="809.9" width="550.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="428.0" cy="825.4" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="428.0" y="829.4" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="428.0" dy="0">3</tspan></text><text x="446.0" y="829.9" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="506"><tspan x="446.0" dy="0">Si la hipotensión persiste &gt; 48 h pese a líquidos: falla de órgano = grave.</tspan></text><text x="40.0" y="1055.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1065.9" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1088.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="1088.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Dolor persistente</tspan></text><text x="491.2" y="1088.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Más amilasa/lipasa</tspan></text><rect x="588.0" y="1068.9" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="678.8" y="1088.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Hipotensión persistente</tspan></text><text x="866.2" y="1088.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Fiebre &gt; 38,5 °C</tspan></text><rect x="40.0" y="1102.9" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="588.0" y="1102.9" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1123.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Predice gravedad?</tspan></text><text x="303.8" y="1123.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No</tspan></text><text x="491.2" y="1123.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No</tspan></text><text x="678.8" y="1123.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Sí: falla orgánica</tspan></text><text x="866.2" y="1123.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No en las primeras 24 h</tspan></text><rect x="40.0" y="1065.9" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1160.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1188.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1210.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Falla orgánica persistente (&gt; 48 h: cardiovascular, respiratoria o renal) = pancreatitis grave.</tspan><tspan x="58.0" dy="18">• La hipotensión que no mejora con reanimación adecuada es el peor predictor temprano.</tspan><tspan x="58.0" dy="18">• La cifra de amilasa o lipasa solo sirve para el diagnóstico, no para el pronóstico.</tspan></text><text x="58.0" y="1268.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Clasificación de Atlanta revisada (2012); ACG, guía de pancreatitis aguda (2024).</tspan></text></svg>