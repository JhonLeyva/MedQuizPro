<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1107" viewBox="0 0 1000 1107" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Antes de trombolizar un ACV isquémico la presión debe ser menor de 185/110 mmHg"><title>Antes de trombolizar un ACV isquémico la presión debe ser menor de 185/110 mmHg</title><rect x="0.75" y="0.75" width="998.5" height="1105.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neurología · ACV isquémico y trombolisis</tspan></text><rect x="447.0" y="32.0" width="113.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="503.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="98"><tspan x="503.9" dy="0">NEUROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Trombolisis intravenosa</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Alteplasa o tenecteplasa dentro de las 4,5 horas del inicio.</tspan><tspan x="58.0" dy="17">La presión alta eleva el riesgo de hemorragia intracerebral sintomática.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué valor de presión arterial se debe manejar en un</tspan><tspan x="640.0" dy="16">ACV isquémico con indicación de trombolisis?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PRESIÓN ARTERIAL SEGÚN SE TROMBOLICE O NO</tspan></text><rect x="40.0" y="269.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="295.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Presión sistólica (mmHg)</tspan></text><text x="60.0" y="314.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Para trombolizar debe estar por debajo del límite.</tspan></text><rect x="70.0" y="378.0" width="456.9" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="298.4" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="447"><tspan x="298.4" dy="0">Se puede trombolizar</tspan></text><rect x="526.9" y="378.0" width="188.1" height="40.0" rx="6" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/><text x="620.9" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#c2410c" text-anchor="middle" data-max="178"><tspan x="620.9" dy="0">Tratar primero</tspan></text><rect x="715.0" y="378.0" width="215.0" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="822.5" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="205"><tspan x="822.5" dy="0">Tratar siempre</tspan></text><line x1="70.0" y1="418.0" x2="70.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="70.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="70.0" dy="0">100</tspan></text><line x1="285.0" y1="418.0" x2="285.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="285.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="285.0" dy="0">140</tspan></text><line x1="526.9" y1="418.0" x2="526.9" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="526.9" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="526.9" dy="0">185</tspan></text><line x1="715.0" y1="418.0" x2="715.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="715.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="715.0" dy="0">220</tspan></text><line x1="930.0" y1="418.0" x2="930.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">260</tspan></text><polygon points="517.9,364.0 535.9,364.0 526.9,376.0" fill="#ea580c"/><rect x="453.0" y="338.0" width="147.7" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="526.9" y="353.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="136"><tspan x="526.9" dy="0">◆ LÍMITE: menor de 185</tspan></text><rect x="40.0" y="468.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="494.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Presión diastólica (mmHg)</tspan></text><text x="60.0" y="513.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El límite diastólico es 110 mmHg.</tspan></text><rect x="70.0" y="577.0" width="537.5" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="338.8" y="602.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="528"><tspan x="338.8" dy="0">Se puede trombolizar</tspan></text><rect x="607.5" y="577.0" width="107.5" height="40.0" rx="6" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/><text x="661.2" y="602.0" font-size="12" font-weight="800" font-style="normal" fill="#c2410c" text-anchor="middle" data-max="98"><tspan x="661.2" dy="0">Tratar primero</tspan></text><rect x="715.0" y="577.0" width="215.0" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="822.5" y="602.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="205"><tspan x="822.5" dy="0">Tratar siempre</tspan></text><line x1="70.0" y1="617.0" x2="70.0" y2="625.0" stroke="#64748b" stroke-width="1.5"/><text x="70.0" y="639.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="70.0" dy="0">60</tspan></text><line x1="285.0" y1="617.0" x2="285.0" y2="625.0" stroke="#64748b" stroke-width="1.5"/><text x="285.0" y="639.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="285.0" dy="0">80</tspan></text><line x1="607.5" y1="617.0" x2="607.5" y2="625.0" stroke="#64748b" stroke-width="1.5"/><text x="607.5" y="639.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="607.5" dy="0">110</tspan></text><line x1="715.0" y1="617.0" x2="715.0" y2="625.0" stroke="#64748b" stroke-width="1.5"/><text x="715.0" y="639.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="715.0" dy="0">120</tspan></text><line x1="930.0" y1="617.0" x2="930.0" y2="625.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="639.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">140</tspan></text><polygon points="598.5,563.0 616.5,563.0 607.5,575.0" fill="#ea580c"/><rect x="534.0" y="537.0" width="147.0" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="607.5" y="552.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="135"><tspan x="607.5" dy="0">◆ LÍMITE: menor de 110</tspan></text><text x="40.0" y="685.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE MANEJA</tspan></text><rect x="40.0" y="695.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="696.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="719.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Antes de trombolizar</tspan></text><text x="58.0" y="740.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Menor de 185/110; labetalol o nicardipino IV</tspan></text><rect x="351.3" y="695.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="696.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="719.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Durante las primeras 24 horas</tspan></text><text x="369.3" y="740.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Mantener menor de 180/105 mmHg</tspan></text><rect x="662.7" y="695.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="696.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="719.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Sin trombolisis</tspan></text><text x="680.7" y="740.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Se tolera hasta 220/120 mmHg</tspan></text><text x="40.0" y="804.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="814.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="836.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="836.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">&gt; 220/110</tspan></text><text x="435.0" y="836.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">&gt; 180/100</tspan></text><rect x="513.0" y="817.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="836.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">&gt; 185/110</tspan></text><text x="735.0" y="836.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">&gt; 220/100</tspan></text><text x="885.0" y="836.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">&gt; 190/100</tspan></text><rect x="40.0" y="851.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="851.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="872.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Valor antes de</tspan><tspan x="54.0" dy="16">trombolizar?</tspan></text><text x="285.0" y="872.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es el umbral sin</tspan><tspan x="285.0" dy="16">trombolisis (220/120)</tspan></text><text x="435.0" y="872.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no corresponde a</tspan><tspan x="435.0" dy="16">un punto de corte</tspan></text><text x="585.0" y="872.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: límite de seguridad</tspan><tspan x="585.0" dy="16">de la guía</tspan></text><text x="735.0" y="872.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no corresponde a</tspan><tspan x="735.0" dy="16">un punto de corte</tspan></text><text x="885.0" y="872.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no corresponde a</tspan><tspan x="885.0" dy="16">un punto de corte</tspan></text><rect x="40.0" y="814.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="925.0" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="953.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="975.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Antes del fármaco: menor de 185 mmHg de sistólica y de 110 de diastólica; si se supera, labetalol o nicardipino IV, y si no se logra, no se trombóliza.</tspan><tspan x="58.0" dy="18">• Tras iniciar la infusión se mantiene menor de 180/105 mmHg durante las primeras 24 horas, con controles frecuentes.</tspan><tspan x="58.0" dy="18">• Sin trombolisis se tolera hasta 220/120 mmHg (hipertensión permisiva por la penumbra isquémica).</tspan><tspan x="58.0" dy="18">• Otros requisitos: glucosa mayor de 50 mg/dL, plaquetas mayores de 100 000 y TC sin hemorragia; trombectomía hasta 24 horas con tejido salvable.</tspan></text><text x="58.0" y="1051.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Powers y cols., guía AHA/ASA 2019 de ACV isquémico agudo (Stroke 2019); Prabhakaran y cols., guía AHA/ASA 2026 (Stroke 2026); Harrison Principios de Medicina</tspan><tspan x="58.0" dy="15">Interna 21.ª ed. (2022).</tspan></text></svg>