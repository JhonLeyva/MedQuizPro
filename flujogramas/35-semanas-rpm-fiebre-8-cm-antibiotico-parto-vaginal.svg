<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="802" viewBox="0 0 1000 802" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Gestante de 35 semanas con corioamnionitis (fiebre, taquicardia fetal, líquido fétido) y 8 cm de dilatación con presentación en +1: antibióticos y parto vaginal"><title>Gestante de 35 semanas con corioamnionitis (fiebre, taquicardia fetal, líquido fétido) y 8 cm de dilatación con presentación en +1: antibióticos y parto vaginal</title><rect x="0.75" y="0.75" width="998.5" height="800.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Infección intraamniótica · vía del parto</tspan></text><rect x="426.9" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="514.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="514.1" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Corioamnionitis y vía del parto</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La infección indica terminar la gestación, pero no indica cesárea por sí sola.</tspan><tspan x="58.0" dy="17">Si el trabajo de parto avanza (8 cm, +1), antibiótico y parto vaginal; la cesárea solo por</tspan><tspan x="58.0" dy="17">indicación obstétrica.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Segundigesta de 35 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">RPM de 15 horas y fiebre; T 38,7 °C.</tspan><tspan x="640.0" dy="16">LCF 180; 8 cm, 80 %, +1; membranas rotas con mal</tspan><tspan x="640.0" dy="16">olor.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CORIOAMNIONITIS: ¿CÓMO TERMINA?</tspan></text><rect x="40.0" y="285.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="307.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="160"><tspan x="54.0" dy="0">TRABAJO DE PARTO</tspan></text><text x="405.0" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="350"><tspan x="405.0" dy="0">Sin otra indicación de cesárea</tspan></text><text x="775.0" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="350"><tspan x="775.0" dy="0">Con indicación obstétrica</tspan></text><rect x="40.0" y="325.0" width="174.0" height="57.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="351.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="152"><tspan x="54.0" dy="0">Avanzado (8 cm, +1)</tspan></text><text x="54.0" y="368.0" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="152"><tspan x="54.0" dy="0">Este caso</tspan></text><rect x="223.0" y="325.0" width="364.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="235.0" y="357.5" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="346"><tspan x="235.0" dy="0">ANTIBIÓTICO + PARTO VAGINAL</tspan></text><rect x="486.2" y="314.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="531.6" y="329.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="531.6" dy="0">◆ ESTE CASO</tspan></text><rect x="593.0" y="325.0" width="364.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="605.0" y="357.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="346"><tspan x="605.0" dy="0">Antibiótico + cesárea</tspan></text><rect x="40.0" y="388.0" width="174.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="421.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="152"><tspan x="54.0" dy="0">No iniciado o lento</tspan></text><rect x="223.0" y="388.0" width="364.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="235.0" y="413.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="346"><tspan x="235.0" dy="0">Antibiótico + inducción</tspan></text><text x="235.0" y="429.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="346"><tspan x="235.0" dy="0">Oxitocina</tspan></text><rect x="593.0" y="388.0" width="364.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="605.0" y="420.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="346"><tspan x="605.0" dy="0">Antibiótico + cesárea</tspan></text><text x="44.0" y="467.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Siempre antibiótico; la vía la decide la obstetricia.</tspan></text><text x="40.0" y="515.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="525.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="556.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="547.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Corticoide y</tspan><tspan x="285.0" dy="17">cesárea</tspan></text><rect x="363.0" y="528.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="547.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Antibioticoterapia y</tspan><tspan x="435.0" dy="17">parto vaginal</tspan></text><text x="585.0" y="547.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Antibioticoterapia y</tspan><tspan x="585.0" dy="17">cesárea</tspan></text><text x="735.0" y="547.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Corticoide y parto</tspan><tspan x="735.0" dy="17">vaginal</tspan></text><text x="885.0" y="547.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Tocólisis y</tspan><tspan x="885.0" dy="17">antibióticos</tspan></text><rect x="40.0" y="579.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="579.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="608.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Manejo?</tspan></text><text x="285.0" y="608.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: sin indicación</tspan></text><text x="435.0" y="608.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: parto avanzado</tspan></text><text x="585.0" y="600.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: la infección no</tspan><tspan x="585.0" dy="16">indica cesárea</tspan></text><text x="735.0" y="600.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: sin antibiótico y no</tspan><tspan x="735.0" dy="16">sirve</tspan></text><text x="885.0" y="608.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: contraindicada</tspan></text><rect x="40.0" y="525.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="653.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="681.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="703.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Ampicilina + gentamicina EV; antipirético; neonatología presente.</tspan><tspan x="58.0" dy="18">• Corticoides no sirven aquí (35 sem y parto inminente); tocólisis contraindicada.</tspan><tspan x="58.0" dy="18">• Tras cesárea (si se hiciera): añadir clindamicina o metronidazol.</tspan></text><text x="58.0" y="761.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG n.º 712 (2017); MINSA Perú.</tspan></text></svg>