cbd5e1" stroke-width="1"/><text x="740.0" y="355.0" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">Hasta documentar la azoospermia.</tspan></text><rect x="40.0" y="383.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="397.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Pedir el</tspan><tspan x="50.0" dy="16">espermatograma de</tspan><tspan x="50.0" dy="16">control</tspan></text><line x1="198.0" y1="409.0" x2="710.0" y2="409.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="242.8" cy="404.0" r="13" fill="#cbd5e1" stroke="#cbd5e1" stroke-width="2"/><text x="242.8" y="408.5" font-size="12" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="242.8" dy="0">✕</tspan></text><text x="242.8" y="431.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="242.8" dy="0">No</tspan></text><circle cx="348.4" cy="404.0" r="13" fill="#cbd5e1" stroke="#cbd5e1" stroke-width="2"/><text x="348.4" y="408.5" font-size="12" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="348.4" dy="0">✕</tspan></text><text x="348.4" y="431.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="348.4" dy="0">No</tspan></text><circle cx="454.0" cy="404.0" r="13" fill="#cbd5e1" stroke="#cbd5e1" stroke-width="2"/><text x="454.0" y="408.5" font-size="12" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="454.0" dy="0">✕</tspan></text><text x="454.0" y="431.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="454.0" dy="0">No</tspan></text><circle cx="559.6" cy="404.0" r="13" fill="#cbd5e1" stroke="#cbd5e1" stroke-width="2"/><text x="559.6" y="408.5" font-size="12" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="559.6" dy="0">✕</tspan></text><text x="559.6" y="431.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="559.6" dy="0">No</tspan></text><circle cx="665.2" cy="404.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="665.2" y="408.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="665.2" dy="0">✓</tspan></text><text x="665.2" y="431.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="665.2" dy="0">Sí</tspan></text><rect x="730.0" y="383.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="405.5" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">Tras 20 eyaculaciones y 8 a 12</tspan><tspan x="740.0" dy="15">semanas.</tspan></text><rect x="40.0" y="441.0" width="142.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="455.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="50.0" dy="0">Declarar éxito y</tspan><tspan x="50.0" dy="16">suspender el</tspan><tspan x="50.0" dy="16">respaldo</tspan></text><line x1="198.0" y1="467.0" x2="710.0" y2="467.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="665.2" cy="462.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="665.2" y="466.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="665.2" dy="0">✓</tspan></text><text x="665.2" y="489.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="102"><tspan x="665.2" dy="0">Sí</tspan></text><rect x="730.0" y="441.0" width="230.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="740.0" y="463.5" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="210"><tspan x="740.0" dy="0">Solo con azoospermia o menos de 100</tspan><tspan x="740.0" dy="15">000 inmóviles por mL.</tspan></text><rect x="597.4" y="310.0" width="135.6" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="665.2" y="325.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="665.2" dy="0">◆ 20 EYACULACIONES</tspan></text><text x="44.0" y="513.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="44.0" dy="0">✓ se indica · ✕ no se indica en ese momento</tspan></text><rect x="40.0" y="537.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="563.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Control posvasectomía = tras 20 eyaculaciones</tspan></text><text x="60.0" y="582.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Con 5 o 10 eyaculaciones, una semana o un mes el reservorio aún tiene espermatozoides viables.</tspan></text><text x="40.0" y="649.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="659.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="690.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="681.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Tener 10</tspan><tspan x="285.0" dy="17">eyaculaciones</tspan></text><text x="435.0" y="681.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Tener 5</tspan><tspan x="435.0" dy="17">eyaculaciones</tspan></text><text x="585.0" y="690.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Luego de 1 semana</tspan></text><text x="735.0" y="690.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Luego de 1 mes</tspan></text><rect x="813.0" y="662.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="681.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Tener 20</tspan><tspan x="885.0" dy="17">eyaculaciones</tspan></text><rect x="40.0" y="713.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="713.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="750.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Condición mínima?</tspan></text><text x="285.0" y="742.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: insuficiente, puede</tspan><tspan x="285.0" dy="16">dar un éxito falso</tspan></text><text x="435.0" y="742.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: insuficiente, puede</tspan><tspan x="435.0" dy="16">dar un éxito falso</tspan></text><text x="585.0" y="742.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: una semana es</tspan><tspan x="585.0" dy="16">insuficiente</tspan></text><text x="735.0" y="742.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: un mes es</tspan><tspan x="735.0" dy="16">insuficiente</tspan></text><text x="885.0" y="734.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: vacía los</tspan><tspan x="885.0" dy="16">reservorios de</tspan><tspan x="885.0" dy="16">espermatozoides</tspan></text><rect x="40.0" y="659.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="803.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="831.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="853.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Se mantiene un método de respaldo hasta demostrar ausencia de espermatozoides. El control se hace tras unas 20 eyaculaciones y desde las 8 a 12</tspan><tspan x="58.0" dy="18">   semanas.</tspan><tspan x="58.0" dy="18">• Éxito: azoospermia; la guía AUA acepta menos de 100 000 espermatozoides inmóviles por mL para liberar del respaldo. Espermatozoides móviles a los 6</tspan><tspan x="58.0" dy="18">   meses sugieren falla.</tspan><tspan x="58.0" dy="18">• Esperar 5 o 10 eyaculaciones, una semana o un mes es insuficiente y puede declarar un éxito falso.</tspan><tspan x="58.0" dy="18">• Alerta: informar que no protege contra las infecciones de transmisión sexual. Complicaciones: hematoma, infección y dolor; tardías: granuloma y</tspan><tspan x="58.0" dy="18">   síndrome doloroso.</tspan></text><text x="58.0" y="983.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Sharlip ID y cols., Vasectomy: AUA Guideline (J Urol 2012); Campbell-Walsh-Wein Urología, 12.ª ed. (2020).</tspan></text></svg>