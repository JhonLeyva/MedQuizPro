<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="980" viewBox="0 0 1000 980" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Hernia obturatriz: dónde sale cada hernia de la ingle"><title>Hernia obturatriz: dónde sale cada hernia de la ingle</title><rect x="0.75" y="0.75" width="998.5" height="978.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Hernias de la pared y del piso pélvico · diagnóstico por localización</tspan></text><rect x="597.9" y="32.0" width="156.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="675.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="140"><tspan x="675.9" dy="0">CIRUGÍA ENAM: HERNIAS</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hernias de la región inguinal y pélvica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cada hernia sale por un orificio distinto; la localización y los signos dicen cuál es.</tspan><tspan x="58.0" dy="17">Las que salen por orificios estrechos (femoral, obturatriz) se estrangulan más.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 82 años, delgada, con obstrucción</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dolor cólico, distensión y dolor irradiado a la cara</tspan><tspan x="640.0" dy="16">interna del muslo derecho.</tspan><tspan x="640.0" dy="16">Howship-Romberg (+); masa dolorosa en la pared</tspan><tspan x="640.0" dy="16">pélvica al tacto vaginal.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">MAPA DE LA PELVIS: CUATRO ORIFICIOS, CUATRO HERNIAS</tspan></text><rect x="40.0" y="301.0" width="440.0" height="400.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="311.0" width="152.2" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="325.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">PELVIS VISTA DE FRENTE</tspan></text><g transform="translate(52.0,335.0) scale(0.95)"><path d="M188 92 C160 60 120 40 78 52 C48 62 34 96 44 126 C52 150 70 168 86 186 L112 206 C130 180 160 160 190 150 Z" fill="#f5efe2" stroke="#a8977a" stroke-width="2.5" stroke-linejoin="round"/><path d="M252 92 C280 60 320 40 362 52 C392 62 406 96 396 126 C388 150 370 168 354 186 L328 206 C310 180 280 160 250 150 Z" fill="#f5efe2" stroke="#a8977a" stroke-width="2.5" stroke-linejoin="round"/><path d="M186 88 H254 L246 170 C238 190 202 190 194 170 Z" fill="#ece3d0" stroke="#a8977a" stroke-width="2.5" stroke-linejoin="round"/><path d="M200 104 H240" stroke="#a8977a" stroke-width="1.5"/><path d="M200 122 H240" stroke="#a8977a" stroke-width="1.5"/><path d="M200 140 H240" stroke="#a8977a" stroke-width="1.5"/><path d="M200 158 H240" stroke="#a8977a" stroke-width="1.5"/><circle cx="100" cy="214" r="24" fill="#ece3d0" stroke="#a8977a" stroke-width="2.5" stroke-linejoin="round"/><circle cx="340" cy="214" r="24" fill="#ece3d0" stroke="#a8977a" stroke-width="2.5" stroke-linejoin="round"/><path d="M116 228 C140 212 176 214 206 236 L208 288 C188 300 150 306 124 288 C108 276 104 250 116 228 Z" fill="#f5efe2" stroke="#a8977a" stroke-width="2.5" stroke-linejoin="round"/><path d="M324 228 C300 212 264 214 234 236 L232 288 C252 300 290 306 316 288 C332 276 336 250 324 228 Z" fill="#f5efe2" stroke="#a8977a" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="158" cy="262" rx="30" ry="21" fill="#ffffff" stroke="#a8977a" stroke-width="2.5" stroke-linejoin="round"/><ellipse cx="282" cy="262" rx="30" ry="21" fill="#ffffff" stroke="#a8977a" stroke-width="2.5" stroke-linejoin="round"/><rect x="206" y="232" width="28" height="58" rx="8" fill="#e5d8bd" stroke="#a8977a" stroke-width="2.5" stroke-linejoin="round"/><path d="M50 132 Q120 200 204 238" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="7 4"/><path d="M390 132 Q320 200 236 238" fill="none" stroke="#0f766e" stroke-width="3" stroke-dasharray="7 4"/><path d="M112 176 L106 330" stroke="#dc2626" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M128 184 L124 330" stroke="#2563eb" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M196 170 C184 200 168 230 150 246 C146 280 160 310 176 334" stroke="#eab308" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="80" cy="160" r="12" fill="#ffffff" stroke="#334155" stroke-width="2.5"/><text x="80" y="165" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle" data-max="0">1</text><circle cx="150" cy="196" r="12" fill="#ffffff" stroke="#334155" stroke-width="2.5"/><text x="150" y="201" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle" data-max="0">2</text><circle cx="144" cy="226" r="12" fill="#ffffff" stroke="#334155" stroke-width="2.5"/><text x="144" y="231" font-size="14" font-weight="800" fill="#0f172a" text-anchor="middle" data-max="0">3</text><circle cx="150" cy="250" r="15" fill="#ea580c" stroke="#ea580c" stroke-width="2.5"/><text x="150" y="255" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" data-max="0">4</text><text x="20" y="14" font-size="12.5" font-weight="700" fill="#0f766e" data-max="0">- - Ligamento inguinal</text><text x="250" y="14" font-size="12.5" font-weight="700" fill="#a16207" data-max="0">— Nervio obturador</text><text x="20" y="34" font-size="12.5" font-weight="700" fill="#b91c1c" data-max="0">Rojo y azul: arteria y vena femorales (lado derecho)</text></g><rect x="48.0" y="653.0" width="424.0" height="42.0" rx="6" fill="#ffffff" stroke="none" stroke-width="0"/><text x="260.0" y="674.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="410"><tspan x="260.0" dy="0">El punto 4 (agujero obturador) es el de este caso: por ahí pasa el nervio</tspan><tspan x="260.0" dy="15">obturador.</tspan></text><rect x="500.0" y="301.0" width="460.0" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="501.0" y="302.0" width="6.0" height="83.0" rx="3" fill="#94a3b8" stroke="none" stroke-width="1.5"/><text x="518.0" y="325.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">1. Inguinal indirecta</tspan></text><text x="518.0" y="346.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Sale por el anillo inguinal profundo, lateral a los vasos epigástricos.</tspan><tspan x="518.0" dy="16">Varón joven; baja hacia el escroto.</tspan></text><rect x="500.0" y="396.0" width="460.0" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="501.0" y="397.0" width="6.0" height="83.0" rx="3" fill="#94a3b8" stroke="none" stroke-width="1.5"/><text x="518.0" y="420.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">2. Inguinal directa</tspan></text><text x="518.0" y="441.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Empuja la pared posterior (triángulo de Hesselbach), medial a los epigástricos.</tspan><tspan x="518.0" dy="16">Varón mayor; se estrangula poco.</tspan></text><rect x="500.0" y="491.0" width="460.0" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="501.0" y="492.0" width="6.0" height="83.0" rx="3" fill="#94a3b8" stroke="none" stroke-width="1.5"/><text x="518.0" y="515.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">3. Femoral</tspan></text><text x="518.0" y="536.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Debajo del ligamento inguinal, medial a la vena femoral.</tspan><tspan x="518.0" dy="16">Mujer; bulto en la raíz del muslo.</tspan></text><rect x="500.0" y="586.0" width="460.0" height="85.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="501.0" y="587.0" width="6.0" height="83.0" rx="3" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="518.0" y="610.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">4. Obturatriz</tspan></text><text x="518.0" y="631.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="432"><tspan x="518.0" dy="0">Sale por el agujero obturador y comprime el nervio obturador.</tspan><tspan x="518.0" dy="16">Anciana delgada; no se ve bulto: se palpa por tacto vaginal o rectal.</tspan></text><rect x="860.2" y="575.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="905.6" y="590.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="905.6" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="715.0" width="920.0" height="92.0" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="60.0" y="741.0" font-size="13" font-weight="800" font-style="normal" fill="#92400e" text-anchor="start" data-max="700"><tspan x="60.0" dy="0">Signo de Howship-Romberg</tspan></text><text x="60.0" y="761.0" font-size="11.5" font-weight="500" font-style="normal" fill="#78350f" text-anchor="start" data-max="700"><tspan x="60.0" dy="0">Dolor o parestesias en la cara interna del muslo que empeoran al extender, abducir o rotar hacia dentro la cadera: la hernia</tspan><tspan x="60.0" dy="16">aprieta el nervio obturador.</tspan><tspan x="60.0" dy="16">Con obstrucción intestinal en una anciana delgada, este signo casi confirma la hernia obturatriz.</tspan></text><g transform="translate(750,723)"><path d="M20 4 H80 L72 74 H34 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2"/><path d="M24 14 Q30 46.0 38 72" stroke="#eab308" stroke-width="3" fill="none"/><ellipse cx="34" cy="46.0" rx="10" ry="23" fill="#ea580c" opacity="0.55"/><text x="100" y="50" font-size="11" font-weight="700" fill="#9a3412" data-max="0">dolor medial</text></g><rect x="40.0" y="831.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="859.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="881.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Hernia obturatriz = «hernia de la anciana delgada»: obstrucción intestinal + Howship-Romberg (+).</tspan><tspan x="58.0" dy="18">• No da bulto visible: se sospecha por el dolor en la cara interna del muslo y se confirma con TC.</tspan><tspan x="58.0" dy="18">• La femoral también es de mujeres, pero da un bulto bajo el ligamento inguinal y no afecta al nervio obturador.</tspan></text><text x="58.0" y="939.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Schwartz Principios de Cirugía 11.ª ed.; Sabiston Tratado de Cirugía 21.ª ed.</tspan></text></svg>