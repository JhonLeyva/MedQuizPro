<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="972" viewBox="0 0 1000 972" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La inmunoglobulina anti-D a la gestante Rh negativo no sensibilizada se aplica entre las 28 y 32 semanas"><title>La inmunoglobulina anti-D a la gestante Rh negativo no sensibilizada se aplica entre las 28 y 32 semanas</title><rect x="0.75" y="0.75" width="998.5" height="970.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · aloinmunización Rh</tspan></text><rect x="393.4" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="473.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="473.2" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Aloinmunización Rh</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La madre Rh negativo forma anticuerpos IgG anti-D contra eritrocitos fetales Rh positivos.</tspan><tspan x="58.0" dy="17">Causan anemia, hidropesía y muerte fetal.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante O Rh negativo</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pareja O Rh positivo, no sensibilizada.</tspan><tspan x="640.0" dy="16">¿Entre qué semanas recibe la inmunoglobulina anti-D?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CUÁNDO SE APLICA LA ANTI-D EN LA GESTANTE RH NEGATIVO</tspan></text><rect x="40.0" y="269.0" width="920.0" height="34.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="52.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="184"><tspan x="52.0" dy="0">PASO</tspan></text><text x="291.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="98"><tspan x="291.0" dy="0">&lt; 28 sem</tspan></text><text x="393.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="98"><tspan x="393.0" dy="0">28 a 32 sem</tspan></text><text x="495.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="98"><tspan x="495.0" dy="0">Parto (72 h)</tspan></text><text x="597.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="98"><tspan x="597.0" dy="0">Evento</tspan></text><text x="664.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="290"><tspan x="664.0" dy="0">DETALLE</tspan></text><rect x="40.0" y="309.0" width="192.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="339.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="180"><tspan x="50.0" dy="0">Coombs indirecto</tspan></text><line x1="248.0" y1="335.0" x2="640.0" y2="335.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="291.0" cy="330.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="291.0" y="357.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="98"><tspan x="291.0" dy="0">Negativo</tspan></text><circle cx="393.0" cy="330.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="393.0" y="357.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="98"><tspan x="393.0" dy="0">Antes de la dosis</tspan></text><rect x="660.0" y="309.0" width="300.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="670.0" y="339.0" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="280"><tspan x="670.0" dy="0">Confirma que no está sensibilizada.</tspan></text><rect x="40.0" y="367.0" width="192.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="389.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="180"><tspan x="50.0" dy="0">Inmunoglobulina anti-D 300</tspan><tspan x="50.0" dy="16">µg</tspan></text><line x1="248.0" y1="393.0" x2="640.0" y2="393.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="393.0" cy="388.0" r="13" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="393.0" y="392.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="393.0" dy="0">!</tspan></text><text x="393.0" y="415.0" font-size="9.5" font-weight="700" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="98"><tspan x="393.0" dy="0">Dosis</tspan></text><circle cx="495.0" cy="388.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="495.0" y="415.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="98"><tspan x="495.0" dy="0">Si RN Rh +</tspan></text><circle cx="597.0" cy="388.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="597.0" y="415.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="98"><tspan x="597.0" dy="0">Repetir</tspan></text><rect x="660.0" y="367.0" width="300.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="670.0" y="397.0" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="280"><tspan x="670.0" dy="0">Rh de la pareja irrelevante; dosis a las 28 semanas.</tspan></text><rect x="40.0" y="425.0" width="192.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="447.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="180"><tspan x="50.0" dy="0">Sensibilizada o feto Rh</tspan><tspan x="50.0" dy="16">negativo</tspan></text><line x1="248.0" y1="451.0" x2="640.0" y2="451.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="291.0" cy="446.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="291.0" y="473.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="98"><tspan x="291.0" dy="0">Omitir</tspan></text><circle cx="393.0" cy="446.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="393.0" y="473.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="98"><tspan x="393.0" dy="0">Omitir</tspan></text><rect x="660.0" y="425.0" width="300.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="670.0" y="455.0" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="280"><tspan x="670.0" dy="0">La profilaxis ya no previene o no hace falta.</tspan></text><text x="44.0" y="497.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="44.0" dy="0">! = ventana del caso · círculo vacío = momento complementario</tspan></text><rect x="40.0" y="521.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="547.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Anti-D en la gestante Rh negativo = entre 28 y 32 semanas</tspan></text><text x="60.0" y="566.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Se repite tras el parto si el recién nacido es Rh positivo.</tspan></text><text x="40.0" y="633.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="643.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="665.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="665.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Entre 34 y 38</tspan></text><text x="435.0" y="665.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Entre 22 y 26</tspan></text><rect x="513.0" y="646.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="665.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Entre 28 y 32</tspan></text><text x="735.0" y="665.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Entre 36 y 38</tspan></text><text x="885.0" y="665.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Entre 18 y 22</tspan></text><rect x="40.0" y="680.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="680.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="709.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Semanas de la anti-D?</tspan></text><text x="285.0" y="709.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: fuera del esquema</tspan></text><text x="435.0" y="709.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: fuera del esquema</tspan></text><text x="585.0" y="701.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: esquema de 28 a</tspan><tspan x="585.0" dy="16">32 semanas</tspan></text><text x="735.0" y="709.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: fuera del esquema</tspan></text><text x="885.0" y="709.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: fuera del esquema</tspan></text><rect x="40.0" y="643.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="754.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="782.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="804.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Profilaxis con 300 µg de anti-D: reduce la sensibilización de cerca de 13 % a menos de 0,3 %. Se da a las 28 semanas, dentro del intervalo de 28 a 32,</tspan><tspan x="58.0" dy="18">   sin importar el Rh de la pareja.</tspan><tspan x="58.0" dy="18">• Se repite en las 72 horas tras el parto si el recién nacido es Rh positivo y tras cualquier evento sensibilizante: aborto, ectópico, sangrado, procedimiento</tspan><tspan x="58.0" dy="18">   invasivo o trauma abdominal.</tspan><tspan x="58.0" dy="18">• Se omite si ya está sensibilizada o si el ADN fetal libre muestra un feto Rh negativo.</tspan><tspan x="58.0" dy="18">• Antes de aplicar la dosis, el Coombs indirecto debe ser negativo.</tspan></text><text x="58.0" y="916.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, Practice Bulletin 181 (2017); ACOG, Clinical Practice Update sobre inmunoglobulina Rh D tras pérdida del embarazo (Obstet Gynecol 2024); Williams</tspan><tspan x="58.0" dy="15">Obstetricia, 26.ª ed. (2022).</tspan></text></svg>