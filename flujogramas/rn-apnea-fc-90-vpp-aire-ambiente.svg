<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="797" viewBox="0 0 1000 797" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Recién nacido a término que sigue en apnea con FC 90 tras los pasos iniciales: ventilación a presión positiva con FiO₂ 21 %"><title>Recién nacido a término que sigue en apnea con FC 90 tras los pasos iniciales: ventilación a presión positiva con FiO₂ 21 %</title><rect x="0.75" y="0.75" width="998.5" height="795.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Reanimación neonatal</tspan></text><rect x="332.6" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="389.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="389.1" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="148.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ventilación a presión positiva (VPP)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Es la medida más importante de la reanimación neonatal: la mayoría responde solo con</tspan><tspan x="58.0" dy="17">ventilar.</tspan><tspan x="58.0" dy="17">Indicación: apnea, boqueo o FC &lt; 100 tras los pasos iniciales; en el a término se empieza</tspan><tspan x="58.0" dy="17">con aire (21 %).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="148.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="146.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Recién nacido a término</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">No llora, no respira, hipotónico.</tspan><tspan x="640.0" dy="16">Tras los pasos iniciales: apnea y FC 90.</tspan></text><rect x="640.0" y="209.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="222.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="222.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="270.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">REANIMACIÓN NEONATAL PASO A PASO</tspan></text><rect x="42.0" y="292.0" width="226.0" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="155.0" y="317.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="155.0" dy="0">30 SEGUNDOS</tspan></text><text x="155.0" y="336.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="155.0" dy="0">Al nacer</tspan></text><rect x="272.0" y="292.0" width="226.0" height="56.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="385.0" y="317.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="210"><tspan x="385.0" dy="0">MINUTO DE ORO</tspan></text><text x="385.0" y="336.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="385.0" dy="0">Apnea o FC &lt; 100</tspan></text><rect x="502.0" y="292.0" width="226.0" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="317.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="615.0" dy="0">TRAS 30 S DE VPP</tspan></text><text x="615.0" y="336.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="615.0" dy="0">FC &lt; 60</tspan></text><rect x="732.0" y="292.0" width="226.0" height="56.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="845.0" y="317.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="845.0" dy="0">SI SIGUE &lt; 60</tspan></text><text x="845.0" y="336.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="845.0" dy="0">Pese a todo</tspan></text><rect x="339.6" y="281.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="385.0" y="296.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="385.0" dy="0">◆ ESTE CASO</tspan></text><rect x="48.0" y="362.0" width="214.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="155.0" y="390.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="155.0" dy="0">PASOS INICIALES</tspan></text><text x="155.0" y="414.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="155.0" dy="0">Calentar, secar, estimular</tspan><tspan x="155.0" dy="17">Vía aérea</tspan></text><rect x="278.0" y="362.0" width="214.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="385.0" y="390.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="186"><tspan x="385.0" dy="0">VPP CON AIRE 21 %</tspan></text><text x="385.0" y="414.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="186"><tspan x="385.0" dy="0">Este caso</tspan><tspan x="385.0" dy="17">Oxímetro</tspan></text><rect x="508.0" y="362.0" width="214.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="615.0" y="399.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="615.0" dy="0">COMPRESIONES 3:1</tspan></text><text x="615.0" y="423.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="615.0" dy="0">Intubar, O₂ 100 %</tspan></text><rect x="738.0" y="362.0" width="214.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="845.0" y="399.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="845.0" dy="0">ADRENALINA</tspan></text><text x="845.0" y="423.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="845.0" dy="0">EV por vena umbilical</tspan></text><text x="40.0" y="493.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="503.2" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="542.7" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="534.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Administración de</tspan><tspan x="285.0" dy="17">oxígeno a flujo libre</tspan></text><rect x="363.0" y="506.2" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="525.7" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Ventilación a</tspan><tspan x="435.0" dy="17">presión positiva</tspan><tspan x="435.0" dy="17">con FiO2 21%</tspan></text><text x="585.0" y="525.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Estimulación táctil</tspan><tspan x="585.0" dy="17">enérgica en el</tspan><tspan x="585.0" dy="17">dorso</tspan></text><text x="735.0" y="525.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ventilación con</tspan><tspan x="735.0" dy="17">bolsa y máscara</tspan><tspan x="735.0" dy="17">FiO2 100%</tspan></text><text x="885.0" y="534.2" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Masaje cardiaco</tspan><tspan x="885.0" dy="17">inmediato</tspan></text><rect x="40.0" y="574.2" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="574.2" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="603.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Siguiente paso?</tspan></text><text x="285.0" y="595.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no respira, hay que</tspan><tspan x="285.0" dy="16">ventilar</tspan></text><text x="435.0" y="603.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: VPP con aire</tspan></text><text x="585.0" y="595.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Ya se hizo; no retrasar</tspan><tspan x="585.0" dy="16">la VPP</tspan></text><text x="735.0" y="595.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">En el a término se</tspan><tspan x="735.0" dy="16">inicia con 21 %</tspan></text><text x="885.0" y="595.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Solo si FC &lt; 60 tras 30</tspan><tspan x="885.0" dy="16">s de VPP</tspan></text><rect x="40.0" y="503.2" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="648.2" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="676.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="698.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• VPP 40-60 respiraciones/min dentro del primer minuto («minuto de oro»); oxímetro en la mano derecha.</tspan><tspan x="58.0" dy="18">• Si la FC no sube: corregir la ventilación (MR SOPA).</tspan><tspan x="58.0" dy="18">• FC &lt; 60 tras 30 s de VPP eficaz: intubar, compresiones 3:1 y O₂ 100 %.</tspan></text><text x="58.0" y="756.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAP/AHA/ILCOR, guías de reanimación 2025, reanimación neonatal (NRP 2025).</tspan></text></svg>