<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1217" viewBox="0 0 1000 1217" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Pérdida de orina precedida por un deseo miccional imperioso, sin nicturia ni mal vaciamiento: incontinencia de urgencia"><title>Pérdida de orina precedida por un deseo miccional imperioso, sin nicturia ni mal vaciamiento: incontinencia de urgencia</title><rect x="0.75" y="0.75" width="998.5" height="1216.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Uroginecología · incontinencia urinaria</tspan></text><rect x="430.3" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="510.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="510.1" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Incontinencia urinaria</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cualquier pérdida involuntaria de orina; se clasifica por su mecanismo.</tspan><tspan x="58.0" dy="17">La de urgencia se debe a hiperactividad del detrusor.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 49 años, obesa</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">G1P1001, perimenopáusica, con pérdida de orina</tspan><tspan x="640.0" dy="16">precedida por urgencia.</tspan><tspan x="640.0" dy="16">Niega nicturia o dificultad para vaciar; examen</tspan><tspan x="640.0" dy="16">ginecológico normal.</tspan></text><line x1="640.0" y1="237.0" x2="670.0" y2="237.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#94a3b8"/><line x1="500.0" y1="381.0" x2="500.0" y2="411.0" stroke="#94a3b8" stroke-width="2"/><line x1="149.8" y1="411.0" x2="850.2" y2="411.0" stroke="#94a3b8" stroke-width="2"/><line x1="149.8" y1="411.0" x2="149.8" y2="440.0" stroke="#94a3b8" stroke-width="2"/><polygon points="144.8,439.0 154.8,439.0 149.8,447.0" fill="#94a3b8"/><line x1="383.2" y1="411.0" x2="383.2" y2="440.0" stroke="#94a3b8" stroke-width="2"/><polygon points="378.2,439.0 388.2,439.0 383.2,447.0" fill="#94a3b8"/><line x1="616.8" y1="411.0" x2="616.8" y2="440.0" stroke="#94a3b8" stroke-width="2"/><polygon points="611.8,439.0 621.8,439.0 616.8,447.0" fill="#94a3b8"/><line x1="850.2" y1="411.0" x2="850.2" y2="440.0" stroke="#94a3b8" stroke-width="2"/><polygon points="845.2,439.0 855.2,439.0 850.2,447.0" fill="#94a3b8"/><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#0f766e"/><line x1="500.0" y1="381.0" x2="500.0" y2="411.0" stroke="#0f766e" stroke-width="3"/><line x1="383.2" y1="411.0" x2="500.0" y2="411.0" stroke="#0f766e" stroke-width="3"/><line x1="383.2" y1="411.0" x2="383.2" y2="440.0" stroke="#0f766e" stroke-width="3"/><polygon points="378.2,439.0 388.2,439.0 383.2,447.0" fill="#0f766e"/><rect x="27.4" y="420.0" width="244.7" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="149.8" y="432.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="149.8" dy="0">Con esfuerzo (toser, reír, cargar) sin urgencia</tspan></text><rect x="260.6" y="420.0" width="245.3" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="383.2" y="432.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="383.2" dy="0">Precedida por urgencia imperiosa (este caso)</tspan></text><rect x="541.4" y="420.0" width="150.7" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="616.8" y="432.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="616.8" dy="0">Esfuerzo y urgencia juntos</tspan></text><rect x="754.4" y="420.0" width="191.8" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="850.2" y="432.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="850.2" dy="0">Goteo con vaciamiento incompleto</tspan></text><polygon points="240.0,352.0 266.0,323.0 734.0,323.0 760.0,352.0 734.0,381.0 266.0,381.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="352.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="357.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="356.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Mujer con pérdida involuntaria de orina</tspan></text><rect x="40.0" y="447.0" width="219.5" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="149.8" y="475.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="192"><tspan x="149.8" dy="0">DE ESFUERZO</tspan></text><text x="149.8" y="498.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="192"><tspan x="149.8" dy="0">Hipermovilidad uretral o esfínter</tspan><tspan x="149.8" dy="17">deficiente</tspan></text><rect x="273.5" y="447.0" width="219.5" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="383.2" y="475.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="192"><tspan x="383.2" dy="0">DE URGENCIA</tspan></text><text x="383.2" y="498.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="192"><tspan x="383.2" dy="0">Hiperactividad del detrusor</tspan><tspan x="383.2" dy="17">Sin nicturia ni mal vaciamiento</tspan></text><rect x="507.0" y="447.0" width="219.5" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="616.8" y="483.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="192"><tspan x="616.8" dy="0">MIXTA</tspan></text><text x="616.8" y="506.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="192"><tspan x="616.8" dy="0">Ambos componentes</tspan></text><rect x="740.5" y="447.0" width="219.5" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="850.2" y="483.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="192"><tspan x="850.2" dy="0">REBOSAMIENTO</tspan></text><text x="850.2" y="506.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="192"><tspan x="850.2" dy="0">Vejiga hipocontráctil u obstruida</tspan></text><text x="40.0" y="571.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TIPOS DE INCONTINENCIA URINARIA DE LA MUJER</tspan></text><rect x="40.0" y="583.5" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="602.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Tipo</tspan></text><text x="250.0" y="602.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Cuándo se pierde la orina</tspan></text><text x="610.0" y="602.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Mecanismo</tspan></text><rect x="40.0" y="612.5" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="631.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">De esfuerzo</tspan></text><text x="250.0" y="631.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Al toser, reír o cargar peso</tspan></text><text x="610.0" y="631.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Hipermovilidad uretral o deficiencia del esfínter</tspan></text><rect x="40.0" y="641.5" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="660.5" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">De urgencia</tspan></text><text x="250.0" y="660.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Tras un deseo imperioso e inaplazable</tspan></text><text x="610.0" y="660.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Hiperactividad del detrusor</tspan></text><rect x="140.6" y="645.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="186.0" y="660.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="186.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="670.5" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="689.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Mixta</tspan></text><text x="250.0" y="689.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Con esfuerzo y con urgencia</tspan></text><text x="610.0" y="689.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Ambos mecanismos</tspan></text><rect x="40.0" y="699.5" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="718.5" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Por rebosamiento</tspan></text><text x="250.0" y="718.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Goteo continuo con vaciamiento incompleto</tspan></text><text x="610.0" y="718.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Vejiga hipocontráctil u obstruida</tspan></text><text x="40.0" y="744.5" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Clave del banco: E. La opción D (vejiga hiperactiva) es un síndrome cercano, pero faltan nicturia y frecuencia.</tspan></text><text x="40.0" y="791.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="801.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="841.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="832.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Incontinencia</tspan><tspan x="285.0" dy="17">urinaria de esfuerzo</tspan></text><text x="435.0" y="824.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Incontinencia</tspan><tspan x="435.0" dy="17">urinaria por</tspan><tspan x="435.0" dy="17">rebosamiento</tspan></text><text x="585.0" y="832.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Incontinencia</tspan><tspan x="585.0" dy="17">urinaria mixta</tspan></text><text x="735.0" y="832.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Síndrome de vejiga</tspan><tspan x="735.0" dy="17">hiperactiva</tspan></text><rect x="813.0" y="804.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="832.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Incontinencia</tspan><tspan x="885.0" dy="17">urinaria de urgencia</tspan></text><rect x="40.0" y="872.5" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="872.5" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="909.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico más</tspan><tspan x="54.0" dy="16">probable?</tspan></text><text x="285.0" y="901.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: ocurre con toser o</tspan><tspan x="285.0" dy="16">cargar peso, sin</tspan><tspan x="285.0" dy="16">urgencia previa</tspan></text><text x="435.0" y="893.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: goteo con</tspan><tspan x="435.0" dy="16">vaciamiento</tspan><tspan x="435.0" dy="16">incompleto, que ella</tspan><tspan x="435.0" dy="16">niega</tspan></text><text x="585.0" y="901.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: combinaría</tspan><tspan x="585.0" dy="16">esfuerzo y urgencia;</tspan><tspan x="585.0" dy="16">aquí solo hay urgencia</tspan></text><text x="735.0" y="901.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: síndrome cercano,</tspan><tspan x="735.0" dy="16">pero lleva frecuencia y</tspan><tspan x="735.0" dy="16">nicturia</tspan></text><text x="885.0" y="893.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: fuga con urgencia</tspan><tspan x="885.0" dy="16">imperiosa por</tspan><tspan x="885.0" dy="16">hiperactividad del</tspan><tspan x="885.0" dy="16">detrusor</tspan></text><rect x="40.0" y="801.5" width="920.0" height="153.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="978.5" width="920.0" height="221.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1006.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1028.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Urgencia: fuga precedida o acompañada de un deseo imperioso. Esfuerzo: al toser, reír o cargar peso, sin urgencia. Mixta: ambos. Rebosamiento: goteo</tspan><tspan x="58.0" dy="18">   con vaciamiento incompleto.</tspan><tspan x="58.0" dy="18">• El síndrome de vejiga hiperactiva es urgencia con o sin incontinencia, habitualmente con frecuencia y nicturia; aquí, sin nicturia y con la pérdida como</tspan><tspan x="58.0" dy="18">   queja, la descripción precisa es la incontinencia de urgencia.</tspan><tspan x="58.0" dy="18">• Evaluación: historia, diario miccional, examen pélvico y uroanálisis para descartar infección. Primer tratamiento conductual: bajar de peso, entrenamiento</tspan><tspan x="58.0" dy="18">   vesical y piso pélvico.</tspan><tspan x="58.0" dy="18">• Luego anticolinérgicos o agonistas beta-3; si fallan, toxina botulínica o neuromodulación. Los anticolinérgicos se asocian a deterioro cognitivo en</tspan><tspan x="58.0" dy="18">   ancianas.</tspan></text><text x="58.0" y="1176.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, Practice Bulletin 155, Urinary incontinence in women. Obstet Gynecol 2015;126:e66-81; Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>