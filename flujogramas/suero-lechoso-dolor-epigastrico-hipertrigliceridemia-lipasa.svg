dieta, control de la diabetes.</tspan><tspan x="58.0" dy="18">• Buscar diabetes descompensada, alcohol, fármacos.</tspan></text><text x="58.0" y="734.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACG – Management of acute pancreatitis (2024) · Endocrine Society – Hypertriglyceridemia guideline (2012)</tspan></text></svg>