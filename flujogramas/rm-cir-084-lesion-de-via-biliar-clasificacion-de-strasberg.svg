<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="998" viewBox="0 0 1000 998" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La sección total del colédoco reconocida en la cirugía se repara con hepaticoyeyunostomía en Y de Roux"><title>La sección total del colédoco reconocida en la cirugía se repara con hepaticoyeyunostomía en Y de Roux</title><rect x="0.75" y="0.75" width="998.5" height="996.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Lesión de vía biliar · clasificación de Strasberg</tspan></text><rect x="476.2" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="519.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="519.4" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Lesión de la vía biliar</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ocurre en 0,3-0,5 % de las colecistectomías laparoscópicas.</tspan><tspan x="58.0" dy="17">Se previene con la visión crítica de seguridad.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 40 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Colecistectomía laparoscópica por colelitiasis.</tspan><tspan x="640.0" dy="16">Bilis en el campo: sección total del colédoco de 8 mm;</tspan><tspan x="640.0" dy="16">se convierte la cirugía.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ LESIÓN ES Y QUÉ SE HACE (STRASBERG)</tspan></text><rect x="40.0" y="285.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="307.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="150"><tspan x="54.0" dy="0">TIPO</tspan></text><text x="397.5" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="355"><tspan x="397.5" dy="0">Qué se lesiona</tspan></text><text x="772.5" y="307.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="355"><tspan x="772.5" dy="0">Conducta</tspan></text><rect x="40.0" y="325.0" width="164.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="351.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="142"><tspan x="54.0" dy="0">Tipo A</tspan></text><text x="54.0" y="368.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="142"><tspan x="54.0" dy="0">Fuga del cístico o Luschka</tspan></text><rect x="213.0" y="325.0" width="369.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="225.0" y="350.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="351"><tspan x="225.0" dy="0">Conducto cístico o de Luschka</tspan></text><text x="225.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="351"><tspan x="225.0" dy="0">Sin lesión del árbol principal</tspan></text><rect x="588.0" y="325.0" width="369.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="600.0" y="350.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="351"><tspan x="600.0" dy="0">CPRE con stent</tspan></text><text x="600.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="351"><tspan x="600.0" dy="0">Drenaje percutáneo si hay colección</tspan></text><rect x="40.0" y="388.0" width="164.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="414.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="142"><tspan x="54.0" dy="0">Tipos B y C</tspan></text><text x="54.0" y="431.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="142"><tspan x="54.0" dy="0">Conducto sectorial derecho</tspan></text><rect x="213.0" y="388.0" width="369.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="225.0" y="413.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="351"><tspan x="225.0" dy="0">Conducto aberrante</tspan></text><text x="225.0" y="429.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="351"><tspan x="225.0" dy="0">B ocluido, C seccionado con fuga</tspan></text><rect x="588.0" y="388.0" width="369.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="600.0" y="413.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="351"><tspan x="600.0" dy="0">Hepaticoyeyunostomía</tspan></text><text x="600.0" y="429.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="351"><tspan x="600.0" dy="0">B puede observarse si no hay síntomas</tspan></text><rect x="40.0" y="451.0" width="164.0" height="57.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="477.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="142"><tspan x="54.0" dy="0">Tipo D</tspan></text><text x="54.0" y="494.0" font-size="10.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="142"><tspan x="54.0" dy="0">Lesión lateral</tspan></text><rect x="213.0" y="451.0" width="369.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="225.0" y="476.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="351"><tspan x="225.0" dy="0">Pared lateral, sin sección total</tspan></text><text x="225.0" y="492.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="351"><tspan x="225.0" dy="0">Menos de la mitad de la luz</tspan></text><rect x="588.0" y="451.0" width="369.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="600.0" y="476.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="351"><tspan x="600.0" dy="0">Sutura con tubo en T o stent</tspan></text><text x="600.0" y="492.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="351"><tspan x="600.0" dy="0">Más de la mitad: Y de Roux</tspan></text><rect x="40.0" y="514.0" width="164.0" height="57.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="540.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="142"><tspan x="54.0" dy="0">Tipo E</tspan></text><text x="54.0" y="557.0" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="142"><tspan x="54.0" dy="0">Colédoco o hepático común</tspan></text><rect x="213.0" y="514.0" width="369.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="225.0" y="539.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="351"><tspan x="225.0" dy="0">Sección completa (este caso)</tspan></text><text x="225.0" y="555.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="351"><tspan x="225.0" dy="0">Conducto de 8 mm sin tejido perdido</tspan></text><rect x="588.0" y="514.0" width="369.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="600.0" y="539.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="351"><tspan x="600.0" dy="0">Hepaticoyeyunostomía en Y de Roux</tspan></text><text x="600.0" y="555.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="351"><tspan x="600.0" dy="0">Término-lateral, mucosa a mucosa</tspan></text><rect x="856.2" y="503.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="901.6" y="518.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="901.6" dy="0">◆ ESTE CASO</tspan></text><text x="44.0" y="593.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Si la reconstrucción no es posible en el momento: drenar y derivar a un centro hepatobiliar.</tspan></text><text x="40.0" y="641.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="651.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="682.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="654.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="673.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Y de Roux</tspan><tspan x="285.0" dy="17">término-lateral</tspan></text><text x="435.0" y="673.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Colédoco a</tspan><tspan x="435.0" dy="17">duodeno T-L</tspan></text><text x="585.0" y="673.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Colédoco a</tspan><tspan x="585.0" dy="17">duodeno L-L</tspan></text><text x="735.0" y="673.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Reparación con</tspan><tspan x="735.0" dy="17">dren de Kehr</tspan></text><text x="885.0" y="673.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Colédoco a</tspan><tspan x="885.0" dy="17">estómago</tspan></text><rect x="40.0" y="705.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="705.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="742.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Reparación?</tspan></text><text x="285.0" y="726.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: Y de Roux</tspan><tspan x="285.0" dy="16">término-lateral, sin</tspan><tspan x="285.0" dy="16">tensión</tspan></text><text x="435.0" y="734.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: la vía biliar no se</tspan><tspan x="435.0" dy="16">une al duodeno</tspan></text><text x="585.0" y="734.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: tampoco se une al</tspan><tspan x="585.0" dy="16">duodeno</tspan></text><text x="735.0" y="734.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no corrige una</tspan><tspan x="735.0" dy="16">sección total</tspan></text><text x="885.0" y="734.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: el estómago no es</tspan><tspan x="885.0" dy="16">receptor biliar</tspan></text><rect x="40.0" y="651.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="795.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="823.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="845.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Strasberg: A fuga del cístico o de Luschka · B oclusión de un conducto sectorial derecho · C sección con fuga de ese conducto · D lesión lateral · E lesión</tspan><tspan x="58.0" dy="18">   circunferencial del hepático común o colédoco.</tspan><tspan x="58.0" dy="18">• Tipo E (sección total): hepaticoyeyunostomía en Y de Roux término-lateral, mucosa con mucosa, sin tensión, por cirujano hepatobiliar y con</tspan><tspan x="58.0" dy="18">   colangiografía; no la anastomosis a duodeno.</tspan><tspan x="58.0" dy="18">• Prevención: visión crítica de seguridad (solo dos estructuras entran a la vesícula), colangiografía o fluorescencia con verde de indocianina, y</tspan><tspan x="58.0" dy="18">   colecistectomía subtotal si hay duda.</tspan></text><text x="58.0" y="957.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Strasberg et al., J Am Coll Surg (1995); SAGES, colecistectomía segura (Brunt et al., Surg Endosc 2020); Tokyo Guidelines 2018</tspan></text></svg>