<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1139" viewBox="0 0 1000 1139" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En el ejercicio el espacio muerto fisiológico disminuye y mejora la eficacia del intercambio gaseoso"><title>En el ejercicio el espacio muerto fisiológico disminuye y mejora la eficacia del intercambio gaseoso</title><rect x="0.75" y="0.75" width="998.5" height="1137.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Fisiología respiratoria · espacio muerto</tspan></text><rect x="432.4" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="504.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="504.4" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Espacio muerto fisiológico</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Suma del espacio muerto anatómico (cerca de 150 mL) y el alveolar.</tspan><tspan x="58.0" dy="17">El alveolar son alvéolos ventilados pero poco perfundidos.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Durante el ejercicio, la eficacia del intercambio gaseoso</tspan><tspan x="640.0" dy="16">aumenta por disminución del...</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ CAMBIA EN EL ESPACIO MUERTO DEL REPOSO AL EJERCICIO</tspan></text><rect x="40.0" y="269.0" width="385.0" height="154.0" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="232.5" y="295.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="365"><tspan x="232.5" dy="0">REPOSO</tspan></text><text x="56.0" y="325.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">VD/VT</tspan></text><text x="409.0" y="325.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">0,2 a 0,35</tspan></text><line x1="52.0" y1="333.0" x2="413.0" y2="333.0" stroke="#ffffff" stroke-width="1.4"/><text x="56.0" y="351.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Perfusión de los vértices</tspan></text><text x="409.0" y="351.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">Escasa</tspan></text><line x1="52.0" y1="359.0" x2="413.0" y2="359.0" stroke="#ffffff" stroke-width="1.4"/><text x="56.0" y="377.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Espacio muerto alveolar</tspan></text><text x="409.0" y="377.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">Mayor</tspan></text><line x1="52.0" y1="385.0" x2="413.0" y2="385.0" stroke="#ffffff" stroke-width="1.4"/><text x="56.0" y="403.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Espacio muerto anatómico</tspan></text><text x="409.0" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">≈ 150 mL</tspan></text><line x1="52.0" y1="411.0" x2="413.0" y2="411.0" stroke="#ffffff" stroke-width="1.4"/><rect x="575.0" y="269.0" width="385.0" height="154.0" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="767.5" y="295.0" font-size="13" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="365"><tspan x="767.5" dy="0">EJERCICIO</tspan></text><text x="591.0" y="325.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">VD/VT</tspan></text><text x="944.0" y="325.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">0,1 a 0,2</tspan></text><line x1="587.0" y1="333.0" x2="948.0" y2="333.0" stroke="#ffffff" stroke-width="1.4"/><text x="591.0" y="351.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Perfusión de los vértices</tspan></text><text x="944.0" y="351.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">Reclutada</tspan></text><line x1="587.0" y1="359.0" x2="948.0" y2="359.0" stroke="#ffffff" stroke-width="1.4"/><text x="591.0" y="377.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Espacio muerto alveolar</tspan></text><text x="944.0" y="377.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">Menor</tspan></text><line x1="587.0" y1="385.0" x2="948.0" y2="385.0" stroke="#ffffff" stroke-width="1.4"/><text x="591.0" y="403.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Espacio muerto anatómico</tspan></text><text x="944.0" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">≈ 150 mL</tspan></text><line x1="587.0" y1="411.0" x2="948.0" y2="411.0" stroke="#ffffff" stroke-width="1.4"/><rect x="434.0" y="302.0" width="132.0" height="88.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="328.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="118"><tspan x="500.0" dy="0">Mayor gasto</tspan><tspan x="500.0" dy="16">cardiaco y volumen</tspan><tspan x="500.0" dy="16">corriente</tspan></text><line x1="429.0" y1="410.0" x2="562.0" y2="410.0" stroke="#0f766e" stroke-width="3"/><polygon points="562.0,415.0 562.0,405.0 571.0,410.0" fill="#0f766e"/><rect x="40.0" y="439.0" width="300.0" height="33.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="56.0" y="460.5" font-size="14" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="56.0" dy="0">▲</tspan></text><text x="72.0" y="457.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="260"><tspan x="72.0" dy="0">El espacio muerto fisiológico disminuye</tspan></text><rect x="350.0" y="439.0" width="300.0" height="33.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="366.0" y="460.5" font-size="14" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="366.0" dy="0">▲</tspan></text><text x="382.0" y="457.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="260"><tspan x="382.0" dy="0">Se perfunden zonas antes mal perfundidas</tspan></text><rect x="660.0" y="439.0" width="300.0" height="33.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="676.0" y="460.5" font-size="14" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="676.0" dy="0">=</tspan></text><text x="692.0" y="457.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="260"><tspan x="692.0" dy="0">El espacio muerto anatómico no cambia</tspan></text><rect x="40.0" y="490.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="516.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Ejercicio = menos espacio muerto fisiológico</tspan></text><text x="60.0" y="535.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El anatómico no varía; el tránsito se acorta, pero la difusión sigue completa.</tspan></text><text x="40.0" y="596.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">COMPONENTES DEL ESPACIO MUERTO</tspan></text><rect x="40.0" y="608.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="627.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Componente</tspan></text><text x="250.0" y="627.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Qué es</tspan></text><text x="610.0" y="627.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">En el ejercicio</tspan></text><rect x="40.0" y="637.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="656.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Anatómico</tspan></text><text x="250.0" y="656.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Vía aérea de conducción (cerca de 150 mL)</tspan></text><text x="610.0" y="656.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Sin cambio</tspan></text><rect x="40.0" y="666.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="685.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Alveolar</tspan></text><text x="250.0" y="685.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Alvéolos ventilados pero poco perfundidos</tspan></text><text x="610.0" y="685.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Disminuye por la mayor perfusión</tspan></text><rect x="40.0" y="695.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="714.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Fisiológico</tspan></text><text x="250.0" y="714.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Anatómico más alveolar; se expresa como VD/VT</tspan></text><text x="610.0" y="714.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Disminuye: VD/VT de 0,1 a 0,2</tspan></text><rect x="140.6" y="698.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="186.0" y="713.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="186.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="764.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="774.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="805.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="796.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Tiempo de difusión</tspan><tspan x="285.0" dy="17">gaseosa</tspan></text><rect x="363.0" y="777.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="796.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Espacio muerto</tspan><tspan x="435.0" dy="17">fisiológico</tspan></text><text x="585.0" y="796.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Tiempo de tránsito</tspan><tspan x="585.0" dy="17">de la sangre</tspan></text><text x="735.0" y="796.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Espacio muerto</tspan><tspan x="735.0" dy="17">anatómico</tspan></text><text x="885.0" y="796.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Cortocircuito</tspan><tspan x="885.0" dy="17">fisiológico</tspan></text><rect x="40.0" y="828.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="828.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="865.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué disminuye?</tspan></text><text x="285.0" y="857.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: la difusión sigue</tspan><tspan x="285.0" dy="16">siendo completa</tspan></text><text x="435.0" y="857.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: mejor perfusión de</tspan><tspan x="435.0" dy="16">los vértices</tspan></text><text x="585.0" y="849.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: el tránsito se</tspan><tspan x="585.0" dy="16">acorta, pero no explica</tspan><tspan x="585.0" dy="16">la mejoría</tspan></text><text x="735.0" y="857.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no varía con el</tspan><tspan x="735.0" dy="16">ejercicio</tspan></text><text x="885.0" y="857.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no explica la</tspan><tspan x="885.0" dy="16">mejoría</tspan></text><rect x="40.0" y="774.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="918.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="946.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="968.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• VD/VT es de 0,2 a 0,35 en reposo y baja a 0,1 a 0,2 en el ejercicio: se desperdicia menos aire en cada respiración.</tspan><tspan x="58.0" dy="18">• El gasto cardiaco aumenta y se reclutan los capilares de los vértices: se perfunden zonas antes ventiladas y poco perfundidas, y baja el espacio muerto</tspan><tspan x="58.0" dy="18">   alveolar.</tspan><tspan x="58.0" dy="18">• El espacio muerto anatómico no varía (o aumenta algo con la inspiración profunda). El tiempo de tránsito del glóbulo rojo se acorta, pero la difusión sigue</tspan><tspan x="58.0" dy="18">   siendo completa.</tspan><tspan x="58.0" dy="18">• Alerta: el espacio muerto sube en la embolia pulmonar, el enfisema y la presión positiva excesiva; con baja probabilidad, dímero D bajo y VD/VT normal</tspan><tspan x="58.0" dy="18">   ayudan a descartar la embolia.</tspan></text><text x="58.0" y="1098.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Guyton y Hall Tratado de Fisiología Médica, 14.ª ed. (2021); West, Fisiología respiratoria, 11.ª ed. (2021).</tspan></text></svg>