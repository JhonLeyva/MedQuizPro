<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1048" viewBox="0 0 1000 1048" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Tumor que sobrepasa el cuello y llega a la vagina sin su tercio inferior ni parametrios: estadio IIA"><title>Tumor que sobrepasa el cuello y llega a la vagina sin su tercio inferior ni parametrios: estadio IIA</title><rect x="0.75" y="0.75" width="998.5" height="1046.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ginecología oncológica · estadificación FIGO</tspan></text><rect x="467.3" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="547.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="547.0" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Estadificación FIGO</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Describe la extensión local del carcinoma de cuello uterino.</tspan><tspan x="58.0" dy="17">Versión 2018 con subdivisiones y ganglios en el estadio III.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de estadio</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Tumor fuera del cuello, sin pared pélvica, en vagina sin</tspan><tspan x="640.0" dy="16">su tercio inferior y sin parametrios.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ESTADIOS DE LA FIGO DEL CÁNCER DE CUELLO UTERINO</tspan></text><rect x="40.0" y="281.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="307.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Vagina sin el tercio inferior y sin parametrios = IIA</tspan></text><text x="60.0" y="326.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Con invasión de parametrios sería IIB; con tercio inferior de la vagina, IIIA.</tspan></text><text x="40.0" y="387.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ESTADIFICACIÓN FIGO 2018 DEL CÁNCER DE CUELLO UTERINO</tspan></text><rect x="40.0" y="399.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="418.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Estadio</tspan></text><text x="220.0" y="418.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="734"><tspan x="220.0" dy="0">Extensión del tumor</tspan></text><rect x="40.0" y="428.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="447.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">IA</tspan></text><text x="220.0" y="447.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="734"><tspan x="220.0" dy="0">Invasión microscópica de hasta 5 mm</tspan></text><rect x="40.0" y="457.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="476.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">IB</tspan></text><text x="220.0" y="476.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="734"><tspan x="220.0" dy="0">Limitado al cuello, con invasión mayor de 5 mm</tspan></text><rect x="40.0" y="486.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="505.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">IIA</tspan></text><text x="220.0" y="505.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="734"><tspan x="220.0" dy="0">Dos tercios superiores de la vagina, sin parametrios (IIA1 menor de 4 cm; IIA2 de 4 cm o más)</tspan></text><rect x="110.6" y="489.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="156.0" y="504.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="156.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="515.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="534.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">IIB</tspan></text><text x="220.0" y="534.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="734"><tspan x="220.0" dy="0">Invasión de los parametrios sin llegar a la pared pélvica</tspan></text><rect x="40.0" y="544.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="563.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">IIIA</tspan></text><text x="220.0" y="563.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="734"><tspan x="220.0" dy="0">Tercio inferior de la vagina</tspan></text><rect x="40.0" y="573.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="592.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">IIIB</tspan></text><text x="220.0" y="592.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="734"><tspan x="220.0" dy="0">Pared pélvica, hidronefrosis o riñón no funcionante</tspan></text><rect x="40.0" y="602.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="621.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">IIIC</tspan></text><text x="220.0" y="621.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="734"><tspan x="220.0" dy="0">Ganglios pélvicos (C1) o paraaórticos (C2)</tspan></text><rect x="40.0" y="631.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="650.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">IVA</tspan></text><text x="220.0" y="650.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="734"><tspan x="220.0" dy="0">Mucosa de la vejiga o del recto</tspan></text><rect x="40.0" y="660.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="679.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">IVB</tspan></text><text x="220.0" y="679.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="734"><tspan x="220.0" dy="0">Metástasis a distancia</tspan></text><text x="40.0" y="729.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="739.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="761.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="761.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">IIb</tspan></text><text x="435.0" y="761.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">IIIa</tspan></text><text x="585.0" y="761.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">IIIb</tspan></text><text x="735.0" y="761.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ib</tspan></text><rect x="813.0" y="742.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="761.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">IIa</tspan></text><rect x="40.0" y="776.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="776.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="813.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Estadio?</tspan></text><text x="285.0" y="805.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: exige invasión de</tspan><tspan x="285.0" dy="16">los parametrios</tspan></text><text x="435.0" y="805.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: llega al tercio</tspan><tspan x="435.0" dy="16">inferior de la vagina</tspan></text><text x="585.0" y="797.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: llega a la pared</tspan><tspan x="585.0" dy="16">pélvica o hay</tspan><tspan x="585.0" dy="16">hidronefrosis</tspan></text><text x="735.0" y="805.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: está limitado al</tspan><tspan x="735.0" dy="16">cuello</tspan></text><text x="885.0" y="797.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: vagina sin su tercio</tspan><tspan x="885.0" dy="16">inferior y sin</tspan><tspan x="885.0" dy="16">parametrios</tspan></text><rect x="40.0" y="739.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="866.0" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="894.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="916.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Estadio II: sobrepasa el cuello sin llegar a la pared pélvica ni al tercio inferior de la vagina; IIA es sin parametrios y IIB con invasión parametrial.</tspan><tspan x="58.0" dy="18">• FIGO 2018: IIA1 menor de 4 cm e IIA2 de 4 cm o más; el estadio III incluye ganglios pélvicos (IIIC1) o paraaórticos (IIIC2).</tspan><tspan x="58.0" dy="18">• Tratamiento orientativo: hasta IIA1 cirugía o radioterapia; de IB3 a IVA quimiorradioterapia con cisplatino.</tspan><tspan x="58.0" dy="18">• La clave sigue la clasificación clásica; con la FIGO 2018 el caso se subdivide según el tamaño.</tspan></text><text x="58.0" y="992.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Bhatla N et al., Estadificación FIGO 2018 del cáncer de cuello uterino (Int J Gynaecol Obstet 2018); Directiva 165-2025 (cáncer de cuello uterino); Williams Obstetricia</tspan><tspan x="58.0" dy="15">26.ª ed. (2022).</tspan></text></svg>