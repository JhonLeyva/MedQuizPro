<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1135" viewBox="0 0 1000 1135" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Crisis asmática refractaria con ausencia localizada de murmullo vesicular: atelectasia por tapón de moco"><title>Crisis asmática refractaria con ausencia localizada de murmullo vesicular: atelectasia por tapón de moco</title><rect x="0.75" y="0.75" width="998.5" height="1133.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · complicaciones de la crisis asmática</tspan></text><rect x="480.3" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="529.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="529.4" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Crisis asmática grave</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Broncoespasmo, edema de mucosa e hipersecreción de moco espeso.</tspan><tspan x="58.0" dy="17">Los tapones obstruyen bronquios y el aire distal se reabsorbe.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño en emergencia</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Tres horas de terapia y persiste la dificultad</tspan><tspan x="640.0" dy="16">respiratoria.</tspan><tspan x="640.0" dy="16">Sibilancias escasas y ausencia de murmullo en el</tspan><tspan x="640.0" dy="16">tercio medio derecho.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL TAPÓN DE MOCO A LA ATELECTASIA</tspan></text><text x="40.0" y="313.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="430"><tspan x="40.0" dy="0">QUÉ OCURRE</tspan></text><text x="516.0" y="313.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="444"><tspan x="516.0" dy="0">CONSECUENCIA</tspan></text><rect x="40.0" y="323.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="352.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="357.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><text x="84.0" y="349.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Broncoespasmo y moco espeso</tspan></text><text x="84.0" y="366.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Edema de mucosa e hipersecreción</tspan></text><line x1="476.0" y1="352.5" x2="503.0" y2="352.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,347.5 502.0,357.5 510.0,352.5" fill="#ea580c"/><rect x="516.0" y="325.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="349.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Tapón en un bronquio lobar</tspan></text><text x="530.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0"></tspan></text><line x1="255.0" y1="384.0" x2="255.0" y2="397.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,396.0 260.0,396.0 255.0,404.0" fill="#0f766e"/><rect x="40.0" y="406.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="435.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="440.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">2</tspan></text><text x="84.0" y="432.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Aire distal atrapado y reabsorbido</tspan></text><text x="84.0" y="449.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">El parénquima colapsa</tspan></text><line x1="476.0" y1="435.5" x2="503.0" y2="435.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,430.5 502.0,440.5 510.0,435.5" fill="#ea580c"/><rect x="516.0" y="408.0" width="444.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="530.0" y="432.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Atelectasia del lóbulo medio derecho</tspan></text><text x="530.0" y="449.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Murmullo ausente en el tercio medio</tspan></text><line x1="255.0" y1="467.0" x2="255.0" y2="480.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,479.0 260.0,479.0 255.0,487.0" fill="#0f766e"/><rect x="40.0" y="489.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="518.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="523.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">3</tspan></text><text x="84.0" y="515.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Estudio</tspan></text><text x="84.0" y="532.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Radiografía de tórax ante asimetría</tspan></text><line x1="476.0" y1="518.5" x2="503.0" y2="518.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,513.5 502.0,523.5 510.0,518.5" fill="#ea580c"/><rect x="516.0" y="491.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="515.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Opacidad triangular y pérdida de volumen</tspan></text><text x="530.0" y="532.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0"></tspan></text><line x1="255.0" y1="550.0" x2="255.0" y2="563.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,562.0 260.0,562.0 255.0,570.0" fill="#0f766e"/><rect x="40.0" y="572.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="601.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="606.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">4</tspan></text><text x="84.0" y="598.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Tratamiento</tspan></text><text x="84.0" y="615.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Broncodilatador, corticoide y oxígeno</tspan></text><line x1="476.0" y1="601.5" x2="503.0" y2="601.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,596.5 502.0,606.5 510.0,601.5" fill="#ea580c"/><rect x="516.0" y="574.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="598.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Fisioterapia respiratoria</tspan></text><text x="530.0" y="615.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0"></tspan></text><rect x="40.0" y="649.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="675.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Murmullo ausente en un tercio tras crisis grave = atelectasia</tspan></text><text x="60.0" y="694.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El neumotórax abole el murmullo de todo el hemitórax; neumonía y piotórax requieren fiebre y más días.</tspan></text><text x="40.0" y="761.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="771.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="793.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="793.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Piotórax</tspan></text><text x="435.0" y="793.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Neumonía</tspan></text><text x="585.0" y="793.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Enfisema</tspan></text><text x="735.0" y="793.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Neumotórax</tspan></text><rect x="813.0" y="774.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="793.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Atelectasia</tspan></text><rect x="40.0" y="808.0" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="808.0" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="845.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Complicación más</tspan><tspan x="54.0" dy="16">probable?</tspan></text><text x="285.0" y="845.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: derrame infectado</tspan><tspan x="285.0" dy="16">de evolución más lenta</tspan></text><text x="435.0" y="837.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: exige fiebre y</tspan><tspan x="435.0" dy="16">condensación con</tspan><tspan x="435.0" dy="16">crepitantes</tspan></text><text x="585.0" y="845.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no se desarrolla en</tspan><tspan x="585.0" dy="16">un niño en horas</tspan></text><text x="735.0" y="829.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: daría</tspan><tspan x="735.0" dy="16">hipersonoridad y</tspan><tspan x="735.0" dy="16">murmullo abolido en el</tspan><tspan x="735.0" dy="16">hemitórax</tspan></text><text x="885.0" y="845.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: matidez y murmullo</tspan><tspan x="885.0" dy="16">ausente localizados</tspan></text><rect x="40.0" y="771.0" width="920.0" height="119.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="914.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="942.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="964.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La atelectasia (sobre todo del lóbulo medio derecho, por su bronquio largo y estrecho) es la complicación pulmonar más frecuente de una crisis grave en</tspan><tspan x="58.0" dy="18">   el niño.</tspan><tspan x="58.0" dy="18">• Sospecha: dificultad persistente, murmullo ausente y matidez localizados; la radiografía muestra pérdida de volumen con opacidad triangular y</tspan><tspan x="58.0" dy="18">   desplazamiento de cisuras.</tspan><tspan x="58.0" dy="18">• Neumotórax y neumomediastino dan hipersonoridad, murmullo abolido en todo un hemitórax y a veces enfisema subcutáneo; la neumonía exige fiebre y</tspan><tspan x="58.0" dy="18">   crepitantes.</tspan><tspan x="58.0" dy="18">• Manejo: broncodilatador repetido, corticoide sistémico, oxígeno, sulfato de magnesio IV en crisis grave y fisioterapia respiratoria.</tspan></text><text x="58.0" y="1094.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: GINA, Estrategia global para el manejo y la prevención del asma, actualización 2025; Nelson Tratado de Pediatría, 22.ª ed. (2024).</tspan></text></svg>