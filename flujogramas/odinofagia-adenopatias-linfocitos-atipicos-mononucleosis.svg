<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="855" viewBox="0 0 1000 855" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Joven con febrícula, odinofagia, adenopatías generalizadas y linfocitos atípicos: mononucleosis, el factor de riesgo es el contacto estrecho por saliva (besos)"><title>Joven con febrícula, odinofagia, adenopatías generalizadas y linfocitos atípicos: mononucleosis, el factor de riesgo es el contacto estrecho por saliva (besos)</title><rect x="0.75" y="0.75" width="998.5" height="853.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Virus de Epstein-Barr · transmisión</tspan></text><rect x="408.3" y="32.0" width="136.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="476.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="121"><tspan x="476.6" dy="0">INFECTOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Mononucleosis infecciosa</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El virus de Epstein-Barr se elimina por la saliva semanas o meses después de la infección.</tspan><tspan x="58.0" dy="17">En adolescentes y jóvenes se contagia con los besos («enfermedad del beso»).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 23 años, 2 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Malestar, febrícula, odinofagia; faringe roja sin</tspan><tspan x="640.0" dy="16">exudado.</tspan><tspan x="640.0" dy="16">Adenopatías cervicales, axilares e inguinales;</tspan><tspan x="640.0" dy="16">linfocitosis con cambios virales.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE CONTAGIA EL VIRUS DE EPSTEIN-BARR</tspan></text><rect x="40.0" y="301.0" width="163.2" height="59.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="121.6" y="321.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="143"><tspan x="121.6" dy="0">Reservorio</tspan></text><text x="121.6" y="338.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="143"><tspan x="121.6" dy="0">Solo el ser humano</tspan></text><line x1="206.2" y1="330.5" x2="219.2" y2="330.5" stroke="#0f766e" stroke-width="2"/><polygon points="218.2,325.5 218.2,335.5 226.2,330.5" fill="#0f766e"/><line x1="121.6" y1="362.0" x2="121.6" y2="376.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="40.0" y="378.0" width="163.2" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="121.6" y="392.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="143"><tspan x="121.6" dy="0">✂ CORTA</tspan></text><text x="121.6" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="143"><tspan x="121.6" dy="0">Identificar al enfermo</tspan></text><rect x="229.2" y="301.0" width="163.2" height="59.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="310.8" y="321.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="143"><tspan x="310.8" dy="0">Salida</tspan></text><text x="310.8" y="338.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="143"><tspan x="310.8" dy="0">Saliva (meses)</tspan></text><line x1="395.4" y1="330.5" x2="408.4" y2="330.5" stroke="#0f766e" stroke-width="2"/><polygon points="407.4,325.5 407.4,335.5 415.4,330.5" fill="#0f766e"/><line x1="310.8" y1="362.0" x2="310.8" y2="376.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="229.2" y="378.0" width="163.2" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="310.8" y="392.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="143"><tspan x="310.8" dy="0">✂ CORTA</tspan></text><text x="310.8" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="143"><tspan x="310.8" dy="0">No compartir cubiertos</tspan></text><rect x="418.4" y="301.0" width="163.2" height="59.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="500.0" y="321.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="143"><tspan x="500.0" dy="0">Vía</tspan></text><text x="500.0" y="338.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="143"><tspan x="500.0" dy="0">Contacto estrecho: besos</tspan></text><line x1="584.6" y1="330.5" x2="597.6" y2="330.5" stroke="#0f766e" stroke-width="2"/><polygon points="596.6,325.5 596.6,335.5 604.6,330.5" fill="#0f766e"/><line x1="500.0" y1="362.0" x2="500.0" y2="376.0" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="418.4" y="378.0" width="163.2" height="64.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="500.0" y="392.0" font-size="9.5" font-weight="800" font-style="normal" fill="#ffedd5" text-anchor="middle" data-max="143"><tspan x="500.0" dy="0">✂ CORTA</tspan></text><text x="500.0" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="143"><tspan x="500.0" dy="0">Evitar besos en la fase</tspan><tspan x="500.0" dy="16">aguda</tspan></text><rect x="454.6" y="431.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="500.0" y="446.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">◆ ESTE CASO</tspan></text><rect x="607.6" y="301.0" width="163.2" height="59.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="689.2" y="321.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="143"><tspan x="689.2" dy="0">Entrada</tspan></text><text x="689.2" y="338.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="143"><tspan x="689.2" dy="0">Boca: epitelio y linfocitos B</tspan></text><line x1="773.8" y1="330.5" x2="786.8" y2="330.5" stroke="#0f766e" stroke-width="2"/><polygon points="785.8,325.5 785.8,335.5 793.8,330.5" fill="#0f766e"/><line x1="689.2" y1="362.0" x2="689.2" y2="376.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="607.6" y="378.0" width="163.2" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="689.2" y="392.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="143"><tspan x="689.2" dy="0">✂ CORTA</tspan></text><text x="689.2" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="143"><tspan x="689.2" dy="0">Higiene de manos</tspan></text><rect x="796.8" y="301.0" width="163.2" height="59.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="878.4" y="321.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="143"><tspan x="878.4" dy="0">Huésped</tspan></text><text x="878.4" y="338.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="143"><tspan x="878.4" dy="0">Adolescente o joven</tspan></text><line x1="878.4" y1="362.0" x2="878.4" y2="376.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="796.8" y="378.0" width="163.2" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="878.4" y="392.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="143"><tspan x="878.4" dy="0">✂ CORTA</tspan></text><text x="878.4" y="409.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="143"><tspan x="878.4" dy="0">Educación</tspan></text><rect x="40.0" y="472.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="498.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La mononucleosis se transmite por la saliva (besos)</tspan></text><text x="60.0" y="517.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Incubación de 4-6 semanas.</tspan></text><text x="40.0" y="584.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="594.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="625.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="616.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Exposición a orina</tspan><tspan x="285.0" dy="17">de roedor</tspan></text><text x="435.0" y="616.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Picadura de</tspan><tspan x="435.0" dy="17">zancudo aedes</tspan></text><text x="585.0" y="616.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Consumo de ostras</tspan><tspan x="585.0" dy="17">crudas</tspan></text><rect x="663.0" y="597.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="616.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Contacto personal</tspan><tspan x="735.0" dy="17">estrecho (besos)</tspan></text><text x="885.0" y="616.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Transfusión</tspan><tspan x="885.0" dy="17">sanguínea reciente</tspan></text><rect x="40.0" y="648.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="648.0" width="144.0" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="669.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Factor de riesgo?</tspan></text><text x="285.0" y="669.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: leptospirosis</tspan></text><text x="435.0" y="669.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: dengue</tspan></text><text x="585.0" y="669.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: hepatitis A o vibrios</tspan></text><text x="735.0" y="669.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: saliva por besos</tspan></text><text x="885.0" y="669.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Posible pero raro</tspan></text><rect x="40.0" y="594.0" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="706.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="734.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="756.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Incubación larga: 4-6 semanas.</tspan><tspan x="58.0" dy="18">• No compartir vasos ni cubiertos; no hace falta aislar.</tspan><tspan x="58.0" dy="18">• Rara vez por transfusión o trasplante (no es lo habitual).</tspan></text><text x="58.0" y="814.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, Epstein-Barr (2024); Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>