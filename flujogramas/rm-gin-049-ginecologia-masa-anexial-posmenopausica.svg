<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1155" viewBox="0 0 1000 1155" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Tumor anexial sólido y bilobulado en una mujer de 52 años: cáncer de ovario hasta demostrar lo contrario"><title>Tumor anexial sólido y bilobulado en una mujer de 52 años: cáncer de ovario hasta demostrar lo contrario</title><rect x="0.75" y="0.75" width="998.5" height="1153.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ginecología · masa anexial posmenopáusica</tspan></text><rect x="463.9" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="543.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="543.6" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tumor anexial</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">En la posmenopausia disminuyen los quistes funcionales y aumentan las neoplasias</tspan><tspan x="58.0" dy="17">epiteliales.</tspan><tspan x="58.0" dy="17">Todo tumor sólido se considera maligno hasta demostrar lo contrario.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 52 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Tumor sólido bilobulado en el anexo derecho.</tspan><tspan x="640.0" dy="16">¿Cuál es la causa más probable?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">RIESGO DE MALIGNIDAD DE UNA MASA ANEXIAL (O-RADS US V2022)</tspan></text><rect x="40.0" y="269.0" width="920.0" height="225.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="295.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Categoría O-RADS US</tspan></text><text x="60.0" y="314.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Una masa sólida irregular de una mujer posmenopáusica cae en las categorías de riesgo alto.</tspan></text><rect x="70.0" y="378.0" width="344.0" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="242.0" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="334"><tspan x="242.0" dy="0">Normal o casi seguro benigno</tspan></text><rect x="414.0" y="378.0" width="172.0" height="40.0" rx="6" fill="#fef9c3" stroke="#ffffff" stroke-width="2"/><text x="500.0" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#a16207" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">Bajo riesgo</tspan></text><rect x="586.0" y="378.0" width="172.0" height="40.0" rx="6" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/><text x="672.0" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#c2410c" text-anchor="middle" data-max="162"><tspan x="672.0" dy="0">Riesgo intermedio</tspan></text><rect x="758.0" y="378.0" width="172.0" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="844.0" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="162"><tspan x="844.0" dy="0">Riesgo alto</tspan></text><line x1="70.0" y1="418.0" x2="70.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="70.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="70.0" dy="0">0</tspan></text><line x1="242.0" y1="418.0" x2="242.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="242.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="242.0" dy="0">1</tspan></text><line x1="414.0" y1="418.0" x2="414.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="414.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="414.0" dy="0">2</tspan></text><line x1="586.0" y1="418.0" x2="586.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="586.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="586.0" dy="0">3</tspan></text><line x1="758.0" y1="418.0" x2="758.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="758.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="758.0" dy="0">4</tspan></text><line x1="930.0" y1="418.0" x2="930.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">5</tspan></text><polygon points="835.0,364.0 853.0,364.0 844.0,376.0" fill="#ea580c"/><rect x="793.1" y="338.0" width="101.9" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="844.0" y="353.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="90"><tspan x="844.0" dy="0">◆ Tumor sólido</tspan></text><rect x="60.0" y="452.0" width="880.0" height="30.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="472.0" font-size="11.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Categorías 4 y 5: derivar a ginecología oncológica.</tspan></text><text x="40.0" y="528.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CATEGORÍAS O-RADS US V2022: RIESGO DE MALIGNIDAD Y CONDUCTA</tspan></text><rect x="40.0" y="540.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="559.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">Categoría</tspan></text><text x="175.0" y="559.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Riesgo de malignidad</tspan></text><text x="572.5" y="559.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Conducta</tspan></text><rect x="40.0" y="569.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="588.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">0</tspan></text><text x="175.0" y="588.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">No se estima</tspan></text><text x="572.5" y="588.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Ecografía incompleta: repetirla o hacer resonancia</tspan></text><rect x="40.0" y="598.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="617.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">1</tspan></text><text x="175.0" y="617.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Ovario normal (premenopausia)</tspan></text><text x="572.5" y="617.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Sin seguimiento</tspan></text><rect x="40.0" y="627.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="646.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">2</tspan></text><text x="175.0" y="646.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Casi seguro benigno (menos de 1 %)</tspan></text><text x="572.5" y="646.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Seguimiento ecográfico según tamaño y menopausia</tspan></text><rect x="40.0" y="656.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="675.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">3</tspan></text><text x="175.0" y="675.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Bajo riesgo (1 a menos de 10 %)</tspan></text><text x="572.5" y="675.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Ecografía de especialista o resonancia; valorar ginecología</tspan></text><rect x="40.0" y="685.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="704.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">4</tspan></text><text x="175.0" y="704.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Riesgo intermedio (10 a menos de 50 %)</tspan></text><text x="572.5" y="704.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Ecografía de especialista o RM (score O-RADS MRI); ginecología</tspan><tspan x="572.5" dy="15">con consulta de ginecología oncológica</tspan></text><rect x="65.6" y="696.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="111.0" y="711.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="111.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="729.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="748.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="109"><tspan x="50.0" dy="0">5</tspan></text><text x="175.0" y="748.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="175.0" dy="0">Alto riesgo (50 % o más)</tspan></text><text x="572.5" y="748.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="382"><tspan x="572.5" dy="0">Manejo por ginecólogo oncólogo</tspan></text><text x="40.0" y="774.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Resumen de ACR O-RADS US v2022 (Strachowski, Radiology 2023). Las lesiones sólidas con captación Doppler moderada o intensa o con ascitis y nódulos peritoneales</tspan><tspan x="40.0" dy="15">ascienden a las categorías 4 y 5.</tspan></text><text x="40.0" y="836.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="846.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="868.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="868.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Cistoadenoma</tspan></text><text x="435.0" y="868.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Endometrioma</tspan></text><text x="585.0" y="868.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Quiste dermoide</tspan></text><rect x="663.0" y="849.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="868.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Cáncer de ovario</tspan></text><text x="885.0" y="868.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Cáncer de trompa</tspan></text><rect x="40.0" y="883.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="883.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="920.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Causa más probable?</tspan></text><text x="285.0" y="912.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es una lesión</tspan><tspan x="285.0" dy="16">quística</tspan></text><text x="435.0" y="912.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: quístico, de la</tspan><tspan x="435.0" dy="16">mujer joven</tspan></text><text x="585.0" y="912.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: quístico, de la</tspan><tspan x="585.0" dy="16">mujer joven</tspan></text><text x="735.0" y="912.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: lesión sólida en la</tspan><tspan x="735.0" dy="16">posmenopausia</tspan></text><text x="885.0" y="904.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es mucho menos</tspan><tspan x="885.0" dy="16">frecuente que el de</tspan><tspan x="885.0" dy="16">ovario</tspan></text><rect x="40.0" y="846.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="973.0" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1001.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1023.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Rasgos ecográficos de sospecha: componente sólido, tabiques gruesos, vegetaciones papilares, bilateralidad, ascitis y flujo vascular aumentado.</tspan><tspan x="58.0" dy="18">• Riesgo según O-RADS US v2022: categoría 2 menos de 1 %, 3 de 1 a menos de 10 %, 4 de 10 a menos de 50 % y 5 de 50 % o más.</tspan><tspan x="58.0" dy="18">• Cistoadenoma y endometrioma son quísticos; el dermoide es un teratoma maduro de la mujer joven, con áreas ecogénicas y calcificaciones.</tspan><tspan x="58.0" dy="18">• Alerta: ascitis, masa sólida y CA-125 alto orientan a cáncer; derivar a ginecología oncológica y no biopsiar a ciegas.</tspan></text><text x="58.0" y="1099.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Strachowski et al., O-RADS US v2022, Radiology 2023; NCCN, Ovarian Cancer (versión vigente); ACOG, Practice Bulletin 174 (2016); Berek y Novak Ginecología 16.ª</tspan><tspan x="58.0" dy="15">ed. (2020).</tspan></text></svg>