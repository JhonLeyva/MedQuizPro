<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1112" viewBox="0 0 1000 1112" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El ovocito puede fecundarse hasta 1 día después de la ovulación; el espermatozoide, hasta 5 días"><title>El ovocito puede fecundarse hasta 1 día después de la ovulación; el espermatozoide, hasta 5 días</title><rect x="0.75" y="0.75" width="998.5" height="1110.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ginecología · ventana fértil</tspan></text><rect x="359.9" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="439.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="439.7" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ventana fértil</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El ovocito vive 12 a 24 horas; el espermatozoide hasta 5 días en el moco cervical.</tspan><tspan x="58.0" dy="17">La ventana abarca los 5 días previos y el día de la ovulación.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Después de la ovulación, ¿hasta cuánto tiempo puede</tspan><tspan x="640.0" dy="16">ocurrir la fecundación?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CUÁNDO PUEDE OCURRIR LA FECUNDACIÓN RESPECTO A LA OVULACIÓN</tspan></text><rect x="40.0" y="269.0" width="920.0" height="34.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="52.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="154"><tspan x="52.0" dy="0">GAMETO O EVENTO</tspan></text><text x="250.8" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="78"><tspan x="250.8" dy="0">5 a 2 días antes</tspan></text><text x="332.4" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="78"><tspan x="332.4" dy="0">1 día antes</tspan></text><text x="414.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="78"><tspan x="414.0" dy="0">Ovulación</tspan></text><text x="495.6" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="78"><tspan x="495.6" dy="0">1 día tras</tspan></text><text x="577.2" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="78"><tspan x="577.2" dy="0">Más de 1 día</tspan></text><text x="634.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="320"><tspan x="634.0" dy="0">QUÉ SIGNIFICA</tspan></text><rect x="40.0" y="309.0" width="162.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="331.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="150"><tspan x="50.0" dy="0">Espermatozoide en el</tspan><tspan x="50.0" dy="16">moco cervical</tspan></text><line x1="218.0" y1="335.0" x2="610.0" y2="335.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="250.8" cy="330.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="250.8" y="357.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="78"><tspan x="250.8" dy="0">Vive</tspan></text><circle cx="332.4" cy="330.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="332.4" y="357.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="78"><tspan x="332.4" dy="0">Vive</tspan></text><circle cx="414.0" cy="330.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="414.0" y="357.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="78"><tspan x="414.0" dy="0">Vive</tspan></text><rect x="630.0" y="309.0" width="330.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="640.0" y="339.0" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="310"><tspan x="640.0" dy="0">Sobrevive hasta 5 días en las criptas cervicales.</tspan></text><rect x="40.0" y="367.0" width="162.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="397.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="150"><tspan x="50.0" dy="0">Fecundación posible</tspan></text><line x1="218.0" y1="393.0" x2="610.0" y2="393.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="250.8" cy="388.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="250.8" y="415.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="78"><tspan x="250.8" dy="0">Posible</tspan></text><circle cx="332.4" cy="388.0" r="13" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="332.4" y="392.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="332.4" dy="0">!</tspan></text><text x="332.4" y="415.0" font-size="9.5" font-weight="700" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="78"><tspan x="332.4" dy="0">Máxima</tspan></text><circle cx="414.0" cy="388.0" r="13" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="414.0" y="392.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="414.0" dy="0">!</tspan></text><text x="414.0" y="415.0" font-size="9.5" font-weight="700" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="78"><tspan x="414.0" dy="0">Máxima</tspan></text><circle cx="495.6" cy="388.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="495.6" y="392.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="495.6" dy="0">✓</tspan></text><text x="495.6" y="415.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="78"><tspan x="495.6" dy="0">Hasta aquí</tspan></text><rect x="630.0" y="367.0" width="330.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="640.0" y="389.5" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="310"><tspan x="640.0" dy="0">La probabilidad máxima es 2 días antes de ovular; tras 1</tspan><tspan x="640.0" dy="15">día, casi nula.</tspan></text><rect x="40.0" y="425.0" width="162.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="455.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="150"><tspan x="50.0" dy="0">Ovocito viable</tspan></text><line x1="218.0" y1="451.0" x2="610.0" y2="451.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="414.0" cy="446.0" r="13" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="414.0" y="450.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="414.0" dy="0">!</tspan></text><text x="414.0" y="473.0" font-size="9.5" font-weight="700" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="78"><tspan x="414.0" dy="0">12-24 h</tspan></text><circle cx="495.6" cy="446.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="495.6" y="450.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="495.6" dy="0">✓</tspan></text><text x="495.6" y="473.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="78"><tspan x="495.6" dy="0">Límite</tspan></text><circle cx="577.2" cy="446.0" r="13" fill="#cbd5e1" stroke="#cbd5e1" stroke-width="2"/><text x="577.2" y="450.5" font-size="12" font-weight="800" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="577.2" dy="0">✕</tspan></text><text x="577.2" y="473.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="78"><tspan x="577.2" dy="0">Ya no</tspan></text><rect x="630.0" y="425.0" width="330.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="640.0" y="455.0" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="310"><tspan x="640.0" dy="0">Solo 12 a 24 horas: como máximo 1 día.</tspan></text><text x="44.0" y="497.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="44.0" dy="0">! = ventana de máxima fertilidad · ✓ = límite de la fecundación · ✕ = ya no es posible</tspan></text><rect x="40.0" y="521.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="547.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Tras la ovulación, la fecundación es posible como máximo 1 día</tspan></text><text x="60.0" y="566.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">5 días es la vida del espermatozoide, no la del ovocito.</tspan></text><text x="40.0" y="627.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DURACIÓN DE LOS GAMETOS Y EVENTOS TRAS LA OVULACIÓN</tspan></text><rect x="40.0" y="639.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="658.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Evento</tspan></text><text x="290.0" y="658.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="664"><tspan x="290.0" dy="0">Tiempo</tspan></text><rect x="40.0" y="668.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="687.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Vida fértil del ovocito</tspan></text><text x="290.0" y="687.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="664"><tspan x="290.0" dy="0">12 a 24 horas (máximo 1 día)</tspan></text><rect x="180.6" y="671.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="226.0" y="686.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="226.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="697.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="716.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Supervivencia del espermatozoide</tspan></text><text x="290.0" y="716.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="664"><tspan x="290.0" dy="0">Hasta 5 días en el moco cervical</tspan></text><rect x="40.0" y="726.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="745.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Llegada del cigoto al útero</tspan></text><text x="290.0" y="745.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="664"><tspan x="290.0" dy="0">3 a 4 días</tspan></text><rect x="40.0" y="755.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="774.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="224"><tspan x="50.0" dy="0">Implantación</tspan></text><text x="290.0" y="774.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="664"><tspan x="290.0" dy="0">6 a 10 días después de la ovulación</tspan></text><text x="40.0" y="824.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="834.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="856.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="837.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="856.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Máximo 1 día</tspan></text><text x="435.0" y="856.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Máximo 1 semana</tspan></text><text x="585.0" y="856.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">3 días</tspan></text><text x="735.0" y="856.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">4 días</tspan></text><text x="885.0" y="856.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">5 días</tspan></text><rect x="40.0" y="871.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="871.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="892.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Hasta cuánto tras la</tspan><tspan x="54.0" dy="16">ovulación?</tspan></text><text x="285.0" y="892.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: ovocito viable 12-24</tspan><tspan x="285.0" dy="16">horas</tspan></text><text x="435.0" y="892.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: el ovocito ya no es</tspan><tspan x="435.0" dy="16">viable</tspan></text><text x="585.0" y="892.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: el ovocito ya no es</tspan><tspan x="585.0" dy="16">viable</tspan></text><text x="735.0" y="892.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: el ovocito ya no es</tspan><tspan x="735.0" dy="16">viable</tspan></text><text x="885.0" y="892.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es la vida del</tspan><tspan x="885.0" dy="16">espermatozoide</tspan></text><rect x="40.0" y="834.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="945.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="973.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="995.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La fecundación ocurre en la ampolla tubárica; el cigoto tarda 3-4 días en llegar al útero y la implantación sucede 6-10 días después de la ovulación.</tspan><tspan x="58.0" dy="18">• Wilcox 1995: la probabilidad de concepción es máxima en los 2 días previos a la ovulación y casi nula después.</tspan><tspan x="58.0" dy="18">• La opción de 1 semana, 3 o 4 días no corresponde al ovocito; 5 días es la vida del espermatozoide.</tspan><tspan x="58.0" dy="18">• La β-hCG aparece tras la implantación y se detecta en sangre unos 8 a 10 días después de la ovulación.</tspan></text><text x="58.0" y="1071.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Wilcox AJ et al. N Engl J Med 1995;333:1517-1521; Williams Obstetricia 26.ª ed. (2022)</tspan></text></svg>