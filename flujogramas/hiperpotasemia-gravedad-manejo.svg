="0">K⁺ 7 con cambios en el ECG: ¿qué primero?</tspan></text><rect x="40.0" y="415.0" width="453.0" height="73.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">GLUCONATO DE CALCIO EV</tspan></text><text x="266.5" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">En minutos</tspan></text><rect x="507.0" y="415.0" width="453.0" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Insulina + glucosa, salbutamol</tspan></text><text x="733.5" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Diálisis en ERC 4</tspan></text><text x="40.0" y="528.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="540.5" width="920.0" height="369.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="554.5" width="281.7" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="196.8" y="574.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="196.8" dy="0">GRAVEDAD DE LA HIPERPOTASEMIA</tspan></text><text x="353.7" y="574.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="588"><tspan x="353.7" dy="0">UK Kidney Association 2023: por el nivel de K⁺ y por los cambios en el ECG.</tspan></text><rect x="56.0" y="614.5" width="288.0" height="144.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="615.1" width="286.8" height="63.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="200.0" y="642.5" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="272"><tspan x="200.0" dy="0">K⁺ 5,5-5,9</tspan></text><text x="200.0" y="662.5" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="264"><tspan x="200.0" dy="0">Leve</tspan></text><circle cx="72.0" cy="687.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="691.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="82.0" dy="0">Sin cambios en el ECG</tspan></text><circle cx="72.0" cy="710.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="714.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="82.0" dy="0">Corregir la causa</tspan></text><rect x="356.0" y="614.5" width="288.0" height="144.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="356.6" y="615.1" width="286.8" height="63.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="500.0" y="642.5" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="272"><tspan x="500.0" dy="0">K⁺ 6,0-6,4</tspan></text><text x="500.0" y="662.5" font-size="14" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="264"><tspan x="500.0" dy="0">Moderada</tspan></text><circle cx="372.0" cy="687.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="382.0" y="691.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="382.0" dy="0">Insulina + glucosa</tspan></text><circle cx="372.0" cy="710.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="382.0" y="714.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="382.0" dy="0">Monitoreo cardiaco</tspan></text><rect x="656.0" y="614.5" width="288.0" height="144.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="657.2" y="615.7" width="285.6" height="63.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="800.0" y="642.5" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="272"><tspan x="800.0" dy="0">K⁺ ≥ 6,5 O ECG ALTERADO</tspan></text><text x="800.0" y="662.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="264"><tspan x="800.0" dy="0">Grave</tspan></text><circle cx="672.0" cy="687.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="682.0" y="691.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="250"><tspan x="682.0" dy="0">Gluconato de calcio EV ya</tspan></text><circle cx="672.0" cy="710.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="682.0" y="714.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="250"><tspan x="682.0" dy="0">Insulina + glucosa, salbutamol</tspan></text><circle cx="672.0" cy="733.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="682.0" y="737.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="250"><tspan x="682.0" dy="0">Valorar diálisis</tspan></text><rect x="754.6" y="603.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="800.0" y="618.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="800.0" dy="0">◆ ESTE CASO</tspan></text><text x="56.0" y="788.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="797.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="812.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="812.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">K⁺ 7 con ondas T alteradas</tspan></text><rect x="56.0" y="819.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="834.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="834.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">ERC 4: no lo elimina solo</tspan></text><rect x="56.0" y="856.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="879.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Gluconato de calcio EV, insulina + glucosa, salbutamol y diálisis.</tspan></text><text x="40.0" y="949.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="959.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="999.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="982.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Resinas de</tspan><tspan x="285.0" dy="17">intercambio</tspan><tspan x="285.0" dy="17">catiónico</tspan></text><rect x="363.0" y="962.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="990.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Gluconato cálcico</tspan><tspan x="435.0" dy="17">endovenoso</tspan></text><text x="585.0" y="990.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Catéter para iniciar</tspan><tspan x="585.0" dy="17">diálisis</tspan></text><text x="735.0" y="990.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Furosemida</tspan><tspan x="735.0" dy="17">parenteral</tspan></text><text x="885.0" y="990.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Bicarbonato de</tspan><tspan x="885.0" dy="17">sodio oral</tspan></text><rect x="40.0" y="1030.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="1030.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1059.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Primera medida?</tspan></text><text x="285.0" y="1059.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Lentas: horas</tspan></text><text x="435.0" y="1051.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: protege el corazón</tspan><tspan x="435.0" dy="16">ya</tspan></text><text x="585.0" y="1051.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Se prepara, pero no es</tspan><tspan x="585.0" dy="16">lo primero</tspan></text><text x="735.0" y="1059.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Poco efecto en ERC 4</tspan></text><text x="885.0" y="1059.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: lento y poco eficaz</tspan></text><rect x="40.0" y="959.5" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1104.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1132.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1154.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Gluconato de calcio al 10 % 30 mL EV (protege el corazón en minutos; repetir si sigue el ECG alterado).</tspan><tspan x="58.0" dy="18">• Insulina + glucosa y salbutamol; luego quelantes (patirómero, ciclosilicato de zirconio).</tspan><tspan x="58.0" dy="18">• ERC 4 con K⁺ 7 y sopor: preparar diálisis.</tspan></text><text x="58.0" y="1212.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: UK Kidney Association, hiperpotasemia aguda (2023); KDIGO.</tspan></text></svg>