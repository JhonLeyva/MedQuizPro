weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Grave: 16 o más</tspan></text><text x="310.0" y="832.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Día 12</tspan></text><text x="640.0" y="832.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Día 6-7</tspan></text><text x="40.0" y="858.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Siempre tras descartar hemorragia con tomografía y valorando el tamaño del infarto.</tspan></text><text x="40.0" y="905.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="915.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="937.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="918.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="937.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Día 6</tspan></text><text x="435.0" y="937.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Día 10</tspan></text><text x="585.0" y="937.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Día 12</tspan></text><text x="735.0" y="937.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Día 3</tspan></text><text x="885.0" y="937.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Día 8</tspan></text><rect x="40.0" y="952.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="952.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="981.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Día de reinicio?</tspan></text><text x="285.0" y="973.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: ictus moderado en</tspan><tspan x="285.0" dy="16">la regla 1-3-6-12</tspan></text><text x="435.0" y="973.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: corresponde a otro</tspan><tspan x="435.0" dy="16">escalón</tspan></text><text x="585.0" y="973.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: corresponde a otro</tspan><tspan x="585.0" dy="16">escalón</tspan></text><text x="735.0" y="973.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: corresponde al</tspan><tspan x="735.0" dy="16">ictus leve</tspan></text><text x="885.0" y="973.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: corresponde a otro</tspan><tspan x="885.0" dy="16">escalón</tspan></text><rect x="40.0" y="915.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1026.0" width="920.0" height="218.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1054.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1076.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Regla clásica 1-3-6-12 (sociedad europea): día 1 en AIT, día 3 en ictus leve (NIHSS menor de 8), día 6 en moderado (8 a 15) y día 12 en grave, tras</tspan><tspan x="58.0" dy="18">   descartar sangrado por tomografía.</tspan><tspan x="58.0" dy="18">• NIHSS 10 = ictus moderado: día 6 (clave). Se prefieren los anticoagulantes directos a la warfarina y se individualiza por tamaño del infarto y riesgo de</tspan><tspan x="58.0" dy="18">   hemorragia.</tspan><tspan x="58.0" dy="18">• ELAN (2023): anticoagulante directo en las primeras 48 horas en ictus leve o moderado, y al día 6-7 en el grave, fue seguro y no inferior a la estrategia</tspan><tspan x="58.0" dy="18">   tardía.</tspan><tspan x="58.0" dy="18">• OPTIMAS (2024): iniciar en los primeros 4 días no es peor que a los 7-14 días. La aspirina no sustituye la anticoagulación en fibrilación auricular.</tspan></text><text x="58.0" y="1206.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Fischer, ELAN (N Engl J Med 2023;388:2411); Werring, OPTIMAS (Lancet 2024;404:1731); AHA/ASA, Guideline for the Prevention of Stroke in Patients With Stroke and</tspan><tspan x="58.0" dy="15">TIA (Kleindorfer, Stroke 2021;52:e364).</tspan></text></svg>