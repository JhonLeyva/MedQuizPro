"320.0" y="796.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="634"><tspan x="320.0" dy="0">Patrón</tspan></text><rect x="40.0" y="806.9" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="825.9" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Enfermedad diverticular</tspan></text><text x="320.0" y="825.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="634"><tspan x="320.0" dy="0">Más frecuente (30-40 %); indolora, masiva; cede sola en 75 %</tspan></text><rect x="210.6" y="810.4" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="256.0" y="825.4" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="256.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="835.9" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="854.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Angiodisplasia</tspan></text><text x="320.0" y="854.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="634"><tspan x="320.0" dy="0">Segunda causa; ciego y colon ascendente; estenosis aórtica, von Willebrand adquirida</tspan></text><rect x="40.0" y="864.9" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="883.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Hemorroides, colitis isquémica, infecciosa</tspan><tspan x="50.0" dy="15">o inflamatoria</tspan></text><text x="320.0" y="883.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="634"><tspan x="320.0" dy="0">Causas menos frecuentes</tspan></text><rect x="40.0" y="908.9" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="927.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Neoplasias</tspan></text><text x="320.0" y="927.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="634"><tspan x="320.0" dy="0">Sangrado crónico</tspan></text><text x="40.0" y="977.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="987.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1018.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1010.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Neoplasia maligna</tspan><tspan x="285.0" dy="17">colorrectal</tspan></text><rect x="363.0" y="990.9" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="1010.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Diverticulosis</tspan><tspan x="435.0" dy="17">colónica</tspan></text><text x="585.0" y="1010.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Enfermedad de</tspan><tspan x="585.0" dy="17">Crohn</tspan></text><text x="735.0" y="1018.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Colitis aguda</tspan></text><text x="885.0" y="1010.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Angiodisplasia</tspan><tspan x="885.0" dy="17">colónica</tspan></text><rect x="40.0" y="1041.9" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="1041.9" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1078.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Causa más frecuente?</tspan></text><text x="285.0" y="1070.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: sangrado crónico,</tspan><tspan x="285.0" dy="16">menos frecuente</tspan></text><text x="435.0" y="1062.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: 30 a 40 %;</tspan><tspan x="435.0" dy="16">sangrado indoloro y</tspan><tspan x="435.0" dy="16">masivo</tspan></text><text x="585.0" y="1070.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: causa menos</tspan><tspan x="585.0" dy="16">frecuente</tspan></text><text x="735.0" y="1070.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: causa menos</tspan><tspan x="735.0" dy="16">frecuente</tspan></text><text x="885.0" y="1062.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: segunda causa, en</tspan><tspan x="885.0" dy="16">ciego y colon</tspan><tspan x="885.0" dy="16">ascendente</tspan></text><rect x="40.0" y="987.9" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1131.9" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1159.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1181.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Enfermedad diverticular: 30 a 40 %; sangra la vasa recta en el cuello del divertículo, de forma indolora y masiva, y cede sola en 75 %. Sangran más los</tspan><tspan x="58.0" dy="18">   divertículos del colon derecho.</tspan><tspan x="58.0" dy="18">• Angiodisplasia: segunda causa, en ciego y colon ascendente; asociada a estenosis aórtica y a enfermedad de von Willebrand adquirida.</tspan><tspan x="58.0" dy="18">• ACG 2023: estratificar con el índice de Oakland (8 puntos o menos permite alta), colonoscopía durante la admisión y angiografía por TC si hay</tspan><tspan x="58.0" dy="18">   inestabilidad.</tspan><tspan x="58.0" dy="18">• Alerta: el cáncer colorrectal da sangrado crónico y el Crohn y la colitis son causas menos frecuentes; hemorroides e isquemia colónica también sangran.</tspan></text><text x="58.0" y="1293.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Sengupta N et al., ACG Clinical Guideline: Acute Lower Gastrointestinal Bleeding, Am J Gastroenterol 2023;118:208-231; Sabiston Tratado de Cirugía 21.ª ed. (2021).</tspan></text></svg>