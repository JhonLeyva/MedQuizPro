<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1312" viewBox="0 0 1000 1312" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La convulsión febril simple dura como máximo 15 minutos, es generalizada y no se repite en 24 horas"><title>La convulsión febril simple dura como máximo 15 minutos, es generalizada y no se repite en 24 horas</title><rect x="0.75" y="0.75" width="998.5" height="1310.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · convulsión febril</tspan></text><rect x="363.4" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="412.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="412.4" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Convulsión febril</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Crisis en un niño de 6 meses a 5 años con fiebre mayor de 38 °C, sin infección del SNC.</tspan><tspan x="58.0" dy="17">La más frecuente de la infancia (2 a 5 %).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de criterio</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es un criterio de convulsión febril simple?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SE PIENSA EN ESTE ORDEN</tspan></text><rect x="40.0" y="253.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="298.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="326.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">1</tspan></text><rect x="124.0" y="253.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="281.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Cómo es la crisis?</tspan></text><rect x="136.0" y="295.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="315.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Generalizada tónico-clónica</tspan></text><text x="152.0" y="334.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Si es focal, es una convulsión febril compleja.</tspan></text><line x1="77.0" y1="356.0" x2="77.0" y2="375.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,374.0 82.0,374.0 77.0,382.0" fill="#0f766e"/><text x="134.0" y="374.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="384.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="429.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="457.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">2</tspan></text><rect x="124.0" y="384.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="412.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Cuánto dura?</tspan></text><rect x="136.0" y="426.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="446.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Como máximo 15 minutos</tspan></text><text x="152.0" y="465.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Más de 15 minutos la hace compleja; más de 30, estado epiléptico febril.</tspan></text><line x1="77.0" y1="487.0" x2="77.0" y2="506.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,505.0 82.0,505.0 77.0,513.0" fill="#0f766e"/><text x="134.0" y="505.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="515.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="560.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="588.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">3</tspan></text><rect x="124.0" y="515.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="543.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Se repite?</tspan></text><rect x="136.0" y="557.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="577.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">No recurre en 24 horas ni dentro del mismo episodio</tspan></text><text x="152.0" y="596.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Dos o más crisis en 24 horas es una convulsión compleja.</tspan></text><rect x="40.0" y="636.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="662.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Generalizada, máximo 15 minutos y sin repetición = simple</tspan></text><text x="60.0" y="681.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Focal, mayor de 15 minutos o recurrente son criterios de complejidad.</tspan></text><text x="40.0" y="742.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CONVULSIÓN FEBRIL SIMPLE FRENTE A COMPLEJA</tspan></text><rect x="40.0" y="754.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="773.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Criterio</tspan></text><text x="200.0" y="773.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="369"><tspan x="200.0" dy="0">Simple</tspan></text><text x="585.0" y="773.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="369"><tspan x="585.0" dy="0">Compleja</tspan></text><rect x="40.0" y="783.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="802.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Tipo de crisis</tspan></text><text x="200.0" y="802.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="200.0" dy="0">Generalizada tónico-clónica</tspan></text><text x="585.0" y="802.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="585.0" dy="0">Focal</tspan></text><rect x="40.0" y="812.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="831.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Duración</tspan></text><text x="200.0" y="831.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="200.0" dy="0">Menos de 15 minutos</tspan></text><text x="585.0" y="831.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="585.0" dy="0">Más de 15 minutos</tspan></text><rect x="90.6" y="815.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="136.0" y="830.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="136.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="841.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="860.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Recurrencia</tspan></text><text x="200.0" y="860.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="200.0" dy="0">No se repite en 24 horas</tspan></text><text x="585.0" y="860.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="585.0" dy="0">Se repite en 24 horas o en el mismo episodio</tspan></text><rect x="40.0" y="870.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="889.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Recuperación</tspan></text><text x="200.0" y="889.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="200.0" dy="0">Completa, examen neurológico normal</tspan></text><text x="585.0" y="889.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="585.0" dy="0">Puede haber déficit</tspan></text><text x="40.0" y="939.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="949.0" width="920.0" height="88.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="997.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="980.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Dos o más crisis</tspan><tspan x="285.0" dy="17">con intervalo menor</tspan><tspan x="285.0" dy="17">de 24 h</tspan></text><text x="435.0" y="980.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Crisis focales</tspan><tspan x="435.0" dy="17">parciales mayores</tspan><tspan x="435.0" dy="17">de 15 minutos</tspan></text><rect x="513.0" y="952.0" width="144.0" height="82.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="980.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Convulsión con</tspan><tspan x="585.0" dy="17">duración máxima de</tspan><tspan x="585.0" dy="17">15 minutos</tspan></text><text x="735.0" y="980.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Convulsión con</tspan><tspan x="735.0" dy="17">duración mayor de</tspan><tspan x="735.0" dy="17">30 minutos</tspan></text><text x="885.0" y="971.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Convulsión con</tspan><tspan x="885.0" dy="17">pérdida de</tspan><tspan x="885.0" dy="17">conciencia</tspan><tspan x="885.0" dy="17">prolongada</tspan></text><rect x="40.0" y="1037.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="1037.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1066.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Criterio de convulsión</tspan><tspan x="54.0" dy="16">febril simple?</tspan></text><text x="285.0" y="1058.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: la recurrencia en</tspan><tspan x="285.0" dy="16">24 horas la hace</tspan><tspan x="285.0" dy="16">compleja</tspan></text><text x="435.0" y="1066.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: la crisis focal la</tspan><tspan x="435.0" dy="16">hace compleja</tspan></text><text x="585.0" y="1066.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: dura como máximo</tspan><tspan x="585.0" dy="16">15 minutos</tspan></text><text x="735.0" y="1058.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: sobre 30 minutos</tspan><tspan x="735.0" dy="16">es estado epiléptico</tspan><tspan x="735.0" dy="16">febril</tspan></text><text x="885.0" y="1058.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: la pérdida de</tspan><tspan x="885.0" dy="16">conciencia prolongada</tspan><tspan x="885.0" dy="16">no es criterio simple</tspan></text><rect x="40.0" y="949.0" width="920.0" height="154.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1127.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1155.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1177.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Simple: generalizada tónico-clónica, dura menos de 15 minutos, no se repite en 24 horas y el niño se recupera por completo con examen neurológico</tspan><tspan x="58.0" dy="18">   normal.</tspan><tspan x="58.0" dy="18">• Compleja: focal, mayor de 15 minutos o recurrente en 24 horas. Una crisis mayor de 30 minutos es estado epiléptico febril.</tspan><tspan x="58.0" dy="18">• En la simple no se piden neuroimágenes ni EEG; la punción lumbar se considera con signos meníngeos o en menores de 12 meses sin vacunar.</tspan><tspan x="58.0" dy="18">• Alerta: diazepam o midazolam si la crisis pasa de 5 minutos; no se indica profilaxis continua. Recurrencia cerca de 30 % y epilepsia posterior de 1 a 2 %.</tspan></text><text x="58.0" y="1271.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAP, Subcomité de convulsiones febriles, Pediatrics 2011; Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>