<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1235" viewBox="0 0 1000 1235" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Amenaza de parto pretérmino a las 33 semanas con cuello acortado: corticoides para la maduración pulmonar"><title>Amenaza de parto pretérmino a las 33 semanas con cuello acortado: corticoides para la maduración pulmonar</title><rect x="0.75" y="0.75" width="998.5" height="1233.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · amenaza de parto pretérmino</tspan></text><rect x="448.8" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="528.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="528.6" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Amenaza de parto pretérmino</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Contracciones regulares con cambios cervicales antes de las 37 semanas.</tspan><tspan x="58.0" dy="17">Se precisa el riesgo con longitud cervical por ecografía y fibronectina fetal.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante de 33 semanas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dolor y 2 contracciones en 10 minutos, latidos fetales</tspan><tspan x="640.0" dy="16">normales.</tspan><tspan x="640.0" dy="16">Cérvix anterior, acortado y reblandecido, sin sangrado.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SE OFRECE SEGÚN LAS SEMANAS DE GESTACIÓN</tspan></text><rect x="40.0" y="285.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="311.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Semanas de gestación</tspan></text><text x="60.0" y="330.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Los corticoides se dan entre las 24 y las 34 semanas; el magnesio por debajo de las 32.</tspan></text><rect x="70.0" y="394.0" width="114.7" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="127.3" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="105"><tspan x="127.3" dy="0">Individual</tspan></text><rect x="184.7" y="394.0" width="458.7" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="414.0" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="449"><tspan x="414.0" dy="0">Corticoides y magnesio</tspan></text><rect x="643.3" y="394.0" width="114.7" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="700.7" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="105"><tspan x="700.7" dy="0">Corticoides</tspan></text><rect x="758.0" y="394.0" width="172.0" height="40.0" rx="6" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/><text x="844.0" y="419.0" font-size="12" font-weight="800" font-style="normal" fill="#c2410c" text-anchor="middle" data-max="162"><tspan x="844.0" dy="0">Considerar</tspan></text><line x1="70.0" y1="434.0" x2="70.0" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="70.0" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="70.0" dy="0">22 s</tspan></text><line x1="184.7" y1="434.0" x2="184.7" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="184.7" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="184.7" dy="0">24 s</tspan></text><line x1="414.0" y1="434.0" x2="414.0" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="414.0" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="414.0" dy="0">28 s</tspan></text><line x1="643.3" y1="434.0" x2="643.3" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="643.3" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="643.3" dy="0">32 s</tspan></text><line x1="758.0" y1="434.0" x2="758.0" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="758.0" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="758.0" dy="0">34 s</tspan></text><line x1="930.0" y1="434.0" x2="930.0" y2="442.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="456.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">37 s</tspan></text><polygon points="691.7,380.0 709.7,380.0 700.7,392.0" fill="#ea580c"/><rect x="606.5" y="354.0" width="188.2" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="700.7" y="369.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="176"><tspan x="700.7" dy="0">◆ 33 SEMANAS: CORTICOIDES</tspan></text><text x="40.0" y="502.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ DECIDE LA CONDUCTA</tspan></text><rect x="40.0" y="512.0" width="297.3" height="85.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="513.0" width="6.0" height="83.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="536.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Menor de 34 semanas con riesgo de parto</tspan></text><text x="58.0" y="557.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Betametasona 12 mg IM cada 24 horas, dos dosis</tspan></text><rect x="351.3" y="512.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="513.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="536.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Tocólisis y magnesio</tspan></text><text x="369.3" y="557.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Nifedipino 48 horas; magnesio por debajo de 32</tspan><tspan x="369.3" dy="16">semanas</tspan></text><rect x="662.7" y="512.0" width="297.3" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="513.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="536.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Reposo, antibióticos o progesterona</tspan></text><text x="680.7" y="557.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">No detienen el trabajo de parto ni están indicados</tspan><tspan x="680.7" dy="16">aquí</tspan></text><text x="40.0" y="631.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">MEDIDAS EN LA AMENAZA DE PARTO PRETÉRMINO</tspan></text><rect x="40.0" y="643.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="662.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Medida</tspan></text><text x="280.0" y="662.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Cuándo</tspan></text><text x="625.0" y="662.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">En el caso</tspan></text><rect x="40.0" y="672.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="691.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Corticoides</tspan></text><text x="280.0" y="691.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Menos de 34 semanas con riesgo de parto en 7 días</tspan></text><text x="625.0" y="691.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">33 semanas: se indican</tspan></text><rect x="170.6" y="675.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="216.0" y="690.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="216.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="701.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="720.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Tocólisis con nifedipino</tspan></text><text x="280.0" y="720.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Solo 48 horas, para completar corticoides o trasladar</tspan></text><text x="625.0" y="720.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Opcional</tspan></text><rect x="40.0" y="730.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="749.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Sulfato de magnesio</tspan></text><text x="280.0" y="749.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Menos de 32 semanas con parto inminente</tspan></text><text x="625.0" y="749.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">No corresponde</tspan></text><rect x="40.0" y="759.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="778.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Progesterona vaginal</tspan></text><text x="280.0" y="778.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Prevención con parto previo o cuello corto</tspan></text><text x="625.0" y="778.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">No detiene el trabajo de parto</tspan></text><text x="40.0" y="828.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="838.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="877.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="841.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="860.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Maduración</tspan><tspan x="285.0" dy="17">pulmonar con</tspan><tspan x="285.0" dy="17">corticoides</tspan></text><text x="435.0" y="869.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Progesterona</tspan><tspan x="435.0" dy="17">micronizada vaginal</tspan></text><text x="585.0" y="869.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Antibioticoterapia</tspan><tspan x="585.0" dy="17">de amplio espectro</tspan></text><text x="735.0" y="869.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Reposo absoluto y</tspan><tspan x="735.0" dy="17">monitoreo</tspan></text><text x="885.0" y="860.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Sulfato de</tspan><tspan x="885.0" dy="17">magnesio</tspan><tspan x="885.0" dy="17">endovenoso</tspan></text><rect x="40.0" y="909.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="909.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="946.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Conducta a seguir?</tspan></text><text x="285.0" y="938.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: acelera la madurez</tspan><tspan x="285.0" dy="16">pulmonar fetal</tspan></text><text x="435.0" y="930.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: previene el parto,</tspan><tspan x="435.0" dy="16">no detiene el que está</tspan><tspan x="435.0" dy="16">en curso</tspan></text><text x="585.0" y="930.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: solo si hay rotura</tspan><tspan x="585.0" dy="16">de membranas o parto</tspan><tspan x="585.0" dy="16">inminente</tspan></text><text x="735.0" y="938.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: carece de eficacia</tspan><tspan x="735.0" dy="16">y favorece la trombosis</tspan></text><text x="885.0" y="930.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: neuroprotector, por</tspan><tspan x="885.0" dy="16">debajo de las 32</tspan><tspan x="885.0" dy="16">semanas</tspan></text><rect x="40.0" y="838.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="999.0" width="920.0" height="218.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1027.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1049.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• En feto menor de 34 semanas con riesgo de parto en 7 días: betametasona 12 mg intramuscular cada 24 horas por dos dosis (ACOG); reduce el</tspan><tspan x="58.0" dy="18">   síndrome de dificultad respiratoria, la hemorragia intraventricular y la mortalidad.</tspan><tspan x="58.0" dy="18">• La tocólisis con nifedipino es opcional y solo por 48 horas, para completar los corticoides o trasladar a la paciente.</tspan><tspan x="58.0" dy="18">• Sulfato de magnesio como neuroprotector por debajo de las 32 semanas ante parto inminente; la progesterona vaginal previene, pero no detiene un</tspan><tspan x="58.0" dy="18">   trabajo de parto en curso.</tspan><tspan x="58.0" dy="18">• Antibióticos solo si hay rotura de membranas o profilaxis de estreptococo del grupo B ante parto inminente; el reposo absoluto no sirve y aumenta el</tspan><tspan x="58.0" dy="18">   riesgo de trombosis.</tspan></text><text x="58.0" y="1179.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, Practice Bulletin 171, Management of preterm labor. Obstet Gynecol 2016;128:e155-64; ACOG, Committee Opinion 713, Antenatal corticosteroid therapy for fetal</tspan><tspan x="58.0" dy="15">maturation. Obstet Gynecol 2017;130:e102-9; Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>