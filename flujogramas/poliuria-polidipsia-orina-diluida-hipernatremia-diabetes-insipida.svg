/tspan></text><text x="519.0" y="340.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Poliuria: ¿orina diluida con sodio alto?</tspan></text><rect x="40.0" y="431.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">DIABETES INSÍPIDA</tspan></text><text x="266.5" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Restricción de agua</tspan><tspan x="266.5" dy="17">Desmopresina</tspan></text><rect x="507.0" y="431.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="467.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Polidipsia primaria</tspan></text><text x="733.5" y="490.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Toma mucha agua</tspan></text><text x="40.0" y="561.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="573.5" width="920.0" height="346.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="587.5" width="255.9" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="184.0" y="607.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="184.0" dy="0">TIPOS DE POLIURIA HIPOTÓNICA</tspan></text><text x="327.9" y="607.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="614"><tspan x="327.9" dy="0">Se separan con la restricción de agua y la desmopresina.</tspan></text><rect x="56.0" y="647.5" width="288.0" height="121.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="648.1" width="286.8" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="200.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="272"><tspan x="200.0" dy="0">CENTRAL</tspan></text><text x="200.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="264"><tspan x="200.0" dy="0">Falta ADH</tspan></text><circle cx="72.0" cy="720.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="724.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="82.0" dy="0">Desmopresina concentra la orina</tspan></text><circle cx="72.0" cy="743.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="747.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="82.0" dy="0">Tumores, trauma, cirugía</tspan></text><rect x="356.0" y="647.5" width="288.0" height="121.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="356.6" y="648.1" width="286.8" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="500.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="272"><tspan x="500.0" dy="0">NEFROGÉNICA</tspan></text><text x="500.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="264"><tspan x="500.0" dy="0">Riñón no responde</tspan></text><circle cx="372.0" cy="720.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="382.0" y="724.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="382.0" dy="0">Desmopresina no sirve</tspan></text><circle cx="372.0" cy="743.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="382.0" y="747.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="382.0" dy="0">Litio, calcio alto</tspan></text><rect x="656.0" y="647.5" width="288.0" height="121.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="656.6" y="648.1" width="286.8" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="800.0" y="675.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="272"><tspan x="800.0" dy="0">POLIDIPSIA PRIMARIA</tspan></text><text x="800.0" y="695.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="264"><tspan x="800.0" dy="0">Bebe de más</tspan></text><circle cx="672.0" cy="720.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="682.0" y="724.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="682.0" dy="0">Sodio bajo-normal</tspan></text><text x="56.0" y="798.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">PARA UBICAR ESTE CASO</tspan></text><rect x="56.0" y="807.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="822.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="822.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Cefalea: sospecha de causa central</tspan></text><rect x="56.0" y="829.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="844.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="844.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Falta la prueba con desmopresina</tspan></text><rect x="56.0" y="866.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="889.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Restricción de agua, desmopresina y RM.</tspan></text><text x="40.0" y="959.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="969.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1009.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="992.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Poliuria, densidad</tspan><tspan x="285.0" dy="17">urinaria alta e</tspan><tspan x="285.0" dy="17">hipernatremia</tspan></text><rect x="363.0" y="972.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="992.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Poliuria, densidad</tspan><tspan x="435.0" dy="17">urinaria baja e</tspan><tspan x="435.0" dy="17">hipernatremia</tspan></text><text x="585.0" y="992.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Oliguria, densidad</tspan><tspan x="585.0" dy="17">urinaria alta e</tspan><tspan x="585.0" dy="17">hiponatremia</tspan></text><text x="735.0" y="992.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Poliuria, densidad</tspan><tspan x="735.0" dy="17">urinaria alta e</tspan><tspan x="735.0" dy="17">hiponatremia</tspan></text><text x="885.0" y="992.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Poliuria, densidad</tspan><tspan x="885.0" dy="17">urinaria baja e</tspan><tspan x="885.0" dy="17">hiponatremia</tspan></text><rect x="40.0" y="1040.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="1040.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1069.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Hallazgos?</tspan></text><text x="285.0" y="1061.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: densidad alta no</tspan><tspan x="285.0" dy="16">es DI</tspan></text><text x="435.0" y="1061.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: orina diluida +</tspan><tspan x="435.0" dy="16">sodio alto</tspan></text><text x="585.0" y="1061.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es otro cuadro</tspan><tspan x="585.0" dy="16">(SIADH)</tspan></text><text x="735.0" y="1069.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: densidad alta</tspan></text><text x="885.0" y="1069.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Es polidipsia primaria</tspan></text><rect x="40.0" y="969.5" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1114.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1142.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1164.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Prueba de restricción de agua: la orina no se concentra.</tspan><tspan x="58.0" dy="18">• Desmopresina: si la orina se concentra, es central; si no, nefrogénica (litio, hipercalcemia).</tspan><tspan x="58.0" dy="18">• Central con cefalea: RM de hipófisis; tratar con desmopresina.</tspan></text><text x="58.0" y="1222.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Endocrine Society; consenso de cambio de nombre (2022); Harrison Principios de Medicina Interna 22.ª ed. (2025).</tspan></text></svg>