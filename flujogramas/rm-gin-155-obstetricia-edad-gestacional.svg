<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1163" viewBox="0 0 1000 1163" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La mejor forma de determinar la edad gestacional es la ecografía del primer trimestre (longitud cráneo-caudal)"><title>La mejor forma de determinar la edad gestacional es la ecografía del primer trimestre (longitud cráneo-caudal)</title><rect x="0.75" y="0.75" width="998.5" height="1161.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · edad gestacional</tspan></text><rect x="377.0" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="456.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="456.8" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Datación del embarazo</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La edad gestacional es la base para interpretar el crecimiento, el tamizaje y la inducción.</tspan><tspan x="58.0" dy="17">La fecha de última menstruación solo sirve si el ciclo es regular y la fecha segura.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Adolescente de 15 años, G1P0</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Primer control prenatal.</tspan><tspan x="640.0" dy="16">Útero palpable a nivel de las crestas ilíacas.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CUÁNDO SE REDATA EL EMBARAZO CON LA ECOGRAFÍA</tspan></text><rect x="40.0" y="269.0" width="920.0" height="151.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="295.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Edad gestacional por la última menstruación (semanas)</tspan></text><text x="60.0" y="314.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Diferencia entre la fecha menstrual y la ecografía que obliga a redatar.</tspan></text><rect x="70.0" y="344.0" width="322.5" height="40.0" rx="6" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/><text x="231.2" y="369.0" font-size="12" font-weight="800" font-style="normal" fill="#c2410c" text-anchor="middle" data-max="312"><tspan x="231.2" dy="0">Antes de 9 s: más de 5 días</tspan></text><rect x="392.5" y="344.0" width="537.5" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="661.2" y="369.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="528"><tspan x="661.2" dy="0">9 a 13+6 s: más de 7 días</tspan></text><line x1="70.0" y1="384.0" x2="70.0" y2="392.0" stroke="#64748b" stroke-width="1.5"/><text x="70.0" y="406.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="70.0" dy="0">6 s</tspan></text><line x1="392.5" y1="384.0" x2="392.5" y2="392.0" stroke="#64748b" stroke-width="1.5"/><text x="392.5" y="406.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="392.5" dy="0">9 s</tspan></text><line x1="930.0" y1="384.0" x2="930.0" y2="392.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="406.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">14 s</tspan></text><text x="40.0" y="452.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ DECIDE CADA MÉTODO</tspan></text><rect x="40.0" y="462.0" width="219.5" height="102.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="463.0" width="6.0" height="100.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="486.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="190"><tspan x="58.0" dy="0">Ecografía del primer</tspan><tspan x="58.0" dy="17">trimestre</tspan></text><text x="58.0" y="524.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="190"><tspan x="58.0" dy="0">Longitud cráneo-caudal; error de 5</tspan><tspan x="58.0" dy="16">a 7 días</tspan></text><rect x="273.5" y="462.0" width="219.5" height="102.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="274.5" y="463.0" width="6.0" height="100.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="291.5" y="486.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="190"><tspan x="291.5" dy="0">Regla de Naegele</tspan></text><text x="291.5" y="507.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="190"><tspan x="291.5" dy="0">Solo con ciclo regular y fecha</tspan><tspan x="291.5" dy="16">segura</tspan></text><rect x="507.0" y="462.0" width="219.5" height="102.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="508.0" y="463.0" width="6.0" height="100.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="525.0" y="486.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="190"><tspan x="525.0" dy="0">Altura uterina y movimientos</tspan><tspan x="525.0" dy="17">fetales</tspan></text><text x="525.0" y="524.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="190"><tspan x="525.0" dy="0">Variables y subjetivos</tspan></text><rect x="740.5" y="462.0" width="219.5" height="102.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="741.5" y="463.0" width="6.0" height="100.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="758.5" y="486.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="190"><tspan x="758.5" dy="0">Latidos con Doppler</tspan></text><text x="758.5" y="507.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="190"><tspan x="758.5" dy="0">Desde las 10 a 12 semanas, sin</tspan><tspan x="758.5" dy="16">precisión</tspan></text><text x="40.0" y="598.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">MÉTODOS PARA FECHAR EL EMBARAZO</tspan></text><rect x="40.0" y="610.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="629.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="304"><tspan x="50.0" dy="0">Método</tspan></text><text x="370.0" y="629.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="584"><tspan x="370.0" dy="0">Precisión y limitación</tspan></text><rect x="40.0" y="639.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="658.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="304"><tspan x="50.0" dy="0">Ecografía del primer trimestre</tspan></text><text x="370.0" y="658.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="584"><tspan x="370.0" dy="0">Margen de 5 a 7 días; el más exacto</tspan></text><rect x="260.6" y="642.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="306.0" y="657.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="306.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="668.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="687.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="50.0" dy="0">Regla de Naegele</tspan></text><text x="370.0" y="687.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="584"><tspan x="370.0" dy="0">Depende de ciclo regular, fecha segura y sin anticonceptivos hormonales recientes</tspan></text><rect x="40.0" y="697.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="716.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="50.0" dy="0">Altura uterina</tspan></text><text x="370.0" y="716.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="584"><tspan x="370.0" dy="0">Variabilidad de 2 semanas o más; depende de obesidad, miomas y polihidramnios</tspan></text><rect x="40.0" y="726.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="745.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="50.0" dy="0">Movimientos fetales</tspan></text><text x="370.0" y="745.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="584"><tspan x="370.0" dy="0">Subjetivos; se perciben a las 18-22 semanas</tspan></text><rect x="40.0" y="755.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="774.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="50.0" dy="0">Latidos con Doppler</tspan></text><text x="370.0" y="774.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="584"><tspan x="370.0" dy="0">Aparecen a las 10-12 semanas; no datan con precisión</tspan></text><text x="40.0" y="824.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="834.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="865.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="856.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Dimensiones</tspan><tspan x="285.0" dy="17">uterinas</tspan></text><text x="435.0" y="865.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Movimientos fetales</tspan></text><rect x="513.0" y="837.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="856.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Ecografía del primer</tspan><tspan x="585.0" dy="17">trimestre</tspan></text><text x="735.0" y="865.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Regla de Naegele</tspan></text><text x="885.0" y="856.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Latidos fetales con</tspan><tspan x="885.0" dy="17">Doppler</tspan></text><rect x="40.0" y="888.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="888.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="917.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Mejor alternativa para</tspan><tspan x="54.0" dy="16">fechar el embarazo?</tspan></text><text x="285.0" y="917.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: variabilidad de 2</tspan><tspan x="285.0" dy="16">semanas o más</tspan></text><text x="435.0" y="917.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: subjetivo, entre 18</tspan><tspan x="435.0" dy="16">y 22 semanas</tspan></text><text x="585.0" y="925.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: error de 5 a 7 días</tspan></text><text x="735.0" y="917.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: falla con ciclos</tspan><tspan x="735.0" dy="16">irregulares</tspan></text><text x="885.0" y="909.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: aparecen a las</tspan><tspan x="885.0" dy="16">10-12 semanas, sin</tspan><tspan x="885.0" dy="16">precisión para datar</tspan></text><rect x="40.0" y="834.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="978.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1006.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1028.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Ecografía del primer trimestre: longitud cráneo-caudal entre 7 y 13+6 semanas; margen de error de 5 a 7 días, el más exacto.</tspan><tspan x="58.0" dy="18">• Regla de Naegele: falla con ciclos irregulares, fecha dudosa o anticonceptivos recientes, frecuente en adolescentes; la altura uterina varía 2 semanas o</tspan><tspan x="58.0" dy="18">   más.</tspan><tspan x="58.0" dy="18">• Movimientos fetales (18 a 22 semanas) y latidos con Doppler (10 a 12 semanas) son subjetivos o sin precisión para datar.</tspan><tspan x="58.0" dy="18">• Alerta: se redata con la ecografía solo si difiere de la fecha menstrual más de 5 días antes de 9 semanas o más de 7 días entre 9 y 13+6 semanas.</tspan></text><text x="58.0" y="1122.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG Committee Opinion N.º 700, Methods for estimating the due date (2017); Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>