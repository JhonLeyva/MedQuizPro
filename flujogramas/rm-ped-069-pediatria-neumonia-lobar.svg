<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1369" viewBox="0 0 1000 1369" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Preescolar con fiebre alta, escalofríos, herpes labial y soplo tubárico: neumonía neumocócica"><title>Preescolar con fiebre alta, escalofríos, herpes labial y soplo tubárico: neumonía neumocócica</title><rect x="0.75" y="0.75" width="998.5" height="1367.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · neumonía lobar</tspan></text><rect x="356.5" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="405.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="405.6" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Neumonía neumocócica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">S. pneumoniae es la causa bacteriana más frecuente de neumonía comunitaria en</tspan><tspan x="58.0" dy="17">preescolares.</tspan><tspan x="58.0" dy="17">Inicio brusco con consolidación lobar.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Preescolar de 3 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Fiebre alta, escalofríos, herpes labial, estertores y</tspan><tspan x="640.0" dy="16">soplo tubárico.</tspan><tspan x="640.0" dy="16">Dolor torácico pleurítico.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SE RESPONDE EN ESTE ORDEN</tspan></text><rect x="40.0" y="285.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="330.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="358.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">1</tspan></text><rect x="124.0" y="285.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="313.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Qué síndrome tiene el niño?</tspan></text><rect x="136.0" y="327.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="347.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Consolidación lobar</tspan></text><text x="152.0" y="366.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Fiebre alta, escalofríos, estertores, soplo tubárico y dolor pleurítico.</tspan></text><line x1="77.0" y1="388.0" x2="77.0" y2="407.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,406.0 82.0,406.0 77.0,414.0" fill="#0f766e"/><text x="134.0" y="406.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="416.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="461.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="489.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">2</tspan></text><rect x="124.0" y="416.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="444.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Cuál es el germen más probable?</tspan></text><rect x="136.0" y="458.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="478.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Streptococcus pneumoniae</tspan></text><text x="152.0" y="497.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Inicio brusco y herpes labial; la atípica es del escolar, la viral da sibilancias y la tuberculosa es subaguda.</tspan></text><line x1="77.0" y1="519.0" x2="77.0" y2="538.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,537.0 82.0,537.0 77.0,545.0" fill="#0f766e"/><text x="134.0" y="537.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="547.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="592.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="620.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">3</tspan></text><rect x="124.0" y="547.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="575.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Qué tratamiento corresponde?</tspan></text><rect x="136.0" y="589.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="609.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Amoxicilina en dosis alta</tspan></text><text x="152.0" y="628.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">90 mg/kg/día por 5 a 7 días si es ambulatorio; penicilina o ampicilina IV si se hospitaliza.</tspan></text><rect x="40.0" y="668.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="694.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Preescolar con fiebre alta, herpes labial y soplo tubárico = neumonía neumocócica</tspan></text><text x="60.0" y="713.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Vigilar derrame paraneumónico y empiema.</tspan></text><text x="40.0" y="774.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">NEUMONÍA COMUNITARIA DEL NIÑO SEGÚN EL GERMEN</tspan></text><rect x="40.0" y="786.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="805.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="164"><tspan x="50.0" dy="0">Tipo</tspan></text><text x="230.0" y="805.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="354"><tspan x="230.0" dy="0">Edad y comienzo</tspan></text><text x="600.0" y="805.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="354"><tspan x="600.0" dy="0">Hallazgos</tspan></text><rect x="40.0" y="815.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="834.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="164"><tspan x="50.0" dy="0">Neumocócica</tspan></text><text x="230.0" y="834.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="354"><tspan x="230.0" dy="0">Preescolar; inicio brusco</tspan></text><text x="600.0" y="834.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="354"><tspan x="600.0" dy="0">Fiebre alta, estertores, soplo tubárico, herpes labial;</tspan><tspan x="600.0" dy="15">consolidación lobar</tspan></text><rect x="120.6" y="826.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="166.0" y="841.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="166.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="859.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="878.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="164"><tspan x="50.0" dy="0">Atípica</tspan></text><text x="230.0" y="878.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="354"><tspan x="230.0" dy="0">Escolar; inicio insidioso</tspan></text><text x="600.0" y="878.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="354"><tspan x="600.0" dy="0">Tos seca y cefalea; patrón intersticial</tspan></text><rect x="40.0" y="888.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="907.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="164"><tspan x="50.0" dy="0">Viral</tspan></text><text x="230.0" y="907.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="354"><tspan x="230.0" dy="0">Lactante y preescolar</tspan></text><text x="600.0" y="907.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="354"><tspan x="600.0" dy="0">Sibilancias e infiltrado difuso</tspan></text><rect x="40.0" y="917.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="936.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="164"><tspan x="50.0" dy="0">Aspirativa</tspan></text><text x="230.0" y="936.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="354"><tspan x="230.0" dy="0">Antecedente de atragantamiento o conciencia alterada</tspan></text><text x="600.0" y="936.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="354"><tspan x="600.0" dy="0">Según el segmento aspirado</tspan></text><rect x="40.0" y="946.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="965.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="164"><tspan x="50.0" dy="0">Tuberculosa</tspan></text><text x="230.0" y="965.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="354"><tspan x="230.0" dy="0">Subaguda, contacto conocido</tspan></text><text x="600.0" y="965.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="354"><tspan x="600.0" dy="0">Curso prolongado</tspan></text><text x="40.0" y="1015.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1025.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1056.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1056.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Neumonía atípica</tspan></text><text x="435.0" y="1056.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Neumonía viral</tspan></text><text x="585.0" y="1047.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Neumonía</tspan><tspan x="585.0" dy="17">aspirativa</tspan></text><rect x="663.0" y="1028.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="1047.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Neumonía</tspan><tspan x="735.0" dy="17">neumocócica</tspan></text><text x="885.0" y="1047.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Neumonía por</tspan><tspan x="885.0" dy="17">tuberculosis</tspan></text><rect x="40.0" y="1079.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="1079.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1108.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico más</tspan><tspan x="54.0" dy="16">probable?</tspan></text><text x="285.0" y="1100.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es del escolar, con</tspan><tspan x="285.0" dy="16">tos seca e inicio</tspan><tspan x="285.0" dy="16">insidioso</tspan></text><text x="435.0" y="1100.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: cursa con</tspan><tspan x="435.0" dy="16">sibilancias e infiltrado</tspan><tspan x="435.0" dy="16">difuso</tspan></text><text x="585.0" y="1100.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: exige</tspan><tspan x="585.0" dy="16">atragantamiento o</tspan><tspan x="585.0" dy="16">conciencia alterada</tspan></text><text x="735.0" y="1100.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: inicio brusco, fiebre</tspan><tspan x="735.0" dy="16">alta y consolidación</tspan><tspan x="735.0" dy="16">lobar</tspan></text><text x="885.0" y="1108.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es subaguda y con</tspan><tspan x="885.0" dy="16">contacto conocido</tspan></text><rect x="40.0" y="1025.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1169.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1197.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1219.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Cuadro típico: inicio brusco, fiebre alta, escalofríos, dolor pleurítico, estertores, soplo tubárico y matidez; leucocitosis con neutrofilia y condensación con</tspan><tspan x="58.0" dy="18">   broncograma aéreo.</tspan><tspan x="58.0" dy="18">• El herpes labial por reactivación del virus herpes simple durante la fiebre es un hallazgo clásico de la neumonía neumocócica.</tspan><tspan x="58.0" dy="18">• Tratamiento ambulatorio: amoxicilina 90 mg/kg/día por 5 a 7 días; hospitalizado, penicilina o ampicilina intravenosa.</tspan><tspan x="58.0" dy="18">• Complicaciones: derrame paraneumónico, empiema y absceso. La vacuna antineumocócica conjugada reduce los casos graves.</tspan></text><text x="58.0" y="1313.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: IDSA/PIDS, Management of community-acquired pneumonia in infants and children older than 3 months (Clin Infect Dis 2011;53:e25-76); MINSA, NTS</tspan><tspan x="58.0" dy="15">196-MINSA/DGIESP-2022 (Esquema Nacional de Vacunación, RM 884-2022/MINSA); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>