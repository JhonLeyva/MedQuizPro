<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="910" viewBox="0 0 1000 910" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Cólico en hipocondrio derecho con dispepsia a las grasas en una gestante: colelitiasis"><title>Cólico en hipocondrio derecho con dispepsia a las grasas en una gestante: colelitiasis</title><rect x="0.75" y="0.75" width="998.5" height="909.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Vía biliar · cólico biliar en el embarazo</tspan></text><rect x="424.9" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="468.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="468.1" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Colelitiasis sintomática</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cálculo que se impacta de forma transitoria en el cístico: dolor que cede en menos de 6</tspan><tspan x="58.0" dy="17">horas.</tspan><tspan x="58.0" dy="17">El embarazo favorece los cálculos (estasis por progesterona, más colesterol por</tspan><tspan x="58.0" dy="17">estrógenos).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante de 35 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dispepsia a las grasas y dolor cólico en hipocondrio</tspan><tspan x="640.0" dy="16">derecho.</tspan><tspan x="640.0" dy="16">¿Diagnóstico más probable?</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="377.0" x2="500.0" y2="407.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="407.0" x2="811.3" y2="407.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="407.0" x2="188.7" y2="436.0" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,435.0 193.7,435.0 188.7,443.0" fill="#94a3b8"/><line x1="500.0" y1="407.0" x2="500.0" y2="436.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,435.0 505.0,435.0 500.0,443.0" fill="#94a3b8"/><line x1="811.3" y1="407.0" x2="811.3" y2="436.0" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,435.0 816.3,435.0 811.3,443.0" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#0f766e"/><line x1="500.0" y1="377.0" x2="500.0" y2="407.0" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="407.0" x2="500.0" y2="407.0" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="407.0" x2="188.7" y2="436.0" stroke="#0f766e" stroke-width="3"/><polygon points="183.7,435.0 193.7,435.0 188.7,443.0" fill="#0f766e"/><rect x="62.9" y="416.0" width="251.6" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="188.7" y="428.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">Cede en &lt; 6 h, sin fiebre ni ictericia (este caso)</tspan></text><rect x="390.3" y="416.0" width="219.4" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="500.0" y="428.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">Dura &gt; 6 h, fiebre, Murphy y leucocitosis</tspan></text><rect x="696.7" y="416.0" width="229.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="811.3" y="428.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">Ictericia, coluria o pruebas hepáticas altas</tspan></text><polygon points="240.0,342.0 266.0,307.0 734.0,307.0 760.0,342.0 734.0,377.0 266.0,377.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="342.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="347.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="338.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Dolor en hipocondrio derecho tras comidas grasas: ¿qué</tspan><tspan x="519.0" dy="17">más hay?</tspan></text><rect x="40.0" y="443.0" width="297.3" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="188.7" y="471.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">COLELITIASIS</tspan></text><text x="188.7" y="494.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Cólico biliar</tspan><tspan x="188.7" dy="17">Dieta, analgesia y ecografía</tspan></text><rect x="351.3" y="443.0" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="471.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">COLECISTITIS AGUDA</tspan></text><text x="500.0" y="494.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Antibiótico y colecistectomía</tspan><tspan x="500.0" dy="17">Criterios de Tokio</tspan></text><rect x="662.7" y="443.0" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="471.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">COLEDOCOLITIASIS</tspan></text><text x="811.3" y="494.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Colangio-RM o CPRE</tspan><tspan x="811.3" dy="17">Charcot = colangitis</tspan></text><text x="40.0" y="573.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="583.5" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="606.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="606.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Quiste de colédoco</tspan></text><text x="435.0" y="606.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Coledocolitiasis</tspan></text><text x="585.0" y="606.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Colecistitis aguda</tspan></text><rect x="663.0" y="586.5" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="606.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Colelitiasis</tspan></text><text x="885.0" y="606.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Discinesia vesicular</tspan></text><rect x="40.0" y="620.5" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="620.5" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="657.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="641.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es una</tspan><tspan x="285.0" dy="16">malformación poco</tspan><tspan x="285.0" dy="16">frecuente</tspan></text><text x="435.0" y="649.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: exigiría ictericia o</tspan><tspan x="435.0" dy="16">coluria</tspan></text><text x="585.0" y="649.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: exigiría fiebre y</tspan><tspan x="585.0" dy="16">dolor &gt; 6 horas</tspan></text><text x="735.0" y="649.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: cólico transitorio</tspan><tspan x="735.0" dy="16">tras alimentos grasos</tspan></text><text x="885.0" y="649.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es un diagnóstico</tspan><tspan x="885.0" dy="16">de exclusión</tspan></text><rect x="40.0" y="583.5" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="710.5" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="738.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="760.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Cólico biliar: dolor &lt; 6 h, sin fiebre ni ictericia; ecografía (segura en el embarazo). Tratamiento: dieta, analgésico y espasmolítico.</tspan><tspan x="58.0" dy="18">• Si dura &gt; 6 h con fiebre, Murphy y leucocitosis = colecistitis; con ictericia o coluria = coledocolitiasis; con dolor en barra y lipasa &gt; 3 veces = pancreatitis</tspan><tspan x="58.0" dy="18">   biliar.</tspan><tspan x="58.0" dy="18">• La colecistectomía laparoscópica es segura en cualquier trimestre (SAGES 2017); se indica si hay episodios repetidos o complicación.</tspan><tspan x="58.0" dy="18">• Bandera roja en la gestante: fiebre, ictericia o dolor persistente = hospitalizar, antibióticos y valorar CPRE con protección fetal.</tspan></text><text x="58.0" y="854.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: EsSalud-IETSI, GPC de colelitiasis, colecistitis aguda y coledocolitiasis (GPC N.º 11, 2018); SAGES, laparoscopía en el embarazo (2017); ACOG, cirugía no obstétrica</tspan><tspan x="58.0" dy="15">en el embarazo (CO 775, 2019).</tspan></text></svg>