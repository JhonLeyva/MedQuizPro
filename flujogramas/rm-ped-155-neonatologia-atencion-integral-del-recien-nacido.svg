<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1029" viewBox="0 0 1000 1029" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La visita familiar integral para los nacidos de bajo peso forma parte de la atención integral del recién nacido"><title>La visita familiar integral para los nacidos de bajo peso forma parte de la atención integral del recién nacido</title><rect x="0.75" y="0.75" width="998.5" height="1027.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neonatología · atención integral del recién nacido</tspan></text><rect x="493.2" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="542.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="542.3" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Atención integral neonatal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Abarca desde el nacimiento hasta los 28 días, el periodo de mayor riesgo.</tspan><tspan x="58.0" dy="17">Incluye atención inmediata, tamizajes, vacunas y controles.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de contenido</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué alternativa corresponde a la atención integral de</tspan><tspan x="640.0" dy="16">salud del recién nacido?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SE HACE Y CUÁNDO EN LOS PRIMEROS 28 DÍAS</tspan></text><rect x="40.0" y="269.0" width="920.0" height="34.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="52.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="174"><tspan x="52.0" dy="0">INTERVENCIÓN</tspan></text><text x="275.8" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="88"><tspan x="275.8" dy="0">Al nacer</tspan></text><text x="367.4" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="88"><tspan x="367.4" dy="0">48 h del alta</tspan></text><text x="459.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="88"><tspan x="459.0" dy="0">7 días</tspan></text><text x="550.6" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="88"><tspan x="550.6" dy="0">14 días</tspan></text><text x="642.2" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="88"><tspan x="642.2" dy="0">21 días</tspan></text><text x="704.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="250"><tspan x="704.0" dy="0">DETALLE</tspan></text><rect x="40.0" y="309.0" width="182.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="339.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="50.0" dy="0">Atención inmediata</tspan></text><line x1="238.0" y1="335.0" x2="680.0" y2="335.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="275.8" cy="330.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="275.8" y="334.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="275.8" dy="0">✓</tspan></text><text x="275.8" y="357.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="88"><tspan x="275.8" dy="0">1.ª hora</tspan></text><rect x="700.0" y="309.0" width="260.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="710.0" y="339.0" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="240"><tspan x="710.0" dy="0">Piel con piel, clampeo oportuno y lactancia.</tspan></text><rect x="40.0" y="367.0" width="182.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="389.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="50.0" dy="0">Vitamina K y BCG, hepatitis</tspan><tspan x="50.0" dy="16">B</tspan></text><line x1="238.0" y1="393.0" x2="680.0" y2="393.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="275.8" cy="388.0" r="13" fill="#16a34a" stroke="#16a34a" stroke-width="2"/><text x="275.8" y="392.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="275.8" dy="0">✓</tspan></text><text x="275.8" y="415.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="88"><tspan x="275.8" dy="0">Al nacer</tspan></text><rect x="700.0" y="367.0" width="260.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="710.0" y="397.0" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="240"><tspan x="710.0" dy="0">Profilaxis y vacunas.</tspan></text><rect x="40.0" y="425.0" width="182.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="455.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="50.0" dy="0">Control del recién nacido</tspan></text><line x1="238.0" y1="451.0" x2="680.0" y2="451.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="367.4" cy="446.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="367.4" y="473.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="88"><tspan x="367.4" dy="0">Control</tspan></text><circle cx="459.0" cy="446.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="459.0" y="473.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="88"><tspan x="459.0" dy="0">Control</tspan></text><circle cx="550.6" cy="446.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="550.6" y="473.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="88"><tspan x="550.6" dy="0">Control</tspan></text><circle cx="642.2" cy="446.0" r="13" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="642.2" y="473.0" font-size="9.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="88"><tspan x="642.2" dy="0">Control</tspan></text><rect x="700.0" y="425.0" width="260.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="710.0" y="455.0" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="240"><tspan x="710.0" dy="0">48 h del alta y 7, 14, 21 días.</tspan></text><rect x="40.0" y="483.0" width="182.0" height="52.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="513.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="50.0" dy="0">Visita familiar integral</tspan></text><line x1="238.0" y1="509.0" x2="680.0" y2="509.0" stroke="#e2e8f0" stroke-width="2"/><circle cx="367.4" cy="504.0" r="13" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="367.4" y="508.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="367.4" dy="0">!</tspan></text><text x="367.4" y="531.0" font-size="9.5" font-weight="700" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="88"><tspan x="367.4" dy="0">Riesgo</tspan></text><circle cx="459.0" cy="504.0" r="13" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="459.0" y="508.5" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="459.0" dy="0">!</tspan></text><text x="459.0" y="531.0" font-size="9.5" font-weight="700" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="88"><tspan x="459.0" dy="0">Riesgo</tspan></text><rect x="700.0" y="483.0" width="260.0" height="52.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="710.0" y="505.5" font-size="11" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="240"><tspan x="710.0" dy="0">Bajo peso menor de 2500 g, prematuridad o</tspan><tspan x="710.0" dy="15">asfixia.</tspan></text><text x="44.0" y="555.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="44.0" dy="0">✓ dada · ! visita del recién nacido con factores de riesgo · círculo vacío = control programado</tspan></text><rect x="40.0" y="579.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="605.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Bajo peso = visita familiar integral</tspan></text><text x="60.0" y="624.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">IRA y enfermedades prevalentes son prioridades de la etapa siguiente.</tspan></text><text x="40.0" y="691.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="701.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="740.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="704.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="732.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Visita familiar</tspan><tspan x="285.0" dy="17">integral</tspan></text><text x="435.0" y="732.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Prioridades</tspan><tspan x="435.0" dy="17">sanitarias: IRA</tspan></text><text x="585.0" y="732.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Evaluación</tspan><tspan x="585.0" dy="17">musculoesquelética</tspan></text><text x="735.0" y="723.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Prevención de</tspan><tspan x="735.0" dy="17">enfermedades</tspan><tspan x="735.0" dy="17">prevalentes</tspan></text><text x="885.0" y="723.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Educación de</tspan><tspan x="885.0" dy="17">padres sobre</tspan><tspan x="885.0" dy="17">higiene</tspan></text><rect x="40.0" y="772.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="772.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="801.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Corresponde al recién</tspan><tspan x="54.0" dy="16">nacido?</tspan></text><text x="285.0" y="801.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: para nacidos de</tspan><tspan x="285.0" dy="16">bajo peso</tspan></text><text x="435.0" y="801.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: corresponde a otra</tspan><tspan x="435.0" dy="16">etapa de vida</tspan></text><text x="585.0" y="793.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es parte del</tspan><tspan x="585.0" dy="16">examen físico, no una</tspan><tspan x="585.0" dy="16">intervención</tspan></text><text x="735.0" y="801.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: corresponde a otra</tspan><tspan x="735.0" dy="16">etapa de vida</tspan></text><text x="885.0" y="793.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no es componente</tspan><tspan x="885.0" dy="16">exclusivo del recién</tspan><tspan x="885.0" dy="16">nacido</tspan></text><rect x="40.0" y="701.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="862.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="890.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="912.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Atención inmediata: secado, piel con piel, clampeo oportuno del cordón y lactancia en la primera hora; profilaxis oftálmica y vitamina K; BCG y hepatitis B.</tspan><tspan x="58.0" dy="18">• Tamizaje neonatal metabólico, auditivo y de cardiopatías congénitas; lactancia exclusiva; estimulación temprana y consejería sobre signos de alarma.</tspan><tspan x="58.0" dy="18">• Con factores de riesgo (bajo peso menor de 2500 g, prematuridad, asfixia) se programa la visita familiar integral.</tspan><tspan x="58.0" dy="18">• Controles: a las 48 horas del alta y luego a los 7, 14 y 21 días. Las prioridades sanitarias como IRA corresponden a la etapa de 29 días a 11 años.</tspan></text><text x="58.0" y="988.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: NTS 214-2024, Atención integral neonatal (MINSA); OMS, Recomendaciones sobre la atención posnatal de la madre y el recién nacido (2022).</tspan></text></svg>