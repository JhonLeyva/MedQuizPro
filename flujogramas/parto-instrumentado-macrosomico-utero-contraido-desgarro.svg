ormal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="356.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Hemorragia posparto: ¿el útero está bien contraído?</tspan></text><rect x="40.0" y="447.0" width="453.0" height="73.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="475.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">DESGARRO DEL CANAL</tspan></text><text x="266.5" y="498.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Revisar y suturar</tspan></text><rect x="507.0" y="447.0" width="453.0" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="475.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Atonía</tspan></text><text x="733.5" y="498.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Masaje, oxitocina</tspan></text><text x="40.0" y="560.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="572.5" width="920.0" height="346.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="586.5" width="322.9" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="217.5" y="606.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="217.5" dy="0">LAS 4 «T» DE LA HEMORRAGIA POSPARTO</tspan></text><text x="394.9" y="606.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="547"><tspan x="394.9" dy="0">Causas de la hemorragia posparto.</tspan></text><rect x="56.0" y="646.5" width="213.0" height="121.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="647.1" width="211.8" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="162.5" y="674.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="197"><tspan x="162.5" dy="0">TONO</tspan></text><text x="162.5" y="694.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="189"><tspan x="162.5" dy="0">Atonía</tspan></text><circle cx="72.0" cy="719.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="723.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="82.0" dy="0">70 %</tspan></text><circle cx="72.0" cy="742.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="746.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="82.0" dy="0">Útero blando</tspan></text><rect x="281.0" y="646.5" width="213.0" height="121.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="281.6" y="647.1" width="211.8" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="387.5" y="674.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="197"><tspan x="387.5" dy="0">TEJIDO</tspan></text><text x="387.5" y="694.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="189"><tspan x="387.5" dy="0">Restos</tspan></text><circle cx="297.0" cy="719.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="307.0" y="723.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="307.0" dy="0">Placenta incompleta</tspan></text><rect x="506.0" y="646.5" width="213.0" height="121.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="507.2" y="647.7" width="210.6" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="612.5" y="674.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="197"><tspan x="612.5" dy="0">TRAUMA</tspan></text><text x="612.5" y="694.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="189"><tspan x="612.5" dy="0">Desgarros, rotura</tspan></text><circle cx="522.0" cy="719.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="532.0" y="723.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="175"><tspan x="532.0" dy="0">Útero contraído, sangre roja</tspan></text><rect x="567.1" y="635.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="612.5" y="650.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="612.5" dy="0">◆ ESTE CASO</tspan></text><rect x="731.0" y="646.5" width="213.0" height="121.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="731.6" y="647.1" width="211.8" height="63.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="837.5" y="674.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="197"><tspan x="837.5" dy="0">TROMBINA</tspan></text><text x="837.5" y="694.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="189"><tspan x="837.5" dy="0">Coagulopatía</tspan></text><circle cx="747.0" cy="719.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="757.0" y="723.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="175"><tspan x="757.0" dy="0">No coagula</tspan></text><text x="56.0" y="797.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="806.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="821.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="821.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Útero contraído</tspan></text><rect x="56.0" y="828.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="843.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="843.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Parto instrumentado y macrosomía</tspan></text><rect x="56.0" y="865.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="888.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Revisar el canal, suturar y reponer volumen.</tspan></text><text x="40.0" y="958.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="968.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="999.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="999.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Atonía uterina</tspan></text><rect x="363.0" y="971.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="991.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Lesión del canal del</tspan><tspan x="435.0" dy="17">parto</tspan></text><text x="585.0" y="991.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Acretismo</tspan><tspan x="585.0" dy="17">placentario</tspan></text><text x="735.0" y="991.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Trastorno de</tspan><tspan x="735.0" dy="17">coagulación</tspan></text><text x="885.0" y="999.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Inversión uterina</tspan></text><rect x="40.0" y="1022.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="1022.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1051.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="1043.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: el útero está</tspan><tspan x="285.0" dy="16">contraído</tspan></text><text x="435.0" y="1043.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: útero firme + parto</tspan><tspan x="435.0" dy="16">traumático</tspan></text><text x="585.0" y="1043.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: la placenta salió</tspan><tspan x="585.0" dy="16">normal</tspan></text><text x="735.0" y="1043.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Posible, pero aquí hay</tspan><tspan x="735.0" dy="16">un factor obvio</tspan></text><text x="885.0" y="1043.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: el útero está en su</tspan><tspan x="885.0" dy="16">lugar</tspan></text><rect x="40.0" y="968.5" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1096.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1124.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1146.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Revisar el canal con buena luz y valvas; suturar los desgarros (también el cuello).</tspan><tspan x="58.0" dy="18">• Reponer volumen, sangre si hace falta, ácido tranexámico.</tspan><tspan x="58.0" dy="18">• Hematoma vaginal o vulvar: dolor intenso y masa; drenarlo si crece.</tspan></text><text x="58.0" y="1204.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, hemorragia posparto (2023); ACOG, boletín 183; MINSA Perú.</tspan></text></svg>