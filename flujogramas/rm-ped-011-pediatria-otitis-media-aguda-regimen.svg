<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1279" viewBox="0 0 1000 1279" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Otitis media aguda en una niña de 3 años: amoxicilina 80-90 mg/kg/día, no cotrimoxazol ni macrólidos"><title>Otitis media aguda en una niña de 3 años: amoxicilina 80-90 mg/kg/día, no cotrimoxazol ni macrólidos</title><rect x="0.75" y="0.75" width="998.5" height="1277.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · otitis media aguda, régimen</tspan></text><rect x="427.6" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="476.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="476.7" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Otitis media aguda unilateral</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Mayor de 2 años, con abombamiento leve y fiebre menor de 39 °C: enfermedad no grave.</tspan><tspan x="58.0" dy="17">La AAP admite observación vigilada o tratamiento.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niña de 3 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dolor de oído izquierdo por 1 día y fiebre de 38,5 °C.</tspan><tspan x="640.0" dy="16">Membrana timpánica eritematosa y ligeramente</tspan><tspan x="640.0" dy="16">abombada.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DECIDIR, TRATAR Y QUÉ HACER SI FALLA</tspan></text><rect x="40.0" y="285.0" width="920.0" height="83.0" rx="0" fill="#e0f2fe" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="285.0" width="112.0" height="83.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="330.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Decidir</tspan></text><rect x="40.0" y="368.0" width="920.0" height="83.0" rx="0" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="368.0" width="112.0" height="83.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="413.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Tratar</tspan></text><rect x="40.0" y="451.0" width="920.0" height="99.0" rx="0" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="451.0" width="112.0" height="99.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="504.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Si falla</tspan></text><line x1="472.0" y1="326.5" x2="479.0" y2="326.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="479.0,331.5 479.0,321.5 488.0,326.5" fill="#0f766e"/><line x1="638.0" y1="353.0" x2="331.0" y2="380.2" stroke="#ea580c" stroke-width="2.2"/><polygon points="330.5,375.2 331.4,385.2 322.0,381.0" fill="#ea580c"/><line x1="322.0" y1="436.0" x2="322.0" y2="455.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="317.0,455.0 327.0,455.0 322.0,464.0" fill="#0f766e"/><rect x="172.0" y="300.0" width="300.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="316.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Unilateral, T &lt; 39 °C, menos de 48 horas</tspan></text><text x="182.0" y="333.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Enfermedad no grave a los 3 años</tspan></text><circle cx="172.0" cy="300.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="304.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">1</tspan></text><rect x="488.0" y="300.0" width="300.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="498.0" y="316.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="498.0" dy="0">Observación vigilada 48-72 horas</tspan></text><text x="498.0" y="333.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="498.0" dy="0">Solo con analgesia y seguimiento asegurado</tspan></text><circle cx="488.0" cy="300.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="488.0" y="304.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="488.0" dy="0">2</tspan></text><rect x="172.0" y="383.0" width="300.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="182.0" y="399.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Amoxicilina 80-90 mg/kg/día en 2 tomas</tspan></text><text x="182.0" y="416.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">7 días a esta edad</tspan></text><circle cx="172.0" cy="383.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="387.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">3</tspan></text><rect x="172.0" y="466.0" width="300.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="482.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Amoxicilina con clavulanato</tspan></text><text x="182.0" y="499.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Conjuntivitis purulenta, amoxicilina previa o falla a las</tspan><tspan x="182.0" dy="14.5">48-72 horas</tspan></text><circle cx="172.0" cy="466.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="470.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">4</tspan></text><rect x="40.0" y="568.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="594.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Si se trata: amoxicilina 80-90 mg/kg/día</tspan></text><text x="60.0" y="613.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Cotrimoxazol, azitromicina y cefalexina no son de elección.</tspan></text><text x="40.0" y="674.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OTITIS MEDIA AGUDA: TRATAR U OBSERVAR (AAP 2013)</tspan></text><rect x="40.0" y="686.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="705.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Edad</tspan></text><text x="280.0" y="705.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Cuadro</tspan></text><text x="625.0" y="705.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Conducta</tspan></text><rect x="40.0" y="715.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="734.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Menor de 6 meses</tspan></text><text x="280.0" y="734.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Cualquier cuadro</tspan></text><text x="625.0" y="734.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Antibiótico</tspan></text><rect x="40.0" y="744.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="763.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">6 a 23 meses</tspan></text><text x="280.0" y="763.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Bilateral, o con síntomas graves</tspan></text><text x="625.0" y="763.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Antibiótico</tspan></text><rect x="40.0" y="773.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="792.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">6 a 23 meses</tspan></text><text x="280.0" y="792.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Unilateral no grave</tspan></text><text x="625.0" y="792.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Antibiótico u observación vigilada</tspan></text><rect x="40.0" y="802.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="821.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">24 meses o más</tspan></text><text x="280.0" y="821.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Síntomas graves</tspan></text><text x="625.0" y="821.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Antibiótico</tspan></text><rect x="40.0" y="831.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="850.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">24 meses o más</tspan></text><text x="280.0" y="850.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">No grave, uni o bilateral</tspan></text><text x="625.0" y="850.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Antibiótico u observación vigilada 48-72 horas</tspan></text><rect x="170.6" y="834.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="216.0" y="849.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="216.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="876.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Grave: otalgia moderada o intensa por más de 48 horas, o fiebre de 39 °C o más. Si la observación es opción, se necesita seguimiento asegurado.</tspan></text><text x="40.0" y="923.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="933.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="972.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="936.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="964.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Amoxicilina 80-90</tspan><tspan x="285.0" dy="17">mg/kg/día</tspan></text><text x="435.0" y="964.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">TMP/SMX 8</tspan><tspan x="435.0" dy="17">mg/kg/día</tspan></text><text x="585.0" y="955.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Amoxicilina/ácido</tspan><tspan x="585.0" dy="17">clavulánico 25</tspan><tspan x="585.0" dy="17">mg/kg/día</tspan></text><text x="735.0" y="964.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Azitromicina 40</tspan><tspan x="735.0" dy="17">mg/kg/día</tspan></text><text x="885.0" y="964.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Cefalexina 10</tspan><tspan x="885.0" dy="17">mg/kg/día</tspan></text><rect x="40.0" y="1004.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1004.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1033.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Régimen más</tspan><tspan x="54.0" dy="16">apropiado?</tspan></text><text x="285.0" y="1025.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: dosis alta que</tspan><tspan x="285.0" dy="16">cubre neumococo</tspan><tspan x="285.0" dy="16">resistente</tspan></text><text x="435.0" y="1033.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: alta resistencia</tspan><tspan x="435.0" dy="16">neumocócica</tspan></text><text x="585.0" y="1033.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: dosis</tspan><tspan x="585.0" dy="16">subterapéutica</tspan></text><text x="735.0" y="1033.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: cobertura</tspan><tspan x="735.0" dy="16">insuficiente</tspan></text><text x="885.0" y="1025.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: cobertura</tspan><tspan x="885.0" dy="16">insuficiente y dosis</tspan><tspan x="885.0" dy="16">baja</tspan></text><rect x="40.0" y="933.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1094.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1122.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1144.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Si se decide tratar, o si empeora, el fármaco de elección es la amoxicilina a 80-90 mg/kg/día en dos tomas por 7 días a esta edad; cubre neumococo de</tspan><tspan x="58.0" dy="18">   sensibilidad intermedia.</tspan><tspan x="58.0" dy="18">• El cotrimoxazol tiene alta resistencia neumocócica; azitromicina y cefalexina cubren mal neumococo y H. influenzae; 25 mg/kg/día es subterapéutica.</tspan><tspan x="58.0" dy="18">• Amoxicilina con clavulanato se reserva para conjuntivitis purulenta, amoxicilina en los 30 días previos o falla terapéutica.</tspan><tspan x="58.0" dy="18">• Perla: la otalgia mejora con analgésicos en pocas horas; el antibiótico solo acorta el curso 1 a 2 días, por eso se individualiza (receta diferida).</tspan></text><text x="58.0" y="1238.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Lieberthal AS et al., The Diagnosis and Management of Acute Otitis Media, AAP, Pediatrics 2013;131:e964; Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>