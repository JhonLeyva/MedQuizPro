<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="945" viewBox="0 0 1000 945" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La tríada del asma es broncoespasmo, edema de la mucosa e hipersecreción bronquial"><title>La tríada del asma es broncoespasmo, edema de la mucosa e hipersecreción bronquial</title><rect x="0.75" y="0.75" width="998.5" height="943.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neumología · fisiopatología del asma</tspan></text><rect x="419.4" y="32.0" width="114.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="476.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="99"><tspan x="476.9" dy="0">NEUMOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Asma bronquial</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Inflamación crónica de tipo 2: mastocitos, eosinófilos y linfocitos Th2.</tspan><tspan x="58.0" dy="17">Liberan histamina, leucotrienos cisteínicos, prostaglandinas y IL-4, 5 y 13.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cómo se caracteriza la tríada fisiopatológica del asma</tspan><tspan x="640.0" dy="16">bronquial?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">LOS TRES COMPONENTES DE LA OBSTRUCCIÓN EN EL ASMA</tspan></text><rect x="40.0" y="269.0" width="453.0" height="79.0" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2.4"/><text x="54.0" y="296.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Broncoespasmo</tspan></text><text x="54.0" y="313.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Contracción del músculo liso bronquial</tspan><tspan x="54.0" dy="16">Responde al beta-2 agonista</tspan></text><rect x="391.2" y="258.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="436.6" y="273.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="436.6" dy="0">◆ ESTE CASO</tspan></text><rect x="507.0" y="269.0" width="453.0" height="79.0" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2.4"/><text x="521.0" y="296.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Edema de la mucosa</tspan></text><text x="521.0" y="313.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Aumento de la permeabilidad vascular</tspan><tspan x="521.0" dy="16">Responde al corticoide</tspan></text><rect x="858.2" y="258.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="903.6" y="273.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="903.6" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="362.0" width="453.0" height="79.0" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2.4"/><text x="54.0" y="389.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Hipersecreción de moco</tspan></text><text x="54.0" y="406.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="54.0" dy="0">Células caliciformes y glándulas submucosas</tspan><tspan x="54.0" dy="16">Tapones mucosos en las crisis graves</tspan></text><rect x="391.2" y="351.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="436.6" y="366.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="436.6" dy="0">◆ ESTE CASO</tspan></text><rect x="507.0" y="362.0" width="453.0" height="79.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/><text x="521.0" y="389.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Lo que no es de la tríada</tspan></text><text x="521.0" y="406.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="425"><tspan x="521.0" dy="0">Sangrado de la mucosa</tspan><tspan x="521.0" dy="16">Secreción mucopurulenta: solo con sobreinfección</tspan></text><rect x="40.0" y="459.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="485.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Broncoespasmo + edema + hipersecreción</tspan></text><text x="60.0" y="504.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La remodelación crónica explica la obstrucción parcialmente irreversible.</tspan></text><text x="40.0" y="571.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="581.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="620.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="584.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="603.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Broncoespasmo,</tspan><tspan x="285.0" dy="17">edema e</tspan><tspan x="285.0" dy="17">hipersecreción</tspan></text><text x="435.0" y="603.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Broncoconstricción,</tspan><tspan x="435.0" dy="17">sangrado y</tspan><tspan x="435.0" dy="17">broncorrea</tspan></text><text x="585.0" y="603.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Broncoespasmo,</tspan><tspan x="585.0" dy="17">flogosis y poca</tspan><tspan x="585.0" dy="17">secreción</tspan></text><text x="735.0" y="603.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Broncoconstricción,</tspan><tspan x="735.0" dy="17">descamación y</tspan><tspan x="735.0" dy="17">broncorrea</tspan></text><text x="885.0" y="603.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Broncoespasmo,</tspan><tspan x="885.0" dy="17">edema y secreción</tspan><tspan x="885.0" dy="17">mucopurulenta</tspan></text><rect x="40.0" y="652.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="652.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="689.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tríada del asma?</tspan></text><text x="285.0" y="673.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: broncoespasmo,</tspan><tspan x="285.0" dy="16">edema e</tspan><tspan x="285.0" dy="16">hipersecreción</tspan></text><text x="435.0" y="681.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: el sangrado de la</tspan><tspan x="435.0" dy="16">mucosa no forma parte</tspan></text><text x="585.0" y="681.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: la secreción no es</tspan><tspan x="585.0" dy="16">escasa</tspan></text><text x="735.0" y="681.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: la descamación es</tspan><tspan x="735.0" dy="16">hallazgo histológico</tspan></text><text x="885.0" y="673.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no es</tspan><tspan x="885.0" dy="16">mucopurulenta salvo</tspan><tspan x="885.0" dy="16">sobreinfección</tspan></text><rect x="40.0" y="581.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="742.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="770.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="792.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Broncoespasmo (músculo liso), edema de la pared (permeabilidad vascular) e hipersecreción de moco (células caliciformes y glándulas submucosas, con</tspan><tspan x="58.0" dy="18">   tapones en las crisis graves).</tspan><tspan x="58.0" dy="18">• A largo plazo hay remodelación: membrana basal engrosada, hipertrofia del músculo liso y fibrosis subepitelial, con obstrucción parcialmente irreversible.</tspan><tspan x="58.0" dy="18">• No forman parte de la tríada el sangrado de la mucosa ni la secreción mucopurulenta (solo con sobreinfección); la descamación epitelial es hallazgo</tspan><tspan x="58.0" dy="18">   histológico.</tspan><tspan x="58.0" dy="18">• Alerta: el beta-2 corrige el broncoespasmo, pero el edema y el moco exigen antiinflamatorio: el corticoide es la base del control.</tspan></text><text x="58.0" y="904.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: GINA 2025; Harrison, 21.ª ed. (2022); Robbins y Cotran, 10.ª ed. (2021).</tspan></text></svg>