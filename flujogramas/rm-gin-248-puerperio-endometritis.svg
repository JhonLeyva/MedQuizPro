<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1171" viewBox="0 0 1000 1171" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El factor de riesgo más importante de infección puerperal es el parto por cesárea"><title>El factor de riesgo más importante de infección puerperal es el parto por cesárea</title><rect x="0.75" y="0.75" width="998.5" height="1169.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Puerperio · endometritis</tspan></text><rect x="344.2" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="424.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="424.0" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección puerperal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La más frecuente es la endometritis, polimicrobiana y ascendente.</tspan><tspan x="58.0" dy="17">Fiebre, dolor uterino y loquios malolientes dentro de los 10 días.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de riesgo</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es el factor de riesgo más importante para la</tspan><tspan x="640.0" dy="16">infección puerperal?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">FRECUENCIA DE ENDOMETRITIS SEGÚN LA VÍA DEL PARTO</tspan></text><rect x="40.0" y="269.0" width="920.0" height="151.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="295.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Endometritis (%)</tspan></text><text x="60.0" y="314.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La incidencia crece con la cesárea, sobre todo si se hace con el trabajo de parto iniciado.</tspan></text><rect x="70.0" y="344.0" width="172.0" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="156.0" y="369.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="162"><tspan x="156.0" dy="0">Parto vaginal: 1 a 3 %</tspan></text><rect x="242.0" y="344.0" width="473.0" height="40.0" rx="6" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/><text x="478.5" y="369.0" font-size="12" font-weight="800" font-style="normal" fill="#c2410c" text-anchor="middle" data-max="463"><tspan x="478.5" dy="0">Cesárea programada: 5 a 15 %</tspan></text><rect x="715.0" y="344.0" width="215.0" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="822.5" y="369.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="205"><tspan x="822.5" dy="0">Con trabajo: 15 a 20 %</tspan></text><line x1="70.0" y1="384.0" x2="70.0" y2="392.0" stroke="#64748b" stroke-width="1.5"/><text x="70.0" y="406.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="70.0" dy="0">0 %</tspan></text><line x1="199.0" y1="384.0" x2="199.0" y2="392.0" stroke="#64748b" stroke-width="1.5"/><text x="199.0" y="406.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="199.0" dy="0">3 %</tspan></text><line x1="285.0" y1="384.0" x2="285.0" y2="392.0" stroke="#64748b" stroke-width="1.5"/><text x="285.0" y="406.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="285.0" dy="0">5 %</tspan></text><line x1="500.0" y1="384.0" x2="500.0" y2="392.0" stroke="#64748b" stroke-width="1.5"/><text x="500.0" y="406.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="500.0" dy="0">10 %</tspan></text><line x1="715.0" y1="384.0" x2="715.0" y2="392.0" stroke="#64748b" stroke-width="1.5"/><text x="715.0" y="406.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="715.0" dy="0">15 %</tspan></text><line x1="930.0" y1="384.0" x2="930.0" y2="392.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="406.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">20 %</tspan></text><text x="40.0" y="452.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ PESA EN EL RIESGO</tspan></text><rect x="40.0" y="462.0" width="297.3" height="102.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="463.0" width="6.0" height="100.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="486.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Parto por cesárea</tspan></text><text x="58.0" y="507.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Factor individual más importante: opción correcta</tspan></text><rect x="351.3" y="462.0" width="297.3" height="102.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="463.0" width="6.0" height="100.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="486.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Trabajo prolongado, tactos y líquido</tspan><tspan x="369.3" dy="17">meconial</tspan></text><text x="369.3" y="524.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Aumentan la exposición bacteriana, con menor</tspan><tspan x="369.3" dy="16">peso</tspan></text><rect x="662.7" y="462.0" width="297.3" height="102.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="463.0" width="6.0" height="100.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="486.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Obesidad</tspan></text><text x="680.7" y="507.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Contribuye sobre todo al aumentar la cesárea</tspan></text><text x="40.0" y="598.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">FACTORES DE RIESGO DE ENDOMETRITIS PUERPERAL</tspan></text><rect x="40.0" y="610.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="629.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Factor</tspan></text><text x="320.0" y="629.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Efecto</tspan></text><text x="645.0" y="629.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">Peso</tspan></text><rect x="40.0" y="639.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="658.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Cesárea</tspan></text><text x="320.0" y="658.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Incisión, tejido desvitalizado y suturas favorecen las</tspan><tspan x="320.0" dy="15">bacterias</tspan></text><text x="645.0" y="658.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">El mayor</tspan></text><rect x="210.6" y="650.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="256.0" y="665.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="256.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="683.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="702.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Trabajo de parto prolongado y múltiples</tspan><tspan x="50.0" dy="15">tactos</tspan></text><text x="320.0" y="702.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Mayor exposición bacteriana</tspan></text><text x="645.0" y="702.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">Menor</tspan></text><rect x="40.0" y="727.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="746.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="50.0" dy="0">Líquido meconial y obesidad</tspan></text><text x="320.0" y="746.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="320.0" dy="0">Aumentan la probabilidad de cesárea</tspan></text><text x="645.0" y="746.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="309"><tspan x="645.0" dy="0">Menor</tspan></text><text x="40.0" y="796.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="806.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="837.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="809.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="837.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Parto por cesárea</tspan></text><text x="435.0" y="828.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Trabajo de parto</tspan><tspan x="435.0" dy="17">prolongado</tspan></text><text x="585.0" y="828.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Número de tactos</tspan><tspan x="585.0" dy="17">vaginales</tspan></text><text x="735.0" y="837.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Líquido meconial</tspan></text><text x="885.0" y="837.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Obesidad</tspan></text><rect x="40.0" y="860.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="860.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="889.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Factor de riesgo más</tspan><tspan x="54.0" dy="16">importante?</tspan></text><text x="285.0" y="881.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: incisión y tejido</tspan><tspan x="285.0" dy="16">desvitalizado</tspan><tspan x="285.0" dy="16">favorecen la infección</tspan></text><text x="435.0" y="889.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: contribuye, pero</tspan><tspan x="435.0" dy="16">con menor peso</tspan></text><text x="585.0" y="881.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: aumenta la</tspan><tspan x="585.0" dy="16">exposición bacteriana,</tspan><tspan x="585.0" dy="16">pero pesa menos</tspan></text><text x="735.0" y="889.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: contribuye, pero</tspan><tspan x="735.0" dy="16">con menor peso</tspan></text><text x="885.0" y="889.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: contribuye, pero</tspan><tspan x="885.0" dy="16">con menor peso</tspan></text><rect x="40.0" y="806.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="950.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="978.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1000.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La vía del parto pesa más: endometritis de 1-3 % tras parto vaginal, 5-15 % en cesárea programada y 15-20 % si la cesárea es tras iniciado el trabajo de</tspan><tspan x="58.0" dy="18">   parto o la rotura de membranas.</tspan><tspan x="58.0" dy="18">• Trabajo prolongado, tactos vaginales, líquido meconial y obesidad contribuyen sobre todo al aumentar la cesárea o la exposición bacteriana, con menor</tspan><tspan x="58.0" dy="18">   peso.</tspan><tspan x="58.0" dy="18">• Profilaxis en cesárea: cefazolina antes de la incisión, más azitromicina si hay trabajo de parto. Tratamiento: clindamicina más gentamicina hasta 24-48</tspan><tspan x="58.0" dy="18">   horas sin fiebre.</tspan><tspan x="58.0" dy="18">• Alerta: fiebre persistente tras 72 horas de antibióticos obliga a buscar absceso, hematoma infectado o tromboflebitis pélvica séptica.</tspan></text><text x="58.0" y="1130.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, Practice Bulletin 199, Use of prophylactic antibiotics in labor and delivery. Obstet Gynecol 2018;132:e103-19; Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>