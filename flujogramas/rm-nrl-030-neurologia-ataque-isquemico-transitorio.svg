<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1221" viewBox="0 0 1000 1221" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Clásicamente el ataque isquémico transitorio se resuelve por completo en menos de 24 horas"><title>Clásicamente el ataque isquémico transitorio se resuelve por completo en menos de 24 horas</title><rect x="0.75" y="0.75" width="998.5" height="1219.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neurología · ataque isquémico transitorio</tspan></text><rect x="445.4" y="32.0" width="113.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="502.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="98"><tspan x="502.3" dy="0">NEUROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ataque isquémico transitorio</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Episodio transitorio de disfunción neurológica por isquemia focal cerebral, medular o</tspan><tspan x="58.0" dy="17">retiniana.</tspan><tspan x="58.0" dy="17">La definición moderna es tisular: sin infarto en las imágenes.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de definición</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿En cuántas horas se resuelven por completo los</tspan><tspan x="640.0" dy="16">síntomas para el diagnóstico de isquemia cerebral</tspan><tspan x="640.0" dy="16">transitoria?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL INICIO DEL DÉFICIT A LA DECISIÓN: QUÉ SE HACE Y CUÁNDO</tspan></text><text x="44.0" y="299.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">La duración clásica es menor de 24 horas; el riesgo de ictus exige actuar en horas.</tspan></text><line x1="155.0" y1="338.0" x2="293.0" y2="338.0" stroke="#99f6e4" stroke-width="6"/><line x1="339.0" y1="338.0" x2="477.0" y2="338.0" stroke="#99f6e4" stroke-width="6"/><line x1="523.0" y1="338.0" x2="661.0" y2="338.0" stroke="#99f6e4" stroke-width="6"/><line x1="707.0" y1="338.0" x2="845.0" y2="338.0" stroke="#99f6e4" stroke-width="6"/><circle cx="132.0" cy="338.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="132.0" y="342.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="132.0" dy="0">1</tspan></text><rect x="45.0" y="372.0" width="174.0" height="123.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="132.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">Déficit focal de inicio</tspan><tspan x="132.0" dy="17">súbito</tspan></text><text x="132.0" y="426.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="132.0" dy="0">Debilidad, afasia, pérdida</tspan><tspan x="132.0" dy="16">visual (amaurosis fugaz = AIT</tspan><tspan x="132.0" dy="16">retiniano)</tspan></text><circle cx="316.0" cy="338.0" r="22" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><text x="316.0" y="342.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="38"><tspan x="316.0" dy="0">2</tspan></text><rect x="229.0" y="372.0" width="174.0" height="123.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="316.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">Resolución completa en</tspan><tspan x="316.0" dy="17">menos de 24 horas</tspan></text><text x="316.0" y="426.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="316.0" dy="0">Duración clásica para el</tspan><tspan x="316.0" dy="16">diagnóstico; la mayoría dura</tspan><tspan x="316.0" dy="16">menos de una hora</tspan></text><rect x="274.7" y="484.0" width="82.5" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="316.0" y="499.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="316.0" dy="0">◆ 24 HORAS</tspan></text><circle cx="500.0" cy="338.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="342.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="500.0" dy="0">3</tspan></text><rect x="413.0" y="372.0" width="174.0" height="123.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">Descartar infarto con</tspan><tspan x="500.0" dy="17">imagen</tspan></text><text x="500.0" y="426.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="500.0" dy="0">Resonancia con difusión: si</tspan><tspan x="500.0" dy="16">hay lesión, es ictus</tspan></text><circle cx="684.0" cy="338.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="684.0" y="342.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="684.0" dy="0">4</tspan></text><rect x="597.0" y="372.0" width="174.0" height="123.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="684.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">Estratificar con ABCD2 y</tspan><tspan x="684.0" dy="17">estudiar en 24 a 48 horas</tspan></text><text x="684.0" y="426.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="684.0" dy="0">Imagen cerebral, estudio</tspan><tspan x="684.0" dy="16">vascular y electrocardiograma</tspan></text><circle cx="868.0" cy="338.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="868.0" y="342.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="868.0" dy="0">5</tspan></text><rect x="781.0" y="372.0" width="174.0" height="123.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="868.0" y="392.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">Prevención secundaria</tspan></text><text x="868.0" y="409.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="162"><tspan x="868.0" dy="0">Aspirina más clopidogrel por</tspan><tspan x="868.0" dy="16">21 días en alto riesgo,</tspan><tspan x="868.0" dy="16">estatina, presión y</tspan><tspan x="868.0" dy="16">anticoagulante si hay</tspan><tspan x="868.0" dy="16">fibrilación auricular</tspan></text><rect x="40.0" y="527.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="553.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">AIT clásico = síntomas que se resuelven en menos de 24 horas</tspan></text><text x="60.0" y="572.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Las cifras de 6, 12, 36 y 48 horas no corresponden a ninguna definición.</tspan></text><text x="40.0" y="633.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ESCALA ABCD2 PARA ESTRATIFICAR EL RIESGO TRAS UN AIT</tspan></text><rect x="40.0" y="645.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="664.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Componente</tspan></text><text x="250.0" y="664.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="704"><tspan x="250.0" dy="0">Qué se evalúa</tspan></text><rect x="40.0" y="674.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="693.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">A (edad)</tspan></text><text x="250.0" y="693.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="704"><tspan x="250.0" dy="0">Edad del paciente</tspan></text><rect x="40.0" y="703.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="722.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">B (presión arterial)</tspan></text><text x="250.0" y="722.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="704"><tspan x="250.0" dy="0">Presión arterial al ingreso</tspan></text><rect x="40.0" y="732.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="751.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">C (rasgos clínicos)</tspan></text><text x="250.0" y="751.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="704"><tspan x="250.0" dy="0">Debilidad unilateral o alteración del habla</tspan></text><rect x="40.0" y="761.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="780.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">D (duración)</tspan></text><text x="250.0" y="780.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="704"><tspan x="250.0" dy="0">Duración de los síntomas</tspan></text><rect x="140.6" y="764.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="186.0" y="779.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="186.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="790.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="809.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">D (diabetes)</tspan></text><text x="250.0" y="809.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="704"><tspan x="250.0" dy="0">Presencia de diabetes</tspan></text><text x="40.0" y="835.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Las puntuaciones altas definen el AIT de alto riesgo, que recibe doble antiagregación por 21 días.</tspan></text><text x="40.0" y="882.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="892.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="914.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="895.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="914.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">24</tspan></text><text x="435.0" y="914.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">36</tspan></text><text x="585.0" y="914.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">6</tspan></text><text x="735.0" y="914.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">48</tspan></text><text x="885.0" y="914.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">12</tspan></text><rect x="40.0" y="929.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="929.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="950.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Horas hasta la</tspan><tspan x="54.0" dy="16">resolución total?</tspan></text><text x="285.0" y="950.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: definición clásica</tspan><tspan x="285.0" dy="16">del examen</tspan></text><text x="435.0" y="950.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no corresponde a</tspan><tspan x="435.0" dy="16">ninguna definición</tspan></text><text x="585.0" y="950.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no corresponde a</tspan><tspan x="585.0" dy="16">ninguna definición</tspan></text><text x="735.0" y="950.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no corresponde a</tspan><tspan x="735.0" dy="16">ninguna definición</tspan></text><text x="885.0" y="950.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no corresponde a</tspan><tspan x="885.0" dy="16">ninguna definición</tspan></text><rect x="40.0" y="892.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1003.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1031.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1053.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Definición clásica: déficit focal de origen vascular que se resuelve en menos de 24 horas. AHA/ASA 2009: definición tisular, sin infarto agudo en las</tspan><tspan x="58.0" dy="18">   imágenes.</tspan><tspan x="58.0" dy="18">• La mayoría dura menos de una hora; si la resonancia con difusión muestra lesión es ictus aunque los síntomas se hayan resuelto.</tspan><tspan x="58.0" dy="18">• Urgencia: alto riesgo de ictus a 48 horas y 90 días; escala ABCD2 y estudio en 24 a 48 horas (imagen cerebral, estudio vascular, electrocardiograma).</tspan><tspan x="58.0" dy="18">• Tratamiento: doble antiagregación (aspirina más clopidogrel) por 21 días en AIT de alto riesgo, estatina, control de la presión y anticoagulación si hay</tspan><tspan x="58.0" dy="18">   fibrilación auricular.</tspan></text><text x="58.0" y="1165.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AHA/ASA, Definition and evaluation of transient ischemic attack (Easton, Stroke 2009;40:2276); AHA/ASA, Guideline for the Prevention of Stroke in Patients With Stroke</tspan><tspan x="58.0" dy="15">and TIA (Kleindorfer, Stroke 2021;52:e364).</tspan></text></svg>