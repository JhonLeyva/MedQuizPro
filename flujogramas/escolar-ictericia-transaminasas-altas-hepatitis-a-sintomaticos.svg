<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1005" viewBox="0 0 1000 1005" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Escolar con fiebre, vómitos, coluria, ictericia y transaminasas altas con tiempo de protrombina normal: hepatitis A aguda, hidratación y sintomáticos"><title>Escolar con fiebre, vómitos, coluria, ictericia y transaminasas altas con tiempo de protrombina normal: hepatitis A aguda, hidratación y sintomáticos</title><rect x="0.75" y="0.75" width="998.5" height="1003.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Hepatitis viral aguda</tspan></text><rect x="322.3" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="378.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="378.8" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hepatitis A</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Transmisión fecal-oral (agua y alimentos); en niños suele ser leve y se autolimita; no se</tspan><tspan x="58.0" dy="17">cronifica.</tspan><tspan x="58.0" dy="17">Lo que define la gravedad no son las transaminasas sino la función del hígado: tiempo de</tspan><tspan x="58.0" dy="17">protrombina/INR y encefalopatía.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 10 años, 4 días</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Fiebre, dolor abdominal, vómitos, coluria; come en el</tspan><tspan x="640.0" dy="16">quiosco escolar.</tspan><tspan x="640.0" dy="16">Ictericia y hepatomegalia; TGO 740, TGP 1020; TP</tspan><tspan x="640.0" dy="16">normal.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ DICEN LOS EXÁMENES</tspan></text><rect x="40.0" y="301.0" width="920.0" height="32.0" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="322.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="180"><tspan x="54.0" dy="0">EXAMEN</tspan></text><text x="250.0" y="322.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="130"><tspan x="250.0" dy="0">VALOR DEL CASO</tspan></text><text x="400.0" y="322.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="130"><tspan x="400.0" dy="0">NORMAL</tspan></text><text x="550.0" y="322.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="400"><tspan x="550.0" dy="0">QUÉ SIGNIFICA</tspan></text><rect x="40.0" y="339.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="363.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">TGP (ALT)</tspan></text><text x="250.0" y="364.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">1020  ↑</tspan></text><text x="400.0" y="363.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">&lt; 40 U/L</tspan></text><text x="550.0" y="363.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Daño de hepatocitos: alto, pero no mide gravedad.</tspan></text><rect x="40.0" y="383.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="407.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">TGO (AST)</tspan></text><text x="250.0" y="408.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">740  ↑</tspan></text><text x="400.0" y="407.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">&lt; 40 U/L</tspan></text><text x="550.0" y="407.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">TGP &gt; TGO: típico de hepatitis viral.</tspan></text><rect x="40.0" y="427.0" width="920.0" height="40.0" rx="8" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="451.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Tiempo de protrombina</tspan></text><text x="250.0" y="452.0" font-size="13" font-weight="800" font-style="normal" fill="#15803d" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Normal</tspan></text><text x="400.0" y="451.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">INR &lt; 1,5</tspan></text><text x="550.0" y="451.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">El hígado aún fabrica: no hay falla hepática.</tspan></text><rect x="40.0" y="471.0" width="920.0" height="40.0" rx="8" fill="#fef2f2" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="495.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">Bilirrubina</tspan></text><text x="250.0" y="496.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Alta (coluria)  ↑</tspan></text><text x="400.0" y="495.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">&lt; 1 mg/dL</tspan></text><text x="550.0" y="495.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Ictericia; directa e indirecta.</tspan></text><rect x="40.0" y="515.0" width="920.0" height="40.0" rx="8" fill="#f0fdf4" stroke="#cbd5e1" stroke-width="1"/><text x="54.0" y="539.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="176"><tspan x="54.0" dy="0">IgM anti-VHA</tspan></text><text x="250.0" y="540.0" font-size="13" font-weight="800" font-style="normal" fill="#15803d" text-anchor="start" data-max="134"><tspan x="250.0" dy="0">Por pedir</tspan></text><text x="400.0" y="539.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="134"><tspan x="400.0" dy="0">Negativa</tspan></text><text x="550.0" y="539.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="396"><tspan x="550.0" dy="0">Confirma hepatitis A aguda.</tspan></text><rect x="40.0" y="573.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="599.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Hepatitis A con función hepática conservada</tspan></text><text x="60.0" y="618.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Hidratación y sintomáticos; vigilar INR y conciencia.</tspan></text><text x="40.0" y="685.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="695.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="734.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="717.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Gammaglobulina</tspan><tspan x="285.0" dy="17">específica y</tspan><tspan x="285.0" dy="17">sintomáticos</tspan></text><text x="435.0" y="726.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hepatoprotectores</tspan><tspan x="435.0" dy="17">y fitomenadiona</tspan></text><rect x="513.0" y="698.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="726.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Hidratación y</tspan><tspan x="585.0" dy="17">sintomáticos</tspan></text><text x="735.0" y="717.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Administrar</tspan><tspan x="735.0" dy="17">interferón gamma a</tspan><tspan x="735.0" dy="17">dosis terapéutica</tspan></text><text x="885.0" y="726.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Corticoides</tspan><tspan x="885.0" dy="17">sistémicos</tspan></text><rect x="40.0" y="766.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="766.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="803.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Manejo?</tspan></text><text x="285.0" y="787.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: la gammaglobulina</tspan><tspan x="285.0" dy="16">es profilaxis de</tspan><tspan x="285.0" dy="16">contactos</tspan></text><text x="435.0" y="795.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no sirven; TP</tspan><tspan x="435.0" dy="16">normal</tspan></text><text x="585.0" y="803.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: es autolimitada</tspan></text><text x="735.0" y="803.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no tiene indicación</tspan></text><text x="885.0" y="803.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no indicados</tspan></text><rect x="40.0" y="695.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="856.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="884.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="906.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Soporte: hidratación, dieta según tolerancia, reposo relativo; evitar paracetamol en exceso y hepatotóxicos.</tspan><tspan x="58.0" dy="18">• Confirmar con IgM anti-VHA.</tspan><tspan x="58.0" dy="18">• Signos de falla hepática aguda (INR ≥ 1,5, encefalopatía, hipoglucemia): hospitalizar. Vacunar contactos no inmunes.</tspan></text><text x="58.0" y="964.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AAP, Red Book (2024); OMS, hepatitis A (2023); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>