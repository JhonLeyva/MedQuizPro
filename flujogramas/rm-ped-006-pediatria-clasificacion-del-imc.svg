<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1094" viewBox="0 0 1000 1094" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Adolescente de 17 años con IMC de 26: sobrepeso"><title>Adolescente de 17 años con IMC de 26: sobrepeso</title><rect x="0.75" y="0.75" width="998.5" height="1092.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · clasificación del IMC</tspan></text><rect x="385.9" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="435.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="435.0" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Clasificación del IMC</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">En el adulto: &lt; 18,5 bajo peso; 18,5-24,9 normal; 25-29,9 sobrepeso; ≥ 30 obesidad.</tspan><tspan x="58.0" dy="17">En el menor de 19 años se usan las curvas de la OMS por edad y sexo.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Adolescente de 17 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">IMC de 26 kg/m² en la evaluación nutricional.</tspan><tspan x="640.0" dy="16">¿Cuál es su diagnóstico?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">IMC Y CLASIFICACIÓN DEL ESTADO NUTRICIONAL</tspan></text><rect x="40.0" y="269.0" width="920.0" height="225.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="295.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">IMC en kg/m² (referencia para el adolescente mayor)</tspan></text><text x="60.0" y="314.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">El valor del caso cae en sobrepeso.</tspan></text><rect x="70.0" y="378.0" width="100.3" height="40.0" rx="6" fill="#fef9c3" stroke="#ffffff" stroke-width="2"/><text x="120.2" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#a16207" text-anchor="middle" data-max="90"><tspan x="120.2" dy="0">Bajo peso</tspan></text><rect x="170.3" y="378.0" width="186.3" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="263.5" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="176"><tspan x="263.5" dy="0">Normal</tspan></text><rect x="356.7" y="378.0" width="143.3" height="40.0" rx="6" fill="#fef9c3" stroke="#ffffff" stroke-width="2"/><text x="428.3" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#a16207" text-anchor="middle" data-max="133"><tspan x="428.3" dy="0">Sobrepeso</tspan></text><rect x="500.0" y="378.0" width="286.7" height="40.0" rx="6" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/><text x="643.3" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#c2410c" text-anchor="middle" data-max="277"><tspan x="643.3" dy="0">Obesidad</tspan></text><rect x="786.7" y="378.0" width="143.3" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="858.3" y="403.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="133"><tspan x="858.3" dy="0">Mórbida</tspan></text><line x1="70.0" y1="418.0" x2="70.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="70.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="70.0" dy="0">15</tspan></text><line x1="170.3" y1="418.0" x2="170.3" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="170.3" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="170.3" dy="0">18,5</tspan></text><line x1="356.7" y1="418.0" x2="356.7" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="356.7" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="356.7" dy="0">25</tspan></text><line x1="500.0" y1="418.0" x2="500.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="500.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="500.0" dy="0">30</tspan></text><line x1="643.3" y1="418.0" x2="643.3" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="643.3" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="643.3" dy="0">35</tspan></text><line x1="786.7" y1="418.0" x2="786.7" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="786.7" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="786.7" dy="0">40</tspan></text><line x1="930.0" y1="418.0" x2="930.0" y2="426.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="440.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">45</tspan></text><polygon points="376.3,364.0 394.3,364.0 385.3,376.0" fill="#ea580c"/><rect x="351.5" y="338.0" width="67.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="385.3" y="353.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="56"><tspan x="385.3" dy="0">◆ IMC 26</tspan></text><rect x="60.0" y="452.0" width="880.0" height="30.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="472.0" font-size="11.5" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Sobrepeso: 25 a 29,9 kg/m².</tspan></text><text x="40.0" y="528.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN DEL ESTADO NUTRICIONAL POR IMC EN EL ADULTO (OMS)</tspan></text><rect x="40.0" y="540.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="559.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="174"><tspan x="50.0" dy="0">Categoría</tspan></text><text x="240.0" y="559.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="349"><tspan x="240.0" dy="0">IMC (kg/m²)</tspan></text><text x="605.0" y="559.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="349"><tspan x="605.0" dy="0">Riesgo y conducta</tspan></text><rect x="40.0" y="569.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="588.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="174"><tspan x="50.0" dy="0">Bajo peso</tspan></text><text x="240.0" y="588.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="349"><tspan x="240.0" dy="0">&lt; 18,5</tspan></text><text x="605.0" y="588.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="349"><tspan x="605.0" dy="0">Buscar causa y reforzar la nutrición</tspan></text><rect x="40.0" y="598.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="617.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="174"><tspan x="50.0" dy="0">Normal</tspan></text><text x="240.0" y="617.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="349"><tspan x="240.0" dy="0">18,5 a 24,9</tspan></text><text x="605.0" y="617.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="349"><tspan x="605.0" dy="0">Mantener hábitos saludables</tspan></text><rect x="40.0" y="627.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="646.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="174"><tspan x="50.0" dy="0">Sobrepeso</tspan></text><text x="240.0" y="646.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="349"><tspan x="240.0" dy="0">25 a 29,9</tspan></text><text x="605.0" y="646.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="349"><tspan x="605.0" dy="0">Dieta, actividad física y control del perímetro abdominal</tspan></text><rect x="130.6" y="630.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="176.0" y="645.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="176.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="656.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="675.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="174"><tspan x="50.0" dy="0">Obesidad grado I</tspan></text><text x="240.0" y="675.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="349"><tspan x="240.0" dy="0">30 a 34,9</tspan></text><text x="605.0" y="675.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="349"><tspan x="605.0" dy="0">Plan de pérdida de peso y descartar comorbilidades</tspan></text><rect x="40.0" y="685.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="704.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="174"><tspan x="50.0" dy="0">Obesidad grado II</tspan></text><text x="240.0" y="704.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="349"><tspan x="240.0" dy="0">35 a 39,9</tspan></text><text x="605.0" y="704.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="349"><tspan x="605.0" dy="0">Intervención intensiva; valorar fármacos</tspan></text><rect x="40.0" y="714.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="733.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="174"><tspan x="50.0" dy="0">Obesidad grado III (mórbida)</tspan></text><text x="240.0" y="733.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="349"><tspan x="240.0" dy="0">≥ 40</tspan></text><text x="605.0" y="733.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="349"><tspan x="605.0" dy="0">Evaluar cirugía bariátrica</tspan></text><text x="40.0" y="759.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Menores de 19 años: curvas OMS por edad y sexo (sobrepeso &gt; +1 DE, obesidad &gt; +2 DE).</tspan></text><text x="40.0" y="806.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="816.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="838.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="838.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Normal</tspan></text><text x="435.0" y="838.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Delgadez extrema</tspan></text><rect x="513.0" y="819.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="838.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Sobrepeso</tspan></text><text x="735.0" y="838.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Obesidad mórbida</tspan></text><text x="885.0" y="838.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Obesidad</tspan></text><rect x="40.0" y="853.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="853.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="882.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="874.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: el IMC normal</tspan><tspan x="285.0" dy="16">llega a 24,9</tspan></text><text x="435.0" y="874.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es lo opuesto, bajo</tspan><tspan x="435.0" dy="16">peso</tspan></text><text x="585.0" y="882.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: IMC de 25 a 29,9</tspan></text><text x="735.0" y="882.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: exige 40 o más</tspan></text><text x="885.0" y="882.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: exige 30 o más</tspan></text><rect x="40.0" y="816.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="927.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="955.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="977.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Curvas OMS 5-19 años: sobrepeso de +1 a +2 DE y obesidad &gt; +2 DE; a los 17 años equivalen a unos 25 y 30 kg/m².</tspan><tspan x="58.0" dy="18">• El caso es un adolescente de 17 años: el valor de 26 kg/m² cae en sobrepeso con las curvas OMS y con el punto de corte del adulto.</tspan><tspan x="58.0" dy="18">• El IMC no distingue masa grasa de masa magra: el perímetro abdominal ayuda a estimar el riesgo cardiometabólico.</tspan><tspan x="58.0" dy="18">• Alerta: sobrepeso con acantosis nigricans, hipertensión o dislipidemia obliga a descartar resistencia a la insulina (AAP 2023).</tspan></text><text x="58.0" y="1053.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, curvas de crecimiento 5-19 años (2007); AAP, obesidad infantil (Hampl, Pediatrics 2023).</tspan></text></svg>