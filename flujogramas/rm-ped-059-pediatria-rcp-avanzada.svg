<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1375" viewBox="0 0 1000 1375" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En el paro con ritmo desfibrilable la terapia inicial es la descarga eléctrica, no un fármaco"><title>En el paro con ritmo desfibrilable la terapia inicial es la descarga eléctrica, no un fármaco</title><rect x="0.75" y="0.75" width="998.5" height="1373.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · RCP avanzada</tspan></text><rect x="349.5" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="398.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="398.5" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Paro cardiorrespiratorio pediátrico</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Tras compresiones y ventilación de calidad se monitoriza el ritmo.</tspan><tspan x="58.0" dy="17">El manejo se divide en ritmos desfibrilables y no desfibrilables.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de conducta</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">En la RCP avanzada del niño, ¿qué se usa</tspan><tspan x="640.0" dy="16">inicialmente?</tspan><tspan x="640.0" dy="16">Opciones con fármacos y una descarga.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL PARO AL TRATAMIENTO SEGÚN EL RITMO</tspan></text><rect x="40.0" y="285.0" width="920.0" height="111.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="285.0" width="108.0" height="111.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="344.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Primero</tspan></text><rect x="40.0" y="396.0" width="920.0" height="111.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="396.0" width="108.0" height="111.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="455.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Desfibrilable</tspan></text><rect x="40.0" y="507.0" width="920.0" height="111.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="507.0" width="108.0" height="111.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="566.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">No desfibrilable</tspan></text><rect x="40.0" y="618.0" width="920.0" height="111.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="618.0" width="108.0" height="111.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="677.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Refractario</tspan></text><line x1="348.0" y1="332.5" x2="355.0" y2="332.5" stroke="#ea580c" stroke-width="2.2"/><line x1="355.0" y1="332.5" x2="355.0" y2="451.5" stroke="#ea580c" stroke-width="2.2"/><line x1="355.0" y1="451.5" x2="353.0" y2="451.5" stroke="#ea580c" stroke-width="2.2"/><polygon points="353.0,456.5 353.0,446.5 362.0,451.5" fill="#ea580c"/><line x1="552.0" y1="451.5" x2="559.0" y2="451.5" stroke="#0f766e" stroke-width="2.2"/><line x1="559.0" y1="451.5" x2="559.0" y2="554.5" stroke="#0f766e" stroke-width="2.2"/><line x1="559.0" y1="554.5" x2="557.0" y2="554.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="557.0,559.5 557.0,549.5 566.0,554.5" fill="#0f766e"/><line x1="756.0" y1="554.5" x2="763.0" y2="554.5" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="554.5" x2="763.0" y2="665.5" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="665.5" x2="761.0" y2="665.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="761.0,670.5 761.0,660.5 770.0,665.5" fill="#0f766e"/><rect x="158.0" y="298.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="314.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">RCP de calidad y monitor</tspan></text><text x="168.0" y="331.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Compresiones, ventilación y</tspan><tspan x="168.0" dy="14.5">análisis del ritmo</tspan></text><circle cx="158.0" cy="298.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="302.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="362.0" y="409.0" width="190.0" height="85.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="372.0" y="425.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">FV o TV sin pulso: descarga</tspan></text><text x="372.0" y="442.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">2 J/kg, luego 4 J/kg y hasta 10</tspan><tspan x="372.0" dy="14.5">J/kg; RCP 2 minutos entre</tspan><tspan x="372.0" dy="14.5">descargas</tspan></text><circle cx="362.0" cy="409.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="362.0" y="413.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="362.0" dy="0">2</tspan></text><rect x="566.0" y="520.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="576.0" y="536.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Asistolia o AESP: adrenalina</tspan></text><text x="576.0" y="553.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">0,01 mg/kg lo antes posible y</tspan><tspan x="576.0" dy="14.5">cada 3-5 minutos</tspan></text><circle cx="566.0" cy="520.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="566.0" y="524.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="566.0" dy="0">3</tspan></text><rect x="770.0" y="631.0" width="190.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="780.0" y="647.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Amiodarona o lidocaína</tspan></text><text x="780.0" y="664.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Amiodarona 5 mg/kg si persiste la</tspan><tspan x="780.0" dy="14.5">FV o la TV</tspan></text><circle cx="770.0" cy="631.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="770.0" y="635.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="770.0" dy="0">4</tspan></text><rect x="40.0" y="747.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="773.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Ritmo desfibrilable = descarga eléctrica primero</tspan></text><text x="60.0" y="792.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La adrenalina es la terapia inicial solo en asistolia o AESP.</tspan></text><text x="40.0" y="853.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DESCARGA O FÁRMACO SEGÚN EL RITMO EN EL NIÑO</tspan></text><rect x="40.0" y="865.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="884.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Situación</tspan></text><text x="260.0" y="884.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Terapia</tspan></text><text x="615.0" y="884.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">Dosis</tspan></text><rect x="40.0" y="894.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="913.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">FV o TV sin pulso</tspan></text><text x="260.0" y="913.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Desfibrilación</tspan></text><text x="615.0" y="913.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">2 J/kg; luego 4 J/kg y hasta 10 J/kg</tspan></text><rect x="150.6" y="897.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="196.0" y="912.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="196.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="923.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="942.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Asistolia o AESP</tspan></text><text x="260.0" y="942.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Adrenalina</tspan></text><text x="615.0" y="942.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">0,01 mg/kg cada 3-5 minutos</tspan></text><rect x="40.0" y="952.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="971.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Taquicardia con pulso inestable</tspan></text><text x="260.0" y="971.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="260.0" dy="0">Cardioversión sincronizada</tspan></text><text x="615.0" y="971.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="339"><tspan x="615.0" dy="0">0,5-1 J/kg; luego 2 J/kg</tspan></text><text x="40.0" y="1021.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1031.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1062.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="1053.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Procainamida 30</tspan><tspan x="285.0" dy="17">mg/kg en bolo</tspan></text><text x="435.0" y="1053.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Amiodarona 10</tspan><tspan x="435.0" dy="17">mg/kg en bolo</tspan></text><rect x="513.0" y="1034.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="1053.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Cardioversión de</tspan><tspan x="585.0" dy="17">0,5 a 2 J/kg</tspan></text><text x="735.0" y="1053.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Adenosina 0,5</tspan><tspan x="735.0" dy="17">mg/kg en infusión</tspan></text><text x="885.0" y="1053.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Bicarbonato de</tspan><tspan x="885.0" dy="17">sodio 2 mEq/kg</tspan></text><rect x="40.0" y="1085.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="1085.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1122.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Terapia inicial?</tspan></text><text x="285.0" y="1106.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: se da 5 mg/kg y</tspan><tspan x="285.0" dy="16">solo en el ritmo</tspan><tspan x="285.0" dy="16">refractario</tspan></text><text x="435.0" y="1106.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: la dosis correcta</tspan><tspan x="435.0" dy="16">es 5 mg/kg en el</tspan><tspan x="435.0" dy="16">refractario</tspan></text><text x="585.0" y="1106.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: es la única opción</tspan><tspan x="585.0" dy="16">que trata un ritmo</tspan><tspan x="585.0" dy="16">desfibrilable</tspan></text><text x="735.0" y="1106.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: se usa en</tspan><tspan x="735.0" dy="16">taquicardia con pulso,</tspan><tspan x="735.0" dy="16">en bolo rápido</tspan></text><text x="885.0" y="1114.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no se indica de</tspan><tspan x="885.0" dy="16">rutina en el paro</tspan></text><rect x="40.0" y="1031.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1175.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1203.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1225.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• No desfibrilable (asistolia y AESP, los más frecuentes por paro asfíctico): adrenalina 0,01 mg/kg lo antes posible y cada 3-5 minutos.</tspan><tspan x="58.0" dy="18">• Desfibrilable (FV y TV sin pulso): descarga de 2 J/kg, luego 4 J/kg y hasta 10 J/kg, con 2 minutos de RCP entre descargas. Amiodarona 5 mg/kg si es</tspan><tspan x="58.0" dy="18">   refractario.</tspan><tspan x="58.0" dy="18">• Procainamida y adenosina se usan en taquicardias con pulso; la adenosina es un bolo rápido de 0,1 mg/kg. El bicarbonato no es de rutina.</tspan><tspan x="58.0" dy="18">• Alerta: 0,5-2 J/kg es la dosis de cardioversión sincronizada; la opción del banco es imperfecta, pero es la única que trata un ritmo desfibrilable.</tspan></text><text x="58.0" y="1319.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AHA, Part 4: Pediatric Basic and Advanced Life Support, 2020 (Circulation 2020;142:S469-523); AHA/AAP, Part 8: Pediatric Advanced Life Support, 2025 (Circulation</tspan><tspan x="58.0" dy="15">2025;152 Suppl 2:S479-537); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>