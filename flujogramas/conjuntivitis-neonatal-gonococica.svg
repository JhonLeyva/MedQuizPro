<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="506" viewBox="0 0 1000 506" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Conjuntivitis neonatal"><title>Conjuntivitis neonatal</title><rect x="0.75" y="0.75" width="998.5" height="504.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16" y="16" width="968" height="56" rx="10" fill="#0f766e"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170" y1="34.0" x2="170" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="665"><tspan x="184.0" dy="0">PEDIATRÍA ENAM: CONJUNTIVITIS NEONATAL</tspan></text><rect x="868.7" y="32.0" width="95.3" height="24" rx="12" fill="#134e4a"/><text x="916.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="79"><tspan x="916.4" dy="0">PEDIATRÍA</tspan></text><rect x="190.0" y="90.0" width="620" height="86.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="500.0" y="118.5" font-size="14.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Neonato de 3 días con conjuntivitis purulenta muy</tspan><tspan x="500.0" dy="19.0">inflamatoria</tspan></text><text x="500.0" y="160.0" font-size="12" font-weight="400" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Madre con vulvovaginitis y uretritis antes del parto</tspan></text><line x1="500.0" y1="176.0" x2="500.0" y2="196.0" stroke="#0f766e" stroke-width="2"/><line x1="186.0" y1="196.0" x2="814.0" y2="196.0" stroke="#0f766e" stroke-width="2"/><line x1="186.0" y1="196.0" x2="186.0" y2="215.0" stroke="#0f766e" stroke-width="2"/><polygon points="181.0,214.0 191.0,214.0 186.0,222.0" fill="#0f766e"/><line x1="500.0" y1="196.0" x2="500.0" y2="215.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,214.0 505.0,214.0 500.0,222.0" fill="#0f766e"/><line x1="814.0" y1="196.0" x2="814.0" y2="215.0" stroke="#0f766e" stroke-width="2"/><polygon points="809.0,214.0 819.0,214.0 814.0,222.0" fill="#0f766e"/><rect x="40.0" y="222.0" width="292" height="131.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><path d="M40.0,232.0 a10,10 0 0 1 10,-10 h272 a10,10 0 0 1 10,10 v22.0 h-292 z" fill="#e2e8f0"/><text x="186.0" y="246.5" font-size="13.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="264"><tspan x="186.0" dy="0">Química</tspan></text><text x="186.0" y="278.0" font-size="12" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="264"><tspan x="186.0" dy="0">Primeras 24 horas</tspan><tspan x="186.0" dy="17">Por profilaxis ocular</tspan><tspan x="186.0" dy="17">Leve, autolimitada</tspan></text><rect x="354.0" y="222.0" width="292" height="131.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><path d="M354.0,232.0 a10,10 0 0 1 10,-10 h272 a10,10 0 0 1 10,10 v22.0 h-292 z" fill="#0f766e"/><text x="500.0" y="246.5" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="264"><tspan x="500.0" dy="0">Gonocócica</tspan></text><text x="500.0" y="278.0" font-size="12" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="264"><tspan x="500.0" dy="0">2 a 5 días de vida</tspan><tspan x="500.0" dy="17">Purulenta HIPERAGUDA</tspan><tspan x="500.0" dy="17">Riesgo de perforación</tspan><tspan x="500.0" dy="17">→ ceftriaxona IM</tspan></text><rect x="553.8" y="212.0" width="84.2" height="20" rx="10" fill="#f59e0b"/><text x="595.9" y="226.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="595.9" dy="0">✓ RESPUESTA</tspan></text><rect x="668.0" y="222.0" width="292" height="131.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><path d="M668.0,232.0 a10,10 0 0 1 10,-10 h272 a10,10 0 0 1 10,10 v22.0 h-292 z" fill="#e2e8f0"/><text x="814.0" y="246.5" font-size="13.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="264"><tspan x="814.0" dy="0">Por Chlamydia</tspan></text><text x="814.0" y="278.0" font-size="12" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="264"><tspan x="814.0" dy="0">5 a 14 días de vida</tspan><tspan x="814.0" dy="17">Secreción mucopurulenta</tspan><tspan x="814.0" dy="17">Riesgo de neumonía</tspan><tspan x="814.0" dy="17">→ azitromicina VO</tspan></text><rect x="40" y="379.0" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="407.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="429.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El momento de aparición orienta la etiología: la gonocócica es la más precoz y agresiva.</tspan><tspan x="58.0" dy="18">• Tratar también a la madre y a su pareja.</tspan></text><text x="58.0" y="469.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA – NTS N.° 240-MINSA/DGIESP-2026 (ITS) · CDC STI Treatment Guidelines 2021</tspan></text></svg>
