<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1227" viewBox="0 0 1000 1227" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La diuresis osmótica pierde más agua que sodio y es la causa más frecuente de hipernatremia entre las opciones"><title>La diuresis osmótica pierde más agua que sodio y es la causa más frecuente de hipernatremia entre las opciones</title><rect x="0.75" y="0.75" width="998.5" height="1225.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Nefrología · hipernatremia</tspan></text><rect x="355.1" y="32.0" width="182.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="446.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="167"><tspan x="446.4" dy="0">NEFROLOGÍA Y UROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hipernatremia</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Sodio sérico mayor de 145 mEq/L; siempre hay hiperosmolaridad por déficit de agua libre.</tspan><tspan x="58.0" dy="17">Casi siempre es pérdida de agua sin reposición.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de causas</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál de las alteraciones produce con más frecuencia</tspan><tspan x="640.0" dy="16">hipernatremia?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DESCARTA LO QUE PRODUCE HIPONATREMIA</tspan></text><text x="614.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,293.0 580.0,293.0 543.8,369.0 76.2,369.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="309.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="341.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="424"><tspan x="310.0" dy="0">¿Qué causa hipernatremia?</tspan></text><line x1="565.9" y1="331.0" x2="606.0" y2="331.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="302.0" width="114.9" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="671.4" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="671.4" dy="0">Diuresis osmótica</tspan></text><rect x="734.9" y="302.0" width="96.6" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="783.2" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="783.2" dy="0">Hiperlipidemia</tspan></text><rect x="837.4" y="302.0" width="110.3" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="892.6" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="892.6" dy="0">Hipoadrenalismo</tspan></text><rect x="614.0" y="334.0" width="86.6" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="657.3" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="657.3" dy="0">Vasopresina</tspan></text><rect x="706.6" y="334.0" width="96.6" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="754.8" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="754.8" dy="0">Hipotiroidismo</tspan></text><polygon points="76.2,373.0 543.8,373.0 507.5,433.0 112.5,433.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="138.5" cy="403.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="138.5" y="407.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="138.5" dy="0">1</tspan></text><text x="320.0" y="399.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="331"><tspan x="320.0" dy="0">¿Es una interferencia de laboratorio que baja el</tspan><tspan x="320.0" dy="17">sodio?</tspan></text><line x1="529.6" y1="403.0" x2="606.0" y2="403.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="390.0" width="108.7" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="668.3" y="407.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="668.3" dy="0">✕ Hiperlipidemia</tspan></text><line x1="636.0" y1="403.5" x2="712.7" y2="403.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="112.5,437.0 507.5,437.0 471.2,497.0 148.8,497.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="174.8" cy="467.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="174.8" y="471.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="174.8" dy="0">2</tspan></text><text x="320.0" y="463.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="258"><tspan x="320.0" dy="0">¿Retiene agua o pierde sodio, con</tspan><tspan x="320.0" dy="17">hiponatremia?</tspan></text><line x1="493.4" y1="467.0" x2="606.0" y2="467.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="454.0" width="98.7" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="663.3" y="471.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="663.3" dy="0">✕ Vasopresina</tspan></text><line x1="636.0" y1="467.5" x2="702.7" y2="467.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="718.7" y="454.0" width="122.4" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="779.9" y="471.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="779.9" dy="0">✕ Hipoadrenalismo</tspan></text><line x1="740.7" y1="467.5" x2="831.1" y2="467.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="148.8,501.0 471.2,501.0 435.0,561.0 185.0,561.0" fill="#5eead4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="531.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="535.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">3</tspan></text><text x="320.0" y="527.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">¿Es un trastorno endocrino</tspan><tspan x="320.0" dy="17">que causa hiponatremia?</tspan></text><line x1="457.1" y1="531.0" x2="606.0" y2="531.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="518.0" width="108.7" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="668.3" y="535.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="668.3" dy="0">✕ Hipotiroidismo</tspan></text><line x1="636.0" y1="531.5" x2="712.7" y2="531.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="565.0" x2="310.0" y2="584.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,583.0 315.0,583.0 310.0,591.0" fill="#0f766e"/><rect x="140.0" y="595.0" width="340.0" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="624.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">DIURESIS OSMÓTICA</tspan></text><text x="310.0" y="648.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Elimina agua en mayor proporción que el sodio</tspan><tspan x="310.0" dy="17">Hiperglucemia, manitol o urea</tspan></text><rect x="370.6" y="584.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="599.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="594.9" width="346.0" height="92.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="614.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="632.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">La hipernatremia casi siempre es pérdida de agua sin</tspan><tspan x="628.0" dy="16">reposición, sobre todo en lactantes, ancianos y enfermos</tspan><tspan x="628.0" dy="16">graves.</tspan></text><text x="40.0" y="720.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">HIPERNATREMIA SEGÚN EL SODIO CORPORAL</tspan></text><rect x="40.0" y="732.9" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="751.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Sodio corporal</tspan></text><text x="270.0" y="751.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Causas</tspan></text><text x="620.0" y="751.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Ejemplo</tspan></text><rect x="40.0" y="761.9" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="780.9" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Sodio bajo</tspan></text><text x="270.0" y="780.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Pierde más agua que sodio: diuresis osmótica, pérdidas</tspan><tspan x="270.0" dy="15">digestivas, sudor</tspan></text><text x="620.0" y="780.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Hiperglucemia, manitol, urea</tspan></text><rect x="160.6" y="772.9" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="206.0" y="787.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="206.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="805.9" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="824.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Sodio normal</tspan></text><text x="270.0" y="824.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Pérdida de agua libre</tspan></text><text x="620.0" y="824.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Diabetes insípida central o nefrogénica</tspan></text><rect x="40.0" y="834.9" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="853.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Sodio alto</tspan></text><text x="270.0" y="853.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="270.0" dy="0">Ganancia de sodio</tspan></text><text x="620.0" y="853.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="334"><tspan x="620.0" dy="0">Bicarbonato o salina hipertónica</tspan></text><text x="40.0" y="903.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="913.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="944.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="944.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hiperlipidemia</tspan></text><text x="435.0" y="944.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hipoadrenalismo</tspan></text><text x="585.0" y="936.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Liberación de</tspan><tspan x="585.0" dy="17">vasopresina</tspan></text><text x="735.0" y="944.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Hipotiroidismo</tspan></text><rect x="813.0" y="916.9" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="944.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Diuresis osmótica</tspan></text><rect x="40.0" y="967.9" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="967.9" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="988.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Causa de</tspan><tspan x="54.0" dy="16">hipernatremia?</tspan></text><text x="285.0" y="988.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: produce</tspan><tspan x="285.0" dy="16">seudohiponatremia</tspan></text><text x="435.0" y="988.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: produce</tspan><tspan x="435.0" dy="16">hiponatremia</tspan></text><text x="585.0" y="988.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: retiene agua y baja</tspan><tspan x="585.0" dy="16">el sodio</tspan></text><text x="735.0" y="988.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: produce</tspan><tspan x="735.0" dy="16">hiponatremia</tspan></text><text x="885.0" y="988.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: pierde más agua</tspan><tspan x="885.0" dy="16">que sodio</tspan></text><rect x="40.0" y="913.9" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1041.9" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1069.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1091.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Pérdidas con sodio bajo: diuresis osmótica (hiperglucemia, manitol, urea), pérdidas digestivas y sudor. Sodio normal: diabetes insípida. Sodio alto:</tspan><tspan x="58.0" dy="18">   bicarbonato o salina hipertónica.</tspan><tspan x="58.0" dy="18">• Hiperlipidemia: seudohiponatremia. Hipoadrenalismo e hipotiroidismo: hiponatremia. Vasopresina (SIADH): retiene agua e hiponatremia.</tspan><tspan x="58.0" dy="18">• Síntomas: sed, irritabilidad, letargo, convulsiones y coma, con riesgo de hemorragia por retracción cerebral.</tspan><tspan x="58.0" dy="18">• Corrección lenta: máximo 10 a 12 mEq/L en 24 horas en la forma crónica, con agua libre o dextrosa al 5 %, calculando el déficit de agua.</tspan></text><text x="58.0" y="1185.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Sterns RH, Disorders of plasma sodium: causes, consequences, and correction (N Engl J Med 2015); Harrison Principios de Medicina Interna, 21.ª ed. (2022).</tspan></text></svg>