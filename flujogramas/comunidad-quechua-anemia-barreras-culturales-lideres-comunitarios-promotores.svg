<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1165" viewBox="0 0 1000 1165" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Anemia alta en una comunidad quechua con barreras culturales: capacitar líderes comunitarios como promotores"><title>Anemia alta en una comunidad quechua con barreras culturales: capacitar líderes comunitarios como promotores</title><rect x="0.75" y="0.75" width="998.5" height="1163.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Promoción de la salud · interculturalidad</tspan></text><rect x="440.6" y="32.0" width="143.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="512.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="127"><tspan x="512.3" dy="0">SALUD PÚBLICA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Enfoque intercultural</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se trabaja con los saberes, el idioma y los líderes de la propia comunidad.</tspan><tspan x="58.0" dy="17">Así se superan la desconfianza y las barreras de idioma.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Comunidad quechua del Cusco</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Anemia en 48 % de gestantes y 44 % de menores de 5</tspan><tspan x="640.0" dy="16">años.</tspan><tspan x="640.0" dy="16">Desconfianza a la medicina occidental, transporte</tspan><tspan x="640.0" dy="16">difícil, poco español.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿QUÉ ESTRATEGIA LLEGA MEJOR?</tspan></text><polygon points="220,336.0 260,301.0 740,301.0 780,336.0 740,371.0 260,371.0" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><circle cx="282.0" cy="336.0" r="13" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="282.0" y="341.5" font-size="16" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="282.0" dy="0">?</tspan></text><text x="525.0" y="341.0" font-size="13.5" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="525.0" dy="0">¿Hay barreras culturales y de idioma con los servicios?</tspan></text><line x1="500.0" y1="371.0" x2="500.0" y2="391.0" stroke="#0f766e" stroke-width="2"/><line x1="190.0" y1="391.0" x2="662.0" y2="391.0" stroke="#0f766e" stroke-width="2"/><line x1="190.0" y1="391.0" x2="190.0" y2="420.0" stroke="#0f766e" stroke-width="2"/><polygon points="185.0,419.0 195.0,419.0 190.0,427.0" fill="#0f766e"/><line x1="662.0" y1="391.0" x2="662.0" y2="420.0" stroke="#ea580c" stroke-width="2"/><polygon points="657.0,419.0 667.0,419.0 662.0,427.0" fill="#ea580c"/><rect x="174.0" y="399.0" width="32.0" height="20.0" rx="10" fill="#64748b" stroke="none" stroke-width="1.5"/><text x="190.0" y="413.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">No</tspan></text><rect x="587.6" y="399.0" width="148.7" height="20.0" rx="10" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="662.0" y="413.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="662.0" dy="0">Sí: comunidad quechua</tspan></text><rect x="40.0" y="427.0" width="300.0" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="428.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="451.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="270"><tspan x="58.0" dy="0">Intervención habitual</tspan></text><text x="58.0" y="472.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="270"><tspan x="58.0" dy="0">Suplementos y consejería en el establecimiento.</tspan></text><rect x="364.0" y="427.0" width="596.0" height="314.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="844.6" y="416.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="431.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><text x="382.0" y="453.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">Líderes comunitarios como promotores</tspan></text><text x="382.0" y="475.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">Autoridades y agentes de medicina tradicional capacitados.</tspan><tspan x="382.0" dy="16">Hablan quechua y tienen la confianza de la comunidad.</tspan></text><g transform="translate(500.5,511.0) scale(0.95)"><rect x="18" y="110" width="44" height="34" fill="#fde68a" stroke="#a16207" stroke-width="1.5"/><path d="M12 112 L40 88 L68 112 Z" fill="#b45309" stroke="#78350f" stroke-width="1.5" stroke-linejoin="round" /><rect x="88" y="110" width="44" height="34" fill="#fde68a" stroke="#a16207" stroke-width="1.5"/><path d="M82 112 L110 88 L138 112 Z" fill="#b45309" stroke="#78350f" stroke-width="1.5" stroke-linejoin="round" /><rect x="228" y="110" width="44" height="34" fill="#fde68a" stroke="#a16207" stroke-width="1.5"/><path d="M222 112 L250 88 L278 112 Z" fill="#b45309" stroke="#78350f" stroke-width="1.5" stroke-linejoin="round" /><rect x="288" y="110" width="44" height="34" fill="#fde68a" stroke="#a16207" stroke-width="1.5"/><path d="M282 112 L310 88 L338 112 Z" fill="#b45309" stroke="#78350f" stroke-width="1.5" stroke-linejoin="round" /><circle cx="180" cy="70" r="16" fill="#fde7d4" stroke="#e9b48f" stroke-width="1.5" /><path d="M160 150 C160 100 200 100 200 150 Z" fill="#ea580c" stroke="#9a3412" stroke-width="1.5" stroke-linejoin="round" /><path d="M162 64 Q180 40 198 64" fill="none" stroke="#7c2d12" stroke-width="5" stroke-linejoin="round" /><rect x="126" y="156" width="108" height="30" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="180.0" y="174.325" font-size="9.5" font-weight="800" fill="#9a3412" text-anchor="middle" data-max="0">promotor/a quechua</text><line x1="180.0" y1="100.0" x2="68.0" y2="103.7" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="4 3"/><polygon points="60.0,104.0 68.9,99.4 69.1,108.0" fill="#0f766e"/><line x1="180.0" y1="100.0" x2="128.0" y2="103.5" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="4 3"/><polygon points="120.0,104.0 128.7,99.1 129.3,107.7" fill="#0f766e"/><line x1="180.0" y1="100.0" x2="232.0" y2="103.5" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="4 3"/><polygon points="240.0,104.0 230.7,107.7 231.3,99.1" fill="#0f766e"/><line x1="180.0" y1="100.0" x2="292.0" y2="103.7" stroke="#0f766e" stroke-width="1.8" stroke-dasharray="4 3"/><polygon points="300.0,104.0 290.9,108.0 291.1,99.4" fill="#0f766e"/><text x="170" y="16" font-size="10" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">líder local que habla el idioma y conoce la cultura</text><text x="170" y="16" font-size="10" font-weight="800" fill="#334155" text-anchor="middle" data-max="0">líder local que habla el idioma y conoce la cultura</text></g><text x="382.0" y="723.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">El promotor de la comunidad lleva la información casa por casa.</tspan></text><text x="40.0" y="775.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">POR QUÉ NO LAS OTRAS</tspan></text><rect x="40.0" y="785.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="786.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="809.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Promotores comunitarios</tspan></text><text x="58.0" y="830.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Superan idioma y desconfianza.</tspan></text><rect x="237.5" y="774.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="282.9" y="789.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="282.9" dy="0">◆ ESTE CASO</tspan></text><rect x="351.3" y="785.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="786.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="809.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Folletos en español</tspan></text><text x="369.3" y="830.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">No se leen ni se entienden.</tspan></text><rect x="662.7" y="785.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="786.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="809.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Solo repartir hierro</tspan></text><text x="680.7" y="830.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Sin confianza, no se consume.</tspan></text><text x="40.0" y="894.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="904.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="935.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="935.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Folletos en español</tspan></text><text x="491.2" y="926.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Repartir hierro y ácido</tspan><tspan x="491.2" dy="17">fólico</tspan></text><rect x="588.0" y="907.0" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="678.8" y="926.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Capacitar líderes como</tspan><tspan x="678.8" dy="17">promotores</tspan></text><text x="866.2" y="935.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Vacunación intensiva</tspan></text><rect x="40.0" y="958.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="588.0" y="958.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="979.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="979.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Barrera de idioma</tspan></text><text x="491.2" y="979.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No vence la desconfianza</tspan></text><text x="678.8" y="979.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Ninguno</tspan></text><text x="866.2" y="979.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No trata la anemia</tspan></text><rect x="40.0" y="904.0" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1016.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1044.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1066.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Capacitar a autoridades y agentes de medicina tradicional como promotores de salud.</tspan><tspan x="58.0" dy="18">• Ellos llevan los mensajes en quechua y generan confianza; luego mejora el uso de suplementos y servicios.</tspan><tspan x="58.0" dy="18">• Folletos en español o repartir hierro sin acompañamiento chocan con las barreras.</tspan></text><text x="58.0" y="1124.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA, política sectorial de salud intercultural; OPS.</tspan></text></svg>