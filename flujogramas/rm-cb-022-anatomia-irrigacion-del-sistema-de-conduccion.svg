="40.0" y="624.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="655.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="627.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="655.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Coronaria derecha</tspan></text><text x="435.0" y="655.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Coronaria izquierda</tspan></text><text x="585.0" y="646.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Ramas de la</tspan><tspan x="585.0" dy="17">circunfleja</tspan></text><text x="735.0" y="655.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Interventricular</tspan></text><text x="885.0" y="655.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Marginal</tspan></text><rect x="40.0" y="678.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="678.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="707.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Arteria?</tspan></text><text x="285.0" y="699.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: ambos nodos en la</tspan><tspan x="285.0" dy="16">mayoría</tspan></text><text x="435.0" y="707.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: de la minoría</tspan></text><text x="585.0" y="699.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sólo en parte del</tspan><tspan x="585.0" dy="16">nodo sinusal</tspan></text><text x="735.0" y="699.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: tabique y pared</tspan><tspan x="735.0" dy="16">anterior</tspan></text><text x="885.0" y="707.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: pared del VD</tspan></text><rect x="40.0" y="624.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="752.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="780.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="802.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La arteria del nodo AV nace en la crux cordis, donde se unen los surcos auriculoventricular e interventricular posterior.</tspan><tspan x="58.0" dy="18">• Infarto inferior: bradicardia sinusal y bloqueo AV de primer grado o Wenckebach (a menudo transitorio, responden a atropina).</tspan><tspan x="58.0" dy="18">• Infarto anterior con bloqueo AV de 2.º o 3.er grado: lesión extensa del tabique y mal pronóstico.</tspan></text><text x="58.0" y="860.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Moore Anatomía con orientación clínica 8.ª ed.; Braunwald Tratado de Cardiología 12.ª ed.</tspan></text></svg>