<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="954" viewBox="0 0 1000 954" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Para la endometritis puerperal el tratamiento antibiótico de elección es clindamicina + gentamicina EV"><title>Para la endometritis puerperal el tratamiento antibiótico de elección es clindamicina + gentamicina EV</title><rect x="0.75" y="0.75" width="998.5" height="952.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Infección puerperal · endometritis</tspan></text><rect x="400.3" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="487.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="487.5" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Endometritis puerperal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección del útero tras el parto, más tras cesárea, RPM prolongada o muchos tactos.</tspan><tspan x="58.0" dy="17">Polimicrobiana con anaerobios: fiebre, útero blando y doloroso, loquios fétidos.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Antibiótico de elección</tspan><tspan x="640.0" dy="16">en la endometritis puerperal?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO TRATAR LA ENDOMETRITIS PUERPERAL</tspan></text><rect x="40.0" y="269.0" width="602.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="60.0" y="302.5" font-size="14" font-weight="800" font-style="normal" fill="#ea580c" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">1</tspan></text><rect x="78.0" y="286.5" width="22.0" height="22.0" rx="5" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="89.0" y="302.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="89.0" dy="0">✓</tspan></text><text x="114.0" y="294.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Clindamicina + gentamicina EV</tspan></text><text x="114.0" y="311.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Hasta 24-48 h sin fiebre</tspan></text><rect x="543.4" y="258.0" width="84.3" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="585.6" y="273.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="585.6" dy="0">◆ ELECCIÓN</tspan></text><rect x="40.0" y="334.0" width="602.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="60.0" y="367.5" font-size="14" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">2</tspan></text><rect x="78.0" y="351.5" width="22.0" height="22.0" rx="5" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="89.0" y="367.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="89.0" dy="0">✓</tspan></text><text x="114.0" y="359.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Revisar restos placentarios</tspan></text><text x="114.0" y="376.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Ecografía</tspan></text><rect x="40.0" y="399.0" width="602.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="60.0" y="432.5" font-size="14" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">3</tspan></text><rect x="78.0" y="416.5" width="22.0" height="22.0" rx="5" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="89.0" y="432.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="89.0" dy="0">✓</tspan></text><text x="114.0" y="424.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Si no mejora en 48-72 h</tspan></text><text x="114.0" y="441.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Añadir ampicilina; buscar absceso o tromboflebitis</tspan></text><rect x="40.0" y="464.0" width="602.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="60.0" y="497.5" font-size="14" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">4</tspan></text><rect x="78.0" y="481.5" width="22.0" height="22.0" rx="5" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="89.0" y="497.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="89.0" dy="0">✓</tspan></text><text x="114.0" y="489.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Alta</tspan></text><text x="114.0" y="506.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Sin antibiótico oral si respondió</tspan></text><rect x="660.0" y="269.0" width="300.0" height="252.0" rx="12" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/><text x="676.0" y="295.0" font-size="11.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">NO HACER</tspan></text><text x="682.0" y="374.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="0"><tspan x="682.0" dy="0">✕</tspan></text><text x="700.0" y="374.0" font-size="12" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="start" data-max="244"><tspan x="700.0" dy="0">Tratar solo con metronidazol</tspan></text><text x="700.0" y="391.0" font-size="11" font-weight="400" font-style="normal" fill="#7f1d1d" text-anchor="start" data-max="244"><tspan x="700.0" dy="0">No cubre gramnegativos</tspan></text><text x="682.0" y="423.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="0"><tspan x="682.0" dy="0">✕</tspan></text><text x="700.0" y="423.0" font-size="12" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="start" data-max="244"><tspan x="700.0" dy="0">Esperar sin antibiótico</tspan></text><text x="700.0" y="440.0" font-size="11" font-weight="400" font-style="normal" fill="#7f1d1d" text-anchor="start" data-max="244"><tspan x="700.0" dy="0">Riesgo de sepsis</tspan></text><rect x="40.0" y="539.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="565.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Clindamicina + gentamicina</tspan></text><text x="60.0" y="584.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Si no responde, añadir ampicilina y buscar complicaciones.</tspan></text><text x="40.0" y="651.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="661.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="692.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="664.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="683.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Clindamicina +</tspan><tspan x="285.0" dy="17">gentamicina</tspan></text><text x="435.0" y="683.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Ceftriaxona +</tspan><tspan x="435.0" dy="17">amoxicilina</tspan></text><text x="585.0" y="683.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Clindamicina +</tspan><tspan x="585.0" dy="17">dicloxacilina</tspan></text><text x="735.0" y="683.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ampicilina –</tspan><tspan x="735.0" dy="17">sulbactam</tspan></text><text x="885.0" y="692.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Metronidazol solo</tspan></text><rect x="40.0" y="715.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="715.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="752.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tratamiento?</tspan></text><text x="285.0" y="744.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: cubre anaerobios y</tspan><tspan x="285.0" dy="16">gramnegativos</tspan></text><text x="435.0" y="736.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: cobertura</tspan><tspan x="435.0" dy="16">incompleta de</tspan><tspan x="435.0" dy="16">anaerobios</tspan></text><text x="585.0" y="744.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: falta</tspan><tspan x="585.0" dy="16">gramnegativos</tspan></text><text x="735.0" y="744.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Alternativa posible, no</tspan><tspan x="735.0" dy="16">la clásica de elección</tspan></text><text x="885.0" y="752.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: solo anaerobios</tspan></text><rect x="40.0" y="661.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="805.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="833.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="855.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Clindamicina 900 mg c/8 h + gentamicina 5 mg/kg/día EV hasta 24-48 h sin fiebre; no hace falta oral después.</tspan><tspan x="58.0" dy="18">• Si no mejora en 48-72 h: añadir ampicilina (enterococo) y buscar absceso o tromboflebitis pélvica.</tspan><tspan x="58.0" dy="18">• Revisar restos placentarios (eco).</tspan></text><text x="58.0" y="913.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG; Williams Obstetricia 26.ª ed. (2022); MINSA Perú.</tspan></text></svg>