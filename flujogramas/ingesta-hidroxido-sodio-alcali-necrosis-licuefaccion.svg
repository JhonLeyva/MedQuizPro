<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1060" viewBox="0 0 1000 1060" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Ingesta de álcali: necrosis de licuefacción del esófago y el estómago"><title>Ingesta de álcali: necrosis de licuefacción del esófago y el estómago</title><rect x="0.75" y="0.75" width="998.5" height="1058.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Intoxicaciones en pediatría · cáusticos</tspan></text><rect x="427.6" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="484.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="484.1" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cáusticos</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Álcali (soda cáustica, lejía concentrada): necrosis de licuefacción, penetra profundo.</tspan><tspan x="58.0" dy="17">Ácido: necrosis de coagulación; la escara limita la profundidad.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 1 año</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Ingirió líquido desatorador con hidróxido de sodio</tspan><tspan x="640.0" dy="16">(álcali fuerte).</tspan><tspan x="640.0" dy="16">¿Qué lesión produce?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ÁLCALI FRENTE A ÁCIDO</tspan></text><rect x="40.0" y="295.0" width="438.0" height="362.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="52.0" y="305.0" width="144.0" height="20.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="319.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">ÁLCALI: LICUEFACCIÓN</tspan></text><rect x="362.6" y="284.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="408.0" y="299.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="408.0" dy="0">◆ ESTE CASO</tspan></text><g transform="translate(149.0,333.0) scale(1.0)"><path d="M100 10 L100 150 C100 170 80 190 90 210 C110 250 190 250 200 200 C206 170 170 150 124 152 L124 10 Z" fill="#fbcfe8" stroke="#be185d" stroke-width="2" stroke-linejoin="round" /><text x="150" y="30" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">esófago</text><text x="150" y="30" font-size="10.5" font-weight="800" fill="#9d174d" text-anchor="start" data-max="0">esófago</text><text x="150" y="256" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">estómago</text><text x="150" y="256" font-size="10.5" font-weight="800" fill="#9d174d" text-anchor="middle" data-max="0">estómago</text><path d="M100 30 L100 150 L124 150 L124 30 Z" fill="#7f1d1d" stroke="none" stroke-width="0" stroke-linejoin="round" opacity="0.8"/><path d="M96 40 l-8 6 M128 50 l8 6" stroke="#7f1d1d" stroke-width="2"/><path d="M96 62 l-8 6 M128 72 l8 6" stroke="#7f1d1d" stroke-width="2"/><path d="M96 84 l-8 6 M128 94 l8 6" stroke="#7f1d1d" stroke-width="2"/><path d="M96 106 l-8 6 M128 116 l8 6" stroke="#7f1d1d" stroke-width="2"/><path d="M96 128 l-8 6 M128 138 l8 6" stroke="#7f1d1d" stroke-width="2"/><text x="82" y="96" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="end" data-max="0">necrosis de</text><text x="82" y="96" font-size="10.5" font-weight="800" fill="#7f1d1d" text-anchor="end" data-max="0">necrosis de</text><text x="82" y="110" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="end" data-max="0">licuefacción:</text><text x="82" y="110" font-size="10.5" font-weight="800" fill="#7f1d1d" text-anchor="end" data-max="0">licuefacción:</text><text x="82" y="124" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="end" data-max="0">penetra</text><text x="82" y="124" font-size="10.5" font-weight="800" fill="#7f1d1d" text-anchor="end" data-max="0">penetra</text><text x="82" y="138" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="end" data-max="0">la pared</text><text x="82" y="138" font-size="10.5" font-weight="800" fill="#7f1d1d" text-anchor="end" data-max="0">la pared</text></g><text x="54.0" y="621.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="54.0" dy="0">La pared del esófago se «derrite»: la lesión llega hondo y puede perforar.</tspan></text><rect x="522.0" y="295.0" width="438.0" height="362.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="534.0" y="305.0" width="139.9" height="20.0" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1"/><text x="543.0" y="319.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="543.0" dy="0">ÁCIDO: COAGULACIÓN</tspan></text><g transform="translate(631.0,333.0) scale(1.0)"><path d="M100 10 L100 150 C100 170 80 190 90 210 C110 250 190 250 200 200 C206 170 170 150 124 152 L124 10 Z" fill="#fbcfe8" stroke="#be185d" stroke-width="2" stroke-linejoin="round" /><text x="150" y="30" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">esófago</text><text x="150" y="30" font-size="10.5" font-weight="800" fill="#9d174d" text-anchor="start" data-max="0">esófago</text><text x="150" y="256" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">estómago</text><text x="150" y="256" font-size="10.5" font-weight="800" fill="#9d174d" text-anchor="middle" data-max="0">estómago</text><path d="M92 190 C110 230 180 230 192 196 L180 190 C160 210 120 214 104 186 Z" fill="#57534e" stroke="none" stroke-width="0" stroke-linejoin="round" /><text x="88" y="120" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="end" data-max="0">ácido: escara</text><text x="88" y="120" font-size="10.5" font-weight="800" fill="#44403c" text-anchor="end" data-max="0">ácido: escara</text><text x="88" y="134" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="end" data-max="0">(coagulación)</text><text x="88" y="134" font-size="10.5" font-weight="800" fill="#44403c" text-anchor="end" data-max="0">(coagulación)</text></g><text x="536.0" y="621.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="410"><tspan x="536.0" dy="0">Forma una escara que limita la profundidad; daña más el estómago.</tspan></text><circle cx="500.0" cy="468.0" r="17" fill="#ea580c" stroke="none" stroke-width="0"/><polygon points="494.0,460.0 494.0,476.0 508.0,468.0" fill="#ffffff"/><text x="40.0" y="687.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ HACER</tspan></text><rect x="40.0" y="697.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="698.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="721.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">No hacer</tspan></text><text x="58.0" y="742.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Inducir vómito, neutralizar ni dar carbón activado.</tspan></text><rect x="351.3" y="697.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="352.3" y="698.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="369.3" y="721.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Endoscopía</tspan></text><text x="369.3" y="742.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">En 12-24 h para graduar la lesión.</tspan></text><rect x="548.8" y="686.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="594.3" y="701.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="594.3" dy="0">◆ ESTE CASO</tspan></text><rect x="662.7" y="697.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="698.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="721.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Después</tspan></text><text x="680.7" y="742.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Vigilar estenosis esofágica.</tspan></text><text x="40.0" y="806.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="816.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="838.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="838.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Superficial</tspan></text><text x="491.2" y="838.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Sin riesgo de perforación</tspan></text><text x="678.8" y="838.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Coagulación</tspan></text><rect x="775.5" y="819.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="866.2" y="838.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Licuefacción</tspan></text><rect x="40.0" y="853.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="775.5" y="853.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="874.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Correcto para álcali?</tspan></text><text x="303.8" y="874.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No</tspan></text><text x="491.2" y="874.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No</tspan></text><text x="678.8" y="874.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No: es de ácidos</tspan></text><text x="866.2" y="874.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Sí</tspan></text><rect x="40.0" y="816.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="911.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="939.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="961.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Álcali fuerte: saponifica grasas y disuelve proteínas → licuefacción transmural con riesgo de perforación y estenosis.</tspan><tspan x="58.0" dy="18">• No inducir vómito, no neutralizar, no carbón activado; ayuno y endoscopía en 12-24 h.</tspan><tspan x="58.0" dy="18">• Los ácidos dañan más el estómago; los álcalis, más el esófago.</tspan></text><text x="58.0" y="1019.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Nelson Tratado de Pediatría 22.ª ed. (2024); ESPGHAN, ingesta de cáusticos (2021).</tspan></text></svg>