<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1369" viewBox="0 0 1000 1369" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Poliuria, hipopotasemia e hipocloremia en un niño sin glucosuria: Bartter, asa ascendente de Henle"><title>Poliuria, hipopotasemia e hipocloremia en un niño sin glucosuria: Bartter, asa ascendente de Henle</title><rect x="0.75" y="0.75" width="998.5" height="1367.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Nefrología · tubulopatías</tspan></text><rect x="346.9" y="32.0" width="182.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="438.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="167"><tspan x="438.2" dy="0">NEFROLOGÍA Y UROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Síndrome de Bartter</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Grupo de tubulopatías autosómicas recesivas de la rama ascendente gruesa del asa de</tspan><tspan x="58.0" dy="17">Henle.</tspan><tspan x="58.0" dy="17">Remeda el uso crónico de furosemida.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 5 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Poliuria, avidez por agua, estreñimiento y debilidad</tspan><tspan x="640.0" dy="16">muscular.</tspan><tspan x="640.0" dy="16">Hipocloremia, hipopotasemia e hipocalcemia; sin</tspan><tspan x="640.0" dy="16">glucosuria ni proteinuria.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SE PIENSA EN ESTE ORDEN</tspan></text><rect x="40.0" y="301.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="346.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="374.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">1</tspan></text><rect x="124.0" y="301.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="329.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Hay glucosuria o proteinuria?</tspan></text><rect x="136.0" y="343.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="363.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">No: se descarta el túbulo proximal</tspan></text><text x="152.0" y="382.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Con glucosuria y proteinuria sería un síndrome de Fanconi.</tspan></text><line x1="77.0" y1="404.0" x2="77.0" y2="423.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,422.0 82.0,422.0 77.0,430.0" fill="#0f766e"/><text x="134.0" y="422.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="432.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="477.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="505.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">2</tspan></text><rect x="124.0" y="432.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="460.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Qué trastorno hay?</tspan></text><rect x="136.0" y="474.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="494.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Hipopotasemia, hipocloremia y poliuria con deshidratación</tspan></text><text x="152.0" y="513.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Alcalosis metabólica hipopotasémica con aldosterona alta.</tspan></text><line x1="77.0" y1="535.0" x2="77.0" y2="554.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,553.0 82.0,553.0 77.0,561.0" fill="#0f766e"/><text x="134.0" y="553.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="563.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="608.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="636.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">3</tspan></text><rect x="124.0" y="563.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="591.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Qué segmento falla?</tspan></text><rect x="136.0" y="605.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="625.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Asa ascendente gruesa de Henle: síndrome de Bartter</tspan></text><text x="152.0" y="644.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Gitelman (distal) lleva hipomagnesemia e hipocalciuria; Liddle (colector) lleva hipertensión.</tspan></text><rect x="40.0" y="684.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="710.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Hipopotasemia sin glucosuria en un niño = Bartter (asa ascendente de Henle)</tspan></text><text x="60.0" y="729.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Fanconi es proximal, Gitelman distal y Liddle del colector.</tspan></text><text x="40.0" y="790.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">TUBULOPATÍAS CON HIPOPOTASEMIA SEGÚN EL SEGMENTO AFECTADO</tspan></text><rect x="40.0" y="802.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="821.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="164"><tspan x="50.0" dy="0">Síndrome</tspan></text><text x="230.0" y="821.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="354"><tspan x="230.0" dy="0">Segmento</tspan></text><text x="600.0" y="821.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="354"><tspan x="600.0" dy="0">Hallazgos clave</tspan></text><rect x="40.0" y="831.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="850.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="164"><tspan x="50.0" dy="0">Fanconi</tspan></text><text x="230.0" y="850.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="354"><tspan x="230.0" dy="0">Túbulo proximal</tspan></text><text x="600.0" y="850.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="354"><tspan x="600.0" dy="0">Glucosuria, proteinuria tubular, acidosis e hipofosfatemia</tspan></text><rect x="40.0" y="860.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="879.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="164"><tspan x="50.0" dy="0">Bartter</tspan></text><text x="230.0" y="879.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="354"><tspan x="230.0" dy="0">Asa ascendente gruesa (NKCC2, ROMK, ClC-Kb)</tspan></text><text x="600.0" y="879.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="354"><tspan x="600.0" dy="0">Alcalosis hipopotasémica, hiperreninismo y calciuria alta</tspan></text><rect x="120.6" y="863.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="166.0" y="878.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="166.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="889.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="908.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="164"><tspan x="50.0" dy="0">Gitelman</tspan></text><text x="230.0" y="908.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="354"><tspan x="230.0" dy="0">Túbulo contorneado distal (NCC)</tspan></text><text x="600.0" y="908.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="354"><tspan x="600.0" dy="0">Hipomagnesemia e hipocalciuria; adolescentes o adultos</tspan></text><rect x="40.0" y="918.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="937.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="164"><tspan x="50.0" dy="0">Liddle</tspan></text><text x="230.0" y="937.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="354"><tspan x="230.0" dy="0">Colector</tspan></text><text x="600.0" y="937.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="354"><tspan x="600.0" dy="0">Hipertensión con hipopotasemia</tspan></text><text x="40.0" y="963.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">La hipocalcemia del enunciado no es típica del Bartter; la clave del banco se mantiene.</tspan></text><text x="40.0" y="1010.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1020.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1051.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="1023.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="1042.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Asa ascendente de</tspan><tspan x="285.0" dy="17">Henle</tspan></text><text x="435.0" y="1042.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Túbulo colector</tspan><tspan x="435.0" dy="17">medular</tspan></text><text x="585.0" y="1042.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Túbulo contorneado</tspan><tspan x="585.0" dy="17">proximal</tspan></text><text x="735.0" y="1042.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Túbulo colector</tspan><tspan x="735.0" dy="17">cortical</tspan></text><text x="885.0" y="1042.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Túbulo contorneado</tspan><tspan x="885.0" dy="17">distal</tspan></text><rect x="40.0" y="1074.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1074.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1103.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Segmento afectado?</tspan></text><text x="285.0" y="1095.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: defecto de NKCC2,</tspan><tspan x="285.0" dy="16">ROMK o ClC-Kb</tspan></text><text x="435.0" y="1095.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: Bartter no afecta el</tspan><tspan x="435.0" dy="16">colector medular</tspan></text><text x="585.0" y="1095.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sin glucosuria ni</tspan><tspan x="585.0" dy="16">proteinuria</tspan></text><text x="735.0" y="1095.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: el colector cortical</tspan><tspan x="735.0" dy="16">causa Liddle</tspan></text><text x="885.0" y="1095.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: ese segmento es</tspan><tspan x="885.0" dy="16">el de Gitelman</tspan></text><rect x="40.0" y="1020.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1148.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1176.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1198.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Falla el NKCC2, el canal ROMK o el ClC-Kb: se pierde sodio y cloro, se activa renina-angiotensina-aldosterona y hay alcalosis metabólica</tspan><tspan x="58.0" dy="18">   hipopotasémica con presión normal o baja y calciuria alta.</tspan><tspan x="58.0" dy="18">• Sin glucosuria ni proteinuria se descarta el túbulo proximal (síndrome de Fanconi).</tspan><tspan x="58.0" dy="18">• Gitelman: túbulo distal (NCC, sensible a tiazidas), adolescentes o adultos, hipomagnesemia e hipocalciuria. Liddle: colector, hipertensión con</tspan><tspan x="58.0" dy="18">   hipopotasemia.</tspan><tspan x="58.0" dy="18">• Tratamiento: potasio y cloruro, indometacina y, con prudencia, espironolactona. Alcalosis hipopotasémica con presión normal y Cl urinario alto: Bartter,</tspan><tspan x="58.0" dy="18">   Gitelman o diuréticos ocultos.</tspan></text><text x="58.0" y="1328.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: KDIGO Controversies Conference, síndrome de Gitelman (Blanchard et al., Kidney Int 2017); Harrison, 21.ª ed. (2022); Nelson, 22.ª ed. (2024).</tspan></text></svg>