<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="960" viewBox="0 0 1000 960" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Vómitos y diarrea, oligoanuria, excreción fraccionada de sodio menor de 1 % y BUN/creatinina mayor de 20: lesión prerrenal"><title>Vómitos y diarrea, oligoanuria, excreción fraccionada de sodio menor de 1 % y BUN/creatinina mayor de 20: lesión prerrenal</title><rect x="0.75" y="0.75" width="998.5" height="958.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Nefrología · lesión renal aguda</tspan></text><rect x="381.8" y="32.0" width="182.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="473.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="167"><tspan x="473.1" dy="0">NEFROLOGÍA Y UROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Lesión renal aguda (KDIGO)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Creatinina +0,3 mg/dL en 48 horas, 1,5 veces la basal en 7 días o diuresis menor de 0,5</tspan><tspan x="58.0" dy="17">mL/kg/h por 6 horas.</tspan><tspan x="58.0" dy="17">Causa prerrenal, renal o posrenal.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 40 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Diarrea y vómitos hace 2 días, luego oligoanuria;</tspan><tspan x="640.0" dy="16">creatinina 3 mg/dL.</tspan><tspan x="640.0" dy="16">Excreción fraccionada de sodio menor de 1 %;</tspan><tspan x="640.0" dy="16">BUN/creatinina mayor de 20.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><rect x="40.0" y="277.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="303.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Pérdida de volumen + sodio urinario menor de 1 % + BUN/creatinina mayor de 20 = prerrenal</tspan></text><text x="60.0" y="322.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La necrosis tubular tiene excreción de sodio mayor de 2 %; la nefritis y la glomerulonefritis tienen sedimento propio.</tspan></text><text x="40.0" y="383.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ÍNDICES URINARIOS PARA DISTINGUIR LA LESIÓN PRERRENAL DE LA NECROSIS TUBULAR AGUDA</tspan></text><rect x="40.0" y="395.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="414.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Índice</tspan></text><text x="300.0" y="414.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Prerrenal</tspan></text><text x="635.0" y="414.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Necrosis tubular aguda</tspan></text><rect x="40.0" y="424.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="443.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Excreción de sodio</tspan></text><text x="300.0" y="443.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Menor de 1 %</tspan></text><text x="635.0" y="443.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Mayor de 2 %</tspan></text><rect x="190.6" y="427.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="236.0" y="442.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="236.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="453.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="472.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Relación BUN/creatinina</tspan></text><text x="300.0" y="472.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Mayor de 20</tspan></text><text x="635.0" y="472.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Menor de 20</tspan></text><rect x="40.0" y="482.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="501.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Osmolalidad urinaria</tspan></text><text x="300.0" y="501.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Alta (mayor de 500)</tspan></text><text x="635.0" y="501.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Menor de 350</tspan></text><rect x="40.0" y="511.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="530.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Sedimento</tspan></text><text x="300.0" y="530.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Normal o cilindros hialinos</tspan></text><text x="635.0" y="530.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Cilindros granulosos pigmentados</tspan></text><text x="40.0" y="556.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Las cifras de 1 % y 2 % son orientativas; el diurético distorsiona la excreción de sodio.</tspan></text><text x="40.0" y="603.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="613.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="644.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="616.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="644.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Prerrenal</tspan></text><text x="435.0" y="644.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Necrosis tubular</tspan></text><text x="585.0" y="644.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Nefritis intersticial</tspan></text><text x="735.0" y="644.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Glomerulonefritis</tspan></text><text x="885.0" y="635.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Uropatía</tspan><tspan x="885.0" dy="17">obstructiva</tspan></text><rect x="40.0" y="667.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="667.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="696.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Causa de la lesión</tspan><tspan x="54.0" dy="16">renal?</tspan></text><text x="285.0" y="696.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: hipoperfusión por</tspan><tspan x="285.0" dy="16">pérdida de volumen</tspan></text><text x="435.0" y="688.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: tendría sodio</tspan><tspan x="435.0" dy="16">urinario alto y cilindros</tspan><tspan x="435.0" dy="16">granulosos</tspan></text><text x="585.0" y="688.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: tendría</tspan><tspan x="585.0" dy="16">eosinofiluria, fiebre y</tspan><tspan x="585.0" dy="16">exantema</tspan></text><text x="735.0" y="688.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: tendría hematuria</tspan><tspan x="735.0" dy="16">dismórfica y cilindros</tspan><tspan x="735.0" dy="16">hemáticos</tspan></text><text x="885.0" y="696.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: se descarta con</tspan><tspan x="885.0" dy="16">ecografía</tspan></text><rect x="40.0" y="613.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="757.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="785.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="807.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Prerrenal: el túbulo conserva sodio y agua (aldosterona y hormona antidiurética), con excreción fraccionada de sodio menor de 1 %, relación</tspan><tspan x="58.0" dy="18">   urea/creatinina mayor de 20 y osmolalidad urinaria alta.</tspan><tspan x="58.0" dy="18">• Necrosis tubular aguda: excreción de sodio mayor de 2 %, osmolalidad urinaria menor de 350 y cilindros granulosos pigmentados.</tspan><tspan x="58.0" dy="18">• Nefritis intersticial: eosinofiluria, fiebre y exantema. Glomerulonefritis: hematuria dismórfica y cilindros hemáticos. Obstructiva: se descarta con ecografía.</tspan><tspan x="58.0" dy="18">• Tratamiento: reponer volumen con cristaloides balanceados. Alerta: una lesión prerrenal que no se corrige en 24 a 48 horas puede evolucionar a necrosis</tspan><tspan x="58.0" dy="18">   tubular.</tspan></text><text x="58.0" y="919.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: KDIGO, Clinical Practice Guideline for Acute Kidney Injury (Kidney Int Suppl 2012); Harrison Principios de Medicina Interna, 21.ª ed. (2022).</tspan></text></svg>