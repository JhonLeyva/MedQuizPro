<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1314" viewBox="0 0 1000 1314" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En el asma persistente leve del niño el controlador de elección es el corticoide inhalado en dosis bajas"><title>En el asma persistente leve del niño el controlador de elección es el corticoide inhalado en dosis bajas</title><rect x="0.75" y="0.75" width="998.5" height="1312.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · tratamiento del asma persistente</tspan></text><rect x="457.1" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="506.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="506.1" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Asma infantil</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Enfermedad inflamatoria crónica de las vías aéreas con hiperreactividad bronquial.</tspan><tspan x="58.0" dy="17">El tratamiento escalonado se basa en controlar la inflamación.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de fármaco</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es el fármaco de elección en el asma crónica</tspan><tspan x="640.0" dy="16">persistente leve del niño?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ PAPEL TIENE CADA FÁRMACO EN EL ASMA INFANTIL</tspan></text><rect x="40.0" y="269.0" width="920.0" height="180.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="269.0" width="108.0" height="180.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="359.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Controlador de</tspan><tspan x="94.0" dy="14">primera línea</tspan></text><rect x="40.0" y="449.0" width="920.0" height="180.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="449.0" width="108.0" height="180.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="539.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Alternativa o</tspan><tspan x="94.0" dy="14">paso siguiente</tspan></text><rect x="40.0" y="629.0" width="920.0" height="180.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="629.0" width="108.0" height="180.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="719.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Rescate o uso</tspan><tspan x="94.0" dy="14">limitado</tspan></text><line x1="280.0" y1="349.5" x2="287.0" y2="349.5" stroke="#0f766e" stroke-width="2.2"/><line x1="287.0" y1="349.5" x2="287.0" y2="504.5" stroke="#0f766e" stroke-width="2.2"/><line x1="287.0" y1="504.5" x2="285.0" y2="504.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="285.0,509.5 285.0,499.5 294.0,504.5" fill="#0f766e"/><line x1="416.0" y1="504.5" x2="423.0" y2="504.5" stroke="#0f766e" stroke-width="2.2"/><line x1="423.0" y1="504.5" x2="423.0" y2="539.0" stroke="#0f766e" stroke-width="2.2"/><line x1="423.0" y1="539.0" x2="421.0" y2="539.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="421.0,544.0 421.0,534.0 430.0,539.0" fill="#0f766e"/><line x1="552.0" y1="539.0" x2="559.0" y2="539.0" stroke="#0f766e" stroke-width="2.2"/><line x1="559.0" y1="539.0" x2="559.0" y2="684.5" stroke="#0f766e" stroke-width="2.2"/><line x1="559.0" y1="684.5" x2="557.0" y2="684.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="557.0,689.5 557.0,679.5 566.0,684.5" fill="#0f766e"/><line x1="688.0" y1="684.5" x2="695.0" y2="684.5" stroke="#0f766e" stroke-width="2.2"/><line x1="695.0" y1="684.5" x2="695.0" y2="701.0" stroke="#0f766e" stroke-width="2.2"/><line x1="695.0" y1="701.0" x2="693.0" y2="701.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="693.0,706.0 693.0,696.0 702.0,701.0" fill="#0f766e"/><line x1="824.0" y1="701.0" x2="831.0" y2="701.0" stroke="#0f766e" stroke-width="2.2"/><line x1="831.0" y1="701.0" x2="831.0" y2="684.5" stroke="#0f766e" stroke-width="2.2"/><line x1="831.0" y1="684.5" x2="829.0" y2="684.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="829.0,689.5 829.0,679.5 838.0,684.5" fill="#0f766e"/><rect x="158.0" y="282.0" width="122.0" height="135.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="168.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="102"><tspan x="168.0" dy="0">Corticoide</tspan><tspan x="168.0" dy="16">inhalado en</tspan><tspan x="168.0" dy="16">dosis baja</tspan></text><text x="168.0" y="347.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="168.0" dy="0">Controla la</tspan><tspan x="168.0" dy="14.5">inflamación y</tspan><tspan x="168.0" dy="14.5">reduce</tspan><tspan x="168.0" dy="14.5">exacerbaciones</tspan></text><circle cx="158.0" cy="282.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="294.0" y="462.0" width="122.0" height="85.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="304.0" y="478.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="304.0" dy="0">Montelukast</tspan></text><text x="304.0" y="495.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="304.0" dy="0">Segunda línea, con</tspan><tspan x="304.0" dy="14.5">advertencia</tspan><tspan x="304.0" dy="14.5">neuropsiquiátrica</tspan></text><circle cx="294.0" cy="462.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="294.0" y="466.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="294.0" dy="0">2</tspan></text><rect x="430.0" y="462.0" width="122.0" height="154.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="440.0" y="478.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="440.0" dy="0">Corticoide en</tspan><tspan x="440.0" dy="16">dosis media o</tspan><tspan x="440.0" dy="16">con beta</tspan><tspan x="440.0" dy="16">agonista de</tspan><tspan x="440.0" dy="16">acción</tspan><tspan x="440.0" dy="16">prolongada</tspan></text><text x="440.0" y="575.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="440.0" dy="0">Paso 3 si no hay</tspan><tspan x="440.0" dy="14.5">control</tspan></text><circle cx="430.0" cy="462.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="430.0" y="466.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="430.0" dy="0">3</tspan></text><rect x="566.0" y="642.0" width="122.0" height="85.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="576.0" y="658.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="576.0" dy="0">Salbutamol</tspan></text><text x="576.0" y="675.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="576.0" dy="0">Rescate: no</tspan><tspan x="576.0" dy="14.5">controla la</tspan><tspan x="576.0" dy="14.5">inflamación</tspan></text><circle cx="566.0" cy="642.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="566.0" y="646.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="566.0" dy="0">4</tspan></text><rect x="702.0" y="642.0" width="122.0" height="118.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="712.0" y="658.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="712.0" dy="0">Bromuro de</tspan><tspan x="712.0" dy="16">ipratropio</tspan></text><text x="712.0" y="691.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="712.0" dy="0">Anticolinérgico de</tspan><tspan x="712.0" dy="14.5">rescate en crisis</tspan><tspan x="712.0" dy="14.5">moderadas a</tspan><tspan x="712.0" dy="14.5">graves</tspan></text><circle cx="702.0" cy="642.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="702.0" y="646.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="702.0" dy="0">5</tspan></text><rect x="838.0" y="642.0" width="122.0" height="85.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="848.0" y="658.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="848.0" dy="0">Teofilina</tspan></text><text x="848.0" y="675.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="848.0" dy="0">Margen estrecho;</tspan><tspan x="848.0" dy="14.5">casos</tspan><tspan x="848.0" dy="14.5">seleccionados</tspan></text><circle cx="838.0" cy="642.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="838.0" y="646.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="838.0" dy="0">6</tspan></text><rect x="40.0" y="827.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="853.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Asma persistente leve = corticoide inhalado</tspan></text><text x="60.0" y="872.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Salbutamol, ipratropio, teofilina y montelukast no son el controlador de elección.</tspan></text><text x="40.0" y="939.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="949.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="980.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="971.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Bromuro de</tspan><tspan x="285.0" dy="17">ipratropio</tspan></text><text x="435.0" y="980.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Antileucotrienos</tspan></text><text x="585.0" y="980.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Salbutamol</tspan></text><text x="735.0" y="980.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Teofilina</tspan></text><rect x="813.0" y="952.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="971.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Corticoides</tspan><tspan x="885.0" dy="17">inhalados</tspan></text><rect x="40.0" y="1003.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="1003.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1040.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Fármaco de elección?</tspan></text><text x="285.0" y="1024.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: broncodilatador de</tspan><tspan x="285.0" dy="16">rescate en crisis</tspan><tspan x="285.0" dy="16">moderadas a graves</tspan></text><text x="435.0" y="1032.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: alternativa de</tspan><tspan x="435.0" dy="16">segunda línea</tspan></text><text x="585.0" y="1032.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: alivia síntomas, no</tspan><tspan x="585.0" dy="16">controla la inflamación</tspan></text><text x="735.0" y="1024.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: margen</tspan><tspan x="735.0" dy="16">terapéutico estrecho;</tspan><tspan x="735.0" dy="16">casos seleccionados</tspan></text><text x="885.0" y="1032.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: controlador de</tspan><tspan x="885.0" dy="16">primera línea</tspan></text><rect x="40.0" y="949.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1093.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1121.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1143.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El corticoide inhalado en dosis baja es el controlador de primera línea (paso 2 de GINA 2025 en niños de 6 a 11 años); reduce síntomas, exacerbaciones</tspan><tspan x="58.0" dy="18">   y hospitalizaciones.</tspan><tspan x="58.0" dy="18">• Alternativa de segunda línea: antagonista de leucotrienos (montelukast), con advertencia de eventos neuropsiquiátricos.</tspan><tspan x="58.0" dy="18">• El salbutamol alivia el síntoma, no controla la inflamación y en monoterapia aumenta el riesgo de exacerbaciones; ipratropio es rescate en crisis</tspan><tspan x="58.0" dy="18">   moderada a grave; la teofilina tiene margen estrecho.</tspan><tspan x="58.0" dy="18">• Sin control: subir al paso 3 (corticoide en dosis media o corticoide más beta agonista de acción prolongada). Antes, revisar técnica con espaciador,</tspan><tspan x="58.0" dy="18">   adherencia y desencadenantes.</tspan></text><text x="58.0" y="1273.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: GINA, Estrategia global para el manejo y la prevención del asma, actualización 2025; Nelson Tratado de Pediatría, 22.ª ed. (2024).</tspan></text></svg>