<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1133" viewBox="0 0 1000 1133" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Comparar el desempeño del trabajador con los objetivos de su puesto es la evaluación del desempeño"><title>Comparar el desempeño del trabajador con los objetivos de su puesto es la evaluación del desempeño</title><rect x="0.75" y="0.75" width="998.5" height="1131.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Gestión · recursos humanos en salud</tspan></text><rect x="422.2" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="486.5" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="486.5" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Administración de recursos humanos</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Planificación, selección, inducción, capacitación, evaluación, compensación y retención.</tspan><tspan x="58.0" dy="17">Cada actividad responde a una pregunta distinta.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de definición</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Actividad que compara el desempeño con los</tspan><tspan x="640.0" dy="16">parámetros del puesto.</tspan><tspan x="640.0" dy="16">¿Cómo se llama?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ PREGUNTA RESPONDE CADA ACTIVIDAD</tspan></text><text x="40.0" y="297.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="430"><tspan x="40.0" dy="0">QUÉ HACE</tspan></text><text x="516.0" y="297.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="444"><tspan x="516.0" dy="0">ACTIVIDAD</tspan></text><rect x="40.0" y="307.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="336.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="341.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><text x="84.0" y="333.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">¿Cuántos y cuáles trabajadores se necesitan?</tspan></text><text x="84.0" y="350.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Prevé la dotación futura</tspan></text><line x1="476.0" y1="336.5" x2="503.0" y2="336.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,331.5 502.0,341.5 510.0,336.5" fill="#ea580c"/><rect x="516.0" y="309.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="333.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Planificación de recursos humanos</tspan></text><text x="530.0" y="350.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0"></tspan></text><line x1="255.0" y1="368.0" x2="255.0" y2="381.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,380.0 260.0,380.0 255.0,388.0" fill="#0f766e"/><rect x="40.0" y="390.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="419.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="424.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">2</tspan></text><text x="84.0" y="416.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">¿A quién se contrata?</tspan></text><text x="84.0" y="433.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Reclutar, seleccionar y verificar referencias</tspan></text><line x1="476.0" y1="419.5" x2="503.0" y2="419.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,414.5 502.0,424.5 510.0,419.5" fill="#ea580c"/><rect x="516.0" y="392.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="416.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Selección</tspan></text><text x="530.0" y="433.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Incluye verificar referencias</tspan></text><line x1="255.0" y1="451.0" x2="255.0" y2="464.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,463.0 260.0,463.0 255.0,471.0" fill="#0f766e"/><rect x="40.0" y="473.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="502.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="507.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">3</tspan></text><text x="84.0" y="499.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">¿Cumple lo que se espera del puesto?</tspan></text><text x="84.0" y="516.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Compara el desempeño con los parámetros y objetivos</tspan></text><line x1="476.0" y1="502.5" x2="503.0" y2="502.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,497.5 502.0,507.5 510.0,502.5" fill="#ea580c"/><rect x="516.0" y="475.0" width="444.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="530.0" y="499.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Evaluación del desempeño</tspan></text><text x="530.0" y="516.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Caso de la pregunta</tspan></text><line x1="255.0" y1="534.0" x2="255.0" y2="547.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,546.0 260.0,546.0 255.0,554.0" fill="#0f766e"/><rect x="40.0" y="556.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="585.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="590.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">4</tspan></text><text x="84.0" y="582.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">¿Qué hacer con el resultado?</tspan></text><text x="84.0" y="599.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Capacitar, premiar, ascender o corregir</tspan></text><line x1="476.0" y1="585.5" x2="503.0" y2="585.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,580.5 502.0,590.5 510.0,585.5" fill="#ea580c"/><rect x="516.0" y="558.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="582.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Capacitación e incentivos</tspan></text><text x="530.0" y="599.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0"></tspan></text><rect x="40.0" y="633.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="659.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Desempeño frente a objetivos del puesto = evaluación del desempeño</tspan></text><text x="60.0" y="678.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Planificación y verificación de referencias ocurren antes de contratar.</tspan></text><text x="40.0" y="745.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="755.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="786.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="758.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="777.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Evaluación del</tspan><tspan x="285.0" dy="17">desempeño</tspan></text><text x="435.0" y="777.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Supervisión y</tspan><tspan x="435.0" dy="17">monitoreo</tspan></text><text x="585.0" y="777.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Planificación de</tspan><tspan x="585.0" dy="17">recursos humanos</tspan></text><text x="735.0" y="777.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Incremento de la</tspan><tspan x="735.0" dy="17">efectividad</tspan></text><text x="885.0" y="777.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Verificación de</tspan><tspan x="885.0" dy="17">referencias</tspan></text><rect x="40.0" y="809.0" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="809.0" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="838.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Compara el</tspan><tspan x="54.0" dy="16">desempeño con el</tspan><tspan x="54.0" dy="16">puesto?</tspan></text><text x="285.0" y="838.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: mide el</tspan><tspan x="285.0" dy="16">cumplimiento frente a</tspan><tspan x="285.0" dy="16">los estándares</tspan></text><text x="435.0" y="830.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: seguimiento</tspan><tspan x="435.0" dy="16">general de actividades,</tspan><tspan x="435.0" dy="16">sin comparar con el</tspan><tspan x="435.0" dy="16">puesto</tspan></text><text x="585.0" y="838.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: prevé cuántos</tspan><tspan x="585.0" dy="16">trabajadores se</tspan><tspan x="585.0" dy="16">necesitan</tspan></text><text x="735.0" y="838.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no es una</tspan><tspan x="735.0" dy="16">actividad básica</tspan><tspan x="735.0" dy="16">definida</tspan></text><text x="885.0" y="846.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: paso de la</tspan><tspan x="885.0" dy="16">selección de personal</tspan></text><rect x="40.0" y="755.0" width="920.0" height="136.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="915.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="943.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="965.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Evaluación del desempeño: proceso sistemático y periódico que mide el cumplimiento de funciones y metas frente a los estándares fijados para el</tspan><tspan x="58.0" dy="18">   puesto.</tspan><tspan x="58.0" dy="18">• Sirve para detectar necesidades de capacitación, reconocer el buen rendimiento, asignar incentivos, decidir ascensos y ver si el trabajador se adecua al</tspan><tspan x="58.0" dy="18">   puesto.</tspan><tspan x="58.0" dy="18">• En el Perú, el servicio civil (Ley 30057) la organiza como ciclo anual con metas concertadas y retroalimentación.</tspan><tspan x="58.0" dy="18">• Alerta: planificar es prever cuántos y cuáles trabajadores se necesitan; verificar referencias es un paso de la selección; ninguno compara con el puesto.</tspan></text><text x="58.0" y="1077.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Chiavenato I., Administración de recursos humanos, 10.ª ed.; SERVIR, Ley 30057 del Servicio Civil y su reglamento (Perú); OPS/OMS, Metas regionales en recursos</tspan><tspan x="58.0" dy="15">humanos para la salud 2007-2015.</tspan></text></svg>