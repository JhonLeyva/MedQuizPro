<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="848" viewBox="0 0 1000 848" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Para conocer la probabilidad de que un hipertenso fumador tenga cardiopatía isquémica en 5 años se usa la incidencia acumulada de ese grupo"><title>Para conocer la probabilidad de que un hipertenso fumador tenga cardiopatía isquémica en 5 años se usa la incidencia acumulada de ese grupo</title><rect x="0.75" y="0.75" width="998.5" height="847.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Epidemiología · medidas de frecuencia y asociación</tspan></text><rect x="507.0" y="32.0" width="143.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="578.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="127"><tspan x="578.7" dy="0">SALUD PÚBLICA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Incidencia acumulada (riesgo)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Casos nuevos en un periodo ÷ personas sanas al inicio. Es una probabilidad: va de 0 a 1.</tspan><tspan x="58.0" dy="17">Responde a «¿qué probabilidad tengo de enfermar en X años?».</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Paciente hipertenso y fumador</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta su probabilidad de tener cardiopatía</tspan><tspan x="640.0" dy="16">isquémica en 5 años.</tspan><tspan x="640.0" dy="16">¿Qué indicador se busca?</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#94a3b8"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="149.8" y1="395.0" x2="850.2" y2="395.0" stroke="#94a3b8" stroke-width="2"/><line x1="149.8" y1="395.0" x2="149.8" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="144.8,423.0 154.8,423.0 149.8,431.0" fill="#94a3b8"/><line x1="383.2" y1="395.0" x2="383.2" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="378.2,423.0 388.2,423.0 383.2,431.0" fill="#94a3b8"/><line x1="616.8" y1="395.0" x2="616.8" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="611.8,423.0 621.8,423.0 616.8,431.0" fill="#94a3b8"/><line x1="850.2" y1="395.0" x2="850.2" y2="424.0" stroke="#94a3b8" stroke-width="2"/><polygon points="845.2,423.0 855.2,423.0 850.2,431.0" fill="#94a3b8"/><line x1="320.0" y1="241.0" x2="320.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="271.0" x2="500.0" y2="271.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="271.0" x2="500.0" y2="300.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,299.0 505.0,299.0 500.0,307.0" fill="#0f766e"/><line x1="500.0" y1="365.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="149.8" y1="395.0" x2="500.0" y2="395.0" stroke="#0f766e" stroke-width="3"/><line x1="149.8" y1="395.0" x2="149.8" y2="424.0" stroke="#0f766e" stroke-width="3"/><polygon points="144.8,423.0 154.8,423.0 149.8,431.0" fill="#0f766e"/><rect x="44.4" y="404.0" width="210.8" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="149.8" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="149.8" dy="0">Mi probabilidad de enfermar en X años</tspan></text><rect x="264.2" y="404.0" width="238.2" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="383.2" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="383.2" dy="0">Cuántas veces más riesgo tiene el expuesto</tspan></text><rect x="524.7" y="404.0" width="184.1" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="616.8" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="616.8" dy="0">Cuántos casos se deben al factor</tspan></text><rect x="774.6" y="404.0" width="151.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="850.2" y="416.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="850.2" dy="0">Cuántos enfermos hay hoy</tspan></text><polygon points="240.0,336.0 266.0,307.0 734.0,307.0 760.0,336.0 734.0,365.0 266.0,365.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="336.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="341.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="340.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">¿Qué quiere saber?</tspan></text><rect x="40.0" y="431.0" width="219.5" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="149.8" y="459.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="192"><tspan x="149.8" dy="0">INCIDENCIA ACUMULADA</tspan></text><text x="149.8" y="482.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="192"><tspan x="149.8" dy="0">Casos nuevos ÷ sanos al inicio</tspan><tspan x="149.8" dy="17">Este caso</tspan></text><rect x="273.5" y="431.0" width="219.5" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="383.2" y="467.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="192"><tspan x="383.2" dy="0">Riesgo relativo</tspan></text><text x="383.2" y="490.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="192"><tspan x="383.2" dy="0">IA expuestos ÷ IA no expuestos</tspan></text><rect x="507.0" y="431.0" width="219.5" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="616.8" y="467.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="192"><tspan x="616.8" dy="0">Fracción atribuible</tspan></text><text x="616.8" y="490.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="192"><tspan x="616.8" dy="0">(RR − 1) ÷ RR</tspan></text><rect x="740.5" y="431.0" width="219.5" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="850.2" y="467.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="192"><tspan x="850.2" dy="0">Prevalencia</tspan></text><text x="850.2" y="490.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="192"><tspan x="850.2" dy="0">Casos existentes ÷ población</tspan></text><text x="40.0" y="561.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="571.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="602.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="574.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="594.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Incidencia</tspan><tspan x="285.0" dy="17">acumulada</tspan></text><text x="435.0" y="594.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Densidad de</tspan><tspan x="435.0" dy="17">incidencia</tspan></text><text x="585.0" y="602.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Riesgo relativo</tspan></text><text x="735.0" y="602.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Fracción atribuible</tspan></text><text x="885.0" y="594.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Prevalencia en la</tspan><tspan x="885.0" dy="17">población general</tspan></text><rect x="40.0" y="625.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="625.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="646.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Responde su</tspan><tspan x="54.0" dy="16">pregunta?</tspan></text><text x="285.0" y="646.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: probabilidad en 5</tspan><tspan x="285.0" dy="16">años</tspan></text><text x="435.0" y="646.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es una velocidad</tspan><tspan x="435.0" dy="16">(persona-tiempo)</tspan></text><text x="585.0" y="646.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: compara dos</tspan><tspan x="585.0" dy="16">grupos</tspan></text><text x="735.0" y="654.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: impacto del factor</tspan></text><text x="885.0" y="646.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: casos existentes,</tspan><tspan x="885.0" dy="16">no nuevos</tspan></text><rect x="40.0" y="571.5" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="699.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="727.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="749.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Incidencia acumulada: probabilidad individual en un tiempo dado (este caso).</tspan><tspan x="58.0" dy="18">• Densidad de incidencia: casos ÷ persona-tiempo; es una velocidad, no una probabilidad.</tspan><tspan x="58.0" dy="18">• Riesgo relativo compara expuestos con no expuestos; fracción atribuible mide cuánto se evitaría quitando el factor.</tspan></text><text x="58.0" y="807.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Gordis, Epidemiología 6.ª ed.; Rothman, Epidemiología moderna.</tspan></text></svg>