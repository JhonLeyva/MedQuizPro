<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1356" viewBox="0 0 1000 1356" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La apnea obstructiva del sueño por hipertrofia adenoamigdalar es la indicación absoluta clásica de amigdalectomía"><title>La apnea obstructiva del sueño por hipertrofia adenoamigdalar es la indicación absoluta clásica de amigdalectomía</title><rect x="0.75" y="0.75" width="998.5" height="1354.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Otorrinolaringología · amigdalectomía en el niño</tspan></text><rect x="485.7" y="32.0" width="162.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="566.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="146"><tspan x="566.9" dy="0">OFTALMOLOGÍA Y ORL RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hipertrofia adenoamigdalar</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Causa más común de trastornos respiratorios del sueño en la infancia, del ronquido</tspan><tspan x="58.0" dy="17">primario a la apnea.</tspan><tspan x="58.0" dy="17">Ronquido, pausas, respiración bucal, enuresis y mal rendimiento escolar.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es una indicación absoluta de amigdalectomía</tspan><tspan x="640.0" dy="16">en el niño?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SE PIENSA EN ESTE ORDEN</tspan></text><rect x="40.0" y="269.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="314.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="342.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">1</tspan></text><rect x="124.0" y="269.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="297.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Hay obstrucción de la vía aérea?</tspan></text><rect x="136.0" y="311.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="331.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Ronquido, pausas respiratorias y amígdalas grandes</tspan></text><text x="152.0" y="350.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Sospechar apnea obstructiva; polisomnografía si hay obesidad, Down, anomalías craneofaciales o enfermedad neuromuscular.</tspan></text><line x1="77.0" y1="372.0" x2="77.0" y2="391.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,390.0 82.0,390.0 77.0,398.0" fill="#0f766e"/><text x="134.0" y="390.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="400.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="445.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="473.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">2</tspan></text><rect x="124.0" y="400.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="428.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Hay infecciones repetidas?</tspan></text><rect x="136.0" y="442.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="462.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Amigdalitis recurrente</tspan></text><text x="152.0" y="481.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Indicación relativa: exige 7 episodios en 1 año, 5 por año durante 2 años o 3 por año durante 3 años.</tspan></text><line x1="77.0" y1="503.0" x2="77.0" y2="522.0" stroke="#0f766e" stroke-width="2"/><polygon points="72.0,521.0 82.0,521.0 77.0,529.0" fill="#0f766e"/><text x="134.0" y="521.0" font-size="11" font-weight="700" font-style="normal" fill="#64748b" text-anchor="start" data-max="100"><tspan x="134.0" dy="0">entonces…</tspan></text><rect x="40.0" y="531.0" width="74.0" height="103.0" rx="14" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="77.0" y="576.5" font-size="10.5" font-weight="800" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">PASO</tspan></text><text x="77.0" y="604.5" font-size="28" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="77.0" dy="0">3</tspan></text><rect x="124.0" y="531.0" width="836.0" height="103.0" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.6"/><text x="140.0" y="559.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="806"><tspan x="140.0" dy="0">¿Qué no es indicación?</tspan></text><rect x="136.0" y="573.0" width="812.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="152.0" y="593.0" font-size="13.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">Halitosis aislada o flemón único</tspan></text><text x="152.0" y="612.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="776"><tspan x="152.0" dy="0">El flemón se drena con antibiótico y se opera de forma electiva si recurre.</tspan></text><rect x="40.0" y="652.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="678.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Apnea del sueño = indicación absoluta de amigdalectomía</tspan></text><text x="60.0" y="697.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La amigdalitis recurrente es relativa; la halitosis y el flemón único no la justifican.</tspan></text><text x="40.0" y="758.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">INDICACIONES DE AMIGDALECTOMÍA EN EL NIÑO</tspan></text><rect x="40.0" y="770.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="789.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="304"><tspan x="50.0" dy="0">Indicación</tspan></text><text x="370.0" y="789.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="284"><tspan x="370.0" dy="0">Tipo</tspan></text><text x="670.0" y="789.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="284"><tspan x="670.0" dy="0">Condición</tspan></text><rect x="40.0" y="799.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="818.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="304"><tspan x="50.0" dy="0">Apnea obstructiva del sueño</tspan></text><text x="370.0" y="818.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="284"><tspan x="370.0" dy="0">Absoluta (clave del banco)</tspan></text><text x="670.0" y="818.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="284"><tspan x="670.0" dy="0">Ronquido y amígdalas grandes con sospecha de</tspan><tspan x="670.0" dy="15">apnea</tspan></text><rect x="260.6" y="810.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="306.0" y="825.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="306.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="843.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="862.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="50.0" dy="0">Neoplasia maligna probable</tspan></text><text x="370.0" y="862.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="284"><tspan x="370.0" dy="0">Absoluta en la literatura</tspan></text><text x="670.0" y="862.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="284"><tspan x="670.0" dy="0">No es la clave de este banco</tspan></text><rect x="40.0" y="872.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="891.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="50.0" dy="0">Amigdalitis recurrente</tspan></text><text x="370.0" y="891.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="284"><tspan x="370.0" dy="0">Relativa</tspan></text><text x="670.0" y="891.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="284"><tspan x="670.0" dy="0">Criterios de Paradise</tspan></text><rect x="40.0" y="901.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="920.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="50.0" dy="0">Flemón periamigdalino</tspan></text><text x="370.0" y="920.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="284"><tspan x="370.0" dy="0">Electiva si recurre</tspan></text><text x="670.0" y="920.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="284"><tspan x="670.0" dy="0">Drenaje y antibiótico</tspan></text><rect x="40.0" y="930.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="949.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="50.0" dy="0">Halitosis aislada</tspan></text><text x="370.0" y="949.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="284"><tspan x="370.0" dy="0">No es indicación</tspan></text><text x="670.0" y="949.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="284"><tspan x="670.0" dy="0">Sin otro criterio</tspan></text><text x="40.0" y="999.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1009.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1040.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="1012.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="1040.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Apnea del sueño</tspan></text><text x="435.0" y="1031.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Amigdalitis</tspan><tspan x="435.0" dy="17">recurrente</tspan></text><text x="585.0" y="1040.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Halitosis severa</tspan></text><text x="735.0" y="1031.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Probable neoplasia</tspan><tspan x="735.0" dy="17">maligna</tspan></text><text x="885.0" y="1031.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Flemón</tspan><tspan x="885.0" dy="17">periamigdalino</tspan></text><rect x="40.0" y="1063.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1063.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1100.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Indicación absoluta?</tspan></text><text x="285.0" y="1092.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: obstrucción de vía</tspan><tspan x="285.0" dy="16">aérea con apnea</tspan></text><text x="435.0" y="1084.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: indicación relativa</tspan><tspan x="435.0" dy="16">con criterios de</tspan><tspan x="435.0" dy="16">Paradise</tspan></text><text x="585.0" y="1092.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: aislada, no es</tspan><tspan x="585.0" dy="16">indicación</tspan></text><text x="735.0" y="1084.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: también absoluta,</tspan><tspan x="735.0" dy="16">pero la clave es la</tspan><tspan x="735.0" dy="16">apnea</tspan></text><text x="885.0" y="1084.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: drenaje y</tspan><tspan x="885.0" dy="16">antibiótico; cirugía</tspan><tspan x="885.0" dy="16">electiva si recurre</tspan></text><rect x="40.0" y="1009.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1153.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1181.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1203.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La guía AAO-HNSF 2019 recomienda amigdalectomía en niños con ronquido y amígdalas grandes con sospecha de apnea obstructiva; polisomnografía</tspan><tspan x="58.0" dy="18">   previa si hay obesidad, Down, anomalías craneofaciales o enfermedad neuromuscular.</tspan><tspan x="58.0" dy="18">• Amigdalitis recurrente: indicación relativa con criterios de Paradise (7 episodios en 1 año, 5 por año durante 2 años o 3 por año durante 3 años).</tspan><tspan x="58.0" dy="18">• Flemón periamigdalino: drenaje y antibiótico, cirugía electiva si recurre. La halitosis aislada no es indicación. La neoplasia maligna también es indicación</tspan><tspan x="58.0" dy="18">   absoluta, pero la clave es la apnea.</tspan><tspan x="58.0" dy="18">• Alerta: la hemorragia posamigdalectomía aparece sobre todo a los 5-10 días y requiere vigilancia.</tspan></text><text x="58.0" y="1315.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Mitchell RB et al., AAO-HNSF, amigdalectomía en niños, actualización 2019. Otolaryngol Head Neck Surg 2019; Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>