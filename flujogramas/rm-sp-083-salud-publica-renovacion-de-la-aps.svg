<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="982" viewBox="0 0 1000 982" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La OPS renovó la APS en 2007 para fortalecer la capacidad de la sociedad de reducir las inequidades en salud"><title>La OPS renovó la APS en 2007 para fortalecer la capacidad de la sociedad de reducir las inequidades en salud</title><rect x="0.75" y="0.75" width="998.5" height="980.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Salud pública · renovación de la APS</tspan></text><rect x="418.3" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="482.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="482.6" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Atención primaria de salud</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Alma-Ata (1978): estrategia para alcanzar la salud para todos.</tspan><tspan x="58.0" dy="17">La OPS/OMS adoptó su renovación en 2007.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de fundamento</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Razón por la que la OPS renovó la APS en las</tspan><tspan x="640.0" dy="16">Américas en 2007.</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">POR QUÉ SE RENOVÓ LA APS EN 2007</tspan></text><line x1="410.9" y1="404.9" x2="340.0" y2="428.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="428.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.0" y1="344.6" x2="660.0" y2="320.3" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="320.3" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="403.0" x2="660.0" y2="425.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="425.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="410.9" y1="345.1" x2="340.0" y2="321.4" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="321.4" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="375.0" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="375.0" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="370.5" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">RENOVACIÓN DE</tspan><tspan x="500.0" dy="19">LA APS</tspan></text><text x="500.0" y="408.5" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">OPS/OMS 2007</tspan></text><rect x="40.0" y="275.8" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="304.7" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">REDUCIR INEQUIDADES</tspan></text><text x="190.0" y="328.3" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Razón de fondo: salud como derecho y justicia</tspan><tspan x="190.0" dy="17">social</tspan></text><rect x="144.6" y="357.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="372.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="383.0" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="384.0" width="6.0" height="89.2" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="411.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">SERVICIOS LOCALES</tspan></text><text x="190.0" y="435.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Componente: fortalecer la capacidad de los</tspan><tspan x="190.0" dy="17">servicios</tspan></text><rect x="660.0" y="278.3" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="279.3" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="810.0" y="312.1" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">CAPACITACIÓN Y EDUCACIÓN</tspan></text><text x="810.0" y="335.7" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Estrategia incluida, no la razón</tspan></text><rect x="660.0" y="378.3" width="300.0" height="93.3" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="379.3" width="6.0" height="91.3" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="407.2" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">SALUD MATERNA INFANTIL Y</tspan><tspan x="810.0" dy="19.2">SANEAMIENTO</tspan></text><text x="810.0" y="450.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Programas específicos dentro de la estrategia</tspan></text><text x="40.0" y="517.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="529.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="562.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Alma-Ata 1978</tspan></text><line x1="248.5" y1="558.0" x2="267.5" y2="558.0" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,553.0 266.5,563.0 274.5,558.0" fill="#0f766e"/><rect x="278.5" y="529.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="562.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Inequidades y nuevos desafíos</tspan></text><line x1="487.0" y1="558.0" x2="506.0" y2="558.0" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,553.0 505.0,563.0 513.0,558.0" fill="#0f766e"/><rect x="517.0" y="529.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="562.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Documento de posición 2007</tspan></text><line x1="725.5" y1="558.0" x2="744.5" y2="558.0" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,553.0 743.5,563.0 751.5,558.0" fill="#0f766e"/><rect x="755.5" y="529.0" width="204.5" height="58.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="553.5" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Capacidad de la sociedad</tspan><tspan x="857.8" dy="17">para reducir inequidades</tspan></text><text x="40.0" y="627.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="637.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="676.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="640.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="659.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Reducir</tspan><tspan x="285.0" dy="17">inequidades en la</tspan><tspan x="285.0" dy="17">sociedad</tspan></text><text x="435.0" y="668.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Capacidad de los</tspan><tspan x="435.0" dy="17">servicios locales</tspan></text><text x="585.0" y="659.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Impulsa la</tspan><tspan x="585.0" dy="17">capacitación y</tspan><tspan x="585.0" dy="17">educación en salud</tspan></text><text x="735.0" y="668.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Programas de salud</tspan><tspan x="735.0" dy="17">materna infantil</tspan></text><text x="885.0" y="659.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Mejora del</tspan><tspan x="885.0" dy="17">saneamiento</tspan><tspan x="885.0" dy="17">ambiental</tspan></text><rect x="40.0" y="708.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="708.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="729.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Razón de la</tspan><tspan x="54.0" dy="16">renovación?</tspan></text><text x="285.0" y="729.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: reducir inequidades</tspan><tspan x="285.0" dy="16">es su razón de fondo</tspan></text><text x="435.0" y="729.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es un componente,</tspan><tspan x="435.0" dy="16">no la razón</tspan></text><text x="585.0" y="729.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es una estrategia</tspan><tspan x="585.0" dy="16">incluida, no la razón</tspan></text><text x="735.0" y="729.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es un programa</tspan><tspan x="735.0" dy="16">específico</tspan></text><text x="885.0" y="729.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es una acción</tspan><tspan x="885.0" dy="16">específica</tspan></text><rect x="40.0" y="637.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="782.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="810.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="832.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Motivos: inequidades persistentes, envejecimiento, enfermedades crónicas, urbanización, enfermedades emergentes y una APS selectiva y fragmentada.</tspan><tspan x="58.0" dy="18">• Razón de fondo: revitalizar la capacidad de los países para una estrategia coordinada, eficaz y sostenible que reduzca las inequidades.</tspan><tspan x="58.0" dy="18">• Toma la salud como derecho y la justicia social como principio; los servicios locales, la capacitación, lo materno infantil y el saneamiento son</tspan><tspan x="58.0" dy="18">   componentes, no la razón.</tspan><tspan x="58.0" dy="18">• Alerta: la Declaración de Astaná (2018) reafirmó la APS como base de la cobertura universal.</tspan></text><text x="58.0" y="926.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OPS/OMS, La renovación de la Atención Primaria de Salud en las Américas (documento de posición, 2007); OMS, Declaración de Astaná (2018); OPS, Estrategia para</tspan><tspan x="58.0" dy="15">el acceso universal a la salud (2014).</tspan></text></svg>