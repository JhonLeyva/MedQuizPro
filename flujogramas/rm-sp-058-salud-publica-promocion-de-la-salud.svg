ne" stroke-width="1.5"/><text x="190.0" y="437.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">SOCIAL</tspan></text><text x="190.0" y="460.7" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Redes y cohesión</tspan><tspan x="190.0" dy="17">Apoyo social</tspan></text><rect x="40.0" y="515.3" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="516.3" width="6.0" height="89.2" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="190.0" y="544.2" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">ECONÓMICA</tspan></text><text x="190.0" y="567.8" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Ingresos y empleo</tspan><tspan x="190.0" dy="17">Financiamiento</tspan></text><rect x="660.0" y="354.6" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="810.0" y="383.4" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">POLÍTICA</tspan></text><text x="810.0" y="407.1" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Políticas, planes y presupuestos</tspan><tspan x="810.0" dy="17">Participación ciudadana</tspan></text><rect x="764.6" y="435.8" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="810.0" y="450.8" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="810.0" dy="0">◆ ESTE CASO</tspan></text><rect x="660.0" y="461.8" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="462.8" width="6.0" height="89.2" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="490.6" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">CULTURAL</tspan></text><text x="810.0" y="514.2" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Valores y creencias</tspan><tspan x="810.0" dy="17">Prácticas y costumbres</tspan></text><text x="40.0" y="642.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="654.5" width="204.5" height="75.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="687.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">El alcalde convoca a los</tspan><tspan x="142.2" dy="17">sectores</tspan></text><line x1="248.5" y1="692.0" x2="267.5" y2="692.0" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,687.0 266.5,697.0 274.5,692.0" fill="#0f766e"/><rect x="278.5" y="654.5" width="204.5" height="75.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="687.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Concertan el presupuesto</tspan><tspan x="380.8" dy="17">participativo</tspan></text><line x1="487.0" y1="692.0" x2="506.0" y2="692.0" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,687.0 505.0,697.0 513.0,692.0" fill="#0f766e"/><rect x="517.0" y="654.5" width="204.5" height="75.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="687.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Se aprueba el plan de</tspan><tspan x="619.2" dy="17">desarrollo local</tspan></text><line x1="725.5" y1="692.0" x2="744.5" y2="692.0" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,687.0 743.5,697.0 751.5,692.0" fill="#0f766e"/><rect x="755.5" y="654.5" width="204.5" height="75.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="679.0" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Decisión pública con</tspan><tspan x="857.8" dy="17">participación: dimensión</tspan><tspan x="857.8" dy="17">política</tspan></text><text x="40.0" y="769.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="779.5" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="802.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="802.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Psicosocial</tspan></text><text x="435.0" y="802.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Social</tspan></text><text x="585.0" y="802.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Económica</tspan></text><rect x="663.0" y="782.5" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="802.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Política</tspan></text><text x="885.0" y="802.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Cultural</tspan></text><rect x="40.0" y="816.5" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="816.5" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="853.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Dimensión aplicada?</tspan></text><text x="285.0" y="837.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: es actitud,</tspan><tspan x="285.0" dy="16">autoestima y habilidad</tspan><tspan x="285.0" dy="16">individual</tspan></text><text x="435.0" y="845.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es red y apoyo</tspan><tspan x="435.0" dy="16">social</tspan></text><text x="585.0" y="845.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es ingreso, empleo</tspan><tspan x="585.0" dy="16">y financiamiento</tspan></text><text x="735.0" y="837.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: decide políticas y</tspan><tspan x="735.0" dy="16">presupuesto con</tspan><tspan x="735.0" dy="16">participación</tspan></text><text x="885.0" y="845.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es valores,</tspan><tspan x="885.0" dy="16">creencias y prácticas</tspan></text><rect x="40.0" y="779.5" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="906.5" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="934.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="956.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Política: decisiones sobre políticas, planes y presupuestos que afectan la salud, con participación ciudadana; es abogacía y gestión política.</tspan><tspan x="58.0" dy="18">• Social: redes, cohesión y apoyo social. Económica: ingresos, empleo y financiamiento. Cultural: valores, creencias y prácticas.</tspan><tspan x="58.0" dy="18">• Psicosocial: actitudes, autoestima y habilidades individuales.</tspan><tspan x="58.0" dy="18">• Los determinantes sociales exigen acción intersectorial, no solo del sector salud; los presupuestos participativos están previstos por ley.</tspan></text><text x="58.0" y="1032.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, Carta de Ottawa (1986); OMS, Declaración de Shanghái (2016); OMS, Comisión sobre Determinantes Sociales de la Salud (2008).</tspan></text></svg>