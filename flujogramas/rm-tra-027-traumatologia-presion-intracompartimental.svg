<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1094" viewBox="0 0 1000 1094" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El síndrome compartimental agudo se confirma midiendo la presión del compartimento"><title>El síndrome compartimental agudo se confirma midiendo la presión del compartimento</title><rect x="0.75" y="0.75" width="998.5" height="1092.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Traumatología · presión intracompartimental</tspan></text><rect x="463.2" y="32.0" width="135.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="530.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="119"><tspan x="530.8" dy="0">TRAUMATOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Confirmación del síndrome compartimental</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El diagnóstico es sobre todo clínico.</tspan><tspan x="58.0" dy="17">Si hay duda o el paciente está sedado, se mide la presión.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de confirmación</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cómo se confirma el diagnóstico de síndrome</tspan><tspan x="640.0" dy="16">compartimental agudo?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PRESIÓN DE PERFUSIÓN DEL COMPARTIMENTO (DIASTÓLICA MENOS PRESIÓN COMPARTIMENTAL)</tspan></text><rect x="40.0" y="269.0" width="920.0" height="151.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="295.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Presión de perfusión diferencial</tspan></text><text x="60.0" y="314.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Se calcula con la presión diastólica y la presión medida en el compartimento.</tspan></text><rect x="70.0" y="344.0" width="430.0" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="285.0" y="369.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="420"><tspan x="285.0" dy="0">Menor de 30: confirma el síndrome</tspan></text><rect x="500.0" y="344.0" width="430.0" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="715.0" y="369.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="420"><tspan x="715.0" dy="0">30 o más: se sigue de cerca</tspan></text><line x1="70.0" y1="384.0" x2="70.0" y2="392.0" stroke="#64748b" stroke-width="1.5"/><text x="70.0" y="406.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="70.0" dy="0">0 mmHg</tspan></text><line x1="213.3" y1="384.0" x2="213.3" y2="392.0" stroke="#64748b" stroke-width="1.5"/><text x="213.3" y="406.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="213.3" dy="0">10 mmHg</tspan></text><line x1="356.7" y1="384.0" x2="356.7" y2="392.0" stroke="#64748b" stroke-width="1.5"/><text x="356.7" y="406.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="356.7" dy="0">20 mmHg</tspan></text><line x1="500.0" y1="384.0" x2="500.0" y2="392.0" stroke="#64748b" stroke-width="1.5"/><text x="500.0" y="406.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="500.0" dy="0">30 mmHg</tspan></text><line x1="643.3" y1="384.0" x2="643.3" y2="392.0" stroke="#64748b" stroke-width="1.5"/><text x="643.3" y="406.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="643.3" dy="0">40 mmHg</tspan></text><line x1="930.0" y1="384.0" x2="930.0" y2="392.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="406.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">60 mmHg</tspan></text><text x="40.0" y="452.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ CONFIRMA Y QUÉ SOLO HACE SOSPECHAR</tspan></text><rect x="40.0" y="462.0" width="297.3" height="102.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="463.0" width="6.0" height="100.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="486.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Medición de la presión tisular</tspan></text><text x="58.0" y="507.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Confirma: 30 mmHg o más, o presión de perfusión</tspan><tspan x="58.0" dy="16">menor de 30 mmHg</tspan></text><rect x="351.3" y="462.0" width="297.3" height="102.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="463.0" width="6.0" height="100.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="486.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Dolor, pulso disminuido o aumento del</tspan><tspan x="369.3" dy="17">dolor</tspan></text><text x="369.3" y="524.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Son datos clínicos de sospecha; el pulso suele</tspan><tspan x="369.3" dy="16">preservarse</tspan></text><rect x="662.7" y="462.0" width="297.3" height="102.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="463.0" width="6.0" height="100.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="486.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Ecografía o resonancia</tspan></text><text x="680.7" y="507.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">No validadas para el diagnóstico urgente y son</tspan><tspan x="680.7" dy="16">lentas</tspan></text><text x="40.0" y="598.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CRITERIOS DE PRESIÓN PARA CONFIRMAR EL SÍNDROME COMPARTIMENTAL</tspan></text><rect x="40.0" y="610.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="629.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Medida</tspan></text><text x="300.0" y="629.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Umbral</tspan></text><text x="635.0" y="629.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Comentario</tspan></text><rect x="40.0" y="639.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="658.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Presión absoluta del compartimento</tspan></text><text x="300.0" y="658.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">30 mmHg o más</tspan></text><text x="635.0" y="658.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Diagnóstica</tspan></text><rect x="40.0" y="668.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="687.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="234"><tspan x="50.0" dy="0">Presión de perfusión</tspan></text><text x="300.0" y="687.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="300.0" dy="0">Menor de 30 mmHg</tspan></text><text x="635.0" y="687.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="319"><tspan x="635.0" dy="0">Diastólica menos compartimental; el criterio más fiable</tspan></text><rect x="190.6" y="671.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="236.0" y="686.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="236.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="737.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="747.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="778.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="750.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="769.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Medición de la</tspan><tspan x="285.0" dy="17">presión tisular</tspan></text><text x="435.0" y="778.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Ultrasonografía</tspan></text><text x="585.0" y="769.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Pulsos periféricos</tspan><tspan x="585.0" dy="17">disminuidos</tspan></text><text x="735.0" y="769.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Mayor dolor que al</tspan><tspan x="735.0" dy="17">inicio de la lesión</tspan></text><text x="885.0" y="769.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Resonancia</tspan><tspan x="885.0" dy="17">magnética</tspan></text><rect x="40.0" y="801.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="801.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="838.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Cómo se confirma?</tspan></text><text x="285.0" y="830.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: mide la presión del</tspan><tspan x="285.0" dy="16">compartimento</tspan></text><text x="435.0" y="822.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no está validada</tspan><tspan x="435.0" dy="16">para el diagnóstico</tspan><tspan x="435.0" dy="16">urgente</tspan></text><text x="585.0" y="822.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es un dato de</tspan><tspan x="585.0" dy="16">sospecha, no de</tspan><tspan x="585.0" dy="16">confirmación</tspan></text><text x="735.0" y="822.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es un dato de</tspan><tspan x="735.0" dy="16">sospecha, no de</tspan><tspan x="735.0" dy="16">confirmación</tspan></text><text x="885.0" y="822.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es lenta y no está</tspan><tspan x="885.0" dy="16">validada para el</tspan><tspan x="885.0" dy="16">diagnóstico urgente</tspan></text><rect x="40.0" y="747.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="891.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="919.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="941.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Sospecha clínica: dolor desproporcionado, compartimento tenso y dolor con el estiramiento pasivo.</tspan><tspan x="58.0" dy="18">• Se confirma con la presión intracompartimental medida con catéter o monitor manual: 30 mmHg o más, o presión de perfusión menor de 30 mmHg</tspan><tspan x="58.0" dy="18">   (diastólica menos compartimental).</tspan><tspan x="58.0" dy="18">• La presión de perfusión es el criterio más fiable porque tiene en cuenta la hipotensión del paciente.</tspan><tspan x="58.0" dy="18">• La ecografía y la resonancia no están validadas para el diagnóstico urgente; el pulso suele preservarse. Tratamiento: fasciotomía urgente, idealmente en</tspan><tspan x="58.0" dy="18">   las primeras 6 horas, y control de mioglobinuria y de la función renal.</tspan></text><text x="58.0" y="1053.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Diagnosis and treatment of acute extremity compartment syndrome. Lancet 2015;386:1299-1310; J Orthop Trauma 2023; Injury 2025.</tspan></text></svg>