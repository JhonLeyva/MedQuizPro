span x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="979.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="998.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Catarata</tspan></text><text x="435.0" y="998.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Sordera</tspan></text><text x="585.0" y="998.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Macrocefalia</tspan></text><text x="735.0" y="998.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Coriorretinitis</tspan></text><text x="885.0" y="998.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hidrocefalia</tspan></text><rect x="40.0" y="1013.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1013.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1042.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Hallazgo esperado?</tspan></text><text x="285.0" y="1034.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: se forma en el 1.er</tspan><tspan x="285.0" dy="16">trimestre</tspan></text><text x="435.0" y="1034.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">También, pero se</tspan><tspan x="435.0" dy="16">detecta más tarde</tspan></text><text x="585.0" y="1042.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: da microcefalia</tspan></text><text x="735.0" y="1034.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Es de toxoplasma o</tspan><tspan x="735.0" dy="16">CMV</tspan></text><text x="885.0" y="1042.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Es de toxoplasma</tspan></text><rect x="40.0" y="976.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1087.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1115.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1137.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La catarata se ve al nacer (leucocoria, reflejo rojo ausente); la sordera es la más frecuente pero se detecta después.</tspan><tspan x="58.0" dy="18">• Confirmar con IgM antirrubéola o PCR; el bebé elimina virus meses: aislarlo de gestantes.</tspan><tspan x="58.0" dy="18">• Prevención: vacuna SPR; el Perú y las Américas eliminaron la rubéola endémica, se vigilan casos importados.</tspan></text><text x="58.0" y="1195.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, rubéola (2024); CDC, Pink Book (2024); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>