<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1323" viewBox="0 0 1000 1323" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Anciano de 87 años con EPOC e insuficiencia cardiaca descompensada, con colecistitis aguda que no mejora tras 4 días: colecistostomía percutánea"><title>Anciano de 87 años con EPOC e insuficiencia cardiaca descompensada, con colecistitis aguda que no mejora tras 4 días: colecistostomía percutánea</title><rect x="0.75" y="0.75" width="998.5" height="1322.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Colecistitis aguda · paciente de alto riesgo</tspan></text><rect x="451.6" y="32.0" width="101.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="502.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="85"><tspan x="502.2" dy="0">CIRUGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Colecistitis en el paciente frágil</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La colecistectomía temprana es el tratamiento estándar, pero en el anciano con alto riesgo</tspan><tspan x="58.0" dy="17">quirúrgico la anestesia puede ser mortal.</tspan><tspan x="58.0" dy="17">Si no responde al tratamiento médico: drenaje percutáneo de la vesícula (colecistostomía) y</tspan><tspan x="58.0" dy="17">cirugía diferida si mejora.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 87 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Bronquitis crónica e insuficiencia cardíaca</tspan><tspan x="640.0" dy="16">descompensada.</tspan><tspan x="640.0" dy="16">Colecistitis aguda litiásica; tras 4 días de dieta absoluta</tspan><tspan x="640.0" dy="16">sigue con fiebre, dolor y leucocitosis.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">COLECISTITIS: ¿OPERAR O DRENAR?</tspan></text><text x="202.0" y="313.0" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="758"><tspan x="202.0" dy="0">→ RIESGO QUIRÚRGICO</tspan></text><rect x="202.0" y="323.0" width="373.0" height="35.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="388.5" y="345.0" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="353"><tspan x="388.5" dy="0">Bajo (sano, ASA I-II)</tspan></text><rect x="587.0" y="323.0" width="373.0" height="35.0" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="773.5" y="345.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="353"><tspan x="773.5" dy="0">Alto (ASA ≥ III, IC descompensada)</tspan></text><text x="40.0" y="337.0" font-size="10.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="146"><tspan x="40.0" dy="0">↓ RESPONDE AL</tspan><tspan x="40.0" dy="15">TRATAMIENTO MÉDICO</tspan></text><rect x="40.0" y="370.0" width="150.0" height="76.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="115.0" y="412.5" font-size="12.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Sí mejora</tspan></text><rect x="202.0" y="370.0" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="371.0" width="6.0" height="74.0" rx="3" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="388.5" y="399.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Colecistectomía temprana</tspan></text><text x="388.5" y="422.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Laparoscópica &lt; 72 h</tspan></text><rect x="587.0" y="370.0" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="588.0" y="371.0" width="6.0" height="74.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="773.5" y="399.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Tratamiento médico</tspan></text><text x="773.5" y="422.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Cirugía diferida si mejora</tspan></text><rect x="40.0" y="458.0" width="150.0" height="90.5" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="115.0" y="499.2" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">No mejora (fiebre,</tspan><tspan x="115.0" dy="17">dolor)</tspan></text><rect x="202.0" y="458.0" width="373.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="459.0" width="6.0" height="88.5" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="388.5" y="494.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Colecistectomía urgente</tspan></text><text x="388.5" y="517.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Laparoscópica</tspan></text><rect x="587.0" y="458.0" width="373.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="773.5" y="486.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">COLECISTOSTOMÍA PERCUTÁNEA</tspan></text><text x="773.5" y="509.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Drenaje + antibiótico</tspan><tspan x="773.5" dy="17">Este caso</tspan></text><rect x="728.1" y="537.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="773.5" y="552.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="773.5" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="598.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="610.5" width="920.0" height="369.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="624.5" width="345.1" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="228.5" y="644.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="228.5" dy="0">GRAVEDAD DE LA COLECISTITIS (TOKIO 2018)</tspan></text><text x="417.1" y="644.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="525"><tspan x="417.1" dy="0">Decide el tratamiento junto con el riesgo del paciente.</tspan></text><rect x="56.0" y="684.5" width="288.0" height="144.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="685.1" width="286.8" height="63.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="200.0" y="712.5" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="272"><tspan x="200.0" dy="0">I</tspan></text><text x="200.0" y="732.5" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="264"><tspan x="200.0" dy="0">Leve</tspan></text><circle cx="72.0" cy="757.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="761.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="82.0" dy="0">Sin disfunción de órganos</tspan></text><circle cx="72.0" cy="780.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="784.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="82.0" dy="0">Inflamación leve</tspan></text><rect x="356.0" y="684.5" width="288.0" height="144.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="357.2" y="685.7" width="285.6" height="63.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="500.0" y="712.5" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="272"><tspan x="500.0" dy="0">II</tspan></text><text x="500.0" y="732.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="264"><tspan x="500.0" dy="0">Moderada</tspan></text><circle cx="372.0" cy="757.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="382.0" y="761.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="250"><tspan x="382.0" dy="0">Leucocitos &gt; 18 000</tspan></text><circle cx="372.0" cy="780.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="382.0" y="784.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="250"><tspan x="382.0" dy="0">Masa palpable</tspan></text><circle cx="372.0" cy="803.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="382.0" y="807.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="250"><tspan x="382.0" dy="0">&gt; 72 h de evolución</tspan></text><rect x="454.6" y="673.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="500.0" y="688.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">◆ ESTE CASO</tspan></text><rect x="656.0" y="684.5" width="288.0" height="144.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="657.2" y="685.7" width="285.6" height="63.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="800.0" y="712.5" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="272"><tspan x="800.0" dy="0">III</tspan></text><text x="800.0" y="732.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="264"><tspan x="800.0" dy="0">Grave</tspan></text><circle cx="672.0" cy="757.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="682.0" y="761.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="250"><tspan x="682.0" dy="0">Falla de órganos: hipotensión, confusión,</tspan><tspan x="682.0" dy="16">PaO₂/FiO₂ &lt; 300, falla renal o hepática</tspan></text><rect x="754.6" y="673.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="800.0" y="688.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="800.0" dy="0">◆ ESTE CASO</tspan></text><text x="56.0" y="858.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="867.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="882.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="882.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Fiebre y leucocitosis persistentes tras 4 días</tspan></text><rect x="56.0" y="889.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="904.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="904.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Corazón y pulmón ya comprometidos</tspan></text><rect x="56.0" y="926.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="949.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Alto riesgo: drenaje percutáneo y antibiótico.</tspan></text><text x="40.0" y="1019.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1029.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1069.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="1032.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="1052.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Colecistostomía</tspan><tspan x="285.0" dy="17">percutánea de</tspan><tspan x="285.0" dy="17">drenaje</tspan></text><text x="435.0" y="1060.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Colecistectomía</tspan><tspan x="435.0" dy="17">abierta urgente</tspan></text><text x="585.0" y="1052.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Administrar</tspan><tspan x="585.0" dy="17">amikacina y</tspan><tspan x="585.0" dy="17">ampicilina</tspan></text><text x="735.0" y="1052.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Mantener</tspan><tspan x="735.0" dy="17">tratamiento médico</tspan><tspan x="735.0" dy="17">Conservador</tspan></text><text x="885.0" y="1060.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Laparotomía</tspan><tspan x="885.0" dy="17">exploratoria</tspan></text><rect x="40.0" y="1100.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1100.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1129.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Indicación?</tspan></text><text x="285.0" y="1121.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: drena sin anestesia</tspan><tspan x="285.0" dy="16">general</tspan></text><text x="435.0" y="1121.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: riesgo quirúrgico</tspan><tspan x="435.0" dy="16">muy alto</tspan></text><text x="585.0" y="1121.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: ya falló el</tspan><tspan x="585.0" dy="16">tratamiento médico</tspan></text><text x="735.0" y="1129.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: ya falló en 4 días</tspan></text><text x="885.0" y="1129.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no hay indicación</tspan></text><rect x="40.0" y="1029.5" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1174.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1202.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1224.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Colecistostomía percutánea guiada por ecografía + antibiótico.</tspan><tspan x="58.0" dy="18">• Retirar el catéter tras 4-6 semanas si la vía biliar está libre; colecistectomía diferida si su estado lo permite.</tspan><tspan x="58.0" dy="18">• Riesgo quirúrgico: índice de comorbilidad de Charlson, ASA ≥ III.</tspan></text><text x="58.0" y="1282.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Guías de Tokio TG18 (2018); WSES, colecistitis aguda (2020).</tspan></text></svg>