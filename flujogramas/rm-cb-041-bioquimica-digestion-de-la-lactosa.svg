<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="880" viewBox="0 0 1000 880" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La lactasa fragmenta la lactosa en galactosa y glucosa"><title>La lactasa fragmenta la lactosa en galactosa y glucosa</title><rect x="0.75" y="0.75" width="998.5" height="878.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Bioquímica · digestión de la lactosa</tspan></text><rect x="411.2" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="483.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="483.1" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Lactosa y lactasa</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Disacárido de galactosa y glucosa con enlace beta-1,4.</tspan><tspan x="58.0" dy="17">La lactasa está en el borde en cepillo del enterocito.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Infante de 3 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Diarrea crónica que empeora tras tomar leche.</tspan><tspan x="640.0" dy="16">Se sospecha deficiencia de lactasa.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ LE PASA A LA LECHE EN EL INTESTINO</tspan></text><text x="44.0" y="283.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">De la ingesta a la diarrea cuando falta la lactasa.</tspan></text><line x1="178.0" y1="322.0" x2="362.0" y2="322.0" stroke="#99f6e4" stroke-width="6"/><line x1="408.0" y1="322.0" x2="592.0" y2="322.0" stroke="#99f6e4" stroke-width="6"/><line x1="638.0" y1="322.0" x2="822.0" y2="322.0" stroke="#99f6e4" stroke-width="6"/><circle cx="155.0" cy="322.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="155.0" y="326.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="155.0" dy="0">1</tspan></text><rect x="45.0" y="356.0" width="220.0" height="59.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="155.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="155.0" dy="0">Leche con lactosa</tspan></text><text x="155.0" y="393.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="155.0" dy="0">Disacárido de galactosa y glucosa</tspan></text><circle cx="385.0" cy="322.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="385.0" y="326.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="385.0" dy="0">2</tspan></text><rect x="275.0" y="356.0" width="220.0" height="59.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="385.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="385.0" dy="0">Borde en cepillo del yeyuno</tspan></text><text x="385.0" y="393.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="385.0" dy="0">La lactasa rompe el enlace beta-1,4</tspan></text><circle cx="615.0" cy="322.0" r="22" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><text x="615.0" y="326.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="38"><tspan x="615.0" dy="0">3</tspan></text><rect x="505.0" y="356.0" width="220.0" height="59.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="615.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="208"><tspan x="615.0" dy="0">Galactosa + glucosa</tspan></text><text x="615.0" y="393.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="615.0" dy="0">Se absorben por transporte activo</tspan></text><rect x="532.5" y="404.0" width="164.9" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="615.0" y="419.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="615.0" dy="0">◆ ESTO PIDE LA PREGUNTA</tspan></text><circle cx="845.0" cy="322.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="845.0" y="326.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="845.0" dy="0">4</tspan></text><rect x="735.0" y="356.0" width="220.0" height="59.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="845.0" y="376.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="208"><tspan x="845.0" dy="0">Sin lactasa: colon</tspan></text><text x="845.0" y="393.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="208"><tspan x="845.0" dy="0">Fermentación, gas y diarrea ácida</tspan></text><rect x="40.0" y="447.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="473.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Lactosa = galactosa + glucosa</tspan></text><text x="60.0" y="492.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Si falta la lactasa, la lactosa llega al colon y produce diarrea.</tspan></text><text x="40.0" y="559.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="569.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="600.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="591.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Fructosa y</tspan><tspan x="285.0" dy="17">galactosa</tspan></text><text x="435.0" y="600.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Sacarosa y manosa</tspan></text><text x="585.0" y="600.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Manosa y fructosa</tspan></text><rect x="663.0" y="572.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="600.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Galactosa y glucosa</tspan></text><text x="885.0" y="600.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Glucosa y celulosa</tspan></text><rect x="40.0" y="623.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="623.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="660.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué origina la lactosa?</tspan></text><text x="285.0" y="644.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: la fructosa no</tspan><tspan x="285.0" dy="16">forma parte de la</tspan><tspan x="285.0" dy="16">lactosa</tspan></text><text x="435.0" y="652.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: la sacarosa es un</tspan><tspan x="435.0" dy="16">disacárido</tspan></text><text x="585.0" y="652.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: ni manosa ni</tspan><tspan x="585.0" dy="16">fructosa la forman</tspan></text><text x="735.0" y="652.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: sus dos</tspan><tspan x="735.0" dy="16">monosacáridos</tspan></text><text x="885.0" y="652.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: la celulosa es un</tspan><tspan x="885.0" dy="16">polisacárido</tspan></text><rect x="40.0" y="569.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="713.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="741.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="763.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Lactosa = galactosa + glucosa (enlace beta-1,4); la lactasa del yeyuno la hidroliza y ambos monosacáridos se absorben por transporte activo.</tspan><tspan x="58.0" dy="18">• Sin lactasa llega al colon: fermentación con gas, distensión y dolor; por efecto osmótico, diarrea ácida (pH fecal &lt; 5,5, sustancias reductoras +).</tspan><tspan x="58.0" dy="18">• La fructosa pertenece a la sacarosa (glucosa + fructosa); la celulosa es un polisacárido que no se digiere; la sacarosa no es monosacárido.</tspan><tspan x="58.0" dy="18">• Diagnóstico: prueba de hidrógeno espirado o mejoría con la dieta sin lactosa; tratamiento: reducir la lactosa o usar lactasa.</tspan></text><text x="58.0" y="839.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Harper Bioquímica Ilustrada 32.ª ed.; Catanzaro et al., Lactose intolerance: an update on its pathogenesis, diagnosis, and treatment (Nutr Res 2021)</tspan></text></svg>