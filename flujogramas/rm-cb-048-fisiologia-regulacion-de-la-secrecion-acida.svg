<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1070" viewBox="0 0 1000 1070" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La histamina actúa en el receptor H2 y eleva el AMPc de la célula parietal"><title>La histamina actúa en el receptor H2 y eleva el AMPc de la célula parietal</title><rect x="0.75" y="0.75" width="998.5" height="1068.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Fisiología · regulación de la secreción ácida</tspan></text><rect x="459.8" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="531.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="531.7" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Célula parietal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Secreta ácido con la bomba H+/K+ ATPasa.</tspan><tspan x="58.0" dy="17">La regulan tres estímulos y un inhibidor.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué agonista de la célula parietal aumenta el AMP</tspan><tspan x="640.0" dy="16">cíclico intracelular?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL ESTÍMULO A LA SECRECIÓN DE ÁCIDO</tspan></text><rect x="40.0" y="269.0" width="920.0" height="83.0" rx="0" fill="#fef3c7" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="269.0" width="112.0" height="83.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="314.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Célula ECL</tspan></text><rect x="40.0" y="352.0" width="920.0" height="83.0" rx="0" fill="#ede9fe" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="352.0" width="112.0" height="83.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="393.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Membrana de la</tspan><tspan x="96.0" dy="14">parietal</tspan></text><rect x="40.0" y="435.0" width="920.0" height="83.0" rx="0" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="435.0" width="112.0" height="83.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="476.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Interior de la</tspan><tspan x="96.0" dy="14">parietal</tspan></text><rect x="40.0" y="518.0" width="920.0" height="99.0" rx="0" fill="#e0f2fe" stroke="#ffffff" stroke-width="2"/><rect x="40.0" y="518.0" width="112.0" height="99.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="96.0" y="571.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="98"><tspan x="96.0" dy="0">Luz gástrica</tspan></text><line x1="322.0" y1="337.0" x2="303.3" y2="358.2" stroke="#ea580c" stroke-width="2.2"/><polygon points="299.5,354.9 307.0,361.6 297.3,365.0" fill="#ea580c"/><line x1="422.7" y1="393.5" x2="429.7" y2="393.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="429.7,398.5 429.7,388.5 438.7,393.5" fill="#0f766e"/><line x1="689.3" y1="393.5" x2="696.3" y2="393.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="696.3,398.5 696.3,388.5 705.3,393.5" fill="#0f766e"/><line x1="830.7" y1="420.0" x2="331.0" y2="447.5" stroke="#ea580c" stroke-width="2.2"/><polygon points="330.7,442.5 331.3,452.5 322.0,448.0" fill="#ea580c"/><line x1="322.0" y1="503.0" x2="322.0" y2="522.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="317.0,522.0 327.0,522.0 322.0,531.0" fill="#0f766e"/><rect x="172.0" y="284.0" width="300.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="300.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Histamina</tspan></text><text x="182.0" y="317.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Liberada por la célula ECL; la gastrina la estimula.</tspan></text><circle cx="172.0" cy="284.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="288.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">1</tspan></text><rect x="172.0" y="367.0" width="250.7" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="182.0" y="383.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="231"><tspan x="182.0" dy="0">Receptor H2 con Gs</tspan></text><text x="182.0" y="400.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="231"><tspan x="182.0" dy="0">Activa la adenilato ciclasa y sube el AMPc.</tspan></text><circle cx="172.0" cy="367.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="371.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">2</tspan></text><rect x="438.7" y="367.0" width="250.7" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="448.7" y="383.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="231"><tspan x="448.7" dy="0">M3 y CCK-B con Gq</tspan></text><text x="448.7" y="400.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="231"><tspan x="448.7" dy="0">Acetilcolina y gastrina: calcio y fosfolipasa C.</tspan></text><circle cx="438.7" cy="367.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="438.7" y="371.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="438.7" dy="0">3</tspan></text><rect x="705.3" y="367.0" width="250.7" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="715.3" y="383.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="231"><tspan x="715.3" dy="0">Somatostatina con Gi</tspan></text><text x="715.3" y="400.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="231"><tspan x="715.3" dy="0">Baja el AMPc: inhibe la secreción.</tspan></text><circle cx="705.3" cy="367.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="705.3" y="371.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="705.3" dy="0">4</tspan></text><rect x="172.0" y="450.0" width="300.0" height="53.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="182.0" y="466.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">AMPc y proteína cinasa A</tspan></text><text x="182.0" y="483.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Activan la bomba H+/K+ ATPasa.</tspan></text><circle cx="172.0" cy="450.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="454.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">5</tspan></text><rect x="172.0" y="533.0" width="300.0" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="182.0" y="549.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Secreción de H+</tspan></text><text x="182.0" y="566.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="280"><tspan x="182.0" dy="0">Se frena con anti-H2 (vía AMPc) o con inhibidores de la</tspan><tspan x="182.0" dy="14.5">bomba.</tspan></text><circle cx="172.0" cy="533.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="172.0" y="537.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="172.0" dy="0">6</tspan></text><rect x="40.0" y="635.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="661.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La histamina es el agonista que aumenta el AMPc</tspan></text><text x="60.0" y="680.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Acetilcolina y gastrina elevan el calcio; la somatostatina lo inhibe.</tspan></text><text x="40.0" y="747.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="757.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="788.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="760.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="788.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Histamina</tspan></text><text x="435.0" y="788.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Gastrina</tspan></text><text x="585.0" y="788.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Acetilcolina</tspan></text><text x="735.0" y="788.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Somatostatina</tspan></text><text x="885.0" y="779.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Péptido liberador de</tspan><tspan x="885.0" dy="17">gastrina</tspan></text><rect x="40.0" y="811.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="811.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="840.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Eleva el AMPc?</tspan></text><text x="285.0" y="832.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: receptor H2 con Gs</tspan><tspan x="285.0" dy="16">y adenilato ciclasa</tspan></text><text x="435.0" y="832.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: usa CCK-B y Gq,</tspan><tspan x="435.0" dy="16">sube el calcio</tspan></text><text x="585.0" y="832.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: usa M3 y Gq, sube</tspan><tspan x="585.0" dy="16">el calcio</tspan></text><text x="735.0" y="832.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: usa Gi y baja el</tspan><tspan x="735.0" dy="16">AMPc</tspan></text><text x="885.0" y="832.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: actúa sobre las</tspan><tspan x="885.0" dy="16">células G</tspan></text><rect x="40.0" y="757.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="885.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="913.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="935.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Histamina (ECL, paracrina): receptor H2 con proteína Gs; activa la adenilato ciclasa, sube el AMPc y la proteína cinasa A. Es la vía que bloquean los</tspan><tspan x="58.0" dy="18">   anti-H2.</tspan><tspan x="58.0" dy="18">• Acetilcolina (vagal, M3) y gastrina (endocrina, CCK-B) usan Gq: suben el calcio y la fosfolipasa C, no el AMPc.</tspan><tspan x="58.0" dy="18">• Somatostatina: Gi, baja el AMPc e inhibe la secreción. El péptido liberador de gastrina actúa sobre las células G, no sobre la parietal.</tspan><tspan x="58.0" dy="18">• La gastrina estimula sobre todo la liberación de histamina de las células ECL; por eso los inhibidores de bomba de protones elevan la gastrina.</tspan></text><text x="58.0" y="1029.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Guyton y Hall 14.ª ed. (2021); Goodman y Gilman 14.ª ed. (2023); Sleisenger y Fordtran 11.ª ed. (2020).</tspan></text></svg>