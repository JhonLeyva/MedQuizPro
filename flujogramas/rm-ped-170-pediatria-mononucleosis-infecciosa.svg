<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1223" viewBox="0 0 1000 1223" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Fiebre, faringodinia, adenopatías generalizadas, esplenomegalia y exantema en un preescolar: mononucleosis infecciosa"><title>Fiebre, faringodinia, adenopatías generalizadas, esplenomegalia y exantema en un preescolar: mononucleosis infecciosa</title><rect x="0.75" y="0.75" width="998.5" height="1221.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · mononucleosis infecciosa</tspan></text><rect x="418.8" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="467.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="467.8" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Mononucleosis infecciosa</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Primoinfección por el virus de Epstein-Barr, transmitido por saliva, que infecta linfocitos B.</tspan><tspan x="58.0" dy="17">Los linfocitos T atípicos explican las adenopatías y la esplenomegalia.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Preescolar de 4 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Una semana de fiebre, cefalea, mialgias y dolor</tspan><tspan x="640.0" dy="16">faríngeo.</tspan><tspan x="640.0" dy="16">Exantema maculopapular, adenopatías cervicales e</tspan><tspan x="640.0" dy="16">inguinales de 2 x 2 cm y esplenomegalia.</tspan></text><line x1="640.0" y1="237.0" x2="670.0" y2="237.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SE ESPERA ENCONTRAR EN LA MONONUCLEOSIS</tspan></text><line x1="410.9" y1="436.9" x2="340.0" y2="460.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="460.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.1" y1="377.1" x2="660.0" y2="353.4" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="353.4" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.1" y1="436.9" x2="660.0" y2="460.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="460.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="410.9" y1="377.1" x2="340.0" y2="353.4" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="353.4" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="407.0" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="407.0" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="412.0" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">MONONUCLEOSIS</tspan></text><text x="500.0" y="431.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">virus de Epstein-Barr</tspan></text><rect x="40.0" y="307.8" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="336.7" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">TRÍADA CLÁSICA</tspan></text><text x="190.0" y="360.3" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Fiebre, faringitis exudativa y adenopatías</tspan><tspan x="190.0" dy="17">cervicales posteriores</tspan></text><rect x="144.6" y="389.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="404.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="415.0" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="416.0" width="6.0" height="89.2" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="443.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">ESPLENOMEGALIA</tspan></text><text x="190.0" y="467.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Con hepatomegalia leve; riesgo de rotura</tspan><tspan x="190.0" dy="17">esplénica</tspan></text><rect x="660.0" y="307.8" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="308.8" width="6.0" height="89.2" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="810.0" y="336.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">EXANTEMA</tspan></text><text x="810.0" y="360.3" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Maculopapular en 5 a 15 %; frecuente con</tspan><tspan x="810.0" dy="17">amoxicilina</tspan></text><rect x="660.0" y="415.0" width="300.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="416.0" width="6.0" height="89.2" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="443.8" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">LABORATORIO</tspan></text><text x="810.0" y="467.5" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Linfocitosis con más de 10 % de atípicos y IgM</tspan><tspan x="810.0" dy="17">anti-VCA</tspan></text><text x="40.0" y="549.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="561.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="585.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Pedir hemograma con linfocitos</tspan><tspan x="142.2" dy="17">atípicos</tspan></text><line x1="248.5" y1="590.0" x2="267.5" y2="590.0" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,585.0 266.5,595.0 274.5,590.0" fill="#0f766e"/><rect x="278.5" y="561.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="594.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Heterófilos o IgM anti-VCA</tspan></text><line x1="487.0" y1="590.0" x2="506.0" y2="590.0" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,585.0 505.0,595.0 513.0,590.0" fill="#0f766e"/><rect x="517.0" y="561.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="594.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Tratamiento de soporte</tspan></text><line x1="725.5" y1="590.0" x2="744.5" y2="590.0" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,585.0 743.5,595.0 751.5,590.0" fill="#0f766e"/><rect x="755.5" y="561.0" width="204.5" height="58.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="585.5" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Sin deporte de contacto 3 a 4</tspan><tspan x="857.8" dy="17">semanas</tspan></text><text x="40.0" y="653.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EXANTEMAS FEBRILES DE LA INFANCIA FRENTE AL CASO</tspan></text><rect x="40.0" y="665.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="684.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Diagnóstico</tspan></text><text x="280.0" y="684.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Rasgo distintivo</tspan></text><text x="625.0" y="684.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">En este caso</tspan></text><rect x="40.0" y="694.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="713.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Mononucleosis</tspan></text><text x="280.0" y="713.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Tríada, esplenomegalia y adenopatías generalizadas</tspan></text><text x="625.0" y="713.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">Se cumple</tspan></text><rect x="170.6" y="697.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="216.0" y="712.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="216.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="723.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="742.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Rubéola</tspan></text><text x="280.0" y="742.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Adenopatías retroauriculares y occipitales</tspan></text><text x="625.0" y="742.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">No: son cervicales e inguinales</tspan></text><rect x="40.0" y="752.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="771.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Kawasaki</tspan></text><text x="280.0" y="771.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Fiebre de 5 días con conjuntivitis no exudativa</tspan></text><text x="625.0" y="771.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">No hay esplenomegalia en Kawasaki</tspan></text><rect x="40.0" y="781.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="800.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="214"><tspan x="50.0" dy="0">Escarlatina y eritema infeccioso</tspan></text><text x="280.0" y="800.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="280.0" dy="0">Lengua en fresa o mejillas abofeteadas</tspan></text><text x="625.0" y="800.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="329"><tspan x="625.0" dy="0">No hay</tspan></text><text x="40.0" y="850.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="860.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="891.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="891.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Rubéola</tspan></text><text x="435.0" y="891.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Kawasaki</tspan></text><rect x="513.0" y="863.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="882.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Mononucleosis</tspan><tspan x="585.0" dy="17">infecciosa</tspan></text><text x="735.0" y="891.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Escarlatina</tspan></text><text x="885.0" y="891.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Eritema infeccioso</tspan></text><rect x="40.0" y="914.0" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="914.0" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="959.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="935.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: adenopatías</tspan><tspan x="285.0" dy="16">retroauriculares y</tspan><tspan x="285.0" dy="16">occipitales, cuadro</tspan><tspan x="285.0" dy="16">corto</tspan></text><text x="435.0" y="935.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: sin</tspan><tspan x="435.0" dy="16">esplenomegalia; exige</tspan><tspan x="435.0" dy="16">conjuntivitis y cambios</tspan><tspan x="435.0" dy="16">orales</tspan></text><text x="585.0" y="943.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: tríada con</tspan><tspan x="585.0" dy="16">esplenomegalia y</tspan><tspan x="585.0" dy="16">exantema</tspan></text><text x="735.0" y="943.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: exantema en papel</tspan><tspan x="735.0" dy="16">de lija con lengua en</tspan><tspan x="735.0" dy="16">fresa</tspan></text><text x="885.0" y="951.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: mejillas</tspan><tspan x="885.0" dy="16">abofeteadas</tspan></text><rect x="40.0" y="860.0" width="920.0" height="136.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1020.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1048.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1070.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Tríada: fiebre, faringitis exudativa y adenopatías cervicales posteriores; suman esplenomegalia, hepatomegalia leve y exantema en 5 a 15 %.</tspan><tspan x="58.0" dy="18">• Apoyo: linfocitosis mayor de 50 % con más de 10 % de linfocitos atípicos; anticuerpos heterófilos (menos sensibles en menores de 4 años) e IgM</tspan><tspan x="58.0" dy="18">   anti-VCA.</tspan><tspan x="58.0" dy="18">• Rubéola: adenopatías retroauriculares y occipitales; Kawasaki: 5 días de fiebre con conjuntivitis no exudativa, sin esplenomegalia; escarlatina: papel de</tspan><tspan x="58.0" dy="18">   lija y lengua en fresa; eritema infeccioso: mejillas abofeteadas.</tspan><tspan x="58.0" dy="18">• Soporte; la amoxicilina o ampicilina producen un exantema característico. Evitar deportes de contacto 3 a 4 semanas por riesgo de rotura esplénica.</tspan></text><text x="58.0" y="1182.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Dunmire SK y cols., Epstein-Barr virus. Annu Rev Virol 2018;5:305-323; AAP, Red Book 33.ª ed. (2024-2027); Nelson Tratado de Pediatría 22.ª ed. (2024).</tspan></text></svg>