<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1188" viewBox="0 0 1000 1188" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Contracciones irregulares por 3 días sin cambios cervicales: hipodinamia primaria (fase latente prolongada)"><title>Contracciones irregulares por 3 días sin cambios cervicales: hipodinamia primaria (fase latente prolongada)</title><rect x="0.75" y="0.75" width="998.5" height="1186.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · alteraciones de la dinámica uterina</tspan></text><rect x="481.7" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="561.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="561.4" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Alteraciones de la dinámica uterina</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hipodinamia: defecto de frecuencia o de intensidad.</tspan><tspan x="58.0" dy="17">Hiperdinamia: contracciones excesivas.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Gestante de 25 años, a término</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Contracciones irregulares por 3 días.</tspan><tspan x="640.0" dy="16">Tactos cada 6 horas: sin dilatación; ponderado fetal de</tspan><tspan x="640.0" dy="16">3800 g.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DURACIÓN DE LA FASE LATENTE Y EL CASO</tspan></text><line x1="290.0" y1="307.0" x2="290.0" y2="425.0" stroke="#e2e8f0" stroke-width="1"/><text x="290.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="290.0" dy="0">0</tspan></text><line x1="355.0" y1="307.0" x2="355.0" y2="425.0" stroke="#e2e8f0" stroke-width="1"/><text x="355.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="355.0" dy="0">8</tspan></text><line x1="420.0" y1="307.0" x2="420.0" y2="425.0" stroke="#e2e8f0" stroke-width="1"/><text x="420.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="420.0" dy="0">16</tspan></text><line x1="485.0" y1="307.0" x2="485.0" y2="425.0" stroke="#e2e8f0" stroke-width="1"/><text x="485.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="485.0" dy="0">24</tspan></text><line x1="550.0" y1="307.0" x2="550.0" y2="425.0" stroke="#e2e8f0" stroke-width="1"/><text x="550.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="550.0" dy="0">32</tspan></text><line x1="615.0" y1="307.0" x2="615.0" y2="425.0" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="615.0" dy="0">40</tspan></text><line x1="680.0" y1="307.0" x2="680.0" y2="425.0" stroke="#e2e8f0" stroke-width="1"/><text x="680.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="680.0" dy="0">48</tspan></text><line x1="745.0" y1="307.0" x2="745.0" y2="425.0" stroke="#e2e8f0" stroke-width="1"/><text x="745.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="745.0" dy="0">56</tspan></text><line x1="810.0" y1="307.0" x2="810.0" y2="425.0" stroke="#e2e8f0" stroke-width="1"/><text x="810.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="810.0" dy="0">64</tspan></text><line x1="875.0" y1="307.0" x2="875.0" y2="425.0" stroke="#e2e8f0" stroke-width="1"/><text x="875.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="875.0" dy="0">72</tspan></text><line x1="940.0" y1="307.0" x2="940.0" y2="425.0" stroke="#e2e8f0" stroke-width="1"/><text x="940.0" y="303.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="940.0" dy="0">80</tspan></text><text x="940.0" y="289.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="end" data-max="60"><tspan x="940.0" dy="0">horas</tspan></text><rect x="40.0" y="311.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="327.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Fase latente normal de la nulípara</tspan></text><text x="48.0" y="342.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Hasta 20 horas</tspan></text><rect x="290.0" y="319.0" width="162.5" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="48.0" y="365.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Fase latente normal de la multípara</tspan></text><text x="48.0" y="380.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Hasta 14 horas</tspan></text><rect x="290.0" y="357.0" width="113.8" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><rect x="40.0" y="387.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="403.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Caso: sin cambios cervicales</tspan></text><text x="48.0" y="418.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">3 días: hipodinamia primaria</tspan></text><rect x="290.0" y="395.0" width="585.0" height="22.0" rx="6" fill="#ea580c" stroke="none" stroke-width="1.5"/><line x1="875.0" y1="309.0" x2="875.0" y2="431.0" stroke="#b91c1c" stroke-width="2.6"/><rect x="817.6" y="431.0" width="114.8" height="22.0" rx="11" fill="#b91c1c" stroke="none" stroke-width="1.5"/><text x="875.0" y="446.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="875.0" dy="0">72 horas del caso</tspan></text><rect x="40.0" y="477.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="503.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Dinámica irregular sin dilatación desde el inicio = hipodinamia primaria</tspan></text><text x="60.0" y="522.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La secundaria sigue a un trabajo de parto ya iniciado; la inercia verdadera es el cese de contracciones.</tspan></text><text x="40.0" y="583.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ALTERACIONES DE LA CONTRACTILIDAD UTERINA</tspan></text><rect x="40.0" y="595.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="614.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Tipo</tspan></text><text x="310.0" y="614.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Cuándo aparece</tspan></text><text x="640.0" y="614.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Característica</tspan></text><rect x="40.0" y="624.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="643.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Hipodinamia primaria</tspan></text><text x="310.0" y="643.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Desde el inicio</tspan></text><text x="640.0" y="643.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Contracciones infrecuentes e irregulares; el cuello no</tspan><tspan x="640.0" dy="15">cambia</tspan></text><rect x="200.6" y="635.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="246.0" y="650.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="246.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="668.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="687.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Hipodinamia secundaria</tspan></text><text x="310.0" y="687.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Tras un trabajo de parto bien iniciado</tspan></text><text x="640.0" y="687.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Agotamiento ante un obstáculo</tspan></text><rect x="40.0" y="697.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="716.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Inercia verdadera</tspan></text><text x="310.0" y="716.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Forma extrema</tspan></text><text x="640.0" y="716.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Cese de las contracciones</tspan></text><rect x="40.0" y="726.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="745.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="244"><tspan x="50.0" dy="0">Hiperdinamia</tspan></text><text x="310.0" y="745.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="310.0" dy="0">Cualquier momento</tspan></text><text x="640.0" y="745.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="314"><tspan x="640.0" dy="0">Contracciones demasiado frecuentes o intensas</tspan></text><text x="40.0" y="795.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="805.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="836.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="808.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="827.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hipodinamia</tspan><tspan x="285.0" dy="17">primaria</tspan></text><text x="435.0" y="827.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hipodinamia</tspan><tspan x="435.0" dy="17">secundaria</tspan></text><text x="585.0" y="836.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Inercia verdadera</tspan></text><text x="735.0" y="836.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Inercia mixta</tspan></text><text x="885.0" y="836.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hipoinercia</tspan></text><rect x="40.0" y="859.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="859.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="896.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Dinámica uterina?</tspan></text><text x="285.0" y="888.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: dinámica irregular</tspan><tspan x="285.0" dy="16">sin cambios del cuello</tspan></text><text x="435.0" y="880.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: aparece tras un</tspan><tspan x="435.0" dy="16">trabajo de parto bien</tspan><tspan x="435.0" dy="16">iniciado</tspan></text><text x="585.0" y="880.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es la forma</tspan><tspan x="585.0" dy="16">extrema, con cese de</tspan><tspan x="585.0" dy="16">contracciones</tspan></text><text x="735.0" y="888.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: combinación que</tspan><tspan x="735.0" dy="16">no corresponde al caso</tspan></text><text x="885.0" y="880.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: término ambiguo,</tspan><tspan x="885.0" dy="16">no es la clasificación</tspan><tspan x="885.0" dy="16">del caso</tspan></text><rect x="40.0" y="805.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="949.0" width="920.0" height="221.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="977.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="999.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Hipodinamia primaria: contracciones infrecuentes, poco intensas e irregulares desde el inicio, sin borramiento ni dilatación; equivale a la fase latente</tspan><tspan x="58.0" dy="18">   prolongada.</tspan><tspan x="58.0" dy="18">• Hipodinamia secundaria: aparece después de un trabajo de parto bien iniciado, por agotamiento ante un obstáculo (cuello rígido o desproporción</tspan><tspan x="58.0" dy="18">   cefalopélvica).</tspan><tspan x="58.0" dy="18">• Fase latente prolongada: más de 20 horas en nulípara y más de 14 en multípara (Friedman); la fase activa empieza a los 6 cm (ACOG) o a los 5 cm</tspan><tspan x="58.0" dy="18">   (OMS 2018).</tspan><tspan x="58.0" dy="18">• Alerta: no es indicación de cesárea; se maneja con reposo y analgesia o con amniotomía y oxitocina. Descartar desproporción cefalopélvica y falso</tspan><tspan x="58.0" dy="18">   trabajo de parto.</tspan></text><text x="58.0" y="1147.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACOG, Obstetric Care Consensus 1 (Obstet Gynecol 2014, reafirmado); OMS, Recomendaciones para el cuidado intraparto (2018); Williams Obstetricia, 26.ª ed. (2022).</tspan></text></svg>