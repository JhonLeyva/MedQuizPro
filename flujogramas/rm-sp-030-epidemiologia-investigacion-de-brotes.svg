<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1075" viewBox="0 0 1000 1075" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Para hallar rápido la causa de un brote por alimentos el estudio más adecuado es de casos y controles"><title>Para hallar rápido la causa de un brote por alimentos el estudio más adecuado es de casos y controles</title><rect x="0.75" y="0.75" width="998.5" height="1073.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Epidemiología · investigación de brotes</tspan></text><rect x="434.4" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="498.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="498.7" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Investigación de un brote</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Confirmar el brote, definir el caso, describir por tiempo, lugar y persona y formular hipótesis.</tspan><tspan x="58.0" dy="17">Luego se prueba la hipótesis con un estudio analítico.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Responsable de epidemiología</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Brote por enfermedad transmitida por alimentos en una</tspan><tspan x="640.0" dy="16">Red de Servicios de Salud.</tspan><tspan x="640.0" dy="16">¿Qué estudio determina rápido la causa probable?</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE LLEGA AL DISEÑO</tspan></text><text x="614.0" y="297.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,309.0 580.0,309.0 543.8,385.0 76.2,385.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="325.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="357.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="424"><tspan x="310.0" dy="0">Brote por alimentos: hallar la causa rápido</tspan></text><line x1="565.9" y1="347.0" x2="606.0" y2="347.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="318.0" width="115.5" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="671.8" y="335.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="671.8" dy="0">Casos y controles</tspan></text><rect x="735.5" y="318.0" width="73.0" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="772.1" y="335.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="772.1" dy="0">Ecológico</tspan></text><rect x="814.6" y="318.0" width="135.2" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="882.2" y="335.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="882.2" dy="0">Cohortes concurrente</tspan></text><rect x="614.0" y="350.0" width="99.9" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="663.9" y="367.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="663.9" dy="0">Serie de casos</tspan></text><rect x="719.9" y="350.0" width="123.4" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="781.5" y="367.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="781.5" dy="0">Cuasi-experimental</tspan></text><polygon points="76.2,389.0 543.8,389.0 507.5,445.0 112.5,445.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="138.5" cy="417.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="138.5" y="421.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="138.5" dy="0">1</tspan></text><text x="320.0" y="421.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="331"><tspan x="320.0" dy="0">¿Compara enfermos con personas sanas?</tspan></text><line x1="529.6" y1="417.0" x2="606.0" y2="417.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="404.0" width="111.9" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="670.0" y="421.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="670.0" dy="0">✕ Serie de casos</tspan></text><line x1="636.0" y1="417.5" x2="715.9" y2="417.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="112.5,449.0 507.5,449.0 471.2,509.0 148.8,509.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="174.8" cy="479.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="174.8" y="483.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="174.8" dy="0">2</tspan></text><text x="320.0" y="475.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="258"><tspan x="320.0" dy="0">¿Usa datos de individuos y no de</tspan><tspan x="320.0" dy="17">grupos?</tspan></text><line x1="493.4" y1="479.0" x2="606.0" y2="479.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="466.0" width="85.1" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="656.6" y="483.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="656.6" dy="0">✕ Ecológico</tspan></text><line x1="636.0" y1="479.5" x2="689.1" y2="479.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="148.8,513.0 471.2,513.0 435.0,573.0 185.0,573.0" fill="#5eead4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="543.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="547.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">3</tspan></text><text x="320.0" y="539.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">¿Es rápido, sin seguir a</tspan><tspan x="320.0" dy="17">nadie hacia adelante?</tspan></text><line x1="457.1" y1="543.0" x2="606.0" y2="543.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="530.0" width="147.3" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="687.6" y="547.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="687.6" dy="0">✕ Cohortes concurrente</tspan></text><line x1="636.0" y1="543.5" x2="751.3" y2="543.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="767.3" y="530.0" width="135.5" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="835.0" y="547.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="835.0" dy="0">✕ Cuasi-experimental</tspan></text><line x1="789.3" y1="543.5" x2="892.8" y2="543.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="577.0" x2="310.0" y2="596.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,595.0 315.0,595.0 310.0,603.0" fill="#0f766e"/><rect x="140.0" y="607.0" width="340.0" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="636.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">ESTUDIO DE CASOS Y CONTROLES</tspan></text><text x="310.0" y="660.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Odds ratio por alimento</tspan><tspan x="310.0" dy="17">Orienta al vehículo</tspan></text><rect x="370.6" y="596.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="611.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="606.9" width="346.0" height="92.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="626.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="644.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">Con población cerrada y enumerable lo ideal es la</tspan><tspan x="628.0" dy="16">cohorte retrospectiva; con estas opciones, casos y</tspan><tspan x="628.0" dy="16">controles.</tspan></text><text x="40.0" y="738.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="748.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="779.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="751.9" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="779.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Casos y controles</tspan></text><text x="435.0" y="779.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Ecológico</tspan></text><text x="585.0" y="771.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Cohortes</tspan><tspan x="585.0" dy="17">concurrente</tspan></text><text x="735.0" y="779.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Serie de casos</tspan></text><text x="885.0" y="779.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Cuasi-experimental</tspan></text><rect x="40.0" y="802.9" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="802.9" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="831.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Estudio más adecuado</tspan><tspan x="54.0" dy="16">y rápido?</tspan></text><text x="285.0" y="823.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: compara</tspan><tspan x="285.0" dy="16">exposiciones de</tspan><tspan x="285.0" dy="16">enfermos y sanos</tspan></text><text x="435.0" y="839.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: trabaja con grupos</tspan></text><text x="585.0" y="831.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sigue hacia</tspan><tspan x="585.0" dy="16">adelante, es lento</tspan></text><text x="735.0" y="831.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: solo describe, no</tspan><tspan x="735.0" dy="16">compara</tspan></text><text x="885.0" y="831.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: evalúa</tspan><tspan x="885.0" dy="16">intervenciones</tspan></text><rect x="40.0" y="748.9" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="892.9" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="920.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="942.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Casos y controles: se comparan las exposiciones alimentarias de enfermos y sanos; el alimento con odds ratio alto y significativo orienta al vehículo.</tspan><tspan x="58.0" dy="18">• No requiere seguimiento, es barato y sirve aunque no se conozca a todos los expuestos.</tspan><tspan x="58.0" dy="18">• Población cerrada y enumerable (invitados a una boda): sería ideal la cohorte retrospectiva con tasas de ataque y riesgo relativo.</tspan><tspan x="58.0" dy="18">• Alerta: el estudio analítico no reemplaza el cultivo de alimentos y pacientes ni las medidas de control inmediatas.</tspan></text><text x="58.0" y="1018.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, Principles of Epidemiology in Public Health Practice, 3.ª ed. (2012); Celentano y Szklo, Gordis Epidemiología, 6.ª ed. (2019); Lash et al., Modern Epidemiology, 4.ª</tspan><tspan x="58.0" dy="15">ed. (2021).</tspan></text></svg>