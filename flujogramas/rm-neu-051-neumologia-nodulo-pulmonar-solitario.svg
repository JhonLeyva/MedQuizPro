<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1248" viewBox="0 0 1000 1248" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Nódulo de 1,5 a 2,2 cm, bordes festoneados, 45 a 60 años y fumador de menos de 20 cigarrillos: riesgo intermedio"><title>Nódulo de 1,5 a 2,2 cm, bordes festoneados, 45 a 60 años y fumador de menos de 20 cigarrillos: riesgo intermedio</title><rect x="0.75" y="0.75" width="998.5" height="1246.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neumología · nódulo pulmonar solitario</tspan></text><rect x="435.1" y="32.0" width="114.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="492.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="99"><tspan x="492.6" dy="0">NEUMOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Nódulo pulmonar solitario</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Opacidad redondeada u ovalada de hasta 3 cm rodeada de pulmón.</tspan><tspan x="58.0" dy="17">El riesgo de cáncer combina datos clínicos y de imagen.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Nódulo con cuatro rasgos intermedios</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Diámetro de 1,5 a 2,2 cm, bordes festoneados, 45 a 60</tspan><tspan x="640.0" dy="16">años y fumador actual de menos de 20 cigarrillos por</tspan><tspan x="640.0" dy="16">día.</tspan><tspan x="640.0" dy="16">¿Cuál es el riesgo?</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">RIESGO DE MALIGNIDAD Y CONDUCTA EN EL NÓDULO SOLITARIO</tspan></text><rect x="70.0" y="311.0" width="34.0" height="330.0" rx="17" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><rect x="75.0" y="535.0" width="24.0" height="102.0" rx="8" fill="#10b981" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="586.0" x2="130.0" y2="586.0" stroke="#10b981" stroke-width="2"/><rect x="130.0" y="536.0" width="330.0" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="558.0" font-size="12" font-weight="800" font-style="normal" fill="#10b981" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Bajo</tspan></text><text x="240.0" y="558.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">&lt; 1,5 cm · lisos</tspan></text><text x="144.0" y="579.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Seguimiento con tomografía seriada</tspan></text><rect x="75.0" y="425.0" width="24.0" height="102.0" rx="8" fill="#f59e0b" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="476.0" x2="130.0" y2="476.0" stroke="#0f766e" stroke-width="3"/><rect x="130.0" y="426.0" width="330.0" height="100.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="144.0" y="448.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Intermedio</tspan></text><text x="240.0" y="448.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">1,5-2,2 cm · festoneado</tspan></text><text x="144.0" y="469.0" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Todas las variables del caso caen aquí</tspan></text><rect x="354.6" y="415.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="400.0" y="430.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="400.0" dy="0">◆ ESTE CASO</tspan></text><rect x="75.0" y="315.0" width="24.0" height="102.0" rx="8" fill="#f97316" stroke="none" stroke-width="1.5"/><line x1="104.0" y1="366.0" x2="130.0" y2="366.0" stroke="#f97316" stroke-width="2"/><rect x="130.0" y="316.0" width="330.0" height="100.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="144.0" y="338.0" font-size="12" font-weight="800" font-style="normal" fill="#f97316" text-anchor="start" data-max="92"><tspan x="144.0" dy="0">Alto</tspan></text><text x="240.0" y="338.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="206"><tspan x="240.0" dy="0">≥ 2,3 cm · espiculado</tspan></text><text x="144.0" y="359.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="302"><tspan x="144.0" dy="0">Resección quirúrgica</tspan></text><text x="470.0" y="315.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="490"><tspan x="470.0" dy="0">QUÉ SE HACE CON RIESGO INTERMEDIO</tspan></text><rect x="470.0" y="329.0" width="490.0" height="84.0" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="371.0" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="376.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">1</tspan></text><text x="528.0" y="364.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Calcular la probabilidad de cáncer</tspan></text><text x="528.0" y="387.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Tamaño, edad, tabaco y bordes</tspan></text><line x1="498.0" y1="415.0" x2="498.0" y2="428.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,427.0 503.0,427.0 498.0,435.0" fill="#0f766e"/><rect x="470.0" y="437.0" width="490.0" height="84.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><circle cx="498.0" cy="479.0" r="17" fill="#ffffff" stroke="none" stroke-width="0"/><text x="498.0" y="484.0" font-size="15" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">2</tspan></text><text x="528.0" y="472.0" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">PET-TC o biopsia guiada por imagen</tspan></text><text x="528.0" y="495.0" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Según la probabilidad calculada</tspan></text><rect x="845.3" y="426.0" width="89.4" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="441.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ CONDUCTA</tspan></text><line x1="498.0" y1="523.0" x2="498.0" y2="536.0" stroke="#0f766e" stroke-width="2"/><polygon points="493.0,535.0 503.0,535.0 498.0,543.0" fill="#0f766e"/><rect x="470.0" y="545.0" width="490.0" height="84.0" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="498.0" cy="587.0" r="17" fill="#0f766e" stroke="none" stroke-width="0"/><text x="498.0" y="592.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="498.0" dy="0">3</tspan></text><text x="528.0" y="580.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Decidir con el resultado</tspan></text><text x="528.0" y="603.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="528.0" dy="0">Resecar o seguir con tomografía</tspan></text><text x="40.0" y="675.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">RIESGO DE MALIGNIDAD DEL NÓDULO PULMONAR SOLITARIO</tspan></text><rect x="40.0" y="687.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="706.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Riesgo</tspan></text><text x="260.0" y="706.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="162"><tspan x="260.0" dy="0">Tamaño</tspan></text><text x="437.5" y="706.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="162"><tspan x="437.5" dy="0">Edad</tspan></text><text x="615.0" y="706.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="162"><tspan x="615.0" dy="0">Tabaco</tspan></text><text x="792.5" y="706.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="162"><tspan x="792.5" dy="0">Bordes</tspan></text><rect x="40.0" y="716.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="735.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Bajo</tspan></text><text x="260.0" y="735.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="162"><tspan x="260.0" dy="0">&lt; 1,5 cm</tspan></text><text x="437.5" y="735.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="162"><tspan x="437.5" dy="0">&lt; 45 años</tspan></text><text x="615.0" y="735.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="162"><tspan x="615.0" dy="0">No fumador o abandono &gt; 7</tspan><tspan x="615.0" dy="15">años</tspan></text><text x="792.5" y="735.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="162"><tspan x="792.5" dy="0">Lisos</tspan></text><rect x="40.0" y="760.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="779.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Intermedio</tspan></text><text x="260.0" y="779.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="162"><tspan x="260.0" dy="0">1,5 a 2,2 cm</tspan></text><text x="437.5" y="779.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="162"><tspan x="437.5" dy="0">45 a 60 años</tspan></text><text x="615.0" y="779.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="162"><tspan x="615.0" dy="0">&lt; 20 cigarrillos al día o</tspan><tspan x="615.0" dy="15">abandono reciente</tspan></text><text x="792.5" y="779.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="162"><tspan x="792.5" dy="0">Festoneados</tspan></text><rect x="150.6" y="771.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="196.0" y="786.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="196.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="804.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="823.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="194"><tspan x="50.0" dy="0">Alto</tspan></text><text x="260.0" y="823.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="162"><tspan x="260.0" dy="0">≥ 2,3 cm</tspan></text><text x="437.5" y="823.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="162"><tspan x="437.5" dy="0">&gt; 60 años</tspan></text><text x="615.0" y="823.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="162"><tspan x="615.0" dy="0">&gt; 20 cigarrillos al día o</tspan><tspan x="615.0" dy="15">fumador activo</tspan></text><text x="792.5" y="823.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="162"><tspan x="792.5" dy="0">Espiculados</tspan></text><text x="40.0" y="864.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Probabilidad de cáncer (ACCP 2013): menos de 5 % bajo, 5 a 65 % intermedio, más de 65 % alto.</tspan></text><text x="40.0" y="911.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="921.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="943.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="943.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Sin riesgo</tspan></text><rect x="363.0" y="924.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="943.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Intermedio</tspan></text><text x="585.0" y="943.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Alto</tspan></text><text x="735.0" y="943.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Bajo</tspan></text><text x="885.0" y="943.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">No cuantificable</tspan></text><rect x="40.0" y="958.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="958.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="995.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Nivel de riesgo?</tspan></text><text x="285.0" y="987.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: todo nódulo tiene</tspan><tspan x="285.0" dy="16">algún riesgo</tspan></text><text x="435.0" y="979.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: todas las variables</tspan><tspan x="435.0" dy="16">caen en el grupo</tspan><tspan x="435.0" dy="16">intermedio</tspan></text><text x="585.0" y="979.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: exige un nódulo</tspan><tspan x="585.0" dy="16">mayor, más edad y</tspan><tspan x="585.0" dy="16">bordes espiculados</tspan></text><text x="735.0" y="987.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: exige menos de</tspan><tspan x="735.0" dy="16">1,5 cm y bordes lisos</tspan></text><text x="885.0" y="987.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: todas las variables</tspan><tspan x="885.0" dy="16">sí están descritas</tspan></text><rect x="40.0" y="921.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1048.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1076.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1098.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Riesgo bajo: menos de 1,5 cm, menos de 45 años, no fumador o abandono mayor de 7 años y bordes lisos.</tspan><tspan x="58.0" dy="18">• Riesgo intermedio: 1,5 a 2,2 cm, 45 a 60 años, menos de 20 cigarrillos al día o abandono reciente y bordes festoneados. Alto: 2,3 cm o más, más de 60</tspan><tspan x="58.0" dy="18">   años, más de 20 cigarrillos y bordes espiculados.</tspan><tspan x="58.0" dy="18">• Conducta: bajo, seguimiento con TC seriada; intermedio, PET-TC o biopsia guiada por imagen; alto, resección quirúrgica.</tspan><tspan x="58.0" dy="18">• Alerta: la estabilidad por 2 años sugiere benignidad en nódulos sólidos, no en vidrio esmerilado (Fleischner 2017).</tspan></text><text x="58.0" y="1192.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Gould MK et al., ACCP, Evaluation of individuals with pulmonary nodules (Chest 2013); MacMahon H et al., Fleischner Society (Radiology 2017); Harrison, 21.ª ed.</tspan><tspan x="58.0" dy="15">(2022).</tspan></text></svg>