<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="976" viewBox="0 0 1000 976" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Niño con otitis, fiebre, cefalea, letargia y ceguera: sospechar trombosis del seno cavernoso"><title>Niño con otitis, fiebre, cefalea, letargia y ceguera: sospechar trombosis del seno cavernoso</title><rect x="0.75" y="0.75" width="998.5" height="974.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">ORL · complicaciones de la otitis</tspan></text><rect x="395.3" y="32.0" width="162.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="476.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="146"><tspan x="476.4" dy="0">OFTALMOLOGÍA Y ORL RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Trombosis séptica del seno cavernoso</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infrecuente y muy grave; sigue a infecciones de la cara, los senos (esfenoides, etmoides) y,</tspan><tspan x="58.0" dy="17">menos, del oído medio.</tspan><tspan x="58.0" dy="17">Las venas sin válvulas llevan la infección al seno.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño con otitis media</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Fiebre, cefalea, letargia y ceguera.</tspan><tspan x="640.0" dy="16">¿Qué complicación se sospecha?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LA INFECCIÓN LLEGA AL SENO CAVERNOSO Y QUÉ LA CORTA</tspan></text><rect x="40.0" y="269.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="145.2" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Foco infeccioso</tspan></text><text x="145.2" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Otitis media o senos paranasales</tspan></text><line x1="253.5" y1="306.5" x2="266.5" y2="306.5" stroke="#0f766e" stroke-width="2"/><polygon points="265.5,301.5 265.5,311.5 273.5,306.5" fill="#0f766e"/><line x1="145.2" y1="346.0" x2="145.2" y2="360.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="40.0" y="362.0" width="210.5" height="81.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="145.2" y="376.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">✂ CORTA</tspan></text><text x="145.2" y="393.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="145.2" dy="0">Antibiótico precoz y drenaje del</tspan><tspan x="145.2" dy="16">foco</tspan></text><rect x="276.5" y="269.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="381.8" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Venas sin válvulas</tspan></text><text x="381.8" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Comunican con el seno cavernoso</tspan></text><line x1="490.0" y1="306.5" x2="503.0" y2="306.5" stroke="#0f766e" stroke-width="2"/><polygon points="502.0,301.5 502.0,311.5 510.0,306.5" fill="#0f766e"/><line x1="381.8" y1="346.0" x2="381.8" y2="360.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="276.5" y="362.0" width="210.5" height="81.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="381.8" y="376.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">✂ CORTA</tspan></text><text x="381.8" y="393.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="381.8" dy="0">Cobertura de estafilococo</tspan></text><rect x="513.0" y="269.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="618.2" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Seno cavernoso</tspan></text><text x="618.2" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Trombosis séptica</tspan></text><line x1="726.5" y1="306.5" x2="739.5" y2="306.5" stroke="#0f766e" stroke-width="2"/><polygon points="738.5,301.5 738.5,311.5 746.5,306.5" fill="#0f766e"/><line x1="618.2" y1="346.0" x2="618.2" y2="360.0" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="513.0" y="362.0" width="210.5" height="81.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="2"/><text x="618.2" y="376.0" font-size="9.5" font-weight="800" font-style="normal" fill="#ffedd5" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">✂ CORTA</tspan></text><text x="618.2" y="393.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="190"><tspan x="618.2" dy="0">Antibiótico intravenoso;</tspan><tspan x="618.2" dy="16">anticoagulación en casos</tspan><tspan x="618.2" dy="16">seleccionados</tspan></text><rect x="572.8" y="432.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="618.2" y="447.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="618.2" dy="0">◆ ESTE CASO</tspan></text><rect x="749.5" y="269.0" width="210.5" height="75.0" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/><text x="854.8" y="289.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Órbita y pares craneales</tspan></text><text x="854.8" y="306.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Proptosis, oftalmoplejía, pérdida</tspan><tspan x="854.8" dy="16">visual</tspan></text><line x1="854.8" y1="346.0" x2="854.8" y2="360.0" stroke="#cbd5e1" stroke-width="2.5" stroke-dasharray="4 3"/><rect x="749.5" y="362.0" width="210.5" height="81.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="854.8" y="376.0" font-size="9.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">✂ CORTA</tspan></text><text x="854.8" y="393.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="190"><tspan x="854.8" dy="0">Vigilar la visión y descartar</tspan><tspan x="854.8" dy="16">bilateralidad</tspan></text><rect x="40.0" y="473.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="499.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Otitis + fiebre + cefalea + ceguera = trombosis del seno cavernoso</tspan></text><text x="60.0" y="518.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Meningitis, encefalitis e hipertensión endocraneana no dan oftalmoplejía ni ceguera focal.</tspan></text><text x="40.0" y="585.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="595.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="626.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="598.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="617.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Trombosis del seno</tspan><tspan x="285.0" dy="17">cavernoso</tspan></text><text x="435.0" y="626.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Retinoblastoma</tspan></text><text x="585.0" y="626.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Encefalitis</tspan></text><text x="735.0" y="626.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Meningitis</tspan></text><text x="885.0" y="617.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hipertensión</tspan><tspan x="885.0" dy="17">endocraneana</tspan></text><rect x="40.0" y="649.0" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="649.0" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="686.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Complicación</tspan><tspan x="54.0" dy="16">sospechada?</tspan></text><text x="285.0" y="678.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: ceguera y</tspan><tspan x="285.0" dy="16">compromiso de pares</tspan><tspan x="285.0" dy="16">oculares</tspan></text><text x="435.0" y="686.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: tumor con</tspan><tspan x="435.0" dy="16">leucocoria</tspan></text><text x="585.0" y="670.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sin signos oculares</tspan><tspan x="585.0" dy="16">focales; conciencia</tspan><tspan x="585.0" dy="16">alterada y</tspan><tspan x="585.0" dy="16">convulsiones</tspan></text><text x="735.0" y="686.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: rigidez de nuca sin</tspan><tspan x="735.0" dy="16">signos oculares focales</tspan></text><text x="885.0" y="678.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: cefalea y</tspan><tspan x="885.0" dy="16">papiledema sin</tspan><tspan x="885.0" dy="16">oftalmoplejía</tspan></text><rect x="40.0" y="595.0" width="920.0" height="136.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="755.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="783.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="805.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Cuadro clásico: fiebre alta, cefalea, dolor y edema periorbitario, proptosis, quemosis, oftalmoplejía (pares III, IV, VI y rama oftálmica del V), edema de</tspan><tspan x="58.0" dy="18">   papila y pérdida visual; puede ser bilateral.</tspan><tspan x="58.0" dy="18">• Meningitis: rigidez de nuca sin signos oculares focales. Encefalitis: alteración de conciencia y convulsiones. Hipertensión endocraneana: cefalea y</tspan><tspan x="58.0" dy="18">   papiledema. Retinoblastoma: leucocoria.</tspan><tspan x="58.0" dy="18">• Diagnóstico por TC o resonancia con venografía. Tratamiento: antibiótico intravenoso de amplio espectro con cobertura de estafilococo (incluido el</tspan><tspan x="58.0" dy="18">   resistente a meticilina), drenaje del foco y anticoagulación en casos seleccionados.</tspan><tspan x="58.0" dy="18">• Alerta: el agente más habitual es Staphylococcus aureus; las secuelas visuales son frecuentes aun con tratamiento.</tspan></text><text x="58.0" y="935.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Cerebral venous disorders: clinical presentation, diagnostic strategy, and contemporary management (Front Neurol 2026); Cummings Otolaringología 7.ª ed. (2021)</tspan></text></svg>