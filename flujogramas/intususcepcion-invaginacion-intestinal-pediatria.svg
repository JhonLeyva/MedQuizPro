<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1018" viewBox="0 0 820 1018" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Intususcepción (invaginación intestinal) en pediatría"><title>Intususcepción (invaginación intestinal) en pediatría</title><rect width="820" height="1018" fill="#ffffff"/><rect x="0" y="0" width="820" height="142" fill="#0f766e"/><text x="40" y="34" font-size="13" font-weight="600" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="740"><tspan x="40" dy="0">MedQuizPlus · Flujograma</tspan></text><text x="40" y="70" font-size="24" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="740"><tspan x="40" dy="0">Intususcepción (invaginación intestinal) en</tspan><tspan x="40" dy="30">pediatría</tspan></text><text x="40" y="126" font-size="13" font-weight="400" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="740"><tspan x="40" dy="0">ENAM 2020 · PED-024 · Pediatría y Neonatología</tspan></text><rect x="90" y="174" width="640" height="76" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="2"/><text x="108" y="202" font-size="11" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="start" data-max="604"><tspan x="108" dy="0">INICIO</tspan></text><text x="108" y="226" font-size="16" font-weight="600" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Lactante con dolor cólico intermitente, llanto y letargia</tspan></text><line x1="410.0" y1="252" x2="410.0" y2="272" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,270 417.0,270 410.0,280" fill="#94a3b8"/><rect x="90" y="282" width="640" height="98" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="310" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="334" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Heces con moco y sangre («jalea de grosella») y masa</tspan><tspan x="108" dy="22">abdominal «en morcilla»</tspan></text><line x1="410.0" y1="382" x2="410.0" y2="402" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,400 417.0,400 410.0,410" fill="#94a3b8"/><rect x="90" y="412" width="640" height="76" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="440" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="464" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">Ecografía abdominal: imagen en «diana» o «donut»</tspan></text><line x1="410.0" y1="490" x2="410.0" y2="510" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,508 417.0,508 410.0,518" fill="#94a3b8"/><rect x="90" y="520" width="640" height="104" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><circle cx="120" cy="572.0" r="12" fill="#d97706"/><text x="120" y="577.0" font-size="15" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="120" dy="0">?</tspan></text><text x="142" y="548" font-size="11" font-weight="700" font-style="normal" fill="#b45309" text-anchor="start" data-max="570"><tspan x="142" dy="0">DECISIÓN</tspan></text><text x="142" y="572" font-size="16" font-weight="600" font-style="normal" fill="#78350f" text-anchor="start" data-max="570"><tspan x="142" dy="0">¿Peritonitis, perforación o inestabilidad hemodinámica?</tspan></text><text x="142" y="600" font-size="14" font-weight="500" font-style="italic" fill="#92400e" text-anchor="start" data-max="570"><tspan x="142" dy="0">↳ Sí → cirugía</tspan></text><line x1="410.0" y1="626" x2="410.0" y2="646" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,644 417.0,644 410.0,654" fill="#94a3b8"/><rect x="90" y="656" width="640" height="76" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="108" y="684" font-size="11" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="604"><tspan x="108" dy="0">ACCIÓN</tspan></text><text x="108" y="708" font-size="16" font-weight="400" font-style="normal" fill="#0f172a" text-anchor="start" data-max="604"><tspan x="108" dy="0">No: reducción con enema hidrostático o neumático</tspan></text><line x1="410.0" y1="734" x2="410.0" y2="754" stroke="#94a3b8" stroke-width="2.5"/><polygon points="403.0,752 417.0,752 410.0,762" fill="#94a3b8"/><rect x="90" y="764" width="640" height="76" rx="12" fill="#134e4a" stroke="#134e4a" stroke-width="2"/><text x="108" y="792" font-size="11" font-weight="700" font-style="normal" fill="#5eead4" text-anchor="start" data-max="604"><tspan x="108" dy="0">CONDUCTA FINAL</tspan></text><text x="108" y="816" font-size="16" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="604"><tspan x="108" dy="0">Si la reducción falla: reducción quirúrgica</tspan></text><rect x="40" y="870" width="740" height="98" rx="10" fill="#f0fdfa" stroke="#99f6e4"/><rect x="40" y="870" width="6" height="98" rx="3" fill="#14b8a6"/><text x="62" y="896" font-size="14" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="704"><tspan x="62" dy="0">Perla clínica</tspan></text><text x="62" y="920" font-size="15" font-weight="400" font-style="normal" fill="#134e4a" text-anchor="start" data-max="704"><tspan x="62" dy="0">Es la causa más frecuente de obstrucción intestinal entre los 3 meses y los</tspan><tspan x="62" dy="21">3 años.</tspan></text><text x="410.0" y="996" font-size="11" font-weight="400" font-style="normal" fill="#64748b" text-anchor="middle" data-max="740"><tspan x="410.0" dy="0">MedQuizPlus · Material de estudio: contrasta siempre con las guías clínicas vigentes.</tspan></text></svg>
