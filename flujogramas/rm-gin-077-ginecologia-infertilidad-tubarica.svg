<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1283" viewBox="0 0 1000 1283" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Infertilidad con ectópico previo y varias EIP: el examen inicial es la histerosalpingografía"><title>Infertilidad con ectópico previo y varias EIP: el examen inicial es la histerosalpingografía</title><rect x="0.75" y="0.75" width="998.5" height="1281.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ginecología · infertilidad tubárica</tspan></text><rect x="397.5" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="477.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="477.3" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Factor tubárico</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La enfermedad inflamatoria pélvica y el ectópico previo lesionan la trompa.</tspan><tspan x="58.0" dy="17">La histerosalpingografía evalúa cavidad y permeabilidad.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 34 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Infertilidad, ectópico complicado hace 2 años.</tspan><tspan x="640.0" dy="16">Enfermedad inflamatoria pélvica en 3 oportunidades.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE LLEGA AL EXAMEN INICIAL</tspan></text><text x="614.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,293.0 580.0,293.0 543.8,401.0 76.2,401.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="309.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="357.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="424"><tspan x="310.0" dy="0">Infertilidad con ectópico previo y tres episodios de EIP</tspan></text><line x1="565.9" y1="347.0" x2="606.0" y2="347.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="302.0" width="139.1" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="683.6" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="683.6" dy="0">Ecografía transvaginal</tspan></text><rect x="759.1" y="302.0" width="94.0" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="806.1" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="806.1" dy="0">Histeroscopía</tspan></text><rect x="614.0" y="334.0" width="114.9" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="671.4" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="671.4" dy="0">Histerosonografía</tspan></text><rect x="734.9" y="334.0" width="93.3" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="781.6" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="781.6" dy="0">Laparoscopía</tspan></text><rect x="614.0" y="366.0" width="133.2" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="680.6" y="383.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="680.6" dy="0">Histerosalpingografía</tspan></text><polygon points="76.2,405.0 543.8,405.0 507.5,461.0 112.5,461.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="138.5" cy="433.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="138.5" y="437.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="138.5" dy="0">1</tspan></text><text x="320.0" y="437.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="331"><tspan x="320.0" dy="0">¿Evalúa la permeabilidad de las trompas?</tspan></text><line x1="529.6" y1="433.0" x2="606.0" y2="433.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="420.0" width="151.2" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="689.6" y="437.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="689.6" dy="0">✕ Ecografía transvaginal</tspan></text><line x1="636.0" y1="433.5" x2="755.2" y2="433.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="771.2" y="420.0" width="106.1" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="824.2" y="437.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="824.2" dy="0">✕ Histeroscopía</tspan></text><line x1="793.2" y1="433.5" x2="867.3" y2="433.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="112.5,465.0 507.5,465.0 471.2,521.0 148.8,521.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="174.8" cy="493.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="174.8" y="497.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="174.8" dy="0">2</tspan></text><text x="320.0" y="497.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="258"><tspan x="320.0" dy="0">¿Es de entrada poco invasiva?</tspan></text><line x1="493.4" y1="493.0" x2="606.0" y2="493.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="480.0" width="105.4" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="666.7" y="497.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="666.7" dy="0">✕ Laparoscopía</tspan></text><line x1="636.0" y1="493.5" x2="709.4" y2="493.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="148.8,525.0 471.2,525.0 435.0,585.0 185.0,585.0" fill="#5eead4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="555.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="559.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">3</tspan></text><text x="320.0" y="551.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">¿Es el estudio inicial y no</tspan><tspan x="320.0" dy="17">una alternativa?</tspan></text><line x1="457.1" y1="555.0" x2="606.0" y2="555.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="542.0" width="127.0" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="677.5" y="559.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="677.5" dy="0">✕ Histerosonografía</tspan></text><line x1="636.0" y1="555.5" x2="731.0" y2="555.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="589.0" x2="310.0" y2="608.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,607.0 315.0,607.0 310.0,615.0" fill="#0f766e"/><rect x="140.0" y="619.0" width="340.0" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="648.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">HISTEROSALPINGOGRAFÍA</tspan></text><text x="310.0" y="672.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Cavidad uterina y trompas</tspan><tspan x="310.0" dy="17">Fase folicular temprana</tspan></text><rect x="370.6" y="608.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="623.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="626.9" width="346.0" height="76.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="646.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="664.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">La laparoscopía se reserva si la histerosalpingografía</tspan><tspan x="628.0" dy="16">sugiere patología tubárica o adherencias.</tspan></text><text x="40.0" y="744.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EVALUACIÓN BÁSICA DE LA PAREJA INFÉRTIL</tspan></text><rect x="40.0" y="756.9" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="775.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Factor</tspan></text><text x="270.0" y="775.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="684"><tspan x="270.0" dy="0">Estudio inicial</tspan></text><rect x="40.0" y="785.9" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="804.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Masculino</tspan></text><text x="270.0" y="804.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="684"><tspan x="270.0" dy="0">Espermatograma</tspan></text><rect x="40.0" y="814.9" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="833.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Ovulación</tspan></text><text x="270.0" y="833.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="684"><tspan x="270.0" dy="0">Progesterona en la fase lútea media</tspan></text><rect x="40.0" y="843.9" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="862.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Reserva ovárica</tspan></text><text x="270.0" y="862.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="684"><tspan x="270.0" dy="0">Hormona antimülleriana o recuento de folículos antrales</tspan></text><rect x="40.0" y="872.9" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="891.9" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="204"><tspan x="50.0" dy="0">Cavidad y trompas</tspan></text><text x="270.0" y="891.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="684"><tspan x="270.0" dy="0">Histerosalpingografía</tspan></text><rect x="160.6" y="876.4" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="206.0" y="891.4" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="206.0" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="941.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="951.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="982.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="974.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Ecografía</tspan><tspan x="285.0" dy="17">transvaginal</tspan></text><text x="435.0" y="982.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Histeroscopía</tspan></text><text x="585.0" y="982.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Histerosonografía</tspan></text><text x="735.0" y="982.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Laparoscopía</tspan></text><rect x="813.0" y="954.9" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="885.0" y="982.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Histerosalpingografía</tspan></text><rect x="40.0" y="1005.9" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="813.0" y="1005.9" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1034.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Examen inicial?</tspan></text><text x="285.0" y="1026.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no evalúa la</tspan><tspan x="285.0" dy="16">permeabilidad tubárica</tspan></text><text x="435.0" y="1026.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: evalúa la cavidad,</tspan><tspan x="435.0" dy="16">no las trompas</tspan></text><text x="585.0" y="1026.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es una alternativa,</tspan><tspan x="585.0" dy="16">no el primer estudio</tspan></text><text x="735.0" y="1026.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: invasiva, se</tspan><tspan x="735.0" dy="16">reserva para después</tspan></text><text x="885.0" y="1026.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Sí: cavidad y</tspan><tspan x="885.0" dy="16">permeabilidad tubárica</tspan></text><rect x="40.0" y="951.9" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1079.9" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1107.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1129.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La evaluación básica incluye espermatograma, confirmación de la ovulación, reserva ovárica (AMH o recuento de folículos antrales) y valoración de la</tspan><tspan x="58.0" dy="18">   cavidad y de la permeabilidad tubárica.</tspan><tspan x="58.0" dy="18">• Con EIP repetida y ectópico previo es muy probable el factor tubárico: primer estudio, histerosalpingografía (contraste transcervical) en fase folicular</tspan><tspan x="58.0" dy="18">   temprana, sin embarazo ni infección.</tspan><tspan x="58.0" dy="18">• La histerosonografía con solución salina es una alternativa; la ecografía transvaginal y la histeroscopía no evalúan la permeabilidad tubárica.</tspan><tspan x="58.0" dy="18">• La laparoscopía se reserva para cuando la histerosalpingografía sugiere patología o para tratar.</tspan></text><text x="58.0" y="1241.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ASRM, Evaluación de la fertilidad de la mujer infértil: opinión de comité (Fertil Steril 2021); Williams Obstetricia, 26.ª ed. (2022).</tspan></text></svg>