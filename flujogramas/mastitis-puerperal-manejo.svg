<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1001" viewBox="0 0 1000 1001" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Puérpera con fiebre y zona roja, dura y caliente en la mama: mastitis, dicloxacilina sin suspender la lactancia"><title>Puérpera con fiebre y zona roja, dura y caliente en la mama: mastitis, dicloxacilina sin suspender la lactancia</title><rect x="0.75" y="0.75" width="998.5" height="999.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Complicaciones del puerperio · mastitis</tspan></text><rect x="435.2" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="522.3" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="522.3" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Mastitis puerperal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Inflamación de la mama que lacta; si hay fiebre y signos sistémicos, infección por S.</tspan><tspan x="58.0" dy="17">aureus.</tspan><tspan x="58.0" dy="17">Lo más frecuente entre la 2.ª y 6.ª semana posparto.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Puérpera de 25 días</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Dolor en la mama izquierda y fiebre de 38,7 °C.</tspan><tspan x="640.0" dy="16">Zona de 6 cm endurecida, roja y caliente.</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="255.0" x2="577.8" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="577.8" y1="255.0" x2="577.8" y2="284.0" stroke="#94a3b8" stroke-width="2"/><polygon points="572.8,283.0 582.8,283.0 577.8,291.0" fill="#94a3b8"/><line x1="577.8" y1="361.0" x2="577.8" y2="391.0" stroke="#94a3b8" stroke-width="2"/><line x1="344.3" y1="391.0" x2="811.3" y2="391.0" stroke="#94a3b8" stroke-width="2"/><line x1="344.3" y1="391.0" x2="344.3" y2="420.0" stroke="#94a3b8" stroke-width="2"/><polygon points="339.3,419.0 349.3,419.0 344.3,427.0" fill="#94a3b8"/><line x1="811.3" y1="391.0" x2="811.3" y2="420.0" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,419.0 816.3,419.0 811.3,427.0" fill="#94a3b8"/><line x1="344.3" y1="485.0" x2="344.3" y2="547.5" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="547.5" x2="500.0" y2="547.5" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="547.5" x2="188.7" y2="576.5" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,575.5 193.7,575.5 188.7,583.5" fill="#94a3b8"/><line x1="500.0" y1="547.5" x2="500.0" y2="576.5" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,575.5 505.0,575.5 500.0,583.5" fill="#94a3b8"/><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="255.0" x2="577.8" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="577.8" y1="255.0" x2="577.8" y2="284.0" stroke="#0f766e" stroke-width="3"/><polygon points="572.8,283.0 582.8,283.0 577.8,291.0" fill="#0f766e"/><line x1="577.8" y1="361.0" x2="577.8" y2="391.0" stroke="#0f766e" stroke-width="3"/><line x1="344.3" y1="391.0" x2="577.8" y2="391.0" stroke="#0f766e" stroke-width="3"/><line x1="344.3" y1="391.0" x2="344.3" y2="420.0" stroke="#0f766e" stroke-width="3"/><polygon points="339.3,419.0 349.3,419.0 344.3,427.0" fill="#0f766e"/><line x1="344.3" y1="485.0" x2="344.3" y2="547.5" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="547.5" x2="344.3" y2="547.5" stroke="#0f766e" stroke-width="3"/><line x1="188.7" y1="547.5" x2="188.7" y2="576.5" stroke="#0f766e" stroke-width="3"/><polygon points="183.7,575.5 193.7,575.5 188.7,583.5" fill="#0f766e"/><rect x="311.1" y="400.0" width="66.4" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="344.3" y="412.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="344.3" dy="0">Sí: 38,7 °C</tspan></text><rect x="797.2" y="400.0" width="28.3" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="811.3" y="412.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">No</tspan></text><rect x="145.1" y="556.5" width="87.1" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="188.7" y="569.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">No (este caso)</tspan></text><rect x="487.9" y="556.5" width="24.1" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="500.0" y="569.0" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">Sí</tspan></text><polygon points="317.8,326.0 343.8,291.0 811.8,291.0 837.8,326.0 811.8,361.0 343.8,361.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="363.8" cy="326.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="363.8" y="331.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="363.8" dy="0">?</tspan></text><text x="596.8" y="322.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="596.8" dy="0">Mama roja y dolorosa en la lactancia: ¿fiebre o malestar</tspan><tspan x="596.8" dy="17">general?</tspan></text><polygon points="84.3,456.0 110.3,427.0 578.3,427.0 604.3,456.0 578.3,485.0 110.3,485.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="130.3" cy="456.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="130.3" y="461.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="130.3" dy="0">?</tspan></text><text x="363.3" y="460.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="363.3" dy="0">¿Masa fluctuante en la ecografía?</tspan></text><rect x="40.0" y="583.5" width="297.3" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="188.7" y="611.8" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">MASTITIS INFECCIOSA</tspan></text><text x="188.7" y="634.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Dicloxacilina o cefalexina 10-14 días</tspan><tspan x="188.7" dy="17">Seguir la lactancia, AINE, frío</tspan></text><rect x="351.3" y="583.5" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="620.3" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Absceso mamario</tspan></text><text x="500.0" y="643.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Drenaje (aspiración) + antibiótico</tspan></text><rect x="662.7" y="427.0" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="455.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Mastitis inflamatoria</tspan></text><text x="811.3" y="478.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Frío, AINE, lactancia a demanda</tspan><tspan x="811.3" dy="17">Sin antibiótico al inicio</tspan></text><text x="40.0" y="713.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="723.9" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="754.9" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="754.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Amikacina</tspan></text><rect x="363.0" y="726.9" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="754.9" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Dicloxacilina</tspan></text><text x="585.0" y="754.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Ciprofloxacina</tspan></text><text x="735.0" y="754.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Doxiciclina</tspan></text><text x="885.0" y="746.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Suspender la</tspan><tspan x="885.0" dy="17">lactancia</tspan></text><rect x="40.0" y="777.9" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="777.9" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="806.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Adecuado?</tspan></text><text x="285.0" y="798.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no cubre bien S.</tspan><tspan x="285.0" dy="16">aureus de piel</tspan></text><text x="435.0" y="806.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: cubre S. aureus</tspan></text><text x="585.0" y="798.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no es de primera</tspan><tspan x="585.0" dy="16">línea</tspan></text><text x="735.0" y="798.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: contraindicada en</tspan><tspan x="735.0" dy="16">la lactancia</tspan></text><text x="885.0" y="798.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: vaciar la mama</tspan><tspan x="885.0" dy="16">ayuda a curar</tspan></text><rect x="40.0" y="723.9" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="851.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="879.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="901.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Antibiótico contra S. aureus 10-14 días: dicloxacilina o cefalexina; clindamicina si hay alergia o SARM.</tspan><tspan x="58.0" dy="18">• Seguir dando de lactar (o extraer la leche): vaciar la mama ayuda; no masajear fuerte; frío y AINE.</tspan><tspan x="58.0" dy="18">• Si hay masa fluctuante o no mejora en 48-72 h: ecografía para descartar absceso (drenaje).</tspan></text><text x="58.0" y="959.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Academy of Breastfeeding Medicine, protocolo n.º 36: espectro de la mastitis (2022); OMS; Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>