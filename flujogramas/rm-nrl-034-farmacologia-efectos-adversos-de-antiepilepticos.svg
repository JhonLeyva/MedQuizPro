<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="991" viewBox="0 0 1000 991" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La carbamazepina produce hiponatremia por un cuadro similar al SIADH"><title>La carbamazepina produce hiponatremia por un cuadro similar al SIADH</title><rect x="0.75" y="0.75" width="998.5" height="989.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Farmacología · efectos adversos de antiepilépticos</tspan></text><rect x="500.8" y="32.0" width="113.7" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="557.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="98"><tspan x="557.7" dy="0">NEUROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hiponatremia por antiepilépticos</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La carbamazepina, y con más frecuencia la oxcarbazepina, produce hiponatremia</tspan><tspan x="58.0" dy="17">hipoosmolar euvolémica.</tspan><tspan x="58.0" dy="17">Aumenta la liberación y la sensibilidad renal a la ADH.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál de estos anticonvulsivantes produce</tspan><tspan x="640.0" dy="16">hiponatremia?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CUÁNDO SOSPECHAR HIPONATREMIA POR CARBAMAZEPINA</tspan></text><rect x="40.0" y="269.0" width="602.0" height="34.0" rx="10" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.2"/><text x="56.0" y="291.0" font-size="11.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="452"><tspan x="56.0" dy="0">QUÉ HACER</tspan></text><text x="626.0" y="291.0" font-size="10.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="end" data-max="100"><tspan x="626.0" dy="0">EN EL CASO</tspan></text><rect x="40.0" y="309.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,324.5 74.0,344.5 50.0,344.5" fill="#dc2626"/><text x="62.0" y="341.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="332.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Sodio menor de 125 mEq/L</tspan></text><text x="84.0" y="349.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Náuseas, cefalea y confusión</tspan></text><text x="626.0" y="339.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="368.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,383.5 74.0,403.5 50.0,403.5" fill="#dc2626"/><text x="62.0" y="400.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="391.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Más crisis o convulsiones nuevas</tspan></text><text x="84.0" y="408.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Puede agravar el cuadro epiléptico</tspan></text><text x="626.0" y="398.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="427.0" width="602.0" height="53.0" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/><polygon points="62.0,442.5 74.0,462.5 50.0,462.5" fill="#dc2626"/><text x="62.0" y="459.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="450.0" font-size="12.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Anciano, dosis alta, tiazidas o ISRS</tspan></text><text x="84.0" y="467.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Factores de riesgo</tspan></text><text x="626.0" y="457.5" font-size="12" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">Sí</tspan></text><rect x="40.0" y="486.0" width="602.0" height="53.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/><polygon points="62.0,501.5 74.0,521.5 50.0,521.5" fill="#cbd5e1"/><text x="62.0" y="518.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">!</tspan></text><text x="84.0" y="509.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Sodio normal y sin síntomas</tspan></text><text x="84.0" y="526.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="462"><tspan x="84.0" dy="0">Solo vigilancia periódica</tspan></text><text x="626.0" y="516.5" font-size="12" font-weight="800" font-style="normal" fill="#64748b" text-anchor="end" data-max="80"><tspan x="626.0" dy="0">No</tspan></text><rect x="660.0" y="269.0" width="300.0" height="270.0" rx="12" fill="#dc2626" stroke="none" stroke-width="1.5"/><text x="676.0" y="293.0" font-size="10.5" font-weight="800" font-style="normal" fill="#fecaca" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">CON HIPONATREMIA CONFIRMADA</tspan></text><text x="676.0" y="347.5" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">Medir el sodio y ajustar el tratamiento</tspan></text><text x="676.0" y="364.5" font-size="12" font-weight="500" font-style="normal" fill="#fee2e2" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">Medir el sodio al iniciar y durante el</tspan><tspan x="676.0" dy="16">tratamiento. Si baja: restringir líquidos, reducir</tspan><tspan x="676.0" dy="16">la dosis o cambiar de fármaco. Con sodio</tspan><tspan x="676.0" dy="16">menor de 125 mEq/L o síntomas (confusión,</tspan><tspan x="676.0" dy="16">más crisis), vigilar de cerca y corregir con</tspan><tspan x="676.0" dy="16">cuidado para evitar el síndrome de</tspan><tspan x="676.0" dy="16">desmielinización osmótica. Ante una</tspan><tspan x="676.0" dy="16">hiponatremia inexplicada en un epiléptico,</tspan><tspan x="676.0" dy="16">revisar siempre sus fármacos.</tspan></text><rect x="40.0" y="557.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="583.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Hiponatremia en un epiléptico = revisar carbamazepina</tspan></text><text x="60.0" y="602.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Topiramato, fenobarbital, lamotrigina y fenitoína tienen otros efectos adversos.</tspan></text><text x="40.0" y="669.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="679.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="701.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="701.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Topiramato</tspan></text><text x="435.0" y="701.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Fenobarbital</tspan></text><rect x="513.0" y="682.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="701.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Carbamazepina</tspan></text><text x="735.0" y="701.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Lamotrigina</tspan></text><text x="885.0" y="701.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Fenitoína</tspan></text><rect x="40.0" y="716.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="716.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="753.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Produce hiponatremia?</tspan></text><text x="285.0" y="737.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: causa acidosis</tspan><tspan x="285.0" dy="16">metabólica y cálculos</tspan><tspan x="285.0" dy="16">renales</tspan></text><text x="435.0" y="745.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: causa sedación e</tspan><tspan x="435.0" dy="16">inducción enzimática</tspan></text><text x="585.0" y="737.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: SIADH por mayor</tspan><tspan x="585.0" dy="16">liberación y</tspan><tspan x="585.0" dy="16">sensibilidad a la ADH</tspan></text><text x="735.0" y="745.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: causa erupciones</tspan><tspan x="735.0" dy="16">graves</tspan></text><text x="885.0" y="745.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: causa hiperplasia</tspan><tspan x="885.0" dy="16">gingival y nistagmo</tspan></text><rect x="40.0" y="679.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="806.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="834.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="856.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Afecta entre 5 y 40 % de los pacientes según la serie; más riesgo en ancianos, dosis altas, tiazidas o ISRS. Suele ser asintomática.</tspan><tspan x="58.0" dy="18">• Con sodio menor de 125 mEq/L: náuseas, cefalea, confusión, más crisis y convulsiones.</tspan><tspan x="58.0" dy="18">• Manejo: medir el sodio al iniciar y durante el tratamiento, restringir líquidos, reducir la dosis o cambiar de fármaco; corregir con cuidado en los casos</tspan><tspan x="58.0" dy="18">   graves (desmielinización osmótica).</tspan><tspan x="58.0" dy="18">• Otros efectos: topiramato (acidosis, cálculos renales), fenobarbital (sedación), lamotrigina (Stevens-Johnson), fenitoína (hiperplasia gingival, nistagmo).</tspan></text><text x="58.0" y="950.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Goodman y Gilman, 14.ª ed. (2023); Katzung, 16.ª ed. (2024); Harrison, 21.ª ed. (2022).</tspan></text></svg>