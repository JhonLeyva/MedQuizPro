<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1202" viewBox="0 0 1000 1202" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Piel seca, bradicardia y aumento de peso con amenorrea: hipotiroidismo, no falla ovárica"><title>Piel seca, bradicardia y aumento de peso con amenorrea: hipotiroidismo, no falla ovárica</title><rect x="0.75" y="0.75" width="998.5" height="1200.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Endocrinología · hipotiroidismo y eje reproductivo</tspan></text><rect x="497.3" y="32.0" width="140.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="567.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="124"><tspan x="567.6" dy="0">ENDOCRINOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hipotiroidismo y ovulación</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La TRH elevada también estimula la prolactina y cambia la SHBG: se pierde la ovulación.</tspan><tspan x="58.0" dy="17">Amenorrea e infertilidad pueden ser la primera señal.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 32 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Amenorrea e infertilidad de un año, piel seca y</tspan><tspan x="640.0" dy="16">engrosada, pulso lento, aumento de peso.</tspan><tspan x="640.0" dy="16">Ecografía pélvica normal y FSH de 18 mUI/mL.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DEL CUADRO CLÍNICO A LA CAUSA DE LA AMENORREA</tspan></text><rect x="40.0" y="285.0" width="920.0" height="112.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="285.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="345.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Clínica</tspan></text><rect x="40.0" y="397.0" width="920.0" height="112.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="397.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="457.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Hormonas</tspan></text><rect x="40.0" y="509.0" width="920.0" height="112.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="509.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="565.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Eje</tspan><tspan x="94.0" dy="14">reproductivo</tspan></text><rect x="40.0" y="621.0" width="920.0" height="112.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="621.0" width="108.0" height="112.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="681.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Conducta</tspan></text><line x1="348.0" y1="341.0" x2="355.0" y2="341.0" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="341.0" x2="355.0" y2="436.5" stroke="#0f766e" stroke-width="2.2"/><line x1="355.0" y1="436.5" x2="353.0" y2="436.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="353.0,441.5 353.0,431.5 362.0,436.5" fill="#0f766e"/><line x1="552.0" y1="436.5" x2="559.0" y2="436.5" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="436.5" x2="559.0" y2="565.0" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="565.0" x2="557.0" y2="565.0" stroke="#ea580c" stroke-width="2.2"/><polygon points="557.0,570.0 557.0,560.0 566.0,565.0" fill="#ea580c"/><line x1="756.0" y1="565.0" x2="763.0" y2="565.0" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="565.0" x2="763.0" y2="669.0" stroke="#0f766e" stroke-width="2.2"/><line x1="763.0" y1="669.0" x2="761.0" y2="669.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="761.0,674.0 761.0,664.0 770.0,669.0" fill="#0f766e"/><rect x="158.0" y="298.0" width="190.0" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="314.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Piel seca, pulso lento y</tspan><tspan x="168.0" dy="16">aumento de peso</tspan></text><text x="168.0" y="347.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="168.0" dy="0">Hipotiroidismo en una mujer de</tspan><tspan x="168.0" dy="14.5">32 años</tspan></text><circle cx="158.0" cy="298.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="302.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="362.0" y="410.0" width="190.0" height="53.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="372.0" y="426.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">TSH alta y T4 libre baja</tspan></text><text x="372.0" y="443.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="372.0" dy="0">La TRH alta eleva la prolactina</tspan></text><circle cx="362.0" cy="410.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="362.0" y="414.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="362.0" dy="0">2</tspan></text><rect x="566.0" y="522.0" width="190.0" height="86.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="576.0" y="538.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">Anovulación: amenorrea e</tspan><tspan x="576.0" dy="16">infertilidad</tspan></text><text x="576.0" y="571.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="576.0" dy="0">FSH 18 y ovarios normales: no es</tspan><tspan x="576.0" dy="14.5">falla ovárica</tspan></text><circle cx="566.0" cy="522.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="566.0" y="526.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="566.0" dy="0">3</tspan></text><rect x="770.0" y="634.0" width="190.0" height="70.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="780.0" y="650.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Pedir TSH y T4 libre;</tspan><tspan x="780.0" dy="16">levotiroxina</tspan></text><text x="780.0" y="683.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="170"><tspan x="780.0" dy="0">Se restablece la ovulación</tspan></text><circle cx="770.0" cy="634.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="770.0" y="638.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="770.0" dy="0">4</tspan></text><rect x="40.0" y="751.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="777.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Hipotiroidismo = causa tratable de amenorrea e infertilidad</tspan></text><text x="60.0" y="796.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">FSH discretamente alta y ovarios normales: no es falla ovárica prematura.</tspan></text><text x="40.0" y="863.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="873.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="904.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="876.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="904.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Hipotiroidismo</tspan></text><text x="435.0" y="895.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Enfermedad de</tspan><tspan x="435.0" dy="17">Addison</tspan></text><text x="585.0" y="895.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Falla ovárica</tspan><tspan x="585.0" dy="17">prematura</tspan></text><text x="735.0" y="895.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Síndrome de</tspan><tspan x="735.0" dy="17">Cushing</tspan></text><text x="885.0" y="904.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hiperprolactinemia</tspan></text><rect x="40.0" y="927.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="927.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="964.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="948.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: piel seca,</tspan><tspan x="285.0" dy="16">bradicardia y peso con</tspan><tspan x="285.0" dy="16">anovulación</tspan></text><text x="435.0" y="948.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: da astenia,</tspan><tspan x="435.0" dy="16">hipotensión e</tspan><tspan x="435.0" dy="16">hiperpigmentación</tspan></text><text x="585.0" y="956.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: FSH 18 está lejos</tspan><tspan x="585.0" dy="16">del umbral</tspan></text><text x="735.0" y="956.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: da obesidad</tspan><tspan x="735.0" dy="16">central, estrías e HTA</tspan></text><text x="885.0" y="956.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: sin galactorrea ni</tspan><tspan x="885.0" dy="16">cefalea</tspan></text><rect x="40.0" y="873.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1017.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1045.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1067.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Hipotiroidismo: piel seca y engrosada, bradicardia, aumento de peso y frío; se confirma con TSH alta y T4 libre baja (ATA 2014).</tspan><tspan x="58.0" dy="18">• Altera el eje reproductivo: TRH alta, prolactina elevada y anovulación; toda mujer con trastorno menstrual o infertilidad necesita una TSH.</tspan><tspan x="58.0" dy="18">• Falla ovárica prematura (ESHRE 2024): menor de 40 años con amenorrea y FSH &gt; 25-40 mUI/mL en dos tomas separadas por un mes; FSH 18 no la</tspan><tspan x="58.0" dy="18">   cumple.</tspan><tspan x="58.0" dy="18">• Tratamiento: levotiroxina; al normalizar la TSH se restablece la ovulación. En el embarazo se ajusta con rangos propios (ATA 2017).</tspan></text><text x="58.0" y="1161.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ATA, hipotiroidismo (Jonklaas, Thyroid 2014); ESHRE, insuficiencia ovárica prematura (2024); ATA, tiroides y embarazo (Alexander, Thyroid 2017)</tspan></text></svg>