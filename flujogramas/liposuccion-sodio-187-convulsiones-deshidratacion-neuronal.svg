<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="792" viewBox="0 0 1000 792" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Coma por hipernatremia"><title>Coma por hipernatremia</title><rect x="0.75" y="0.75" width="998.5" height="790.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">NEFROLOGÍA ENAM: HIPERNATREMIA GRAVE</tspan></text><rect x="478.2" y="32.0" width="93.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="524.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="77"><tspan x="524.8" dy="0">NEFROLOGÍA</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hipernatremia grave</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La osmolaridad plasmática alta saca agua de las neuronas</tspan><tspan x="58.0" dy="17">El cerebro se deshidrata: convulsiones y coma</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 30 años tras liposucción</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Deterioro de conciencia, convulsiones y coma</tspan><tspan x="640.0" dy="16">Na 187 mEq/L</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EMBUDO DEL MECANISMO</tspan></text><text x="614.0" y="281.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,293.0 580.0,293.0 531.7,369.0 88.3,369.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="309.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="341.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="399"><tspan x="310.0" dy="0">Coma tras una cirugía</tspan></text><line x1="559.8" y1="331.0" x2="606.0" y2="331.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="302.0" width="124.0" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="676.0" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="676.0" dy="0">Gradiente osmótico</tspan></text><rect x="744.0" y="302.0" width="85.5" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="786.8" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="786.8" dy="0">Anestésicos</tspan></text><rect x="835.5" y="302.0" width="119.5" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="895.2" y="319.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="895.2" dy="0">Meningoencefalitis</tspan></text><rect x="614.0" y="334.0" width="97.2" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="662.6" y="351.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="662.6" dy="0">Embolia grasa</tspan></text><polygon points="88.3,373.0 531.7,373.0 483.3,429.0 136.7,429.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="162.7" cy="401.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="162.7" y="405.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="162.7" dy="0">1</tspan></text><text x="320.0" y="405.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="283"><tspan x="320.0" dy="0">Na 187: trastorno osmolar evidente</tspan></text><line x1="511.5" y1="401.0" x2="606.0" y2="401.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="388.0" width="96.9" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="662.5" y="405.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="662.5" dy="0">✕ Anestésicos</tspan></text><line x1="636.0" y1="401.5" x2="700.9" y2="401.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="716.9" y="388.0" width="109.3" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="771.6" y="405.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="771.6" dy="0">✕ Embolia grasa</tspan></text><line x1="738.9" y1="401.5" x2="816.2" y2="401.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="136.7,433.0 483.3,433.0 435.0,493.0 185.0,493.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="463.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="467.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">2</tspan></text><text x="320.0" y="459.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">Sin fiebre ni signos</tspan><tspan x="320.0" dy="17">meníngeos</tspan></text><line x1="463.2" y1="463.0" x2="606.0" y2="463.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="450.0" width="131.6" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="679.8" y="467.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="679.8" dy="0">✕ Meningoencefalitis</tspan></text><line x1="636.0" y1="463.5" x2="735.6" y2="463.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="497.0" x2="310.0" y2="516.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,515.0 315.0,515.0 310.0,523.0" fill="#0f766e"/><rect x="140.0" y="527.0" width="340.0" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="556.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">GRADIENTE OSMÓTICO</tspan></text><text x="310.0" y="580.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Deshidratación neuronal</tspan><tspan x="310.0" dy="17">Riesgo de hemorragia por tracción</tspan></text><rect x="370.6" y="516.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="531.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="542.9" width="346.0" height="60.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="562.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="580.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">Corregir lento: no más de 10-12 mEq/L en 24 horas.</tspan></text><rect x="40.0" y="642.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="670.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="692.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Calcular el déficit de agua libre.</tspan><tspan x="58.0" dy="18">• La corrección rápida causa edema cerebral.</tspan><tspan x="58.0" dy="18">• Buscar la causa: pérdidas o sodio iatrogénico.</tspan></text><text x="58.0" y="750.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Harrison. Principios de Medicina Interna 22.ª ed. (2025) · Adrogué HJ. NEJM (2000)</tspan></text></svg>