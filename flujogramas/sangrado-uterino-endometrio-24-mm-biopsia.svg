<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1290" viewBox="0 0 1000 1290" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Mujer joven con sangrado menstrual abundante y endometrio de 24 mm en la ecografía: biopsia de endometrio"><title>Mujer joven con sangrado menstrual abundante y endometrio de 24 mm en la ecografía: biopsia de endometrio</title><rect x="0.75" y="0.75" width="998.5" height="1289.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Sangrado uterino anormal · estudio</tspan></text><rect x="409.8" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="497.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="497.0" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Sangrado uterino anormal (SUA)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se clasifica con PALM-COEIN (FIGO): causas estructurales (PALM) y no estructurales</tspan><tspan x="58.0" dy="17">(COEIN).</tspan><tspan x="58.0" dy="17">Un endometrio engrosado obliga a tomar muestra para descartar pólipo, hiperplasia o</tspan><tspan x="58.0" dy="17">cáncer.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 28 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">6 meses de menstruaciones más abundantes, ciclos</tspan><tspan x="640.0" dy="16">regulares.</tspan><tspan x="640.0" dy="16">Examen normal; eco TV: útero de 8 cm, endometrio de</tspan><tspan x="640.0" dy="16">24 mm; test de embarazo negativo.</tspan></text><line x1="640.0" y1="237.0" x2="670.0" y2="237.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#94a3b8"/><line x1="500.0" y1="381.0" x2="500.0" y2="411.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="411.0" x2="733.5" y2="411.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="411.0" x2="266.5" y2="440.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,439.0 271.5,439.0 266.5,447.0" fill="#94a3b8"/><line x1="733.5" y1="411.0" x2="733.5" y2="440.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,439.0 738.5,439.0 733.5,447.0" fill="#94a3b8"/><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="287.0" x2="500.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="287.0" x2="500.0" y2="316.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,315.0 505.0,315.0 500.0,323.0" fill="#0f766e"/><line x1="500.0" y1="381.0" x2="500.0" y2="411.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="411.0" x2="500.0" y2="411.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="411.0" x2="266.5" y2="440.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,439.0 271.5,439.0 266.5,447.0" fill="#0f766e"/><rect x="204.8" y="420.0" width="123.4" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="432.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Sí: 24 mm (este caso)</tspan></text><rect x="677.5" y="420.0" width="112.1" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="432.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">Endometrio normal</tspan></text><polygon points="240.0,352.0 266.0,323.0 734.0,323.0 760.0,352.0 734.0,381.0 266.0,381.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="352.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="357.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="356.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">SUA con endometrio engrosado: ¿se necesita histología?</tspan></text><rect x="40.0" y="447.0" width="453.0" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="475.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">BIOPSIA DE ENDOMETRIO</tspan></text><text x="266.5" y="498.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Pipelle</tspan><tspan x="266.5" dy="17">Histeroscopía si es focal</tspan></text><rect x="507.0" y="447.0" width="453.0" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="475.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Buscar causas COEIN</tspan></text><text x="733.5" y="498.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Hemograma, TSH</tspan><tspan x="733.5" dy="17">Coagulación</tspan></text><text x="40.0" y="577.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="589.5" width="920.0" height="374.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="603.5" width="277.0" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="194.5" y="623.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="194.5" dy="0">CLASIFICACIÓN PALM-COEIN (FIGO)</tspan></text><text x="349.0" y="623.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="593"><tspan x="349.0" dy="0">Causas del sangrado uterino anormal en edad reproductiva.</tspan></text><rect x="56.0" y="663.5" width="168.0" height="149.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="664.1" width="166.8" height="82.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="140.0" y="691.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="152"><tspan x="140.0" dy="0">P</tspan></text><text x="140.0" y="711.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="144"><tspan x="140.0" dy="0">Pólipo</tspan></text><circle cx="72.0" cy="755.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="759.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="82.0" dy="0">Engrosamiento focal</tspan></text><rect x="236.0" y="663.5" width="168.0" height="149.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="236.6" y="664.1" width="166.8" height="82.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="320.0" y="691.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="152"><tspan x="320.0" dy="0">A</tspan></text><text x="320.0" y="711.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="144"><tspan x="320.0" dy="0">Adenomiosis</tspan></text><circle cx="252.0" cy="755.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="262.0" y="759.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="262.0" dy="0">Útero globuloso,</tspan><tspan x="262.0" dy="16">doloroso</tspan></text><rect x="416.0" y="663.5" width="168.0" height="149.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="416.6" y="664.1" width="166.8" height="82.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="500.0" y="691.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">L</tspan></text><text x="500.0" y="711.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="144"><tspan x="500.0" dy="0">Leiomioma</tspan></text><circle cx="432.0" cy="755.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="442.0" y="759.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="442.0" dy="0">Miomas</tspan></text><rect x="596.0" y="663.5" width="168.0" height="149.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="596.6" y="664.1" width="166.8" height="82.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="680.0" y="691.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="152"><tspan x="680.0" dy="0">M</tspan></text><text x="680.0" y="711.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="144"><tspan x="680.0" dy="0">Malignidad e</tspan><tspan x="680.0" dy="19">hiperplasia</tspan></text><circle cx="612.0" cy="755.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="622.0" y="759.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="622.0" dy="0">Solo la biopsia la</tspan><tspan x="622.0" dy="16">confirma</tspan></text><rect x="776.0" y="663.5" width="168.0" height="149.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="776.6" y="664.1" width="166.8" height="82.0" rx="9" fill="#f1f5f9" stroke="none" stroke-width="0"/><text x="860.0" y="691.5" font-size="11" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="152"><tspan x="860.0" dy="0">COEIN</tspan></text><text x="860.0" y="711.5" font-size="14" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="144"><tspan x="860.0" dy="0">No estructurales</tspan></text><circle cx="792.0" cy="755.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="802.0" y="759.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="802.0" dy="0">Coagulopatía,</tspan><tspan x="802.0" dy="16">ovulación, endometrio,</tspan><tspan x="802.0" dy="16">iatrogenia</tspan></text><text x="56.0" y="842.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">PARA UBICAR ESTE CASO</tspan></text><rect x="56.0" y="851.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="866.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="866.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Endometrio de 24 mm: sospecha de P o de M</tspan></text><rect x="56.0" y="873.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="888.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="888.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">La biopsia decide entre pólipo, hiperplasia o cáncer</tspan></text><rect x="56.0" y="910.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="933.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Biopsia de endometrio.</tspan></text><text x="40.0" y="1003.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1013.5" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1044.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="1016.5" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="1036.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Biopsia de</tspan><tspan x="285.0" dy="17">endometrio</tspan></text><text x="435.0" y="1044.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hidrosonografía</tspan></text><text x="585.0" y="1044.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Legrado uterino</tspan></text><text x="735.0" y="1044.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Laparotomía</tspan></text><text x="885.0" y="1044.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Histerectomía total</tspan></text><rect x="40.0" y="1067.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1067.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1096.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Conducta?</tspan></text><text x="285.0" y="1088.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: da el diagnóstico</tspan><tspan x="285.0" dy="16">histológico</tspan></text><text x="435.0" y="1088.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Ve pólipos, pero no da</tspan><tspan x="435.0" dy="16">histología</tspan></text><text x="585.0" y="1088.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Más invasivo; ya no de</tspan><tspan x="585.0" dy="16">primera línea</tspan></text><text x="735.0" y="1096.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: excesivo</tspan></text><text x="885.0" y="1096.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: sin diagnóstico</tspan></text><rect x="40.0" y="1013.5" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1141.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1169.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1191.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Biopsia por aspiración (cánula de Pipelle) en consultorio; histeroscopía si se sospecha lesión focal.</tspan><tspan x="58.0" dy="18">• Biopsia también en menores de 45 años con obesidad, anovulación crónica o falla del tratamiento.</tspan><tspan x="58.0" dy="18">• Pedir hemograma y TSH; si es anemia, hierro.</tspan></text><text x="58.0" y="1249.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: FIGO, sistema PALM-COEIN (2018); ACOG, sangrado uterino anormal (2023).</tspan></text></svg>