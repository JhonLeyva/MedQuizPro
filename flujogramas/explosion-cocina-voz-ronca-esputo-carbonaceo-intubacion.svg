<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1112" viewBox="0 0 1000 1112" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Explosión en la cocina con voz ronca, esputo carbonáceo, vellos nasales quemados, edema de orofaringe y dificultad respiratoria: lesión por inhalación, intubación temprana"><title>Explosión en la cocina con voz ronca, esputo carbonáceo, vellos nasales quemados, edema de orofaringe y dificultad respiratoria: lesión por inhalación, intubación temprana</title><rect x="0.75" y="0.75" width="998.5" height="1110.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Quemaduras · lesión por inhalación</tspan></text><rect x="411.2" y="32.0" width="101.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="461.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="85"><tspan x="461.8" dy="0">CIRUGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Lesión inhalatoria</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El calor y el humo queman la vía aérea superior: el edema crece en horas y puede cerrarla.</tspan><tspan x="58.0" dy="17">Signos de alarma: voz ronca, estridor, esputo carbonáceo, quemadura facial, vellos</tspan><tspan x="58.0" dy="17">chamuscados, edema orofaríngeo: intubar temprano.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 37 años, explosión hace 10 h</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Voz ronca, esputo negruzco, dificultad respiratoria.</tspan><tspan x="640.0" dy="16">PA 90/70, FR 34, SatO₂ 92 %; vellos nasales</tspan><tspan x="640.0" dy="16">quemados, edema orofaríngeo con restos</tspan><tspan x="640.0" dy="16">carbonizados.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SIGNOS DE VÍA AÉREA QUEMADA</tspan></text><rect x="40.0" y="301.0" width="310.0" height="480.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="311.0" width="197.1" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="325.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="61.0" dy="0">VÍA AÉREA QUEMADA (ESQUEMA)</tspan></text><g transform="translate(50.0,379.0) scale(0.84)"><path d="M60 20 C120 0 190 20 200 80 C204 110 196 130 184 140 L180 170 L150 176 L150 240 L90 240 L92 160 C60 150 40 120 40 80 C40 50 46 30 60 20 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M184 96 L204 104 L186 112" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M184 122 C170 124 160 120 150 116" fill="none" stroke="#57534e" stroke-width="5" stroke-linejoin="round" /><path d="M150 116 C130 120 116 140 118 176 L120 240" fill="none" stroke="#fda4af" stroke-width="16" stroke-linejoin="round" /><ellipse cx="126" cy="170" rx="14" ry="10" fill="#ea580c" stroke="#9a3412" stroke-width="2" /><ellipse cx="112" cy="170" rx="10" ry="8" fill="#ea580c" stroke="#9a3412" stroke-width="2" opacity="0.8"/><path d="M206 100 C160 108 130 130 122 180 L122 240" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="160" cy="118" r="2.2" fill="#1f2937" stroke="none" stroke-width="0" /><circle cx="168" cy="114" r="2.2" fill="#1f2937" stroke="none" stroke-width="0" /><circle cx="176" cy="118" r="2.2" fill="#1f2937" stroke="none" stroke-width="0" /><circle cx="184" cy="114" r="2.2" fill="#1f2937" stroke="none" stroke-width="0" /><ellipse cx="160" cy="60" rx="14" ry="8" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.5" /><ellipse cx="90" cy="70" rx="12" ry="8" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.5" /><text x="230" y="60" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Quemadura facial</text><text x="230" y="60" font-size="10.5" font-weight="800" fill="#0f172a" text-anchor="start" data-max="0">Quemadura facial</text><line x1="228" y1="56" x2="172" y2="60" stroke="#334155" stroke-width="1.3"/><circle cx="172" cy="60" r="2.6" fill="#334155"/><text x="230" y="120" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Hollín en la boca</text><text x="230" y="120" font-size="10.5" font-weight="800" fill="#0f172a" text-anchor="start" data-max="0">Hollín en la boca</text><line x1="228" y1="116" x2="186" y2="118" stroke="#334155" stroke-width="1.3"/><circle cx="186" cy="118" r="2.6" fill="#334155"/><text x="230" y="170" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Edema de la laringe:</text><text x="230" y="170" font-size="10.5" font-weight="800" fill="#9a3412" text-anchor="start" data-max="0">Edema de la laringe:</text><text x="230" y="184" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">cierra la vía aérea</text><text x="230" y="184" font-size="10.5" font-weight="800" fill="#9a3412" text-anchor="start" data-max="0">cierra la vía aérea</text><line x1="228" y1="172" x2="140" y2="170" stroke="#9a3412" stroke-width="1.3"/><circle cx="140" cy="170" r="2.6" fill="#9a3412"/><text x="230" y="216" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Tubo endotraqueal</text><text x="230" y="216" font-size="10.5" font-weight="800" fill="#0369a1" text-anchor="start" data-max="0">Tubo endotraqueal</text><line x1="228" y1="212" x2="124" y2="212" stroke="#0369a1" stroke-width="1.3"/><circle cx="124" cy="212" r="2.6" fill="#0369a1"/></g><text x="195.0" y="769.0" font-size="11" font-weight="600" font-style="normal" fill="#475569" text-anchor="middle" data-max="280"><tspan x="195.0" dy="0">Hollín y edema en la vía aérea superior.</tspan></text><rect x="368.0" y="301.0" width="592.0" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="388.0" cy="323.0" r="12" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="327.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">1</tspan></text><text x="408.0" y="327.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Voz ronca</tspan></text><text x="408.0" y="348.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Edema de la laringe.</tspan></text><rect x="368.0" y="375.0" width="592.0" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="388.0" cy="397.0" r="12" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="401.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">2</tspan></text><text x="408.0" y="401.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Esputo carbonáceo</tspan></text><text x="408.0" y="422.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Inhaló humo y hollín.</tspan></text><rect x="368.0" y="449.0" width="592.0" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="388.0" cy="471.0" r="12" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="475.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">3</tspan></text><text x="408.0" y="475.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Vellos nasales quemados</tspan></text><text x="408.0" y="496.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Calor en la cara y la vía aérea.</tspan></text><rect x="368.0" y="523.0" width="592.0" height="64.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><circle cx="388.0" cy="545.0" r="12" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="549.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">4</tspan></text><text x="408.0" y="549.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Edema orofaríngeo y FR 34</tspan></text><text x="408.0" y="570.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">La vía se está cerrando.</tspan></text><rect x="368.0" y="597.0" width="592.0" height="64.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><circle cx="388.0" cy="619.0" r="12" fill="#ea580c" stroke="none" stroke-width="0"/><text x="388.0" y="623.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="388.0" dy="0">5</tspan></text><text x="408.0" y="623.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Intubación endotraqueal ya</tspan></text><text x="408.0" y="644.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="548"><tspan x="408.0" dy="0">Antes de que el edema la impida; oxígeno al 100 %.</tspan></text><rect x="851.4" y="586.0" width="77.1" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="601.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ INTUBAR</tspan></text><text x="40.0" y="825.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="835.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="866.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="838.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="857.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Intubación</tspan><tspan x="285.0" dy="17">endotraqueal</tspan></text><text x="435.0" y="857.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Oxigeno húmedo</tspan><tspan x="435.0" dy="17">con mascarilla</tspan></text><text x="585.0" y="857.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Corticoides</tspan><tspan x="585.0" dy="17">endovenosos</tspan></text><text x="735.0" y="857.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Monitorizar</tspan><tspan x="735.0" dy="17">funciones vitales</tspan></text><text x="885.0" y="857.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Antibióticos</tspan><tspan x="885.0" dy="17">profilácticos</tspan></text><rect x="40.0" y="889.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="889.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="918.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Prioridad?</tspan></text><text x="285.0" y="910.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: asegurar la vía</tspan><tspan x="285.0" dy="16">aérea</tspan></text><text x="435.0" y="910.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Insuficiente: el edema</tspan><tspan x="435.0" dy="16">cerrará la vía</tspan></text><text x="585.0" y="918.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: sin beneficio</tspan></text><text x="735.0" y="910.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Necesario, pero no</tspan><tspan x="735.0" dy="16">basta</tspan></text><text x="885.0" y="918.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: sin indicación</tspan></text><rect x="40.0" y="835.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="963.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="991.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1013.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Intubación con tubo grueso por el más experto, antes de que el edema la impida.</tspan><tspan x="58.0" dy="18">• Oxígeno al 100 % (monóxido de carbono); sospechar cianuro (hidroxocobalamina).</tspan><tspan x="58.0" dy="18">• Broncoscopía para graduar; líquidos según la superficie quemada.</tspan></text><text x="58.0" y="1071.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ABA, guías de lesión inhalatoria; ATLS 11.ª ed. (2025) (2025).</tspan></text></svg>