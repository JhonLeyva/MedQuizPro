<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="844" viewBox="0 0 1000 844" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Tratamiento de la hiperpotasemia"><title>Tratamiento de la hiperpotasemia</title><rect x="0.75" y="0.75" width="998.5" height="842.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">NEFROLOGÍA ENAM: ESTABILIZAR EL MIOCARDIO</tspan></text><rect x="505.3" y="32.0" width="93.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="551.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="77"><tspan x="551.9" dy="0">NEFROLOGÍA</tspan></text><rect x="40.0" y="90.0" width="560.0" height="136.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hiperpotasemia con cambios en el ECG</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Primero proteger el corazón con calcio EV</tspan><tspan x="58.0" dy="17">Luego meter potasio a las células y finalmente eliminarlo</tspan></text><rect x="620.0" y="90.0" width="340.0" height="136.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="134.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 60 años con falla cardiaca, diabetes e</tspan><tspan x="640.0" dy="17">IRA</tspan></text><text x="640.0" y="176.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">ECG: T picudas, PR largo, QRS ancho</tspan></text><rect x="640.0" y="197.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="210.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="210.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="258.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ORDEN DEL TRATAMIENTO</tspan></text><rect x="42.0" y="270.0" width="226.0" height="216.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="155.0" y="288.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="210"><tspan x="155.0" dy="0">ESTABILIZAR</tspan></text><text x="155.0" y="478.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="155.0" dy="0">Minutos</tspan></text><rect x="272.0" y="270.0" width="226.0" height="216.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="385.0" y="288.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="385.0" dy="0">REDISTRIBUIR</tspan></text><text x="385.0" y="478.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="385.0" dy="0">15-30 min</tspan></text><rect x="502.0" y="270.0" width="226.0" height="216.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="288.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="615.0" dy="0">ELIMINAR</tspan></text><text x="615.0" y="478.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="615.0" dy="0">Horas</tspan></text><rect x="732.0" y="270.0" width="226.0" height="216.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="845.0" y="288.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="210"><tspan x="845.0" dy="0">PREVENIR</tspan></text><text x="845.0" y="478.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="210"><tspan x="845.0" dy="0">Después</tspan></text><path d="M 60.0,363.1 L 206.7,363.1 L 353.3,383.5 L 500.0,403.9 L 646.7,419.2 L 793.3,429.4 L 940.0,429.4" fill="none" stroke="#e11d48" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="58.0" y1="310.0" x2="80.0" y2="310.0" stroke="#e11d48" stroke-width="3"/><text x="86.0" y="314.0" font-size="10.5" font-weight="700" font-style="normal" fill="#e11d48" text-anchor="start" data-max="200"><tspan x="86.0" dy="0">Potasio</tspan></text><line x1="155.0" y1="272.0" x2="155.0" y2="462.0" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/><rect x="109.6" y="445.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="155.0" y="460.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="155.0" dy="0">◆ ESTE CASO</tspan></text><rect x="48.0" y="500.0" width="214.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="155.0" y="528.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="186"><tspan x="155.0" dy="0">GLUCONATO DE CALCIO</tspan></text><text x="155.0" y="552.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="186"><tspan x="155.0" dy="0">10 % 10 ml EV en 5-10 min</tspan><tspan x="155.0" dy="17">Repetir si sigue el ECG</tspan></text><rect x="278.0" y="500.0" width="214.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="385.0" y="537.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="385.0" dy="0">Insulina + glucosa</tspan></text><text x="385.0" y="561.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="385.0" dy="0">Salbutamol nebulizado</tspan></text><rect x="508.0" y="500.0" width="214.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="615.0" y="537.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="615.0" dy="0">Diurético, resinas</tspan></text><text x="615.0" y="561.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="615.0" dy="0">Diálisis si falla renal</tspan></text><rect x="738.0" y="500.0" width="214.0" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="845.0" y="537.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="845.0" dy="0">Revisar fármacos</tspan></text><text x="845.0" y="561.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="186"><tspan x="845.0" dy="0">IECA, espironolactona</tspan></text><text x="40.0" y="629.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ESTABILIZA EL MIOCARDIO · MARCADO</tspan></text><rect x="40.0" y="641.2" width="146.9" height="30.0" rx="15" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="113.5" y="660.7" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="113.5" dy="0">✓ Gluconato de calcio</tspan></text><rect x="194.9" y="641.2" width="74.5" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="232.1" y="660.7" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="232.1" dy="0">Resinas</tspan></text><rect x="277.4" y="641.2" width="95.0" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="324.8" y="660.7" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="324.8" dy="0">Furosemida</tspan></text><rect x="380.3" y="641.2" width="109.3" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="435.0" y="660.7" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="435.0" dy="0">Hidrocortisona</tspan></text><rect x="40.0" y="695.2" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="723.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="745.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El calcio no baja el potasio: solo protege el corazón por 30-60 min.</tspan><tspan x="58.0" dy="18">• Controlar glucosa tras la insulina.</tspan><tspan x="58.0" dy="18">• Con digoxina, dar el calcio con más cuidado.</tspan></text><text x="58.0" y="803.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: UK Kidney Association – Clinical practice guideline: hyperkalaemia (2023)</tspan></text></svg>