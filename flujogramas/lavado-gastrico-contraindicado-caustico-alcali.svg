font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Contraindicado</tspan></text><text x="500.0" y="606.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Aspiración</tspan></text><rect x="662.7" y="555.5" width="297.3" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="583.8" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Valorar</tspan></text><text x="811.3" y="606.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Primera hora, vía aérea</tspan></text><text x="40.0" y="672.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ANTE UN CÁUSTICO</tspan></text><rect x="40.0" y="682.9" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="705.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="685.9" width="369.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="397.5" y="705.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="355"><tspan x="397.5" dy="0">Hacer</tspan></text><text x="772.5" y="705.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="355"><tspan x="772.5" dy="0">Evitar</tspan></text><rect x="40.0" y="719.9" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="719.9" width="369.0" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="740.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Primero</tspan></text><text x="397.5" y="740.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="353"><tspan x="397.5" dy="0">Vía aérea</tspan></text><text x="772.5" y="740.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="353"><tspan x="772.5" dy="0">Inducir vómito</tspan></text><rect x="40.0" y="753.9" width="920.0" height="34.0" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="753.9" width="369.0" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="774.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Luego</tspan></text><text x="397.5" y="774.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="353"><tspan x="397.5" dy="0">Endoscopía 12-48 h</tspan></text><text x="772.5" y="774.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="353"><tspan x="772.5" dy="0">Carbón activado</tspan></text><rect x="40.0" y="682.9" width="920.0" height="105.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="811.9" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="839.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="861.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Aspirina, diazepam, barbitúricos: no lo contraindican.</tspan><tspan x="58.0" dy="18">• Álcalis: necrosis por licuefacción.</tspan><tspan x="58.0" dy="18">• No neutralizar el cáustico.</tspan></text><text x="58.0" y="919.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Goldfrank's Toxicologic Emergencies 11.ª ed. (2019)</tspan></text></svg>