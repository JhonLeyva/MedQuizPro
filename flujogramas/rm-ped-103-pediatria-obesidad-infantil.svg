<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1124" viewBox="0 0 1000 1124" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El niño con obesidad exógena tiene la talla para la edad aumentada respecto de un niño con peso adecuado"><title>El niño con obesidad exógena tiene la talla para la edad aumentada respecto de un niño con peso adecuado</title><rect x="0.75" y="0.75" width="998.5" height="1122.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · obesidad infantil</tspan></text><rect x="362.7" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="411.7" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="411.7" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="131.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Obesidad exógena infantil</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El exceso de energía, insulina, leptina y estrógenos del tejido graso acelera el crecimiento</tspan><tspan x="58.0" dy="17">lineal.</tspan><tspan x="58.0" dy="17">La maduración ósea se adelanta.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="131.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="129.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Comparación con niños de peso adecuado</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué presentan los niños obesos?</tspan></text><rect x="640.0" y="192.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="205.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="205.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="253.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">NIÑO DE PESO ADECUADO FRENTE A NIÑO CON OBESIDAD EXÓGENA</tspan></text><rect x="40.0" y="265.0" width="385.0" height="180.0" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="232.5" y="291.0" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="365"><tspan x="232.5" dy="0">PESO ADECUADO</tspan></text><text x="56.0" y="321.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Talla para la edad</tspan></text><text x="409.0" y="321.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">Normal</tspan></text><line x1="52.0" y1="329.0" x2="413.0" y2="329.0" stroke="#ffffff" stroke-width="1.4"/><text x="56.0" y="347.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Edad ósea</tspan></text><text x="409.0" y="347.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">Acorde con la edad</tspan></text><line x1="52.0" y1="355.0" x2="413.0" y2="355.0" stroke="#ffffff" stroke-width="1.4"/><text x="56.0" y="373.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Pubertad</tspan></text><text x="409.0" y="373.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">Normal</tspan></text><line x1="52.0" y1="381.0" x2="413.0" y2="381.0" stroke="#ffffff" stroke-width="1.4"/><text x="56.0" y="399.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">IMC</tspan></text><text x="409.0" y="399.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">Percentil 5 a 85</tspan></text><line x1="52.0" y1="407.0" x2="413.0" y2="407.0" stroke="#ffffff" stroke-width="1.4"/><text x="56.0" y="425.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="56.0" dy="0">Masa muscular</tspan></text><text x="409.0" y="425.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="409.0" dy="0">Normal</tspan></text><line x1="52.0" y1="433.0" x2="413.0" y2="433.0" stroke="#ffffff" stroke-width="1.4"/><rect x="575.0" y="265.0" width="385.0" height="180.0" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="767.5" y="291.0" font-size="13" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="365"><tspan x="767.5" dy="0">OBESIDAD EXÓGENA</tspan></text><text x="591.0" y="321.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Talla para la edad</tspan></text><text x="944.0" y="321.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">Aumentada</tspan></text><line x1="587.0" y1="329.0" x2="948.0" y2="329.0" stroke="#ffffff" stroke-width="1.4"/><text x="591.0" y="347.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Edad ósea</tspan></text><text x="944.0" y="347.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">Adelantada</tspan></text><line x1="587.0" y1="355.0" x2="948.0" y2="355.0" stroke="#ffffff" stroke-width="1.4"/><text x="591.0" y="373.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Pubertad</tspan></text><text x="944.0" y="373.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">Algo precoz en la niña</tspan></text><line x1="587.0" y1="381.0" x2="948.0" y2="381.0" stroke="#ffffff" stroke-width="1.4"/><text x="591.0" y="399.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">IMC</tspan></text><text x="944.0" y="399.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">Mayor del percentil 95</tspan></text><line x1="587.0" y1="407.0" x2="948.0" y2="407.0" stroke="#ffffff" stroke-width="1.4"/><text x="591.0" y="425.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="192"><tspan x="591.0" dy="0">Masa muscular</tspan></text><text x="944.0" y="425.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="end" data-max="173"><tspan x="944.0" dy="0">Conservada</tspan></text><line x1="587.0" y1="433.0" x2="948.0" y2="433.0" stroke="#ffffff" stroke-width="1.4"/><rect x="434.0" y="311.0" width="132.0" height="88.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="337.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="118"><tspan x="500.0" dy="0">Exceso de energía,</tspan><tspan x="500.0" dy="16">insulina, leptina y</tspan><tspan x="500.0" dy="16">estrógenos</tspan></text><line x1="429.0" y1="419.0" x2="562.0" y2="419.0" stroke="#0f766e" stroke-width="3"/><polygon points="562.0,424.0 562.0,414.0 571.0,419.0" fill="#0f766e"/><rect x="40.0" y="461.0" width="300.0" height="33.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="56.0" y="482.5" font-size="14" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="56.0" dy="0">▲</tspan></text><text x="72.0" y="479.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="260"><tspan x="72.0" dy="0">Talla para la edad aumentada</tspan></text><rect x="350.0" y="461.0" width="300.0" height="33.0" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/><text x="366.0" y="482.5" font-size="14" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="366.0" dy="0">▲</tspan></text><text x="382.0" y="479.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="260"><tspan x="382.0" dy="0">Edad ósea adelantada</tspan></text><rect x="660.0" y="461.0" width="300.0" height="33.0" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="676.0" y="482.5" font-size="14" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="0"><tspan x="676.0" dy="0">=</tspan></text><text x="692.0" y="479.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="260"><tspan x="692.0" dy="0">Masa muscular conservada, no disminuida</tspan></text><rect x="40.0" y="512.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="538.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Obesidad exógena = talla aumentada</tspan></text><text x="60.0" y="557.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Talla baja con obesidad sugiere causa endocrina o genética.</tspan></text><text x="40.0" y="618.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OBESIDAD EXÓGENA FRENTE A OBESIDAD ENDOCRINA O GENÉTICA</tspan></text><rect x="40.0" y="630.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="649.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Rasgo</tspan></text><text x="200.0" y="649.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="369"><tspan x="200.0" dy="0">Obesidad exógena</tspan></text><text x="585.0" y="649.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="369"><tspan x="585.0" dy="0">Endocrina o genética</tspan></text><rect x="40.0" y="659.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="678.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Talla</tspan></text><text x="200.0" y="678.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="200.0" dy="0">Aumentada</tspan></text><text x="585.0" y="678.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="585.0" dy="0">Baja o crecimiento detenido</tspan></text><rect x="90.6" y="662.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="136.0" y="677.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="136.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="688.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="707.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Edad ósea</tspan></text><text x="200.0" y="707.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="200.0" dy="0">Adelantada</tspan></text><text x="585.0" y="707.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="585.0" dy="0">Retrasada</tspan></text><rect x="40.0" y="717.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="736.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="134"><tspan x="50.0" dy="0">Causas</tspan></text><text x="200.0" y="736.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="200.0" dy="0">Exceso de energía</tspan></text><text x="585.0" y="736.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="369"><tspan x="585.0" dy="0">Hipotiroidismo, Cushing, déficit de GH, Prader-Willi</tspan></text><text x="40.0" y="786.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="796.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="827.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="799.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="818.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Talla/edad</tspan><tspan x="285.0" dy="17">aumentada</tspan></text><text x="435.0" y="827.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Micropene</tspan></text><text x="585.0" y="827.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">IMC entre 18 y 23</tspan></text><text x="735.0" y="818.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Retraso de</tspan><tspan x="735.0" dy="17">crecimiento lineal</tspan></text><text x="885.0" y="818.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Masa muscular</tspan><tspan x="885.0" dy="17">disminuida</tspan></text><rect x="40.0" y="850.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="850.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="871.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué presentan los</tspan><tspan x="54.0" dy="16">niños obesos?</tspan></text><text x="285.0" y="871.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: crecimiento lineal</tspan><tspan x="285.0" dy="16">acelerado</tspan></text><text x="435.0" y="871.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: es aparente por el</tspan><tspan x="435.0" dy="16">panículo adiposo</tspan></text><text x="585.0" y="871.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: el IMC del obeso</tspan><tspan x="585.0" dy="16">supera el percentil 95</tspan></text><text x="735.0" y="871.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: sugiere causa</tspan><tspan x="735.0" dy="16">endocrina</tspan></text><text x="885.0" y="871.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: suele estar</tspan><tspan x="885.0" dy="16">conservada</tspan></text><rect x="40.0" y="796.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="924.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="952.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="974.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Talla mayor para la edad, edad ósea adelantada y pubertad algo precoz en la niña; el IMC supera el percentil 95 para edad y sexo (AAP 2023).</tspan><tspan x="58.0" dy="18">• Obesidad con talla baja o crecimiento detenido: descartar hipotiroidismo, Cushing, déficit de hormona de crecimiento o Prader-Willi.</tspan><tspan x="58.0" dy="18">• El micropene es aparente por el panículo suprapúbico; la masa muscular suele estar conservada. Complicaciones: resistencia a la insulina, esteatosis</tspan><tspan x="58.0" dy="18">   hepática, apnea del sueño, hipertensión y epifisiólisis.</tspan><tspan x="58.0" dy="18">• Alerta: el retraso del crecimiento lineal en un niño obeso sugiere causa endocrina.</tspan></text><text x="58.0" y="1068.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Hampl SE et al., Guía de práctica clínica de la AAP para la evaluación y el tratamiento de niños y adolescentes con obesidad, Pediatrics 2023; Nelson Tratado de</tspan><tspan x="58.0" dy="15">Pediatría 22.ª ed. (2024).</tspan></text></svg>