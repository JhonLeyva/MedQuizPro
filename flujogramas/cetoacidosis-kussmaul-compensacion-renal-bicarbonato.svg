<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1065" viewBox="0 0 1000 1065" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="En la cetoacidosis diabética el riñón compensa reabsorbiendo todo el bicarbonato (disminuye su excreción) y eliminando más ácido como amonio"><title>En la cetoacidosis diabética el riñón compensa reabsorbiendo todo el bicarbonato (disminuye su excreción) y eliminando más ácido como amonio</title><rect x="0.75" y="0.75" width="998.5" height="1063.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Equilibrio ácido-base · cetoacidosis</tspan></text><rect x="411.9" y="32.0" width="155.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="489.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="139"><tspan x="489.6" dy="0">ENDOCRINOLOGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Compensación de la acidosis metabólica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Pulmón (minutos): hiperventila (Kussmaul) y baja la PaCO₂.</tspan><tspan x="58.0" dy="17">Riñón (horas-días): reabsorbe todo el HCO₃⁻ filtrado, fabrica bicarbonato nuevo y excreta</tspan><tspan x="58.0" dy="17">más H⁺ como amonio (NH₄⁺) y acidez titulable.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Diabético de 65 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Trastorno de conciencia y respiración de Kussmaul;</tspan><tspan x="640.0" dy="16">glucosa 400.</tspan><tspan x="640.0" dy="16">pH 7,23, PaCO₂ 30, HCO₃⁻ 18; betahidroxibutirato en</tspan><tspan x="640.0" dy="16">orina.</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO COMPENSA EL CUERPO LA CETOACIDOSIS</tspan></text><text x="40.0" y="313.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="430"><tspan x="40.0" dy="0">QUÉ PASA</tspan></text><text x="516.0" y="313.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="444"><tspan x="516.0" dy="0">QUÉ SE VE</tspan></text><rect x="40.0" y="323.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="352.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="357.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><text x="84.0" y="349.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Cetoácidos en la sangre</tspan></text><text x="84.0" y="366.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Consumen bicarbonato</tspan></text><line x1="476.0" y1="352.5" x2="503.0" y2="352.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,347.5 502.0,357.5 510.0,352.5" fill="#ea580c"/><rect x="516.0" y="325.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="349.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">HCO₃⁻ 18, pH 7,23</tspan></text><text x="530.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Acidosis metabólica</tspan></text><line x1="255.0" y1="384.0" x2="255.0" y2="397.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,396.0 260.0,396.0 255.0,404.0" fill="#0f766e"/><rect x="40.0" y="406.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="435.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="440.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">2</tspan></text><text x="84.0" y="432.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Pulmón: hiperventila</tspan></text><text x="84.0" y="449.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Elimina más CO₂ (minutos)</tspan></text><line x1="476.0" y1="435.5" x2="503.0" y2="435.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,430.5 502.0,440.5 510.0,435.5" fill="#ea580c"/><rect x="516.0" y="408.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="432.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Respiración de Kussmaul</tspan></text><text x="530.0" y="449.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">PaCO₂ 30</tspan></text><line x1="255.0" y1="467.0" x2="255.0" y2="480.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,479.0 260.0,479.0 255.0,487.0" fill="#0f766e"/><rect x="40.0" y="489.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="518.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="523.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">3</tspan></text><text x="84.0" y="515.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Riñón: guarda bicarbonato</tspan></text><text x="84.0" y="532.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Reabsorbe todo el HCO₃⁻ filtrado</tspan></text><line x1="476.0" y1="518.5" x2="503.0" y2="518.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,513.5 502.0,523.5 510.0,518.5" fill="#ea580c"/><rect x="516.0" y="491.0" width="444.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="530.0" y="515.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Menos HCO₃⁻ en la orina</tspan></text><text x="530.0" y="532.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Esta pregunta</tspan></text><line x1="255.0" y1="550.0" x2="255.0" y2="563.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,562.0 260.0,562.0 255.0,570.0" fill="#0f766e"/><rect x="40.0" y="572.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="601.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="606.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">4</tspan></text><text x="84.0" y="598.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Riñón: elimina ácido</tspan></text><text x="84.0" y="615.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Más amonio (NH₄⁺) y acidez titulable</tspan></text><line x1="476.0" y1="601.5" x2="503.0" y2="601.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,596.5 502.0,606.5 510.0,601.5" fill="#ea580c"/><rect x="516.0" y="574.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="598.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Orina ácida</tspan></text><text x="530.0" y="615.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Más amonio urinario</tspan></text><rect x="40.0" y="649.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="675.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Disminuye la excreción renal de bicarbonato</tspan></text><text x="60.0" y="694.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Y aumenta la de amonio; el pulmón baja la PaCO₂.</tspan></text><text x="40.0" y="761.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="771.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="810.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="774.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="793.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Menos excreción</tspan><tspan x="285.0" dy="17">renal de</tspan><tspan x="285.0" dy="17">bicarbonato</tspan></text><text x="435.0" y="802.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Menos excreción de</tspan><tspan x="435.0" dy="17">amonio en orina</tspan></text><text x="585.0" y="793.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Más excreción</tspan><tspan x="585.0" dy="17">pulmonar de</tspan><tspan x="585.0" dy="17">amonio</tspan></text><text x="735.0" y="802.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Menos eliminación</tspan><tspan x="735.0" dy="17">pulmonar de CO₂</tspan></text><text x="885.0" y="802.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Más excreción renal</tspan><tspan x="885.0" dy="17">de bicarbonato</tspan></text><rect x="40.0" y="842.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="842.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="871.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Cambio esperado?</tspan></text><text x="285.0" y="863.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: el riñón guarda</tspan><tspan x="285.0" dy="16">bicarbonato</tspan></text><text x="435.0" y="863.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: la excreción de</tspan><tspan x="435.0" dy="16">amonio AUMENTA</tspan></text><text x="585.0" y="863.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: el pulmón no</tspan><tspan x="585.0" dy="16">excreta amonio</tspan></text><text x="735.0" y="863.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: elimina MÁS CO₂</tspan><tspan x="735.0" dy="16">(hiperventila)</tspan></text><text x="885.0" y="871.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: lo contrario</tspan></text><rect x="40.0" y="771.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="916.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="944.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="966.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Tratamiento: suero fisiológico, insulina en infusión (tras K ≥ 3,3), potasio, buscar el desencadenante.</tspan><tspan x="58.0" dy="18">• Bicarbonato EV solo si el pH &lt; 6,9-7,0.</tspan><tspan x="58.0" dy="18">• Brecha aniónica alta por cetoácidos.</tspan></text><text x="58.0" y="1024.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ADA/EASD/JBDS/AACE/DTS, consenso de crisis hiperglucémicas (2024); Guyton y Hall, Tratado de fisiología médica 14.ª ed.</tspan></text></svg>