<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1016" viewBox="0 0 1000 1016" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Mujer agredida sexualmente hace 3 horas: la profilaxis antibiótica específica cubre Chlamydia y gonorrea (más tricomonas)"><title>Mujer agredida sexualmente hace 3 horas: la profilaxis antibiótica específica cubre Chlamydia y gonorrea (más tricomonas)</title><rect x="0.75" y="0.75" width="998.5" height="1014.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Violencia sexual · kit de emergencia</tspan></text><rect x="412.4" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="499.6" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="499.6" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="148.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Kit de atención de la violencia sexual</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cada medida tiene su ventana de tiempo: antirretrovirales en &lt; 72 h, anticoncepción en &lt;</tspan><tspan x="58.0" dy="17">120 h.</tspan><tspan x="58.0" dy="17">Los antibióticos cubren las ITS bacterianas más frecuentes: gonorrea y Chlamydia (y</tspan><tspan x="58.0" dy="17">tricomonas en la mujer).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="148.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="146.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 18 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Agresión sexual por desconocidos hace 3 horas.</tspan><tspan x="640.0" dy="16">¿Contra qué se da profilaxis antibiótica?</tspan></text><rect x="640.0" y="209.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="222.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="222.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="270.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ SE DA Y EN QUÉ VENTANA DE TIEMPO</tspan></text><text x="44.0" y="296.0" font-size="12" font-weight="700" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Ella llegó a las 3 horas: está a tiempo de todo.</tspan></text><line x1="216.3" y1="335.0" x2="477.0" y2="335.0" stroke="#99f6e4" stroke-width="6"/><line x1="523.0" y1="335.0" x2="783.7" y2="335.0" stroke="#99f6e4" stroke-width="6"/><circle cx="193.3" cy="335.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="193.3" y="339.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="193.3" dy="0">0 h</tspan></text><rect x="45.0" y="369.0" width="296.7" height="59.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="193.3" y="389.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="285"><tspan x="193.3" dy="0">Atender y contener</tspan></text><text x="193.3" y="406.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="285"><tspan x="193.3" dy="0">Lesiones y examen con consentimiento</tspan></text><circle cx="500.0" cy="335.0" r="22" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><text x="500.0" y="339.5" font-size="9.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="38"><tspan x="500.0" dy="0">Día 0</tspan></text><rect x="351.7" y="369.0" width="296.7" height="59.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="500.0" y="389.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="285"><tspan x="500.0" dy="0">Antibióticos</tspan></text><text x="500.0" y="406.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="285"><tspan x="500.0" dy="0">Ceftriaxona + doxiciclina (+ metronidazol)</tspan></text><rect x="440.7" y="417.0" width="118.6" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="500.0" y="432.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">◆ ESTA PREGUNTA</tspan></text><circle cx="806.7" cy="335.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="806.7" y="339.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="806.7" dy="0">&lt; 72 h</tspan></text><rect x="658.3" y="369.0" width="296.7" height="59.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="806.7" y="389.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="285"><tspan x="806.7" dy="0">Profilaxis de VIH</tspan></text><text x="806.7" y="406.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="285"><tspan x="806.7" dy="0">Antirretrovirales por 28 días</tspan></text><line x1="216.3" y1="476.0" x2="477.0" y2="476.0" stroke="#99f6e4" stroke-width="6"/><line x1="523.0" y1="476.0" x2="783.7" y2="476.0" stroke="#99f6e4" stroke-width="6"/><circle cx="193.3" cy="476.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="193.3" y="480.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="193.3" dy="0">&lt; 120 h</tspan></text><rect x="45.0" y="510.0" width="296.7" height="59.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="193.3" y="530.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="285"><tspan x="193.3" dy="0">Anticoncepción</tspan></text><text x="193.3" y="547.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="285"><tspan x="193.3" dy="0">Levonorgestrel 1,5 mg</tspan></text><circle cx="500.0" cy="476.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="480.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="500.0" dy="0">Día 0</tspan></text><rect x="351.7" y="510.0" width="296.7" height="59.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="530.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="285"><tspan x="500.0" dy="0">Hepatitis B</tspan></text><text x="500.0" y="547.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="285"><tspan x="500.0" dy="0">Vacuna (± inmunoglobulina)</tspan></text><circle cx="806.7" cy="476.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="806.7" y="480.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="806.7" dy="0">3 m</tspan></text><rect x="658.3" y="510.0" width="296.7" height="59.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="806.7" y="530.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="285"><tspan x="806.7" dy="0">Controles</tspan></text><text x="806.7" y="547.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="285"><tspan x="806.7" dy="0">6 sem y 3 meses: VIH, sífilis, hepatitis B y C</tspan></text><rect x="40.0" y="601.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="627.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Profilaxis antibiótica = gonorrea + Chlamydia</tspan></text><text x="60.0" y="646.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Ceftriaxona IM + doxiciclina; en la mujer se añade metronidazol para tricomonas.</tspan></text><text x="40.0" y="713.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="723.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="754.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="754.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Gonorrea y sífilis</tspan></text><text x="435.0" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Vaginosis</tspan><tspan x="435.0" dy="17">bacteriana y sífilis</tspan></text><rect x="513.0" y="726.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Chlamydia y</tspan><tspan x="585.0" dy="17">gonorrea</tspan></text><text x="735.0" y="745.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Tricomoniasis y</tspan><tspan x="735.0" dy="17">gonorrea</tspan></text><text x="885.0" y="754.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">VIH y hepatitis C</tspan></text><rect x="40.0" y="777.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="777.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="814.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Profilaxis antibiótica?</tspan></text><text x="285.0" y="806.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: sífilis no es la de</tspan><tspan x="285.0" dy="16">rutina</tspan></text><text x="435.0" y="806.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no son las</tspan><tspan x="435.0" dy="16">prioritarias</tspan></text><text x="585.0" y="806.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: las bacterianas más</tspan><tspan x="585.0" dy="16">comunes</tspan></text><text x="735.0" y="814.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: falta Chlamydia</tspan></text><text x="885.0" y="798.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: VIH es</tspan><tspan x="885.0" dy="16">antirretroviral; VHC sin</tspan><tspan x="885.0" dy="16">profilaxis</tspan></text><rect x="40.0" y="723.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="867.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="895.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="917.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Ceftriaxona 500 mg IM dosis única + doxiciclina 100 mg c/12 h 7 días (o azitromicina 1 g) + metronidazol 500 mg c/12 h 7 días.</tspan><tspan x="58.0" dy="18">• Profilaxis de VIH (28 días) si llega en &lt; 72 h; vacuna de hepatitis B; anticoncepción de emergencia.</tspan><tspan x="58.0" dy="18">• Sífilis y hepatitis C: no hay profilaxis de rutina; se controlan con serologías a las 6 semanas y 3 meses.</tspan></text><text x="58.0" y="975.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: CDC, guías de ITS (2021); OMS, atención de la violencia sexual (2024); MINSA Perú, NT de atención a víctimas de violencia sexual.</tspan></text></svg>