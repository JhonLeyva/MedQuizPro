<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1281" viewBox="0 0 1000 1281" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Las células basales son indiferenciadas y funcionan como células madre del epitelio respiratorio"><title>Las células basales son indiferenciadas y funcionan como células madre del epitelio respiratorio</title><rect x="0.75" y="0.75" width="998.5" height="1279.7" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Histología · epitelio respiratorio</tspan></text><rect x="387.3" y="32.0" width="143.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="459.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="128"><tspan x="459.2" dy="0">CIENCIAS BÁSICAS RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Epitelio traqueobronquial</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Seudoestratificado cilíndrico ciliado con células caliciformes.</tspan><tspan x="58.0" dy="17">Todas las células se apoyan sobre la membrana basal.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de histología</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué células del epitelio respiratorio son</tspan><tspan x="640.0" dy="16">indiferenciadas y actúan como células madre?</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÉLULAS DEL EPITELIO RESPIRATORIO Y SU FUNCIÓN</tspan></text><line x1="406.0" y1="416.7" x2="340.0" y2="418.2" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="418.2" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="421.1" y1="465.7" x2="340.0" y2="518.2" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="518.2" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="386.5" x2="660.0" y2="364.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="364.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="442.6" x2="660.0" y2="464.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="464.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="420.3" y1="364.8" x2="340.0" y2="314.6" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="314.6" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="414.6" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="414.6" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="410.1" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">EPITELIO</tspan><tspan x="500.0" dy="19">RESPIRATORIO</tspan></text><text x="500.0" y="448.1" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">tráquea y bronquios</tspan></text><rect x="40.0" y="269.0" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="297.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">BASALES</tspan></text><text x="190.0" y="321.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Indiferenciadas: células madre que reemplazan</tspan><tspan x="190.0" dy="17">a las demás</tspan></text><rect x="144.6" y="350.2" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="365.2" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="376.2" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="377.2" width="6.0" height="82.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="409.9" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">CILIADAS</tspan></text><text x="190.0" y="433.6" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Mayoría: llevan el moco hacia la faringe</tspan></text><rect x="40.0" y="476.2" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="477.2" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="190.0" y="509.9" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">CALICIFORMES</tspan></text><text x="190.0" y="533.6" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Secretan mucinas</tspan></text><rect x="660.0" y="322.6" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="323.6" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="356.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">EN CEPILLO</tspan></text><text x="810.0" y="380.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Microvellosidades; función quimiosensorial</tspan></text><rect x="660.0" y="422.6" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="423.6" width="6.0" height="82.0" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="456.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">SEROSAS</tspan></text><text x="810.0" y="480.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">De las glándulas submucosas</tspan></text><text x="40.0" y="596.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="608.2" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="632.7" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Lesión por humo, virus o</tspan><tspan x="142.2" dy="17">tóxicos</tspan></text><line x1="248.5" y1="637.2" x2="267.5" y2="637.2" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,632.2 266.5,642.2 274.5,637.2" fill="#0f766e"/><rect x="278.5" y="608.2" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="641.2" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Las células basales se dividen</tspan></text><line x1="487.0" y1="637.2" x2="506.0" y2="637.2" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,632.2 505.0,642.2 513.0,637.2" fill="#0f766e"/><rect x="517.0" y="608.2" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="632.7" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Se diferencian en ciliadas,</tspan><tspan x="619.2" dy="17">caliciformes o en cepillo</tspan></text><line x1="725.5" y1="637.2" x2="744.5" y2="637.2" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,632.2 743.5,642.2 751.5,637.2" fill="#0f766e"/><rect x="755.5" y="608.2" width="204.5" height="58.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="641.2" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Se repone el epitelio</tspan></text><text x="40.0" y="700.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÉLULAS DEL EPITELIO DE LA VÍA AÉREA</tspan></text><rect x="40.0" y="712.2" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="731.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Célula</tspan></text><text x="250.0" y="731.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Función</tspan></text><text x="610.0" y="731.2" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Dato clave</tspan></text><rect x="40.0" y="741.2" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="760.2" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Basal</tspan></text><text x="250.0" y="760.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Progenitora: repone las demás células</tspan></text><text x="610.0" y="760.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Hemidesmosomas; hiperplasia con el tabaco</tspan></text><rect x="140.6" y="744.7" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="186.0" y="759.7" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="186.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="770.2" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="789.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Ciliada</tspan></text><text x="250.0" y="789.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Mueve el moco hacia la faringe</tspan></text><text x="610.0" y="789.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Es la más abundante</tspan></text><rect x="40.0" y="799.2" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="818.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Caliciforme</tspan></text><text x="250.0" y="818.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Secreta mucinas</tspan></text><text x="610.0" y="818.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Participa del sistema mucociliar</tspan></text><rect x="40.0" y="828.2" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="847.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">En cepillo</tspan></text><text x="250.0" y="847.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Quimiosensorial</tspan></text><text x="610.0" y="847.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Microvellosidades</tspan></text><rect x="40.0" y="857.2" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="876.2" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="184"><tspan x="50.0" dy="0">Club (Clara)</tspan></text><text x="250.0" y="876.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="250.0" dy="0">Progenitora en los bronquiolos</tspan></text><text x="610.0" y="876.2" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="344"><tspan x="610.0" dy="0">Reemplaza a la basal en la vía distal</tspan></text><text x="40.0" y="926.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="936.2" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="958.7" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="939.2" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="958.7" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Basales</tspan></text><text x="435.0" y="958.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Cilíndricas ciliadas</tspan></text><text x="585.0" y="958.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Serosas</tspan></text><text x="735.0" y="958.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">En cepillo</tspan></text><text x="885.0" y="958.7" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Caliciformes</tspan></text><rect x="40.0" y="973.2" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="973.2" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1010.2" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Células madre?</tspan></text><text x="285.0" y="994.2" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: indiferenciadas,</tspan><tspan x="285.0" dy="16">junto a la membrana</tspan><tspan x="285.0" dy="16">basal</tspan></text><text x="435.0" y="1002.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: diferenciadas,</tspan><tspan x="435.0" dy="16">mueven el moco</tspan></text><text x="585.0" y="994.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: forman parte de</tspan><tspan x="585.0" dy="16">las glándulas</tspan><tspan x="585.0" dy="16">submucosas</tspan></text><text x="735.0" y="1002.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: función</tspan><tspan x="735.0" dy="16">quimiosensorial</tspan></text><text x="885.0" y="1010.2" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: secretan mucinas</tspan></text><rect x="40.0" y="936.2" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1063.2" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1091.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1113.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Células basales: pequeñas, junto a la membrana basal, ancladas por hemidesmosomas; se dividen y reponen ciliadas, caliciformes y en cepillo tras la</tspan><tspan x="58.0" dy="18">   lesión (Rock, PNAS 2009).</tspan><tspan x="58.0" dy="18">• Ciliadas (mayoría): movilizan el moco hacia la faringe. Caliciformes: secretan mucinas. En cepillo: microvellosidades y función quimiosensorial.</tspan><tspan x="58.0" dy="18">• Las células serosas forman parte de las glándulas submucosas; las células club (Clara) son progenitoras en los bronquiolos.</tspan><tspan x="58.0" dy="18">• Alerta: el tabaquismo induce hiperplasia de células basales y metaplasia escamosa, lesión precursora del carcinoma escamoso. En la fibrosis quística el</tspan><tspan x="58.0" dy="18">   CFTR defectuoso espesa el moco.</tspan></text><text x="58.0" y="1225.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Rock JR et al., Basal cells as stem cells of the mouse trachea and human airway epithelium, Proc Natl Acad Sci USA 2009;106:12771-12775; Ross, Histología: texto y</tspan><tspan x="58.0" dy="15">atlas, 8.ª ed. (2020); Guyton y Hall Tratado de Fisiología Médica, 14.ª ed. (2021).</tspan></text></svg>