nidas</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de embriología</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué células hay en el testículo al nacer?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="241.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ETAPAS DE LA VIDA</tspan></text><rect x="42.0" y="253.0" width="302.7" height="216.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="193.3" y="271.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">NACIMIENTO</tspan></text><text x="193.3" y="461.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">Cordones macizos</tspan></text><rect x="348.7" y="253.0" width="302.7"