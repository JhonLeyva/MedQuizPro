e" data-max="263"><tspan x="193.3" dy="0">ESPERMATOGONIAS</tspan></text><text x="193.3" y="543.4" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">Y células de Sertoli</tspan></text><rect x="354.7" y="483.0" width="290.7" height="90.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="519.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">Meiosis</tspan></text><text x="500.0" y="543.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">Espermatocitos</tspan></text><rect x="661.3" y="483.0" width="290.7" height="90.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="806.7" y="519.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">Espermatozoides</tspan></text><text x="806.7" y="543.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">Producción continua</tspan></text><text x="40.0" y="611.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÉLULAS AL NACER · MARCADO EL CORRECTO</tspan></text><rect x="40.0" y="623.0" width="133.2" height="30.0" rx="15" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="106.6" y="642.5" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="106.6" dy="0">✓ Espermatogonias</tspan></text><rect x="181.2" y="623.0" width="121.6" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="242.1" y="642.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="242.1" dy="0">Espermatocitos I</tspan></text><rect x="310.9" y="623.0" width="105.2" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="363.5" y="642.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="363.5" dy="0">Espermátides</tspan></text><rect x="424.1" y="623.0" width="110.0" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="479.1" y="642.5" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="479.1" dy="0">F. primordiales</tspan></text><rect x="40.0" y="677.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="705.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="727.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El ovario fetal ya inicia la meiosis I.</tspan><tspan x="58.0" dy="18">• Ovocitos detenidos en profase I.</tspan><tspan x="58.0" dy="18">• Folículos primordiales: solo en el ovario.</tspan></text><text x="58.0" y="785.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Langman. Embriología médica 15.ª ed. (2023)</tspan></text></svg>