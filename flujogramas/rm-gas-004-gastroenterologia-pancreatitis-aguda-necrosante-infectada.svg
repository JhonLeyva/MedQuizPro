<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1269" viewBox="0 0 1000 1269" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Necrosis pancreática infectada a la semana: carbapenémico y desbridamiento diferido"><title>Necrosis pancreática infectada a la semana: carbapenémico y desbridamiento diferido</title><rect x="0.75" y="0.75" width="998.5" height="1267.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Gastroenterología · pancreatitis aguda necrosante infectada</tspan></text><rect x="554.1" y="32.0" width="165.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="636.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="149"><tspan x="636.9" dy="0">GASTROENTEROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Necrosis infectada</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Después de la primera semana las bacterias del colon pueden infectar la necrosis.</tspan><tspan x="58.0" dy="17">Fiebre, leucocitosis y a veces gas en la tomografía.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 35 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pancreatitis aguda; a los 7 días, fiebre y leucocitosis.</tspan><tspan x="640.0" dy="16">Aspirado con aguja fina: polimorfonucleares y</tspan><tspan x="640.0" dy="16">bacterias.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EVOLUCIÓN DE LA PANCREATITIS Y CUÁNDO ACTUAR</tspan></text><line x1="216.3" y1="311.0" x2="477.0" y2="311.0" stroke="#99f6e4" stroke-width="6"/><line x1="523.0" y1="311.0" x2="783.7" y2="311.0" stroke="#99f6e4" stroke-width="6"/><circle cx="193.3" cy="311.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="193.3" y="315.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="193.3" dy="0">Día 1</tspan></text><rect x="45.0" y="345.0" width="296.7" height="75.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="193.3" y="365.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="285"><tspan x="193.3" dy="0">Pancreatitis aguda</tspan></text><text x="193.3" y="382.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="285"><tspan x="193.3" dy="0">Fluidos, analgesia y soporte; sin antibiótico</tspan><tspan x="193.3" dy="16">profiláctico.</tspan></text><circle cx="500.0" cy="311.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="315.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="500.0" dy="0">Día 7</tspan></text><rect x="351.7" y="345.0" width="296.7" height="75.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="365.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="285"><tspan x="500.0" dy="0">Fiebre y leucocitosis</tspan></text><text x="500.0" y="382.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="285"><tspan x="500.0" dy="0">Sospechar necrosis infectada: tomografía, a veces</tspan><tspan x="500.0" dy="16">con gas.</tspan></text><circle cx="806.7" cy="311.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="806.7" y="315.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="806.7" dy="0">Gram</tspan></text><rect x="658.3" y="345.0" width="296.7" height="75.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="806.7" y="365.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="285"><tspan x="806.7" dy="0">Aspirado positivo</tspan></text><text x="806.7" y="382.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="285"><tspan x="806.7" dy="0">Polimorfonucleares y bacterias: infección confirmada.</tspan></text><line x1="216.3" y1="468.0" x2="477.0" y2="468.0" stroke="#99f6e4" stroke-width="6"/><line x1="523.0" y1="468.0" x2="783.7" y2="468.0" stroke="#99f6e4" stroke-width="6"/><circle cx="193.3" cy="468.0" r="22" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><text x="193.3" y="472.5" font-size="9.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="38"><tspan x="193.3" dy="0">Ahora</tspan></text><rect x="45.0" y="502.0" width="296.7" height="75.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="193.3" y="522.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="285"><tspan x="193.3" dy="0">Imipenem o meropenem</tspan></text><text x="193.3" y="539.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="285"><tspan x="193.3" dy="0">Carbapenémico; alternativa: quinolona con</tspan><tspan x="193.3" dy="16">metronidazol.</tspan></text><rect x="147.9" y="566.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="193.3" y="581.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="193.3" dy="0">◆ ESTE CASO</tspan></text><circle cx="500.0" cy="468.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="472.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="500.0" dy="0">4 sem</tspan></text><rect x="351.7" y="502.0" width="296.7" height="75.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="522.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="285"><tspan x="500.0" dy="0">Necrosis encapsulada</tspan></text><text x="500.0" y="539.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="285"><tspan x="500.0" dy="0">Se retrasa el desbridamiento hasta este momento.</tspan></text><circle cx="806.7" cy="468.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="806.7" y="472.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="806.7" dy="0">Escalón</tspan></text><rect x="658.3" y="502.0" width="296.7" height="75.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="806.7" y="522.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="285"><tspan x="806.7" dy="0">Drenar y luego necrosectomía</tspan></text><text x="806.7" y="539.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="285"><tspan x="806.7" dy="0">Percutáneo o endoscópico; cirugía mínimamente</tspan><tspan x="806.7" dy="16">invasiva si no mejora.</tspan></text><rect x="40.0" y="609.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="635.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Necrosis infectada = carbapenémico y desbridamiento diferido</tspan></text><text x="60.0" y="654.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Piperacilina-tazobactam puede usarse en algunos esquemas, pero la mejor opción ofrecida es imipenem.</tspan></text><text x="40.0" y="715.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">GRAVEDAD DE LA PANCREATITIS AGUDA: ATLANTA REVISADA 2012 Y CLASIFICACIÓN POR DETERMINANTES (DBC)</tspan></text><rect x="40.0" y="727.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="746.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Gravedad</tspan></text><text x="220.0" y="746.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Atlanta revisada 2012</tspan></text><text x="595.0" y="746.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Determinantes (DBC)</tspan></text><rect x="40.0" y="756.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="775.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Leve</tspan></text><text x="220.0" y="775.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Sin falla orgánica ni complicaciones locales o sistémicas</tspan></text><text x="595.0" y="775.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Sin necrosis (peri)pancreática ni falla orgánica</tspan></text><rect x="40.0" y="785.0" width="920.0" height="44.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="804.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Moderada (Atlanta:</tspan><tspan x="50.0" dy="15">moderadamente grave)</tspan></text><text x="220.0" y="804.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Falla orgánica transitoria (&lt; 48 h) y/o complicaciones locales o</tspan><tspan x="220.0" dy="15">sistémicas</tspan></text><text x="595.0" y="804.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Necrosis estéril y/o falla orgánica transitoria</tspan></text><rect x="40.0" y="829.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="848.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Grave</tspan></text><text x="220.0" y="848.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Falla orgánica persistente (&gt; 48 h)</tspan></text><text x="595.0" y="848.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Necrosis infectada o falla orgánica persistente</tspan></text><rect x="40.0" y="858.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="877.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Crítica (solo DBC)</tspan></text><text x="220.0" y="877.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">No existe esta categoría</tspan></text><text x="595.0" y="877.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Necrosis infectada y falla orgánica persistente</tspan></text><text x="40.0" y="903.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Resumen de Banks 2013 y Dellinger 2012. El caso (necrosis infectada) es moderadamente grave en Atlanta si no hay falla orgánica persistente, y grave en DBC aun sin ella.</tspan></text><text x="40.0" y="950.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="960.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="982.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="963.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="982.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Imipenem-cilastatina</tspan></text><text x="435.0" y="982.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Ceftriaxona-clinda</tspan></text><text x="585.0" y="982.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Ceftazidima-vanco</tspan></text><text x="735.0" y="982.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Piperacilina-tazo</tspan></text><text x="885.0" y="982.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Cefepima-cloranf</tspan></text><rect x="40.0" y="997.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="997.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1034.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Antibiótico?</tspan></text><text x="285.0" y="1026.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: carbapenémico con</tspan><tspan x="285.0" dy="16">buena penetración</tspan></text><text x="435.0" y="1026.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no cubre bien</tspan><tspan x="435.0" dy="16">anaerobios</tspan></text><text x="585.0" y="1018.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: cubre mal</tspan><tspan x="585.0" dy="16">gramnegativos</tspan><tspan x="585.0" dy="16">resistentes</tspan></text><text x="735.0" y="1026.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es una alternativa</tspan><tspan x="735.0" dy="16">en algunos esquemas</tspan></text><text x="885.0" y="1026.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: el cloranfenicol no</tspan><tspan x="885.0" dy="16">se usa</tspan></text><rect x="40.0" y="960.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1087.0" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1115.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1137.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Necrosis infectada confirmada (Gram o cultivo positivo): antibióticos con buena penetración pancreática; la aspiración con aguja fina ya no es rutinaria.</tspan><tspan x="58.0" dy="18">• Carbapenémicos (imipenem o meropenem) o quinolona con metronidazol; las cefalosporinas con vancomicina o clindamicina cubren peor.</tspan><tspan x="58.0" dy="18">• Sin infección no hay profilaxis antibiótica en la pancreatitis aguda ni en la necrosis estéril (ACG 2024).</tspan><tspan x="58.0" dy="18">• Desbridar a las 4 semanas, con la necrosis encapsulada: drenaje percutáneo o endoscópico y, si no mejora, necrosectomía mínimamente invasiva.</tspan></text><text x="58.0" y="1213.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Banks PA et al., Atlanta revisada (Gut 2013); Dellinger EP et al., clasificación por determinantes (Ann Surg 2012); Baron TH et al., AGA, Clinical Practice Update:</tspan><tspan x="58.0" dy="15">Pancreatic Necrosis (Gastroenterology 2020); Tenner S et al., ACG, pancreatitis aguda (Am J Gastroenterol 2024;119:419-437); Sabiston 21.ª ed.</tspan></text></svg>