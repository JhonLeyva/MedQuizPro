<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1196" viewBox="0 0 1000 1196" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Herida por arma de fuego estable con sospecha de lesión duodenal: tomografía abdominal contrastada"><title>Herida por arma de fuego estable con sospecha de lesión duodenal: tomografía abdominal contrastada</title><rect x="0.75" y="0.75" width="998.5" height="1194.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Trauma abdominal penetrante · duodeno</tspan></text><rect x="439.9" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="483.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="483.1" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Herida por arma de fuego abdominal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Laparotomía si hay inestabilidad, peritonitis o evisceración.</tspan><tspan x="58.0" dy="17">Si está estable, se evalúa con imagen u observación seriada.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 34 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">PA 110/60, FC 100, T 38 °C; abdomen blando, FAST</tspan><tspan x="640.0" dy="16">con poco líquido.</tspan><tspan x="640.0" dy="16">A las 8 h: Blumberg (+). Se sospecha lesión duodenal.</tspan><tspan x="640.0" dy="16">¿Cómo se diagnostica?</tspan></text><line x1="640.0" y1="237.0" x2="670.0" y2="237.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="287.0" x2="422.2" y2="287.0" stroke="#94a3b8" stroke-width="2"/><line x1="422.2" y1="287.0" x2="422.2" y2="316.0" stroke="#94a3b8" stroke-width="2"/><polygon points="417.2,315.0 427.2,315.0 422.2,323.0" fill="#94a3b8"/><line x1="422.2" y1="381.0" x2="422.2" y2="411.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="411.0" x2="655.7" y2="411.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="411.0" x2="188.7" y2="440.0" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,439.0 193.7,439.0 188.7,447.0" fill="#94a3b8"/><line x1="655.7" y1="411.0" x2="655.7" y2="440.0" stroke="#94a3b8" stroke-width="2"/><polygon points="650.7,439.0 660.7,439.0 655.7,447.0" fill="#94a3b8"/><line x1="655.7" y1="537.5" x2="655.7" y2="567.5" stroke="#94a3b8" stroke-width="2"/><line x1="655.7" y1="567.5" x2="655.7" y2="596.5" stroke="#94a3b8" stroke-width="2"/><polygon points="650.7,595.5 660.7,595.5 655.7,603.5" fill="#94a3b8"/><line x1="655.7" y1="661.5" x2="655.7" y2="691.5" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="691.5" x2="811.3" y2="691.5" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="691.5" x2="500.0" y2="720.5" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,719.5 505.0,719.5 500.0,727.5" fill="#94a3b8"/><line x1="811.3" y1="691.5" x2="811.3" y2="720.5" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,719.5 816.3,719.5 811.3,727.5" fill="#94a3b8"/><line x1="320.0" y1="257.0" x2="320.0" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="287.0" x2="422.2" y2="287.0" stroke="#0f766e" stroke-width="3"/><line x1="422.2" y1="287.0" x2="422.2" y2="316.0" stroke="#0f766e" stroke-width="3"/><polygon points="417.2,315.0 427.2,315.0 422.2,323.0" fill="#0f766e"/><line x1="422.2" y1="381.0" x2="422.2" y2="411.0" stroke="#0f766e" stroke-width="3"/><line x1="422.2" y1="411.0" x2="655.7" y2="411.0" stroke="#0f766e" stroke-width="3"/><line x1="655.7" y1="411.0" x2="655.7" y2="440.0" stroke="#0f766e" stroke-width="3"/><polygon points="650.7,439.0 660.7,439.0 655.7,447.0" fill="#0f766e"/><line x1="655.7" y1="537.5" x2="655.7" y2="567.5" stroke="#0f766e" stroke-width="3"/><line x1="655.7" y1="567.5" x2="655.7" y2="596.5" stroke="#0f766e" stroke-width="3"/><polygon points="650.7,595.5 660.7,595.5 655.7,603.5" fill="#0f766e"/><line x1="655.7" y1="661.5" x2="655.7" y2="691.5" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="691.5" x2="655.7" y2="691.5" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="691.5" x2="500.0" y2="720.5" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,719.5 505.0,719.5 500.0,727.5" fill="#0f766e"/><rect x="91.0" y="420.0" width="195.4" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="188.7" y="432.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">Inestable, peritonitis o evisceración</tspan></text><rect x="554.4" y="420.0" width="202.5" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="655.7" y="432.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="655.7" dy="0">Estable, abdomen blando (este caso)</tspan></text><rect x="396.4" y="700.5" width="207.2" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="500.0" y="713.0" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">Sí, sospecha de lesión retroperitoneal</tspan></text><rect x="747.3" y="700.5" width="128.1" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="811.3" y="713.0" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">TC dudosa o deterioro</tspan></text><polygon points="162.2,352.0 188.2,323.0 656.2,323.0 682.2,352.0 656.2,381.0 188.2,381.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="208.2" cy="352.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="208.2" y="357.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="208.2" dy="0">?</tspan></text><text x="441.2" y="356.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="441.2" dy="0">Herida por arma de fuego en el abdomen</tspan></text><rect x="40.0" y="447.0" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="188.7" y="483.9" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">LAPAROTOMÍA</tspan></text><text x="188.7" y="506.8" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Sin más estudios</tspan></text><rect x="395.7" y="447.0" width="520.0" height="90.5" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><text x="655.7" y="475.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="492"><tspan x="655.7" dy="0">OBSERVAR Y REEVALUAR</tspan></text><text x="655.7" y="498.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="492"><tspan x="655.7" dy="0">FAST con poco líquido</tspan><tspan x="655.7" dy="17">Examen seriado</tspan></text><rect x="395.7" y="447.0" width="520.0" height="90.5" rx="10" fill="none" stroke="#0f766e" stroke-width="2.2"/><polygon points="395.7,632.5 421.7,603.5 889.7,603.5 915.7,632.5 889.7,661.5 421.7,661.5" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="441.7" cy="632.5" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="441.7" y="637.5" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="441.7" dy="0">?</tspan></text><text x="674.7" y="637.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="674.7" dy="0">A las 8 h: Blumberg (+); ¿lesión duodenal?</tspan></text><rect x="351.3" y="727.5" width="297.3" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="755.8" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">TC ABDOMINAL CON CONTRASTE</tspan></text><text x="500.0" y="778.8" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">IV y oral</tspan><tspan x="500.0" dy="17">Aire, líquido, extravasación</tspan></text><rect x="662.7" y="727.5" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="764.3" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">LAPAROTOMÍA</tspan></text><text x="811.3" y="787.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Exploración dirigida</tspan></text><text x="40.0" y="857.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="867.9" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="907.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="870.9" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="890.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Tomografía</tspan><tspan x="285.0" dy="17">abdominal</tspan><tspan x="285.0" dy="17">contrastada</tspan></text><text x="435.0" y="898.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Rx de esófago y</tspan><tspan x="435.0" dy="17">duodeno</tspan></text><text x="585.0" y="898.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Gammagrafía</tspan><tspan x="585.0" dy="17">abdominal</tspan></text><text x="735.0" y="907.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ecografía de control</tspan></text><text x="885.0" y="898.9" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Lavado peritoneal</tspan><tspan x="885.0" dy="17">diagnóstico</tspan></text><rect x="40.0" y="938.9" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="938.9" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="967.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Cómo se llega al</tspan><tspan x="54.0" dy="16">diagnóstico?</tspan></text><text x="285.0" y="959.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: muestra aire,</tspan><tspan x="285.0" dy="16">líquido y extravasación</tspan><tspan x="285.0" dy="16">retroperitoneal</tspan></text><text x="435.0" y="967.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: poco sensible en el</tspan><tspan x="435.0" dy="16">trauma agudo</tspan></text><text x="585.0" y="967.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no sirve en el</tspan><tspan x="585.0" dy="16">trauma agudo</tspan></text><text x="735.0" y="967.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: solo detecta</tspan><tspan x="735.0" dy="16">líquido libre</tspan></text><text x="885.0" y="967.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no explora el</tspan><tspan x="885.0" dy="16">retroperitoneo</tspan></text><rect x="40.0" y="867.9" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1028.9" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1056.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1078.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El duodeno es retroperitoneal: los signos peritoneales aparecen tarde, cuando el contenido o el aire irritan el peritoneo.</tspan><tspan x="58.0" dy="18">• En el paciente estable, la TC con contraste IV y oral es el estudio de elección: aire o líquido retroperitoneal, extravasación y hematoma.</tspan><tspan x="58.0" dy="18">• La FAST solo detecta líquido libre, el lavado peritoneal no explora el retroperitoneo y la serie esófago-gastro-duodenal es poco sensible.</tspan><tspan x="58.0" dy="18">• TC dudosa o deterioro clínico: laparotomía. La amilasa elevada o el aire retroperitoneal sugieren lesión duodenal.</tspan></text><text x="58.0" y="1154.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ATLS, 11.ª ed. (2025); WSES-AAST, Duodeno-pancreatic and extrahepatic biliary tree trauma (Coccolini 2019); Sabiston Tratado de Cirugía 21.ª ed.</tspan></text></svg>