<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="915" viewBox="0 0 1000 915" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Obesidad, hipotonía, hipogonadismo y criptorquidia con deleción 15q11-q13: síndrome de Prader-Willi"><title>Obesidad, hipotonía, hipogonadismo y criptorquidia con deleción 15q11-q13: síndrome de Prader-Willi</title><rect x="0.75" y="0.75" width="998.5" height="913.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Pediatría · síndrome de Prader-Willi</tspan></text><rect x="409.8" y="32.0" width="98.1" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="458.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="82"><tspan x="458.8" dy="0">PEDIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Prader-Willi</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Trastorno de impronta genómica: falta la expresión de los genes paternos de 15q11-q13.</tspan><tspan x="58.0" dy="17">Deleción paterna (cerca de 70 %), disomía uniparental materna o defecto de impronta.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 10 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Obesidad e hipotonía, retraso mental.</tspan><tspan x="640.0" dy="16">Hipogonadismo y criptorquidia; se sospecha</tspan><tspan x="640.0" dy="16">microdelección del cromosoma 15.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><rect x="40.0" y="261.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="287.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Obesidad + hipotonía + hipogonadismo + deleción 15 = Prader-Willi</tspan></text><text x="60.0" y="306.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Turner, X frágil, Klinefelter y Miller-Dieker tienen otro cariotipo o locus y otro fenotipo.</tspan></text><text x="40.0" y="367.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">SÍNDROMES GENÉTICOS DE LA PREGUNTA</tspan></text><rect x="40.0" y="379.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="398.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Síndrome</tspan></text><text x="220.0" y="398.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Alteración</tspan></text><text x="595.0" y="398.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Rasgos clave</tspan></text><rect x="40.0" y="408.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="427.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Turner</tspan></text><text x="220.0" y="427.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">45,X (mujer)</tspan></text><text x="595.0" y="427.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Talla baja y disgenesia gonadal</tspan></text><rect x="40.0" y="437.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="456.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">X frágil</tspan></text><text x="220.0" y="456.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Expansión CGG del gen FMR1</tspan></text><text x="595.0" y="456.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Discapacidad intelectual, macroorquidia y macrocefalia</tspan></text><rect x="40.0" y="466.0" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="485.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Prader-Willi</tspan></text><text x="220.0" y="485.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Pérdida de genes paternos 15q11-q13</tspan></text><text x="595.0" y="485.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Hipotonía, hiperfagia y obesidad, hipogonadismo, criptorquidia</tspan></text><rect x="110.6" y="469.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="156.0" y="484.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="156.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="495.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="514.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Klinefelter</tspan></text><text x="220.0" y="514.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">47,XXY</tspan></text><text x="595.0" y="514.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Testículos pequeños y ginecomastia</tspan></text><rect x="40.0" y="524.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="543.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Miller-Dieker</tspan></text><text x="220.0" y="543.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Deleción 17p13.3</tspan></text><text x="595.0" y="543.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Lisencefalia</tspan></text><text x="40.0" y="593.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="603.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="625.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="625.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Turner</tspan></text><text x="435.0" y="625.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">X frágil</tspan></text><rect x="513.0" y="606.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="625.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Prader-Willi</tspan></text><text x="735.0" y="625.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Klinefelter</tspan></text><text x="885.0" y="625.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Miller-Dieker</tspan></text><rect x="40.0" y="640.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="640.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="669.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Síndrome más</tspan><tspan x="54.0" dy="16">probable?</tspan></text><text x="285.0" y="669.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: monosomía X en</tspan><tspan x="285.0" dy="16">mujeres con talla baja</tspan></text><text x="435.0" y="661.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: expansión CGG</tspan><tspan x="435.0" dy="16">del gen FMR1, con</tspan><tspan x="435.0" dy="16">macroorquidia</tspan></text><text x="585.0" y="661.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: deleción 15q11-q13</tspan><tspan x="585.0" dy="16">paterna, obesidad e</tspan><tspan x="585.0" dy="16">hipotonía</tspan></text><text x="735.0" y="661.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: 47,XXY con</tspan><tspan x="735.0" dy="16">testículos pequeños y</tspan><tspan x="735.0" dy="16">ginecomastia</tspan></text><text x="885.0" y="669.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: deleción 17p13.3</tspan><tspan x="885.0" dy="16">con lisencefalia</tspan></text><rect x="40.0" y="603.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="730.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="758.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="780.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Cuadro: hipotonía neonatal con mala succión, hiperfagia y obesidad desde los 2 a 4 años, talla baja, manos y pies pequeños, hipogonadismo</tspan><tspan x="58.0" dy="18">   hipogonadotrópico y discapacidad intelectual.</tspan><tspan x="58.0" dy="18">• Diagnóstico: estudio de metilación del locus SNRPN (detecta todas las causas); luego microarreglo o FISH para precisar el mecanismo.</tspan><tspan x="58.0" dy="18">• Manejo multidisciplinario: control estricto del acceso a alimentos, hormona de crecimiento, reemplazo hormonal sexual y apoyo conductual.</tspan><tspan x="58.0" dy="18">• Perla: la misma deleción de origen materno produce el síndrome de Angelman. Alerta: la hiperfagia no se corrige con indicaciones dietéticas simples.</tspan></text><text x="58.0" y="874.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Nelson Tratado de Pediatría, 22.ª ed. (2024); Harrison Principios de Medicina Interna, 21.ª ed. (2022).</tspan></text></svg>