<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1110" viewBox="0 0 1000 1110" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La fractura de calcáneo por caída de altura se asocia con fractura del raquis (columna toracolumbar)"><title>La fractura de calcáneo por caída de altura se asocia con fractura del raquis (columna toracolumbar)</title><rect x="0.75" y="0.75" width="998.5" height="1108.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Traumatología · fractura de calcáneo</tspan></text><rect x="416.7" y="32.0" width="135.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="484.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="119"><tspan x="484.4" dy="0">TRAUMATOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Fractura de calcáneo</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hueso del tarso más fracturado; caída de altura sobre los talones.</tspan><tspan x="58.0" dy="17">Fractura intraarticular con ángulo de Böhler disminuido.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de lesión asociada</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Fractura de calcáneo por caída de altura.</tspan><tspan x="640.0" dy="16">¿Con qué fractura se asocia?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO VIAJA LA FUERZA DE LA CAÍDA Y QUÉ SE HACE EN CADA NIVEL</tspan></text><rect x="40.0" y="269.0" width="920.0" height="129.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="269.0" width="108.0" height="129.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="337.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Mecanismo</tspan></text><rect x="40.0" y="398.0" width="920.0" height="129.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="398.0" width="108.0" height="129.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="466.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Lesiones</tspan></text><rect x="40.0" y="527.0" width="920.0" height="129.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="527.0" width="108.0" height="129.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="595.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Qué se hace</tspan></text><line x1="280.0" y1="317.0" x2="287.0" y2="317.0" stroke="#0f766e" stroke-width="2.2"/><line x1="287.0" y1="317.0" x2="287.0" y2="453.5" stroke="#0f766e" stroke-width="2.2"/><line x1="287.0" y1="453.5" x2="285.0" y2="453.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="285.0,458.5 285.0,448.5 294.0,453.5" fill="#0f766e"/><line x1="416.0" y1="453.5" x2="423.0" y2="453.5" stroke="#0f766e" stroke-width="2.2"/><line x1="423.0" y1="453.5" x2="423.0" y2="333.5" stroke="#0f766e" stroke-width="2.2"/><line x1="423.0" y1="333.5" x2="421.0" y2="333.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="421.0,338.5 421.0,328.5 430.0,333.5" fill="#0f766e"/><line x1="552.0" y1="333.5" x2="559.0" y2="333.5" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="333.5" x2="559.0" y2="454.0" stroke="#ea580c" stroke-width="2.2"/><line x1="559.0" y1="454.0" x2="557.0" y2="454.0" stroke="#ea580c" stroke-width="2.2"/><polygon points="557.0,459.0 557.0,449.0 566.0,454.0" fill="#ea580c"/><line x1="688.0" y1="454.0" x2="695.0" y2="454.0" stroke="#0f766e" stroke-width="2.2"/><line x1="695.0" y1="454.0" x2="695.0" y2="583.0" stroke="#0f766e" stroke-width="2.2"/><line x1="695.0" y1="583.0" x2="693.0" y2="583.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="693.0,588.0 693.0,578.0 702.0,583.0" fill="#0f766e"/><line x1="824.0" y1="583.0" x2="831.0" y2="583.0" stroke="#0f766e" stroke-width="2.2"/><line x1="831.0" y1="583.0" x2="831.0" y2="591.5" stroke="#0f766e" stroke-width="2.2"/><line x1="831.0" y1="591.5" x2="829.0" y2="591.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="829.0,596.5 829.0,586.5 838.0,591.5" fill="#0f766e"/><rect x="158.0" y="282.0" width="122.0" height="70.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="168.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="168.0" dy="0">Caída de altura</tspan><tspan x="168.0" dy="16">sobre los talones</tspan></text><text x="168.0" y="331.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="168.0" dy="0">Fuerza axial</tspan></text><circle cx="158.0" cy="282.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="294.0" y="411.0" width="122.0" height="85.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="304.0" y="427.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="304.0" dy="0">Calcáneo</tspan></text><text x="304.0" y="444.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="304.0" dy="0">Fractura</tspan><tspan x="304.0" dy="14.5">intraarticular; Böhler</tspan><tspan x="304.0" dy="14.5">disminuido</tspan></text><circle cx="294.0" cy="411.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="294.0" y="415.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="294.0" dy="0">2</tspan></text><rect x="430.0" y="282.0" width="122.0" height="103.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="440.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="440.0" dy="0">La fuerza sube</tspan><tspan x="440.0" dy="16">por tibia, fémur y</tspan><tspan x="440.0" dy="16">pelvis</tspan></text><text x="440.0" y="347.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="440.0" dy="0">No se disipa en el</tspan><tspan x="440.0" dy="14.5">pie</tspan></text><circle cx="430.0" cy="282.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="430.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="430.0" dy="0">3</tspan></text><rect x="566.0" y="411.0" width="122.0" height="86.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="576.0" y="427.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="102"><tspan x="576.0" dy="0">Raquis: T11 a L2</tspan><tspan x="576.0" dy="16">y lumbares</tspan></text><text x="576.0" y="460.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="576.0" dy="0">10 a 15 %, por</tspan><tspan x="576.0" dy="14.5">compresión</tspan></text><circle cx="566.0" cy="411.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="566.0" y="415.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="566.0" dy="0">4</tspan></text><rect x="702.0" y="540.0" width="122.0" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="712.0" y="556.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="712.0" dy="0">Imágenes de</tspan><tspan x="712.0" dy="16">toda la columna</tspan></text><text x="712.0" y="589.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="712.0" dy="0">Más radiografía y</tspan><tspan x="712.0" dy="14.5">TC del calcáneo</tspan></text><circle cx="702.0" cy="540.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="702.0" y="544.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="702.0" dy="0">5</tspan></text><rect x="838.0" y="540.0" width="122.0" height="103.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="848.0" y="556.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="102"><tspan x="848.0" dy="0">Vigilar el</tspan><tspan x="848.0" dy="16">compartimento</tspan><tspan x="848.0" dy="16">del pie</tspan></text><text x="848.0" y="605.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="102"><tspan x="848.0" dy="0">Dolor y tumefacción</tspan><tspan x="848.0" dy="14.5">tensa</tspan></text><circle cx="838.0" cy="540.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="838.0" y="544.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="838.0" dy="0">6</tspan></text><rect x="40.0" y="674.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="700.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Calcáneo por caída = buscar fractura de columna</tspan></text><text x="60.0" y="719.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Rótula, fémur, íleon e isquion no son la lesión asociada típica.</tspan></text><text x="40.0" y="786.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="796.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="818.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="818.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Rótula</tspan></text><text x="435.0" y="818.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Fémur</tspan></text><text x="585.0" y="818.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Íleon</tspan></text><rect x="663.0" y="799.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="818.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Raquis</tspan></text><text x="885.0" y="818.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Isquion</tspan></text><rect x="40.0" y="833.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="833.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="854.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Fractura asociada</tspan><tspan x="54.0" dy="16">frecuente?</tspan></text><text x="285.0" y="854.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no es la lesión</tspan><tspan x="285.0" dy="16">concomitante típica</tspan></text><text x="435.0" y="854.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: no es la lesión</tspan><tspan x="435.0" dy="16">concomitante típica</tspan></text><text x="585.0" y="854.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no es la lesión</tspan><tspan x="585.0" dy="16">concomitante típica</tspan></text><text x="735.0" y="854.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: la fuerza axial llega</tspan><tspan x="735.0" dy="16">a T11-L2</tspan></text><text x="885.0" y="854.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no es la lesión</tspan><tspan x="885.0" dy="16">concomitante típica</tspan></text><rect x="40.0" y="796.0" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="907.0" width="920.0" height="185.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="935.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="957.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La fuerza axial comprime el calcáneo contra el astrágalo y se transmite por tibia, fémur y pelvis a la columna.</tspan><tspan x="58.0" dy="18">• Entre 10 y 15 % tiene lesión vertebral, en general por compresión o en cuña, entre T11 y L2 (charnela toracolumbar) y vértebras lumbares; hasta 10 % es</tspan><tspan x="58.0" dy="18">   bilateral.</tspan><tspan x="58.0" dy="18">• Ante caída de altura: examinar y obtener imágenes de toda la columna; calcáneo con radiografía lateral y axial, y TC para planificar la cirugía.</tspan><tspan x="58.0" dy="18">• Alerta: el síndrome compartimental del pie puede complicarla (dolor intenso y tumefacción tensa). Rótula, fémur, íleon e isquion no son la asociación</tspan><tspan x="58.0" dy="18">   típica.</tspan></text><text x="58.0" y="1069.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Rockwood and Green's Fractures in Adults 9.ª ed. (2019); Campbell's Operative Orthopaedics 14.ª ed. (2020); ATLS 11.ª ed. (2025).</tspan></text></svg>