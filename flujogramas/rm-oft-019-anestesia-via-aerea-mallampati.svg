<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="926" viewBox="0 0 1000 926" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El test de Mallampati valora qué estructuras de la faringe se ven con la boca abierta y la lengua fuera"><title>El test de Mallampati valora qué estructuras de la faringe se ven con la boca abierta y la lengua fuera</title><rect x="0.75" y="0.75" width="998.5" height="924.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Anestesia · vía aérea: Mallampati</tspan></text><rect x="394.9" y="32.0" width="162.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="476.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="146"><tspan x="476.0" dy="0">OFTALMOLOGÍA Y ORL RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="119.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Test de Mallampati</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Relaciona el tamaño de la lengua con la cavidad oral para predecir una intubación difícil.</tspan><tspan x="58.0" dy="17">Se hace sentado, boca abierta al máximo, lengua fuera y sin fonar.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="119.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="117.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué valora el test de Mallampati?</tspan></text><rect x="640.0" y="180.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="193.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="193.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><rect x="40.0" y="229.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="255.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Mallampati = estructuras visibles de la orofaringe</tspan></text><text x="60.0" y="274.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Cuerdas vocales, apertura bucal, distancia tiromentoniana y cuello se evalúan por separado.</tspan></text><text x="40.0" y="335.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN DE MALLAMPATI MODIFICADA POR SAMSOON Y YOUNG</tspan></text><rect x="40.0" y="347.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="366.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="74"><tspan x="50.0" dy="0">Clase</tspan></text><text x="140.0" y="366.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="399"><tspan x="140.0" dy="0">Estructuras visibles</tspan></text><text x="555.0" y="366.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="399"><tspan x="555.0" dy="0">Intubación</tspan></text><rect x="40.0" y="376.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="395.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="74"><tspan x="50.0" dy="0">I</tspan></text><text x="140.0" y="395.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="399"><tspan x="140.0" dy="0">Paladar blando, fauces, úvula y pilares</tspan></text><text x="555.0" y="395.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="399"><tspan x="555.0" dy="0">Predicción favorable</tspan></text><rect x="40.0" y="405.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="424.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="74"><tspan x="50.0" dy="0">II</tspan></text><text x="140.0" y="424.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="399"><tspan x="140.0" dy="0">Paladar blando, fauces y úvula</tspan></text><text x="555.0" y="424.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="399"><tspan x="555.0" dy="0">Predicción favorable</tspan></text><rect x="40.0" y="434.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="453.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="74"><tspan x="50.0" dy="0">III</tspan></text><text x="140.0" y="453.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="399"><tspan x="140.0" dy="0">Paladar blando y base de la úvula</tspan></text><text x="555.0" y="453.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="399"><tspan x="555.0" dy="0">Laringoscopia difícil probable</tspan></text><rect x="40.0" y="463.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="482.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="74"><tspan x="50.0" dy="0">IV</tspan></text><text x="140.0" y="482.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="399"><tspan x="140.0" dy="0">Solo paladar duro</tspan></text><text x="555.0" y="482.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="399"><tspan x="555.0" dy="0">Laringoscopia difícil probable</tspan></text><text x="40.0" y="508.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">Combinar con otros predictores (regla LEMON); ningún test aislado es suficiente.</tspan></text><text x="40.0" y="555.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="565.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="604.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="568.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="596.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Estructuras visibles</tspan><tspan x="285.0" dy="17">de la faringe</tspan></text><text x="435.0" y="604.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Cuerdas vocales</tspan></text><text x="585.0" y="596.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Inmovilidad del</tspan><tspan x="585.0" dy="17">cuello</tspan></text><text x="735.0" y="587.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Distancia entre</tspan><tspan x="735.0" dy="17">incisivos menor de</tspan><tspan x="735.0" dy="17">4 cm</tspan></text><text x="885.0" y="587.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Distancia</tspan><tspan x="885.0" dy="17">tiromentoniana</tspan><tspan x="885.0" dy="17">mayor de 6,5 cm</tspan></text><rect x="40.0" y="636.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="636.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="673.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Qué valora?</tspan></text><text x="285.0" y="665.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: estructuras visibles</tspan><tspan x="285.0" dy="16">de la faringe</tspan></text><text x="435.0" y="657.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: se ven con</tspan><tspan x="435.0" dy="16">laringoscopia</tspan><tspan x="435.0" dy="16">(Cormack-Lehane)</tspan></text><text x="585.0" y="673.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: se evalúa aparte</tspan></text><text x="735.0" y="665.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: apertura bucal,</tspan><tspan x="735.0" dy="16">otra medición</tspan></text><text x="885.0" y="657.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: distancia</tspan><tspan x="885.0" dy="16">tiromentoniana, otra</tspan><tspan x="885.0" dy="16">medición</tspan></text><rect x="40.0" y="565.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="726.0" width="920.0" height="182.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="754.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="776.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Se observan las estructuras de la orofaringe visibles; las clases III y IV se asocian a laringoscopia difícil.</tspan><tspan x="58.0" dy="18">• No valora: cuerdas vocales (Cormack-Lehane en la laringoscopia), apertura bucal menor de 3-4 cm, distancia tiromentoniana menor de 6 cm ni movilidad</tspan><tspan x="58.0" dy="18">   cervical.</tspan><tspan x="58.0" dy="18">• Ningún test aislado basta: combinar con la regla LEMON (mirar, evaluar 3-3-2, Mallampati, obstrucción, movilidad del cuello).</tspan><tspan x="58.0" dy="18">• Alerta: la valoración predictiva siempre va con un plan alternativo (videolaringoscopio y dispositivo supraglótico).</tspan></text><text x="58.0" y="870.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ASA, Practice Guidelines for Management of the Difficult Airway (Anesthesiology 2022;136:31-81); Samsoon y Young, Anaesthesia 1987; Mallampati et al., Can Anaesth</tspan><tspan x="58.0" dy="15">Soc J 1985</tspan></text></svg>