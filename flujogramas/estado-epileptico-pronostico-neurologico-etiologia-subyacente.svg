<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1276" viewBox="0 0 1000 1276" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Pronóstico del estado epiléptico: lo que más pesa es la causa"><title>Pronóstico del estado epiléptico: lo que más pesa es la causa</title><rect x="0.75" y="0.75" width="998.5" height="1274.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Estado epiléptico · pronóstico</tspan></text><rect x="378.4" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="434.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="434.8" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Estado epiléptico en el niño</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El daño final depende sobre todo de qué lo provocó.</tspan><tspan x="58.0" dy="17">La duración y la rapidez del tratamiento también influyen.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 3 años en UCI pediátrica</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Estado convulsivo generalizado, ya estabilizado.</tspan><tspan x="640.0" dy="16">¿Qué define más su pronóstico neurológico?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿QUÉ PESA MÁS EN EL PRONÓSTICO?</tspan></text><rect x="493.0" y="319.0" width="14" height="190" rx="5" fill="#64748b"/><path d="M440.0 524.0 H560.0 L540.0 504.0 H460.0 Z" fill="#475569"/><circle cx="500.0" cy="319.0" r="11" fill="#f59e0b" stroke="#92400e" stroke-width="2"/><line x1="385.4" y1="337.1" x2="614.6" y2="300.9" stroke="#334155" stroke-width="7" stroke-linecap="round"/><line x1="385.4" y1="337.1" x2="357.4" y2="399.1" stroke="#64748b" stroke-width="2"/><line x1="385.4" y1="337.1" x2="413.4" y2="399.1" stroke="#64748b" stroke-width="2"/><path d="M347.4 399.1 H423.4 Q385.4 443.1 347.4 399.1 Z" fill="#ea580c"/><text x="385.4" y="414.1" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="385.4" dy="0">elige</tspan></text><line x1="614.6" y1="300.9" x2="586.6" y2="362.9" stroke="#64748b" stroke-width="2"/><line x1="614.6" y1="300.9" x2="642.6" y2="362.9" stroke="#64748b" stroke-width="2"/><path d="M576.6 362.9 H652.6 Q614.6 406.9 576.6 362.9 Z" fill="#64748b"/><text x="614.6" y="377.9" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="614.6" dy="0">no</tspan></text><text x="500.0" y="551.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="300"><tspan x="500.0" dy="0">Pronóstico neurológico tras el estado epiléptico</tspan></text><rect x="40.0" y="289.0" width="290.0" height="148.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><text x="58.0" y="317.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="254"><tspan x="58.0" dy="0">La causa del estado epiléptico</tspan></text><circle cx="62.0" cy="342.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="346.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Febril en niño sano: suele quedar bien</tspan></text><circle cx="62.0" cy="368.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="372.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Encefalitis, trauma o daño metabólico: más</tspan><tspan x="74.0" dy="16">secuelas</tspan></text><circle cx="62.0" cy="410.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="414.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Es el factor que más predice en los estudios</tspan></text><rect x="214.6" y="278.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="260.0" y="293.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="260.0" dy="0">◆ ESTE CASO</tspan></text><rect x="670.0" y="289.0" width="290.0" height="148.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="688.0" y="317.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="688.0" dy="0">Fármaco, estancia o edad</tspan></text><circle cx="692.0" cy="342.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="346.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">El fármaco influye en el control, no en la</tspan><tspan x="704.0" dy="16">causa</tspan></text><circle cx="692.0" cy="384.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="388.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">La estancia es consecuencia del cuadro</tspan></text><circle cx="692.0" cy="410.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="414.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">La edad pesa menos que la causa</tspan></text><rect x="40.0" y="585.0" width="920.0" height="76.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="613.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">La etiología subyacente define el pronóstico</tspan></text><text x="500.0" y="634.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Por eso se busca la causa (infección, trauma, tóxicos, metabólica) mientras se controla la crisis.</tspan></text><text x="40.0" y="701.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">ASÍ SE VE EN ESTE CASO</tspan></text><rect x="40.0" y="713.0" width="388.0" height="252.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="52.0" y="723.0" width="187.0" height="20.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="61.0" y="737.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="346"><tspan x="61.0" dy="0">MISMA CRISIS, DISTINTA CAUSA</tspan></text><g data-box="54.0 751.0 360.0 190.0"><g transform="translate(54.0,751.0) scale(0.6)"><rect x="0" y="0" width="280" height="260" rx="10" fill="#0b1220"/><ellipse cx="140" cy="132" rx="116" ry="118" fill="#e5e7eb" stroke="none" stroke-width="0" /><ellipse cx="140" cy="132" rx="106" ry="108" fill="#6b7280" stroke="none" stroke-width="0" /><path d="M119 96 C111 120 113 150 127.5 164 L136 150 L136 100 Z" fill="#111827" stroke="none" stroke-width="0" stroke-linejoin="round" /><path d="M161 96 C169 120 167 150 152.5 164 L144 150 L144 100 Z" fill="#111827" stroke="none" stroke-width="0" stroke-linejoin="round" /><text x="140" y="11" font-size="9" font-weight="800" fill="#94a3b8" text-anchor="middle" data-max="0">adelante</text></g><g transform="translate(238.0,751.0) scale(0.6)"><rect x="0" y="0" width="280" height="260" rx="10" fill="#0b1220"/><ellipse cx="140" cy="132" rx="116" ry="118" fill="#e5e7eb" stroke="none" stroke-width="0" /><ellipse cx="140" cy="132" rx="106" ry="108" fill="#6b7280" stroke="none" stroke-width="0" /><path d="M119 96 C111 120 113 150 127.5 164 L136 150 L136 100 Z" fill="#111827" stroke="none" stroke-width="0" stroke-linejoin="round" /><path d="M161 96 C169 120 167 150 152.5 164 L144 150 L144 100 Z" fill="#111827" stroke="none" stroke-width="0" stroke-linejoin="round" /><ellipse cx="140" cy="132" rx="106" ry="108" fill="#9ca3af" stroke="none" stroke-width="0" opacity="0.35"/><text x="140" y="11" font-size="9" font-weight="800" fill="#94a3b8" text-anchor="middle" data-max="0">adelante</text></g><g transform="translate(54.0,751.0) scale(1.0)"><text x="84" y="176" font-size="11" font-weight="700" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Febril, niño sano</text><text x="84" y="176" font-size="11" font-weight="700" fill="#334155" text-anchor="middle" data-max="0">Febril, niño sano</text><text x="268" y="176" font-size="11" font-weight="700" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="middle" data-max="0">Encefalitis o lesión aguda</text><text x="268" y="176" font-size="11" font-weight="700" fill="#334155" text-anchor="middle" data-max="0">Encefalitis o lesión aguda</text></g></g><rect x="450.0" y="713.0" width="510.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="468.0" cy="728.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="468.0" y="732.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="468.0" dy="0">1</tspan></text><text x="486.0" y="733.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="466"><tspan x="486.0" dy="0">Izquierda: cerebro sano tras una crisis febril.</tspan></text><rect x="450.0" y="751.0" width="510.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="468.0" cy="766.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="468.0" y="770.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="468.0" dy="0">2</tspan></text><text x="486.0" y="771.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="466"><tspan x="486.0" dy="0">Derecha: edema por encefalitis o lesión aguda.</tspan></text><rect x="450.0" y="789.0" width="510.0" height="31.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/><circle cx="468.0" cy="804.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="468.0" y="808.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="468.0" dy="0">3</tspan></text><text x="486.0" y="809.0" font-size="12" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="466"><tspan x="486.0" dy="0">La enfermedad de fondo, no la crisis sola, deja el daño.</tspan></text><text x="40.0" y="1005.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1015.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1046.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="1046.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Tipo de anticonvulsivo</tspan></text><rect x="400.5" y="1018.0" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="1046.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Etiología subyacente</tspan></text><text x="678.8" y="1037.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Duración de la</tspan><tspan x="678.8" dy="17">hospitalización</tspan></text><text x="866.2" y="1046.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Edad del niño</tspan></text><rect x="40.0" y="1069.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="1069.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1090.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Principal factor?</tspan></text><text x="303.8" y="1090.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No</tspan></text><text x="491.2" y="1090.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Sí</tspan></text><text x="678.8" y="1090.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No: es consecuencia</tspan></text><text x="866.2" y="1090.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Pesa menos</tspan></text><rect x="40.0" y="1015.0" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1127.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1155.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1177.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La etiología es el principal factor pronóstico: febril en niño sano, bueno; infección del SNC, lesión aguda o metabólica, peor.</tspan><tspan x="58.0" dy="18">• El tipo de anticonvulsivo influye en el control de la crisis, no tanto en el daño final.</tspan><tspan x="58.0" dy="18">• La estancia hospitalaria es una consecuencia, no una causa.</tspan></text><text x="58.0" y="1235.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Nelson Tratado de Pediatría 22.ª ed. (2024); ILAE, estado epiléptico (2015).</tspan></text></svg>