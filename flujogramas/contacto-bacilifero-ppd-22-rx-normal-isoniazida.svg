ar la función hepática en mayores.</tspan><tspan x="58.0" dy="18">• Piridoxina con isoniazida.</tspan><tspan x="58.0" dy="18">• Educar sobre síntomas de TB.</tspan></text><text x="58.0" y="746.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA – NTS 200 (2023) · OMS – TB preventive treatment (2024)</tspan></text></svg>