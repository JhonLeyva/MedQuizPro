es y criaderos; educación: escuelas.</tspan><tspan x="58.0" dy="18">• Comités multisectoriales con metas y responsables.</tspan></text><text x="58.0" y="961.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OPS, APS renovada (2007); MINSA Perú, NTS de dengue (2024).</tspan></text></svg>