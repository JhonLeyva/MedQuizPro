20 días después</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 7 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Tratado por faringoamigdalitis</tspan><tspan x="640.0" dy="16">A los 15 días: vómitos, cólico e ictericia</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">EVOLUCIÓN</tspan></text><rect x="42.0" y="269.0" width="302.7" height="216.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="193.3" y="287.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">FARINGITIS</tspan></text><text x="193.3" y="477.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="193.3" dy="0">Día 0</tspan></text><rect x="348.7" y="269.0" width="302.7" height="216.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="500.0" y="287.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">TRATAMIENTO</tspan></text><text x="500.0" y="477.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="500.0" dy="0">10 días</tspan></text><rect x="655.3" y="269.0" width="302.7" height="216.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/><text x="806.7" y="287.0" font-size="12" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">DÍA 15</tspan></text><text x="806.7" y="477.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="287"><tspan x="806.7" dy="0">Colestasis</tspan></text><path d="M 60.0,453.9 L 206.7,453.9 L 353.3,452.9 L 500.0,444.7 L 646.7,401.9 L 793.3,362.1 L 940.0,401.9" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><line x1="58.0" y1="309.0" x2="80.0" y2="309.0" stroke="#f59e0b" stroke-width="3"/><text x="86.0" y="313.0" font-size="10.5" font-weight="700" font-style="normal" fill="#f59e0b" text-anchor="start" data-max="200"><tspan x="86.0" dy="0">Relevancia en este caso</tspan></text><line x1="806.7" y1="271.0" x2="806.7" y2="461.0" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4"/><rect x="761.3" y="444.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="806.7" y="459.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="806.7" dy="0">◆ ESTE CASO</tspan></text><rect x="48.0" y="499.0" width="290.7" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="193.3" y="536.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">Antibiótico</tspan></text><text x="193.3" y="560.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="193.3" dy="0">Alérgico a penicilina</tspan></text><rect x="354.7" y="499.0" width="290.7" height="91.2" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="500.0" y="536.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">Sin síntomas</tspan></text><text x="500.0" y="560.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="263"><tspan x="500.0" dy="0">Termina el curso</tspan></text><rect x="661.3" y="499.0" width="290.7" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="806.7" y="527.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">ESTOLATO</tspan></text><text x="806.7" y="551.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="263"><tspan x="806.7" dy="0">Ictericia, cólico</tspan><tspan x="806.7" dy="17">Eosinofilia</tspan></text><text x="40.0" y="628.2" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">FÁRMACO · MARCADO EL CORRECTO</tspan></text><rect x="40.0" y="640.2" width="152.4" height="30.0" rx="15" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="116.2" y="659.7" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="116.2" dy="0">✓ Eritromicina estolato</tspan></text><rect x="200.4" y="640.2" width="100.4" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="250.6" y="659.7" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="250.6" dy="0">Clindamicina</tspan></text><rect x="308.8" y="640.2" width="83.3" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="350.5" y="659.7" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="350.5" dy="0">Cefradina</tspan></text><rect x="400.2" y="640.2" width="86.1" height="30.0" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="443.2" y="659.7" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="middle" data-max="0"><tspan x="443.2" dy="0">Ampicilina</tspan></text><rect x="40.0" y="694.2" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="722.2" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="744.2" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Simula colecistitis.</tspan><tspan x="58.0" dy="18">• Se resuelve al suspenderla.</tspan><tspan x="58.0" dy="18">• Ampicilina: exantema.</tspan></text><text x="58.0" y="802.2" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Goodman &amp; Gilman. Bases farmacológicas de la terapéutica 14.ª ed. (2023)</tspan></text></svg>