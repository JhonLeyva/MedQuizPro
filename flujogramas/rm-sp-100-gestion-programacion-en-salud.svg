<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="966" viewBox="0 0 1000 966" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Los criterios de la programación técnica son cobertura, concentración y rendimiento"><title>Los criterios de la programación técnica son cobertura, concentración y rendimiento</title><rect x="0.75" y="0.75" width="998.5" height="964.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Gestión · programación en salud</tspan></text><rect x="394.1" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="458.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="458.4" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Programación</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Traduce el plan operativo en actividades, tareas y productos.</tspan><tspan x="58.0" dy="17">Técnica (lo ideal) y real (ajustada a los recursos).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Director del establecimiento</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Adecua criterios de programación cada año.</tspan><tspan x="640.0" dy="16">¿Cuáles son los tres criterios?</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CRITERIOS DE LA PROGRAMACIÓN TÉCNICA</tspan></text><line x1="410.3" y1="347.0" x2="340.0" y2="325.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="325.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="347.0" x2="660.0" y2="325.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="325.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="403.0" x2="660.0" y2="425.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="425.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="410.3" y1="403.0" x2="340.0" y2="425.0" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="425.0" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="375.0" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="375.0" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="380.0" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">PROGRAMACIÓN</tspan></text><text x="500.0" y="399.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">cuánto y a quién</tspan></text><rect x="40.0" y="283.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="284.0" width="6.0" height="82.0" rx="3" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="190.0" y="316.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">COBERTURA</tspan></text><text x="190.0" y="340.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">A cuánta población objetivo se atenderá</tspan></text><rect x="40.0" y="383.0" width="300.0" height="84.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="416.7" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">CONCENTRACIÓN</tspan></text><text x="190.0" y="440.4" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Cuántas atenciones por usuario al año</tspan></text><rect x="144.6" y="457.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="472.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="660.0" y="283.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="284.0" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="810.0" y="316.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">RENDIMIENTO</tspan></text><text x="810.0" y="340.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Cuántas atenciones por hora de recurso</tspan></text><rect x="660.0" y="383.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="384.0" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="416.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">RECURSOS</tspan></text><text x="810.0" y="440.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Se calculan horas, personal y materiales</tspan></text><text x="40.0" y="517.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="529.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="553.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Población objetivo</tspan></text><line x1="248.5" y1="549.5" x2="267.5" y2="549.5" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,544.5 266.5,554.5 274.5,549.5" fill="#0f766e"/><rect x="278.5" y="529.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="553.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Atenciones por usuario</tspan></text><line x1="487.0" y1="549.5" x2="506.0" y2="549.5" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,544.5 505.0,554.5 513.0,549.5" fill="#0f766e"/><rect x="517.0" y="529.0" width="204.5" height="41.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="553.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Horas de recurso</tspan></text><line x1="725.5" y1="549.5" x2="744.5" y2="549.5" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,544.5 743.5,554.5 751.5,549.5" fill="#0f766e"/><rect x="755.5" y="529.0" width="204.5" height="41.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="553.5" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Programación real ajusta</tspan></text><text x="40.0" y="610.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="620.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="659.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="642.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Efectividad,</tspan><tspan x="285.0" dy="17">cobertura,</tspan><tspan x="285.0" dy="17">resultados</tspan></text><text x="435.0" y="651.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Eficiencia, eficacia,</tspan><tspan x="435.0" dy="17">efectividad</tspan></text><text x="585.0" y="651.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Rendimiento,</tspan><tspan x="585.0" dy="17">resultado, eficiencia</tspan></text><rect x="663.0" y="623.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="642.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Cobertura,</tspan><tspan x="735.0" dy="17">concentración,</tspan><tspan x="735.0" dy="17">rendimiento</tspan></text><text x="885.0" y="651.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Rendimiento,</tspan><tspan x="885.0" dy="17">cobertura, eficacia</tspan></text><rect x="40.0" y="691.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="691.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="720.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Criterios de</tspan><tspan x="54.0" dy="16">programación?</tspan></text><text x="285.0" y="720.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: incluye resultados,</tspan><tspan x="285.0" dy="16">que se evalúan</tspan></text><text x="435.0" y="720.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: son criterios de</tspan><tspan x="435.0" dy="16">evaluación</tspan></text><text x="585.0" y="720.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: mezcla resultado y</tspan><tspan x="585.0" dy="16">eficiencia</tspan></text><text x="735.0" y="712.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: cobertura,</tspan><tspan x="735.0" dy="16">concentración,</tspan><tspan x="735.0" dy="16">rendimiento</tspan></text><text x="885.0" y="720.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: incluye eficacia,</tspan><tspan x="885.0" dy="16">que se evalúa</tspan></text><rect x="40.0" y="620.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="781.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="809.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="831.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Cobertura: proporción de la población objetivo que se espera atender.</tspan><tspan x="58.0" dy="18">• Concentración: número de atenciones que recibirá cada usuario en el año (p. ej. controles prenatales por gestante).</tspan><tspan x="58.0" dy="18">• Rendimiento: atenciones que produce una hora de un recurso (tiempo del profesional).</tspan><tspan x="58.0" dy="18">• Con los tres se calculan recursos humanos, horas y materiales; la programación real ajusta lo ideal a lo disponible. Eficiencia, eficacia y efectividad</tspan><tspan x="58.0" dy="18">   evalúan, no programan.</tspan></text><text x="58.0" y="925.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Chiavenato I. Introducción a la Teoría General de la Administración, 9.ª ed. (2014); MINSA, DGPP: documentos técnicos de programación del plan operativo institucional.</tspan></text></svg>