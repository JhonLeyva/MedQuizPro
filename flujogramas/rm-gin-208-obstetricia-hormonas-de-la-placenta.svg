<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1172" viewBox="0 0 1000 1172" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El lactógeno placentario humano es la hormona diabetógena del embarazo: antagoniza la acción de la insulina"><title>El lactógeno placentario humano es la hormona diabetógena del embarazo: antagoniza la acción de la insulina</title><rect x="0.75" y="0.75" width="998.5" height="1170.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Obstetricia · hormonas de la placenta</tspan></text><rect x="421.5" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="501.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="501.2" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Lactógeno placentario humano (HPL)</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hormona proteica del sincitiotrofoblasto; su nivel crece con la masa placentaria y llega al</tspan><tspan x="58.0" dy="17">máximo cerca del término.</tspan><tspan x="58.0" dy="17">Vida media de 15 a 30 minutos.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de fisiología</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es la principal acción del HPL durante el</tspan><tspan x="640.0" dy="16">embarazo?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUIÉN HACE QUÉ EN LA PLACENTA Y EL EMBARAZO</tspan></text><rect x="40.0" y="269.0" width="920.0" height="128.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="269.0" width="108.0" height="128.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="333.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Acción real del</tspan><tspan x="94.0" dy="14">HPL</tspan></text><rect x="40.0" y="397.0" width="920.0" height="128.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="397.0" width="108.0" height="128.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="461.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Otra hormona</tspan><tspan x="94.0" dy="14">la ejerce</tspan></text><rect x="40.0" y="525.0" width="920.0" height="128.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="525.0" width="108.0" height="128.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="589.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">No es acción de</tspan><tspan x="94.0" dy="14">la placenta</tspan></text><line x1="307.2" y1="333.0" x2="314.2" y2="333.0" stroke="#0f766e" stroke-width="2.2"/><line x1="314.2" y1="333.0" x2="314.2" y2="316.5" stroke="#0f766e" stroke-width="2.2"/><line x1="314.2" y1="316.5" x2="312.2" y2="316.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="312.2,321.5 312.2,311.5 321.2,316.5" fill="#0f766e"/><line x1="470.4" y1="316.5" x2="477.4" y2="316.5" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="316.5" x2="477.4" y2="453.0" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="453.0" x2="475.4" y2="453.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="475.4,458.0 475.4,448.0 484.4,453.0" fill="#0f766e"/><line x1="633.6" y1="453.0" x2="640.6" y2="453.0" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="453.0" x2="640.6" y2="445.0" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="445.0" x2="638.6" y2="445.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="638.6,450.0 638.6,440.0 647.6,445.0" fill="#0f766e"/><line x1="796.8" y1="445.0" x2="803.8" y2="445.0" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="445.0" x2="803.8" y2="581.0" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="581.0" x2="801.8" y2="581.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="801.8,586.0 801.8,576.0 810.8,581.0" fill="#0f766e"/><rect x="158.0" y="282.0" width="149.2" height="102.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="168.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Antagoniza la</tspan><tspan x="168.0" dy="16">insulina</tspan></text><text x="168.0" y="331.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Resistencia periférica y</tspan><tspan x="168.0" dy="14.5">más glucemia</tspan><tspan x="168.0" dy="14.5">posprandial</tspan></text><circle cx="158.0" cy="282.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="321.2" y="282.0" width="149.2" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="331.2" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Estimula la lipólisis</tspan></text><text x="331.2" y="315.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">La madre usa ácidos</tspan><tspan x="331.2" dy="14.5">grasos; el feto, la glucosa</tspan></text><circle cx="321.2" cy="282.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="321.2" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="321.2" dy="0">2</tspan></text><rect x="484.4" y="410.0" width="149.2" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="494.4" y="426.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Mantener el cuerpo</tspan><tspan x="494.4" dy="16">lúteo</tspan></text><text x="494.4" y="459.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Función de la hCG en las</tspan><tspan x="494.4" dy="14.5">primeras semanas</tspan></text><circle cx="484.4" cy="410.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="484.4" y="414.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="484.4" dy="0">3</tspan></text><rect x="647.6" y="410.0" width="149.2" height="70.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="657.6" y="426.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Relajar el músculo</tspan><tspan x="657.6" dy="16">liso</tspan></text><text x="657.6" y="459.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Progesterona y relajina</tspan></text><circle cx="647.6" cy="410.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="647.6" y="414.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="647.6" dy="0">4</tspan></text><rect x="810.8" y="538.0" width="149.2" height="86.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="820.8" y="554.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Autoinmune o menos</tspan><tspan x="820.8" dy="16">flujo</tspan></text><text x="820.8" y="587.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">El HPL no hace ninguna</tspan><tspan x="820.8" dy="14.5">de las dos</tspan></text><circle cx="810.8" cy="538.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="810.8" y="542.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="810.8" dy="0">5</tspan></text><rect x="40.0" y="671.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="697.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">HPL = hormona diabetógena del embarazo</tspan></text><text x="60.0" y="716.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Cuerpo lúteo = hCG; relajación uterina = progesterona; no es autoinmune ni reduce el flujo.</tspan></text><text x="40.0" y="783.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="793.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="832.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="824.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Actividad</tspan><tspan x="285.0" dy="17">autoinmune</tspan></text><text x="435.0" y="824.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Relajar el músculo</tspan><tspan x="435.0" dy="17">liso</tspan></text><rect x="513.0" y="796.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="815.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Antagonizar la</tspan><tspan x="585.0" dy="17">acción de la</tspan><tspan x="585.0" dy="17">insulina</tspan></text><text x="735.0" y="824.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Mantener el cuerpo</tspan><tspan x="735.0" dy="17">lúteo</tspan></text><text x="885.0" y="824.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Disminuir el flujo</tspan><tspan x="885.0" dy="17">sanguíneo del útero</tspan></text><rect x="40.0" y="864.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="864.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="893.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Principal acción del</tspan><tspan x="54.0" dy="16">HPL?</tspan></text><text x="285.0" y="893.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: el HPL no tiene</tspan><tspan x="285.0" dy="16">acción autoinmune</tspan></text><text x="435.0" y="885.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: la ejerce la</tspan><tspan x="435.0" dy="16">progesterona con la</tspan><tspan x="435.0" dy="16">relajina</tspan></text><text x="585.0" y="893.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: induce resistencia a</tspan><tspan x="585.0" dy="16">la insulina</tspan></text><text x="735.0" y="893.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es función de la</tspan><tspan x="735.0" dy="16">hCG</tspan></text><text x="885.0" y="893.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no reduce el flujo</tspan><tspan x="885.0" dy="16">uteroplacentario</tspan></text><rect x="40.0" y="793.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="954.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="982.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1004.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• HPL: induce resistencia periférica a la insulina, eleva la glucemia posprandial materna y estimula la lipólisis; deja glucosa y aminoácidos al feto incluso en</tspan><tspan x="58.0" dy="18">   el ayuno.</tspan><tspan x="58.0" dy="18">• La hCG mantiene el cuerpo lúteo en las primeras semanas; la progesterona, con ayuda de la relajina, relaja el músculo liso uterino.</tspan><tspan x="58.0" dy="18">• El HPL no tiene acción autoinmune ni reduce el flujo uteroplacentario.</tspan><tspan x="58.0" dy="18">• Alerta: por su efecto máximo después de las 24 semanas, el tamizaje de diabetes gestacional es a las 24-28 semanas y la insulina de la gestante</tspan><tspan x="58.0" dy="18">   diabética aumenta en el 2.º y 3.er trimestre.</tspan></text><text x="58.0" y="1116.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Williams Obstetricia, 26.ª ed. (2022); Guyton y Hall, Tratado de Fisiología Médica, 14.ª ed. (2021); ADA, Standards of Care in Diabetes 2026 (Diabetes Care 2026;49</tspan><tspan x="58.0" dy="15">Suppl 1).</tspan></text></svg>