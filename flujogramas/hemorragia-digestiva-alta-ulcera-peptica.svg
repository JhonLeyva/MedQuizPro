<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="633" viewBox="0 0 1000 633" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Hemorragia digestiva alta por úlcera péptica"><title>Hemorragia digestiva alta por úlcera péptica</title><rect x="0.75" y="0.75" width="998.5" height="631.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16" y="16" width="968" height="68" rx="10" fill="#0f766e"/><text x="36" y="57.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170" y1="40.0" x2="170" y2="60.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="46.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="603"><tspan x="184.0" dy="0">GASTROENTEROLOGÍA ENAM: HEMORRAGIA DIGESTIVA ALTA POR ÚLCERA</tspan><tspan x="184.0" dy="16">PÉPTICA</tspan></text><rect x="807.1" y="38.0" width="156.9" height="24" rx="12" fill="#134e4a"/><text x="885.5" y="54.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="141"><tspan x="885.5" dy="0">GASTROENTEROLOGÍA</tspan></text><rect x="190.0" y="102.0" width="620" height="67.0" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="500.0" y="130.5" font-size="14.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Varón de 45 años con epigastralgia que calma con alimentos</tspan></text><text x="500.0" y="153.0" font-size="12" font-weight="400" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="592"><tspan x="500.0" dy="0">Melena desde ayer</tspan></text><line x1="500.0" y1="169.0" x2="500.0" y2="188.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,187.0 505.0,187.0 500.0,195.0" fill="#0f766e"/><rect x="40.0" y="195.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="62.0" cy="219.0" r="13" fill="#0f766e"/><text x="62.0" y="224.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><rect x="74.0" y="195.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="88.0" y="222.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="88.0" dy="0">Estabilizar</tspan></text><text x="88.0" y="245.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="88.0" dy="0">ABC, 2 vías EV, cristaloides;</tspan><tspan x="88.0" dy="17">transfundir si Hb &lt; 7 g/dL</tspan></text><line x1="335.0" y1="236.5" x2="345.0" y2="236.5" stroke="#0f766e" stroke-width="2"/><polygon points="344.0,231.5 344.0,241.5 352.0,236.5" fill="#0f766e"/><rect x="354.0" y="195.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="376.0" cy="219.0" r="13" fill="#0f766e"/><text x="376.0" y="224.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="376.0" dy="0">2</tspan></text><rect x="388.0" y="195.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="402.0" y="222.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="402.0" dy="0">Estratificar</tspan></text><text x="402.0" y="245.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="402.0" dy="0">Escala de Glasgow-Blatchford</tspan></text><line x1="649.0" y1="236.5" x2="659.0" y2="236.5" stroke="#0f766e" stroke-width="2"/><polygon points="658.0,231.5 658.0,241.5 666.0,236.5" fill="#0f766e"/><rect x="668.0" y="195.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="690.0" cy="219.0" r="13" fill="#0f766e"/><text x="690.0" y="224.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="690.0" dy="0">3</tspan></text><rect x="702.0" y="195.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="716.0" y="222.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="716.0" dy="0">IBP EV</tspan></text><text x="716.0" y="245.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="716.0" dy="0">Omeprazol o esomeprazol en bolo</tspan><tspan x="716.0" dy="17">e infusión</tspan></text><line x1="500.0" y1="278.0" x2="500.0" y2="297.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,296.0 505.0,296.0 500.0,304.0" fill="#0f766e"/><rect x="197.0" y="304.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="219.0" cy="328.0" r="13" fill="#0f766e"/><text x="219.0" y="333.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="219.0" dy="0">4</tspan></text><rect x="231.0" y="304.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="245.0" y="331.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="245.0" dy="0">Endoscopia</tspan></text><text x="245.0" y="354.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="245.0" dy="0">En las primeras 24 h:</tspan><tspan x="245.0" dy="17">diagnóstica y terapéutica</tspan></text><line x1="492.0" y1="345.5" x2="502.0" y2="345.5" stroke="#0f766e" stroke-width="2"/><polygon points="501.0,340.5 501.0,350.5 509.0,345.5" fill="#0f766e"/><rect x="511.0" y="304.0" width="292" height="83.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.8"/><circle cx="533.0" cy="328.0" r="13" fill="#0f766e"/><text x="533.0" y="333.0" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="533.0" dy="0">5</tspan></text><rect x="545.0" y="304.0" width="258" height="83.0" rx="10" fill="none" stroke="none" stroke-width="0"/><text x="559.0" y="331.5" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="230"><tspan x="559.0" dy="0">Erradicar</tspan></text><text x="559.0" y="354.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="230"><tspan x="559.0" dy="0">Buscar y tratar Helicobacter</tspan><tspan x="559.0" dy="17">pylori</tspan></text><line x1="500.0" y1="387.0" x2="500.0" y2="406.0" stroke="#0f766e" stroke-width="2"/><polygon points="495.0,405.0 505.0,405.0 500.0,413.0" fill="#0f766e"/><rect x="90.0" y="413.0" width="820" height="67.5" rx="10" fill="#134e4a" stroke="#134e4a" stroke-width="1.5"/><text x="500.0" y="439.0" font-size="12" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="792"><tspan x="500.0" dy="0">DIAGNÓSTICO</tspan></text><text x="500.0" y="464.5" font-size="15" font-weight="400" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="792"><tspan x="500.0" dy="0">Úlcera gastroduodenal sangrante</tspan></text><rect x="40" y="506.5" width="920" height="109.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="534.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="556.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Dolor epigástrico que calma con la ingesta es típico de úlcera duodenal.</tspan><tspan x="58.0" dy="18">• Melena = sangrado digestivo alto (por encima del ángulo de Treitz).</tspan></text><text x="58.0" y="596.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACG 2021 Upper GI Bleeding Guideline · ESGE 2021 · Sleisenger &amp; Fordtran</tspan></text></svg>
