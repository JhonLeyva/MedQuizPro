fffff" text-anchor="middle" data-max="0">3</text><text x="4" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">D</text><text x="236" y="12" font-size="11" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">I</text></g></g><rect x="340.0" y="649.0" width="620.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="358.0" cy="664.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="358.0" y="668.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="358.0" dy="0">1</tspan></text><text x="376.0" y="669.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="576"><tspan x="376.0" dy="0">Abre los ojos solo cuando se le habla: 3.</tspan></text><rect x="340.0" y="687.0" width="620.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="358.0" cy="702.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="358.0" y="706.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="358.0" dy="0">2</tspan></text><text x="376.0" y="707.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="576"><tspan x="376.0" dy="0">Dice palabras sin sentido para la pregunta: 3.</tspan></text><rect x="340.0" y="725.0" width="620.0" height="31.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><circle cx="358.0" cy="740.5" r="9.5" fill="#ea580c" stroke="none" stroke-width="0"/><text x="358.0" y="744.5" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="358.0" dy="0">3</tspan></text><text x="376.0" y="745.0" font-size="12" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="576"><tspan x="376.0" dy="0">Ante el dolor dobla los brazos de forma anormal: 3.</tspan></text><text x="40.0" y="1063.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="1073.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1095.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="1076.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="303.8" y="1095.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Vía aérea y referir a III-1</tspan></text><text x="491.2" y="1095.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Rx de cráneo</tspan></text><text x="678.8" y="1095.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Alta con signos de alarma</tspan></text><text x="866.2" y="1095.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Observar 24 h sin referir</tspan></text><rect x="40.0" y="1110.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1110.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1131.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="1131.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">Ninguno</tspan></text><text x="491.2" y="1131.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">No descarta lesiones</tspan></text><text x="678.8" y="1131.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Inseguro</tspan></text><text x="866.2" y="1131.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Retrasa la TC y la cirugía</tspan></text><rect x="40.0" y="1073.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1168.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1196.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1218.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Glasgow 3 + 3 + 3 = 9: TCE moderado.</tspan><tspan x="58.0" dy="18">• Todo TCE moderado o grave necesita TC y neurocirugía: asegurar la vía aérea, estabilizar y referir al hospital III-1.</tspan><tspan x="58.0" dy="18">• La Rx de cráneo no descarta lesiones; ni el alta ni la observación sin referir son seguras.</tspan></text><text x="58.0" y="1276.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ATLS 11.ª ed. (2025); Brain Trauma Foundation (2016).</tspan></text></svg>