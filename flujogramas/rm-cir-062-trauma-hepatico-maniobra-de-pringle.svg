<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="883" viewBox="0 0 1000 883" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La maniobra de Pringle ocluye de forma transitoria el ligamento hepatoduodenal"><title>La maniobra de Pringle ocluye de forma transitoria el ligamento hepatoduodenal</title><rect x="0.75" y="0.75" width="998.5" height="882.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Trauma hepático · maniobra de Pringle</tspan></text><rect x="429.0" y="32.0" width="86.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="472.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="70"><tspan x="472.2" dy="0">CIRUGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Maniobra de Pringle</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Se pinza con los dedos o un clamp atraumático el borde libre del epiplón menor.</tspan><tspan x="58.0" dy="17">Interrumpe el flujo de entrada al hígado.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Herida de bala con lesión hepática grado II</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Sangrado hepático durante la laparotomía.</tspan><tspan x="640.0" dy="16">¿En qué consiste la maniobra de Pringle?</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#94a3b8"/><line x1="500.0" y1="349.0" x2="500.0" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="379.0" x2="811.3" y2="379.0" stroke="#94a3b8" stroke-width="2"/><line x1="188.7" y1="379.0" x2="188.7" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="183.7,407.0 193.7,407.0 188.7,415.0" fill="#94a3b8"/><line x1="500.0" y1="379.0" x2="500.0" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,407.0 505.0,407.0 500.0,415.0" fill="#94a3b8"/><line x1="811.3" y1="379.0" x2="811.3" y2="408.0" stroke="#94a3b8" stroke-width="2"/><polygon points="806.3,407.0 816.3,407.0 811.3,415.0" fill="#94a3b8"/><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#0f766e"/><line x1="500.0" y1="349.0" x2="500.0" y2="379.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="379.0" x2="500.0" y2="408.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,407.0 505.0,407.0 500.0,415.0" fill="#0f766e"/><rect x="135.6" y="388.0" width="106.2" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="188.7" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="188.7" dy="0">Solo la vena porta</tspan></text><rect x="393.7" y="388.0" width="212.6" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="500.0" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">Ligamento hepatoduodenal (este caso)</tspan></text><rect x="723.5" y="388.0" width="175.7" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="811.3" y="400.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="811.3" dy="0">Sangrado persiste tras el clamp</tspan></text><polygon points="240.0,320.0 266.0,291.0 734.0,291.0 760.0,320.0 734.0,349.0 266.0,349.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="320.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="325.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="324.5" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">¿Qué se ocluye al pinzar el pedículo hepático?</tspan></text><rect x="40.0" y="415.0" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="188.7" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">NO ES LA MANIOBRA</tspan></text><text x="188.7" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="188.7" dy="0">Deja pasar la arteria hepática</tspan><tspan x="188.7" dy="17">No controla el sangrado arterial</tspan></text><rect x="351.3" y="415.0" width="297.3" height="90.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="500.0" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">PRINGLE</tspan></text><text x="500.0" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="269"><tspan x="500.0" dy="0">Porta + arteria hepática + colédoco</tspan><tspan x="500.0" dy="17">Hasta 60 min; si cede: sangrado de entrada</tspan></text><rect x="662.7" y="415.0" width="297.3" height="90.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="811.3" y="443.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">SANGRADO DE SALIDA</tspan></text><text x="811.3" y="466.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="269"><tspan x="811.3" dy="0">Venas suprahepáticas o cava retrohepática</tspan><tspan x="811.3" dy="17">Empaquetar y control de daños</tspan></text><text x="40.0" y="545.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="555.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="595.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="586.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Ligadura de arteria</tspan><tspan x="285.0" dy="17">hepática común</tspan></text><text x="435.0" y="586.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Oclusión de la vena</tspan><tspan x="435.0" dy="17">porta</tspan></text><rect x="513.0" y="558.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="578.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Oclusión del</tspan><tspan x="585.0" dy="17">ligamento</tspan><tspan x="585.0" dy="17">hepatoduodenal</tspan></text><text x="735.0" y="586.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Ligadura del</tspan><tspan x="735.0" dy="17">ligamento redondo</tspan></text><text x="885.0" y="586.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Taponamiento</tspan><tspan x="885.0" dy="17">hepático</tspan></text><rect x="40.0" y="626.5" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="626.5" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="663.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿En qué consiste?</tspan></text><text x="285.0" y="655.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: la ligadura arterial</tspan><tspan x="285.0" dy="16">no es la maniobra</tspan></text><text x="435.0" y="655.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: dejaría pasar la</tspan><tspan x="435.0" dy="16">arteria y el colédoco</tspan></text><text x="585.0" y="655.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: pinzar el pedículo</tspan><tspan x="585.0" dy="16">hepático</tspan></text><text x="735.0" y="647.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: el ligamento</tspan><tspan x="735.0" dy="16">redondo no lleva el</tspan><tspan x="735.0" dy="16">flujo principal</tspan></text><text x="885.0" y="655.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es otro recurso, no</tspan><tspan x="885.0" dy="16">una oclusión</tspan></text><rect x="40.0" y="555.5" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="716.5" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="744.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="766.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• El ligamento hepatoduodenal contiene la tríada portal: vena porta, arteria hepática propia y colédoco.</tspan><tspan x="58.0" dy="18">• Se tolera hasta 60 min en hígado sano; en la práctica 15 min de oclusión y 5 de descanso.</tspan><tspan x="58.0" dy="18">• Si el sangrado persiste: lesión de venas suprahepáticas o cava retrohepática (sangrado «de salida»): empaquetar y control de daños.</tspan><tspan x="58.0" dy="18">• Lesión grado IV-V (AAST) con inestabilidad: cirugía de control de daños y reintervención.</tspan></text><text x="58.0" y="842.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ATLS, 11.ª ed. (2025); WSES, trauma hepático (2020); Schwartz Principios de Cirugía 11.ª ed.</tspan></text></svg>