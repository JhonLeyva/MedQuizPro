<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="993" viewBox="0 0 1000 993" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Paciente con lupus que desea embarazarse: debe tener al menos 6 meses de enfermedad inactiva antes de concebir (manteniendo hidroxicloroquina)"><title>Paciente con lupus que desea embarazarse: debe tener al menos 6 meses de enfermedad inactiva antes de concebir (manteniendo hidroxicloroquina)</title><rect x="0.75" y="0.75" width="998.5" height="991.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Lupus y embarazo · consulta preconcepcional</tspan></text><rect x="472.7" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="559.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="559.9" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Lupus y embarazo</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Embarazarse con el lupus activo aumenta brotes, preeclampsia, pérdida fetal y parto</tspan><tspan x="58.0" dy="17">pretérmino.</tspan><tspan x="58.0" dy="17">Se recomienda planificar con ≥ 6 meses de enfermedad inactiva y fármacos compatibles.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Paciente con LES en tratamiento</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Sin complicaciones sistémicas.</tspan><tspan x="640.0" dy="16">Consulta preconcepcional: desea embarazarse.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PLAN PARA EMBARAZARSE CON LUPUS</tspan></text><line x1="216.3" y1="295.0" x2="477.0" y2="295.0" stroke="#99f6e4" stroke-width="6"/><line x1="523.0" y1="295.0" x2="783.7" y2="295.0" stroke="#99f6e4" stroke-width="6"/><circle cx="193.3" cy="295.0" r="22" fill="#ea580c" stroke="#ea580c" stroke-width="3"/><text x="193.3" y="299.5" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="38"><tspan x="193.3" dy="0">−6 m</tspan></text><rect x="45.0" y="329.0" width="296.7" height="59.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="193.3" y="349.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="285"><tspan x="193.3" dy="0">Lupus inactivo</tspan></text><text x="193.3" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="285"><tspan x="193.3" dy="0">Al menos 6 meses sin actividad</tspan></text><rect x="161.1" y="377.0" width="64.5" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="193.3" y="392.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="193.3" dy="0">◆ CLAVE</tspan></text><circle cx="500.0" cy="295.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="299.5" font-size="11.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="500.0" dy="0">−3 m</tspan></text><rect x="351.7" y="329.0" width="296.7" height="59.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="349.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="285"><tspan x="500.0" dy="0">Cambiar fármacos</tspan></text><text x="500.0" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="285"><tspan x="500.0" dy="0">Azatioprina en vez de micofenolato o MTX</tspan></text><circle cx="806.7" cy="295.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="806.7" y="299.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="806.7" dy="0">Siempre</tspan></text><rect x="658.3" y="329.0" width="296.7" height="59.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="806.7" y="349.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="285"><tspan x="806.7" dy="0">Hidroxicloroquina</tspan></text><text x="806.7" y="366.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="285"><tspan x="806.7" dy="0">No suspender</tspan></text><line x1="216.3" y1="436.0" x2="477.0" y2="436.0" stroke="#99f6e4" stroke-width="6"/><line x1="523.0" y1="436.0" x2="783.7" y2="436.0" stroke="#99f6e4" stroke-width="6"/><circle cx="193.3" cy="436.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="193.3" y="440.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="193.3" dy="0">Antes</tspan></text><rect x="45.0" y="470.0" width="296.7" height="59.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="193.3" y="490.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="285"><tspan x="193.3" dy="0">Anticuerpos</tspan></text><text x="193.3" y="507.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="285"><tspan x="193.3" dy="0">Anti-Ro/La y antifosfolípidos</tspan></text><circle cx="500.0" cy="436.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="440.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="500.0" dy="0">12 sem</tspan></text><rect x="351.7" y="470.0" width="296.7" height="59.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="500.0" y="490.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="285"><tspan x="500.0" dy="0">Aspirina</tspan></text><text x="500.0" y="507.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="285"><tspan x="500.0" dy="0">Prevención de preeclampsia</tspan></text><circle cx="806.7" cy="436.0" r="22" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="806.7" y="440.5" font-size="9.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="38"><tspan x="806.7" dy="0">Gesta</tspan></text><rect x="658.3" y="470.0" width="296.7" height="59.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/><text x="806.7" y="490.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="285"><tspan x="806.7" dy="0">Control conjunto</tspan></text><text x="806.7" y="507.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="285"><tspan x="806.7" dy="0">Reumatología + alto riesgo obstétrico</tspan></text><rect x="40.0" y="561.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="587.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Seis meses de enfermedad inactiva</tspan></text><text x="60.0" y="606.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Con hidroxicloroquina y fármacos compatibles con el embarazo.</tspan></text><text x="40.0" y="673.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="683.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="722.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="686.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="714.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Seis meses de</tspan><tspan x="285.0" dy="17">enfermedad inactiva</tspan></text><text x="435.0" y="714.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Que suspenda la</tspan><tspan x="435.0" dy="17">hidroxicloroquina</tspan></text><text x="585.0" y="714.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Que aumente la</tspan><tspan x="585.0" dy="17">dosis de corticoides</tspan></text><text x="735.0" y="714.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Preferible que no</tspan><tspan x="735.0" dy="17">salga gestando</tspan></text><text x="885.0" y="705.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Que suspenda</tspan><tspan x="885.0" dy="17">todos sus</tspan><tspan x="885.0" dy="17">medicamentos</tspan></text><rect x="40.0" y="754.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="754.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="791.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Recomendación?</tspan></text><text x="285.0" y="791.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: ≥ 6 meses inactiva</tspan></text><text x="435.0" y="791.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: debe mantenerse</tspan></text><text x="585.0" y="783.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: no se sube sin</tspan><tspan x="585.0" dy="16">brote</tspan></text><text x="735.0" y="775.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: puede</tspan><tspan x="735.0" dy="16">embarazarse si</tspan><tspan x="735.0" dy="16">planifica</tspan></text><text x="885.0" y="791.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: riesgo de brote</tspan></text><rect x="40.0" y="683.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="844.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="872.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="894.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Mantener la hidroxicloroquina (reduce brotes y bloqueo cardíaco congénito).</tspan><tspan x="58.0" dy="18">• Cambiar micofenolato, metotrexato o ciclofosfamida por azatioprina meses antes; prednisona a la menor dosis.</tspan><tspan x="58.0" dy="18">• Pedir anti-Ro/La y antifosfolípidos; aspirina a dosis baja desde las 12 semanas.</tspan></text><text x="58.0" y="952.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: EULAR, salud reproductiva en enfermedades reumáticas (2017; act. 2024); ACR (2020).</tspan></text></svg>