t-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="354.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Claudicación limitante pese a tratamiento médico: ¿cómo es</tspan><tspan x="519.0" dy="17">la lesión?</tspan></text><rect x="40.0" y="459.0" width="453.0" height="73.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="487.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">BYPASS CON VENA SAFENA</tspan></text><text x="266.5" y="510.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Femoropoplíteo sobre la rodilla</tspan></text><rect x="507.0" y="459.0" width="453.0" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="487.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Angioplastia</tspan></text><text x="733.5" y="510.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">± stent</tspan></text><text x="40.0" y="572.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="584.5" width="920.0" height="358.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="598.5" width="236.1" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="174.0" y="618.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="174.0" dy="0">CLASIFICACIÓN DE FONTAINE</tspan></text><text x="308.1" y="618.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="634"><tspan x="308.1" dy="0">Gradúa la enfermedad arterial periférica por los síntomas.</tspan></text><rect x="56.0" y="658.5" width="168.0" height="133.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="659.1" width="166.8" height="82.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="140.0" y="686.5" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="152"><tspan x="140.0" dy="0">I</tspan></text><text x="140.0" y="706.5" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="144"><tspan x="140.0" dy="0">Sin síntomas</tspan></text><circle cx="72.0" cy="750.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="754.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="82.0" dy="0">Pulsos bajos, ITB &lt; 0,9</tspan></text><rect x="236.0" y="658.5" width="168.0" height="133.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="236.6" y="659.1" width="166.8" height="82.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="320.0" y="686.5" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="152"><tspan x="320.0" dy="0">IIA</tspan></text><text x="320.0" y="706.5" font-size="14" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="144"><tspan x="320.0" dy="0">Claudicación &gt; 200</tspan><tspan x="320.0" dy="19">m</tspan></text><circle cx="252.0" cy="750.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="262.0" y="754.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="262.0" dy="0">No limita</tspan></text><rect x="416.0" y="658.5" width="168.0" height="133.0" rx="10" fill="#fffbeb" stroke="#ea580c" stroke-width="2.4"/><rect x="417.2" y="659.7" width="165.6" height="82.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="500.0" y="686.5" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">IIB</tspan></text><text x="500.0" y="706.5" font-size="14" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="144"><tspan x="500.0" dy="0">Claudicación &lt; 200</tspan><tspan x="500.0" dy="19">m</tspan></text><circle cx="432.0" cy="750.5" r="3" fill="#ea580c" stroke="none" stroke-width="0"/><text x="442.0" y="754.5" font-size="11.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="130"><tspan x="442.0" dy="0">Limita la vida diaria</tspan></text><rect x="454.6" y="647.5" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="500.0" y="662.5" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="500.0" dy="0">◆ ESTE CASO</tspan></text><rect x="596.0" y="658.5" width="168.0" height="133.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="596.6" y="659.1" width="166.8" height="82.0" rx="9" fill="#fee2e2" stroke="none" stroke-width="0"/><text x="680.0" y="686.5" font-size="11" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="152"><tspan x="680.0" dy="0">III</tspan></text><text x="680.0" y="706.5" font-size="14" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="middle" data-max="144"><tspan x="680.0" dy="0">Dolor en reposo</tspan></text><circle cx="612.0" cy="750.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="622.0" y="754.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="622.0" dy="0">De noche, mejora al</tspan><tspan x="622.0" dy="16">colgar la pierna</tspan></text><rect x="776.0" y="658.5" width="168.0" height="133.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="776.6" y="659.1" width="166.8" height="82.0" rx="9" fill="#fecaca" stroke="none" stroke-width="0"/><text x="860.0" y="686.5" font-size="11" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="middle" data-max="152"><tspan x="860.0" dy="0">IV</tspan></text><text x="860.0" y="706.5" font-size="14" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="middle" data-max="144"><tspan x="860.0" dy="0">Úlcera o gangrena</tspan></text><circle cx="792.0" cy="750.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="802.0" y="754.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="130"><tspan x="802.0" dy="0">Riesgo de amputación</tspan></text><text x="56.0" y="821.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">POR QUÉ EL CASO CAE AQUÍ</tspan></text><rect x="56.0" y="830.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="845.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="845.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Claudicación que limita pese al tratamiento</tspan></text><rect x="56.0" y="852.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="867.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="867.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Sin dolor en reposo ni úlceras</tspan></text><rect x="56.0" y="889.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="912.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Tratamiento médico completo y bypass con safena por la lesión larga.</tspan></text><text x="40.0" y="982.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="992.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="1032.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="995.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="1015.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Bypass</tspan><tspan x="285.0" dy="17">femoropoplíteo con</tspan><tspan x="285.0" dy="17">vena safena</tspan></text><text x="435.0" y="1015.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Bypass</tspan><tspan x="435.0" dy="17">femoropoplíteo con</tspan><tspan x="435.0" dy="17">prótesis</tspan></text><text x="585.0" y="1023.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Angioplastía con</tspan><tspan x="585.0" dy="17">balón</tspan></text><text x="735.0" y="1032.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Cilostazol</tspan></text><text x="885.0" y="1023.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Simpatectomía</tspan><tspan x="885.0" dy="17">lumbar</tspan></text><rect x="40.0" y="1063.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="1063.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1092.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Primera elección?</tspan></text><text x="285.0" y="1084.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: lesión larga, la vena</tspan><tspan x="285.0" dy="16">dura más</tspan></text><text x="435.0" y="1084.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Alternativa si no hay</tspan><tspan x="435.0" dy="16">vena</tspan></text><text x="585.0" y="1084.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Mejor en lesiones</tspan><tspan x="585.0" dy="16">cortas</tspan></text><text x="735.0" y="1084.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Ya falló el tratamiento</tspan><tspan x="735.0" dy="16">médico</tspan></text><text x="885.0" y="1092.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: obsoleta</tspan></text><rect x="40.0" y="992.5" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1137.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1165.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1187.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Todos: dejar de fumar, estatina de alta intensidad, antiagregante y ejercicio.</tspan><tspan x="58.0" dy="18">• Oclusiones largas de la femoral: bypass con vena safena (dura más que la prótesis); cortas: angioplastia.</tspan><tspan x="58.0" dy="18">• Cilostazol mejora la distancia de marcha; la simpatectomía ya no se usa.</tspan></text><text x="58.0" y="1245.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ESC, enfermedades arteriales periféricas y aórticas (2024); ESVS, isquemia crónica que amenaza la extremidad (2019).</tspan></text></svg>