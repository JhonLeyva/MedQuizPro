"middle" data-max="345"><tspan x="773.5" dy="0">Caliente y húmedo</tspan></text><text x="773.5" y="390.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Diurético y vasodilatador</tspan></text><rect x="40.0" y="426.0" width="150.0" height="76.0" rx="10" fill="#e0f2f1" stroke="#0f766e" stroke-width="1.5"/><text x="115.0" y="468.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="115.0" dy="0">Frío (hipoperfusión)</tspan></text><rect x="202.0" y="426.0" width="373.0" height="76.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="203.0" y="427.0" width="6.0" height="74.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="388.5" y="455.6" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Frío y seco</tspan></text><text x="388.5" y="478.6" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="345"><tspan x="388.5" dy="0">Volumen con cautela</tspan></text><rect x="587.0" y="426.0" width="373.0" height="76.0" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="773.5" y="455.6" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Frío y húmedo: este caso</tspan></text><text x="773.5" y="478.6" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="345"><tspan x="773.5" dy="0">Noradrenalina; luego dobutamina</tspan></text><rect x="728.1" y="491.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="773.5" y="506.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="773.5" dy="0">◆ ESTE CASO</tspan></text><text x="40.0" y="552.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="562.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="584.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="565.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="584.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Noradrenalina</tspan></text><text x="435.0" y="584.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Cloruro de sodio</tspan></text><text x="585.0" y="584.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Nitroprusiato</tspan></text><text x="735.0" y="584.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Plasma</tspan></text><text x="885.0" y="584.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Nitroglicerina</tspan></text><rect x="40.0" y="599.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="599.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="636.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Tratamiento inicial?</tspan></text><text x="285.0" y="620.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: vasopresor de</tspan><tspan x="285.0" dy="16">primera línea en shock</tspan><tspan x="285.0" dy="16">cardiogénico</tspan></text><text x="435.0" y="628.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: empeora el edema</tspan><tspan x="435.0" dy="16">pulmonar</tspan></text><text x="585.0" y="620.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: vasodilatador,</tspan><tspan x="585.0" dy="16">contraindicado con PA</tspan><tspan x="585.0" dy="16">baja</tspan></text><text x="735.0" y="628.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: empeora el edema</tspan><tspan x="735.0" dy="16">pulmonar</tspan></text><text x="885.0" y="620.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: vasodilatador,</tspan><tspan x="885.0" dy="16">contraindicado con PA</tspan><tspan x="885.0" dy="16">baja</tspan></text><rect x="40.0" y="562.0" width="920.0" height="103.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="689.0" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="717.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="739.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Perfil hemodinámico: frío (hipoperfusión: frialdad, llenado lento, hipotensión) y húmedo (congestión: yugular, crepitantes).</tspan><tspan x="58.0" dy="18">• Primera línea: noradrenalina para sostener la presión de perfusión; menos arritmias que la dopamina (SOAP II). Luego dobutamina si persiste la</tspan><tspan x="58.0" dy="18">   hipoperfusión.</tspan><tspan x="58.0" dy="18">• Cristaloides y plasma empeoran el edema pulmonar; nitroprusiato y nitroglicerina están contraindicados con PA sistólica menor de 90.</tspan><tspan x="58.0" dy="18">• Buscar el desencadenante (isquemia, arritmia, infección); soporte circulatorio mecánico si es refractario; derivar a cuidados intensivos.</tspan></text><text x="58.0" y="833.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ESC, Guías de insuficiencia cardíaca (2021, actualización 2023); AHA/ACC/HFSA, insuficiencia cardíaca (2022); Harrison, 21.ª ed. (2022).</tspan></text></svg>