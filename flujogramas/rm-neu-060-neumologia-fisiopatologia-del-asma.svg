<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1143" viewBox="0 0 1000 1143" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El mastocito cargado de IgE se degranula con el alérgeno y desencadena la broncoconstricción aguda del asma"><title>El mastocito cargado de IgE se degranula con el alérgeno y desencadena la broncoconstricción aguda del asma</title><rect x="0.75" y="0.75" width="998.5" height="1141.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Neumología · fisiopatología del asma</tspan></text><rect x="419.4" y="32.0" width="114.9" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="476.9" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="99"><tspan x="476.9" dy="0">NEUMOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Asma alérgica</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Hipersensibilidad tipo I con inflamación tipo 2.</tspan><tspan x="58.0" dy="17">Las células dendríticas presentan el alérgeno y los linfocitos Th2 producen IL-4, IL-5 e</tspan><tspan x="58.0" dy="17">IL-13.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de fisiopatología</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué célula desencadena la reacción</tspan><tspan x="640.0" dy="16">broncoconstrictora aguda?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">FASES DE LA REACCIÓN ALÉRGICA EN EL ASMA</tspan></text><line x1="290.0" y1="291.0" x2="290.0" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="290.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="290.0" dy="0">0</tspan></text><line x1="371.2" y1="291.0" x2="371.2" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="371.2" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="371.2" dy="0">1</tspan></text><line x1="452.5" y1="291.0" x2="452.5" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="452.5" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="452.5" dy="0">2</tspan></text><line x1="533.8" y1="291.0" x2="533.8" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="533.8" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="533.8" dy="0">3</tspan></text><line x1="615.0" y1="291.0" x2="615.0" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="615.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="615.0" dy="0">4</tspan></text><line x1="696.2" y1="291.0" x2="696.2" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="696.2" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="696.2" dy="0">5</tspan></text><line x1="777.5" y1="291.0" x2="777.5" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="777.5" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="777.5" dy="0">6</tspan></text><line x1="858.8" y1="291.0" x2="858.8" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="858.8" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="858.8" dy="0">7</tspan></text><line x1="940.0" y1="291.0" x2="940.0" y2="409.0" stroke="#e2e8f0" stroke-width="1"/><text x="940.0" y="287.0" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="30"><tspan x="940.0" dy="0">8</tspan></text><text x="940.0" y="273.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="end" data-max="60"><tspan x="940.0" dy="0">horas</tspan></text><rect x="40.0" y="295.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="311.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Degranulación del mastocito</tspan></text><text x="48.0" y="326.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Histamina, triptasa, leucotrienos y PGD2</tspan></text><rect x="290.0" y="303.0" width="81.2" height="22.0" rx="6" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="48.0" y="349.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Broncoconstricción, edema y moco</tspan></text><text x="48.0" y="364.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Fase temprana: minutos</tspan></text><rect x="290.0" y="341.0" width="162.5" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><rect x="40.0" y="371.0" width="920.0" height="38.0" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="48.0" y="387.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Eosinófilos, neutrófilos y linfocitos T</tspan></text><text x="48.0" y="402.0" font-size="10" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="236"><tspan x="48.0" dy="0">Fase tardía: inflamación e hiperreactividad</tspan></text><rect x="615.0" y="379.0" width="325.0" height="22.0" rx="6" fill="#0f766e" stroke="none" stroke-width="1.5"/><line x1="330.6" y1="293.0" x2="330.6" y2="415.0" stroke="#b91c1c" stroke-width="2.6"/><rect x="281.1" y="415.0" width="99.1" height="22.0" rx="11" fill="#b91c1c" stroke="none" stroke-width="1.5"/><text x="330.6" y="430.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="330.6" dy="0">Fase temprana</tspan></text><rect x="40.0" y="461.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="487.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Alérgeno + IgE en el mastocito = broncoconstricción aguda</tspan></text><text x="60.0" y="506.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Macrófagos, dendríticas y linfocitos T participan antes o después, pero no la desencadenan.</tspan></text><text x="40.0" y="567.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÉLULAS DEL ASMA ALÉRGICA Y SU PAPEL</tspan></text><rect x="40.0" y="579.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="598.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="144"><tspan x="50.0" dy="0">Célula</tspan></text><text x="210.0" y="598.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="364"><tspan x="210.0" dy="0">Papel</tspan></text><text x="590.0" y="598.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="364"><tspan x="590.0" dy="0">¿Desencadena lo agudo?</tspan></text><rect x="40.0" y="608.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="627.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="144"><tspan x="50.0" dy="0">Mastocito</tspan></text><text x="210.0" y="627.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="364"><tspan x="210.0" dy="0">Se degranula con IgE y alérgeno: histamina, triptasa, leucotrienos</tspan><tspan x="210.0" dy="15">y PGD2</tspan></text><text x="590.0" y="627.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="364"><tspan x="590.0" dy="0">Sí</tspan></text><rect x="100.6" y="619.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="146.0" y="634.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="146.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="652.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="671.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="144"><tspan x="50.0" dy="0">Célula dendrítica</tspan></text><text x="210.0" y="671.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="364"><tspan x="210.0" dy="0">Presenta el alérgeno al linfocito Th2</tspan></text><text x="590.0" y="671.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="364"><tspan x="590.0" dy="0">No</tspan></text><rect x="40.0" y="681.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="700.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="144"><tspan x="50.0" dy="0">Linfocito Th2</tspan></text><text x="210.0" y="700.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="364"><tspan x="210.0" dy="0">Produce IL-4, IL-5 e IL-13; favorece la IgE y los eosinófilos</tspan></text><text x="590.0" y="700.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="364"><tspan x="590.0" dy="0">No</tspan></text><rect x="40.0" y="710.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="729.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="144"><tspan x="50.0" dy="0">Macrófago</tspan></text><text x="210.0" y="729.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="364"><tspan x="210.0" dy="0">Presenta el antígeno</tspan></text><text x="590.0" y="729.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="364"><tspan x="590.0" dy="0">No</tspan></text><rect x="40.0" y="739.0" width="920.0" height="44.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="758.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="144"><tspan x="50.0" dy="0">Neutrófilo</tspan></text><text x="210.0" y="758.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="364"><tspan x="210.0" dy="0">Predomina en el asma grave no atópica y en exacerbaciones</tspan><tspan x="210.0" dy="15">infecciosas</tspan></text><text x="590.0" y="758.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="364"><tspan x="590.0" dy="0">No</tspan></text><text x="40.0" y="823.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="833.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="855.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="855.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Macrófagos</tspan></text><rect x="363.0" y="836.0" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="855.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Mastocitos</tspan></text><text x="585.0" y="855.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Células dendríticas</tspan></text><text x="735.0" y="855.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Linfocitos T</tspan></text><text x="885.0" y="855.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Neutrófilos</tspan></text><rect x="40.0" y="870.0" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="870.0" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="907.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Célula</tspan><tspan x="54.0" dy="16">desencadenante?</tspan></text><text x="285.0" y="899.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: presenta el</tspan><tspan x="285.0" dy="16">antígeno, no</tspan><tspan x="285.0" dy="16">desencadena lo agudo</tspan></text><text x="435.0" y="891.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: se degranula con el</tspan><tspan x="435.0" dy="16">alérgeno y libera</tspan><tspan x="435.0" dy="16">histamina y</tspan><tspan x="435.0" dy="16">leucotrienos</tspan></text><text x="585.0" y="899.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: presentan el</tspan><tspan x="585.0" dy="16">alérgeno al linfocito</tspan><tspan x="585.0" dy="16">Th2</tspan></text><text x="735.0" y="891.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: orquestan la</tspan><tspan x="735.0" dy="16">reacción, no son el</tspan><tspan x="735.0" dy="16">desencadenante</tspan><tspan x="735.0" dy="16">directo</tspan></text><text x="885.0" y="899.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: dominan en el</tspan><tspan x="885.0" dy="16">asma grave no atópica</tspan><tspan x="885.0" dy="16">y en la fase tardía</tspan></text><rect x="40.0" y="833.0" width="920.0" height="119.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="976.0" width="920.0" height="149.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1004.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1026.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La IgE se fija a los receptores de los mastocitos de la mucosa; el alérgeno la entrecruza y causa la degranulación inmediata.</tspan><tspan x="58.0" dy="18">• Se liberan histamina, triptasa, leucotrienos C4, D4 y E4 y prostaglandina D2: contracción del músculo liso, edema y moco en minutos (fase temprana).</tspan><tspan x="58.0" dy="18">• Fase tardía a las 4 a 8 horas: eosinófilos, neutrófilos y linfocitos T sostienen la hiperreactividad. Macrófagos y dendríticas solo presentan el antígeno.</tspan><tspan x="58.0" dy="18">• Alerta: omalizumab (anti IgE) y montelukast (antileucotrieno) actúan sobre esta vía.</tspan></text><text x="58.0" y="1102.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: GINA, Global Strategy for Asthma Management and Prevention, actualización 2024 (ginasthma.org); Harrison, 21.ª ed. (2022).</tspan></text></svg>