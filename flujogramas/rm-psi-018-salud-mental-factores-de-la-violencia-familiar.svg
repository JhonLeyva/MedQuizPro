<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1264" viewBox="0 0 1000 1264" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El modelo ecológico explica la violencia de pareja; aquí el factor principal es la crianza sin figura paterna"><title>El modelo ecológico explica la violencia de pareja; aquí el factor principal es la crianza sin figura paterna</title><rect x="0.75" y="0.75" width="998.5" height="1262.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Salud mental · factores de la violencia familiar</tspan></text><rect x="472.1" y="32.0" width="109.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="526.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="93"><tspan x="526.8" dy="0">PSIQUIATRÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Modelo ecológico de la OMS</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">La violencia de pareja resulta de factores individuales, relacionales, comunitarios y sociales.</tspan><tspan x="58.0" dy="17">No hay un único factor.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 25 años agredida por el esposo</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">El esposo creció solo con la madre, sin escuela y con</tspan><tspan x="640.0" dy="16">trabajo eventual.</tspan><tspan x="640.0" dy="16">Agrede incluso ante los hijos.</tspan></text><line x1="640.0" y1="221.0" x2="670.0" y2="221.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">NIVELES DE FACTORES DEL MODELO ECOLÓGICO (OMS)</tspan></text><line x1="410.9" y1="420.9" x2="340.0" y2="444.6" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="444.6" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="363.0" x2="660.0" y2="341.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="341.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="419.0" x2="660.0" y2="441.0" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="441.0" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="410.3" y1="363.0" x2="340.0" y2="341.0" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="341.0" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="391.0" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="391.0" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="386.5" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">VIOLENCIA DE</tspan><tspan x="500.0" dy="19">PAREJA</tspan></text><text x="500.0" y="424.5" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">varios niveles a la vez</tspan></text><rect x="40.0" y="295.4" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="324.2" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">INDIVIDUALES: el factor del caso</tspan></text><text x="190.0" y="347.9" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Crianza sin figura paterna; maltrato en la</tspan><tspan x="190.0" dy="17">infancia; alcohol</tspan></text><rect x="144.6" y="376.6" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="391.6" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="402.6" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="403.6" width="6.0" height="82.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="436.3" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">RELACIONALES</tspan></text><text x="190.0" y="460.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Conflicto conyugal y control de la pareja</tspan></text><rect x="660.0" y="299.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="300.0" width="6.0" height="82.0" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="810.0" y="332.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">COMUNITARIOS</tspan></text><text x="810.0" y="356.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Pobreza y aislamiento</tspan></text><rect x="660.0" y="399.0" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="400.0" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="432.7" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">SOCIALES</tspan></text><text x="810.0" y="456.4" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Normas de género desiguales</tspan></text><text x="40.0" y="533.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="545.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="578.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Valorar el riesgo vital</tspan></text><line x1="248.5" y1="574.0" x2="267.5" y2="574.0" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,569.0 266.5,579.0 274.5,574.0" fill="#0f766e"/><rect x="278.5" y="545.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="569.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Plan de seguridad y registro de</tspan><tspan x="380.8" dy="17">lesiones</tspan></text><line x1="487.0" y1="574.0" x2="506.0" y2="574.0" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,569.0 505.0,579.0 513.0,574.0" fill="#0f766e"/><rect x="517.0" y="545.0" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="569.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Derivar a servicios de</tspan><tspan x="619.2" dy="17">protección</tspan></text><line x1="725.5" y1="574.0" x2="744.5" y2="574.0" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,569.0 743.5,579.0 751.5,574.0" fill="#0f766e"/><rect x="755.5" y="545.0" width="204.5" height="58.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="569.5" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Apoyo psicológico a la</tspan><tspan x="857.8" dy="17">víctima y a los hijos</tspan></text><text x="40.0" y="637.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">MODELO ECOLÓGICO DE LA OMS: FACTORES DE RIESGO DE LA VIOLENCIA DE PAREJA</tspan></text><rect x="40.0" y="649.0" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="668.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Nivel</tspan></text><text x="220.0" y="668.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="734"><tspan x="220.0" dy="0">Ejemplos</tspan></text><rect x="40.0" y="678.0" width="920.0" height="44.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="697.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Individual</tspan></text><text x="220.0" y="697.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="734"><tspan x="220.0" dy="0">Haber presenciado o sufrido maltrato en la infancia, consumo de alcohol, rasgos de personalidad antisocial; en el caso, crianza sin</tspan><tspan x="220.0" dy="15">figura paterna</tspan></text><rect x="110.6" y="689.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="156.0" y="704.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="156.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="722.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="741.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Relacional</tspan></text><text x="220.0" y="741.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="734"><tspan x="220.0" dy="0">Conflicto conyugal y control masculino de la pareja</tspan></text><rect x="40.0" y="751.0" width="920.0" height="29.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="770.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Comunitario</tspan></text><text x="220.0" y="770.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="734"><tspan x="220.0" dy="0">Pobreza y aislamiento</tspan></text><rect x="40.0" y="780.0" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="799.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Social</tspan></text><text x="220.0" y="799.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="734"><tspan x="220.0" dy="0">Normas de género desiguales</tspan></text><text x="40.0" y="825.0" font-size="11" font-weight="600" font-style="normal" fill="#64748b" text-anchor="start" data-max="920"><tspan x="40.0" dy="0">El nivel educativo bajo y el nivel social bajo son factores reales, pero menos específicos: la violencia ocurre en todos los estratos.</tspan></text><text x="40.0" y="872.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="882.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="921.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="913.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Antecedente de</tspan><tspan x="285.0" dy="17">depresión</tspan></text><rect x="363.0" y="885.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="913.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Carencia de la</tspan><tspan x="435.0" dy="17">figura paterna</tspan></text><text x="585.0" y="913.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Bajo nivel de</tspan><tspan x="585.0" dy="17">educación</tspan></text><text x="735.0" y="904.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Antecedente de</tspan><tspan x="735.0" dy="17">maltrato</tspan><tspan x="735.0" dy="17">psicológico</tspan></text><text x="885.0" y="921.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Nivel social bajo</tspan></text><rect x="40.0" y="953.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="953.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="990.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Factor principal?</tspan></text><text x="285.0" y="982.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: no figura en el</tspan><tspan x="285.0" dy="16">relato</tspan></text><text x="435.0" y="982.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: falta de un modelo</tspan><tspan x="435.0" dy="16">de crianza adecuado</tspan></text><text x="585.0" y="982.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es real pero poco</tspan><tspan x="585.0" dy="16">específico</tspan></text><text x="735.0" y="974.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: no se menciona</tspan><tspan x="735.0" dy="16">maltrato psicológico</tspan><tspan x="735.0" dy="16">previo</tspan></text><text x="885.0" y="982.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: es real pero poco</tspan><tspan x="885.0" dy="16">específico</tspan></text><rect x="40.0" y="882.0" width="920.0" height="137.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1043.0" width="920.0" height="203.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1071.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1093.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Individuales: maltrato vivido o presenciado en la infancia, alcohol, rasgos antisociales. Relacionales: conflicto conyugal y control de la pareja.</tspan><tspan x="58.0" dy="18">   Comunitarios: pobreza. Sociales: normas de género desiguales.</tspan><tspan x="58.0" dy="18">• El libro toma como factor principal la carencia de figura paterna: sin un modelo de crianza adecuado se repiten patrones de dominio (transmisión</tspan><tspan x="58.0" dy="18">   intergeneracional).</tspan><tspan x="58.0" dy="18">• Bajo nivel educativo y nivel social bajo son factores reales pero poco específicos; depresión y maltrato psicológico no figuran en el relato.</tspan><tspan x="58.0" dy="18">• Atención: valorar el riesgo vital, plan de seguridad, documentar lesiones, derivar a protección y apoyar a la víctima y a los hijos. Preguntar de forma</tspan><tspan x="58.0" dy="18">   directa y sin juicio.</tspan></text><text x="58.0" y="1223.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS, directrices clínicas y de políticas sobre violencia de pareja y violencia sexual contra la mujer (2013); Kaplan y Sadock, Sinopsis de Psiquiatría, 12.ª ed. (2021).</tspan></text></svg>