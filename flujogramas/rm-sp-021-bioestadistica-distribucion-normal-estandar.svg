<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="938" viewBox="0 0 1000 938" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La distribución normal estándar tiene media 0 y desviación estándar 1"><title>La distribución normal estándar tiene media 0 y desviación estándar 1</title><rect x="0.75" y="0.75" width="998.5" height="936.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Bioestadística · distribución normal estándar</tspan></text><rect x="465.9" y="32.0" width="128.6" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="530.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="113"><tspan x="530.2" dy="0">SALUD PÚBLICA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="131.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Distribución normal estándar</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Resulta de transformar una variable normal con la puntuación Z: restar la media y dividir</tspan><tspan x="58.0" dy="17">entre la desviación estándar.</tspan><tspan x="58.0" dy="17">Curva simétrica en campana.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="131.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="129.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué alternativa caracteriza a la distribución estándar?</tspan></text><rect x="640.0" y="192.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="205.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="205.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="253.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ PROPORCIÓN DE VALORES CAE EN CADA TRAMO DE LA NORMAL ESTÁNDAR</tspan></text><rect x="40.0" y="265.0" width="920.0" height="185.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="60.0" y="291.0" font-size="13.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Distancia a la media (Z)</tspan></text><text x="60.0" y="310.0" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Cada Z es una desviación estándar a partir del centro (media = 0).</tspan></text><rect x="70.0" y="374.0" width="143.3" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="141.7" y="399.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="133"><tspan x="141.7" dy="0">Menos de −2</tspan></text><rect x="213.3" y="374.0" width="143.3" height="40.0" rx="6" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/><text x="285.0" y="399.0" font-size="12" font-weight="800" font-style="normal" fill="#c2410c" text-anchor="middle" data-max="133"><tspan x="285.0" dy="0">−2 a −1</tspan></text><rect x="356.7" y="374.0" width="286.7" height="40.0" rx="6" fill="#dcfce7" stroke="#ffffff" stroke-width="2"/><text x="500.0" y="399.0" font-size="12" font-weight="800" font-style="normal" fill="#15803d" text-anchor="middle" data-max="277"><tspan x="500.0" dy="0">±1: cerca de 68 %</tspan></text><rect x="643.3" y="374.0" width="143.3" height="40.0" rx="6" fill="#ffedd5" stroke="#ffffff" stroke-width="2"/><text x="715.0" y="399.0" font-size="12" font-weight="800" font-style="normal" fill="#c2410c" text-anchor="middle" data-max="133"><tspan x="715.0" dy="0">1 a 2</tspan></text><rect x="786.7" y="374.0" width="143.3" height="40.0" rx="6" fill="#fee2e2" stroke="#ffffff" stroke-width="2"/><text x="858.3" y="399.0" font-size="12" font-weight="800" font-style="normal" fill="#b91c1c" text-anchor="middle" data-max="133"><tspan x="858.3" dy="0">Más de +2</tspan></text><line x1="70.0" y1="414.0" x2="70.0" y2="422.0" stroke="#64748b" stroke-width="1.5"/><text x="70.0" y="436.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="70.0" dy="0">-3</tspan></text><line x1="213.3" y1="414.0" x2="213.3" y2="422.0" stroke="#64748b" stroke-width="1.5"/><text x="213.3" y="436.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="213.3" dy="0">-2</tspan></text><line x1="356.7" y1="414.0" x2="356.7" y2="422.0" stroke="#64748b" stroke-width="1.5"/><text x="356.7" y="436.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="356.7" dy="0">-1</tspan></text><line x1="500.0" y1="414.0" x2="500.0" y2="422.0" stroke="#64748b" stroke-width="1.5"/><text x="500.0" y="436.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="500.0" dy="0">0</tspan></text><line x1="643.3" y1="414.0" x2="643.3" y2="422.0" stroke="#64748b" stroke-width="1.5"/><text x="643.3" y="436.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="643.3" dy="0">1</tspan></text><line x1="786.7" y1="414.0" x2="786.7" y2="422.0" stroke="#64748b" stroke-width="1.5"/><text x="786.7" y="436.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="786.7" dy="0">2</tspan></text><line x1="930.0" y1="414.0" x2="930.0" y2="422.0" stroke="#64748b" stroke-width="1.5"/><text x="930.0" y="436.0" font-size="11" font-weight="700" font-style="normal" fill="#475569" text-anchor="middle" data-max="50"><tspan x="930.0" dy="0">3</tspan></text><polygon points="491.0,360.0 509.0,360.0 500.0,372.0" fill="#ea580c"/><rect x="384.2" y="334.0" width="231.5" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="500.0" y="349.0" font-size="10.5" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="220"><tspan x="500.0" dy="0">◆ MEDIA 0 · DESVIACIÓN ESTÁNDAR 1</tspan></text><text x="40.0" y="482.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ LA DEFINE</tspan></text><rect x="40.0" y="492.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="493.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="516.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Media 0 y desviación 1</tspan></text><text x="58.0" y="537.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Por construcción de la puntuación Z</tspan></text><rect x="351.3" y="492.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="493.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="516.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Simétrica</tspan></text><text x="369.3" y="537.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Media, mediana y moda en el mismo punto</tspan></text><rect x="662.7" y="492.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="493.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="516.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">±1,96 desviaciones</tspan></text><text x="680.7" y="537.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Contiene exactamente 95 % de los valores</tspan></text><text x="40.0" y="601.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="611.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="650.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="614.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="633.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Media 0 y</tspan><tspan x="285.0" dy="17">desviación estándar</tspan><tspan x="285.0" dy="17">1</tspan></text><text x="435.0" y="633.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Mediana 0 y</tspan><tspan x="435.0" dy="17">desviación estándar</tspan><tspan x="435.0" dy="17">0</tspan></text><text x="585.0" y="633.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Media 1 y</tspan><tspan x="585.0" dy="17">desviación estándar</tspan><tspan x="585.0" dy="17">1</tspan></text><text x="735.0" y="633.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Media 1 y</tspan><tspan x="735.0" dy="17">desviación estándar</tspan><tspan x="735.0" dy="17">0</tspan></text><text x="885.0" y="650.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Media 0 y moda 1</tspan></text><rect x="40.0" y="682.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="682.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="703.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Media 0 y desviación</tspan><tspan x="54.0" dy="16">1?</tspan></text><text x="285.0" y="703.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: centrada en cero</tspan><tspan x="285.0" dy="16">con dispersión uno</tspan></text><text x="435.0" y="703.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: con dispersión</tspan><tspan x="435.0" dy="16">cero no hay curva</tspan></text><text x="585.0" y="703.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es una normal</tspan><tspan x="585.0" dy="16">cualquiera</tspan></text><text x="735.0" y="703.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: dispersión cero es</tspan><tspan x="735.0" dy="16">imposible</tspan></text><text x="885.0" y="703.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: la moda coincide</tspan><tspan x="885.0" dy="16">con la media (0)</tspan></text><rect x="40.0" y="611.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="756.0" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="784.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="806.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Z = (valor − media) / desviación estándar: queda centrada en 0 y con dispersión 1; media, mediana y moda coinciden.</tspan><tspan x="58.0" dy="18">• Regla empírica: cerca de 68 % de los valores está a ±1 desviación, 95 % a ±2 (exactamente ±1,96) y 99,7 % a ±3.</tspan><tspan x="58.0" dy="18">• Una desviación estándar de 0 sería datos idénticos: no hay curva. Media 1 con desviación 1 es una normal cualquiera.</tspan><tspan x="58.0" dy="18">• Perla: |Z| mayor de 1,96 equivale a p menor de 0,05 en una prueba bilateral; es la base de intervalos de confianza y pruebas paramétricas.</tspan></text><text x="58.0" y="882.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Armitage, Berry y Matthews, Statistical Methods in Medical Research, 4.ª ed. (2002); Celentano y Szklo, Gordis Epidemiología, 6.ª ed. (2019); Altman, Practical Statistics</tspan><tspan x="58.0" dy="15">for Medical Research (1991).</tspan></text></svg>