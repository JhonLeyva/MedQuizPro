<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1219" viewBox="0 0 1000 1219" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Lactante picado por escorpión: la complicación principal es la falla cardiorrespiratoria (miocarditis y edema pulmonar)"><title>Lactante picado por escorpión: la complicación principal es la falla cardiorrespiratoria (miocarditis y edema pulmonar)</title><rect x="0.75" y="0.75" width="998.5" height="1218.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Accidentes por animales ponzoñosos · escorpionismo</tspan></text><rect x="521.3" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="577.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="577.8" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Escorpionismo</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">El veneno libera catecolaminas y acetilcolina: tormenta autonómica.</tspan><tspan x="58.0" dy="17">En niños pequeños: vómitos, sudor, salivación, taquicardia, HTA, miocarditis y edema</tspan><tspan x="58.0" dy="17">pulmonar.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Lactante de 1 año</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Picadura de escorpión.</tspan><tspan x="640.0" dy="16">Llega 6 horas después.</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta de este caso en el algoritmo</tspan></text><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#94a3b8" stroke-width="2"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#94a3b8" stroke-width="2"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#94a3b8"/><line x1="500.0" y1="361.0" x2="500.0" y2="391.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="391.0" x2="733.5" y2="391.0" stroke="#94a3b8" stroke-width="2"/><line x1="266.5" y1="391.0" x2="266.5" y2="420.0" stroke="#94a3b8" stroke-width="2"/><polygon points="261.5,419.0 271.5,419.0 266.5,427.0" fill="#94a3b8"/><line x1="733.5" y1="391.0" x2="733.5" y2="420.0" stroke="#94a3b8" stroke-width="2"/><polygon points="728.5,419.0 738.5,419.0 733.5,427.0" fill="#94a3b8"/><line x1="320.0" y1="225.0" x2="320.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="320.0" y1="255.0" x2="500.0" y2="255.0" stroke="#0f766e" stroke-width="3"/><line x1="500.0" y1="255.0" x2="500.0" y2="284.0" stroke="#0f766e" stroke-width="3"/><polygon points="495.0,283.0 505.0,283.0 500.0,291.0" fill="#0f766e"/><line x1="500.0" y1="361.0" x2="500.0" y2="391.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="391.0" x2="500.0" y2="391.0" stroke="#0f766e" stroke-width="3"/><line x1="266.5" y1="391.0" x2="266.5" y2="420.0" stroke="#0f766e" stroke-width="3"/><polygon points="261.5,419.0 271.5,419.0 266.5,427.0" fill="#0f766e"/><rect x="191.1" y="400.0" width="150.8" height="18.0" rx="9" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="266.5" y="412.5" font-size="10" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="266.5" dy="0">Sí o es lactante (este caso)</tspan></text><rect x="676.6" y="400.0" width="113.9" height="18.0" rx="9" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="733.5" y="412.5" font-size="10" font-weight="700" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="733.5" dy="0">No: solo dolor local</tspan></text><polygon points="240.0,326.0 266.0,291.0 734.0,291.0 760.0,326.0 734.0,361.0 266.0,361.0" fill="#fffbeb" stroke="#0f766e" stroke-width="2.5"/><circle cx="286.0" cy="326.0" r="12" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="286.0" y="331.0" font-size="15" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="286.0" dy="0">?</tspan></text><text x="519.0" y="322.0" font-size="13" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="519.0" dy="0">Picadura de escorpión en un niño: ¿signos sistémicos</tspan><tspan x="519.0" dy="17">(vómitos, sudor, taquicardia)?</tspan></text><rect x="40.0" y="427.0" width="453.0" height="73.5" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="266.5" y="455.4" font-size="13" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">HOSPITALIZAR + ANTIVENENO</tspan></text><text x="266.5" y="478.3" font-size="11.5" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="425"><tspan x="266.5" dy="0">Vigilar corazón y pulmón</tspan></text><rect x="507.0" y="427.0" width="453.0" height="73.5" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="733.5" y="455.4" font-size="13" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">Analgesia y observar</tspan></text><text x="733.5" y="478.3" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="425"><tspan x="733.5" dy="0">4-6 h en adultos</tspan></text><text x="40.0" y="540.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CLASIFICACIÓN OFICIAL</tspan></text><rect x="40.0" y="552.5" width="920.0" height="323.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="56.0" y="566.5" width="262.9" height="30.0" rx="15" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="187.4" y="586.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="187.4" dy="0">GRAVEDAD DEL ESCORPIONISMO</tspan></text><text x="334.9" y="586.5" font-size="12.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="607"><tspan x="334.9" dy="0">Según los síntomas.</tspan></text><rect x="56.0" y="626.5" width="288.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="56.6" y="627.1" width="286.8" height="63.0" rx="9" fill="#dcfce7" stroke="none" stroke-width="0"/><text x="200.0" y="654.5" font-size="11" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="272"><tspan x="200.0" dy="0">LEVE</tspan></text><text x="200.0" y="674.5" font-size="14" font-weight="800" font-style="normal" fill="#166534" text-anchor="middle" data-max="264"><tspan x="200.0" dy="0">Local</tspan></text><circle cx="72.0" cy="699.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="82.0" y="703.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="82.0" dy="0">Dolor, parestesias</tspan></text><rect x="356.0" y="626.5" width="288.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="356.6" y="627.1" width="286.8" height="63.0" rx="9" fill="#fef9c3" stroke="none" stroke-width="0"/><text x="500.0" y="654.5" font-size="11" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="272"><tspan x="500.0" dy="0">MODERADO</tspan></text><text x="500.0" y="674.5" font-size="14" font-weight="800" font-style="normal" fill="#854d0e" text-anchor="middle" data-max="264"><tspan x="500.0" dy="0">Sistémico</tspan></text><circle cx="372.0" cy="699.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="382.0" y="703.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="382.0" dy="0">Vómitos, sudor, taquicardia</tspan></text><rect x="656.0" y="626.5" width="288.0" height="98.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><rect x="656.6" y="627.1" width="286.8" height="63.0" rx="9" fill="#ffedd5" stroke="none" stroke-width="0"/><text x="800.0" y="654.5" font-size="11" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="272"><tspan x="800.0" dy="0">GRAVE</tspan></text><text x="800.0" y="674.5" font-size="14" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="264"><tspan x="800.0" dy="0">Falla de órganos</tspan></text><circle cx="672.0" cy="699.5" r="3" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="682.0" y="703.5" font-size="11.5" font-weight="400" font-style="normal" fill="#334155" text-anchor="start" data-max="250"><tspan x="682.0" dy="0">Edema pulmonar, choque, convulsiones</tspan></text><text x="56.0" y="754.5" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="888"><tspan x="56.0" dy="0">PARA UBICAR ESTE CASO</tspan></text><rect x="56.0" y="763.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="778.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="778.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Lactante: riesgo alto de evolucionar a grave</tspan></text><rect x="56.0" y="785.5" width="20.0" height="20.0" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/><text x="66.0" y="800.5" font-size="12" font-weight="800" font-style="normal" fill="#16a34a" text-anchor="middle" data-max="0"><tspan x="66.0" dy="0">✓</tspan></text><text x="88.0" y="800.5" font-size="12" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="start" data-max="848"><tspan x="88.0" dy="0">Faltan los síntomas</tspan></text><rect x="56.0" y="822.5" width="888.0" height="37.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="72.0" y="845.5" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="856"><tspan x="72.0" dy="0">Hospitalizar, monitorizar y antiveneno.</tspan></text><text x="40.0" y="915.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="925.5" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="965.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="928.5" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="956.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Insuficiencia</tspan><tspan x="285.0" dy="17">cardiorespiratoria</tspan></text><text x="435.0" y="948.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Reacción</tspan><tspan x="435.0" dy="17">inflamatoria de la</tspan><tspan x="435.0" dy="17">zona</tspan></text><text x="585.0" y="965.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Anafilaxia</tspan></text><text x="735.0" y="965.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Necrosis de la zona</tspan></text><text x="885.0" y="965.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Celulitis secundaria</tspan></text><rect x="40.0" y="996.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="996.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1017.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Complicación</tspan><tspan x="54.0" dy="16">principal?</tspan></text><text x="285.0" y="1017.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: miocarditis y edema</tspan><tspan x="285.0" dy="16">pulmonar</tspan></text><text x="435.0" y="1017.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Es lo más común, no lo</tspan><tspan x="435.0" dy="16">más grave</tspan></text><text x="585.0" y="1025.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Rara</tspan></text><text x="735.0" y="1025.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Rara</tspan></text><text x="885.0" y="1025.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">Rara</tspan></text><rect x="40.0" y="925.5" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1070.5" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1098.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1120.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Hospitalizar y monitorizar a todo niño pequeño (menos de 5 años).</tspan><tspan x="58.0" dy="18">• Faboterápico (suero antiescorpiónico) si hay signos sistémicos.</tspan><tspan x="58.0" dy="18">• Edema pulmonar: oxígeno, ventilación, prazosina o dobutamina.</tspan></text><text x="58.0" y="1178.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: MINSA Perú, NTS de accidentes por animales ponzoñosos (2019).</tspan></text></svg>