<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="949" viewBox="0 0 1000 949" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="El amlodipino es el fármaco que causa el edema de miembros inferiores"><title>El amlodipino es el fármaco que causa el edema de miembros inferiores</title><rect x="0.75" y="0.75" width="998.5" height="947.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Farmacología · efectos adversos de antihipertensivos</tspan></text><rect x="516.5" y="32.0" width="117.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="575.2" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="101"><tspan x="575.2" dy="0">CARDIOLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Edema por calcioantagonistas</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Efecto dependiente de la dosis de las dihidropiridinas.</tspan><tspan x="58.0" dy="17">No es retención de sodio ni insuficiencia cardiaca.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Varón de 60 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Edema de miembros inferiores desde hace 2 meses.</tspan><tspan x="640.0" dy="16">Recibe atorvastatina, aspirina, amlodipino, metformina</tspan><tspan x="640.0" dy="16">e hidroclorotiazida.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO EL AMLODIPINO PRODUCE EDEMA</tspan></text><text x="40.0" y="297.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="430"><tspan x="40.0" dy="0">PASO</tspan></text><text x="516.0" y="297.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="444"><tspan x="516.0" dy="0">QUÉ OCURRE</tspan></text><rect x="40.0" y="307.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="336.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="341.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">1</tspan></text><text x="84.0" y="333.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Amlodipino</tspan></text><text x="84.0" y="350.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Calcioantagonista dihidropiridínico</tspan></text><line x1="476.0" y1="336.5" x2="503.0" y2="336.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,331.5 502.0,341.5 510.0,336.5" fill="#ea580c"/><rect x="516.0" y="309.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="333.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Dilata las arteriolas</tspan></text><text x="530.0" y="350.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Bajan las resistencias</tspan></text><line x1="255.0" y1="368.0" x2="255.0" y2="381.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,380.0 260.0,380.0 255.0,388.0" fill="#0f766e"/><rect x="40.0" y="390.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="419.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="424.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">2</tspan></text><text x="84.0" y="416.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Sube la presión capilar</tspan></text><text x="84.0" y="433.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Entra más sangre y no sale por las venas</tspan></text><line x1="476.0" y1="419.5" x2="503.0" y2="419.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,414.5 502.0,424.5 510.0,419.5" fill="#ea580c"/><rect x="516.0" y="392.0" width="444.0" height="55.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="530.0" y="416.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">La vénula no se dilata</tspan></text><text x="530.0" y="433.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">Más presión hidrostática</tspan></text><line x1="255.0" y1="451.0" x2="255.0" y2="464.0" stroke="#0f766e" stroke-width="2"/><polygon points="250.0,463.0 260.0,463.0 255.0,471.0" fill="#0f766e"/><rect x="40.0" y="473.0" width="430.0" height="59.0" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><circle cx="62.0" cy="502.5" r="12" fill="#0f766e" stroke="none" stroke-width="0"/><text x="62.0" y="507.0" font-size="12" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="62.0" dy="0">3</tspan></text><text x="84.0" y="499.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Edema de tobillos</tspan></text><text x="84.0" y="516.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="370"><tspan x="84.0" dy="0">Peor al final del día</tspan></text><line x1="476.0" y1="502.5" x2="503.0" y2="502.5" stroke="#ea580c" stroke-width="2"/><polygon points="502.0,497.5 502.0,507.5 510.0,502.5" fill="#ea580c"/><rect x="516.0" y="475.0" width="444.0" height="55.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/><text x="530.0" y="499.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">No mejora con diuréticos</tspan></text><text x="530.0" y="516.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="414"><tspan x="530.0" dy="0">IECA o ARA II, o bajar la dosis</tspan></text><rect x="40.0" y="550.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="576.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Amlodipino: edema dependiente de la dosis</tspan></text><text x="60.0" y="595.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Se trata cambiando o añadiendo un IECA/ARA II, no con diuréticos.</tspan></text><text x="40.0" y="662.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="672.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="703.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="703.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Atorvastatina</tspan></text><text x="435.0" y="694.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Ácido</tspan><tspan x="435.0" dy="17">acetilsalicílico</tspan></text><text x="585.0" y="703.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Metformina</tspan></text><rect x="663.0" y="675.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="703.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Amlodipino</tspan></text><text x="885.0" y="703.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Hidroclorotiazida</tspan></text><rect x="40.0" y="726.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="726.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="755.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Causa el edema?</tspan></text><text x="285.0" y="747.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: causa mialgias y</tspan><tspan x="285.0" dy="16">alteración hepática</tspan></text><text x="435.0" y="747.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: causa gastritis y</tspan><tspan x="435.0" dy="16">sangrado</tspan></text><text x="585.0" y="747.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: causa síntomas</tspan><tspan x="585.0" dy="16">digestivos</tspan></text><text x="735.0" y="747.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: vasodilatación</tspan><tspan x="735.0" dy="16">arteriolar</tspan></text><text x="885.0" y="755.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: reduce el edema</tspan></text><rect x="40.0" y="672.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="800.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="828.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="850.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Vasodilatación arteriolar precapilar sin dilatación venosa: sube la presión hidrostática capilar.</tspan><tspan x="58.0" dy="18">• No responde a diuréticos; mejora con IECA o ARA II (dilatan la vénula), con menos dosis o con otro fármaco.</tspan><tspan x="58.0" dy="18">• Estatinas: mialgias y transaminasas. Aspirina: gastritis. Metformina: síntomas digestivos. Tiazida: reduce el edema.</tspan></text><text x="58.0" y="908.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ACC/AHA, hipertensión arterial (2025); Katzung Farmacología Básica y Clínica 15.ª ed.</tspan></text></svg>