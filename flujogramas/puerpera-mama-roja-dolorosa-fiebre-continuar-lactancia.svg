<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1038" viewBox="0 0 1000 1038" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Puérpera con fiebre y mama congestiva, indurada, roja y caliente sin masa: mastitis puerperal, antibiótico y continuar la lactancia"><title>Puérpera con fiebre y mama congestiva, indurada, roja y caliente sin masa: mastitis puerperal, antibiótico y continuar la lactancia</title><rect x="0.75" y="0.75" width="998.5" height="1036.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Puerperio · mastitis</tspan></text><rect x="316.9" y="32.0" width="174.4" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="404.1" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="158"><tspan x="404.1" dy="0">GINECO-OBSTETRICIA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Mastitis puerperal</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Inflamación de la mama por estasis de leche, a menudo infectada por S. aureus (grietas del</tspan><tspan x="58.0" dy="17">pezón).</tspan><tspan x="58.0" dy="17">Vaciar bien la mama (amamantar) es parte del tratamiento: suspender la lactancia aumenta</tspan><tspan x="58.0" dy="17">el riesgo de absceso.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Puérpera mediata</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Fiebre y dolor en la mama izquierda.</tspan><tspan x="640.0" dy="16">Mama congestiva, indurada, eritematosa y caliente; sin</tspan><tspan x="640.0" dy="16">tumoración.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿SEGUIR AMAMANTANDO?</tspan></text><rect x="493.0" y="335.0" width="14" height="190" rx="5" fill="#64748b"/><path d="M440.0 540.0 H560.0 L540.0 520.0 H460.0 Z" fill="#475569"/><circle cx="500.0" cy="335.0" r="15" fill="#f59e0b" stroke="#92400e" stroke-width="2"/><line x1="385.4" y1="353.1" x2="614.6" y2="316.9" stroke="#334155" stroke-width="7" stroke-linecap="round"/><line x1="385.4" y1="353.1" x2="357.4" y2="415.1" stroke="#64748b" stroke-width="2"/><line x1="385.4" y1="353.1" x2="413.4" y2="415.1" stroke="#64748b" stroke-width="2"/><path d="M347.4 415.1 H423.4 Q385.4 459.1 347.4 415.1 Z" fill="#ea580c"/><text x="385.4" y="430.1" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="385.4" dy="0">LACTAR</tspan></text><line x1="614.6" y1="316.9" x2="586.6" y2="378.9" stroke="#64748b" stroke-width="2"/><line x1="614.6" y1="316.9" x2="642.6" y2="378.9" stroke="#64748b" stroke-width="2"/><path d="M576.6 378.9 H652.6 Q614.6 422.9 576.6 378.9 Z" fill="#64748b"/><text x="614.6" y="393.9" font-size="10.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="66"><tspan x="614.6" dy="0">SUSPENDER</tspan></text><text x="500.0" y="567.0" font-size="12" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="300"><tspan x="500.0" dy="0">¿Qué pesa más?</tspan></text><rect x="40.0" y="305.0" width="290.0" height="158.0" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><text x="58.0" y="333.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="254"><tspan x="58.0" dy="0">Seguir lactando</tspan></text><circle cx="62.0" cy="358.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="362.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Vacía la mama: cura más rápido</tspan></text><circle cx="62.0" cy="384.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="388.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Previene el absceso</tspan></text><circle cx="62.0" cy="410.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="414.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">Antibióticos compatibles</tspan></text><circle cx="62.0" cy="436.0" r="4" fill="#0f766e" stroke="none" stroke-width="0"/><text x="74.0" y="440.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="74.0" dy="0">El bebé no se enferma</tspan></text><rect x="214.6" y="294.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="260.0" y="309.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="260.0" dy="0">◆ ESTE CASO</tspan></text><rect x="670.0" y="305.0" width="290.0" height="132.0" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="688.0" y="333.0" font-size="13" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="254"><tspan x="688.0" dy="0">Suspender</tspan></text><circle cx="692.0" cy="358.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="362.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Estasis de leche</tspan></text><circle cx="692.0" cy="384.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="388.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Más riesgo de absceso</tspan></text><circle cx="692.0" cy="410.0" r="4" fill="#94a3b8" stroke="none" stroke-width="0"/><text x="704.0" y="414.0" font-size="11.5" font-weight="500" font-style="normal" fill="#334155" text-anchor="start" data-max="246"><tspan x="704.0" dy="0">Pierde la lactancia</tspan></text><rect x="40.0" y="601.0" width="920.0" height="76.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="500.0" y="629.0" font-size="14" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">Antibiótico + continuar la lactancia</tspan></text><text x="500.0" y="650.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="middle" data-max="860"><tspan x="500.0" dy="0">De ambas mamas; drenar solo si hay absceso.</tspan></text><text x="40.0" y="717.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="727.0" width="920.0" height="88.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="775.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="758.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Suspender</tspan><tspan x="285.0" dy="17">definitivamente la</tspan><tspan x="285.0" dy="17">lactancia</tspan></text><text x="435.0" y="758.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Continuar lactancia</tspan><tspan x="435.0" dy="17">sólo con mama no</tspan><tspan x="435.0" dy="17">infectada</tspan></text><rect x="513.0" y="730.0" width="144.0" height="82.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="585.0" y="766.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Continuar con</tspan><tspan x="585.0" dy="17">lactancia materna</tspan></text><text x="735.0" y="749.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Suspender</tspan><tspan x="735.0" dy="17">lactancia hasta</tspan><tspan x="735.0" dy="17">terminar</tspan><tspan x="735.0" dy="17">antibióticos</tspan></text><text x="885.0" y="766.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Drenar la mama</tspan><tspan x="885.0" dy="17">inmediatamente</tspan></text><rect x="40.0" y="815.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="513.0" y="815.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="844.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Y además?</tspan></text><text x="285.0" y="836.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: aumenta el riesgo</tspan><tspan x="285.0" dy="16">de absceso</tspan></text><text x="435.0" y="836.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: hay que vaciar la</tspan><tspan x="435.0" dy="16">mama afectada</tspan></text><text x="585.0" y="836.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Sí: vaciar la mama</tspan><tspan x="585.0" dy="16">ayuda a curar</tspan></text><text x="735.0" y="836.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: los antibióticos son</tspan><tspan x="735.0" dy="16">compatibles</tspan></text><text x="885.0" y="844.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: no hay absceso</tspan></text><rect x="40.0" y="727.0" width="920.0" height="138.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="889.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="917.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="939.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Dicloxacilina o cefalexina 10-14 días; analgesia (ibuprofeno).</tspan><tspan x="58.0" dy="18">• Seguir amamantando de ambas mamas, empezando por la sana si duele; corregir el agarre.</tspan><tspan x="58.0" dy="18">• Masa fluctuante: absceso → ecografía y drenaje (puede seguir lactando).</tspan></text><text x="58.0" y="997.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ABM, protocolo n.º 36 (2022); OMS.</tspan></text></svg>