<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1019" viewBox="0 0 1000 1019" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="La causa más frecuente de pancreatitis aguda es la biliar"><title>La causa más frecuente de pancreatitis aguda es la biliar</title><rect x="0.75" y="0.75" width="998.5" height="1017.0" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Gastroenterología · etiología de la pancreatitis aguda</tspan></text><rect x="513.1" y="32.0" width="165.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="595.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="149"><tspan x="595.8" dy="0">GASTROENTEROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Pancreatitis aguda</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Inflamación autodigestiva por activación prematura del tripsinógeno.</tspan><tspan x="58.0" dy="17">La litiasis biliar es la primera causa en el mundo y en el Perú.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de teoría</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es la causa más frecuente de pancreatitis aguda</tspan><tspan x="640.0" dy="16">en nuestro medio?</tspan></text><line x1="640.0" y1="205.0" x2="670.0" y2="205.0" stroke="#0f766e" stroke-width="3"/><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Ruta del caso: abajo del mapa</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CAUSAS DE LA PANCREATITIS AGUDA POR FRECUENCIA</tspan></text><line x1="406.0" y1="418.6" x2="340.0" y2="418.2" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="418.2" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="421.1" y1="470.3" x2="340.0" y2="522.8" stroke="#cbd5e1" stroke-width="2"/><circle cx="340.0" cy="522.8" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="391.2" x2="660.0" y2="369.3" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="369.3" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="589.7" y1="447.3" x2="660.0" y2="469.3" stroke="#cbd5e1" stroke-width="2"/><circle cx="660.0" cy="469.3" r="5" fill="#cbd5e1" stroke="none" stroke-width="0"/><line x1="421.3" y1="367.8" x2="340.0" y2="314.6" stroke="#0f766e" stroke-width="3"/><circle cx="340.0" cy="314.6" r="5" fill="#0f766e" stroke="none" stroke-width="0"/><circle cx="500.0" cy="419.3" r="94" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/><circle cx="500.0" cy="419.3" r="86" fill="#ffffff" stroke="#0f766e" stroke-width="3"/><text x="500.0" y="414.8" font-size="14" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="142"><tspan x="500.0" dy="0">PANCREATITIS</tspan><tspan x="500.0" dy="19">AGUDA</tspan></text><text x="500.0" y="452.8" font-size="10.5" font-weight="600" font-style="normal" fill="#64748b" text-anchor="middle" data-max="152"><tspan x="500.0" dy="0">etiologías</tspan></text><rect x="40.0" y="269.0" width="300.0" height="91.2" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="190.0" y="297.8" font-size="13.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">BILIAR: LA MÁS FRECUENTE</tspan></text><text x="190.0" y="321.5" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Cálculos pequeños o barro que obstruyen la</tspan><tspan x="190.0" dy="17">ampolla</tspan></text><rect x="144.6" y="350.2" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="190.0" y="365.2" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="376.2" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="377.2" width="6.0" height="82.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="190.0" y="409.9" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">ALCOHOL</tspan></text><text x="190.0" y="433.6" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Segunda causa</tspan></text><rect x="40.0" y="476.2" width="300.0" height="93.3" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="477.2" width="6.0" height="91.3" rx="3" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="190.0" y="505.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">HIPERTRIGLICERIDEMIA E</tspan><tspan x="190.0" dy="19.2">HIPERCALCEMIA</tspan></text><text x="190.0" y="547.8" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="190.0" dy="0">Triglicéridos mayores de 1000 mg/dL</tspan></text><rect x="660.0" y="327.3" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="328.3" width="6.0" height="82.0" rx="3" fill="#10b981" stroke="none" stroke-width="1.5"/><text x="810.0" y="361.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">FÁRMACOS Y CPRE</tspan></text><text x="810.0" y="384.7" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">CPRE en 3-5 % de los procedimientos</tspan></text><rect x="660.0" y="427.3" width="300.0" height="84.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="661.0" y="428.3" width="6.0" height="82.0" rx="3" fill="#e11d48" stroke="none" stroke-width="1.5"/><text x="810.0" y="461.0" font-size="13.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">IDIOPÁTICA Y TRAUMÁTICA</tspan></text><text x="810.0" y="484.7" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="272"><tspan x="810.0" dy="0">Idiopática solo tras descartar las demás</tspan></text><text x="40.0" y="605.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO LLEGA EL CASO AL DIAGNÓSTICO</tspan></text><rect x="40.0" y="617.5" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="142.2" y="650.5" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="142.2" dy="0">Cálculo pequeño migra</tspan></text><line x1="248.5" y1="646.5" x2="267.5" y2="646.5" stroke="#0f766e" stroke-width="2"/><polygon points="266.5,641.5 266.5,651.5 274.5,646.5" fill="#0f766e"/><rect x="278.5" y="617.5" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="380.8" y="642.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="380.8" dy="0">Obstrucción transitoria de la</tspan><tspan x="380.8" dy="17">ampolla</tspan></text><line x1="487.0" y1="646.5" x2="506.0" y2="646.5" stroke="#0f766e" stroke-width="2"/><polygon points="505.0,641.5 505.0,651.5 513.0,646.5" fill="#0f766e"/><rect x="517.0" y="617.5" width="204.5" height="58.0" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="619.2" y="642.0" font-size="12" font-weight="500" font-style="normal" fill="#334155" text-anchor="middle" data-max="180"><tspan x="619.2" dy="0">Sube la presión y se activa el</tspan><tspan x="619.2" dy="17">tripsinógeno</tspan></text><line x1="725.5" y1="646.5" x2="744.5" y2="646.5" stroke="#0f766e" stroke-width="2"/><polygon points="743.5,641.5 743.5,651.5 751.5,646.5" fill="#0f766e"/><rect x="755.5" y="617.5" width="204.5" height="58.0" rx="12" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="857.8" y="642.0" font-size="12" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="180"><tspan x="857.8" dy="0">Colecistectomía en la misma</tspan><tspan x="857.8" dy="17">hospitalización</tspan></text><text x="40.0" y="715.5" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="725.5" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="748.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="748.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Idiopática</tspan></text><rect x="363.0" y="728.5" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="748.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Biliar</tspan></text><text x="585.0" y="748.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Medicamentosa</tspan></text><text x="735.0" y="748.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Traumática</tspan></text><text x="885.0" y="748.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Post-CPRE</tspan></text><rect x="40.0" y="762.5" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="762.5" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="791.5" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Más frecuente?</tspan></text><text x="285.0" y="783.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: se diagnostica tras</tspan><tspan x="285.0" dy="16">descartar las demás</tspan></text><text x="435.0" y="783.5" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: la litiasis biliar</tspan><tspan x="435.0" dy="16">obstruye la ampolla</tspan></text><text x="585.0" y="783.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: es una causa</tspan><tspan x="585.0" dy="16">minoritaria</tspan></text><text x="735.0" y="791.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: es poco frecuente</tspan></text><text x="885.0" y="783.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: ocurre en 3-5 % de</tspan><tspan x="885.0" dy="16">los procedimientos</tspan></text><rect x="40.0" y="725.5" width="920.0" height="87.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="836.5" width="920.0" height="164.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="864.5" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="886.5" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Biliar: cálculos menores de 5 mm o barro biliar obstruyen la ampolla de Vater y elevan la presión en el conducto pancreático.</tspan><tspan x="58.0" dy="18">• Segunda causa: alcohol. Luego hipertrigliceridemia (&gt; 1000 mg/dL), hipercalcemia, fármacos y CPRE (3-5 % de los procedimientos).</tspan><tspan x="58.0" dy="18">• Idiopática: solo tras descartar las anteriores, incluida la microlitiasis con ecoendoscopia; la traumática es poco frecuente.</tspan><tspan x="58.0" dy="18">• Con ALT mayor de 3 veces lo normal, la probabilidad biliar supera el 95 %; si es leve, la colecistectomía se hace en la misma hospitalización.</tspan></text><text x="58.0" y="962.5" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Tenner S et al., ACG (Am J Gastroenterol 2024;119:419-437); Banks PA et al., Atlanta 2012 (Gut 2013;62:102); Guzmán-Calderón E et al., GPC EsSalud-IETSI 2022</tspan><tspan x="58.0" dy="15">(Rev Gastroenterol Peru 2023;43:166); Sabiston 21.ª ed.</tspan></text></svg>