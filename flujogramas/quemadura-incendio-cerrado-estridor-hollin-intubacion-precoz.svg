<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1188" viewBox="0 0 1000 1188" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Quemado con lesión inhalatoria: primero asegurar la vía aérea"><title>Quemado con lesión inhalatoria: primero asegurar la vía aérea</title><rect x="0.75" y="0.75" width="998.5" height="1186.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Quemaduras · lesión por inhalación</tspan></text><rect x="411.2" y="32.0" width="101.3" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="461.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="85"><tspan x="461.8" dy="0">CIRUGÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Lesión inhalatoria</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Incendio en lugar cerrado: el calor y el humo edematizan la laringe en pocas horas.</tspan><tspan x="58.0" dy="17">Si hay signos de obstrucción, se intuba antes de que el edema lo impida.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 40 años rescatada de un incendio</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Quemaduras del 35 %; PA 80/50, FR 30, SatO₂ 86 %.</tspan><tspan x="640.0" dy="16">Estridor, quemaduras faciales y hollín en la orofaringe.</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">PRIMERO LA VÍA AÉREA</tspan></text><polygon points="220,305.0 260,269.0 740,269.0 780,305.0 740,341.0 260,341.0" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><circle cx="282.0" cy="305.0" r="13" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="282.0" y="310.5" font-size="16" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="282.0" dy="0">?</tspan></text><text x="525.0" y="301.0" font-size="13.5" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="525.0" dy="0">¿Hay signos de que la vía aérea se está cerrando por la</tspan><tspan x="525.0" dy="18">inhalación?</tspan></text><line x1="500.0" y1="341.0" x2="500.0" y2="361.0" stroke="#0f766e" stroke-width="2"/><line x1="190.0" y1="361.0" x2="662.0" y2="361.0" stroke="#0f766e" stroke-width="2"/><line x1="190.0" y1="361.0" x2="190.0" y2="390.0" stroke="#0f766e" stroke-width="2"/><polygon points="185.0,389.0 195.0,389.0 190.0,397.0" fill="#0f766e"/><line x1="662.0" y1="361.0" x2="662.0" y2="390.0" stroke="#ea580c" stroke-width="2"/><polygon points="657.0,389.0 667.0,389.0 662.0,397.0" fill="#ea580c"/><rect x="174.0" y="369.0" width="32.0" height="20.0" rx="10" fill="#64748b" stroke="none" stroke-width="1.5"/><text x="190.0" y="383.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">No</tspan></text><rect x="568.3" y="369.0" width="187.3" height="20.0" rx="10" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="662.0" y="383.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="662.0" dy="0">Sí: estridor y hollín (este caso)</tspan></text><rect x="40.0" y="397.0" width="300.0" height="85.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="398.0" width="6.0" height="83.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="421.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="270"><tspan x="58.0" dy="0">Oxígeno al 100 % con reservorio</tspan></text><text x="58.0" y="442.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="270"><tspan x="58.0" dy="0">Vigilar de cerca; reevaluar la vía aérea.</tspan><tspan x="58.0" dy="16">Luego líquidos y analgesia.</tspan></text><rect x="364.0" y="397.0" width="596.0" height="384.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="844.6" y="386.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="401.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><text x="382.0" y="423.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">Intubación orotraqueal precoz</tspan></text><text x="382.0" y="445.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">Con el tubo más grueso posible, antes de que el edema progrese.</tspan></text><g transform="translate(472.0,465.0) scale(1.1)"><path d="M60 20 C120 0 190 20 200 80 C204 110 196 130 184 140 L180 170 L150 176 L150 240 L90 240 L92 160 C60 150 40 120 40 80 C40 50 46 30 60 20 Z" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M184 96 L204 104 L186 112" fill="#fde7d4" stroke="#e9b48f" stroke-width="2" stroke-linejoin="round" /><path d="M184 122 C170 124 160 120 150 116" fill="none" stroke="#57534e" stroke-width="5" stroke-linejoin="round" /><path d="M150 116 C130 120 116 140 118 176 L120 240" fill="none" stroke="#fda4af" stroke-width="16" stroke-linejoin="round" /><ellipse cx="126" cy="170" rx="14" ry="10" fill="#ea580c" stroke="#9a3412" stroke-width="2" /><ellipse cx="112" cy="170" rx="10" ry="8" fill="#ea580c" stroke="#9a3412" stroke-width="2" opacity="0.8"/><path d="M206 100 C160 108 130 130 122 180 L122 240" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="160" cy="118" r="2.2" fill="#1f2937" stroke="none" stroke-width="0" /><circle cx="168" cy="114" r="2.2" fill="#1f2937" stroke="none" stroke-width="0" /><circle cx="176" cy="118" r="2.2" fill="#1f2937" stroke="none" stroke-width="0" /><circle cx="184" cy="114" r="2.2" fill="#1f2937" stroke="none" stroke-width="0" /><ellipse cx="160" cy="60" rx="14" ry="8" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.5" /><ellipse cx="90" cy="70" rx="12" ry="8" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.5" /><text x="230" y="60" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Quemadura facial</text><text x="230" y="60" font-size="10.5" font-weight="800" fill="#0f172a" text-anchor="start" data-max="0">Quemadura facial</text><line x1="228" y1="56" x2="172" y2="60" stroke="#334155" stroke-width="1.3"/><circle cx="172" cy="60" r="2.6" fill="#334155"/><text x="230" y="120" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Hollín en la boca</text><text x="230" y="120" font-size="10.5" font-weight="800" fill="#0f172a" text-anchor="start" data-max="0">Hollín en la boca</text><line x1="228" y1="116" x2="186" y2="118" stroke="#334155" stroke-width="1.3"/><circle cx="186" cy="118" r="2.6" fill="#334155"/><text x="230" y="170" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Edema de la laringe:</text><text x="230" y="170" font-size="10.5" font-weight="800" fill="#9a3412" text-anchor="start" data-max="0">Edema de la laringe:</text><text x="230" y="184" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">cierra la vía aérea</text><text x="230" y="184" font-size="10.5" font-weight="800" fill="#9a3412" text-anchor="start" data-max="0">cierra la vía aérea</text><line x1="228" y1="172" x2="140" y2="170" stroke="#9a3412" stroke-width="1.3"/><circle cx="140" cy="170" r="2.6" fill="#9a3412"/><text x="230" y="216" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">Tubo endotraqueal</text><text x="230" y="216" font-size="10.5" font-weight="800" fill="#0369a1" text-anchor="start" data-max="0">Tubo endotraqueal</text><line x1="228" y1="212" x2="124" y2="212" stroke="#0369a1" stroke-width="1.3"/><circle cx="124" cy="212" r="2.6" fill="#0369a1"/></g><text x="382.0" y="763.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">La mucosa de la laringe se hincha en horas; el tubo (azul) mantiene abierta la vía aérea.</tspan></text><text x="40.0" y="815.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">DESPUÉS DE ASEGURAR LA VÍA AÉREA</tspan></text><rect x="40.0" y="825.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="826.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="849.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Oxígeno al 100 %</tspan></text><text x="58.0" y="870.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Desplaza el monóxido de carbono.</tspan></text><rect x="351.3" y="825.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="826.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="849.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Líquidos: Parkland</tspan></text><text x="369.3" y="870.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">4 mL × kg × % SCQ en 24 h.</tspan></text><rect x="662.7" y="825.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="826.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="849.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Analgesia y referencia</tspan></text><text x="680.7" y="870.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">A unidad de quemados.</tspan></text><text x="40.0" y="934.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="944.0" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="966.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="966.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">O₂ con reservorio</tspan></text><rect x="400.5" y="947.0" width="181.5" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="966.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Intubación precoz</tspan></text><text x="678.8" y="966.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Opioide EV</tspan></text><text x="866.2" y="966.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Parkland</tspan></text><rect x="40.0" y="981.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="981.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1002.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Es lo primero?</tspan></text><text x="303.8" y="1002.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No: no protege la vía aérea</tspan></text><text x="491.2" y="1002.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Sí: A del ABCDE</tspan></text><text x="678.8" y="1002.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">No</tspan></text><text x="866.2" y="1002.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">No: va después de la A</tspan></text><rect x="40.0" y="944.0" width="920.0" height="71.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1039.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1067.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1089.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Estridor, ronquera, hollín, quemadura facial o de cuello en incendio cerrado: intubación precoz.</tspan><tspan x="58.0" dy="18">• Luego: oxígeno al 100 % (monóxido de carbono), reposición con Parkland y analgesia.</tspan><tspan x="58.0" dy="18">• Esperar puede cerrar la vía aérea y obligar a una cricotiroidotomía.</tspan></text><text x="58.0" y="1147.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ATLS 11.ª ed. (2025); American Burn Association.</tspan></text></svg>