<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1205" viewBox="0 0 1000 1205" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Ante sospecha de urolitiasis en el adulto, la tomografía helicoidal sin contraste es el estudio de elección"><title>Ante sospecha de urolitiasis en el adulto, la tomografía helicoidal sin contraste es el estudio de elección</title><rect x="0.75" y="0.75" width="998.5" height="1203.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Urología · imagen en el cólico renoureteral</tspan></text><rect x="451.6" y="32.0" width="182.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="542.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="167"><tspan x="542.8" dy="0">NEFROLOGÍA Y UROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Urolitiasis</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cólico lumbar que irradia a la fosa ilíaca y los genitales, con hematuria, náuseas y</tspan><tspan x="58.0" dy="17">agitación.</tspan><tspan x="58.0" dy="17">La imagen confirma, localiza y mide el cálculo.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de estudio</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Cuál es el examen preferencial ante la sospecha de</tspan><tspan x="640.0" dy="16">urolitiasis?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ ESTUDIO SE PIDE EN CADA SITUACIÓN</tspan></text><rect x="40.0" y="269.0" width="920.0" height="144.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="269.0" width="108.0" height="144.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="337.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Adulto con</tspan><tspan x="94.0" dy="14">sospecha de</tspan><tspan x="94.0" dy="14">urolitiasis</tspan></text><rect x="40.0" y="413.0" width="920.0" height="144.0" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="413.0" width="108.0" height="144.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="481.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">Embarazada,</tspan><tspan x="94.0" dy="14">niño o</tspan><tspan x="94.0" dy="14">seguimiento</tspan></text><rect x="40.0" y="557.0" width="920.0" height="144.0" rx="0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/><rect x="40.0" y="557.0" width="108.0" height="144.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="94.0" y="629.0" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="94"><tspan x="94.0" dy="0">No son de</tspan><tspan x="94.0" dy="14">primera línea</tspan></text><line x1="307.2" y1="341.0" x2="314.2" y2="341.0" stroke="#0f766e" stroke-width="2.2"/><line x1="314.2" y1="341.0" x2="314.2" y2="476.5" stroke="#0f766e" stroke-width="2.2"/><line x1="314.2" y1="476.5" x2="312.2" y2="476.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="312.2,481.5 312.2,471.5 321.2,476.5" fill="#0f766e"/><line x1="470.4" y1="476.5" x2="477.4" y2="476.5" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="476.5" x2="477.4" y2="621.0" stroke="#0f766e" stroke-width="2.2"/><line x1="477.4" y1="621.0" x2="475.4" y2="621.0" stroke="#0f766e" stroke-width="2.2"/><polygon points="475.4,626.0 475.4,616.0 484.4,621.0" fill="#0f766e"/><line x1="633.6" y1="621.0" x2="640.6" y2="621.0" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="621.0" x2="640.6" y2="612.5" stroke="#0f766e" stroke-width="2.2"/><line x1="640.6" y1="612.5" x2="638.6" y2="612.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="638.6,617.5 638.6,607.5 647.6,612.5" fill="#0f766e"/><line x1="796.8" y1="612.5" x2="803.8" y2="612.5" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="612.5" x2="803.8" y2="604.5" stroke="#0f766e" stroke-width="2.2"/><line x1="803.8" y1="604.5" x2="801.8" y2="604.5" stroke="#0f766e" stroke-width="2.2"/><polygon points="801.8,609.5 801.8,599.5 810.8,604.5" fill="#0f766e"/><rect x="158.0" y="282.0" width="149.2" height="118.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="168.0" y="298.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Tomografía sin</tspan><tspan x="168.0" dy="16">contraste</tspan></text><text x="168.0" y="331.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="168.0" dy="0">Sensibilidad de 95 a 98</tspan><tspan x="168.0" dy="14.5">%; detecta todo tipo de</tspan><tspan x="168.0" dy="14.5">cálculo y diagnósticos</tspan><tspan x="168.0" dy="14.5">alternativos</tspan></text><circle cx="158.0" cy="282.0" r="11" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="158.0" y="286.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="158.0" dy="0">1</tspan></text><rect x="321.2" y="426.0" width="149.2" height="101.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="331.2" y="442.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Ecografía renal</tspan></text><text x="331.2" y="459.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="331.2" dy="0">Sin radiación; muestra</tspan><tspan x="331.2" dy="14.5">hidronefrosis, pero deja</tspan><tspan x="331.2" dy="14.5">pasar cálculos ureterales</tspan><tspan x="331.2" dy="14.5">pequeños</tspan></text><circle cx="321.2" cy="426.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="321.2" y="430.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="321.2" dy="0">2</tspan></text><rect x="484.4" y="570.0" width="149.2" height="102.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="494.4" y="586.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Radiografía simple de</tspan><tspan x="494.4" dy="16">abdomen</tspan></text><text x="494.4" y="619.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="494.4" dy="0">Solo cálculos</tspan><tspan x="494.4" dy="14.5">radioopacos; sensibilidad</tspan><tspan x="494.4" dy="14.5">de 50 a 60 %</tspan></text><circle cx="484.4" cy="570.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="484.4" y="574.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="484.4" dy="0">3</tspan></text><rect x="647.6" y="570.0" width="149.2" height="85.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="657.6" y="586.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Pielografía retrógrada</tspan></text><text x="657.6" y="603.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="657.6" dy="0">Invasiva; se usa en el</tspan><tspan x="657.6" dy="14.5">tratamiento, no para el</tspan><tspan x="657.6" dy="14.5">diagnóstico inicial</tspan></text><circle cx="647.6" cy="570.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="647.6" y="574.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="647.6" dy="0">4</tspan></text><rect x="810.8" y="570.0" width="149.2" height="69.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/><text x="820.8" y="586.0" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Cistoscopía</tspan></text><text x="820.8" y="603.0" font-size="10.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="129"><tspan x="820.8" dy="0">Examina la vejiga; no es</tspan><tspan x="820.8" dy="14.5">un estudio de cólico</tspan></text><circle cx="810.8" cy="570.0" r="11" fill="#134e4a" stroke="#ffffff" stroke-width="2"/><text x="810.8" y="574.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="810.8" dy="0">5</tspan></text><rect x="40.0" y="719.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="745.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Sospecha de urolitiasis en el adulto = tomografía sin contraste</tspan></text><text x="60.0" y="764.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">La ecografía es la primera opción en la embarazada y el niño.</tspan></text><text x="40.0" y="831.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="841.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="872.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="844.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="863.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Tomografía</tspan><tspan x="285.0" dy="17">computarizada</tspan></text><text x="435.0" y="872.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Ecografía renal</tspan></text><text x="585.0" y="863.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Radiografía simple</tspan><tspan x="585.0" dy="17">de abdomen</tspan></text><text x="735.0" y="863.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Pielografía</tspan><tspan x="735.0" dy="17">retrógrada</tspan></text><text x="885.0" y="872.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Cistoscopía</tspan></text><rect x="40.0" y="895.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="895.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="924.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Examen preferencial?</tspan></text><text x="285.0" y="916.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: más sensible y</tspan><tspan x="285.0" dy="16">específico</tspan></text><text x="435.0" y="916.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: de elección en la</tspan><tspan x="435.0" dy="16">embarazada y el niño</tspan></text><text x="585.0" y="916.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: solo ve cálculos</tspan><tspan x="585.0" dy="16">radioopacos</tspan></text><text x="735.0" y="916.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: invasiva, no es de</tspan><tspan x="735.0" dy="16">primera línea</tspan></text><text x="885.0" y="916.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: invasiva, no es de</tspan><tspan x="885.0" dy="16">primera línea</tspan></text><rect x="40.0" y="841.0" width="920.0" height="104.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="969.0" width="920.0" height="218.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="997.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1019.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• La tomografía sin contraste (de baja dosis) tiene sensibilidad y especificidad de 95 a 98 %, ve cálculos de cualquier composición (también ácido úrico) y</tspan><tspan x="58.0" dy="18">   mide el tamaño y la densidad en unidades Hounsfield.</tspan><tspan x="58.0" dy="18">• Ecografía renal: primera opción en la embarazada y el niño, y para seguimiento; en urgencias, empezar por ella redujo la radiación sin más desenlaces</tspan><tspan x="58.0" dy="18">   graves (Smith-Bindman 2014), pero omite cálculos pequeños.</tspan><tspan x="58.0" dy="18">• La radiografía simple solo ve cálculos radioopacos (sensibilidad de 50 a 60 %). La pielografía retrógrada y la cistoscopía son invasivas y no son de</tspan><tspan x="58.0" dy="18">   primera línea.</tspan><tspan x="58.0" dy="18">• Alerta: fiebre con obstrucción o anuria exige derivación urgente (sonda doble J o nefrostomía).</tspan></text><text x="58.0" y="1149.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: AUA, Medical Management of Kidney Stones (J Urol 2026); Smith-Bindman R et al., Ecografía vs. tomografía en sospecha de nefrolitiasis (N Engl J Med 2014);</tspan><tspan x="58.0" dy="15">Campbell-Walsh-Wein Urología, 12.ª ed. (2020).</tspan></text></svg>