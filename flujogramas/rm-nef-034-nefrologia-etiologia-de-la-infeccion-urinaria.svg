<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1035" viewBox="0 0 1000 1035" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Escherichia coli causa cerca de 75 a 90 % de las infecciones urinarias de la comunidad en adultos"><title>Escherichia coli causa cerca de 75 a 90 % de las infecciones urinarias de la comunidad en adultos</title><rect x="0.75" y="0.75" width="998.5" height="1033.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Nefrología · etiología de la infección urinaria</tspan></text><rect x="461.8" y="32.0" width="182.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="553.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="167"><tspan x="553.0" dy="0">NEFROLOGÍA Y UROLOGÍA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="135.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Infección urinaria</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Casi siempre ascendente: el germen intestinal coloniza el periné y sube por la uretra.</tspan><tspan x="58.0" dy="17">Más común en mujeres por su uretra corta.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="135.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="133.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Pregunta de etiología</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">¿Qué germen causa el 80 % de las infecciones</tspan><tspan x="640.0" dy="16">urinarias en adultos?</tspan></text><rect x="640.0" y="196.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="209.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="209.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="257.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">GÉRMENES DE LA INFECCIÓN URINARIA, DEL MÁS AL MENOS FRECUENTE</tspan></text><polygon points="200.0,269.0 300.0,269.0 340.0,325.0 160.0,325.0" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="302.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="88"><tspan x="250.0" dy="0">1</tspan></text><rect x="486.0" y="269.0" width="474.0" height="56.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="501.0" y="293.5" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Escherichia coli</tspan></text><text x="501.0" y="310.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">75 a 90 % de las infecciones de la comunidad</tspan></text><rect x="858.2" y="258.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="903.6" y="273.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="903.6" dy="0">◆ ESTE CASO</tspan></text><polygon points="160.0,331.0 340.0,331.0 380.0,387.0 120.0,387.0" fill="#99f6e4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="364.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="168"><tspan x="250.0" dy="0">2</tspan></text><rect x="486.0" y="331.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="355.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Staphylococcus saprophyticus y Klebsiella</tspan></text><text x="501.0" y="372.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Mujer joven sexualmente activa; Klebsiella le sigue</tspan></text><polygon points="120.0,393.0 380.0,393.0 420.0,449.0 80.0,449.0" fill="#5eead4" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="426.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="248"><tspan x="250.0" dy="0">3</tspan></text><rect x="486.0" y="393.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="417.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Proteus mirabilis</tspan></text><text x="501.0" y="434.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Ureasa: orina alcalina y litiasis infecciosa</tspan></text><polygon points="80.0,455.0 420.0,455.0 460.0,511.0 40.0,511.0" fill="#2dd4bf" stroke="#ffffff" stroke-width="2"/><text x="250.0" y="488.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="328"><tspan x="250.0" dy="0">4</tspan></text><rect x="486.0" y="455.0" width="474.0" height="56.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="501.0" y="479.5" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Pseudomonas, Enterobacter y enterococos</tspan></text><text x="501.0" y="496.5" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="444"><tspan x="501.0" dy="0">Sonda, instrumentación u hospitalización</tspan></text><text x="250.0" y="529.0" font-size="10.5" font-weight="700" font-style="normal" fill="#64748b" text-anchor="middle" data-max="420"><tspan x="250.0" dy="0">▲ más frecuente · ▼ menos frecuente</tspan></text><rect x="40.0" y="551.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="577.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">80 % de las infecciones urinarias = Escherichia coli</tspan></text><text x="60.0" y="596.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Los demás gérmenes pesan en la litiasis o en el medio hospitalario.</tspan></text><text x="40.0" y="663.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="673.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="704.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="695.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Enterobacter</tspan><tspan x="285.0" dy="17">cloacae</tspan></text><text x="435.0" y="704.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Proteus mirabilis</tspan></text><text x="585.0" y="695.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Pseudomonas</tspan><tspan x="585.0" dy="17">aeruginosa</tspan></text><rect x="663.0" y="676.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="735.0" y="704.0" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Escherichia coli</tspan></text><text x="885.0" y="695.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Klebsiella</tspan><tspan x="885.0" dy="17">pneumoniae</tspan></text><rect x="40.0" y="727.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="663.0" y="727.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="756.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Germen más</tspan><tspan x="54.0" dy="16">frecuente?</tspan></text><text x="285.0" y="748.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: propio de infección</tspan><tspan x="285.0" dy="16">asociada a</tspan><tspan x="285.0" dy="16">instrumentación</tspan></text><text x="435.0" y="756.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">No: asociado a litiasis</tspan><tspan x="435.0" dy="16">infecciosa</tspan></text><text x="585.0" y="756.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: propio de infección</tspan><tspan x="585.0" dy="16">hospitalaria</tspan></text><text x="735.0" y="756.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Sí: 75 a 90 % de las</tspan><tspan x="735.0" dy="16">infecciones</tspan></text><text x="885.0" y="756.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: menos frecuente</tspan><tspan x="885.0" dy="16">que E. coli</tspan></text><rect x="40.0" y="673.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="817.0" width="920.0" height="200.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="845.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="867.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• E. coli uropatógena (fimbrias tipo 1 y P) causa 75 a 90 % de las cistitis y pielonefritis comunitarias. Luego S. saprophyticus en mujer joven, Klebsiella y</tspan><tspan x="58.0" dy="18">   Proteus.</tspan><tspan x="58.0" dy="18">• Pseudomonas, Enterobacter y enterococos predominan en la infección asociada a sonda, instrumentación u hospitalización, con BLEE.</tspan><tspan x="58.0" dy="18">• Cistitis no complicada: nitrofurantoína, fosfomicina o cotrimoxazol según resistencia local; fluoroquinolonas reservadas. En el Perú la resistencia de E.</tspan><tspan x="58.0" dy="18">   coli es alta: urocultivo ante recurrencia.</tspan><tspan x="58.0" dy="18">• Alerta: la bacteriuria asintomática solo se trata en el embarazo y antes de procedimientos urológicos con sangrado de mucosa.</tspan></text><text x="58.0" y="979.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Gupta K et al., IDSA/ESCMID, Clin Infect Dis 2011;52:e103-e120; Trautner BW et al., IDSA guideline on complicated UTI, Clin Infect Dis 2025, doi:10.1093/cid/ciaf462;</tspan><tspan x="58.0" dy="15">Campbell-Walsh-Wein Urología 12.ª ed. (2020).</tspan></text></svg>