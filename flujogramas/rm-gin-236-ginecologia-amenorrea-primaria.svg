<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1194" viewBox="0 0 1000 1194" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Amenorrea primaria con poco desarrollo mamario y útero presente: el siguiente examen es la FSH"><title>Amenorrea primaria con poco desarrollo mamario y útero presente: el siguiente examen es la FSH</title><rect x="0.75" y="0.75" width="998.5" height="1192.4" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Ginecología · amenorrea primaria</tspan></text><rect x="398.3" y="32.0" width="159.5" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="478.0" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="144"><tspan x="478.0" dy="0">GINECO-OBSTETRICIA RM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Amenorrea primaria</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Ausencia de menarquia a los 15 años con caracteres sexuales o a los 13 sin ellos.</tspan><tspan x="58.0" dy="17">Se clasifica por el desarrollo mamario y la presencia de útero.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Mujer de 16 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Sin menarquia y con pobre desarrollo de caracteres</tspan><tspan x="640.0" dy="16">secundarios.</tspan><tspan x="640.0" dy="16">La ecografía muestra útero.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CÓMO SE ELIGE EL EXAMEN QUE SIGUE</tspan></text><text x="614.0" y="297.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="346"><tspan x="614.0" dy="0">DIAGNÓSTICOS EN JUEGO</tspan></text><polygon points="40.0,309.0 580.0,309.0 543.8,369.0 76.2,369.0" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/><text x="310.0" y="325.0" font-size="9.5" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="310.0" dy="0">SE SOSPECHA</tspan></text><text x="310.0" y="340.5" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="424"><tspan x="310.0" dy="0">Amenorrea primaria, caracteres poco desarrollados y útero</tspan><tspan x="310.0" dy="17">presente</tspan></text><line x1="565.9" y1="339.0" x2="606.0" y2="339.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="326.0" width="45.5" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="636.8" y="343.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="636.8" dy="0">TSH</tspan></text><rect x="665.5" y="326.0" width="45.5" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="688.3" y="343.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="688.3" dy="0">FSH</tspan></text><rect x="717.1" y="326.0" width="69.1" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="751.6" y="343.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="751.6" dy="0">Cariotipo</tspan></text><rect x="792.2" y="326.0" width="74.3" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="829.3" y="343.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="829.3" dy="0">Prolactina</tspan></text><rect x="872.5" y="326.0" width="84.6" height="26.0" rx="13" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="914.8" y="343.5" font-size="11" font-weight="600" font-style="normal" fill="#334155" text-anchor="middle" data-max="0"><tspan x="914.8" dy="0">TAC pélvica</tspan></text><polygon points="76.2,373.0 543.8,373.0 507.5,429.0 112.5,429.0" fill="#ccfbf1" stroke="#99f6e4" stroke-width="1.5"/><circle cx="138.5" cy="401.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="138.5" y="405.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="138.5" dy="0">1</tspan></text><text x="320.0" y="405.5" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="331"><tspan x="320.0" dy="0">¿El útero ya se confirmó por ecografía?</tspan></text><line x1="529.6" y1="401.0" x2="606.0" y2="401.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="388.0" width="96.5" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="662.2" y="405.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="662.2" dy="0">✕ TAC pélvica</tspan></text><line x1="636.0" y1="401.5" x2="700.5" y2="401.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="112.5,433.0 507.5,433.0 471.2,493.0 148.8,493.0" fill="#99f6e4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="174.8" cy="463.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="174.8" y="467.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="174.8" dy="0">2</tspan></text><text x="320.0" y="459.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="258"><tspan x="320.0" dy="0">¿Se pide solo con gonadotropinas</tspan><tspan x="320.0" dy="17">bajas?</tspan></text><line x1="493.4" y1="463.0" x2="606.0" y2="463.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="450.0" width="57.4" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="642.7" y="467.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="642.7" dy="0">✕ TSH</tspan></text><line x1="636.0" y1="463.5" x2="661.4" y2="463.5" stroke="#94a3b8" stroke-width="1.2"/><rect x="677.4" y="450.0" width="86.4" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="720.6" y="467.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="720.6" dy="0">✕ Prolactina</tspan></text><line x1="699.4" y1="463.5" x2="753.9" y2="463.5" stroke="#94a3b8" stroke-width="1.2"/><polygon points="148.8,497.0 471.2,497.0 435.0,557.0 185.0,557.0" fill="#5eead4" stroke="#99f6e4" stroke-width="1.5"/><circle cx="211.0" cy="527.0" r="11" fill="#0f766e" stroke="none" stroke-width="0"/><text x="211.0" y="531.0" font-size="11" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="211.0" dy="0">3</tspan></text><text x="320.0" y="523.0" font-size="12.5" font-weight="600" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="186"><tspan x="320.0" dy="0">¿Se pide solo cuando la FSH</tspan><tspan x="320.0" dy="17">sale alta?</tspan></text><line x1="457.1" y1="527.0" x2="606.0" y2="527.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="614.0" y="514.0" width="81.2" height="26.0" rx="13" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/><text x="654.6" y="531.5" font-size="11" font-weight="500" font-style="normal" fill="#94a3b8" text-anchor="middle" data-max="0"><tspan x="654.6" dy="0">✕ Cariotipo</tspan></text><line x1="636.0" y1="527.5" x2="685.2" y2="527.5" stroke="#94a3b8" stroke-width="1.2"/><line x1="310.0" y1="561.0" x2="310.0" y2="580.0" stroke="#0f766e" stroke-width="2"/><polygon points="305.0,579.0 315.0,579.0 310.0,587.0" fill="#0f766e"/><rect x="140.0" y="591.0" width="340.0" height="91.9" rx="10" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/><text x="310.0" y="620.3" font-size="14" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">FSH (CON LH)</tspan></text><text x="310.0" y="644.7" font-size="12" font-weight="400" font-style="normal" fill="#ecfeff" text-anchor="middle" data-max="312"><tspan x="310.0" dy="0">Separa fallo gonadal de causa central</tspan><tspan x="310.0" dy="17">Define el estudio que sigue</tspan></text><rect x="370.6" y="580.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="416.0" y="595.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="416.0" dy="0">◆ ESTE CASO</tspan></text><rect x="614.0" y="598.9" width="346.0" height="76.0" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.2"/><text x="628.0" y="618.9" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">CLAVE DEL CASO</tspan></text><text x="628.0" y="636.9" font-size="11.5" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="318"><tspan x="628.0" dy="0">Con FSH alta se pide cariotipo; con FSH baja o normal,</tspan><tspan x="628.0" dy="16">prolactina, TSH y resonancia de silla turca.</tspan></text><text x="40.0" y="716.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">INTERPRETACIÓN DE LA FSH EN LA AMENORREA PRIMARIA</tspan></text><rect x="40.0" y="728.9" width="920.0" height="29.0" rx="0" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="50.0" y="747.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">FSH</tspan></text><text x="220.0" y="747.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Tipo de hipogonadismo</tspan></text><text x="595.0" y="747.9" font-size="11.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Estudio que sigue</tspan></text><rect x="40.0" y="757.9" width="920.0" height="29.0" rx="0" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="50.0" y="776.9" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Alta</tspan></text><text x="220.0" y="776.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Hipergonadotrópico (más de 20-40 UI/L): fallo ovárico primario</tspan></text><text x="595.0" y="776.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Cariotipo (Turner 45,X, disgenesia gonadal)</tspan></text><rect x="110.6" y="761.4" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="156.0" y="776.4" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="156.0" dy="0">◆ ESTE CASO</tspan></text><rect x="40.0" y="786.9" width="920.0" height="29.0" rx="0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/><text x="50.0" y="805.9" font-size="11.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="154"><tspan x="50.0" dy="0">Baja o normal</tspan></text><text x="220.0" y="805.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="220.0" dy="0">Hipogonadotrópico: causa hipotálamo-hipofisaria</tspan></text><text x="595.0" y="805.9" font-size="11.5" font-weight="500" font-style="normal" fill="#475569" text-anchor="start" data-max="359"><tspan x="595.0" dy="0">Prolactina, TSH y resonancia de silla turca</tspan></text><text x="40.0" y="855.9" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="865.9" width="920.0" height="37.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="888.4" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="888.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">TSH</tspan></text><rect x="363.0" y="868.9" width="144.0" height="31.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="888.4" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">FSH</tspan></text><text x="585.0" y="888.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Cariotipo</tspan></text><text x="735.0" y="888.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Prolactina</tspan></text><text x="885.0" y="888.4" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">TAC pélvica</tspan></text><rect x="40.0" y="902.9" width="920.0" height="82.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="902.9" width="144.0" height="82.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="947.9" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Siguiente examen?</tspan></text><text x="285.0" y="939.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: se pide si la FSH</tspan><tspan x="285.0" dy="16">sale baja</tspan></text><text x="435.0" y="923.9" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: separa</tspan><tspan x="435.0" dy="16">hipogonadismo</tspan><tspan x="435.0" dy="16">hipergonadotrópico del</tspan><tspan x="435.0" dy="16">hipogonadotrópico</tspan></text><text x="585.0" y="939.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: se pide si la FSH</tspan><tspan x="585.0" dy="16">sale alta</tspan></text><text x="735.0" y="939.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: se pide si la FSH</tspan><tspan x="735.0" dy="16">sale baja</tspan></text><text x="885.0" y="939.9" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: el útero ya se vio</tspan><tspan x="885.0" dy="16">en la ecografía</tspan></text><rect x="40.0" y="865.9" width="920.0" height="119.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1008.9" width="920.0" height="167.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1036.9" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE RM:</tspan></text><text x="58.0" y="1058.9" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Poco desarrollo mamario indica déficit de estrógenos: hipogonadismo hipergonadotrópico (disgenesia gonadal, Turner 45,X) o hipogonadotrópico (retraso</tspan><tspan x="58.0" dy="18">   constitucional, Kallmann, hipopituitarismo).</tspan><tspan x="58.0" dy="18">• La FSH y la LH separan los dos grupos: FSH alta (más de 20-40 UI/L) indica fallo gonadal primario y obliga a pedir cariotipo.</tspan><tspan x="58.0" dy="18">• Con FSH baja o normal se piden prolactina, TSH y resonancia de silla turca; la tomografía pélvica aporta poco si el útero se vio en la ecografía.</tspan><tspan x="58.0" dy="18">• Turner: talla baja, cuello alado, cardiopatía y anomalías renales; con cromosoma Y se hace gonadectomía por el riesgo de gonadoblastoma.</tspan></text><text x="58.0" y="1152.9" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: ASRM, Current evaluation of amenorrhea (Fertil Steril 2008); ACOG Committee Opinion N.º 651 (Obstet Gynecol 2015); Williams Obstetricia 26.ª ed. (2022).</tspan></text></svg>