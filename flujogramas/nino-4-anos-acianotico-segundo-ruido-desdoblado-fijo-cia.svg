<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="801" viewBox="0 0 1000 801" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Niño acianótico y eutrófico con segundo ruido desdoblado y fijo: comunicación interauricular"><title>Niño acianótico y eutrófico con segundo ruido desdoblado y fijo: comunicación interauricular</title><rect x="0.75" y="0.75" width="998.5" height="799.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Cardiopatías congénitas acianóticas</tspan></text><rect x="415.3" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="471.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="471.8" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="148.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Comunicación interauricular</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Cortocircuito de izquierda a derecha en las aurículas: sobrecarga del VD; suele ser</tspan><tspan x="58.0" dy="17">asintomática en la infancia.</tspan><tspan x="58.0" dy="17">Desdoblamiento fijo del 2.º ruido (no cambia con la respiración) + soplo sistólico pulmonar</tspan><tspan x="58.0" dy="17">suave.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="148.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="146.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 4 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Control de niño sano; peso y talla en p75.</tspan><tspan x="640.0" dy="16">Acianótico; segundo ruido desdoblado y fijo.</tspan></text><rect x="640.0" y="209.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="222.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="222.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="270.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">CARDIOPATÍAS: ¿CIANOSIS Y QUÉ SE AUSCULTA?</tspan></text><rect x="40.0" y="282.0" width="920.0" height="34.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.2"/><text x="54.0" y="304.0" font-size="10.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="130"><tspan x="54.0" dy="0">COLOR</tspan></text><text x="382.5" y="304.0" font-size="11.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="middle" data-max="365"><tspan x="382.5" dy="0">Desdoblamiento fijo del 2.º ruido</tspan></text><text x="767.5" y="304.0" font-size="11.5" font-weight="800" font-style="normal" fill="#334155" text-anchor="middle" data-max="365"><tspan x="767.5" dy="0">Otro hallazgo</tspan></text><rect x="40.0" y="322.0" width="144.0" height="57.0" rx="10" fill="#ea580c" stroke="#ea580c" stroke-width="1.5"/><text x="54.0" y="348.0" font-size="12.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="122"><tspan x="54.0" dy="0">Acianótico</tspan></text><text x="54.0" y="365.0" font-size="10.5" font-weight="500" font-style="normal" fill="#ffedd5" text-anchor="start" data-max="122"><tspan x="54.0" dy="0">Este caso</tspan></text><rect x="193.0" y="322.0" width="379.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="205.0" y="347.0" font-size="12" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="361"><tspan x="205.0" dy="0">COMUNICACIÓN INTERAURICULAR</tspan></text><text x="205.0" y="363.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="361"><tspan x="205.0" dy="0">Ostium secundum</tspan></text><rect x="471.2" y="311.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="516.6" y="326.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="516.6" dy="0">◆ ESTE CASO</tspan></text><rect x="578.0" y="322.0" width="379.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="590.0" y="347.0" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="361"><tspan x="590.0" dy="0">CIV, ductus, coartación</tspan></text><text x="590.0" y="363.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="361"><tspan x="590.0" dy="0">Soplos distintos</tspan></text><rect x="40.0" y="385.0" width="144.0" height="43.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="54.0" y="411.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="122"><tspan x="54.0" dy="0">Cianótico</tspan></text><rect x="193.0" y="385.0" width="379.0" height="43.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="205.0" y="410.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="361"><tspan x="205.0" dy="0">—</tspan></text><rect x="578.0" y="385.0" width="379.0" height="43.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="590.0" y="410.5" font-size="12" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="361"><tspan x="590.0" dy="0">Fallot, transposición, atresia</tspan></text><text x="44.0" y="450.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="start" data-max="900"><tspan x="44.0" dy="0">Fijo: no cambia con la respiración.</tspan></text><text x="40.0" y="498.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="508.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="539.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="285.0" y="539.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Atresia pulmonar</tspan></text><rect x="363.0" y="511.0" width="144.0" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="435.0" y="530.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Comunicación</tspan><tspan x="435.0" dy="17">interauricular</tspan></text><text x="585.0" y="530.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Transposición de</tspan><tspan x="585.0" dy="17">grandes vasos</tspan></text><text x="735.0" y="539.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Tetralogía de Fallot</tspan></text><text x="885.0" y="539.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Coartación de aorta</tspan></text><rect x="40.0" y="562.0" width="920.0" height="66.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="363.0" y="562.0" width="144.0" height="66.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="599.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Diagnóstico?</tspan></text><text x="285.0" y="599.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">No: cianótica</tspan></text><text x="435.0" y="599.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Sí: desdoblamiento fijo</tspan></text><text x="585.0" y="599.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">No: cianótica</tspan></text><text x="735.0" y="599.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">No: cianótica</tspan></text><text x="885.0" y="583.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: HTA en brazos,</tspan><tspan x="885.0" dy="16">pulsos femorales</tspan><tspan x="885.0" dy="16">débiles</tspan></text><rect x="40.0" y="508.0" width="920.0" height="120.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="652.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="680.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="702.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Ecocardiograma para confirmar el tipo (ostium secundum el más frecuente).</tspan><tspan x="58.0" dy="18">• Cierre con dispositivo o cirugía si es significativa (VD dilatado) entre los 2 y 5 años.</tspan><tspan x="58.0" dy="18">• Sin tratar: hipertensión pulmonar y arritmias en el adulto.</tspan></text><text x="58.0" y="760.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Nelson Tratado de Pediatría 22.ª ed. (2024); AHA/ACC, cardiopatías congénitas del adulto (2018).</tspan></text></svg>