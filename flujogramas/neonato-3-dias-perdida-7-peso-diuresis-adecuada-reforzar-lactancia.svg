<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1217" viewBox="0 0 1000 1217" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Neonato de 3 días que perdió 7 % y orina bien: reforzar la lactancia y vigilar el peso"><title>Neonato de 3 días que perdió 7 % y orina bien: reforzar la lactancia y vigilar el peso</title><rect x="0.75" y="0.75" width="998.5" height="1215.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Lactancia materna · pérdida de peso neonatal</tspan></text><rect x="469.3" y="32.0" width="113.0" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="525.8" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="97"><tspan x="525.8" dy="0">PEDIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="167.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Pérdida de peso en los primeros días</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Todo recién nacido pierde peso: se acepta hasta cerca del 10 %.</tspan><tspan x="58.0" dy="17">Recupera el peso de nacimiento hacia los 10-14 días.</tspan></text><rect x="620.0" y="90.0" width="340.0" height="167.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="165.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Neonato de 3 días, madre primigesta</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Perdió 7 %; orina ≥ 4 veces al día, deposiciones</tspan><tspan x="640.0" dy="16">amarillas, buena succión.</tspan><tspan x="640.0" dy="16">Activo, sin deshidratación; «quiere mamar a cada</tspan><tspan x="640.0" dy="16">rato».</tspan></text><rect x="640.0" y="228.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="241.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="241.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="289.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">¿LA LACTANCIA ES EFICAZ?</tspan></text><polygon points="220,337.0 260,301.0 740,301.0 780,337.0 740,373.0 260,373.0" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><circle cx="282.0" cy="337.0" r="13" fill="#f59e0b" stroke="none" stroke-width="0"/><text x="282.0" y="342.5" font-size="16" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="282.0" dy="0">?</tspan></text><text x="525.0" y="333.0" font-size="13.5" font-weight="700" font-style="normal" fill="#78350f" text-anchor="middle" data-max="410"><tspan x="525.0" dy="0">Recién nacido que pierde peso: ¿hay signos de lactancia</tspan><tspan x="525.0" dy="18">eficaz?</tspan></text><line x1="500.0" y1="373.0" x2="500.0" y2="393.0" stroke="#0f766e" stroke-width="2"/><line x1="190.0" y1="393.0" x2="662.0" y2="393.0" stroke="#0f766e" stroke-width="2"/><line x1="190.0" y1="393.0" x2="190.0" y2="422.0" stroke="#0f766e" stroke-width="2"/><polygon points="185.0,421.0 195.0,421.0 190.0,429.0" fill="#0f766e"/><line x1="662.0" y1="393.0" x2="662.0" y2="422.0" stroke="#ea580c" stroke-width="2"/><polygon points="657.0,421.0 667.0,421.0 662.0,429.0" fill="#ea580c"/><rect x="51.7" y="401.0" width="276.6" height="20.0" rx="10" fill="#64748b" stroke="none" stroke-width="1.5"/><text x="190.0" y="415.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="190.0" dy="0">No: pérdida &gt; 10 %, poca orina o succión débil</tspan></text><rect x="541.5" y="401.0" width="241.0" height="20.0" rx="10" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="662.0" y="415.0" font-size="11" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="662.0" dy="0">Sí: pierde 7 %, orina bien, succiona bien</tspan></text><rect x="40.0" y="429.0" width="300.0" height="101.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="41.0" y="430.0" width="6.0" height="99.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="58.0" y="453.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="270"><tspan x="58.0" dy="0">Evaluar la lactancia y al bebé</tspan></text><text x="58.0" y="474.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="270"><tspan x="58.0" dy="0">Observar una toma; electrolitos si hay</tspan><tspan x="58.0" dy="16">deshidratación.</tspan><tspan x="58.0" dy="16">Suplementar solo si está indicado.</tspan></text><rect x="364.0" y="429.0" width="596.0" height="364.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="844.6" y="418.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="890.0" y="433.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="890.0" dy="0">◆ ESTE CASO</tspan></text><text x="382.0" y="455.0" font-size="13" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">Reforzar la técnica y vigilar el peso</tspan></text><text x="382.0" y="477.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">Libre demanda, buena posición y agarre.</tspan><tspan x="382.0" dy="16">Control de peso en 48-72 h.</tspan></text><g transform="translate(472.0,513.0) scale(1.0)"><rect x="46" y="12" width="320" height="180" fill="#f8fafc" stroke="#cbd5e1"/><rect x="46" y="166.3" width="320" height="25.7" fill="#fecaca" opacity="0.35"/><text x="362" y="178.28571428571428" font-size="9.5" font-weight="700" fill="#334155" text-anchor="end" data-max="0">&gt; 10 %: evaluar</text><rect x="46" y="12.0" width="320" height="154.3" fill="#bbf7d0" opacity="0.35"/><text x="362" y="24.0" font-size="9.5" font-weight="700" fill="#334155" text-anchor="end" data-max="0">esperable</text><polyline points="46.0,37.7 78.0,76.3 110.0,108.4 142.0,127.7 174.0,121.3 206.0,102.0 270.0,76.3 366.0,44.1" fill="none" stroke="#0f766e" stroke-width="2.5"/><circle cx="142.0" cy="127.71428571428572" r="7" fill="#ea580c" stroke="#7c2d12" stroke-width="2" /><text x="152.0" y="117.71428571428572" font-size="10.5" font-weight="800" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" text-anchor="start" data-max="0">día 3: -7 %</text><text x="152.0" y="117.71428571428572" font-size="10.5" font-weight="800" fill="#9a3412" text-anchor="start" data-max="0">día 3: -7 %</text><text x="206.0" y="218" font-size="10" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">Días de vida</text><text x="4" y="20" font-size="10" font-weight="800" fill="#64748b" text-anchor="start" data-max="0">% del peso al nacer</text><text x="46.0" y="205" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">0</text><text x="206.0" y="205" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">5</text><text x="366.0" y="205" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="middle" data-max="0">10</text><text x="42" y="196.0" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">-12</text><text x="42" y="106.0" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">-5</text><text x="42" y="16.0" font-size="9.5" font-weight="800" fill="#64748b" text-anchor="end" data-max="0">2</text></g><text x="382.0" y="775.0" font-size="11.5" font-weight="600" font-style="normal" fill="#475569" text-anchor="start" data-max="560"><tspan x="382.0" dy="0">La curva baja los primeros días y se recupera hacia el día 10; el caso está en la zona verde.</tspan></text><text x="40.0" y="827.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ ENSEÑAR</tspan></text><rect x="40.0" y="837.0" width="297.3" height="69.0" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/><rect x="41.0" y="838.0" width="6.0" height="67.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="58.0" y="861.0" font-size="12.5" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">Libre demanda</tspan></text><text x="58.0" y="882.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="58.0" dy="0">8-12 tomas al día es lo normal.</tspan></text><rect x="237.5" y="826.0" width="90.8" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="282.9" y="841.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="282.9" dy="0">◆ ESTE CASO</tspan></text><rect x="351.3" y="837.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="352.3" y="838.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="369.3" y="861.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Posición y agarre</tspan></text><text x="369.3" y="882.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="369.3" dy="0">Boca bien abierta, labio evertido, areola dentro.</tspan></text><rect x="662.7" y="837.0" width="297.3" height="69.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="663.7" y="838.0" width="6.0" height="67.0" rx="3" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="680.7" y="861.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Señales de alarma</tspan></text><text x="680.7" y="882.0" font-size="11" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="267"><tspan x="680.7" dy="0">Poca orina, ictericia intensa, letargia.</tspan></text><text x="40.0" y="946.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="956.0" width="920.0" height="54.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="987.0" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><text x="303.8" y="987.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="303.8" dy="0">Extracción con equipo</tspan></text><rect x="400.5" y="959.0" width="181.5" height="48.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="491.2" y="978.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="168"><tspan x="491.2" dy="0">Reforzar técnica y vigilar</tspan><tspan x="491.2" dy="17">peso</tspan></text><text x="678.8" y="987.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="678.8" dy="0">Electrolitos séricos</tspan></text><text x="866.2" y="987.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="168"><tspan x="866.2" dy="0">Fórmula cada 3 horas</tspan></text><rect x="40.0" y="1010.0" width="920.0" height="34.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="400.5" y="1010.0" width="181.5" height="34.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="1031.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">Problema</tspan></text><text x="303.8" y="1031.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="303.8" dy="0">No hay indicación</tspan></text><text x="491.2" y="1031.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="166"><tspan x="491.2" dy="0">Ninguno</tspan></text><text x="678.8" y="1031.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="678.8" dy="0">Sin signos de deshidratación</tspan></text><text x="866.2" y="1031.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="166"><tspan x="866.2" dy="0">Desplaza la lactancia</tspan></text><rect x="40.0" y="956.0" width="920.0" height="88.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="1068.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="1096.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="1118.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Pérdida ≤ 10 % con buena diuresis, deposiciones de transición y buena succión: lactancia eficaz.</tspan><tspan x="58.0" dy="18">• Mamar a menudo (8-12 veces al día) es normal: estimula la producción de leche.</tspan><tspan x="58.0" dy="18">• Fórmula, extractor o electrolitos no están indicados; reforzar técnica y control de peso en 48-72 h.</tspan></text><text x="58.0" y="1176.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: OMS/UNICEF, lactancia materna; AAP (2022); MINSA Perú.</tspan></text></svg>