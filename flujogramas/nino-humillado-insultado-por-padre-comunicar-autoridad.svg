<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="971" viewBox="0 0 1000 971" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Niño con tristeza cuyo padre lo culpa, humilla e insulta constantemente: maltrato psicológico, informar a la autoridad competente"><title>Niño con tristeza cuyo padre lo culpa, humilla e insulta constantemente: maltrato psicológico, informar a la autoridad competente</title><rect x="0.75" y="0.75" width="998.5" height="969.5" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16.0" y="16.0" width="968.0" height="56.0" rx="10" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="36" y="51.0" font-size="20" font-weight="800" fill="#ffffff">MedQuiz<tspan fill="#5eead4">Plus</tspan></text><line x1="170.0" y1="34.0" x2="170.0" y2="54.0" stroke="#5eead4" stroke-width="1.5"/><text x="184.0" y="48.0" font-size="11.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="start" data-max="542"><tspan x="184.0" dy="0">Violencia contra niños · maltrato psicológico</tspan></text><rect x="464.3" y="32.0" width="124.2" height="24.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="526.4" y="48.0" font-size="10" font-weight="700" font-style="normal" fill="#99f6e4" text-anchor="middle" data-max="108"><tspan x="526.4" dy="0">PSIQUIATRÍA ENAM</tspan></text><rect x="40.0" y="90.0" width="560.0" height="151.0" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="56.0" y="102.0" width="101.2" height="18.0" rx="9" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1"/><text x="64.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="start" data-max="0"><tspan x="64.0" dy="0">TEMA GENERAL</tspan></text><text x="58.0" y="144.0" font-size="15" font-weight="800" font-style="normal" fill="#134e4a" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Maltrato psicológico</tspan></text><text x="58.0" y="168.0" font-size="12" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="524"><tspan x="58.0" dy="0">Humillar, insultar, culpar, amenazar o rechazar de forma reiterada es violencia contra el</tspan><tspan x="58.0" dy="17">niño.</tspan><tspan x="58.0" dy="17">El personal de salud está obligado a comunicarlo (Ley 30364, Código de los Niños y</tspan><tspan x="58.0" dy="17">Adolescentes).</tspan></text><rect x="620.0" y="90.0" width="340.0" height="151.0" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="621.0" y="91.0" width="6.0" height="149.0" rx="3" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="640.0" y="115.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="0"><tspan x="640.0" dy="0">CASO CLÍNICO</tspan></text><text x="640.0" y="138.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Niño de 8 años</tspan></text><text x="640.0" y="159.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="304"><tspan x="640.0" dy="0">Traído por su tía por cefalea; facies triste.</tspan><tspan x="640.0" dy="16">La madre se fue hace un año; el padre lo culpa, humilla</tspan><tspan x="640.0" dy="16">e insulta.</tspan></text><rect x="640.0" y="212.0" width="30.0" height="18.0" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="655.0" y="225.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="655.0" dy="0">◆</tspan></text><text x="678.0" y="225.0" font-size="10.5" font-weight="700" font-style="normal" fill="#0f766e" text-anchor="start" data-max="260"><tspan x="678.0" dy="0">Marca dónde cae este caso</tspan></text><text x="40.0" y="273.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">QUÉ HACER ANTE EL MALTRATO INFANTIL</tspan></text><rect x="40.0" y="285.0" width="602.0" height="57.0" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2.2"/><text x="60.0" y="318.5" font-size="14" font-weight="800" font-style="normal" fill="#ea580c" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">1</tspan></text><rect x="78.0" y="302.5" width="22.0" height="22.0" rx="5" fill="#ea580c" stroke="none" stroke-width="1.5"/><text x="89.0" y="318.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="89.0" dy="0">✓</tspan></text><text x="114.0" y="310.0" font-size="12.5" font-weight="800" font-style="normal" fill="#9a3412" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Informar a la autoridad competente</tspan></text><text x="114.0" y="327.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Policía, Fiscalía, DEMUNA o CEM</tspan></text><rect x="533.8" y="274.0" width="103.5" height="22.0" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="585.6" y="289.0" font-size="10" font-weight="800" font-style="normal" fill="#b45309" text-anchor="middle" data-max="0"><tspan x="585.6" dy="0">◆ OBLIGATORIO</tspan></text><rect x="40.0" y="350.0" width="602.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="60.0" y="383.5" font-size="14" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">2</tspan></text><rect x="78.0" y="367.5" width="22.0" height="22.0" rx="5" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="89.0" y="383.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="89.0" dy="0">✓</tspan></text><text x="114.0" y="375.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Atender y registrar</tspan></text><text x="114.0" y="392.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Historia clínica detallada</tspan></text><rect x="40.0" y="415.0" width="602.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="60.0" y="448.5" font-size="14" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">3</tspan></text><rect x="78.0" y="432.5" width="22.0" height="22.0" rx="5" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="89.0" y="448.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="89.0" dy="0">✓</tspan></text><text x="114.0" y="440.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Psicología y servicio social</tspan></text><text x="114.0" y="457.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Apoyo al niño</tspan></text><rect x="40.0" y="480.0" width="602.0" height="57.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/><text x="60.0" y="513.5" font-size="14" font-weight="800" font-style="normal" fill="#0f766e" text-anchor="middle" data-max="0"><tspan x="60.0" dy="0">4</tspan></text><rect x="78.0" y="497.5" width="22.0" height="22.0" rx="5" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="89.0" y="513.5" font-size="13" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="0"><tspan x="89.0" dy="0">✓</tspan></text><text x="114.0" y="505.0" font-size="12.5" font-weight="800" font-style="normal" fill="#0f172a" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Plan de protección</tspan></text><text x="114.0" y="522.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="start" data-max="512"><tspan x="114.0" dy="0">Familiar de confianza</tspan></text><rect x="660.0" y="285.0" width="300.0" height="252.0" rx="12" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/><text x="676.0" y="311.0" font-size="11.5" font-weight="800" font-style="normal" fill="#991b1b" text-anchor="start" data-max="268"><tspan x="676.0" dy="0">NO HACER</tspan></text><text x="682.0" y="365.5" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="0"><tspan x="682.0" dy="0">✕</tspan></text><text x="700.0" y="365.5" font-size="12" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="start" data-max="244"><tspan x="700.0" dy="0">Confrontar al padre</tspan></text><text x="700.0" y="382.5" font-size="11" font-weight="400" font-style="normal" fill="#7f1d1d" text-anchor="start" data-max="244"><tspan x="700.0" dy="0">Aumenta el riesgo</tspan></text><text x="682.0" y="414.5" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="0"><tspan x="682.0" dy="0">✕</tspan></text><text x="700.0" y="414.5" font-size="12" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="start" data-max="244"><tspan x="700.0" dy="0">Dar de alta sin intervenir</tspan></text><text x="700.0" y="431.5" font-size="11" font-weight="400" font-style="normal" fill="#7f1d1d" text-anchor="start" data-max="244"><tspan x="700.0" dy="0">Deja al niño expuesto</tspan></text><text x="682.0" y="463.5" font-size="13" font-weight="800" font-style="normal" fill="#dc2626" text-anchor="middle" data-max="0"><tspan x="682.0" dy="0">✕</tspan></text><text x="700.0" y="463.5" font-size="12" font-weight="800" font-style="normal" fill="#7f1d1d" text-anchor="start" data-max="244"><tspan x="700.0" dy="0">Solo derivar sin denunciar</tspan></text><text x="700.0" y="480.5" font-size="11" font-weight="400" font-style="normal" fill="#7f1d1d" text-anchor="start" data-max="244"><tspan x="700.0" dy="0">La comunicación es obligatoria</tspan></text><rect x="40.0" y="555.0" width="920.0" height="72.0" rx="12" fill="#134e4a" stroke="none" stroke-width="1.5"/><text x="60.0" y="581.0" font-size="13.5" font-weight="800" font-style="normal" fill="#ffffff" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Comunicar a la autoridad</tspan></text><text x="60.0" y="600.0" font-size="12" font-weight="500" font-style="normal" fill="#ccfbf1" text-anchor="start" data-max="880"><tspan x="60.0" dy="0">Además de atender y dar apoyo psicológico.</tspan></text><text x="40.0" y="667.0" font-size="11.5" font-weight="800" font-style="normal" fill="#64748b" text-anchor="start" data-max="900"><tspan x="40.0" dy="0">OPCIONES DE LA PREGUNTA</tspan></text><rect x="40.0" y="677.0" width="920.0" height="71.0" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="125.0" y="716.5" font-size="11" font-weight="800" font-style="normal" fill="#64748b" text-anchor="middle" data-max="154"><tspan x="125.0" dy="0">Criterio</tspan></text><rect x="213.0" y="680.0" width="144.0" height="65.0" rx="8" fill="#0f766e" stroke="none" stroke-width="1.5"/><text x="285.0" y="699.5" font-size="12.5" font-weight="700" font-style="normal" fill="#ffffff" text-anchor="middle" data-max="130"><tspan x="285.0" dy="0">Informar a la</tspan><tspan x="285.0" dy="17">autoridad</tspan><tspan x="285.0" dy="17">competente</tspan></text><text x="435.0" y="716.5" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="435.0" dy="0">Hablar con el padre</tspan></text><text x="585.0" y="708.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="585.0" dy="0">Hablar con la</tspan><tspan x="585.0" dy="17">asistenta social</tspan></text><text x="735.0" y="708.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="735.0" dy="0">Interconsulta a</tspan><tspan x="735.0" dy="17">psicología</tspan></text><text x="885.0" y="708.0" font-size="12.5" font-weight="700" font-style="normal" fill="#0f172a" text-anchor="middle" data-max="130"><tspan x="885.0" dy="0">Dar de alta sin</tspan><tspan x="885.0" dy="17">intervención</tspan></text><rect x="40.0" y="748.0" width="920.0" height="50.0" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/><rect x="213.0" y="748.0" width="144.0" height="50.0" rx="0" fill="#f0fdfa" stroke="none" stroke-width="1.5"/><text x="54.0" y="777.0" font-size="11.5" font-weight="700" font-style="normal" fill="#334155" text-anchor="start" data-max="146"><tspan x="54.0" dy="0">¿Conducta?</tspan></text><text x="285.0" y="777.0" font-size="11.5" font-weight="600" font-style="normal" fill="#134e4a" text-anchor="middle" data-max="128"><tspan x="285.0" dy="0">Sí: obligación legal</tspan></text><text x="435.0" y="769.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="435.0" dy="0">Puede empeorar el</tspan><tspan x="435.0" dy="16">riesgo</tspan></text><text x="585.0" y="769.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="585.0" dy="0">Complementa, no</tspan><tspan x="585.0" dy="16">reemplaza</tspan></text><text x="735.0" y="769.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="735.0" dy="0">Complementa, no</tspan><tspan x="735.0" dy="16">reemplaza</tspan></text><text x="885.0" y="769.0" font-size="11.5" font-weight="400" font-style="normal" fill="#475569" text-anchor="middle" data-max="128"><tspan x="885.0" dy="0">No: deja al niño</tspan><tspan x="885.0" dy="16">desprotegido</tspan></text><rect x="40.0" y="677.0" width="920.0" height="121.0" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40.0" y="822.0" width="920.0" height="131.0" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/><text x="58.0" y="850.0" font-size="12" font-weight="800" font-style="normal" fill="#b45309" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">PUNTOS CLAVE ENAM:</tspan></text><text x="58.0" y="872.0" font-size="12" font-weight="500" font-style="normal" fill="#92400e" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">• Atender la salud y registrar en la historia.</tspan><tspan x="58.0" dy="18">• Comunicar a la autoridad: Policía, Fiscalía de Familia, DEMUNA o Centro Emergencia Mujer.</tspan><tspan x="58.0" dy="18">• Apoyo psicológico y social; plan de protección (la tía puede ser figura protectora).</tspan></text><text x="58.0" y="930.0" font-size="10.5" font-weight="400" font-style="italic" fill="#a16207" text-anchor="start" data-max="884"><tspan x="58.0" dy="0">Fuente: Ley n.º 30364; Código de los Niños y Adolescentes; MINSA Perú, guía de atención de la violencia.</tspan></text></svg>